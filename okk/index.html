от кодови комбинации xₙ, xₙ₋₁, …, x₁; всяка комбинация xᵢ е съчетание от **елементарни символи**, изразяващи буква, цифра или знак.\n- **Дължина на кодовата комбинация** — броят на елементарните символи в нея.\n- **Кодова дума** — последователността от символи, която при кодирането се **присвоява на всяко множество предадени съобщения**.\n- **Символ (разряд на кода)** — двоичната цифра **0 или 1**.\n- **Единичен интервал t₀** — продължителността на един символ.\n- В компютърните комуникации (дискретни съобщения) основно се използват **двоичните кодове**.\n\n### Класификация на кодовете\n| Признак | Видове |\n|---|---|\n| Шумоустойчивост | **прости** / **коригиращи** |\n| Дължина на комбинациите | **равномерни** / **неравномерни** |\n| Структура | **блокови** / **непрекъснати** |\n| Блокови | **разделими** / **неразделими** |\n| Разделими | **систематични** / **несистематични** |\n\n- **Прости (нешумоустойчиви)** — **без информационен излишък**; комбинациите се различават **само по 1 разред** → при грешка се получава **валидна** комбинация и грешката **не може да се открие**.\n- **Коригиращи (шумоустойчиви)** — използваните комбинации се различават с **≥ 2 разреда** и съществуват **забранени** комбинации; поява на забранена комбинация = **грешка**.\n- **Неразделими** блокови — малко на брой, напр. **телеграфен код с постоянно тегло**.\n- **Разделими — (n, k) кодове**: **n** — общ брой разреди, **k** — информационни разреди, **n − k** — контролни; всички комбинации **2ⁿ**, разрешени **2ᵏ**; **излишък на кода = (n − k)/n**.\n  - **Систематични** — контролните разреди са **сума по модул 2** от информационните: **код на Хеминг, циклични кодове, кодове с проверка по четност/нечетност, код с повторение, корелационен, инверсен, кодове на Голей, Рид–Малер, Макдоналд, Варшамов, интерактивен код**.\n  - **Несистематични** — **не се ползват**.\n\n### Кодово разстояние\n- **Кодово разстояние d** — **минималният брой позиции**, в които символите на една комбинация се отличават от символите на друга. **Прости кодове: d = 1**; **коригиращи: d > 1**.\n- **Хемингово разстояние d₀** — **най-малкото** от кодовите разстояния в даден код. В повечето кодове (Хеминг, циклични) **d = d₀**.\n- Пример: **10101** и **11111** → различават се в 2 позиции → **d = 2**.\n\n### Откриване и изправяне на грешки\n- Откриване на **σ** грешки: **d₀ ≥ σ + 1**.\n- Коригиране на **t** грешки: **d₀ ≥ 2t + 1**.\n- Едновременно откриване и коригиране: **d₀ = σ + t + 1**.\n- **Кратност на откриване σ** — относителният брой забранени комбинации между две разрешени; **1 ≤ σ ≤ d − 1**.\n- **Кратност на поправяне t** — множеството забранени комбинации, принадлежащи към дадена разрешена.\n\n| d | σ | t | Коригираща възможност |\n|---|---|---|---|\n| 1 | 0 | 0 | само различава една комбинация от друга |\n| 2 | 1 | 0 | открива еднократни грешки |\n| 3 | 1 | 1 | открива и коригира еднократни |\n| 4 | 2 | 1 | открива двукратни и коригира еднократни |\n| 4 | 3 | 0 | открива трикратни |\n| 5 | 2 | 2 | открива и коригира двукратни |\n| 5 | 3 | 1 | открива трикратни и коригира еднократни |\n| 5 | 4 | 0 | открива четирикратни |\n\n### Характеристики на кода\n- **Дължина n** — брой разряди в кодовата комбинация.\n- **Основа m** — брой различаващи се **импулсни признаци** за означаване на разрядите (двоичен код: **m = 2**, символи 0 и 1).\n- **Мощност Nₚ** — брой **разрешени** (работни) кодови комбинации; само по информационните символи **Nₚ = mᵏ**.\n- **Пълен брой комбинации N = mⁿ** (напр. двоичен код с n = 5 → 32).\n- **k** — брой информационни символи.\n- **Скорост на предаване на кодовите комбинации R = k/n** (информационни разреди / дължина).\n- **Тегло w** — **броят на единиците** в комбинацията (напр. 0110111 → w = 5).\n- **Теглова характеристика W(w)** — броят на комбинациите с тегло w.\n- **Коефициент на откриване и изправяне L = A/(A + B)**: A — комбинации, в които грешката се открива/поправя; B — в които не се открива и поправя.\n- **Коефициент на откриване Lоткр** — на слайда **(1 − Nₚ)/N** (вж. капаните).\n- **Вероятност за неоткриване Pнг** — приетата комбинация се различава от предадената, но кодът **не може да открие** грешката.\n- **Оптималност** — **най-малка вероятност за неоткриване** на грешки сред всички кодове със **същата дължина n и излишък (n − k)**.\n\n### Баланс скорост / надеждност\n- Двете изисквания **взаимно се изключват**: за **по-висока скорост** излишъкът трябва да се **намали**, за **по-висока надеждност** — да се **увеличи**.\n- **Оптимален код без излишък** — кодовите думи имат **минимална средна дължина**, излишъкът е сведен до минимум (такива са **Шенон–Фано** и **Хафмън**).\n\n### Код по четност\n- Разрядите се делят на групи; във всяка група **броят на единиците се допълва до четно число**.\n- **Недостатък**: **не открива грешки с четна кратност**. Прилага се, където са по-вероятни **единичните** грешки.\n- Пример: **0111110** (5 единици) → **01111101**.\n\n### Матричен код по четност\n- Идея: ако възникне грешка, с голяма вероятност **около нея има още** (групови грешки). Групите се записват в **матрица** и се проверяват по четност **стълбовете**.\n- Групова грешка с дължина **по-малка от q** → във всяка проверка попада не повече от един грешен символ.\n- **Не се откриват** грешки, ако в стълба са изкривени **четен брой** разреди.\n- При **независими** грешки кодът е еквивалентен на проверка по четност в **редовете**; при **корелирани** — по-устойчив благодарение на **декорелацията**.\n- **Декорелация** — проверката се прави **по диагоналите** на матрицата.\n- По-висока откриваща способност: проверка едновременно **по стълбове и диагонали** или **по редове и стълбове**.\n- **Недостатък**: сложност на кодиращите и декодиращите устройства. Широко приложение в апаратурата за предаване на цифрови данни.\n\n### Код с постоянно тегло\n- **Двоичен равномерен** код, в който всички разрешени комбинации имат **еднакъв брой единици**.\n- Открива всички грешки **освен** когато еднакъв брой единици стават нули и същият брой нули — единици.\n- 0 или 1 се кодира с **два импулса с противоположна полярност**; грешка = лъжлив или загубен импулс; не се открива, ако **и двата импулса** на един разряд са изкривени.\n- **Предимство**: при **асиметричните канали**. **Недостатък**: няма разделение на контролни/информационни разряди → **много сложни кодопреобразуватели**.\n- Видове: **„2 от 5\", „3 от 6\", „3 от 7\", „3 от 8\", „4 от 8\"**. При „3 от 7\" комбинациите са **C(7,3) = 35**.\n\n### Код на Шенон–Фано (неравномерен, оптимален)\n1. Символите се подреждат по **намаляваща вероятност** P(xᵢ).\n2. Групата се дели на **две подгрупи с възможно равни сумарни вероятности**.\n3. На първата подгрупа се присвоява **0**, на втората **1** (или обратно) → **старшите** цифри.\n4. Стъпки 2–3 се повтарят, докато във всяка подгрупа остане **по един символ**.\n\n| xᵢ | x1 | x2 | x3 | x4 | x5 | x6 | x7 | x8 | x9 |\n|---|---|---|---|---|---|---|---|---|---|\n| P | 0,35 | 0,15 | 0,13 | 0,09 | 0,09 | 0,08 | 0,05 | 0,04 | 0,02 |\n| Шенон–Фано | 11 | 10 | 011 | 010 | 0011 | 0010 | 0001 | 00001 | 00000 |\n| Хафмън | 11 | 101 | 100 | 010 | 001 | 000 | 0110 | 01111 | 01110 |\n\n- Първото деление: **{x1, x2} = 0,50** срещу останалите **0,50**. Средна дължина ≈ **2,84** бита (Шенон–Фано) и ≈ **2,82** (Хафмън).\n\n### Код на Хафмън\n1. Символите се подреждат по **намаляваща вероятност**.\n2. На всяка стъпка се добавя възел в **префиксното кодово дърво**.\n3. **Двата символа с най-малки вероятности се обединяват**; **по-горният** в таблицата получава **1**, **по-долният — 0** (в дървото: **ляво — 1, дясно — 0**).\n4. Вероятностите им се **събират** и се записват в нова колона, отново **в низходящ ред**.\n5. Повтаря се, докато останат **2 стойности със сбор 1**.\n- В примера (7 обединявания): 0,02+0,04 = 0,06; 0,05+0,06 = 0,11; … последна колона **0,63 и 0,37**.\n\n### Код на Хеминг\n- **Коригиращ групов (n, k) код**; матрицата на проверките M(n, k) има **r = n − k реда** и **2ʳ − 1 стълба**; всички r-разрядни последователности са ненулеви.\n- Информационните и контролните разряди са **разделени** и мястото им е известно.\n- **d₀ = 3** → **открива двойни** грешки и **изправя всички единични**.\n- **Коригиращото число** (r разряда) указва **номера на изкривения елемент**; условие: **r > log₂(n + 1)** (т.е. 2ʳ ≥ n + 1).\n- **Контролните разряди** се поставят на позиции **1, 2, 4, 8, …** (степени на 2) и се формират **в предавателя**:\n  - b1 = a1 = a3⊕a5⊕a7⊕a9⊕a11⊕… (нечетните позиции)\n  - b2 = a2 = a3⊕a6⊕a7⊕a10⊕a11⊕…\n  - b3 = a4 = a5⊕a6⊕a7⊕a12⊕a13⊕…\n  - b4 = a8 = a9⊕a10⊕a11⊕a12⊕…\n- Подредба: a1 a2 a3 a4 a5 a6 a7 a8 a9 a10 … = **b1 b2 x1 b3 x2 x3 x4 b4 x5 x6 …**\n- **Коригиращото число r = Eᵣ…E₂E₁** се изчислява **в приемника**; всеки контролен елемент участва **само в една проверка** (a1 — само в E1, a2 — само в E2, a4 — само в E3…). Ако r ≠ 0 — разрядът с номер r се **инвертира**.\n\n**Пример:** седемелементен код (**k = 7**) → 2ⁿ⁻⁷ > n + 1 → **n = 11, r = 4**.\n- Съобщение **1011010** → предава се **00100111010** (b1 = 0, b2 = 0, b3 = 0, b4 = 1).\n- Приема се **00100111110** → E1 = 1, E2 = 0, E3 = 0, E4 = 1 → **r = 1001₂ = 9** → сгрешен е **9-ият** разряд.\n\n### Циклични кодове\n- **Цикличен (n, k) код** — множеството кодови комбинации е съвкупност от многочлени от степен **n − 1 и по-малка**, които **се делят на образуващия многочлен P(x) от степен n − k**.\n- Висока ефективност при откриване/коригиране; **сравнително проста апаратна реализация**.\n- Комбинацията се представя като **F(x) = Cₙ₋₁xⁿ⁻¹ + … + C₁x + C₀**, Cᵢ ∈ {0, 1}. **x·F(x)** (с xⁿ ≡ x⁰) е **циклично преместена** комбинация.\n- **F(x) = G(x)·P(x)** — **недостатък**: няма строго разделяне на информационни и контролни елементи → по-сложно декодиране.\n- **Систематичен вариант**: G(x) се умножава по **xʳ** → **xʳ·G(x) = Q(x)·P(x) + R(x)**; тъй като събиране и изваждане по модул 2 съвпадат: **F(x) = xʳ·G(x) + R(x) = Q(x)·P(x)**. Старшите коефициенти са информационните, **остатъкът R(x)** — **контролните**.\n- **Проверка**: приетото H(x) **не се дели** на P(x) → **има грешка**; дели се → няма.\n\n**Пример:** k = 12, **P(x) = x⁵ + x⁴ + x² + 1** (r = 5), комбинация **010001011001** → G(x) = x¹⁰ + x⁶ + x⁴ + x³ + 1; Q(x) = x¹⁰ + x⁹ + x⁸ + 1, **R(x) = x⁴ + x² + 1** → контролни **10101**; предава се **010001011001 10101**. Приема се 01000111100110101 → разликата F(x) − H(x) = **x¹⁰** (сгрешен е членът при x¹⁰).\n\n### Свойства на цикличните кодове\n- P(x) с **повече от един член** → открива **всички единични** грешки.\n- **P(x) = x + 1** → открива **произволен нечетен брой** грешки.\n- **P(x) = (x + 1)·Pᵣ(x)** → открива **всички единични, двойни и тройни** грешки, ако **2ʳ − 1 ≥ n** (Pᵣ — неделим многочлен от степен r).\n- Образуващ многочлен **от степен r** → открива **всеки пакет грешки с дължина r и по-малка**.\n- За всички j и t съществува цикличен код с **n = 2ʲ − 1**, изправящ всички грешки с кратност ≤ t, с **не повече от r = j·t** контролни елемента.\n\n### Приложение (CRC)\n| Полином | Код | Приложение |\n|---|---|---|\n| **x⁸ + x² + x + 1** | **ITU CRC-8** | **ATM** (контрол на заглавната част на клетките), **IEEE 802.6** (регионални мрежи) |\n| **x¹⁶ + x¹² + x⁵ + 1** | **ITU CRC-16** | **HDLC**, семейство **LAP** (LAPB, LAPD, LAPF) |\n| **x³² + x²⁶ + x²³ + x¹⁶ + x¹² + x¹¹ + x¹⁰ + x⁸ + x⁷ + x⁵ + x⁴ + x² + x + 1** | **ITU CRC-32** | **IEEE 802.3** (стандартни локални мрежи) |\n- CRC-16 открива грешки в пакети с дължина **16 бита**; последният член (1) генерира **проверка по четност**; открива пакетни грешки с нечетност и грешки с **четна кратност до 16**.\n\n### Капани за изпита\n- **Кодиране** = съобщения → сигнали; **код** = алгоритъмът/системата на съответствие. Не ги разменяй.\n- **d₀ ≥ σ + 1** (откриване) vs **d₀ ≥ 2t + 1** (коригиране) vs **d₀ = σ + t + 1** (и двете).\n- **R = k/n** е скорост; **(n − k)/n** е излишък. **Nₚ = mᵏ** (разрешени) vs **N = mⁿ** (всички); разрешени **2ᵏ**, всички **2ⁿ**.\n- **Тегло w** = брой **единици** (не брой разреди).\n- **Хеминг: d₀ = 3** → открива **двойни**, коригира **единични**. Контролни битове на позиции **1, 2, 4, 8** — не в края. Контролните се формират **в предавателя**, коригиращото число — **в приемника**.\n- Слайдът пише **r > log₂(n + 1)**; класическото условие е **2ʳ ≥ n + 1**. В примера: n = 11, r = 4 (4 > log₂12 ≈ 3,58).\n- **Грешка в слайда**: в израза за b3/E3 са изброени a10 и a11, но третата проверка обхваща позиции **4–7, 12–15, 20–23…** (в двоичния номер е вдигнат бит 2); a10 и a11 участват в E2 и E4. В примера правилно е използвано b3 = a5⊕a6⊕a7.\n- **Lоткр = (1 − Nₚ)/N** на слайда е вероятно печатна грешка; смислено е **1 − Nₚ/N** (делът на забранените комбинации).\n- **Шенон–Фано** — **деление** на две подгрупи с равни сумарни вероятности (кодът се строи от старшите цифри). **Хафмън** — **обединяване** на двата най-малко вероятни символа (дърво „отдолу нагоре\"); по-горният получава **1**, по-долният **0**.\n- В примера x2 (0,15) има дума с **2** бита при Шенон–Фано (10), но **3** бита при Хафмън (101).\n- **Код по четност** не открива **четен** брой грешки; **P(x) = x + 1** открива **нечетен** брой грешки.\n- **Матричен код**: декорелация — по **диагоналите**; не открива четен брой грешки в **стълба**.\n- **Код с постоянно тегло** е **неразделим** (не е систематичен); предимство — **асиметрични канали**.\n- **CRC-8 → ATM, IEEE 802.6; CRC-16 → HDLC, LAP; CRC-32 → IEEE 802.3.** Не бъркай 802.6 (регионални) с 802.3 (Ethernet).\n- В стандартите грешките само се **откриват** (циклични кодове) — не се коригират; следва **отрицателна квитанция** и повторно предаване.\n- Вероятност за грешка: от **10⁻¹ до 10⁻²⁴** за **под 10 години**.\n- **Несистематичните** кодове „не се ползват\".\n- Полиномът на CRC-32 на слайда съдържа **x¹⁶**, а в стандартния IEEE 802.3 полином има и член **x²²** — на изпита разпознавай го по **степен 32** и приложението **IEEE 802.3**.\n- В примера за цикличен код разликата F(x) − H(x) = **x¹⁰** показва мястото на грешката; самото откриване става, защото **H(x) не се дели на P(x)**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L04-A-1","n":1,"text":"Какво е кодиране на информацията?","opts":["Процес на преобразуване на сигналите обратно в съобщения","Процес на модулиране на носещо колебание с данните","Процес на премахване на шума от приетия сигнал","Процес на преобразуване на съобщенията в сигнали"],"correct":3,"expl":"Кодирането преобразува съобщенията в сигнали; обратното е декодиране."},{"id":"L04-A-2","n":2,"text":"Какво е кодовото разстояние между комбинациите 10101 и 11111?","opts":["2","1","3","5"],"correct":0,"expl":"Комбинациите се различават във 2-ра и 4-та позиция → d = 2."},{"id":"L04-A-3","n":3,"text":"Кое условие определя броя на откриваните грешки σ при хемингово разстояние d₀?","opts":["d₀ ≥ 2σ + 1","d₀ ≥ σ + 1","d₀ = σ + t + 1","d₀ ≤ σ − 1"],"correct":1,"expl":"За откриване на σ грешки е нужно d₀ ≥ σ + 1; d₀ ≥ 2t + 1 е условието за коригиране."},{"id":"L04-A-4","n":4,"text":"С кой израз се определя скоростта на предаване на кодовите комбинации R?","opts":["R = k/n","R = (n − k)/n","R = n/k","R = 2ᵏ/2ⁿ"],"correct":0,"expl":"R е отношението на информационните разреди към дължината на кода; (n − k)/n е излишъкът."},{"id":"L04-A-5","n":5,"text":"Кой е основният недостатък на кода с проверка по четност?","opts":["Не открива единичните грешки","Изисква много сложни кодопреобразуватели","Не открива грешки с четна кратност","Не може да се приложи за двоични кодове"],"correct":2,"expl":"При четен брой изкривени разреди четността се запазва и грешката остава незабелязана."},{"id":"L04-A-6","n":6,"text":"Какво се прави на всяка стъпка при построяване на кода на Шенон–Фано?","opts":["Групата се разделя на две подгрупи с възможно равни сумарни вероятности","Обединяват се двата символа с най-малки вероятности","Символите се подреждат по нарастваща дължина на кодовите думи","На всеки символ се добавя бит за проверка по четност"],"correct":0,"expl":"Шенон–Фано дели; обединяването на двата най-малко вероятни символа е стъпка от кода на Хафмън."},{"id":"L04-A-7","n":7,"text":"Какво е хеминговото разстояние d₀ на кода на Хеминг?","opts":["1","2","4","3"],"correct":3,"expl":"За кода на Хеминг d₀ = 3 — изправя единични и открива двойни грешки."},{"id":"L04-A-8","n":8,"text":"На кои позиции в кодовата комбинация се разполагат контролните разряди при кода на Хеминг?","opts":["1, 3, 5, 7, …","1, 2, 4, 8, …","Последните r позиции","Първите r позиции"],"correct":1,"expl":"Контролните разряди заемат позициите, равни на степени на 2."},{"id":"L04-A-9","n":9,"text":"Кой образуващ полином се използва в ITU CRC-16 и в протокола HDLC?","opts":["x⁸ + x² + x + 1","x¹⁶ + x¹² + x⁵ + 1","x⁵ + x⁴ + x² + 1","x¹⁶ + x⁸ + x² + 1"],"correct":1,"expl":"CRC-16 (HDLC, LAPB, LAPD, LAPF) използва x¹⁶ + x¹² + x⁵ + 1; x⁸ + x² + x + 1 е CRC-8."},{"id":"L04-A-10","n":10,"text":"Как се открива грешка в прието съобщение H(x), кодирано с цикличен код?","opts":["H(x) се дели без остатък на образуващия многочлен P(x)","Теглото на H(x) се различава от това на G(x)","H(x) не се дели без остатък на образуващия многочлен P(x)","Степента на H(x) е по-малка от n − 1"],"correct":2,"expl":"Ако H(x) се дели на P(x) — няма грешка; ако не се дели — има грешка."}],"B":[{"id":"L04-B-1","n":1,"text":"Как се дефинира код?","opts":["Алгоритъмът, по който съобщенията се превръщат в комбинация от различни сигнали","Процесът на обратно преобразуване на сигналите в съобщения в приемащото устройство","Броят на разрядите, съставляващи една кодова комбинация","Съвкупността от всички забранени кодови комбинации, сигнализиращи за грешка"],"correct":0,"expl":"Кодът е алгоритъм — система за пълно и точно съответствие между съобщенията и сигналите."},{"id":"L04-B-2","n":2,"text":"Как се е променила вероятността за грешки в каналите на компютърните мрежи за по-малко от 10 години?","opts":["От 1·10⁻⁴ до 1·10⁻¹²","От 1·10⁻² до 1·10⁻⁸","От 1·10⁻⁶ до 1·10⁻³²","От 1·10⁻¹ до 1·10⁻²⁴"],"correct":3,"expl":"Благодарение на микроелектрониката вероятността спада от 10⁻¹ до 10⁻²⁴."},{"id":"L04-B-3","n":3,"text":"Какво прави приемащото устройство, когато открие грешка в получен фрагмент?","opts":["Коригира фрагмента с код на Хеминг и го приема без повторно предаване","Приема фрагмента, маркира грешния разряд и изпраща положителна квитанция","Унищожава фрагмента и връща отрицателна квитанция за повторно предаване","Прекратява връзката незабавно, без да изисква повторно предаване"],"correct":2,"expl":"Стандартите само откриват грешки; изкривените фрагменти се предават отново."},{"id":"L04-B-4","n":4,"text":"Кое твърдение е вярно за простите (нешумоустойчиви) кодове?","opts":["Разрешените им комбинации се различават помежду си с поне 2 разреда","Притежават забранени комбинации, сигнализиращи за грешка","При грешка се получава валидна комбинация и грешката не може да се открие","Контролните им разреди се получават като сума по модул 2 от информационните"],"correct":2,"expl":"Простите кодове нямат излишък и комбинациите им се различават само по 1 разред (d = 1)."},{"id":"L04-B-5","n":5,"text":"Колко са разрешените кодови комбинации на двоичен разделим (n, k) код?","opts":["2ⁿ","2ⁿ⁻ᵏ","n − k","2ᵏ"],"correct":3,"expl":"Всички комбинации са 2ⁿ, разрешените — 2ᵏ."},{"id":"L04-B-6","n":6,"text":"Каква е коригиращата възможност на код с d = 4, σ = 2, t = 1?","opts":["Открива и коригира двукратни грешки","Открива трикратни грешки, без да коригира","Открива двукратни и коригира еднократни грешки","Открива трикратни и коригира еднократни грешки"],"correct":2,"expl":"d₀ = σ + t + 1 = 2 + 1 + 1 = 4."},{"id":"L04-B-7","n":7,"text":"Какво е теглото w на кодовата комбинация 0110111?","opts":["5","2","3","7"],"correct":0,"expl":"Теглото е броят на единиците в комбинацията — тук 5."},{"id":"L04-B-8","n":8,"text":"Колко комбинации съдържа кодът с постоянно тегло „3 от 7“?","opts":["21","35","7","128"],"correct":1,"expl":"Комбинациите с 3 единици и 4 нули са C(7,3) = 35."},{"id":"L04-B-9","n":9,"text":"В примера от лекцията (P(x1) = 0,35, P(x2) = 0,15, …) колко бита е кодовата дума на x2 при кода на Хафмън?","opts":["2","4","5","3"],"correct":3,"expl":"При Хафмън x2 = 101 (3 бита), докато при Шенон–Фано x2 = 10 (2 бита)."},{"id":"L04-B-10","n":10,"text":"Какви грешки открива цикличен код с образуващ многочлен P(x) = x + 1?","opts":["Всички единични, двойни и тройни грешки","Единични грешки и произволен нечетен брой грешки","Всички пакети грешки с дължина до 16 бита","Само грешки с четна кратност"],"correct":1,"expl":"P(x) = x + 1 действа като проверка по четност — открива всеки нечетен брой грешки."}],"C":[{"id":"L04-C-1","n":1,"text":"Как се нарича продължителността на един символ (разряд) на кода?","opts":["Кодово разстояние d","Единичен интервал t₀","Дължина на кода n","Основа на кода m"],"correct":1,"expl":"Продължителността на един символ е единичният интервал t₀."},{"id":"L04-C-2","n":2,"text":"Кой от изброените кодове НЕ е от групата на разделимите систематични кодове?","opts":["Код на Голей","Инверсен код","Код на Рид–Малер","Код с постоянно тегло"],"correct":3,"expl":"Кодът с постоянно тегло (напр. телеграфният) е неразделим блоков код."},{"id":"L04-C-3","n":3,"text":"Какво е хемингово разстояние d₀?","opts":["Най-голямото от кодовите разстояния в даден код","Броят на единиците в кодовата комбинация","Най-малкото от кодовите разстояния в даден код","Броят на контролните разреди в кода"],"correct":2,"expl":"d₀ е минималното кодово разстояние; при Хеминг и цикличните кодове d = d₀."},{"id":"L04-C-4","n":4,"text":"Какво е минималното хемингово разстояние, необходимо за коригиране на двукратни грешки?","opts":["5","3","4","6"],"correct":0,"expl":"d₀ ≥ 2t + 1 = 2·2 + 1 = 5."},{"id":"L04-C-5","n":5,"text":"С кой израз се определя мощността на кода Nₚ, отчитайки само информационните символи?","opts":["Nₚ = mⁿ","Nₚ = k/n","Nₚ = mᵏ","Nₚ = (n − k)/n"],"correct":2,"expl":"Мощността (разрешените комбинации) е mᵏ; mⁿ е пълният брой комбинации N."},{"id":"L04-C-6","n":6,"text":"Защо изискванията за висока скорост и висока надеждност на кода взаимно се изключват?","opts":["Скоростта изисква по-голям излишък, а надеждността — по-малък","И двете изискват увеличаване на основата m на кода","Надеждността изисква намаляване на кодовото разстояние","Скоростта изисква по-малък излишък, а надеждността — по-голям"],"correct":3,"expl":"За по-висока скорост излишъкът се намалява, за по-висока надеждност — увеличава."},{"id":"L04-C-7","n":7,"text":"Как се постига декорелация на грешките при матричния код по четност?","opts":["Чрез проверка по четност само по редовете","Чрез проверка по четност по диагоналите на матрицата","Чрез повторно предаване на всяка група","Чрез инвертиране на четните стълбове"],"correct":1,"expl":"Декорелацията се извършва, когато проверката по четност е по диагоналите."},{"id":"L04-C-8","n":8,"text":"В примера за код на Шенон–Фано първата подгрупа съдържа само x1 (0,35) и x2 (0,15). Защо?","opts":["Това са символите с най-малки вероятности","Те получават най-дългите кодови думи","Сумата им 0,50 е равна на сумата на останалите символи","Първите два символа винаги образуват отделна група"],"correct":2,"expl":"Групата се дели така, че сумарните вероятности на подгрупите да са възможно равни: 0,50 и 0,50."},{"id":"L04-C-9","n":9,"text":"Седемелементен прост код (k = 7) се преобразува в код на Хеминг. Колко контролни разряда са необходими?","opts":["4","3","5","7"],"correct":0,"expl":"От 2ⁿ⁻⁷ > n + 1 следва n = 11, следователно r = n − k = 4."},{"id":"L04-C-10","n":10,"text":"В кой стандарт се прилага цикличният код ITU CRC-32?","opts":["IEEE 802.3","IEEE 802.6","ATM","HDLC"],"correct":0,"expl":"CRC-32 се използва в локалните мрежи IEEE 802.3; CRC-8 — в ATM и IEEE 802.6; CRC-16 — в HDLC."}],"D":[{"id":"L04-D-1","n":1,"text":"Какво е основното предназначение на кодирането?","opts":["Повишаване на верността чрез откриване и коригиране на грешки","Повишаване на скоростта чрез премахване на излишъка","Намаляване на затихването на сигнала в канала","Криптиране на данните срещу неоторизиран достъп"],"correct":0,"expl":"Кодирането повишава верността — открива и коригира грешки от затихване и шум."},{"id":"L04-D-2","n":2,"text":"Какво изучава теорията на кодирането?","opts":["Физичните свойства на преносната среда и затихването в нея","Методите за модулация на носещия сигнал в канала","Кодовете, представени като думи от символи на дадена азбука","Начините за маршрутизиране на пакетите в мрежата"],"correct":2,"expl":"Тя е раздел от теорията на информацията, изучаващ кодовете като думи от символи на азбука."},{"id":"L04-D-3","n":3,"text":"Кое е характерно за коригиращите (шумоустойчиви) кодове?","opts":["Нямат информационен излишък и всички комбинации са разрешени","Освен разрешените, съществуват и забранени кодови комбинации","Комбинациите им се различават помежду си само по 1 разред","Кодовото им разстояние е d = 1"],"correct":1,"expl":"Разрешените комбинации се различават с ≥ 2 разреда; поява на забранена комбинация означава грешка."},{"id":"L04-D-4","n":4,"text":"Какъв е излишъкът на разделим (7, 4) код?","opts":["4/7","3/7","3/4","7/4"],"correct":1,"expl":"Излишъкът е (n − k)/n = 3/7; 4/7 е скоростта R = k/n."},{"id":"L04-D-5","n":5,"text":"Как се нарича броят на различаващите се един от друг импулсни признаци за означаване на разрядите?","opts":["Мощност на кода Nₚ","Тегло на кода w","Дължина на кода n","Основа на кода m"],"correct":3,"expl":"Основата m е 2 за двоичните кодове (0 и 1)."},{"id":"L04-D-6","n":6,"text":"Какво означава оптималност на кода?","opts":["Най-голям брой разрешени комбинации при дадена основа m и дължина n","Най-голямо кодово разстояние сред всички двоични кодове с еднаква дължина n","Най-малък брой единици във всяка кодова комбинация при същия излишък","Най-малка вероятност за неоткриване на грешки сред кодовете със същите n и излишък"],"correct":3,"expl":"Оптималният код дава минимална Pнг сред кодовете със същата дължина n и излишък (n − k)."},{"id":"L04-D-7","n":7,"text":"Кога кодът с постоянно тегло НЕ открива грешката?","opts":["Когато само една единица в комбинацията се превърне в нула","Когато еднакъв брой единици и нули едновременно сменят стойността си","Когато в кодовата комбинация се появи един лъжлив импулс","Когато се загуби един от импулсите на кодовата комбинация"],"correct":1,"expl":"Теглото тогава се запазва; лъжлив или загубен импулс променя теглото и се открива."},{"id":"L04-D-8","n":8,"text":"Кое е правилното правило при обединяването на символите в кода на Хафмън?","opts":["Обединяват се двата най-вероятни символа; по-горният получава 0, а по-долният 1","Групата се дели на две равновероятни подгрупи; първата получава 0","Обединяват се съседните символи по двойки, започвайки отгоре","Обединяват се двата най-малко вероятни символа; по-горният получава 1, а по-долният 0"],"correct":3,"expl":"Хафмън обединява двата символа с най-малки вероятности; в дървото лявото е 1, дясното 0."},{"id":"L04-D-9","n":9,"text":"Съобщението 1011010 се кодира с код на Хеминг (n = 11). Коя комбинация се предава?","opts":["00100111010","10110100000","00110111010","01100111010"],"correct":0,"expl":"b1 = 0, b2 = 0, b3 = 0, b4 = 1 на позиции 1, 2, 4, 8 → 0 0 1 0 0 1 1 1 0 1 0."},{"id":"L04-D-10","n":10,"text":"Къде се прилага образуващият полином x⁸ + x² + x + 1 (ITU CRC-8)?","opts":["В протокола HDLC и в цялото семейство протоколи LAP","В локалните мрежи IEEE 802.3 за контрол на кадрите","В ATM за заглавната част на клетките и в IEEE 802.6","В асинхронното предаване с код ASCII"],"correct":2,"expl":"CRC-8 се прилага в ATM (заглавна част на клетките) и в IEEE 802.6 (регионални мрежи)."}],"E":[{"id":"L04-E-1","n":1,"text":"Коя е правилната последователност на блоковете в комуникационната система от предавателя към приемника?","opts":["Модулатор → кодер → канал → декодер → демодулатор","Кодер → демодулатор → канал → модулатор → декодер","Декодер → модулатор → канал → демодулатор → кодер","Кодер → модулатор → канал → демодулатор → декодер"],"correct":3,"expl":"Предавателят кодира и модулира, приемникът демодулира и декодира."},{"id":"L04-E-2","n":2,"text":"Какво става, ако повторенията на изкривените фрагменти надхвърлят зададеното ниво?","opts":["Включва се автоматично коригиране на грешките с код на Хеминг","Фрагментът се приема въпреки грешката и се маркира като съмнителен","Скоростта на предаване автоматично се удвоява","Счита се, че каналът е загубил способността си да предава данни"],"correct":3,"expl":"Броят на повторенията е ограничен; при надхвърлянето му каналът се счита за неработоспособен."},{"id":"L04-E-3","n":3,"text":"Как се нарича последователността от символи, която при кодирането се присвоява на всяко множество предадени съобщения?","opts":["Кодово разстояние","Единичен интервал","Кодова дума","Теглова характеристика"],"correct":2,"expl":"Това е дефиницията на кодова дума."},{"id":"L04-E-4","n":4,"text":"Код с d₀ = 5 коригира еднократни грешки. До каква кратност грешки може едновременно да открива?","opts":["Трикратни","Двукратни","Четирикратни","Петкратни"],"correct":0,"expl":"От d₀ = σ + t + 1: 5 = σ + 1 + 1 → σ = 3."},{"id":"L04-E-5","n":5,"text":"Как се определя коефициентът на откриване и изправяне на грешки L?","opts":["L = B/(A + B)","L = A/(A + B)","L = A/B","L = (A + B)/A"],"correct":1,"expl":"A — комбинации, в които грешката се открива/поправя; B — в които не се открива и поправя."},{"id":"L04-E-6","n":6,"text":"Колко е пълният брой кодови комбинации N на двоичен код с дължина n = 5?","opts":["10","25","32","16"],"correct":2,"expl":"N = mⁿ = 2⁵ = 32."},{"id":"L04-E-7","n":7,"text":"Каква ще бъде комбинацията 1100101 след допълване с бит за проверка по четност?","opts":["11001011","01100101","11001001","11001010"],"correct":3,"expl":"Комбинацията има 4 единици (четен брой), затова се добавя 0."},{"id":"L04-E-8","n":8,"text":"В приемника на код на Хеминг се получава коригиращо число r = E4E3E2E1 = 0110. Какво означава това?","opts":["Сгрешени са 2-ият и 3-ият разряд","Сгрешен е 6-ият разряд и той трябва да се инвертира","Няма грешка в приетата комбинация","Сгрешен е 9-ият разряд и той трябва да се инвертира"],"correct":1,"expl":"Коригиращото число е двоичният номер на сгрешения елемент: 0110₂ = 6."},{"id":"L04-E-9","n":9,"text":"Как се получават контролните елементи при систематичен цикличен код?","opts":["Като остатък R(x) от делението на xʳ·G(x) на P(x)","Като частно Q(x) от делението на G(x) на P(x)","Като произведение G(x)·P(x) без отместване","Като сума по модул 2 на всички информационни елементи"],"correct":0,"expl":"xʳ·G(x) = Q(x)·P(x) + R(x); F(x) = xʳ·G(x) + R(x), а R(x) дава контролните елементи."},{"id":"L04-E-10","n":10,"text":"Какви пакети грешки открива цикличен код с образуващ многочлен от степен r?","opts":["Всеки пакет грешки с дължина r и по-малка","Само пакети с дължина точно 2r","Всеки пакет грешки с дължина по-голяма от r","Само пакети с нечетна дължина"],"correct":0,"expl":"Образуващ многочлен от степен r открива всички пакети грешки с дължина ≤ r."}]}},{"num":5,"title":"Лекция 5 — Синхронизация при предаване на данни. Асинхронно и синхронно предаване","short":"Синхронизация при предаване на данни. Асинхронно и синхронно предаване","summary":"### Режими на предаване според вида на данните\n- Потоците от данни се състоят от:\n  - **битове** — 0 / 1;\n  - **символи** — поредици от **8 бита**;\n  - **блокове** — поредици от **различен брой** битове или символи.\n- Режими според вида на данните: **битово**, **байтово**, **символно** предаване.\n\n### Синхронизация\n- Приемникът трябва да разбере, че е **започнало предаване**, и да се **синхронизира с предавателя**; той определя **началото и края на всеки елемент** от получаваните данни. Тази задача се нарича **синхронизация**.\n- Режими според начина на синхронизация: **асинхронен** и **синхронен**.\n\n### Асинхронно предаване\n- Използва се, когато данните се **генерират в случайни интервали от време**: **въвеждане от клавиатура**, връзка с **принтери, модеми, факсове**.\n- Всеки символ се кодира обикновено със **7 или 8 бита** (**ASCII**, **EBCDIC**).\n- Между символите може да има **дълги паузи**; приемникът трябва да се **синхронизира отново** при всяко ново начало.\n- Предаването и приемането се **тактуват независимо** и **не се синхронизират**.\n- **Няма времева връзка** между последователните знаци (байтове); символите могат да бъдат разделени от **произволен период на неактивност**.\n\n### Формат на асинхронния кадър (символ)\n| Поле | Брой битове | Бележка |\n|---|---|---|\n| **Стартов бит** | **1** | ниво 0; падащият му фронт започва приемането |\n| **Информационни битове** | **5–8** | предават се **от най-низшия бит** |\n| **P бит** (четност) | 0 или 1 | **опционен** — четен, нечетен или неизползван |\n| **Стопови битове** | **1, 1,5 или 2** | ниво 1 (1 до 2 bit време) |\n- В покой (няма предаване) линията е в **свободно положение — двоична 1**.\n- Дължина на кадъра: минимум **1 + 5 + 1 = 7** бита, максимум **1 + 8 + 1 + 2 = 12** бита. Пример: 7 бита данни + четност + 1 стоп → **10 бита**, от които полезни **7 → 70 %**.\n\n### Приемник и тактуване при асинхронно предаване\n- Приемането започва по **първия падащ фронт** на сигнала, следващ след **стопов бит** или **период на мълчание** по линията.\n- При приемане се **стартира делителят на честота** в приемната страна.\n- Отчетите се вземат **най-близо до средата на битовия интервал** — за да са **преминали преходните процеси** и нивото да е **установено**.\n- **Падащият фронт на стартовия бит инициира тактуването**. Приемникът тактува с **N пъти по-висока** скорост от скоростта на данните (**обикновено N = 16**). На диаграмата: първото отчитане след **8 такта** (средата на стартовия бит), после през **16 такта**.\n\n### Грешки при асинхронно предаване\n- За правилно отчитане битът трябва: да се **появи точно в необходимия момент**, да **стои неизменно** необходимото време и да **изчезне в необходимия момент**.\n- Изместване на отчитането от средата с **1 %** при **1 Mbps** след **50 бита** води до „излизане\" от битовия интервал → **грешно отчитане** (50 × 1 % = 50 % = половин бит).\n\n### Блокова синхронизация при асинхронно предаване\n- Формат на блока (кадъра): **SOH | Header | STX | DATA | ETX | BCC**.\n- **Header** — **номер, тип и дължина** на кадъра.\n- **SOH** — Start Of Heading; **STX** — Start of TeXt; **ETX** — End of TeXt; **BCC** — Block Control Character (обикновено **MOD256**).\n- **Byte Stuffing** (вмъкване на символи): вмъква се **DLE — Data Link Escape** (напр. DLE ETX, DLE DLE).\n- Свойства: приемникът е **винаги готов** за приемане; **не заделя време за начална синхронизация**; взаимодействието е **просто**; **няма ограничение** за броя последователни еднакви битове.\n\n### Byte stuffing с ESC\n- Байт (обикновено **ESC**) се вмъква в данните, когато има символ **със същия шаблон като флага**.\n- Приемникът **премахва ESC** и третира следващия символ като **данни**, а не като флаг.\n- Ако ESC е част от текста — пред него се добавя **още един ESC**.\n\n### Протокол при асинхронно предаване\n- Обмен: **ENQ** → DATA/ACK … (при грешка **NAK** и повторение) → **EOT** → ACK → Disconnect.\n- **EOB** — End Of Block; **EOT** — End Of Transmission; **ACK** — ACKnowledge (потвърждение); **NAK** — Negative AcKnowledge (отрицателно потвърждение).\n\n### Недостатъци на асинхронното предаване\n- **Стартов, стопови и бит за четност за всеки байт** → **неефективно** за големи съобщения.\n- Битовата синхронизация става **все по-ненадеждна** при **увеличаване на скоростта**.\n\n### Синхронно предаване\n- За **големи блокове** данни при **по-високи скорости**.\n- Фреймовете са **непрекъснат поток от битове без закъснение между всеки 8 бита**.\n- Приемникът **поддържа синхронизация** през цялото време; тактуването му работи **в синхрон с получавания сигнал**.\n\n| | Синхронно предаване |\n|---|---|\n| **Предимства** | значително **по-голяма скорост**; данните значително надхвърлят управляващата информация → **по-ефективно използване на канала**; **по-съвършени методи за модулация**; различни типове контрол → **по-висока достоверност** |\n| **Недостатъци** | **увеличаване на апаратурата**; **необходимост от буферна памет**; **усложнена логика** в приемника и предавателя |\n\n### Битова синхронизация при синхронно предаване\nНачини:\n1. По **външни сигнали**, разпространени по канала.\n2. С **методи за кодиране, при които фазата на бита се съдържа в сигнала**: кодиране **с връщане към нула (RZ)** или **преходно-ориентирано** кодиране. Тактовата информация се закодира в сигнала и се **извлича** в приемника (Encoder → Clock Extract Circuit). Пример за **самосинхронизиращ се код — Manchester**.\n3. **Синхронно работещи тактови генератори** в приемника и предавателя — изисква **достатъчно преходи**: използва **„вмъкване на бит\" (bit stuffing)**, подходящо за **NRZ** кодиране. Приемникът има **локален тактов генератор** и **DPLL (Digital Phase Lock Loop)**.\n4. **Периодично предаване на синхронизираща последователност** за съгласуване на вътрешните генератори.\n- Блокове: **PISO** (паралелно→последователно) в предавателя, **SIPO** (последователно→паралелно) в приемника; TxSR/RxSR — регистри; TxD/RxD — данни; TxC/RxC — такт.\n\n### Цифров фазов синхронизатор\n- RxD → усилвател → **XOR** на сигнала и неговото закъснено инвертирано копие (B и B′) → при всеки **преход** се получава импулс C, който **нулира (R) делителя на честота** (Frequency Divisor), захранван от **Local Clock**.\n- Изходът на делителя (D) тактува **D-тригера**, който отчита RxD → изход **RxC**. Така тактът се подравнява по фронтовете на данните (делене на N ± n).\n\n### NRZ и Manchester\n- При **NRZ** дълга поредица от еднакви символи → **няма преходи** по канала → DPLL не може надеждно да **възстанови фазата** (не се откриват границите на битовете).\n- Затова в **Ethernet LAN** се използва **Manchester**, а не NRZ.\n\n### Техника „вмъкване на бит\" (Bit Stuffing)\n- След **пет поредни единици** предавателят вмъква **0**; приемникът премахва 0-та след пет единици.\n- Пример: 0110 **11111** **11111** **11111** 10010 → 0110 11111**0** 11111**0** 11111**0** 10010 → след премахване отново оригиналът.\n\n### Синхронно предаване — блоково и символно\n- **Блокова синхронизация**: SYN SYN SOH … STX DATA ETX BCC. Синхронизиращите символи **SYN** **предхождат** блока и са **два или три**; блокът започва със **STX** и завършва с **ETX**.\n- **Символна синхронизация**: приемникът е в **Hunt Mode** (търсене) и търси SYN в потока; нужни са **от 2 до 7 SYN** символа.\n- **Symbol Stuffing** (вмъкване на символ) — при предаване на двоични данни, както при асинхронното.\n- **Full и half-duplex** мрежите използват **byte-ориентирани** протоколи.\n\n### Байтово (символно) ориентиран протокол\n1. Комуникацията започва с **установяване на синхронизация** (ENQ).\n2. **„Договарят\" се параметрите** на комуникацията (инструкции за предаването).\n3. Предават се **данните**.\n4. Предават се **ACK**, валидиращи предаването; накрая EOT и Disconnect.\n\n### Битово ориентирано синхронно предаване\n- **Кодово независимо**; **не е необходима символна/байтова синхронизация**.\n- Данните са дълги последователности от битове, чийто ред **не предава специфични инструкции**.\n- Примери: **SDLC** (Synchronous Data Link Control) и **HDLC** (High-Level Data Link Control).\n\n### Кадър SDLC/HDLC\n| Flag | Address | Control | Data | FCS | Flag |\n|---|---|---|---|---|---|\n- **Flag = 01111110**.\n- **Address** — **единичен, групов или broadcast**.\n- **Control** — **един или два байта**.\n- **FCS (Frame Check Sequence)** — **CRC 16 или 32 бита**.\n\n### Режими на SDLC/HDLC\n- **SDLC** — само **един** режим: **NRM**. **HDLC** — избор между **три**: NRM, ARM, ABM.\n- **NRM (Normal Response Mode)** — нормален отговор: вторичната станция **не може да комуникира** с първичната, докато **не получи разрешение** от нея.\n- **ARM (Asynchronous Response Mode)** — асинхронен отговор: всяка **вторична** станция може да **започне обмен без разрешение** от първичната.\n- **ABM (Asynchronous Balanced Mode)** — асинхронен балансиран: всички станции са **комбинирани** (могат да бъдат първични или вторични); всяко устройство може да започне обмен **по всяко време** без разрешение.\n\n### Капани за изпита\n- **Битово / байтово / символно** — режими според **вида на данните**; **асинхронен / синхронен** — според **начина на синхронизация**.\n- Асинхронен кадър: **1** стартов бит, **5–8** информационни (от **най-низшия** бит), **опционален** P бит, **1 / 1,5 / 2** стопови. Свободна линия = **1**, стартов бит = **0**.\n- Приемането започва по **падащия** фронт (не по нарастващия). **N = 16**; първото отчитане след **8** такта.\n- **1 % при 1 Mbps → 50 бита** до грешно отчитане.\n- **SOH ≠ STX**: SOH — начало на заглавието, STX — начало на текста; ETX — край на текста; **EOT** — край на предаването; **EOB** — край на блока.\n- Асинхронният Byte Stuffing на един слайд е с **DLE**, на следващия — с **ESC**; и двата са „escape\" символи с една и съща идея.\n- Слайдът „Byte stuffing – bit stuffing\" описва само **byte** stuffing; bit stuffing = **0 след пет единици**.\n- **Manchester** — самосинхронизиращ; **NRZ** — без преходи при еднакви символи → нужен е bit stuffing/DPLL. **Ethernet използва Manchester**.\n- SYN символите: **2 или 3** при блокова синхронизация, но **2 до 7** за постигане на символна синхронизация (два различни слайда).\n- Синхронното предаване **изисква буферна памет** и повече апаратура — това са недостатъци, не предимства.\n- Битово ориентираното предаване е **кодово независимо** и **не изисква символна синхронизация**; пример SDLC/HDLC, а не ASCII/EBCDIC.\n- **Flag = 01111110** (шест единици между нули); Control — **1 или 2 байта**; FCS — **CRC-16 или CRC-32**.\n- **SDLC — само NRM; HDLC — NRM, ARM, ABM.** В ARM вторичната станция инициира обмен без разрешение; в **ABM** всички станции са **комбинирани**. Фразата на слайда „HDLC не може да работи със зацикляне\" е неясна — запомни трите режима.\n- Предимствата на асинхронното блоково предаване (приемникът винаги готов, без начална синхронизация, няма ограничение за еднакви битове) не бъркай с недостатъците (излишни служебни битове, ненадеждност при високи скорости).\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L05-A-1","n":1,"text":"Какво се разбира под синхронизация при предаване на данни?","opts":["Определяне на началото и края на всеки елемент от данните","Изравняване на скоростите на два предавателя в една линия","Откриване и коригиране на грешките в приетите данни","Преобразуване на паралелните данни в последователни"],"correct":0,"expl":"Синхронизацията е задачата приемникът да определи началото и края на всеки елемент."},{"id":"L05-A-2","n":2,"text":"В какво състояние е линията при асинхронно предаване, когато няма предаване?","opts":["В свободно положение — двоична 1","В свободно положение — двоична 0","Редуват се 0 и 1 с тактовата честота","Линията е без напрежение и се счита за грешка"],"correct":0,"expl":"В покой линията е логическа 1; стартовият бит (0) създава падащ фронт."},{"id":"L05-A-3","n":3,"text":"Колко стопови бита може да съдържа асинхронният кадър?","opts":["Само 1","От 2 до 7","5 до 8","1, 1,5 или 2"],"correct":3,"expl":"Стоповият елемент е 1, 1,5 или 2 бита; 5–8 е броят на информационните битове."},{"id":"L05-A-4","n":4,"text":"С колко пъти по-висока честота обикновено тактува приемникът при асинхронно предаване?","opts":["2","8","16","64"],"correct":2,"expl":"Обикновено N = 16, за да попадне отчитането близо до средата на битовия интервал."},{"id":"L05-A-5","n":5,"text":"Какво означава съкращението SOH?","opts":["Start Of Header Block","Start Of Heading","Start Of Handshake","Signal On Hold"],"correct":1,"expl":"SOH — начало на заглавната част (Header) на блока."},{"id":"L05-A-6","n":6,"text":"Кое е предимство на синхронното предаване?","opts":["Не изисква буферна памет в приемника и в предавателя","Опростена обработваща логика в приемната и предавателната част","Приемникът не заделя време за начална синхронизация","По-ефективно използване на канала поради малко служебна информация"],"correct":3,"expl":"Буферната памет и усложнената логика са недостатъци; липсата на начална синхронизация е свойство на асинхронното."},{"id":"L05-A-7","n":7,"text":"Кой код е пример за самосинхронизиращ се код?","opts":["NRZ","Manchester","ASCII","EBCDIC"],"correct":1,"expl":"При Manchester тактовата информация е закодирана в сигнала и се извлича в приемника."},{"id":"L05-A-8","n":8,"text":"Данните 0111111 се предават с техниката „вмъкване на бит“. Каква е предаваната последователност?","opts":["01111101","01111110","011111001","00111111"],"correct":0,"expl":"След пет поредни единици се вмъква 0: 0 11111 0 1."},{"id":"L05-A-9","n":9,"text":"Колко SYN символа са необходими за постигане на символна синхронизация?","opts":["Точно 1","От 8 до 16","От 2 до 7","Точно 16"],"correct":2,"expl":"За символна синхронизация (Hunt Mode) са нужни 2 до 7 SYN символа."},{"id":"L05-A-10","n":10,"text":"Каква е стойността на полето Flag в кадъра на SDLC/HDLC?","opts":["11111111","01111110","10000001","01010101"],"correct":1,"expl":"Флагът е 01111110 — затова се вмъква 0 след пет единици в данните."}],"B":[{"id":"L05-B-1","n":1,"text":"Кое НЕ е режим на предаване според вида на данните?","opts":["Битово","Байтово","Асинхронно","Символно"],"correct":2,"expl":"Асинхронният и синхронният режим са според начина на синхронизация."},{"id":"L05-B-2","n":2,"text":"При кое от изброените се използва асинхронно предаване?","opts":["При въвеждане на текст от клавиатура","При предаване на големи блокове с висока скорост","При HDLC кадри между маршрутизатори","При непрекъснат поток без паузи между байтовете"],"correct":0,"expl":"Асинхронното предаване е за данни, генерирани в случайни интервали (клавиатура, принтери, модеми, факсове)."},{"id":"L05-B-3","n":3,"text":"В какъв ред се предават информационните битове в асинхронния кадър?","opts":["Започва се от най-старшия бит","Започва се от най-низшия бит","Първо четните, после нечетните битове","Редът се определя от бита за четност"],"correct":1,"expl":"Информационните битове (5–8) се предават, започвайки от най-низшия."},{"id":"L05-B-4","n":4,"text":"Кога започва приемането на символ при асинхронно предаване?","opts":["По първия нарастващ фронт след края на стартовия бит","По първия падащ фронт след стоп или период на мълчание","При получаване на два поредни SYN символа","След изтичане на 16 такта от последния стопов бит"],"correct":1,"expl":"Падащият фронт на стартовия бит след стоп или мълчание стартира делителя на честота."},{"id":"L05-B-5","n":5,"text":"Асинхронен кадър съдържа 1 стартов бит, 7 информационни бита, бит за четност и 1 стопов бит. Какъв дял от битовете са информационни?","opts":["50 %","87,5 %","80 %","70 %"],"correct":3,"expl":"Кадърът е 1 + 7 + 1 + 1 = 10 бита, от които 7 са информационни."},{"id":"L05-B-6","n":6,"text":"Какво представлява BCC в блока при асинхронна блокова синхронизация?","opts":["Символ за начало на текста в блока","Номер, тип и дължина на кадъра","Символ за вмъкване пред служебните знаци","Контролен символ на блока, обикновено по MOD256"],"correct":3,"expl":"BCC (Block Control Character) е контролна сума на блока; началото на текста е STX, номерът и типът — в Header."},{"id":"L05-B-7","n":7,"text":"Кое е недостатък на синхронното предаване?","opts":["По-ниска скорост на обмен","Стартов и стопови битове за всеки байт","Необходимост от буферна памет","Невъзможност за по-съвършени методи за модулация"],"correct":2,"expl":"Недостатъци: повече апаратура, буферна памет, по-сложна логика; стартовите/стоповите битове са на асинхронното."},{"id":"L05-B-8","n":8,"text":"Какво означава DPLL и за какво служи?","opts":["Data Packet Link Layer — контролира грешките в получените кадри","Digital Pulse Line Level — определя нивата на сигнала в линията","Digital Phase Lock Loop — поддържа синхронизацията с получения сигнал","Data Phase Lock Logic — преобразува паралелните данни в последователни"],"correct":2,"expl":"DPLL поддържа фазата на локалния тактов генератор на приемника спрямо получения сигнал."},{"id":"L05-B-9","n":9,"text":"Кое е вярно за битово ориентираното синхронно предаване?","opts":["То изисква 2 до 7 SYN символа за всеки блок","Всеки символ се кодира по ASCII или EBCDIC","Редът на битовете предава инструкции на получателя","То е кодово независимо и не изисква символна синхронизация"],"correct":3,"expl":"Битово ориентираното предаване (SDLC, HDLC) е кодово независимо."},{"id":"L05-B-10","n":10,"text":"Колко режима на предаване използва SDLC?","opts":["Само един — NRM","Два — NRM и ARM","Три — NRM, ARM и ABM","Само един — ABM"],"correct":0,"expl":"SDLC използва само Normal Response Mode; HDLC предлага три режима."}],"C":[{"id":"L05-C-1","n":1,"text":"Какво представляват елементите на потока от данни, наречени символи?","opts":["Поредици от различен брой битове","Единични двоични стойности 0 или 1","Поредици от 8 бита","Поредици от 16 бита с контролна сума"],"correct":2,"expl":"Битове — 0/1; символи — 8 бита; блокове — различен брой битове или символи."},{"id":"L05-C-2","n":2,"text":"С колко бита обикновено се кодира всеки символ при асинхронно предаване?","opts":["5 бита (телеграфен код)","16 бита (Unicode)","7 или 8 бита (ASCII или EBCDIC)","12 бита с контрол по четност"],"correct":2,"expl":"Обикновено се използват 7 или 8 бита по ASCII или EBCDIC."},{"id":"L05-C-3","n":3,"text":"Защо отчетите при асинхронното приемане се вземат близо до средата на битовия интервал?","opts":["За да се намали необходимата честота на делителя в приемника","За да се открие навреме падащият фронт на стоповия бит","За да може да се провери четността на целия символ","За да са приключили преходните процеси и нивото да е установено"],"correct":3,"expl":"В средата на интервала нивото е стабилно след преходните процеси."},{"id":"L05-C-4","n":4,"text":"При тактуване с N = 16 след колко такта от падащия фронт се отчита стартовият бит?","opts":["1","16","8","32"],"correct":2,"expl":"Първото отчитане е след половин бит (8 такта), следващите — през 16 такта."},{"id":"L05-C-5","n":5,"text":"Кой символ се вмъква при Byte Stuffing в асинхронната блокова синхронизация?","opts":["DLE — Data Link Escape","SYN — Synchronous Idle","ETX — End of TeXt","BCC — Block Control Character"],"correct":0,"expl":"Вмъква се DLE, за да се различат служебните символи от данните."},{"id":"L05-C-6","n":6,"text":"Какво следва, когато приемникът изпрати NAK при асинхронния протокол?","opts":["Връзката се прекратява с EOT","Предавателят преминава към следващия блок","Приемникът сам коригира данните","Предавателят изпраща повторно същите данни"],"correct":3,"expl":"NAK (Negative AcKnowledge) е отрицателно потвърждение → данните се предават отново."},{"id":"L05-C-7","n":7,"text":"Какви схеми на кодиране позволяват фазата на информационния бит да се съдържа в самия сигнал?","opts":["Само NRZ схеми, допълнени с вмъкване на бит","С връщане към нула и преходно-ориентирани схеми","Кодовете ASCII и EBCDIC за символите","Схеми с отделен външен синхронизиращ сигнал"],"correct":1,"expl":"Тактовата информация се закодира в сигнала при RZ и преходно-ориентирано кодиране (напр. Manchester)."},{"id":"L05-C-8","n":8,"text":"Защо в Ethernet LAN се използва Manchester, а не NRZ кодиране?","opts":["NRZ няма преходи при дълга поредица еднакви символи и DPLL губи фазата","NRZ изисква три нива на напрежение за всеки предаван бит","Manchester предава два бита данни за един такт на генератора","NRZ не позволява добавяне на бит за контрол по четност"],"correct":0,"expl":"Без преходи приемникът не открива границите на битовете."},{"id":"L05-C-9","n":9,"text":"Колко SYN символа предхождат блока при блоковата синхронизация в синхронното предаване?","opts":["Два или три","Точно един","От 5 до 8","Шестнадесет"],"correct":0,"expl":"Контролните SYN символи винаги предхождат блока с данни и са два или три."},{"id":"L05-C-10","n":10,"text":"Какво е характерно за режима ARM в HDLC?","opts":["Вторичната станция предава само след разрешение","Вторична станция може да започне обмен без разрешение","Всички станции са комбинирани и равноправни","Обменът се извършва само с broadcast адреси"],"correct":1,"expl":"ARM — Asynchronous Response Mode; разрешение е нужно при NRM, а комбинирани станции има при ABM."}],"D":[{"id":"L05-D-1","n":1,"text":"Какви са режимите на предаване според начина на синхронизация?","opts":["Битов, байтов и символен","Симплексен и дуплексен","Паралелен и последователен","Асинхронен и синхронен"],"correct":3,"expl":"Според синхронизацията: асинхронен и синхронен; битов/байтов/символен е според вида на данните."},{"id":"L05-D-2","n":2,"text":"Кое твърдение е вярно за асинхронното предаване?","opts":["Предаването и приемането се тактуват независимо","Тактуването на приемника е в синхрон с получавания сигнал","Между байтовете не се допуска пауза","Използва се главно за големи блокове данни"],"correct":0,"expl":"При асинхронното предаване няма времева връзка между последователните знаци."},{"id":"L05-D-3","n":3,"text":"Каква е максималната дължина на асинхронен кадър (символ) в битове?","opts":["10","11","16","12"],"correct":3,"expl":"1 стартов + 8 информационни + 1 бит за четност + 2 стопови = 12 бита."},{"id":"L05-D-4","n":4,"text":"При скорост 1 Mbps отчитането се отмества от средата на битовия интервал с 1 % на бит. След колко бита ще се стигне до грешно отчитане?","opts":["16","100","8","50"],"correct":3,"expl":"50 × 1 % = 50 % — отчитането излиза от битовия интервал."},{"id":"L05-D-5","n":5,"text":"Какво съдържа полето Header в блока при асинхронна блокова синхронизация?","opts":["Контролната сума на блока по MOD256","Синхронизиращите SYN символи","Номер, тип и дължина на кадъра","Адреса на приемника и флага 01111110"],"correct":2,"expl":"Header съдържа номера, типа и дължината на кадъра."},{"id":"L05-D-6","n":6,"text":"Кое е предимство на асинхронното предаване с блокова синхронизация?","opts":["Използва по-малко служебни битове за всеки байт","Приемникът е винаги готов за приемане на данни","Остава надеждно при много високи скорости","Позволява по-съвършени методи за модулация"],"correct":1,"expl":"Освен това взаимодействието е просто и няма ограничение за еднаквите битове."},{"id":"L05-D-7","n":7,"text":"Защо асинхронното предаване е неефективно за големи съобщения?","opts":["Изисква буферна памет за целия блок от данни","Към всеки байт се добавят служебни битове","Не позволява откриване на грешки в символите","Изисква поне два SYN символа преди всеки байт"],"correct":1,"expl":"Служебните битове за всеки символ намаляват ефективността."},{"id":"L05-D-8","n":8,"text":"Каква е ролята на XOR елемента в цифровия фазов синхронизатор?","opts":["Формира импулси при преходите на RxD, нулиращи делителя","Генерира локалния тактов сигнал за целия приемник","Запомня приетия бит и формира изходния такт RxC","Преобразува последователните данни в паралелни"],"correct":0,"expl":"XOR сравнява сигнала с неговото инвертирано закъснено копие; изходът C нулира (R) делителя."},{"id":"L05-D-9","n":9,"text":"Какво е Hunt Mode при символната синхронизация?","opts":["Режим, в който предавателят търси свободен канал","Режим на повторно предаване след получен NAK","Режим, в който приемникът търси SYN символи","Режим, в който вторичната станция чака разрешение"],"correct":2,"expl":"В Hunt Mode приемникът търси SYN, за да постигне символна синхронизация."},{"id":"L05-D-10","n":10,"text":"Какво съдържа полето FCS в кадъра на SDLC/HDLC?","opts":["Адреса на първичната станция","CRC с дължина 16 или 32 бита","Флаг 01111110 за край на кадъра","Един или два управляващи байта"],"correct":1,"expl":"FCS (Frame Check Sequence) е CRC-16 или CRC-32; управляващите байтове са в полето Control."}],"E":[{"id":"L05-E-1","n":1,"text":"Кой режим на синхронизация е подходящ, когато данните се генерират в случайни интервали от време?","opts":["Синхронен","Асинхронен","Битово ориентиран","Синхронен с блокова синхронизация"],"correct":1,"expl":"Асинхронното предаване е за случайно генерирани данни (клавиатура, принтери, модеми)."},{"id":"L05-E-2","n":2,"text":"Какво се прави при byte stuffing, ако символът ESC е част от текста?","opts":["Пред него се добавя допълнителен ESC","Той се заменя с флаг","Той се премахва от текста","Кадърът се изпраща без ESC символи"],"correct":0,"expl":"Допълнителният ESC показва, че следващият ESC е данни, а не служебен символ."},{"id":"L05-E-3","n":3,"text":"Как се разшифрова съкращението EOT в асинхронния протокол?","opts":["End Of Text","End Of Block","End Of Transmission","Enquiry Of Transmitter"],"correct":2,"expl":"EOT — край на предаването; ETX — край на текста; EOB — край на блока."},{"id":"L05-E-4","n":4,"text":"Как се предават фреймовете при синхронно предаване?","opts":["Като отделни символи със стартов и стопов бит","Като символи, разделени от произволен период на неактивност","Като 8-битови групи с пауза от 1 до 2 бита","Като непрекъснат поток от битове без закъснение между всеки 8 бита"],"correct":3,"expl":"При синхронното предаване няма паузи между байтовете."},{"id":"L05-E-5","n":5,"text":"Кое НЕ е предимство на синхронното предаване?","opts":["Опростена апаратура в приемната и предавателната част","Значително по-голяма скорост на обмен","Възможност за по-съвършени методи за модулация","По-висока достоверност чрез различни типове контрол"],"correct":0,"expl":"Синхронното предаване увеличава апаратурата и усложнява логиката."},{"id":"L05-E-6","n":6,"text":"Какво изисква битовата синхронизация със синхронно работещи тактови генератори?","opts":["Задължително кодиране с връщане към нула","Достатъчно преходи, осигурени чрез вмъкване на бит","Отделен проводник за предаване на тактовия сигнал","Стартов и стопов бит за всеки предаван символ"],"correct":1,"expl":"Затова се използва bit stuffing и така може да се използва NRZ кодиране."},{"id":"L05-E-7","n":7,"text":"Приемникът получава 0111110110 при използване на bit stuffing. Какви са данните след премахване на вмъкнатия бит?","opts":["0111110110","01111110","011111010","011111110"],"correct":3,"expl":"Нулата след пет поредни единици се премахва: 0 11111 [0] 110 → 011111110."},{"id":"L05-E-8","n":8,"text":"Какви протоколи използват full- и half-duplex мрежите при символна синхронизация?","opts":["Само битово ориентирани протоколи","Асинхронни протоколи без кадри","Протоколи без потвърждения","Byte-ориентирани протоколи"],"correct":3,"expl":"Слайдът дава като пример full и half-duplex мрежите с byte-ориентирани протоколи."},{"id":"L05-E-9","n":9,"text":"Колко байта е полето Control в кадъра на SDLC/HDLC?","opts":["Един или два","Точно четири","От 2 до 7","Шестнадесет"],"correct":0,"expl":"Control заема един или два байта; адресът е единичен, групов или broadcast."},{"id":"L05-E-10","n":10,"text":"Какво изисква режимът ABM в HDLC?","opts":["Вторичните станции да чакат разрешение от първичната","Мрежата да има само една първична станция","Всички станции да бъдат конфигурирани като комбинирани","Обменът да се инициира само от първичната станция"],"correct":2,"expl":"При ABM всяко устройство може да започне обмен по всяко време без разрешение."}]}},{"num":6,"title":"Лекция 6 — Основни термини за компютърните мрежи. Физическа и логическа топология","short":"Основни термини за компютърните мрежи. Физическа и логическа топология","summary":"### Компютърна мрежа — определения\n- **Мрежа** — технология, позволяваща на **независими устройства** с възможност за комуникация да се **свързват** помежду си или да **използват общи ресурси**. Когато устройствата са **компютри**, мрежата се нарича **компютърна**.\n- **Компютърна мрежа** — **механизъм**, който позволява на **физически разделени компютри** да **комуникират** и да **поделят ресурси**.\n- Мрежите са високоспециализирано решение — от **домашна мрежа от два компютъра** и **малка LAN** до постоянно нарастващата **глобална мрежа (WAN)**.\n\n### Предназначение на мрежите\n- **Комуникация**, **работа**, **обучение**, **игра**.\n\n### Еволюция на мрежите\n- **Средата на 20 век** — компютрите са **редки, екзотични**, собственост само на **големи компании, образователни и държавни институции**; мрежите са различни, предаването е с **кодирани сигнали**.\n- **Телеграф — 19 век**: във **Франция — оптическа** телеграфна мрежа; в **САЩ — електрическият телеграф на Морз**.\n- **Телефонна мрежа** — **комутиране на електрически вериги (circuit switching)** и **комутиране на пакети (packet switching)**.\n- **ARPAnet — 1969 г., Лос Анджелис** — **първата компютърна мрежа с комутиране на пакети**.\n\n### Мрежите днес\nНапредъкът на компютърните и мрежовите технологии води до:\n- **спад в цената** на услугите; **нарастваща популярност** на мрежовите решения; **навлизане във всички области** на живота;\n- **реклама** в web-пространството; поява и развитие на **електронна търговия**;\n- **видеоконференции** по високоскоростни връзки; **on-line обучение**.\n\n### Компоненти на мрежата\n| Група | Подгрупа | Примери |\n|---|---|---|\n| **Устройства** | **крайни** | PC, fax, printer |\n| | **мрежови** | repeater, media convertor, hub, switch, router, firewall |\n| **Преносна среда** | **кабелна** | мед и оптика |\n| | **безжична** | — |\n| **Услуги** | **мрежови** | DHCP, DNS, www, mail, ftp |\n| | **потребителски** | AD (Active Directory), DB (бази данни) |\n- В лекцията са използвани **условните означения на Cisco** (за крайни устройства, мрежови устройства и преносна среда).\n\n### Видове мрежи според физическия обхват\n| Вид | Разшифровка | Обхват |\n|---|---|---|\n| **PAN** | Personal Area Network | лична мрежа |\n| **LAN** | Local Area Network | **ограничена област** — от **една стая до няколко близки сгради** |\n| **MAN** | Metropolitan Area Network | **поне две LAN** в границите на **голям град (до 80 км)** |\n| **WAN** | Wide Area Network | **голяма географска област**, произволна **„мрежа от мрежи\"** |\n| **SAN** | Storage Area Network | мрежа за съхранение на данни |\n\n### Видове мрежи според достъпа и администрирането\n- **Интранет** — достъп **само от служителите** на компанията.\n- **Екстранет** — достъп до ресурсите на корпоративната мрежа от **доставчици, потребители и други контрагенти**.\n- **Интернет** — **останалата част от света**.\n\n### Видове мрежи по метод на администриране\n| | **Peer-to-peer (равноправна)** | **Client/server (клиент/сървър)** |\n|---|---|---|\n| Принцип | всеки компютър е **и клиент, и сървър**; всеки потребител администрира **своя** компютър | **централизирано** администриране на компютър със специален софтуер, който **оторизира** потребителите |\n| Предимства | **по-евтина**; **не изисква сървърен софтуер**; **не изисква мрежов администратор** | **по-добра сигурност**; **по-лесно администриране** на голяма мрежа; **централизирано архивиране** |\n| Недостатъци | **не се мащабира добре** (администрирането става неуправляемо); всеки сам администрира; **по-несигурна**; обменящите ресурси машини **намаляват производителността** | **скъп мрежов софтуер**; **скъп, по-мощен хардуер** за сървъра; нужен **професионален администратор**; **единствена точка на отказ — сървърът** |\n\n### Топология на компютърна мрежа\n- **Топология** — **изображение на мрежата**, което представя с **условни знаци** компонентите (устройствата и връзките между тях).\n- Физическите и логическите връзки **могат да са идентични, но могат и да се различават**.\n- **Физическа топология** — **физическото разположение** на устройствата (възлите) и **системата от кабели**. Представя се с **чертежи в мащаб**: трасета на кабелите, брой и вид, розетки в работната област, шкафове с устройства, точки за безжичен достъп.\n- **Логическа топология** — **логическата връзка** между устройствата чрез преносната среда; определя се от **начина на предаване на сигналите**, **независимо от физическото разположение**. (Пример от слайда: мрежа с hub/bridge е физически звезда, но **логически шина**.)\n\n### LAN топологии (по начин на свързване)\n- **Линейна шина**, **кръг**, **звезда**, **mesh — решетъчна (напълно свързана)**, **хибридна** и др.\n\n| Топология | Предимства | Недостатъци |\n|---|---|---|\n| **Обща шина** | цялата информация минава през **споделената среда („шината\")** и е **достъпна за всички възли едновременно** | — |\n| **Кръг** | **лесно се включват нови компютри** | **маршрутът не се избира**; при повреда на компютър или на средата **се губи работоспособност** → нужен **двоен кръг** или специална апаратура |\n| **Звезда** | лесно се **откриват повреди** в средата; лесно се **добавят и отстраняват** крайни устройства; работоспособността **не зависи от отделните крайни устройства** | **централният възел — слабо място** за надеждността; **ниска пропускателна способност** при върхово натоварване или добавяне на устройства; **увеличена дължина** на съобщителната среда |\n| **Разширена звезда** | лесно се откриват повреди; лесно се „откриват\" (добавят) нови или съществуващи компютри | **централната точка — слабо място**; при повреда на **възел от горно ниво** всички **негови наследници губят връзка** |\n\n### WAN топологии\n- **Point-to-point** — **физическа**: **постоянна** физическа връзка между **точно 2 устройства** (еквивалент на два компютъра, свързани директно с **crossover кабел**); **логическа**: връзка между точно две устройства, която **може да се изгради непосредствено преди комуникацията**.\n- **Hub and spoke** — **централно устройство** се свързва с останалите; **еквивалент на „звезда\" в LAN**.\n- **Full mesh** — връзки **всеки с всеки**; **надеждна, но трудно се разраства**.\n\n### Надеждна мрежа — четири характеристики\n- **Толерантност към грешки — резервираност**: при отпадане на връзка има **резервен път**, за да не отпадне достъпът до услугата.\n- **Възможност за разрастване — скалируемост**: добавянето на нови потребители и LAN **не влошава производителността** за съществуващите.\n- **Качество на услугата — QoS**: **приоритизация на трафика** по потребители и приложения.\n- **Сигурност на достъпа** — **физическа** и **логическа** (**конфиденциалност, достъпност, интегритет**).\n\n### Капани за изпита\n- **ARPAnet — 1969 г., Лос Анджелис**, първата мрежа с **комутиране на пакети** (не с комутиране на вериги).\n- Телеграф: **Франция — оптически**, **САЩ — електрически (Морз)**, и двата **през 19 век**.\n- **MAN = поне две LAN, до 80 км** (голям град). **LAN** — от стая до няколко близки сгради. **SAN = Storage**, не „Small\".\n- **Интранет** — служители; **екстранет** — доставчици, клиенти, контрагенти; **интернет** — останалият свят.\n- **Hub, switch, router, repeater, media convertor, firewall** са **мрежови** устройства; **PC, fax, printer** — **крайни**.\n- **DHCP, DNS, www, mail, ftp** — **мрежови** услуги; **AD, DB** — **потребителски**.\n- По-добра сигурност и централизирано архивиране → **клиент/сървър**; по-евтина, без сървърен софтуер и администратор → **peer-to-peer**. **Единствената точка на отказ** (сървърът) е недостатък на **клиент/сървър**.\n- **Физическата** топология е за кабели, розетки, шкафове (чертеж в мащаб); **логическата** — за начина на предаване на сигналите.\n- **Hub and spoke** е WAN аналог на **звезда**; **Point-to-point, Hub and spoke, Full mesh** са **WAN** топологии, а шина, кръг, звезда, mesh, хибридна — **LAN**.\n- **Full mesh** — **надеждна, но трудно се разраства**.\n- Слайдът за **кръг** посочва като предимство лесното включване на нови компютри, а за **разширена звезда** — „лесно се **откриват** нови или съществуващи компютри\" (вероятно се има предвид „добавят/отстраняват\").\n- **Скалируемост** ≠ **резервираност**: първата е за растеж без спад на производителността, втората — за резервен път при отпадане.\n- **QoS** = приоритизация на трафика; **конфиденциалност, достъпност, интегритет** са аспекти на **сигурността**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L06-A-1","n":1,"text":"Как се дефинира компютърната мрежа?","opts":["Съвкупност от кабели, розетки и комуникационни шкафове в рамките на една сграда","Механизъм, който позволява на физически разделени компютри да комуникират и да поделят ресурси","Програма, която управлява достъпа на потребителите до ресурсите на сървъра в мрежата","Изображение на устройствата и връзките между тях, представени с условни знаци"],"correct":1,"expl":"Последният вариант е определението за топология, а не за мрежа."},{"id":"L06-A-2","n":2,"text":"През коя година е създадена ARPAnet?","opts":["1959","1979","1989","1969"],"correct":3,"expl":"ARPAnet е създадена през 1969 г. в Лос Анджелис."},{"id":"L06-A-3","n":3,"text":"Кое от изброените е мрежово (а не крайно) устройство?","opts":["PC","Printer","Router","Fax"],"correct":2,"expl":"Мрежови устройства: repeater, media convertor, hub, switch, router, firewall."},{"id":"L06-A-4","n":4,"text":"Какво е MAN?","opts":["Мрежа в една стая или няколко близки сгради","Поне две LAN, свързани в границите на голям град (до 80 км)","Произволна „мрежа от мрежи“ в голяма географска област","Мрежа, предназначена за съхранение на данни"],"correct":1,"expl":"MAN (Metropolitan Area Network) обхваща приблизително един голям град."},{"id":"L06-A-5","n":5,"text":"Кой има достъп до екстранет?","opts":["Доставчици, потребители и други контрагенти на компанията","Само служителите на компанията, без външни партньори","Цялата останала част от света извън компанията","Само мрежовите администратори на компанията"],"correct":0,"expl":"Интранет — служителите; екстранет — външни партньори; интернет — останалият свят."},{"id":"L06-A-6","n":6,"text":"Кое е характерно за равноправната (peer-to-peer) мрежа?","opts":["Администрирането е централизирано на един компютър","Всеки компютър функционира и като клиент, и като сървър","Изисква професионален мрежов администратор","Осигурява централизирано архивиране на данните"],"correct":1,"expl":"В peer-to-peer мрежа всеки потребител администрира ресурсите на своя компютър."},{"id":"L06-A-7","n":7,"text":"Какво указва физическата топология на мрежата?","opts":["Физическото разположение на устройствата и използваната кабелна система","Начина на предаване на сигналите между устройствата в мрежата","Приоритета на трафика според потребителите и приложенията","Правата на потребителите за достъп до споделените ресурси"],"correct":0,"expl":"Начинът на предаване на сигналите определя логическата топология."},{"id":"L06-A-8","n":8,"text":"Кой е недостатък на LAN топологията „кръг“?","opts":["Новите компютри се включват трудно и с прекъсване на мрежата","Централният възел е слабо място по отношение на надеждността","Информацията е достъпна за всички възли едновременно","Повреда на компютър или на средата спира работата на мрежата"],"correct":3,"expl":"Затова се предвижда двоен кръг или специална апаратура."},{"id":"L06-A-9","n":9,"text":"На коя LAN топология е еквивалент WAN топологията hub and spoke?","opts":["Кръг","Обща шина","Звезда","Full mesh"],"correct":2,"expl":"При hub and spoke централно устройство е свързано с останалите — като звезда."},{"id":"L06-A-10","n":10,"text":"Какво означава скалируемост на мрежата?","opts":["Нови потребители и мрежи се добавят без спад на производителността","При отпадане на връзка съществува резервен път до услугата","Трафикът се приоритизира според потребителите и приложенията","Достъпът до мрежата е защитен физически и логически"],"correct":0,"expl":"Скалируемост = възможност за разрастване; резервният път е толерантност към грешки."}],"B":[{"id":"L06-B-1","n":1,"text":"Кое от изброените е посочено сред предназначенията на мрежите?","opts":["Производство","Транспорт","Отбрана","Обучение"],"correct":3,"expl":"Посочените предназначения са комуникация, работа, обучение и игра."},{"id":"L06-B-2","n":2,"text":"Какви видове комутиране се използват в телефонната мрежа?","opts":["Комутиране на електрически вериги и комутиране на пакети","Само комутиране на съобщения с междинно съхранение","Оптично комутиране и електрическо комутиране на сигнали","Комутиране на кадри и комутиране на клетки (ATM)"],"correct":0,"expl":"Телефонната мрежа: circuit switching и packet switching."},{"id":"L06-B-3","n":3,"text":"Към коя група услуги се отнасят AD и DB?","opts":["Мрежови услуги","Крайни устройства","Преносна среда","Потребителски услуги"],"correct":3,"expl":"Мрежови услуги са DHCP, DNS, www, mail, ftp; AD и DB са потребителски."},{"id":"L06-B-4","n":4,"text":"Каква област обхваща LAN?","opts":["Приблизително един голям град с радиус до 80 км","Голяма географска област, свързваща много мрежи","От една стая до няколко близко разположени сгради","Само устройствата в непосредствена близост до човека"],"correct":2,"expl":"LAN обхваща ограничена област — стая или няколко близки сгради."},{"id":"L06-B-5","n":5,"text":"Кой има достъп до интранет мрежата?","opts":["Доставчиците и клиентите на компанията","Само служителите на компанията","Всички потребители на интернет","Само администраторите на доставчика"],"correct":1,"expl":"Интранет е вътрешна мрежа само за служителите."},{"id":"L06-B-6","n":6,"text":"Кой е недостатък на мрежата клиент/сървър?","opts":["Всеки потребител сам администрира своя компютър","Не се мащабира добре за големи мрежи","Сървърът е единствена точка на отказ","Осигурява по-ниска сигурност"],"correct":2,"expl":"Ако сървърът спре, данните стават недостъпни; останалите са недостатъци на peer-to-peer."},{"id":"L06-B-7","n":7,"text":"От какво се определя логическата топология?","opts":["От начина на предаване на сигналите между устройствата","От трасетата на кабелите и разположението на розетките","От броя и разположението на шкафовете с устройства","От вида на използваните кабели — медни или оптични"],"correct":0,"expl":"Кабели, розетки и шкафове се отнасят до физическата топология."},{"id":"L06-B-8","n":8,"text":"Кое е предимство на LAN топологията „звезда“?","opts":["Централният възел не влияе на надеждността на мрежата","Съобщителната среда е с минимална обща дължина","Мрежата не зависи от отделните крайни устройства","Маршрутът между възлите не трябва да се избира"],"correct":2,"expl":"Звездата има слабо място — централния възел — и увеличена дължина на средата."},{"id":"L06-B-9","n":9,"text":"Каква е характеристиката на WAN топологията full mesh?","opts":["Евтина и лесно се разраства","Свързва точно две устройства","Всички възли зависят от едно централно устройство","Надеждна, но трудно се разраства"],"correct":3,"expl":"При full mesh всеки е свързан с всеки — надеждно, но трудно за разширяване."},{"id":"L06-B-10","n":10,"text":"Какво осигурява QoS в надеждната мрежа?","opts":["Резервен път при отпадане на връзка","Приоритизация на трафика по потребители и приложения","Конфиденциалност и интегритет на данните","Добавяне на потребители без спад на производителността"],"correct":1,"expl":"QoS (качество на услугата) приоритизира трафика."}],"C":[{"id":"L06-C-1","n":1,"text":"Кога една мрежа се нарича компютърна?","opts":["Когато свързва устройствата само с оптични кабели","Когато обхваща повече от една сграда или етаж","Когато свързаните независими устройства са компютри","Когато в нея има поне един специализиран сървър"],"correct":2,"expl":"Мрежа, в която устройствата са компютри, се нарича компютърна."},{"id":"L06-C-2","n":2,"text":"Какъв телеграф е използван във Франция през 19 век според лекцията?","opts":["Оптическа телеграфна мрежа","Електрически телеграф на Морз","Безжичен радиотелеграф","Телефонна мрежа с комутиране на пакети"],"correct":0,"expl":"Във Франция — оптическа мрежа; в САЩ — електрическият телеграф на Морз."},{"id":"L06-C-3","n":3,"text":"Как се класифицира преносната среда в мрежата?","opts":["Крайна и мрежова според устройствата","Кабелна (мед и оптика) и безжична","Мрежова и потребителска според услугите","Физическа и логическа според топологията"],"correct":1,"expl":"Крайни/мрежови са устройствата, мрежови/потребителски — услугите."},{"id":"L06-C-4","n":4,"text":"Как се разшифрова съкращението SAN?","opts":["Storage Area Network","Small Area Network","Server Access Network","Secure Area Network"],"correct":0,"expl":"SAN е мрежа за съхранение на данни (Storage Area Network)."},{"id":"L06-C-5","n":5,"text":"Кое е предимство на равноправната (peer-to-peer) мрежа?","opts":["Осигурява по-добра сигурност на данните","Позволява централизирано архивиране на данните","Не изисква сървърен софтуер и мрежов администратор","Мащабира се добре при разрастване до големи мрежи"],"correct":2,"expl":"Peer-to-peer е по-евтина; сигурността и архивирането са предимства на клиент/сървър."},{"id":"L06-C-6","n":6,"text":"Как се извършва администрирането в мрежа клиент/сървър?","opts":["Всеки потребител администрира ресурсите на своя компютър","Чрез ръчно споделяне на папки между работните станции","Без оторизация — всички ресурси са общодостъпни","Централизирано, чрез сървър със софтуер за оторизация"],"correct":3,"expl":"Клиент/сървър — централизирано администриране и оторизация."},{"id":"L06-C-7","n":7,"text":"Кое е характерно за LAN топологията „обща шина“?","opts":["Всеки възел е свързан директно с всеки друг възел в мрежата","Всички възли получават информацията по споделена среда едновременно","Всички възли са свързани към едно централно устройство","Данните обикалят последователно по затворен кръг от възли"],"correct":1,"expl":"При шината цялата информация минава по споделената преносна среда."},{"id":"L06-C-8","n":8,"text":"Какъв е недостатъкът на топологията „разширена звезда“ при повреда на възел от горно ниво?","opts":["Губи се работоспособността само на този възел","Трафикът автоматично се пренасочва по резервен път","Всички негови наследници губят връзка с мрежата","Мрежата преминава в режим на кръг"],"correct":2,"expl":"Повреда на възел от по-горно ниво изолира всички възли под него."},{"id":"L06-C-9","n":9,"text":"Какво представлява физическата point-to-point WAN топология?","opts":["Връзка, изграждана непосредствено преди комуникацията","Свързване на централно устройство с всички останали","Връзки между всички устройства по схема „всеки с всеки“","Постоянна физическа връзка между точно две устройства"],"correct":3,"expl":"Тя е еквивалент на два компютъра, свързани директно с crossover кабел; изграждането преди комуникацията е логическата."},{"id":"L06-C-10","n":10,"text":"Какво означава толерантност към грешки (резервираност) в надеждната мрежа?","opts":["Наличие на резервен път при отпадане на връзка","Откриване и коригиране на грешките в предаваните кадри","Добавяне на потребители без спад на производителността","Приоритизиране на трафика по потребители и приложения"],"correct":0,"expl":"Резервираност = резервен път; растежът без спад е скалируемост."}],"D":[{"id":"L06-D-1","n":1,"text":"Какво е характерно за компютрите в средата на 20 век?","opts":["Редки и екзотични, притежавани от големи компании и институции","Масово разпространени в домакинствата и малкия бизнес","Свързани помежду си чрез глобалната мрежа Интернет","Използвани предимно за онлайн обучение и компютърни игри"],"correct":0,"expl":"В средата на 20 век компютрите са редки, а мрежите между тях — различни."},{"id":"L06-D-2","n":2,"text":"Кое НЕ е последица от напредъка на компютърните и мрежовите технологии?","opts":["Поява и развитие на електронна търговия","Поскъпване на мрежовите услуги","Видеоконференции по високоскоростни връзки","On-line обучение"],"correct":1,"expl":"Напредъкът води до спад в цената на услугите."},{"id":"L06-D-3","n":3,"text":"Чии условни означения са използвани в лекцията за представяне на мрежите?","opts":["На IEEE","На ITU","На ISO","На Cisco"],"correct":3,"expl":"Използвани са условните означения на Cisco за крайни, мрежови устройства и преносна среда."},{"id":"L06-D-4","n":4,"text":"Каква мрежа обхваща голяма географска област и е произволна „мрежа от мрежи“?","opts":["WAN","MAN","LAN","PAN"],"correct":0,"expl":"WAN (Wide Area Network) обхваща голяма географска област."},{"id":"L06-D-5","n":5,"text":"Според какъв критерий мрежите се делят на интранет, екстранет и интернет?","opts":["Според физическия обхват","Според топологията","Според вида на преносната среда
