","Според достъпа и администрирането"],"correct":3,"expl":"Според физическия обхват са PAN, LAN, MAN, WAN, SAN."},{"id":"L06-D-6","n":6,"text":"Защо равноправната мрежа не се мащабира добре за големи мрежи?","opts":["Изисква скъп мрежов софтуер","Сървърът е единствена точка на отказ","Администрирането става неуправляемо","Изисква по-мощен хардуер за сървъра"],"correct":2,"expl":"Всеки потребител администрира сам, което при много машини е неуправляемо."},{"id":"L06-D-7","n":7,"text":"Какво представлява топологията на компютърна мрежа?","opts":["Списък на мрежовите услуги и техните потребители","Протокол за предаване на сигналите между устройствата","Изображение на компонентите на мрежата с условни знаци","Метод за централизирано администриране на ресурсите"],"correct":2,"expl":"Топологията представя с условни знаци компонентите на мрежата."},{"id":"L06-D-8","n":8,"text":"Коя от изброените НЕ е LAN топология по начин на свързване?","opts":["Линейна шина","Hub and spoke","Кръг","Mesh"],"correct":1,"expl":"Hub and spoke е WAN топология (аналог на звезда в LAN)."},{"id":"L06-D-9","n":9,"text":"Каква е логическата point-to-point WAN връзка?","opts":["Постоянна физическа връзка между точно две устройства чрез crossover кабел","Връзка на централно устройство с всички останали устройства в мрежата","Връзки между всички устройства в мрежата по схемата „всеки с всеки“","Връзка между две устройства, изграждана непосредствено преди комуникацията"],"correct":3,"expl":"Физическата point-to-point е постоянна; логическата може да се изгражда при нужда."},{"id":"L06-D-10","n":10,"text":"Кое НЕ е аспект на логическата сигурност на достъпа?","opts":["Конфиденциалност","Скалируемост","Достъпност","Интегритет"],"correct":1,"expl":"Логическата сигурност включва конфиденциалност, достъпност и интегритет; скалируемостта е отделна характеристика."}],"E":[{"id":"L06-E-1","n":1,"text":"Как се разшифрова съкращението PAN?","opts":["Public Access Network","Private Area Network","Personal Area Network","Packet Access Network"],"correct":2,"expl":"PAN е лична мрежа — Personal Area Network."},{"id":"L06-E-2","n":2,"text":"С какво е известна ARPAnet?","opts":["Първата оптическа телеграфна мрежа","Първата компютърна мрежа с комутиране на пакети","Първата телефонна мрежа с комутиране на вериги","Първата безжична локална мрежа"],"correct":1,"expl":"ARPAnet (1969 г., Лос Анджелис) е първата мрежа с комутиране на пакети."},{"id":"L06-E-3","n":3,"text":"Кои са трите групи компоненти на мрежата?","opts":["Клиенти, сървъри и администратори","Кабели, розетки и шкафове","LAN, MAN и WAN","Устройства, преносна среда и услуги"],"correct":3,"expl":"Компоненти: устройства (крайни и мрежови), преносна среда (кабелна и безжична), услуги (мрежови и потребителски)."},{"id":"L06-E-4","n":4,"text":"Към коя група се отнася media convertor?","opts":["Мрежови устройства","Крайни устройства","Мрежови услуги","Потребителски услуги"],"correct":0,"expl":"Repeater, media convertor, hub, switch, router и firewall са мрежови устройства."},{"id":"L06-E-5","n":5,"text":"Кое НЕ е недостатък на мрежата клиент/сървър?","opts":["Изисква скъп мрежов софтуер","По-несигурна е","Изисква професионален мрежов администратор","Изисква по-мощен хардуер за сървъра"],"correct":1,"expl":"Клиент/сървър предоставя по-добра сигурност; по-несигурна е равноправната мрежа."},{"id":"L06-E-6","n":6,"text":"Как се представя физическата топология?","opts":["С диаграма на начина на предаване на сигналите","С таблица на IP адресите на всички устройства","С чертежи в мащаб — трасета на кабели, розетки, шкафове","Със списък на потребителите и техните права за достъп"],"correct":2,"expl":"Физическата топология показва и броя и вида на кабелите и точките за безжичен достъп."},{"id":"L06-E-7","n":7,"text":"Какво е вярно за физическите и логическите връзки в дадена мрежа?","opts":["Винаги са идентични, независимо от устройствата","Винаги се различават, независимо от устройствата","Логическите връзки винаги определят физическите","Могат да бъдат идентични, но могат и да се различават"],"correct":3,"expl":"Пример: мрежа с hub е физически звезда, но логически шина."},{"id":"L06-E-8","n":8,"text":"Кое е недостатък на LAN топологията „звезда“?","opts":["Увеличена дължина на съобщителната среда","Трудно се откриват повреди в средата","Трудно се добавят нови крайни устройства","Повредата на крайно устройство спира цялата мрежа"],"correct":0,"expl":"Недостатъци: слаб централен възел, ниска пропускателна способност при пикове, по-дълга среда."},{"id":"L06-E-9","n":9,"text":"Кои са видовете WAN топологии, разгледани в лекцията?","opts":["Point-to-point, hub and spoke и full mesh","Шина, кръг и звезда","Интранет, екстранет и глобален интернет","Peer-to-peer, клиент/сървър и хибридна"],"correct":0,"expl":"Шина, кръг и звезда са LAN топологии."},{"id":"L06-E-10","n":10,"text":"Коя LAN топология се нарича още решетъчна (напълно свързана)?","opts":["Звезда","Разширена звезда","Хибридна","Mesh"],"correct":3,"expl":"Mesh — решетъчна, напълно свързана топология."}]}},{"num":7,"title":"Лекция 7 — Етапи на създаване и проектиране на компютърна мрежа","short":"Етапи на създаване и проектиране на компютърна мрежа","summary":"### Основни моменти\n- Стандарти, касаещи **проектирането, изграждането и тестването** на компютърни мрежи; етапи на създаване на мрежата; проектиране на дизайна; **структурно окабеляване**; мрежово администриране на етап планиране.\n\n### Етапи на създаване на компютърна мрежа (КМ)\n1. **Проектиране**\n2. **Изграждане** — **физическо** и **логическо**\n3. **Администриране**\n\n- **Няма най-добра физическа топология** и **няма най-добра мрежова операционна система**, защото **всяка компания, всяка мрежа и всеки администратор са различни** и имат специфични нужди.\n- **Цел на проектирането** — **успешно интегриране на всички технически компоненти**, което да доведе до **производителност на крайната мрежа, съответстваща или надвишаваща изискванията и очакванията на потребителите**.\n- Литература: лекции „Проектиране на компютърни мрежи“ (В. Алексиева); Алексиева, Вълчанов — ръководство за лабораторни упражнения, ТУ-Варна, 2017.\n\n### Кой определя как изглежда и работи една мрежа?\n- **Стандарти**\n- **Организации за стандартизация в България**\n- **Закони** — **Български държавен стандарт (БДС)** и **Български институт за стандартизация (БИС)** (на слайда: „при БАН“)\n- **Правилници** за прилагане на законите\n- **Наредби**\n- **Камара на инженерите в инвестиционното проектиране (КИИП)**\n- **Добри практики**\n\n### Кой може да проектира?\n- **Проектант с пълна, ограничена или без такава правоспособност, регистриран в КИИП.**\n- Сайт: **kiip.bg** — действащи нормативни изисквания, членство в секция **„Електротехника, автоматика и съобщителна техника“ (ЕАСТ)**, ОПП и ППП; има и регионални сайтове.\n- Ако проектантът **не членува в КИИП** → **проектът е незаконен** и **не може да послужи за представяне пред проверяващите органи** (слайдът оставя въпроса „Изключения?“ отворен).\n\n| Правоспособност | Самостоятелно проектира | Обекти от 1, 2, 3 категория |\n|---|---|---|\n| **ППП** (пълна проектантска правоспособност) | обекти от **всички категории** | самостоятелно |\n| **ОПП** (ограничена проектантска правоспособност) | обекти от **4 и 5 категория** | **само в съавторство с колега с ППП** |\n\n- **Категорията на обекта** се определя от **Закона за устройство на територията (ЗУТ)**.\n\n### Дизайн, архитектура и чертеж\n| Понятие | Какво прави |\n|---|---|\n| **Мрежов анализ** | какво **потребителите, техните приложения и устройства очакват** от мрежата; определя **връзките между потребители, приложения и устройства**; той **определя архитектурата и дизайна** |\n| **Мрежова архитектура** | разработва **концептуална END-TO-END структура от високо ниво**, **избира технология и топология**; определя връзките между функционирането на мрежата (**адресиране, рутинг, управление, производителност, сигурност**) и оптимизира архитектурата върху тях |\n| **Мрежов дизайн** | осигурява **физическите детайли** за архитектурата — **чертежи**, логически схеми на връзките, **избор на производители**, избор на самото оборудване, **ISP** |\n\n### Процес от анализ до окончателен дизайн (отдолу нагоре)\n| Стъпка | Съдържание |\n|---|---|\n| 1. **Вход** | дефиниране на проблемите, **начални условия**, данни за работните потоци, **съществуващи рестрикции**, моделиране и симулации, управление на риска |\n| 2. **Мрежов анализ** | откриване и уточняване на изискванията, **анализ на трафикопотоците**, разработване на модели, дефиниране на риска според потребителите |\n| 3. **Резултат от него** | **изисквания, услуги, информация за местоположението, трафикопотоци и валидациите им, анализ на рисковете** |\n| 4. **Избор на архитектура** | развитие на връзките, прецизиране на модели, проверка на риска |\n| 5. **Окончателна архитектура** | **избор на топология, технология, тип оборудване**, връзки между компонентите, архитектурни ограничения, валидации, прецизиране на риска |\n| 6. **Избор на дизайн** | производители, ISPs, **планове на трасетата**, прецизиране на модела и риска |\n| 7. **Окончателен дизайн** | избор на производител и ISP, на оборудване; **конфигуриране; чертежи; план на компонентите**; ограничения в дизайна; валидации; премерване на риска |\n\n### Цикъл на проектиране (8 стъпки)\n1. **Дефиниране на заданието в термините на потребителя**\n2. **Предефиниране на заданието в термините на проектанта**\n3. **Разработване на общи спецификации**\n4. **Предлагане на алтернативни оферти**\n5. **Избор на най-добрата по цена/производителност**\n6. **Проверка за пълно покриване на заданието**\n7. **Предефиниране и добавяне на нови спецификации**\n8. **Продължаване на процеса до достигане на решение**\n\n### Цена\n- **Цена на притежаване** — **началните разходи** за **проектиране, изграждане и тестване** на мрежата.\n- **Цена на използване** — **ежемесечните разходи** за **наети устройства, наети линии, гаранционна и извънгаранционна поддръжка, персонал** и др.\n\n### Производителност\n- Търси се **баланс между производителността и цената**: по-големите и по-сложни компоненти са по-скъпи от по-малките и по-слабите.\n- **Намаляване на трафика** чрез:\n  - **дублиране на приложения и данни** на локални и отдалечени места — **допълнителните лицензи са по-евтини от мрежови устройства и наети линии**;\n  - данните, за които **не е необходима синхронизация**, да се обновяват **в неработно време при слаб трафик**.\n\n### Критерии за производителност\n- **Работно време на даден компонент** — зависи от **температурна среда, ел. захранване, влажност, механично закрепване** и др.\n- **Нива на трафика** — **максимален и среден**.\n- **Закъснения и латентност** — **сумарното време**, необходимо за предаване на данните **през всяко средство за пренос по мрежовия път**.\n- **Ниво на използване на ресурсите** — **процесор и памет на маршрутизаторите**, **използване на капацитета на преносната среда**.\n\n### Гъвкавост\n- Да се задоволят съществуващите изисквания; **да не се надхвърля бюджетът**; да се осигури **възможност за по-нататъшно разширение**.\n- **Маршрутизаторите** се подменят **трудно**, амортизират се **за поне 5 години** като капиталовложение → ако нуждите ще нараснат, се взема маршрутизатор, **позволяващ разширение (памет, интерфейси, процесори)**.\n- **Средствата за пренос** се заменят **относително лесно** — **по-кратък амортизационен срок**, а ако са наети — лесно се заменят с други.\n\n### Последователност при логическо проектиране\n1. **Избор на топология и метод на достъп**\n2. **Избор на колизионни домейни** — **по възможност да са малки**\n3. **Избор на мрежови устройства**:\n   - **активни** — повторители, концентратори, комутатори, маршрутизатори, **хардуерни защитни стени**;\n   - **пасивни** — **розетки, инсърти, пач панели**…\n4. **Избор на тип на кабелите** — **съобразно избраната физическа топология**\n5. **Избор на местоположение и тип на хардуера за сървъри**, разположение на базите данни и другите поделени ресурси\n\n### Идеен и технически проект\n- **Идейният проект** се създава **на база на логическото планиране** — за физическото изграждане; **предхожда работния проект**. **Не е задължително** да се стигне до работен проект, нито до реализация.\n- **Техническият проект съдържа**: избор на **сървърно помещение**, главно помещение за мрежови устройства и допълнителни (или само места за разпределителни шкафове); **входове на доставчици** на телефонни и интернет услуги; **изводи към розетки** за работни места; **кабелни трасета**; **обяснителна записка и спецификация** за типа, броя и вида на компонентите и материалите.\n- Идейният, работният и техническият проект **не са предмет на детайлно представяне** в дисциплината.\n\n### Планиране на локална мрежа\n- **Избор на методология за достъп до ресурса** — **начинът, по който се поделят ресурсите**.\n- **Избор на топология** — **физическото подреждане на кабелите и активните устройства** (концентратори, комутатори…).\n- **Избор на брой и вид на основни и вторични ресурси**.\n\n| Вид ресурс | Определение | Примери |\n|---|---|---|\n| **Основни** | **директно** осъществяват достъп до други устройства или другите имат достъп до тях | **сървър** (хост на споделени ресурси — **приложни, файлови, печатни**), **клиенти** (достъпват ресурси на сървърите), **принтери, директно свързани в мрежата** |\n| **Вторични** | външни устройства, достъпни чрез мрежата, но **свързани към някой основен ресурс** — това свързване се нарича **slaving** | HDD, CD ROM, DVD, **лентови устройства**, скенер, принтер… |\n\n- При топология **„клиент/сървър“**: избира се **броят на сървърите и предназначението им** и **местоположението им** така, че да улеснява: **централно управление на сигурността**, **резервиране на захранването**, **гарантиране на производителността**, **централизиране на администрирането** (паролите и акаунтите се проверяват централно, back-up копия постоянно и надеждно), **лесна мащабируемост**.\n\n### 2 етап — Изграждане: европейски стандарти (DIN EN)\n| Стандарт | Област |\n|---|---|\n| **DIN EN 50173-1** | **Office area** (офиси) — централният стандарт |\n| **DIN EN 50173-2** | **SoHo** |\n| **DIN EN 50173-3** | **Industrial area** (индустриални) |\n| **DIN EN 50288** | **Symmetrical cable** (симетрични кабели): **50288-2-1** екраниран до **100 MHz**, **50288-5-1** до **250 MHz**, **50288-4-1** до **600 MHz** |\n| **DIN EN 60603-7** | **Connectors** (конектори): **60603-7-3** до **100 MHz**, **60603-7-5** до **250 MHz**, **60603-7-7** до **600 MHz** |\n| **DIN EN 50310** | **Potential Equalization and Grounding** (изравняване на потенциалите и заземяване) |\n| **DIN EN 50174** | **Construction and Operation**: **Part 1** — Specification and Quality Control; **Part 2** — Installation Design and Practices **in Buildings**; **Part 3** — … **in Outdoor** |\n\n### Планиране на структурното окабеляване\n- Къде да се разположат: **комуникационното помещение (wiring closet)**, **MDF — Main Distribution Facility**, **IDF — Intermediate Distribution Facility**.\n- **Хоризонталното окабеляване** се свързва в **централна точка в wiring closet** в **star (звезда)** топология. Там са **hubs, patch панелите** и цялото оборудване (с мисъл за разрастване).\n- **Всеки етаж — поне 1 wiring closet**; допълнителен се добавя **на всеки 1000 m²** или ако **хоризонталното окабеляване надхвърли 90 m**.\n- Схема: Host → patch cable → **wall socket** → horizontal cable → **patch panel** в telecommunications room → комутатор; помещенията на етажите се свързват с **vertical cable**.\n\n### Изисквания към помещението за мрежово оборудване\n| Параметър | Изискване |\n|---|---|\n| Материали | стени, таван, под — **шперплат 20 mm**, дърво, **без прах и статично електричество** |\n| Температура / влажност | **около 21 °C**, **30–50 %** |\n| Осветление | **min 500 lx**, на **min 2.6 m** от пода |\n| Захранване | силнотоково и **резервно** |\n| Врата | **≥ 90 cm**, **отваря се навън** |\n| Около rack-а | **зад — поне 48 cm** до стената; **отпред — поне 76.2 cm** |\n| Стандартно оборудване | **1.8 m × 0.74 m × .066 m** (така на слайда) |\n| Кабели MDF → IDF | в **пластмасови тръби 10.2 cm** в **двойния под** |\n\n### Вертикално окабеляване\n- Свързва се в топология **разширена звезда (extended star)**.\n- Състои се от: **backbone окабеляване**; **cross-connections** връзки в IDF и MDF; **backbone-to-backbone cross-connections**; кабели **между wiring closets и различните етажи**; кабели **между MDF и POP**; кабели **между сградите** в компанията.\n\n### Документация на мрежата\n- Дневник на дейността; **логическа и физическа топология**; работни листи; номериране на изводите; **номериране на кабелите (TIA/EIA-606)**; кратък опис на изводите и кабелите; кратък опис на устройствата (+ конфигурация и хронологични промени); **схема на MAC и IP адресите**.\n- **Цел на документирането — да се осигури преходност на мрежата.**\n- **Текуща документация**: диаграма на кабелните трасета и устройства; текущо конфигуриране на всяко устройство; **съхранение на централно място на всички хардуерни и софтуерни ръководства**; система за следене кой и къде ги ползва; **хронологично описание на всяка промяна** (хардуерна или софтуерна); **носители с конфигурациите и архив на базите данни** за бързо възстановяване при срив.\n\n### 3 етап — Мрежово администриране\n- Състои се от **планиране, конфигуриране и управление на елементите на мрежата**. Започва **от възникването на необходимостта от мрежа до текущата ѝ експлоатация** (подробно — в дисциплината „АЛИМ“).\n- **На етапа на планиране** администрирането е: **избор на мрежовия дизайн**; **правилен избор на хардуер и софтуер** (адекватни на текущите нужди и позволяващи развитие); **документиране на жизнения цикъл на мрежата**.\n- **Основни задачи**:\n  - **Конфигуриране** на хардуерни устройства;\n  - **Наблюдение** — обобщена информация за хардуера, компонентите и софтуера; преглед и конфигуриране на дискови и сменяеми устройства;\n  - **Управляване** — **сесиите и конекциите** на потребителите; използването на файлове, директории и поделени обекти; приложения и мрежови услуги; **административни сигнали за предупреждение**; **опции за стартиране и възстановяване**.\n\n### Наблюдение на сървърите\n- За да **се отстраняват проблемите** (напр. при свързване на потребителите; **сървърът се спира само в изключителни случаи**) и да **се подобри производителността** — по-добри входно-изходни дискови операции, **по-малко използване на процесора**, **по-малко мрежов трафик** от/към сървъра.\n- Прави се чрез: **броячи на производителността**, **филтри** за събираната информация, **записване в дневници** за анализ.\n\n### Дисково пространство\n- **Сървър**: няколко HDD, обединени в **томове (в Novell)** или **RAID масиви (Windows и Linux)**; високонадеждни и скоростни дискове; сървърната ОС дава **локална система за сигурност** на файловете и директориите; защита от **загуби** (напр. токов удар) и **неправомерен достъп**.\n- **Работни станции**: **мястото на ОС — достъп само за администратора**; мястото на приложенията — кой до кое приложение има достъп, **потребителите да ги ползват, но не и да ги променят**; мястото за данните — права за запис, създаване, промяна. Варианти: всички файлове в една директория или **структурирани по предназначение** (Work, Lib, Temp, Daily…); при структурирането се планира защитата от неоторизиран достъп.\n\n### Споделяне на файлове и сигурност\n- Зависи от **мрежовата ОС**: **в Windows по подразбиране не се споделя нищо** (трябва да се създадат споделени ресурси — sharing); **в NetWare по подразбиране са споделени всички ресурси**.\n- Два начина за контрол на достъпа:\n\n| | **Ниво споделен ресурс** | **Ниво потребител** |\n|---|---|---|\n| Къде | **Peer-to-peer мрежи** | **средни и големи мрежи** (по-лесно управление) |\n| Как | **парола за ресурса**, въвежда се при всяко ползване | **user account с парола** + **access control list (ACL)** на всеки ресурс — ако акаунтът е в списъка, се дава достъп |\n| Проблем / предимство | при много потребители и ресурси — трудно „раздаване“ на паролите; документира се кой ресурс с каква парола е | **по-голяма сигурност**, лесно се проследява кой достъпва ресурсите; **всеки помни само една парола** |\n\n- **Мрежови акаунти**: **потребителски, групови, компютърни**.\n\n### Капани за изпита\n- **Изграждането** се дели на **физическо и логическо** — не на „хоризонтално и вертикално“ (това е окабеляването).\n- **Мрежов анализ** → какво очакват потребителите; **архитектура** → END-TO-END, технология и топология; **дизайн** → чертежи, производители, оборудване, ISP. Изборът на **топология и технология** е в **окончателната архитектура**, а **производители/ISP и трасета** — в **дизайна**.\n- **ОПП** — самостоятелно само **4 и 5** категория; **1, 2, 3** — в съавторство с **ППП**. Категорията → **ЗУТ** (не БДС, не КИИП).\n- **Цена на притежаване** = начални разходи; **цена на използване** = ежемесечни. Лесно се разменят.\n- **Маршрутизаторите** — трудно се сменят, **≥ 5 години** амортизация; **средствата за пренос** — лесно, по-кратък срок.\n- Колизионните домейни — **малки**, не големи.\n- **Пасивни** компоненти: розетки, инсърти, **пач панели**; хардуерната **защитна стена е активен** компонент.\n- **Вторичен** ресурс = свързан към основен (**slaving**); принтер може да е **основен** (директно в мрежата) или **вторичен**.\n- **Хоризонтално** окабеляване → **звезда**; **вертикално** → **разширена звезда**.\n- Числа: допълнителен wiring closet на **1000 m²** или при хоризонтално окабеляване **> 90 m**; **21 °C**, **30–50 %**; **500 lx** на **2.6 m**; врата **≥ 90 cm, навън**; **48 cm** зад rack-а, **76.2 cm** отпред; тръби **10.2 cm**; шперплат **20 mm**.\n- Слайдът пише температурата като „210С“ — това е изгубен горен индекс: **21 °C**. Размерът „.066 m“ също е така на слайда.\n- **TIA/EIA-606** — за **номериране на кабелите**.\n- Цел на документирането — **преходност** на мрежата.\n- **Windows** — по подразбиране **нищо** не е споделено; **NetWare** — **всичко** е споделено. **Томове — Novell**, **RAID — Windows и Linux**.\n- **Ниво споделен ресурс** → peer-to-peer, парола на ресурс; **ниво потребител** → акаунт + **ACL**, една парола на потребител.\n- DIN EN: **50173-1 Office**, **-2 SoHo**, **-3 Industrial**; **50288** кабели, **60603-7** конектори, **50310** заземяване, **50174** изграждане и експлоатация. Суфиксите за 100/250/600 MHz са различни за кабели (**2-1/5-1/4-1**) и конектори (**7-3/7-5/7-7**).\n- На слайда за ОПП има излишно „и а“ („4 и 5 категории и а за обекти от 1,2 и 3“) — смисълът е „а за обекти от 1, 2 и 3 — само в съавторство“.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L07-A-1","n":1,"text":"Коя е правилната последователност на етапите за създаване на компютърна мрежа?","opts":["Проектиране → Администриране → Изграждане","Проектиране → Изграждане → Администриране","Изграждане → Проектиране → Администриране","Администриране → Проектиране → Изграждане"],"correct":1,"expl":"Етапите са: 1. Проектиране, 2. Изграждане (физическо и логическо), 3. Администриране."},{"id":"L07-A-2","n":2,"text":"Какво означава съкращението **КИИП**?","opts":["Камара на инженерите по информационно проектиране","Комисия за инженерни и информационни проекти","Комитет по изграждане на инфраструктурни проекти","Камара на инженерите в инвестиционното проектиране"],"correct":3,"expl":"КИИП — Камара на инженерите в инвестиционното проектиране."},{"id":"L07-A-3","n":3,"text":"Коя дейност разработва концептуална END-TO-END структура от високо ниво, избирайки технология и топология на мрежата?","opts":["Мрежовият анализ","Логическото планиране","Мрежовият дизайн","Мрежовата архитектура"],"correct":3,"expl":"Архитектурата е END-TO-END структура от високо ниво с избор на технология и топология."},{"id":"L07-A-4","n":4,"text":"Коя стъпка в цикъла на проектиране следва непосредствено **предлагането на алтернативни оферти**?","opts":["Проверка за пълно покриване на заданието","Разработване на общи спецификации","Избор на най-добрата по цена/производителност","Предефиниране и добавяне на нови спецификации"],"correct":2,"expl":"Ред: … общи спецификации → алтернативни оферти → избор на най-добрата → проверка за покриване на заданието …"},{"id":"L07-A-5","n":5,"text":"Кое твърдение за средствата за пренос е вярно (по отношение на гъвкавостта)?","opts":["Заменят се относително лесно и имат по-кратък амортизационен срок","Не могат да бъдат наемани от външни доставчици, а само закупувани","Трябва да позволяват разширение на памет и интерфейси","Подменят се трудно и се амортизират поне 5 години, като маршрутизаторите"],"correct":0,"expl":"За разлика от маршрутизаторите, средствата за пренос се заменят лесно, а наетите — още по-лесно."},{"id":"L07-A-6","n":6,"text":"Кой от изброените е **основен** ресурс на локалната мрежа?","opts":["Скенер, свързан към работна станция","Лентово устройство на сървъра","Принтер, директно свързан в мрежата","Твърд диск, свързан към сървър"],"correct":2,"expl":"Основни са сървъри, клиенти и принтери, директно свързани в мрежата; останалите са вторични."},{"id":"L07-A-7","n":7,"text":"Кой стандарт е за екранирани симетрични кабели до **600 MHz**?","opts":["DIN EN 50288-5-1","DIN EN 50288-4-1","DIN EN 50288-2-1","DIN EN 60603-7-7"],"correct":1,"expl":"50288-2-1 — 100 MHz, 50288-5-1 — 250 MHz, 50288-4-1 — 600 MHz; 60603-7-7 е за конектори."},{"id":"L07-A-8","n":8,"text":"Какво разстояние трябва да има **зад** rack-а до стената?","opts":["Поне 90 cm","Поне 48 cm","Поне 10.2 cm","Поне 76.2 cm"],"correct":1,"expl":"Зад rack-а — поне 48 cm; отпред — поне 76.2 cm; вратата — ≥ 90 cm."},{"id":"L07-A-9","n":9,"text":"Как се наричат обединените твърди дискове на сървър в **Novell**?","opts":["Томове","RAID масиви","Колизионни домейни","Дялове за споделяне"],"correct":0,"expl":"В Novell дисковете се обединяват в томове, а в Windows и Linux — в RAID масиви."},{"id":"L07-A-10","n":10,"text":"Чрез какво се извършва наблюдението на сървърите?","opts":["Броячи на производителността, филтри и записване в дневници","Пач панели, розетки, инсърти и кабелни трасета","Наети линии, резервно захранване и климатизация","Томове, RAID масиви и лентови устройства за архив"],"correct":0,"expl":"Наблюдението става чрез броячи на производителността, филтри за информацията и дневници за анализ."}],"B":[{"id":"L07-B-1","n":1,"text":"На какви подетапи се разделя етапът **Изграждане** на компютърна мрежа?","opts":["Хоризонтално и вертикално","Идейно и техническо","Активно и пасивно","Физическо и логическо"],"correct":3,"expl":"Изграждането бива физическо и логическо; хоризонтално/вертикално се отнася за окабеляването."},{"id":"L07-B-2","n":2,"text":"Какво става, ако проектантът, създал проекта, не членува в КИИП?","opts":["Проектът се приема след съгласуване с общината по реда на ЗУТ","Проектът е валиден само за обекти от 4 и 5 категория по ЗУТ","Проектът е незаконен и не може да се представи пред проверяващите органи","Проектът е валиден, но трябва да бъде заверен допълнително от БИС"],"correct":2,"expl":"Без членство в КИИП проектът е незаконен."},{"id":"L07-B-3","n":3,"text":"Изборът на конкретни производители на оборудването, чертежите и избора на ISP са част от:","opts":["мрежовия анализ","входа на процеса на проектиране","мрежовия дизайн","мрежовата архитектура"],"correct":2,"expl":"Мрежовият дизайн осигурява физическите детайли — чертежи, производители, оборудване, ISP."},{"id":"L07-B-4","n":4,"text":"Ежемесечните разходи за наети устройства, наети линии, поддръжка и персонал се отнасят към:","opts":["цената на използване","цената на притежаване","амортизационния срок","цената на проектиране"],"correct":0,"expl":"Цената на използване са ежемесечните разходи; цената на притежаване — началните."},{"id":"L07-B-5","n":5,"text":"С коя стъпка започва последователността при логическо проектиране?","opts":["Избор на тип на кабелите","Избор на мрежови устройства","Избор на колизионни домейни","Избор на топология и метод на достъп"],"correct":3,"expl":"Първо се избират топология и метод на достъп, след това колизионни домейни, устройства, кабели, сървъри."},{"id":"L07-B-6","n":6,"text":"Как се нарича свързването на вторичен ресурс към някой от основните ресурси?","opts":["Sharing","Slaving","Mapping","Cross-connection"],"correct":1,"expl":"Вторичните ресурси са свързани към основен ресурс — това се нарича slaving."},{"id":"L07-B-7","n":7,"text":"Какво означава съкращението **IDF**?","opts":["Main Distribution Facility","Intermediate Distribution Facility","Interconnect Device Frame","Internal Data Facility"],"correct":1,"expl":"IDF — Intermediate Distribution Facility; MDF — Main Distribution Facility."},{"id":"L07-B-8","n":8,"text":"Кое НЕ е част от вертикалното окабеляване?","opts":["Кабелите между сградите в компанията","Кабелите между MDF и POP","Patch кабелът от розетката до работната станция","Backbone-to-backbone cross-connections връзките"],"correct":2,"expl":"Вертикалното включва backbone, cross-connections, кабели между етажи, MDF–POP и между сградите."},{"id":"L07-B-9","n":9,"text":"Кое е вярно за споделянето на ресурси по подразбиране?","opts":["В Windows не се споделя нищо, а в NetWare са споделени всички ресурси","И в Windows, и в NetWare по подразбиране не се споделя нищо","В Windows по подразбиране са споделени всички ресурси, а в NetWare — нищо","И в Windows, и в NetWare са споделени всички ресурси"],"correct":0,"expl":"В Windows трябва изрично да се създадат споделени ресурси; в NetWare всичко е споделено."},{"id":"L07-B-10","n":10,"text":"Какво е изискването към вратата на помещението за мрежово оборудване?","opts":["Широка поне 120 cm и да е плъзгаща","Широка поне 90 cm и да се отваря навън","Широка поне 76.2 cm и да се отваря навътре","Широка поне 48 cm и да се отваря навън"],"correct":1,"expl":"Вратата трябва да е ≥ 90 cm и да се отваря навън."}],"C":[{"id":"L07-C-1","n":1,"text":"Защо няма „най-добра“ физическа топология и мрежова операционна система?","opts":["Стандартите за компютърни мрежи се променят и допълват всяка година","Производителите на оборудване не спазват едни и същи стандарти","Законите в България не позволяват единен избор на топология и ОС","Всяка компания, мрежа и администратор са различни и имат специфични нужди"],"correct":3,"expl":"Причината е, че компаниите, мрежите и администраторите имат различни, специфични нужди."},{"id":"L07-C-2","n":2,"text":"Обекти от кои категории може **самостоятелно** да проектира проектант с **ограничена** проектантска правоспособност (ОПП)?","opts":["Само от 1, 2 и 3 категория","Само от 5 категория","Само от 4 и 5 категория","От всички категории"],"correct":2,"expl":"С ОПП самостоятелно — 4 и 5 категория; 1, 2 и 3 — само в съавторство с колега с ППП."},{"id":"L07-C-3","n":3,"text":"Коя е правилната последователност от мрежовия анализ до окончателния дизайн?","opts":["Анализ → избор на архитектура → избор на дизайн → окончателна архитектура → окончателен дизайн","Анализ → окончателна архитектура → избор на архитектура → окончателен дизайн → избор на дизайн","Анализ → избор на дизайн → окончателен дизайн → избор на архитектура → окончателна архитектура","Анализ → избор на архитектура → окончателна архитектура → избор на дизайн → окончателен дизайн"],"correct":3,"expl":"След анализа и резултата от него се избира и финализира архитектурата, след това — дизайнът."},{"id":"L07-C-4","n":4,"text":"Кое НЕ е критерий за производителност на мрежата?","opts":["Брой на потребителските акаунти","Закъснения и латентност","Нива на трафика","Работно време на даден компонент"],"correct":0,"expl":"Критериите са работно време, нива на трафика, закъснения/латентност и ниво на използване на ресурсите."},{"id":"L07-C-5","n":5,"text":"Кой от изброените е **пасивен** мрежов компонент?","opts":["Повторител","Хардуерна защитна стена","Пач панел","Комутатор"],"correct":2,"expl":"Пасивни са розетки, инсърти, пач панели; останалите са активни."},{"id":"L07-C-6","n":6,"text":"При топология „клиент/сървър“ местоположението на сървърите се избира така, че да улеснява всичко изброено, ОСВЕН:","opts":["гарантирането на производителността и лесната мащабируемост","резервирането на захранването на сървърите","децентрализираната проверка на паролите на всяка работна станция","централното управление на сигурността на мрежата"],"correct":2,"expl":"Целта е централизиране на администрирането — паролите и акаунтите се проверяват централно."},{"id":"L07-C-7","n":7,"text":"В каква топология се свързва **хоризонталното** окабеляване в wiring closet?","opts":["Обща шина","Звезда (star)","Разширена звезда","Пръстен"],"correct":1,"expl":"Хоризонталното окабеляване е звезда с централна точка в wiring closet; вертикалното — разширена звезда."},{"id":"L07-C-8","n":8,"text":"Кой стандарт се посочва за номериране на използваните кабели в документацията на мрежата?","opts":["DIN EN 50174","DIN EN 50173-1","IEEE 802.3","TIA/EIA-606"],"correct":3,"expl":"Номерирането на кабелите е по TIA/EIA-606."},{"id":"L07-C-9","n":9,"text":"В какви мрежи се използва **сигурност на ниво споделен ресурс**?","opts":["Само в мрежи с NetWare","В peer-to-peer мрежи","В големи мрежи клиент/сървър","В мрежи с access control list"],"correct":1,"expl":"При ниво споделен ресурс се задава парола за ресурса — използва се в peer-to-peer мрежи."},{"id":"L07-C-10","n":10,"text":"От какво се състои мрежовото администриране?","opts":["Планиране, конфигуриране и управление на елементите на мрежата","Проектиране, изграждане и тестване на всички елементи на мрежата","Хоризонтално, вертикално и backbone окабеляване на мрежата","Анализ, архитектура и дизайн на елементите на мрежата"],"correct":0,"expl":"Администрирането е планиране, конфигуриране и управление; започва от възникването на нуждата от мрежа до експлоатацията ѝ."}],"D":[{"id":"L07-D-1","n":1,"text":"Каква е целта на проектирането на компютърна мрежа?","opts":["Успешно интегриране на техническите компоненти до производителност, съответстваща или надвишаваща очакванията на потребителите","Изготвяне на всички чертежи и спецификации, необходими за представяне на проекта пред проверяващите органи","Избор на един производител за цялото активно и пасивно мрежово оборудване, за да се осигури пълна съвместимост","Постигане на минимална цена на притежаване и на използване на мрежата, независимо от постигнатата производителност"],"correct":0,"expl":"Целта е интеграция на компонентите с производителност, съответстваща или надвишаваща изискванията."},{"id":"L07-D-2","n":2,"text":"Къде е определено от коя категория е даден обект?","opts":["В Българския държавен стандарт (БДС)","В Закона за устройство на територията (ЗУТ)","В стандарта TIA/EIA-606","В правилника на КИИП"],"correct":1,"expl":"Категорията на обекта се определя от ЗУТ."},{"id":"L07-D-3","n":3,"text":"„Изисквания, услуги, информация за местоположението, трафикопотоци и валидациите им, анализ на рисковете“ — това е:","opts":["входът на процеса","изборът на дизайн","окончателната архитектура","резултатът от мрежовия анализ"],"correct":3,"expl":"Това е съдържанието на стъпката „Резултат от него“ след мрежовия анализ."},{"id":"L07-D-4","n":4,"text":"Как се нарича сумарното време, необходимо за предаване на данните през всяко средство за пренос по мрежовия път?","opts":["Закъснения и латентност","Ниво на използване на ресурсите","Работно време на компонента","Ниво на трафика"],"correct":0,"expl":"Това е дефиницията на закъсненията и латентността."},{"id":"L07-D-5","n":5,"text":"Кое НЕ е част от съдържанието на техническия проект?","opts":["Входовете на доставчиците на телефонни и интернет услуги","Кабелните трасета","Обяснителна записка и спецификация на компонентите","Потребителските акаунти и паролите им"],"correct":3,"expl":"Техническият проект съдържа помещения, входове на доставчици, изводи, трасета, записка и спецификация."},{"id":"L07-D-6","n":6,"text":"За какви обекти се отнася стандартът **DIN EN 50173-3**?","opts":["За изграждане и експлоатация (Construction and Operation)","За индустриални помещения (Industrial area)","За малки офиси и домове (SoHo)","За офиси (Office area)"],"correct":1,"expl":"50173-1 — Office, 50173-2 — SoHo, 50173-3 — Industrial."},{"id":"L07-D-7","n":7,"text":"Кога на един етаж се добавя допълнителен wiring closet?","opts":["На всеки 1000 m² или ако хоризонталното окабеляване надхвърли 90 m","На всеки 100 работни места или при повече от 24 порта","Само ако на етажа има сървърно помещение","На всеки 500 m² или ако хоризонталното окабеляване надхвърли 100 m"],"correct":0,"expl":"Всеки етаж има поне 1 wiring closet; допълнителен — на 1000 m² или при хоризонтално окабеляване > 90 m."},{"id":"L07-D-8","n":8,"text":"Каква е целта на документирането на мрежата?","opts":["Да се увеличат колизионните домейни","Да се намали цената на притежаване","Да се определи категорията на обекта","Да се осигури преходност на мрежата"],"correct":3,"expl":"Целта на документирането е преходност на мрежата."},{"id":"L07-D-9","n":9,"text":"Чрез какво се разрешава достъпът до споделен ресурс при **сигурност на ниво потребител**?","opts":["Чрез отделна парола за всеки ресурс, въвеждана при всяко ползване","Чрез споделяне на всички ресурси по подразбиране","Чрез списък за контрол на достъпа (access control list)","Чрез регистрация на компютъра в КИИП"],"correct":2,"expl":"Ако акаунтът е в ACL на ресурса, се дава достъп; всеки потребител помни само една парола."},{"id":"L07-D-10","n":10,"text":"Кой има достъп до мястото на операционната система на работните станции?","opts":["Всички потребители с право на запис","Всички членове на груповия акаунт","Само администраторът","Потребителите, но без право на промяна"],"correct":2,"expl":"Мястото на ОС е достъпно само за администратора; приложенията потребителите ползват, но не променят."}],"E":[{"id":"L07-E-1","n":1,"text":"Кое НЕ е посочено сред факторите, които определят как изглежда и работи една компютърна мрежа?","opts":["Камарата на инженерите в инвестиционното проектиране","Наредбите","Добрите практики","Производителят на мрежовото оборудване"],"correct":3,"expl":"Посочени са стандарти, организации за стандартизация, закони, правилници, наредби, КИИП и добри практики."},{"id":"L07-E-2","n":2,"text":"Коя дейност определя какво потребителите, техните приложения и устройства очакват от мрежата и връзките между тях?","opts":["Техническият проект","Мрежовата архитектура","Мрежовият анализ","Мрежовият дизайн"],"correct":2,"expl":"Мрежовият анализ определя очакванията и връзките и така — архитектурата и дизайна."},{"id":"L07-E-3","n":3,"text":"С коя стъпка започва цикълът на проектиране?","opts":["Разработване на общи спецификации","Предлагане на алтернативни оферти","Предефиниране на заданието в термините на проектанта","Дефиниране на заданието в термините на потребителя"],"correct":3,"expl":"Първата стъпка е дефиниране на заданието в термините на потребителя, втората — в термините на проектанта."},{"id":"L07-E-4","n":4,"text":"От какво зависи **работното време** на даден мрежов компонент?","opts":["От температурната среда, ел. захранването, влажността и механичното закрепване","От броя на потребителите и приложенията, свързани към компонента","От натоварването на процесора и паметта на маршрутизаторите в мрежата","От максималния и средния трафик, който преминава през компонента"],"correct":0,"expl":"Работното време зависи от условията на средата — температура, захранване, влажност, закрепване."},{"id":"L07-E-5","n":5,"text":"Какво се разбира под **топология на мрежата** при планиране на локална мрежа?","opts":["Броят и видът на основните и вторичните ресурси","Начинът, по който се поделят ресурсите на мрежата","Физическото подреждане на кабелите и активните устройства","Схемата на MAC и IP адресите"],"correct":2,"expl":"Топологията е физическото подреждане; начинът на поделяне на ресурсите е методологията за достъп."},{"id":"L07-E-6","n":6,"text":"Кой европейски стандарт се отнася за изравняване на потенциалите и заземяването?","opts":["DIN EN 50310","DIN EN 50288","DIN EN 60603-7","DIN EN 50174"],"correct":0,"expl":"50310 — Potential Equalization and Grounding; 50288 — кабели; 60603-7 — конектори; 50174 — изграждане и експлоатация."},{"id":"L07-E-7","n":7,"text":"Какви температура и влажност се изискват в помещението за мрежово оборудване?","opts":["Около 18 °C и 50–70 %","Около 21 °C и 30–50 %","Около 21 °C и 60–80 %","Около 25 °C и 10–30 %"],"correct":1,"expl":"Изискването е около 21 °C и влажност 30–50 %."},{"id":"L07-E-8","n":8,"text":"Настройването на административни сигнали за предупреждение е част от:","opts":["наблюдението на мрежата","конфигурирането на хардуерните устройства","управляването на мрежата","логическото проектиране"],"correct":2,"expl":"Управляването включва сесии и конекции, файлове, приложения, сигнали за предупреждение, опции за стартиране и възстановяване."},{"id":"L07-E-9","n":9,"text":"Кой вид мрежови акаунти НЕ е посочен в лекцията?","opts":["Акаунти на споделени ресурси","Компютърни акаунти","Групови акаунти","Потребителски акаунти"],"correct":0,"expl":"Мрежовите акаунти са потребителски, групови и компютърни."},{"id":"L07-E-10","n":10,"text":"Кое е елемент на **текущата** документация на мрежата?","opts":["Удостоверението за проектантска правоспособност на проектанта","Носители с конфигурациите на устройствата и архив на базите данни","Категорията на обекта, определена според ЗУТ","Ценовите оферти на всички доставчици на мрежово оборудване"],"correct":1,"expl":"Текущата документация включва и носители с конфигурации и архив на БД за бързо възстановяване при срив."}]}},{"num":8,"title":"Лекция 8 — Мрежови протоколи и комуникации. OSI и TCP/IP модел","short":"Мрежови протоколи и комуникации. OSI и TCP/IP модел","summary":"### Основни моменти\n- **Мрежови протоколи**; **правила на комуникацията**; **OSI модел**; **TCP/IP модел**; **протоколни единици данни (PDU)**; **енкапсулация**.\n\n### Цел на мрежовите модели\n- Да представят **абстрактна концепция**.\n- Да опишат как работят компонентите на **мрежовата операционна система** и как се извършва **комуникацията между устройствата**.\n- Да помогнат при **разбирането и изучаването** на процеса на мрежова комуникация.\n- Да бъдат **следвани при разработване на нови мрежови продукти**.\n- Да служат като **еталон за сравнение** на мрежови продукти на различни производители.\n- Спазването им да осигурява **съвместимост** на мрежови компоненти на различни производители.\n\n### OSI и TCP/IP модел\n| № OSI | Слой на OSI (7 слоя) | Съответен слой на TCP/IP (4 слоя) |\n|---|---|---|\n| **7** | **Application** (приложен) | **4 Application** |\n| **6** | **Presentation** (представителен) | **4 Application** |\n| **5** | **Session** (сесиен) | **4 Application** |\n| **4** | **Transport** (транспортен) | **3 Transport** |\n| **3** | **Network** (мрежов) | **2 Internet** |\n| **2** | **Data link** (канален) | **1 Network Access** |\n| **1** | **Physical** (физически) | **1 Network Access** |\n\n- Номерацията е **отдолу нагоре**: Physical е **1**, Application е **7** (в TCP/IP — Network Access е **1**, Application е **4**).\n- **TCP/IP Application** обединява OSI **Application + Presentation + Session**; **Network Access** обединява **Data link + Physical**.\n\n### Протокол\n- **Мрежовият протокол** е **система от стандартни правила за обмяната на информация между процеси/компютри**, свързани в една компютърна мрежа, по начин, **гарантиращ успешната връзка** между две или повече крайни устройства.\n- **Протоколите дефинират**: обмяната на съобщения; **структурата** на съобщението; **формата** на съобщението; **кога и как се откриват грешки**; **как да се избере път** между устройствата; **как да се установява и прекратява сесията**.\n- Аспекти на протоколите (диаграмата на слайда): **Message Encoding**, **Message Formatting and Encapsulation**, **Message Size**, **Message Timing**, **Message Delivery Options**.\n\n### Формат на съобщението — PDU\n- Нарича се **protocol data unit (PDU)** — **единица информация, предавана между 2 устройства**.\n- Състои се от **специфична за протокола контролна информация** и **потребителски данни**:\n  - **Header** (служебна информация) — **адреси на сорса и дестинацията** и др.;\n  - **Данни**;\n  - **Trailer** (служебна информация) — **FCS** (на слайда: „за корекция на грешки“; по същество FCS служи за **откриване** на грешки).\n- Пример за формат на кадър: **Destination** (physical/hardware address), **Source** (physical/hardware address) — заедно **Frame Addressing**; **Start Flag** (start of message indicator), **Recipient** (destination identifier), **Sender** (source identifier), **Encapsulated Data** (bits) — **Encapsulated Message**; **End of Frame** (end of message indicator).\n\n### Размер и timing на съобщението\n- **Размер**: източникът **разделя дълго съобщение** на части, отговарящи на **минималните и максималните изисквания за размер**; **всяка част има собствена адресна информация**; **получателят реконструира частите**, за да бъдат обработени и интерпретирани.\n- **Timing**: **метод за достъп (Access Method)**, **контрол на потока (Flow Control)**, **време за реакция (Response Timeout)**.\n\n### Видове съобщения (опции за доставка)\n| Вид | Получатели |\n|---|---|\n| **Unicast** | **един** конкретен получател |\n| **Multicast** | **група** от получатели |\n| **Broadcast** | **всички** устройства в мрежата |\n\n### Протоколно семейство\n- **Протоколно семейство** — **набор от комуникационни протоколи, които работят заедно**, за да предадат съобщението и да решат проблем по доставянето му.\n- Правила за съответния слой: **общ език**; **изчакване на ред за предаване**; **сигнал за завършване на предаването**.\n\n### Протоколни семейства по различни стандарти\n| Слой | **TCP/IP** | **ISO** | **AppleTalk** | **Novell NetWare** |\n|---|---|---|---|---|\n| Application | HTTP, DNS, DHCP, FTP | ACSE, ROSE, TRSE, SESE | **AFP** | **NDS** |\n| Transport | TCP, UDP | **TP0, TP1, TP2, TP3, TP4** | ATP, AEP, NBP, RTMP | **SPX** |\n| Internet | IPv4, IPv6, ICMPv4, ICMPv6 | CONP/CMNS, CLNP/CLNS | **AARP** | **IPX** |\n| Network Access | **Ethernet, PPP, Frame Relay, ATM, WLAN** (общи) | | | |\n\n### TCP/IP протоколно семейство\n| Слой | Протоколи (групи) |\n|---|---|\n| **Application** | Name System — **DNS**; Host Config — **BOOTP, DHCP**; Email — **SMTP, POP, IMAP**; File Transfer — **FTP, TFTP**; Web — **HTTP** |\n| **Transport** | **UDP, TCP** |\n| **Internet** | **IP, NAT**; IP Support — **ICMP**; Routing Protocols — **OSPF, EIGRP** |\n| **Network Access** | **ARP, PPP, Ethernet, Interface Drivers** |\n\n### Протоколен стек и енкапсулация\n- Пример: уеб сървър → **HTTP** (Application) / **TCP** (Transport) / **IP** (Internet) / **Ethernet** (Network Access).\n- **Енкапсулация**: User Data → **HTTP Data** (+ HTTP header) → **TCP Segment** (+ TCP header) → **IP Packet** (+ IP header) → **Ethernet Frame** (Ethernet header + trailer).\n- **В сорса** данните се предават **отгоре надолу** (енкапсулация), **в дестинацията — отдолу нагоре** (декапсулация).\n\n| Слой на TCP/IP | PDU |\n|---|---|\n| 4 **Application** | **Данни** |\n| 3 **Transport** | **Сегменти** |\n| 2 **Internet** | **Пакети** |\n| 1 **Network Access** | **Фреймове (кадри)**, а в средата — **битове 0/1** |\n\n### PDU и нива на адресиране\n- PDU = **Header + Data**.\n\n| Слой (OSI) | Адресиране в header-а |\n|---|---|\n| 4 **Transport** | **Номера на портове** |\n| 3 **Network** | **Логически адреси** (IP) |\n| 2 **Data link** | **Физически адреси** (MAC) |\n| 1 **Physical** | **Timing и синхронизация** |\n\n- **Socket = IP address + port number**.\n\n### Капани за изпита\n- OSI има **7** слоя, TCP/IP (в лекцията) — **4**. **Transport** е **4** в OSI, но **3** в TCP/IP; **Application** е **7** в OSI и **4** в TCP/IP.\n- **Internet** слоят на TCP/IP отговаря на OSI **Network** (3), не на Transport.\n- **Network Access** = Data link + Physical; **Application (TCP/IP)** = Application + Presentation + Session.\n- **Header** — адреси на сорса и дестинацията; **trailer** — **FCS**. Слайдът пише „FCS за **корекция** на грешки“ — точно е **откриване** на грешки (FCS не коригира).\n- **Сегмент** — Transport; **пакет** — Internet/Network; **кадър (фрейм)** — Network Access/Data link; **битове** — физическата среда. Не бъркай пакет и сегмент.\n- **Портове** → Transport; **логически (IP)** → Network; **физически (MAC)** → Data link; **timing и синхронизация** → Physical.\n- **Socket** = IP адрес + **номер на порт** (не MAC).\n- Timing на съобщението: **Access Method, Flow Control, Response Timeout** — енкапсулацията и кодирането са **отделни** аспекти.\n- **Multicast** = група, **broadcast** = всички, **unicast** = един.\n- **SPX** (Transport) и **IPX** (Internet) — Novell; **AFP**, **AARP** — AppleTalk; **TP0–TP4** — ISO.\n- В диаграмата на TCP/IP семейството **ARP** е поставен в **Network Access**, а **ICMP, NAT, OSPF, EIGRP** — в **Internet**; **BOOTP и DHCP** са „Host Config“, **TFTP** е за file transfer, а не за email.\n- В таблицата за енкапсулация „битове 0/1“ стоят на реда на Network Access, защото в TCP/IP той включва и физическото предаване.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L08-A-1","n":1,"text":"От колко слоя се състои OSI моделът?","opts":["7","5","4","6"],"correct":0,"expl":"OSI моделът има 7 слоя — от Physical (1) до Application (7)."},{"id":"L08-A-2","n":2,"text":"Кои слоеве на OSI модела съответстват на слоя **Application** на TCP/IP модела?","opts":["Само Application","Application, Presentation и Session","Application и Presentation","Application, Session и Transport"],"correct":1,"expl":"TCP/IP Application обединява трите горни слоя на OSI."},{"id":"L08-A-3","n":3,"text":"Какво осигурява спазването на мрежовите модели?","opts":["Съвместимост на мрежови компоненти на различни производители","Независимост от използваната мрежова операционна система","Най-ниска цена на мрежовите компоненти и на поддръжката им","Липса на грешки при предаването на данни"],"correct":0,"expl":"Спазването на моделите осигурява съвместимост между производителите."},{"id":"L08-A-4","n":4,"text":"Какво представлява PDU?","opts":["Правило за изчакване на ред за предаване","Единица информация, предавана между 2 устройства","Комбинация от IP адрес и номер на порт","Набор от протоколи на един слой"],"correct":1,"expl":"PDU е единицата информация между 2 устройства; IP адрес + порт е socket."},{"id":"L08-A-5","n":5,"text":"Какви адреси съдържат полетата **Destination** и **Source** в примерния формат на кадъра?","opts":["Идентификатори на сесията","Логически (IP) адреси","Физически (хардуерни) адреси","Номера на портове"],"correct":2,"expl":"Destination и Source са physical/hardware address — част от Frame Addressing."},{"id":"L08-A-6","n":6,"text":"Съобщение, изпратено до **един** конкретен получател, е:","opts":["Anycast","Multicast","Broadcast","Unicast"],"correct":3,"expl":"Unicast — до един получател."},{"id":"L08-A-7","n":7,"text":"Протоколът **SPX** е транспортен протокол на кое протоколно семейство?","opts":["Novell NetWare","ISO","AppleTalk","TCP/IP"],"correct":0,"expl":"Novell NetWare: NDS (Application), SPX (Transport), IPX (Internet)."},{"id":"L08-A-8","n":8,"text":"Кои протоколи в TCP/IP семейството са групирани като **Host Config**?","opts":["FTP и TFTP","BOOTP и DHCP","SMTP и POP","DNS и HTTP"],"correct":1,"expl":"Host Config — BOOTP и DHCP; Name System — DNS."},{"id":"L08-A-9","n":9,"text":"В примерния протоколен стек на уеб сървър кой протокол е на слоя **Internet**?","opts":["HTTP","TCP","IP","Ethernet"],"correct":2,"expl":"Стекът е HTTP / TCP / IP / Ethernet."},{"id":"L08-A-10","n":10,"text":"В каква посока се преминава през слоевете при **енкапсулация в сорса**?","opts":["Произволно, според вида на съобщението","Само в рамките на Application слоя","Отдолу нагоре — от Network Access към Application","Отгоре надолу — от Application към Network Access"],"correct":3,"expl":"В сорса — отгоре надолу (енкапсулация); в дестинацията — отдолу нагоре."}],"B":[{"id":"L08-B-1","n":1,"text":"От колко слоя се състои TCP/IP моделът, както е представен в лекцията?","opts":["3","4","7","5"],"correct":1,"expl":"TCP/IP: 1 Network Access, 2 Internet, 3 Transport, 4 Application."},{"id":"L08-B-2","n":2,"text":"Кои слоеве на OSI модела съответстват на слоя **Network Access** на TCP/IP модела?","opts":["Само Physical","Data link и Physical","Network, Data link и Physical","Network и Data link"],"correct":1,"expl":"Network Access обединява Data link и Physical."},{"id":"L08-B-3","n":3,"text":"Как се дефинира **мрежовият протокол**?","opts":["Система от стандартни правила за обмяна на информация между процеси/компютри","Абстрактна концепция за описание на комуникацията между устройствата в мрежата","Единица информация, предавана между две устройства в мрежата","Набор от протоколи, които работят заедно, за да предадат съобщението"],"correct":0,"expl":"Протоколът е система от стандартни правила; „набор от протоколи“ е протоколно семейство, а „единица информация“ — PDU."},{"id":"L08-B-4","n":4,"text":"Каква информация съдържа **header**-ът на съобщението?","opts":["Контролната сума FCS за откриване на грешки","Сигнал за край на сесията между хостовете","Само потребителските данни на съобщението","Адресите на сорса и дестинацията и др."],"correct":3,"expl":"Header-ът носи адресите на източника и получателя; FCS е в trailer-а."},{"id":"L08-B-5","n":5,"text":"Какво прави **източникът** с дълго съобщение?","opts":["Компресира го до максимално допустимия размер и го изпраща като едно цяло","Разделя го на части, отговарящи на минималните и максималните изисквания за размер","Изпраща го наведнъж с broadcast до всички устройства в мрежата","Добавя trailer само към първата част, а останалите изпраща без него"],"correct":1,"expl":"Дългото съобщение се разделя на части според изискванията за размер."},{"id":"L08-B-6","n":6,"text":"Съобщение, изпратено до **всички** устройства в мрежата, е:","opts":["Unicast","Multicast","Broadcast","Flow control"],"correct":2,"expl":"Broadcast — до всички; multicast — до група."},{"id":"L08-B-7","n":7,"text":"На кое протоколно семейство принадлежи протоколът **AFP** (Application слой)?","opts":["Novell NetWare","ISO","AppleTalk","TCP/IP"],"correct":2,"expl":"AppleTalk: AFP (Application), ATP/AEP/NBP/RTMP (Transport), AARP (Internet)."},{"id":"L08-B-8","n":8,"text":"Кой от изброените протоколи **НЕ** е за електронна поща?","opts":["SMTP","POP","IMAP","TFTP"],"correct":3,"expl":"Email: SMTP, POP, IMAP; TFTP е за File Transfer."},{"id":"L08-B-9","n":9,"text":"Коя е правилната последователност при **енкапсулация** на данните на уеб сървър?","opts":["HTTP Data → TCP Segment → IP Packet → Ethernet Frame","Ethernet Frame → IP Packet → TCP Segment → HTTP Data","TCP Segment → HTTP Data → IP Packet → Ethernet Frame","HTTP Data → IP Packet → TCP Segment → Ethernet Frame"],"correct":0,"expl":"Всеки по-долен слой добавя своя header: HTTP → TCP → IP → Ethernet (+ trailer)."},{"id":"L08-B-10","n":10,"text":"Какъв вид адресиране се използва на **транспортния** слой?","opts":["Физически адреси","Timing и синхронизация","Номера на портове","Логически адреси"],"correct":2,"expl":"Transport — портове; Network — логически; Data link — физически; Physical — timing и синхронизация."}],"C":[{"id":"L08-C-1","n":1,"text":"Кой е петият слой на OSI модела?","opts":["Presentation","Transport","Session","Network"],"correct":2,"expl":"5 — Session; 6 — Presentation; 4 — Transport; 3 — Network."},{"id":"L08-C-2","n":2,"text":"На кой слой на OSI модела съответства слоят **Internet** на TCP/IP модела?","opts":["Transport","Session","Data link","Network"],"correct":3,"expl":"Internet (2 в TCP/IP) съответства на Network (3 в OSI)."},{"id":"L08-C-3","n":3,"text":"Кое НЕ се дефинира от мрежовите протоколи?","opts":["Как да се избере път между устройствата","Как да се установява и прекратява сесията","Цената на преносната среда","Структурата на съобщението"],"correct":2,"expl":"Протоколите дефинират обмяната, структурата, формата, откриването на грешки, избора на път и сесията."},{"id":"L08-C-4","n":4,"text":"Какво съдържа **trailer**-ът на съобщението?","opts":["Номера на порта","Адреса на дестинацията","Start Flag","FCS"],"correct":3,"expl":"Trailer-ът съдържа FCS; адресите са в header-а."},{"id":"L08-C-5","n":5,"text":"Кое е вярно за частите на разделено дълго съобщение?","opts":["Всички части се изпращат с един общ header","Всяка част има собствена адресна информация","Частите се реконструират от междинните устройства","Само първата част съдържа адресна информация"],"correct":1,"expl":"Всяка част има своя адресна информация, а получателят ги реконструира."},{"id":"L08-C-6","n":6,"text":"Каква е разликата между multicast и broadcast?","opts":["Multicast е до група устройства, а broadcast — до всички","Multicast и broadcast се различават само по размера","Multicast е до всички устройства, а broadcast — до група","Multicast е до едно устройство, а broadcast — до група"],"correct":0,"expl":"Multicast — група получатели; broadcast — всички."},{"id":"L08-C-7","n":7,"text":"Протоколите **TP0–TP4** са транспортни протоколи на:","opts":["ISO","AppleTalk","Novell NetWare","TCP/IP"],"correct":0,"expl":"В ISO семейството Transport слоят е TP0, TP1, TP2, TP3, TP4."},{"id":"L08-C-8","n":8,"text":"На кой слой на TCP/IP модела са протоколите за маршрутизация OSPF и EIGRP?","opts":["Network Access","Application","Internet","Transport"],"correct":2,"expl":"OSPF и EIGRP са Routing Protocols на Internet слоя."},{"id":"L08-C-9","n":9,"text":"Как се нарича PDU на транспортния слой?","opts":["Пакет","Сегмент","Бит","Кадър (фрейм)"],"correct":1,"expl":"Transport → сегменти; Internet → пакети; Network Access → фреймове."},{"id":"L08-C-10","n":10,"text":"Какви адреси се използват на мрежовия слой (Network)?","opts":["Физически адреси","Номера на портове","Идентификатори на сесии","Логически адреси"],"correct":3,"expl":"Network слоят използва логически адреси."}],"D":[{"id":"L08-D-1","n":1,"text":"Под кой номер е слоят **Data link** в OSI модела?","opts":["2","4","1","3"],"correct":0,"expl":"Data link е вторият слой — над Physical (1) и под Network (3)."},{"id":"L08-D-2","n":2,"text":"Под какви номера е транспортният слой съответно в OSI и в TCP/IP модела?","opts":["5 в OSI и 3 в TCP/IP","4 и в двата модела","4 в OSI и 3 в TCP/IP","3 в OSI и 4 в TCP/IP"],"correct":2,"expl":"Transport е 4-ти в OSI и 3-ти в TCP/IP."},{"id":"L08-D-3","n":3,"text":"Кое НЕ е сред аспектите на протоколите, показани в диаграмата (Message …)?","opts":["Message Timing","Message Encoding","Message Delivery Options","Message Compression"],"correct":3,"expl":"Аспектите са Encoding, Formatting and Encapsulation, Size, Timing и Delivery Options."},{"id":"L08-D-4","n":4,"text":"Каква е последователността на частите на едно съобщение (PDU)?","opts":["Header → trailer → данни","Данни → header → trailer","Trailer → данни → header","Header → данни → trailer"],"correct":3,"expl":"Служебната информация header е отпред, след нея данните и накрая trailer."},{"id":"L08-D-5","n":5,"text":"Кое НЕ е елемент от **timing** на съобщението?","opts":["Енкапсулация (Encapsulation)","Контрол на потока (Flow Control)","Метод за достъп (Access Method)","Време за реакция (Response Timeout)"],"correct":0,"expl":"Timing включва Access Method, Flow Control и Response Timeout."},{"id":"L08-D-6","n":6,"text":"Как се нарича набор от комуникационни протоколи, които работят заедно, за да предадат съобщението и да решат проблем по доставянето му?","opts":["Протоколно семейство","Socket","Протоколна единица данни","Мрежов модел"],"correct":0,"expl":"Това е определението за протоколно семейство."},{"id":"L08-D-7","n":7,"text":"Кой протокол е на слоя **Internet** в семейството Novell NetWare?","opts":["SPX","AARP","IPX","NDS"],"correct":2,"expl":"IPX е на Internet слоя; SPX — Transport; NDS — Application; AARP е от AppleTalk."},{"id":"L08-D-8","n":8,"text":"На кой слой е поставен **ARP** в диаграмата на TCP/IP протоколното семейство?","opts":["Application","Network Access","Transport","Internet"],"correct":1,"expl":"В диаграмата ARP е в Network Access заедно с PPP, Ethernet и Interface Drivers."},{"id":"L08-D-9","n":9,"text":"Как се нарича PDU на слоя **Internet**?","opts":["Данни","Сегмент","Кадър (фрейм)","Пакет"],"correct":3,"expl":"Internet → пакети."},{"id":"L08-D-10","n":10,"text":"На кой слой се използват **физическите** адреси?","opts":["Transport","Data link","Physical","Network"],"correct":1,"expl":"Физическите адреси са на Data link (2); Physical осигурява timing и синхронизация."}],"E":[{"id":"L08-E-1","n":1,"text":"Коя е правилната последователност на слоевете на OSI модела **отдолу нагоре**?","opts":["Physical, Data link, Network, Session, Transport, Presentation, Application","Physical, Data link, Transport, Network, Session, Application, Presentation","Physical, Network, Data link, Transport, Session, Presentation, Application","Physical, Data link, Network, Transport, Session, Presentation, Application"],"correct":3,"expl":"Слоевете 1–7: Physical, Data link, Network, Transport, Session, Presentation, Application."},{"id":"L08-E-2","n":2,"text":"Кое НЕ е цел на мрежовите модели?","opts":["Да определят цената на мрежовото оборудване","Да помогнат при разбирането на процеса на мрежова комуникация","Да служат като еталон за сравнение на продукти на различни производители","Да бъдат следвани при разработване на нови мрежови продукти"],"correct":0,"expl":"Моделите представят абстрактна концепция, служат за обучение, разработка, сравнение и съвместимост — не за ценообразуване."},{"id":"L08-E-3","n":3,"text":"Какво означава съкращението **PDU**?","opts":["Packet data unit","Physical delivery unit","Protocol data unit","Protocol delivery utility"],"correct":2,"expl":"PDU — protocol data unit (протоколна единица данни)."},{"id":"L08-E-4","n":4,"text":"Кое поле в примерния формат на кадъра указва **началото на съобщението**?","opts":["Encapsulated Data","Start Flag","End of Frame","Recipient"],"correct":1,"expl":"Start Flag е start of message indicator; End of Frame — край на съобщението."},{"id":"L08-E-5","n":5,"text":"Какво означава **Response Timeout**?","opts":["Метод за достъп","Сигнал за завършване на предаването","Време за реакция","Контрол на потока"],"correct":2,"expl":"Response Timeout — време за реакция; Flow Control — контрол на потока."},{"id":"L08-E-6","n":6,"text":"Кое НЕ е сред правилата за съответния слой на протоколното семейство?","opts":["Криптиране на съобщението","Сигнал за завършване на предаването","Общ език","Изчакване на ред за предаване"],"correct":0,"expl":"Правилата са общ език, изчакване на ред и сигнал за завършване."},{"id":"L08-E-7","n":7,"text":"Кое НЕ е посочено в общия слой **Network Access** на таблицата с протоколните семейства?","opts":["Frame Relay","ICMPv6","ATM","PPP"],"correct":1,"expl":"Network Access: Ethernet, PPP, Frame Relay, ATM, WLAN; ICMPv6 е на Internet слоя на TCP/IP."},{"id":"L08-E-8","n":8,"text":"Кои протоколи работят на транспортния слой на TCP/IP?","opts":["HTTP и FTP","IP и ICMP","TCP и UDP","ARP и PPP"],"correct":2,"expl":"Transport Layer: UDP и TCP."},{"id":"L08-E-9","n":9,"text":"Фреймовете (кадрите) са PDU на кой слой на TCP/IP модела?","opts":["Network Access","Transport","Internet","Application"],"correct":0,"expl":"Фреймовете (кадри) са на Network Access, а на средата се предават битове 0/1."},{"id":"L08-E-10","n":10,"text":"От какво се състои **socket**?","opts":["IP адрес + MAC адрес","MAC адрес + номер на порт","Номер на порт + FCS","IP адрес + номер на порт"],"correct":3,"expl":"Socket = IP address + port number."}]}},{"num":9,"title":"Лекция 9 — Физически слой на OSI модела","short":"Физически слой на OSI модела","summary":"### Основни моменти\n- Физически слой и характеристики; **преносна среда**; **стандарти**; **видове кабели**; **видове кодирания**; **устройства** на този слой.\n\n### Физически слой\n- Разглежда съобщението като **поредица от битове**, а **не като структура на PDU**.\n- **Кодира битовете като сигнал** в преносната среда.\n- **Не може да комуникира с горните слоеве.**\n- **Не може да идентифицира устройствата в сегмента.**\n- Предназначение: **физически и електрически характеристики на средата**; **механични характеристики** (материали, разстояния, **пинове**) на **конекторите и NIC**; **битовете се представят (кодират) със сигнали (encoding)**; има и **сигнали, които носят контролна информация**.\n\n### Стандарти\n| | Физически слой | Горни слоеве |\n|---|---|---|\n| Имплементирани в | **хардуера** | **софтуера** |\n| Създават се от | **ISO, EIA/TIA, ITU-T, ANSI, IEEE** | **IETF** |\n\n- Стандартите на физическия слой се отнасят за: **предаването** — кодиране, сигнализация, модулация…; **устройствата** — интерфейси, портове, мрежови карти; **кабелите** — конектори, екранировка, обвивка, разстояния на предаване…\n\n### Кодиране и сигнализация\n- **Сигнализация (signalling)** — **преобразуване на битовете в сигнали**.\n- При **много ниски скорости** битът се преобразува **директно** в сигнали.\n- При **по-високи скорости** има **стъпка на кодиране**, а след това **стъпка на сигнализация** — електрически импулси по меден кабел или светлинни импулси по оптичен.\n\n| Стандарт | Макс. дължина | Среда / конектор |\n|---|---|---|\n| **10BASE5** | **500 m** | 50 Ohm коаксиален, **N-Style** |\n| **10BASE2** | **185 m** | 50 Ohm коаксиален, **BNC** |\n| **10BASE-T** | **100 m** | 100 Ohm **UTP**, RJ-45 |\n| **100BASE-TX** | **100 m** | 100 Ohm UTP, RJ-45 |\n| **1000BASE-CX** | **25 m** | **150 Ohm STP**, **mini-DB-9** |\n| **1000BASE-T** | **100 m** | 100 Ohm UTP, RJ-45 |\n| **1000BASE-SX** | **220–550 m** | **MM** fiber, SC |\n| **1000BASE-LX** | **550–5000 m** | **MM или SM** fiber, SC |\n\n### Преносна среда\n- **Меден кабел**: **усукана двойка** (**екранирана** / **неекранирана**); **коаксиален** (**дебел** / **тънък**).\n- **Оптичен кабел**: **SM** (single mode) / **MM** (multimode).\n- **Безжична среда**.\n\n### Шум и преодоляването му\n- Електрическите сигнали по меден кабел са под влияние на:\n  - **EMI** — електромагнитна интерференция (напр. от **флуоресцентни осветители и електрически мотори**);\n  - **RFI** — радиочестоти;\n  - **Crosstalk** — между **жиците в един кабел** или между **близко разположени кабели**.\n- Преодоляване: кабели с **метална обшивка**; **усукване на двойките** за ефект самозащита (**cancelling**); избягване на окабеляване през области с шум; **внимателно терминиране** на кабелите.\n\n### Коаксиален кабел\n- Отвътре навън: **проводник в центъра** → **изолация** → **медна мрежа за екранировка** → **външна изолация**. Конектори: **BNC, N type, F type**.\n- Добър за **високочестотни радио и видео сигнали**; за **антени** и пренос през въздушна среда; за **кабелна TV и Интернет в комбинация с оптичен кабел**; **преди повече от 20 години** се ползваше в Ethernet LAN.\n\n### Кабел с усукани двойки\n- **8 жици, усукани в 4 двойки**, с външна изолация; **цветово кодирани**; **най-често** се ползва в **Ethernet LAN**.\n- **Стари**: **Cat 3** — за **глас** (телефонни линии); **Cat 5** — данни **100 Mbps**; **Cat 5e** — данни **1000 Mbps**. **Съвременни**: **Cat 6, Cat 7, Cat 8**.\n\n| Атрибут | **Cat6** | **Cat7** | **Cat8** |\n|---|---|---|---|\n| Честота | **250 MHz** | **600 MHz** | **2000 MHz** |\n| Макс. скорост | 1 Gbps / 10 Gbps | 10 Gbps | **25 / 40 Gbps** |\n| Разстояние | 100 m при 1 Gbps / **37–55 m при 10 Gbps** | 100 m | **30 m** |\n| Брой конектори в канала | 4 | 4 | **2** |\n| Конструкция | UTP или екраниран | **екраниран** | екраниран |\n| Конектор | RJ45 | **не-RJ45** | Class I: RJ45, Class II: не-RJ45 |\n| Цена | по-скъп от предишните | по-скъп от предишните | **висока** |\n\n| Категория | Честота | Макс. скорост | Екраниране |\n|---|---|---|---|\n| **Cat5e** | 100 MHz (до 350) | 1000 Mbps | UTP или STP |\n| **Cat6** | 250 MHz (до 550) | 1000 Mbps | UTP или STP |\n| **Cat6A** | **500 MHz** (до 550) | **10 Gbps** | UTP или STP |\n| **Cat7** | 600 MHz | 10 Gbps | **само екраниран** |\n| **Cat8** | 2000 MHz | 25 или 40 Gbps | **само екраниран** |\n\n- **RJ45 конектори**: за **patch кабели**; за **розетка (punch down)**; за **панел (patch panel)**.\n\n### Прав, crossover и rollover кабел\n| Кабел | Разводка | Употреба |\n|---|---|---|\n| **Прав (straight-through)** | **еднакъв в двата края** | **PC–switch, PC–hub, router–switch, router–hub**; положените в **под, стени, окачен таван** кабели са **прави** |\n| **Crossover** | разменени двойки: **1 ↔ 3, 2 ↔ 6** (Transmit ↔ Receive) | **едноименни устройства**: **PC–PC, PC–router, router–router, switch–switch, switch–hub, hub–hub** |\n| **Rollover** | **1–8 срещу 8–1** (обърнат) | **само за управление** — **конзолна връзка** от **сериен порт на PC** за конфигуриране на router/switch; специален кабел или **преходник RJ45 → DB9** |\n\n### UTP и STP\n- **UTP**: **EIA/TIA** има стандарт за него; категории **5, 5e, 6, 7, 8** за **100 Mbps** Ethernet; **Cat 5e, 6, 7, 8** — за **Gigabit Ethernet**; **броят на усукванията на метър е внимателно контролиран**.\n- **STP (защитена усукана двойка)**: жиците са защитени срещу шум; **по-скъпа от UTP**; може за **10 Gbps Ethernet**. Структура: **jacket → braided shield → foil shield → twisted pairs**.\n\n### Оптичен кабел\n- Предава със **светлинни импулси**; **full duplex**; **няма проблеми с RFI/EMI**; няколко влакна в един кабел.\n- Структура (отвътре навън): **core (сърцевина)** → **cladding (обвивка)** → **buffer** → **strengthening material — арамидни нишки (Aramid yarn)** → **jacket (обикновено PVC)**.\n\n| | **Single mode (SM)** | **Multimode (MM)** |\n|---|---|---|\n| Сърцевина | **8–10 µm** | **50–60 µm** (така на слайда) |\n| Източник | **лазер** — **точно един лъч** | **LED** — **няколко лъча с различни ъгли**, преминаващи с различни скорости |\n| Разстояние | **до 100 km** | **до 2 km**, ограничено от **дисперсия** |\n| Приемник | фотодиоди → електрически сигнал | фотодиодни рецептори |\n| Цена | по-скъп | **по-евтин** |\n\n- **Конектори**: **ST — Straight tip** (на слайда: single mode); **SC — Subscriber connector** (на слайда: multimode); **lucent connector** (single mode и multimode); **LC — duplex multimode lucent connector**.\n\n### Безжична среда\n- Работи с **радиочестоти**; **няма разходи за инсталация**; **хостовете са свободни да се местят**. Устройства: **wireless access point**, **wireless adaptor**.\n- **Проблеми**: **интерференция** от други wireless комуникации, безжични телефони, флуоресцентни осветители, **микровълнови печки**; **материалите на сградата** могат да блокират сигнала; **сигурността**.\n\n| Стандарт | Технологии |\n|---|---|\n| **IEEE 802.11** | **Wi-Fi**, използва **CSMA/CA** |\n| **IEEE 802.15** | **Bluetooth, ZigBee, 6LoWPAN** — двойка устройства на малки разстояния (**под 250 m**) |\n| **IEEE 802.16** | **WiMAX**, LTE (на слайда) — за **broadband** достъп |\n| **GSM** | Global System for Mobile Communications — мрежи за **мобилни телефони** |\n\n### Избор на тип на кабела\n| | **UTP** | **Fiber optic** |\n|---|---|---|\n| Дължина | **до 100 m** | повече |\n| Къде | **само в сгради** | в/извън сгради |\n| Цена | **по-евтин** | по-скъп |\n| EMI/RFI шум | **влияе се** | не се влияе |\n| Bandwidth | приложения с **по-ниски** изисквания | приложения с **по-високи** изисквания |\n| High capacity link | по-лош | **по-добър** |\n| Инсталация | **по-лесна** | по-трудна |\n\n### Видове кодиране: NRZ, NRZI, Manchester, 4B/5B, MLT-3\n- **NRZ (Non Return to Zero)** — **много проста** система за сигнализация; **1 = високо** напрежение, **0 = ниско**; във всеки bit-период напрежението **не се връща към 0**. Проблеми: **дълга поредица от 1-ци или 0-ли разсинхронизира (timing)** предавателя и приемника; **неефективен, податлив на интерференция**; не се използва за всякакви технологии; **може да се използва, ако се комбинира с кодиране**.\n- **Manchester** — напрежението се сменя **в средата на всеки bit-период** → помага на устройствата да си **синхронизират timing-а**; **падащ фронт = 0, нарастващ фронт = 1**; промяната **между** bit-периодите се **игнорира**; използва се в **10 Mbps Ethernet**; **не е ефективен за по-високи скорости**.\n- **NRZI (Non-Return to Zero, Inverted)** — **всяка 1 се представя чрез преход, а 0 — с отсъствие на преход**. Кодовете NRZ се използват основно за **запис върху магнитни носители**; в LAN — от **IEEE 802.12 (100VG-AnyLAN)** по усукани двойки.\n- **4B/5B** — при 100 Mbps Ethernet: битовете се **групират по 4** и всяка четворка има **собствен 5-битов код** (напр. **0011 → 10101**). Добавя **излишни битове**, но има **предимства**:\n  - **контролните кодове** („start“, „stop“) **не могат да се объркат с данни**;\n  - **достатъчно преходи** за контрол на timing-а;\n  - кодовете са **балансирани от 1 и 0** — минимизират вложената енергия;\n  - **по-добро откриване на грешки** — разпознават се **невалидните кодове**.\n  - Примери от таблицата: 0000 → **11110**, 0001 → 01001, 1111 → 11101; управляващи: **11111 — Idle**, 11000/10001 — Start of Stream, 01101/00111 — End of Stream, **00100 — Transmit Error**, останалите — **Invalid codes**.\n- **MLT-3** — **три нива: +V, 0, −V**; **1 — има промяна в нивото, 0 — няма**.\n\n| Технология | Кодиране → сигнал |\n|---|---|\n| **10 Mbps Ethernet** | **Manchester** |\n| **100 Mbps Ethernet по UTP** | **4B/5B**, после **MLT-3** (битовете като нива на напрежение) |\n| **100BaseFX** (оптика) | **4B/5B**, после **NRZI** (LED свети/не свети по **multimode**) |\n| **Gigabit Ethernet по UTP** | **сложно кодиране** + сложна схема за сигнал по **всички 4 двойки** |\n\n### По-високи скорости (10/40/100 Gigabit Ethernet)\n- Стандарти: **IEEE 802.3ak** — **Twinax**; **802.3an** — **усукана двойка** (мед); **802.3ae** — **оптичен** кабел; **802.3ba** — 40/100G.\n\n| Технология | Кабел | Категория / режим | Макс. разстояние |\n|---|---|---|---|\n| **10GBASE-CX4** | Copper, **Twinax** | Cat5e (на слайда) | 15 m / 50 m |\n| **10GBASE-T** | Copper, **twisted pair** | **Cat 6a/7** | **100 m** |\n| 10GBASE-LX4 | FO, 1310 nm | MM / SM | 300 m / 10 km |\n| **10GBASE-SR** | FO, **850 nm** | MM OM1/OM2; OM3 | 33/82 m; **300 m** |\n| **10GBASE-LR** | FO, **1310 nm** | **SM** | **10 km** |\n| **10GBASE-ER** | FO, **1550 nm** | **SM** | **40 km** |\n| 10GBASE-SW | FO, 850 nm | MM OM1/OM2; OM3; OM4 | 33/82 m; 300 m; 550 m |\n| 10GBASE-LW | FO, 1310 nm | SM | 10 km |\n| 10GBASE-EW | FO, 1550 nm | SM | 40 km |\n| **40GBASE-KR4** | **PCB bus** | 4×10 Gb/s | **1 m** |\n| 40GBASE-CR4 | Copper, Twinax | 4×10 Gb/s | 7 m |\n| 40GBASE-SR4 | MM OM3/OM4 | 4×10 Gb/s | 100/150 m |\n| 40GBASE-LR4 | SM | 4×10 Gb/s (**CWDM**) | 10 km |\n| 100GBASE-CR10 | Copper, Twinax | **10×10 Gb/s** | 7 m |\n| 100GBASE-SR10 | MM OM3/OM4 | 10×10 Gb/s | 100/150 m |\n| 100GBASE-LR4 | SM | **4×25 Gb/s (DWDM)** | 10 km |\n| 100GBASE-ER4 | SM | 4×25 Gb/s (DWDM) | 40 km |\n\n- Закономерност: **S** = short (850 nm, MM), **L** = long (1310 nm), **E** = extended (1550 nm, 40 km); **C** = мед/Twinax; **T** = усукана двойка.\n\n### Устройства на физическия слой\n- **Конвертор (media converter)** — преобразува сигналите от сегмент с **една преносна среда** в сегмент с **друга** преносна среда. Видове: коаксиален ↔ усукана двойка; усукана двойка ↔ Wi-Fi; оптичен ↔ усукана двойка…\n- **Повторител (repeater)** — на по-големи разстояния сигналите **затихват и се изкривяват** от шума; повторителят **възстановява (регенерира)** получените сигнали и ги предава на други сегменти → **преодолява ограничението на максималното разстояние на сегмента**.\n- **Концентратор (hub = multiport repeater)** — свързаните хостове **поделят bandwidth** (споделена среда); **само едно устройство може да изпраща в даден момент**; **физическа топология — звезда**, **логическа — обща шина**.\n\n### Капани за изпита\n- Физическият слой **не вижда PDU**, а само битове; **не** идентифицира устройства и **не** комуникира с горните слоеве.\n- Стандарти на физическия слой — **хардуер** (ISO, EIA/TIA, ITU-T, ANSI, IEEE); на горните — **софтуер**, **IETF**.\n- **Сигнализация** = битове → сигнали; при **ниски скорости** — директно, при **високи** — първо кодиране, после сигнализация.\n- **10BASE2 = 185 m (BNC)**, **10BASE5 = 500 m (N-Style)**; 1000BASE-CX = **STP 150 Ohm, 25 m**.\n- **Дебел/тънък** → коаксиален; **екранирана/неекранирана** → усукана двойка; **SM/MM** → оптика.\n- **EMI** — флуоресцентни лампи, мотори; **crosstalk** — между жиците/кабелите; **cancelling** — от усукването.\n- **Cat 3** — глас; **Cat 5** — 100 Mbps; **Cat 5e** — 1000 Mbps (минимум за Gigabit). Cat 8 — **30 m**, **2000 MHz**; Cat 7 — **600 MHz**, не-RJ45.\n- Противоречие: на единия слайд Cat6 е „1 Gbps/10 Gbps“ (10 Gbps до 37–55 m), на другия — макс. **1000 Mbps** (10 Gbps е **Cat6A**). Също слайдът „UTP кабел“ включва **Cat 7 и 8**, а таблицата казва, че те са **само екранирани**.\n- **PC–router** е **crossover** (не прав)! **Router–switch** и **PC–switch** — прав. **Switch–hub** — crossover. Кабелите в стените — **прави**.\n- Crossover — **1↔3, 2↔6**; rollover — **1–8 срещу 8–1**, **само конзола**, RJ45→**DB9**.\n- **SM**: 8–10 µm, **лазер**, 1 лъч, **100 km**; **MM**: 50–60 µm (на слайда; стандартно 50 / 62.5 µm), **LED**, много лъчи, **2 km** (дисперсия), **по-евтин**.\n- **SC = Subscriber connector**, **ST = Straight tip**, **LC = lucent connector**. На слайда ST е подписан „single mode“, а SC — „multimode“.\n- **802.11 — Wi-Fi, CSMA/CA** (не CSMA/CD); **802.15 — Bluetooth/ZigBee/6LoWPAN, < 250 m**; **802.16 — WiMAX**. Слайдът поставя и **LTE** до 802.16 — LTE всъщност е стандарт на 3GPP, не на IEEE.\n- **NRZ**: 1 = високо, 0 = ниско. **NRZI**: 1 = **преход**, 0 = без преход. **MLT-3**: също 1 = промяна, но на **три нива**. **Manchester**: преход **в средата** на всеки бит, **падащ = 0, нарастващ = 1**.\n- Слайдът за NRZI пише „напрежението се сменя **в средата** на bit-периода“ — това всъщност е свойство на **Manchester**; при NRZI промяната е в началото на бита и само за 1.\n- **100 Mbps UTP → 4B/5B + MLT-3**; **100BaseFX → 4B/5B + NRZI**; **10 Mbps → Manchester**; **Gigabit UTP → всички 4 двойки**.\n- 4B/5B добавя **излишни** битове (4 → 5), **не** намалява броя им; **0011 → 10101**; **11111 = Idle**.\n- 10G стандарти: **802.3ae — оптика**, **802.3an — усукана двойка**, **802.3ak — Twinax**. **10GBASE-T — Cat 6a/7, 100 m**; **ER — 1550 nm, 40 km**; **LR — 1310 nm, 10 km**; **SR — 850 nm**; **40GBASE-KR4 — PCB bus, 1 m**. В извлечения текст на таблицата редовете са разместени — вярно е подреждането в слайда (таблицата по-горе).\n- **Hub = multiport repeater**: физически **звезда**, логически **обща шина**; споделен bandwidth. **Повторителят** регенерира сигнала, **конверторът** сменя вида среда.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L09-A-1","n":1,"text":"Как физическият слой разглежда съобщението?","opts":["Като поредица от сегменти с номера на портове","Като кадри с физически адреси","Като структура на PDU с header и trailer","Като поредица от битове, а не като структура на PDU"],"correct":3,"expl":"Физическият слой вижда само битове и ги кодира като сигнал."},{"id":"L09-A-2","n":2,"text":"Каква е максималната дължина на сегмент по стандарта **10BASE2**?","opts":["500 m","100 m","25 m","185 m"],"correct":3,"expl":"10BASE2 — 185 m, 50 Ohm коаксиален с BNC; 10BASE5 — 500 m."},{"id":"L09-A-3","n":3,"text":"Кой е правилният ред на елементите на коаксиалния кабел **отвътре навън**?","opts":["Проводник → изолация → медна мрежа за екранировка → външна изолация","Изолация → проводник → външна изолация → медна мрежа","Медна мрежа → проводник → изолация → външна изолация","Проводник → медна мрежа за екранировка → изолация → външна изолация"],"correct":0,"expl":"В центъра е проводникът, после изолация, медна мрежа и външна изолация."},{"id":"L09-A-4","n":4,"text":"Каква е максималната дължина на канала при **Cat 8** според сравнителната таблица?","opts":["55 m","100 m","30 m","15 m"],"correct":2,"expl":"Cat 8: 2000 MH
