 на грешките.\n- Буфериране: **port-based** (опашка за всеки порт) ≠ **shared memory** (обща памет, без отделни опашки).\n- Layer 3 комутатор препраща **по-бързо от маршрутизатор** (специален хардуер).\n- Закъснение в комутатора: от **влизането** на фрейма до **излизането на края му**.\n- Слайдът с алгоритъма казва „научава сорсовия MAC“ — не дестинационния.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L12-A-1","n":1,"text":"Кое НЕ е резултат от сегментирането на мрежата с мост?","opts":["По-малки колизионни домейни","По-голяма ефективност на мрежата","Избирателно предаване на данни между сегментите","Ограничаване на broadcast трафика"],"correct":3,"expl":"Мостът дава по-малки колизионни домейни и ефективност, но **не ограничава broadcast трафика**."},{"id":"L12-A-2","n":2,"text":"Какво е предназначението на комутатора спрямо концентратора?","opts":["Да разделя мрежата на бродкаст домейни според IP адресите на хостовете","Да увеличава колизионния домейн, за да има по-добра bandwidth за всички","Да преобразува IP адреси в MAC адреси за крайните устройства","Да изолира трафика между сегментите и да създава по-малки колизионни домейни"],"correct":3,"expl":"Комутаторът **изолира трафика** и дава **по-добра bandwidth** чрез **по-малки колизионни домейни**."},{"id":"L12-A-3","n":3,"text":"Кое устройство разделя мрежата и на колизионни, и на бродкаст домейни?","opts":["Комутатор","Мост","Маршрутизатор","Концентратор"],"correct":2,"expl":"**Маршрутизаторът** дели и колизионни, и бродкаст домейни; комутаторът и мостът — само колизионни."},{"id":"L12-A-4","n":4,"text":"Локалният край е с auto-MDIX On, отдалеченият — Off, а кабелът е грешен. Какво е състоянието на връзката?","opts":["Link up","Link down","Link up само в half-duplex","Портът се блокира"],"correct":0,"expl":"Ако **поне един край е с auto-MDIX On**, връзката е **Link up** и с грешен кабел."},{"id":"L12-A-5","n":5,"text":"Кое е вярно за Layer 2 комутатора?","opts":["Взема решения само по MAC адреси и не следи мрежови протоколи","Използва IP адреси за маршрутизиране","Следи потребителските приложения","Препраща по-бързо от Layer 3 комутатор със специален хардуер"],"correct":0,"expl":"**Layer 2** — **само MAC адреси**; не следи мрежови протоколи и приложения."},{"id":"L12-A-6","n":6,"text":"Каква двойка се записва в бридж таблицата?","opts":["IP адрес – MAC адрес","Номер на порт – MAC адрес","Номер на порт – IP адрес","MAC адрес – време на пристигане на CRC"],"correct":1,"expl":"Записва се **номер на порт – MAC адрес**; двойките IP–MAC са в ARP таблицата."},{"id":"L12-A-7","n":7,"text":"Дестинационният и сорсовият MAC адрес на фрейма са на един и същ порт. Какво прави комутаторът?","opts":["Не изпраща фрейма на никой порт","Изпраща го на всички портове","Изпраща го обратно на същия порт","Изпраща го към default gateway"],"correct":0,"expl":"Ако dest и src са **на един порт**, комутаторът **не го изпраща никъде** (филтрира)."},{"id":"L12-A-8","n":8,"text":"Колко време стои сорсовият MAC адрес в бридж таблицата при повечето производители?","opts":["2 минути","30 секунди","5 минути","4 часа"],"correct":2,"expl":"Записът стои **5 минути**; 2 минути е таймерът по подразбиране на ARP записа (Лекция 13)."},{"id":"L12-A-9","n":9,"text":"От какво зависи закъснението в комутатора?","opts":["Само от дължината на MAC адреса на получателя във фрейма","От конфигурираните процеси на комутация и обема на трафика","От броя на бродкаст домейните и рутерите в мрежата","От OUI на мрежовите карти на хостовете в сегмента"],"correct":1,"expl":"Закъснението зависи от **процесите на комутация** и **обема на трафика**."},{"id":"L12-A-10","n":10,"text":"Какво става с фрейм с грешна CRC при fast-forward?","opts":["Комутаторът го изхвърля веднага след проверка","Комутаторът коригира грешката и го препраща","Заема bandwidth и се отхвърля чак от NIC на дестинацията","Комутаторът го връща на изпращача с jam сигнал"],"correct":2,"expl":"Fast-forward не проверява CRC → грешният фрейм **заема bandwidth** и се отхвърля **от дестинационната NIC**."}],"B":[{"id":"L12-B-1","n":1,"text":"Как мостът избирателно предава данни между два сегмента?","opts":["Научава IP адресите, изгражда маршрутна таблица и изчислява най-добрия път до мрежата","Научава MAC адресите, изгражда бридж таблица и препраща или блокира трафика по нея","Препраща всеки фрейм към всички сегменти без никаква проверка на адресите","Изчаква token и тогава предава данните към другия сегмент"],"correct":1,"expl":"Мостът **научава MAC адресите → бридж таблица → препраща/блокира**."},{"id":"L12-B-2","n":2,"text":"В какъв бродкаст домейн са хостовете, свързани към комутатор (без рутер)?","opts":["Всеки хост е в собствен бродкаст домейн","По един бродкаст домейн за всеки комутатор","Не принадлежат към бродкаст домейн","В един и същ бродкаст домейн"],"correct":3,"expl":"**Всички хостове, свързани към комутатора, са в един бродкаст домейн**."},{"id":"L12-B-3","n":3,"text":"Колко забавяне добавят маршрутизаторите според лекцията и защо?","opts":["5–10%, защото проверяват CRC на всеки получен фрейм на всеки порт","50–60%, защото наводняват фреймовете към всички портове","20–30%, защото определят най-добрия път по логически (IP, IPX) адреси","20–30%, защото използват CSMA/CD и проверяват CRC на всеки интерфейс"],"correct":2,"expl":"Рутерите добавят **20–30% забавяне** — определят **най-добрия път** по **логически адреси**."},{"id":"L12-B-4","n":4,"text":"Какво е симетричен комутатор?","opts":["Комутатор с порт 1000 Mb/s към сървъра и 100 Mb/s към клиентите","Комутатор с обща памет за буфериране","Комутатор, който взема решения по MAC и IP адреси","Комутатор, на който всички портове са с еднаква пропускателна способност"],"correct":3,"expl":"**Симетричен** — еднаква bandwidth на всички портове (напр. 100 Mb/s)."},{"id":"L12-B-5","n":5,"text":"С какво Layer 3 комутаторът се различава от Layer 2 комутатора?","opts":["Използва и IP адреси (маршрутизиране) и има специален хардуер","Не изгражда бридж таблица и не използва MAC адреси","Работи само в half-duplex режим и използва CSMA/CD","Следи потребителските приложения на приложния слой"],"correct":0,"expl":"**Layer 3** — MAC + **IP (маршрутизиране)**, **специален хардуер**, по-бърз от рутер и L2 комутатор."},{"id":"L12-B-6","n":6,"text":"За препращане на какъв трафик мостовете и комутаторите използват бридж таблицата?","opts":["Бродкасти","Уникасти","Мултикасти","Колизионни фрагменти"],"correct":1,"expl":"Бридж таблицата се използва **за препращане на уникасти**; бродкастите и мултикастите се наводняват."},{"id":"L12-B-7","n":7,"text":"Дестинационният MAC адрес на фрейма е бродкаст, мултикаст или непознат уникаст. Какво прави комутаторът?","opts":["Изпраща го само на конкретния порт","Не го изпраща на никой","Изпраща го на всички портове","Изпраща ARP reply на изпращача"],"correct":2,"expl":"За **бродкаст, мултикаст и непознат уникаст** → **всички портове**."},{"id":"L12-B-8","n":8,"text":"Колко записа има в бридж таблицата в повечето случаи според лекцията?","opts":["1024","256","64","4096"],"correct":0,"expl":"Броят зависи от кеша, но **в повечето случаи е 1024**."},{"id":"L12-B-9","n":9,"text":"Как се премахват „тесните места“ (bottlenecks) в мрежата?","opts":["С добавяне на концентратори към сегментите","С връзки с по-голям капацитет и по-голям брой връзки","С увеличаване на размера на колизионния домейн","С преминаване от full-duplex към half-duplex"],"correct":1,"expl":"Bottlenecks: **по-голям капацитет** и **повече връзки**."},{"id":"L12-B-10","n":10,"text":"Колко байта изчаква fragment-free методът, преди да започне да препраща?","opts":["6 bytes","46 bytes","1518 bytes","64 bytes"],"correct":3,"expl":"**Fragment-free** чака **64 bytes** — колизионните фрагменти са по-къси."}],"C":[{"id":"L12-C-1","n":1,"text":"Какво изграждат комутаторите между 2 свързани устройства?","opts":["Общ колизионен домейн, споделен от всички портове","Отделен бродкаст домейн за всяко свързано устройство","Виртуални вериги, които са само за комуникацията между тях","Логическа обща шина"],"correct":2,"expl":"Комутаторите изграждат **виртуални вериги**, предназначени само за двете устройства."},{"id":"L12-C-2","n":2,"text":"Мрежа с два комутатора и две IP подмрежи (без рутер). Кое описание е вярно?","opts":["Един колизионен домейн и два бродкаст домейна (по подмрежа)","Два колизионни и два бродкаст домейна (по комутатор)","Един общ колизионен и един общ бродкаст домейн","Няколко колизионни домейна (по един на порт) и един бродкаст домейн"],"correct":3,"expl":"Комутаторите правят **колизионен домейн за всеки порт**, но бродкастът достига всички → **един бродкаст домейн**."},{"id":"L12-C-3","n":3,"text":"Какво означава настройката auto за duplex режима на порт на комутатора?","opts":["Автоматичен избор на cross-over или straight-through кабел","Постоянен full-duplex режим","Автоматично изключване на порта при колизия","Автоматично договаряне на duplex режима"],"correct":3,"expl":"duplex **auto** = **автоматично договаряне**; изборът на тип кабел е auto-MDIX."},{"id":"L12-C-4","n":4,"text":"Комутатор има един порт 1000 Mb/s към сървъра и останалите — по 100 Mb/s. Какъв е той?","opts":["Симетричен","Асиметричен","Layer 3","Fragment-free"],"correct":1,"expl":"Портове с **различна пропускателна способност** → **асиметричен** комутатор."},{"id":"L12-C-5","n":5,"text":"Кое твърдение за Layer 3 комутатора е НЕВЯРНО?","opts":["Изгражда бридж таблица","Използва IP адреси от 3 слой","Взема решения само по MAC адреси","Препраща по-бързо от маршрутизатор"],"correct":2,"expl":"Само по MAC адреси решава **Layer 2** комутаторът."},{"id":"L12-C-6","n":6,"text":"Как се нарича в лекцията CAM таблицата на комутатора?","opts":["Source Address Table","ARP Table","Routing Table","Destination Address Table"],"correct":0,"expl":"CAM таблицата е наречена **Source Address Table** — записва сорсовите MAC адреси."},{"id":"L12-C-7","n":7,"text":"Таблицата е празна. Хост 1111 (порт 1) изпраща фрейм до 3333 (порт 6). Какво прави комутаторът?","opts":["Записва 6 – 3333 и изпраща фрейма само на порт 6 (към 3333)","Записва 1 – 1111 и изпраща фрейма на всички портове без порт 1","Записва 1 – 3333 и изхвърля фрейма","Не записва нищо и изпраща фрейма на всички портове без порт 1"],"correct":1,"expl":"Научава **сорса (1 – 1111)**; 3333 е непознат → **наводнява** без входящия порт."},{"id":"L12-C-8","n":8,"text":"Откъде устройствата научават дестинационните MAC адреси?","opts":["От ARP кеша и ARP Requests","От DNS сървъра","От полето Preamble","От OUI на производителя"],"correct":0,"expl":"Дестинационните MAC адреси се научават **от ARP кеша и ARP Requests**."},{"id":"L12-C-9","n":9,"text":"Кое описва метода store-and-forward?","opts":["Предаването започва веднага след прочитане на дестинационния MAC","Целият фрейм се получава, проверява се CRC и при грешка фреймът се изхвърля","Изчакват се само първите 64 bytes","Предава се без проверка на CRC докато не се достигне праг на грешки"],"correct":1,"expl":"**Store-and-forward**: **целият фрейм + CRC проверка**; грешните се изхвърлят."},{"id":"L12-C-10","n":10,"text":"Какви са колизионните фрагменти според лекцията?","opts":["Фреймове, по-дълги от 1518 bytes","Фреймове с дестинационен MAC FF:FF:FF:FF:FF:FF","Парчета от фреймове, по-къси от 64 bytes","Фреймове, получени от два порта едновременно"],"correct":2,"expl":"**Колизионните фрагменти са по-къси от 64 bytes** (грешни/липсващи CRC)."}],"D":[{"id":"L12-D-1","n":1,"text":"Какво е микросегментация?","opts":["Всеки хост е в отделен сегмент чрез point-to-point връзка","Разделяне на мрежата на подмрежи чрез маршрутизатор","Разделяне на фрейма на фрагменти по 64 байта","Свързване на много хостове към един порт чрез хъб"],"correct":0,"expl":"**Микросегментация** = отделни сегменти (**point-to-point**) за всяко устройство."},{"id":"L12-D-2","n":2,"text":"В кой случай комутаторът НЕ препраща фрейма към всички портове?","opts":["Уникаст до хост, чийто MAC адрес още не е в таблицата","Уникаст до хост, чийто MAC адрес *само на порт 1**."},{"id":"L12-D-8","n":8,"text":"Към порт 1 на комутатор чрез хъб са свързани 1111, 2222 и 5555. Хост 3333 изпраща фрейм към 1111. Кои хостове физически получават фрейма?","opts":["Само 1111","Всички хостове на всички портове","Само 2222 и 5555","1111, 2222 и 5555"],"correct":3,"expl":"Комутаторът изпраща на **порт 1**, а **хъбът го разпраща на всички** свързани към него — те са общ колизионен домейн."},{"id":"L12-D-9","n":9,"text":"Какво е характерно за cut-through комутацията?","opts":["Намалява закъснението за сметка на откриването на грешки","Проверява CRC на всеки фрейм преди препращане","Изисква буфериране на целия фрейм","Увеличава закъснението, но изхвърля всички грешни фреймове"],"correct":0,"expl":"Cut-through започва **преди целият фрейм да е постъпил** и **не проверява CRC**."},{"id":"L12-D-10","n":10,"text":"Как работи adaptive cut-through?","opts":["Използва cut-through, докато не се достигне праг на грешките, след което преминава в store-and-forward","Използва store-and-forward, докато не се достигне праг, след което преминава в cut-through","Редува fast-forward и fragment-free за всеки фрейм","Изчаква 64 bytes и проверява CRC само на мултикасти"],"correct":0,"expl":"**Adaptive**: cut-through до **threshold** на грешките → **store-and-forward**."}],"E":[{"id":"L12-E-1","n":1,"text":"Кое твърдение за CSMA/CD при комутаторите е вярно?","opts":["Прилага се само при full-duplex комуникации","Прилага се само при half-duplex комуникации","Използва се задължително на всички портове","Заменя се от token passing при half-duplex"],"correct":1,"expl":"**CSMA/CD — само при half-duplex**; при full-duplex няма колизии."},{"id":"L12-E-2","n":2,"text":"Комутатор получава фрейм с дестинационен MAC адрес, който го няма в таблицата. Какво прави?","opts":["Изпраща го на всички портове без входящия","Изхвърля фрейма, защото няма запис за него","Изпраща го само на порта с най-нисък номер","Връща го обратно на изпращача с jam сигнал"],"correct":0,"expl":"Непознат уникаст → **всички портове без входящия**."},{"id":"L12-E-3","n":3,"text":"При коя комбинация на auto-MDIX връзката е Link down?","opts":["Двата края On и грешен кабел","Локален On, отдалечен Off и грешен кабел","Двата края Off и грешен кабел","Двата края Off и правилен кабел"],"correct":2,"expl":"Link down е **само при Off/Off с грешен кабел**; достатъчно е единият край да е On."},{"id":"L12-E-4","n":4,"text":"При кой вид буфериране всички фреймове са в обща памет и не формират отделни опашки за всеки порт?","opts":["Port-based Memory Buffering","Fragment-free буфериране","Adaptive cut-through буфериране","Shared Memory Buffering"],"correct":3,"expl":"**Shared Memory Buffering** — обща памет за всички фреймове."},{"id":"L12-E-5","n":5,"text":"Кой адрес от получения фрейм чете комутаторът, за да попълни бридж таблицата?","opts":["MAC адреса на дестинацията","MAC адреса на източника (сорса)","IP адреса на дестинацията","IP адреса на default gateway"],"correct":1,"expl":"Попълване: **чете се сорсовият MAC** и се записва с порта, по който е дошъл фреймът."},{"id":"L12-E-6","n":6,"text":"Какво прави комутаторът първо след като получи фрейм (по алгоритъма от лекцията)?","opts":["Проверява CRC и изхвърля фреймовете с грешка в контролната сума","Изпраща ARP request за дестинационния IP адрес на фрейма","Научава сорсовия MAC адрес и стартира (или рестартира) таймер","Изпраща фрейма веднага на всички портове, освен входящия"],"correct":2,"expl":"Първата стъпка е **научаване на сорсовия MAC и стартиране/рестартиране на таймера**."},{"id":"L12-E-7","n":7,"text":"Хостове 1111 и 4444 едновременно изпращат фреймове към 3333 през комутатора. Какво се случва?","opts":["Получава се колизия и двата хоста изпращат jam","Единият фрейм се изхвърля","Комутаторът ги наводнява към всички портове","Няма колизия — фреймовете се буферират"],"correct":3,"expl":"В комутатора **няма колизия**, а **буфериране на фреймовете**."},{"id":"L12-E-8","n":8,"text":"Как се определя закъснението (latency) в комутатора?","opts":["От изпращането на първия бит от хоста до получаването на ACK от получателя","Времето до най-далечния край на мрежата и обратно (round-trip time)","От постъпването на фрейма до момента, в който краят му напусне комутатора","Времето между края на един фрейм и началото на следващия"],"correct":2,"expl":"Latency в комутатора — **от влизането на фрейма до излизането на края му**."},{"id":"L12-E-9","n":9,"text":"Кой метод на комутация има най-малко закъснение?","opts":["Fast-forward","Fragment-free","Store-and-forward","Adaptive cut-through в режим store-and-forward"],"correct":0,"expl":"**Fast-forward** препраща **веднага след дестинационния MAC** → най-малко закъснение."},{"id":"L12-E-10","n":10,"text":"По кой признак комутаторите се делят на Layer 2 и Layer 3?","opts":["По организация на буферирането","По пропускателна способност","По режим на предаване","По използваната служебна информация"],"correct":3,"expl":"Layer 2/Layer 3 — **по използваната служебна информация** (MAC или MAC + IP)."}]}},{"num":13,"title":"Лекция 13 — ARP и Neighbor Discovery Protocol (NDP)","short":"ARP и Neighbor Discovery Protocol (NDP)","summary":"### Address Resolution Protocol (ARP)\n- **ARP** служи за **намиране на физическия адрес** (MAC, Token Ring, FDDI или IEEE 802.11, ATM) на дадено устройство **по неговия адрес от мрежовия слой (IPv4)**.\n- Протоколът е дефиниран в **RFC 826**.\n- **Функциите на ARP за IPv6 се предоставят от Neighbor Discovery Protocol (NDP)**.\n\n### Маршрутизиране\n- **Маршрутизиране** — процес на **доставяне на пакет от източник (сорс) до получател (дестинация)**, при който **мрежовите устройства вземат решения за пътя** на доставката **с помощта на протоколи**.\n- Възможно е и **задаване на статичен път**.\n- Всяко устройство има **2 адреса**:\n  - **Физически (MAC)** — за комуникация **от NIC до NIC в сегмента**;\n  - **Логически (IP)** — за комуникация **от оригиналния сорс до дестинацията**.\n\n### Директно / индиректно маршрутизиране\n| Вид | Кога | Дестинационен MAC във фрейма | Дестинационен IP в пакета |\n|---|---|---|---|\n| **Директно** | дестинацията е **в същия сегмент** | MAC на самата дестинация | IP на дестинацията |\n| **Индиректно** | дестинацията е **в друг сегмент** — използва се **конфигурираният default gateway** | **MAC на default gateway (рутера)** | IP на **крайната** дестинация |\n\n### Работа на ARP\n1. ARP изпраща **запитване (ARP Request)** в локалната мрежа и **търси MAC адреса на собственика на IP адреса получател**.\n2. **Хостът, разпознал IP-то си**, изпраща **MAC-а си като отговор (ARP Response/Reply)**.\n3. MAC адресът на получателя **се кешира в таблица (ARP Table)**, за да може при бъдеща комуникация ARP автоматично да асоциира IP-то с MAC адреса.\n\n### ARP таблица\n- Съдържа **двойки IPv4 – MAC адреси**.\n- Ако дестинационният IPv4 е **в същата мрежа** като сорсовия → хостът търси в ARP таблицата **дестинационния IPv4**.\n- Ако дестинационният IPv4 е **в различна мрежа** → хостът търси в ARP таблицата **IPv4 адреса на конфигурирания default gateway**.\n- **Ако IPv4 се намери** → неговият MAC се ползва **като дестинационен в локалния сегмент**.\n- **Ако не се намери** → **изпраща се ARP request**.\n- Командата **`arp -a`** показва таблицата: колони **Internet Address**, **Physical Address**, **Type** — **dynamic** (научени) или **static**. Пример: `192.168.1.1  24-df-6a-b9-8a-5a  dynamic`; `192.168.1.255  ff-ff-ff-ff-ff-ff  static` (бродкаст); `224.0.0.22  01-00-5e-00-00-16  static` (мултикаст).\n- Други опции (помощ `arp /?`): **`arp -s`** — добавя **статичен** запис (IP ↔ MAC); **`arp -d`** — **изтрива** запис; **`arp -a`** / `-g` — показва записите.\n\n### ARP Request\n- **ARP request е бродкаст** — Ethernet дестинация **`ff:ff:ff:ff:ff:ff`**.\n- Съдържа **IPv4 адреса, на който се иска MAC адресът**, както и **IPv4 и MAC на сорса**.\n- Полето **Target MAC address е празно (`00:00:00:00:00:00`)**.\n- В Wireshark: „**Who has 192.168.1.4? Tell 192.168.1.1**“; размер **42 bytes**; Hardware type: **Ethernet (1)**; Protocol type: **IPv4 (0x0800)**; **Hardware size: 6**; **Protocol size: 4**; **Opcode: request (1)**; Sender MAC/IP, Target MAC (нули)/IP.\n\n### ARP Reply\n- **ARP reply е уникаст**, но **поради бродкастния характер на средата се „чува“ от всички** в локалния сегмент.\n- В Wireshark: „**192.168.1.1 is at 24:df:6a:b9:8a:5a**“; **Opcode: reply (2)**; Target MAC/IP = данните на питащия.\n\n### ARP в индиректно маршрутизиране\n- Ако дестинационният IPv4 е **в различна мрежа**, хостът търси в ARP таблицата **IPv4 адреса на default gateway**, за да разбере **неговия MAC**.\n- Ако **няма запис** за default gateway → използва се **ARP процесът за определяне на MAC адреса на default gateway**.\n\n### Изчистване на записи от ARP таблицата\n- Когато **таймерът на записа IPv4–MAC изтече**, записът **се премахва**.\n- Таймерът **се конфигурира**; **по подразбиране е 2 минути** („I will remove this ARP entry if I have not used it in 2 minutes“).\n- Някои записи могат да се **изтрият ръчно** (`arp -d`).\n\n### Проблеми с ARP\n- **ARP бродкастите могат да задръстят преносната среда**, ако **всички устройства се включат едновременно** и **таблиците им са празни** (shared media, multiple access).\n- Сигурност (схема на слайда): A пита „ARP Request: I need the MAC address of default gateway 192.168.1.1“, а злонамерен хост C: „**I will send an ARP reply and pretend to be the default gateway**“ → **подправен ARP reply (ARP spoofing)** — трафикът към gateway-я се пренасочва към нападателя.\n\n### Варианти на ARP\n| Протокол | Какво прави | Бележки |\n|---|---|---|\n| **Reverse ARP (RARP)** | клиентска машина в LAN **изпраща своя MAC адрес до RARP сървър**, за да **поиска своя IPv4 адрес** | **не се използва в съвременни мрежи, т.к. има DHCP**; **мрежовият администратор създава таблицата** MAC→IP в RARP сървъра |\n| **Inverse ARP** | **използва MAC адрес за намиране на IP адрес** (вместо IP → MAC) — **точно обратното на ARP** | **използва се единствено за конфигурация в ATM мрежи и DLCI във frame relay** |\n| **Proxy ARP** | позволява на устройства в **разделени мрежови сегменти, свързани от маршрутизатор в една IP мрежа**, да преобразуват IP в MAC адреси | **активиран по подразбиране**; „прокси рутерът“ **отговаря със своя MAC адрес** |\n| **Gratuitous ARP** | при стартиране (включване на NIC) компютърът **автоматично изпраща своя MAC адрес към цялата мрежа** | **откриване на IP конфликт**; обновяване на ARP и бридж таблицата на суича |\n\n- **Обратният ARP е заменен от BOOTP и по-късно DHCP** (на слайда е написано в раздела за Inverse ARP — вж. Капани).\n\n### Proxy ARP — подробно\n- Устройствата **не са в една и съща мрежа на Data Link слой, но са в една IP мрежа** → опитват да предават едно на друго, **сякаш са в локалната мрежа**.\n- **Рутерът, който разделя устройствата, няма да изпрати бродкаста** → адресите не могат да бъдат получени директно.\n- **Proxy ARP е активиран по подразбиране** → прокси рутерът между локалните мрежи **отговаря със своя MAC адрес**, сякаш е устройството, към което е адресиран бродкастът.\n- Изпращащото устройство **изпраща съобщенията си до прокси рутера**, който **на свой ред ги изпраща до дестинацията**.\n\n### Gratuitous ARP — подробно\n- При **първо стартиране** (включване на NIC) компютърът **автоматично изпраща своя MAC адрес към цялата мрежа**.\n- След това **MAC адресът е известен на всеки комутатор** и позволява на **DHCP сървърите** да знаят **къде да изпратят IP адреса** по този MAC.\n- Работи както с **Gratuitous ARP request**, така и с **Gratuitous ARP reply**.\n- Полезен за **откриване на IP конфликт** в мрежата.\n- Използва се **от суича** за **актуализиране на ARP таблицата и бридж таблицата му (port – MAC address)**.\n\n### Neighbor Discovery Protocol (NDP)\n- **NDP работи с IPv6**.\n- Работи **като ARP и ICMP**, както и **протоколите за откриване на рутер (router discovery) и пренасочване на рутер (redirect)**, използвани в IPv4.\n- Според слайда **работи на Data Link слой**.\n- Отговаря за **събирането на различна информация, необходима за мрежова комуникация**.\n- **Inverse Neighbor Discovery (IND)** позволява на хостовете да **определят и рекламират IPv6 адрес, съответстващ на даден MAC адрес** — **подобно на Reverse ARP за IPv4**.\n\n### Капани за изпита\n- ARP: **IP → MAC** (IPv4); RARP и Inverse ARP: **MAC → IP**; за IPv6 — **NDP**, а аналогът на RARP е **IND**.\n- **RFC 826** — ARP.\n- **ARP request = бродкаст** (`ff:ff:ff:ff:ff:ff`), **ARP reply = уникаст** (но се „чува“ от всички в сегмента заради споделената среда).\n- В ARP request **Target MAC = `00:00:00:00:00:00`** (празно), а **Ethernet дестинацията = `FF:FF:FF:FF:FF:FF`** — не ги бъркай.\n- **Opcode 1 = request**, **Opcode 2 = reply**; Hardware size **6** (MAC), Protocol size **4** (IPv4); Protocol type **0x0800**.\n- Към друга мрежа хостът търси в ARP таблицата **MAC на default gateway**, а не на крайната дестинация; **IP адресът на дестинацията остава крайният**.\n- Таймер на ARP записа — **2 минути** по подразбиране (по лекцията); не бъркай с **5 минути** за записите в бридж таблицата на комутатора (Лекция 12).\n- Слайдът за **Inverse ARP** пише „**Обратният ARP е заменен от BOOTP и по-късно DHCP**“ — всъщност това се отнася за **Reverse ARP (RARP)** (на слайда за RARP: „не се използва, т.к. има DHCP“). Inverse ARP остава в **ATM и frame relay (DLCI)**.\n- Слайдът казва, че **NDP работи на Data Link слой** — в действителност NDP използва **ICMPv6 (мрежов слой)**, но изпълнява функциите на ARP за свързване на IPv6 с адреси от канален слой.\n- **Proxy ARP**: рутерът отговаря **със собствения си MAC**; активиран е **по подразбиране**.\n- **Gratuitous ARP**: изпраща **собствения** MAC при стартиране; служи за **откриване на IP конфликт** и обновяване на таблиците на суича; има и **request**, и **reply**.\n- Проблем на ARP: **бродкаст буря** при едновременно включване с празни таблици.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L13-A-1","n":1,"text":"За какво служи ARP?","opts":["За намиране на IPv4 адреса на устройство по неговия MAC адрес","За намиране на физическия адрес на устройство по неговия IPv4 адрес","За автоматично раздаване на IP адреси","За намиране на най-добрия път до отдалечена мрежа"],"correct":1,"expl":"**ARP: IPv4 → физически (MAC) адрес**; обратното правят RARP/Inverse ARP."},{"id":"L13-A-2","n":2,"text":"Освен чрез протоколи, как още може да се определи пътят при маршрутизиране?","opts":["Чрез задаване на статичен път","Чрез Gratuitous ARP","Чрез бридж таблицата на комутатора","Чрез полето Preamble"],"correct":0,"expl":"Възможно е и **задаване на статичен път**."},{"id":"L13-A-3","n":3,"text":"Какво търси ARP Request в локалната мрежа?","opts":["IP адреса на собственика на даден MAC","Адреса на DHCP сървъра","Номера на порта на комутатора","MAC адреса на собственика на IP адреса получател"],"correct":3,"expl":"ARP Request **търси MAC адреса на собственика на целевия IP**."},{"id":"L13-A-4","n":4,"text":"Дестинационният IPv4 адрес е в различна мрежа. Какво търси хостът в ARP таблицата?","opts":["Дестинационния IPv4 адрес","Broadcast адреса на отдалечената мрежа","MAC адреса на отдалечения сървър","IPv4 адреса на конфигурирания default gateway"],"correct":3,"expl":"Към друга мрежа хостът търси **MAC адреса на default gateway**."},{"id":"L13-A-5","n":5,"text":"Какъв е дестинационният MAC адрес в Ethernet хедъра на ARP request?","opts":["00:00:00:00:00:00","MAC адресът на целевия хост","ff:ff:ff:ff:ff:ff","MAC адресът на изпращача"],"correct":2,"expl":"ARP request е бродкаст → Ethernet Dst **ff:ff:ff:ff:ff:ff** (а Target MAC в ARP полето е нули)."},{"id":"L13-A-6","n":6,"text":"Кога записът IPv4–MAC се премахва автоматично от ARP таблицата?","opts":["Когато изтече таймерът на записа","Когато комутаторът се рестартира","Когато се получи ARP request от друг хост","Когато хостът изпрати Gratuitous ARP"],"correct":0,"expl":"Записът се премахва, **щом изтече таймерът му**."},{"id":"L13-A-7","n":7,"text":"Какъв проблем може да се получи с ARP според лекцията?","opts":["Препълване на ARP таблицата с повече от 1024 записа на хост при голяма мрежа","Колизии от ARP reply-ите във full-duplex връзките на суича при голям трафик","Задръстване на средата от ARP бродкасти при едновременно включване с празни таблици","ARP не работи, когато хостовете са в един и същ сегмент на локалната мрежа"],"correct":2,"expl":"**ARP бродкастите могат да задръстят средата** при едновременно включване с празни таблици."},{"id":"L13-A-8","n":8,"text":"Какво прави Inverse ARP?","opts":["Използва IP адрес за намиране на MAC адрес","Използва MAC адрес за намиране на IP адрес","Разпраща собствения MAC при стартиране","Отговаря на ARP заявки от името на друг хост"],"correct":1,"expl":"**Inverse ARP** е точно обратното на ARP: **MAC → IP**."},{"id":"L13-A-9","n":9,"text":"Какво е състоянието на Proxy ARP по подразбиране според лекцията?","opts":["Изключен е по подразбиране","Активира се само при IPv6","Активира се само в ATM мрежи","Активиран е по подразбиране"],"correct":3,"expl":"**Proxy ARP е активиран по подразбиране**."},{"id":"L13-A-10","n":10,"text":"Кое твърдение за Gratuitous ARP е вярно?","opts":["Работи само с Gratuitous ARP request","Работи и с request, и с reply","Работи само с Gratuitous ARP reply","Използва се единствено в frame relay"],"correct":1,"expl":"Gratuitous ARP има **и request, и reply** вариант."}],"B":[{"id":"L13-B-1","n":1,"text":"В кой RFC е дефиниран ARP?","opts":["RFC 791","RFC 2131","RFC 4861","RFC 826"],"correct":3,"expl":"ARP е дефиниран в **RFC 826**."},{"id":"L13-B-2","n":2,"text":"За каква комуникация служи логическият (IP) адрес?","opts":["Само от NIC до NIC в сегмента","Само между портовете на комутатора","От оригиналния сорс до дестинацията","Само до default gateway"],"correct":2,"expl":"**IP** — от оригиналния сорс до дестинацията; **MAC** — от NIC до NIC в сегмента."},{"id":"L13-B-3","n":3,"text":"Кой изпраща ARP Response (Reply)?","opts":["Комутаторът, към който е свързан питащият","Хостът, разпознал своя IP адрес в запитването","Всички хостове в сегмента","DHCP сървърът"],"correct":1,"expl":"Отговаря **хостът, разпознал IP-то си**, като изпраща своя MAC."},{"id":"L13-B-4","n":4,"text":"Какво прави хостът, ако търсеният IPv4 адрес не е в ARP таблицата?","opts":["Изпраща Gratuitous ARP reply","Изхвърля пакета","Изпраща ARP request","Изпраща RARP заявка до сървър"],"correct":2,"expl":"Ако IPv4 **не е намерен**, се изпраща **ARP request**."},{"id":"L13-B-5","n":5,"text":"Кое твърдение за ARP reply е вярно?","opts":["Уникаст е, но се „чува“ от всички в сегмента","Бродкаст е и се обработва от всички хостове","Мултикаст е и се получава само от рутерите","Изпраща се само ако питащият е в друга мрежа"],"correct":0,"expl":"**ARP reply е уникаст**, но се „чува“ от всички заради споделената среда."},{"id":"L13-B-6","n":6,"text":"Каква е стойността по подразбиране на таймера на ARP запис според лекцията?","opts":["5 минути","30 секунди","24 часа","2 минути"],"correct":3,"expl":"Таймерът се конфигурира, **по подразбиране — 2 минути** (5 минути е за бридж таблицата)."},{"id":"L13-B-7","n":7,"text":"На слайда „Проблеми с ARP“ хост C заявява: „Ще изпратя ARP reply и ще се престоря на default gateway“. До какво води това?","opts":["Default gateway-ят изпраща Gratuitous ARP и спира C","Комутаторът блокира всички ARP request","Трафикът на питащия хост към gateway-я се пренасочва към C","Питащият хост получава нов IP адрес от C"],"correct":2,"expl":"Подправен ARP reply (**ARP spoofing**) свързва IP на gateway-я с MAC на C → трафикът отива към нападателя."},{"id":"L13-B-8","n":8,"text":"Къде се използва единствено Inverse ARP?","opts":["В безжични мрежи по стандарта IEEE 802.11","За конфигурация в ATM мрежи и DLCI във frame relay","В IPv6 мрежи вместо протокола NDP","При стартиране на компютър, получаващ IP от DHCP"],"correct":1,"expl":"Inverse ARP — **само в ATM мрежи и DLCI във frame relay**."},{"id":"L13-B-9","n":9,"text":"Защо при Proxy ARP хостовете не могат сами да получат адресите един на друг?","opts":["Рутерът, който разделя устройствата, не препраща бродкаста","ARP reply-ите са мултикаст и не достигат до хостовете","Хостовете са в различни IP мрежи","Комутаторът изтрива записите след 5 минути"],"correct":0,"expl":"Рутерът **не изпраща бродкаст** между сегментите → нужен е прокси отговор."},{"id":"L13-B-10","n":10,"text":"С коя версия на IP работи NDP?","opts":["IPv4","IPv6","IPX","AppleTalk"],"correct":1,"expl":"**NDP работи с IPv6**."}],"C":[{"id":"L13-C-1","n":1,"text":"Кой протокол предоставя функциите на ARP за IPv6?","opts":["Reverse ARP (RARP)","Neighbor Discovery Protocol (NDP)","Proxy ARP (през рутер)","Inverse ARP (InARP)"],"correct":1,"expl":"За IPv6 функциите на ARP се изпълняват от **NDP**."},{"id":"L13-C-2","n":2,"text":"Кога маршрутизирането е директно?","opts":["Когато дестинацията е в друг сегмент","Когато се използва default gateway","Когато дестинацията е в същия сегмент","Когато се използва Proxy ARP"],"correct":2,"expl":"**Директно** — дестинацията е **в същия сегмент**."},{"id":"L13-C-3","n":3,"text":"Къде се кешира MAC адресът на получателя след ARP отговор?","opts":["В ARP таблицата","В бридж (CAM) таблицата","В таблицата за маршрутизиране","В ROM на мрежовата карта"],"correct":0,"expl":"MAC адресът се кешира в **ARP Table** за бъдеща комуникация."},{"id":"L13-C-4","n":4,"text":"Какъв вид съобщение е ARP request?","opts":["Уникаст","Мултикаст","Anycast","Бродкаст"],"correct":3,"expl":"**ARP request е бродкаст**; ARP reply е уникаст."},{"id":"L13-C-5","n":5,"text":"Каква е стойността на полето Opcode в ARP reply?","opts":["1","2","0","4"],"correct":1,"expl":"**Opcode 1 = request**, **Opcode 2 = reply**."},{"id":"L13-C-6","n":6,"text":"Коя команда в Windows изтрива запис от ARP таблицата?","opts":["`arp -a`","`arp -s`","`ipconfig /all`","`arp -d`"],"correct":3,"expl":"**`arp -d`** — изтрива; `arp -a` — показва; `arp -s` — добавя статичен запис."},{"id":"L13-C-7","n":7,"text":"Защо Reverse ARP (RARP) не се използва в съвременните мрежи?","opts":["Защото е заменен от Proxy ARP","Защото работи само с IPv6","Защото има DHCP","Защото е заменен от Gratuitous ARP"],"correct":2,"expl":"RARP **не се използва, т.к. има DHCP**."},{"id":"L13-C-8","n":8,"text":"Кой протокол е заменен от BOOTP и по-късно от DHCP?","opts":["Reverse ARP (RARP)","Proxy ARP","Gratuitous ARP","Neighbor Discovery Protocol"],"correct":0,"expl":"**RARP** е заменен от BOOTP/DHCP (на слайда изречението е в раздела за Inverse ARP)."},{"id":"L13-C-9","n":9,"text":"Кога компютърът изпраща Gratuitous ARP?","opts":["При стартиране — разпраща собствения си MAC до цялата мрежа","Когато изтече таймерът на някой от ARP записите","Когато търси MAC адреса на default gateway","Когато рутерът трябва да отговори вместо друг хост"],"correct":0,"expl":"**Gratuitous ARP** — при стартиране хостът **разпраща собствения си MAC**."},{"id":"L13-C-10","n":10,"text":"Функциите на кои IPv4 протоколи обединява NDP?","opts":["DHCP, DNS и BOOTP от IPv4 стека на протоколи","ARP, ICMP, откриване на рутер и пренасочване на рутер","RARP, BOOTP и Proxy ARP от IPv4 стека","TCP, UDP и IGMP от IPv4 стека на протоколи"],"correct":1,"expl":"NDP работи **като ARP и ICMP**, плюс **router discovery и redirect** от IPv4."}],"D":[{"id":"L13-D-1","n":1,"text":"Кое НЕ е посочено като вид физически адрес, който ARP може да намери?","opts":["IPv6 адрес","MAC адрес","Token Ring адрес","FDDI адрес"],"correct":0,"expl":"ARP намира физически адреси (MAC, Token Ring, FDDI, IEEE 802.11, ATM); **IPv6 е логически адрес**."},{"id":"L13-D-2","n":2,"text":"Какво се използва при индиректно маршрутизиране?","opts":["Конфигурираният default gateway","Gratuitous ARP","Inverse ARP","Бродкаст до всички мрежи"],"correct":0,"expl":"**Индиректно** — дестинацията е в друг сегмент и се използва **default gateway**."},{"id":"L13-D-3","n":3,"text":"Какво съдържа ARP таблицата?","opts":["Двойки номер на порт – MAC адрес","Двойки IPv4 – MAC адреси","Двойки мрежа – следващ скок","Двойки MAC адрес – OUI"],"correct":1,"expl":"ARP таблицата съдържа **IPv4 – MAC** двойки; port – MAC е бридж таблицата."},{"id":"L13-D-4","n":4,"text":"Какво НЕ съдържа ARP request?","opts":["IPv4 адреса, за който се иска MAC адресът","IPv4 адреса на сорса","MAC адреса на сорса","MAC адреса на целевия хост"],"correct":3,"expl":"Request съдържа целевия IPv4 и IPv4 + MAC на сорса; **Target MAC е празен** (именно той се търси)."},{"id":"L13-D-5","n":5,"text":"В уловен ARP пакет Hardware size = 6 и Protocol size = 4. Какво означават тези стойности?","opts":["Пакетът е 6-ият поред, а протоколът е IPv4","MAC адресът е 4 B, а IPv4 адресът — 6 B","Има 6 хоста и 4 рутера в сегмента","Дължината на MAC адреса е 6 B, а на IPv4 адреса — 4 B"],"correct":3,"expl":"Hardware size **6** = MAC (6 B), Protocol size **4** = IPv4 (4 B); Protocol type = IPv4 (0x0800)."},{"id":"L13-D-6","n":6,"text":"Коя команда показва ARP таблицата с колоните Internet Address, Physical Address и Type?","opts":["`arp -d`","`ipconfig /all`","`arp -a`","`arp -s`"],"correct":2,"expl":"**`arp -a`** показва записите; Type е **dynamic** или **static**."},{"id":"L13-D-7","n":7,"text":"Какво прави клиент при Reverse ARP (RARP)?","opts":["Изпраща своя IPv4 адрес, за да научи MAC адреса на сървъра","Изпраща своя MAC до всички комутатори при стартиране","Изпраща своя MAC адрес до RARP сървър, за да поиска своя IPv4 адрес","Отговаря със своя MAC вместо друг хост"],"correct":2,"expl":"**RARP**: клиентът изпраща **своя MAC**, за да получи **своя IPv4** от RARP сървъра."},{"id":"L13-D-8","n":8,"text":"Какво позволява Proxy ARP?","opts":["Хостът да намери собствения си IPv4 адрес по своя MAC адрес при стартиране","Комутаторът да обнови бридж таблицата си при стартиране на нов хост","IPv6 хостовете да рекламират адресите си в локалната мрежа","Преобразуване IP → MAC между разделени от рутер сегменти на една IP мрежа"],"correct":3,"expl":"**Proxy ARP** — за сегменти, **разделени от рутер, но в една IP мрежа**."},{"id":"L13-D-9","n":9,"text":"За откриване на какво е полезен Gratuitous ARP?","opts":["Колизии в half-duplex среда","IP конфликт в мрежата","Грешна CRC във фрейма","Затворени портове на сървъра"],"correct":1,"expl":"Gratuitous ARP е полезен за **откриване на IP конфликт**."},{"id":"L13-D-10","n":10,"text":"На кой слой работи NDP според слайда?","opts":["На транспортния слой","На приложния слой","На Data Link слой","На сесийния слой"],"correct":2,"expl":"Слайдът: NDP **работи на Data Link слой** (реално използва ICMPv6 — вж. Капани)."}],"E":[{"id":"L13-E-1","n":1,"text":"Как се дефинира маршрутизирането в лекцията?","opts":["Преобразуване на IP адрес в MAC адрес в рамките на локалния сегмент чрез бродкаст","Доставка на фрейм от NIC до NIC в рамките на същия сегмент по MAC адресите","Доставяне на пакет от сорс до дестинация, като устройствата избират пътя чрез протоколи","Разделяне на мрежата на колизионни домейни чрез комутатори"],"correct":2,"expl":"**Маршрутизиране** — доставка от сорс до дестинация, като устройствата **решават пътя чрез протоколи**."},{"id":"L13-E-2","n":2,"text":"PC в мрежа 192.168.1.0 изпраща пакет до сървър в друга мрежа. Какъв ще е дестинационният MAC адрес във фрейма, излизащ от PC?","opts":["MAC адресът на default gateway (рутера)","MAC адресът на отдалечения сървър","Бродкаст адресът FF:FF:FF:FF:FF:FF","Празният адрес 00:00:00:00:00:00"],"correct":0,"expl":"При индиректно маршрутизиране **дестинационният MAC е на default gateway**, а дестинационният IP — на сървъра."},{"id":"L13-E-3","n":3,"text":"Дестинационният IPv4 адрес е в същата мрежа като сорсовия. Какво търси хостът в ARP таблицата?","opts":["IPv4 адреса на default gateway","MAC адреса на комутатора","IPv4 адреса на DHCP сървъра","Дестинационния IPv4 адрес"],"correct":3,"expl":"В същата мрежа хостът търси **дестинационния IPv4**, за да получи неговия MAC."},{"id":"L13-E-4","n":4,"text":"Каква е стойността на полето Target MAC address в ARP request?","opts":["FF:FF:FF:FF:FF:FF","00:00:00:00:00:00","MAC адресът на default gateway","01:00:5E:00:00:16"],"correct":1,"expl":"Target MAC в request е **празен — 00:00:00:00:00:00**."},{"id":"L13-E-5","n":5,"text":"Хостът изпраща към друга мрежа, но в ARP таблицата му няма запис за default gateway. Какво прави?","opts":["Изпраща ARP request за IP адреса на отдалечения сървър в другата мрежа","Изпраща пакета с дестинационен MAC FF:FF:FF:FF:FF:FF","Използва Inverse ARP, за да намери IP адреса на default gateway","Използва ARP процеса, за да определи MAC адреса на default gateway"],"correct":3,"expl":"Без запис за gateway се използва **ARP за MAC адреса на default gateway**."},{"id":"L13-E-6","n":6,"text":"В изхода на `arp -a` записът 192.168.1.255 → ff-ff-ff-ff-ff-ff е с какъв тип?","opts":["dynamic","static","proxy","gratuitous"],"correct":1,"expl":"Бродкаст и мултикаст записите (напр. 192.168.1.255, 224.0.0.22) са **static**; научените от ARP са dynamic."},{"id":"L13-E-7","n":7,"text":"Кой създава таблицата MAC → IP в RARP сървъра?","opts":["Мрежовият администратор","Самият RARP сървър чрез ARP request","DHCP сървърът","Комутаторът чрез бридж таблицата"],"correct":0,"expl":"**Мрежовият администратор** създава таблицата в RARP сървъра."},{"id":"L13-E-8","n":8,"text":"С какъв MAC адрес отговаря прокси рутерът при Proxy ARP?","opts":["Със своя собствен MAC адрес","С MAC адреса на търсения хост","С FF:FF:FF:FF:FF:FF","С 00:00:00:00:00:00"],"correct":0,"expl":"Прокси рутерът **отговаря със своя MAC**, сякаш е търсеното устройство."},{"id":"L13-E-9","n":9,"text":"За какво комутаторът използва Gratuitous ARP?","opts":["За раздаване на IP адреси на хостовете, свързани към портовете му","За определяне на най-добрия път до другите мрежи по IP адресите","За актуализиране на ARP таблицата и бридж таблицата си (port – MAC)","За превключване от cut-through към store-and-forward комутация"],"correct":2,"expl":"Суичът използва Gratuitous ARP за **обновяване на ARP и бридж таблицата**."},{"id":"L13-E-10","n":10,"text":"Какво позволява Inverse Neighbor Discovery (IND)?","opts":["Намиране на MAC адрес по известен IPv4 адрес","Отговор на рутер със своя MAC вместо друг хост","Определяне и рекламиране на IPv6 адрес по даден MAC адрес","Изтриване на остарели записи от ARP таблицата"],"correct":2,"expl":"**IND** — IPv6 адрес по MAC, **подобно на Reverse ARP за IPv4**."}]}}],"sample":[],"taskGroups":[],"tasks":[]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.course; // pfx, tag, name, lecWord, secPerQ, secPerTask, exam {q, ptsQ, tasks, ptsTask, minutes}
const app = document.getElementById('app');
const LETTERS = 'abcd';
const SEC_PER_Q = C.secPerQ;
const SEC_PER_TASK = C.secPerTask || 600;
const EX = C.exam;
const TASKS = DATA.tasks || [];
const GROUPS = DATA.taskGroups || [];
const TASK_WORD = C.taskWord || 'Задача';          // как се казва писменият елемент
const TASKS_TITLE = C.tasksTitle || 'Писмени задачи';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const ALL = [];
for (const l of DATA.lectures) for (const t of l.testNames) for (const q of l.tests[t]) ALL.push(Object.assign({ lec: l.num, test: t }, q));
const SAMPLE = (DATA.sample || []).map((q, i) => Object.assign({ lec: 0, test: 'S', id: 'S-' + (i + 1), n: i + 1 }, q));
const BY_ID = {};
for (const q of ALL.concat(SAMPLE)) BY_ID[q.id] = q;
for (const t of TASKS) BY_ID[t.id] = Object.assign({ isTask: true }, t);

const PFX = C.pfx; // префикс на ключовете в localStorage
let settings = store.get(PFX + '-settings', { instant: false, shuffle: false, forward: false });
let mistakes = new Set(store.get(PFX + '-mistakes', []));
let best = store.get(PFX + '-best', {});
let theme = store.get(PFX + '-theme', 'auto');
let hist = store.get(PFX + '-history', []);
if (!Array.isArray(hist)) hist = [];
let userName = store.get(PFX + '-name', null);
let editName = false;
applyTheme();

let Q = null, timerId = null;

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const md = s => window.marked ? marked.parse(s) : `<pre style="white-space:pre-wrap">${esc(s)}</pre>`;
const num2 = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const ptsTxt = n => String(Math.round(n * 10) / 10).replace('.', ',');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lecName(n) { if (!n) return 'Примерен тест'; const l = DATA.lectures.find(x => x.num === n); return C.lecWord + ' ' + n + ' — ' + l.short; }
function groupOf(key) { return GROUPS.find(g => g.key === key); }
function itemTag(q) {
  if (!q.isTask) return esc(lecName(q.lec));
  const g = groupOf(q.group);
  return `${TASK_WORD} · ${esc(g.title)}${g.title.startsWith(C.lecWord) ? '' : ` · ${C.lecWord} ${q.lec}`}${q.src ? ` · <span class="badge half">${esc(q.src)}</span>` : ''}`;
}
function render(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h + ':' + pad(m) + ':' + pad(s); }

function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
const THEME_LABEL = { auto: '◐ Тема: авто', light: '☀ Тема: светла', dark: '☾ Тема: тъмна' };

function badge(key) {
  const b = best[key];
  if (!b) return '';
  const cls = b.s / b.t >= 0.9 ? 'good' : (b.s / b.t < 0.6 ? 'bad' : '');
  return `<span class="badge ${cls}">${ptsTxt(b.s)}/${b.t}</span>`;
}

/* ---------- Проверка на писмените задачи ---------- */
// кирилски букви, които изглеждат като латински (А, В, С, Е, Д→D)
const LOOK = { 'А': 'A', 'В': 'B', 'С': 'C', 'Е': 'E', 'Д': 'D', 'а': 'A', 'в': 'B', 'с': 'C', 'е': 'E', 'д': 'D' };
const latin = s => String(s).replace(/[АВСЕДавсед]/g, c => LOOK[c]);

function normNum(s) {
  s = latin(s).toUpperCase().replace(/\((2|3|8|10|16|BCD)\)|BCD|[₀-₉]+$/g, '').replace(/[\s_|]/g, '').replace(',', '.').replace(/^\+/, '');
  let [i, f] = s.split('.');
  i = (i || '').replace(/^0+(?=.)/, '') || '0';
  f = (f || '').replace(/0+$/, '');
  return f ? i + '.' + f : i;
}
const normCode = s => latin(s).toUpperCase().replace(/[\s|.,_]/g, '');
const parseSet = s => [...new Set((String(s).match(/\d+/g) || []).map(Number))].sort((a, b) => a - b);

// логически израз: отрицание ' ! ¬ ~ или черта (U+0305); И: · . * & ∧ или нищо; ИЛИ: + | ∨
function parseBool(src, vars) {
  const s = latin(src).replace(/̅/g, "'");
  let p = 0, lits = 0;
  const peek = () => { while (p < s.length && /\s/.test(s[p])) p++; return s[p]; };
  const startsUnary = c => c !== undefined && (/[A-Za-z01(!¬~]/.test(c));
  function or() {
    let a = and();
    while (/[+|∨]/.test(peek() || '')) { p++; const l = a, r = and(); a = e => l(e) || r(e); }
    return a;
  }
  function and() {
    let a = unary();
    for (;;) {
      const c = peek();
      if (c !== undefined && /[·.*&∧⋅]/.test(c)) { p++; const l = a, r = unary(); a = e => l(e) && r(e); }
      else if (startsUnary(c)) { const l = a, r = unary(); a = e => l(e) && r(e); }
      else return a;
    }
  }
  function unary() {
    const c = peek();
    if (c !== undefined && /[!¬~]/.test(c)) { p++; const x = unary(); return e => !x(e); }
    let a = atom();
    while (/['’′`]/.test(peek() || '')) { p++; const x = a; a = e => !x(e); }
    return a;
  }
  function atom() {
    const c = peek();
    if (c === undefined) throw new Error('изразът е непълен');
    if (c === '(') { p++; const x = or(); if (peek() !== ')') throw new Error('липсва „)“'); p++; return x; }
    if (c === '0' || c === '1') { p++; const v = c === '1'; return () => v; }
    const u = c.toUpperCase(), k = vars.indexOf(u);
    if (k < 0) throw new Error(`непозната променлива „${c}“ (позволени: ${vars.join(', ')})`);
    p++; lits++;
    return e => e[k];
  }
  if (!s.trim()) throw new Error('празно');
  const f = or();
  if (peek() !== undefined) throw new Error(`неочакван знак „${s[p]}“`);
  return { f, lits };
}

// оценка на едно поле: { credit: 0 | 0.5 | 1, note }
function checkField(fd, val) {
  val = val == null ? '' : String(val);
  if (!val.trim()) return { credit: 0, note: 'няма отговор' };
  if (fd.type === 'num') return normNum(val) === normNum(fd.answer) ? { credit: 1 } : { credit: 0 };
  if (fd.type === 'code') return normCode(val) === normCode(fd.answer) ? { credit: 1 } : { credit: 0 };
  if (fd.type === 'real') {
    const x = parseFloat(latin(val).replace(',', '.').replace(/[^0-9eE+\-.]/g, ''));
    if (isNaN(x)) return { credit: 0, note: 'не е число' };
    const tol = Math.max(fd.abs || 0.011, Math.abs(fd.answer) * (fd.tol || 0.01));
    return Math.abs(x - fd.answer) <= tol ? { credit: 1 } : { credit: 0 };
  }
  if (fd.type === 'essay') {
    const t = val.toLowerCase(); // без latin(): тук кирилицата трябва да остане кирилица
    const hit = fd.points.map(pt => pt.kw.some(k => t.includes(k.toLowerCase())));
    const n = hit.filter(Boolean).length;
    return { credit: n / fd.points.length, hit, note: `засегнати ключови моменти: ${n} от ${fd.points.length}` };
  }
  if (fd.type === 'set') { const a = parseSet(val), b = fd.answer; return a.length === b.length && a.every((x, i) => x === b[i]) ? { credit: 1 } : { credit: 0 }; }
  if (fd.type === 'bool') {
    let r;
    try { r = parseBool(val, fd.vars); } catch (e) { return { credit: 0, note: 'не мога да прочета израза: ' + e.message }; }
    const n = fd.vars.length, ones = new Set(fd.ones);
    for (let i = 0; i < (1 << n); i++) {
      const env = fd.vars.map((_, k) => !!((i >> (n - 1 - k)) & 1));
      if (!!r.f(env) !== ones.has(i)) return { credit: 0, note: `не е еквивалентен — различава се при набор ${i}` };
    }
    return r.lits <= fd.lits ? { credit: 1, note: 'еквивалентен и минимален' }
      : { credit: 0.5, note: `еквивалентен, но не минимален (${r.lits} литерала, минимумът е ${fd.lits})` };
  }
  return { credit: 0 };
}
function fieldAnswer(fd) {
  if (fd.type === 'set') return fd.answer.join(', ');
  if (fd.type === 'bool' || fd.type === 'essay') return '';
  if (fd.type === 'real') return String(fd.shown || fd.answer).replace('.', ',');
  return fd.answer;
}
const isEssay = t => t.fields.every(fd => fd.type === 'essay');
function pointsList(fd, m) {
  return `<ul class="kp">${fd.points.map((pt, k) => `<li class="${m && m.hit ? (m.hit[k] ? 'y' : 'n') : ''}">${m && m.hit ? (m.hit[k] ? '✓ ' : '✗ ') : ''}${inl(pt.t)}</li>`).join('')}</ul>`;
}
function autoTask(t, a) {
  const marks = t.fields.map((fd, k) => checkField(fd, a && a.f ? a.f[k] : ''));
  const sum = marks.reduce((s, m) => s + m.credit, 0);
  return { marks, pts: Math.round(EX.ptsTask * sum / t.fields.length * 2) / 2 };
}
const HINT = {
  num: 'само цифрите; водещите нули и индексът на основата не са задължителни',
  code: 'във вида знак|цифри, напр. 1|0011',
  set: 'номерата, разделени със запетая, напр. 1, 3, 4',
  bool: "напр. AB' + C'D — отрицание с ' или ! или ¬; И без знак или с ·; ИЛИ с +",
  real: 'число (десетична запетая или точка); приема се отклонение до ±1%',
  essay: C.essayHint || 'Отговор в 3–4 изречения.'
};

/* ---------- Тест ---------- */
// opts: { pts: точки за въпрос a–d, forward: само напред, limit: секунди }
function startQuiz(key, title, qs, opts) {
  opts = opts || {};
  const items = qs.map(q => q.isTask
    ? { id: q.id, task: true, pts: EX.ptsTask }
    : { id: q.id, order: settings.shuffle ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3], pts: opts.pts || 1 });
  const limit = opts.limit || items.reduce((s, it) => s + (it.task ? SEC_PER_TASK : SEC_PER_Q), 0);
  Q = {
    key, title, items, src: qs, opts, limit,
    answers: Array(items.length).fill(null),
    flags: Array(items.length).fill(false),
    checked: Array(items.length).fill(false),
    maxSeen: 0, forward: !!opts.forward,
    idx: 0, start: Date.now(), end: Date.now() + limit * 1000,
    instant: settings.instant, done: false
  };
  setHash('#/quiz', /^#\/(quiz|results)$/.test(location.hash));
  startTimer();
  renderQ();
}

function answered(i) {
  const a = Q.answers[i];
  if (a === null) return false;
  if (Q.items[i].task) return a.f.some(v => v && v.trim()) || !!(a.w && a.w.trim());
  return true;
}

function navClass(i) {
  const it = Q.items[i], q = BY_ID[it.id], a = Q.answers[i];
  let cls = 'nav-b' + (it.task ? ' task' : '');
  if (it.task) {
    if (Q.instant && Q.checked[i]) { const p = autoTask(q, a).pts; cls += p >= EX.ptsTask ? ' r-ok' : p > 0 ? ' r-half' : ' r-bad'; }
    else if (answered(i)) cls += ' ans';
  } else if (a !== null) cls += (Q.instant ? (a === q.correct ? ' r-ok' : ' r-bad') : ' ans');
  if (i === Q.idx) cls += ' cur';
  if (Q.flags[i]) cls += ' fl';
  return cls;
}

function navGrid() {
  return Q.items.map((it, i) => {
    const locked = Q.forward && i < Q.idx;
    return `<button class="${navClass(i)}" data-act="go" data-i="${i}" ${locked ? 'disabled' : ''} aria-label="${it.task ? 'Задача' : 'Въпрос'} ${i + 1}">${it.task ? '✎' + (i + 1 - Q.items.filter(x => !x.task).length) : i + 1}</button>`;
  }).join('');
}

function refreshNav(i) {
  const b = app.querySelector(`.nav-b[data-i="${i}"]`);
  if (b) b.className = navClass(i);
}

function taskBody(it, q, a, locked) {
  const res = locked ? autoTask(q, a) : null;
  const fields = q.fields.map((fd, k) => {
    const v = a && a.f ? a.f[k] || '' : '';
    let cls = '', mark = '';
    if (res) {
      const m = res.marks[k];
      cls = m.credit === 1 ? 'ok' : m.credit > 0 ? 'half' : 'bad';
      const right = fieldAnswer(fd);
      mark = `<div class="mark" style="color:var(--${cls === 'ok' ? 'ok' : cls === 'half' ? 'half' : 'bad'})">${m.credit === 1 ? '✓ Вярно' : m.credit > 0 ? '½ Частично' : '✗ Грешно'}${m.note && m.credit !== 1 ? ' — ' + esc(m.note) : ''}${m.credit < 1 && right ? ` · верен отговор: <code>${esc(right)}</code>` : ''}</div>`;
    }
    if (fd.type === 'essay') {
      return `<div class="essay"><textarea class="work big ${cls}" data-f="${k}" spellcheck="true" ${locked ? 'readonly' : ''} placeholder="${esc(HINT.essay)}">${esc(v)}</textarea>
        ${locked ? `<div class="mark">${esc(res.marks[k].note)}</div>${pointsList(fd, res.marks[k])}` : `<span class="hint">${HINT.essay}</span>`}</div>`;
    }
    return `<label class="fld"><span>${esc(fd.label)}</span>
      <input data-f="${k}" value="${esc(v)}" autocomplete="off" spellcheck="false" ${locked ? 'readonly' : ''} class="${cls}">
      ${locked ? mark : `<span class="hint">${HINT[fd.type]}</span>`}</label>`;
  }).join('');
  return `
    <div class="tmd">${md(q.text)}</div>
    <div class="fields">${fields}</div>
    ${isEssay(q) ? '' : `<label class="worklbl" for="work">Решение / чернова (показва се при прегледа; не се проверява автоматично)</label>
    <textarea class="work" id="work" data-w="1" spellcheck="false" ${locked ? 'readonly' : ''}>${esc(a && a.w || '')}</textarea>`}
    ${locked ? `<div class="fb ${res.pts >= EX.ptsTask ? 'good' : res.pts > 0 ? 'half' : 'wrong'}"><b>Автоматична оценка: ${ptsTxt(res.pts)} от ${EX.ptsTask} т.</b>${isEssay(q) ? ' <span>Сравни с примерния отговор и коригирай оценката.</span>' : ''}</div>
      <div class="sol tmd"><b>${isEssay(q) ? 'Примерен отговор' : 'Решение'}</b>${md(q.solution)}</div>`
      : (Q.instant ? `<div class="row" style="margin-top:10px"><button class="btn primary" data-act="check">Провери</button></div>` : '')}`;
}

    }).join('');

      ? `<div class="fb ${a === q.correct ? 'good' : 'wrong'}"><b>${a === q.correct ? 'Вярно!' : 'Грешно. Верният отговор е ' + LETTERS[it.order.indexOf(q.correct)] + '.'}</b> <span>${inl(q.expl)}</span></div>`
      : '';
    body = `<p class="qtext">${inl(q.text)}</p><div role="radiogroup">${opts}</div>${fb}`;
    status = a === null ? 'Все още не е даден отговор' : (locked ? (a === q.correct ? 'Верен' : 'Грешен') : 'Отговорен');
  }
  const last = Q.idx === Q.items.length - 1;
  const nQ = Q.items.filter(x => !x.task).length;
  const label = it.task ? `${TASK_WORD} <b>${Q.idx + 1 - nQ}</b>` : `Въпрос <b>${Q.idx + 1}</b>`;
  render(`

function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    if (!Q || Q.done) return stopTimer();
    const left = (Q.end - Date.now()) / 1000;
    const el = document.getElementById('timer');
    if (el) { el.textContent = 'Оставащо време ' + fmt(left); el.classList.toggle('low', left < 120); }
    if (left <= 0) finish(true);
  }, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function finish(auto) {
  if (!Q || Q.done) return;
  if (!auto) {
    const un = Q.items.filter((_, i) => !answered(i)).length;
    const msg = un ? `Има ${un} без отговор. Да приключа ли опита?` : 'Да приключа ли опита и да видя резултата?';
    if (!confirm(msg)) return;
  }
  stopTimer();
  Q.done = true;
  Q.used = Math.min((Date.now() - Q.start) / 1000, Q.limit);
  Q.taskPts = Q.items.map((it, i) => it.task ? autoTask(BY_ID[it.id], Q.answers[i]).pts : null);
  Q.items.forEach((it, i) => {
    if (it.task) return;
    if (Q.answers[i] === BY_ID[it.id].correct) mistakes.delete(it.id);
    else mistakes.add(it.id);
  });
  store.set(PFX + '-mistakes', [...mistakes]);
  Q.max = Q.items.reduce((s, it) => s + it.pts, 0);
  Q.histTs = Date.now();
  rescore();
  setHash('#/results', true);
  results(auto);
}

// точките се преизчисляват и при ръчна корекция на задачите
function rescore() {
  Q.score = Q.items.reduce((s, it, i) => s + (it.task ? Q.taskPts[i] : (Q.answers[i] === BY_ID[it.id].correct ? it.pts : 0)), 0);
  if (Q.key) {
    const b = best[Q.key];
    if (!b || Q.score / Q.max > b.s / b.t || b.ts === Q.histTs) { best[Q.key] = { s: Q.score, t: Q.max, ts: Q.histTs }; store.set(PFX + '-best', best); }
  }
  const m = /^L(\d+)-/.exec(Q.key || '');
  const rec = { ts: Q.histTs, key: Q.key || 'MIX', title: Q.title, score: Q.score, total: Q.max, lec: m ? +m[1] : 0 };
  const k = hist.findIndex(h => h.ts === Q.histTs);
  if (k >= 0) hist[k] = rec; else hist.push(rec);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  store.set(PFX + '-history', hist);
}

function scoreCard(auto) {
  const t = Q.max, pct = Math.round(Q.score / t * 100);
  const col = pct >= 90 ? 'var(--ok)' : pct >= 60 ? 'var(--accent)' : 'var(--bad)';
  const nT = Q.items.filter(x => x.task).length;
  const mcqPts = Q.items.reduce((s, it, i) => s + (!it.task && Q.answers[i] === BY_ID[it.id].correct ? it.pts : 0), 0);
  const mcqMax = Q.items.reduce((s, it) => s + (it.task ? 0 : it.pts), 0);
  return `
      <div class="ring" style="background:conic-gradient(${col} ${pct * 3.6}deg, var(--border) 0)"><span>${ptsTxt(Q.score)}/${t}</span></div>
      <div>
        <h1 style="font-size:1.3rem">${esc(Q.title)}</h1>
        <div style="font-size:1.1rem;margin:4px 0">${pct}% · ${pct >= 90 ? 'Отлично!' : pct >= 60 ? 'Добре, но прегледай грешките.' : 'Прочети резюмето и опитай пак.'}</div>
        ${nT && mcqMax ? `<div class="muted">Тест: ${ptsTxt(mcqPts)}/${mcqMax} т. · Задачи: ${ptsTxt(Q.score - mcqPts)}/${nT * EX.ptsTask} т.</div>` : ''}
        <div class="muted">Време: ${fmt(Q.used)}${auto ? ' · времето изтече' : ''}</div>
        ${nT ? '<div class="muted" style="font-size:.88rem">Точките за задачите са автоматична оценка — коригирай ги по-долу според решението.</div>' : ''}
      </div>`;
}

function results(auto) {
  const wrongIdx = Q.items.map((it, i) => !it.task && Q.answers[i] !== BY_ID[it.id].correct ? i : -1).filter(i => i >= 0);

  const rev = Q.items.map((it, i) => {
    const q = BY_ID[it.id], a = Q.answers[i];

      const essay = isEssay(q);
      const rows = q.fields.map((fd, k) => {

        return `<tr><td>${esc(fd.label)}</td><td class="v">${v.trim() ? esc(v) : '<span class="muted">—</span>'}</td>

      }).join('');
      const sel = Array.from({ length: EX.ptsTask * 2 + 1 }, (_, k) => k / 2).map(v => `<option value="${v}" ${v === p ? 'selected' : ''}>${ptsTxt(v)}</option>`).join('');
      return `<div class="rev ${p >= EX.ptsTask ? 'ok' : p > 0 ? 'half' : 'bad'}" id="rev${i}">
        <div class="lectag">${itemTag(q).replace(TASK_WORD, TASK_WORD + ' ' + (i + 1 - nQ))}</div>
        <div class="tmd">${md(q.text)}</div>
        ${essay ? q.fields.map((fd, k) => `<div class="muted" style="font-size:.88rem">Твоят отговор:</div>
          <pre class="mywork">${a && a.f && a.f[k] && a.f[k].trim() ? esc(a.f[k]) : '— без отговор —'}</pre>
          <div class="muted" style="font-size:.88rem">Ключови моменти (${esc(res.marks[k].note)}):</div>${pointsList(fd, res.marks[k])}`).join('')
        : `<table class="ans"><thead><tr><th>Поле</th><th>Твоят отговор</th><th>Верен отговор</th><th></th></tr></thead><tbody>${rows}</tbody></table>`}

        <div class="selfgrade"><span>Автоматично: <b>${ptsTxt(res.pts)}</b> т.</span>
          <label>Точки за задачата: <select data-grade="${i}">${sel}</select> от ${EX.ptsTask}</label></div>
      </div>`;
    }
    const ok = a === q.correct;
    const opts = it.order.map((oi, pos) => {
      let cls = 'opt';
      if (oi === q.correct) cls += ' ok'; else if (oi === a) cls += ' bad';
      const tag = oi === a ? ' <span class="badge">твоят отговор</span>' : '';
      return `<div class="${cls}"><span class="ltr">${LETTERS[pos]}.</span><span>${inl(q.opts[oi])}${tag}</span></div>`;
    }).join('');
    return `<div class="rev ${ok ? 'ok' : 'bad'}">
      <div class="lectag">Въпрос ${i + 1} · ${itemTag(q)} ${a === null ? '· <b>без отговор</b>' : ''}${it.pts !== 1 ? ` · ${ok ? it.pts : 0}/${it.pts} т.` : ''}</div>
      <p class="qtext" style="margin-bottom:8px">${inl(q.text)}</p>
      ${opts}

  }).join('');
  render(`
    <div class="topbar">
      <button class="btn ghost" data-act="back">← Назад</button>
      <div class="row">
        <button class="btn" data-act="retry">Опитай отново</button>
        <button class="btn primary" data-act="retrywrong" ${wrongIdx.length ? '' : 'disabled'}>Само грешните въпроси (${wrongIdx.length})</button>
      </div>
    </div>
    <div class="card score" id="scorecard">${scoreCard(auto)}</div>
    <h2>Преглед</h2>
    ${rev}
  `);
  Q.wrongIdx = wrongIdx;
  Q.auto = auto;
}

function topicStats() {
  const by = {};
  for (const h of hist) {
    const k = h.lec || 0;
    const o = by[k] || (by[k] = { n: 0, sum: 0, best: 0, last: 0 });
    const p = h.total ? h.score / h.total : 0;
    o.n++; o.sum += p; o.best = Math.max(o.best, p); o.last = Math.max(o.last, h.ts);
  }
  return by;
}

function progMsg(ok, text) {
  const el = document.getElementById('progMsg');

}

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(code) {
  const bin = atob(code.replace(/\s+/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

function exportCode() {
  return b64enc(JSON.stringify({ v: 1, course: PFX, name: userName || 'Гост', best, mistakes: [...mistakes], history: hist }));
}

function importCode(code) {
  let d;
  try { d = JSON.parse(b64dec(code.trim())); } catch (e) { return { ok: false, text: 'Невалиден код — провери дали е копиран изцяло.' }; }
  if (!d || typeof d !== 'object' || d.v !== 1 || typeof d.course !== 'string') return { ok: false, text: 'Невалиден код — липсва версия или курс.' };
  if (d.course !== PFX) return { ok: false, text: `Този код е от друг курс („${d.course}“), а тук е „${PFX}“. Импортирай го в съответния тест.` };
  if (!Array.isArray(d.history) || !Array.isArray(d.mistakes) || !d.best || typeof d.best !== 'object') return { ok: false, text: 'Невалиден код — непълни данни.' };
  // грешни въпроси: заменят текущите
  mistakes = new Set(d.mistakes.filter(id => typeof id === 'string' && BY_ID[id]));
  // най-добри: максимум по ключ
  let nb = 0;
  for (const [k, b] of Object.entries(d.best)) {
    if (!b || !(b.t > 0) || !(b.s >= 0)) continue;
    const cur = best[k];
    if (!cur || b.s / b.t > cur.s / cur.t) { best[k] = { s: +b.s, t: +b.t }; nb++; }
  }
  // история: обединение без дубликати (ts + key), сортирана, последните 500
  const seen = new Set(hist.map(h => h.ts + '|' + h.key));
  let added = 0;
  for (const h of d.history) {
    if (!h || typeof h.ts !== 'number' || typeof h.key !== 'string' || !(h.total > 0)) continue;
    const id = h.ts + '|' + h.key;
    if (seen.has(id)) continue;
    seen.add(id); added++;
    hist.push({ ts: h.ts, key: h.key, title: String(h.title || h.key), score: +h.score || 0, total: +h.total, lec: +h.lec || 0 });
  }
  hist.sort((a, b) => a.ts - b.ts);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  if ((userName === null || userName === 'Гост') && typeof d.name === 'string' && d.name.trim()) { userName = d.name.trim().slice(0, 40); store.set(PFX + '-name', userName); }
  store.set(PFX + '-mistakes', [...mistakes]);
  store.set(PFX + '-best', best);
  store.set(PFX + '-history', hist);
  return { ok: true, text: `Прогресът е импортиран: ${added} нови опита в историята, ${nb} подобрени резултата, ${mistakes.size} грешни въпроса.` };
}

async function copyText(ta) {
  try { await navigator.clipboard.writeText(ta.value); return true; }
  catch (e) { ta.select(); try { return document.execCommand('copy'); } catch (e2) { return false; } }
}

/* ---------- Действия ---------- */
// равномерно от всички лекции: по един случаен въпрос от всяка, на кръгове
function pickMcq(n) {
  const lecs = DATA.lectures.map(l => l.num), used = new Set(), picks = [];
  while (picks.length < n) {
    for (const L of shuffle(lecs)) {
      if (picks.length >= n) break;
      const pool = ALL.filter(q => q.lec === L && !used.has(q.id));
      if (!pool.length) continue;
      const q = pool[Math.floor(Math.random() * pool.length)];
      used.add(q.id); picks.push(q);
    }
  }
  return shuffle(picks);
}
// по една задача от всяка група (групите се повтарят, ако задачите са повече от групите)
function pickTasks(n) {
  const picks = [], order = n < GROUPS.length ? shuffle(GROUPS) : GROUPS;
  for (let i = 0; picks.length < n; i++) {
    const g = order[i % order.length];
    const pool = TASKS.filter(t => t.group === g.key && !picks.includes(BY_ID[t.id]));
    if (pool.length) picks.push(BY_ID[pool[Math.floor(Math.random() * pool.length)].id]);
  }
  return picks;
}

function mockExam(kind) {
  const forward = settings.forward;
  if (!EX.tasks) {
    const n = +kind;
    return startQuiz(null, `Пробен изпит (${n} въпроса)`, pickMcq(n), { forward });
  }
  if (kind === 'mcq') return startQuiz(null, `Пробен изпит — тест (${EX.q} въпроса)`, pickMcq(EX.q), { forward, pts: EX.ptsQ });
  if (kind === 'tasks') return startQuiz(null, `Пробен изпит — ${EX.q ? 'задачи' : 'отворени въпроси'} (${EX.tasks})`, pickTasks(EX.tasks), { forward, limit: EX.q ? undefined : EX.minutes * 60 });
  startQuiz(null, `Пробен изпит (${EX.q} въпроса + ${EX.tasks} задачи)`, pickMcq(EX.q).concat(pickTasks(EX.tasks)), { forward, pts: EX.ptsQ, limit: EX.minutes * 60 });
}

function groupTasks(key) { return TASKS.filter(t => t.group === key).map(t => BY_ID[t.id]); }

const actions = {
  home: () => nav('#/'),
  back: () => back(),
  progress: () => nav('#/progress'),
  rename: () => { editName = true; home(); const i = document.getElementById('nameIn'); if (i) { i.focus(); i.select(); } },
  saveName: () => setName(document.getElementById('nameIn').value),
  skipName: () => { if (editName) { editName = false; home(); } else setName('Гост'); },
  exportProg: () => { const ta = document.getElementById('progCode'); ta.value = exportCode(); ta.focus(); ta.select(); progMsg(true, 'Кодът е готов — копирай го и го запази или го постави на другото устройство.'); },
  copyProg: async () => {
    const ta = document.getElementById('progCode');
    if (!ta.value.trim()) ta.value = exportCode();
    progMsg(...(await copyText(ta) ? [true, 'Кодът е копиран.'] : [false, 'Не успях да копирам автоматично — маркирай текста и натисни Ctrl+C.']));
  },
  importProg: () => {
    const code = document.getElementById('progCode').value;
    if (!code.trim()) return progMsg(false, 'Постави код в полето и натисни „Импорт“.');
    const r = importCode(code);
    if (r.ok) progress(r); else progMsg(false, r.text);
  },
  theme: () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; store.set(PFX + '-theme', theme); applyTheme(); home(); },
  sum: b => nav('#/sum/' + b.dataset.l),
  test: b => { const l = DATA.lectures.find(x => x.num === +b.dataset.l); startQuiz(`L${pad(l.num)}-${b.dataset.t}`, `${C.lecWord} ${l.num} · Тест ${b.dataset.t}`, l.tests[b.dataset.t]); },
  allq: b => { const l = DATA.lectures.find(x => x.num === +b.dataset.l); const qs = l.testNames.flatMap(t => l.tests[t]); startQuiz(`L${pad(l.num)}-ALL`, `${C.lecWord} ${l.num} · всички ${qs.length} въпроса`, shuffle(qs)); },
  task1: b => { const g = groupOf(b.dataset.g), ts = groupTasks(g.key); startQuiz(null, `Задача · ${g.title}`, [ts[Math.floor(Math.random() * ts.length)]]); },
  taskall: b => { const g = groupOf(b.dataset.g); startQuiz('T-' + g.key, `Задачи · ${g.title}`, shuffle(groupTasks(g.key))); },
  mock: () => mockExam(document.getElementById('mockN').value),
  sample: () => startQuiz('SAMPLE', 'Примерен тест', SAMPLE),
  mist: () => startQuiz(null, `Грешни въпроси (${mistakes.size})`, shuffle([...mistakes].map(id => BY_ID[id]).filter(Boolean))),
  reset: () => { if (confirm('Да изтрия ли най-добрите резултати, списъка с грешни въпроси и историята на опитите? (Името остава.)')) { best = {}; mistakes = new Set(); hist = []; store.set(PFX + '-best', best); store.set(PFX + '-mistakes', []); store.set(PFX + '-history', hist); home(); } },
  go: b => { const i = +b.dataset.i; if (Q.forward && i < Q.idx) return; Q.idx = i; renderQ(); },
  prev: () => { if (Q.idx > 0 && !Q.forward) { Q.idx--; renderQ(); } },
  next: () => { if (Q.idx < Q.items.length - 1) { Q.idx++; renderQ(); } },
  flag: () => { Q.flags[Q.idx] = !Q.flags[Q.idx]; renderQ(); },
  check: () => { Q.checked[Q.idx] = true; renderQ(); },
  finish: () => finish(false),
  quit: () => { if (Q && !Q.done && Q.items.some((_, i) => answered(i)) && !confirm('Опитът не е приключен. Да изляза ли?')) return; leaving = true; stopTimer(); Q = null; back(); },
  retry: () => startQuiz(Q.key, Q.title, Q.src, Q.opts),
  retrywrong: () => { const qs = Q.wrongIdx.map(i => BY_ID[Q.items[i].id]); startQuiz(null, `${Q.title} · само грешните`, qs); }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && actions[b.dataset.act]) actions[b.dataset.act](b);
});
app.addEventListener('change', e => {
  if (e.target.name === 'opt' && Q && !Q.done) { Q.answers[Q.idx] = +e.target.value; renderQ(); }
  if (e.target.id === 'setInstant') { settings.instant = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.id === 'setShuffle') { settings.shuffle = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.id === 'setForward') { settings.forward = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.dataset.grade !== undefined && Q && Q.done) {
    const i = +e.target.dataset.grade, p = +e.target.value;
    Q.taskPts[i] = p;
    rescore();
    document.getElementById('scorecard').innerHTML = scoreCard(Q.auto);
    document.getElementById('rev' + i).className = `rev ${p >= EX.ptsTask ? 'ok' : p > 0 ? 'half' : 'bad'}`;
  }
});
// писмените задачи: пазим въведеното без прерисуване (иначе фокусът се губи)
app.addEventListener('input', e => {
  if (!Q || Q.done || !Q.items[Q.idx] || !Q.items[Q.idx].task) return;
  const t = e.target, q = BY_ID[Q.items[Q.idx].id];
  if (t.dataset.f === undefined && t.dataset.w === undefined) return;
  const a = Q.answers[Q.idx] || (Q.answers[Q.idx] = { f: q.fields.map(() => ''), w: '' });
  if (t.dataset.f !== undefined) a.f[+t.dataset.f] = t.value; else a.w = t.value;
  refreshNav(Q.idx);
  const st = app.querySelector('.qinfo div:nth-child(2)');
  if (st) st.textContent = answered(Q.idx) ? 'Отговорена' : 'Все още не е даден отговор';
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'nameIn') { if (e.key === 'Enter') actions.saveName(); return; }
  if (e.target.dataset && e.target.dataset.f !== undefined) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); const nx = app.querySelector(`[data-f="${+e.target.dataset.f + 1}"]`) || app.querySelector('[data-w]'); if (nx) nx.focus(); }
    return;
  }
  if (!Q || Q.done || e.ctrlKey || e.metaKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (Q.items[Q.idx].task) {
    if (e.key === 'ArrowRight') actions.next(); else if (e.key === 'ArrowLeft') actions.prev();
    return;
  }
  const k = e.key.toLowerCase();
  const pos = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (pos >= 0 && k.length === 1) {
    if (Q.instant && Q.answers[Q.idx] !== null) return;
    Q.answers[Q.idx] = Q.items[Q.idx].order[pos]; renderQ();
  } else if (e.key === 'ArrowRight') actions.next();
  else if (e.key === 'ArrowLeft') actions.prev();
  else if (k === 'f') actions.flag();
});

/* ---------- Навигация (бутонът „Назад“ на браузъра) ---------- */
// #/ начало · #/sum/N резюме · #/progress прогрес · #/quiz тест · #/results резултат
let leaving = false;
function setHash(h, replace) {
  if (location.hash === h) return;
  history[replace ? 'replaceState' : 'pushState']({ app: 1 }, '', h);
}
function nav(h) { setHash(h); route(); }
function back() {
  // тестът/резултатът се отварят от начало или резюме, затова „Назад“ връща там
  if (history.state && history.state.app) { leaving = true; history.back(); } else { setHash('#/', true); route(); }
}
function route() {
  const h = location.hash, m = /^#\/sum\/(\d+)$/.exec(h);
  if (m && DATA.lectures.some(l => l.num === +m[1])) return summary(+m[1]);
  if (h === '#/progress') return progress();
  if (h === '#/quiz' && Q && !Q.done) { startTimer(); return renderQ(); }
  if (h === '#/results' && Q && Q.done) return results(Q.auto);
  if (h && h !== '#/') history.replaceState(null, '', '#/');
  home();
}
window.addEventListener('popstate', () => {
  if (!leaving && Q && !Q.done && location.hash !== '#/quiz' && Q.items.some((_, i) => answered(i))
      && !confirm('Опитът не е приключен. Да изляза ли?')) {
    history.pushState({ app: 1 }, '', '#/quiz');
    return;
  }
  leaving = false;
  route();
});


route();
</script>
</body>
</html>
