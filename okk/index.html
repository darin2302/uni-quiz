<script id="data" type="application/json">{"course":{"pfx":"okk","tag":"ОКК","name":"Основи на компютърните комуникации","lecWord":"Лекция","secPerQ":60,"exam":{"q":50,"ptsQ":1,"tasks":0,"ptsTask":10,"minutes":50}},"lectures":[{"num":1,"title":"Лекция 1 — Основни термини в компютърните комуникации. Организации за стандартизация","short":"Основни термини в компютърните комуникации. Организации за стандартизация","summary":"### Изпит и текущ контрол\n| | Задочно обучение | Редовно обучение |\n|---|---|---|\n| Време | **90 минути** | **40 минути** |\n| Брой въпроси | **50** | **20** |\n| Оценяване | **до 100 т.** от изпита | **до 60 т.** текущ контрол + **до 40 т.** изпит |\n- Електронен тест; въпросите са **с един или няколко отговора**; навигацията е **само напред** — не може да се връщаш към преминат въпрос.\n- Конспект и презентации — на **cs.tu-varna.bg**; консултации — обявени пред **102ТВ**.\n- Упражнения: **8 контролни** (индивидуални задачи, **15-минутни**, по **5 или 10 точки**), общо **до 60 т.**\n\n### Цикъл „мрежови\" дисциплини\n| Дисциплина | Семестър | Статут |\n|---|---|---|\n| Основи на компютърните комуникации | **5** | задължителна |\n| Компютърни мрежи и Интернет | **6** | задължителна |\n| Администриране на локални мрежи | **7** | задължителна |\n| Мрежова сигурност | **8** | избираема |\n- Въпроси от тези дисциплини влизат в електронния тест за **държавния изпит**, а задачи — в устната част по направление **„Компютърни мрежи и операционни системи\"**.\n\n### Комуникация и компютърни комуникации\n- **Общуване = комуникация.** Комуникацията е: процес, чрез който **се обменя информация**; взаимодействие **най-малко между двама участници** (хора, живи организми, информационни системи); предаване на символи, **при условие че значението на символа на подателя е разбираемо за получателя**.\n- **Компютърни комуникации** — вид обмен на информация **между два или повече, свързани чрез мрежа устройства** (компютри, IP телефони, таблети…).\n\n### Характеристики на комуникацията\n| Характеристика | Значение |\n|---|---|\n| **Бързо** | максимален обем предадена информация за **минимално време** |\n| **Сигурно** | информацията достига (и правилно се интерпретира) **само от получателя, за когото е предназначена** |\n| **Надеждно** | информацията или част от нея **да не се загуби, повреди или измени** по време на предаването |\n| **Евтино** | с **минимални инвестиции** постигане/надвишаване на очакванията на потребителите |\n\n### Абстрактен модел за предаване на съобщение\n- Верига: **източник → предавател → канал → приемник → получател**; върху канала действат **смущения**. Източникът дава **съобщение**, предавателят го превръща в **сигнал**, в приемника пристига **сигнал и шум**, получателят получава **съобщение**.\n- **Съобщение** — съвкупност от знаци, съдържаща дадена информация.\n- **Сигнал** — **физически носител** на съобщението.\n- **Шум** — въздействие, **изменящо сигнала**, причинено от смущения при предаването или възникнали в апаратурата на предавателя или приемника.\n- **Филтрация** — отделяне на сигнала от шума **в приемника**.\n- **Шумоустойчивост** — способността на съобщителната система да осигури **необходимата вярност** на приеманите съобщения.\n\n### Видове комуникационни системи (според вида на съобщението)\n| Система | Предава |\n|---|---|\n| **Телефонни** | глас |\n| **Телеграфни и телетекстни** | текст |\n| **Факсимилни** | **неподвижни** образи |\n| **Телевизионни и видеотелефонни** | **подвижни** изображения |\n| **Телеизмерителни** | данни, измерени от разстояние |\n| **Компютърни** | цифрови данни |\n\n### Видове сигнали\n- **Аналогов сигнал** — **непрекъснато** променящ се във времето; силно се влияе от средата (**затихва и се изкривява**); трудно се възстановява в приемника, качеството на възпроизвеждането се влошава. Три параметъра: **амплитуда** (стойност на сигнала), **честота** (брой периоди за секунда), **фаза** (от **0 до 360°**).\n- **Цифров сигнал** — **дискретен**, заема еднозначно някоя от **две ясно различими стойности**, интерпретирани като **0 и 1** (има ток/няма ток; свети/не свети; има вълна с определена дължина/няма). **Вероятността за грешки е значително по-малка.**\n\n### Преобразуване на аналогов в цифров сигнал\n- **По време → дискретизация**; **по амплитуда (стойност) → квантоване**.\n- **Дискрет** — стойността на сигнала в даден момент от времето.\n- **Квант** — минималната стойност на промяната на някоя физическа величина.\n- В резултат на дискретизацията и квантоването се получава **извадка** — краен брой значения за стойността на сигнала за определен интервал от време.\n\n### Представяне на информацията (двоични кратни, ×1024)\n- **1 bit** — 0/1; **1 B (byte) = 8 bits**; **1 KB = 1024 B**; **1 MB = 1024 KB**; **1 GB = 1024 MB**; **1 TB = 1024 GB**.\n\n### Качествени показатели на комуникационните системи\n1. **Скорост на предаване**\n2. **Пропускателна способност**\n3. **Режим на предаване**\n4. **Метод на предаване**\n5. **Вярност** на предаваната информация\n6. **Надеждност** на системата\n\n### Скорост на предаване\n| Единица | Значение |\n|---|---|\n| **bps** | бита за секунда |\n| **Baud** | брой **изменения на сигнала** за секунда; всяка стойност на сигнала кодира няколко бита |\n| **Cps** | символи за секунда; обикновено с всеки байт полезна информация се предават и **2 служебни бита** |\n- Пример: при **4 bits на 1 baud**: 9600 bps / 4 = **2400 baud**. При символи по **8 + 2 = 10 бита**: 9600 / 10 = **960 Cps**.\n- **9600 bps = 2400 bauds = 960 Cps.**\n- Обща формула: baud = bps / (битове на изменение); Cps = bps / (битове на символ).\n\n### Пропускателна способност\n- **Количеството данни, които могат да преминат през комуникационния канал за определено време.** Определя се от **средата и технологията** за предаване на сигналите. Базова единица — **bps**.\n- Тук кратните са **десетични (×1000)**: **1 Kbps = 1000 bps**; **1 Mbps = 1000 Kbps = 1 000 000 bps**; **1 Gbps = 1000 Mbps = 10⁹ bps**.\n| Термин | Значение |\n|---|---|\n| **Bandwidth** | **теоретичният** брой bps за канала |\n| **Throughput** | **реално достигнатият** максимален брой предадени bps |\n| **Goodput** | брой **полезни** информационни битове, доставени до местоназначението за единица време; **без служебната информация** (хедъри на протоколния стек, препредадени пакети) |\n- **Bandwidth ≥ Throughput > Goodput.**\n\n### Режим и метод на предаване\n- **Режим:** **Full duplex** — двете страни предават и приемат **едновременно** (отделни пътища send→receive в двете посоки); **Half duplex** — общ път, по който в даден момент предава **само едната** страна.\n- **Метод:**\n  - **Асинхронен** — данните се изпращат **по байтове**; всеки байт се предхожда от **стартов бит** и е последван от **1 или 2 стопови бита**.\n  - **Синхронен** — информацията се предава като **непрекъснат поток** от данни, байт след байт.\n\n### Вярност и надеждност\n- **Вярност** — степента на **съответствие между приетото и предаденото** съобщение. Измерва се с:\n  - **Достоверност** — отношението на **вярно приетите** битове към общия брой предадени;\n  - **Грешка** — усредненото отношение на **неправилно приетите** битове към общия брой предадени за времето на измерването.\n- **Надеждност на системата** — свойството да изпълнява дадена функция, **запазвайки експлоатационните си показатели в течение на определено време**. Измерва се с **времето за безотказна работа до първия отказ** и **времето за престой до възстановяване**.\n\n### Кой определя как изглежда комуникационната система\n- **Стандарти**, **организации за стандартизация**; в България — **закони** (**БДС** и **Българският институт за стандартизация (БИС)** — по слайда „при БАН\") и **наредби**.\n- **Стандартите** са **документирани споразумения**, съдържащи **технически спецификации**, използвани като правила, указания или дефиниции на характеристики, за да гарантират, че продуктите отговарят на целта си.\n- Стандартите **не са закон**, тъй като се издават от **неправителствени** институции; **не са задължителни**, но се спазват, защото **производителите** целят **съвместимост** на компонентите, а **потребителите** — **лесна взаимозаменяемост**. Нестандартните, несъвместими продукти са непопулярни; индустрията изисква съвместимост.\n\n### Видове стандарти по регион\n| Регион | Организации | Език |\n|---|---|---|\n| Международни | ISO, IEC, ITU, IETF… | — |\n| **Европейски** | **CENELEC** (DIN, SEV, BSI) | **английски, френски и немски** |\n| **Американски** | **EIA/TIA; IEEE** | английски |\n| **Азиатски** | **няма** | — |\n\n### Международни организации за стандартизация\n| Организация | Ключово |\n|---|---|\n| **ISO** (International Organization for Standardization) | световна **федерация на националните организации** по стандартизация, по **1 представител** от всяка страна (слайдът: „100 страни\"); създадена **1947 г.**; стандарти **от всички видове** |\n| **IEC** | създадена **1906 г.**; стандарти в областта на **електронния инженеринг** (електротехника) |\n| **ITU** (International Telecommunication Union) | **телекомуникации**, от **1865 г.**; **ITU-T** — телекомуникационна стандартизация; **ITU-R** — радиокомуникация; **ITU-D** — телекомуникационно развитие |\n| **IETF** (Internet Engineering Task Force) | стандарти за **Internet**; създава **RFC** — делят се на задължителни, препоръчителни, незадължителни, не за масова реализация и непрепоръчвани |\n| **IEEE** (Institute of Electrical and Electronics Engineers) | **мрежови технологии на по-ниско ниво** |\n| **EIA/TIA** (Electronics Industry Alliance / Telecommunications Industry Association) | американски — окабеляване (напр. 568) |\n\n### ISO/IEC JTC1\n- **Joint Technical Committee 1** — **общ технически комитет на ISO и IEC** за стандартизация в областта на **информационните технологии**.\n- **Първият и единствен** по рода си; дели се на **8 подкомитета (Sub-Committees, SC)**.\n\n### Европейски организации\n- **CENELEC** — създадена **1973 г. в Белгия**; обединява **CENELCOM и CENEL**; европейска с **Директива 83/189/ЕИО**; стандартизация в областта на **електротехниката**; **подкрепя IEC**.\n- **ETSI** — **Европейски институт за телекомуникационна стандартизация**; създаден **1988 г.** за ускоряване на **техническото хармонизиране** в далекосъобщенията, радиоразпръскването и ИТ; **786 членове от 67 страни** (в и извън Европа).\n\n### Създаване, означение и прилагане на стандарт\n- Етапи: **Начало (Inception) → Концепция (Conception) → Проектиране (Drafting) → Възприемане (Adoption) → „Производство\" (Promotion)**, после **Публикация**: **Редакция (Editing) → Гласуване от членовете (Member Voting) → Публикация (Publication)**.\n- Означение: **ISO ннннн:гггг Наименование** — ннннн = **номер**, гггг = **година на издаване**, Наименование = обект на стандартизация. Пример: **ISO 11801:2002** Information technology – Generic cabling for customer premises.\n- **Европейските стандарти** се приемат в **триезична версия** (англ., фр., нем.) и се означават с **EN**. Документи само с означение EN **не се издават и не се разпространяват**; всяка страна-членка добавя **своите инициали** отпред и **годината на въвеждане** → европейските стандарти съществуват **само под формата на национални**. Пример: EN 9001 → **UNI EN 9001:2008** (Италия), **DIN EN 9001:2008** (Германия), **БДС EN 9001:2015** Системи за управление на качеството (България).\n\n### RFC (Request For Comments — „Заявка за обсъждане\")\n- Издание на **IETF и ISOC**; работен документ с **пореден номер**, съдържащ предложения за стандарти и/или допълнителна информация.\n- Появява се **1969 г.** със създаването на **ARPANET**.\n- RFC **никога не се отменя или скрива** — **замества се** от ново RFC.\n- Кои RFC са активни стандарти и кои остарели → **Internet Standard 1 (STD 1)**, публикуван периодично като RFC.\n- Нормативната версия е винаги в **ASCII** формат. Списък: ietf.org/rfc.html.\n\n### Еквивалентни стандарти за структурно окабеляване\n| Приложение | ISO/IEC | CENELEC | EIA/TIA |\n|---|---|---|---|\n| Сгради (Premise) | **ISO 11801** | **EN 50173-1** / -2 | **EIA/TIA 568-C.0** / 568-C.1 |\n| Индустриално | **ISO 24702** | **EN 50173-3** | **TIA-1005** |\n| Домове | **ISO 15018** | **EN 50173-4** | **TIA-570** |\n| Центрове за данни | **ISO 24764** | **EN 50173-5** | **TIA-942** |\n- За един и същ обект се издават **международен, европейски и американски** стандарт.\n\n### Свързани ISO/IEC и CENELEC стандарти (при изграждане на мрежа)\n- Център: **ISO/IEC 11801 Generic cabling** ↔ **EN 50173-1 Generic Cabling Systems**.\n- ISO/IEC: **15018** Homes, **24764** Data centre, **24702** Industrial; **IEC 14763-3** тестване на оптично окабеляване; **IEC 61935-1** тестване на инсталирано балансирано окабеляване; **ISO/IEC TR 14763-1** администриране и етикетиране; **TR 14763-2** осигуряване на качество, планиране и инсталация; **ISO/IEC 18010** Pathways & Spaces (трасета и помещения); **IEC 60364** електрически инсталации на сгради.\n- CENELEC: **EN 50173-2** Office, **-3** Industrial, **-4** Homes, **-5** Data Center; **EN 50346** тестване на инсталирано окабеляване; **EN 50310** еквипотенциално свързване/заземяване в сгради с ИТ оборудване; **EN 50174-1** спецификации и осигуряване на качество, **-2** инсталация **вътре** в сграда, **-3** инсталация **извън** сграда.\n- Американски контекст: **EIA/TIA 568A** (фаза проектиране на окабеляване), **EIA/TIA 607** (заземяване), **569/606/570** (планиране/внедряване/експлоатация).\n\n### Кога системата за окабеляване отговаря на стандарта\n- Конфигурацията и структурата са съобразени със стандарта; производителността отговаря на изискванията; интерфейсите отговарят на **електрическите и механичните** изисквания; правилно **екраниране**; правилно **системно администриране**; **сигурност**.\n\n### Стандарт IEEE 802\n- Започнат **февруари 1980 г.** → **80** = годината, **2** = месецът.\n| Стандарт | Тема |\n|---|---|\n| **802.1** | LAN/MAN Management, **Spanning Tree Algorithm**, bridge looping |\n| **802.2** | **Logical Link Control (LLC)** |\n| **802.3** | **CSMA/CD** (Ethernet) |\n| **802.4** | **Token Bus** |\n| **802.5** | **Token Ring** |\n| **802.6** | **MAN** |\n| **802.7** | BroadBand |\n| **802.8** | Fiber Optics |\n| **802.9** | Integrated Voice and Data |\n| **802.10** | LAN Security |\n| **802.11** | **Wireless** |\n| **802.12** | **100 VG AnyLAN** |\n- Стандарти за комуникационна инфраструктура (карта до 2018): напр. **PoE — 802.3af**, по-късно **802.3at**; Ethernet 10GbE → 40/100GbE.\n\n### Капани за изпита\n- **Дискретизация = по време**, **квантоване = по стойност (амплитуда)**. **Дискрет** ≠ **квант**.\n- **1 KB = 1024 B** (обем на информация), но **1 Kbps = 1000 bps** (скорост/пропускателна способност).\n- **Baud** е брой **изменения на сигнала**/s, не битове/s. 9600 bps = **2400 baud** (при 4 бита/изменение) = **960 Cps** (при 8+2 бита/символ).\n- **Bandwidth** (теоретично) ≥ **Throughput** (реално) > **Goodput** (само полезни битове).\n- **Достоверност** = вярно приети/всички; **грешка** = неправилно приети/всички. Двете измерват **вярността**, не надеждността. Надеждността се мери с **време до първия отказ** и **време за престой**.\n- **Сигурно** ≠ **надеждно**: сигурно — достига само до предназначения получател; надеждно — не се губи/поврежда/изменя.\n- **Факсимилни** → неподвижни образи; **телевизионни/видеотелефонни** → подвижни.\n- Асинхронен: **1 стартов**, **1 или 2 стопови** бита.\n- Години: **IEC 1906** (най-старата е ITU — **1865**), **ISO 1947**, **CENELEC 1973 (Белгия)**, **ETSI 1988**, **RFC 1969 (ARPANET)**, **IEEE 802 — февр. 1980**.\n- **ITU-T** = стандартизация, **ITU-R** = радио, **ITU-D** = развитие.\n- **IEEE 802.3 = CSMA/CD**, **802.5 = Token Ring**, **802.4 = Token Bus**, **802.11 = Wireless**, **802.2 = LLC**, **802.12 = 100VG-AnyLAN**.\n- Азиатски стандарти — **няма**. Европейски — на **3 езика**; американски — на английски.\n- Стандартите **не са закон** и **не са задължителни** — издават се от неправителствени организации.\n- RFC **не се отменя**, а се **замества**; активните се определят от **STD 1**; нормативната версия е в **ASCII**.\n- **Неточности в слайдовете:** IEC е разписано като „International Engineering Consortium\" — правилно е **International Electrotechnical Commission**; „IRFC\" → правилно **RFC**; „Standartization\" → Standardization; „ISoc\" → **ISOC (Internet Society)**; ISO има представители от ~170 държави, а слайдът казва „100 страни\"; етапът **Promotion** е преведен като „Производство\" (по-точно „популяризиране\"); директивата е **83/189/ЕИО (EEC)**, на слайда „ECC\"; БИС не е към БАН (самостоятелна организация), но слайдът го свързва с БАН.\n- Еквиваленти: **ISO 11801 ↔ EN 50173-1 ↔ TIA 568**, **ISO 24764 ↔ EN 50173-5 ↔ TIA-942** (data center), **ISO 15018 ↔ EN 50173-4 ↔ TIA-570** (домове), **ISO 24702 ↔ EN 50173-3 ↔ TIA-1005** (индустрия).\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L01-A-1","n":1,"text":"Колко въпроса съдържа електронният тест на изпита за **редовно** обучение и колко време е дадено за него?","opts":["50 въпроса за 90 минути","20 въпроса за 90 минути","20 въпроса за 40 минути","50 въпроса за 40 минути"],"correct":2,"expl":"Редовно: 20 въпроса, 40 минути; задочно: 50 въпроса, 90 минути."},{"id":"L01-A-2","n":2,"text":"Кое определение отговаря на понятието **сигнал** в абстрактния модел за предаване на съобщение?","opts":["Физически носител на съобщението","Съвкупност от знаци, съдържаща дадена информация","Въздействие, изменящо предаваното съобщение","Отделяне на полезната информация от шума"],"correct":0,"expl":"Сигналът е физическият носител на съобщението; съобщението е съвкупност от знаци."},{"id":"L01-A-3","n":3,"text":"Каква е скоростта в **baud** на линия 9600 bps, ако всяко изменение на сигнала кодира 4 бита?","opts":["960 baud","4800 baud","38400 baud","2400 baud"],"correct":3,"expl":"9600 / 4 = 2400 baud."},{"id":"L01-A-4","n":4,"text":"Разбиването на аналоговия сигнал **по стойност (амплитуда)** се нарича:","opts":["дискретизация","квантоване","филтрация","модулация"],"correct":1,"expl":"По време — дискретизация, по амплитуда — квантоване."},{"id":"L01-A-5","n":5,"text":"Коя характеристика на комуникацията изисква информацията да достига и да се интерпретира **само от получателя, за когото е предназначена**?","opts":["Надеждност","Сигурност","Бързина","Достоверност"],"correct":1,"expl":"Сигурно — само до предназначения получател; надеждно — не се губи, поврежда или изменя."},{"id":"L01-A-6","n":6,"text":"Коя организация създава **RFC** документите?","opts":["IEEE","ITU-T","EIA/TIA","IETF"],"correct":3,"expl":"IETF (заедно с ISOC) издава RFC — стандартите за Internet."},{"id":"L01-A-7","n":7,"text":"Какво показва **Goodput**?","opts":["Броя полезни информационни битове, доставени до местоназначението за единица време","Теоретичния брой bps, които каналът може да пренесе при идеални условия","Реално достигнатия брой предадени bps, включително хедърите и препредадените пакети","Броя изменения на сигнала в канала за една секунда, измерван в бодове"],"correct":0,"expl":"Goodput не включва хедърите и препредадените пакети; Bandwidth ≥ Throughput > Goodput."},{"id":"L01-A-8","n":8,"text":"Коя организация за стандартизация е създадена **през 1973 г. в Белгия** и подкрепя IEC?","opts":["ETSI","ISO","CENELEC","EIA/TIA"],"correct":2,"expl":"CENELEC — 1973 г., Белгия, обединява CENELCOM и CENEL, електротехника."},{"id":"L01-A-9","n":9,"text":"Кой стандарт от серията IEEE 802 описва **CSMA/CD**?","opts":["802.5","802.11","802.2","802.3"],"correct":3,"expl":"802.3 — CSMA/CD; 802.5 — Token Ring; 802.11 — Wireless; 802.2 — LLC."},{"id":"L01-A-10","n":10,"text":"Кое от следните **НЕ** е причина стандартите да се спазват, въпреки че не са задължителни?","opts":["Производителите целят съвместимост на компонентите","Издават се от държавни органи и имат силата на закон","Потребителите целят лесна взаимозаменяемост на компонентите","Нестандартните несъвместими продукти са непопулярни"],"correct":1,"expl":"Стандартите не са закон, защото се издават от неправителствени институции."}],"B":[{"id":"L01-B-1","n":1,"text":"Как е определена **комуникацията** като предаване на символи?","opts":["Предаване на символи от един към много, независимо дали получателят разбира значението им","Предаване на символи от един към друг, ако получателят разбира значението на символа на подателя","Предаване на сигнали по мрежа между поне три свързани устройства, независимо от значението им","Преобразуване на символи в сигнали от подателя, без да е необходимо участието на получател"],"correct":1,"expl":"Условието е значението на символа на подателя да е разбираемо за получателя."},{"id":"L01-B-2","n":2,"text":"Какво се получава в резултат на дискретизацията и квантоването на аналогов сигнал?","opts":["Квант — минималната промяна на дадена физическа величина, която може да се измери","Шум — външно въздействие, изменящо формата на сигнала по време на предаването","Носещ сигнал — високочестотно трептене с постоянна амплитуда и честота","Извадка — краен брой значения за стойността на сигнала за определен интервал от време"],"correct":3,"expl":"Резултатът от дискретизацията и квантоването е извадката."},{"id":"L01-B-3","n":3,"text":"Колко байта са **1 KB** при представянето на информацията?","opts":["1024 B","1000 B","8 B","1024 bits"],"correct":0,"expl":"1 KB = 1024 B; десетичните кратни (×1000) се използват при bps."},{"id":"L01-B-4","n":4,"text":"Коя комуникационна система е предназначена за предаване на **неподвижни образи**?","opts":["Телевизионната","Телеизмерителната","Факсимилната","Телетекстната"],"correct":2,"expl":"Факсимилни — неподвижни образи; телевизионни и видеотелефонни — подвижни изображения."},{"id":"L01-B-5","n":5,"text":"При **асинхронния** метод на предаване всеки байт:","opts":["се предхожда от стартов бит и е последван от 1 или 2 стопови бита","се предава като част от непрекъснат поток без служебни битове","се предхожда от 2 стартови бита и е последван от 1 стопов бит","се предава едновременно в двете посоки по отделни линии"],"correct":0,"expl":"Асинхронен — по байтове, 1 стартов и 1 или 2 стопови бита; синхронен — непрекъснат поток."},{"id":"L01-B-6","n":6,"text":"Коя от изброените организации е създадена **най-рано** (1865 г.)?","opts":["IEC","ISO","ITU","IEEE"],"correct":2,"expl":"ITU — 1865 г.; IEC — 1906 г.; ISO — 1947 г."},{"id":"L01-B-7","n":7,"text":"Какво представлява **ISO/IEC JTC1**?","opts":["Европейски институт за стандартизация в далекосъобщенията и радиоразпръскването","Подкомитет на ITU-T за стандарти в областта на локалните мрежи","Работна група на IETF, която поддържа списъка на активните RFC","Общ технически комитет на ISO и IEC за стандартизация в областта на информационните технологии"],"correct":3,"expl":"JTC1 = Joint Technical Committee 1 на ISO и IEC; дели се на 8 подкомитета (SC)."},{"id":"L01-B-8","n":8,"text":"Какво означават числата **„ннннн“** и **„гггг“** в означението **ISO ннннн:гггг**?","opts":["Годината на издаване и номера на стандарта","Номера на стандарта и годината на издаване","Номера на техническия комитет и годината на гласуване","Номера на стандарта и броя на страните, които са го приели"],"correct":1,"expl":"Напр. ISO 11801:2002 — стандарт № 11801 от 2002 г."},{"id":"L01-B-9","n":9,"text":"Кой ISO/IEC стандарт е еквивалентен на **EN 50173-5** и **TIA-942** (окабеляване на центрове за данни)?","opts":["ISO 24764","ISO 24702","ISO 15018","ISO 11801"],"correct":0,"expl":"Data centre: ISO 24764 / EN 50173-5 / TIA-942."},{"id":"L01-B-10","n":10,"text":"Кой стандарт от IEEE 802 се отнася до **безжичните** мрежи?","opts":["802.8","802.6","802.11","802.4"],"correct":2,"expl":"802.11 — Wireless; 802.8 — Fiber Optics; 802.6 — MAN; 802.4 — Token Bus."}],"C":[{"id":"L01-C-1","n":1,"text":"Как се разпределят точките при **редовно** обучение?","opts":["До 40 т. от текущ контрол от упражненията и до 60 т. от изпита","До 100 т. само от изпита","До 50 т. от текущ контрол от упражненията и до 50 т. от изпита","До 60 т. от текущ контрол от упражненията и до 40 т. от изпита"],"correct":3,"expl":"Редовно: 60 т. текущ контрол (8 контролни) + 40 т. изпит; задочно — до 100 т. от изпита."},{"id":"L01-C-2","n":2,"text":"Какво означава характеристиката **„надеждно“** на комуникацията?","opts":["Информацията да достигне само до получателя, за когото е предназначена, без да се прихване","Информацията или част от нея да не се загуби, повреди или измени по време на предаването","Да се предаде максимален обем информация за минимално време по комуникационния канал","С минимални инвестиции да се надвишат очакванията на потребителите"],"correct":1,"expl":"Надеждно — без загуба, повреда или изменение; другите са сигурно, бързо, евтино."},{"id":"L01-C-3","n":3,"text":"Кое твърдение за **цифровия сигнал** е вярно?","opts":["Променя се непрекъснато във времето и се характеризира с амплитуда, честота и фаза","Силно затихва и се изкривява, поради което трудно се възстановява в приемника","Заема еднозначно една от две ясно различими стойности, интерпретирани като 0 и 1","Вероятността за грешки при него е по-голяма, отколкото при аналоговия"],"correct":2,"expl":"Цифровият сигнал е дискретен (0/1) и вероятността за грешки е значително по-малка."},{"id":"L01-C-4","n":4,"text":"Какво е **Bandwidth** на канала?","opts":["Теоретичният брой bps за канала","Реално достигнатият максимален брой предадени bps","Броят полезни битове, доставени за единица време","Броят символи, предадени за една секунда"],"correct":0,"expl":"Bandwidth — теоретично; Throughput — реално; Goodput — само полезни битове."},{"id":"L01-C-5","n":5,"text":"Коя от изброените **НЕ** е качествен показател на комуникационните системи?","opts":["Режим на предаване","Вярност на предаваната информация","Шумоустойчивост на кабела","Пропускателна способност"],"correct":2,"expl":"Показателите са: скорост, пропускателна способност, режим, метод, вярност и надеждност."},{"id":"L01-C-6","n":6,"text":"С какво се измерва **надеждността** на комуникационната система?","opts":["С времето за безотказна работа до първия отказ и времето за престой до възстановяване","С отношението на вярно приетите битове към общия брой предадени","С усредненото отношение на неправилно приетите битове към всички предадени","С максималния брой предадени bps за единица време"],"correct":0,"expl":"Достоверността и грешката измерват вярността, а не надеждността."},{"id":"L01-C-7","n":7,"text":"Кое твърдение за стандартите по региони е вярно?","opts":["Американските стандарти са на английски, френски и немски","Азиатски стандарти няма","Европейските стандарти се издават от EIA/TIA и IEEE","Европейските стандарти се издават само на английски"],"correct":1,"expl":"Европейски (CENELEC) — на английски, френски и немски; американски (EIA/TIA, IEEE) — на английски; азиатски — няма."},{"id":"L01-C-8","n":8,"text":"Какво е **ETSI**?","opts":["Европейски комитет за стандартизация в електротехниката, създаден 1973 г.","Американска асоциация на телекомуникационната индустрия","Международен съюз по далекосъобщения със сектори T, R и D","Европейски институт за телекомуникационна стандартизация, създаден 1988 г."],"correct":3,"expl":"ETSI — 1988 г., 786 членове от 67 страни; CENELEC — 1973 г."},{"id":"L01-C-9","n":9,"text":"Под каква форма съществуват **европейските стандарти (EN)**?","opts":["Като самостоятелни документи с означение EN, разпространявани директно","Само на английски език с означение ISO EN, без превод на националните езици","Само под формата на национални стандарти с инициалите на страната и година на въвеждане","Като препоръки на ITU-T, които всяка страна прилага пряко, без национални версии"],"correct":2,"expl":"Документи само с означение EN не се издават; напр. БДС EN 9001:2015."},{"id":"L01-C-10","n":10,"text":"Какво е **филтрация** в комуникационната система?","opts":["Отделяне на сигнала от шума в приемника","Разбиване на сигнала по стойност","Способността на системата да осигури необходимата вярност","Превръщане на съобщението в сигнал в предавателя"],"correct":0,"expl":"Филтрация — в приемника; шумоустойчивост — способност за осигуряване на вярност."}],"D":[{"id":"L01-D-1","n":1,"text":"Коя дисциплина от цикъла „мрежови“ дисциплини е **избираема** и се изучава в **8. семестър**?","opts":["Мрежова сигурност","Администриране на локални мрежи","Компютърни мрежи и Интернет","Основи на компютърните комуникации"],"correct":0,"expl":"ОКК — 5 сем., КМИ — 6 сем., АЛМ — 7 сем. (задължителни); Мрежова сигурност — 8 сем., избираема."},{"id":"L01-D-2","n":2,"text":"Какво е **дискрет**?","opts":["Минималната стойност на промяната на някоя физическа величина","Краен брой значения на сигнала за интервал от време","Стойността на сигнала в даден момент от времето","Броят периоди на сигнала за една секунда"],"correct":2,"expl":"Дискрет — стойност в момент от времето; квант — минималната промяна на величина."},{"id":"L01-D-3","n":3,"text":"Колко **Cps** са 9600 bps, ако към всеки байт полезна информация се добавят 2 служебни бита?","opts":["1200 Cps","960 Cps","2400 Cps","800 Cps"],"correct":1,"expl":"8 + 2 = 10 бита на символ; 9600 / 10 = 960 Cps."},{"id":"L01-D-4","n":4,"text":"Какво означава числото **802** в името на стандарта IEEE 802?","opts":["8 е поредният комитет на IEEE, а 02 е версията на първия стандарт","802 е номерът на RFC, в който за първи път е описан стандартът","80 е броят на подкомитетите, а 2 е броят на работните групи","80 е годината (1980), а 2 е месецът (февруари) на започване на работата"],"correct":3,"expl":"IEEE 802 — от февруари 1980 г.: 80 — годината, 2 — месецът."},{"id":"L01-D-5","n":5,"text":"Какво е **достоверност** на предаваната информация?","opts":["Отношението на неправилно приетите битове към общия брой предадени","Времето за безотказна работа до първия отказ","Степента, в която информацията достига само до своя получател","Отношението на вярно приетите битове към общия брой предадени"],"correct":3,"expl":"Достоверността и грешката са мерки за вярността на предаването."},{"id":"L01-D-6","n":6,"text":"Кои са секторите на **ITU**?","opts":["ITU-T, ITU-S и ITU-W","ITU-T, ITU-R и ITU-D","ITU-A, ITU-B и ITU-C","ITU-R, ITU-E и ITU-N"],"correct":1,"expl":"ITU-T — стандартизация, ITU-R — радиокомуникация, ITU-D — развитие."},{"id":"L01-D-7","n":7,"text":"Кое твърдение за **RFC** е вярно?","opts":["RFC се отменя чрез гласуване на членовете на IETF и се изтрива от архива","Нормативната версия на RFC е винаги в PDF формат, а не в ASCII текст","RFC никога не се отменя, а се замества от публикацията на ново RFC","RFC се появяват през 1980 г. заедно с IEEE 802"],"correct":2,"expl":"RFC — от 1969 г. (ARPANET), не се отменя, нормативната версия е в ASCII."},{"id":"L01-D-8","n":8,"text":"Коя е правилната последователност на началните етапи при създаване на стандарт?","opts":["Начало – Концепция – Проектиране – Възприемане","Концепция – Начало – Възприемане – Проектиране","Проектиране – Концепция – Начало – Възприемане","Начало – Проектиране – Гласуване – Концепция"],"correct":0,"expl":"Inception → Conception → Drafting → Adoption → Promotion; публикация: Editing → Member Voting → Publication."},{"id":"L01-D-9","n":9,"text":"Кой стандарт от серията IEEE 802 е **Token Ring**?","opts":["802.4","802.5","802.3","802.12"],"correct":1,"expl":"802.5 — Token Ring; 802.4 — Token Bus; 802.12 — 100 VG AnyLAN."},{"id":"L01-D-10","n":10,"text":"Кое от следните **НЕ** е условие системата за окабеляване да отговаря на стандарта?","opts":["Интерфейсите да отговарят на електрическите и механичните изисквания","Правилно екраниране","Правилно системно администриране","Всички компоненти да са от един и същ производител"],"correct":3,"expl":"Изискват се: конфигурация, производителност, интерфейси, екраниране, администриране, сигурност."}],"E":[{"id":"L01-E-1","n":1,"text":"Какво представляват **компютърните комуникации**?","opts":["Взаимодействие между хора и живи организми чрез звукови и светлинни сигнали","Обмен на неподвижни образи по телефонна линия","Вид обмен на информация между две или повече устройства, свързани чрез мрежа","Преобразуване на аналогов сигнал в цифров чрез дискретизация и квантоване"],"correct":2,"expl":"Компютърни комуникации — между два или повече свързани чрез мрежа устройства (компютри, IP телефони, таблети…)."},{"id":"L01-E-2","n":2,"text":"Коя е правилната последователност на елементите в абстрактния модел за предаване на съобщение?","opts":["Източник → приемник → канал → предавател → получател","Предавател → източник → канал → получател → приемник","Източник → канал → предавател → получател → приемник","Източник → предавател → канал → приемник → получател"],"correct":3,"expl":"Смущенията действат върху канала; в приемника пристигат сигнал и шум."},{"id":"L01-E-3","n":3,"text":"Кои са трите параметъра, с които се характеризира **аналоговият** сигнал?","opts":["Амплитуда, период и дискрет","Амплитуда, честота и фаза","Честота, квант и извадка","Фаза, скорост в baud и дължина"],"correct":1,"expl":"Амплитуда — стойност, честота — периоди за секунда, фаза — от 0 до 360°."},{"id":"L01-E-4","n":4,"text":"На колко bps е равен **1 Mbps**?","opts":["1 000 000 bps","1 048 576 bps","1 024 000 bps","100 000 bps"],"correct":0,"expl":"При пропускателната способност кратните са десетични: 1 Mbps = 1000 Kbps = 10⁶ bps."},{"id":"L01-E-5","n":5,"text":"Какво е **Full duplex** режим на предаване?","opts":["В даден момент предава само едната страна по общ път","Данните се предават байт по байт със стартов и стопов бит","Информацията се предава като непрекъснат поток байт след байт","Двете страни могат да предават и приемат едновременно"],"correct":3,"expl":"Full duplex — едновременно в двете посоки; half duplex — поредно по общ път."},{"id":"L01-E-6","n":6,"text":"Как се нарича способността на съобщителната система да осигури необходимата **вярност** на приеманите съобщения?","opts":["Шумоустойчивост","Филтрация","Пропускателна способност","Надеждност"],"correct":0,"expl":"Шумоустойчивост — осигуряване на необходимата вярност; филтрация — отделяне на сигнала от шума."},{"id":"L01-E-7","n":7,"text":"Коя организация е световна федерация на **националните организации по стандартизация**, създадена през **1947 г.**?","opts":["IEC","ITU","ISO","IETF"],"correct":2,"expl":"ISO — 1947 г., по 1 представител от всяка страна, стандарти от всички видове."},{"id":"L01-E-8","n":8,"text":"Как се прилага EN 9001 в **България**?","opts":["EN БДС 9001:2015","БДС EN 9001:2015","ISO БДС 9001:2008","BG EN 9001"],"correct":1,"expl":"Страната добавя своите инициали отпред и годината на въвеждане отзад."},{"id":"L01-E-9","n":9,"text":"Кой документ определя кои RFC са **активни** Интернет стандарти и кои са остарели?","opts":["RFC 1 от 1969 г.","Internet Standard 1 (STD 1)","ISO/IEC JTC1","IEEE 802.1"],"correct":1,"expl":"STD 1 се публикува периодично като RFC."},{"id":"L01-E-10","n":10,"text":"Кой CENELEC стандарт е еквивалентен на **ISO/IEC 11801** (общо окабеляване)?","opts":["EN 50174-1","EN 50310","EN 50173-1","EN 50346"],"correct":2,"expl":"EN 50173-1 Generic Cabling ↔ ISO 11801; EN 50174 — инсталация; EN 50310 — заземяване; EN 50346 — тестване."}]}},{"num":2,"title":"Лекция 2 — Теория на информацията. Предаване на информацията. Модел на комуникация","short":"Теория на информацията. Предаване на информацията. Модел на комуникация","summary":"### Информация\n- **Информация** — **обмен на данни и факти между индивиди или автомати чрез обмен на сигнали**. Предава се под формата на **съобщения** през **информационни канали**.\n- Трябва да бъде: **достоверна, актуална, нова, многоаспектна**…\n\n### Форми на съществуване на информацията\n| Форма | Същност |\n|---|---|\n| **Асимилативна** | получателят я **асимилира, обработва и запаметява** |\n| **Документална** | **записва се** на някакъв физически носител |\n| **Комуникативна** | **цифрова** и **мултимедийна** |\n\n### Характеристики на информацията\n- **Количество** — изразява се в **битове**.\n- **Качество** — три аспекта: **смисъл** (анализира се съдържанието); **структура** (степента на сложност на информационната структура, свързана със смисъла); **сложност** на информационното съобщение.\n- **Ценност** — има **субективен** характер (зависи от индивида и целите му). Изисква:\n  - **Релевантност** — съобщенията да **отговарят на тематиката на запитването**;\n  - **Пертинентност** — информацията да е **нова за потребителя** — изменя представите му за обект, процес, явление или допълва знанието му в друг аспект.\n\n### Информационно съобщение\n- Всяко съобщение се състои от: **смисъл, знак, физически носител**.\n| Аспект | Какво отразява |\n|---|---|\n| **Количествен** | количеството информация |\n| **Семантичен** | съдържанието (смисъла) |\n| **Структурен** | степента на сложност |\n| **Прагматичен** | **използваемостта** на съобщението |\n\n### Теория на информацията\n- **Клон от теорията на вероятностите и математическата статистика**; обект — **информацията**.\n- Свързана е с: **информационната ентропия**, информационните и комуникационните системи, **предаването на данни**, **теорията на скоростта на изказването**, **криптографията**, **корекцията на грешки**…\n\n### История — личности\n| Личност | Години | Принос |\n|---|---|---|\n| **Клод Шенон** | 1916–2001 | **1948 г.** — „**Математическа теория на комуникациите**“ → основи на теорията на информацията |\n| **Ричард Хеминг** | 1915–1998 | **1948 г.** създава **коригиращия грешки код на Хеминг**, публикува го **1950 г.**; **1980 г.** — книгата „**Coding and Information Theory**“ |\n| **Робърт Тейлър** | 1932–2017 | **1967 г.** учредява **първото научно дружество за информационна наука** |\n| **Робърт Фано** | 1917–2016 | **1948 г.** — **код на Шенон-Фано**; нач. на 1950-те — **неравенство на Фано** (кодиране на канали); **1961 г.** — **CTSS** (Compatible Time-Sharing System — достъп до терминали с разделяне по време) |\n| **Дейвид Хъфман** | 1925–1999 | **1952 г.** — алгоритъм за **ентропийно кодиране** за **компресиране на данни без загуба** |\n\n### Ентропия\n- **Мярка на количеството информация, закодирана в едно съобщение.** Колкото **по-висока** е ентропията, толкова **повече информация** съдържа съобщението.\n- За единичен символ — **отрицателният логаритъм на вероятността му**; информационното съдържание в битове:\n  - **битове = −log₂(вероятност)**, където вероятността p = (брой срещания на символа) / (обща дължина на съобщението).\n- Колкото **по-рядък** е символът (по-малка вероятност), толкова **повече** битове информация носи. Напр. p = 1/2 → 1 бит; p = 1/4 → 2 бита; p = 1/16 → 4 бита; p = 1 → 0 бита.\n- Ентропията **не може да се използва за универсално измерване** на информационното съдържание: стойността ѝ силно зависи от вероятността на символите, които са **контекстно зависими спрямо избрания статистически модел**. **Статистическият модел** определя **колко предходни символа** се вземат при изчисляването на вероятността за срещане.\n\n### Пример (от лекцията)\n**Съобщение „абаббббааабаабабабаа“ (20 символа):**\n| Символ | Честота | Вероятност | Информационно съдържание |\n|---|---|---|---|\n| а | 11/20 | 0,55 | −log₂0,55 = **0,86** бита |\n| б | 9/20 | 0,45 | −log₂0,45 = **1,15** бита |\n\n**Съобщение „аааааааабааааааа“ (16 символа):**\n| Символ | Честота | Вероятност | Информационно съдържание |\n|---|---|---|---|\n| а | 15/16 | 0,9375 | −log₂0,9375 = **0,093** бита |\n| б | 1/16 | 0,0625 | −log₂0,0625 = **4** бита |\n- Въпросът „дали това са правилните брой битове при идеална компресия?“: на практика символ не може да се кодира с дробен брой битове — „а“ с 0,86 или 0,093 бита би се кодирал с **1 бит**, „б“ с 1,15 бита — с **1 бит**, а „б“ с 4 бита — с **4 бита** (маркирано „?!?“ на слайда).\n\n### Ентропия на съобщение\n- **Сума от ентропиите на всички символи на съобщението.**\n- При **идеална компресия** всеки символ се кодира в **броя битове на информационното си съдържание**; различните **кодови таблици значително се отдалечават** от идеалния модел.\n- Пример: ако „а“ според ентропията се представя с **4 бита**, съобщението „ааааа“ е **5 × 4 = 20 бита**; с **ASCII** (1 B = 8 бита на символ) — **5 × 8 = 40 бита**.\n- Пресмятане за „абаббббааабаабабабаа“: 11 × 0,86 + 9 × 1,15 ≈ **19,8 бита** (срещу 20 × 8 = 160 бита в ASCII).\n\n### Кодиране и предаване на съобщения в историята\n- **Чрез видими сигнали:** **дим, огън, сигнални флагове**; **чрез звуци:** **барабани, свирки**.\n- **Пощенски гълъби** — „**първата безжична мрежа**“: от **5 век пр. Хр.** до **2004 г. в Индия** (закрита последната пощенска станция с гълъби).\n- **Телеграф** — първото телеграфно съобщение е изпратено през **1844 г.** от **Самюъл Морз**. През **1866 г.** е завършена първата телеграфна линия у нас **Варна–Шумен–Русе**. **БТК** спира услугата „Телеграма“ през **2005 г.**\n- **Телефон** — **1876 г.**, **Александър Бел** и **Томас Едисън** (по слайда).\n\n### Компютърни комуникации по съобщителна линия\n- Общият модел: **източник → предавател → канал → приемник → получател**; смущенията действат върху канала.\n- При компютърните комуникации той се превръща в:\n  - **компютър** (източник) → **предавател = кодер + модулатор** → **канал** → **приемник = демодулатор + декодер** → **компютър** (получател).\n  - Между компютъра и предавателя — **съобщение**; от предавателя излиза **сигнал**; в приемника влизат **сигнал и шум**; към получателя — **съобщение**.\n\n### Еволюция на мрежите за предаване на информация\n| Преди | Сега |\n|---|---|\n| **Всяка мрежа със свои правила** за комуникация, преносна среда и устройства (отделни компютърна, телефонна и TV мрежа) | **Една мрежа с общи правила** за комуникация, **обща преносна среда** и **различни устройства** (конвергентна мрежа) |\n\n### Капани за изпита\n- **Релевантност** (съответствие на тематиката на запитването) ≠ **пертинентност** (новост за потребителя).\n- **Семантичен** аспект → съдържание; **структурен** → сложност; **прагматичен** → **използваемост**; количествен → количество.\n- Съобщението се състои от **смисъл, знак и физически носител** (не от „сигнал, шум, канал“).\n- Количеството информация се измерва в **битове**; ценността е **субективна**.\n- **По-висока ентропия = повече информация.** По-малка вероятност на символа → **повече** битове. −log₂(1) = 0.\n- Ентропия на **съобщение** = **сума** от ентропиите на символите (не средно, не произведение).\n- Ентропията **не е универсална мярка** — зависи от **статистическия модел** (колко предходни символа се вземат).\n- **1948 г.** е годината и на Шенон (теорията), и на кода на Хеминг (създаден), и на кода Шенон-Фано; кодът на Хеминг е **публикуван 1950 г.**, книгата — **1980 г.**; **Хъфман — 1952 г.**; **Тейлър — 1967 г.**; **CTSS — 1961 г.**\n- **Хъфман** — компресия **без загуба**; **Хеминг** — **коригиране на грешки**; **Фано** — **неравенство** за кодиране на канали.\n- Телеграф: **1844 (Морз)**, линия Варна–Шумен–Русе **1866**, край на „Телеграма“ **2005**; гълъби — до **2004 (Индия)**; телефон — **1876**.\n- Предавател = **кодер + модулатор**; приемник = **демодулатор + декодер** (не обратно).\n- **Неточности/спорни твърдения в слайдовете:** телефонът по слайда е на „Бел и Едисън“ — патентът от 1876 г. е на **Бел**, Едисън по-късно подобрява микрофона; CTSS (1961) се свързва основно с **Фернандо Корбато** (MIT), а Фано ръководи Project MAC; „ентропологично кодиране“ — правилният термин е **ентропийно кодиране**; Робърт Тейлър е изписан „Роберт/Робърт“; −log₂0,9375 ≈ 0,093 (закръглено).\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L02-A-1","n":1,"text":"Как е определена **информацията** в лекцията?","opts":["Физически носител на съобщението, който се изменя под действието на шума","Обмен на данни и факти между индивиди или автомати чрез обмен на сигнали","Мярка на количеството битове, закодирани в едно съобщение","Съвкупност от знаци, записани на физически носител"],"correct":1,"expl":"Информацията е обмен на данни и факти чрез сигнали; предава се като съобщения през информационни канали."},{"id":"L02-A-2","n":2,"text":"При коя форма на съществуване информацията се **записва на физически носител**?","opts":["Асимилативна","Комуникативна","Мултимедийна","Документална"],"correct":3,"expl":"Документална — записва се на носител; асимилативна — асимилира се и се запаметява от получателя."},{"id":"L02-A-3","n":3,"text":"Какво изисква **пертинентността** на информацията?","opts":["Информацията да е нова за потребителя и да изменя или допълва представите му","Информационните съобщения да отговарят на тематиката на запитването","Информацията да е записана на физически носител и да е достъпна по всяко време","Съобщението да има минимална ентропия"],"correct":0,"expl":"Пертинентност — новост за потребителя; релевантност — съответствие на тематиката на запитването."},{"id":"L02-A-4","n":4,"text":"Кой публикува през 1948 г. „Математическа теория на комуникациите“ и слага основите на теорията на информацията?","opts":["Ричард Хеминг","Робърт Фано","Клод Шенон","Дейвид Хъфман"],"correct":2,"expl":"Клод Шенон (1916–2001), 1948 г."},{"id":"L02-A-5","n":5,"text":"Символ се среща в съобщение с вероятност **0,25**. Какво е информационното му съдържание?","opts":["2 бита","0,25 бита","4 бита","0,5 бита"],"correct":0,"expl":"−log₂0,25 = 2 бита."},{"id":"L02-A-6","n":6,"text":"Какво е **ентропия на съобщение**?","opts":["Произведението от вероятностите на всички символи","Броят символи, умножен по 8 бита","Сумата от ентропиите на всички символи на съобщението","Ентропията на най-често срещания символ"],"correct":2,"expl":"Ентропията на съобщението е сумата от ентропиите на символите му."},{"id":"L02-A-7","n":7,"text":"Кой е създал през 1952 г. алгоритъм за ентропийно кодиране, използван за **компресиране на данни без загуба**?","opts":["Робърт Тейлър","Клод Шенон","Ричард Хеминг","Дейвид Хъфман"],"correct":3,"expl":"Хъфман (1925–1999), 1952 г."},{"id":"L02-A-8","n":8,"text":"Кои са частите на **предавателя** в модела на компютърните комуникации по съобщителна линия?","opts":["Демодулатор и декодер","Кодер и модулатор","Кодер и декодер","Модулатор и демодулатор"],"correct":1,"expl":"Предавател = кодер + модулатор; приемник = демодулатор + декодер."},{"id":"L02-A-9","n":9,"text":"През коя година е завършена първата телеграфна линия в България **Варна–Шумен–Русе**?","opts":["1866 г.","1844 г.","1876 г.","1905 г."],"correct":0,"expl":"1844 — първото телеграфно съобщение (Морз); 1866 — линията Варна–Шумен–Русе."},{"id":"L02-A-10","n":10,"text":"Кое **НЕ** е изброено като начин за кодиране на съобщения чрез **видими** сигнали?","opts":["Дим","Огън","Свирки","Сигнални флагове"],"correct":2,"expl":"Свирките и барабаните са звукови сигнали."}],"B":[{"id":"L02-B-1","n":1,"text":"Кое от изброените **НЕ** е изискване към информацията?","opts":["Да е достоверна","Да е актуална","Да е многоаспектна","Да е многократно повторена"],"correct":3,"expl":"Информацията трябва да е достоверна, актуална, нова, многоаспектна."},{"id":"L02-B-2","n":2,"text":"Кои са трите аспекта на **качеството** на информацията?","opts":["Релевантност, пертинентност и ценност","Смисъл, структура и сложност","Количество, качество и ценност","Знак, смисъл и физически носител"],"correct":1,"expl":"Качество: смисъл, структура, сложност на съобщението."},{"id":"L02-B-3","n":3,"text":"От какво се състои всяко **информационно съобщение**?","opts":["От сигнал, шум и канал","От източник, канал и получател","От смисъл, знак и физически носител","От количество, качество и ценност"],"correct":2,"expl":"Съобщение = смисъл + знак + физически носител."},{"id":"L02-B-4","n":4,"text":"Теорията на информацията е клон от:","opts":["теорията на вероятностите и математическата статистика","теорията на електрическите вериги и сигналите","теорията на графите и дискретната математика","теорията на автоматичното управление и регулиране"],"correct":0,"expl":"Теорията на информацията е клон от теорията на вероятностите и математическата статистика."},{"id":"L02-B-5","n":5,"text":"Кога **Ричард Хеминг** публикува коригиращия грешки код, който е създал през 1948 г.?","opts":["През 1948 г.","През 1967 г.","През 1950 г.","През 1980 г."],"correct":2,"expl":"Създаден 1948 г., публикуван 1950 г.; 1980 г. — книгата „Coding and Information Theory“."},{"id":"L02-B-6","n":6,"text":"Какво показва ентропията?","opts":["Количеството информация, закодирана в едно съобщение","Степента на сложност на структурата на съобщението","Използваемостта на съобщението за потребителя","Броя изменения на сигнала за една секунда"],"correct":0,"expl":"Колкото по-висока е ентропията, толкова повече информация съдържа съобщението."},{"id":"L02-B-7","n":7,"text":"В съобщението „абаббббааабаабабабаа“ символът „а“ се среща 11 пъти. Каква е вероятността му?","opts":["0,45","0,55","0,86","1,15"],"correct":1,"expl":"11/20 = 0,55; за „б“ — 9/20 = 0,45."},{"id":"L02-B-8","n":8,"text":"Ако символът „а“ се кодира с **ASCII** код, колко бита заема съобщението „ааааа“?","opts":["20 бита","5 бита","8 бита","40 бита"],"correct":3,"expl":"5 символа × 8 бита = 40 бита; при 4 бита по ентропия — 20 бита."},{"id":"L02-B-9","n":9,"text":"Кой е изпратил първото телеграфно съобщение и кога?","opts":["Александър Бел през 1876 г.","Томас Едисън през 1866 г.","Самюъл Морз през 1844 г.","Самюъл Морз през 1876 г."],"correct":2,"expl":"Морз — 1844 г.; телефонът — 1876 г."},{"id":"L02-B-10","n":10,"text":"Каква е особеността на съвременните мрежи за предаване на информация в сравнение с миналото?","opts":["Една мрежа с общи правила за комуникация, преносна среда и различни устройства","Отделна мрежа за всеки вид услуга със собствени правила и преносна среда","Всяко устройство използва собствена преносна среда","Компютърната, телефонната и TV мрежата са напълно изолирани една от друга"],"correct":0,"expl":"Преди — всяка мрежа със свои правила, среда и устройства; сега — една обща мрежа."}],"C":[{"id":"L02-C-1","n":1,"text":"При коя форма на съществуване получателят на информацията я **асимилира, обработва и запаметява**?","opts":["Асимилативна","Документална","Комуникативна","Цифрова"],"correct":0,"expl":"Асимилативна — асимилира, обработва и запаметява; комуникативна — цифрова и мултимедийна."},{"id":"L02-C-2","n":2,"text":"Защо **ценността** на информацията има субективен характер?","opts":["Защото се изразява в битове","Защото зависи от физическия носител","Защото зависи от индивида и неговите цели","Защото се определя от статистическия модел"],"correct":2,"expl":"Ценността зависи от индивида и целите му и изисква релевантност и пертинентност."},{"id":"L02-C-3","n":3,"text":"Кой аспект на информационното съобщение отразява неговата **използваемост**?","opts":["Семантичният","Прагматичният","Структурният","Количественият"],"correct":1,"expl":"Прагматичен — използваемост; семантичен — съдържание; структурен — сложност."},{"id":"L02-C-4","n":4,"text":"Кое от изброените **НЕ** е посочено като област, свързана с теорията на информацията?","opts":["Криптографията","Корекцията на грешки","Теорията на скоростта на изказването","Теорията на електромагнитното поле"],"correct":3,"expl":"Свързани области: ентропия, инф. и комуникационни системи, предаване на данни, теория на скоростта на изказването, криптография, корекция на грешки."},{"id":"L02-C-5","n":5,"text":"Какво създава **Робърт Фано** през 1961 г.?","opts":["Кода Шенон-Фано","Първото научно дружество за информационна наука","Алгоритъм за компресиране на данни без загуба","Система за достъп до терминали с разделяне по време (CTSS)"],"correct":3,"expl":"Фано: 1948 — код Шенон-Фано; 1950-те — неравенство на Фано; 1961 — CTSS."},{"id":"L02-C-6","n":6,"text":"Как се изчислява информационното съдържание на един символ в битове?","opts":["битове = log₂(1 − вероятност)","битове = −log₂(вероятност)","битове = вероятност × 8","битове = 1 / вероятност"],"correct":1,"expl":"Ентропията на символ е отрицателният логаритъм (при основа 2) на вероятността му."},{"id":"L02-C-7","n":7,"text":"Защо ентропията **не може** да се използва за универсално измерване на информационното съдържание?","opts":["Защото не може да се изчисли за двоични символи, а само за символите на естествен език","Защото винаги е равна на броя битове, с които символът е записан в ASCII кода","Стойността ѝ зависи от вероятностите на символите, които зависят от избрания статистически модел","Защото не зависи от вероятността на символите, а само от размера на азбуката"],"correct":2,"expl":"Статистическият модел определя колко предходни символа се вземат при изчисляване на вероятността."},{"id":"L02-C-8","n":8,"text":"В съобщението „аааааааабааааааа“ символът „б“ има вероятност 1/16. Какво е информационното му съдържание?","opts":["4 бита","0,093 бита","16 бита","1 бит"],"correct":0,"expl":"−log₂(1/16) = 4 бита; за „а“ (15/16) — 0,093 бита."},{"id":"L02-C-9","n":9,"text":"Пощенските гълъби са наречени „първата безжична мрежа“. Кога и къде е закрита последната пощенска станция с гълъби?","opts":["През 2005 г. в България","През 2004 г. в Индия","През 1844 г. в САЩ","През 1866 г. във Франция"],"correct":1,"expl":"Гълъбите — от 5 век пр. Хр. до 2004 г. в Индия."},{"id":"L02-C-10","n":10,"text":"В модела на компютърните комуникации какво постъпва в **приемника**?","opts":["Само съобщение","Само полезен сигнал","Съобщение и смущения","Сигнал и шум"],"correct":3,"expl":"От канала (подложен на смущения) в приемника постъпват сигнал и шум."}],"D":[{"id":"L02-D-1","n":1,"text":"Как се предава информацията според лекцията?","opts":["Само под формата на документи на хартиен носител","Под формата на кванти през физическа среда","Под формата на съобщения през информационни канали","Само чрез цифрови сигнали по оптичен кабел"],"correct":2,"expl":"Информацията се предава под формата на съобщения през информационни канали."},{"id":"L02-D-2","n":2,"text":"Какво изисква **релевантността** на информацията?","opts":["Информацията да е нова за потребителя и да допълва представите му","Съобщението да е записано на физически носител с подходящ формат","Информацията да е изразена в битове","Информационните съобщения да отговарят на тематиката на запитването"],"correct":3,"expl":"Релевантност — съответствие с тематиката; пертинентност — новост за потребителя."},{"id":"L02-D-3","n":3,"text":"В какво се изразява **количеството** информация?","opts":["В бодове","В битове","В херци","В символи за секунда"],"correct":1,"expl":"Количеството информация се изразява в битове."},{"id":"L02-D-4","n":4,"text":"Какво учредява **Робърт Тейлър** през 1967 г.?","opts":["Първото научно дружество за информационна наука","Първата телеграфна линия между Европа и Америка","Кода за коригиране на грешки","Системата CTSS с разделяне на процесорното време"],"correct":0,"expl":"Тейлър (1932–2017) — 1967 г., първото научно дружество за информационна наука."},{"id":"L02-D-5","n":5,"text":"Как се изменя информационното съдържание на символ, когато вероятността му **намалява**?","opts":["Намалява","Остава постоянно","Става равно на нула","Увеличава се"],"correct":3,"expl":"Битове = −log₂(p): по-рядък символ носи повече информация."},{"id":"L02-D-6","n":6,"text":"Какво определя **статистическият модел** при изчисляване на ентропията?","opts":["Колко предходни символа се вземат при изчисляването на вероятността за срещане","Колко бита заема всеки символ в ASCII таблицата при предаването","Коя кодова таблица ще се използва за кодирането на символите при предаването","Колко символа има в азбуката на източника на съобщенията"],"correct":0,"expl":"Статистическият модел определя колко предходни символа се отчитат."},{"id":"L02-D-7","n":7,"text":"Какво е характерно за **идеалния случай на компресия**?","opts":["Всеки символ се кодира с точно 8 бита, както в разширената ASCII таблица","Всички символи се кодират с еднакъв брой битове, независимо от честотата им","Всеки символ се кодира в броя битове на информационното му съдържание","Най-честият символ се кодира с най-много битове, а редките — с най-малко"],"correct":2,"expl":"При идеална компресия символът заема толкова битове, колкото е информационното му съдържание; кодовите таблици се отдалечават от това."},{"id":"L02-D-8","n":8,"text":"Кое съответствие **личност — принос** е вярно?","opts":["Дейвид Хъфман — неравенство за кодиране на канали","Ричард Хеминг — код за коригиране на грешки","Робърт Фано — компресия без загуба от 1952 г.","Клод Шенон — системата CTSS"],"correct":1,"expl":"Хеминг — коригиращ код; Фано — неравенство и CTSS; Хъфман — компресия без загуба."},{"id":"L02-D-9","n":9,"text":"Коя година е посочена за изобретяването на **телефона**?","opts":["1844 г.","1876 г.","1866 г.","1948 г."],"correct":1,"expl":"Телефонът — 1876 г. (Бел; слайдът посочва и Едисън)."},{"id":"L02-D-10","n":10,"text":"Какво представлява **декодерът** в модела на компютърните комуникации?","opts":["Част от предавателя, заедно с модулатора","Елемент на канала, който премахва смущенията","Част от приемника, заедно с демодулатора","Устройство-източник на съобщението"],"correct":2,"expl":"Приемник = демодулатор + декодер."}],"E":[{"id":"L02-E-1","n":1,"text":"Кои са двата вида **комуникативна** информация според лекцията?","opts":["Асимилативна и документална","Аналогова и дискретна","Цифрова и мултимедийна","Семантична и прагматична"],"correct":2,"expl":"Комуникативната форма е цифрова и мултимедийна."},{"id":"L02-E-2","n":2,"text":"Какво отразява **структурният** аспект на информационното съобщение?","opts":["Степента на сложност","Използваемостта на съобщението","Съдържанието на съобщението","Количеството битове"],"correct":0,"expl":"Структурен — сложност; прагматичен — използваемост; семантичен — съдържание."},{"id":"L02-E-3","n":3,"text":"Какво е обект на **теорията на информацията**?","opts":["Сигналът","Каналът за предаване","Компютърната мрежа","Информацията"],"correct":3,"expl":"Обект на теорията на информацията е информацията."},{"id":"L02-E-4","n":4,"text":"Кой от изброените кодове е създаден от Робърт Фано през 1948 г.?","opts":["Кодът на Хъфман","Кодът Шенон-Фано","Кодът на Хеминг","ASCII кодът"],"correct":1,"expl":"Фано — 1948 г. код Шенон-Фано; Хъфман — 1952 г.; Хеминг — създаден 1948 г., публикуван 1950 г."},{"id":"L02-E-5","n":5,"text":"Как се изменя количеството информация в съобщението при **по-висока ентропия**?","opts":["Съобщението съдържа по-малко информация","Съобщението съдържа повече информация","Количеството информация не се променя","Съобщението става по-предсказуемо"],"correct":1,"expl":"Колкото по-висока е ентропията, толкова повече информация съдържа съобщението."},{"id":"L02-E-6","n":6,"text":"Символ се среща с вероятност **1** (съобщението се състои само от него). Какво е информационното му съдържание?","opts":["1 бит","8 бита","Безкрайно много бита","0 бита"],"correct":3,"expl":"−log₂1 = 0 — напълно предсказуемият символ не носи информация."},{"id":"L02-E-7","n":7,"text":"Ако символът „а“ според ентропията си се представя с **4 бита**, каква е ентропията на съобщението „ааааа“?","opts":["20 бита","40 бита","4 бита","9 бита"],"correct":0,"expl":"5 × 4 = 20 бита; с ASCII — 5 × 8 = 40 бита."},{"id":"L02-E-8","n":8,"text":"Кой символ носи повече информация в съобщението „абаббббааабаабабабаа“?","opts":["„а“ — около 0,86 бита","„а“ — около 1,15 бита","„б“ — около 1,15 бита","Двата носят еднаква информация"],"correct":2,"expl":"„б“ е по-рядък (0,45) → −log₂0,45 = 1,15; „а“ (0,55) → 0,86."},{"id":"L02-E-9","n":9,"text":"Кога БТК спира предлагането на услугата „Телеграма“ в България?","opts":["През 2004 г.","През 1866 г.","През 1990 г.","През 2005 г."],"correct":3,"expl":"БТК спира „Телеграма“ през 2005 г.; гълъбите в Индия — 2004 г."},{"id":"L02-E-10","n":10,"text":"Кое е характерно за мрежите за предаване на информация **преди**?","opts":["Една мрежа с общи правила за комуникация, преносна среда и различни устройства","Всяка мрежа е със свои правила за комуникация, преносна среда и устройства","Всички услуги се предават по обща преносна среда","Телефонът, компютърът и телевизорът ползват една обща мрежа и една среда"],"correct":1,"expl":"Преди — отделни компютърна, телефонна и TV мрежа; сега — една обща мрежа."}]}},{"num":3,"title":"Лекция 3 — Модулация. Същност. Видове","short":"Модулация. Същност. Видове","summary":"### Място на модулацията в комуникационната система\n- **компютър → [кодер → модулатор] = предавател → канал (смущения) → [демодулатор → декодер] = приемник → компютър**.\n- Съобщение → **сигнал** → **сигнал и шум** → съобщение. Модулаторът е в **предавателя**, демодулаторът — в **приемника**.\n\n### Сигнал\n- **Сигналът е физически процес, служещ за пренос на информация.** Видове по природа: **електрически, звукови, светлинни, магнитни** и др.\n| Критерий | Видове |\n|---|---|\n| Според **значенията им във времето** | **непрекъснати** и **дискретни** |\n| Според **закона, по който се изменят** | **хармонични** (изменят се по **синусоидален или косинусоидален** закон) и нехармонични |\n| Според **повторението им във времето** | **периодични** (приемат повтарящи се стойности през определен период) и непериодични |\n\n### Параметри на сигнала\n- **Синусоидата** е пример за основен **непрекъснат, хармоничен и периодичен** сигнал. Определя се с:\n  - **A — максимална амплитуда** — максималната стойност във времето; за електрически сигнал — във **волтове (V)**;\n  - **f — честота** — темп на повторение (периоди за секунда), в **Hz**; **обратно пропорционална на периода T**: **f = 1/T** (напр. T = 1 ms → f = 1 kHz);\n  - **φ — фаза** — **отместване в рамките на отделния период**.\n\n### Предаване на сигнали в основна лента (Baseband)\n- Информацията се носи от електрическите сигнали в **основна лента (Baseband)**. Информационните сигнали са:\n  - **нискочестотни**; с **не много висока амплитуда**; **силно се влияят от нискочестотния шум**;\n  - **силно затихват** → могат да се предават **само по кабел** или на **много къси разстояния безжично**.\n- Антените за безжично излъчване в този обхват са **много големи** — сравними с **дължината на вълната**, която е **стотици метри**.\n\n### Предимства на високочестотния сигнал\n- Разпространява се с **по-малки загуби по въздух и по оптичен кабел**.\n- **По-малки антени** (по-малка дължина на вълната).\n- **По-добра насоченост** на антените → предаватели с **по-ниска изходна мощност**.\n- Ефективни **нискошумящи усилватели и приемници**.\n- При **много високи честоти** е нужна **пряка видимост** между предавател и приемник (особеност/ограничение).\n- Могат да се поместят **повече канали** (по-голям трафик) или **по-широки канали** (по-качествени услуги, по-бърз трансфер в bits/s).\n\n### Модулация — същност\n- **Модулацията** е **пренасяне на спектъра на сигнала-носител на информация във високочестотната област** чрез **изменение на параметрите на високочестотен (носещ) сигнал** под действието на **информационния (модулиращ)** сигнал.\n- **Модулираният сигнал (Passband)** се получава при **нелинейното смесване** на сигнала в основна лента с носещия сигнал.\n- Терминология: **носещ** сигнал = високочестотният; **модулиращ** = информационният (baseband); **модулиран** = резултатът (passband).\n\n### Видове модулации (според вида на baseband сигнала)\n| | Изменя се амплитудата | Изменя се честотата | Изменя се фазата |\n|---|---|---|---|\n| **Аналогова** | **AM** | **FM** | **PM** |\n| **Цифрова (манипулация)** | **ASK** (Amplitude Shift Keying) | **FSK** (Frequency Shift Keying) | **PSK** (Phase Shift Keying) |\n- Когато модулиращият сигнал е **импулсен (цифров)**, модулацията се нарича **манипулация**.\n\n### Амплитудна аналогова модулация (AM)\n- Изменя се **амплитудата** на високочестотното трептене в съответствие с модулиращия сигнал.\n- **Слабо или почти никакво приложение** в съвременните комуникации.\n- Основен параметър — **дълбочина на AM, m = (Amax − Amin) / (Amax + Amin)**:\n| m | Режим |\n|---|---|\n| **m ≪ 1** | слаба AM |\n| **m ≈ 1** | дълбока AM |\n| **m > 1** | **премодулация** |\n| **m ≈ 0,5** | **оптимална стойност** |\n- Пример: Amax = 6 V, Amin = 2 V → m = 4/8 = **0,5**; Amax = 10, Amin = 0 → m = **1**.\n- **Предимство:** **най-тясната възможна честотна лента** на модулирания сигнал (ако m < 1).\n- **Недостатък:** **най-слабо защитеният** вид модулация — податлива на всякакъв вид смущения.\n\n### Честотна аналогова модулация (FM)\n- Изменя се **честотата** на високочестотното трептене според модулиращия сигнал.\n- **Сериозно приложение** в аналоговите комуникации: **качествено радио и TV разпръскване**, мобилните **1G мрежи с FDMA** достъп до канала.\n- **Дълбочина на FM m = Δfp / fm** — отношение на **честотната девиация Δfp** (в **УКВ — 75 kHz**) към fm (по слайда — „разстоянието между отделните носещи честоти\"). Напр. 75 kHz / 15 kHz = **5**.\n- m зависи от **динамичния обхват на baseband сигнала**; от него се определя и **честотната лента на FM сигнала**.\n\n### Фазова аналогова модулация (PM)\n- **Началната фаза** се изменя в такт с модулиращия нискочестотен сигнал.\n- Използва се в **цветната телевизия** за кодиране на **основните цветове** — изместени са на **33°** спрямо основния сигнал.\n- **Δφ = kфм · aм** — максималното изменение на фазовия ъгъл Δφ се определя от **коефициента на пропорционалност kфм** между модулиращия сигнал (aм) и фазовия ъгъл.\n\n### Импулсни модулации\n- Когато **носещият** сигнал е **периодична поредица от правоъгълни импулси** → **импулсна** модулация.\n- Параметри на импулса: **амплитуда A₀**, **период на повторение T**, **продължителност τ**.\n- Видове: **амплитудно-импулсна (PAM)** — изменя се височината на импулсите; **широчинно-импулсна (PWM)** — изменя се ширината; **фазово-импулсна**; и др.\n\n### Импулсно-кодова модулация (PCM)\n- **PCM (Pulse Code Modulation)** — начин за преобразуване на **аналогов сигнал в цифров** (обикновено **двоичен код**) в **две стъпки**:\n  1. **Дискретизация** на нивата чрез **равномерни отчети (sampling)**;\n  2. **Квантоване** на нивата към серия от символи (по **линеен или логаритмичен** закон).\n\n### Цифрови модулации (манипулации)\n- Методи за преобразуване на **цифровия нискочестотен** сигнал във **високочестотен аналогов модулиран** сигнал чрез **стъпално изменение (SK, Shift Keying)** на амплитудата (ASK), честотата (FSK) или фазата (PSK) на носещия сигнал. На диаграмата — още **DPSK** и **ASK (on/off)**.\n- **Най-използваните** модулации в съвременните комуникации; търси се **максимум пренесени битове за 1 Hz**.\n- Изискват **по-широка честотна лента** → прилага се **филтриране** за стесняване на спектъра, което води до **паразитна AM модулация** и **междусимволна интерференция**.\n\n| | ASK | FSK | PSK |\n|---|---|---|---|\n| Изменя | амплитудата | честотата (f1 < f2 за 0 и 1) | фазата (180° в най-простия случай) |\n| Постоянни | — | **амплитудата** | **амплитудата и честотата** |\n| Употреба | **най-простата**, но **не се използва самостоятелно**; в чист вид само в **оптични пръстени (OOK — On/Off Keying)**; най-често се **комбинира с фазова** | **значително по-често от ASK** | **най-използваната** в съвременните и бъдещите комуникации |\n| Проблем | дълги редици „0\" не се различават от **изключен предавател** или **силно затихване** | **бързото превключване** между двете честоти; има техники за намаляване на лентата | — |\n\n### Видове PSK\n- **BPSK (Binary PSK)** — най-простата; „0\" и „1\" — **две фазови състояния на 180°**; **1 бит/символ**.\n- **QPSK (Quadrature PSK)** — битовете се предават **по двойки (00, 01, 10, 11)** с **4 фазови състояния на 90°** → **двойно намаляване на скоростта на манипулирания сигнал** и на необходимата честотна лента. Напр. 2000 bps → 1000 символа/s.\n- **OQPSK (Offset QPSK)** — за да се избегнат нежелани **скокове на 180°** (напр. при група битове **0010**), които пораждат **паразитна AM**, се използва **отместване на четните и нечетните битове на 45°** (на диаграмата е означена като **π/4 QPSK**).\n\n### Модулация с много носещи честоти\n- Потокът битове се **разделя на подпотоци**, „носени\" от **много подносещи**.\n- **Битовата скорост** и **честотната лента** на всеки подканал са **много по-ниски/тесни** от общите.\n- Броят подносещи се избира така, че в подканала **междусимволната интерференция е силно подтисната** (**защитен интервал**).\n- Много по-ефективно използване на спектъра — с **„ортогонални\" подносещи**: спектрите им **се припокриват**, но поради ортогоналността си влияят минимално.\n- Броят подносещи трябва да е **голям** — напр. **WiMax: от 512 до 2048** канала.\n\n### OFDM — ортогонална модулация\n- **OFDM (Orthogonal Frequency Division Multiplexing)** — **най-простият тип многочестотна модулация**; **най-често използвана в съвременните безжични комуникации**.\n- При **правоъгълни** сигнали подносещите **не трябва да се застъпват**; при **½ части от косинусоидални** сигнали **могат да се застъпват** — **максимумът на спектъра на дадена подносеща съвпада с нулите** от спектъра на съседните.\n\n### Капани за изпита\n- **Модулиращ** = информационният (нискочестотен) сигнал; **носещ** = високочестотният; **модулиран (passband)** = резултатът.\n- **Манипулация** = цифрова модулация (ASK/FSK/PSK) — модулиращият сигнал е импулсен. **Импулсна** модулация (PAM/PWM) — **носещият** сигнал е поредица импулси. Да не се бъркат!\n- **AM**: най-тясна лента, но най-слабо защитена; m > 1 = **премодулация**; оптимално **m ≈ 0,5**.\n- **FM**: УКВ девиация **75 kHz**; използва се в **1G (FDMA)**, радио и TV.\n- **PM**: цветна телевизия, **33°**; Δφ = kфм·aм.\n- **PCM**: **дискретизация → квантоване** (две стъпки); квантоване по линеен или **логаритмичен** закон.\n- **ASK** в чист вид — само **OOK в оптични пръстени**; **FSK** — амплитудата постоянна; **PSK** — амплитудата **и** честотата постоянни; **PSK е най-използваната**, **ASK — най-простата**.\n- **BPSK — 180°, 2 състояния; QPSK — 90°, 4 състояния, по 2 бита**.\n- Филтрирането на цифровите модулации води до **паразитна AM** и **междусимволна интерференция**.\n- Baseband сигналите — нискочестотни, **силно затихват**, огромни антени (дължина на вълната — **стотици метри**); при **много високи** честоти трябва **пряка видимост**.\n- **WiMax**: **512–2048** подносещи. **OFDM** — **най-простият** многочестотен тип, ортогонални подносещи **се застъпват**.\n- f = 1/T — честотата е **обратно** пропорционална на периода.\n- **Неточности в слайдовете:** OFDM е разписано като „Orthogonal Frequency Division Multiplexing **Access**\" — това смесва OFDM с **OFDMA** (правилно: Orthogonal Frequency Division Multiplexing); описанието на OQPSK като „отместване на 45°\" всъщност съответства на **π/4-QPSK** (класическата OQPSK отмества I и Q с половин символен период) — за изпита помни формулировката от слайда; при FM fm по стандарт е **честотата на модулиращия сигнал**, а слайдът я описва като „разстоянието между отделните носещи честоти\"; „косинусоудални\" → косинусоидални; в текстовата версия „330\" е всъщност **33°**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L03-A-1","n":1,"text":"Как е определен **сигналът** в лекцията за модулация?","opts":["Високочестотно трептене с постоянни параметри","Съвкупност от знаци, съдържаща информация","Нелинейно смесване на baseband и носеща честота","Физически процес, служещ за пренос на информация"],"correct":3,"expl":"Сигналът е физически процес за пренос на информация — електрически, звукови, светлинни, магнитни."},{"id":"L03-A-2","n":2,"text":"Какво представлява **модулацията**?","opts":["Разбиване на аналоговия сигнал по време и по стойност за получаване на цифров сигнал","Пренасяне на спектъра на информационния сигнал във високочестотната област","Отделяне на полезния информационен сигнал от шума и смущенията в приемника","Разделяне на потока битове на подпотоци, всеки от които се предава по отделен кабел"],"correct":1,"expl":"Носещият ВЧ сигнал се изменя под действието на модулиращия (информационния) сигнал."},{"id":"L03-A-3","n":3,"text":"Каква е дълбочината на AM при **Amax = 6 V** и **Amin = 2 V**?","opts":["0,33","2","0,5","1"],"correct":2,"expl":"m = (6 − 2) / (6 + 2) = 0,5 — оптималната стойност."},{"id":"L03-A-4","n":4,"text":"Кое е **основното предимство** на амплитудната аналогова модулация?","opts":["Най-тясната възможна честотна лента (при m < 1)","Най-добрата защита от всякакъв вид смущения в канала","Най-ефективното използване на спектъра — максимум битове за 1 Hz","Постоянна амплитуда на модулирания високочестотен сигнал"],"correct":0,"expl":"AM има най-тясната лента, но е най-слабо защитена от смущения."},{"id":"L03-A-5","n":5,"text":"Къде се използва **FM** модулацията?","opts":["В оптичните комуникационни пръстени като OOK","В цветната телевизия за кодиране на основните цветове","За радио и TV разпръскване и в мобилните 1G мрежи","В стандарта WiMax с 512 до 2048 ортогонални подносещи"],"correct":2,"expl":"FM — радио, TV и 1G (FDMA); PM — цветна TV; OOK — оптични пръстени."},{"id":"L03-A-6","n":6,"text":"Кои са двете стъпки на **импулсно-кодовата модулация (PCM)**?","opts":["Дискретизация и квантоване на нивата","Квантоване на нивата и филтриране на спектъра на сигнала","Модулация по амплитуда и модулация по фаза","Кодиране в двоичен код и манипулация на честотата"],"correct":0,"expl":"PCM: sampling (дискретизация) → квантоване по линеен или логаритмичен закон."},{"id":"L03-A-7","n":7,"text":"Защо **ASK** има проблем при предаване на дълги редици от битове „0“?","opts":["Честотата трябва бързо да се превключва между f1 и f2","Не се различава от изключен предавател или силно затихване","Получават се нежелани скокове на фазата на 180°","Амплитудата на сигнала остава постоянна през цялото време"],"correct":1,"expl":"При ASK нулата е липса/ниска амплитуда — неразличима от изключен предавател."},{"id":"L03-A-8","n":8,"text":"Колко фазови състояния и през какъв ъгъл използва **QPSK**?","opts":["2 състояния през 180°","4 състояния през 45°","8 състояния през 90°","4 състояния през 90°"],"correct":3,"expl":"QPSK — двойки битове (00, 01, 10, 11), 4 фази през 90°; BPSK — 2 фази през 180°."},{"id":"L03-A-9","n":9,"text":"Колко подносещи може да има според лекцията модулацията в стандарта **WiMax**?","opts":["От 2 до 4","От 64 до 256","От 512 до 2048","От 4096 до 8192"],"correct":2,"expl":"За ефективна модулация броят подносещи трябва да е голям — WiMax: 512 до 2048."},{"id":"L03-A-10","n":10,"text":"Кой от изброените сигнали **НЕ** е хармоничен?","opts":["Поредица от правоъгълни импулси","Синусоидален сигнал","Косинусоидален сигнал","Синусоида с отместена фаза"],"correct":0,"expl":"Хармоничен е сигнал, изменящ се по синусоидален или косинусоидален закон."}],"B":[{"id":"L03-B-1","n":1,"text":"Синусоидата е пример за сигнал, който е:","opts":["непрекъснат, хармоничен и периодичен","дискретен, хармоничен и непериодичен","непрекъснат, нехармоничен и периодичен","дискретен, нехармоничен и периодичен"],"correct":0,"expl":"Синусоидата е основният непрекъснат хармоничен и периодичен сигнал."},{"id":"L03-B-2","n":2,"text":"Сигнал има период **T = 1 ms**. Каква е честотата му?","opts":["1 Hz","1 MHz","1 kHz","100 Hz"],"correct":2,"expl":"f = 1/T = 1/0,001 s = 1000 Hz."},{"id":"L03-B-3","n":3,"text":"Кое **НЕ** е характерно за информационните сигнали в **основна лента (baseband)**?","opts":["Нискочестотни са и се предават в основна лента","Разпространяват се с малки загуби по въздуха","Силно се влияят от нискочестотния шум","Имат не много висока амплитуда на сигнала"],"correct":1,"expl":"Baseband сигналите силно затихват — предават се по кабел или на много къси разстояния безжично."},{"id":"L03-B-4","n":4,"text":"Как се получава **модулираният сигнал (Passband)**?","opts":["При линейното сумиране на няколко baseband сигнала в обща лента","При дискретизация и квантоване на носещия сигнал","При филтриране на шума от сигнала в основна лента с нискочестотен филтър","При нелинейното смесване на сигнала в основна лента с носещ сигнал"],"correct":3,"expl":"Passband = нелинейно смесване на baseband с носещия сигнал."},{"id":"L03-B-5","n":5,"text":"Как се нарича режимът на AM при **m > 1**?","opts":["Дълбока AM","Слаба AM","Оптимална AM","Премодулация"],"correct":3,"expl":"m ≪ 1 pts":["С две фазови състояния, отместени на 180°","С наличие или липса на сигнал","С две честотни състояния на сигнала f1 < f2","С четири фазови състояния през 90°"],"correct":2,"expl":"FSK — две честоти, амплитудата е постоянна; проблем — бързото превключване."},{"id":"L03-E-7","n":7,"text":"Коя цифрова модулация е **най-простата**, но не се използва самостоятелно в модерните комуникации?","opts":["FSK","PSK","QPSK","ASK"],"correct":3,"expl":"ASK е най-простият метод; най-често се комбинира с фазова модулация."},{"id":"L03-E-8","n":8,"text":"Поток от 2000 bps се предава с **QPSK**. Колко символа (фазови изменения) в секунда са нужни?","opts":["2000","1000","500","4000"],"correct":1,"expl":"QPSK предава по 2 бита на символ → двойно намаляване на скоростта на манипулирания сигнал."},{"id":"L03-E-9","n":9,"text":"Какво е характерно за подканалите при модулация **с много носещи честоти**?","opts":["Скоростта и лентата на всеки подканал са много по-ниски от общите","Всеки подканал има същата битова скорост като общия поток","Подканалите използват различни видове модулация — AM и FM","Подканалите не се нуждаят от защитен интервал помежду си"],"correct":0,"expl":"Потокът се разделя на подпотоци с ниска скорост и тясна лента; има защитен интервал срещу междусимволна интерференция."},{"id":"L03-E-10","n":10,"text":"При какво условие подносещите в OFDM **могат да се застъпват**?","opts":["Когато се използват правоъгълни сигнали без защитен интервал между тях","Когато броят подносещи е по-малък от 512","Когато се използват ½ части от косинусоидални сигнали","Когато всички подносещи имат еднаква фаза и амплитуда"],"correct":2,"expl":"Правоъгълните сигнали не трябва да се застъпват; косинусоидалните (½ части) могат."}]}},{"num":4,"title":"Лекция 4 — Кодиране на информацията. Кодове на Шенон–Фано и Хафмън. Шумоустойчиво кодиране. Циклични кодове","short":"Кодиране на информацията. Кодове на Шенон–Фано и Хафмън. Шумоустойчиво кодиране. Циклични кодове","summary":"### Кодиране на информацията — същност\n- Обща схема на комуникационната система: **компютър → кодер → модулатор → (предавател) → канал (смущения) → (приемник) демодулатор → декодер → компютър**. На входа на канала има **сигнал**, на изхода — **сигнал и шум**.\n- **Кодиране на информацията** — процес на **преобразуване на съобщенията в сигнали**.\n- **Код** — **алгоритъмът**, по който съобщенията се превръщат в комбинация от различни сигнали; система за **пълно и точно съответствие** между съобщенията и сигналите.\n\n### Предназначение на кодирането\n- **Повишаване на верността** чрез **откриване и коригиране на грешки** в отделни разреди на предаваната информация. Грешките се дължат на:\n  - **затихване на сигнала**;\n  - **завишаване на нивото на шума** спрямо сигнала.\n- Грешките имат **случаен характер** и се измерват с **вероятност**: q = P(1/0) и q = P(0/1) — вероятността изпратеният символ да бъде интерпретиран в получателя като противоположния.\n\n### Възникване на грешки и „решение без кодиране\"\n- Благодарение на микроелектрониката вероятността за грешка в каналите на компютърните мрежи **за по-малко от 10 години** е спаднала **от 1·10⁻¹ до 1·10⁻²⁴**.\n- При толкова малка вероятност **се обезсмисля** кодирането със **сложни кодове за откриване и коригиране** на грешки.\n- В стандартите за компютърни комуникации се използват **циклични кодове само за откриване** на грешки; **коригиране в канала не се прилага**:\n  - некоректните фрагменти се **унищожават**;\n  - приемникът връща **отрицателна квитанция** = заявка за **повторно предаване** на изкривените фрагменти;\n  - броят повторения е **ограничен**; след това каналът се счита за **загубил способността си** да предава данни.\n\n### Теория на кодирането\n- **Раздел от теорията на информацията**, изучаващ кодовете, представени като **думи от символи на дадена азбука**.\n- Цел: предаване по канала при зададени изисквания и избор на най-добрите варианти по **скорост, шумозащитеност** и др.\n\n### Термини\n- **Код** — набор
