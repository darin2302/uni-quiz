z, 25/40 Gbps, 30 m, 2 конектора в канала."},{"id":"L09-A-5","n":5,"text":"Кои пинове се разменят в crossover кабела?","opts":["1 ↔ 2 и 3 ↔ 6","1 ↔ 3 и 2 ↔ 6","1 ↔ 8 и 2 ↔ 7","4 ↔ 5 и 7 ↔ 8"],"correct":1,"expl":"Crossover: двойки 1 и 3 / 2 и 6 — Transmit се свързва с Receive."},{"id":"L09-A-6","n":6,"text":"Кой елемент на оптичния кабел служи за механично укрепване (strengthening material)?","opts":["Core (сърцевината)","Cladding (обвивката на сърцевината)","Aramid yarn (арамидните нишки)","Buffer (буферното покритие)"],"correct":2,"expl":"Strengthening Material е Aramid yarn; core — сърцевина, cladding — обвивка на сърцевината."},{"id":"L09-A-7","n":7,"text":"Кое е предимство на безжичната среда?","opts":["Няма разходи за инсталация и хостовете са свободни да се местят","Няма интерференция от микровълнови печки и безжични телефони","Сигналът не се влияе от материалите, от които е изградена сградата","Сигурността не е проблем, защото сигналът не може да се прихване"],"correct":0,"expl":"Предимства: без разходи за инсталация, мобилни хостове; проблеми: интерференция, материали, сигурност."},{"id":"L09-A-8","n":8,"text":"Какъв е основният проблем на NRZ кодирането?","opts":["Дълги поредици от 1-ци или 0-ли разсинхронизират предавателя и приемника","Не може да предава логическа 0 без допълнително кодиране 4B/5B","Изисква три нива на напрежение (+V, 0 и −V) и смяна на нивото при всяка 1","Добавя по един излишен бит към всеки 4-битов блок от данни"],"correct":0,"expl":"При NRZ дълги поредици без преходи разсинхронизират timing-а."},{"id":"L09-A-9","n":9,"text":"Кое НЕ е предимство на 4B/5B кодирането?","opts":["Осигурява достатъчно преходи за контрол на timing-а","Намалява броя на предаваните битове","Позволява разпознаване на невалидни кодове","Контролните кодове не могат да се объркат с данни"],"correct":1,"expl":"4B/5B добавя излишни битове (4 → 5), но дава контролни кодове, преходи, баланс и откриване на грешки."},{"id":"L09-A-10","n":10,"text":"Какво прави **повторителят (repeater)**?","opts":["Преобразува сигнала от една преносна среда в друга, например от мед към оптика","Възстановява затихналите и изкривени сигнали и ги предава регенерирани на други сегменти","Разделя мрежата на логически подмрежи и маршрутизира пакетите между тях","Филтрира кадрите по физически адреси и ги препраща само към нужния сегмент"],"correct":1,"expl":"Повторителят регенерира сигнала и преодолява ограничението на максималната дължина на сегмента; смяната на средата е работа на конвертора."}],"B":[{"id":"L09-B-1","n":1,"text":"Кое от изброените **НЕ може** да прави физическият слой?","opts":["Да кодира битовете като сигнал в преносната среда","Да предава сигнали, които носят контролна информация","Да идентифицира устройствата в сегмента","Да определя механичните характеристики на конекторите"],"correct":2,"expl":"Физическият слой не може да идентифицира устройствата и не комуникира с горните слоеве."},{"id":"L09-B-2","n":2,"text":"Кой стандарт използва **150 Ohm STP** кабел с конектор **mini-DB-9** до 25 m?","opts":["1000BASE-CX","1000BASE-SX","1000BASE-T","10BASE5"],"correct":0,"expl":"1000BASE-CX — 150 Ohm STP, mini-DB-9, 25 m."},{"id":"L09-B-3","n":3,"text":"За какво се използва днес коаксиалният кабел според лекцията?","opts":["За конзолна връзка към маршрутизатор","За съвременни Ethernet LAN мрежи със скорост 10 Gbps","За кабелна TV и Интернет в комбинация с оптичен кабел","За хоризонтално окабеляване в сгради и офиси"],"correct":2,"expl":"Коаксиалът е за антени, радио/видео, кабелна TV и Интернет; в Ethernet LAN — преди повече от 20 години."},{"id":"L09-B-4","n":4,"text":"Коя категория според таблицата е само екранирана, работи на **600 MHz** и използва конектор, различен от RJ45?","opts":["Cat 8","Cat 6A","Cat 7","Cat 6"],"correct":2,"expl":"Cat 7 — 600 MHz, 10 Gbps, shielded, Non-RJ45."},{"id":"L09-B-5","n":5,"text":"Мрежов администратор трябва да конфигурира нов комутатор от серийния порт на лаптопа си. Какъв кабел му трябва?","opts":["Прав","Rollover","Crossover","STP с RJ45 в двата края"],"correct":1,"expl":"Rollover (1–8 срещу 8–1) е само за конзолна връзка за управление на router/switch."},{"id":"L09-B-6","n":6,"text":"Какъв е диаметърът на сърцевината на **single mode** оптичния кабел?","opts":["100–125 µm","8–10 µm","50–60 µm","1–2 µm"],"correct":1,"expl":"SM — 8–10 µm; MM — 50–60 µm (по слайда)."},{"id":"L09-B-7","n":7,"text":"Какъв метод за достъп използва **IEEE 802.11 (Wi-Fi)**?","opts":["CSMA/CA","Token passing","MLT-3","CSMA/CD"],"correct":0,"expl":"802.11 Wi-Fi използва CSMA/CA."},{"id":"L09-B-8","n":8,"text":"Кое е вярно за **Manchester** кодирането?","opts":["Напрежението се сменя в средата на всеки бит: падащ фронт = 1, нарастващ = 0","Използват се три нива на напрежение: +V, 0 и −V","Всяка 1 се представя с преход, а 0 — с отсъствие на преход","Напрежението се сменя в средата на всеки бит: падащ фронт = 0, нарастващ = 1"],"correct":3,"expl":"Manchester: преход в средата на бита, падащият фронт е 0, нарастващият — 1."},{"id":"L09-B-9","n":9,"text":"Как работи кодирането **MLT-3**?","opts":["Заменя всеки 4 бита с 5-битов код с достатъчно преходи","Използва две нива; 1 е високо, 0 е ниско","Сменя напрежението в средата на всеки бит, независимо от стойността","Използва нива +V, 0, −V; при 1 нивото се сменя, при 0 — не"],"correct":3,"expl":"MLT-3 има три нива; 1 — промяна в нивото, 0 — без промяна."},{"id":"L09-B-10","n":10,"text":"Кое е вярно за **концентратора (hub)**?","opts":["Няколко устройства могат да изпращат едновременно","Физическата топология е звезда, а логическата — обща шина","Всеки порт има собствен, неподелен bandwidth","Физическата топология е обща шина, а логическата — звезда"],"correct":1,"expl":"Hub = multiport repeater: споделен bandwidth, само едно устройство изпраща, физически звезда, логически шина."}],"C":[{"id":"L09-C-1","n":1,"text":"Коя организация създава стандартите на горните слоеве, които са имплементирани в софтуера?","opts":["IEEE","ITU-T","IETF","EIA/TIA"],"correct":2,"expl":"Горните слоеве — софтуер, IETF; физическият слой — хардуер, ISO, EIA/TIA, ITU-T, ANSI, IEEE."},{"id":"L09-C-2","n":2,"text":"„Дебел“ и „тънък“ са разновидности на кой вид кабел?","opts":["Single mode оптичен","Multimode оптичен","Коаксиален","Усукана двойка"],"correct":2,"expl":"Коаксиалният бива дебел и тънък; усуканата двойка — екранирана и неекранирана."},{"id":"L09-C-3","n":3,"text":"Кой от изброените **НЕ** е конектор за коаксиален кабел?","opts":["N type","BNC","F type","LC"],"correct":3,"expl":"За коаксиален кабел са BNC, N type и F type; LC е оптичен конектор."},{"id":"L09-C-4","n":4,"text":"За какво служи RJ45 конекторът тип **punch down**?","opts":["За розетка","За patch кабел","За оптичен кабел","За конзолен кабел"],"correct":0,"expl":"RJ45 конектори има за patch кабели, за розетка (punch down) и за панел (patch panel)."},{"id":"L09-C-5","n":5,"text":"Коя е най-ниската категория UTP, която може да се използва за **Gigabit Ethernet**?","opts":["Cat 3","Cat 5e","Cat 5","Cat 6A"],"correct":1,"expl":"Cat 5e, 6, 7, 8 могат за Gigabit Ethernet; Cat 5 е за 100 Mbps."},{"id":"L09-C-6","n":6,"text":"До какво разстояние предава **single mode** оптичният кабел според лекцията?","opts":["До 550 m","До 10 km","До 2 km","До 100 km"],"correct":3,"expl":"SM — лазер, един лъч, до 100 km; MM — до 2 km."},{"id":"L09-C-7","n":7,"text":"Кой стандарт обхваща **Bluetooth, ZigBee и 6LoWPAN** за малки разстояния (под 250 m)?","opts":["IEEE 802.11","IEEE 802.15","IEEE 802.3","IEEE 802.16"],"correct":1,"expl":"802.15 — Bluetooth, ZigBee, 6LoWPAN; 802.16 — WiMAX; 802.11 — Wi-Fi."},{"id":"L09-C-8","n":8,"text":"Кое кодиране използва **10 Mbps Ethernet**?","opts":["NRZ","4B/5B + MLT-3","Manchester","4B/5B + NRZI"],"correct":2,"expl":"10 Mbps Ethernet използва Manchester encoding."},{"id":"L09-C-9","n":9,"text":"Какво кодиране използва **100BaseFX** Ethernet по multimode оптичен кабел?","opts":["Manchester","NRZ без допълнително кодиране","4B/5B, след това MLT-3","4B/5B, след това NRZI"],"correct":3,"expl":"100BaseFX: 4B/5B + NRZI (LED свети/не свети); 100 Mbps по UTP: 4B/5B + MLT-3."},{"id":"L09-C-10","n":10,"text":"Устройство свързва сегмент с оптичен кабел към сегмент с усукана двойка. Как се нарича?","opts":["Конвертор (media converter)","Patch панел","Повторител (repeater)","Концентратор (hub)"],"correct":0,"expl":"Конверторът преобразува сигналите между сегменти с различна преносна среда."}],"D":[{"id":"L09-D-1","n":1,"text":"Какво е **сигнализация (signalling)**?","opts":["Групиране на битовете по 4 и замяната им с 5-битов код","Възстановяване на затихнали сигнали","Преобразуване на битовете в сигнали","Разделяне на съобщението на сегменти"],"correct":2,"expl":"Сигнализацията е преобразуване на битовете в сигнали."},{"id":"L09-D-2","n":2,"text":"Шумът от флуоресцентни осветители и електрически мотори е пример за:","opts":["Дисперсия","Crosstalk","Радиочестотна интерференция (RFI)","Електромагнитна интерференция (EMI)"],"correct":3,"expl":"EMI — например от флуоресцентни осветители и електрически мотори."},{"id":"L09-D-3","n":3,"text":"От колко жици и двойки се състои кабелът с усукани двойки?","opts":["8 жици в 4 двойки","8 жици в 2 двойки","4 жици в 2 двойки","6 жици в 3 двойки"],"correct":0,"expl":"Кабелът има 8 жици, усукани в 4 двойки, цветово кодирани."},{"id":"L09-D-4","n":4,"text":"Какъв кабел се използва за връзка **router – switch**?","opts":["Crossover","Rollover","Коаксиален","Прав"],"correct":3,"expl":"Прав кабел: PC–switch, PC–hub, router–switch, router–hub."},{"id":"L09-D-5","n":5,"text":"Кое твърдение за **STP** е вярно?","opts":["Не съдържа усукани двойки, а един централен проводник","По-скъпа е от UTP и може да се ползва в 10 Gbps Ethernet","Предава със светлинни импулси и не се влияе от EMI","По-евтина е от UTP и се ползва само за глас"],"correct":1,"expl":"STP — защитени жици, по-скъпа от UTP, за 10 Gbps Ethernet."},{"id":"L09-D-6","n":6,"text":"Какъв източник на светлина използва **multimode** оптичният кабел?","opts":["Лазер, който дава точно един лъч","LED, който дава няколко лъча с различни ъгли","Лазер, който дава няколко лъча под еднакъв ъгъл","Фотодиод, който дава един лъч"],"correct":1,"expl":"MM — LED с няколко лъча; SM — лазер с точно един лъч."},{"id":"L09-D-7","n":7,"text":"Кое твърдение е вярно при сравнението UTP – оптичен кабел?","opts":["UTP е по-подходящ за high capacity link от оптичния","UTP може да се полага и извън сгради на повече от 100 m","UTP е по-евтин и по-лесен за инсталиране, но се влияе от EMI/RFI","Оптичният кабел е по-евтин и по-лесен за инсталиране"],"correct":2,"expl":"UTP: до 100 m, само в сгради, по-евтин, по-лесна инсталация, влияе се от шум; оптиката е по-добра за high capacity link."},{"id":"L09-D-8","n":8,"text":"Как се представят 1 и 0 при **NRZI**?","opts":["1 — с преход, 0 — с отсъствие на преход","1 — с падащ фронт, 0 — с нарастващ фронт","1 — с отсъствие на преход, 0 — с преход","1 — с високо напрежение, 0 — с ниско"],"correct":0,"expl":"NRZI: всяка 1 е преход, 0 — няма преход."},{"id":"L09-D-9","n":9,"text":"Кой стандарт на IEEE се отнася за 10 Gigabit Ethernet по **оптичен** кабел?","opts":["802.3ak","802.11","802.3an","802.3ae"],"correct":3,"expl":"802.3ae — оптика; 802.3an — усукана двойка; 802.3ak — Twinax."},{"id":"L09-D-10","n":10,"text":"Как Gigabit Ethernet използва UTP кабела?","opts":["Сложно кодиране и сложна схема за сигнал по всички 4 двойки","Manchester кодиране и прост сигнал само по 1 двойка","4B/5B кодиране и MLT-3 сигнализация по 2 от двойките","4B/5B кодиране и NRZI сигнализация по 2 от двойките"],"correct":0,"expl":"Gigabit Ethernet по UTP използва всички 4 двойки."}],"E":[{"id":"L09-E-1","n":1,"text":"Какво е характерно за предаването при **по-високи** скорости?","opts":["Използва се само сигнализация, без отделна стъпка на кодиране","Използва се само безжична среда за предаване","Първо има стъпка на кодиране, а след това — стъпка на сигнализация","Битът се преобразува директно в сигнал, без кодиране"],"correct":2,"expl":"При много ниски скорости битът става директно сигнал; при по-високи — кодиране, после сигнализация."},{"id":"L09-E-2","n":2,"text":"Как се нарича смущението между жиците в един кабел или между близко разположени кабели?","opts":["Crosstalk","RFI","EMI","Затихване"],"correct":0,"expl":"Crosstalk е между жиците в един кабел или между съседни кабели."},{"id":"L09-E-3","n":3,"text":"За какво е предназначен кабелът **Cat 3**?","opts":["За 10 Gbps Ethernet на разстояние до 100 m","За предаване на данни с 1000 Mbps","За предаване на глас — телефонни линии","За предаване на данни със 100 Mbps"],"correct":2,"expl":"Cat 3 — глас; Cat 5 — 100 Mbps; Cat 5e — 1000 Mbps."},{"id":"L09-E-4","n":4,"text":"Какъв кабел се използва за директна връзка **PC – router**?","opts":["Rollover","Crossover","Прав","Конзолен с DB9"],"correct":1,"expl":"PC–router е между „едноименни“ устройства — crossover; PC–switch е прав."},{"id":"L09-E-5","n":5,"text":"Кое НЕ е характеристика на оптичния кабел?","opts":["Податлив е на RFI/EMI шум","Съдържа няколко оптични влакна в един кабел","Работи в режим full duplex","Предава със светлинни импулси"],"correct":0,"expl":"Оптичният кабел няма проблеми с RFI/EMI шум."},{"id":"L09-E-6","n":6,"text":"Как се разшифрова оптичният конектор **SC**?","opts":["Standard coupler","Straight connector","Single-mode connector","Subscriber connector"],"correct":3,"expl":"SC — Subscriber connector; ST — Straight tip; LC — lucent connector."},{"id":"L09-E-7","n":7,"text":"Кой вид кодиране представя **1 с високо**, а **0 с ниско** напрежение, без връщане към 0 в рамките на бита?","opts":["Manchester","NRZI","NRZ","MLT-3"],"correct":2,"expl":"NRZ — 1 е високоволтовото, 0 — нисковолтовото състояние."},{"id":"L09-E-8","n":8,"text":"Как се кодира 4-битовата група **0011** при 4B/5B?","opts":["01001","10101","11111","11110"],"correct":1,"expl":"0011 → 10101; 0000 → 11110; 0001 → 01001; 11111 е Idle."},{"id":"L09-E-9","n":9,"text":"Каква е максималната дължина при **10GBASE-ER** (1550 nm, singlemode)?","opts":["100 m","10 km","300 m","40 km"],"correct":3,"expl":"10GBASE-ER — 1550 nm, SM, 40 km; 10GBASE-LR — 1310 nm, 10 km."},{"id":"L09-E-10","n":10,"text":"Какъв кабел и каква максимална дължина са посочени за **10GBASE-T**?","opts":["Усукана двойка Cat 6a/7, до 100 m","Twinax, до 15 m","Singlemode оптика, до 10 km","Усукана двойка Cat 5e, до 30 m"],"correct":0,"expl":"10GBASE-T — copper twisted pair, Cat 6a/7, 100 m (стандарт 802.3an)."}]}},{"num":10,"title":"Лекция 10 — Data Link слой. Подслоеве LLC и MAC","short":"Data Link слой. Подслоеве LLC и MAC","summary":"### Data Link (канален) слой — предназначение\n- Каналният слой (слой за пренос на данни, **слой 2** на OSI) използва **физически адреси (MAC)**, за да идентифицира устройствата.\n- Отговаря за **доставката на кадъра (фрейма) от мрежовата карта (NIC) на източника до мрежовата карта (NIC) на получателя в същия сегмент**.\n- Определя **механизмите за достъп до преносната среда** чрез **MAC подслоя**, а се **свързва с горните слоеве чрез LLC подслоя**.\n- Определя как данните от горния слой се **енкапсулират във фреймове** за предаване.\n- **Получава от физическия слой битове**, които организира в групи — **фреймове (кадри)**.\n- Фреймът съдържа **както данни, така и управляваща информация**.\n- Каналният слой проверява: **дали данните са с верни флагове** и **дали има грешки във фрейма**.\n- Схема на слоя: отгоре **LLC Sublayer**, отдолу **MAC Sublayer**; стандартите **802.3 Ethernet**, **802.11 Wi-Fi**, **802.15 Bluetooth** обхващат MAC подслоя и физическия слой.\n\n### Подслоеве MAC и LLC\n| Подслой | Отговаря за |\n|---|---|\n| **MAC** (Media Access Control) | **Енкапсулация на данните**: ограничение (разграничаване) на фрейма, адресиране, корекция (откриване) на грешки. **Media Access Control**: контрол на разполагането на фрейма в преносната среда; възстановяване на преносната среда след предаване на фрейм |\n| **LLC** (Logical Link Control; на слайда „Logic Link Control“) | **Връзка с горните слоеве**; **идентифицира кой е мрежовият протокол**; **осигурява независимост от физическото оборудване** |\n\n- Запомни: MAC е „долният“ подслой (достъп до средата, адресиране, фрейм), LLC е „горният“ (към мрежовия слой).\n\n### Стандарти за Data Link слоя\n- **Ethernet**, **Token Ring**, **HDLC** (High-level Data Link Control), **PPP** (Point-to-Point Protocol), **IEEE 802.11**, **PAP**, **CHAP** и др.\n\n### Ethernet фрейм (IEEE 802.3)\nФреймът = **Frame header** + **Packet (Data)** + **Trailer**.\n\n| Поле | Размер |\n|---|---|\n| **Preamble** (преамбюл) | **7 B** |\n| **Start of Frame Delimiter (SFD)** | **1 B** |\n| **Destination address** | **6 B** |\n| **Source address** | **6 B** |\n| **Length/Type** | **2 B** |\n| **Packet Data** (при 802.3: „802.2 Header and Data“) | **46–1500 B** |\n| **Frame Check Sequence (FCS)** — трейлър | **4 B** |\n\n- Header = Preamble … Length/Type; **Trailer = FCS**.\n- Извод от таблицата: от Destination до FCS фреймът е мин. 6+6+2+46+4 = **64 B**, макс. **1518 B**.\n- **Сравнение 802.3 и Ethernet (II)** (слайд „Ethernet фреймове“): при **IEEE 802.3** — Preamble **7** + SFD **1**, поле **Length/Type**, данни „802.2 Header and Data“ 46–1500; при **Ethernet** — **Preamble 8 B** (без отделно SFD), поле **Type** 2 B, **Data 46–1500**, FCS **4 B**. Адресите и в двата са по **6 B**.\n\n### HDLC фрейм\n- **HDLC (High-level Data Link Control)** — **синхронен, битово ориентиран** протокол от каналния слой, създаден на база на **SDLC (Synchronous Data Link Control)**.\n- Осигурява **и connection-oriented, и connectionless** услуги.\n- **Дефинира структурата на фрейма** на каналния слой.\n- Осигурява **flow control, error control** и използва **acknowledgments** (потвърждения).\n- Използва **flag**, за да маркира **началото и края** на фрейма.\n- Полета: **Flag | Address | Control | Data | FCS | Flag**.\n\n### PPP фрейм\n| Поле | Размер | Съдържание |\n|---|---|---|\n| **Flag** | 1 B | **01111110** — начало/край на фрейма. Ако данните съдържат същия модел, **след всеки 5 бита „1“ се вмъква 0** (bit stuffing), а получателят ги маха |\n| **Address** | 1 B | **11111111** — стандартен **broadcast** адрес (не се присвоява индивидуален адрес) |\n| **Control** | 1 B | **00000011** — предават се **неподредени (unnumbered) фреймове** |\n| **Protocol** | **2 B** | **идентифицира кой протокол е енкапсулиран** в полето Data |\n| **Data** | променлив (**≥ 0 B**) | пакетът за указания протокол; **максимална дължина 1500 B** |\n| **FCS** | **2 B** (в таблицата на слайда: „2 or 4“) | контролна сума |\n\n### 802.11 (Wi-Fi) фрейм\n- **Preamble**: **Synch** — **80 bits** (10 октета), но при спектър **DSSS — 128 bits**, поредица от **1010…10**; **SFD (Start Frame Delimiter)** — **16 bits: 0000 1100 1011 1101** (2 октета).\n- **PLCP Header**: **PLW** (12 bits), **PSF** (4 bits), **HEC** (2 октета).\n- **MAC Header and Data**: Frame Control **2**, Duration & ID **2**, **Address 1, 2, 3** — по **6**, Sequence Control **2**, **Address 4** — **6**, **Frame Body 0–2312**, **CRC 4** (октети). Т.е. 802.11 фреймът има **4 адресни полета**.\n- **Frame Control** (битове): Version 2, Type 2, Subtype 4, To DS, From DS, More Frag, Retry, Power Mgmt, More Data, **WEP**, Order — по 1 бит.\n\n### Метод за достъп до средата\n- Определя **начина, по който няколко устройства ползват обща преносна среда**, за да предават/приемат през нея.\n- **Channel based** (базиран на канали) — достъпът се реализира с **мултиплексиране**: няколко потока данни/сигнали споделят една физическа среда. **Осигурява се от физическия слой.** Разделяне по честота (F), време (T), код (C), поляризация (P), пулс (P).\n- **Packet based** (базиран на пакети) — основава се на **протокол за множествен достъп и контролен механизъм — MAC**. **Осигурява се от MAC подслоя на Data Link слоя.**\n\n| Група | Метод | Конкретни реализации |\n|---|---|---|\n| Channel based | **FDMA** | OFDMA, WDMA, SC-FDMA |\n| | **TDMA** | MF-TDMA, STDMA |\n| | **CDMA** | W-CDMA, TD-CDMA, TD-SCDMA, DS-CDMA, FH-CDMA, MC-CDMA |\n| | **SDMA** | HC-SDMA |\n| | **PDMA**, **PAMA** | — |\n| Packet based | **Collision recovery** | **ALOHA, Slotted ALOHA, R-ALOHA, AX.25** |\n| | **Collision avoidance** | **MACA, MACAW, CSMA, CSMA/CD, CSMA/CA**, DCF, PCF, HCF, CSMA/CARP |\n| | **Collision free** | **Token ring, Token bus**, MS-ALOHA |\n| | **Delay & disruption tolerant** | MANET, VANET, DTN, Dynamic Source Routing |\n| Duplex methods | | **TDD, FDD** |\n\n### Детерминиран и недетерминиран достъп\n- **Детерминиран достъп**:\n  - **Разделяне на канала на подканали** (по честота и по време) за всяко устройство — **не се ползва в локални мрежи**, т.к. се получава **много нисък коефициент на използване на пропускателната способност**.\n  - **Token passing** — данните се „закачат“ за предаване **само за свободен token** (≥ 1 token).\n- **Недетерминиран достъп**: **CSMA/CD — за кабелни решения**; **CSMA/CA — за безжични мрежи**.\n- **Token passing — сценарии**:\n  - Дойде token със **съобщение за мен** → обработвам съобщението и **предавам празен token** нататък.\n  - Дойде token със **съобщение, което не е за мен** → **не го обработвам, предавам го нататък**.\n  - Дойде **празен token** и имам данни → **закачам съобщението си към token-а** и го предавам.\n  - Нямам token → не е мой ред, **чакам**.\n\n### Half-duplex / Full-duplex\n- **Half-duplex** — **само едно устройство може да предава** в споделената среда в даден момент.\n- **Full-duplex** — **едновременно се приема и предава**, т.к. има **физически отделни кабели/канали**.\n\n### Колизии и колизионни домейни\n- В **споделена среда**, ако хостове предават **по едно и също време**, се получават **колизии**.\n- Поделена среда: **въздух**, **коаксиален кабел**, **концентратор (hub) и кабели „усукана двойка“**.\n- **Колизионен домейн** — **област, където се случват колизии**.\n- **Добавянето на повече концентратори и хостове** води до **разрастване на колизионния домейн**, повече трафик и повече колизии.\n\n### CSMA/CD (Carrier Sense Multiple Access / Collision Detection)\n- **Carrier Sense** — „слуша“ дали има сигнал по кабела.\n- **Multiple Access** — хостовете поделят една и съща среда (един кабел, въздух) и всички имат достъп до нея.\n- **Collision Detection** — открива и управлява колизията, когато се случи.\n- Обслужването е **FIFO** — „първи пристигнал, първи обслужен“.\n- **Последователност**: 1) слуша — ако има сигнал, **чака**, докато не се чува сигнал; 2) ако няма сигнал — **праща данни**; 3) слуша за колизии — ако няма, съобщението е изпратено; 4) ако има колизия — **спира предаването** и изпраща **jam сигнал**; 5) **чака случаен период от време**, пак слуша и **изпраща съобщението отново**.\n- **Колизия** се случва, когато хост изпрати сигнал в момент, в който друг вече изпраща, но **изпращащият още не знае за това**.\n- **Забавяне (Latency)** — времето, за което сигналът пътува през средата; колкото **по-дълъг кабелът** и **повече мрежови устройства**, толкова по-голяма латентността.\n- Правило на слайда: ако хостът открие колизия, **докато изпраща първите 64 (bits)** от фрейма, спира и го **препраща по-късно**; ако я открие **след** тях — **твърде късно е и няма да препрати фрейма** (късна колизия). (Коректно: **64 байта = 512 bit times = slot time**, вж. Капани.)\n- Закъснението трябва да е **достатъчно малко**, за да се откриват колизиите навреме → това **ограничава дължината на кабела и броя на мрежовите устройства**.\n\n### Дефиниции за времената\n| Термин | Значение |\n|---|---|\n| **Latency (propagation delay)** | времето, за което сигналът преминава **от изпращача до дестинацията** |\n| **Bit time** | времето, за което устройството **праща 1 bit** по кабела (или получаващото го прочита) |\n| **Slot time** | времето, за което сигналът **отива до най-далечния край на мрежата и се връща обратно** |\n| **Interframe spacing** | времето **между края на един фрейм и началото на следващия** |\n\n- **Interframe spacing**: дава шанс на средата да се **стабилизира** и време на устройството да **обработи фрейма**. Устройствата чакат **минимум 96 bit times** след пристигането на фрейма, преди да пратят пак: **9.6 µs при 10 Mbps** и **0.96 µs при 100 Mbps** Ethernet.\n- **Различни bandwidths (10 → 100 Mbps)**: изпращачът **разполага битовете 10 пъти по-бързо**, но те **пътуват със същата скорост** по кабела; **колизията се открива по същия начин** като преди.\n\n### CSMA/CA (Carrier Sense Multiple Access / Collision Avoidance)\n- **Carrier Sense** — слуша дали има сигнал в средата (**по въздуха**); **Multiple Access** — обща среда (въздух).\n- **Collision Avoidance** — ако се чува сигнал, **чака случайно време**, преди отново да слуша за свободен канал.\n- Обслужване **FIFO**.\n- Сценарий с **точка за достъп (AP)**: „Никой не предава, но нямам позволение от точката за достъп — не мога да предавам“; станцията **предава само след като получи позволение от AP**; останалите чакат.\n- Получателят проверява, че пакетът е приет и **контролната последователност е правилна**, и **изпраща сигнал (потвърждение) на изпращача**, че пакетът е доставен → изпращачът **изчиства буфера си**.\n- Ако **не получи потвърждаващ пакет** → **пази съобщението в буфера**, изчаква позволение от AP и **го предава пак**.\n\n### Channel-based методи\n- **TDMA (Time Division Multiple Access)** — достъп на няколко потребители чрез **разделяне на сигнала в различни времеви интервали**; всеки предава в **собствен времеви слот**, един след друг. Използва се в **цифровите 2G клетъчни системи (GSM)**, **DECT** (преносими телефони), **спътникови системи**, **PON мрежи**.\n- **Dynamic TDMA** — алгоритъм за планиране, който **динамично запазва променлив брой времеви интервали** във всеки фрейм според изискванията на всеки поток. Използва се в **HIPERLAN/2, IEEE 802.16a WiMax, Bluetooth**.\n- **FDMA** — на всеки потребител се разпределя **индивидуално една или няколко честотни ленти/канали**; за **сателитна комуникация**.\n- **CDMA** — няколко потребители **споделят една честотна лента**, като **на всеки предавател е присвоен код**; използва се в **3G** (на GSM).\n- **OFDMA** — **подканалите са в честотния домейн, а OFDMA символите — във времевия**; динамично се разпределят; позволява **адаптивна модулация/кодиране/контрол на енергията**. Използва се в **802.11a/g/n/ac, HiperLAN/2, Mobile WiMAX, LTE, цифрово радио и цифрова TV**.\n- OFDMA кодиране (схема): данните се кодират в честотния домейн (N носещи) → преобразуват се във времевия домейн (всяка честота е синусоида, сумират се) → предаване; при приемане — обратно в честотния домейн и **всяка честота се декодира поотделно**.\n\n### Намаляване на колизиите и устройства на каналния слой\n- **Комутатор замества концентратор** → по-малко колизии. Комутатор между два споделени хъба = **два колизионни домейна**; комутатор в центъра на LAN → **всеки компютър има собствен колизионен домейн**.\n- Устройства на каналния слой: **мост (bridge)**, **комутатор (switch)**, **мрежова интерфейсна карта (NIC)**.\n- **Мост** — с **поне 2 мрежови карти**, всяка свързана към отделен сегмент; осигурява **прозрачна връзка** между хостове от различни мрежи чрез **транслация и филтрация на фреймове**; **ограничава колизионните домейни**.\n- **Комутатор** — съчетава функциите на **многопортов повторител (концентратор)** и **високоскоростен мост**; преглежда фреймовете, определя източника и дестинацията и **доставя фрейма само на устройството, за което е предназначен**.\n- **Мрежова карта (Ethernet NIC)** — схема: Ethernet Controller, **Tx** (предаване) и **Rx** (приемане), блокове **Collision Detection** и **Loopback**; Transmit на едната карта е свързан с Receive на другата.\n\n### Капани за изпита\n- **MAC ↔ LLC**: достъп до средата, адресиране, ограничаване на фрейма → **MAC**; връзка с горните слоеве, идентифициране на мрежовия протокол, независимост от хардуера → **LLC**.\n- Слайдът пише „Logic Link Control“ — правилно е **Logical Link Control**.\n- Слайдът за MAC пише „**корекция** на грешки“; на практика FCS/CRC позволява **откриване** на грешки (грешният фрейм се изхвърля).\n- Слайдът за CSMA/CD пише „**64 bits**“ — правилно е **64 байта (512 bit times = slot time)**; 64 B е и минималният Ethernet фрейм.\n- Preamble: **7 B + 1 B SFD** при 802.3, но **8 B** при Ethernet II (SFD е включен). Данни **46–1500 B**; FCS **4 B**; MAC адрес **6 B**.\n- PPP: FCS — текстът казва **2 B**, таблицата на слайда — **„2 or 4“**. Flag **01111110**, Address **11111111**, Control **00000011**, Protocol **2 B**, данни макс. **1500 B**.\n- 802.11: Synch **80 bits** (DSSS — **128 bits**), SFD **16 bits**, Frame Body **0–2312 B**, **4 адреса**, CRC 4 B.\n- Channel based → **физически слой** (мултиплексиране); packet based → **MAC подслой**.\n- Collision **recovery** (ALOHA) ≠ collision **avoidance** (CSMA, CSMA/CD, CSMA/CA, MACA) ≠ collision **free** (Token ring, Token bus). В таблицата CSMA/CD е в групата **Collision avoidance**.\n- **CSMA/CD — кабелни мрежи** (Detection, jam сигнал); **CSMA/CA — безжични** (Avoidance, позволение от AP, потвърждение).\n- Interframe spacing = **96 bit times** → **9.6 µs** @10 Mbps, **0.96 µs** @100 Mbps. При по-висока скорост **скоростта на разпространение не се променя**.\n- **Slot time** (до най-далечния край **и обратно**) ≠ **latency** (само от изпращача до дестинацията) ≠ **bit time** (за 1 бит).\n- TDMA → **2G/GSM, DECT, PON**; CDMA → **3G**; FDMA → **сателитна**; Dynamic TDMA → **HIPERLAN/2, WiMax 802.16a, Bluetooth**; OFDMA → **Wi-Fi a/g/n/ac, LTE, Mobile WiMAX**.\n- Устройства на канален слой: мост, комутатор, NIC — **НЕ** концентратор (физически слой) и **НЕ** маршрутизатор (мрежов слой).\n- Разделянето на канала на подканали **не се ползва в LAN** — нисък коефициент на използване на пропускателната способност.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L10-A-1","n":1,"text":"Какви адреси използва каналният (Data Link) слой, за да идентифицира устройствата?","opts":["Логически (IP) адреси","Физически (MAC) адреси","Номера на портове","Имена на хостове (DNS)"],"correct":1,"expl":"Каналният слой идентифицира устройствата по **физическите (MAC) адреси**."},{"id":"L10-A-2","n":2,"text":"Коя функция НЕ е на MAC подслоя?","opts":["Осигуряване на независимост от физическото оборудване","Адресиране","Ограничение на фрейма","Възстановяване на преносната среда след предаване на фрейм"],"correct":0,"expl":"Независимостта от физическото оборудване е функция на **LLC**."},{"id":"L10-A-3","n":3,"text":"Какъв е размерът на полето за данни в Ethernet фрейма?","opts":["64–1518 B","0–2312 B","46–1500 B","0–1500 B"],"correct":2,"expl":"Данните са **46–1500 B**; 0–2312 B е Frame Body при 802.11, а 64–1518 B е размерът на целия фрейм."},{"id":"L10-A-4","n":4,"text":"Как PPP запазва интегритета на данните, ако в тях се срещне моделът на флага?","opts":["Вмъква 0 след всеки 5 последователни бита 1","Вмъква 1 след всеки 5 последователни бита 0","Вмъква нов флаг след всеки байт","Изхвърля фрейма и иска повторно предаване"],"correct":0,"expl":"Bit stuffing: **0 след всеки 5 бита „1“**, а получателят ги маха."},{"id":"L10-A-5","n":5,"text":"Колко адресни полета има MAC хедърът на 802.11 фрейма?","opts":["2","3","1","4"],"correct":3,"expl":"802.11 MAC хедърът има **Address 1, 2, 3 и 4** (по 6 октета)."},{"id":"L10-A-6","n":6,"text":"Защо разделянето на канала на подканали (по честота и време) не се ползва в локалните мрежи?","opts":["Получават се твърде много колизии, защото всички станции ползват общ канал","Получава се много нисък коефициент на използване на пропускателната способност","Изисква задължително оптичен кабел и отделна мрежова карта за всеки подканал","Не позволява full-duplex връзки между станциите в една и съща локална мрежа"],"correct":1,"expl":"Фиксираните подканали остават неизползвани → **нисък коефициент на използване**."},{"id":"L10-A-7","n":7,"text":"Коя от изброените НЕ е посочена като поделена (споделена) среда?","opts":["Въздух","Комутатор с full-duplex point-to-point връзки","Коаксиален кабел","Концентратор и кабели от тип усукана двойка"],"correct":1,"expl":"Поделена среда: **въздух, коаксиален кабел, концентратор + усукана двойка**."},{"id":"L10-A-8","n":8,"text":"Какво ограничава изискването закъснението да е достатъчно малко, за да се откриват колизиите навреме?","opts":["Размера на полето за данни във фрейма","Броя на MAC адресите в бридж таблицата","Дължината на кабела и броя на мрежовите устройства","Скоростта на разпространение на сигнала"],"correct":2,"expl":"Малкото закъснение **ограничава дължината на кабела и броя на устройствата**."},{"id":"L10-A-9","n":9,"text":"Какво прави станцията при CSMA/CA, ако не получи потвърждаващ пакет, че съобщението е доставено?","opts":["Пази го в буфера, изчаква позволение от точката за достъп и го предава пак","Изчиства буфера си и не предава повече, защото съобщението се счита за загубено","Изпраща jam сигнал към всички станции и спира да предава за постоянно","Предава го веднага отново, без да чака позволение от точката за достъп"],"correct":0,"expl":"Без потвърждение съобщението **остава в буфера** и се **предава отново** след позволение от AP."},{"id":"L10-A-10","n":10,"text":"Функциите на кои устройства съчетава комутаторът?","opts":["Маршрутизатор и мрежова карта с поддръжка на full-duplex","Модем и безжична точка за достъп (access point)","Мост и маршрутизатор, работещ с логически (IP) адреси","Многопортов повторител (концентратор) и високоскоростен мост"],"correct":3,"expl":"Комутаторът = **многопортов повторител + високоскоростен мост**; доставя фрейма само на получателя."}],"B":[{"id":"L10-B-1","n":1,"text":"За каква доставка отговаря каналният слой?","opts":["От оригиналния източник до крайната дестинация през няколко мрежи","От приложението на подателя до приложението на получателя","От NIC на източника до NIC на получателя в същия сегмент","От рутера до default gateway в друга мрежа"],"correct":2,"expl":"Data Link доставя фрейма **от NIC до NIC в същия сегмент**; доставката между мрежи е задача на мрежовия слой."},{"id":"L10-B-2","n":2,"text":"Ограничението на фрейма, адресирането и контролът на грешки в MAC подслоя се обединяват в групата:","opts":["Енкапсулация на данните","Media Access Control","Logical Link Control","Interframe spacing"],"correct":0,"expl":"MAC подслоят отговаря за **енкапсулацията** (ограничение, адресиране, грешки) и за **Media Access Control** (разполагане в средата)."},{"id":"L10-B-3","n":3,"text":"Кое поле на Ethernet фрейма образува трейлъра (Trailer)?","opts":["Preamble","Length/Type","Frame Check Sequence","Start of Frame Delimiter"],"correct":2,"expl":"Трейлърът е **FCS (4 B)**; Preamble, SFD, адресите и Length/Type са в хедъра."},{"id":"L10-B-4","n":4,"text":"Какво съдържа полето Address в PPP фрейма?","opts":["MAC адреса на получателя (6 байта)","IP адреса на получателя (4 байта)","Стойността 01111110, както полето Flag","Стандартния broadcast адрес 11111111"],"correct":3,"expl":"PPP не присвоява индивидуален адрес — Address е **11111111 (broadcast)**."},{"id":"L10-B-5","n":5,"text":"Чрез какво се реализира channel based достъпът до средата и кой слой го осигурява?","opts":["Чрез протокол за множествен достъп; осигурява се от MAC подслоя","Чрез token passing; осигурява се от LLC подслоя","Чрез CSMA/CD; осигурява се от мрежовия слой","Чрез мултиплексиране; осигурява се от физическия слой"],"correct":3,"expl":"Channel based = **мултиплексиране**, **физически слой**; packet based = MAC подслоят."},{"id":"L10-B-6","n":6,"text":"Кой недетерминиран метод е предназначен за безжични мрежи?","opts":["CSMA/CD","CSMA/CA","Token passing","TDMA"],"correct":1,"expl":"**CSMA/CD — кабелни**, **CSMA/CA — безжични** мрежи."},{"id":"L10-B-7","n":7,"text":"До какво води добавянето на повече концентратори и хостове към мрежата?","opts":["Разделяне на мрежата на повече колизионни домейни","Намаляване на броя на колизиите и по-добра bandwidth за всеки хост","Разделяне на мрежата на отделни бродкаст и колизионни домейни","Разрастване на колизионния домейн, повече трафик и повече колизии"],"correct":3,"expl":"Концентраторите **разширяват колизионния домейн** → повече трафик и колизии."},{"id":"L10-B-8","n":8,"text":"Кой термин означава времето, за което сигналът отива до най-далечния край на мрежата и се връща обратно?","opts":["Slot time","Bit time","Latency","Interframe spacing"],"correct":0,"expl":"**Slot time** — до най-далечния край **и обратно**; latency — само от изпращача до дестинацията."},{"id":"L10-B-9","n":9,"text":"Кой метод динамично запазва променлив брой времеви интервали във всеки фрейм според изискванията на потоците от данни?","opts":["FDMA","Dynamic TDMA","CDMA","Slotted ALOHA"],"correct":1,"expl":"**Dynamic TDMA** — използва се в HIPERLAN/2, IEEE 802.16a WiMax, Bluetooth."},{"id":"L10-B-10","n":10,"text":"Кое от изброените устройства НЕ е устройство на каналния слой според лекцията?","opts":["Мост","Комутатор","Маршрутизатор","Мрежова интерфейсна карта (NIC)"],"correct":2,"expl":"Устройства на канален слой: **мост, комутатор, NIC**. Маршрутизаторът е на мрежовия слой."}],"C":[{"id":"L10-C-1","n":1,"text":"Чрез кой подслой каналният слой определя механизмите за достъп до преносната среда?","opts":["LLC","PLCP","HDLC","MAC"],"correct":3,"expl":"Достъпът до средата се определя от **MAC (Media Access Control)** подслоя."},{"id":"L10-C-2","n":2,"text":"Какво проверява каналният слой в получения фрейм?","opts":["Дали IP адресът на получателя е в същата мрежа","Дали портът на приложението е отворен","Дали данните са с верни флагове и дали има грешки","Дали маршрутът до получателя е оптимален"],"correct":2,"expl":"Каналният слой проверява **флаговете** и **дали има грешки** във фрейма."},{"id":"L10-C-3","n":3,"text":"По какво се различава Ethernet (II) фреймът от IEEE 802.3 фрейма според сравнителната таблица?","opts":["Преамбюлът е 8 B без отделно SFD поле, а полето е Type","Адресите са по 4 B вместо по 6 B, а полето е Length","Няма поле Frame Check Sequence, а преамбюлът е 7 B","Полето за данни е 0–2312 B, а полето Type липсва"],"correct":0,"expl":"При Ethernet: **Preamble 8 B** (включва SFD), **Type 2 B**, данни 46–1500, FCS 4; при 802.3 — Preamble 7 + SFD 1, Length/Type."},{"id":"L10-C-4","n":4,"text":"Какво указва стойността 00000011 в полето Control на PPP фрейма?","opts":["Начало или край на фрейма (като полето Flag)","Фреймът е потвърждение (ACK) за получени данни","В полето Data е енкапсулиран IPv4 пакет","Предават се неподредени (unnumbered) фреймове"],"correct":3,"expl":"Control = **00000011** казва, че се предават **неподредени фреймове**."},{"id":"L10-C-5","n":5,"text":"Кой метод е от групата Collision free в таблицата на методите за достъп?","opts":["ALOHA","Token ring","CSMA/CD","MACA"],"correct":1,"expl":"Collision free: **Token ring, Token bus, MS-ALOHA**."},{"id":"L10-C-6","n":6,"text":"При token passing станция получава token със закачено съобщение, което не е за нея. Какво прави тя?","opts":["Обработва съобщението и предава празен token","Закача своето съобщение към token-а","Не го обработва и предава token-а нататък","Изпраща jam сигнал и чака случайно време"],"correct":2,"expl":"Съобщение, което не е за станцията, **не се обработва и се предава нататък**."},{"id":"L10-C-7","n":7,"text":"Какво прави хостът при CSMA/CD веднага след като открие колизия?","opts":["Продължава до края на фрейма","Спира предаването и изпраща jam сигнал","Изпраща потвърждение (ACK) на получателя","Иска позволение от точката за достъп"],"correct":1,"expl":"При колизия хостът **спира да предава и изпраща jam сигнал**, после чака случайно време."},{"id":"L10-C-8","n":8,"text":"Колко е минималният interframe spacing при 100 Mbps Ethernet?","opts":["0.96 µs","9.6 µs","96 µs","0.096 µs"],"correct":0,"expl":"96 bit times = **9.6 µs @10 Mbps** и **0.96 µs @100 Mbps**."},{"id":"L10-C-9","n":9,"text":"Кое твърдение за OFDMA е вярно?","opts":["На всеки предавател се присвоява уникален код в обща лента","Всеки потребител получава фиксиран времеви слот един след друг","Подканалите са в честотния домейн, а символите — във времевия","Използва се основно в 2G системи като GSM и DECT"],"correct":2,"expl":"**OFDMA**: подканали в честотния, символи във времевия домейн; ползва се в 802.11a/g/n/ac, LTE, Mobile WiMAX."},{"id":"L10-C-10","n":10,"text":"Къде се използва TDMA?","opts":["В цифровите 2G клетъчни системи (GSM), DECT и PON мрежи","В 3G мрежите, където се ползва кодово разделяне","В IEEE 802.11a/g/n/ac, LTE и Mobile WiMAX","В HIPERLAN/2, WiMax 802.16a и Bluetooth"],"correct":0,"expl":"**TDMA** — 2G/GSM, DECT, спътникови системи, PON. 3G е CDMA; Wi-Fi/LTE — OFDMA; Bluetooth — Dynamic TDMA."}],"D":[{"id":"L10-D-1","n":1,"text":"Чрез кой подслой каналният слой се свързва с горните слоеве?","opts":["MAC","SFD","LLC","FCS"],"correct":2,"expl":"**LLC (Logical Link Control)** осъществява връзката с горните слоеве."},{"id":"L10-D-2","n":2,"text":"Кой от изброените НЕ е стандарт/протокол на Data Link слоя?","opts":["HDLC","Token Ring","PPP","TCP"],"correct":3,"expl":"Стандарти за Data Link: Ethernet, Token Ring, HDLC, PPP, IEEE 802.11, PAP, CHAP. **TCP е транспортен протокол.**"},{"id":"L10-D-3","n":3,"text":"Кое твърдение за HDLC е вярно?","opts":["Синхронен битово ориентиран протокол, създаден на база SDLC","Асинхронен байтово ориентиран протокол, създаден на база PPP","Метод за достъп до среда чрез маркер (token)","Безжичен протокол, описан в IEEE 802.11"],"correct":0,"expl":"**HDLC** е синхронен, битово ориентиран, създаден на база **SDLC**."},{"id":"L10-D-4","n":4,"text":"Колко бита е полето Synch в преамбюла на 802.11 фрейма, ако спектърът е DSSS?","opts":["80 bits","128 bits","16 bits","64 bits"],"correct":1,"expl":"Synch е 80 bits, но **при DSSS — 128 bits** (1010…10). 16 bits е SFD."},{"id":"L10-D-5","n":5,"text":"Към коя група packet based методи принадлежат ALOHA и Slotted ALOHA?","opts":["Collision recovery","Collision avoidance","Collision free","Delay & disruption tolerant"],"correct":0,"expl":"Collision recovery: **ALOHA, Slotted ALOHA, R-ALOHA, AX.25**."},{"id":"L10-D-6","n":6,"text":"При token passing станция с данни за предаване получава празен token. Какво прави тя?","opts":["Чака случаен период от време, преди да слуша отново","Иска позволение от точката за достъп и чака ACK","Предава празния token нататък и чака следващия","Закача съобщението си към token-а и го предава нататък"],"correct":3,"expl":"Празен token = **мой ред**: станцията закача съобщението си и го предава."},{"id":"L10-D-7","n":7,"text":"Коя е правилната последователност при CSMA/CD?","opts":["Предава → слуша → jam → открива колизия → случайно изчакване → повторно предаване","Иска позволение от AP → предава → получава ACK → изчиства буфера","Слуша → предава → открива колизия → jam → случайно изчакване → повторно предаване","Слуша → случайно изчакване → jam → предава → открива колизия → повторно предаване"],"correct":2,"expl":"CSMA/CD: **слушане, предаване, откриване, jam, случайно изчакване, повторно предаване**. Позволение от AP и ACK са характерни за CSMA/CA."},{"id":"L10-D-8","n":8,"text":"Какво се случва при преминаване от 10 Mbps на 100 Mbps?","opts":["Сигналът пътува по кабела 10 пъти по-бързо, а битовете се поставят със същата скорост","Битовете се поставят 10 пъти по-бързо, но пътуват по кабела със същата скорост","Колизиите се откриват по съвсем различен начин и jam сигналът отпада","Interframe spacing остава 9.6 µs, както при 10 Mbps"],"correct":1,"expl":"Изпращачът разполага битовете по-бързо, но **скоростта на разпространение е същата**; колизиите се откриват по същия начин."},{"id":"L10-D-9","n":9,"text":"При CSMA/CA в мрежа с точка за достъп кога станцията започва да предава?","opts":["Веднага щом открие колизия и изпрати jam сигнал","След като получи позволение от точката за достъп","Когато получи празен token от съседната станция","След като изпрати jam сигнал към всички станции"],"correct":1,"expl":"В сценария на лекцията станцията **предава само с позволение от AP**, а след доставка получава потвърждение."},{"id":"L10-D-10","n":10,"text":"При кой метод няколко потребители споделят една честотна лента, като на всеки предавател е присвоен код?","opts":["FDMA","TDMA","OFDMA","CDMA"],"correct":3,"expl":"**CDMA** — обща честотна лента, **уникален код** за всеки предавател; използва се в 3G."}],"E":[{"id":"L10-E-1","n":1,"text":"Коя от функциите принадлежи на LLC подслоя?","opts":["Ограничава (разграничава) фрейма","Идентифицира кой е мрежовият протокол","Контролира разполагането на фрейма в средата","Възстановява средата след предаване на фрейм"],"correct":1,"expl":"LLC: връзка с горните слоеве, **идентифициране на мрежовия протокол**, независимост от хардуера. Останалите са на MAC."},{"id":"L10-E-2","n":2,"text":"Колко байта е полето Preamble в IEEE 802.3 фрейма (при отделно поле SFD)?","opts":["2 B","7 B","4 B","6 B"],"correct":1,"expl":"Preamble е **7 B**, следван от SFD **1 B** (при Ethernet II двете заедно са 8 B)."},{"id":"L10-E-3","n":3,"text":"Каква е стойността на полето Flag в PPP фрейма?","opts":["11111111","00000011","01111110","10101011"],"correct":2,"expl":"Flag = **01111110**; 11111111 е Address, 00000011 е Control."},{"id":"L10-E-4","n":4,"text":"Кое описва полето SFD в 802.11 фрейма?","opts":["80 bits поредица 1010…10 (полето Synch)","8 bits със стойност 01111110 (Flag)","12 bits — полето PLW от PLCP хедъра","16 bits със стойност 0000 1100 1011 1101"],"correct":3,"expl":"**SFD — 16 bits: 0000 1100 1011 1101**."},{"id":"L10-E-5","n":5,"text":"Кой от изброените е channel based метод за достъп?","opts":["CDMA","CSMA/CA","Token bus","MACAW"],"correct":0,"expl":"Channel based: FDMA, TDMA, **CDMA**, SDMA, PDMA, PAMA. Останалите са packet based."},{"id":"L10-E-6","n":6,"text":"Защо при full-duplex може едновременно да се приема и предава?","opts":["Използва се CSMA/CD за откриване на колизии","Устройствата изчакват 96 bit times","Има физически отделни кабели/канали за двете посоки","Само едно устройство притежава token"],"correct":2,"expl":"Full-duplex: **физически отделни кабели/канали**; при half-duplex предава само едно устройство."},{"id":"L10-E-7","n":7,"text":"Какво следва, ако хостът открие колизия едва след като е изпратил първите 64 байта (slot time) от фрейма?","opts":["Хостът го препраща веднага, без изчакване","Твърде късно е — хостът няма да препрати фрейма","Хостът изпраща ACK и изчиства буфера","Хостът превключва в full-duplex режим"],"correct":1,"expl":"Ако колизията е открита **след** първите 64 (на слайда — „64 bits“, коректно 64 байта), хостът **няма да препрати фрейма**."},{"id":"L10-E-8","n":8,"text":"Какво прави станцията при CSMA/CA (Collision Avoidance), ако чуе сигнал в средата?","opts":["Чака случайно време, преди отново да слуша за свободен канал","Изпраща jam сигнал към всички станции и спира предаването","Предава веднага, тъй като средата е въздух и няма колизии","Преминава към token passing и чака празен token"],"correct":0,"expl":"Collision Avoidance: **случайно изчакване** и повторно слушане."},{"id":"L10-E-9","n":9,"text":"Какъв е ефектът, когато комутатор е поставен в центъра на LAN вместо концентратор?","opts":["Всички компютри са в един колизионен домейн","Всеки компютър е в собствен бродкаст домейн","Всеки компютър е в собствен колизионен домейн","Колизионният домейн се разраства"],"correct":2,"expl":"**Комутатор замества концентратор** → всеки порт/компютър е отделен колизионен домейн."},{"id":"L10-E-10","n":10,"text":"Кое е вярно за мрежовия мост (bridge)?","opts":["Работи на мрежовия слой и маршрутизира по IP","Съчетава многопортов повторител и маршрутизатор","Увеличава размера на колизионния домейн","Има поне 2 мрежови карти и ограничава колизионните домейни"],"correct":3,"expl":"Мостът има **поне 2 NIC** (към отделни сегменти), транслира и филтрира фреймове и **ограничава колизионните домейни**."}]}},{"num":11,"title":"Лекция 11 — Ethernet","short":"Ethernet","summary":"### Ethernet — обхват на приложение\n- Ethernet стандартът е създаден за **мрежа в една сграда или в съседни сгради на едно място — LAN**.\n- Когато се ползват **оптични кабели и Gigabit скорости**, Ethernet може да се ползва и в **MAN** мрежа — **в рамките на един град**.\n- Ethernet може да се ползва и в няколко области **между LAN и WAN, но по-рядко**.\n- Ethernet е дефиниран от протоколи на **Data Link** и **Physical** слоя: **802.2** — LLC подслой, **802.3** — MAC подслой + физически слой.\n\n### Ethernet преди и сега (топологии)\n| Етап | Физическа топология | Логическа топология |\n|---|---|---|\n| Коаксиален кабел (ранен Ethernet) | **обща шина** | **обща шина** |\n| С концентратор (hub) | **звезда** | **обща шина** |\n| С комутатор (switch, напр. 2960-24TT) | звезда | (point-to-point връзки) |\n\n### Характеристики на Ethernet\n- Работи **на канален, но и на физически слой**.\n- Методът за достъп до средата е **CSMA/CD**.\n- Източникът и получателят се идентифицират с **физически адреси (MAC)**, които са **уникални**.\n- Прилага **контрол за коректно получаване** на предавания фрейм (поле **FCS**).\n\n### Ethernet стандарти\n| Стандарт | Скорост | Среда | Особености |\n|---|---|---|---|\n| **100Base-TX** (Fast Ethernet) | **100 Mbps** | кабели с **усукани двойки** | **предава по 1/2, получава по 3/6**; кодиране **4B/5B** |\n| **100Base-FX** (Fast Ethernet) | **100 Mbps** | **multimode оптичен** кабел | — |\n| **1000Base-T** (Gigabit) | **1 Gbps** | кабели с **усукани двойки** | използва **всички 4 двойки**, **предава и получава едновременно**; **сложно кодиране** |\n| **1000Base-SX** (Gigabit) | 1 Gbps | **multimode** оптичен кабел | **къса** дължина на вълната |\n| **1000Base-LX** (Gigabit) | 1 Gbps | **single/multimode** оптичен кабел | **по-дълга** дължина на вълната |\n| **10 Gbps Ethernet** | 10 Gbps | — | за **големи разстояния — MANs и WANs**; **същият формат на фрейма** като останалите Ethernet версии |\n| **cat8** кабел | **10, 25 или 40 Gbps** | усукана двойка (S/FTP) | но **до 30 м** |\n\n- Запомни: „**T**“ → усукана двойка (twisted pair); „**FX/SX/LX**“ → оптика; **S** = short wavelength, **L** = long wavelength.\n\n### Ethernet Timing\n- **Закъснение (Delay/Latency)** се внася **от устройствата** (повторители, концентратори и др. по пътя) и **от преносната среда**.\n\n### Ethernet фрейм\n| Поле | Размер (B) |\n|---|---|\n| Preamble | **7** |\n| Start of Frame Delimiter | **1** |\n| Destination address | **6** |\n| Source address | **6** |\n| Length/Type | **2** |\n| Packet Data | **46–1500** |\n| Frame Check Sequence | **4** |\n\n- Header: Preamble … Length/Type; Data = пакетът от горния слой; **Trailer = FCS**.\n\n### Адресиране на каналния слой\n- **MAC адресът е уникален**.\n- **В локалния сегмент MAC адресът е достатъчен** да идентифицира устройствата, които комуникират.\n- **Между сегменти** идентификацията е с **адрес от горен слой (IP, IPX…)**.\n- Пример (обща шина): фрейм за **D** достига до всички; A, B, C, E, F, G го отхвърлят (не е за тях), а D казва „за мен е, предавам го на горния слой“.\n\n### Ethernet MAC адрес\n- **Уникално идентифицира устройство в сегмента (неговата NIC)**.\n- **Записан е в ROM, но се копира в RAM**.\n- **Първите 3 bytes** идентифицират производителя — **OUI (Organizationally Unique Identifier)**.\n- **Устройството** чете MAC адреса на дестинацията, за да разбере накъде ще изпрати фрейма; **комутаторът** чете **MAC адреса на дестинацията**, за да прецени накъде да препрати фрейма.\n- Състои се от **48 бита** (12 шестнадесетични цифри) и се записва по различни начини — **това е един и същ адрес**:\n  - `00-05-9A-3C-78-00`\n  - `00:05:9A:3C:78:00`\n  - `0005.9A3C.7800`\n- **00-05-9A** е **ID на производителя (OUI)**, **присвоен от IEEE**; **3C-78-00** е **присвоен от производителя** (vendor assigned — за NIC карти, интерфейси).\n- Формат: **OUI — 24 бита (6 hex цифри)** + **Vendor Assigned — 24 бита (6 hex цифри)**; пример за OUI на Cisco: `00 60 2F`.\n- В Windows MAC адресът се вижда с командата **`ipconfig /all`** — ред **Physical Address** (напр. `1C-39-47-B1-1B-35`).\n\n### Разлика в адресирането MAC ↔ IP\n- **MAC адресите** — за идентификация на устройството **в локалния сегмент**.\n- **IP адресите** — за прехвърляне на данни **между различни сегменти**; идентифицират **както мрежата, така и устройството**.\n- **IP адресите** се вписват в хедъра от хоста-източник и **остават едни и същи до дестинацията**.\n- **MAC адресите** на източника и дестинацията в хедъра на фрейма **се сменят за всеки Ethernet сегмент**; за сегменти, които не са Ethernet, има **друга адресна схема**.\n- Схема: L2 Header (Destination NIC, Source NIC) + L3 Packet (Source IP, Destination IP); при преминаване през рутерите R1, R2 L2 хедърът се сменя.\n\n### Unicast, multicast, broadcast\n| Вид | Към кого | Слой |\n|---|---|---|\n| **Unicast** | **конкретен хост** | **2 или 3 слой** |\n| **Broadcast** | **всички хостове в мрежата** | **2 или 3 слой** |\n| **Multicast** | **група устройства** | според слайда — **само на 3 слой** |\n\n- Broadcast: при IP адреса **„host“ частта е само с 1-ци**; при MAC адреса **всички битове са 1-ци: `FF:FF:FF:FF:FF:FF`** (в 16-ично).\n\n### Концентратор (hub) и комутатор (switch)\n| Концентратор (Hub) | Комутатор (Switch) |\n|---|---|\n| **Поделена среда** | **Point-to-point връзки** |\n| **Поделена bandwidth** | **Неподелена bandwidth** |\n| **Колизии** | **Без колизии** |\n| (half-duplex) | **Използва full duplex** |\n\n### Капани за изпита\n- Ethernet е създаден за **LAN**; в **MAN** — при **оптика и Gigabit**; 10 Gbps — за **MANs и WANs**.\n- Ethernet работи на **два слоя** — канален **и** физически (не само на канален).\n- Хъб: **физическа звезда, логическа обща шина**; коаксиален Ethernet: шина/шина.\n- **100Base-TX**: 4B/5B, предава 1/2, получава 3/6 — **2 двойки**; **1000Base-T**: **всички 4 двойки** едновременно, сложно кодиране.\n- **SX** — multimode, **къса** вълна; **LX** — single/multimode, **по-дълга** вълна; **100Base-FX** — multimode.\n- cat8: 10/25/40 Gbps, но **само до 30 м**.\n- MAC = **48 бита = 6 байта**; **OUI = първите 3 байта / 24 бита**, присвоен от **IEEE**; останалите 3 — от **производителя**.\n- MAC е в **ROM**, копира се в **RAM**.\n- По пътя **IP адресите не се сменят**, а **MAC адресите се сменят** на всеки Ethernet сегмент.\n- Слайдът твърди, че multicast е „**само на 3 слой**“ — на практика съществуват и multicast MAC адреси (напр. `01:00:5E:…`), но за изпита следвай лекцията: unicast и broadcast — **2 или 3 слой**, multicast — **3 слой**.\n- Broadcast MAC = **FF:FF:FF:FF:FF:FF** (не `00:00:00:00:00:00` — това е празното Target MAC в ARP request).\n- Комутаторът решава по **дестинационния** MAC адрес (сорсовия само научава в таблицата — Лекция 12).\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L11-A-1","n":1,"text":"За каква мрежа е създаден първоначално Ethernet стандартът?","opts":["WAN — мрежа между отдалечени градове и държави","MAN — мрежа в рамките на един град или квартал","LAN — мрежа в една сграда или в съседни сгради","PAN — мрежа около един потребител и устройствата му"],"correct":2,"expl":"Ethernet е създаден за **LAN** — една сграда или съседни сгради на едно място."},{"id":"L11-A-2","n":2,"text":"Кое НЕ е характеристика на Ethernet според лекцията?","opts":["Работи на канален и на физически слой","Използва token passing за достъп до средата","Идентифицира източника и получателя с уникални MAC адреси","Прилага контрол за коректно получаване на фрейма"],"correct":1,"expl":"Ethernet използва **CSMA/CD**, а не token passing."},{"id":"L11-A-3","n":3,"text":"По кои пинове предава и получава 100Base-TX?","opts":["Предава по 3/6, получава по 1/2","Предава и получава по всички 4 двойки","Предава по 1/2, получава по 3/6","Предава по 4/5, получава по 7/8"],"correct":2,"expl":"100Base-TX **предава по 1/2 и получава по 3/6**; всички 4 двойки ползва 1000Base-T."},{"id":"L11-A-4","n":4,"text":"Каква среда използва 1000Base-LX?","opts":["Само multimode оптичен кабел с къса дължина на вълната","Single/multimode оптичен кабел с по-дълга дължина на вълната","Кабели с усукани двойки — всички 4 двойки","Коаксиален кабел с дълга дължина"],"correct":1,"expl":"**1000Base-LX** — single/multimode, **по-дълга** дължина на вълната."},{"id":"L11-A-5","n":5,"text":"Откъде произлиза закъснението (Delay/Latency) в Ethernet?","opts":["Само от размера на полето за данни","Само от MAC адреса на получателя","Само от кодирането 4B/5B","От устройствата и от преносната среда"],"correct":3,"expl":"Ethernet Timing: закъснение **от устройствата** и **от преносната среда**."},{"id":"L11-A-6","n":6,"text":"Какво е достатъчно за идентифициране на комуникиращите устройства в локалния сегмент?","opts":["IP адресът и маската","Номерът на порта на приложението","Името на хоста","MAC адресът"],"correct":3,"expl":"**В локалния сегмент MAC адресът е достатъчен**."},{"id":"L11-A-7","n":7,"text":"По кой адрес комутаторът преценява накъде да препрати фрейма?","opts":["По MAC адреса на дестинацията","По MAC адреса на източника","По IP адреса на източника","По OUI на производителя"],"correct":0,"expl":"Комутаторът **чете дестинационния MAC адрес**, за да реши накъде да препрати фрейма."},{"id":"L11-A-8","n":8,"text":"Колко бита е OUI частта на MAC адреса?","opts":["48","16","24","32"],"correct":2,"expl":"OUI = **24 бита (6 hex цифри)**, vendor assigned — също 24 бита."},{"id":"L11-A-9","n":9,"text":"Кой е broadcast MAC адресът?","opts":["FF:FF:FF:FF:FF:FF","00:00:00:00:00:00","01:00:00:00:00:00","FF:FF:FF:00:00:00"],"correct":0,"expl":"При broadcast **всички битове на MAC адреса са 1** → `FF:FF:FF:FF:FF:FF`."},{"id":"L11-A-10","n":10,"text":"Кое е характерно за мрежа с комутатор (switch)?","opts":["Поделена среда, поделена bandwidth и half duplex","Колизии между всички портове и общ колизионен домейн","Само half-duplex с CSMA/CD и поделена bandwidth","Point-to-point връзки, неподелена bandwidth, full duplex"],"correct":3,"expl":"Switch: **point-to-point, неподелена bandwidth, full duplex, без колизии**."}],"B":[{"id":"L11-B-1","n":1,"text":"При какви условия Ethernet може да се използва в MAN мрежа?","opts":["При оптични кабели и Gigabit скорости","При коаксиален кабел и CSMA/CD","При усукана двойка cat5 и 100 Mbps","Само при използване на концентратори"],"correct":0,"expl":"С **оптика и Gigabit скорости** Ethernet се ползва и в **MAN** (в рамките на град)."},{"id":"L11-B-2","n":2,"text":"Каква е логическата топология на Ethernet мрежа, изградена с концентратор (hub)?","opts":["Обща шина","Звезда","Пръстен","Пълна свързаност (mesh)"],"correct":0,"expl":"С hub: **физически звезда**, но **логически обща шина** — всички делят средата."},{"id":"L11-B-3","n":3,"text":"Какво кодиране използва 100Base-TX?","opts":["8B/10B","4B/5B","Манчестър","64B/66B"],"correct":1,"expl":"100Base-TX използва **4B/5B** кодиране."},{"id":"L11-B-4","n":4,"text":"Кой от изброените стандарти е Fast Ethernet (100 Mbps)?","opts":["1000Base-SX","1000Base-LX","100Base-FX","1000Base-T"],"correct":2,"expl":"Fast Ethernet: **100Base-TX** и **100Base-FX**; 1000Base-* са Gigabit."},{"id":"L11-B-5","n":5,"text":"Колко байта е полето Length/Type в Ethernet фрейма?","opts":["1","4","6","2"],"correct":3,"expl":"Length/Type е **2 B**; адресите са по 6, FCS — 4, SFD — 1."},{"id":"L11-B-6","n":6,"text":"С какъв адрес става идентификацията между различни сегменти?","opts":["Само с MAC адрес","С OUI на производителя","С номера на порта на комутатора","С адрес от горен слой (IP, IPX…)"],"correct":3,"expl":"Между сегменти се използва **адрес от горен слой (IP, IPX)**."},{"id":"L11-B-7","n":7,"text":"Колко бита е MAC адресът?","opts":["32","64","48","24"],"correct":2,"expl":"MAC адресът е **48 бита** (6 байта); 24 бита е само OUI частта."},{"id":"L11-B-8","n":8,"text":"С коя команда в Windows се вижда MAC адресът (Physical Address) на мрежовите адаптери?","opts":["`ipconfig /release`","`ipconfig /all`","`ping -a`","`tracert`"],"correct":1,"expl":"**`ipconfig /all`** показва Physical Address на всеки адаптер."},{"id":"L11-B-9","n":9,"text":"Какво е unicast съобщение?","opts":["Съобщение до конкретен хост, на 2 или 3 слой","Съобщение до група устройства, само на 3 слой","Съобщение до всички хостове в мрежата","Съобщение само между два комутатора"],"correct":0,"expl":"**Unicast** — до **конкретен хост**; може да е на 2 или 3 слой."},{"id":"L11-B-10","n":10,"text":"Кое НЕ е свойство на комутатора според сравнението hub/switch?","opts":["Point-to-point връзки","Използва full duplex","Поделена bandwidth","Без колизии"],"correct":2,"expl":"**Поделената bandwidth** е свойство на концентратора."}],"C":[{"id":"L11-C-1","n":1,"text":"Кое твърдение за обхвата на Ethernet е вярно?","opts":["Може да се ползва и в области между LAN и WAN, но по-рядко","Може да се ползва само в рамките на една стая или етаж","Използва се само в WAN мрежи между отделни градове","Не може да се използва в MAN мрежи, дори по оптика"],"correct":0,"expl":"Ethernet е за LAN, в MAN при оптика/Gigabit и **по-рядко — между LAN и WAN**."},{"id":"L11-C-2","n":2,"text":"Каква е физическата и логическата топология на ранния Ethernet с коаксиален кабел?","opts":["Звезда и обща шина","Обща шина и обща шина","Звезда и звезда","Пръстен и обща шина"],"correct":1,"expl":"Коаксиалният Ethernet е **шина физически и логически**; с хъб физическата става звезда."},{"id":"L11-C-3","n":3,"text":"Каква среда използва 100Base-FX?","opts":["Single-mode оптичен кабел с дълга вълна","Кабели с усукани двойки","Multimode оптичен кабел","Коаксиален кабел"],"correct":2,"expl":"**100Base-FX** — 100 Mbps по **multimode оптичен** кабел."},{"id":"L11-C-4","n":4,"text":"За какво е предназначен основно 10 Gbps Ethernet?","opts":["За работа на големи разстояния — MANs и WANs","Само за връзки в рамките на една стая","За безжични локални мрежи","За замяна на CSMA/CA в Wi-Fi"],"correct":0,"expl":"10 Gbps Ethernet е **за големи разстояния — MANs и WANs**."},{"id":"L11-C-5","n":5,"text":"Каква е минималната дължина на полето за данни в Ethernet фрейма?","opts":["64 B","0 B","18 B","46 B"],"correct":3,"expl":"Данните са **46–1500 B**; 64 B е минималният размер на целия фрейм."},{"id":"L11-C-6","n":6,"text":"В обща шина фрейм, адресиран до хост D, достига до всички хостове. Какво прави D?","opts":["Изхвърля фрейма, защото е получен и от другите хостове","Разпознава своя MAC адрес и предава данните към горния слой","Препраща фрейма към всички останали хостове в шината","Изпраща jam сигнал, за да уведоми останалите хостове"],"correct":1,"expl":"Само получателят (D) приема фрейма и го **предава на горния слой**; останалите го отхвърлят."},{"id":"L11-C-7","n":7,"text":"Кой запис представя същия MAC адрес като 00-05-9A-3C-78-00?","opts":["0005.9A3C.78","05:9A:3C:78:00:00","0005.9A3C.7800","00-05-9A-3C-78"],"correct":2,"expl":"`00-05-9A-3C-78-00`, `00:05:9A:3C:78:00` и **`0005.9A3C.7800`** са един и същ адрес."},{"id":"L11-C-8","n":8,"text":"Какво идентифицира IP адресът?","opts":["Само мрежовата карта в сегмента","Само производителя на устройството","Само порта на комутатора","Както мрежата, така и устройството"],"correct":3,"expl":"IP адресите **идентифицират и мрежата, и устройството**; MAC — устройството в сегмента."},{"id":"L11-C-9","n":9,"text":"Според лекцията на кой слой може да бъде multicast?","opts":["Само на 2 слой","Само на 3 слой","На 2 или 3 слой","Само на 1 слой"],"correct":1,"expl":"Слайдът: multicast е до група устройства и е **само на 3 слой** (unicast и broadcast — 2 или 3)."},{"id":"L11-C-10","n":10,"text":"Хост изпраща фрейм с дестинационен MAC адрес FF:FF:FF:FF:FF:FF. До кого е предназначен фреймът?","opts":["Само до default gateway","До група абонирани устройства","До хоста със същия OUI","До всички хостове в мрежата"],"correct":3,"expl":"`FF:FF:FF:FF:FF:FF` е **broadcast** — до всички хостове."}],"D":[{"id":"L11-D-1","n":1,"text":"На кои слоеве от модела OSI работи Ethernet?","opts":["Само на каналния слой","На каналния и на физическия слой","На мрежовия и на каналния слой","Само на физическия слой"],"correct":1,"expl":"Ethernet **работи на канален, но и на физически слой** (802.2/802.3)."},{"id":"L11-D-2","n":2,"text":"Коя спецификация описва LLC подслоя в схемата за Ethernet в модела OSI?","opts":["IEEE 802.2","IEEE 802.3","IEEE 802.11","IEEE 802.15"],"correct":0,"expl":"LLC — **802.2**; MAC и физическият слой на Ethernet — **802.3**."},{"id":"L11-D-3","n":3,"text":"Кое е характерно за 1000Base-T?","opts":["Използва само двойките 1/2 и 3/6 и 4B/5B кодиране","Използва multimode оптика с къса дължина на вълната","Използва всички 4 двойки и предава и получава едновременно","Работи само до 30 м по cat8 кабел"],"correct":2,"expl":"**1000Base-T** — 1 Gbps, **всички 4 двойки, едновременно** приемане и предаване, сложно кодиране."},{"id":"L11-D-4","n":4,"text":"Какъв формат на фрейма използва 10 Gbps Ethernet?","opts":["Нов формат без поле FCS","Формата на PPP фрейма","Формата на 802.11 фрейма с 4 адреса","Същия формат като останалите Ethernet версии"],"correct":3,"expl":"10 Gbps Ethernet **запазва формата на фрейма**."},{"id":"L11-D-5","n":5,"text":"Коя е правилната последователност на полетата в началото на Ethernet фрейма?","opts":["Preamble → SFD → Source address → Destination address → Length/Type","Preamble → SFD → Destination address → Source address → Length/Type","SFD → Preamble → Destination address → Source address → FCS","Preamble → Length/Type → Destination address → Source address → SFD"],"correct":1,"expl":"Редът е **Preamble, SFD, Destination, Source, Length/Type**, Data, FCS — адресът на получателя е преди този на източника."},{"id":"L11-D-6","n":6,"text":"Къде е записан MAC адресът на мрежовата карта?","opts":["В ROM, но се копира в RAM","В RAM, но се копира в ROM","Само в ARP таблицата на рутера","В DNS сървъра на мрежата"],"correct":0,"expl":"MAC адресът е **записан в ROM и се копира в RAM**."},{"id":"L11-D-7","n":7,"text":"В MAC адреса 00-05-9A-3C-78-00 кой е присвоил частта 3C-78-00?","opts":["IEEE","Мрежовият администратор","DHCP сървърът","Производителят"],"correct":3,"expl":"**00-05-9A** (OUI) е от **IEEE**, а **3C-78-00** — от **производителя**."},{"id":"L11-D-8","n":8,"text":"Пакет преминава от PC1 през два рутера до уеб сървър. Кои адреси се сменят по пътя?","opts":["IP адресите на източника и дестинацията — за всеки сегмент","И IP, и MAC адресите остават същите","MAC адресите на източника и дестинацията — за всеки Ethernet сегмент","Само IP адресът на дестинацията"],"correct":2,"expl":"**MAC адресите се сменят** за всеки Ethernet сегмент, а **IP адресите остават същите** до дестинацията."},{"id":"L11-D-9","n":9,"text":"Как изглежда IP адресът при broadcast съобщение?","opts":["„Network“ частта е само с 1-ци","„Host“ частта е само с 1-ци","Всички битове на адреса са 0","„Host“ частта е само с 0-ли"],"correct":1,"expl":"При IP broadcast **host частта е само с 1-ци**; при MAC — всички битове са 1."},{"id":"L11-D-10","n":10,"text":"Какво идентифицира уникално Ethernet MAC адресът?","opts":["Мрежата, към която принадлежи хостът (IP мрежата)","Приложението (процеса), което изпраща данните","Устройство в сегмента — неговата мрежова карта (NIC)","Рутера (default gateway), през който минава пакетът"],"correct":2,"expl":"MAC адресът **уникално идентифицира устройство в сегмента (неговата NIC)**."}],"E":[{"id":"L11-E-1","n":1,"text":"Кой е методът за достъп до средата при (класическия) Ethernet?","opts":["CSMA/CA","Token passing","CSMA/CD","TDMA"],"correct":2,"expl":"Ethernet използва **CSMA/CD**; CSMA/CA е за безжични мрежи."},{"id":"L11-E-2","n":2,"text":"Какви са скоростта и средата на 100Base-TX?","opts":["100 Mbps по multimode оптичен кабел","100 Mbps по кабели с усукани двойки","1 Gbps по кабели с усукани двойки","10 Mbps по коаксиален кабел"],"correct":1,"expl":"**100Base-TX** — 100 Mbps, **усукани двойки**; 100Base-FX — multimode оптика."},{"id":"L11-E-3","n":3,"text":"Кой стандарт използва multimode оптичен кабел с къса дължина на вълната?","opts":["1000Base-LX","1000Base-SX","1000Base-T","100Base-TX"],"correct":1,"expl":"**SX** — short wavelength, multimode; **LX** — по-дълга вълна, single/multimode."},{"id":"L11-E-4","n":4,"text":"Какви скорости и разстояние се постигат по cat8 кабел според лекцията?","opts":["100 Gbps, но само до 50 м","1 или 10 Gbps, но до 2 км","10, 25 или 40 Gbps, но до 30 м","10 или 25 Gbps до 550 м"],"correct":2,"expl":"При **cat8 — 10, 25 или 40 Gbps, но до 30 м**."},{"id":"L11-E-5","n":5,"text":"Кое поле реализира контрола за коректно получаване на Ethernet фрейма?","opts":["Frame Check Sequence","Preamble","Length/Type","Source address"],"correct":0,"expl":"Коректното получаване се проверява чрез **FCS (4 B)** в трейлъра."},{"id":"L11-E-6","n":6,"text":"Какво идентифицират първите 3 байта на MAC адреса?","opts":["Конкретната мрежова карта","Мрежата, в която е устройството","Типа на протокола в данните","Производителя (OUI)"],"correct":3,"expl":"Първите 3 bytes = **OUI (Organizationally Unique Identifier)** — производителят."},{"id":"L11-E-7","n":7,"text":"Коя организация присвоява идентификатора на производителя (OUI)?","opts":["IETF","IEEE","ISO","ICANN"],"correct":1,"expl":"OUI (напр. 00-05-9A) е **присвоен от IEEE**."},{"id":"L11-E-8","n":8,"text":"Кои адреси остават едни и същи от хоста-източник до дестинацията?","opts":["MAC адресите на източника и дестинацията","MAC адресът на default gateway","OUI на мрежовите карти по пътя","IP адресите на източника и дестинацията"],"correct":3,"expl":"IP адресите се вписват от източника и **не се променят** до дестинацията."},{"id":"L11-E-9","n":9,"text":"Кое е характерно за мрежа с концентратор (hub)?","opts":["Поделена среда, поделена bandwidth и колизии","Point-to-point връзки и неподелена bandwidth","Full duplex и липса на колизии","Отделен бродкаст домейн за всеки порт"],"correct":0,"expl":"Hub: **поделена среда, поделена bandwidth, колизии**."},{"id":"L11-E-10","n":10,"text":"Кой адрес в хедъра на фрейма чете изпращащото устройство, за да разбере накъде ще изпрати фрейма?","opts":["MAC адреса на дестинацията","MAC адреса на източника","OUI на собствената си карта","Адреса в полето Preamble"],"correct":0,"expl":"Устройството **чете дестинационния MAC адрес**, за да разбере накъде да изпрати фрейма."}]}},{"num":12,"title":"Лекция 12 — Сегментиране на мрежата. Комутатор. Видове","short":"Сегментиране на мрежата. Комутатор. Видове","summary":"### Видове комутатори (класификация от лекцията)\n| Признак | Видове |\n|---|---|\n| **по организация на буферирането** | **Port-based Memory Buffering** (буфер за всеки порт) / **Shared Memory Buffering** (обща памет) |\n| **по пропускателна способност** | **симетричен** / **асиметричен** комутатор |\n| **по режим на предаване** | **store-and-forward** / **cut-through** (fast-forward, fragment-free, adaptive) |\n| **по използваната служебна информация** | **Layer 2** (MAC адреси) / **Layer 3** (MAC + IP адреси) комутатор |\n\n### Мост (bridge)\n- Използва се за **сегментиране на мрежата**:\n  - **по-малки колизионни домейни**;\n  - **по-голяма ефективност** на мрежата;\n  - **НЕ ограничава broadcast трафика**.\n- Мостът **избирателно предава данни между два сегмента**: **научава MAC адресите** на всички устройства от всеки свързан сегмент → **изгражда бридж таблица** → **препраща или блокира** трафика въз основа на нея.\n\n### Комутатор (switch)\n- Изгражда **виртуални вериги между 2 свързани устройства**, които са **само за комуникацията между тях**.\n- Осигурява **микросегментация**:\n  - **максимизира достъпната bandwidth**;\n  - изгражда **няколко едновременни виртуални вериги**;\n  - **CSMA/CD се прилага само в half-duplex** комуникации — **full-duplex комутаторите не използват CSMA/CD**;\n  - **изпраща broadcast до всички устройства** в мрежата.\n- **Предназначение** (hub → switch): **да изолира трафика между сегментите** и **да осигури по-добра bandwidth** за крайните устройства, като **създава по-малки колизионни домейни**.\n- **Микросегментация** — чрез **отделни мрежови сегменти (point-to-point връзки)**: всеки хост на отделен порт.\n\n### Колизионни и бродкаст домейни\n- **Всички хостове, свързани към комутатора, са в един и същ бродкаст домейн**; бродкастите от едно устройство достигат всички устройства, свързани с комутатори към него.\n- Пример от слайда (два комутатора, ARP Request): **две подмрежи, няколко колизионни домейна — по един на порт на комутатора, но един бродкаст домейн**.\n- **Бродкастите (наводняване) преминават през комутатора**, когато се изпраща:\n  - **уникаст за непознат хост** (няма MAC адреса му в таблицата);\n  - **бродкаст на слой 2** (дестинационен MAC `FF:FF:FF:FF:FF:FF`);\n  - **мултикаст** — до група устройства (на слой 3).\n- Това е **логическо, а не физическо** представяне на случващото се в комутатора.\n- Сегментиране (схема Bridge / LAN switch / Router): **всеки рутер намалява размера на бродкаст домейна**, **всеки комутатор намалява колизионния домейн до една връзка**.\n\n### Сегментиране с маршрутизатори\n- Маршрутизаторите също **сегментират** мрежата.\n- Разделят мрежата **на колизионни и на бродкаст домейни**.\n- Осигуряват **връзка между различни мрежи**.\n- **Добавят забавяне от 20% до 30%**, т.к. **определят най-добрия път** на база **логически (IP, IPX…) адреси**.\n\n| Устройство | Колизионни домейни | Бродкаст домейни |\n|---|---|---|\n| Концентратор (hub) | не дели — един общ | не дели |\n| Мост / комутатор | **дели** (комутатор — по един на порт) | **не дели** (бродкастът минава) |\n| Маршрутизатор | дели | **дели** |\n\n### Режими на портовете на комутатора\n- **Режим на предаване (duplex)**: **auto** — автоматично договаряне на duplex режим; **full** — full-duplex; **half** — half-duplex.\n- **Тип на кабела (auto-MDIX)**: **switch-to-switch → cross-over**, **switch-to-router → straight-through**; **но ако се конфигурира MDIX, може да се ползва какъвто и да е кабел**, независимо от другото устройство.\n\n| Локален край Auto-MDIX | Отдалечен край Auto-MDIX | С правилен кабел | С грешен кабел |\n|---|---|---|---|\n| On | On | Link up | Link up |\n| On | Off | Link up | Link up |\n| Off | On | Link up | Link up |\n| **Off** | **Off** | Link up | **Link down** |\n\n- Достатъчно е **поне единият край** да е с включен auto-MDIX.\n\n### Симетричен и асиметричен комутатор\n- **Симетричен** — всички портове с **еднаква пропускателна способност** (напр. всички 100 Mb/s).\n- **Асиметричен** — портове с **различна** пропускателна способност (напр. 1000 Mb/s към сървъра и 100 Mb/s към клиентите).\n\n### Буфериране\n- Нужно е, **когато дестинационният порт е зает** и при техника **store-and-forward**.\n- **За всеки порт — отделен буфер — Port-based Memory Buffering**: опашката от фреймове се формира **за конкретния порт**.\n- **Обща памет — Shared Memory Buffering**: всички фреймове са **в обща памет** и **не формират отделни опашки** за всеки порт.\n\n### Layer 2 / Layer 3 комутатори\n- **Layer 2**: взема решения **само по MAC адреси**; **не следи мрежови протоколи**; **не следи потребителски приложения**.\n- **Layer 3**: взема решения по **MAC адреси** и изгражда бридж таблица, **но използва и IP адреси (от 3 слой) — маршрутизиране**; има **специален хардуер** и препраща **по-бързо от маршрутизатор или Layer 2 комутатор**.\n\n### Бридж (CAM) таблица\n- **Мостовете и комутаторите** попълват бридж таблица, за да я използват **за препращане на уникасти**.\n- Съхранява се **в RAM**.\n- Попълване: **чете се MAC адресът на сорса** на всеки получен фрейм → записва се двойката **номер на порт – MAC адрес** (портът, по който е получен фреймът) → **проверява се за запис на дестинационния MAC адрес**.\n- Ако дестинационният MAC е намерен в **CAM таблицата (Source Address Table)** → фреймът се изпраща **само на този порт**.\n- Ако **не е намерен** → изпраща се **на всички портове с изключение на порта, по който е постъпил**.\n- Таблицата **може да съдържа няколко записа за един порт**, ако към него е свързан **концентратор**.\n- **MAC адресът на сорса стои в таблицата 5 минути** (за повечето производители); **броят на записите зависи от размера на кеша, в повечето случаи 1024**.\n- Устройствата **научават дестинационните MAC адреси от ARP кеша и ARP Requests**.\n\n### Работа на комутатора (алгоритъм)\n1. **Получава фрейм**.\n2. **Научава сорсовия MAC адрес и стартира таймер**, или ако вече е в таблицата — **рестартира таймера**.\n3. Дестинационният MAC е **бродкаст, мултикаст или непознат уникаст**? → **да**: **изпраща на всички портове**.\n4. Иначе: дестинационният и сорсовият MAC са **на един и същ порт**? → **да**: **не изпраща на никой** (филтрира).\n5. Иначе → **изпраща на конкретния порт**.\n\n- Пример: хостове 1111 (порт 1), 3333 (порт 6), 4444 (порт 9), 2222. 1111 → 3333: записва **1 – 1111**, 3333 е непознат → наводнява. 3333 → 1111: записва **6 – 3333**, препраща само на порт 1. 4444 → 3333: записва **9 – 4444**. При едновременни фреймове към един порт — **няма колизия, има буфериране на фреймовете**.\n- Пример „Колизионен домейн“: към порт 1 чрез хъб са 1111, 2222 и 5555 → в таблицата **три записа за порт 1**; фрейм от 3333 към 1111 излиза на порт 1 и **хъбът го разпраща до 1111, 2222 и 5555** (те са общ колизионен домейн).\n\n### Закъснение в комутатора и „тесни места“\n- **Закъснение (latency) в комутатора** — от момента, в който фреймът **постъпва**, до момента, в който **краят на фрейма напусне** комутатора.\n- Зависи от **конфигурираните процеси на комутация** и **обема на трафика**.\n- **Премахване на „тесни места“ (bottlenecks)**: **връзки с по-голям капацитет** и **по-голям брой връзки**.\n\n### Методи на предаване на комутатора\n| Метод | Как работи | Плюс / минус |\n|---|---|---|\n| **Store-and-forward** | **целият фрейм се получава** → чете dest/src MAC → проверява бридж таблицата → **проверява CRC**; при вярна CRC препраща, иначе **изхвърля** фрейма | надежден, но най-голямо закъснение; изисква буфериране |\n| **Cut-through** (общо) | предаването започва **преди целият фрейм да е постъпил**; чете MAC адресите, проверява таблицата, **без проверка на CRC** | **по-малко закъснение за сметка на откриването на грешки** |\n| **Fast-forward** (cut-through) | препраща **веднага след прочитане на дестинационния MAC** | **най-малко закъснение**; фрейм с грешна CRC или парче от фрейм (прекъснат от **jam сигнал**) заема bandwidth и се **отхвърля чак от NIC на дестинацията** |\n| **Fragment-free** (cut-through) | **изчаква да получи 64 bytes**; ако фреймът е по-дълъг — препраща | филтрира **колизионните фрагменти (< 64 bytes)**; фрейм > 64 B с грешна CRC пак минава |\n| **Adaptive cut-through** | cut-through, **докато открие определен брой грешки (threshold)** → преминава в **store-and-forward** | комбинира двата |\n\n- **Фрагменти** — парчета от фреймове с грешни/липсващи CRC; **колизионните фрагменти са по-къси от 64 bytes**; всеки фрейм > 64 bytes се приема за валиден.\n\n### Капани за изпита\n- Мостът и комутаторът **намаляват колизионните домейни, но НЕ ограничават broadcast**; бродкаст домейните се делят от **маршрутизатора**.\n- „Няколко колизионни домейна (по един на порт) — **един** бродкаст домейн“ при комутатори.\n- Наводняване (към всички портове без входящия) при: **непознат уникаст, L2 бродкаст, мултикаст**. Ако dest и src са **на един и същ порт → не се изпраща никъде**.\n- В бридж таблицата се записва **сорсовият** MAC и **портът, по който е дошъл** фреймът; решението за препращане е по **дестинационния** MAC.\n- Бридж таблица: в **RAM**; **5 минути**; **~1024 записа** (по лекцията); няколко записа на един порт = **хъб** зад порта.\n- Рутер: **+20–30%** забавяне.\n- CSMA/CD — **само при half-duplex**; full-duplex комутаторите **не** го използват.\n- Без auto-MDIX: **switch–switch = cross-over**, **switch–router = straight-through**. **Link down** само при **Off/Off и грешен кабел**.\n- **Fast-forward** чака само **дестинационния MAC** (най-бърз); **fragment-free** чака **64 bytes**; **store-and-forward** — **целия фрейм + CRC**; **adaptive** превключва към store-and-forward след **праг (threshold)**
