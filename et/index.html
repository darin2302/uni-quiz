"}],"B":[{"id":"L05-B-1","n":1,"text":"Волтметър в мрежата показва 230 V. Колко е амплитудата на напрежението?","opts":["163 V","325 V","230 V","460 V"],"correct":1,"expl":"Уредите показват ефективна стойност: Uₘ = √2·U = 1,414·230 ≈ **325 V**."},{"id":"L05-B-2","n":2,"text":"Периодът на синусоидален ток е T = 4 ms. Каква е честотата?","opts":["250 Hz","25 Hz","4 Hz","2,5 kHz"],"correct":0,"expl":"f = 1/T = 1/0,004 s = **250 Hz**."},{"id":"L05-B-3","n":3,"text":"Кръговата честота е ω = 1000 rad/s. Колко е честотата f?","opts":["1000 Hz","318 Hz","6283 Hz","159 Hz"],"correct":3,"expl":"f = ω/(2π) = 1000/6,283 ≈ **159 Hz**. 318 Hz е грешката f = ω/π."},{"id":"L05-B-4","n":4,"text":"Коя е дефиницията за ефективна стойност на променлив ток?","opts":["най-голямата стойност, която токът достига за период","средноаритметичната стойност на тока за половин период","постоянен ток, отделящ в същото R същата топлина за период","стойността на тока в момента t = 0 на наблюдението"],"correct":2,"expl":"Ефективната стойност е **топлинен еквивалент** — постоянен ток със същото топлинно действие."},{"id":"L05-B-5","n":5,"text":"Как се записва фазата θ(t) на тока i(t) = Iₘ·sin(ωt + ψᵢ)?","opts":["θ(t) = ωt + ψᵢ","θ(t) = ψᵢ","θ(t) = ωt","θ(t) = Iₘ·ωt"],"correct":0,"expl":"Фазата е целият аргумент на синуса: **θ(t) = ωt + ψᵢ**; при t = 0 тя е равна на ψᵢ."},{"id":"L05-B-6","n":6,"text":"Колко е средната стойност на тока i(t) = 5·sin(1000t) A за един цял период?","opts":["3,18 A","3,54 A","0 A","5,00 A"],"correct":2,"expl":"За цял период положителната и отрицателната полувълна се компенсират → **0**. 3,18 A е за ½ период."},{"id":"L05-B-7","n":7,"text":"Ток и напрежение имат еднакви начални фази (φ = 0). Как се наричат?","opts":["противофазни","в квадратура","дефазирани","синфазни (във фаза)"],"correct":3,"expl":"При φ = 0 величините са **синфазни** — достигат максимумите си едновременно."},{"id":"L05-B-8","n":8,"text":"При f = 50 Hz на какво закъснение във времето отговаря фазова разлика φ = 90°?","opts":["5 ms","10 ms","20 ms","2,5 ms"],"correct":0,"expl":"90° е ¼ от периода: T/4 = 20 ms/4 = **5 ms**."},{"id":"L05-B-9","n":9,"text":"Коя е мерната единица на честотата f?","opts":["rad/s","херц (Hz = 1/s)","секунда (s)","радиан (rad)"],"correct":1,"expl":"Честотата f = 1/T се мери в **Hz = s⁻¹**."},{"id":"L05-B-10","n":10,"text":"На колко е равен коефициентът на амплитудата Iₘ/I за синусоидален ток?","opts":["1,11","0,707","√2 ≈ 1,41","2/π ≈ 0,64"],"correct":2,"expl":"Iₘ = √2·I → Iₘ/I = **√2 ≈ 1,41**. 1,11 е коефициентът на формата."}],"C":[{"id":"L05-C-1","n":1,"text":"Дадено е u(t) = 100·sin(628t − 45°) V. Колко е честотата?","opts":["628 Hz","100 Hz","200 Hz","314 Hz"],"correct":1,"expl":"f = ω/(2π) = 628/6,28 = **100 Hz**."},{"id":"L05-C-2","n":2,"text":"Дадено е u(t) = 100·sin(628t − 45°) V. Какво ще покаже волтметър?","opts":["100 V","63,7 V","70,7 V","141 V"],"correct":2,"expl":"Волтметърът показва ефективната стойност: U = 100/√2 ≈ **70,7 V**."},{"id":"L05-C-3","n":3,"text":"Колко радиана са 30°?","opts":["≈ 0,3 rad","≈ 1,047 rad","≈ 0,785 rad","≈ 0,524 rad"],"correct":3,"expl":"30°·π/180 = π/6 ≈ **0,524 rad**."},{"id":"L05-C-4","n":4,"text":"Ако ψᵤ = 10° и ψᵢ = 40°, каква е фазовата разлика и кое изпреварва?","opts":["φ = −30°, токът изпреварва","φ = 30°, напрежението изпреварва","φ = 50°, токът изпреварва","φ = −50°, напрежението изпреварва"],"correct":0,"expl":"φ = ψᵤ − ψᵢ = 10° − 40° = **−30° < 0** → токът изпреварва."},{"id":"L05-C-5","n":5,"text":"Каква е моментната стойност на тока i(t) = 10·sin(ωt + 30°) A в момента t = 0?","opts":["10 A","5 A","8,66 A","7,07 A"],"correct":1,"expl":"i(0) = 10·sin 30° = 10·0,5 = **5 A**."},{"id":"L05-C-6","n":6,"text":"Амперметър показва I = 2 A. Колко е амплитудата на синусоидалния ток?","opts":["2,00 A","1,41 A","4,00 A","2,83 A"],"correct":3,"expl":"Iₘ = √2·I = 1,414·2 ≈ **2,83 A**."},{"id":"L05-C-7","n":7,"text":"Каква стойност показват амперметрите и волтметрите за променлив ток?","opts":["амплитудната","моментната","ефективната","средната за период"],"correct":2,"expl":"Уредите за променлив ток са градуирани в **ефективни** стойности."},{"id":"L05-C-8","n":8,"text":"По коя формула се намира средната стойност на синусоидален ток за половин период?","opts":["I_ср = 2Iₘ/π","I_ср = Iₘ/√2","I_ср = Iₘ/2","I_ср = √2·Iₘ"],"correct":0,"expl":"I_ср = (2/T)∫₀^{T/2} Iₘ sin ωt dt = **2Iₘ/π ≈ 0,637·Iₘ**."},{"id":"L05-C-9","n":9,"text":"При каква фазова разлика две синусоиди са в противофаза?","opts":["φ = 0°","φ = 90°","φ = 45°","φ = 180°"],"correct":3,"expl":"Противофаза: **φ = 180° (π rad)** — когато едната е в максимум, другата е в минимум."},{"id":"L05-C-10","n":10,"text":"Iₘ = 4 A, ω = 500 rad/s, ψᵢ = −60°. Кой е правилният запис на тока?","opts":["i(t) = 4·sin(500t + 60°) A","i(t) = 2,83·sin(500t − 60°) A","i(t) = 4·sin(500t − 60°) A","i(t) = 4·sin(80t − 60°) A"],"correct":2,"expl":"i(t) = Iₘ·sin(ωt + ψᵢ) = **4·sin(500t − 60°) A**; ω се пише директно (не f ≈ 80 Hz)."}]}},{"num":6,"title":"Тема 6 — Идеални елементи R, L и C в променливотокова верига","short":"Идеални елементи R, L и C в променливотокова верига","summary":"### Общ подход\n- Изследваме поотделно трите **идеални елемента** — резистор R, бобина L и кондензатор C — захранени със синусоидално напрежение. За всеки търсим: **закона за тока i(t)**, **дефазирането φ = ψᵤ − ψᵢ**, **моментната мощност p(t) = u(t)·i(t)** и **средната (активната) мощност P_ср = (1/T)·∫₀ᵀ p(t) dt**.\n- Единици: R, X_L, X_C — **Ω**; L — **H (хенри)**; C — **F (фарад)**; проводимост G = 1/R — **S (сименс)**.\n\n### I) Верига с резистор R\n- Дадено: u(t) = Uₘ·sin(ωt + ψᵤ), R. По закона на Ом: **i(t) = u(t)/R = (Uₘ/R)·sin(ωt + ψᵤ)**, т.е. **Iₘ = Uₘ/R**, I = U/R.\n- **ψᵢ = ψᵤ → φ = 0**: токът и напрежението са **във фаза**. Токът тече по посока на напрежението.\n- Моментна мощност: p(t) = u·i = U·I·(1 − cos 2ωt) **≥ 0** — пулсира с двойна честота 2ω, но никога не е отрицателна.\n- **P_ср = (1/T)·∫₀ᵀ p dt = U·I = R·I² = U²/R** [W] — резисторът **необратимо** превръща електрическата енергия в топлина.\n\n### II) Верига с идеална бобина L\n- При изменение на тока в бобината се индуктира **ЕДН на самоиндукция e_L = −L·di/dt** (правило на Ленц):\n  - при **нарастване** на i, e_L действа **срещу** тока;\n  - при **намаляване** на i, e_L действа **по посока** на тока.\n- Приложеното напрежение уравновесява e_L: **u = −e_L = L·di/dt** → **i = (1/L)·∫u dt**.\n- Нека u(t) = Uₘ·sin ωt (ψᵤ = 0):\n  i = (1/L)·∫Uₘ sin ωt dt = (Uₘ/(ωL))·(−cos ωt), а от справочника −cos α = sin(α − π/2) →\n  **i(t) = (Uₘ/(ωL))·sin(ωt − π/2) = Iₘ·sin(ωt − π/2)**.\n- **Индуктивно (реактивно) съпротивление X_L = ωL = 2πfL** [Ω]; **Iₘ = Uₘ/X_L**, I = U/X_L.\n- ψᵢ = −π/2, ψᵤ = 0 → **φ = ψᵤ − ψᵢ = +π/2 = +90°**: **токът изостава** от напрежението с 90° (напрежението изпреварва тока).\n- Моментна мощност: p(t) = u·i = Uₘ sin ωt·(−Iₘ cos ωt) = −(UₘIₘ/2)·sin 2ωt = **−U·I·sin 2ωt** — сменя знака с двойна честота: една четвърт период бобината **поема** енергия (натрупва я в магнитното поле, W_L = L·i²/2), следващата четвърт я **връща** на източника.\n- **P_ср = 0** — идеалната бобина **не консумира активна мощност**. Обменяната мощност се характеризира с **реактивната мощност Q_L = U·I = X_L·I²** [VAr].\n- X_L расте линейно с честотата; при **постоянен ток (f = 0) X_L = 0** — бобината е „късо съединение“.\n\n### III) Верига с идеален кондензатор C\n- Зарядът е **Q = C·u**, а токът **i = dQ/dt = C·du/dt**:\n  - при **нарастване** на u протича **заряден** ток;\n  - при **намаляване** на u — **разряден** ток.\n- При u(t) = Uₘ·sin ωt: i = C·d(Uₘ sin ωt)/dt = ωC·Uₘ·cos ωt = (Uₘ/(1/(ωC)))·cos ωt →\n  **i(t) = (Uₘ/X_C)·sin(ωt + π/2)**.\n- **Капацитивно (реактивно) съпротивление X_C = 1/(ωC) = 1/(2πfC)** [Ω]; **Iₘ = Uₘ/X_C**, I = U/X_C = U·ωC.\n- ψᵢ = +π/2 → **φ = −90°**: **токът изпреварва** напрежението с 90°.\n- p(t) = U·I·sin 2ωt; **P_ср = 0**; енергията се натрупва в електричното поле (W_C = C·u²/2) и се връща. Реактивна мощност Q_C = X_C·I² (в RLC верига се взима със знак „−“).\n- X_C намалява с честотата; при **постоянен ток (f = 0) X_C → ∞** — кондензаторът „прекъсва“ веригата.\n\n### Сравнителна таблица R – L – C\n\n| | R | L | C |\n|---|---|---|---|\n| Връзка u–i | u = R·i | u = L·di/dt | i = C·du/dt |\n| Съпротивление | R | X_L = ωL | X_C = 1/(ωC) |\n| Зависимост от f | не зависи | расте ∝ f | намалява ∝ 1/f |\n| При f = 0 (DC) | R | 0 (късо) | ∞ (прекъсване) |\n| φ = ψᵤ − ψᵢ | 0 | +90° (+π/2) | −90° (−π/2) |\n| Кое изпреварва | във фаза | **напрежението** изпреварва | **токът** изпреварва |\n| p(t) | U·I·(1 − cos 2ωt) ≥ 0 | −U·I·sin 2ωt | U·I·sin 2ωt |\n| P_ср | U·I = R·I² | 0 | 0 |\n| Енергия | топлина (необратимо) | магнитно поле L·i²/2 | електрично поле C·u²/2 |\n\n\n- Реактивни **проводимости**: **B_L = 1/(ωL)** [S], **B_C = ωC** [S], активна **G = 1/R** [S] (използват се при паралелно свързване, тема 7).\n\n### Посоки на тока и напрежението (от записките)\n- **R** — токът тече по посока на напрежението и обратно (във фаза).\n- **L** — напрежението изпреварва тока (векторът U е завъртян на 90° напред, по посока на въртене ω).\n- **C** — токът изпреварва напрежението.\n- Помощно правило: „**L — U преди I**, **C — I преди U**“.\n\n### Числени примери\n- **L = 10 mH, ω = 2000 rad/s**: X_L = 2000·10·10⁻³ = **20 Ω**. При I = 2 A → U_L = X_L·I = 40 V.\n- **C = 20 µF, ω = 2000 rad/s**: X_C = 1/(2000·20·10⁻⁶) = 1/0,04 = **25 Ω**. При I = 2 A → U_C = 50 V.\n- **L = 0,1 H при f = 50 Hz**: X_L = 314·0,1 = **31,4 Ω**; при U = 230 V → I = 230/31,4 ≈ 7,32 A, P = 0, Q_L = U·I ≈ 1684 VAr.\n- **C = 100 µF при f = 50 Hz**: X_C = 1/(314·10⁻⁴) ≈ **31,8 Ω**.\n- **R = 50 Ω, U = 100 V**: I = 2 A, P = U·I = R·I² = 200 W, φ = 0.\n\n### Капани за изпита\n- **Посоката на дефазирането:** при L **токът изостава** (φ = +90°), при C **токът изпреварва** (φ = −90°). Не ги разменяйте; φ винаги = ψᵤ − ψᵢ.\n- **Префикси:** 1 mH = 10⁻³ H, 1 µF = 10⁻⁶ F, 1 nF = 10⁻⁹ F, 1 pF = 10⁻¹² F. Ако забравите 10⁻⁶ при µF, X_C излиза милиони пъти грешно. В записките (лаб. 3) „C = 246 mF = 0,246 F“ е грешно изписано — от изчисленото X_C ≈ 12,95 Ω при ω = 314 rad/s следва **C = 246 µF = 246·10⁻⁶ F**.\n- **X_L = ωL, а не fL**; X_C = 1/(ωC), а не ωC (ωC е проводимостта B_C).\n- **Средна мощност на идеални L и C е нула** — те само обменят енергия с източника. Активна мощност се отделя само в R.\n- Моментната мощност пулсира с **двойна** честота 2ω.\n- В записките (Л#6, резистор) е написано „P_ср = U·I … обратимо преобразува ел. енергия“ — за резистора преобразуването е **необратимо** (в топлина); обратим обмен има при L и C.\n- **Амплитуда или ефективна:** Iₘ = Uₘ/X и I = U/X са еднакво верни — но не смесвайте Uₘ с I.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L06-A-1","n":1,"text":"Каква е фазовата разлика φ = ψᵤ − ψᵢ при идеален резистор?","opts":["0","+90°","−90°","180°"],"correct":0,"expl":"При R u = R·i → токът и напрежението са **във фаза**, φ = 0."},{"id":"L06-A-2","n":2,"text":"Как е дефазиран токът спрямо напрежението при идеална бобина?","opts":["изпреварва го с 90°","изостава с 90°","във фаза е с него","изостава с 180°"],"correct":1,"expl":"i = Iₘ·sin(ωt − π/2) — токът **изостава** с 90°, φ = +90°."},{"id":"L06-A-3","n":3,"text":"Колко е X_L на бобина L = 10 mH при ω = 2000 rad/s?","opts":["0,2 Ω","200 Ω","20 Ω","2 Ω"],"correct":2,"expl":"X_L = ωL = 2000·10·10⁻³ = **20 Ω**."},{"id":"L06-A-4","n":4,"text":"Колко е X_C на кондензатор C = 20 µF при ω = 2000 rad/s?","opts":["0,04 Ω","40 Ω","2,5 Ω","25 Ω"],"correct":3,"expl":"X_C = 1/(ωC) = 1/(2000·20·10⁻⁶) = 1/0,04 = **25 Ω**."},{"id":"L06-A-5","n":5,"text":"Каква е средната (активна) мощност на идеална бобина за един период?","opts":["U·I","нула","X_L·I²","U·I/2"],"correct":1,"expl":"p = −U·I·sin 2ωt → средната за период е **0**; X_L·I² е реактивната мощност Q_L."},{"id":"L06-A-6","n":6,"text":"Коя зависимост е вярна за идеален кондензатор?","opts":["i = C·du/dt","u = C·di/dt","i = (1/C)·du/dt","u = C·i"],"correct":0,"expl":"Q = C·u → **i = dQ/dt = C·du/dt**."},{"id":"L06-A-7","n":7,"text":"Как се държи идеална бобина в установен режим при постоянен ток (f = 0)?","opts":["като прекъсване","като R = ωL","като късо съединение","като кондензатор"],"correct":2,"expl":"X_L = ωL = 0 при ω = 0 → бобината е **късо съединение**."},{"id":"L06-A-8","n":8,"text":"Резистор R = 50 Ω е включен на U = 100 V (ефективна). Колко е активната мощност?","opts":["100 W","50 W","400 W","200 W"],"correct":3,"expl":"I = U/R = 2 A; P = U·I = R·I² = **200 W**."},{"id":"L06-A-9","n":9,"text":"С каква честота пулсира моментната мощност p(t) в променливотокова верига?","opts":["с честотата ω","с двойната честота 2ω","с половин честота ω/2","не пулсира"],"correct":1,"expl":"p = u·i съдържа sin 2ωt или cos 2ωt → **2ω**."},{"id":"L06-A-10","n":10,"text":"Какво е правилото на Ленц за ЕДН на самоиндукция e_L при нарастващ ток?","opts":["e_L действа срещу тока","e_L действа по посока на тока","e_L е нула","e_L е във фаза с тока"],"correct":0,"expl":"e_L = −L·di/dt: при di/dt > 0 e_L е **срещу** тока (при намаляване — по посока на тока)."}],"B":[{"id":"L06-B-1","n":1,"text":"Как е дефазиран токът спрямо напрежението при идеален кондензатор?","opts":["изостава с 90°","във фаза е с него","изпреварва го с 90°","изостава с 45°"],"correct":2,"expl":"i = (Uₘ/X_C)·sin(ωt + π/2) — токът **изпреварва** с 90°, φ = −90°."},{"id":"L06-B-2","n":2,"text":"По коя формула се пресмята индуктивното съпротивление?","opts":["X_L = 1/(ωL)","X_L = ωL","X_L = fL","X_L = L/ω"],"correct":1,"expl":"**X_L = ωL = 2πfL**; 1/(ωL) е индуктивната проводимост B_L."},{"id":"L06-B-3","n":3,"text":"Бобина L = 0,1 H е включена при f = 50 Hz. Колко е X_L?","opts":["5 Ω","3,18 Ω","0,0318 Ω","31,4 Ω"],"correct":3,"expl":"X_L = 2πfL = 314·0,1 ≈ **31,4 Ω**."},{"id":"L06-B-4","n":4,"text":"Кондензатор C = 100 µF е включен при f = 50 Hz. Колко е X_C?","opts":["31,8 Ω","0,0314 Ω","3,18 Ω","318 Ω"],"correct":0,"expl":"X_C = 1/(2πfC) = 1/(314·100·10⁻⁶) ≈ **31,8 Ω**."},{"id":"L06-B-5","n":5,"text":"Как се изменя X_C, ако честотата се увеличи 2 пъти?","opts":["увеличава се 2 пъти","не се изменя","намалява 2 пъти","намалява 4 пъти"],"correct":2,"expl":"X_C = 1/(ωC) е обратно пропорционално на ω → **намалява 2 пъти**."},{"id":"L06-B-6","n":6,"text":"Каква е моментната мощност на идеална бобина при u = Uₘ·sin ωt?","opts":["p = U·I·(1 − cos 2ωt)","p = U·I","p = 0","p = −U·I·sin 2ωt"],"correct":3,"expl":"i = −Iₘ cos ωt → p = −UₘIₘ sin ωt cos ωt = **−U·I·sin 2ωt**."},{"id":"L06-B-7","n":7,"text":"Бобина с X_L = 20 Ω е под напрежение U = 100 V. Колко е токът I?","opts":["5 A","2000 A","0,2 A","50 A"],"correct":0,"expl":"I = U/X_L = 100/20 = **5 A**."},{"id":"L06-B-8","n":8,"text":"Какво е напрежението на идеална бобина спрямо тока?","opts":["u = L·i","u = (1/L)·∫i dt","u = L·di/dt","u = −L·i"],"correct":2,"expl":"u = −e_L = **L·di/dt**, откъдето i = (1/L)·∫u dt."},{"id":"L06-B-9","n":9,"text":"Къде се натрупва енергията в идеален кондензатор?","opts":["в магнитното поле, W = L·i²/2","в електричното поле, W = C·u²/2","превръща се в топлина","в съпротивлението на изводите"],"correct":1,"expl":"Кондензаторът натрупва енергия в **електричното поле**: W_C = C·u²/2."},{"id":"L06-B-10","n":10,"text":"Кой елемент необратимо превръща електрическата енергия в топлина?","opts":["идеалната бобина","идеалният кондензатор","и трите еднакво","резисторът R"],"correct":3,"expl":"Само в **R** P_ср = R·I² > 0; L и C само обменят енергия с източника."}],"C":[{"id":"L06-C-1","n":1,"text":"Каква е стойността на φ = ψᵤ − ψᵢ при идеална бобина?","opts":["+90° (+π/2)","−90° (−π/2)","0°","+180° (+π)"],"correct":0,"expl":"ψᵤ = 0, ψᵢ = −π/2 → φ = **+π/2**."},{"id":"L06-C-2","n":2,"text":"Кондензатор C = 10 µF при ω = 1000 rad/s. Колко е X_C?","opts":["10 Ω","0,01 Ω","1000 Ω","100 Ω"],"correct":3,"expl":"X_C = 1/(1000·10·10⁻⁶) = 1/0,01 = **100 Ω**."},{"id":"L06-C-3","n":3,"text":"Бобина L = 50 mH при ω = 400 rad/s. Колко е X_L?","opts":["8 Ω","20 Ω","20 000 Ω","0,05 Ω"],"correct":1,"expl":"X_L = ωL = 400·0,05 = **20 Ω**."},{"id":"L06-C-4","n":4,"text":"Кондензатор с X_C = 25 Ω и ток I = 2 A. Колко е напрежението U_C?","opts":["12,5 V","27 V","50 V","0,08 V"],"correct":2,"expl":"U_C = X_C·I = 25·2 = **50 V**."},{"id":"L06-C-5","n":5,"text":"Как се държи идеален кондензатор в установен режим при постоянен ток?","opts":["като късо съединение","като резистор 1/C","като бобина","като прекъсване"],"correct":3,"expl":"X_C = 1/(ωC) → ∞ при ω = 0 → **прекъсване** на веригата."},{"id":"L06-C-6","n":6,"text":"Как се изменя X_L, ако честотата се увеличи 3 пъти?","opts":["увеличава се 3 пъти","намалява 3 пъти","не се изменя","увеличава се 9 пъти"],"correct":0,"expl":"X_L = ωL е право пропорционално на ω → **3 пъти по-голямо**."},{"id":"L06-C-7","n":7,"text":"Каква е мерната единица на индуктивността L?","opts":["фарад (F)","хенри (H)","сименс (S)","ом (Ω)"],"correct":1,"expl":"Индуктивността се мери в **хенри (H)**; капацитетът — във фаради."},{"id":"L06-C-8","n":8,"text":"Кое е вярно за резистор във верига на синусоидален ток?","opts":["p(t) е отрицателна половината време","p(t) = 0 във всеки момент","p(t) ≥ 0 и P = U·I","токът изостава с 90°"],"correct":2,"expl":"p = U·I·(1 − cos 2ωt) **≥ 0**, P_ср = U·I = R·I²."},{"id":"L06-C-9","n":9,"text":"Резистор R = 10 Ω е с ток I = 2 A. Колко е активната мощност?","opts":["20 W","400 W","5 W","40 W"],"correct":3,"expl":"P = R·I² = 10·4 = **40 W** (не 400 W — грешка от записките)."},{"id":"L06-C-10","n":10,"text":"Коя е капацитивната проводимост B_C?","opts":["B_C = ωC","B_C = 1/(ωC)","B_C = C/ω","B_C = 1/C"],"correct":0,"expl":"**B_C = ωC** [S] — реципрочна на X_C = 1/(ωC)."}]}},{"num":7,"title":"Тема 7 — Последователна и паралелна RLC верига, мощности","short":"Последователна и паралелна RLC верига, мощности","summary":"### I) Последователно свързване на R, L, C\n- При последователно свързване **токът е един и същ** за всички елементи: i(t) = Iₘ·sin(ωt + ψᵢ).\n- **II закон на Кирхоф (за моментните стойности):** u_R + u_L + u_C = u ⇔ R·i + L·di/dt + (1/C)·∫i dt = u.\n- Ефективни стойности на напреженията:\n  - **U_R = R·I** — във фаза с тока;\n  - **U_L = X_L·I = ωL·I** — изпреварва тока с 90°;\n  - **U_C = X_C·I = I/(ωC)** — изостава от тока с 90°.\n- U_L и U_C са в противофаза, затова **не се събират аритметично**. От векторната диаграма (правоъгълен триъгълник):\n  **U = √(U_R² + (U_L − U_C)²) = I·√(R² + (X_L − X_C)²) = Z·I**.\n- **Пълно съпротивление (импеданс): Z = √(R² + (X_L − X_C)²)** [Ω]; също Z = U/I. Реактивното съпротивление е **X = X_L − X_C**.\n- **Фазова разлика: φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R)**; cos φ = R/Z, sin φ = X/Z.\n\n### Триъгълник на съпротивленията и характер на веригата\n- Катети **R** (хоризонтален) и **X = X_L − X_C** (вертикален), хипотенуза **Z**; ъгълът между R и Z е **φ**.\n\n| Условие | φ | Характер | Кое изпреварва |\n|---|---|---|---|\n| X_L > X_C | φ > 0 | **индуктивен** | напрежението изпреварва тока |\n| X_L < X_C | φ < 0 | **капацитивен** | токът изпреварва напрежението |\n| X_L = X_C | φ = 0 | **активен (резонанс)** | във фаза; Z = R минимално |\n\n- При X_L = X_C (ω₀ = 1/√(LC)) напреженията U_L и U_C се компенсират — **резонанс на напреженията**; токът е максимален, I = U/R.\n\n### II) Паралелно свързване на R, L, C\n- При паралелно свързване **напрежението е едно и също** за всички клонове.\n- **I закон на Кирхоф:** i_R + i_L + i_C = i.\n- Токове в клоновете (ефективни):\n  - **I_R = G·U = U/R** — във фаза с U;\n  - **I_L = B_L·U = U/(ωL)** — изостава от U с 90°;\n  - **I_C = B_C·U = U·ωC** — изпреварва U с 90°.\n- **I = √(I_R² + (I_L − I_C)²) = U·√(G² + (B_L − B_C)²) = Y·U**.\n- **Проводимости** [S, сименс]: **G = 1/R** (активна), **B_L = 1/(ωL)** (реактивна индуктивна), **B_C = ωC** (реактивна капацитивна), **Y = √(G² + (B_L − B_C)²)** (пълна), Y = I/U.\n- **φ = arctg((B_L − B_C)/G)**: при B_L > B_C (I_L > I_C) веригата е индуктивна — токът изостава; при B_C > B_L — капацитивна.\n\n### Мощности в променливотокова верига\n\n| Мощност | Означение | Единица | Формули |\n|---|---|---|---|\n| **Активна** | P | W (ват) | P = U·I·cos φ = R·I² (посл.) = G·U² (пар.) |\n| **Реактивна** | Q | VAr (волт-ампер реактивен) | Q = U·I·sin φ = (X_L − X_C)·I² (посл.) = (B_L − B_C)·U² (пар.) |\n| **Пълна (привидна)** | S | VA (волт-ампер) | S = U·I = Z·I² = Y·U² = √(P² + Q²) |\n| **Фактор на мощността** | cos φ | — | cos φ = P/S = R/Z |\n\n- **Активната мощност** се превръща необратимо в топлинна, светлинна, механична енергия; отделя се само в R.\n- **Реактивната мощност** не се преобразува в светлина, топлина и т.н. — тя характеризира обмена на енергия между източника и електрическото/магнитното поле на C и L. **Q > 0** при индуктивен, **Q < 0** при капацитивен характер.\n- **Триъгълник на мощностите** е подобен на триъгълника на съпротивленията (умножен по I²): катети P и Q, хипотенуза S.\n\n### Сравнение последователно / паралелно\n\n| | Последователно | Паралелно |\n|---|---|---|\n| Общо за елементите | ток I | напрежение U |\n| Закон на Кирхоф | U = √(U_R² + (U_L − U_C)²) | I = √(I_R² + (I_L − I_C)²) |\n| „Съпротивление“ | Z = √(R² + (X_L − X_C)²) [Ω] | Y = √(G² + (B_L − B_C)²) [S] |\n| Закон на Ом | U = Z·I | I = Y·U |\n| φ | arctg((X_L − X_C)/R) | arctg((B_L − B_C)/G) |\n| P / Q / S | R·I² / (X_L − X_C)·I² / Z·I² | G·U² / (B_L − B_C)·U² / Y·U² |\n| Амплитуда | Uₘ = √2·U | Iₘ = √2·I |\n| Удобно е да приемем | ψᵢ = 0 | ψᵤ = 0 |\n\n\n### Решена задача (ЕТ/Л/#12 „Примерни задачи“) — последователна RLC верига\nДадено: **R = 10 Ω, L = 10 mH, C = 20 µF, I = 2 A (показание на амперметъра), ω = 2000 rad/s, ψᵢ = 0**. Търси се i(t), u(t), P, Q, S (и показанията на волтметрите V, V_R, V_L, V_C).\n1. **X_L = ωL = 2000·10·10⁻³ = 20 Ω.**\n2. **X_C = 1/(ωC) = 1/(2000·20·10⁻⁶) = 1/0,04 = 25 Ω.** Тъй като X_L < X_C → **капацитивен характер** (токът изпреварва напрежението).\n3. **Z = √(R² + (X_L − X_C)²) = √(100 + 25) = √125 = 5√5 ≈ 11,18 Ω.**\n4. **U_R = R·I = 20 V; U_L = X_L·I = 40 V; U_C = X_C·I = 50 V.**\n5. **U = √(U_R² + (U_L − U_C)²) = √(400 + 100) = 10√5 ≈ 22,36 V** = Z·I (проверка). Забележете: U ≠ 20 + 40 + 50 = 110 V!\n6. **P = R·I² = 10·4 = 40 W.**\n7. **Q = (X_L − X_C)·I² = (20 − 25)·4 = −20 VAr** (минус — капацитивна).\n8. **S = Z·I² = U·I = 5√5·4 = 20√5 ≈ 44,72 VA**; проверка: √(P² + Q²) = √(1600 + 400) = √2000 ≈ 44,72 VA. cos φ = P/S = 40/44,72 ≈ 0,894.\n9. **φ = arctg((X_L − X_C)/R) = arctg(−5/10) = arctg(−0,5) ≈ −26,57°**; ψᵤ = φ + ψᵢ = −26,57°.\n10. **i(t) = I√2·sin(ωt + ψᵢ) = 2√2·sin(2000t) ≈ 2,83·sin(2000t) A.**\n11. **u(t) = U√2·sin(ωt + ψᵤ) = 10√5·√2·sin(2000t − 26,57°) = 10√10·sin(2000t − 26,57°) ≈ 31,62·sin(2000t − 26,57°) V.**\n\n### Домашна задача (ЕТ/Лу/#9)\nДадено: R = 20 Ω, L = 20 mH, C = 20 µF, ω = 1000 rad/s, ψᵢ = 20°, I = 2 A.\n- X_L = 1000·0,02 = **20 Ω**; X_C = 1/(1000·20·10⁻⁶) = **50 Ω**; Z = √(400 + 900) ≈ **36,06 Ω**.\n- U = Z·I ≈ **72,11 V**; Uₘ = √2·U ≈ **101,98 V**.\n- P = R·I² = **80 W**; Q = (X_L − X_C)·I² = **−120 VAr**; S = U·I ≈ **144,22 VA**; cos φ ≈ 0,555.\n- φ = arctg(−30/20) = arctg(−1,5) ≈ **−56,31°** → ψᵤ = ψᵢ + φ = 20° − 56,31° = **−36,31°**.\n- **u(t) ≈ 101,98·sin(1000t − 36,31°) V**; i(t) = 2√2·sin(1000t + 20°) A.\n\n### Лабораторни измервания (ЕТ/Лу/#9)\n**Лаб. 3 (последователна RLC):** измерено R = 93 Ω, L = 47,1 mH = 0,0471 H, C = 246 µF; f = 50 Hz → ω = 2πf ≈ 314 rad/s.\n- X_L = ωL = 314·0,0471 ≈ **14,79 Ω**; X_C = 1/(ωC) = 1/(314·246·10⁻⁶) ≈ **12,95 Ω**.\n- X = X_L − X_C = (ω²LC − 1)/(ωC) ≈ **1,84 Ω** (слабо индуктивен характер, φ ≈ 1,1°).\n- Z = √(93² + 1,84²) ≈ **93,02 Ω** (изчислено).\n- От измерванията: U = 12 V, I = 0,1 A → **Z = U/I = 120 Ω**; U = 12,1 V, I = 0,114 A → **Z ≈ 106,14 Ω**. Разликата с изчисленото идва от активното съпротивление на бобината, неточностите на уредите и т.н. (в записките резултатът U/I е означен с R — всъщност това е **Z**).\n\n**Лаб. 4 (паралелна верига R ∥ C):** U = 12,1 V, C = 56 µF, I_R = 0,14 A, I = 0,25 A.\n- Теоретично I_C = U·ωC = 12,1·314·56·10⁻⁶ ≈ **0,213 A**; I = √(I_R² + I_C²) = √(0,14² + 0,213²) ≈ **0,255 A ≈ 0,25 A** — съвпада с измереното. (В записките I_C е записано като 0,01 A — най-вероятно се има предвид ≈ 0,21 A.)\n\n### Капани за изпита\n- **Знак на φ и Q:** φ = arctg((X_L − X_C)/R). При X_L < X_C → φ < 0 и **Q < 0** (капацитивен характер, токът изпреварва). Не изпускайте минуса в u(t)!\n- **Кое изпреварва:** индуктивен — напрежението изпреварва тока; капацитивен — токът изпреварва напрежението. (В записките „X_L < X_C ⇒ I > U“ означава „**токът изпреварва**“, а не че токът е по-голям от напрежението.)\n- **Напреженията не се събират аритметично:** U = √(U_R² + (U_L − U_C)²), не U_R + U_L + U_C. U_L и U_C поотделно могат да са по-големи от U!\n- **Амплитуда vs ефективна:** амперметрите/волтметрите дават ефективни стойности; в i(t) и u(t) пишем **Iₘ = √2·I, Uₘ = √2·U**.\n- **Градуси vs радиани:** arctg на калкулатора в режим DEG дава градуси; −26,57° = −0,4636 rad. В u(t) не смесвайте ωt (rad) и ψ (°) при пресмятане.\n- **Префикси:** 10 mH = 10·10⁻³ H, 20 µF = 20·10⁻⁶ F. В лаб. 3 „246 mF = 0,246 F“ е грешка — правилно **246 µF**.\n- **Грешка в записките (#12):** „P = R·I² = 400 W“ — при R = 10 Ω, I = 2 A е **P = 40 W**; оттам и зачеркнатото S = √(160000 + 400) е грешно — правилно S = √(40² + 20²) ≈ 44,72 VA.\n- **Грешка в домашната (#9):** u(t) е записано като 101,98·sin(1000t − 20°) — правилно ψᵤ = ψᵢ + φ = 20° − 56,31° = **−36,31°**. Също Q и S са с единици **VAr** и **VA**, а не W.\n- **Проводимости:** G = 1/R (в записките „B_R = R“ е грешно), Y = √(G² + (B_L − B_C)²) — разликата **B_L − B_C се повдига на квадрат**.\n- **Единици:** P — W, Q — VAr, S — VA; cos φ е безразмерен и е между 0 и 1.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L07-A-1","n":1,"text":"Последователна RLC верига: R = 30 Ω, X_L = 60 Ω, X_C = 20 Ω. Колко е Z?","opts":["110 Ω","70 Ω","50 Ω","80 Ω"],"correct":2,"expl":"Z = √(30² + (60 − 20)²) = √(900 + 1600) = **50 Ω**."},{"id":"L07-A-2","n":2,"text":"Последователна RLC верига е с X_L < X_C. Какъв е характерът ѝ?","opts":["капацитивен, φ < 0","индуктивен, φ > 0","активен, φ = 0","капацитивен, φ > 0"],"correct":0,"expl":"X_L − X_C < 0 → φ = arctg((X_L − X_C)/R) **< 0**, **капацитивен** характер."},{"id":"L07-A-3","n":3,"text":"R = 10 Ω, X_L = 20 Ω, X_C = 25 Ω. Колко е φ = ψᵤ − ψᵢ?","opts":["+26,57°","−63,43°","−0,5°","−26,57°"],"correct":3,"expl":"φ = arctg((20 − 25)/10) = arctg(−0,5) ≈ **−26,57°**."},{"id":"L07-A-4","n":4,"text":"P = 40 W и Q = −20 VAr. Колко е пълната мощност S?","opts":["20 VA","44,72 VA","60 VA","34,64 VA"],"correct":1,"expl":"S = √(P² + Q²) = √(1600 + 400) ≈ **44,72 VA**."},{"id":"L07-A-5","n":5,"text":"Активната мощност е P = 80 W, а пълната S = 100 VA. Колко е факторът на мощността?","opts":["0,6","1,25","0,8","0,2"],"correct":2,"expl":"cos φ = P/S = 80/100 = **0,8**."},{"id":"L07-A-6","n":6,"text":"В каква единица се измерва реактивната мощност Q?","opts":["W","VA","J","VAr"],"correct":3,"expl":"Q се мери във **VAr** (волт-ампер реактивен); P — във W, S — във VA."},{"id":"L07-A-7","n":7,"text":"Коя величина е обща за всички елементи при последователно свързване на R, L, C?","opts":["токът","напрежението","мощността","фазата на напрежението"],"correct":0,"expl":"При последователно свързване **токът е един и същ**."},{"id":"L07-A-8","n":8,"text":"Последователна RLC: U_R = 20 V, U_L = 40 V, U_C = 50 V. Колко е общото напрежение U?","opts":["110 V","22,36 V","10 V","30 V"],"correct":1,"expl":"U = √(U_R² + (U_L − U_C)²) = √(400 + 100) ≈ **22,36 V**."},{"id":"L07-A-9","n":9,"text":"Паралелна верига: G = 0,03 S, B_L = 0,06 S, B_C = 0,02 S. Колко е Y?","opts":["0,11 S","0,07 S","0,05 S","0,01 S"],"correct":2,"expl":"Y = √(G² + (B_L − B_C)²) = √(0,0009 + 0,0016) = **0,05 S**."},{"id":"L07-A-10","n":10,"text":"По коя формула се пресмята реактивната мощност при последователна RLC верига?","opts":["Q = R·I²","Q = Z·I²","Q = U·I·cos φ","Q = (X_L − X_C)·I²"],"correct":3,"expl":"**Q = (X_L − X_C)·I² = U·I·sin φ**."}],"B":[{"id":"L07-B-1","n":1,"text":"Какво е условието за резонанс на напреженията в последователна RLC верига?","opts":["R = X_L","X_L = X_C","X_C = 0","Z = X_L + X_C"],"correct":1,"expl":"При **X_L = X_C** реактивното съпротивление е 0, Z = R и φ = 0."},{"id":"L07-B-2","n":2,"text":"Последователна RLC: R = 20 Ω, X_L = 20 Ω, X_C = 50 Ω, I = 2 A. Колко е U?","opts":["180 V","100 V","72,1 V","36,1 V"],"correct":2,"expl":"Z = √(400 + 900) ≈ 36,06 Ω; U = Z·I ≈ **72,1 V**."},{"id":"L07-B-3","n":3,"text":"Последователна RLC: R = 20 Ω, X_L = 20 Ω, X_C = 50 Ω, I = 2 A. Колко е Q?","opts":["−120 VAr","+120 VAr","−60 VAr","+280 VAr"],"correct":0,"expl":"Q = (X_L − X_C)·I² = (20 − 50)·4 = **−120 VAr** (капацитивна)."},{"id":"L07-B-4","n":4,"text":"Коя формула за пълната мощност S е вярна?","opts":["S = P + Q","S = R·I²","S = U·I·cos φ","S = √(P² + Q²)"],"correct":3,"expl":"S = U·I = **√(P² + Q²)** — хипотенуза в триъгълника на мощностите."},{"id":"L07-B-5","n":5,"text":"Коя страна е хипотенуза в триъгълника на съпротивленията?","opts":["R","Z","X_L − X_C","X_C"],"correct":1,"expl":"Катетите са R и X = X_L − X_C, хипотенузата е **Z**."},{"id":"L07-B-6","n":6,"text":"Напрежение U = 100 V, ток I = 2 A, φ = 60°. Колко е активната мощност P?","opts":["200 W","173,2 W","100 W","50 W"],"correct":2,"expl":"P = U·I·cos φ = 200·0,5 = **100 W**."},{"id":"L07-B-7","n":7,"text":"Паралелна RLC: I_R = 3 A, I_L = 6 A, I_C = 2 A. Колко е общият ток I?","opts":["11 A","7 A","1 A","5 A"],"correct":3,"expl":"I = √(I_R² + (I_L − I_C)²) = √(9 + 16) = **5 A**."},{"id":"L07-B-8","n":8,"text":"Коя величина е обща за всички клонове при паралелно свързване?","opts":["напрежението","токът","реактивната мощност","импедансът"],"correct":0,"expl":"При паралелно свързване **напрежението е едно и също**."},{"id":"L07-B-9","n":9,"text":"Последователна верига: R = 40 Ω, X_L − X_C = 30 Ω. Колко е cos φ?","opts":["0,6","0,8","0,75","1,33"],"correct":1,"expl":"Z = √(40² + 30²) = 50 Ω; cos φ = R/Z = **0,8**."},{"id":"L07-B-10","n":10,"text":"Паралелна RLC верига е с I_L > I_C. Какъв е характерът и какво прави токът?","opts":["капацитивен, токът изпреварва U","активен, във фаза с U","индуктивен, токът изостава от U","индуктивен, токът изпреварва U"],"correct":2,"expl":"B_L > B_C → φ = arctg((B_L − B_C)/G) > 0 → **индуктивен**, токът **изостава**."}],"C":[{"id":"L07-C-1","n":1,"text":"Лаб. верига: R = 93 Ω, X_L ≈ 14,79 Ω, X_C ≈ 12,95 Ω. Колко е Z?","opts":["120,7 Ω","94,8 Ω","93,02 Ω","1,84 Ω"],"correct":2,"expl":"Z = √(93² + 1,84²) ≈ **93,02 Ω** — реактивното съпротивление е малко."},{"id":"L07-C-2","n":2,"text":"При измерване на RLC верига U = 12 V, I = 0,1 A. Колко е импедансът Z?","opts":["1,2 Ω","120 Ω","12 Ω","0,0083 Ω"],"correct":1,"expl":"Z = U/I = 12/0,1 = **120 Ω**."},{"id":"L07-C-3","n":3,"text":"Последователна верига: U = 50 V, R = 20 Ω, X_L − X_C = 15 Ω. Колко е P?","opts":["80 W","125 W","100 W","60 W"],"correct":0,"expl":"Z = 25 Ω, I = 2 A, P = R·I² = 20·4 = **80 W**."},{"id":"L07-C-4","n":4,"text":"R = 10 Ω, X_L = 20 Ω, X_C = 25 Ω, i(t) = 2√2·sin 2000t A. Кой е правилният u(t)?","opts":["u = 22,36·sin(2000t − 26,57°) V","u = 31,62·sin(2000t + 26,57°) V","u = 31,62·sin(2000t − 63,43°) V","u = 31,62·sin(2000t − 26,57°) V"],"correct":3,"expl":"Uₘ = Z·Iₘ = 11,18·2,83 ≈ **31,62 V**, ψᵤ = φ = **−26,57°**."},{"id":"L07-C-5","n":5,"text":"Какъв знак има реактивната мощност Q при капацитивен характер на веригата?","opts":["положителен","отрицателен","нула е","зависи само от R"],"correct":1,"expl":"X_L − X_C < 0 → **Q = (X_L − X_C)·I² < 0**."},{"id":"L07-C-6","n":6,"text":"P = 80 W, Q = −120 VAr. Колко е пълната мощност S?","opts":["40 VA","200 VA","144,2 VA","89,4 VA"],"correct":2,"expl":"S = √(80² + 120²) = √20800 ≈ **144,2 VA**."},{"id":"L07-C-7","n":7,"text":"Кондензатор C = 56 µF на U = 12,1 V при ω = 314 rad/s. Колко е токът I_C?","opts":["0,213 A","2,13 A","0,688 A","0,021 A"],"correct":0,"expl":"I_C = U·ωC = 12,1·314·56·10⁻⁶ ≈ **0,213 A**."},{"id":"L07-C-8","n":8,"text":"Коя формула дава реактивната мощност чрез U, I и φ?","opts":["Q = U·I·cos φ","Q = U·I·tg φ","Q = U·I","Q = U·I·sin φ"],"correct":3,"expl":"**Q = U·I·sin φ**; P = U·I·cos φ; S = U·I."},{"id":"L07-C-9","n":9,"text":"Как се определя φ при паралелно свързване на R, L, C?","opts":["φ = arctg((B_L − B_C)/G)","φ = arctg((X_L − X_C)/R)","φ = arctg(G/(B_L − B_C))","φ = arccos(B_C/Y)"],"correct":0,"expl":"При паралелно свързване **φ = arctg((B_L − B_C)/G)**."},{"id":"L07-C-10","n":10,"text":"Ток I = 2 A, импеданс Z = 5√5 Ω ≈ 11,18 Ω. Колко е пълната мощност S?","opts":["22,36 VA","44,72 VA","500 VA","40,00 VA"],"correct":1,"expl":"S = Z·I² = 11,18·4 ≈ **44,72 VA** (= U·I = 22,36·2)."}]}},{"num":8,"title":"Тема 8 — Магнитно поле, електромагнитна индукция, трансформатор","short":"Магнитно поле, електромагнитна индукция, трансформатор","summary":"### Определение\n- **Магнитното поле** е особен вид материя, която съществува около **движещи се електрични заряди** (проводници с ток) и постоянни магнити. То се проявява чрез **силово действие** върху движещи се заряди, проводници с ток и магнитни материали.\n- Променливото магнитно поле **индуктира ЕДН** в проводници (електромагнитна индукция) — на това се основават генераторите, трансформаторите и др.\n\n### Основни величини и единици\n\n| № | Величина | Означение | Единица |\n|---|---|---|---|\n| II | **Вектор на магнитната индукция** | B⃗ | T (тесла) |\n| III | Вектор на електричния интензитет | E⃗ | V/m (волт на метър) |\n| IV | **Магнитна проницаемост** | μ | H/m (хенри на метър) |\n| V | Електрическа (диелектрична) проницаемост | ε | F/m (фарад на метър) |\n| VI | **Относителна магнитна проницаемост** | μr | безразмерна |\n| VII | **Магнитна константа** | μ₀ = 4π·10⁻⁷ | H/m |\n| VIII | **Електрическа константа** | ε₀ ≈ 8,85·10⁻¹² | F/m |\n| IX | **Вектор на магнитния интензитет** | H⃗ | A/m (ампер на метър) |\n| X | **Магнитен поток** | Φ | Wb (вебер) = T·m² |\n| — | Пълен магнитен поток (потокосцепление) | Ψ = N·Φ | Wb |\n| — | Магнитодвижещо напрежение (МДН) | F_m = N·I | A (ампер-навивки) |\n| — | Електромагнитна сила (сила на Ампер) | F | N (нютон) |\n\n\n- Връзка между B и H: **B⃗ = μ·H⃗ = μ₀·μr·H⃗**. H зависи само от токовете, а B — и от средата.\n- В записките ε₀ е записано като 8,86·10⁻¹² F/m; приетата стойност е **≈ 8,85·10⁻¹² F/m**.\n\n### Магнитни материали според μr\n\n| Вид | μr | Примери | Поведение |\n|---|---|---|---|\n| **Диамагнетици** | малко **по-малко от 1** (μr < 1) | мед, сребро, бисмут, вода | слабо отслабват полето |\n| **Парамагнетици** | малко **по-голямо от 1** (μr ≳ 1) | алуминий, платина, въздух | слабо усилват полето |\n| **Феромагнетици** | **много по-голямо от 1** (μr ≫ 1, 10²–10⁵) | желязо, никел, кобалт, електротехническа стомана | силно усилват полето — от тях се правят магнитопроводите |\n\n- В записките за диамагнетиците е написано „μr ≪ 1“ — всъщност μr е **съвсем малко под 1** (напр. 0,99999); „≪ 1“ не е точно.\n\n### Магнитен поток\n- **Φ = ∫_S B⃗·dS⃗** [Wb] — потокът на вектора B през повърхнина S [m²].\n- Хомогенно поле, **B ⊥ S** (B по нормалата на повърхността): **Φ = B·S**.\n- В общия случай: **Φ = B·S·cos α**, където α е ъгълът между B⃗ и **нормалата** към повърхността. При B, успоредно на равнината на рамката (α = 90°), Φ = 0.\n- Пример: B = 0,5 T, S = 20 cm² = 20·10⁻⁴ m² → Φ = 0,5·0,002 = **1·10⁻³ Wb = 1 mWb**.\n- Пълен поток (потокосцепление) на бобина с N (W) навивки: **Ψ = N·Φ = W·Φ**.\n\n### Закон за пълния ток\n- **∮ H⃗·dl⃗ = ΣI** — циркулацията на H по затворен контур е равна на алгебричната сума на обхванатите от контура токове (dl⃗ — елемент на затворения контур).\n- За магнитна линия с дължина l и постоянно H по нея: **H·l = I₁ + I₂ − I₃** (знакът зависи от посоката на тока спрямо обхождането).\n- За бобина (тороид) с N навивки: **H·l = N·I = F_m** — **магнитодвижещо напрежение** [A, ампер-навивки].\n- Пример: тороид N = 400, I = 2,5 A, средна дължина l = 0,5 m → H = N·I/l = 1000/0,5 = **2000 A/m**; при μr = 1000: B = μ₀·μr·H ≈ 2,51 T (теоретично, без насищане).\n\n### Закон за електромагнитната индукция\n- **Неподвижен проводник (контур) в променливо магнитно поле:** **e = −dΨ/dt = −N·dΦ/dt**. Индуктира се ЕДН, когато се изменя обхванатият магнитен поток.\n- Знакът „−“ изразява **правилото на Ленц**: индуктираната ЕДН (и токът ѝ) **противодейства на изменението** на потока, което я поражда.\n- Пример: N = 100, потокът се изменя с ΔΦ = 0,02 Wb за Δt = 0,01 s → |e| = N·ΔΦ/Δt = **200 V**.\n- **Движение на проводник в постоянно магнитно поле:** **e = (v⃗ × B⃗)·l⃗**, по големина **e = B·l·v·sin α** [V], където v [m/s] е скоростта, l [m] — дължината на активната част на проводника, α — ъгълът между v и B. Посоката — по **правилото на дясната ръка**.\n- Пример: B = 0,5 T, l = 0,4 m, v = 10 m/s, v ⊥ B → e = 0,5·0,4·10 = **2 V**.\n\n### Електромагнитна сила (сила на Ампер)\n- Върху проводник с ток I в магнитно поле действа сила **F⃗ = I·(l⃗ × B⃗)**; по големина **F = I·l·B·sin θ** [N], θ — ъгълът между проводника и B. Посоката — по **правилото на лявата ръка**.\n- Максимална сила при θ = 90° (проводник ⊥ B); **F = 0**, когато проводникът е **успореден** на B.\n- Пример: I = 5 A, l = 0,2 m, B = 0,8 T, θ = 90° → F = 5·0,2·0,8 = **0,8 N**.\n\n### Вихрови токове (токове на Фуко) и загуби в магнитопроводите\n- В масивни проводящи (феромагнитни) тела, намиращи се в **променливо** магнитно поле, се индуктират затворени токове — **вихрови токове (токове на Фуко)**. Те нагряват магнитопровода → загуби на енергия.\n- Намаляване: магнитопроводите се изработват от **тънки, изолирани един от друг листове електротехническа ламарина** (магнитомеки материали с примес на силиций — по-голямо съпротивление).\n- Загуби в магнитопровода (по записките):\n  - **ΔPₓ = kₓ·f·Bₘ²** — загуби, пропорционални на **f** (хистерезисни);\n  - **ΔP_вт = k_вт·f²·Bₘ²** — загуби от **вихровите токове**, пропорционални на **f²**.\n  - kₓ, k_вт — коефициенти на загубите (константи на материала); f [Hz] — честота на изменение на полето; Bₘ [T] — максимална магнитна индукция; ΔP [W] — мощност на загубите.\n- Следствия: при **двойно по-голяма f** загубите от вихрови токове нарастват **4 пъти**, а ΔPₓ — 2 пъти; при двойно по-голяма Bₘ и двете растат 4 пъти.\n\n### Трансформатор\n- Статичен електромагнитен апарат, който **преобразува променливо напрежение** от една стойност в друга при същата честота. Състои се от **магнитопровод** и две намотки: **първична** (W₁ навивки, към мрежата) и **вторична** (W₂ навивки, към товара). Работи на принципа на **електромагнитната индукция** — с постоянен ток не работи.\n- **Коефициент на трансформация:** **k_тр = W₁/W₂ ≈ U₁/U₂ = E₁/E₂**; за токовете I₁/I₂ ≈ W₂/W₁ = 1/k_тр (U₁I₁ ≈ U₂I₂).\n\n| k_тр = W₁/W₂ | Напрежения | Вид |\n|---|---|---|\n| = 1 | U₂ = U₁ | разделителен (1:1) |\n| > 1 (W₁ > W₂) | U₂ < U₁ | **понижаващ** |\n| < 1 (W₁ < W₂) | U₂ > U₁ | **повишаващ** |\n\n- Пример: W₁ = 1000, W₂ = 100 → k_тр = 10; U₁ = 230 V → U₂ = 23 V (понижаващ).\n\n### Капани за изпита\n- **Коефициент на трансформация:** в записките е написано „k_тр > 1 — повишаващ, вторичното U е по-високо“ и „k_тр < 1 — понижаващ“. При дефиницията **k_тр = W₁/W₂ = U₁/U₂** е **обратното**: k_тр > 1 → U₂ < U₁ → **понижаващ**; k_тр < 1 → **повишаващ**.\n- **Φ = B·S·cos α** — α е ъгълът между B и **нормалата** към площта. Ако B е перпендикулярно на площта, cos α = 1 и Φ = B·S.\n- **Площ в m²:** 1 cm² = 10⁻⁴ m², 1 mm² = 10⁻⁶ m². 20 cm² = 0,002 m², не 0,2 m².\n- **Сила на Ампер** — sin θ: при проводник, успореден на полето, F = 0.\n- **Знакът „−“** в e = −dΨ/dt е правилото на Ленц (противодействие), а не отрицателна големина.\n- **μ₀ = 4π·10⁻⁷ H/m** (не 4π·10⁻⁷ F/m); **ε₀ ≈ 8,85·10⁻¹² F/m**. B се мери в T, H — в A/m, Φ — в Wb, μ — в H/m.\n- **Вихрови токове ∝ f²**, хистерезисни загуби ∝ f.\n- Диамагнетици: μr < 1 (съвсем малко), а не „много по-малко от 1“.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L08-A-1","n":1,"text":"Хомогенно поле B = 0,5 T е перпендикулярно на площ S = 20 cm². Колко е магнитният поток?","opts":["1 mWb","10 Wb","0,1 mWb","10 mWb"],"correct":0,"expl":"Φ = B·S = 0,5·20·10⁻⁴ = **10⁻³ Wb = 1 mWb**."},{"id":"L08-A-2","n":2,"text":"В каква единица се измерва магнитната индукция B?","opts":["вебер (Wb)","тесла (T)","ампер на метър (A/m)","хенри на метър (H/m)"],"correct":1,"expl":"B се мери в **тесла (T)**; Φ — във Wb, H — в A/m."},{"id":"L08-A-3","n":3,"text":"Колко е магнитната константа μ₀?","opts":["8,85·10⁻¹² F/m","4π·10⁻⁷ F/m","4π·10⁻⁷ H/m","4π·10⁷ H/m"],"correct":2,"expl":"**μ₀ = 4π·10⁻⁷ H/m**; 8,85·10⁻¹² F/m е ε₀."},{"id":"L08-A-4","n":4,"text":"Каква е относителната магнитна проницаемост на феромагнетиците?","opts":["μr малко под 1","μr малко над 1","μr = 0","μr ≫ 1"],"correct":3,"expl":"Феромагнетиците (Fe, Ni, Co) имат **μr ≫ 1** (10²–10⁵)."},{"id":"L08-A-5","n":5,"text":"Трансформатор: W₁ = 1000, W₂ = 100, U₁ = 230 V. Колко е U₂?","opts":["2300 V","23 V","230 V","2,3 V"],"correct":1,"expl":"k_тр = W₁/W₂ = 10; U₂ = U₁/k_тр = 230/10 = **23 V**."},{"id":"L08-A-6","n":6,"text":"Проводник l = 0,2 m с ток I = 5 A е перпендикулярен на поле B = 0,8 T. Колко е силата?","opts":["0,8 N","8 N","0,08 N","1,6 N"],"correct":0,"expl":"F = I·l·B·sin 90° = 5·0,2·0,8 = **0,8 N**."},{"id":"L08-A-7","n":7,"text":"Проводник l = 0,4 m се движи със v = 10 m/s перпендикулярно на B = 0,5 T. Каква ЕДН се индуктира?","opts":["20 V","0,2 V","2 V","8 V"],"correct":2,"expl":"e = B·l·v = 0,5·0,4·10 = **2 V**."},{"id":"L08-A-8","n":8,"text":"Как гласи законът за пълния ток?","opts":["∮H·dl = ΣI","∮B·dS = 0","e = −dΨ/dt","F = I·l·B"],"correct":0,"expl":"**∮H·dl = ΣI** — циркулацията на H е равна на сумата на обхванатите токове."},{"id":"L08-A-9","n":9,"text":"Трансформатор е с k_тр = W₁/W₂ > 1. Какъв е той?","opts":["повишаващ — U₂ > U₁","разделителен — U₂ = U₁","работи само с постоянен ток","понижаващ — U₂ < U₁"],"correct":3,"expl":"W₁ > W₂ → U₂ = U₁/k_тр < U₁ → **понижаващ** (в записките е обратно — грешка)."},{"id":"L08-A-10","n":10,"text":"Как се намаляват загубите от вихрови токове в магнитопровода?","opts":["с плътен масивен стоманен магнитопровод","с изолирани листове електротехническа ламарина","с повишаване на честотата","с повишаване на Bₘ"],"correct":1,"expl":"Магнитопроводът се **шихтова от тънки изолирани листове** — пътят на вихровите токове се прекъсва."}],"B":[{"id":"L08-B-1","n":1,"text":"B = 1,2 T, S = 0,05 m², ъгълът между B и нормалата е α = 60°. Колко е Φ?","opts":["0,06 Wb","0,052 Wb","0,03 Wb","0,6 Wb"],"correct":2,"expl":"Φ = B·S·cos α = 1,2·0,05·0,5 = **0,03 Wb**."},{"id":"L08-B-2","n":2,"text":"В каква единица се измерва магнитният интензитет H?","opts":["A/m","T","Wb","H/m"],"correct":0,"expl":"H се мери в **A/m** (ампер на метър)."},{"id":"L08-B-3","n":3,"text":"Материал с μr = 1000 е в поле H = 100 A/m. Колко е магнитната индукция B?","opts":["1,257 T","0,1 T","1,257·10⁻⁴ T","0,1257 T"],"correct":3,"expl":"B = μ₀·μr·H = 4π·10⁻⁷·1000·100 ≈ **0,1257 T**."},{"id":"L08-B-4","n":4,"text":"Кое е вярно за диамагнетиците (напр. мед, бисмут)?","opts":["μr е малко под 1","μr е малко над 1","μr ≫ 1","μr = 0"],"correct":0,"expl":"Диамагнетиците имат **μr съвсем малко под 1** и слабо отслабват полето."},{"id":"L08-B-5","n":5,"text":"Бобина с N = 200 навивки обхваща поток Φ = 2 mWb. Колко е потокосцеплението Ψ?","opts":["0,01 Wb","0,4 Wb","400 Wb","4 Wb"],"correct":1,"expl":"Ψ = N·Φ = 200·2·10⁻³ = **0,4 Wb**."},{"id":"L08-B-6","n":6,"text":"Бобина N = 100 навивки; потокът ѝ се изменя с 0,02 Wb за 0,01 s. Каква е големината на ЕДН?","opts":["2 V","0,2 V","20 V","200 V"],"correct":3,"expl":"|e| = N·ΔΦ/Δt = 100·0,02/0,01 = **200 V**."},{"id":"L08-B-7","n":7,"text":"Бобина с N = 500 навивки и ток I = 0,4 A. Колко е магнитодвижещото напрежение F_m?","opts":["1250 A","200 A","0,0008 A","500 A"],"correct":1,"expl":"F_m = N·I = 500·0,4 = **200 A** (ампер-навивки)."},{"id":"L08-B-8","n":8,"text":"Как се изменят загубите от вихрови токове ΔP_вт = k_вт·f²·Bₘ², ако f се увеличи 2 пъти?","opts":["увеличават се 2 пъти","не се изменят","увеличават се 4 пъти","намаляват 2 пъти"],"correct":2,"expl":"ΔP_вт ∝ f² → 2² = **4 пъти**."},{"id":"L08-B-9","n":9,"text":"В каква единица се измерва магнитният поток Φ?","opts":["тесла (T)","хенри (H)","ампер (A)","вебер (Wb)"],"correct":3,"expl":"Φ се мери във **вебер (Wb) = T·m²**."},{"id":"L08-B-10","n":10,"text":"Трансформатор понижава 230 V на 12 V. Първичната намотка е W₁ = 1150. Колко е W₂?","opts":["60","22 042","1150","19"],"correct":0,"expl":"W₂ = W₁·U₂/U₁ = 1150·12/230 = **60** навивки."}],"C":[{"id":"L08-C-1","n":1,"text":"Тороид: N = 400 навивки, I = 2,5 A, средна дължина l = 0,5 m. Колко е H?","opts":["500 A/m","200 A/m","2000 A/m","1000 A/m"],"correct":2,"expl":"H·l = N·I → H = 400·2,5/0,5 = **2000 A/m**."},{"id":"L08-C-2","n":2,"text":"Магнитните линии на хомогенно поле са успоредни на равнината на рамка (α = 90° спрямо нормалата). Колко е Φ?","opts":["Φ = B·S","Φ = 0","Φ = B·S/2","Φ = B/S"],"correct":1,"expl":"Φ = B·S·cos 90° = **0** — линиите не пресичат рамката."},{"id":"L08-C-3","n":3,"text":"Проводник с ток е успореден на линиите на магнитното поле. Каква сила действа?","opts":["F = I·l·B","F = I·l·B/2","F = B·l·v","F = 0"],"correct":3,"expl":"F = I·l·B·sin θ, θ = 0° → **F = 0**."},{"id":"L08-C-4","n":4,"text":"Колко е електрическата константа ε₀?","opts":["≈ 8,85·10⁻¹² F/m","4π·10⁻⁷ H/m","≈ 8,85·10⁻¹² H/m","≈ 8,85·10¹² F/m"],"correct":0,"expl":"**ε₀ ≈ 8,85·10⁻¹² F/m** (в записките 8,86·10⁻¹²)."},{"id":"L08-C-5","n":5,"text":"В каква единица се измерва магнитната проницаемост μ?","opts":["F/m","T","H/m","A/m"],"correct":2,"expl":"μ = B/H се мери в **H/m** (хенри на метър)."},{"id":"L08-C-6","n":6,"text":"Как се изменят загубите ΔPₓ = kₓ·f·Bₘ², ако Bₘ се увеличи 2 пъти при същата f?","opts":["увеличават се 2 пъти","увеличават се 4 пъти","не се изменят","увеличават се 8 пъти"],"correct":1,"expl":"ΔPₓ ∝ Bₘ² → 2² = **4 пъти**."},{"id":"L08-C-7","n":7,"text":"B = 0,8 T, l = 0,5 m, v = 5 m/s, ъгълът между v и B е 30°. Каква ЕДН се индуктира?","opts":["2 V","1,73 V","0,5 V","1 V"],"correct":3,"expl":"e = B·l·v·sin α = 0,8·0,5·5·0,5 = **1 V**."},{"id":"L08-C-8","n":8,"text":"Контур с дължина l = 0,3 m обхваща токове I₁ = 5 A, I₂ = 3 A и обратен I₃ = 2 A. Колко е H?","opts":["20 A/m","33,3 A/m","6 A/m","1,8 A/m"],"correct":0,"expl":"H·l = I₁ + I₂ − I₃ = 6 A → H = 6/0,3 = **20 A/m**."},{"id":"L08-C-9","n":9,"text":"Трансформатор: W₁ = 100, W₂ = 500, U₁ = 24 V. Колко е U₂ и какъв е трансформаторът?","opts":["4,8 V, понижаващ","120 V, понижаващ","120 V, повишаващ","4,8 V, повишаващ"],"correct":2,"expl":"k_тр = 0,2 < 1; U₂ = 24·500/100 = **120 V** → **повишаващ**."},{"id":"L08-C-10","n":10,"text":"Какво изразява знакът „−“ в закона e = −dΨ/dt?","opts":["че индуктираната ЕДН винаги е отрицателна","противодействие на изменението на потока","че магнитният поток винаги намалява","че индуктираният ток тече към източника"],"correct":1,"expl":"Това е **правилото на Ленц**: индуктираната ЕДН противодейства на изменението на потока."}]}}],"sample":[],"taskGroups":[{"key":"dc","title":"Разклонена верига с постоянен ток (Кирхоф, МВП, баланс, уреди)","lec":4,"n":16},{"key":"rlc","title":"Последователна RLC верига","lec":7,"n":14}],"tasks":[{"id":"DC01","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"70.5\" stroke=\ fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"50\" y=\"267.5\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₁<\/text><line x1=\"70\" y1=\"305.0\" x2=\"70\" y2=\"334.5\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"360.5\" x2=\"70\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"347.5\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"70\" y=\"352.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"20\" y1=\"372\" x2=\"20\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M16 354 L20 348 L24 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"26\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₁<\/text><line x1=\"250\" y1=\"50.0\" x2=\"250\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"157.0\" x2=\"250\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"220.0\" x2=\"250\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"320.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"314.0\" x2=\"250\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 301.0 L250 296.0 L255 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"157.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"105.0\" x2=\"476\" y2=\"105.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"165.0\" x2=\"476\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"105.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"165.0\" r=\"4\" fill=\"#111\"/><line x1=\"476\" y1=\"105.0\" x2=\"476\" y2=\"122.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"476\" y1=\"148.0\" x2=\"476\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"476\" cy=\"135.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"476\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"296.0\" x2=\"430\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 309.0 L430 314.0 L435 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 10 Ω, R₂ = 10 Ω, R₃ = 10 Ω, R₄ = 20 Ω, R₅ = 30 Ω; e₁ = 20 V, e₂ = 60 V, e₃ = 40 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":11.851852,"shown":"11,852"},{"label":"I₁, A","type":"real","answer":0.37037,"shown":"0,37"},{"label":"I₂, A","type":"real","answer":4.814815,"shown":"4,815"},{"label":"I₃, A","type":"real","answer":-5.185185,"shown":"−5,185"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":503.703704,"shown":"503,704"},{"label":"Показание на амперметъра, A","type":"real","answer":0.37037,"shown":"0,37"},{"label":"Показание на волтметъра, V","type":"real","answer":51.851852,"shown":"51,852"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R4 ∥ R5: R₄₅ = R4·R5/(R4 + R5) = 20·30/(20 + 30) = **12 Ω**\n- клон 1: Rе₁ = R₁ + R₄₅ = **22 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = e₁ − e₂ | 22·I₁ − 10·I₂ = −40 |\n| II ЗК, контур II | R₂·I₂ − R₃·I₃ = e₂ + e₃ | 10·I₂ − 10·I₃ = 100 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/R₃)·V₁ = e₁/Rе₁ + e₂/R₂ − e₃/R₃\n\n(1/22 + 1/10 + 1/10)·V₁ = 2,9091  →  0,24545·V₁ = 2,9091  →  **V₁ = 11,852 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/Rе₁ = (20 − (11,852))/22 = **0,37 A**\n- I₂ = (e₂ − V₁)/R₂ = (60 − (11,852))/10 = **4,815 A**\n- I₃ = (−e₃ − V₁)/R₃ = (−40 − (11,852))/10 = **−5,185 A**\n\nПроверка с I ЗК: 0,37 + (4,815) + (−5,185) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ + e₂·I₂ − e₃·I₃ = (20)·(0,37) + (60)·(4,815) + (−40)·(−5,185) = **503,704 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + R₃·I₃² = 22·0,137 + 10·23,182 + 10·26,886 = **503,704 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 1 и показва тока на клона: I_A = |I₁| = **0,37 A**\n- Волтметърът е успоредно на R3: U_V = R3·|I₃| = 10·5,185 = **51,852 V**\n\n> Това е задача ② от записките (ЕТ #5). Там е записано V₁ = 32/11 V — това е само дясната страна на уравнението; пропуснато е делението на сумата от проводимостите (1/22 + 1/10 + 1/10). Затова и токовете в записките не излизат."},{"id":"DC02","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4 ize=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"70\" y1=\"276.66666666666663\" x2=\"70\" y2=\"318.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"348.3333333333333\" x2=\"70\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"333.3333333333333\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"342.3333333333333\" x2=\"70\" y2=\"324.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M65 329.3333333333333 L70 324.3333333333333 L75 329.3333333333333\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"50\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₁<\/text><line x1=\"44\" y1=\"372\" x2=\"44\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M40 354 L44 348 L48 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"50\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₁<\/text><line x1=\"250\" y1=\"50.0\" x2=\"250\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"128.66666666666666\" x2=\"250\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"163.33333333333331\" x2=\"250\" y2=\"204.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"234.99999999999997\" x2=\"250\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"219.99999999999997\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"210.99999999999997\" x2=\"250\" y2=\"228.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 223.99999999999997 L250 228.99999999999997 L255 223.99999999999997\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"250\" y1=\"276.66666666666663\" x2=\"250\" y2=\"320.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"346.3333333333333\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"333.3333333333333\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"250\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"206.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"64.0\" x2=\"456\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"206.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"206.0\" r=\"4\" fill=\"#111\"/><line x1=\"404\" y1=\"64.0\" x2=\"404\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"157.0\" x2=\"404\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"395\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"390\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"456\" y1=\"64.0\" x2=\"456\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"456\" y1=\"157.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"447\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"442\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"314.0\" x2=\"430\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 301.0 L430 296.0 L435 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"380\" y1=\"372\" x2=\"380\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M376 354 L380 348 L384 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"386\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 15 Ω, R₂ = 13 Ω, R₃ = 22 Ω, R₄ = 20 Ω, R₅ = 18 Ω; e₁ = 50 V, e₂ = 20 V, e₃ = 40 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":19.033541,"shown":"19,034"},{"label":"I₁, A","type":"real","answer":0.884756,"shown":"0,885"},{"label":"I₂, A","type":"real","answer":-3.00258,"shown":"−3,003"},{"label":"I₃, A","type":"real","answer":2.117824,"shown":"2,118"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":189.002365,"shown":"189,002"},{"label":"Показание на амперметъра, A","type":"real","answer":3.00258,"shown":"3,003"},{"label":"Показание на волтметъра, V","type":"real","answer":17.695119,"shown":"17,695"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 1: Rе₁ = R₁ + R₄ = **35 Ω**\n- R3 ∥ R5: R₃₅ = R3·R5/(R3 + R5) = 22·18/(22 + 18) = **9,9 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = e₁ + e₂ | 35·I₁ − 13·I₂ = 70 |\n| II ЗК, контур II | R₂·I₂ − Rе₃·I₃ = − e₂ − e₃ | 13·I₂ − 9,9·I₃ = −60 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/Rе₃)·V₁ = e₁/Rе₁ − e₂/R₂ + e₃/Rе₃\n\n(1/35 + 1/13 + 1/9,9)·V₁ = 3,9305  →  0,2065·V₁ = 3,9305  →  **V₁ = 19,034 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/Rе₁ = (50 − (19,034))/35 = **0,885 A**\n- I₂ = (−e₂ − V₁)/R₂ = (−20 − (19,034))/13 = **−3,003 A**\n- I₃ = (e₃ − V₁)/Rе₃ = (40 − (19,034))/9,9 = **2,118 A**\n\nПроверка с I ЗК: 0,885 + (−3,003) + (2,118) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ − e₂·I₂ + e₃·I₃ = (50)·(0,885) + (−20)·(−3,003) + (40)·(2,118) = **189,002 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + Rе₃·I₃² = 35·0,783 + 13·9,015 + 9,9·4,485 = **189,002 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 2 и показва тока на клона: I_A = |I₂| = **3,003 A**\n- Волтметърът е успоредно на R4: U_V = R4·|I₁| = 20·0,885 = **17,695 V**"},{"id":"DC03","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"206.0\" x2=\"70\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"64.0\" x2=\"96\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"206.0\" x2=\"96\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"70\" cy=\"206.0\" r=\"4\" fill=\"#111\"/><line x1=\"44\" y1=\"64.0\" x2=\"44\" y2=\"66.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"92.0\" x2=\"44\" y2=\"94.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"44\" cy=\"79.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"44\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight= nt-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"190.0\" x2=\"296\" y2=\"190.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"250.0\" x2=\"296\" y2=\"250.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"190.0\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"250.0\" r=\"4\" fill=\"#111\"/><line x1=\"296\" y1=\"190.0\" x2=\"296\" y2=\"207.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"296\" y1=\"233.0\" x2=\"296\" y2=\"250.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"296\" cy=\"220.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"296\" y=\"225.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"128.66666666666666\" x2=\"430\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"163.33333333333331\" x2=\"430\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"241.99999999999997\" x2=\"430\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"430\" y1=\"276.66666666666663\" x2=\"430\" y2=\"318.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"348.3333333333333\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"333.3333333333333\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"342.3333333333333\" x2=\"430\" y2=\"324.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 329.3333333333333 L430 324.3333333333333 L435 329.3333333333333\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 20 Ω, R₂ = 8 Ω, R₃ = 30 Ω, R₄ = 24 Ω, R₅ = 12 Ω; e₁ = 80 V, e₃ = 24 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":32.871287,"shown":"32,871"},{"label":"I₁, A","type":"real","answer":4.320132,"shown":"4,32"},{"label":"I₂, A","type":"real","answer":-4.108911,"shown":"−4,109"},{"label":"I₃, A","type":"real","answer":-0.211221,"shown":"−0,211"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":340.541254,"shown":"340,541"},{"label":"Показание на амперметъра, A","type":"real","answer":2.356436,"shown":"2,356"},{"label":"Показание на волтметъра, V","type":"real","answer":32.871287,"shown":"32,871"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R1 ∥ R4: R₁₄ = R1·R4/(R1 + R4) = 20·24/(20 + 24) = **10,909 Ω**\n- клон 3: Rе₃ = R₃ + R₅ = **42 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = e₁ | 10,909·I₁ − 8·I₂ = 80 |\n| II ЗК, контур II | R₂·I₂ − Rе₃·I₃ = − e₃ | 8·I₂ − 42·I₃ = −24 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/Rе₃)·V₁ = e₁/Rе₁ + e₃/Rе₃\n\n(1/10,909 + 1/8 + 1/42)·V₁ = 7,9048  →  0,24048·V₁ = 7,9048  →  **V₁ = 32,871 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/Rе₁ = (80 − (32,871))/10,909 = **4,32 A**\n- I₂ = (−V₁)/R₂ = (−(32,871))/8 = **−4,109 A**\n- I₃ = (e₃ − V₁)/Rе₃ = (24 − (32,871))/42 = **−0,211 A**\n\nПроверка с I ЗК: 4,32 + (−4,109) + (−0,211) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ + e₃·I₃ = (80)·(4,32) + (24)·(−0,211) = **340,541 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + Rе₃·I₃² = 10,909·18,664 + 8·16,883 + 42·0,045 = **340,541 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е последователно на R1, а R1 ∥ R4: токът на клона се разделя обратно на съпротивленията — I_A = |I₁|·R4/(R1 + R4) = 4,32·24/44 = **2,356 A**\n- Волтметърът е успоредно на R2: U_V = R2·|I₂| = 8·4,109 = **32,871 V**"},{"id":"DC04","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"128.66666666666666\" x2=\"70\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"70\" y1=\"163.33333333333331\" x2=\"70\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"241.99999999999997\" x2=\"70\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₄<\/text><line x1=\"70\" y1=\"276.66666666666663
