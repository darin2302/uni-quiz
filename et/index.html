1=\"50.0\" x2=\"250\" y2=\"198.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"242.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"198.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"225.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"128.66666666666666\" x2=\"430\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"163.33333333333331\" x2=\"430\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"241.99999999999997\" x2=\"430\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"430\" y1=\"189.99999999999997\" x2=\"476\" y2=\"189.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"249.99999999999997\" x2=\"476\" y2=\"249.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"189.99999999999997\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"249.99999999999997\" r=\"4\" fill=\"#111\"/><line x1=\"476\" y1=\"189.99999999999997\" x2=\"476\" y2=\"206.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"476\" y1=\"232.99999999999997\" x2=\"476\" y2=\"249.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"476\" cy=\"219.99999999999997\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"476\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"276.66666666666663\" x2=\"430\" y2=\"318.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"348.3333333333333\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"333.3333333333333\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"324.3333333333333\" x2=\"430\" y2=\"342.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 337.3333333333333 L430 342.3333333333333 L435 337.3333333333333\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 8 Ω, R₂ = 10 Ω, R₃ = 20 Ω, R₄ = 24 Ω, R₅ = 40 Ω; e₁ = 15 V, e₃ = 100 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":2.941176,"shown":"2,941"},{"label":"I₁, A","type":"real","answer":2.009804,"shown":"2,01"},{"label":"I₂, A","type":"real","answer":-0.294118,"shown":"−0,294"},{"label":"I₃, A","type":"real","answer":-1.715686,"shown":"−1,716"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":201.715686,"shown":"201,716"},{"label":"Показание на амперметъра, A","type":"real","answer":2.009804,"shown":"2,01"},{"label":"Показание на волтметъра, V","type":"real","answer":68.627451,"shown":"68,627"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R1 ∥ R4: R₁₄ = R1·R4/(R1 + R4) = 8·24/(8 + 24) = **6 Ω**\n- клон 3: Rе₃ = R₃ + R₅ = **60 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = e₁ | 6·I₁ − 10·I₂ = 15 |\n| II ЗК, контур II | R₂·I₂ − Rе₃·I₃ = e₃ | 10·I₂ − 60·I₃ = 100 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/Rе₃)·V₁ = e₁/Rе₁ − e₃/Rе₃\n\n(1/6 + 1/10 + 1/60)·V₁ = 0,8333  →  0,28333·V₁ = 0,8333  →  **V₁ = 2,941 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/Rе₁ = (15 − (2,941))/6 = **2,01 A**\n- I₂ = (−V₁)/R₂ = (−(2,941))/10 = **−0,294 A**\n- I₃ = (−e₃ − V₁)/Rе₃ = (−100 − (2,941))/60 = **−1,716 A**\n\nПроверка с I ЗК: 2,01 + (−0,294) + (−1,716) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ − e₃·I₃ = (15)·(2,01) + (−100)·(−1,716) = **201,716 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + Rе₃·I₃² = 6·4,039 + 10·0,087 + 60·2,944 = **201,716 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 1 и показва тока на клона: I_A = |I₁| = **2,01 A**\n- Волтметърът е успоредно на R5: U_V = R5·|I₃| = 40·1,716 = **68,627 V**"},{"id":"DC14","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"128.66666666666666\" x2=\"70\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"70\" y1=\"163.33333333333331\" x2=\"70\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"241.99999999999997\" x2=\"70\" y2=\"276 1\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"215\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"210\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"276\" y1=\"64.0\" x2=\"276\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"276\" y1=\"128.66666666666666\" x2=\"276\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"267\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"262\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"250\" y1=\"163.33333333333331\" x2=\"250\" y2=\"204.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"234.99999999999997\" x2=\"250\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"219.99999999999997\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"228.99999999999997\" x2=\"250\" y2=\"210.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 215.99999999999997 L250 210.99999999999997 L255 215.99999999999997\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"250\" y1=\"276.66666666666663\" x2=\"250\" y2=\"320.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"346.3333333333333\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"333.3333333333333\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"250\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"200\" y1=\"372\" x2=\"200\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M196 354 L200 348 L204 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"206\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"198.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"242.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"198.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"225.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"190.0\" x2=\"476\" y2=\"190.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"250.0\" x2=\"476\" y2=\"250.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"190.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"250.0\" r=\"4\" fill=\"#111\"/><line x1=\"476\" y1=\"190.0\" x2=\"476\" y2=\"207.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"476\" y1=\"233.0\" x2=\"476\" y2=\"250.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"476\" cy=\"220.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"476\" y=\"225.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 6 Ω, R₂ = 22 Ω, R₃ = 8 Ω, R₄ = 22 Ω, R₅ = 30 Ω; e₁ = 10 V, e₂ = 10 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":4.78084,"shown":"4,781"},{"label":"I₁, A","type":"real","answer":0.186399,"shown":"0,186"},{"label":"I₂, A","type":"real","answer":0.411207,"shown":"0,411"},{"label":"I₃, A","type":"real","answer":-0.597605,"shown":"−0,598"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":5.976051,"shown":"5,976"},{"label":"Показание на амперметъра, A","type":"real","answer":0.411207,"shown":"0,411"},{"label":"Показание на волтметъра, V","type":"real","answer":4.78084,"shown":"4,781"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 1: Rе₁ = R₁ + R₄ = **28 Ω**\n- R2 ∥ R5: R₂₅ = R2·R5/(R2 + R5) = 22·30/(22 + 30) = **12,692 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − Rе₂·I₂ = e₁ − e₂ | 28·I₁ − 12,692·I₂ = 0 |\n| II ЗК, контур II | Rе₂·I₂ − R₃·I₃ = e₂ | 12,692·I₂ − 8·I₃ = 10 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/Rе₂ + 1/R₃)·V₁ = e₁/Rе₁ + e₂/Rе₂\n\n(1/28 + 1/12,692 + 1/8)·V₁ = 1,145  →  0,2395·V₁ = 1,145  →  **V₁ = 4,781 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/Rе₁ = (10 − (4,781))/28 = **0,186 A**\n- I₂ = (e₂ − V₁)/Rе₂ = (10 − (4,781))/12,692 = **0,411 A**\n- I₃ = (−V₁)/R₃ = (−(4,781))/8 = **−0,598 A**\n\nПроверка с I ЗК: 0,186 + (0,411) + (−0,598) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ + e₂·I₂ = (10)·(0,186) + (10)·(0,411) = **5,976 W**\n\nΣP_конс = Rе₁·I₁² + Rе₂·I₂² + R₃·I₃² = 28·0,035 + 12,692·0,169 + 8·0,357 = **5,976 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 2 и показва тока на клона: I_A = |I₂| = **0,411 A**\n- Волтметърът е успоредно на R3: U_V = R3·|I₃| = 8·0,598 = **4,781 V**"},{"id":"DC15","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"157.0\" x2=\"70\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"70\" y1=\"220.0\" x2=\"70\" y2=\"290.0\" stroke=\ \"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"200\" y1=\"372\" x2=\"200\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M196 354 L200 348 L204 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"206\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"157.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"296.0\" x2=\"430\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 309.0 L430 314.0 L435 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 10 Ω, R₂ = 25 Ω, R₃ = 10 Ω, R₄ = 20 Ω, R₅ = 8 Ω; e₁ = 30 V, e₂ = 40 V, e₃ = 80 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-27.1,"shown":"−27,1"},{"label":"I₁, A","type":"real","answer":5.71,"shown":"5,71"},{"label":"I₂, A","type":"real","answer":-0.42,"shown":"−0,42"},{"label":"I₃, A","type":"real","answer":-5.29,"shown":"−5,29"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":611.3,"shown":"611,3"},{"label":"Показание на амперметъра, A","type":"real","answer":0.42,"shown":"0,42"},{"label":"Показание на волтметъра, V","type":"real","answer":2.4,"shown":"2,4"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R4 ∥ R5: R₄₅ = R4·R5/(R4 + R5) = 20·8/(20 + 8) = **5,714 Ω**\n- клон 2: Rе₂ = R₂ + R₄₅ = **30,714 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | R₁·I₁ − Rе₂·I₂ = e₁ + e₂ | 10·I₁ − 30,714·I₂ = 70 |\n| II ЗК, контур II | Rе₂·I₂ − R₃·I₃ = − e₂ + e₃ | 30,714·I₂ − 10·I₃ = 40 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/R₁ + 1/Rе₂ + 1/R₃)·V₁ = e₁/R₁ − e₂/Rе₂ − e₃/R₃\n\n(1/10 + 1/30,714 + 1/10)·V₁ = −6,3023  →  0,23256·V₁ = −6,3023  →  **V₁ = −27,1 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/R₁ = (30 − (−27,1))/10 = **5,71 A**\n- I₂ = (−e₂ − V₁)/Rе₂ = (−40 − (−27,1))/30,714 = **−0,42 A**\n- I₃ = (−e₃ − V₁)/R₃ = (−80 − (−27,1))/10 = **−5,29 A**\n\nПроверка с I ЗК: 5,71 + (−0,42) + (−5,29) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ − e₂·I₂ − e₃·I₃ = (30)·(5,71) + (−40)·(−0,42) + (−80)·(−5,29) = **611,3 W**\n\nΣP_конс = R₁·I₁² + Rе₂·I₂² + R₃·I₃² = 10·32,604 + 30,714·0,176 + 10·27,984 = **611,3 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 2 и показва тока на клона: I_A = |I₂| = **0,42 A**\n- Волтметърът е успоредно на R5 (а значи и на R4 ∥ R5): U_V = |I₂|·R₄₅ = 0,42·5,714 = **2,4 V**"},{"id":"DC16","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"157.0\" x2=\"70\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text 20.0\" x2=\"250\" y2=\"283.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"327.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"283.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₄<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"206.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"64.0\" x2=\"456\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"206.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"206.0\" r=\"4\" fill=\"#111\"/><line x1=\"404\" y1=\"64.0\" x2=\"404\" y2=\"66.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"92.0\" x2=\"404\" y2=\"94.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"404\" cy=\"79.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"404\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"404\" y1=\"94.0\" x2=\"404\" y2=\"128.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"172.0\" x2=\"404\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"395\" y=\"128.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"390\" y=\"155.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"456\" y1=\"64.0\" x2=\"456\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"456\" y1=\"157.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"447\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"442\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"314.0\" x2=\"430\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 301.0 L430 296.0 L435 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"380\" y1=\"372\" x2=\"380\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M376 354 L380 348 L384 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"386\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 24 Ω, R₂ = 60 Ω, R₃ = 20 Ω, R₄ = 60 Ω, R₅ = 18 Ω; e₁ = 20 V, e₃ = 100 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":73.214286,"shown":"73,214"},{"label":"I₁, A","type":"real","answer":-2.217262,"shown":"−2,217"},{"label":"I₂, A","type":"real","answer":-0.610119,"shown":"−0,61"},{"label":"I₃, A","type":"real","answer":2.827381,"shown":"2,827"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":238.392857,"shown":"238,393"},{"label":"Показание на амперметъра, A","type":"real","answer":1.339286,"shown":"1,339"},{"label":"Показание на волтметъра, V","type":"real","answer":53.214286,"shown":"53,214"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 2: Rе₂ = R₂ + R₄ = **120 Ω**\n- R3 ∥ R5: R₃₅ = R3·R5/(R3 + R5) = 20·18/(20 + 18) = **9,474 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | R₁·I₁ − Rе₂·I₂ = e₁ | 24·I₁ − 120·I₂ = 20 |\n| II ЗК, контур II | Rе₂·I₂ − Rе₃·I₃ = − e₃ | 120·I₂ − 9,474·I₃ = −100 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/R₁ + 1/Rе₂ + 1/Rе₃)·V₁ = e₁/R₁ + e₃/Rе₃\n\n(1/24 + 1/120 + 1/9,474)·V₁ = 11,3889  →  0,15556·V₁ = 11,3889  →  **V₁ = 73,214 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/R₁ = (20 − (73,214))/24 = **−2,217 A**\n- I₂ = (−V₁)/Rе₂ = (−(73,214))/120 = **−0,61 A**\n- I₃ = (e₃ − V₁)/Rе₃ = (100 − (73,214))/9,474 = **2,827 A**\n\nПроверка с I ЗК: −2,217 + (−0,61) + (2,827) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ + e₃·I₃ = (20)·(−2,217) + (100)·(2,827) = **238,393 W**\n\nΣP_конс = R₁·I₁² + Rе₂·I₂² + Rе₃·I₃² = 24·4,916 + 120·0,372 + 9,474·7,994 = **238,393 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е последователно на R3, а R3 ∥ R5: токът на клона се разделя обратно на съпротивленията — I_A = |I₃|·R5/(R3 + R5) = 2,827·18/38 = **1,339 A**\n- Волтметърът е успоредно на R1: U_V = R1·|I₁| = 24·2,217 = **53,214 V**"},{"id":"RLC01","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M271.0 70 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"360\" y1=\"70\" x2=\"410.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"70\" x2=\"470\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"410.0\" y1=\"57\" x2=\"410.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"57\" x2=\"420.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"52\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"470\" y1=\"70\" x2=\"530\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"530\" y1=\"70\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"170\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"70\" x2=\"30\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"60\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">a<\/text><text x=\"30\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">b<\/text><line x1=\"126\" y1=\"70\" x2=\"126\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 10 Ω, L = 10 mH, C = 20 µF, ω = 2000 rad/s; амперметърът показва I = 2 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"X_C, Ω","type":"real","answer":25.0,"shown":"25"},{"label":"Z, Ω","type":"real","answer":11.18034,"shown":"11,18"},{"label":"I (ефективна), A","type":"real","answer":2,"shown":"2"},{"label":"U (ефективна), V","type":"real","answer":22.36068,"shown":"22,361"},{"label":"U_C, V","type":"real","answer":50.0,"shown":"50"},{"label":"φ, °","type":"real","answer":-26.565051,"shown":"−26,565","abs":0.3},{"label":"P, W","type":"real","answer":40,"shown":"40"},{"label":"Q, VAr","type":"real","answer":-20.0,"shown":"−20"},{"label":"S, VA","type":"real","answer":44.72136,"shown":"44,721"},{"label":"cos φ","type":"real","answer":0.894427,"shown":"0,894"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":31.622777,"shown":"31,623"},{"label":"ψᵤ, °","type":"real","answer":-26.565051,"shown":"−26,565","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,01 H, C = 0,00002 F)\n- X_L = ωL = 2000·0,01 = **20 Ω**\n- X_C = 1/(ωC) = 1/(2000·0,00002) = **25 Ω**\n- X = X_L − X_C = −5 Ω → характер: **капацитивен (X_L < X_C, токът изпреварва напрежението)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(10² + −5²) = **11,18 Ω**\n\n**3. Напрежение:** U = Z·I = 11,18·2 = **22,361 V**\n- U_R = R·I = **20 V**, U_L = X_L·I = **40 V**, U_C = X_C·I = **50 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(20² + −10²) = 22,361 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(−5/10) = **−26,57°**\n\n**5. Мощности**\n- P = R·I² = 10·4 = **40 W**\n- Q = (X_L − X_C)·I² = −5·4 = **−20 VAr** (отрицателна — капацитивен характер)\n- S = U·I = Z·I² = **44,721 VA**; проверка: √(P² + Q²) = 44,721 ✓\n- cos φ = P/S = R/Z = **0,8944**\n\n**6. Моментни стойности:** Iₘ = √2·I = 2,828 A, Uₘ = √2·U = 31,623 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = −26,57°\n- i(t) = 2,828·sin(2000t + 0°) A\n- u(t) = 31,623·sin(2000t − 26,57°) V\n\n(f = ω/2π = 318,31 Hz.)"},{"id":"RLC02","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M271.0 70 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"360\" y1=\"70\" x2=\"410.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"70\" x2=\"470\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"410.0\" y1=\"57\" x2=\"410.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"57\" x2=\"420.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"52\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"470\" y1=\"70\" x2=\"530\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"530\" y1=\"70\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"170\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"70\" x2=\"30\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"60\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">a<\/text><text x=\"30\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">b<\/text><line x1=\"126\" y1=\"70\" x2=\"126\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 20 Ω, L = 20 mH, C = 20 µF, ω = 1000 rad/s; амперметърът показва I = 2 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"X_C, Ω","type":"real","answer":50.0,"shown":"50"},{"label":"Z, Ω","type":"real","answer":36.055513,"shown":"36,056"},{"label":"I (ефективна), A","type":"real","answer":2,"shown":"2"},{"label":"U (ефективна), V","type":"real","answer":72.111026,"shown":"72,111"},{"label":"U_C, V","type":"real","answer":100.0,"shown":"100"},{"label":"φ, °","type":"real","answer":-56.309932,"shown":"−56,31","abs":0.3},{"label":"P, W","type":"real","answer":80,"shown":"80"},{"label":"Q, VAr","type":"real","answer":-120.0,"shown":"−120"},{"label":"S, VA","type":"real","answer":144.222051,"shown":"144,222"},{"label":"cos φ","type":"real","answer":0.5547,"shown":"0,555"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":101.98039,"shown":"101,98"},{"label":"ψᵤ, °","type":"real","answer":-56.309932,"shown":"−56,31","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,02 H, C = 0,00002 F)\n- X_L = ωL = 1000·0,02 = **20 Ω**\n- X_C = 1/(ωC) = 1/(1000·0,00002) = **50 Ω**\n- X = X_L − X_C = −30 Ω → характер: **капацитивен (X_L < X_C, токът изпреварва напрежението)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(20² + −30²) = **36,056 Ω**\n\n**3. Напрежение:** U = Z·I = 36,056·2 = **72,111 V**\n- U_R = R·I = **40 V**, U_L = X_L·I = **40 V**, U_C = X_C·I = **100 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(40² + −60²) = 72,111 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(−30/20) = **−56,31°**\n\n**5. Мощности**\n- P = R·I² = 20·4 = **80 W**\n- Q = (X_L − X_C)·I² = −30·4 = **−120 VAr** (отрицателна — капацитивен характер)\n- S = U·I = Z·I² = **144,222 VA**; проверка: √(P² + Q²) = 144,222 ✓\n- cos φ = P/S = R/Z = **0,5547**\n\n**6. Моментни стойности:** Iₘ = √2·I = 2,828 A, Uₘ = √2·U = 101,98 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = −56,31°\n- i(t) = 2,828·sin(1000t + 0°) A\n- u(t) = 101,98·sin(1000t − 56,31°) V\n\n(f = ω/2π = 159,15 Hz.)"},{"id":"RLC03","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" fo e x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 33 Ω, L = 47,1 mH, C = 248 µF, ω = 314 rad/s; амперметърът показва I = 0,1 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":14.7894,"shown":"14,789"},{"label":"X_C, Ω","type":"real","answer":12.841586,"shown":"12,842"},{"label":"Z, Ω","type":"real","answer":33.057435,"shown":"33,057"},{"label":"I (ефективна), A","type":"real","answer":0.1,"shown":"0,1"},{"label":"U (ефективна), V","type":"real","answer":3.305743,"shown":"3,306"},{"label":"U_C, V","type":"real","answer":1.284159,"shown":"1,284"},{"label":"φ, °","type":"real","answer":3.377945,"shown":"3,378","abs":0.3},{"label":"P, W","type":"real","answer":0.33,"shown":"0,33"},{"label":"Q, VAr","type":"real","answer":0.019478,"shown":"0,019"},{"label":"S, VA","type":"real","answer":0.330574,"shown":"0,331"},{"label":"cos φ","type":"real","answer":0.998263,"shown":"0,998"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":4.675027,"shown":"4,675"},{"label":"ψᵤ, °","type":"real","answer":3.377945,"shown":"3,378","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,0471 H, C = 0,000248 F)\n- X_L = ωL = 314·0,0471 = **14,789 Ω**\n- X_C = 1/(ωC) = 1/(314·0,000248) = **12,842 Ω**\n- X = X_L − X_C = 1,948 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(33² + 1,948²) = **33,057 Ω**\n\n**3. Напрежение:** U = Z·I = 33,057·0,1 = **3,306 V**\n- U_R = R·I = **3,3 V**, U_L = X_L·I = **1,479 V**, U_C = X_C·I = **1,284 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(3,3² + 0,195²) = 3,306 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(1,948/33) = **3,38°**\n\n**5. Мощности**\n- P = R·I² = 33·0,01 = **0,33 W**\n- Q = (X_L − X_C)·I² = 1,948·0,01 = **0,019 VAr**\n- S = U·I = Z·I² = **0,331 VA**; проверка: √(P² + Q²) = 0,331 ✓\n- cos φ = P/S = R/Z = **0,9983**\n\n**6. Моментни стойности:** Iₘ = √2·I = 0,141 A, Uₘ = √2·U = 4,675 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = 3,38°\n- i(t) = 0,141·sin(314t + 0°) A\n- u(t) = 4,675·sin(314t + 3,38°) V\n\n(f = ω/2π = 49,97 Hz.)"},{"id":"RLC04","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\ елете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете i(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":100.0,"shown":"100"},{"label":"X_C, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"Z, Ω","type":"real","answer":85.440037,"shown":"85,44"},{"label":"I (ефективна), A","type":"real","answer":0.827606,"shown":"0,828"},{"label":"U (ефективна), V","type":"real","answer":70.710678,"shown":"70,711"},{"label":"U_C, V","type":"real","answer":16.552118,"shown":"16,552"},{"label":"φ, °","type":"real","answer":69.443955,"shown":"69,444","abs":0.3},{"label":"P, W","type":"real","answer":20.547945,"shown":"20,548"},{"label":"Q, VAr","type":"real","answer":54.794521,"shown":"54,795"},{"label":"S, VA","type":"real","answer":58.520574,"shown":"58,521"},{"label":"cos φ","type":"real","answer":0.351123,"shown":"0,351"},{"label":"Iₘ (амплитуда на тока), A","type":"real","answer":1.170411,"shown":"1,17"},{"label":"ψᵢ, °","type":"real","answer":-39.443955,"shown":"−39,444","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,1 H, C = 0,00005 F)\n- X_L = ωL = 1000·0,1 = **100 Ω**\n- X_C = 1/(ωC) = 1/(1000·0,00005) = **20 Ω**\n- X = X_L − X_C = 80 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(30² + 80²) = **85,44 Ω**\n\n**3. Ток:** U = Uₘ/√2 = 100/√2 = 70,711 V → I = U/Z = 70,711/85,44 = **0,828 A**\n- U_R = R·I = **24,828 V**, U_L = X_L·I = **82,761 V**, U_C = X_C·I = **16,552 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(24,828² + 66,208²) = 70,711 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(80/30) = **69,44°**\n\n**5. Мощности**\n- P = R·I² = 30·0,685 = **20,548 W**\n- Q = (X_L − X_C)·I² = 80·0,685 = **54,795 VAr**\n- S = U·I = Z·I² = **58,521 VA**; проверка: √(P² + Q²) = 58,521 ✓\n- cos φ = P/S = R/Z = **0,3511**\n\n**6. Моментни стойности:** Iₘ = √2·I = 1,17 A, Uₘ = √2·U = 100 V, ψᵢ = −39,44°, ψᵤ = ψᵢ + φ = 30°\n- i(t) = 1,17·sin(1000t − 39,44°) A\n- u(t) = 100·sin(1000t + 30°) V\n\n(f = ω/2π = 159,15 Hz.)"},{"id":"RLC05","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M271.0 70 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"360\" y1=\"70\" x2=\"410.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"70\" x2=\"470\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"410.0\" y1=\"57\" x2=\"410.0\" y2=\"83\" stroke=\ chor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 40 Ω, L = 50 mH, C = 25 µF, ω = 2000 rad/s; i(t) = 2·sin(2000t + 0°) A.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":100.0,"shown":"100"},{"label":"X_C, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"Z, Ω","type":"real","answer":89.442719,"shown":"89,443"},{"label":"I (ефективна), A","type":"real","answer":1.414214,"shown":"1,414"},{"label":"U (ефективна), V","type":"real","answer":126.491106,"shown":"126,491"},{"label":"U_C, V","type":"real","answer":28.284271,"shown":"28,284"},{"label":"φ, °","type":"real","answer":63.434949,"shown":"63,435","abs":0.3},{"label":"P, W","type":"real","answer":80.0,"shown":"80"},{"label":"Q, VAr","type":"real","answer":160.0,"shown":"160"},{"label":"S, VA","type":"real","answer":178.885438,"shown":"178,885"},{"label":"cos φ","type":"real","answer":0.447214,"shown":"0,447"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":178.885438,"shown":"178,885"},{"label":"ψᵤ, °","type":"real","answer":63.434949,"shown":"63,435","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,05 H, C = 0,000025 F)\n- X_L = ωL = 2000·0,05 = **100 Ω**\n- X_C = 1/(ωC) = 1/(2000·0,000025) = **20 Ω**\n- X = X_L − X_C = 80 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(40² + 80²) = **89,443 Ω**\n\n**3. Напрежение:** I = Iₘ/√2 = 2/√2 = 1,414 A → U = Z·I = 89,443·1,414 = **126,491 V**\n- U_R = R·I = **56,569 V**, U_L = X_L·I = **141,421 V**, U_C = X_C·I = **28,284 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(56,569² + 113,137²) = 126,491 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(80/40) = **63,43°**\n\n**5. Мощности**\n- P = R·I² = 40·2 = **80 W**\n- Q = (X_L − X_C)·I² = 80·2 = **160 VAr**\n- S = U·I = Z·I² = **178,885 VA**; проверка: √(P² + Q²) = 178,885 ✓\n- cos φ = P/S = R/Z = **0,4472**\n\n**6. Моментни стойности:** Iₘ = √2·I = 2 A, Uₘ = √2·U = 178,885 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = 63,43°\n- i(t) = 2·sin(2000t + 0°) A\n- u(t) = 178,885·sin(2000t + 63,43°) V\n\n(f = ω/2π = 318,31 Hz.)"},{"id":"RLC06","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"7 "/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 15 Ω, L = 40 mH, C = 100 µF, ω = 500 rad/s; амперметърът показва I = 3 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"X_C, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"Z, Ω","type":"real","answer":15.0,"shown":"15"},{"label":"I (ефективна), A","type":"real","answer":3,"shown":"3"},{"label":"U (ефективна), V","type":"real","answer":45.0,"shown":"45"},{"label":"U_C, V","type":"real","answer":60.0,"shown":"60"},{"label":"φ, °","type":"real","answer":0.0,"shown":"0","abs":0.3},{"label":"P, W","type":"real","answer":135,"shown":"135"},{"label":"Q, VAr","type":"real","answer":0.0,"shown":"0"},{"label":"S, VA","type":"real","answer":135.0,"shown":"135"},{"label":"cos φ","type":"real","answer":1.0,"shown":"1"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":63.63961,"shown":"63,64"},{"label":"ψᵤ, °","type":"real","answer":0.0,"shown":"0","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,04 H, C = 0,0001 F)\n- X_L = ωL = 500·0,04 = **20 Ω**\n- X_C = 1/(ωC) = 1/(500·0,0001) = **20 Ω**\n- X = X_L − X_C = 0 Ω → характер: **резонанс (X_L = X_C)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(15² + 0²) = **15 Ω**\n\n**3. Напрежение:** U = Z·I = 15·3 = **45 V**\n- U_R = R·I = **45 V**, U_L = X_L·I = **60 V**, U_C = X_C·I = **60 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(45² + 0²) = 45 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(0/15) = **0°**\n\n**5. Мощности**\n- P = R·I² = 15·9 = **135 W**\n- Q = (X_L − X_C)·I² = 0·9 = **0 VAr**\n- S = U·I = Z·I² = **135 VA**; проверка: √(P² + Q²) = 135 ✓\n- cos φ = P/S = R/Z = **1**\n\n**6. Моментни стойности:** Iₘ = √2·I = 4,243 A, Uₘ = √2·U = 63,64 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = 0°\n- i(t) = 4,243·sin(500t + 0°) A\n- u(t) = 63,64·sin(500t + 0°) V\n\n(f = ω/2π = 79,58 Hz.)"},{"id":"RLC07","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\" "middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 50 Ω, L = 200 mH, C = 10 µF, ω = 1000 rad/s; u(t) = 141·sin(1000t + 0°) V.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете i(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":200.0,"shown":"200"},{"label":"X_C, Ω","type":"real","answer":100.0,"shown":"100"},{"label":"Z, Ω","type":"real","answer":111.803399,"shown":"111,803"},{"label":"I (ефективна), A","type":"real","answer":0.891762,"shown":"0,892"},{"label":"U (ефективна), V","type":"real","answer":99.702056,"shown":"99,702"},{"label":"U_C, V","type":"real","answer":89.17623,"shown":"89,176"},{"label":"φ, °","type":"real","answer":63.434949,"shown":"63,435","abs":0.3},{"label":"P, W","type":"real","answer":39.762,"shown":"39,762"},{"label":"Q, VAr","type":"real","answer":79.524,"shown":"79,524"},{"label":"S, VA","type":"real","answer":88.910535,"shown":"88,911"},{"label":"cos φ","type":"real","answer":0.447214,"shown":"0,447"},{"label":"Iₘ (амплитуда на тока), A","type":"real","answer":1.261142,"shown":"1,261"},{"label":"ψᵢ, °","type":"real","answer":-63.434949,"shown":"−63,435","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,2 H, C = 0,00001 F)\n- X_L = ωL = 1000·0,2 = **200 Ω**\n- X_C = 1/(ωC) = 1/(1000·0,00001) = **100 Ω**\n- X = X_L − X_C = 100 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(50² + 100²) = **111,803 Ω**\n\n**3. Ток:** U = Uₘ/√2 = 141/√2 = 99,702 V → I = U/Z = 99,702/111,803 = **0,892 A**\n- U_R = R·I = **44,588 V**, U_L = X_L·I = **178,352 V**, U_C = X_C·I = **89,176 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(44,588² + 89,176²) = 99,702 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(100/50) = **63,43°**\n\n**5. Мощности**\n- P = R·I² = 50·0,795 = **39,762 W**\n- Q = (X_L − X_C)·I² = 100·0,795 = **79,524 VAr**\n- S = U·I = Z·I² = **88,911 VA**; проверка: √(P² + Q²) = 88,911 ✓\n- cos φ = P/S = R/Z = **0,4472**\n\n**6. Моментни стойности:** Iₘ = √2·I = 1,261 A, Uₘ = √2·U = 141 V, ψᵢ = −63,43°, ψᵤ = ψᵢ + φ = 0°\n- i(t) = 1,261·sin(1000t − 63,43°) A\n- u(t) = 141·sin(1000t + 0°) V\n\n(f = ω/2π = 159,15 Hz.)"},{"id":"RLC08","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M271.0 70 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"360\" y1=\"70\" x2=\"410.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2 h=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 25 Ω, L = 30 mH, C = 40 µF, ω = 1000 rad/s; i(t) = 4·sin(1000t − 20°) A.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":30.0,"shown":"30"},{"label":"X_C, Ω","type":"real","answer":25.0,"shown":"25"},{"label":"Z, Ω","type":"real","answer":25.495098,"shown":"25,495"},{"label":"I (ефективна), A","type":"real","answer":2.828427,"shown":"2,828"},{"label":"U (ефективна), V","type":"real","answer":72.111026,"shown":"72,111"},{"label":"U_C, V","type":"real","answer":70.710678,"shown":"70,711"},{"label":"φ, °","type":"real","answer":11.309932,"shown":"11,31","abs":0.3},{"label":"P, W","type":"real","answer":200.0,"shown":"200"},{"label":"Q, VAr","type":"real","answer":40.0,"shown":"40"},{"label":"S, VA","type":"real","answer":203.960781,"shown":"203,961"},{"label":"cos φ","type":"real","answer":0.980581,"shown":"0,981"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":101.98039,"shown":"101,98"},{"label":"ψᵤ, °","type":"real","answer":-8.690068,"shown":"−8,69","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,03 H, C = 0,00004 F)\n- X_L = ωL = 1000·0,03 = **30 Ω**\n- X_C = 1/(ωC) = 1/(1000·0,00004) = **25 Ω**\n- X = X_L − X_C = 5 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(25² + 5²) = **25,495 Ω**\n\n**3. Напрежение:** I = Iₘ/√2 = 4/√2 = 2,828 A → U = Z·I = 25,495·2,828 = **72,111 V**\n- U_R = R·I = **70,711 V**, U_L = X_L·I = **84,853 V**, U_C = X_C·I = **70,711 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(70,711² + 14,142²) = 72,111 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(5/25) = **11,31°**\n\n**5. Мощности**\n- P = R·I² = 25·8 = **200 W**\n- Q = (X_L − X_C)·I² = 5·8 = **40 VAr**\n- S = U·I = Z·I² = **203,961 VA**; проверка: √(P² + Q²) = 203,961 ✓\n- cos φ = P/S = R/Z = **0,9806**\n\n**6. Моментни стойности:** Iₘ = √2·I = 4 A, Uₘ = √2·U = 101,98 V, ψᵢ = −20°, ψᵤ = ψᵢ + φ = −8,69°\n- i(t) = 4·sin(1000t − 20°) A\n- u(t) = 101,98·sin(1000t − 8,69°) V\n\n(f = ω/2π = 159,15 Hz.)"},{"id":"RLC09","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\ " y1=\"170\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"70\" x2=\"30\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"60\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">a<\/text><text x=\"30\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">b<\/text><line x1=\"126\" y1=\"70\" x2=\"126\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 60 Ω, L = 150 mH, C = 20 µF, ω = 500 rad/s; амперметърът показва I = 1,5 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":75.0,"shown":"75"},{"label":"X_C, Ω","type":"real","answer":100.0,"shown":"100"},{"label":"Z, Ω","type":"real","answer":65.0,"shown":"65"},{"label":"I (ефективна), A","type":"real","answer":1.5,"shown":"1,5"},{"label":"U (ефективна), V","type":"real","answer":97.5,"shown":"97,5"},{"label":"U_C, V","type":"real","answer":150.0,"shown":"150"},{"label":"φ, °","type":"real","answer":-22.619865,"shown":"−22,62","abs":0.3},{"label":"P, W","type":"real","answer":135.0,"shown":"135"},{"label":"Q, VAr","type":"real","answer":-56.25,"shown":"−56,25"},{"label":"S, VA","type":"real","answer":146.25,"shown":"146,25"},{"label":"cos φ","type":"real","answer":0.923077,"shown":"0,923"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":137.885822,"shown":"137,886"},{"label":"ψᵤ, °","type":"real","answer":-22.619865,"shown":"−22,62","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,15 H, C = 0,00002 F)\n- X_L = ωL = 500·0,15 = **75 Ω**\n- X_C = 1/(ωC) = 1/(500·0,00002) = **100 Ω**\n- X = X_L − X_C = −25 Ω → характер: **капацитивен (X_L < X_C, токът изпреварва напрежението)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(60² + −25²) = **65 Ω**\n\n**3. Напрежение:** U = Z·I = 65·1,5 = **97,5 V**\n- U_R = R·I = **90 V**, U_L = X_L·I = **112,5 V**, U_C = X_C·I = **150 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(90² + −37,5²) = 97,5 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(−25/60) = **−22,62°**\n\n**5. Мощности**\n- P = R·I² = 60·2,25 = **135 W**\n- Q = (X_L − X_C)·I² = −25·2,25 = **−56,25 VAr** (отрицателна — капацитивен характер)\n- S = U·I = Z·I² = **146,25 VA**; проверка: √(P² + Q²) = 146,25 ✓\n- cos φ = P/S = R/Z = **0,9231**\n\n**6. Моментни стойности:** Iₘ = √2·I = 2,121 A, Uₘ = √2·U = 137,886 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = −22,62°\n- i(t) = 2,121·sin(500t + 0°) A\n- u(t) = 137,886·sin(500t − 22,62°) V\n\n(f = ω/2π = 79,58 Hz.)"},{"id":"RLC10","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" 111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 12 Ω, L = 8 mH, C = 50 µF, ω = 2500 rad/s; u(t) = 120·sin(2500t + 45°) V.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете i(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":20.0,"shown":"20"},{"label":"X_C, Ω","type":"real","answer":8.0,"shown":"8"},{"label":"Z, Ω","type":"real","answer":16.970563,"shown":"16,971"},{"label":"I (ефективна), A","type":"real","answer":5.0,"shown":"5"},{"label":"U (ефективна), V","type":"real","answer":84.852814,"shown":"84,853"},{"label":"U_C, V","type":"real","answer":40.0,"shown":"40"},{"label":"φ, °","type":"real","answer":45.0,"shown":"45","abs":0.3},{"label":"P, W","type":"real","answer":300.0,"shown":"300"},{"label":"Q, VAr","type":"real","answer":300.0,"shown":"300"},{"label":"S, VA","type":"real","answer":424.264069,"shown":"424,264"},{"label":"cos φ","type":"real","answer":0.707107,"shown":"0,707"},{"label":"Iₘ (амплитуда на тока), A","type":"real","answer":7.071068,"shown":"7,071"},{"label":"ψᵢ, °","type":"real","answer":0.0,"shown":"0","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,008 H, C = 0,00005 F)\n- X_L = ωL = 2500·0,008 = **20 Ω**\n- X_C = 1/(ωC) = 1/(2500·0,00005) = **8 Ω**\n- X = X_L − X_C = 12 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(12² + 12²) = **16,971 Ω**\n\n**3. Ток:** U = Uₘ/√2 = 120/√2 = 84,853 V → I = U/Z = 84,853/16,971 = **5 A**\n- U_R = R·I = **60 V**, U_L
