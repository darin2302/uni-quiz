ите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":300.0,"shown":"300"},{"label":"X_C, Ω","type":"real","answer":200.0,"shown":"200"},{"label":"Z, Ω","type":"real","answer":128.062485,"shown":"128,062"},{"label":"I (ефективна), A","type":"real","answer":0.997021,"shown":"0,997"},{"label":"U (ефективна), V","type":"real","answer":127.68093,"shown":"127,681"},{"label":"U_C, V","type":"real","answer":199.404112,"shown":"199,404"},{"label":"φ, °","type":"real","answer":51.340192,"shown":"51,34","abs":0.3},{"label":"P, W","type":"real","answer":79.524,"shown":"79,524"},{"label":"Q, VAr","type":"real","answer":99.405,"shown":"99,405"},{"label":"S, VA","type":"real","answer":127.300513,"shown":"127,301"},{"label":"cos φ","type":"real","answer":0.624695,"shown":"0,625"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":180.568103,"shown":"180,568"},{"label":"ψᵤ, °","type":"real","answer":61.340192,"shown":"61,34","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,3 H, C = 0,000005 F)\n- X_L = ωL = 1000·0,3 = **300 Ω**\n- X_C = 1/(ωC) = 1/(1000·0,000005) = **200 Ω**\n- X = X_L − X_C = 100 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(80² + 100²) = **128,062 Ω**\n\n**3. Напрежение:** I = Iₘ/√2 = 1,41/√2 = 0,997 A → U = Z·I = 128,062·0,997 = **127,681 V**\n- U_R = R·I = **79,762 V**, U_L = X_L·I = **299,106 V**, U_C = X_C·I = **199,404 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(79,762² + 99,702²) = 127,681 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(100/80) = **51,34°**\n\n**5. Мощности**\n- P = R·I² = 80·0,994 = **79,524 W**\n- Q = (X_L − X_C)·I² = 100·0,994 = **99,405 VAr**\n- S = U·I = Z·I² = **127,301 VA**; проверка: √(P² + Q²) = 127,301 ✓\n- cos φ = P/S = R/Z = **0,6247**\n\n**6. Моментни стойности:** Iₘ = √2·I = 1,41 A, Uₘ = √2·U = 180,568 V, ψᵢ = 10°, ψᵤ = ψᵢ + φ = 61,34°\n- i(t) = 1,41·sin(1000t + 10°) A\n- u(t) = 180,568·sin(1000t + 61,34°) V\n\n(f = ω/2π = 159,15 Hz.)"},{"id":"RLC12","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M271.0 70 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"360\" y1=\"70\" x2=\"410.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"70\" x2=\"470\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"410.0\" y1=\"57\" x2=\"410.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"57\" x2=\"420.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"52\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"470\" y1=\"70\" x2=\"530\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"530\" y1=\"70\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"170\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"70\" x2=\"30\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"60\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">a<\/text><text x=\"30\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">b<\/text><line x1=\"126\" y1=\"70\" x2=\"126\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 20 Ω, L = 64 mH, C = 100 µF, ω = 314 rad/s; амперметърът показва I = 5 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":20.096,"shown":"20,096"},{"label":"X_C, Ω","type":"real","answer":31.847134,"shown":"31,847"},{"label":"Z, Ω","type":"real","answer":23.196749,"shown":"23,197"},{"label":"I (ефективна), A","type":"real","answer":5,"shown":"5"},{"label":"U (ефективна), V","type":"real","answer":115.983743,"shown":"115,984"},{"label":"U_C, V","type":"real","answer":159.235669,"shown":"159,236"},{"label":"φ, °","type":"real","answer":-30.43665,"shown":"−30,437","abs":0.3},{"label":"P, W","type":"real","answer":500,"shown":"500"},{"label":"Q, VAr","type":"real","answer":-293.778344,"shown":"−293,778"},{"label":"S, VA","type":"real","answer":579.918714,"shown":"579,919"},{"label":"cos φ","type":"real","answer":0.86219,"shown":"0,862"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":164.025782,"shown":"164,026"},{"label":"ψᵤ, °","type":"real","answer":-30.43665,"shown":"−30,437","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,064 H, C = 0,0001 F)\n- X_L = ωL = 314·0,064 = **20,096 Ω**\n- X_C = 1/(ωC) = 1/(314·0,0001) = **31,847 Ω**\n- X = X_L − X_C = −11,751 Ω → характер: **капацитивен (X_L < X_C, токът изпреварва напрежението)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(20² + −11,751²) = **23,197 Ω**\n\n**3. Напрежение:** U = Z·I = 23,197·5 = **115,984 V**\n- U_R = R·I = **100 V**, U_L = X_L·I = **100,48 V**, U_C = X_C·I = **159,236 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(100² + −58,756²) = 115,984 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(−11,751/20) = **−30,44°**\n\n**5. Мощности**\n- P = R·I² = 20·25 = **500 W**\n- Q = (X_L − X_C)·I² = −11,751·25 = **−293,778 VAr** (отрицателна — капацитивен характер)\n- S = U·I = Z·I² = **579,919 VA**; проверка: √(P² + Q²) = 579,919 ✓\n- cos φ = P/S = R/Z = **0,8622**\n\n**6. Моментни стойности:** Iₘ = √2·I = 7,071 A, Uₘ = √2·U = 164,026 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = −30,44°\n- i(t) = 7,071·sin(314t + 0°) A\n- u(t) = 164,026·sin(314t − 30,44°) V\n\n(f = ω/2π = 49,97 Hz.)"},{"id":"RLC13","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\ "60\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">a<\/text><text x=\"30\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">b<\/text><line x1=\"126\" y1=\"70\" x2=\"126\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 45 Ω, L = 120 mH, C = 15 µF, ω = 800 rad/s; u(t) = 200·sin(800t − 15°) V.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете i(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":96.0,"shown":"96"},{"label":"X_C, Ω","type":"real","answer":83.333333,"shown":"83,333"},{"label":"Z, Ω","type":"real","answer":46.748737,"shown":"46,749"},{"label":"I (ефективна), A","type":"real","answer":3.025137,"shown":"3,025"},{"label":"U (ефективна), V","type":"real","answer":141.421356,"shown":"141,421"},{"label":"U_C, V","type":"real","answer":252.094788,"shown":"252,095"},{"label":"φ, °","type":"real","answer":15.720928,"shown":"15,721","abs":0.3},{"label":"P, W","type":"real","answer":411.815547,"shown":"411,816"},{"label":"Q, VAr","type":"real","answer":115.91845,"shown":"115,918"},{"label":"S, VA","type":"real","answer":427.819041,"shown":"427,819"},{"label":"cos φ","type":"real","answer":0.962593,"shown":"0,963"},{"label":"Iₘ (амплитуда на тока), A","type":"real","answer":4.27819,"shown":"4,278"},{"label":"ψᵢ, °","type":"real","answer":-30.720928,"shown":"−30,721","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,12 H, C = 0,000015 F)\n- X_L = ωL = 800·0,12 = **96 Ω**\n- X_C = 1/(ωC) = 1/(800·0,000015) = **83,333 Ω**\n- X = X_L − X_C = 12,667 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(45² + 12,667²) = **46,749 Ω**\n\n**3. Ток:** U = Uₘ/√2 = 200/√2 = 141,421 V → I = U/Z = 141,421/46,749 = **3,025 A**\n- U_R = R·I = **136,131 V**, U_L = X_L·I = **290,413 V**, U_C = X_C·I = **252,095 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(136,131² + 38,318²) = 141,421 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(12,667/45) = **15,72°**\n\n**5. Мощности**\n- P = R·I² = 45·9,151 = **411,816 W**\n- Q = (X_L − X_C)·I² = 12,667·9,151 = **115,918 VAr**\n- S = U·I = Z·I² = **427,819 VA**; проверка: √(P² + Q²) = 427,819 ✓\n- cos φ = P/S = R/Z = **0,9626**\n\n**6. Моментни стойности:** Iₘ = √2·I = 4,278 A, Uₘ = √2·U = 200 V, ψᵢ = −30,72°, ψᵤ = ψᵢ + φ = −15°\n- i(t) = 4,278·sin(800t − 30,72°) A\n- u(t) = 200·sin(800t − 15°) V\n\n(f = ω/2π = 127,32 Hz.)"},{"id":"RLC14","group":"rlc","lec":7,"title":"Последователна RLC верига","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 210\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"30\" y1=\"70\" x2=\"70\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"70\" x2=\"82.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"108.0\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"95.0\" cy=\"70\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"95.0\" y=\"75\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"120\" y1=\"70\" x2=\"153.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"153.0\" y=\"61\" width=\"44\" height=\"18\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"230\" y1=\"70\" x2=\"271.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"319.0\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M271.0 70 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"360\" y1=\"70\" x2=\"410.0\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"70\" x2=\"470\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"410.0\" y1=\"57\" x2=\"410.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"420.0\" y1=\"57\" x2=\"420.0\" y2=\"83\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"52\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"470\" y1=\"70\" x2=\"530\" y2=\"70\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"530\" y1=\"70\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"170\" x2=\"530\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"70\" x2=\"30\" y2=\"170\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"60\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">a<\/text><text x=\"30\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">b<\/text><line x1=\"126\" y1=\"70\" x2=\"126\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"70\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"126\" y1=\"30\" x2=\"162.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"188.0\" y1=\"30\" x2=\"224\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"175.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"175.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"192.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">R<\/text><line x1=\"236\" y1=\"70\" x2=\"236\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"354\" y1=\"70\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"236\" y1=\"30\" x2=\"282.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"308.0\" y1=\"30\" x2=\"354\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"295.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"295.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"312.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">L<\/text><line x1=\"366\" y1=\"70\" x2=\"366\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"464\" y1=\"70\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"366\" y1=\"30\" x2=\"402.0\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"428.0\" y1=\"30\" x2=\"464\" y2=\"30\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"415.0\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"415.0\" y=\"35\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><text x=\"432.0\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\">C<\/text><line x1=\"30\" y1=\"85\" x2=\"30\" y2=\"107.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"30\" y1=\"133.0\" x2=\"30\" y2=\"155\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"120.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"125.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><\/svg>\n\nПоследователна RLC верига: R = 10 Ω, L = 25 mH, C = 160 µF, ω = 1000 rad/s; амперметърът показва I = 2,5 A, началната фаза на тока е ψᵢ = 0.\n\nОпределете X_L, X_C, Z, тока I и напрежението U (ефективни стойности), напреженията U_R, U_L, U_C, ъгъла φ, мощностите P, Q, S и cos φ, характера на веригата и запишете u(t). Ъглите — в градуси.","fields":[{"label":"X_L, Ω","type":"real","answer":25.0,"shown":"25"},{"label":"X_C, Ω","type":"real","answer":6.25,"shown":"6,25"},{"label":"Z, Ω","type":"real","answer":21.25,"shown":"21,25"},{"label":"I (ефективна), A","type":"real","answer":2.5,"shown":"2,5"},{"label":"U (ефективна), V","type":"real","answer":53.125,"shown":"53,125"},{"label":"U_C, V","type":"real","answer":15.625,"shown":"15,625"},{"label":"φ, °","type":"real","answer":61.927513,"shown":"61,928","abs":0.3},{"label":"P, W","type":"real","answer":62.5,"shown":"62,5"},{"label":"Q, VAr","type":"real","answer":117.1875,"shown":"117,188"},{"label":"S, VA","type":"real","answer":132.8125,"shown":"132,812"},{"label":"cos φ","type":"real","answer":0.470588,"shown":"0,471"},{"label":"Uₘ (амплитуда на напрежението), V","type":"real","answer":75.130096,"shown":"75,13"},{"label":"ψᵤ, °","type":"real","answer":61.927513,"shown":"61,928","abs":0.3}],"solution":"**1. Реактивни съпротивления** (L и C в основни единици: L = 0,025 H, C = 0,00016 F)\n- X_L = ωL = 1000·0,025 = **25 Ω**\n- X_C = 1/(ωC) = 1/(1000·0,00016) = **6,25 Ω**\n- X = X_L − X_C = 18,75 Ω → характер: **индуктивен (X_L > X_C, напрежението изпреварва тока)**\n\n**2. Импеданс:** Z = √(R² + (X_L − X_C)²) = √(10² + 18,75²) = **21,25 Ω**\n\n**3. Напрежение:** U = Z·I = 21,25·2,5 = **53,125 V**\n- U_R = R·I = **25 V**, U_L = X_L·I = **62,5 V**, U_C = X_C·I = **15,625 V**\n- проверка: U = √(U_R² + (U_L − U_C)²) = √(25² + 46,875²) = 53,125 V ✓ (напреженията не се събират аритметично!)\n\n**4. Ъгъл на дефазиране:** φ = ψᵤ − ψᵢ = arctg((X_L − X_C)/R) = arctg(18,75/10) = **61,93°**\n\n**5. Мощности**\n- P = R·I² = 10·6,25 = **62,5 W**\n- Q = (X_L − X_C)·I² = 18,75·6,25 = **117,188 VAr**\n- S = U·I = Z·I² = **132,812 VA**; проверка: √(P² + Q²) = 132,812 ✓\n- cos φ = P/S = R/Z = **0,4706**\n\n**6. Моментни стойности:** Iₘ = √2·I = 3,536 A, Uₘ = √2·U = 75,13 V, ψᵢ = 0°, ψᵤ = ψᵢ + φ = 61,93°\n- i(t) = 3,536·sin(1000t + 0°) A\n- u(t) = 75,13·sin(1000t + 61,93°) V\n\n(f = ω/2π = 159,15 Hz.)"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.course; // pfx, tag, name, lecWord, secPerQ, secPerTask, exam {q, ptsQ, tasks, ptsTask, minutes}
const app = document.getElementById('app');
const LETTERS = 'abcd';
const SEC_PER_Q = C.secPerQ;
const SEC_PER_TASK = C.secPerTask || 600;
const EX = C.exam;
const TASKS = DATA.tasks || [];
const GROUPS = DATA.taskGroups || [];
const TASK_WORD = C.taskWord || 'Задача';          // как се казва писменият елемент
const TASKS_TITLE = C.tasksTitle || 'Писмени задачи';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const ALL = [];
for (const l of DATA.lectures) for (const t of l.testNames) for (const q of l.tests[t]) ALL.push(Object.assign({ lec: l.num, test: t }, q));
const SAMPLE = (DATA.sample || []).map((q, i) => Object.assign({ lec: 0, test: 'S', id: 'S-' + (i + 1), n: i + 1 }, q));
const BY_ID = {};
for (const q of ALL.concat(SAMPLE)) BY_ID[q.id] = q;
for (const t of TASKS) BY_ID[t.id] = Object.assign({ isTask: true }, t);

const PFX = C.pfx; // префикс на ключовете в localStorage
let settings = store.get(PFX + '-settings', { instant: false, shuffle: false, forward: false });
let mistakes = new Set(store.get(PFX + '-mistakes', []));
let best = store.get(PFX + '-best', {});
let theme = store.get(PFX + '-theme', 'auto');
let hist = store.get(PFX + '-history', []);
if (!Array.isArray(hist)) hist = [];
let userName = store.get(PFX + '-name', null);
let editName = false;
applyTheme();

let Q = null, timerId = null;

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// course.json "subscripts": true → X_L, U_{ab} се показват като индекс (X<sub>L</sub>)
const subs = s => C.subscripts ? s.replace(/([A-Za-zА-яΣΦΨΔωφψ])_(?:\{([^}]+)\}|([0-9A-Za-zА-я]+))/g, (m, a, b, c) => `${a}<sub>${b || c}</sub>`) : s;
const inl = s => subs(esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
const md = s => window.marked ? marked.parse(subs(s)) : `<pre style="white-space:pre-wrap">${subs(esc(s))}</pre>`;
const num2 = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const ptsTxt = n => String(Math.round(n * 10) / 10).replace('.', ',');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lecName(n) { if (!n) return 'Примерен тест'; const l = DATA.lectures.find(x => x.num === n); return C.lecWord + ' ' + n + ' — ' + l.short; }
function groupOf(key) { return GROUPS.find(g => g.key === key); }
function itemTag(q) {
  if (!q.isTask) return esc(lecName(q.lec));
  const g = groupOf(q.group);
  return `${TASK_WORD} · ${esc(g.title)}${g.title.startsWith(C.lecWord) ? '' : ` · ${C.lecWord} ${q.lec}`}${q.src ? ` · <span class="badge half">${esc(q.src)}</span>` : ''}`;
}
function render(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h + ':' + pad(m) + ':' + pad(s); }

function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
const THEME_LABEL = { auto: '◐ Тема: авто', light: '☀ Тема: светла', dark: '☾ Тема: тъмна' };

function badge(key) {
  const b = best[key];
  if (!b) return '';
  const cls = b.s / b.t >= 0.9 ? 'good' : (b.s / b.t < 0.6 ? 'bad' : '');
  return `<span class="badge ${cls}">${ptsTxt(b.s)}/${b.t}</span>`;
}

/* ---------- Проверка на писмените задачи ---------- */
// кирилски букви, които изглеждат като латински (А, В, С, Е, Д→D)
const LOOK = { 'А': 'A', 'В': 'B', 'С': 'C', 'Е': 'E', 'Д': 'D', 'а': 'A', 'в': 'B', 'с': 'C', 'е': 'E', 'д': 'D' };
const latin = s => String(s).replace(/[АВСЕДавсед]/g, c => LOOK[c]);

function normNum(s) {
  s = latin(s).toUpperCase().replace(/\((2|3|8|10|16|BCD)\)|BCD|[₀-₉]+$/g, '').replace(/[\s_|]/g, '').replace(',', '.').replace(/^\+/, '');
  let [i, f] = s.split('.');
  i = (i || '').replace(/^0+(?=.)/, '') || '0';
  f = (f || '').replace(/0+$/, '');
  return f ? i + '.' + f : i;
}
const normCode = s => latin(s).toUpperCase().replace(/[\s|.,_]/g, '');
const parseSet = s => [...new Set((String(s).match(/\d+/g) || []).map(Number))].sort((a, b) => a - b);

// логически израз: отрицание ' ! ¬ ~ или черта (U+0305); И: · . * & ∧ или нищо; ИЛИ: + | ∨
function parseBool(src, vars) {
  const s = latin(src).replace(/̅/g, "'");
  let p = 0, lits = 0;
  const peek = () => { while (p < s.length && /\s/.test(s[p])) p++; return s[p]; };
  const startsUnary = c => c !== undefined && (/[A-Za-z01(!¬~]/.test(c));
  function or() {
    let a = and();
    while (/[+|∨]/.test(peek() || '')) { p++; const l = a, r = and(); a = e => l(e) || r(e); }
    return a;
  }
  function and() {
    let a = unary();
    for (;;) {
      const c = peek();
      if (c !== undefined && /[·.*&∧⋅]/.test(c)) { p++; const l = a, r = unary(); a = e => l(e) && r(e); }
      else if (startsUnary(c)) { const l = a, r = unary(); a = e => l(e) && r(e); }
      else return a;
    }
  }
  function unary() {
    const c = peek();
    if (c !== undefined && /[!¬~]/.test(c)) { p++; const x = unary(); return e => !x(e); }
    let a = atom();
    while (/['’′`]/.test(peek() || '')) { p++; const x = a; a = e => !x(e); }
    return a;
  }
  function atom() {
    const c = peek();
    if (c === undefined) throw new Error('изразът е непълен');
    if (c === '(') { p++; const x = or(); if (peek() !== ')') throw new Error('липсва „)“'); p++; return x; }
    if (c === '0' || c === '1') { p++; const v = c === '1'; return () => v; }
    const u = c.toUpperCase(), k = vars.indexOf(u);
    if (k < 0) throw new Error(`непозната променлива „${c}“ (позволени: ${vars.join(', ')})`);
    p++; lits++;
    return e => e[k];
  }
  if (!s.trim()) throw new Error('празно');
  const f = or();
  if (peek() !== undefined) throw new Error(`неочакван знак „${s[p]}“`);
  return { f, lits };
}

// оценка на едно поле: { credit: 0 | 0.5 | 1, note }
function checkField(fd, val) {
  val = val == null ? '' : String(val);
  if (!val.trim()) return { credit: 0, note: 'няма отговор' };
  if (fd.type === 'num') return normNum(val) === normNum(fd.answer) ? { credit: 1 } : { credit: 0 };
  if (fd.type === 'code') return normCode(val) === normCode(fd.answer) ? { credit: 1 } : { credit: 0 };
  if (fd.type === 'real') {
    const x = parseFloat(latin(val).replace(',', '.').replace(/[^0-9eE+\-.]/g, ''));
    if (isNaN(x)) return { credit: 0, note: 'не е число' };
    const tol = Math.max(fd.abs || 0.011, Math.abs(fd.answer) * (fd.tol || 0.01));
    return Math.abs(x - fd.answer) <= tol ? { credit: 1 } : { credit: 0 };
  }
  if (fd.type === 'essay') {
    const t = val.toLowerCase(); // без latin(): тук кирилицата трябва да остане кирилица
    const hit = fd.points.map(pt => pt.kw.some(k => t.includes(k.toLowerCase())));
    const n = hit.filter(Boolean).length;
    return { credit: n / fd.points.length, hit, note: `засегнати ключови моменти: ${n} от ${fd.points.length}` };
  }
  if (fd.type === 'set') { const a = parseSet(val), b = fd.answer; return a.length === b.length && a.every((x, i) => x === b[i]) ? { credit: 1 } : { credit: 0 }; }
  if (fd.type === 'bool') {
    let r;
    try { r = parseBool(val, fd.vars); } catch (e) { return { credit: 0, note: 'не мога да прочета израза: ' + e.message }; }
    const n = fd.vars.length, ones = new Set(fd.ones);
    for (let i = 0; i < (1 << n); i++) {
      const env = fd.vars.map((_, k) => !!((i >> (n - 1 - k)) & 1));
      if (!!r.f(env) !== ones.has(i)) return { credit: 0, note: `не е еквивалентен — различава се при набор ${i}` };
    }
    return r.lits <= fd.lits ? { credit: 1, note: 'еквивалентен и минимален' }
      : { credit: 0.5, note: `еквивалентен, но не минимален (${r.lits} литерала, минимумът е ${fd.lits})` };
  }
  return { credit: 0 };
}
function fieldAnswer(fd) {
  if (fd.type === 'set') return fd.answer.join(', ');
  if (fd.type === 'bool' || fd.type === 'essay') return '';
  if (fd.type === 'real') return String(fd.shown || fd.answer).replace('.', ',');
  return fd.answer;
}
const isEssay = t => t.fields.every(fd => fd.type === 'essay');
function pointsList(fd, m) {
  return `<ul class="kp">${fd.points.map((pt, k) => `<li class="${m && m.hit ? (m.hit[k] ? 'y' : 'n') : ''}">${m && m.hit ? (m.hit[k] ? '✓ ' : '✗ ') : ''}${inl(pt.t)}</li>`).join('')}</ul>`;
}
function autoTask(t, a) {
  const marks = t.fields.map((fd, k) => checkField(fd, a && a.f ? a.f[k] : ''));
  const sum = marks.reduce((s, m) => s + m.credit, 0);
  return { marks, pts: Math.round(EX.ptsTask * sum / t.fields.length * 2) / 2 };
}
const HINT = {
  num: 'само цифрите; водещите нули и индексът на основата не са задължителни',
  code: 'във вида знак|цифри, напр. 1|0011',
  set: 'номерата, разделени със запетая, напр. 1, 3, 4',
  bool: "напр. AB' + C'D — отрицание с ' или ! или ¬; И без знак или с ·; ИЛИ с +",
  real: 'число (десетична запетая или точка); приема се отклонение до ±1%',
  essay: C.essayHint || 'Отговор в 3–4 изречения.'
};

/* ---------- Тест ---------- */
// opts: { pts: точки за въпрос a–d, forward: само напред, limit: секунди }
function startQuiz(key, title, qs, opts) {
  opts = opts || {};
  const items = qs.map(q => q.isTask
    ? { id: q.id, task: true, pts: EX.ptsTask }
    : { id: q.id, order: settings.shuffle ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3], pts: opts.pts || 1 });
  const limit = opts.limit || items.reduce((s, it) => s + (it.task ? SEC_PER_TASK : SEC_PER_Q), 0);
  Q = {
    key, title, items, src: qs, opts, limit,
    answers: Array(items.length).fill(null),
    flags: Array(items.length).fill(false),
    checked: Array(items.length).fill(false),
    maxSeen: 0, forward: !!opts.forward,
    idx: 0, start: Date.now(), end: Date.now() + limit * 1000,
    instant: settings.instant, done: false
  };
  setHash('#/quiz', /^#\/(quiz|results)$/.test(location.hash));
  startTimer();
  renderQ();
}

function answered(i) {
  const a = Q.answers[i];
  if (a === null) return false;
  if (Q.items[i].task) return a.f.some(v => v && v.trim()) || !!(a.w && a.w.trim());
  return true;
}

function navClass(i) {
  const it = Q.items[i], q = BY_ID[it.id], a = Q.answers[i];
  let cls = 'nav-b' + (it.task ? ' task' : '');
  if (it.task) {
    if (Q.instant && Q.checked[i]) { const p = autoTask(q, a).pts; cls += p >= EX.ptsTask ? ' r-ok' : p > 0 ? ' r-half' : ' r-bad'; }
    else if (answered(i)) cls += ' ans';
  } else if (a !== null) cls += (Q.instant ? (a === q.correct ? ' r-ok' : ' r-bad') : ' ans');
  if (i === Q.idx) cls += ' cur';
  if (Q.flags[i]) cls += ' fl';
  return cls;
}

function navGrid() {
  return Q.items.map((it, i) => {
    const locked = Q.forward && i < Q.idx;
    return `<button class="${navClass(i)}" data-act="go" data-i="${i}" ${locked ? 'disabled' : ''} aria-label="${it.task ? 'Задача' : 'Въпрос'} ${i + 1}">${it.task ? '✎' + (i + 1 - Q.items.filter(x => !x.task).length) : i + 1}</button>`;
  }).join('');
}

function taskBody(it, q, a, locked) {
  const res = locked ? autoTask(q, a) : null;
  const fields = q.fields.map((fd, k) => {
    const v = a && a.f ? a.f[k] || '' : '';
    let cls = '', mark = '';
    if (res) {
      const m = res.marks[k];
      cls = m.credit === 1 ? 'ok' : m.credit > 0 ? 'half' : 'bad';
      const right = fieldAnswer(fd);
      mark = `<div class="mark" style="color:var(--${cls === 'ok' ? 'ok' : cls === 'half' ? 'half' : 'bad'})">${m.credit === 1 ? '✓ Вярно' : m.credit > 0 ? '½ Частично' : '✗ Грешно'}${m.note && m.credit !== 1 ? ' — ' + esc(m.note) : ''}${m.credit < 1 && right ? ` · верен отговор: <code>${esc(right)}</code>` : ''}</div>`;
    }
    if (fd.type === 'essay') {
      return `<div class="essay"><textarea class="work big ${cls}" data-f="${k}" spellcheck="true" ${locked ? 'readonly' : ''} placeholder="${esc(HINT.essay)}">${esc(v)}</textarea>
        ${locked ? `<div class="mark">${esc(res.marks[k].note)}</div>${pointsList(fd, res.marks[k])}` : `<span class="hint">${HINT.essay}</span>`}</div>`;
    }
    return `<label class="fld"><span>${subs(esc(fd.label))}</span>
      <input data-f="${k}" value="${esc(v)}" autocomplete="off" spellcheck="false" ${locked ? 'readonly' : ''} class="${cls}">
      ${locked ? mark : `<span class="hint">${HINT[fd.type]}</span>`}</label>`;
  }).join('');
  return `
    <div class="tmd">${md(q.text)}</div>
    <div class="fields">${fields}</div>
    ${isEssay(q) ? '' : `<label class="worklbl" for="work">Решение / чернова (показва се при прегледа; не се проверява автоматично)</label>
    <textarea class="work" id="work" data-w="1" spellcheck="false" ${locked ? 'readonly' : ''}>${esc(a && a.w || '')}</textarea>`}
    ${locked ? `<div class="fb ${res.pts >= EX.ptsTask ? 'good' : res.pts > 0 ? 'half' : 'wrong'}"><b>Автоматична оценка: ${ptsTxt(res.pts)} от ${EX.ptsTask} т.</b>${isEssay(q) ? ' <span>Сравни с примерния отговор и коригирай оценката.</span>' : ''}</div>
      <div class="sol tmd"><b>${isEssay(q) ? 'Примерен отговор' : 'Решение'}</b>${md(q.solution)}</div>`
      : (Q.instant ? `<div class="row" style="margin-top:10px"><button class="btn primary" data-act="check">Провери</button></div>` : '')}`;
}

        <div class="timer" id="timer">Оставащо време ${fmt((Q.end - Date.now()) / 1000)}</div>

        <div style="font-weight:600;font-size:.92rem">Навигация в теста</div>
        <div class="navgrid">${navGrid()}</div>
        ${Q.forward ? '<div class="muted" style="font-size:.8rem;margin:-4px 0 10px">Само напред — не можеш да се върнеш.</div>' : ''}
        <button class="btn" style="width:100%;justify-content:center" data-act="finish">Приключване на опита…</button>
      </div></div>
      <div>
        <div class="qwrap">

          </div>
          <div class="qbox">
            <div class="lectag">${itemTag(q)}</div>
            ${body}
          </div>
        </div>
        <div class="qnav">
          <button class="btn" data-act="prev" ${Q.idx === 0 || Q.forward ? 'disabled' : ''}>Обратно</button>
          ${last ? '<button class="btn primary" data-act="finish">Приключване на опита</button>'
                 : '<button class="btn primary" data-act="next">Следваща страница</button>'}
        </div>
        <div class="kbd">${it.task ? (isEssay(q) ? '' : 'Enter в поле → следващото поле') : 'Клавиши: 1–4 избор · ← → навигация · F отбелязване'}</div>
      </div>

}

function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    if (!Q || Q.done) return stopTimer();
    const left = (Q.end - Date.now()) / 1000;
    const el = document.getElementById('timer');
    if (el) { el.textContent = 'Оставащо време ' + fmt(left); el.classList.toggle('low', left < 120); }
    if (left <= 0) finish(true);
  }, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function finish(auto) {
  if (!Q || Q.done) return;
  if (!auto) {
    const un = Q.items.filter((_, i) => !answered(i)).length;
    const msg = un ? `Има ${un} без отговор. Да приключа ли опита?` : 'Да приключа ли опита и да видя резултата?';
    if (!confirm(msg)) return;
  }
  stopTimer();
  Q.done = true;
  Q.used = Math.min((Date.now() - Q.start) / 1000, Q.limit);
  Q.taskPts = Q.items.map((it, i) => it.task ? autoTask(BY_ID[it.id], Q.answers[i]).pts : null);
  Q.items.forEach((it, i) => {
    if (it.task) return;
    if (Q.answers[i] === BY_ID[it.id].correct) mistakes.delete(it.id);
    else mistakes.add(it.id);
  });
  store.set(PFX + '-mistakes', [...mistakes]);
  Q.max = Q.items.reduce((s, it) => s + it.pts, 0);
  Q.histTs = Date.now();
  rescore();
  setHash('#/results', true);
  results(auto);
}

// точките се преизчисляват и при ръчна корекция на задачите
function rescore() {
  Q.score = Q.items.reduce((s, it, i) => s + (it.task ? Q.taskPts[i] : (Q.answers[i] === BY_ID[it.id].correct ? it.pts : 0)), 0);
  if (Q.key) {
    const b = best[Q.key];
    if (!b || Q.score / Q.max > b.s / b.t || b.ts === Q.histTs) { best[Q.key] = { s: Q.score, t: Q.max, ts: Q.histTs }; store.set(PFX + '-best', best); }
  }
  const m = /^L(\d+)-/.exec(Q.key || '');
  const rec = { ts: Q.histTs, key: Q.key || 'MIX', title: Q.title, score: Q.score, total: Q.max, lec: m ? +m[1] : 0 };
  const k = hist.findIndex(h => h.ts === Q.histTs);
  if (k >= 0) hist[k] = rec; else hist.push(rec);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  store.set(PFX + '-history', hist);
}

function scoreCard(auto) {
  const t = Q.max, pct = Math.round(Q.score / t * 100);
  const col = pct >= 90 ? 'var(--ok)' : pct >= 60 ? 'var(--accent)' : 'var(--bad)';
  const nT = Q.items.filter(x => x.task).length;
  const mcqPts = Q.items.reduce((s, it, i) => s + (!it.task && Q.answers[i] === BY_ID[it.id].correct ? it.pts : 0), 0);
  const mcqMax = Q.items.reduce((s, it) => s + (it.task ? 0 : it.pts), 0);
  return `
      <div class="ring" style="background:conic-gradient(${col} ${pct * 3.6}deg, var(--border) 0)"><span>${ptsTxt(Q.score)}/${t}</span></div>
      <div>
        <h1 style="font-size:1.3rem">${esc(Q.title)}</h1>
        <div style="font-size:1.1rem;margin:4px 0">${pct}% · ${pct >= 90 ? 'Отлично!' : pct >= 60 ? 'Добре, но прегледай грешките.' : 'Прочети резюмето и опитай пак.'}</div>
        ${nT && mcqMax ? `<div class="muted">Тест: ${ptsTxt(mcqPts)}/${mcqMax} т. · Задачи: ${ptsTxt(Q.score - mcqPts)}/${nT * EX.ptsTask} т.</div>` : ''}
        <div class="muted">Време: ${fmt(Q.used)}${auto ? ' · времето изтече' : ''}</div>
        ${nT ? '<div class="muted" style="font-size:.88rem">Точките за задачите са автоматична оценка — коригирай ги по-долу според решението.</div>' : ''}
      </div>`;
}

function results(auto) {
  const wrongIdx = Q.items.map((it, i) => !it.task && Q.answers[i] !== BY_ID[it.id].correct ? i : -1).filter(i => i >= 0);
  const nQ = Q.items.filter(x => !x.task).length;
  const rev = Q.items.map((it, i) => {
    const q = BY_ID[it.id], a = Q.answers[i];
    if (it.task) {
      const res = autoTask(q, a), p = Q.taskPts[i];
      const essay = isEssay(q);
      const rows = q.fields.map((fd, k) => {
        const m = res.marks[k], v = a && a.f ? a.f[k] || '' : '';
        const cls = m.credit === 1 ? 'good' : m.credit > 0 ? 'half' : 'bad';
        return `<tr><td>${subs(esc(fd.label))}</td><td class="v">${v.trim() ? esc(v) : '<span class="muted">—</span>'}</td>
          <td class="v">${esc(fieldAnswer(fd)) || '<span class="muted">виж решението</span>'}</td>
          <td><span class="badge ${cls}">${m.credit === 1 ? '✓' : m.credit > 0 ? '½' : '✗'}</span>${m.note && m.credit !== 1 ? ` <span class="muted" style="font-size:.85rem">${esc(m.note)}</span>` : ''}</td></tr>`;
      }).join('');
      const sel = Array.from({ length: EX.ptsTask * 2 + 1 }, (_, k) => k / 2).map(v => `<option value="${v}" ${v === p ? 'selected' : ''}>${ptsTxt(v)}</option>`).join('');
      return `<div class="rev ${p >= EX.ptsTask ? 'ok' : p > 0 ? 'half' : 'bad'}" id="rev${i}">
        <div class="lectag">${itemTag(q).replace(TASK_WORD, TASK_WORD + ' ' + (i + 1 - nQ))}</div>
        <div class="tmd">${md(q.text)}</div>
        ${essay ? q.fields.map((fd, k) => `<div class="muted" style="font-size:.88rem">Твоят отговор:</div>
          <pre class="mywork">${a && a.f && a.f[k] && a.f[k].trim() ? esc(a.f[k]) : '— без отговор —'}</pre>
          <div class="muted" style="font-size:.88rem">Ключови моменти (${esc(res.marks[k].note)}):</div>${pointsList(fd, res.marks[k])}`).join('')
        : `<table class="ans"><thead><tr><th>Поле</th><th>Твоят отговор</th><th>Верен отговор</th><th></th></tr></thead><tbody>${rows}</tbody></table>`}
        ${a && a.w && a.w.trim() ? `<div class="muted" style="font-size:.88rem">Твоето решение:</div><pre class="mywork">${esc(a.w)}</pre>` : ''}
        <details class="sol tmd" ${p < EX.ptsTask || essay ? 'open' : ''}><summary><b>${essay ? 'Примерен отговор' : 'Решение стъпка по стъпка'}</b></summary>${md(q.solution)}</details>
        <div class="selfgrade"><span>Автоматично: <b>${ptsTxt(res.pts)}</b> т.</span>
          <label>Точки за задачата: <select data-grade="${i}">${sel}</select> от ${EX.ptsTask}</label></div>
      </div>`;
    }
    const ok = a === q.correct;
    const opts = it.order.map((oi, pos) => {
      let cls = 'opt';
      if (oi === q.correct) cls += ' ok'; else if (oi === a) cls += ' bad';
      const tag = oi === a ? ' <span class="badge">твоят отговор</span>' : '';
      return `<div class="${cls}"><span class="ltr">${LETTERS[pos]}.</span><span>${inl(q.opts[oi])}${tag}</span></div>`;
    }).join('');
    return `<div class="rev ${ok ? 'ok' : 'bad'}">
      <div class="lectag">Въпрос ${i + 1} · ${itemTag(q)} ${a === null ? '· <b>без отговор</b>' : ''}${it.pts !== 1 ? ` · ${ok ? it.pts : 0}/${it.pts} т.` : ''}</div>
      <p class="qtext" style="margin-bottom:8px">${inl(q.text)}</p>
      ${opts}
      <div class="why"><b>Обяснение:</b> ${inl(q.expl)}</div>
    </div>`;
  }).join('');
  render(`
    <div class="topbar">
      <button class="btn ghost" data-act="back">← Назад</button>
      <div class="row">
        <button class="btn" data-act="retry">Опитай отново</button>
        <button class="btn primary" data-act="retrywrong" ${wrongIdx.length ? '' : 'disabled'}>Само грешните въпроси (${wrongIdx.length})</button>
      </div>
    </div>
    <div class="card score" id="scorecard">${scoreCard(auto)}</div>
    <h2>Преглед</h2>
    ${rev}
  `);
  Q.wrongIdx = wrongIdx;
  Q.auto = auto;
}

function topicStats() {
  const by = {};
  for (const h of hist) {
    const k = h.lec || 0;
    const o = by[k] || (by[k] = { n: 0, sum: 0, best: 0, last: 0 });
    const p = h.total ? h.score / h.total : 0;
    o.n++; o.sum += p; o.best = Math.max(o.best, p); o.last = Math.max(o.last, h.ts);
  }
  return by;
}

    + (by[0] ? row(`<i>Смесени (пробни изпити, ${TASKS.length ? 'задачи, ' : ''}грешни въпроси и др.)</i>`, by[0], false) : '');
  const recent = hist.slice(-30).reverse().map(h => `<tr>

      <div class="card"><p>Възможни точки</p><div class="stat" id="stQuestions">${qs} <span class="muted" style="font-size:1rem;font-weight:400">(${ptsTxt(ok)} получени)</span></div></div>
      <div class="card"><p>Среден резултат</p><div class="stat" id="stAvg">${n ? avg + '%' : '—'}</div></div>
    </div>
    ${weak.length ? `<div class="fb wrong" style="margin-top:14px"><b>Най-слаби:</b> <span>${weakTxt}</span></div>` : ''}
    <h2>По ${C.lecWord === 'Лекция' ? 'лекции' : 'теми'}</h2>
    <div class="card tbl-wrap"><table class="tbl" id="topicTbl">
      <thead><tr><th>${C.lecWord}</th><th>Опити</th><th>Най-добър</th><th>Среден</th><th>Последен опит</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <h2>Последни опити</h2>
    ${n ? `<div class="card tbl-wrap"><table class="tbl" id="recentTbl">

      <tbody>${recent}</tbody></table></div>`
      : '<div class="card"><p style="margin:0">Още няма завършени опити. Реши някой тест и резултатът ще се появи тук.</p></div>'}

function progMsg(ok, text) {

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(code) {
  const bin = atob(code.replace(/\s+/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

function exportCode() {
  return b64enc(JSON.stringify({ v: 1, course: PFX, name: userName || 'Гост', best, mistakes: [...mistakes], history: hist }));
}

function importCode(code) {
  let d;
  try { d = JSON.parse(b64dec(code.trim())); } catch (e) { return { ok: false, text: 'Невалиден код — провери дали е копиран изцяло.' }; }
  if (!d || typeof d !== 'object' || d.v !== 1 || typeof d.course !== 'string') return { ok: false, text: 'Невалиден код — липсва версия или курс.' };
  if (d.course !== PFX) return { ok: false, text: `Този код е от друг курс („${d.course}“), а тук е „${PFX}“. Импортирай го в съответния тест.` };
  if (!Array.isArray(d.history) || !Array.isArray(d.mistakes) || !d.best || typeof d.best !== 'object') return { ok: false, text: 'Невалиден код — непълни данни.' };
  // грешни въпроси: заменят текущите
  mistakes = new Set(d.mistakes.filter(id => typeof id === 'string' && BY_ID[id]));
  // най-добри: максимум по ключ
  let nb = 0;
  for (const [k, b] of Object.entries(d.best)) {
    if (!b || !(b.t > 0) || !(b.s >= 0)) continue;
    const cur = best[k];
    if (!cur || b.s / b.t > cur.s / cur.t) { best[k] = { s: +b.s, t: +b.t }; nb++; }
  }
  // история: обединение без дубликати (ts + key), сортирана, последните 500
  const seen = new Set(hist.map(h => h.ts + '|' + h.key));
  let added = 0;
  for (const h of d.history) {
    if (!h || typeof h.ts !== 'number' || typeof h.key !== 'string' || !(h.total > 0)) continue;
    const id = h.ts + '|' + h.key;
    if (seen.has(id)) continue;
    seen.add(id); added++;
    hist.push({ ts: h.ts, key: h.key, title: String(h.title || h.key), score: +h.score || 0, total: +h.total, lec: +h.lec || 0 });
  }
  hist.sort((a, b) => a.ts - b.ts);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  if ((userName === null || userName === 'Гост') && typeof d.name === 'string' && d.name.trim()) { userName = d.name.trim().slice(0, 40); store.set(PFX + '-name', userName); }
  store.set(PFX + '-mistakes', [...mistakes]);
  store.set(PFX + '-best', best);
  store.set(PFX + '-history', hist);
  return { ok: true, text: `Прогресът е импортиран: ${added} нови опита в историята, ${nb} подобрени резултата, ${mistakes.size} грешни въпроса.` };
}

async function copyText(ta) {
  try { await navigator.clipboard.writeText(ta.value); return true; }
  catch (e) { ta.select(); try { return document.execCommand('copy'); } catch (e2) { return false; } }
}

/* ---------- Действия ---------- */
// равномерно от всички лекции: по един случаен въпрос от всяка, на кръгове
function pickMcq(n) {
  const lecs = DATA.lectures.map(l => l.num), used = new Set(), picks = [];
  while (picks.length < n) {
    for (const L of shuffle(lecs)) {
      if (picks.length >= n) break;
      const pool = ALL.filter(q => q.lec === L && !used.has(q.id));
      if (!pool.length) continue;
      const q = pool[Math.floor(Math.random() * pool.length)];
      used.add(q.id); picks.push(q);
    }
  }
  return shuffle(picks);
}
// по една задача от всяка група (групите се повтарят, ако задачите са повече от групите)
function pickTasks(n) {
  const picks = [], order = n < GROUPS.length ? shuffle(GROUPS) : GROUPS;
  for (let i = 0; picks.length < n; i++) {
    const g = order[i % order.length];
    const pool = TASKS.filter(t => t.group === g.key && !picks.includes(BY_ID[t.id]));
    if (pool.length) picks.push(BY_ID[pool[Math.floor(Math.random() * pool.length)].id]);
  }
  return picks;
}

function mockExam(kind) {
  const forward = settings.forward;
  if (!EX.tasks) {
    const n = +kind;
    return startQuiz(null, `Пробен изпит (${n} въпроса)`, pickMcq(n), { forward });
  }
  if (kind === 'mcq') return startQuiz(null, `Пробен изпит — тест (${EX.q} въпроса)`, pickMcq(EX.q), { forward, pts: EX.ptsQ });
  if (kind === 'tasks') return startQuiz(null, `Пробен изпит — ${EX.q ? 'задачи' : 'отворени въпроси'} (${EX.tasks})`, pickTasks(EX.tasks), { forward, limit: EX.q ? undefined : EX.minutes * 60 });
  startQuiz(null, `Пробен изпит (${EX.q} въпроса + ${EX.tasks} задачи)`, pickMcq(EX.q).concat(pickTasks(EX.tasks)), { forward, pts: EX.ptsQ, limit: EX.minutes * 60 });
}

function groupTasks(key) { return TASKS.filter(t => t.group === key).map(t => BY_ID[t.id]); }

const actions = {
  home: () => nav('#/'),
  back: () => back(),
  progress: () => nav('#/progress'),
  rename: () => { editName = true; home(); const i = document.getElementById('nameIn'); if (i) { i.focus(); i.select(); } },
  saveName: () => setName(document.getElementById('nameIn').value),
  skipName: () => { if (editName) { editName = false; home(); } else setName('Гост'); },
  exportProg: () => { const ta = document.getElementById('progCode'); ta.value = exportCode(); ta.focus(); ta.select(); progMsg(true, 'Кодът е готов — копирай го и го запази или го постави на другото устройство.'); },
  copyProg: async () => {
    const ta = document.getElementById('progCode');
    if (!ta.value.trim()) ta.value = exportCode();
    progMsg(...(await copyText(ta) ? [true, 'Кодът е копиран.'] : [false, 'Не успях да копирам автоматично — маркирай текста и натисни Ctrl+C.']));
  },
  importProg: () => {
    const code = document.getElementById('progCode').value;
    if (!code.trim()) return progMsg(false, 'Постави код в полето и натисни „Импорт“.');
    const r = importCode(code);
    if (r.ok) progress(r); else progMsg(false, r.text);
  },
  theme: () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; store.set(PFX + '-theme', theme); applyTheme(); home(); },
  sum: b => nav('#/sum/' + b.dataset.l),
  test: b => { const l = DATA.lectures.find(x => x.num === +b.dataset.l); startQuiz(`L${pad(l.num)}-${b.dataset.t}`, `${C.lecWord} ${l.num} · Тест ${b.dataset.t}`, l.tests[b.dataset.t]); },
  allq: b => { const l = DATA.lectures.find(x => x.num === +b.dataset.l); const qs = l.testNames.flatMap(t => l.tests[t]); startQuiz(`L${pad(l.num)}-ALL`, `${C.lecWord} ${l.num} · всички ${qs.length} въпроса`, shuffle(qs)); },
  task1: b => { const g = groupOf(b.dataset.g), ts = groupTasks(g.key); startQuiz(null, `Задача · ${g.title}`, [ts[Math.floor(Math.random() * ts.length)]]); },
  taskall: b => { const g = groupOf(b.dataset.g); startQuiz('T-' + g.key, `Задачи · ${g.title}`, shuffle(groupTasks(g.key))); },
  mock: () => mockExam(document.getElementById('mockN').value),
  sample: () => startQuiz('SAMPLE', 'Примерен тест', SAMPLE),
  mist: () => startQuiz(null, `Грешни въпроси (${mistakes.size})`, shuffle([...mistakes].map(id => BY_ID[id]).filter(Boolean))),
  reset: () => { if (confirm('Да изтрия ли най-добрите резултати, списъка с грешни въпроси и историята на опитите? (Името остава.)')) { best = {}; mistakes = new Set(); hist = []; store.set(PFX + '-best', best); store.set(PFX + '-mistakes', []); store.set(PFX + '-history', hist); home(); } },
  go: b => { const i = +b.dataset.i; if (Q.forward && i < Q.idx) return; Q.idx = i; renderQ(); },
  prev: () => { if (Q.idx > 0 && !Q.forward) { Q.idx--; renderQ(); } },
  next: () => { if (Q.idx < Q.items.length - 1) { Q.idx++; renderQ(); } },
  flag: () => { Q.flags[Q.idx] = !Q.flags[Q.idx]; renderQ(); },
  check: () => { Q.checked[Q.idx] = true; renderQ(); },
  finish: () => finish(false),
  quit: () => { if (Q && !Q.done && Q.items.some((_, i) => answered(i)) && !confirm('Опитът не е приключен. Да изляза ли?')) return; leaving = true; stopTimer(); Q = null; back(); },
  retry: () => startQuiz(Q.key, Q.title, Q.src, Q.opts),
  retrywrong: () => { const qs = Q.wrongIdx.map(i => BY_ID[Q.items[i].id]); startQuiz(null, `${Q.title} · само грешните`, qs); }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && actions[b.dataset.act]) actions[b.dataset.act](b);
});
app.addEventListener('change', e => {
  if (e.target.name === 'opt' && Q && !Q.done) { Q.answers[Q.idx] = +e.target.value; renderQ(); }
  if (e.target.id === 'setInstant') { settings.instant = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.id === 'setShuffle') { settings.shuffle = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.id === 'setForward') { settings.forward = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.dataset.grade !== undefined && Q && Q.done) {
    const i = +e.target.dataset.grade, p = +e.target.value;
    Q.taskPts[i] = p;
    rescore();
    document.getElementById('scorecard').innerHTML = scoreCard(Q.auto);
    document.getElementById('rev' + i).className = `rev ${p >= EX.ptsTask ? 'ok' : p > 0 ? 'half' : 'bad'}`;
  }
});
// писмените задачи: пазим въведеното без прерисуване (иначе фокусът се губи)
app.addEventListener('input', e => {
  if (!Q || Q.done || !Q.items[Q.idx] || !Q.items[Q.idx].task) return;
  const t = e.target, q = BY_ID[Q.items[Q.idx].id];
  if (t.dataset.f === undefined && t.dataset.w === undefined) return;
  const a = Q.answers[Q.idx] || (Q.answers[Q.idx] = { f: q.fields.map(() => ''), w: '' });
  if (t.dataset.f !== undefined) a.f[+t.dataset.f] = t.value; else a.w = t.value;
  refreshNav(Q.idx);
  const st = app.querySelector('.qinfo div:nth-child(2)');
  if (st) st.textContent = answered(Q.idx) ? 'Отговорена' : 'Все още не е даден отговор';
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'nameIn') { if (e.key === 'Enter') actions.saveName(); return; }
  if (e.target.dataset && e.target.dataset.f !== undefined) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); const nx = app.querySelector(`[data-f="${+e.target.dataset.f + 1}"]`) || app.querySelector('[data-w]'); if (nx) nx.focus(); }
    return;
  }
  if (!Q || Q.done || e.ctrlKey || e.metaKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (Q.items[Q.idx].task) {
    if (e.key === 'ArrowRight') actions.next(); else if (e.key === 'ArrowLeft') actions.prev();
    return;
  }
  const k = e.key.toLowerCase();
  const pos = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (pos >= 0 && k.length === 1) {
    if (Q.instant && Q.answers[Q.idx] !== null) return;
    Q.answers[Q.idx] = Q.items[Q.idx].order[pos]; renderQ();
  } else if (e.key === 'ArrowRight') actions.next();
  else if (e.key === 'ArrowLeft') actions.prev();
  else if (k === 'f') actions.flag();
});

/* ---------- Навигация (бутонът „Назад“ на браузъра) ---------- */
// #/ начало · #/sum/N резюме · #/progress прогрес · #/quiz тест · #/results резултат
let leaving = false;
function setHash(h, replace) {
  if (location.hash === h) return;
  history[replace ? 'replaceState' : 'pushState']({ app: 1 }, '', h);
}
function nav(h) { setHash(h); route(); }
function back() {
  // тестът/резултатът се отварят от начало или резюме, затова „Назад“ връща там
  if (history.state && history.state.app) { leaving = true; history.back(); } else { setHash('#/', true); route(); }
}
function route() {
  const h = location.hash, m = /^#\/sum\/(\d+)$/.exec(h);
  if (m && DATA.lectures.some(l => l.num === +m[1])) return summary(+m[1]);
  if (h === '#/progress') return progress();
  if (h === '#/quiz' && Q && !Q.done) { startTimer(); return renderQ(); }
  if (h === '#/results' && Q && Q.done) return results(Q.auto);
  if (h && h !== '#/') history.replaceState(null, '', '#/');
  home();
}
window.addEventListener('popstate', () => {
  if (!leaving && Q && !Q.done && location.hash !== '#/quiz' && Q.items.some((_, i) => answered(i))
      && !confirm('Опитът не е приключен. Да изляза ли?')) {
    history.pushState({ app: 1 }, '', '#/quiz');
    return;
  }
  leaving = false;
  route();
});


route();
</script>
