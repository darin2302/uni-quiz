6666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"276\" y1=\"128.66666666666666\" x2=\"276\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"267\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"262\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"276\" y1=\"70.0\" x2=\"322\" y2=\"70.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"276\" y1=\"143.33333333333331\" x2=\"322\" y2=\"143.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"322\" y1=\"70.0\" x2=\"322\" y2=\"93.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"322\" y1=\"119.66666666666666\" x2=\"322\" y2=\"143.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"322\" cy=\"106.66666666666666\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"322\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"250\" y1=\"163.33333333333331\" x2=\"250\" y2=\"204.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"234.99999999999997\" x2=\"250\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"219.99999999999997\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"228.99999999999997\" x2=\"250\" y2=\"210.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 215.99999999999997 L250 210.99999999999997 L255 215.99999999999997\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"250\" y1=\"276.66666666666663\" x2=\"250\" y2=\"320.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"346.3333333333333\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"333.3333333333333\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"250\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"200\" y1=\"372\" x2=\"200\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M196 354 L200 348 L204 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"206\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"198.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"242.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"198.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"225.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 18 Ω, R₂ = 22 Ω, R₃ = 30 Ω, R₄ = 24 Ω, R₅ = 10 Ω; e₁ = 45 V, e₂ = 45 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":27.019231,"shown":"27,019"},{"label":"I₁, A","type":"real","answer":-1.714744,"shown":"−1,715"},{"label":"I₂, A","type":"real","answer":2.615385,"shown":"2,615"},{"label":"I₃, A","type":"real","answer":-0.900641,"shown":"−0,901"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":194.855769,"shown":"194,856"},{"label":"Показание на амперметъра, A","type":"real","answer":2.615385,"shown":"2,615"},{"label":"Показание на волтметъра, V","type":"real","answer":17.980769,"shown":"17,981"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 1: Rе₁ = R₁ + R₄ = **42 Ω**\n- R2 ∥ R5: R₂₅ = R2·R5/(R2 + R5) = 22·10/(22 + 10) = **6,875 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − Rе₂·I₂ = − e₁ − e₂ | 42·I₁ − 6,875·I₂ = −90 |\n| II ЗК, контур II | Rе₂·I₂ − R₃·I₃ = e₂ | 6,875·I₂ − 30·I₃ = 45 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/Rе₂ + 1/R₃)·V₁ = − e₁/Rе₁ + e₂/Rе₂\n\n(1/42 + 1/6,875 + 1/30)·V₁ = 5,474  →  0,2026·V₁ = 5,474  →  **V₁ = 27,019 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (−e₁ − V₁)/Rе₁ = (−45 − (27,019))/42 = **−1,715 A**\n- I₂ = (e₂ − V₁)/Rе₂ = (45 − (27,019))/6,875 = **2,615 A**\n- I₃ = (−V₁)/R₃ = (−(27,019))/30 = **−0,901 A**\n\nПроверка с I ЗК: −1,715 + (2,615) + (−0,901) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = − e₁·I₁ + e₂·I₂ = (−45)·(−1,715) + (45)·(2,615) = **194,856 W**\n\nΣP_конс = Rе₁·I₁² + Rе₂·I₂² + R₃·I₃² = 42·2,94 + 6,875·6,84 + 30·0,811 = **194,856 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 2 и показва тока на клона: I_A = |I₂| = **2,615 A**\n- Волтметърът е успоредно на R5 (а значи и на R2 ∥ R5): U_V = |I₂|·R₂₅ = 2,615·6,875 = **17,981 V**"},{"id":"DC05","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"157.0\" x2=\"70\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"70\" y1=\"220.0\" x2=\"70\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"320.0\" x2=\"70\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"314.0\" x2=\"70\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M65 301.0 L70 296.0 L75 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"50\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₁<\/text><line x1=\"44\" y1=\"372\" x2=\"44\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M40 354 L44 348 L48 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"50\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₁<\/text><line x1=\"250\" y1=\"50.0\" x2=\"250\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"157.0\" x2=\"250\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"105.0\" x2=\"296\" y2=\"105.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"165.0\" x2=\"296\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"105.0\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"165.0\" r=\"4\" fill=\"#111\"/><line x1=\"296\" y1=\"105.0\" x2=\"296\" y2=\"122.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"296\" y1=\"148.0\" x2=\"296\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"296\" cy=\"135.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"296\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"250\" y1=\"220.0\" x2=\"250\" y2=\"234.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"376.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"234.0\" x2=\"276\" y2=\"234.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"376.0\" x2=\"276\" y2=\"376.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"234.0\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"376.0\" r=\"4\" fill=\"#111\"/><line x1=\"224\" y1=\"234.0\" x2=\"224\" y2=\"236.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"262.0\" x2=\"224\" y2=\"264.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"224\" cy=\"249.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"224\" y=\"254.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"224\" y1=\"264.0\" x2=\"224\" y2=\"298.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"342.0\" x2=\"224\" y2=\"376.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"215\" y=\"298.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"210\" y=\"325.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₄<\/text><line x1=\"276\" y1=\"234.0\" x2=\"276\" y2=\"283.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"276\" y1=\"327.0\" x2=\"276\" y2=\"376.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"267\" y=\"283.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"262\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"200\" y1=\"372\" x2=\"200\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M196 354 L200 348 L204 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"206\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"157.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"296.0\" x2=\"430\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 309.0 L430 314.0 L435 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 40 Ω, R₂ = 15 Ω, R₃ = 18 Ω, R₄ = 15 Ω, R₅ = 15 Ω; e₁ = 30 V, e₃ = 20 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-2.888889,"shown":"−2,889"},{"label":"I₁, A","type":"real","answer":0.822222,"shown":"0,822"},{"label":"I₂, A","type":"real","answer":0.128395,"shown":"0,128"},{"label":"I₃, A","type":"real","answer":-0.950617,"shown":"−0,951"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":43.679012,"shown":"43,679"},{"label":"Показание на амперметъра, A","type":"real","answer":0.064198,"shown":"0,064"},{"label":"Показание на волтметъра, V","type":"real","answer":1.925926,"shown":"1,926"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R4 ∥ R5: R₄₅ = R4·R5/(R4 + R5) = 15·15/(15 + 15) = **7,5 Ω**\n- клон 2: Rе₂ = R₂ + R₄₅ = **22,5 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | R₁·I₁ − Rе₂·I₂ = e₁ | 40·I₁ − 22,5·I₂ = 30 |\n| II ЗК, контур II | Rе₂·I₂ − R₃·I₃ = e₃ | 22,5·I₂ − 18·I₃ = 20 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/R₁ + 1/Rе₂ + 1/R₃)·V₁ = e₁/R₁ − e₃/R₃\n\n(1/40 + 1/22,5 + 1/18)·V₁ = −0,3611  →  0,125·V₁ = −0,3611  →  **V₁ = −2,889 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/R₁ = (30 − (−2,889))/40 = **0,822 A**\n- I₂ = (−V₁)/Rе₂ = (−(−2,889))/22,5 = **0,128 A**\n- I₃ = (−e₃ − V₁)/R₃ = (−20 − (−2,889))/18 = **−0,951 A**\n\nПроверка с I ЗК: 0,822 + (0,128) + (−0,951) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ − e₃·I₃ = (30)·(0,822) + (−20)·(−0,951) = **43,679 W**\n\nΣP_конс = R₁·I₁² + Rе₂·I₂² + R₃·I₃² = 40·0,676 + 22,5·0,016 + 18·0,904 = **43,679 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е последователно на R4, а R4 ∥ R5: токът на клона се разделя обратно на съпротивленията — I_A = |I₂|·R5/(R4 + R5) = 0,128·15/30 = **0,064 A**\n- Волтметърът е успоредно на R2: U_V = R2·|I₂| = 15·0,128 = **1,926 V**"},{"id":"DC06","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"198.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"242.0\" x2=\"70\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"198.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"225.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"44\" y1=\"372\" x2=\"44\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M40 354 L44 348 L48 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"50\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₁<\/text><line x1=\"250\" y1=\"50.0\" x2=\"250\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"128.66666666666666\" x2=\"250\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"163.33333333333331\" x2=\"250\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"241.99999999999997\" x2=\"250\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₄<\/text><line x1=\"250\" y1=\"276.66666666666663\" x2=\"250\" y2=\"318.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"348.3333333333333\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"333.3333333333333\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"324.3333333333333\" x2=\"250\" y2=\"342.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 337.3333333333333 L250 342.3333333333333 L255 337.3333333333333\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"206.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"64.0\" x2=\"456\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"206.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"206.0\" r=\"4\" fill=\"#111\"/><line x1=\"404\" y1=\"64.0\" x2=\"404\" y2=\"66.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"92.0\" x2=\"404\" y2=\"94.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"404\" cy=\"79.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"404\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"404\" y1=\"94.0\" x2=\"404\" y2=\"128.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"172.0\" x2=\"404\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"395\" y=\"128.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"390\" y=\"155.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"456\" y1=\"64.0\" x2=\"456\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"456\" y1=\"157.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"447\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"442\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"456\" y1=\"70.0\" x2=\"502\" y2=\"70.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"456\" y1=\"200.0\" x2=\"502\" y2=\"200.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"502\" y1=\"70.0\" x2=\"502\" y2=\"122.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"502\" y1=\"148.0\" x2=\"502\" y2=\"200.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"502\" cy=\"135.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"502\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"296.0\" x2=\"430\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 309.0 L430 314.0 L435 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"380\" y1=\"372\" x2=\"380\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M376 354 L380 348 L384 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"386\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 10 Ω, R₂ = 5 Ω, R₃ = 30 Ω, R₄ = 10 Ω, R₅ = 40 Ω; e₂ = 24 V, e₃ = 30 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-14.888889,"shown":"−14,889"},{"label":"I₁, A","type":"real","answer":1.488889,"shown":"1,489"},{"label":"I₂, A","type":"real","answer":-0.607407,"shown":"−0,607"},{"label":"I₃, A","type":"real","answer":-0.881481,"shown":"−0,881"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":41.022222,"shown":"41,022"},{"label":"Показание на амперметъра, A","type":"real","answer":0.503704,"shown":"0,504"},{"label":"Показание на волтметъра, V","type":"real","answer":15.111111,"shown":"15,111"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 2: Rе₂ = R₂ + R₄ = **15 Ω**\n- R3 ∥ R5: R₃₅ = R3·R5/(R3 + R5) = 30·40/(30 + 40) = **17,143 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | R₁·I₁ − Rе₂·I₂ = e₂ | 10·I₁ − 15·I₂ = 24 |\n| II ЗК, контур II | Rе₂·I₂ − Rе₃·I₃ = − e₂ + e₃ | 15·I₂ − 17,143·I₃ = 6 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/R₁ + 1/Rе₂ + 1/Rе₃)·V₁ = − e₂/Rе₂ − e₃/Rе₃\n\n(1/10 + 1/15 + 1/17,143)·V₁ = −3,35  →  0,225·V₁ = −3,35  →  **V₁ = −14,889 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (−V₁)/R₁ = (−(−14,889))/10 = **1,489 A**\n- I₂ = (−e₂ − V₁)/Rе₂ = (−24 − (−14,889))/15 = **−0,607 A**\n- I₃ = (−e₃ − V₁)/Rе₃ = (−30 − (−14,889))/17,143 = **−0,881 A**\n\nПроверка с I ЗК: 1,489 + (−0,607) + (−0,881) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = − e₂·I₂ − e₃·I₃ = (−24)·(−0,607) + (−30)·(−0,881) = **41,022 W**\n\nΣP_конс = R₁·I₁² + Rе₂·I₂² + Rе₃·I₃² = 10·2,217 + 15·0,369 + 17,143·0,777 = **41,022 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е последователно на R3, а R3 ∥ R5: токът на клона се разделя обратно на съпротивленията — I_A = |I₃|·R5/(R3 + R5) = 0,881·40/70 = **0,504 A**\n- Волтметърът е успоредно на R5 (а значи и на R3 ∥ R5): U_V = |I₃|·R₃₅ = 0,881·17,143 = **15,111 V**"},{"id":"DC07","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text" 3333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₁<\/text><line x1=\"20\" y1=\"372\" x2=\"20\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M16 354 L20 348 L24 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"26\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₁<\/text><line x1=\"250\" y1=\"50.0\" x2=\"250\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"157.0\" x2=\"250\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"220.0\" x2=\"250\" y2=\"292.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"318.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"305.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"250\" y=\"310.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"157.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"314.0\" x2=\"430\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 301.0 L430 296.0 L435 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 6 Ω, R₂ = 15 Ω, R₃ = 60 Ω, R₄ = 25 Ω, R₅ = 24 Ω; e₁ = 20 V, e₃ = 20 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-5.522267,"shown":"−5,522"},{"label":"I₁, A","type":"real","answer":-0.793522,"shown":"−0,794"},{"label":"I₂, A","type":"real","answer":0.368151,"shown":"0,368"},{"label":"I₃, A","type":"real","answer":0.425371,"shown":"0,425"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":24.377868,"shown":"24,378"},{"label":"Показание на амперметъра, A","type":"real","answer":0.368151,"shown":"0,368"},{"label":"Показание на волтметъра, V","type":"real","answer":9.716599,"shown":"9,717"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R4 ∥ R5: R₄₅ = R4·R5/(R4 + R5) = 25·24/(25 + 24) = **12,245 Ω**\n- клон 1: Rе₁ = R₁ + R₄₅ = **18,245 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = − e₁ | 18,245·I₁ − 15·I₂ = −20 |\n| II ЗК, контур II | R₂·I₂ − R₃·I₃ = − e₃ | 15·I₂ − 60·I₃ = −20 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/R₃)·V₁ = − e₁/Rе₁ + e₃/R₃\n\n(1/18,245 + 1/15 + 1/60)·V₁ = −0,7629  →  0,13814·V₁ = −0,7629  →  **V₁ = −5,522 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (−e₁ − V₁)/Rе₁ = (−20 − (−5,522))/18,245 = **−0,794 A**\n- I₂ = (−V₁)/R₂ = (−(−5,522))/15 = **0,368 A**\n- I₃ = (e₃ − V₁)/R₃ = (20 − (−5,522))/60 = **0,425 A**\n\nПроверка с I ЗК: −0,794 + (0,368) + (0,425) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = − e₁·I₁ + e₃·I₃ = (−20)·(−0,794) + (20)·(0,425) = **24,378 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + R₃·I₃² = 18,245·0,63 + 15·0,136 + 60·0,181 = **24,378 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 2 и показва тока на клона: I_A = |I₂| = **0,368 A**\n- Волтметърът е успоредно на R5 (а значи и на R4 ∥ R5): U_V = |I₁|·R₄₅ = 0,794·12,245 = **9,717 V**"},{"id":"DC08","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"149.33333333333331\" x2=\"70\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"64.0\" x2=\"96\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"149.33333333333331\" x2=\"96\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"70\" cy=\"149.33333333333331\" r=\"4\" fill=\"#111\"/><line x1=\"44\" y1=\"64.0\" x2=\"44\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"128.66666666666666\" x2=\"44\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"35\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"96\" y1=\"64.0\" x2=\"96\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"96\" y1=\"128.66666666666666\" x2=\"96\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"87\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill l, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"20\" y1=\"372\" x2=\"20\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M16 354 L20 348 L24 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"26\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₁<\/text><line x1=\"250\" y1=\"50.0\" x2=\"250\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"157.0\" x2=\"250\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"220.0\" x2=\"250\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"320.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"296.0\" x2=\"250\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 309.0 L250 314.0 L255 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"128.66666666666666\" x2=\"430\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"163.33333333333331\" x2=\"430\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"241.99999999999997\" x2=\"430\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"430\" y1=\"276.66666666666663\" x2=\"430\" y2=\"318.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"348.3333333333333\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"333.3333333333333\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"324.3333333333333\" x2=\"430\" y2=\"342.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 337.3333333333333 L430 342.3333333333333 L435 337.3333333333333\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 18 Ω, R₂ = 24 Ω, R₃ = 15 Ω, R₄ = 15 Ω, R₅ = 30 Ω; e₁ = 15 V, e₂ = 100 V, e₃ = 30 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-35.820896,"shown":"−35,821"},{"label":"I₁, A","type":"real","answer":2.544776,"shown":"2,545"},{"label":"I₂, A","type":"real","answer":-2.674129,"shown":"−2,674"},{"label":"I₃, A","type":"real","answer":0.129353,"shown":"0,129"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":225.360697,"shown":"225,361"},{"label":"Показание на амперметъра, A","type":"real","answer":2.544776,"shown":"2,545"},{"label":"Показание на волтметъра, V","type":"real","answer":20.820896,"shown":"20,821"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R1 ∥ R4: R₁₄ = R1·R4/(R1 + R4) = 18·15/(18 + 15) = **8,182 Ω**\n- клон 3: Rе₃ = R₃ + R₅ = **45 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = − e₁ + e₂ | 8,182·I₁ − 24·I₂ = 85 |\n| II ЗК, контур II | R₂·I₂ − Rе₃·I₃ = − e₂ + e₃ | 24·I₂ − 45·I₃ = −70 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/Rе₃)·V₁ = − e₁/Rе₁ − e₂/R₂ − e₃/Rе₃\n\n(1/8,182 + 1/24 + 1/45)·V₁ = −6,6667  →  0,18611·V₁ = −6,6667  →  **V₁ = −35,821 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (−e₁ − V₁)/Rе₁ = (−15 − (−35,821))/8,182 = **2,545 A**\n- I₂ = (−e₂ − V₁)/R₂ = (−100 − (−35,821))/24 = **−2,674 A**\n- I₃ = (−e₃ − V₁)/Rе₃ = (−30 − (−35,821))/45 = **0,129 A**\n\nПроверка с I ЗК: 2,545 + (−2,674) + (0,129) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = − e₁·I₁ − e₂·I₂ − e₃·I₃ = (−15)·(2,545) + (−100)·(−2,674) + (−30)·(0,129) = **225,361 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + Rе₃·I₃² = 8,182·6,476 + 24·7,151 + 45·0,017 = **225,361 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 1 и показва тока на клона: I_A = |I₁| = **2,545 A**\n- Волтметърът е успоредно на R1 (а значи и на R1 ∥ R4): U_V = |I₁|·R₁₄ = 2,545·8,182 = **20,821 V**"},{"id":"DC09","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"128.66666666666666\" x2=\"70\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" .0\" x2=\"224\" y2=\"66.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"92.0\" x2=\"224\" y2=\"94.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"224\" cy=\"79.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"224\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"224\" y1=\"94.0\" x2=\"224\" y2=\"213.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"224\" y1=\"257.0\" x2=\"224\" y2=\"376.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"215\" y=\"213.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"210\" y=\"240.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"276\" y1=\"64.0\" x2=\"276\" y2=\"198.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"276\" y1=\"242.0\" x2=\"276\" y2=\"376.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"267\" y=\"198.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"262\" y=\"225.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"200\" y1=\"372\" x2=\"200\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M196 354 L200 348 L204 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"206\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"157.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"105.0\" x2=\"476\" y2=\"105.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"165.0\" x2=\"476\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"105.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"165.0\" r=\"4\" fill=\"#111\"/><line x1=\"476\" y1=\"105.0\" x2=\"476\" y2=\"122.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"476\" y1=\"148.0\" x2=\"476\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"476\" cy=\"135.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"476\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"314.0\" x2=\"430\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 301.0 L430 296.0 L435 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 60 Ω, R₂ = 8 Ω, R₃ = 5 Ω, R₄ = 8 Ω, R₅ = 20 Ω; e₁ = 30 V, e₃ = 24 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":13.449057,"shown":"13,449"},{"label":"I₁, A","type":"real","answer":0.243396,"shown":"0,243"},{"label":"I₂, A","type":"real","answer":-2.353585,"shown":"−2,354"},{"label":"I₃, A","type":"real","answer":2.110189,"shown":"2,11"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":57.946415,"shown":"57,946"},{"label":"Показание на амперметъра, A","type":"real","answer":1.681132,"shown":"1,681"},{"label":"Показание на волтметъра, V","type":"real","answer":10.550943,"shown":"10,551"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 1: Rе₁ = R₁ + R₄ = **68 Ω**\n- R2 ∥ R5: R₂₅ = R2·R5/(R2 + R5) = 8·20/(8 + 20) = **5,714 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − Rе₂·I₂ = e₁ | 68·I₁ − 5,714·I₂ = 30 |\n| II ЗК, контур II | Rе₂·I₂ − R₃·I₃ = − e₃ | 5,714·I₂ − 5·I₃ = −24 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/Rе₂ + 1/R₃)·V₁ = e₁/Rе₁ + e₃/R₃\n\n(1/68 + 1/5,714 + 1/5)·V₁ = 5,2412  →  0,38971·V₁ = 5,2412  →  **V₁ = 13,449 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/Rе₁ = (30 − (13,449))/68 = **0,243 A**\n- I₂ = (−V₁)/Rе₂ = (−(13,449))/5,714 = **−2,354 A**\n- I₃ = (e₃ − V₁)/R₃ = (24 − (13,449))/5 = **2,11 A**\n\nПроверка с I ЗК: 0,243 + (−2,354) + (2,11) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ + e₃·I₃ = (30)·(0,243) + (24)·(2,11) = **57,946 W**\n\nΣP_конс = Rе₁·I₁² + Rе₂·I₂² + R₃·I₃² = 68·0,059 + 5,714·5,539 + 5·4,453 = **57,946 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е последователно на R2, а R2 ∥ R5: токът на клона се разделя обратно на съпротивленията — I_A = |I₂|·R5/(R2 + R5) = 2,354·20/28 = **1,681 A**\n- Волтметърът е успоредно на R3: U_V = R3·|I₃| = 5·2,11 = **10,551 V**"},{"id":"DC10","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"157.0\" x2=\"70\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"70\" y1=\"220.0\" x2=\"70\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"320.0\" x2=\"70\" y2=\"390.0\" stroke=\"#111\" stro =\"2\"/><rect x=\"215\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"210\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₄<\/text><line x1=\"276\" y1=\"177.33333333333331\" x2=\"276\" y2=\"197.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"276\" y1=\"241.99999999999997\" x2=\"276\" y2=\"262.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"267\" y=\"197.99999999999997\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"262\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"250\" y1=\"276.66666666666663\" x2=\"250\" y2=\"318.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"348.3333333333333\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"333.3333333333333\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"342.3333333333333\" x2=\"250\" y2=\"324.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 329.3333333333333 L250 324.3333333333333 L255 329.3333333333333\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"200\" y1=\"372\" x2=\"200\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M196 354 L200 348 L204 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"206\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"128.66666666666666\" x2=\"430\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"76.66666666666666\" x2=\"476\" y2=\"76.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"136.66666666666666\" x2=\"476\" y2=\"136.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"76.66666666666666\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"136.66666666666666\" r=\"4\" fill=\"#111\"/><line x1=\"476\" y1=\"76.66666666666666\" x2=\"476\" y2=\"93.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"476\" y1=\"119.66666666666666\" x2=\"476\" y2=\"136.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"476\" cy=\"106.66666666666666\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"476\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"163.33333333333331\" x2=\"430\" y2=\"204.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"234.99999999999997\" x2=\"430\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"219.99999999999997\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"228.99999999999997\" x2=\"430\" y2=\"210.99999999999997\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 215.99999999999997 L430 210.99999999999997 L435 215.99999999999997\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"224.99999999999997\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"430\" y1=\"276.66666666666663\" x2=\"430\" y2=\"320.3333333333333\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"346.3333333333333\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"333.3333333333333\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"430\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">A<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 12 Ω, R₂ = 20 Ω, R₃ = 22 Ω, R₄ = 18 Ω, R₅ = 25 Ω; e₁ = 20 V, e₂ = 24 V, e₃ = 15 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-1.219352,"shown":"−1,219"},{"label":"I₁, A","type":"real","answer":-1.565054,"shown":"−1,565"},{"label":"I₂, A","type":"real","answer":0.827811,"shown":"0,828"},{"label":"I₃, A","type":"real","answer":0.737243,"shown":"0,737"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":62.227188,"shown":"62,227"},{"label":"Показание на амперметъра, A","type":"real","answer":0.737243,"shown":"0,737"},{"label":"Показание на волтметъра, V","type":"real","answer":16.219352,"shown":"16,219"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R4 ∥ R5: R₄₅ = R4·R5/(R4 + R5) = 18·25/(18 + 25) = **10,465 Ω**\n- клон 2: Rе₂ = R₂ + R₄₅ = **30,465 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | R₁·I₁ − Rе₂·I₂ = − e₁ − e₂ | 12·I₁ − 30,465·I₂ = −44 |\n| II ЗК, контур II | Rе₂·I₂ − R₃·I₃ = e₂ − e₃ | 30,465·I₂ − 22·I₃ = 9 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/R₁ + 1/Rе₂ + 1/R₃)·V₁ = − e₁/R₁ + e₂/Rе₂ + e₃/R₃\n\n(1/12 + 1/30,465 + 1/22)·V₁ = −0,1971  →  0,16161·V₁ = −0,1971  →  **V₁ = −1,219 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (−e₁ − V₁)/R₁ = (−20 − (−1,219))/12 = **−1,565 A**\n- I₂ = (e₂ − V₁)/Rе₂ = (24 − (−1,219))/30,465 = **0,828 A**\n- I₃ = (e₃ − V₁)/R₃ = (15 − (−1,219))/22 = **0,737 A**\n\nПроверка с I ЗК: −1,565 + (0,828) + (0,737) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = − e₁·I₁ + e₂·I₂ + e₃·I₃ = (−20)·(−1,565) + (24)·(0,828) + (15)·(0,737) = **62,227 W**\n\nΣP_конс = R₁·I₁² + Rе₂·I₂² + R₃·I₃² = 12·2,449 + 30,465·0,685 + 22·0,544 = **62,227 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 3 и показва тока на клона: I_A = |I₃| = **0,737 A**\n- Волтметърът е успоредно на R3: U_V = R3·|I₃| = 22·0,737 = **16,219 V**"},{"id":"DC11","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"43 xt x=\"230\" y=\"338.3333333333333\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"206.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"64.0\" x2=\"456\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"206.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"206.0\" r=\"4\" fill=\"#111\"/><line x1=\"404\" y1=\"64.0\" x2=\"404\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"404\" y1=\"157.0\" x2=\"404\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"395\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"390\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"456\" y1=\"64.0\" x2=\"456\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"456\" y1=\"157.0\" x2=\"456\" y2=\"206.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"447\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"442\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₅<\/text><line x1=\"456\" y1=\"70.0\" x2=\"502\" y2=\"70.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"456\" y1=\"200.0\" x2=\"502\" y2=\"200.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"502\" y1=\"70.0\" x2=\"502\" y2=\"122.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"502\" y1=\"148.0\" x2=\"502\" y2=\"200.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"502\" cy=\"135.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"502\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"296.0\" x2=\"430\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 309.0 L430 314.0 L435 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"380\" y1=\"372\" x2=\"380\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M376 354 L380 348 L384 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"386\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 6 Ω, R₂ = 20 Ω, R₃ = 10 Ω, R₄ = 10 Ω, R₅ = 40 Ω; e₁ = 15 V, e₂ = 20 V, e₃ = 100 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-28.717949,"shown":"−28,718"},{"label":"I₁, A","type":"real","answer":7.286325,"shown":"7,286"},{"label":"I₂, A","type":"real","answer":1.623932,"shown":"1,624"},{"label":"I₃, A","type":"real","answer":-8.910256,"shown":"−8,91"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":1032.799145,"shown":"1032,799"},{"label":"Показание на амперметъра, A","type":"real","answer":7.286325,"shown":"7,286"},{"label":"Показание на волтметъра, V","type":"real","answer":71.282051,"shown":"71,282"}],"solution":"**1. Еквивалентни преобразувания**\n\n- клон 2: Rе₂ = R₂ + R₄ = **30 Ω**\n- R3 ∥ R5: R₃₅ = R3·R5/(R3 + R5) = 10·40/(10 + 40) = **8 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | R₁·I₁ − Rе₂·I₂ = e₁ − e₂ | 6·I₁ − 30·I₂ = −5 |\n| II ЗК, контур II | Rе₂·I₂ − Rе₃·I₃ = e₂ + e₃ | 30·I₂ − 8·I₃ = 120 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/R₁ + 1/Rе₂ + 1/Rе₃)·V₁ = e₁/R₁ + e₂/Rе₂ − e₃/Rе₃\n\n(1/6 + 1/30 + 1/8)·V₁ = −9,3333  →  0,325·V₁ = −9,3333  →  **V₁ = −28,718 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (e₁ − V₁)/R₁ = (15 − (−28,718))/6 = **7,286 A**\n- I₂ = (e₂ − V₁)/Rе₂ = (20 − (−28,718))/30 = **1,624 A**\n- I₃ = (−e₃ − V₁)/Rе₃ = (−100 − (−28,718))/8 = **−8,91 A**\n\nПроверка с I ЗК: 7,286 + (1,624) + (−8,91) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₁·I₁ + e₂·I₂ − e₃·I₃ = (15)·(7,286) + (20)·(1,624) + (−100)·(−8,91) = **1032,799 W**\n\nΣP_конс = R₁·I₁² + Rе₂·I₂² + Rе₃·I₃² = 6·53,091 + 30·2,637 + 8·79,393 = **1032,799 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 1 и показва тока на клона: I_A = |I₁| = **7,286 A**\n- Волтметърът е успоредно на R5 (а значи и на R3 ∥ R5): U_V = |I₃|·R₃₅ = 8,91·8 = **71,282 V**"},{"id":"DC12","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"128.66666666666666\" x2=\"70\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"61\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"56\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₁<\/text><line x1=\"70\" y1=\"163.33333333333331\" x2=\"70\" y2=\"177.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"262.66666666666663\" x2=\"70\" y2=\"276.66666666666663\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"177.33333333333331\" x2=\"96\" y2=\"177.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"262.66666666666663\" x2=\"96\" y2=\"26 =\"2\"/><line x1=\"250\" y1=\"157.0\" x2=\"250\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"241\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"236\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₂<\/text><line x1=\"250\" y1=\"220.0\" x2=\"250\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"320.0\" x2=\"250\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"250\" y1=\"314.0\" x2=\"250\" y2=\"296.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M245 301.0 L250 296.0 L255 301.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"230\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₂<\/text><line x1=\"224\" y1=\"372\" x2=\"224\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M220 354 L224 348 L228 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"230\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₂<\/text><line x1=\"430\" y1=\"50.0\" x2=\"430\" y2=\"113.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"157.0\" x2=\"430\" y2=\"220.0\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"421\" y=\"113.0\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"416\" y=\"140.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">R₃<\/text><line x1=\"430\" y1=\"105.0\" x2=\"476\" y2=\"105.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"165.0\" x2=\"476\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"105.0\" r=\"4\" fill=\"#111\"/><circle cx=\"430\" cy=\"165.0\" r=\"4\" fill=\"#111\"/><line x1=\"476\" y1=\"105.0\" x2=\"476\" y2=\"122.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"476\" y1=\"148.0\" x2=\"476\" y2=\"165.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"476\" cy=\"135.0\" r=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"476\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">V<\/text><line x1=\"430\" y1=\"220.0\" x2=\"430\" y2=\"290.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"320.0\" x2=\"430\" y2=\"390.0\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"305.0\" r=\"15\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"430\" y1=\"296.0\" x2=\"430\" y2=\"314.0\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M425 309.0 L430 314.0 L435 309.0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"410\" y=\"310.0\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-family=\"Arial, sans-serif\">e₃<\/text><line x1=\"404\" y1=\"372\" x2=\"404\" y2=\"348\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M400 354 L404 348 L408 354\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"410\" y=\"365\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-family=\"Arial, sans-serif\">I₃<\/text><\/svg>\n\nДадено: R₁ = 25 Ω, R₂ = 22 Ω, R₃ = 18 Ω, R₄ = 30 Ω, R₅ = 30 Ω; e₂ = 10 V, e₃ = 20 V.\n\nПоложителните посоки на токовете I₁, I₂, I₃ са нагоре — към възел (1) (червените стрелки). Потенциалът на възел (2) е V₂ = 0.\n\n1. Направете еквивалентните преобразувания и запишете в буквен вид системата уравнения по законите на Кирхоф (метод с клоновите токове).\n2. Определете потенциала V₁ и всички токове по метода на възловите потенциали.\n3. Проверете баланса на мощностите.\n4. Намерете показанията на амперметъра и волтметъра.\n\nБуквеният запис (т. 1) се оценява от теб по решението; въведи числените резултати (ток със знак според избраните посоки).","fields":[{"label":"V₁, V","type":"real","answer":-5.210421,"shown":"−5,21"},{"label":"I₁, A","type":"real","answer":0.130261,"shown":"0,13"},{"label":"I₂, A","type":"real","answer":0.691383,"shown":"0,691"},{"label":"I₃, A","type":"real","answer":-0.821643,"shown":"−0,822"},{"label":"ΣP_ген = ΣP_конс, W","type":"real","answer":23.346693,"shown":"23,347"},{"label":"Показание на амперметъра, A","type":"real","answer":0.130261,"shown":"0,13"},{"label":"Показание на волтметъра, V","type":"real","answer":14.789579,"shown":"14,79"}],"solution":"**1. Еквивалентни преобразувания**\n\n- R4 ∥ R5: R₄₅ = R4·R5/(R4 + R5) = 30·30/(30 + 30) = **15 Ω**\n- клон 1: Rе₁ = R₁ + R₄₅ = **40 Ω**\n\nСлед преобразуванията: m = 2 възела, n = 3 клона → по **I закон на Кирхоф: m − 1 = 1** уравнение, по **II закон: n − m + 1 = 2** уравнения (контур I — клонове 1 и 2, контур II — клонове 2 и 3, обходени по посока на часовниковата стрелка нагоре по левия клон).\n\n| | Буквен запис | С числа |\n|---|---|---|\n| I ЗК, възел (1) | I₁ + I₂ + I₃ = 0 | I₁ + I₂ + I₃ = 0 |\n| II ЗК, контур I | Rе₁·I₁ − R₂·I₂ = − e₂ | 40·I₁ − 22·I₂ = −10 |\n| II ЗК, контур II | R₂·I₂ − R₃·I₃ = e₂ + e₃ | 22·I₂ − 18·I₃ = 30 |\n\n(ЕДН, чиято посока съвпада с посоката на обхождане, е с „+“; падът R·I е с „+“, ако токът е по посока на обхождането.)\n\n**2. Метод на възловите потенциали** — V₂ = 0, едно уравнение за възел (1):\n\n(1/Rе₁ + 1/R₂ + 1/R₃)·V₁ = e₂/R₂ − e₃/R₃\n\n(1/40 + 1/22 + 1/18)·V₁ = −0,6566  →  0,12601·V₁ = −0,6566  →  **V₁ = −5,21 V**\n\nТоковете (законът на Ом за клон с ЕДН): Iₖ = (±eₖ − V₁)/Rₖ, с „+“ когато ЕДН е насочено нагоре:\n\n- I₁ = (−V₁)/Rе₁ = (−(−5,21))/40 = **0,13 A**\n- I₂ = (e₂ − V₁)/R₂ = (10 − (−5,21))/22 = **0,691 A**\n- I₃ = (−e₃ − V₁)/R₃ = (−20 − (−5,21))/18 = **−0,822 A**\n\nПроверка с I ЗК: 0,13 + (0,691) + (−0,822) = 0 ✓  ·  Отрицателен ток означава, че действителната посока е обратна на избраната.\n\n**3. Баланс на мощностите**\n\nΣP_ген = e₂·I₂ − e₃·I₃ = (10)·(0,691) + (−20)·(−0,822) = **23,347 W**\n\nΣP_конс = Rе₁·I₁² + R₂·I₂² + R₃·I₃² = 40·0,017 + 22·0,478 + 18·0,675 = **23,347 W** ✓\n\n(Източник с eₖ·Iₖ < 0 работи в консуматорен режим.)\n\n**4. Показания на уредите** (идеален амперметър — R = 0, идеален волтметър — R = ∞; уредите показват модула)\n\n- Амперметърът е в клон 1 и показва тока на клона: I_A = |I₁| = **0,13 A**\n- Волтметърът е успоредно на R3: U_V = R3·|I₃| = 18·0,822 = **14,79 V**"},{"id":"DC13","group":"dc","lec":4,"title":"Разклонена верига с постоянен ток","text":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\" width=\"560\" role=\"img\" aria-label=\"Схема\"><line x1=\"70\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"390\" x2=\"430\" y2=\"390\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"50\" r=\"4\" fill=\"#111\"/><circle cx=\"250\" cy=\"390\" r=\"4\" fill=\"#111\"/><text x=\"250\" y=\"38\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(1)<\/text><text x=\"250\" y=\"414\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" font-family=\"Arial, sans-serif\" font-weight=\"bold\">(2)<\/text><line x1=\"70\" y1=\"50.0\" x2=\"70\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"70\" y1=\"149.33333333333331\" x2=\"70\" y2=\"163.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"64.0\" x2=\"96\" y2=\"64.0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"149.33333333333331\" x2=\"96\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"64.0\" r=\"4\" fill=\"#111\"/><circle cx=\"70\" cy=\"149.33333333333331\" r=\"4\" fill=\"#111\"/><line x1=\"44\" y1=\"64.0\" x2=\"44\" y2=\"84.66666666666666\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"44\" y1=\"128.66666666666666\" x2=\"44\" y2=\"149.33333333333331\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"35\" y=\"84.66666666666666\" width=\"18\" height=\"44\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"30\" y=\"111.66666666666666\" font-size=\"14\" text-anchor=\"end\" fill=\"#111\" font-fa
