<!doctype html>
<html lang="bg">
<head>
<script src="../gate.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЕТ тестове</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f8f9fb;--text:#1d2125;--muted:#5f6b76;--border:#d8dde3;
  --accent:#0f6cbf;--accent-ink:#ffffff;--accent-soft:#e7f0fa;
  --ok:#1e7e34;--ok-bg:#e6f4ea;--bad:#c62828;--bad-bg:#fdecea;--flag:#d97706;--half:#b45309;--half-bg:#fdf3e1;--code:#eef1f4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
    --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
    --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--half:#fbbf24;--half-bg:#3a2e14;--code:#2a2f36;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
  --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
  --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--half:#fbbf24;--half-bg:#3a2e14;--code:#2a2f36;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;color:inherit}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.2rem;margin:28px 0 12px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  padding:7px 13px;border-radius:7px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,.nav-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:.78rem;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.badge.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.half{background:var(--half-bg);color:var(--half);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;
  align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px;box-shadow:var(--shadow)}
.lec-h{display:flex;align-items:center;gap:12px;min-width:0}
.num{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.lec-t{font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem;margin:4px 0}
.toggle input{width:17px;height:17px;accent-color:var(--accent);flex:none}
select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);max-width:100%}

/* quiz */
.quiz{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:16px}
.side .card{padding:12px}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.nav-b{position:relative;height:42px;border:1px solid var(--border);border-radius:5px;background:var(--panel);cursor:pointer;
  font-size:.85rem;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:3px;overflow:hidden}
.nav-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:transparent}
.nav-b.ans::after{background:var(--muted);opacity:.45}
.nav-b.r-ok::after{background:var(--ok);opacity:.8}
.nav-b.r-bad::after{background:var(--bad);opacity:.8}
.nav-b.r-half::after{background:var(--half);opacity:.8}
.nav-b.cur{border:2px solid var(--text)}
.nav-b.task{font-weight:700}
.nav-b:disabled{cursor:not-allowed;opacity:.55}
.nav-b.fl::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--flag) transparent transparent}
.timer{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qwrap{display:grid;grid-template-columns:150px 1fr;gap:14px}
.qinfo{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.85rem;color:var(--muted);align-self:start}
.qinfo .qn{font-size:.85rem}
.qinfo .qn b{font-size:1.35rem;color:var(--text)}
.qinfo div{margin-bottom:6px}
.flagbtn{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;font-size:.85rem;text-align:left}
.flagbtn.on{color:var(--flag);font-weight:600}
.qbox{background:var(--accent-soft);border-radius:8px;padding:18px 20px;min-width:0}
.qtext{font-size:1.06rem;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.opt:hover{background:var(--panel)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt .ltr{min-width:1.4em;color:var(--muted)}
.opt.sel{background:var(--panel);border-color:var(--border)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:.95rem}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.wrong{background:var(--bad-bg);color:var(--bad)}
.fb.half{background:var(--half-bg);color:var(--half)}
.fb span{color:var(--text)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.lectag{font-size:.78rem;color:var(--muted);margin-bottom:6px}

/* писмени задачи */
.tmd{font-size:1.02rem;overflow-x:auto}
.tmd p{margin:0 0 10px}
.tmd table{border-collapse:collapse;margin:8px 0 12px;font-size:.9rem;background:var(--panel)}
.tmd th,.tmd td{border:1px solid var(--border);padding:4px 8px;text-align:center;vertical-align:top;white-space:nowrap}
.tmd th{background:var(--panel2)}
.tmd pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto;font-size:.9rem;line-height:1.35}
.tmd pre code{background:none;padding:0}
.fields{display:grid;gap:10px;margin:14px 0 6px}
.fld{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:4px 10px;align-items:center}
.fld>span{font-weight:600;font-size:.94rem}
.fld .hint{grid-column:2;font-size:.8rem;color:var(--muted)}
.fld input{font:15px/1.4 ui-monospace,Consolas,monospace;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);width:100%;min-width:0}
.fld input:focus,.work:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld input.ok{border-color:var(--ok);background:var(--ok-bg)}
.fld input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fld input.half{border-color:var(--half);background:var(--half-bg)}
.fld .mark{grid-column:2;font-size:.85rem}
.work{width:100%;min-height:120px;resize:vertical;font:14px/1.45 ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);margin-top:4px}
.worklbl{font-size:.88rem;color:var(--muted);margin-top:10px;display:block}
.sol{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.sol>b{display:block;margin-bottom:6px}
table.ans{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
table.ans td,table.ans th{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
table.ans th{color:var(--muted);font-weight:600;font-size:.84rem}
table.ans td.v{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.selfgrade{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--border)}
.work.big{min-height:170px;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.essay .mark{font-size:.88rem;color:var(--muted);margin-top:6px}
ul.kp{margin:6px 0 4px;padding-left:20px;font-size:.93rem}
ul.kp li{margin:2px 0}
ul.kp li.y{color:var(--ok)}
ul.kp li.n{color:var(--bad)}
.tmd svg{max-width:100%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--border)}
pre.mywork{white-space:pre-wrap;background:var(--code);padding:8px 10px;border-radius:7px;font-size:.88rem;margin:6px 0}

/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;font-weight:700}
.ring span{background:var(--panel);width:86px;height:86px;border-radius:50%;display:grid;place-items:center}
.rev{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;min-width:0}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.rev.half{border-left-color:var(--half)}
.rev .opt{cursor:default;padding:5px 9px}
.rev .opt:hover{background:transparent}
.rev .opt.ok:hover{background:var(--ok-bg)}
.rev .opt.bad:hover{background:var(--bad-bg)}
.rev .why{font-size:.92rem;margin-top:6px;color:var(--muted)}
.rev .why b{color:var(--text)}

/* summary */
.md{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 24px 24px;overflow-x:auto}
.md h3{margin-top:26px;border-bottom:1px solid var(--border);padding-bottom:4px}
.md table{border-collapse:collapse;margin:10px 0;font-size:.93rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md li{margin:2px 0}
.kbd{font-size:.8rem;color:var(--muted);margin-top:14px}

/* профил и прогрес */
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}
.inp{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
input.inp{min-width:0;flex:1 1 200px;max-width:320px}
textarea.inp{width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;word-break:break-all;margin:6px 0 10px}
.stat{font-size:1.9rem;font-weight:700;line-height:1.2}
.tbl-wrap{overflow-x:auto;padding:4px 6px}
table.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl th{color:var(--muted);font-weight:600;font-size:.84rem}
table.tbl td.t{white-space:normal;min-width:170px}
table.tbl tr.weak td{background:var(--bad-bg)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .tbl-wrap{padding:2px}
  table.tbl{font-size:.84rem}
  table.tbl th,table.tbl td{padding:6px 5px}
  table.tbl td.t{min-width:110px}
  table.tbl td.dt{white-space:normal;min-width:76px}
  .fld{grid-template-columns:1fr}
  .fld .hint,.fld .mark{grid-column:1}
}
.who{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted)}
.who b{color:var(--text)}

@media (max-width:820px){
  .grid3{grid-template-columns:1fr}
  .quiz{grid-template-columns:1fr}
  .side{position:static;order:2}
  .qwrap{grid-template-columns:1fr}
  .qinfo{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .qinfo div{margin:0}
  .md{padding:4px 14px 16px}
  .qbox{padding:14px 12px}
}
</style>
</head>

<script id="data" type="application/json">{"course":{"pfx":"et","tag":"ЕТ","name":"Електротехника","lecWord":"Тема","testNames":["A","B","C"],"secPerQ":60,"secPerTask":2400,"tasksTitle":"Задачи (като на изпита)","exam":{"q":16,"ptsQ":1,"tasks":2,"ptsTask":32,"minutes":120},"subscripts":true},"lectures":[{"num":1,"title":"Тема 1 — Основни електрически величини и закони","short":"Основни електрически величини и закони","summary":"### Основни електрически величини\nВъв въвеждащото упражнение (ЛУ ЕТ #1) са дадени основните величини при **постояннотоков режим** и техните мерни единици:\n\n| Величина | Означение | Единица | Връзка |\n|---|---|---|---|\n| **Електрически ток** | I (i) | ампер, **A** | I = U/R |\n| **Електрическо напрежение** | U (u) | волт, **V** | U₁₂ = V₁ − V₂ |\n| **Електрическо съпротивление** | R | ом, **Ω** | R = U/I |\n| **Електрическа проводимост** | G | сименс, **S** | G = 1/R |\n| **Мощност** | P | ват, **W** | P = U·I |\n| **Енергия / топлина** | W, Q | джаул, **J** | Q = R·I²·t |\n\n- **Напрежението** между две точки е разлика на техните **потенциали**: U₁₂ = V₁ − V₂. Затова U₂₁ = −U₁₂. Стрелката на напрежението на схемата сочи от точка 1 към точка 2.\n- **Проводимостта** е реципрочна на съпротивлението: резистор 20 Ω има G = 1/20 = 0,05 S. Проводимостите са удобни при паралелно свързване и в метода на възловите потенциали.\n- **Мощността** P = U·I; със закона на Ом: **P = R·I² = U²/R**. Мощността, отделена в резистор, е винаги положителна (консумира се).\n\n### Мерни единици и представки\n- **Основни единици в SI**: ток I [A], дължина l [m], време t [s], маса m [kg], температура T [K], сила на светлината I [cd], количество вещество n [mol].\n- **Производни (произволни) единици** се получават от формула: скорост v = s/t [m/s]; **плътност на тока** j = I/S [A/mm²] (ток, разделен на сечението на проводника).\n- **Кратни и дробни единици (представки)** — в записките с пример във фаради (F):\n\n| Представка | Означение | Множител |\n|---|---|---|\n| пико | p | 10⁻¹² |\n| нано | n | 10⁻⁹ |\n| микро | μ | 10⁻⁶ |\n| мили | m | 10⁻³ |\n| кило | k | 10³ |\n| мега | M | 10⁶ |\n\nПримери: 4,7 kΩ = 4700 Ω; 25 mA = 0,025 A; 100 μF = 10⁻⁴ F; 2,2 MΩ = 2,2·10⁶ Ω; 1 nF = 1000 pF.\n\n### Закон на Ом\n- **R = U/I**, съответно **U = R·I** и **I = U/R** (с проводимост: I = G·U).\n- Пример: резистор 50 Ω при напрежение 10 V пропуска ток I = 10/50 = 0,2 A = 200 mA.\n- Напрежението върху резистор е насочено **по посоката на тока** през него („пад на напрежение“ R·I). Ако токът се окаже отрицателен, реалната му посока е обратна на избраната.\n\n### Закон на Джаул–Ленц\n- Топлината, отделена в резистор: **Q[J] = R[Ω]·I²[A]·t[s]** (= P·t).\n- Пример: R = 10 Ω, I = 2 A, t = 60 s ⇒ Q = 10·4·60 = 2400 J. При двойно по-голям ток топлината става **4 пъти** по-голяма (квадратна зависимост).\n\n### Идеални източници\n- **Идеален източник на ЕДН** e (кръгче със стрелка): напрежението на изводите му е **U = e** независимо от тока. Стрелката на e сочи от „−“ към „+“, т.е. посоката, в която източникът „гони“ тока.\n- **Идеален източник на ток** j: токът в клона му е **j** независимо от товара; напрежението върху него (Uⱼ) е неизвестно и се намира от веригата.\n- **Реален източник** = идеален ЕДН e + вътрешно съпротивление Rᵢ последователно: U = e − Rᵢ·I.\n\n### Празен ход и късо съединение\n- **Празен ход (прекъсване)**: веригата е отворена ⇒ **I₀ = 0**, R → ∞; между изводите остава напрежение **U₀** (на празен ход); за реален източник U₀ = e.\n- **Късо съединение**: изводите са свързани с проводник без съпротивление ⇒ **Uк = 0**, R = 0; тече ток на късо съединение **Iк** (за реален източник Iк = e/Rᵢ).\n- Оттук **Rᵢ = U₀/Iк** — вътрешното съпротивление се намира от двата опита.\n\n### Измервателни уреди\n- **Амперметър** (A) — мери ток, **свързва се последователно** в клона. Идеалният амперметър има R_A = 0 ⇒ при анализа се замества с **късо съединение**.\n- **Волтметър** (V) — мери напрежение, **свързва се успоредно** на елемента (между двете точки). Идеалният волтметър има R_V → ∞ ⇒ при анализа се замества с **прекъсване**.\n- В задачите уредите се „премахват мислено“, веригата се решава без тях, а показанията им се намират накрая: амперметърът показва тока на своя клон, волтметърът — напрежението между точките, към които е включен (по II закон на Кирхоф).\n\n### Пример — диод и резистор\nИзточник 12 V захранва последователно свързани **диод** (пад на напрежение в права посока 2 V) и резистор R. По II ЗК: 12 = 2 + U_R ⇒ **U_R = 10 V**; токът е I = 10/R (напр. при R = 500 Ω ⇒ I = 20 mA).\n\n### Протокол от лабораторно упражнение\nОформление: листи A4, чертожни инструменти. Заглавна страница: „Протокол № X“, тема, разработил (име, фак. №, специалност КСТ, курс, група), проверил. Съдържание: **I) Теоретични основи; II) Задачи за изпълнение** (II.1 схема на опитната постановка, II.2 задачи…); **III) Анализ и изводи**. Първият протокол е „Основни електрически величини при постояннотоков режим“.\n\n### Капани за изпита\n- **Празен ход ≠ нулево напрежение.** При прекъсване токът е 0, но напрежението U₀ между изводите обикновено **не** е 0. При късо съединение е обратното — U = 0, но токът Iк ≠ 0. (В записките за празен ход е написано „U₀ = 0“ — това е описка.)\n- **Амперметър — последователно, волтметър — успоредно.** Волтметър, включен последователно, прекъсва веригата; амперметър, включен успоредно, я дава на късо.\n- **P = U·I = R·I² = U²/R** — при еднакъв ток повече мощност отделя по-голямото съпротивление; при еднакво напрежение — по-малкото.\n- **Квадратна зависимост**: удвояване на тока ⇒ 4 пъти мощност и топлина.\n- **Представки**: m (мили, 10⁻³) ≠ M (мега, 10⁶); μ = 10⁻⁶. Превръщай в основни единици **преди** да смяташ (mA → A, kΩ → Ω).\n- **G = 1/R**: 0,1 S отговаря на 10 Ω, не на 0,1 Ω.\n- **U₁₂ = V₁ − V₂** — внимавай с реда; U₂₁ = −U₁₂.\n- Отрицателен ток в отговора не е грешка — означава, че реалната посока е обратна на избраната.","testNames":["A","B","C"],"tests":{"A":[{"id":"L01-A-1","n":1,"text":"В каква единица се измерва електрическата проводимост G?","opts":["ом (Ω)","сименс (S)","ват (W)","волт (V)"],"correct":1,"expl":"G = 1/R, единица **сименс** [S] = 1/Ω."},{"id":"L01-A-2","n":2,"text":"Резистор 50 Ω е под напрежение 10 V. Какъв ток тече през него?","opts":["5 A","500 A","0,5 A","0,2 A"],"correct":3,"expl":"По закона на Ом I = U/R = 10/50 = **0,2 A**."},{"id":"L01-A-3","n":3,"text":"Как се свързва амперметър, за да измери тока в клон?","opts":["последователно в клона","успоредно на клона","между два възела","успоредно на източника"],"correct":0,"expl":"Амперметърът се включва **последователно** — през него минава измерваният ток."},{"id":"L01-A-4","n":4,"text":"Колко е топлината по Джаул–Ленц в резистор 10 Ω при ток 2 A за 60 s?","opts":["1200 J","120 J","2400 J","24 000 J"],"correct":2,"expl":"Q = R·I²·t = 10·4·60 = **2400 J**. 1200 J е без квадрат на тока."},{"id":"L01-A-5","n":5,"text":"Какво е характерно за режима „празен ход“?","opts":["напрежението е нула","R = 0, токът е максимален","токът е нула, R → ∞","токът и напрежението са нула"],"correct":2,"expl":"При празен ход веригата е прекъсната: **I = 0**, но напрежението U₀ между изводите остава."},{"id":"L01-A-6","n":6,"text":"Каква мощност се отделя в резистор 4 Ω при напрежение 12 V?","opts":["36 W","48 W","3 W","576 W"],"correct":0,"expl":"P = U²/R = 144/4 = **36 W**. 48 W = U·R — грешна формула."},{"id":"L01-A-7","n":7,"text":"Колко ома са 4,7 kΩ?","opts":["470 Ω","47 000 Ω","0,0047 Ω","4700 Ω"],"correct":3,"expl":"кило = 10³ ⇒ 4,7·10³ = **4700 Ω**."},{"id":"L01-A-8","n":8,"text":"Как е дефинирано напрежението U₁₂ между точки 1 и 2?","opts":["U₁₂ = V₂ − V₁","U₁₂ = V₁ − V₂","U₁₂ = V₁ + V₂","U₁₂ = V₁·V₂"],"correct":1,"expl":"Напрежението е разлика на потенциалите: **U₁₂ = V₁ − V₂**."},{"id":"L01-A-9","n":9,"text":"Коя от изброените НЕ е основна единица в SI?","opts":["волт (V)","ампер (A)","килограм (kg)","мол (mol)"],"correct":0,"expl":"Основните са A, m, s, kg, K, cd, mol; **волтът** е производна единица."},{"id":"L01-A-10","n":10,"text":"Източник 12 V захранва последователно диод (пад 2 V) и резистор R. Колко е напрежението върху R?","opts":["12 V","14 V","10 V","6 V"],"correct":2,"expl":"По II ЗК: 12 = 2 + U_R ⇒ **U_R = 10 V**."}],"B":[{"id":"L01-B-1","n":1,"text":"Каква е проводимостта на резистор 20 Ω?","opts":["20 S","0,5 S","0,05 S","2 S"],"correct":2,"expl":"G = 1/R = 1/20 = **0,05 S**."},{"id":"L01-B-2","n":2,"text":"Как се замества идеален волтметър при анализа на схемата?","opts":["с прекъсване","с късо съединение","с резистор 1 Ω","с източник на ЕДН"],"correct":0,"expl":"Идеалният волтметър има R_V → ∞ — не пропуска ток ⇒ **прекъсване**."},{"id":"L01-B-3","n":3,"text":"През резистор 200 Ω тече ток 25 mA. Колко е напрежението върху него?","opts":["5000 V","5 V","8 V","0,125 V"],"correct":1,"expl":"U = R·I = 200·0,025 = **5 V**. 5000 V — забравено превръщане на mA в A."},{"id":"L01-B-4","n":4,"text":"Какво е характерно за късо съединение между два извода?","opts":["токът е нула","R → ∞","напрежението е максимално","напрежението е нула, R = 0"],"correct":3,"expl":"При късо съединение изводите са свързани без съпротивление: **U = 0**, тече ток Iк."},{"id":"L01-B-5","n":5,"text":"Каква мощност отделя резистор 100 Ω при ток 0,5 A?","opts":["50 W","25 W","200 W","2,5 W"],"correct":1,"expl":"P = R·I² = 100·0,25 = **25 W**. 50 W е R·I без квадрат."},{"id":"L01-B-6","n":6,"text":"Какво изразява законът на Джаул–Ленц?","opts":["сумата на токовете във възел","връзката R = U/I","топлината Q = R·I²·t","сумата на напреженията в контур"],"correct":2,"expl":"Джаул–Ленц: отделената в резистора **топлина Q = R·I²·t** [J]."},{"id":"L01-B-7","n":7,"text":"На колко е равна представката „микро“ (μ)?","opts":["10⁻⁶","10⁻³","10⁻⁹","10⁶"],"correct":0,"expl":"микро μ = **10⁻⁶**; мили = 10⁻³, нано = 10⁻⁹, мега = 10⁶."},{"id":"L01-B-8","n":8,"text":"Как се изменя топлината в резистор, ако токът се удвои (R и t — същите)?","opts":["нараства 2 пъти","остава същата","намалява 2 пъти","нараства 4 пъти"],"correct":3,"expl":"Q ~ I² ⇒ (2I)² = 4I² — **4 пъти**."},{"id":"L01-B-9","n":9,"text":"Реален източник има напрежение на празен ход 12 V и ток на късо съединение 0,5 A. Колко е вътрешното му съпротивление?","opts":["6 Ω","24 Ω","0,04 Ω","12 Ω"],"correct":1,"expl":"Rᵢ = U₀/Iк = 12/0,5 = **24 Ω**."},{"id":"L01-B-10","n":10,"text":"Каква величина е j = I/S и в какви единици се измерва?","opts":["проводимост, S","мощност, W/mm²","напрежение, V/m","плътност на тока, A/mm²"],"correct":3,"expl":"**Плътността на тока** j = I/S се измерва в A/mm²."}],"C":[{"id":"L01-C-1","n":1,"text":"В каква единица се измерва мощността?","opts":["джаул (J)","сименс (S)","ампер (A)","ват (W)"],"correct":3,"expl":"P = U·I, единица **ват** [W]; джаулът е за енергия/топлина."},{"id":"L01-C-2","n":2,"text":"Какво напрежение има на изводите си идеален източник на ЕДН e?","opts":["U = 0 при празен ход","U = e при всеки ток","U = e/R","U = e само при късо"],"correct":1,"expl":"Идеалният ЕДН поддържа **U = e** независимо от тока през него."},{"id":"L01-C-3","n":3,"text":"Уред консумира 0,5 A при 230 V. Каква е мощността му?","opts":["460 W","230,5 W","115 W","57,5 W"],"correct":2,"expl":"P = U·I = 230·0,5 = **115 W**."},{"id":"L01-C-4","n":4,"text":"Как се свързва волтметър, за да измери напрежението на резистор?","opts":["успоредно на резистора","последователно с резистора","последователно с източника","вместо резистора"],"correct":0,"expl":"Волтметърът се включва **успоредно** между двете точки, чието напрежение мери."},{"id":"L01-C-5","n":5,"text":"Колко ампера са 25 mA?","opts":["0,025 A","0,25 A","2,5 A","25 000 A"],"correct":0,"expl":"мили = 10⁻³ ⇒ 25·10⁻³ = **0,025 A**."},{"id":"L01-C-6","n":6,"text":"Резистор има проводимост 0,1 S. Колко е съпротивлението му?","opts":["0,1 Ω","1 Ω","100 Ω","10 Ω"],"correct":3,"expl":"R = 1/G = 1/0,1 = **10 Ω**."},{"id":"L01-C-7","n":7,"text":"Резистор 3 kΩ е под напрежение 9 V. Какъв е токът?","opts":["3 A","3 mA","27 mA","0,33 mA"],"correct":1,"expl":"I = U/R = 9/3000 = 0,003 A = **3 mA**."},{"id":"L01-C-8","n":8,"text":"Как се замества идеален амперметър при анализа на схемата?","opts":["с прекъсване","с източник на ток","с късо съединение","с голямо съпротивление"],"correct":2,"expl":"Идеалният амперметър има R_A = 0 ⇒ **късо съединение**."},{"id":"L01-C-9","n":9,"text":"Кое твърдение за празен ход на реален източник (e, Rᵢ) е вярно?","opts":["U = 0, а I = e/Rᵢ","I = 0 и U = 0","U = e, а I = e/Rᵢ","I = 0, а U₀ = e"],"correct":3,"expl":"При празен ход няма ток и няма пад в Rᵢ ⇒ **U₀ = e**."},{"id":"L01-C-10","n":10,"text":"Нагревател е с мощност 1100 W при 220 V. Колко е съпротивлението му?","opts":["44 Ω","5 Ω","0,2 Ω","242 Ω"],"correct":0,"expl":"R = U²/P = 48 400/1100 = **44 Ω**. 5 Ω = P/U — грешна формула (това е токът в A)."}]}},{"num":2,"title":"Тема 2 — Закони на Кирхоф. Свързване на резистори и еквивалентни преобразувания","short":"Закони на Кирхоф. Свързване на резистори и еквивалентни преобразувания","summary":"### Основни понятия\n- **Клон** — участък от веригата между два възела, през който тече един и същ ток (може да съдържа няколко последователни елемента).\n- **Възел** — точка, в която се свързват **три или повече** клона.\n- **Контур** — затворен път през клонове. **Независим контур** съдържа поне един клон, който не участва в другите избрани контури.\n- **Пасивен двуполюсник** — съдържа само резистори (без източници); може да се замести с един **еквивалентен резистор Rₑ**. Активен двуполюсник — съдържа източници.\n\n### Първи закон на Кирхоф (I ЗК, за възел)\n- **Σ iₖ = 0** — алгебричната сума на токовете във възел е нула.\n- Правило за знака (както в записките): токовете, които **излизат** от възела, с „+“, а влизащите — с „−“ (или обратното, но еднакво за целия възел).\n- Пример от записките: във възел влизат i₁, i₃, i₅ и излизат i₂, i₄:\n  −i₁ + i₂ − i₃ + i₄ − i₅ = 0 ⇔ i₁ − i₂ + i₃ − i₄ + i₅ = 0 ⇔ **i₁ + i₃ + i₅ = i₂ + i₄** (влизащите = излизащите).\n- Смисъл: зарядът във възела не се натрупва.\n\n### Втори закон на Кирхоф (II ЗК, за контур)\n- **Σ Uₖ = 0** — сумата от напреженията по затворен контур е нула. В удобна форма: **Σ Rₖ·iₖ = Σ eₖ** (падовете на напрежение = сумата от ЕДН).\n- Знаци при обхождане на контура в избраната посока:\n  - **R·i** е с „+“, ако токът i е **по посоката на обхождане**, и с „−“, ако е срещу нея;\n  - **e** е с „+“, ако стрелката на ЕДН е **по посоката на обхождане**, и с „−“, ако е срещу нея;\n  - напрежение (напр. на волтметър или токов източник Uⱼ) в лявата страна — с „+“, ако стрелката му е по обхождането.\n- Пример от записките (контур с четири клона): горе e₁ и R₁ (i₁ надясно), вдясно R₂ и e₂ (i₂ нагоре), долу e₃ и R₃ (i₃ надясно), вляво R₄ (i₄ надолу); обхождане обратно на часовниковата стрелка:\n  **−R₁i₁ + R₄i₄ + R₃i₃ + R₂i₂ = −e₁ + e₂ − e₃**.\n\n### Последователно свързване\n- Резисторите са в един клон — през тях тече **един и същ ток** i.\n- По II ЗК: U = U₁ + U₂ + … + Uₙ (в записките: U₁ + U₂ + … + Uₙ − U = 0).\n- **Rₑ = R₁ + R₂ + … + Rₙ**; Rₑ е по-голямо от най-голямото съпротивление.\n- **Делител на напрежение**: Uₖ = U·Rₖ/Rₑ. Пример: 12 V върху 2 Ω и 4 Ω ⇒ U₁ = 4 V, U₂ = 8 V.\n\n### Паралелно (успоредно) свързване\n- Резисторите са между **едни и същи два възела a и b** — имат **едно и също напрежение** U.\n- По I ЗК: i = i₁ + i₂ + … + iₙ ⇒ U/R₁ + U/R₂ + … + U/Rₙ = U/Rₑ.\n- **1/Rₑ = 1/R₁ + 1/R₂ + … + 1/Rₙ**, т.е. **Gₑ = Σ Gₖ**; Rₑ е по-малко от най-малкото съпротивление.\n- За **два резистора**: **Rₑ = R₁·R₂/(R₁ + R₂)** („произведение върху сума“). За n еднакви резистора R: Rₑ = R/n.\n- **Делител на ток** (два резистора): i₁ = i·R₂/(R₁ + R₂), i₂ = i·R₁/(R₁ + R₂) — по-голям ток тече през по-малкото съпротивление.\n\n| | Последователно | Паралелно |\n|---|---|---|\n| обща величина | ток i | напрежение U |\n| сумират се | напреженията | токовете |\n| еквивалент | Rₑ = ΣRₖ | Gₑ = ΣGₖ, 1/Rₑ = Σ1/Rₖ |\n| два резистора | R₁ + R₂ | R₁R₂/(R₁ + R₂) |\n| делител | Uₖ = U·Rₖ/Rₑ | i₁ = i·R₂/(R₁ + R₂) |\n\nПример от упражнението: R₁ = 20 Ω, R₂ = 30 Ω ⇒ последователно **50 Ω**, паралелно 20·30/50 = **12 Ω** (измерват се R₁, R₂ поотделно и двете свързвания).\n\n### Смесено свързване — решен пример\nСхема: между входните клеми a–b е приложено U = 220 V; от a ток i₁ минава през **R₁ = 10 Ω** до възел c; от c към b има два паралелни клона — **R₂ = 20 Ω** (ток i₂ надолу) и **R₃ = 30 Ω** (ток i₃).\n1. „Отвътре навън“: R₂ ∥ R₃ ⇒ R₂₃ = R₂R₃/(R₂ + R₃) = 600/50 = **12 Ω**.\n2. R₁ е последователно на R₂₃ ⇒ **Rₑ = R₁ + R₂₃ = 22 Ω**.\n3. i₁ = U/Rₑ = 220/22 = **10 A**.\n4. По II ЗК: R₁i₁ + U₂ − U = 0 ⇒ U₂ = 220 − 100 = **120 V** (общо напрежение на R₂ и R₃).\n5. i₂ = U₂/R₂ = 120/20 = **6 A**, i₃ = U₂/R₃ = 120/30 = **4 A**; проверка по I ЗК: 6 + 4 = 10 A ✓.\n6. Мощности: R₁ — 1000 W, R₂ — 720 W, R₃ — 480 W; общо 2200 W = U·i₁ ✓.\n\n### Метод с еквивалентни преобразувания\n- Последователно постепенно заместване на групи резистори (последователни или паралелни) с еквивалентни, докато остане един Rₑ; намира се общият ток, след това се „връщаме назад“ и намираме напреженията и токовете по закона на Ом и законите на Кирхоф.\n- **Пасивиране/опростяване** преди решаване на сложна верига: резистори без източници между два възела се заменят с еквивалент (напр. R₄₅ = R₄R₅/(R₄ + R₅), R₁₄ = R₁ + R₄).\n- Еквивалентни замени на уреди и източници: **амперметър ≡ късо съединение**, **волтметър ≡ прекъсване**; при „изключване“ (пасивиране) на източниците: **ЕДН → късо съединение**, **източник на ток → прекъсване**.\n\n### Пример — съпротивление между възли (лабораторно)\nТри еквивалентни съпротивления образуват **триъгълник** между възлите (2), (3), (4): R₂₄ = 65,3 Ω между (2)–(3), R₃₆ = 269,6 Ω между (2)–(4), R₅ = 106 Ω между (3)–(4). Съпротивлението между два възела е едната страна **успоредно на сумата от другите две**:\n- R₍₂₎₍₃₎ = R₂₄·(R₃₆ + R₅)/(R₂₄ + R₃₆ + R₅) = 65,3·375,6/440,9 ≈ **55,6 Ω**;\n- R₍₃₎₍₄₎ = R₅·(R₂₄ + R₃₆)/(R₂₄ + R₃₆ + R₅) = 106·334,9/440,9 ≈ **80,5 Ω**;\n- R₍₂₎₍₄₎ = R₃₆·(R₂₄ + R₅)/(R₂₄ + R₃₆ + R₅) = 269,6·171,3/440,9 ≈ **104,8 Ω**.\n\n### Капани за изпита\n- **Паралелно ≠ сума на съпротивленията** — сумират се проводимостите. Rₑ на паралелни резистори е **по-малко** от най-малкия.\n- Формулата R₁R₂/(R₁ + R₂) е само за **два** резистора; за три — 1/Rₑ = 1/R₁ + 1/R₂ + 1/R₃ (или по двойки).\n- **Делител на ток**: през R₁ тече i·**R₂**/(R₁ + R₂) — в числителя е **другото** съпротивление.\n- В I ЗК знакът зависи от това дали токът влиза или излиза — избери правило и го спазвай за целия възел.\n- В II ЗК: R·i с „+“ само ако токът е по обхождането; e с „+“ само ако стрелката му е по обхождането. Посоката на обхождане е произволна, но трябва да е една и съща в цялото уравнение.\n- При смесено свързване не прилагай U на целия вход към паралелната група — първо извади пада върху последователния резистор (U₂ = U − R₁i₁).\n- Пасивиране: ЕДН → **късо**, източник на ток → **прекъсване** (не обратното).","testNames":["A","B","C"],"tests":{"A":[{"id":"L02-A-1","n":1,"text":"Какво гласи първият закон на Кирхоф?","opts":["сумата на напреженията в контур е нула","сумата на токовете във възел е нула","токът е пропорционален на напрежението","мощностите на източниците са равни"],"correct":1,"expl":"I ЗК: **Σ iₖ = 0** във всеки възел."},{"id":"L02-A-2","n":2,"text":"Колко е еквивалентното съпротивление на 20 Ω и 30 Ω, свързани паралелно?","opts":["50 Ω","25 Ω","600 Ω","12 Ω"],"correct":3,"expl":"Rₑ = R₁R₂/(R₁+R₂) = 600/50 = **12 Ω**. 50 Ω е последователно."},{"id":"L02-A-3","n":3,"text":"Във възел влизат i₁ = 3 A и i₂ = 5 A, а излиза i₃ = 2 A и още един ток i₄. Колко е i₄ (излизащ)?","opts":["6 A","10 A","4 A","0 A"],"correct":0,"expl":"Влизащи = излизащи: 3 + 5 = 2 + i₄ ⇒ **i₄ = 6 A**."},{"id":"L02-A-4","n":4,"text":"Коя величина е обща за паралелно свързани резистори?","opts":["токът","мощността","напрежението","топлината"],"correct":2,"expl":"Паралелните резистори са между едни и същи два възела ⇒ **едно и също напрежение**."},{"id":"L02-A-5","n":5,"text":"R₁ = 10 Ω е последователно на групата R₂ = 20 Ω ∥ R₃ = 30 Ω. Колко е Rₑ?","opts":["60 Ω","12 Ω","22 Ω","15 Ω"],"correct":2,"expl":"R₂₃ = 12 Ω; Rₑ = 10 + 12 = **22 Ω**."},{"id":"L02-A-6","n":6,"text":"Как се записва II закон на Кирхоф в удобна за задачи форма?","opts":["Σ Rₖ·iₖ = Σ eₖ","Σ iₖ = Σ eₖ","Σ Rₖ = Σ eₖ·iₖ","Σ Gₖ·eₖ = 0"],"correct":0,"expl":"За контур: сумата от падовете **R·i** е равна на сумата от **ЕДН**."},{"id":"L02-A-7","n":7,"text":"Резистори 2 Ω и 4 Ω са последователно под напрежение 12 V. Колко е напрежението върху 4 Ω?","opts":["4 V","6 V","12 V","8 V"],"correct":3,"expl":"Делител: U₂ = U·R₂/(R₁+R₂) = 12·4/6 = **8 V**."},{"id":"L02-A-8","n":8,"text":"Ток 3 A се разделя между паралелни R₁ = 10 Ω и R₂ = 30 Ω. Колко е токът през R₁?","opts":["0,75 A","2,25 A","1,5 A","3 A"],"correct":1,"expl":"i₁ = i·R₂/(R₁+R₂) = 3·30/40 = **2,25 A**. 0,75 A е токът през R₂."},{"id":"L02-A-9","n":9,"text":"С какво се замества идеален източник на ЕДН при пасивиране на веригата?","opts":["с късо съединение","с прекъсване","с резистор R = e","с източник на ток"],"correct":0,"expl":"При пасивиране ЕДН → **късо съединение**, а източник на ток → прекъсване."},{"id":"L02-A-10","n":10,"text":"В контур при обхождане резистор R има ток i срещу посоката на обхождане. С какъв знак е R·i?","opts":["с плюс","винаги с плюс","с минус","не се записва"],"correct":2,"expl":"R·i е с „+“ само ако токът е по обхождането; иначе — **„−“**."}],"B":[{"id":"L02-B-1","n":1,"text":"Три резистора по 15 Ω са свързани паралелно. Колко е Rₑ?","opts":["45 Ω","7,5 Ω","5 Ω","15 Ω"],"correct":2,"expl":"За n еднакви паралелни резистора Rₑ = R/n = 15/3 = **5 Ω**."},{"id":"L02-B-2","n":2,"text":"Кое уравнение по I ЗК е вярно, ако във възела влизат i₁, i₃, i₅, а излизат i₂, i₄?","opts":["i₁ + i₃ + i₅ = i₂ + i₄","i₁ + i₂ + i₃ + i₄ + i₅ = 0","i₁ + i₃ = i₂ + i₄ + i₅","i₁ − i₃ + i₅ = i₂ − i₄"],"correct":0,"expl":"Сумата на влизащите = сумата на излизащите: **i₁ + i₃ + i₅ = i₂ + i₄**."},{"id":"L02-B-3","n":3,"text":"Коя величина е обща за последователно свързани резистори?","opts":["напрежението","токът","мощността","проводимостта"],"correct":1,"expl":"В един клон тече **един и същ ток**."},{"id":"L02-B-4","n":4,"text":"U = 220 V, R₁ = 10 Ω последователно на R₂ = 20 Ω ∥ R₃ = 30 Ω; i₁ = 10 A. Колко е токът през R₂?","opts":["11 A","4 A","10 A","6 A"],"correct":3,"expl":"U₂ = 220 − 10·10 = 120 V; i₂ = 120/20 = **6 A**. 11 A = 220/20 — без пада върху R₁."},{"id":"L02-B-5","n":5,"text":"Колко е Rₑ на паралелно свързани 10 Ω, 20 Ω и 20 Ω?","opts":["50 Ω","5 Ω","6,67 Ω","10 Ω"],"correct":1,"expl":"Gₑ = 0,1 + 0,05 + 0,05 = 0,2 S ⇒ Rₑ = **5 Ω**."},{"id":"L02-B-6","n":6,"text":"Какво е „възел“ на електрическа верига?","opts":["всяка точка, в която се свързват два елемента","затворен път, образуван от няколко клона","точка, където се свързват три или повече клона","участък от веригата с един и същ ток"],"correct":2,"expl":"Възелът свързва **≥ 3 клона**; участъкът с един ток е клон."},{"id":"L02-B-7","n":7,"text":"Еквивалентното съпротивление на паралелна група е винаги…","opts":["по-малко от най-малкото съпротивление","по-голямо от най-голямото съпротивление","равно на средното аритметично","равно на сумата на съпротивленията"],"correct":0,"expl":"Gₑ = ΣG е по-голямо от всяко G ⇒ Rₑ е **по-малко от най-малкото**."},{"id":"L02-B-8","n":8,"text":"R₁ = 20 Ω и R₂ = 30 Ω са свързани последователно. Колко е Rₑ?","opts":["12 Ω","10 Ω","600 Ω","50 Ω"],"correct":3,"expl":"Последователно: Rₑ = R₁ + R₂ = **50 Ω**."},{"id":"L02-B-9","n":9,"text":"С какво се замества идеален източник на ток при пасивиране на веригата?","opts":["с късо съединение","с прекъсване","с резистор 1 Ω","с източник на ЕДН"],"correct":1,"expl":"Източник на ток → **прекъсване** (токът му става 0)."},{"id":"L02-B-10","n":10,"text":"R₁ = 2 Ω е последователно на R₂ = 6 Ω ∥ R₃ = 3 Ω. Колко е Rₑ?","opts":["11 Ω","2 Ω","1,64 Ω","4 Ω"],"correct":3,"expl":"R₂₃ = 18/9 = 2 Ω; Rₑ = 2 + 2 = **4 Ω**."}],"C":[{"id":"L02-C-1","n":1,"text":"Какво гласи вторият закон на Кирхоф?","opts":["сумата на токовете във възел е нула","R = U/I за всеки резистор","Q = R·I²·t","сумата на напреженията в контур е нула"],"correct":3,"expl":"II ЗК: **Σ Uₖ = 0** по затворен контур (⇔ ΣR·i = Σe)."},{"id":"L02-C-2","n":2,"text":"Колко е Rₑ на 60 Ω и 30 Ω, свързани паралелно?","opts":["90 Ω","20 Ω","45 Ω","15 Ω"],"correct":1,"expl":"Rₑ = 60·30/90 = **20 Ω**."},{"id":"L02-C-3","n":3,"text":"Във възел влизат i₁ = 4 A и i₂ = 1 A, а излиза i₃ = 7 A. Какъв е четвъртият ток i₄?","opts":["2 A, излизащ","12 A, влизащ","2 A, влизащ","10 A, излизащ"],"correct":2,"expl":"Влизащи = излизащи: 4 + 1 + i₄ = 7 ⇒ **i₄ = 2 A влизащ**."},{"id":"L02-C-4","n":4,"text":"В контур при обхождане ЕДН e е със стрелка по посоката на обхождане. С какъв знак е e в Σe?","opts":["с плюс","с минус","зависи от тока","не се записва"],"correct":0,"expl":"e е с **„+“**, ако стрелката му е по обхождането."},{"id":"L02-C-5","n":5,"text":"Три съпротивления образуват триъгълник: R₂₄ = 65,3 Ω (2–3), R₃₆ = 269,6 Ω (2–4), R₅ = 106 Ω (3–4). По коя формула се намира R между възли (2) и (3)?","opts":["R₂₄(R₃₆ + R₅)/(R₂₄ + R₃₆ + R₅)","R₂₄ + R₃₆ + R₅","R₂₄·R₃₆/(R₂₄ + R₃₆)","R₅(R₂₄ + R₃₆)/(R₂₄ + R₃₆ + R₅)"],"correct":0,"expl":"Между (2)–(3): R₂₄ **успоредно на** (R₃₆ + R₅) ≈ 55,6 Ω."},{"id":"L02-C-6","n":6,"text":"Ток 4 A се разделя между паралелни R₁ = 4 Ω и R₂ = 12 Ω. Колко е токът през R₁?","opts":["1 A","2 A","4 A","3 A"],"correct":3,"expl":"i₁ = i·R₂/(R₁+R₂) = 4·12/16 = **3 A** — по-малкото R взима по-големия ток."},{"id":"L02-C-7","n":7,"text":"Какво е „клон“ на електрическа верига?","opts":["точка на свързване на три проводника","участък между два възела с един и същ ток","затворен път през няколко елемента","всеки отделен резистор"],"correct":1,"expl":"Клонът е участък между два възела, през който тече **един и същ ток**."},{"id":"L02-C-8","n":8,"text":"Под напрежение 12 V са последователно R₁ = 6 Ω и R₂ = 18 Ω. Колко е напрежението върху R₁?","opts":["9 V","4 V","3 V","6 V"],"correct":2,"expl":"U₁ = U·R₁/(R₁+R₂) = 12·6/24 = **3 V**."},{"id":"L02-C-9","n":9,"text":"Еквивалентното съпротивление на последователна група е винаги…","opts":["по-малко от най-малкото съпротивление","равно на произведението им","равно на средното геометрично","по-голямо от най-голямото съпротивление"],"correct":3,"expl":"Rₑ = ΣRₖ ⇒ **по-голямо от всяко** отделно съпротивление."},{"id":"L02-C-10","n":10,"text":"R₁ = 6 Ω и R₂ = 6 Ω са последователно, а групата е паралелно на R₃ = 12 Ω. Колко е Rₑ?","opts":["6 Ω","24 Ω","4 Ω","3 Ω"],"correct":0,"expl":"R₁₂ = 12 Ω; 12 ∥ 12 = **6 Ω**."}]}},{"num":3,"title":"Тема 3 — Метод с клоновите токове (законите на Кирхоф)","short":"Метод с клоновите токове (законите на Кирхоф)","summary":"### Идея на метода с клоновите токове\n**Метод със законите на Кирхоф (метод на клоновите токове)**: неизвестни са токовете на всички клонове (по един за клон). Съставя се **пълна система уравнения** по I и II закон на Кирхоф и се решава.\n- m — брой **възли**, n — брой **клонове**.\n- По **I ЗК**: **m − 1** уравнения (за всички възли без един — последното уравнение би било следствие от другите).\n- По **II ЗК**: **n − m + 1** уравнения — за **независимите контури**.\n- Общо: (m − 1) + (n − m + 1) = **n** уравнения = броя на неизвестните токове.\n- Пример: m = 2, n = 3 ⇒ 1 уравнение по I ЗК и 2 по II ЗК; m = 3, n = 5 ⇒ 2 + 3.\n- **Клон с източник на ток j**: токът му е известен (= j), но напрежението Uⱼ върху източника е неизвестно — то заема мястото на неизвестното. Удобно е контурите да се избират така, че Uⱼ да участва само в един от тях.\n\n### Стъпки при решаване (изпитна задача)\n1. **Опростяване („пасивиране“)**: резисторите без източници между два възела се заместват с еквивалентен (R₄₅ = R₄R₅/(R₄ + R₅), R₁₄₅ = R₁ + R₄₅…). Амперметрите се заместват с **късо**, волтметрите — с **прекъсване** („премахват се мислено“, показанията им се търсят накрая).\n2. Преброяват се m и n; определя се броят уравнения по I и II ЗК.\n3. Избират се **посоки на токовете** (обикновено вече са дадени на схемата; ако не — произволно, напр. по посоката на ЕДН) и **посоки на обхождане** на независимите контури.\n4. **Буквен запис на системата**: I ЗК за m − 1 възела; II ЗК във вида **Σ Rₖiₖ = Σ eₖ** — R·i с „+“, ако токът е по обхождането; e с „+“, ако стрелката му е по обхождането.\n5. Решаване (заместване или матрично). Отрицателен ток ⇒ реалната посока е обратна.\n6. **Баланс на мощностите** — проверка.\n7. **Показания на уредите**: амперметър = токът на клона му; волтметър — от II ЗК за контур, който минава през волтметъра (Uᵥ е неизвестното в уравнението).\n\n### Баланс на мощностите\n**Pген = Pконс**\n- **Pген = Σ eₖ·iₖ + Σ Uⱼₖ·jₖ** (мощности на източниците).\n  - Pₑ = e·i, ако токът е **по посоката** на ЕДН; Pₑ = e·(−i) = −e·i, ако е срещу нея.\n  - Pₑ > 0 — **генераторен режим** (източникът отдава енергия); Pₑ < 0 — **консуматорен режим** (източникът поглъща енергия, напр. зарежда се акумулатор).\n  - За токов източник: P = Uⱼ·j, като Uⱼ се взема в посоката, в която източникът „изтласква“ тока.\n- **Pконс = Σ Rₖ·iₖ²** — аритметична сума на мощностите в резисторите (винаги положителни).\n\n### Пример ① — един източник, три клона\nСхема: ляв клон — източник **e = 220 V** (стрелка нагоре) и **R₁ = 10 Ω**, ток i₁ надясно към горния възел; среден клон — **R₂ = 20 Ω**, ток i₂ надолу; десен клон — **R₃ = 30 Ω**, ток i₃ надолу. m = 2, n = 3 ⇒ 1 уравнение по I ЗК, 2 по II ЗК.\n- възел: i₁ − i₂ − i₃ = 0\n- I контур (e, R₁, R₂): R₁i₁ + R₂i₂ = e ⇒ 10i₁ + 20i₂ = 220\n- II контур (R₂, R₃): R₃i₃ − R₂i₂ = 0 ⇒ 30i₃ = 20i₂\n- Решение: **i₁ = 10 A, i₂ = 6 A, i₃ = 4 A** (същото като при еквивалентните преобразувания, Rₑ = 22 Ω).\n- Баланс: Pген = e·i₁ = 2200 W; Pконс = 10·100 + 20·36 + 30·16 = 1000 + 720 + 480 = **2200 W** ✓.\n\n### Пример ② — с източник на ток\nСхема: два възела a (горе) и b (долу), три клона: ляв — **e₁ = 10 V** (стрелка нагоре) и **R₁ = 20 Ω**, ток i₁ нагоре; среден — **източник на ток jₑ = 5 A** (насочен надолу, от a към b), напрежение Uⱼ със стрелка нагоре; десен — **R₂ = 15 Ω** и **e₂ = 20 V** (стрелка надолу), ток i₂ надолу. Неизвестни: i₁, i₂, Uⱼ.\n- възел a: i₁ − jₑ − i₂ = 0 ⇒ i₁ − i₂ = 5\n- I контур (външният, e₁–R₁–R₂–e₂): R₁i₁ + R₂i₂ = e₁ + e₂ ⇒ 20i₁ + 15i₂ = 30 (÷5: 4i₁ + 3i₂ = 6)\n- II контур (десен, с jₑ): R₂i₂ + Uⱼ = e₂ ⇒ 15i₂ + Uⱼ = 20\n- i₁ = 5 + i₂ ⇒ 20 + 7i₂ = 6 ⇒ **i₂ = −2 A**, **i₁ = 3 A**, **Uⱼ = 20 + 30 = 50 V**.\n- Баланс: Pген = e₁i₁ + e₂i₂ + Uⱼjₑ = 30 − 40 + 250 = **240 W**; Pконс = 20·9 + 15·4 = 180 + 60 = **240 W** ✓. Източникът e₂ работи в **консуматорен режим** (P = −40 W).\n- Ако последователно на jₑ има резистор R₃ = 10 Ω: токовете **не се променят** (токът на клона е наложен от jₑ), но се променя Uⱼ: R₁i₁ − Uⱼ + R₃jₑ = e₁ (контур през левия и средния клон) ⇒ Uⱼ = 60 + 50 − 10 = **100 V**.\n\n### Пример ③ — буквен запис, m = 3, n = 5\nСхема: възли c (горе вляво), a (горе вдясно), b (долу в средата). Клонове: R₁ от c към a (i₁); e₄ и R₄ от c към a (i₄, e₄ по i₄); R₅ от a надолу и e₅ по долния проводник към b (i₅ от a към b, стрелката на e₅ срещу i₅); R₃ от b нагоре към c (i₃); e₂ и R₂ от b наляво и нагоре към c (i₂, e₂ по i₂). 2 уравнения по I ЗК и 3 по II ЗК:\n- възел a: −i₁ − i₄ + i₅ = 0; възел b: i₂ + i₃ − i₅ = 0\n- I контур: R₂i₂ − R₃i₃ = e₂\n- II контур: R₃i₃ + R₄i₄ + R₅i₅ = e₄ − e₅\n- III контур: R₁i₁ − R₄i₄ = −e₄\n- Баланс: Pген = e₂i₂ + e₄i₄ − e₅i₅; Pконс = R₁i₁² + R₂i₂² + R₃i₃² + R₄i₄² + R₅i₅².\n- **Волтметър** между c и долния край на R₅: II ЗК за контура волтметър–e₄–R₄–R₅: −Uᵥ + R₅i₅ + R₄i₄ = e₄ ⇒ **Uᵥ = R₄i₄ + R₅i₅ − e₄**.\n\n### Изпитна задача (от упражненията) — система по Кирхоф\nДанни: R₁ = R₂ = R₃ = 10 Ω, R₄ = 20 Ω, R₅ = 30 Ω, e₁ = 20 V, e₂ = 60 V, e₃ = 40 V. Възли: (1) горе в средата, (2) долу.\n- Ляв клон: R₄ ∥ R₅, амперметър и R₁ към (1); e₁ (по долния проводник, насочен към левия клон); ток i₁ към (1). R₄₅ = 12 Ω, **R₁₄₅ = 22 Ω**.\n- Среден клон: e₂ (нагоре) и R₂, ток i₂ нагоре към (1).\n- Десен клон: R₃ (ток i₃ нагоре) и e₃ по горния проводник (стрелка от (1) надясно, т.е. срещу i₃); волтметър успоредно на R₃.\n- m = 2, n = 3: i₁ + i₂ + i₃ = 0; R₁₄₅i₁ − R₂i₂ = e₁ − e₂ (22i₁ − 10i₂ = −40); R₃i₃ − R₂i₂ = −e₃ − e₂ (10i₃ − 10i₂ = −100).\n- Решение: **i₁ = 10/27 ≈ 0,370 A, i₂ = 130/27 ≈ 4,815 A, i₃ = −140/27 ≈ −5,185 A**.\n- Баланс: Pген = e₁i₁ + e₂i₂ − e₃i₃ ≈ 7,41 + 288,89 + 207,41 = **503,7 W** = R₁₄₅i₁² + R₂i₂² + R₃i₃² ✓.\n- Уреди: амперметър **I_A = i₁ ≈ 0,370 A**; волтметър **U_V = R₃·|i₃| ≈ 51,85 V**.\n\n### Капани за изпита\n- Броят уравнения: I ЗК — **m − 1** (не m); II ЗК — **n − m + 1** (не n − m). Сборът е n.\n- Клон с източник на ток: неизвестното е Uⱼ, не токът; не пиши II ЗК по контур през jₑ, без да включиш Uⱼ.\n- Знаци: R·i по обхождането „+“; e по обхождането „+“. Ако сменяш посоката на обхождане, се сменят **всички** знаци в уравнението.\n- В баланса: e·i с „+“ само ако токът е по стрелката на e; Pконс е **аритметична** сума (i² > 0).\n- Отрицателен ток не се „поправя“ — замества се със знака си в баланса и при уредите.\n- Уредите се махат при решаването; показанието на волтметъра се взема от II ЗК **накрая**.\n- В записките за пример ① има ред „i₁ = U/R₁ = 220/10 = 22 A“ — грешно: i₁ = e/Rₑ = 10 A (R₂ ∥ R₃ също ограничават тока).\n- В записките за изпитната задача е получено i₃ = −204/55 A и U_V = −408/11 V — грешно (V₁ не е разделено на ΣG и има грешен знак); проверката i₁ + i₂ + i₃ = 0 веднага показва грешката.","testNames":["A","B","C"],"tests":{"A":[{"id":"L03-A-1","n":1,"text":"Колко уравнения по I ЗК се съставят за верига с m възела?","opts":["m","m − 1","m + 1","n − m + 1"],"correct":1,"expl":"По I ЗК — за всички възли без един: **m − 1**."},{"id":"L03-A-2","n":2,"text":"Верига има m = 3 възела и n = 5 клона. Колко уравнения по II ЗК са нужни?","opts":["2","5","4","3"],"correct":3,"expl":"n − m + 1 = 5 − 3 + 1 = **3** (плюс 2 по I ЗК)."},{"id":"L03-A-3","n":3,"text":"Как се пресмята консумираната мощност в баланса на мощностите?","opts":["Pконс = Σ Rₖ·iₖ²","Pконс = Σ eₖ·iₖ","Pконс = Σ Rₖ·iₖ","Pконс = Σ Gₖ·eₖ"],"correct":0,"expl":"Аритметична сума на мощностите в резисторите: **Σ R·i²**."},{"id":"L03-A-4","n":4,"text":"ЕДН e = 20 V има ток i = 2 A, насочен срещу стрелката на ЕДН. Каква е мощността му и режимът?","opts":["40 W, генераторен","−40 W, генераторен","−40 W, консуматорен","10 W, консуматорен"],"correct":2,"expl":"Pₑ = e·(−i) = **−40 W** < 0 ⇒ консуматорен режим."},{"id":"L03-A-5","n":5,"text":"e = 220 V и R₁ = 10 Ω в ляв клон; R₂ = 20 Ω и R₃ = 30 Ω в два паралелни клона. Колко е i₁?","opts":["22 A","4,4 A","10 A","11 A"],"correct":2,"expl":"Rₑ = 10 + 12 = 22 Ω ⇒ i₁ = 220/22 = **10 A**. 22 A е грешното e/R₁."},{"id":"L03-A-6","n":6,"text":"Какво е неизвестно в клон с идеален източник на ток j?","opts":["напрежението Uⱼ върху източника","токът на клона","проводимостта на клона","нищо — клонът се пропуска"],"correct":0,"expl":"Токът е известен (= j); неизвестно е **напрежението Uⱼ**."},{"id":"L03-A-7","n":7,"text":"Резистори 20 Ω (ток 3 A) и 15 Ω (ток −2 A) са единствените консуматори. Колко е Pконс?","opts":["150 W","120 W","90 W","240 W"],"correct":3,"expl":"Pконс = 20·9 + 15·4 = **240 W**. 120 W е при i² взето със знак (180 − 60)."},{"id":"L03-A-8","n":8,"text":"Колко общо уравнения дава методът с клоновите токове за n клона?","opts":["m","n","n − m + 1","m − 1"],"correct":1,"expl":"(m − 1) + (n − m + 1) = **n** — по едно за всеки неизвестен ток."},{"id":"L03-A-9","n":9,"text":"Как се отчитат идеален амперметър и волтметър при решаване на веригата?","opts":["махат се мислено, показанията — накрая","амперметърът — като прекъсване","волтметърът — като късо съединение","като резистори по 1 Ω"],"correct":0,"expl":"Уредите се **премахват мислено** (A = късо, V = прекъсване); показанията се намират след решението."},{"id":"L03-A-10","n":10,"text":"Какво означава отрицателен резултат за клонов ток?","opts":["има грешка при съставянето на системата","токът в този клон е равен на нула","реалната посока е обратна на избраната","източникът в клона е повреден или изключен"],"correct":2,"expl":"Знакът „−“ означава, че токът тече **обратно** на избраната посока."}],"B":[{"id":"L03-B-1","n":1,"text":"Колко уравнения по II ЗК са нужни при m = 2 възела и n = 3 клона?","opts":["1","3","2","4"],"correct":2,"expl":"n − m + 1 = 3 − 2 + 1 = **2**."},{"id":"L03-B-2","n":2,"text":"Кога ЕДН работи в генераторен режим?","opts":["когато Pₑ = e·i > 0","когато Pₑ = e·i < 0","когато i = 0","когато e < 0"],"correct":0,"expl":"Генераторен режим — **P > 0**: токът е по посоката на ЕДН."},{"id":"L03-B-3","n":3,"text":"e₁ = 10 V, R₁ = 20 Ω (i₁); jₑ = 5 A; R₂ = 15 Ω, e₂ = 20 V (i₂). Системата е i₁ − i₂ = 5, 20i₁ + 15i₂ = 30. Колко е i₂?","opts":["2 A","−2 A","3 A","−3 A"],"correct":1,"expl":"i₁ = 5 + i₂ ⇒ 100 + 35i₂ = 30 ⇒ **i₂ = −2 A**, i₁ = 3 A."},{"id":"L03-B-4","n":4,"text":"Как се записва генерираната мощност в баланса?","opts":["Pген = Σ Rₖ·iₖ²","Pген = Σ eₖ²/Rₖ","Pген = Σ eₖ + Σ jₖ","Pген = Σ eₖ·iₖ + Σ Uⱼₖ·jₖ"],"correct":3,"expl":"Мощности на източниците: **Σ e·i + Σ Uⱼ·j** (със знаци)."},{"id":"L03-B-5","n":5,"text":"В същата схема 15i₂ + Uⱼ = 20 и i₂ = −2 A. Колко е напрежението Uⱼ на токовия източник?","opts":["−10 V","50 V","10 V","30 V"],"correct":1,"expl":"Uⱼ = 20 − 15·(−2) = **50 V**. −10 V е при пропуснат знак на i₂."},{"id":"L03-B-6","n":6,"text":"e₁ = 10 V (i₁ = 3 A), e₂ = 20 V (i₂ = −2 A), Uⱼ = 50 V при jₑ = 5 A, всички по посоката на източниците. Колко е Pген?","opts":["320 W","280 W","240 W","200 W"],"correct":2,"expl":"Pген = 30 − 40 + 250 = **240 W**. 320 W — e₂ взет с +40."},{"id":"L03-B-7","n":7,"text":"Ако последователно на идеален източник на ток се включи резистор, как се променят клоновите токове?","opts":["не се променят, променя се само Uⱼ","всички токове намаляват","токът на източника намалява","токовете се удвояват"],"correct":0,"expl":"Токът на клона е наложен от j ⇒ токовете са същите; **Uⱼ се променя**."},{"id":"L03-B-8","n":8,"text":"Как се намира показанието на волтметър, включен между две точки на веригата?","opts":["по I ЗК за възела на волтметъра","като ток, умножен по R_V","винаги е равно на ЕДН","по II ЗК за контур през волтметъра"],"correct":3,"expl":"Пише се **II ЗК** за контур, съдържащ волтметъра; Uᵥ е неизвестното."},{"id":"L03-B-9","n":9,"text":"Верига има m = 4 възела и n = 6 клона. Колко уравнения по I и по II ЗК са нужни?","opts":["4 по I ЗК и 2 по II ЗК","3 по I ЗК и 3 по II ЗК","3 по I ЗК и 2 по II ЗК","4 по I ЗК и 3 по II ЗК"],"correct":1,"expl":"I ЗК: m − 1 = 3; II ЗК: n − m + 1 = **3**."},{"id":"L03-B-10","n":10,"text":"Защо по I ЗК не се пише уравнение за последния (m-ти) възел?","opts":["там токовете са нула","той е заземен и няма ток","така е по-лесно да се сметне","то е следствие от другите m − 1"],"correct":3,"expl":"Уравнението за m-тия възел е **линейна комбинация** на останалите."}],"C":[{"id":"L03-C-1","n":1,"text":"Колко уравнения по II ЗК се съставят за n клона и m възела?","opts":["n − m","m − 1","n + m − 1","n − m + 1"],"correct":3,"expl":"Броят независими контури е **n − m + 1**."},{"id":"L03-C-2","n":2,"text":"В баланса токът i = 3 A тече по посоката на ЕДН e = 10 V. Каква е мощността на източника?","opts":["−30 W, консуматорен режим","30 W, генераторен режим","3,3 W, генераторен режим","90 W, генераторен режим"],"correct":1,"expl":"Pₑ = e·i = **30 W** > 0 ⇒ генераторен режим."},{"id":"L03-C-3","n":3,"text":"Верига има m = 3 възела и n = 5 клона. Колко уравнения по I ЗК са нужни?","opts":["3","5","2","1"],"correct":2,"expl":"m − 1 = **2**."},{"id":"L03-C-4","n":4,"text":"За контур: R₁ с ток i₁ по обхождането, R₂ с ток i₂ срещу него, e по обхождането. Кое уравнение е вярно?","opts":["R₁i₁ − R₂i₂ = e","R₁i₁ + R₂i₂ = e","R₁i₁ − R₂i₂ = −e","−R₁i₁ + R₂i₂ = e"],"correct":0,"expl":"Токът по обхождането „+“, срещу — „−“; e по обхождането „+“."},{"id":"L03-C-5","n":5,"text":"Токове 10 A, 6 A и 4 A текат през 10 Ω, 20 Ω и 30 Ω. Колко е Pконс?","opts":["2200 W","340 W","1600 W","2000 W"],"correct":0,"expl":"Pконс = 1000 + 720 + 480 = **2200 W**. 340 W е ΣR·i без квадрат."},{"id":"L03-C-6","n":6,"text":"Какво се проверява с баланса на мощностите?","opts":["че Σ i = 0 във всеки възел","че всички токове са положителни","че Rₑ е минимално","че Pген = Pконс"],"correct":3,"expl":"Балансът проверява **Pген = Pконс** — контрол на решението."},{"id":"L03-C-7","n":7,"text":"Единствен източник e = 220 V дава ток 10 A по посоката си. Каква е генерираната мощност?","opts":["22 W","2200 W","2420 W","4840 W"],"correct":1,"expl":"Pген = e·i = 220·10 = **2200 W**."},{"id":"L03-C-8","n":8,"text":"Волтметър е включен в контур: −Uᵥ + R₅i₅ + R₄i₄ = e₄. Колко е Uᵥ?","opts":["Uᵥ = e₄ − R₄i₄ − R₅i₅","Uᵥ = R₄i₄ + R₅i₅ + e₄","Uᵥ = R₄i₄ + R₅i₅ − e₄","Uᵥ = e₄"],"correct":2,"expl":"Изразяваме: **Uᵥ = R₄i₄ + R₅i₅ − e₄**."},{"id":"L03-C-9","n":9,"text":"Системата е i₁ + i₂ + i₃ = 0, 22i₁ − 10i₂ = −40, 10i₃ − 10i₂ = −100. Колко е i₃ (приблизително)?","opts":["−3,71 A","5,19 A","−10 A","−5,19 A"],"correct":3,"expl":"Решението е i₁ ≈ 0,37 A, i₂ ≈ 4,81 A, **i₃ ≈ −5,19 A** (сума 0)."},{"id":"L03-C-10","n":10,"text":"Кога ЕДН работи в консуматорен режим?","opts":["когато токът е срещу стрелката на ЕДН","когато токът е по стрелката на ЕДН","когато токът е нула","когато ЕДН е без резистор"],"correct":0,"expl":"Токът срещу e ⇒ Pₑ = −e·i < 0 — **консуматорен режим**."}]}},{"num":4,"title":"Тема 4 — Метод на възловите потенциали, наслагване, Тевенен и Нортън","short":"Метод на възловите потенциали, наслагване, Тевенен и Нортън","summary":"### Метод на възловите потенциали (МВП) — стъпки\nНеизвестни са **потенциалите на възлите**; токовете се намират от тях накрая. Методът дава по-малко уравнения от метода с клоновите токове.\n1. **Брой уравнения: m − 1 − Nₑ**, където m — брой възли, Nₑ — брой клонове само с **идеален източник на ЕДН** (без резистор). При m = 2, Nₑ = 0 ⇒ **1 уравнение**.\n2. **Базисен възел** с потенциал **0** (заземяване): при Nₑ = 0 — възелът с най-много клонове; при Nₑ = 1 — единият извод на идеалния ЕДН (тогава потенциалът на другия му извод е известен = ±e).\n3. За всеки възел p с неизвестен потенциал:\n   **Gₚₚ·Vₚ − Σ Gₚₛ·Vₛ = Jₚ**, p ≠ s\n   - **Gₚₚ** — собствена възлова проводимост: сума от проводимостите на клоновете, свързани към възел p;\n   - **Gₚₛ** — взаимна възлова проводимост: сума от проводимостите на клоновете между възли p и s;\n   - **Jₚ** — възлов електродвижещ ток: **Jₚ = Σ jₖ + Σ Gₖ·eₖ** — с „**+**“, ако източникът (стрелката на e или j) е насочен **към** възел p, и с „**−**“, ако е насочен **навън** от p.\n   - Клон с **източник на ток** има проводимост **0** (резистор, последователен на j, **не влияе** — не влиза в Gₚₚ).\n4. Решаване на системата (матрично или заместване).\n5. **Токове на клоновете** от обобщения закон на Ом (II ЗК за клона): за клон от p към s с ЕДН e по посоката на тока i:\n   R·i + Vₛ − Vₚ = e ⇒ **i = (e + Vₚ − Vₛ)/R = (e + Vₚ − Vₛ)·G**. Ако e е срещу тока — с „−e“; клон без ЕДН: i = (Vₚ − Vₛ)/R.\n6. **Проверка** с I ЗК за възлите и с баланса на мощностите.\n\n### Пример ① — МВП с източник на ток (m = 2)\nСхема: възел 1 горе, възел 2 долу (**V₂ = 0**). Ляв клон — **e₁ = 10 V** (стрелка към възел 1) и **R₁ = 20 Ω**, ток i₁ нагоре; среден клон — **jₑ = 5 A** насочен надолу (навън от 1; в серия с него R₃ — не влияе); десен клон — **R₂ = 15 Ω** и **e₂ = 20 V** със стрелка надолу (навън от 1), ток i₂ надолу; амперметър в горния проводник към R₂.\n- Брой уравнения: m − 1 − Nₑ = 2 − 1 − 0 = **1**.\n- (1/R₁ + 1/R₂)·V₁ = −jₑ + e₁/R₁ − e₂/R₂ ⇒ (1/20 + 1/15)·V₁ = −5 + 0,5 − 1,333 ⇒ ×60: 7V₁ = −300 + 30 − 80 = −350 ⇒ **V₁ = −50 V**.\n- i₁ = (e₁ + V₂ − V₁)/R₁ = (10 + 50)/20 = **3 A**; i₂ = (e₂ + V₁ − V₂)/R₂ = (20 − 50)/15 = **−2 A**.\n- Проверка, възел 1: −i₁ + jₑ + i₂ = −3 + 5 − 2 = 0 ✓. Същият резултат като с клоновите токове.\n- Волтметър успоредно на клона e₁–R₁: Uᵥ + R₁i₁ = e₁ ⇒ **Uᵥ = 10 − 60 = −50 V** (= V₁ − V₂).\n- С R₃ = 10 Ω последователно на jₑ: R₁i₁ − Uⱼ + R₃jₑ = e₁ ⇒ Uⱼ = 100 V (токовете — без промяна).\n\n### Пример ② — МВП с два неизвестни потенциала (буквено)\nВъзли 1, 2 и базисен 3 (V₃ = 0), m = 3, n = 5, Nₑ = 0 ⇒ 2 уравнения. Клонове: e₁ + R₁ (към възел 1); R₂ (1–3); R₃ + e₃ (от 1 към 2, e₃ насочен към 2); R₄ (2–3); e₅ + R₅ (от 2 към 3, e₅ навън от 2).\n- (1/R₁ + 1/R₂ + 1/R₃)·V₁ − (1/R₃)·V₂ = e₁/R₁ − e₃/R₃\n- (1/R₃ + 1/R₄ + 1/R₅)·V₂ − (1/R₃)·V₁ = e₃/R₃ − e₅/R₅\n- i₁ = (e₁ + V₃ − V₁)/R₁, i₂ = (V₁ − V₃)/R₂, i₃ = (e₃ + V₁ − V₂)/R₃, i₄ = (V₃ − V₂)/R₄, i₅ = (e₅ + V₂ − V₃)/R₅.\n- Лабораторно: при измерени потенциали токът се смята по същия начин, напр. I = (12,11 − 7,25)/167 ≈ 0,0291 A = 29,1 mA.\n\n### Изпитни задачи по МВП (от упражненията, проверени)\n**Задача ①**: R₁ = 15, R₂ = 13, R₃ = 22, R₄ = 20, R₅ = 18 Ω; e₁ = 50, e₂ = 20, e₃ = 40 V. Възел 1 горе (V₁ = 0), възел 2 долу. Клон 1: R₁, e₁ (стрелка към 1), R₄ — ток I₁ надолу, волтметър на R₄; клон 2: амперметър, R₂, e₂ (стрелка към 2) — I₂ надолу; клон 3: R₃ ∥ R₅ и e₃ (стрелка към 1) — I₃ нагоре. Опростяване: R₁₄ = 35 Ω, R₃₅ = 9,9 Ω.\n- I ЗК: −I₁ − I₂ + I₃ = 0; II ЗК: R₂I₂ − R₁₄I₁ = e₁ + e₂; R₂I₂ + R₃₅I₃ = e₂ + e₃.\n- МВП: (1/R₃₅ + 1/R₂ + 1/R₁₄)·V₂ = −e₁/R₁₄ + e₂/R₂ − e₃/R₃₅ ⇒ **V₂ ≈ −19,03 V**.\n- I₁ = (V₁ − V₂ − e₁)/R₁₄ ≈ **−0,885 A**; I₂ = (e₂ + V₁ − V₂)/R₂ ≈ **3,003 A**; I₃ = (e₃ + V₂ − V₁)/R₃₅ ≈ **2,118 A**; през R₃ ≈ 0,953 A, през R₅ ≈ 1,165 A.\n- Баланс: −e₁I₁ + e₂I₂ + e₃I₃ ≈ **189,0 W** = R₁₄I₁² + R₂I₂² + R₃₅I₃² ✓. Уреди: I_A = I₂ ≈ 3,00 A; U_V = R₄·|I₁| ≈ 17,7 V.\n\n**Задача ②**: R₁ = R₂ = R₃ = 10 Ω, R₄ = 20 Ω, R₅ = 30 Ω, e₁ = 20 V, e₂ = 60 V, e₃ = 40 V; R₁₄₅ = 22 Ω (виж тема 3). V₂ = 0:\n(1/22 + 1/10 + 1/10)·V₁ = e₁/R₁₄₅ + e₂/R₂ − e₃/R₃ = 32/11 ⇒ **V₁ = 320/27 ≈ 11,85 V**; i₁ = (e₁ − V₁)/22 ≈ 0,370 A, i₂ = (e₂ − V₁)/10 ≈ 4,815 A, i₃ = (V₂ − V₁ − e₃)/10 ≈ −5,185 A.\n\n**Задача ③**: R₁ = 15, R₂ = 20, R₃ = 10, R₄ = 30, R₅ = 20 Ω; e₁ = 15 V, e₂ = 20 V. Възли 1 (вляво) и 2 (вдясно, V₂ = 0). Клон 1: R₁, амперметър, e₁ (стрелка към 2), ток i₁ от 1 към 2, волтметър на R₁; клон 2: R₂, e₂ (стрелка към 1), ток i₂ от 1 към 2; клон 3: R₃ и R₄ ∥ R₅, i₃ от 1 към 2. R₃₄₅ = 10 + 12 = **22 Ω**.\n- (1/15 + 1/20 + 1/22)·V₁ = −e₁/R₁ + e₂/R₂ = −1 + 1 = 0 ⇒ **V₁ = 0**.\n- i₁ = (e₁ + V₁ − V₂)/R₁ = **1 A**; i₂ = (V₁ − V₂ − e₂)/R₂ = **−1 A**; i₃ = (V₁ − V₂)/R₃₄₅ = **0**.\n- Баланс: e₁i₁ − e₂i₂ = 15 + 20 = 35 W = 15·1 + 20·1 ✓; I_A = 1 A, U_V = R₁i₁ = 15 V.\n\n### Метод на наслагването (суперпозиция)\n- В линейна верига всеки ток е **сума от частичните токове**, предизвикани от всеки източник поотделно: **i = Σ i⁽ᵏ⁾**.\n- За всяка частична схема останалите източници се **пасивират**: ЕДН → **късо съединение**, източник на ток → **прекъсване**; вътрешните съпротивления остават.\n- Пример (схемата от пример ①): **e₁ сам**: (R₁ + R₂)·i₁⁽ᵉ¹⁾ = e₁ ⇒ i₁⁽ᵉ¹⁾ = 10/35 ≈ 0,286 A; **e₂ сам**: i₁⁽ᵉ²⁾ = e₂/(R₁ + R₂) = 20/35 ≈ 0,571 A; **jₑ сам** (делител на ток): i₁⁽ʲ⁾ = jₑ·R₂/(R₁ + R₂) = 5·15/35 ≈ 2,143 A. Сума: **i₁ = 105/35 = 3 A** ✓.\n\n### Теорема на Тевенен (еквивалентен генератор на напрежение)\n- **Активен двуполюсник** (съдържа източници) спрямо изводите a–b може да се замести с **реален източник на ЕДН**: e = **U_ab0** (напрежението на **празен ход** между a и b, при откачен товар) и последователно съпротивление **Rₑ** (входното съпротивление на **пасивирания** двуполюсник откъм a–b).\n- Ток в товара R: **i = U_ab0/(Rₑ + R)**.\n- Стъпки: 1) махаме товара (клона с търсения ток) → намираме U_ab0 (II ЗК / МВП); 2) пасивираме източниците → Rₑ; 3) i = U_ab0/(Rₑ + R).\n- Пример: в схемата от пример ① търсим i₁ (товар R₁, e₁ остава в активната част). При откачен R₁ токът jₑ минава през R₂: U_ab0 − R₂jₑ = e₁ + e₂ ⇒ **U_ab0 = 10 + 20 + 15·5 = 105 V**; при пасивиране (e → късо, j → прекъсване) остава само R₂ ⇒ **Rₑ = R₂ = 15 Ω**; **i₁ = 105/(15 + 20) = 3 A** ✓.\n\n### Теорема на Нортън (еквивалентен генератор на ток)\n- Активният двуполюсник се замества с **източник на ток I_кс** (токът на **късо съединение** между a и b) успоредно с проводимост **Gₑ = 1/Rₑ**.\n- Напрежение на товар с проводимост G: **U = I_кс/(Gₑ + G)**, ток в товара i = G·U.\n- Връзка с Тевенен: I_кс = U_ab0/Rₑ. В примера: I_кс = 105/15 = 7 A; U = 7/(1/15 + 1/20) = 60 V; i₁ = 60/20 = 3 A ✓.\n\n### Капани за изпита\n- **Брой МВП уравнения = m − 1 − Nₑ**, не n − m + 1 (това е за контурите).\n- Знак в Jₚ: източник **към** възела „+“, **навън** „−“ — за e и за j. Изписвай знака на всеки член отделно.\n- Gₚₚ включва **всички** клонове към възела, но **не и** клона с токов източник (G = 0, дори да има резистор в серия с j).\n- Не забравяй да **разделиш** Jₚ на Gₚₚ: в записките за задача ② е записано V₁ = 32/11 (това е Jₚ, не V₁) — вярно е V₁ = 320/27 V.\n- Ток от потенциали: i = (e + Vₚ − Vₛ)/R — началото на стрелката на тока е p. Ако e е срещу тока, e е с „−“. В записките има грешни знаци: в задача ① I₃ = (−e₃ + V₂ − V₁)/R₃₅ (вярно: +e₃), в задача ② i₃ = −(e₃ − V₁ + V₂)/R₃ (вярно: (V₂ − V₁ − e₃)/R₃), в задача ③ e₁ е взет с „+“ в Jₚ и i₂ = (e₂ + V₂ + V₁)/R₂ (вярно: −e₁/R₁ и i₂ = (V₁ − V₂ − e₂)/R₂). Винаги проверявай Σi = 0 във възела.\n- В суперпозицията пасивирай правилно: ЕДН → късо, токов източник → прекъсване. Делителят на ток е i₁ = j·**R₂**/(R₁ + R₂) (в записките описка „R₁ + R₁“).\n- Мощностите **не се наслагват** — суперпозицията важи за токове и напрежения.\n- Тевенен: U_ab0 е при **откачен** товар; Rₑ — при **пасивирани** източници. Нортън: I_кс — при **дадени на късо** a–b.","testNames":["A","B","C"],"tests":{"A":[{"id":"L04-A-1","n":1,"text":"Колко уравнения дава МВП за верига с m възела и Nₑ клона само с идеален ЕДН?","opts":["m − 1","m − 1 − Nₑ","n − m + 1","m − Nₑ"],"correct":1,"expl":"МВП: **m − 1 − Nₑ** уравнения."},{"id":"L04-A-2","n":2,"text":"Два възела (V₂ = 0): e₁ = 10 V, R₁ = 20 Ω към възел 1; jₑ = 5 A навън от 1; e₂ = 20 V, R₂ = 15 Ω навън от 1. Колко е V₁?","opts":["−30 V","50 V","−3,5 V","−50 V"],"correct":3,"expl":"(1/20 + 1/15)V₁ = −5 + 0,5 − 1,333 ⇒ 7V₁ = −350 ⇒ **V₁ = −50 V**."},{"id":"L04-A-3","n":3,"text":"Какво е Gₚₚ в уравнението на МВП?","opts":["сума от проводимостите на клоновете към възел p","проводимост между възли p и s","сума от всички проводимости във веригата","проводимост на базисния възел"],"correct":0,"expl":"Gₚₚ — **собствена** възлова проводимост на възел p."},{"id":"L04-A-4","n":4,"text":"Клон от възел 2 към възел 1: R = 20 Ω, ЕДН e = 10 V по посоката на тока; V₁ = −50 V, V₂ = 0. Колко е токът?","opts":["−2 A","2 A","3 A","−3 A"],"correct":2,"expl":"i = (e + V₂ − V₁)/R = (10 + 50)/20 = **3 A**."},{"id":"L04-A-5","n":5,"text":"По Тевенен U_ab0 = 105 V, Rₑ = 15 Ω, товар R = 20 Ω. Какъв е токът в товара?","opts":["7 A","5,25 A","3 A","2 A"],"correct":2,"expl":"i = U_ab0/(Rₑ + R) = 105/35 = **3 A**. 7 A е U_ab0/Rₑ (ток на късо)."},{"id":"L04-A-6","n":6,"text":"С какво се заместват източниците при намиране на Rₑ по Тевенен?","opts":["ЕДН — с късо, източник на ток — с прекъсване","ЕДН — с прекъсване, източник на ток — с късо","и двата — с късо съединение","и двата — с прекъсване"],"correct":0,"expl":"Пасивиране: **e → късо**, **j → прекъсване**."},{"id":"L04-A-7","n":7,"text":"По наслагване: само e₁ = 10 V действа в контур от R₁ = 20 Ω и R₂ = 15 Ω (j — прекъснат). Колко е частичният ток?","opts":["0,5 A","≈ 0,667 A","≈ 0,143 A","≈ 0,286 A"],"correct":3,"expl":"i⁽ᵉ¹⁾ = e₁/(R₁ + R₂) = 10/35 ≈ **0,286 A**."},{"id":"L04-A-8","n":8,"text":"Как влиза ЕДН e на клон с проводимост G в Jₚ, ако стрелката му сочи навън от възел p?","opts":["с +G·e","с −G·e","с −e","не влиза"],"correct":1,"expl":"Насочен **навън** от p ⇒ **−G·e**."},{"id":"L04-A-9","n":9,"text":"Два възела (V₂ = 0); към възел 1: e = 20 V с R₁ = 10 Ω (към 1), R₂ = 10 Ω и R₃ = 5 Ω без ЕДН. Колко е V₁?","opts":["5 V","10 V","20 V","4 V"],"correct":0,"expl":"(0,1 + 0,1 + 0,2)V₁ = 20/10 = 2 ⇒ **V₁ = 5 V**."},{"id":"L04-A-10","n":10,"text":"Какво твърди принципът на наслагването?","opts":["мощността е сума от мощностите на всеки източник","сумата на токовете във възел е нула","токът е сума от частичните токове от всеки източник","всеки двуполюсник е източник на ток"],"correct":2,"expl":"**i = Σ i⁽ᵏ⁾** — за токове и напрежения (не за мощности)."}],"B":[{"id":"L04-B-1","n":1,"text":"Верига има m = 3 възела и няма клонове само с идеален ЕДН. Колко уравнения дава МВП?","opts":["3","1","2","4"],"correct":2,"expl":"m − 1 − Nₑ = 3 − 1 − 0 = **2**."},{"id":"L04-B-2","n":2,"text":"Какво е Jₚ в уравнението на МВП?","opts":["възлов електродвижещ ток Σ jₖ + Σ Gₖeₖ","ток на базисния възел","сума от всички клонови токове","ток на късо съединение"],"correct":0,"expl":"**Jₚ = Σ jₖ + Σ Gₖ·eₖ** (със знаци по посоката спрямо p)."},{"id":"L04-B-3","n":3,"text":"По Нортън I_кс = 7 A, Gₑ = 1/15 S; товар R = 20 Ω. Колко е напрежението на товара?","opts":["140 V","60 V","105 V","35 V"],"correct":1,"expl":"U = I_кс/(Gₑ + G) = 7/(1/15 + 1/20) = **60 V** (i = 3 A)."},{"id":"L04-B-4","n":4,"text":"Клон с източник на ток j е свързан към възел p. Как участва в Gₚₚ?","opts":["с 1/R на последователния резистор","с проводимост j","с 1/j","не участва (G = 0)"],"correct":3,"expl":"Клонът с идеален токов източник има **G = 0**; дори резистор в серия с j не влиза."},{"id":"L04-B-5","n":5,"text":"По наслагване: само jₑ = 5 A действа, R₁ = 20 Ω и R₂ = 15 Ω са паралелно на него. Колко е токът през R₁?","opts":["≈ 2,86 A","≈ 2,14 A","5 A","≈ 1,43 A"],"correct":1,"expl":"Делител на ток: i₁ = jₑ·R₂/(R₁ + R₂) = 75/35 ≈ **2,14 A**."},{"id":"L04-B-6","n":6,"text":"Кой възел се избира за базисен при Nₑ = 0?","opts":["възелът с най-малко клонове","винаги най-горният","възелът с най-много клонове","възелът с източник на ток"],"correct":2,"expl":"При Nₑ = 0 — възелът с **максимален брой клонове** (по-прости уравнения)."},{"id":"L04-B-7","n":7,"text":"Клон от възел 1 към възел 2: R₂ = 15 Ω, e₂ = 20 V по посоката на тока; V₁ = −50 V, V₂ = 0. Колко е токът?","opts":["−2 A","2 A","−4,67 A","4,67 A"],"correct":0,"expl":"i₂ = (e₂ + V₁ − V₂)/R₂ = (20 − 50)/15 = **−2 A**."},{"id":"L04-B-8","n":8,"text":"Какво е U_ab0 в теоремата на Тевенен?","opts":["напрежението при късо съединение a–b","сумата на всички ЕДН във веригата","падът върху товара","напрежението между a и b на празен ход"],"correct":3,"expl":"U_ab0 — напрежение на **празен ход** (товарът е откачен)."},{"id":"L04-B-9","n":9,"text":"(1/22 + 1/10 + 1/10)·V₁ = 20/22 + 6 − 4. Колко е V₁ (приблизително)?","opts":["2,91 V","11,85 V","0,25 V","8,00 V"],"correct":1,"expl":"Jₚ = 32/11 ≈ 2,91; Gₚₚ = 27/110 ⇒ **V₁ = 320/27 ≈ 11,85 V**. 2,91 е Jₚ без делене."},{"id":"L04-B-10","n":10,"text":"Активен двуполюсник има U_ab0 = 12 V и Rₑ = 4 Ω. Какъв ток ще тече в товар 2 Ω?","opts":["3 A","6 A","1 A","2 A"],"correct":3,"expl":"i = U_ab0/(Rₑ + R) = 12/6 = **2 A**."}],"C":[{"id":"L04-C-1","n":1,"text":"Как се записва уравнението на МВП за възел p?","opts":["Gₚₚ·Vₚ + Σ Gₚₛ·Vₛ = 0","Σ Rₖ·iₖ = Σ eₖ","Vₚ − Vₛ = R·i","Gₚₚ·Vₚ − Σ Gₚₛ·Vₛ = Jₚ"],"correct":3,"expl":"**Gₚₚ·Vₚ − Σ Gₚₛ·Vₛ = Jₚ**, p ≠ s."},{"id":"L04-C-2","n":2,"text":"При откачен R₁: U_ab0 − R₂·jₑ = e₁ + e₂, R₂ = 15 Ω, jₑ = 5 A, e₁ = 10 V, e₂ = 20 V. Колко е U_ab0?","opts":["45 V","105 V","30 V","−45 V"],"correct":1,"expl":"U_ab0 = e₁ + e₂ + R₂jₑ = 30 + 75 = **105 V**."},{"id":"L04-C-3","n":3,"text":"Два възела (V₂ = 0): e₁ = 15 V, R₁ = 15 Ω (навън от 1); e₂ = 20 V, R₂ = 20 Ω (към 1); R₃ = 22 Ω без ЕДН. Колко е V₁?","opts":["≈ 12,34 V","≈ −12,34 V","0 V","2 V"],"correct":2,"expl":"J₁ = −15/15 + 20/20 = 0 ⇒ **V₁ = 0**. 12,34 V е при грешен знак на e₁."},{"id":"L04-C-4","n":4,"text":"Какво е Gₚₛ в уравнението на МВП?","opts":["сума от проводимостите на клоновете между p и s","сума от проводимостите на всички клонове към възел p","вътрешната проводимост на източника на ток","реципрочната стойност на собствената проводимост Gₚₚ"],"correct":0,"expl":"Gₚₛ — **взаимна** възлова проводимост между p и s."},{"id":"L04-C-5","n":5,"text":"Кое е вярно за входното съпротивление Rₑ по Тевенен?","opts":["намира се при пасивирани източници","равно е на товарното съпротивление","намира се при късо a–b","равно е на U_ab0·I_кс"],"correct":0,"expl":"Rₑ — съпротивлението откъм a–b при **пасивирани** източници (= U_ab0/I_кс)."},{"id":"L04-C-6","n":6,"text":"Активен двуполюсник има U_ab0 = 24 V и I_кс = 8 A. Колко е Rₑ?","opts":["192 Ω","0,33 Ω","16 Ω","3 Ω"],"correct":3,"expl":"Rₑ = U_ab0/I_кс = 24/8 = **3 Ω**."},{"id":"L04-C-7","n":7,"text":"Как се пасивира източник на ток при метода на наслагването?","opts":["заменя се с късо съединение","заменя се с прекъсване","заменя се с резистор 1 Ω","остава непроменен"],"correct":1,"expl":"Източник на ток → **прекъсване**; ЕДН → късо."},{"id":"L04-C-8","n":8,"text":"Клон от p към s съдържа R и ЕДН e по посоката на тока i. Как се изразява i?","opts":["i = (e + Vₛ − Vₚ)/R","i = (Vₚ − Vₛ − e)/R","i = (e + Vₚ − Vₛ)/R","i = (e − Vₚ − Vₛ)/R"],"correct":2,"expl":"От R·i + Vₛ − Vₚ = e ⇒ **i = (e + Vₚ − Vₛ)/R**."},{"id":"L04-C-9","n":9,"text":"Частични токове в клон: 0,286 A (от e₁), 0,571 A (от e₂) и 2,143 A (от j), всички в една посока. Колко е токът?","opts":["2,43 A","1,00 A","2,14 A","3 A"],"correct":3,"expl":"Наслагване: i = 0,286 + 0,571 + 2,143 = **3 A**."},{"id":"L04-C-10","n":10,"text":"По Нортън I_кс = 2 A, Gₑ = 0,5 S, товар G = 0,5 S. Колко е напрежението на товара?","opts":["2 V","4 V","1 V","0,5 V"],"correct":0,"expl":"U = I_кс/(Gₑ + G) = 2/1 = **2 V**."}]}},{"num":5,"title":"Тема 5 — Синусоидален (променлив) ток","short":"Синусоидален (променлив) ток","summary":"### Какво е променлив (синусоидален) ток\n- **Променлив ток** — ток, който във всеки момент от времето има различна стойност (променя големината и посоката си). В електротехниката най-важен е **синусоидалният** ток — изменя се по закона на синуса.\n- Записи на моментните стойности:\n  - **i(t) = Iₘ·sin(ωt + ψᵢ)** — ток\n  - **u(t) = Uₘ·sin(ωt + ψᵤ)** — напрежение\n  - **e(t) = Eₘ·sin(ωt + ψₑ)** — ЕДН\n- Малките букви (i, u, e) са **моментни стойности**, главните с индекс ₘ (Iₘ, Uₘ, Eₘ) са **амплитуди**, главните без индекс (I, U, E) са **ефективни стойности**.\n\n### Основни параметри на синусоидалната величина\n\n| № | Величина | Означение | Единица | Формула / смисъл |\n|---|---|---|---|---|\n| II | **Моментна стойност** | i(t) | A | стойността на тока във всеки момент t |\n| III | **Амплитудна стойност** | Iₘ | A | максималната стойност на тока |\n| IV | **Период** | T | s | времето за едно пълно трептене |\n| V | **Честота** | f (ν) | Hz = 1/s | f = 1/T — брой периоди за 1 s |\n| VI | **Фаза** | θ(t) | rad | θ(t) = ωt + ψᵢ — аргументът на синуса |\n| VII | **Начална фаза** | ψᵢ | rad (или °) | ψᵢ = θ(0) — фазата при t = 0 |\n| VIII | **Фазова разлика** | φ | rad (или °) | φ = ψᵤ − ψᵢ |\n| IX | **Кръгова (ъглова) честота** | ω | rad/s | ω = 2π/T = 2πf |\n| X | **Средна стойност** (за ½ период) | I_ср | A | I_ср = (2/T)·∫₀^{T/2} i dt = 2Iₘ/π ≈ 0,637·Iₘ (в записките ≈ 0,64·Iₘ) |\n| XI | **Ефективна стойност** | I | A | I = Iₘ/√2 ≈ 0,707·Iₘ, т.е. Iₘ = √2·I |\n\n\n### Период, честота и кръгова честота\n- **T** и **f** са обратни величини: **f = 1/T**, **T = 1/f**.\n- **ω = 2πf = 2π/T** — за един период фазата нараства с 2π rad.\n- Промишлена мрежа в България: **f = 50 Hz → T = 0,02 s = 20 ms → ω = 2π·50 ≈ 314 rad/s**.\n- Обратно: от ω намираме **f = ω/(2π)**. Пример: ω = 1000 rad/s → f = 1000/(2π) ≈ **159,15 Hz**.\n- Внимание: ω се мери в **rad/s**, а f — в **Hz**. Те **не са** равни числено (разлика 2π ≈ 6,28 пъти).\n\n### Фаза, начална фаза и фазова разлика\n- **Фазата θ(t) = ωt + ψ** определя в коя точка от периода се намира величината в момента t.\n- **Началната фаза ψ** е фазата при t = 0. Положителна ψ → синусоидата е изместена **наляво** (започва „по-рано“); отрицателна → **надясно**.\n- **Фазова разлика φ = ψᵤ − ψᵢ** (винаги „напрежение минус ток“):\n  - **φ > 0** — напрежението **изпреварва** тока (индуктивен характер);\n  - **φ < 0** — токът изпреварва напрежението (капацитивен характер);\n  - **φ = 0** — величините са **във фаза (синфазни)**;\n  - **φ = ±90° (±π/2)** — **в квадратура**; **φ = 180° (π)** — **в противофаза**.\n- В RLC верига фазовата разлика се намира от параметрите: **φ = arctg((X_L − X_C)/R)** (подробно в тема 7).\n- Фазова разлика ↔ време: Δt = φ/ω, т.е. φ = 2π отговаря на T, φ = π/2 — на **T/4**.\n- Преобразуване: **rad = ° · π/180**, напр. 30° = π/6 ≈ 0,524 rad; 60° = π/3; 90° = π/2; 180° = π.\n\n### Средна и ефективна стойност\n- **Средна стойност за цял период** на синусоида = **0** (положителната и отрицателната полувълна се компенсират). Затова средната стойност се дефинира за **половин период**: **I_ср = 2Iₘ/π ≈ 0,637·Iₘ**.\n- **Ефективна (действаща) стойност** — стойността на такъв постоянен ток, който в същото съпротивление R за един период отделя **същото количество топлина**, както дадения променлив ток: I = √((1/T)·∫₀ᵀ i² dt).\n- За синусоида: **I = Iₘ/√2 ≈ 0,707·Iₘ**, **U = Uₘ/√2**, **E = Eₘ/√2**.\n- **Амперметрите и волтметрите** за променлив ток показват **ефективни** стойности. „Мрежа 230 V“ означава U = 230 V → **Uₘ = √2·230 ≈ 325 V**.\n- **Коефициент на амплитудата** k_a = Iₘ/I = √2 ≈ 1,41; **коефициент на формата** k_ф = I/I_ср = π/(2√2) ≈ 1,11.\n\n| Стойност | Връзка с Iₘ | При Iₘ = 10 A |\n|---|---|---|\n| Амплитудна Iₘ | Iₘ | 10 A |\n| Ефективна I | Iₘ/√2 ≈ 0,707·Iₘ | 7,07 A |\n| Средна (½ период) I_ср | 2Iₘ/π ≈ 0,637·Iₘ | 6,37 A |\n| Средна (цял период) | 0 | 0 A |\n\n\n### Изобразяване на синусоидални величини\n- **Времедиаграма** — графика на i(t) или u(t) по оста ωt (или t).\n- **Векторна диаграма** — всяка синусоида се изобразява с вектор с дължина Iₘ (или I), завъртян на ъгъл ψ спрямо оста; векторите се въртят **обратно на часовниковата стрелка** с ъглова скорост ω. Ъгълът между векторите на u и i е φ.\n- **Законите на Кирхоф важат за моментните стойности** (и за векторите/комплексите), но **не** за аритметичната сума на ефективните стойности. Пример от записките: в възел с 2 втичащи и 1 изтичащ ток **i₃(t) = i₁(t) + i₂(t)**, но в общия случай I₃ ≠ I₁ + I₂.\n\n### Решени примери (от записките, ЕТ/Лу/#9)\n**Пример 1.** Дадено: u(t) = 141·sin(1000t − 30°) V. Търси се U, f, ψᵤ.\n- Uₘ = 141 V → **U = Uₘ/√2 = 141/1,414 ≈ 99,7 ≈ 100 V**.\n- ω = 1000 rad/s = 2πf → **f = 1000/(2π) = 500/π ≈ 159,15 Hz**; T = 1/f ≈ 6,28 ms.\n- **ψᵤ = −30° = −π/6 rad**.\n- u(t) е моментна стойност, Uₘ — амплитуда, U — ефективна стойност.\n\n**Пример 2.** Дадено: Iₘ = 2 A, ω = 800 rad/s, ψᵢ = 10°. Да се запише i(t).\n- **i(t) = 2·sin(800t + 10°) A** (ефективна стойност I = 2/√2 ≈ 1,41 A; f = 800/(2π) ≈ 127,3 Hz).\n\n**Пример 3 (типичен).** Ефективна стойност I = 2 A, ψᵢ = 0, ω = 2000 rad/s → Iₘ = 2√2 ≈ 2,83 A и **i(t) = 2√2·sin(2000t) A**.\n\n### Капани за изпита\n- **Амплитуда ≠ ефективна стойност.** В i(t) = Iₘ·sin(…) пред синуса стои **амплитудата**. Ефективната е √2 пъти по-малка. Ако задачата дава ефективна стойност (показание на уред), за i(t) умножете по √2.\n- **ω ≠ f.** ω = 2πf. При 50 Hz ω ≈ 314 rad/s, а не 50 rad/s. f = ω/(2π), а не ω/π.\n- **Градуси и радиани.** В записа sin(ωt + ψ) ωt е в радиани, а ψ често се пише в градуси — при пресмятане (калкулатор!) не ги смесвайте. 30° = π/6 ≈ 0,524 rad, а не 0,3 rad.\n- **Знак на φ:** φ = ψᵤ − ψᵢ (напрежение минус ток). φ > 0 — напрежението изпреварва; φ < 0 — токът изпреварва.\n- **Средна стойност за цял период е 0**; „0,637·Iₘ“ е средната стойност за **половин** период.\n- В записките ефективната стойност е обозначена „Iₘ [A] → Iₘ = √2·I“ — означението на ефективната стойност е **I** (без индекс), а Iₘ е амплитудата.\n- Кирхоф с ефективни стойности: **не** събирайте аритметично ефективните токове/напрежения на клонове с различни фази.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L05-A-1","n":1,"text":"Синусоидален ток има амплитуда Iₘ = 10 A. Каква е ефективната му стойност?","opts":["7,07 A","14,14 A","6,37 A","5,00 A"],"correct":0,"expl":"I = Iₘ/√2 = 10/1,414 ≈ **7,07 A**. 6,37 A е средната стойност за ½ период."},{"id":"L05-A-2","n":2,"text":"Какво представлява Iₘ в записа i(t) = Iₘ·sin(ωt + ψᵢ)?","opts":["моментната стойност на тока","амплитудната (максималната) стойност","ефективната стойност на тока","средната стойност за полупериод"],"correct":1,"expl":"Iₘ е **амплитудата** — максималната стойност на тока."},{"id":"L05-A-3","n":3,"text":"Мрежовата честота е f = 50 Hz. Колко е периодът T?","opts":["2 ms","50 ms","20 ms","0,2 s"],"correct":2,"expl":"T = 1/f = 1/50 = 0,02 s = **20 ms**."},{"id":"L05-A-4","n":4,"text":"Каква е кръговата честота ω при f = 50 Hz?","opts":["50 rad/s","157 rad/s","100 rad/s","314 rad/s"],"correct":3,"expl":"ω = 2πf = 2·3,14·50 ≈ **314 rad/s**."},{"id":"L05-A-5","n":5,"text":"В каква единица се измерва кръговата честота ω?","opts":["Hz","rad","rad/s","s"],"correct":2,"expl":"ω = 2π/T се измерва в **rad/s**; f е в Hz."},{"id":"L05-A-6","n":6,"text":"Дадено е u(t) = 311·sin(314t + 60°) V. Колко е началната фаза в радиани?","opts":["π/6 rad","π/3 rad","π/2 rad","2π/3 rad"],"correct":1,"expl":"ψᵤ = 60° = 60·π/180 = **π/3 rad**."},{"id":"L05-A-7","n":7,"text":"Как се определя фазовата разлика φ между напрежение и ток?","opts":["φ = ψᵤ − ψᵢ","φ = ψᵢ − ψᵤ","φ = ωt + ψᵢ","φ = ψᵤ + ψᵢ"],"correct":0,"expl":"По дефиниция **φ = ψᵤ − ψᵢ** (напрежение минус ток)."},{"id":"L05-A-8","n":8,"text":"Синусоидален ток има Iₘ = 10 A. Колко е средната му стойност за половин период?","opts":["7,07 A","0 A","5,00 A","6,37 A"],"correct":3,"expl":"I_ср = 2Iₘ/π = 20/3,1416 ≈ **6,37 A** (≈ 0,637·Iₘ)."},{"id":"L05-A-9","n":9,"text":"За кои стойности на токовете в променливотокова верига законите на Кирхоф важат директно (алгебрично)?","opts":["за ефективните стойности","за амплитудните стойности","за моментните стойности","за средните стойности"],"correct":2,"expl":"Законите на Кирхоф важат за **моментните стойности**: i₃(t) = i₁(t) + i₂(t)."},{"id":"L05-A-10","n":10,"text":"Ако ψᵤ = 30° и ψᵢ = −20°, кое твърдение е вярно?","opts":["токът изпреварва напрежението с 50°","напрежението изпреварва тока с 10°","токът и напрежението са във фаза","напрежението изпреварва тока с 50°"],"correct":3,"expl":"φ = ψᵤ − ψᵢ = 30° − (−20°) = **50° > 0** → напрежението изпреварва.
