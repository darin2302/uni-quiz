house** система или **итеративен** процес — документът може да е много по-малко подробен.\n- **Agile (гъвкави) методи** — производството на такъв документ е **загуба на време**, понеже изискванията се променят бързо → документът винаги е **остарял**.\n\n### Проблеми при извличането на изисквания\n- Възложителите **не знаят какво искат** в действителност.\n- **Нереалистични очаквания**.\n- Възложителите изразяват изискванията в **тяхната терминология** — изпълнителите трябва да ги преведат.\n- Трябва да се **решат конфликтите**.\n- Изискванията имат **тенденция да се променят**.\n\n### Стандарт IEEE (IEEE/ANSI 830-1998)\n- **IEEE** (Институт на инженерите по електротехника и електроника) — **най-голямата професионална организация в света**; стандартът е **общ** и **не е идеален**; таблицата на Сомервил е **една, но не единствена** адаптация.\n- Глави: **Предговор (Preface)** — аудитория, история на версиите; **Въведение (Introduction)** — необходимост от системата, функции, връзка с бизнес целите; **Речник (Glossary)** — технически термини, без предположения за опита на читателя; **Спецификация на потребителски изисквания (User requirements definition)** — услуги + нефункционални, на разбираем език, стандарти за продукта и процеса; **Архитектура на системата (System architecture)** — високо ниво, разпределение на функциите по модули, маркират се повторно използваните компоненти; **Спецификация на системните изисквания (System requirements specification)** — функционални и нефункционални по-подробно, взаимодействия с други системи; **Модели на системата (System models)** — object models, data-flow models, семантични даннови модели; **Развитие на системата (System evolution) — опционална** — допускания и очаквани промени, полезна за проектантите; **Приложения (Appendices)** — хардуер (минимални и оптимални конфигурации) и база данни (логическа организация); **Индекс (Index)** — азбучен, на диаграмите, на функциите.\n- Съдържанието зависи от **вида софтуер** и **подхода**; при **еволюционен подход** много глави се изоставят.\n\n### Средства за специфициране\n- **Потребителски изисквания** — разбираеми за хора без технически познания: **естествен език, прости таблици, интуитивни диаграми**.\n- **Системни изисквания** — много по-детайлни описания на **външното поведение** и **ограниченията**; повече техническа терминология; могат да са **част от договора**.\n- Четири вида нотации: **естествен език** (номерирани изречения, всяко = едно изискване); **структуриран естествен език** (формуляри — form-based, таблици, псевдокод); **графични** (DFD, STD, ERD, CRC карти, UML; подходи Yourdon/De Marco, Gane-Sarson, SADT, UML); **математически (формални)** — базирани на **крайни автомати или множества**, недвусмислени, намаляват споровете клиент–разработчик, но клиентите често **не ги разбират** и не ги приемат като контракт.\n\n### Естествен език (Natural language specification)\n- Номерирани изречения; използва се, защото е **интуитивен, експресивен и универсален**.\n- Недостатъци: **липса на яснота (clarity)**; **смесване на изискванията (requirements confusion)**; **обединяване на изисквания (amalgamation)**.\n- Препоръки: всяко изискване — **едно изречение**; **обяснение защо** е необходимо; **„ще“ (shall)** за **задължителни**, **„би трябвало“ (should)** за **пожелателни**; **bold/underline** за ключовите части; **без компютърен жаргон**.\n- Пример **инсулинова помпа**: 3.2 измерва кръвната захар и доставя инсулин **на всеки 10 минути**; 3.6 **би трябвало** да се самотества **на всяка минута** (условия в таблица 1).\n\n### Структуриран естествен език (Structured specifications)\n- **Ограничава свободата** на писане — стандартен начин (формуляри или псевдокод). Предимство: запазва голяма част от **изразителността** на естествения език + налага **унифицираност**. Много подходящ за **вградени системи за управление**.\n- **Form-based**: **function** (функция/обект), **inputs** (входен поток и откъде идва), **outputs** (изходен поток и къде отива), **destination** (данни, нужни за изчисления, и други използвани обекти), **action** (действието), **pre and post conditions**, **side effects**.\n- **Псевдокод** = ограничен структуриран естествен език (английски) + конструкции на езиците от високо ниво (цикъл, разклонение). Спецификация на модул: **Module** (име), **Purpose** (предназначение), **Uses** (вход), **Returns** (изход), **Defines** (собствени данни), **Functional details**.\n- **Таблична спецификация (таблица на решенията, Tabular specification)** — **допълнение** към естествения и структурирания език; полезна при много алтернативни развития — **алтернатива на UML Activity Diagram**; съществуват много форми.\n  - Инсулинова помпа: захарта пада (r2 < r1), постоянна (r2 = r1) или се покачва със забавяне ((r2−r1) < (r1−r0)) → **CompDose = 0**; покачва се с постоянна/нарастваща скорост ((r2−r1) ≥ (r1−r0)) → **CompDose = round((r2−r1)/4)**, ако е 0 → **MinimumDose**.\n  - Вариант 2: над **двойната линия — условия**, под нея — **действия**; **всяка колона** = комбинация от условия → набор действия (такси $150, $100, $70, $50, $80, $60; първата колона: приоритетна + международна → **$150**).\n\n### Графични средства и структурен анализ (СА)\n- **Обектно-ориентирани** и **структурно-ориентирани** — описват **функциите**, **данните и отношенията между тях**, **поведението във времето**.\n- **3 групи средства на СА**: **DFD**, **ERD**, **STD**.\n- **DFD (Data Flow Diagrams)** — **основно средство за моделиране на функционалните изисквания**; мрежи от процеси, свързани с потоци от данни. Компоненти: **външна същност, процес, хранилище на данни, поток от данни, подсистеми**. Пример: процес „Явяване на изпит“ (Студент, Преподавател), декомпозиция 1.1 Теглене на билет, 1.2 Подготовка, 1.3 Отговор, 1.4 Поставяне на оценка. Препоръки: **от 3 до 6–7 процеса**, без несъществени детайли, декомпозиция на потоците **паралелно** с тази на процесите, явни имена.\n- **Речници на данните** — организирани списъци на структурата на всички даннови елементи; предимство: **управление на имената, без дублиране**; поддържат се от **CASE среди**. За всеки поток: **име, описание, тип, атрибути**.\n- **ERD** — моделиране и документиране на **данните** (подробно в друга дисциплина); в UML: **класове** = същности и атрибути, **асоциации** = отношения. Пример: семантичен модел на библиотека.\n- **STD (State Transition Diagrams)** — системата във всеки момент е в **точно едно от краен брой състояния**; преходите трябва да са точно определени. Елементи: **състояние, начално състояние, преход, условие**. **Точно едно начално** състояние (след инсталацията, преди реална работа) и **крайно число завършващи**. **Граф**: състояния = **възли** (правоъгълници или кръгове), преходи = **дъги**. Пример: врата **Opened/Closed**, стимули „close door“ / „open door“.\n\n### Методологии на структурния анализ\n- **Yourdon/De Marco**, **Gane-Sarson**, **Douglas Ross (SADT)**.\n- Yourdon/De Marco и Gane-Sarson използват: **DFD** (функции), **речници с данни**, **миниспецификации** (процеси на най-ниско ниво, база за **кодогенерация**), **ERD и STD**.\n- **Главна разлика**: при **Gane-Sarson** — **прецизно проектиране на БД (в трета нормална форма)**.\n- **SADT (Structure Analysis and Design Technique)** — разработена от **Douglas Ross**; собствена графична нотация + строги правила. Намалява скъпоструващите грешки чрез структуриране на знанията в ранните етапи, по-добро взаимодействие разработчици–възложители, изглаждане на прехода анализ → проектиране.\n  - **Блокове** (правоъгълници) = функции; **дъги** = връзки и тип на интерфейса: **управление — отгоре**, **вход — отляво**, **изход — отдясно**, **механизъм (човек/система) — отдолу**.\n  - Правила: **3–6 блока** на диаграма, свързаност (номериране), уникалност на имената.\n  - Резултат: **функционален модел** = йерархично свързани диаграми + фрагменти текст + **речник**.\n  - Постепенно въвеждане на детайлизация; **А0** е върховата диаграма; **А1** детайлизира блок 1 на А0, **А4** — блок 4 на А0; **А11** — блок 1 на А1.\n  - Блоковете се подреждат по **доминиране** (влияние върху другите): най-важният — **горе вляво**, най-маловажният — **долу вдясно** → **стъпаловидна (степенчата) схема**.\n\n### Средства за ниско ниво\n- **Структурни карти на Константин** — модел на **йерархичните отношения между програмните модули**. Модул: последователност от оператори, има **име**, може да приема/предава данни (параметри).\n- **Структурни карти на Джексън** — проектиране на **най-ниско ниво**, близки до блок-схемите. Блокове: **структурен** (един вход, един изход), **процедурен** (извикване на процедура), **библиотечен** (извикване на библиотечен модул). Връзки: **последователна, паралелна, условна, итерационна**.\n- **Блок-схеми (flowcharts)** — за проектиране и програмиране; показват **потока на управлението (control flow diagram, CFD)**; лесни за разбиране; ползват се и в ръководства за експлоатация. **Ориентиран граф**: оператор = **възел**, предаване на управлението = **дъга**.\n- **FLOW-форми** — също най-ниско ниво; всеки символ е **правоъгълник** (блок за обработка); един правоъгълник може да бъде **вписан в друг**.\n- **Диаграми на Наси-Шнайдерман** — **развитие на FLOW-формите**; при условен и case-избор **условието е в горния триъгълник**, вариантите — в долните, блоковете за обработка — под тях.\n\n### Обектно-ориентирани средства\n- **CRC-карти** = **Class, Responsibilities, Collaborators** (клас, отговорности, сътрудници) — основно за описание на **класове**. Съдържание: **име на клас, подкласове и суперкласове, отговорности, имена на свързаните класове, автор**. Отговорностите = действията (методи) на класа.\n- **UML** — език за **визуално моделиране** (предимно ОО системи). **UML 1.0 — 1997 г.**; контролиран от **Object Management Group (OMG)**; **ISO стандартизация за първи път — 2000**, последна — **2005 (ISO/IEC 19501:2005)**; най-нова версия от OMG — **UML 2.5 (март 2015)**.\n- **UML 2.0 — 13 официални типа диаграми**:\n  - **Структурни (6)**: класове, компоненти, обекти, композитна структура, разгръщане (deployment — хардуерни части), пакети (организация, пространства от имена).\n  - **Поведенчески**: активности (процедурна логика, бизнес процеси, работен поток), **случаи на използване (use case — „извличане“ и описание на изискванията)**, крайни автомати (state machine — реактивни системи).\n  - **Взаимодействие**: последователности (sequence — един случай на употреба), преглед на взаимодействието (interaction overview — sequence + activity), **комуникация (communication — нова в UML 2.0, от collaboration diagram)**, времеви (timing — разновидност на sequence, акцент върху **синхронизацията**).\n- **Пример ATM**: случаи на употреба „Теглене на наличност“ и „Справка за сметката“; и двата **включват** (отношение на **включване**) „Проверка на ПИН-кода“; **два актьора** — клиент и **банката**.\n- Use case диаграмите: формализация на функционалните изисквания, описание на поведението на различни нива, съгласуване с клиента на най-ранните етапи, комуникация, **основни артефакти на SRS**.\n- **Sequence диаграми** — последователност от събития за даден use case; **четат се отгоре надолу**.\n\n### Формални спецификации\n- Част от **Формалните методи**; техники за **точно (прецизно)** описание, основани на **математически средства**.\n- Основна област: **критични системи** (високи изисквания за сигурност) — там са **cost-effective**.\n- Предимство: **редуцират грешките** в изискванията (изискват детайлен анализ).\n- Недостатъци: **трудни** за изучаване; **увеличават разходите** (повече усилия в ранните етапи); **непонятни за клиенти**; **ограничен обхват**, неподходящи за големи системи.\n- Пример: **RSL (RAISE Specification Language)** — спецификация на **опашка (QUEUE)** с `empty`, `append`, `remove` (pre q ~= <..>); **RAISE = Rigorous Approach to Industrial Software Engineering**.\n\n### Капани за изпита\n- **Shall („ще“) = задължително**, **should („би трябвало“) = пожелателно**.\n- DFD: **3 до 6–7 процеса**; SADT: **3–6 блока** на диаграма.\n- SADT: управление **отгоре**, вход **отляво**, изход **отдясно**, механизъм **отдолу**.\n- **Gane-Sarson** (не Yourdon/De Marco) → БД в **трета нормална форма**.\n- **Наси-Шнайдерман** е развитие на **FLOW-формите** (не на картите на Джексън).\n- Класификация 1 = потребителски/системни; класификация 2 = функционални/нефункционални/по отношение на областта; нефункционалните = към продукта/организационни/външни.\n- SRS **не е** документ за проектиране; разработва се от **изпълнителя**.\n- **System evolution** е единствената **опционална** глава.\n- Несъответствия в слайдовете: навсякъде „**Sommeville**“ вместо **Sommerville**; слайдът „Популярни са **2** методологии“ изброява **3** (Yourdon/De Marco, Gane-Sarson, SADT); заглавие „Типове диаграми в **UML2.0**“, а най-новата версия е 2.5; договорът е наречен „**неформален**“; „софуера“ — правописна грешка.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L04-A-1", "n": 1, "text": "Как още се нарича спецификацията на софтуерните изисквания (SRS)?", "opts": ["Документ за проектиране на софтуера", "Техническо задание", "План за тестване на софтуера", "Бизнес модел на организацията"], "correct": 1, "expl": "SRS = документ на изискванията = техническо (технико-икономическо) задание"}, {"id": "L04-A-2", "n": 2, "text": "Чия е дефиницията: „Изискванията са описания на услугите, които клиентът изисква от системата, и на ограниченията, при които тя работи“?", "opts": ["Sommerville", "Douglas Ross", "Константин", "Джексън"], "correct": 0, "expl": "Дефиниция 2 е на Sommerville"}, {"id": "L04-A-3", "n": 3, "text": "Кои два вида изисквания разграничава Sommerville в класификация 1?", "opts": ["Функционални и нефункционални", "Задължителни и препоръчителни", "Изисквания към продукта и организационни изисквания", "Потребителски и системни изисквания"], "correct": 3, "expl": "Класификация 1: потребителски и системни изисквания"}, {"id": "L04-A-4", "n": 4, "text": "На какъв въпрос отговарят функционалните изисквания?", "opts": ["Колко ще струва системата", "Как да се проектира архитектурата", "Какво трябва да прави системата", "Кога ще бъде доставена системата"], "correct": 2, "expl": "Функционалните отговарят на „какво трябва да прави системата“"}, {"id": "L04-A-5", "n": 5, "text": "Кое от изброените **НЕ** е вид нефункционално изискване според лекцията?", "opts": ["Изисквания към продукта", "Изисквания по отношение на областта", "Организационни изисквания", "Външни изисквания"], "correct": 1, "expl": "Изискванията по отношение на областта са отделен вид в класификация 2"}, {"id": "L04-A-6", "n": 6, "text": "От кого по правило се разработва SRS?", "opts": ["От изпълнителя, желателно с участието на възложителя", "Само от възложителя", "От крайните потребители", "От независим одитор"], "correct": 0, "expl": "По правило от изпълнителя, желателно с участие на възложителя"}, {"id": "L04-A-7", "n": 7, "text": "Коя дума се препоръчва при естествен език за **задължителни** изисквания?", "opts": ["„би трябвало“ (should)", "„може“ (may)", "„би могло“ (could)", "„ще“ (shall)"], "correct": 3, "expl": "„Ще“ (shall) за задължителни, „би трябвало“ (should) за пожелателни"}, {"id": "L04-A-8", "n": 8, "text": "Кое от изброените **НЕ** е компонент на DFD?", "opts": ["Външна същност", "Процес", "Начално състояние", "Хранилище на данни"], "correct": 2, "expl": "Началното състояние е елемент на STD"}, {"id": "L04-A-9", "n": 9, "text": "От коя страна на SADT блока постъпва управляващата информация?", "opts": ["Отгоре", "Отляво", "Отдясно", "Отдолу"], "correct": 0, "expl": "Управление отгоре, вход отляво, изход отдясно, механизъм отдолу"}, {"id": "L04-A-10", "n": 10, "text": "Какво означава съкращението CRC в CRC-картите?", "opts": ["Code, Review, Control", "Class, Requirements, Constraints", "Component, Relation, Context", "Class, Responsibilities, Collaborators"], "correct": 3, "expl": "Class, Responsibilities, Collaborators"}], "B": [{"id": "L04-B-1", "n": 1, "text": "Кое твърдение за SRS **НЕ** е вярно според лекцията?", "opts": ["SRS е официално описание на изискванията към софтуера", "SRS се нарича още документ на изискванията към софтуера", "SRS е документ за проектиране", "SRS се нарича още техническо задание"], "correct": 2, "expl": "SRS не е документ за проектиране"}, {"id": "L04-B-2", "n": 2, "text": "В какво се състои двойствеността на понятието „спецификация“?", "opts": ["Спецификация е както описанието, така и процесът на описване на изискванията", "Спецификацията е едновременно потребителска и системна", "Спецификацията е едновременно функционална и нефункционална", "Спецификацията е едновременно задължителна и препоръчителна"], "correct": 0, "expl": "Спецификация = описанието и = процесът на описване"}, {"id": "L04-B-3", "n": 3, "text": "Според двойствеността на изискванията те могат да бъдат основа за:", "opts": ["Проектиране и кодиране", "Тестване и внедряване", "Оферта за договор и самия договор", "Обучение и поддръжка"], "correct": 2, "expl": "Основа за оферта за договор и за самия договор"}, {"id": "L04-B-4", "n": 4, "text": "Според системните изисквания на MHC-PMS след колко часа последния работен ден на месеца се генерира автоматично отчетът?", "opts": ["12.00", "17.30", "18.00", "9.00"], "correct": 1, "expl": "Отчетът се генерира автоматично след 17.30"}, {"id": "L04-B-5", "n": 5, "text": "Как трябва да бъде еднозначно идентифициран всеки член на персонала в примера MHC-PMS?", "opts": ["Чрез 6-цифрен номер", "Чрез 10-цифрен номер", "Чрез потребителско име и парола", "Чрез 8-цифрен номер"], "correct": 3, "expl": "8-цифрен номер за идентификация на служител"}, {"id": "L04-B-6", "n": 6, "text": "Кое **НЕ** е причина формалните методи да не са широко използвани?", "opts": ["Трудни са за изучаване и прилагане", "Увеличават разходите за разработка", "Редуцират грешките при описание на изискванията", "Непонятни са за клиентите"], "correct": 2, "expl": "Редуцирането на грешките е предимство, не недостатък"}, {"id": "L04-B-7", "n": 7, "text": "Колко процеса се препоръчва да се разполагат на една DFD?", "opts": ["1 до 2", "Точно 10", "Колкото повече, толкова по-добре", "От 3 до 6–7"], "correct": 3, "expl": "Препоръка: от 3 до 6–7 процеса"}, {"id": "L04-B-8", "n": 8, "text": "Коя е главната отличителна черта на методологията на Gane-Sarson спрямо тази на Yourdon/De Marco?", "opts": ["Прецизно проектиране на БД (в трета нормална форма)", "Не използва DFD", "Използва UML диаграми", "Има собствена нотация с блокове и интерфейсни дъги"], "correct": 0, "expl": "При Gane-Sarson БД е в трета нормална форма"}, {"id": "L04-B-9", "n": 9, "text": "Колко официални типа диаграми има в UML 2.0?", "opts": ["9", "13", "14", "7"], "correct": 1, "expl": "UML 2.0 има 13 официални типа диаграми"}, {"id": "L04-B-10", "n": 10, "text": "Коя е основната област на приложение на формалните спецификации?", "opts": ["Уеб сайтове", "Компютърни игри", "Офис приложения", "Критични системи с високи изисквания за сигурност"], "correct": 3, "expl": "Критични системи, където са cost-effective"}], "C": [{"id": "L04-C-1", "n": 1, "text": "Кой стандарт за описание на изискванията е разгледан в лекцията?", "opts": ["ISO/IEC 19501:2005", "IEEE/ANSI 830-1998", "ISO 9001", "IEEE 1471-2000"], "correct": 1, "expl": "IEEE/ANSI 830-1998; ISO/IEC 19501:2005 е стандартът за UML"}, {"id": "L04-C-2", "n": 2, "text": "Коя глава от структурата на SRS (адаптация на IEEE по Сомервил) е **опционална**?", "opts": ["Речник (Glossary)", "Въведение (Introduction)", "Индекс (Index)", "Развитие на системата (System evolution)"], "correct": 3, "expl": "System evolution е отбелязана като опционална"}, {"id": "L04-C-3", "n": 3, "text": "В коя глава на SRS се определят техническите термини, използвани в документа?", "opts": ["Речник (Glossary)", "Предговор (Preface)", "Приложения (Appendices)", "Индекс (Index)"], "correct": 0, "expl": "Glossary дефинира техническите термини"}, {"id": "L04-C-4", "n": 4, "text": "Какво е отношението на много гъвкави (agile) методи към документа на изискванията?", "opts": ["Той трябва да бъде максимално подробен", "Производството му е загуба на време, тъй като изискванията се променят бързо", "Той трябва да се пише само на формален език", "Той замества договора за разработка"], "correct": 1, "expl": "Agile го смятат за загуба на време, защото винаги е остарял"}, {"id": "L04-C-5", "n": 5, "text": "Как е свързан случаят на употреба „Проверка на ПИН-кода“ с „Теглене на наличност“ и „Справка за сметката“ в примера с ATM?", "opts": ["Чрез обобщение (наследяване)", "Чрез разширение (extend)", "Чрез отношение на включване", "Не е свързан с тях"], "correct": 2, "expl": "Отделен вариант на използване, свързан чрез включване"}, {"id": "L04-C-6", "n": 6, "text": "Кое **НЕ** е недостатък на специфицирането чрез естествен език?", "opts": ["Липса на универсалност", "Липса на яснота (clarity)", "Смесване на изискванията (requirements confusion)", "Обединяване на изисквания"], "correct": 0, "expl": "Естественият език е описан като универсален"}, {"id": "L04-C-7", "n": 7, "text": "Кое поле в спецификацията на модул чрез псевдокод описва **изхода**?", "opts": ["Uses", "Defines", "Returns", "Purpose"], "correct": 2, "expl": "Returns е изходът, Uses е входът"}, {"id": "L04-C-8", "n": 8, "text": "В табличната спецификация (вариант 2) каква е таксата при приоритетна и международна поръчка (първата колона)?", "opts": ["$100", "$70", "$80", "$150"], "correct": 3, "expl": "Приоритетна и международна поръчка → $150"}, {"id": "L04-C-9", "n": 9, "text": "Колко начални състояния има една STD?", "opts": ["Точно едно", "Поне две", "Произволен брой", "Нито едно"], "correct": 0, "expl": "Точно едно начално и крайно число завършващи състояния"}, {"id": "L04-C-10", "n": 10, "text": "Коя UML диаграма е нова в UML 2.0 и произлиза от диаграмата на сътрудничество (collaboration diagram)?", "opts": ["Времева диаграма (timing diagram)", "Диаграма на комуникацията (communication diagram)", "Диаграма на преглед на взаимодействието (interaction overview)", "Диаграма на последователностите (sequence diagram)"], "correct": 1, "expl": "Communication diagram е модифицирана collaboration диаграма"}], "D": [{"id": "L04-D-1", "n": 1, "text": "За кого са предназначени частите, които включва SRS?", "opts": ["Само за ръководството на фирмата", "Само за тестерите", "За потребителите на системата и за изпълнителите", "Само за юристите на възложителя"], "correct": 2, "expl": "Част за потребителите на системата и част за изпълнителите"}, {"id": "L04-D-2", "n": 2, "text": "Кое **НЕ** е вид изискване според класификация 2?", "opts": ["Функционални", "Нефункционални", "Изисквания по отношение на областта", "Системни"], "correct": 3, "expl": "Системните изисквания са от класификация 1"}, {"id": "L04-D-3", "n": 3, "text": "Какъв е договорът за разработване на софтуер според лекцията?", "opts": ["Едностранен и безвъзмезден", "Двустранен, възмезден и неформален, в 2 екземпляра", "Тристранен, с участието на държавата", "Устен, без писмена форма"], "correct": 1, "expl": "Двустранен, възмезден, неформален, по един екземпляр за всяка страна"}, {"id": "L04-D-4", "n": 4, "text": "Къде се описват изискванията при много сложни и критични системи?", "opts": ["Като раздел от самия договор", "Не се описват, решават се по време на разработката", "В отделен документ, максимално подробни и точни", "Само в устна договореност"], "correct": 2, "expl": "Отделен документ, максимално подробни и точни"}, {"id": "L04-D-5", "n": 5, "text": "Кое **НЕ** е проблем при извличането на изисквания според лекцията?", "opts": ["Възложителите не знаят какво искат в действителност", "Нереалистични очаквания", "Изискванията имат тенденция да се променят", "Изпълнителите не могат да използват UML"], "correct": 3, "expl": "UML не е посочен като проблем при извличането"}, {"id": "L04-D-6", "n": 6, "text": "Какво описва полето **Destination** в спецификацията, базирана на формуляри?", "opts": ["Информация за данните, необходими за изчисления, и други използвани обекти", "Изходния поток и къде отива", "Действието, което трябва да бъде предприето", "Страничните ефекти"], "correct": 0, "expl": "Outputs е изходният поток, Action е действието"}, {"id": "L04-D-7", "n": 7, "text": "В табличната спецификация на инсулиновата помпа каква е дозата, когато нивото на захарта се покачва и скоростта е постоянна или се увеличава?", "opts": ["CompDose = 0", "Винаги CompDose = MinimumDose", "CompDose = round((r2 − r1)/4)", "CompDose = r2 − r1"], "correct": 2, "expl": "round((r2 − r1)/4), а ако е 0, то MinimumDose"}, {"id": "L04-D-8", "n": 8, "text": "Кои са трите групи средства на структурния анализ (СА)?", "opts": ["DFD, ERD, STD", "UML, CRC, SADT", "Блок-схеми, FLOW-форми, Наси-Шнайдерман", "Псевдокод, таблици, формуляри"], "correct": 0, "expl": "DFD, ERD и STD"}, {"id": "L04-D-9", "n": 9, "text": "Коя диаграма в SADT е А11?", "opts": ["Диаграма, детайлизираща блок 11 на А0", "Диаграма, детайлизираща блок 1 от диаграма А1", "Върховата диаграма на модела", "Диаграма, детайлизираща блок 1 на А0"], "correct": 1, "expl": "А11 детайлизира блок 1 от диаграма А1"}, {"id": "L04-D-10", "n": 10, "text": "На какво са развитие диаграмите на Наси-Шнайдерман?", "opts": ["На структурните карти на Джексън", "На DFD", "На структурните карти на Константин", "На FLOW-формите"], "correct": 3, "expl": "Наси-Шнайдерман е развитие на FLOW-формите"}], "E": [{"id": "L04-E-1", "n": 1, "text": "Какви средства се използват за специфициране на потребителските изисквания?", "opts": ["Естествен език, прости таблици и интуитивни диаграми", "Формални математически спецификации", "Псевдокод", "Езикът RSL"], "correct": 0, "expl": "Разбираеми за хора без технически познания"}, {"id": "L04-E-2", "n": 2, "text": "Какво представлява блок-схемата (flowchart)?", "opts": ["Неориентиран граф на данните", "Ориентиран граф, който указва реда на изпълнение на операторите в програмата", "Таблица на решенията", "Модел на йерархичните отношения между модулите"], "correct": 1, "expl": "Оператор = възел, предаване на управлението = дъга"}, {"id": "L04-E-3", "n": 3, "text": "На какво са базирани математическите (формални) нотации за специфициране?", "opts": ["На случаи на използване", "На диаграми на потоците от данни", "На математически понятия като крайни автомати или множества", "На CRC-карти"], "correct": 2, "expl": "Крайни автомати или множества"}, {"id": "L04-E-4", "n": 4, "text": "Кое **НЕ** се съхранява в речника на данните за всеки поток данни?", "opts": ["Име на потока", "Описание", "Тип", "Автор на потока"], "correct": 3, "expl": "Съхраняват се име, описание, тип и атрибути"}, {"id": "L04-E-5", "n": 5, "text": "Кой е разработил методологията SADT?", "opts": ["Douglas Ross", "Yourdon", "De Marco", "Константин"], "correct": 0, "expl": "SADT е разработена от Douglas Ross"}, {"id": "L04-E-6", "n": 6, "text": "Колко блока по правило се разполагат в една SADT диаграма?", "opts": ["1–2", "7–10", "3–6", "Неограничен брой"], "correct": 2, "expl": "По правило 3–6 блока в една диаграма"}, {"id": "L04-E-7", "n": 7, "text": "Какво моделират структурните карти на Константин?", "opts": ["Потока на управлението в програмата", "Йерархичните отношения между програмните модули", "Състоянията на системата във времето", "Данните и отношенията между тях"], "correct": 1, "expl": "Модел на йерархичните отношения между програмните модули"}, {"id": "L04-E-8", "n": 8, "text": "Кое **НЕ** е тип връзка между блоковете в структурните карти на Джексън?", "opts": ["Последователна", "Паралелна", "Итерационна", "Рекурсивна"], "correct": 3, "expl": "Връзките са последователна, паралелна, условна, итерационна"}, {"id": "L04-E-9", "n": 9, "text": "Коя UML диаграма е предназначена за „извличане“ и описание на изискванията от потребителите, възложителя и експертите?", "opts": ["Диаграма на случаите на използване (use case)", "Диаграма на разгръщане (deployment)", "Диаграма на пакетите (package)", "Времева диаграма (timing)"], "correct": 0, "expl": "Use case диаграмите извличат и описват изискванията"}, {"id": "L04-E-10", "n": 10, "text": "Какво означава съкращението RAISE в езика RSL?", "opts": ["Rapid Application and Integrated Software Engineering", "Requirements Analysis In Software Engineering", "Rigorous Approach to Industrial Software Engineering", "Reliable Architecture for Integrated System Environments"], "correct": 2, "expl": "Rigorous Approach to Industrial Software Engineering"}]}}, {"num": 5, "title": "Тема 5 — Настройване и тестване на ПО", "short": "Настройване и тестване на ПО", "summary": "### Място в софтуерния процес\n- Процесът на създаване на софтуер = **основни** + **допълнителни („фонови“) дейности**: **настройване и тестване**, управление на проекта, осигуряване на качеството, измерване, документиране, управление на софтуерните конфигурации.\n- Настройването и тестването са **допълнителни, следователно „фонови“** дейности, насочени към **откриване и отстраняване на грешки**. Откриването на грешки е част от цялостното **осигуряване на качеството**.\n\n### Основни понятия\n- **Качество** — абстрактно понятие; качествен е продуктът, който **удовлетворява формулираните към него изисквания**.\n- **Дефект** — **всяко отклонение от изискванията**; дефектите се дължат на грешки.\n- **Грешка** — Деф. 1: **неправилност, отклонение или неволно преиначаване** на обект или процес. Деф. 2 (**Майерс**): „В програмата има грешки, ако тя **не изпълнява това, което потребителят разумно очаква от нея**“.\n\n### Видове грешки (5 класификации)\n- **Класификация 1** (кога в ЖЦ се откриват): грешки **в проекта, в документацията, в тестовите данни, в програмата** (фокусът е върху грешките в програмата).\n- **Класификация 2**: **първични** — неправилности в **текста на програмите**; **вторични** — **изкривявания на получените резултати**.\n- **Класификация 3**: грешки в програмата — **системни, технологични, програмни, алгоритмични**.\n- **Класификация 4**:\n  - **при дефинирането на задачите** — лошо описание → правилна програма, която решава **погрешна задача**;\n  - **в решението на задачите (логически)** — неправилно алгоритмично решение;\n  - **общи грешки (при кодирането)** — задачата и алгоритъмът са правилни, грешката е в кодирането:\n    - **синтактични (compile errors)** — разпознават се от компилатора;\n    - **предупредителни (warnings)** — напр. **неинициализирани или неизползвани данни**; програмистът сам решава дали да ги игнорира;\n    - **при изпълнение (runtime errors, бъгове)** — **аритметични, логически, ресурсни**; по време на проявление: **постоянни, понякога, само на машината на клиента**;\n  - **при въвеждане на програмите** — невнимателно и двусмислено изписване на символи;\n  - **при извеждане на резултатите** — неправилен формат; недостатъчен брой позиции вдясно от десетичната точка.\n- **Класификация 5** (на **Кнут Д. и Eisenstadt M.**): неправилни алгоритми; **груби грешки (некачествено проектиране)**; забравени функции; грешки, свързани със структуриране на данните; грешки от непознаване на езика; **грешки в интерфейса** (липса на защита на интерфейса); **лоши бъгове (runtime errors)**; тривиални грешки при писане.\n- **Причини (източници) за грешки** — описани в **9 категории**.\n\n### Тестване и настройване\n- **Тестване (testing)** — изследване или изпълнение на програмите с цел **установяване на наличие на грешка**.\n- **Настройване (debugging)** — **локализиране и отстраняване** на установени грешки.\n- Тестването определя, **че съществува** грешка; настройката я **локализира и поправя**. Настройката е **креативен** процес, тестването — **разрушителен**.\n- Когато настройката е завършена, програмата решава **някаква** задача; когато тестването е завършено — **изискваната** задача.\n- Аналогия с **V&V (Боем)**: **Валидация** — „Are we building the **right program**?“ (Създаваме ли правилния продукт?) — гледна точка на **потребителя**; **Верификация** — „Are we building the product **right**?“ (Създаваме ли продукта правилно?) — гледна точка на **разработчика**.\n\n### Подходи за ръчно локализиране на грешките\n- Настройката може да е **ръчна** или чрез **инструментални средства (дебъгери)**. Ръчното локализиране е в известен смисъл **изкуство**.\n- **Събиране и натрупване на сведения** — **оператори за печат** в кода; **точки на прекъсване (breakpoints)**.\n- **Inspeculation** — хибрид от **inspection** (преглеждане), **simulation** (ръчно симулиране), **speculation** (размишляване, анализиране).\n- **Разпознаване на клишета от експерт** — група хора, някой да посочи мястото („**евристично локализиране**“).\n- **Насочен експеримент** — когато източникът е ясен, програмата се изпълнява така, че да „мине“ през подозрителното място.\n- Относителен дял: **събиране на данни 55%**, **inspeculation 26%**, **клишета от експерти 9%**, **насочен експеримент 8%**, **други 2%**.\n\n### Автоматизация и общи насоки за настройка\n- Инструменталните средства за настройка в интегрираните среди се наричат **дебъгери**.\n- 13 насоки, напр.: (1) не допускайте програмата да стане много голяма — **разбивайте на малки части**; (2) мислете за настройката още при писането; (3) списък на променливите и константите; (4) **обработвайте проблемите един по един**; (5) запомнете коригираната грешка и причината; (6) **не хвърляйте вината върху изчислителната машина** (тя е много надеждна); (7) винаги ще има грешки — **добрите програмисти знаят това**; (8) **дата и час** на всяка разпечатка; (9) след корекция проверете, че не са въведени нови грешки; (10) **избягвайте съмнителното кодиране**, без хитри трикове; (11) **избягвайте зависимостта от „премълчаването“**; (12) **никога не допускайте зависимост от данните** — **закон на Мърфи**: „Всичко, което може да откаже, отказва!“; (13) **завършвайте логическите проверки докрай** (проверете за 1, после за 2, иначе — **патологичен случай**).\n\n### Тестване на софтуер — цел и аксиоми\n- **Тестване** — процес на изследване или изпълнение на програмата **с идеята да се намерят грешки**.\n- **Цел**: да установи наличието на дефекти; да докаже, че продуктът изпълнява всяка предвидена функция; да докаже съответствие със спецификацията на изискванията; да увеличи доверието → **„всичко изредено по-горе“**.\n- **Аксиоми**: (1) **добър** е тестът с **висока вероятност за откриване на грешки**, не този, който демонстрира правилна работа; **„успешен“** е тестът, който **намира поне една все още неоткрита грешка**; (2) **не е възможно изчерпващо тестване**; (3) **невъзможно е да се тества собствената програма**; (4) необходима част от всеки тест са **очакваните изходни резултати**; (5) да се избягва тестването **„ad hoc“**; (8) **с увеличаване на броя открити грешки в компонента расте и вероятността за неоткрити грешки** в нея; (9) тестването да се възлага на **най-способните програмисти**; (10) **тестуемостта** — ключова задача на разработката; (11) **никога не променяйте програмата, за да облекчите тестването**; (12) тестването започва с **постановка на целите**.\n- Тестването включва **3 стъпки: планиране, реализация, отчитане**. Обикновено завършва при **изтичане на срока или изчерпване на ресурсите**. „**Недостатъчното тестване е престъпление, а прекомерното — грях**.“\n\n### 4.1 Методи според нивото на тестване\n- **Не съществува единна класификация** на методите за тестване.\n- **Unit testing** (ниво компоненти) — от **програмиста**; методи **black- и white-box**; опира се на **изходния код** (функция, клас, модул).\n- **Integration testing** — съвместна работа на група модули в под-система; от **независим екип за тестване**; методи **Top-down и Bottom-up**; спецификация — **high- и low-level design documents**.\n  - **Top-down (низходящо)** — от компонента на най-високо ниво надолу; **Bottom-up (възходящо)** — интегриране отдолу на нива до цялостна система.\n- **Interface testing** — извършва се **по време на интеграционното тестване**. Видове интерфейси: **параметрични, базирани на обща памет, процедурни, с предаване на съобщения (message passing)**. Интерфейсни грешки: **Interface misuse** (злоупотреба — напр. **параметри в грешен ред**); **Interface misunderstanding** (неправилно предположение за поведението на викания компонент); **Timing errors** (различни скорости, не-актуализирани данни).\n- **System testing** — **верификация (контрол)** в **моделирана** среда; **валидация (изпитване)** в **реална** среда; методи Top-down и Bottom-up; спецификация — high-level design document и **SRS**.\n- Специфични видове (разширение на системното): **Stress testing** — особено нужно за **разпределените системи**; **Thread testing (нишково, чрез проследяване)** — процеси, протичащи **едновременно**; системите в реално време са трудни за тестване.\n\n### 4.2 Според това кой тества\n- **Вътрешно** — от разработчиците; плюс: познават програмите; минус: **надценяват възможностите си**; преодоляване — **peer review** (по двойки, всеки проверява партньора си).\n- **Независимо** — от експерти, неучаствали в разработката.\n- **За сертифициране** — издаване на **сертификат** за наличие на определени свойства (пример: PCI-DSS за плащания).\n\n### 4.3 Според вътрешната структура\n- **Функционален метод — Black box (черна кутия)** — **игнорира вътрешната структура**, гледа само изходните резултати при избрани входни данни.\n- **Структурен метод — White box (бяла/„стъклена“ кутия)** — върху **вътрешната структура**; цел — преминаване през **всички програмни части**; използва се най-вече за **unit testing**. Тестовете трябва: (1) всички **независими пътища поне веднъж** — „**Тест на минималното покритие**“; (2) всички логически условия при **true и false**; (3) всички цикли с граничните им стойности — „**Тест на циклите (Loop Testing)**“; (4) проверка на вътрешните структури от данни.\n- **Тест на минималното покритие**: изхожда от **управляващия граф (граф на потока)** — възли = управляващи оператори, дъги = поток на управление. Брой тестове = **цикломатична сложност V(G) = E − N + 2 (дъги − възли + 2)**. Пример: **V(G) = 9 − 6 + 2 = 5** теста. Стъпки: граф → V(G) → независими пътища и тестова последователност.\n- **Loop testing — обикновени цикли** (n = макс. брой): прескачане изцяло; 1 минаване; 2 минавания; m < n минавания; n−1 и n минавания. **Вложени цикли**: започва се от **най-вътрешния**, останалите — минимално; после навън.\n\n### 4.4 Според входните данни\n- **Стохастично (Random)** — **случайно генерирани** входни величини (метод на черната кутия). **Детерминирано** — детерминирани (не случайни) входни величини. Спецификация: **SRS**.\n\n### 4.5 Според стойностите на входните данни\n- 3 фази: **нормални случаи, гранични случаи, изключения**.\n- **Еквивалентно разделяне (Equivalence partitioning)** — валидните данни дават правилни резултати, невалидните — съобщение за грешка; подкрепя фазите **нормални случаи и изключения**. Правила: **диапазон** → **1 правилен + 2 неправилни** класа; **точна стойност** → 1 + 2; **член на множество** → **1 + 1**; **boolean** → **1 + 1**. Пример a ∈ [200…999]: валиден [200…999], невалидни a > 999 и a < 200; данни a = 300, 1000, 199. **Неправилните класове се тестват поотделно**.\n- **Гранични значения (Boundary Value Analysis)** — допълнение към предния; стойности на границите → **a = 200 и a = 999**; подкрепя фазата **гранични случаи**.\n\n### 4.6 Според интеграцията на модулите\n- Видове: **низходящо, модифицирано низходящо, голям скок, възходящо, смесено (сандвич), модифициран сандвич**.\n- **Низходящо (top down)** — първо **само главният модул**, после се добавят непосредствено извикваните; модулите се добавят **в дълбочина, не в ширина**. Плюсове: съвместява unit и integration testing; рано отговаря за **осъществимостта** на програмата. Минуси: модулите **рядко се тестват детайлно**; може да се започне преди да е проектирана цялата програма.\n- **Модифициран низходящ** — всеки модул първо минава **автономно (unit) тестване**.\n- **Голям скок** — автономно тестване на всеки модул, после **интеграция на всички едновременно**; изисква всички модули да са готови; **може би най-разпространеният** на практика, но **много недостатъци** (не съкращава времето, интеграция в последния момент, много разнообразни грешки); предимство — **не се пишат драйверни програми**.\n- **Възходящо (bottom up)** — изолирано се тестват **само модулите на най-ниско ниво**; на мястото на незавършените модули от горните нива се поставят **драйвери**.\n- **Сандвич (смесено)** — **компромис**; едновременно отгоре и отдолу, срещат се **по средата**; за **големи програми (ОС)**.\n- **Модифициран сандвич** — **долните нива се тестват строго** преди прибавяне към горните.\n\n### 4.7 Според целта\n1. **Експлоатационна годност** — Black box; 2. **атестация** (напр. стандарт ISO); 3. **пълна функционална проверка (acceptance testing)**; 4. **специални свойства** (надеждност, преносимост); 5. **реални потребителски условия (installation testing)**; 6. **нови свойства/функции — регресионно тестване**.\n- **Алфа-тестване** — потребителите проверяват, но **в средата на разработване**; Black box; SRS.\n- **Бета-тестване (installation testing)** — частична/пълна версия **безплатно** на потенциални потребители; **реални потребителски условия**. Плюсове: неочаквани грешки, много среди, безплатно. Минуси: **липса на систематичност**, **ниско качество на докладите**.\n- **Regression testing** — след внасяне на изменения; black- и white-box; **селективно ре-тестване само на променените компоненти**.\n\n### 4.8 Кой метод е най-добър\n- Зависи от организацията и програмата. Критерии (6): време до сглобяване; време до първите **„скелетни“ версии**; нужни ли са **драйвери**; **паралелно тестване**; тестване на отделни пътища; планиране и контрол.\n- Без Thread и Stress testing предпочитание: **отдолу-нагоре (bottom up)** и **модифицирания метод на сандвича**.\n\n### 5–6. Автоматизиране и осъществяване\n- Програмни средства за тестване: **анализатори на програми, генератори на тестови данни, среди за тестване**.\n- Автоматизацията дава: **систематичност**, по-добра организация, по-висока надеждност, **документиране**, **автоматично измерване на обхвата**.\n- Грешките се откриват **твърде късно**; усилията за отстраняване растат **експоненциално** → ранно откриване. **Стив Магуайър (Microsoft)**: намирането и отстраняването на грешки е **отговорност на програмиста**.\n- Пример — мобилно приложение за онлайн поръчка на храна; детерминирано: цена 10 лв. × 2 → 20 лв.; стохастично: 100 случайни поръчки; Stress: **10 000 едновременни поръчки**; гранични: **99 артикула**; изключения: **−5 лв. или празна кошница**.\n- Примерите са с **NUnit** (C#, `[TestFixture]`, `[Test]`, `Assert.AreEqual`, `Assert.Throws`); **Top-down** — **заместители (stubs)** с **Moq** (`Mock<IMenuService>`); bottom-up — първо малките блокове; Thread/Concurrency — `Parallel.For`.\n\n### Капани за изпита\n- **Тестване** установява наличие на грешка (разрушителен процес); **настройване (debugging)** локализира и поправя (креативен процес).\n- **Валидация** = „right program“ (правилния продукт); **верификация** = „product right“ (продукта правилно).\n- **Добър** тест — висока вероятност за откриване на грешки; **успешен** — намира поне една неоткрита грешка.\n- Диапазон и точна стойност → 1 правилен + **2** неправилни класа; множество и boolean → 1 + **1**.\n- Предпочитани методи: **bottom up + модифициран сандвич** (не голям скок, въпреки че е най-разпространен).\n- Несъответствия в слайдовете: аксиомите са номерирани **1–5, после 8–12** (6 и 7 липсват); при Top-down на слайд 27 пише „замествайки с **драйвери**“, а в примера с NUnit се ползват **stubs** (драйверите са типични за bottom-up); в примера за еквивалентни класове a = 300 е наречено „близко до граничните“; в тестовата последователност пътищата 4 и 5 са еднакви (1-2-3-4-5-2-6); тестът `ShouldThrowIfQuantityIsZero` използва `Assert.DoesNotThrow`; в таблицата с примери алфа-тестването е „тестване от вътрешен екип“, докато по дефиниция участват и потребители в средата на разработване; в съдържанието 4.4 е „според тестовите данни и очаквани резултати“, а на слайда — „според входните данни“.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L05-A-1", "n": 1, "text": "Какво се нарича дефект в програмата според лекцията?", "opts": ["Всяка синтактична грешка, открита от компилатора", "Всяко отклонение от изискванията", "Всяко предупреждение (warning) на компилатора", "Всяко неочаквано спиране на програмата при клиента"], "correct": 1, "expl": "Дефект = всяко отклонение от изискванията; дължи се на грешки"}, {"id": "L05-A-2", "n": 2, "text": "Каква е разликата между тестване и настройване?", "opts": ["Тестването локализира грешката, а настройването установява, че тя съществува", "Тестването е креативен процес, а настройването — разрушителен", "Няма разлика — двата термина са синоними", "Тестването установява, че съществува грешка, а настройването я локализира и поправя"], "correct": 3, "expl": "Тестването установява грешката, настройката я локализира и поправя"}, {"id": "L05-A-3", "n": 3, "text": "Как се изчислява цикломатичната сложност V(G) на управляващия граф?", "opts": ["Брой дъги − брой възли + 2", "Брой възли − брой дъги + 2", "Брой дъги + брой възли − 2", "Брой условни възли × 2"], "correct": 0, "expl": "V(G) = E − N + 2"}, {"id": "L05-A-4", "n": 4, "text": "Кое от изброените **НЕ** е аксиома на тестването?", "opts": ["Не е възможно изчерпващо тестване", "Невъзможно е да се тества собствената програма", "Програмата трябва да се променя, за да се облекчи тестването", "Трябва да се избягва тестването „ad hoc“"], "correct": 2, "expl": "Аксиома 11: никога не променяйте програмата, за да облекчите тестването"}, {"id": "L05-A-5", "n": 5, "text": "Кой подход за ръчно локализиране на грешки има най-голям относителен дял (55%)?", "opts": ["Inspeculation", "Събиране на данни", "Разпознаване на клишета от експерти", "Насочен експеримент"], "correct": 1, "expl": "Събиране на данни 55%, inspeculation 26%"}, {"id": "L05-A-6", "n": 6, "text": "На кой въпрос отговаря валидацията според Боем?", "opts": ["Are we building the right program? (Създаваме ли правилния продукт?)", "Are we building the product right? (Създаваме ли продукта правилно?)", "Is the program fast enough?", "Is the code fully documented?"], "correct": 0, "expl": "Валидация — правилния продукт; верификация — продукта правилно"}, {"id": "L05-A-7", "n": 7, "text": "Стойностите на променлива „а“ трябва да са в диапазона [1…10]. Колко еквивалентни класа има за нея?", "opts": ["1 правилен и 1 неправилен", "2 правилни и 1 неправилен", "Само 1 правилен", "1 правилен и 2 неправилни"], "correct": 3, "expl": "Диапазон → 1 правилен (a в [1…10]) и 2 неправилни (a<1, a>10)"}, {"id": "L05-A-8", "n": 8, "text": "Кое твърдение описва бета-тестването?", "opts": ["Провежда се от програмиста върху изходния код на един модул", "Провежда се с потребители в средата на разработване", "Версия на софтуера се предлага безплатно на потенциални потребители и се проверява в реални потребителски условия", "Селективно ре-тестване само на променените компоненти"], "correct": 2, "expl": "Бета (installation testing) — безплатно, реални потребителски условия"}, {"id": "L05-A-9", "n": 9, "text": "Каква е целта на софтуерното тестване според лекцията?", "opts": ["Всичко изброено: установяване на дефекти, доказване, че продуктът изпълнява предвидените функции и спецификацията, увеличаване на доверието", "Само да демонстрира, че програмата работи правилно", "Само да локализира и поправи грешките", "Само да измери производителността на системата"], "correct": 0, "expl": "Целта е „всичко изредено по-горе“"}, {"id": "L05-A-10", "n": 10, "text": "Кои са трите основни стъпки на тестването?", "opts": ["Анализ, проектиране, кодиране", "Компилиране, изпълнение, настройване", "Верификация, валидация, сертифициране", "Планиране, реализация, отчитане"], "correct": 3, "expl": "Планиране, реализация, отчитане"}], "B": [{"id": "L05-B-1", "n": 1, "text": "Чия е дефиницията „В програмата има грешки, ако тя не изпълнява това, което потребителят разумно очаква от нея“?", "opts": ["Боем", "Кнут", "Майерс", "Магуайър"], "correct": 2, "expl": "Дефиниция 2 на грешка — Майерс"}, {"id": "L05-B-2", "n": 2, "text": "Какво представляват първичните грешки според класификация 2?", "opts": ["Неправилности в текста на програмите", "Изкривявания на получените резултати", "Грешки в проектната документация", "Грешки, проявяващи се само на машината на клиента"], "correct": 0, "expl": "Първични — в текста; вторични — изкривени резултати"}, {"id": "L05-B-3", "n": 3, "text": "Какво е характерно за предупредителните грешки (warnings)?", "opts": ["Те винаги спират компилацията", "Компилаторът предупреждава за нещо необичайно (напр. неинициализирани или неизползвани данни), а програмистът решава дали да ги игнорира", "Проявяват се само по време на изпълнение", "Дължат се на лошо описание на задачата"], "correct": 1, "expl": "Warnings — напр. неинициализирани/неизползвани данни, програмистът решава"}, {"id": "L05-B-4", "n": 4, "text": "От кои думи е хибрид терминът „Inspeculation“?", "opts": ["Inspection, calculation, speculation", "Instruction, simulation, specification", "Inspection, simulation, specification", "Inspection, simulation, speculation"], "correct": 3, "expl": "Inspection + simulation + speculation"}, {"id": "L05-B-5", "n": 5, "text": "Кой тест се счита за „успешен“ според аксиомите на тестването?", "opts": ["Тестът, който демонстрира правилната работа на програмата", "Тестът, който минава без нито една грешка", "Тестът, който намира поне една все още неоткрита грешка", "Тестът, проведен от най-много тестери"], "correct": 2, "expl": "Успешен тест намира поне една неоткрита грешка"}, {"id": "L05-B-6", "n": 6, "text": "За какво се използва най-вече структурното тестване (white box)?", "opts": ["За проверка на управляващата структура на процедурите, т.е. за unit testing", "За бета-тестване в реални условия", "За тестване за сертифициране", "За стохастично тестване с случайни данни"], "correct": 0, "expl": "White box — главно за unit testing"}, {"id": "L05-B-7", "n": 7, "text": "Компонент извиква друг компонент, но подава параметрите в грешен ред. Какъв вид интерфейсна грешка е това?", "opts": ["Interface misunderstanding", "Interface misuse", "Timing error", "Shared memory error"], "correct": 1, "expl": "Interface misuse — грешна употреба, напр. параметри в грешен ред"}, {"id": "L05-B-8", "n": 8, "text": "На кои методи следва да се даде предпочитание според критериите в т. 4.8 (без Thread и Stress testing)?", "opts": ["Методът на големия скок и низходящият метод", "Низходящият и модифицираният низходящ метод", "Само методът на сандвича", "Методът отдолу-нагоре и модифицираният метод на сандвича"], "correct": 3, "expl": "Bottom up и модифициран сандвич"}, {"id": "L05-B-9", "n": 9, "text": "Какво е регресионното тестване?", "opts": ["Тестване със случайно генерирани входни данни", "Тестване на най-вътрешния цикъл първо", "Селективно ре-тестване само на тези компоненти, в които са внесени изменения", "Тестване, извършвано само от сертифицираща организация"], "correct": 2, "expl": "Регресия — след изменения, селективно ре-тестване"}, {"id": "L05-B-10", "n": 10, "text": "Кое **НЕ** е вид програмно средство за тестване според предназначението?", "opts": ["Компилатори", "Анализатори на програми", "Генератори на тестови данни", "Среди за тестване"], "correct": 0, "expl": "Средствата са анализатори, генератори на тестови данни и среди за тестване"}], "C": [{"id": "L05-C-1", "n": 1, "text": "Към кои дейности в софтуерния процес спадат настройването и тестването?", "opts": ["Към основните дейности", "Към допълнителните („фонови“) дейности", "Към дейностите по внедряване", "Към дейностите по анализ на изискванията"], "correct": 1, "expl": "Допълнителни, т.е. „фонови“ дейности"}, {"id": "L05-C-2", "n": 2, "text": "Кое **НЕ** е вид грешка при изпълнение според времето на проявление?", "opts": ["Постоянни", "Понякога", "Само на машината на клиента", "Само по време на компилация"], "correct": 3, "expl": "Постоянни, понякога, само на машината на клиента"}, {"id": "L05-C-3", "n": 3, "text": "Управляващ граф има 9 дъги и 6 възли. Колко е минималният брой тестове за покриване на всички независими пътища?", "opts": ["5", "3", "15", "17"], "correct": 0, "expl": "9 − 6 + 2 = 5"}, {"id": "L05-C-4", "n": 4, "text": "Откъде се започва тестването на вложени цикли?", "opts": ["С най-външния цикъл", "С най-вътрешния цикъл", "С цикъла с най-много итерации", "Всички цикли се тестват едновременно"], "correct": 1, "expl": "Започва се от най-вътрешния, останалите — минимално"}, {"id": "L05-C-5", "n": 5, "text": "Какво е стохастично (Random) тестване?", "opts": ["Тестване по метода на черната кутия чрез случайно генерирани входни величини", "Тестване чрез детерминирани входни величини", "Тестване на всички независими пътища поне веднъж", "Тестване на граничните стойности на входната област"], "correct": 0, "expl": "Random — случайно генерирани входни величини, черна кутия"}, {"id": "L05-C-6", "n": 6, "text": "Колко еквивалентни класа има променлива, която специфицира член на множество?", "opts": ["1 правилен и 2 неправилни", "2 правилни и 2 неправилни", "1 правилен и 1 неправилен", "Само неправилни класове"], "correct": 2, "expl": "Член на множество (и boolean) → 1 правилен и 1 неправилен"}, {"id": "L05-C-7", "n": 7, "text": "Променливата „a“ е трицифрено число между 200 и 999 (включително). С кои стойности се тества по метода на граничните значения?", "opts": ["a = 300 и a = 900", "a = 199 и a = 1000", "a = 0 и a = 999", "a = 200 и a = 999"], "correct": 3, "expl": "Границите 200 и 999 като валидни данни"}, {"id": "L05-C-8", "n": 8, "text": "С какво се отличава алфа-тестването от бета-тестването?", "opts": ["Провежда се с участие на потребители, но в средата на разработване", "Провежда се само от програмиста върху изходния код", "Провежда се в реални потребителски условия при клиента", "Използва основно white-box методи"], "correct": 0, "expl": "Алфа — с потребители, но в средата на разработване"}, {"id": "L05-C-9", "n": 9, "text": "Какво изисква модифицираният низходящ метод на тестване?", "opts": ["Всички модули да се интегрират едновременно", "Всеки модул да е преминал автономно тестване (unit testing), преди да се подключи към програмата", "Тестването да започва едновременно отгоре и отдолу", "Да се тестват само модулите на най-ниско ниво"], "correct": 1, "expl": "Всеки модул първо минава unit testing"}, {"id": "L05-C-10", "n": 10, "text": "Според цитата на Стив Магуайър (Microsoft) чия отговорност е намирането и отстраняването на грешки?", "opts": ["На тестващата група", "На клиента", "На програмиста", "На ръководителя на проекта"], "correct": 2, "expl": "Отговорност на програмиста да не изтичат грешки към тестерите и клиентите"}], "D": [{"id": "L05-D-1", "n": 1, "text": "На кого е класификация 5 на грешките (неправилни алгоритми, груби грешки, забравени функции и др.)?", "opts": ["Майерс и Боем", "Манева и Ескенази", "Сомервил", "Кнут Д. и Eisenstadt M."], "correct": 3, "expl": "Класификация 5 — Кнут Д. и Eisenstadt M."}, {"id": "L05-D-2", "n": 2, "text": "Колко класификации на грешките са разгледани в лекцията?", "opts": ["3", "9", "5", "4"], "correct": 2, "expl": "5 класификации; 9 са категориите причини за грешки"}, {"id": "L05-D-3", "n": 3, "text": "Какъв е относителният дял на подхода Inspeculation при ръчното локализиране на грешки?", "opts": ["55%", "26%", "9%", "8%"], "correct": 1, "expl": "55 / 26 / 9 / 8 / 2 %"}, {"id": "L05-D-4", "n": 4, "text": "Кое **НЕ** е вид грешка според класификация 1 (кога в ЖЦ се откриват)?", "opts": ["В компилатора", "В проекта", "В документацията", "В тестовите данни"], "correct": 0, "expl": "В проекта, документацията, тестовите данни, програмата"}, {"id": "L05-D-5", "n": 5, "text": "Коя насока за настройка е свързана със закона на Мърфи „Всичко, което може да откаже, отказва!“?", "opts": ["Не хвърляйте вината върху изчислителната машина", "Снабдявайте всяка разпечатка с дата и час", "Избягвайте зависимостта от „премълчаването“", "Никога не допускайте зависимост от данните"], "correct": 3, "expl": "Насока 12 — данните следват закона на Мърфи"}, {"id": "L05-D-6", "n": 6, "text": "Какво гласи аксиома 8 на тестването?", "opts": ["Тестването трябва да започва с постановка на целите", "Тестуемостта трябва да е ключова задача на разработката", "С увеличаване на броя на откритите грешки в компонента се увеличава и вероятността за съществуване на неоткрити грешки в нея", "Тестването да се възлага на най-способните програмисти"], "correct": 2, "expl": "Повече открити грешки → по-вероятни неоткрити"}, {"id": "L05-D-7", "n": 7, "text": "Кой извършва интеграционното тестване (Integration testing) според лекцията?", "opts": ["Независим екип за тестване (testing team)", "Програмистът, написал модула", "Крайните потребители в реална среда", "Сертифицираща организация"], "correct": 0, "expl": "Integration — независим testing team; unit — програмистът"}, {"id": "L05-D-8", "n": 8, "text": "Какво представляват Timing errors (временни грешки) при интерфейсното тестване?", "opts": ["Параметрите се подават в грешен ред", "Извиканият и извикващият компонент работят при различни скорости и с не-актуализирани данни", "Извикващият компонент има неправилно предположение за поведението на викания", "Програмата не завършва в предвидения срок за тестване"], "correct": 1, "expl": "Различни скорости и не-актуализирани данни"}, {"id": "L05-D-9", "n": 9, "text": "Как се нарича системното тестване, когато се изпълнява в моделирана среда?", "opts": ["Валидация (изпитване)", "Сертифициране", "Бета-тестване", "Контрол или верификация"], "correct": 3, "expl": "Моделирана среда → контрол/верификация; реална → изпитване/валидация"}, {"id": "L05-D-10", "n": 10, "text": "Кои са видовете грешки в програмата според класификация 3?", "opts": ["Синтактични, предупредителни, при изпълнение", "Първични и вторични", "Системни, технологични, програмни, алгоритмични", "Постоянни, понякога, само на машината на клиента"], "correct": 2, "expl": "Системни, технологични, програмни, алгоритмични"}], "E": [{"id": "L05-E-1", "n": 1, "text": "Какво представлява смесеното тестване (метод на сандвича)?", "opts": ["Всички модули се интегрират едновременно след автономното им тестване", "Компромис — едновременно възходящо и низходящо тестване, които се срещат някъде по средата", "Тестване само на главния модул", "Селективно ре-тестване на променените модули"], "correct": 1, "expl": "Сандвич — компромис, среща по средата, за големи програми"}, {"id": "L05-E-2", "n": 2, "text": "Какво отстранява модифицираният метод на сандвича?", "opts": ["Липсата на детайлно тестване на модулите — долните нива се тестват строго преди прибавянето им към горните", "Необходимостта от драйвери — те не се използват", "Необходимостта от планиране на тестването", "Необходимостта от тестване на интерфейсите"], "correct": 0, "expl": "Долните нива се тестват строго преди прибавяне"}, {"id": "L05-E-3", "n": 3, "text": "Кой е недостатък на бета-тестването?", "opts": ["Високата цена на тестването", "Тества се само в една среда", "Липса на систематичност и ниско качество на докладите за грешки", "Не открива неочаквани грешки"], "correct": 2, "expl": "Несистематично, ниско качество на докладите"}, {"id": "L05-E-4", "n": 4, "text": "Кое е предимството на метода на големия скок?", "opts": ["Съкращава времето за разработване", "Модулите се интегрират рано", "При стиковането възникват малко грешки", "Не се налага да се пишат допълнително драйверни програми"], "correct": 3, "expl": "Единственото предимство — без драйверни програми"}, {"id": "L05-E-5", "n": 5, "text": "Как се препоръчва да се добавят модулите при низходящото тестване?", "opts": ["В дълбочина, а не на хоризонтално равнище (в ширина)", "В ширина, а не в дълбочина", "Всички наведнъж", "В случаен ред"], "correct": 0, "expl": "В дълбочина, не в ширина"}, {"id": "L05-E-6", "n": 6, "text": "Как се преодолява недостатъкът на вътрешното тестване (надценяване на собствените възможности)?", "opts": ["Чрез бета-тестване", "Чрез peer review — програмистите в двойки проверяват програмите на партньора си", "Чрез тестване за сертифициране", "Чрез метода на големия скок"], "correct": 1, "expl": "Peer review — проверка по двойки"}, {"id": "L05-E-7", "n": 7, "text": "Кое **НЕ** е предимство на автоматизацията на настройването и тестването?", "opts": ["Систематичност", "Документиране на извършваните дейности", "Пълно премахване на необходимостта от тестване", "Автоматично измерване обхвата на тестването"], "correct": 2, "expl": "Автоматизацията подпомага, не премахва тестването"}, {"id": "L05-E-8", "n": 8, "text": "Как растат усилията за отстраняване на грешките с напредването на разработката?", "opts": ["Линейно", "Остават постоянни", "Намаляват", "Експоненциално"], "correct": 3, "expl": "Усилията растат експоненциално → ранно откриване"}, {"id": "L05-E-9", "n": 9, "text": "Какво се използва в NUnit примера за Top-Down тестване на мястото на още несъществуващите компоненти?", "opts": ["Заместители (stubs), създадени с Moq", "Драйвери, генерирани от компилатора", "Реалният клас MenuService", "Parallel.For"], "correct": 0, "expl": "Mock от IMenuService (Moq) като stub"}, {"id": "L05-E-10", "n": 10, "text": "Кое **НЕ** е вид интерфейс според интерфейсното тестване?", "opts": ["Параметрични интерфейси (Parameter interfaces)", "Графични потребителски интерфейси (GUI)", "Интерфейси, базирани на обща памет (Shared memory interfaces)", "Интерфейси с предаване на съобщения (Message passing interfaces)"], "correct": 1, "expl": "Параметрични, обща памет, процедурни, message passing"}]}}, {"num": 6, "title": "Тема 6 — Съпровождане и документиране", "short": "Съпровождане и документиране", "summary": "### Съпровождане — същност и разходи\n- **Съпровождане** — **съвкупността от дейности, свързани с внасяне на промени във внедрен софтуер**.\n- **Най-голям дял** от разходите в софтуерното производство се пада на **съпровождането** на ПО.\n- **60 – 70%** от разходите за дадена **операционна система** се извършват, **след като системата е станала достъпна** за потребителите.\n- Като цяло разходите за съпровождане са големи — **между 65% и 75%** от всички разходи (в заключението: **над 50%** от всички разходи за разработка на ПО).\n- Много софтуерни организации са **принудени да ограничават разработването на нови продукти** поради голямата трудоемкост на съпровождането на съществуващите.\n\n### Видове съпровождане\nВ зависимост от **целите на модифицирането** на софтуера:\n- **коригиращо** — **25%** от усилията;\n- **адаптивно** — **50%** (най-голям дял);\n- **усъвършенстващо** — **25%**.\nРазпределението зависи от много фактори (тип и сложност на софтуера, приложна област и др.).\n\n### Кой осъществява съпровождането\n- **Разработчиците** — предимства: **познават добре проекта, функциите, съдържанието и структурата на програмите**; знаейки, че ще съпровождат, още при разработването създават системата така, че да **улеснява внасянето на изменения**.\n- **Други лица или организации** (въз основа на **договор за съпровождане**) — сформирането на нова група осигурява **по-обективна оценка** на системата и **възможност за оригинални идеи** при модифицирането.\n- И в двата случая **ролята на документацията е съществена** за продължителността и трудоемкостта на съпровождането.\n\n### Етапи на съпровождането (3)\n1. **разучаване** на съществуващия софтуер;\n2. **модифициране** на съществуващия софтуер;\n3. **проверка на правилността** на модифицирания софтуер.\n\n### Софтуерна конфигурация\n**Съвкупността от всички елементи, необходими за функционирането на даден ПП**:\n- първични текстове на програмите;\n- обектен и изпълним код;\n- командни файлове или процедури за свързване и изпълнение на програмната система;\n- използвани системни файлове;\n- помощни програми;\n- файлове с данни;\n- **съпровождащата документация**: програмни спецификации, ръководство за потребителя, ръководство за инсталиране и др.\n\n### Управление на софтуерните конфигурации\n- За всеки ПП се съставя описание на софтуерната конфигурация и на **връзките между елементите** ѝ.\n- Започва **в началото на проекта** и продължава при разработването — **„фонова дейност“**.\n- При съпровождането се осъществява: **управление на заявките за изменение**, **контрол на версиите**, **управление на внасянето на измененията**.\n- **Заявки за изменение** — стандартен **формуляр-заявка**, в който се описва исканото изменение и се **обосновават причините**. **Специален експертен съвет** решава за всяка заявка: **да се отхвърли**, **да се включи в подготвяната нова версия** или **да се отложи** за следваща версия.\n- **Критерии за подреждане на измененията** на поредна версия: а) технически или процедурни причини; б) **неотложност**; в) **оценяване на необходимите ресурси**; г) **степен на отражение** на промените върху останалите части; д) **подобие** — сходните промени се групират в една версия.\n- **Контрол на версиите**: задължителна **приемственост между версиите**; **бюлетин за измененията**; **преиздаване на ръководството за потребителя**.\n\n### Етапи на внасянето на изменения (5)\n1. **Идентифициране на проблема и възлагане** — попълва се формуляр-заявка; оценяват се обемът и сложността; възлага се на един или няколко изпълнители.\n2. **Проектиране на измененията** — анализират се начините и се определя **кои програмни части** ще се модифицират.\n3. **Програмиране и тестване** — програмите се изменят и **тестват локално**.\n4. **Интегриране и системно тестване** — **регресионно тестване** и **пълни приемни изпитания**; след това версията се пуска; потребителите се запознават с **бюлетина за изменение**.\n5. **Разпространение на новата версия** — всеки потребител може да получи новата версия и документацията.\n\n### Разходи и цена на съпровождането\nОценка (формулата е на слайда като изображение; по Манева/Ескенази): **M = p + K·e^(c − d)**\n- **M** — общите разходи за съпровождане;\n- **p** — **продуктивните усилия**: анализ, проектиране, програмиране, тестване;\n- **c** — **мярка на сложността**, предизвикана от **липсата на дисциплинирано проектиране и документация**;\n- **d** — **степента, до която групата по съпровождане е запозната със софтуера** (редуцира c);\n- **K** — **емпирична константа**, зависи от конкретната среда (екип), определя се чрез **регресионен анализ** на разходите на реални проекти.\n- Ако системата е разработена без основните принципи и се съпровожда без пълно разбиране → разходите **нарастват експоненциално**. Намаляване: чрез осигуряване на характеристиката на качеството **съпровождаемост** в процеса на разработване.\n\n### Автоматизирани средства и среди\nГрупи средства по предназначение: а) **улесняващи разучаването** на програмите; б) улесняващи **анализа и проектирането** на измененията; в) за **управляемо внасяне** на промените; г) за **регресионното тестване** и анализ на резултатите; д) за **документиране на промените**.\n- **Системи за управление на конфигурациите (Configuration Management Systems)** — интегрират няколко средства, имат собствени бази от данни и механизми за управление на промените. Примери: **NSE (Sun Microsystems)**, **Maestro (Softlab)**, **Jasmine (Xerox)**, **Lifespan (Yard Systems)**.\n\n### Документиране — класификация\nДокументите се различават по **предназначение, структура и съдържание**. Две групи:\n- а) **свързани с процеса на създаване на софтуер** — зависят от **стила на управление на проектите**, регламентират се от **вътрешни правила и стандарти** на организацията (структура, кой и кога създава, утвърждаване, промяна, къде и колко дълго се съхранява);\n- б) **описващи създадения програмен продукт** — **съпровождаща** или **експлоатационна**.\n\n### Съпровождаща документация\nПредназначение: да осигури информацията за **разучаване и внасяне на изменения** в програмите. Включва:\n- спецификация на **изискванията** (функционални и нефункционални);\n- спецификация на **архитектурата** (основни компоненти и връзките им);\n- **детайлно описание на всяка компонента**;\n- **първичен текст** на програмата.\n**Стандарт за вътрешно документиране** — описанието на програмата включва: предназначение, логика, структура, компоненти, методи и алгоритми, входна и изходна информация, процедури за извикване и зареждане.\n\n### Експлоатационна документация\nИнформация за използване на системата от **крайни потребители** (документация за потребителя) и **администратори** (документация за администратора).\n- **Документация за администратора**: **инструкция за инсталиране** + **ръководство за администратора**.\n- Стандарти за потребителската документация: **IEEE Std 1063-2001** (ревизия на **ANSI/IEEE Std 1063-1987**); в България — **БДС ЕСПО**, номера **БДС 19.XXX-УУ** (XXX — номер, УУ — година), от периода **1978—1980**, **морално остарели**.\n- Части: **обучаваща** (за **начинаещи**) и **справочна** (за **по-опитни**; основните функции подредени за бързо търсене, напр. **по азбучен ред**).\n- Стилът зависи от образованието, квалификацията, компютърната грамотност на потребителите.\n- **Изисквания**: а) **правилност**; б) **пълнота и структурираност**; в) **ясен, недвусмислен стил**, съобразен с терминологията на областта; г) ръководството да е **относително затворена система** — да се **избягват сложните препратки дори с цената на повтаряне** на информация.\n\n### Автоматизация на документирането\n- **DMS (Document Management System)** — системи за управление на документи: съставяне, форматиране, отпечатване, поддръжка на версии (**Version control systems: CVS (Concurrent Versions System), Git**).\n- Цел: **пълно съответствие** между последното състояние на системата и всички описващи я документи.\n\n### Капани за изпита\n- **3 етапа на съпровождането** (разучаване, модифициране, проверка) ≠ **5 етапа на внасянето на изменения** ≠ **3 дейности** на управлението на конфигурацията при съпровождането (заявки, версии, внасяне).\n- Най-голям дял от усилията е **адаптивното (50%)**, не коригиращото (25%).\n- Противоречиви числа на слайдовете: **60–70%** (за ОС), **65–75%** (общо), **„над 50%“** (заключение) — помни контекста на всяко.\n- **c** увеличава разходите (липса на дисциплина и документация), **d** ги намалява (запознатост); **K** е емпирична, от **регресионен анализ**; **p** — продуктивни усилия.\n- **Регресионното тестване** е в **етап 4** (интегриране), не в етап 3 (там тестването е **локално**).\n- Ръководството за потребителя е част от съпровождащата документация в софтуерната конфигурация (слайд 8), но иначе е **експлоатационна** документация.\n- Обучаваща част → **начинаещи**; справочна → **опитни**.\n- Печатни грешки на слайдовете: „Eman 1“ вместо „Етап 1“; второто „2. Документиране“ след т. 6; изречението „Ако системата е разработена без прилагане на основните…“ е недовършено; самата формула липсва в текста.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L06-A-1", "n": 1, "text": "Какво се разбира под съпровождане на софтуер?", "opts": ["Съвкупността от дейности по първоначалното проектиране на софтуера", "Съвкупността от дейности, свързани с внасяне на промени във внедрен софтуер", "Обучението на крайните потребители за работа със системата", "Тестването на софтуера преди внедряване"], "correct": 1, "expl": "Дейности по внасяне на промени във внедрен софтуер"}, {"id": "L06-A-2", "n": 2, "text": "Кой вид съпровождане заема най-голям дял от усилията (50%)?", "opts": ["Коригиращо", "Усъвършенстващо", "Адаптивно", "Превантивно"], "correct": 2, "expl": "Адаптивно 50%, коригиращо и усъвършенстващо по 25%"}, {"id": "L06-A-3", "n": 3, "text": "Какъв процент от разходите за дадена операционна система се извършват, след като тя е станала достъпна за потребителите?", "opts": ["60 – 70%", "25 – 30%", "40 – 50%", "80 – 90%"], "correct": 0, "expl": "60 – 70% от разходите за ОС са след пускането"}, {"id": "L06-A-4", "n": 4, "text": "Кое от изброените НЕ е етап на съпровождането?", "opts": ["Разучаване на съществуващия софтуер", "Модифициране на съществуващия софтуер", "Проверка на правилността на модифицирания софтуер", "Изготвяне на технико-икономическа обосновка"], "correct": 3, "expl": "Етапите са разучаване, модифициране, проверка на правилността"}, {"id": "L06-A-5", "n": 5, "text": "Какво е софтуерна конфигурация?", "opts": ["Съвкупността от всички елементи, необходими за функционирането на даден ПП", "Хардуерната среда, в която работи програмата", "Списъкът с настройки в конфигурационния файл на приложението", "Само първичните текстове на програмите"], "correct": 0, "expl": "Всички елементи, необходими за функционирането на ПП"}, {"id": "L06-A-6", "n": 6, "text": "Как се характеризира управлението на софтуерната конфигурация?", "opts": ["Започва едва след внедряването на системата", "„Фонова дейност“, която започва в началото на проекта и продължава при разработването", "Еднократна дейност при приемните изпитания", "Дейност, извършвана само от крайните потребители"], "correct": 1, "expl": "Започва в началото на проекта — фонова дейност"}, {"id": "L06-A-7", "n": 7, "text": "Колко етапа включва внасянето на изменения според лекцията?", "opts": ["3", "4", "5", "6"], "correct": 2, "expl": "5 етапа: идентифициране, проектиране, програмиране, интегриране, разпространение"}, {"id": "L06-A-8", "n": 8, "text": "Какво означава d във формулата за разходите за съпровождане?", "opts": ["Продуктивните усилия за анализ, проектиране, програмиране и тестване", "Емпиричната константа, зависеща от средата", "Мярката на сложността от липса на дисциплинирано проектиране", "Степента, до която групата по съпровождане е запозната със софтуера"], "correct": 3, "expl": "d — запознатост на групата, редуцира сложността c"}, {"id": "L06-A-9", "n": 9, "text": "Коя фирма е разработила системата за управление на конфигурациите NSE?", "opts": ["Sun Microsystems", "Softlab", "Xerox", "Yard Systems"], "correct": 0, "expl": "NSE — Sun Microsystems"}, {"id": "L06-A-10", "n": 10, "text": "За кого е предназначена обучаващата част на потребителската документация?", "opts": ["За администраторите на системата", "За начинаещи потребители", "За потребители с по-голям опит", "За групата по съпровождане"], "correct": 1, "expl": "Обучаващата — за начинаещи, справочната — за опитни"}], "B": [{"id": "L06-B-1", "n": 1, "text": "Какъв процент от усилията за съпровождане се падат на коригиращото съпровождане?", "opts": ["50%", "25%", "10%", "75%"], "correct": 1, "expl": "Коригиращо — 25%"}, {"id": "L06-B-2", "n": 2, "text": "Кой вид съпровождане НЕ е посочен в класификацията на лекцията?", "opts": ["Превантивно", "Коригиращо", "Адаптивно", "Усъвършенстващо"], "correct": 0, "expl": "Лекцията посочва само коригиращо, адаптивно и усъвършенстващо"}, {"id": "L06-B-3", "n": 3, "text": "Кое е предимство на съпровождането, извършвано от разработчиците?", "opts": ["Осигурява по-обективна оценка на системата", "Носи оригинални идеи за модифицирането", "Те познават добре проекта, функциите, съдържанието и структурата на програмите", "Отпада нуждата от документация"], "correct": 2, "expl": "Разработчиците познават добре проекта и програмите"}, {"id": "L06-B-4", "n": 4, "text": "Кое е предимство на съпровождането от други лица или организации?", "opts": ["Те познават най-добре структурата на програмите", "Не е необходим договор за съпровождане", "Системата се създава така, че да улеснява измененията", "По-обективна оценка на системата и възможност за оригинални идеи при модифицирането"], "correct": 3, "expl": "Нова група — по-обективна оценка и оригинални идеи"}, {"id": "L06-B-5", "n": 5, "text": "Кой разглежда постъпилите заявки за изменение и решава какво да стане с тях?", "opts": ["Специален експертен съвет", "Ръководителят на проекта еднолично", "Крайните потребители", "Програмистът, получил заявката"], "correct": 0, "expl": "Специален експертен съвет"}, {"id": "L06-B-6", "n": 6, "text": "Кое НЕ е възможно решение по заявка за изменение?", "opts": ["Заявката да се отхвърли", "Да се включи в подготвяната нова версия", "Да се отложи за някаква следваща версия", "Да се внесе незабавно в работещата версия без тестване"], "correct": 3, "expl": "Възможни са отхвърляне, включване в новата версия или отлагане"}, {"id": "L06-B-7", "n": 7, "text": "Какво означава критерият „подобие на измененията“ при подреждане на измененията на поредна версия?", "opts": ["Измененията се подреждат по азбучен ред", "Сходните промени да се групират в една версия", "Всяка промяна се пуска в отделна версия", "Промените се подреждат по цената им"], "correct": 1, "expl": "Сходните промени се групират в една версия"}, {"id": "L06-B-8", "n": 8, "text": "В кой етап от внасянето на изменения се извършват регресионно тестване и пълни приемни изпитания?", "opts": ["Етап 2 — Проектиране на измененията", "Етап 3 — Програмиране и тестване", "Етап 4 — Интегриране на програмната система и системно тестване", "Етап 5 — Разпространение на новата версия"], "correct": 2, "expl": "Етап 4 — регресионно тестване и пълни приемни изпитания"}, {"id": "L06-B-9", "n": 9, "text": "Как нарастват разходите за съпровождане, ако системата е разработена без основните принципи и се съпровожда без пълно разбиране?", "opts": ["Експоненциално", "Линейно", "Логаритмично", "Остават постоянни"], "correct": 0, "expl": "Разходите нарастват експоненциално"}, {"id": "L06-B-10", "n": 10, "text": "Какво е предназначението на съпровождащата документация?", "opts": ["Да осигури информацията за използване на системата от крайните потребители", "Да осигури информацията за администраторите на системата", "Да регламентира процеса на създаване на софтуера", "Да осигури информацията, необходима за разучаване и внасяне на изменения в програмите"], "correct": 3, "expl": "Съпровождащата — за разучаване и внасяне на изменения"}], "C": [{"id": "L06-C-1", "n": 1, "text": "Според статистическите данни в лекцията какъв дял от всички разходи са разходите за съпровождане?", "opts": ["Между 25% и 3
