кцията?", "opts": ["NSE", "Eclipse", "Jasmine", "Maestro"], "correct": 1, "expl": "Примерите са NSE, Maestro, Jasmine, Lifespan"}, {"id": "L06-E-5", "n": 5, "text": "Документацията, описваща създадения програмен продукт, в зависимост от предназначението си може да бъде:", "opts": ["Съпровождаща или експлоатационна", "Обучаваща или справочна", "Вътрешна или външна", "Функционална или нефункционална"], "correct": 0, "expl": "Съпровождаща или експлоатационна"}, {"id": "L06-E-6", "n": 6, "text": "Кой стандарт е посочен за съдържанието на потребителската документация?", "opts": ["IEEE Std 830-1998", "ISO 9001:2015", "IEEE Std 1063-2001", "ISO/IEC 12207"], "correct": 2, "expl": "IEEE Std 1063-2001 (ревизия на ANSI/IEEE Std 1063-1987)"}, {"id": "L06-E-7", "n": 7, "text": "От кой период са българските стандарти БДС ЕСПО?", "opts": ["1990—1992", "2001—2006", "1968—1970", "1978—1980"], "correct": 3, "expl": "БДС ЕСПО — 1978—1980, морално остарели"}, {"id": "L06-E-8", "n": 8, "text": "Какво е характерно за справочната част на потребителската документация?", "opts": ["Предназначена е за начинаещи потребители", "Предназначена е за по-опитни потребители и представя основните функции, подредени за бързо търсене", "Съдържа инструкцията за инсталиране", "Съдържа първичния текст на програмата"], "correct": 1, "expl": "Справочната — за опитни, подредена за бързо търсене (напр. азбучно)"}, {"id": "L06-E-9", "n": 9, "text": "Кое НЕ е изискване към потребителската документация?", "opts": ["Да съдържа много сложни препратки, за да се избегне всяко повторение на информация", "Правилност", "Пълнота и структурираност", "Ясен и недвусмислен стил, съобразен с терминологията на областта"], "correct": 0, "expl": "Сложните препратки се избягват дори с цената на повторение"}, {"id": "L06-E-10", "n": 10, "text": "Какво означава съкращението DMS в контекста на автоматизацията на документирането?", "opts": ["Data Mining System", "Distributed Maintenance Service", "Development Management Standard", "Document Management System — система за управление на документи"], "correct": 3, "expl": "Document Management System"}]}}, {"num": 7, "title": "Тема 7 — Човешкият фактор в разработването и използването на софтуера", "short": "Човешкият фактор в разработването и използването на софтуера", "summary": "### Въведение и софтуерна психология\n- Управлението на софтуерните проекти се базира на **4 компонента**: **Хората, Продукта, Процеса, Проекта** (people, product, process and project) — **наредбата не е случайна** (хората са на първо място).\n- **Подценяването на човешкия фактор** може да застраши успешната реализация на всеки проект.\n- Производителността се повишава чрез **подходяща организация на колектива**, съобразена с **личностните характеристики** на хората.\n- **„Софтуерна психология“** — направление **на границата между инженеринга на софтуера и психологията**. Софтуерът се използва от хора → психологическите фактори се отчитат **както при производството, така и при използването** на софтуер.\n\n### PM-CMM модел\n- **CMM (Capability Maturity Model)** — на **Software Engineering Institute (SEI)**; подход за измерване на **глобалната ефективност** на дейностите в софтуерна организация чрез определяне на **нива на зрелост**.\n- **PM-CMM (People Management Capability Maturity Model)** — **разширение на CMM** (за управление на хората).\n\n### 1. Наемане на най-добрите специалисти\n- Нужна е **кадрова политика**, регламентираща: **назначаване и освобождаване**; **система от поощрения и наказания**; **правила за издигане в служебната йерархия**.\n- Софтуерът **не е изцяло производствена дейност**.\n- **Набиране на кадри (recruitment)** — всички дейности, насочени към **намиране и назначаване на най-подходящия кандидат** за определена длъжност.\n- **Вътрешно (internal recruitment)** — кандидати от самата организация. Техники: **информация за всички служители**, **вътрешен конкурс**, **назначаване по препоръки (employee referrals)**.\n- **Външно (external recruitment)** — техники: **връзки с университети**, **специализирани фирми**, **head-hunting** — привличане на висококвалифицирани специалисти, които **не са безработни**, а имат успешна кариера в **конкурентна организация**.\n\n### Психологически профили\n- **Психологически профил** — **съвкупност от индивидуални личностни качества**, смятани за важни за съответната професия. Създадени са модели на профил за програмисти.\n- **Не се препоръчва** изборът да се основава **изцяло** на психопрофила, защото: личностният психопрофил (се променя); **различни качества са ценни за различните позиции**; **тестовете могат да бъдат разучени предварително**.\n\n### Подход на Уейнбърг\n- Изследват се **само две** личностни характеристики: **адаптивност** и **устойчивост към стрес**.\n- **Адаптивност** — способност за **бързо приспособяване към изменящата се среда**.\n- Разработването на софтуер е **измежду десетте най-застрашени от стрес** занимания.\n- Стресови фактори (изследвания в **САЩ и Япония**): напрежение от сроковете; претовареност; недостатъчна почивка; много извънредна (вкл. нощна) работа; недостатъчно време за обучение; технически проблеми; много рутинна работа; проблеми в комуникацията с групата; проблеми с потребителите; неприятности след инсталиране на нов продукт; **нееднозначност на спецификациите**; малък шанс за собствени решения; ограничена индивидуална изява; неравномерно разпределение на работата; недостиг на квалифицирани членове; лоша среда за разработване; лоши условия за работа; ограничения в кариерата; неудовлетвореност от възнаграждението (връзка свършена работа — заплащане); **бърза промяна в хардуерните и софтуерните технологии**.\n- Индивидуалната устойчивост към стрес би осигурила **висока производителност**.\n\n### 2. Организация на колектива (Group organisation)\n- Групова дейност; гъвкавостта в състава на групата обикновено е **ограничена**.\n- **Демократична организация**: **консенсус**; лидерът е **външен интерфейс** на групата, **не разпределя** работни позиции; успешна в **малки групи**.\n- **Групи за екстремно програмиране (Extreme programming groups)** — **вариант на демократичната** организация: мениджърските решения се прехвърлят на различни членове; програмистите работят **по двойки** и приемат **колективна отговорност** за кода.\n- **Екипи с Главен програмист (Chief programmer teams)** — **най-широко използваната** организация. Ръководителят носи **пълната отговорност**, контролира **два ресурса**: **изпълнителите** и **изчислителните средства и програмни среди**. Основна задача — **контрол на изпълнението**. **Най-ефективно използва уменията и опита** на членовете. **Основен проблем: високият риск** — проектът се проваля, ако главният програмист (или заместникът му) не е на разположение.\n\n### Размер и състав на групата\n- Размер: **до (<) 8 члена**; по-големите проекти се **раздробяват** на по-малки.\n- Еднаква мотивация е проблематична → акцент на **ориентацията** на индивида. **Три типа ориентации**:\n  - **Task-oriented** — **работохолик**;\n  - **Self-oriented** — **егоцентрик, кариерист, лидер** като правило;\n  - **Interaction-oriented (колективисти)** — обичат да работят заедно;\n  - (плюс шеговито: **клюкари** — много приказки, малко работа).\n- Нужен е **баланс**; проблем: **повечето инженери са task-oriented**.\n- На хората с лидерска нагласа — по-сложни задачи и ръководни функции, но **твърде много такива в екипа е проблем**.\n- Добра практика: **всички членове участват във вземането на решения**, засягащи групата.\n- **Винберг (Weinberg)** — **„egoless“ програмиране**: всички модули са **обща собственост на екипа**; борба с **„когнитивния дисонанс“**, който вреди особено на **тестването**.\n\n### 3. Сплотеност на групата (Group cohesiveness)\n- Групата е сплотена, когато членовете смятат, че **групата е по-важна от всеки индивид**.\n- Предимства: **стандарти за групово качество**; **тясно сътрудничество**; **учат се един от друг**; **колективно програмиране**.\n- Влияе се от **организационната култура** и **личностите**. Насърчава се чрез **социални събития**, **team-building activities**, **отвореност на информацията**.\n- **Групова лоялност** — членовете са склонни да са лоялни към сплотените групи.\n- **„Групово мислене“ (Groupthink)** — **запазване на групата, независимо от технически или организационни съображения**.\n- Недостатъци на прекалена сплотеност: **не може да се смени ръководителят**; решения **без обсъждане на всички възможности**; **не се проверява** регулярно количеството и качеството на работата.\n- Срещу груповото мислене: **мозъчни атаки (brainstorm)**; **външни експерти** за паралелни проверки.\n\n### 4. Избор на ръководител (Chief programmer teams)\n- Ръководителят е **избиран или назначаван**; две групи условия: **обективни** и **субективни**.\n- Задължения: ясно определя задачите; дискутира проблемите с всички засегнати; разработва ясни процедури; **периодично оценява** работата на всеки; поддържа добри отношения с външни хора (снабдители, администратори, потребители, подизпълнители).\n- **Управленски профили — четири вида**: **насочващ, съветващ, подкрепящ, делегиращ**.\n- **Фактори на мотивацията**: възложената работа и начинът на възлагане; стилът на контрол и управление; хората, с които се работи; общуването с мениджъра; работната среда; организиране на проекти; средства за ежедневна работа; **възнаграждение и други ползи**.\n\n### 5. Комуникации в групата (Group communications)\n- Според **IBM** работното време: **50% комуникации**, **30% самостоятелна работа**, **20% други дейности**.\n- Две нива на комуникация: **делови контакти** (състояние на работата, проектни решения, промени) и **лични взаимоотношения**.\n- Зависят от **числеността**: при N членове възможните контакти са **M = N(N−1)/2** (порядък **N²/2**); **проблеми възникват още при N ≥ 4**.\n- И от **структурата**: статут, личности, състав (пол).\n- Комуникационни канали за деловите контакти:\n  - **Централизирани (чрез координатор)** — координаторът приема всички съобщения и пренасочва; **предпочитан за неголеми групи**.\n  - **Свободни (всеки със всеки)** — недостатък: **голям поток неструктурирана информация**.\n\n### 6. Сбирки и заседания\n- Сбирките поддържат **колективния стил**; **няма правила** за броя, типа и продължителността им.\n- **а) Планиране** — свиква се **само ако** проблемът не може да се реши с индивидуална среща, телефон или съобщения.\n- **б) Провеждане** — определя се **водещ**: открива (цели, начин на протичане), ръководи в конструктивен тон, спазва дневния ред и времето.\n- **в) Закриване** — когато свърши времето, изчерпи се дневният ред или няма ресурси; **задължително резюмиране** на резултатите и решенията и насрочване на следваща сбирка при нужда.\n\n### 7. Ергономика\n- **Цел**: да изследва и предложи **подходяща работна среда**, за да се използват човешките ресурси **най-ефективно**.\n- **1. Организацията на работното място** влияе **в най-голяма степен** на производителността: индивидуално пространство, мебелировка, оформление, **контролиран шум и температура**, чистота, помещение за почивка (кафе).\n- Изследване на **IBM** — минимум **9 кв. м обща площ** и **2,7 кв. м работна площ** на лице.\n- **2. Комуникационни, хардуерни и софтуерни средства** — подобряването им може да увеличи производителността **до 3 пъти**.\n- **3. Процедури за спомагателните дейности** — административни, финансово-счетоводни, снабдителски.\n\n### 8. Професионализъм и етично поведение\n- Случаи на съзнателно заблуждаване на клиенти за: извършена работа, продължителност/трудоемкост, степен на завършеност, качества на ПП, приложимост на продукта.\n- Последици от липса на етика: **лош имидж** на фирмата (застрашено съществуването ѝ) и **деформиране на специалиста като личност**.\n- **R. Thomsett** — **кодекс от 12 точки**. Примери: няма да поемам задължения, които не мога да изпълня; няма да се съгласявам с изисквания/срокове без обяснение на риска и документиране; **право да казвам „не“** с подробни обяснения (т. 7); няма да поставям личните си интереси над тези на клиента; ще отчитам работата честно; **няма да разкривам информация за клиента без изричното му разрешение** (т. 11); ще бъда пример за навлизащите в професията (т. 12).\n- **IEEE-CS Code of Ethics** — „Кодекс на етиката и професионалната практика в софтуерното инженерство“, **1999**, съвместно усилие на **IEEE Computer Society** и **ACM (Association for Computing Machinery)**; стандарт за обучение и практикуване.\n- **8 принципа**: 1. **Общество**; 2. **Клиент и работодател**; 3. **Продукт**; 4. **Преценка** (честни и **независими** в професионалното мнение); 5. **Управление** (мениджърите подкрепят етичния подход); 6. **Професия** (реномето на професията); 7. **Колеги**; 8. **Личност**.\n\n### Капани за изпита\n- **Уейнбърг** и **Винберг** в слайдовете са едно и също лице (Weinberg) — изписан по два начина.\n- **Chief programmer teams** = **най-широко използваната**; **демократичната** = за **малки** групи; **XP** = вариант на **демократичната**, не на главния програмист.\n- IBM: **50/30/20** (комуникации/самостоятелна/други) — не бъркай с **9 и 2,7 кв. м** и **до 3 пъти**.\n- **Thomsett — 12 точки**; **IEEE-CS — 8 принципа**, **1999**, IEEE CS + **ACM**.\n- **Групово мислене** ≠ групова лоялност; лекарства — brainstorm и външни експерти.\n- Ориентациите са **три** (task, self, interaction); „клюкари“ е допълнение.\n- Неточности в слайдовете: „трябва е до <8 члена“ (граматика); причината „личностният психопрофил“ е недописана (вероятно „се променя“); в принцип 6 е останало „***integrity***“; „PM-CMM“ е изписано с кирилско „РМ-СММ“.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L07-A-1", "n": 1, "text": "Кое от изброените **НЕ** е сред 4-те компонента, на които се базира управлението на софтуерните проекти?", "opts": ["Хората", "Процесът", "Цената", "Проектът"], "correct": 2, "expl": "Компонентите са хората, продукта, процеса и проекта"}, {"id": "L07-A-2", "n": 2, "text": "Какво е PM-CMM?", "opts": ["Разширение на CMM за управление на хората (People Management Capability Maturity Model)", "Модел на жизнения цикъл на софтуера", "Кодекс за етично поведение на софтуерните инженери", "Метод за оценка на трудоемкостта на проект"], "correct": 0, "expl": "PM-CMM е разширение на CMM на SEI"}, {"id": "L07-A-3", "n": 3, "text": "Според IBM каква част от работното време на софтуерните специалисти отива за комуникации?", "opts": ["20%", "30%", "50%", "70%"], "correct": 2, "expl": "IBM: 50% комуникации, 30% самостоятелна работа, 20% други"}, {"id": "L07-A-4", "n": 4, "text": "Кои две личностни характеристики предлага да се изследват подходът на Уейнбърг?", "opts": ["Интелигентност и креативност", "Адаптивност и устойчивост към стрес", "Лоялност и дисциплина", "Комуникативност и лидерство"], "correct": 1, "expl": "Адаптивност и устойчивост към стрес"}, {"id": "L07-A-5", "n": 5, "text": "Коя е най-широко използваната организация на колектива?", "opts": ["Демократичната организация", "Групите за екстремно програмиране", "Свободната организация „всеки със всеки“", "Екипите с Главен програмист (Chief programmer teams)"], "correct": 3, "expl": "Chief programmer teams е най-широко използваната"}, {"id": "L07-A-6", "n": 6, "text": "Колко са възможните контакти в група от 5 членове?", "opts": ["10", "20", "25", "5"], "correct": 0, "expl": "M = N(N−1)/2 = 5·4/2 = 10"}, {"id": "L07-A-7", "n": 7, "text": "Към коя категория техники спада head-hunting?", "opts": ["Вътрешно набиране на кадри", "Външно набиране на кадри", "Психологическо профилиране", "Управленски профил"], "correct": 1, "expl": "Head-hunting е техника за външно набиране"}, {"id": "L07-A-8", "n": 8, "text": "Каква е минималната обща площ на лице според изследването на IBM?", "opts": ["2,7 кв. м", "6 кв. м", "9 кв. м", "12 кв. м"], "correct": 2, "expl": "9 кв. м обща и 2,7 кв. м работна площ"}, {"id": "L07-A-9", "n": 9, "text": "От колко точки се състои кодексът за етично поведение на R. Thomsett?", "opts": ["8", "10", "7", "12"], "correct": 3, "expl": "Кодексът на Thomsett има 12 точки"}, {"id": "L07-A-10", "n": 10, "text": "Какво е „групово мислене“ (Groupthink)?", "opts": ["Запазване на групата, независимо от технически или организационни съображения", "Колективно вземане на решения чрез консенсус", "Мозъчна атака за генериране на идеи", "Колективна собственост върху кода"], "correct": 0, "expl": "Groupthink е запазване на групата независимо от съображенията"}], "B": [{"id": "L07-B-1", "n": 1, "text": "На границата между кои области е направлението „софтуерна психология“?", "opts": ["Психологията и социологията", "Инженеринга на софтуера и психологията", "Ергономиката и медицината", "Мениджмънта и икономиката"], "correct": 1, "expl": "Между инженеринга на софтуера и психологията"}, {"id": "L07-B-2", "n": 2, "text": "Към кой вид набиране на кадри спада назначаването на основа на препоръки (employee referrals)?", "opts": ["Външно набиране", "Head-hunting", "Набиране чрез специализирани фирми", "Вътрешно набиране"], "correct": 3, "expl": "Employee referrals е техника за вътрешно набиране"}, {"id": "L07-B-3", "n": 3, "text": "Кое от изброените **НЕ** е сред стресовите фактори, идентифицирани в изследванията в САЩ и Япония?", "opts": ["Нееднозначност на спецификациите", "Бърза промяна в хардуерните и софтуерните технологии", "Прекалено голям брой платени почивни дни", "Недостатъчно време за обучение"], "correct": 2, "expl": "Сред факторите е недостатъчната почивка, не излишъкът от нея"}, {"id": "L07-B-4", "n": 4, "text": "Какъв е препоръчителният размер на работната група?", "opts": ["До (под) 8 члена", "Между 10 и 15 члена", "Точно 4 члена", "Над 20 члена, за да има резерв"], "correct": 0, "expl": "Групата трябва да е до <8 члена"}, {"id": "L07-B-5", "n": 5, "text": "Как се наричат хората, които обичат да работят заедно?", "opts": ["Task-oriented", "Self-oriented", "Interaction-oriented (колективисти)", "Клюкари"], "correct": 2, "expl": "Interaction-oriented (колективисти)"}, {"id": уални личностни качества за професията"}, {"id": "L07-C-3", "n": 3, "text": "Коя от изброените техники **НЕ** се използва при външно набиране на кадри?", "opts": ["Връзки със съответните университети", "Услуги на специализирани фирми", "Head-hunting", "Вътрешен конкурс"], "correct": 3, "expl": "Вътрешният конкурс е техника за вътрешно набиране"}, {"id": "L07-C-4", "n": 4, "text": "Какво е характерно за лидера при демократичната организация на колектива?", "opts": ["Носи пълната отговорност и разпределя всички задачи", "Контролира изпълнителите и изчислителните ресурси", "Служи по-скоро като външен интерфейс на групата и не разпределя конкретни работни позиции", "Сменя се ежедневно чрез жребий"], "correct": 2, "expl": "Лидерът е външен интерфейс и не разпределя позиции"}, {"id": "L07-C-5", "n": 5, "text": "Какво е характерно за групите за екстремно програмиране?", "opts": ["Програмистите работят по двойки и приемат колективна отговорност за кода", "Цялата отговорност е на главния програмист", "Всеки програмист отговаря само за своя модул", "Групата е над 20 члена"], "correct": 0, "expl": "Работа по двойки и колективна отговорност за кода"}, {"id": "L07-C-6", "n": 6, "text": "Кой е основният проблем при екипите с Главен програмист?", "opts": ["Големият поток неструктурирана информация", "Високият риск — проектът се проваля, ако главният програмист (или заместникът му) не е на разположение", "Неефективното използване на уменията на членовете", "Липсата на контрол върху изпълнението"], "correct": 1, "expl": "Висок риск при отсъствие на главния програмист"}, {"id": "L07-C-7", "n": 7, "text": "Кое от изброените **НЕ** е предимство на сплотената група?", "opts": ["Могат да се разработят стандарти за групово качество", "Членовете се учат един от друг", "Може да се практикува колективно програмиране", "Ръководителят на групата не може да бъде сменен"], "correct": 3, "expl": "Невъзможността за смяна на ръководителя е недостатък"}, {"id": "L07-C-8", "n": 8, "text": "До колко пъти може да се увеличи производителността чрез подобряване на комуникационните, хардуерните и софтуерните средства?", "opts": ["1,5 пъти", "2 пъти", "3 пъти", "10 пъти"], "correct": 2, "expl": "Подобряването може да увеличи производителността до 3 пъти"}, {"id": "L07-C-9", "n": 9, "text": "Кои две групи условия се вземат предвид при определяне на ръководител на група?", "opts": ["Обективни и субективни", "Технически и финансови", "Вътрешни и външни", "Формални и неформални"], "correct": 0, "expl": "Обективни и субективни условия"}, {"id": "L07-C-10", "n": 10, "text": "Кои организации стоят зад IEEE-CS Code of Ethics?", "opts": ["ISO и IEC", "Software Engineering Institute и IBM", "ACM и ANSI", "IEEE Computer Society и Association for Computing Machinery (ACM)"], "correct": 3, "expl": "Съвместно усилие на IEEE Computer Society и ACM"}], "D": [{"id": "L07-D-1", "n": 1, "text": "Какво обхваща набирането на кадри (recruitment)?", "opts": ["Само провеждането на интервюта", "Обучението на новите служители", "Всички дейности, насочени към намиране и назначаване на най-подходящия кандидат за длъжността", "Освобождаването на неподходящи служители"], "correct": 2, "expl": "Всички дейности за намиране и назначаване на най-подходящия кандидат"}, {"id": "L07-D-2", "n": 2, "text": "Какво означава internal recruitment?", "opts": ["Кандидатурите са от самата организация", "Наемане чрез специализирани фирми", "Привличане на специалисти от конкурентни фирми", "Наемане на студенти от университети"], "correct": 0, "expl": "Кандидатурите са от самата организация"}, {"id": "L07-D-3", "n": 3, "text": "Коя е причина да **не** се основава изборът на специалисти изцяло на психологическия профил?", "opts": ["Профилите са твърде скъпи", "Профилите са забранени със закон", "Профилите са еднакви за всички хора", "Тестовете за психопрофил могат да бъдат разучени предварително"], "correct": 3, "expl": "Тестовете могат да бъдат разучени предварително"}, {"id": "L07-D-4", "n": 4, "text": "Какво се р яснения"}, {"id": "L07-E-6", "n": 6, "text": "Каква е целта на ергономиката?", "opts": ["Да намали заплатите на служителите", "Да изследва и предложи подходяща работна среда за най-ефективно използване на човешките ресурси", "Да определи психологическия профил на програмиста", "Да регламентира етичното поведение"], "correct": 1, "expl": "Подходяща работна среда за най-ефективно използване на хората"}, {"id": "L07-E-7", "n": 7, "text": "Кой ергономичен фактор влияе в най-голяма степен на производителността?", "opts": ["Процедурите за спомагателните дейности", "Финансово-счетоводните правила", "Наличието на кафе машини", "Организацията на работното място"], "correct": 3, "expl": "Организацията на работното място влияе в най-голяма степен"}, {"id": "L07-E-8", "n": 8, "text": "Каква е минималната работна площ на лице според изследването на IBM?", "opts": ["2,7 кв. м", "1,5 кв. м", "9 кв. м", "4 кв. м"], "correct": 0, "expl": "2,7 кв. м работна площ (9 кв. м обща)"}, {"id": "L07-E-9", "n": 9, "text": "Колко принципа съдържа IEEE-CS Code of Ethics?", "opts": ["12", "8", "5", "10"], "correct": 1, "expl": "8 принципа"}, {"id": "L07-E-10", "n": 10, "text": "При какъв брой членове на групата според лекцията възникват проблеми в комуникацията?", "opts": ["Само при N > 20", "При N ≥ 10", "При N ≥ 8", "Даже и при N ≥ 4"], "correct": 3, "expl": "Проблеми възникват даже и при N ≥ 4"}]}}, {"num": 8, "title": "Тема 8 — Софтуерни метрики", "short": "Софтуерни метрики", "summary": "### Съдържание на темата\n8.1 Измерването в софтуерното производство — структурен модел, основни понятия, скала за измерване; 8.2 Класификации на софтуерните метрики; 8.3 Примери за софтуерни метрики (LOC, Маккейб, Холстед, функционална плътност, Рехенберг, Джилб, гранични стойности, обръщения към глобални променливи, Чепин, стилистика и разбираемост); 8.4 Методологични проблеми.\n\n### Понятие „метрика“ и скали за измерване\n- **Метрика — мярка за оценка на качествена характеристика на програмния продукт (ПП).**\n- В СТ метриката има **двоен смисъл**: 1) **другото име на мярка** — резултат от измерването; 2) **процедура за намиране (измерване) и използване на мярката**. Като процедура → процес на измерване на характеристиките на обект и съпоставяне на стойностите им; когато стойностите са **числа**, измерването е **количествено**.\n- **Скали за измерване: номинална, рангова, интервална и относителна.**\n  - **Номинална** — според това дали характеристиката е **налична или отсъства** (пример: лесна, умерена, трудна за разбиране).\n  - **Рангова** — позволява **ранжиране (сравняване)** чрез сравняване с опорно значение (пример: Б > А > В).\n  - **Интервална („измервателна“)** — показва относителното положение на програмите и положението им една спрямо друга.\n  - **Относителна** — освен подреждане оценява и **разстоянието/отношението** (пример: **„Програмата А е 2 пъти по-трудна от Б“**).\n\n### Измерване в софтуерното производство\n- **Първата публикация за софтуерни метрики — 1968 г.** (количествено измерване на качеството на програмите).\n- Свойства на измерването: **Обективност** (независимо от това кой измерва), **Надеждност** (едни и същи условия → едни и същи резултати), **Валидност** (отразяват свойствата на измервания обект).\n- СМ се прилагат, ако: можем да измерим свойството; свойството е съществено и позволява изводи; връзката обект–свойство е потвърдена и може да се изведе **формула**.\n- Възможни проблеми: да се идентифицират характеристиките и да се дефинират (изчислителни) термини; да се определи скала и допустимите операции в статистическия смисъл.\n\n### Класификации на СМ\n- **I — по вид метрика (10):** LOC; Маккейб (структурна сложност); Холстед (текстуална сложност); функционална плътност; Рехенберг (технологична сложност); Джилб (логическа сложност); гранични стойности; обръщения към глобални променливи; Чепин (характер на използваните променливи); стилистика и разбираемост.\n- **II — според предназначението:** оценка на разходите и усилията за разработване; производителност на разработчика; качество на оценяването на софтуера; измерване и прогнозиране на **надеждността** на СС; изследване на програмни свойства.\n- **III — според целта на прилагане:** **характеризиране, оценяване, прогнозиране, подобряване**.\n- **IV — според изследвания обект:** **процеси** (дейности при създаване и използване), **продукти** (резултат от процесите — спецификации, проекти…), **ресурси** (елементи, входни данни за процесите).\n- **V — според начина на получаване на информация:** **регистрационен** (регистриране на събития — брой аварийни ситуации), **измервателен** (чрез измервателни средства), **възприятиен** (зрителни/слухови възприятия — звуков сигнал), **изчислителен** (теоретични и емпирични зависимости).\n- **VI — метрики за продукт „програма“:** по начин на изследване — **статични** (само текста на програмата) и **динамични** (изпълнението ѝ); по изследваната характеристика — сложност, модулност, текстируемост и др.; по ниво на декомпозиране — отделни програмни части / програмата като цяло.\n\n### Метрика за размера на програмата (LOC)\n- **Статична**; прилага се за отделен модул и за цялата програмна система.\n- **LOC = L1 + L2**, където **L1 — коментари и празни редове**, **L2 — същински програмен код в редове**.\n- Предимства: **проста, разбираема**. Недостатък: **по обема не може да се съди дали програмата е сложна или проста**.\n\n### Метрика на Маккейб за структурна (цикломатична) сложност\n- **Статична**; измерва **сложността на потока на управление**. Строи се **управляващ граф**: върховете са операторите, ребро — ако има предаване на управление.\n- **V(G) = e − n + 2p** (на слайда отпечатано „e – n - 2p“, но примерът изчислява с +2), където **V(G) — максималният брой линейно независими пътища**, **e — брой дъги**, **n — брой върхове**, **p — брой компоненти на свързаност** (понякога — броят дъги, които трябва да се добавят, за да стане графът **силно свързан**).\n- Пример: e = 10, n = 8, p = 1 → V(G) = 10 − 8 + 2 = **4**; след обединяване на върхове e = 8, n = 6 → пак **4** → **цикломатичното число не се изменя и зависи само от количеството на предикатите**. 4 линейно независими контура.\n- Недостатък: **не отчита дължината на линейните участъци и нивото на влагане** на управляващите структури.\n- Разширение — **метрика на Гонг-Шмид: C(G) = V(G) + E**, E — общата степен на вграждане (влагане) на управляващите структури.\n- Мярка за **вътрешномодулна сложност**. Препоръка: **V < 10**. **До 10 — прости**, **до 20 — средно сложни**, **30–50 — сложни**, **над 50 — да се обмисли преструктуриране**.\n\n### Метрика на Холстед за текстуална сложност\n- Предложена от **Холстед през 1976 г.**; **най-много публикации**; статична; за произволен език.\n- Програмата = **активни оператори** + **пасивни операнди** (операнди — константи или променливи; оператори — влияят върху стойностите или наредбата на операндите).\n- **n1 — брой уникални оператори**, **n2 — брой уникални операнди**, **N1 — общ брой оператори**, **N2 — общ брой операнди**.\n- **Речник: n = n1 + n2**; **Дължина: N = N1 + N2**; **изчислена (теоретична) дължина: N = n1·log2 n1 + n2·log2 n2**; **Обем: V = (N1 + N2)·log2(n1 + n2) = N·log2 n**; **Трудност: D = (n1/2)·(N2/n2)**; **Ниво: L = 1/D**; **Усилие: E = V·D**.\n- Преброяването се прави със (специални) лексически анализатори.\n- Приложимост: 1) оценка на **усилията** — сравнение с оптимална и максимална стойност → **3 групи: малки, средни, големи**; 2) **относително време: T = E/S = E/18** (индекс на интензивност на интелектуалните занимания **S = 18 — Гордън**); усилията за създаване на нова програма = усилията за разучаване на съществуваща; 3) откриване на грешки — показатели **B1 (грешки при изпитания)** и **B2 (грешки през ЖЦ)**; 4) **усилия за тестване = Nx·E** (Nx — индекс на нивото на влагане).\n\n### Метрика на Рехенберг за технологична сложност\n- Статична; за програми на **език от високо ниво**.\n- **CC = SC + EC + DC** — **комплексна сложност** = **операторна (SC)** + **на изразите (EC)** + **на данните (DC)**.\n- Относителни (NS — брой оператори): **RCC = CC/NS, RSC = SC/NS, REC = EC/NS, RDC = DC/NS** — за сравнение на програми с **различна дължина**.\n- За всеки тип оператор — мярка за сложност (пример: 1, цикъл — 3, **go to — 5**); влагането — чрез **коригиращ коефициент k = 1.5**.\n- Приложение: **прогнозиране на усилията за тестване и съпровождане**.\n\n### Метрика на Джилб за логическа сложност\n- **Проста, „фиктивна“ оценка** на сложността; отчита честотата на изрази **If-Then-Else (If-Then)**.\n- **GL** — абсолютна стойност (количество условни оператори); **gl = GL/Op** — относителна (наситеност с условни оператори), **Op — общ брой оператори**.\n\n### Метрика на граничните стойности\n- G = (V, E) — ориентиран граф с **единствен начален и краен връх**; на всеки тип връх — коефициент на сложност:\n  - **начален** — 1 изход, **k = 0**; **краен** — 1 вход, **k = 0**; **приемащ** — 1 вход и 1 изход, **k = 1**; **обратна връзка (цикъл)** — **k = 2**; **алтернативен** — изходите са поне с 1 повече от входовете; сложността му зависи от подграфа, който започва от него.\n- Коригираща сложност на алтернативен връх: **Sk = Σ ki** (i = 1..n).\n- **Абсолютна гранична сложност: Sa = Σ lj** (j = 1..m, всички върхове вкл. алтернативните).\n- **Относителна гранична сложност: S0 = 1 − (V − 1)/Sa**, V — общо количество върхове.\n- Графът се разбива на **максимален брой подграфи**, входът в които става чрез **алтернативни върхове**.\n\n### Метрики за сложност на потока от данни\n- Делят се на: **А) базирани на обръщения към глобалните променливи** и **Б) метрики на Чепин**.\n- **А.** Двойка (p, r) — модул p достъпва глобална променлива r. **Фактически** (реални) и **възможни** (теоретично възможни) обръщения. Сложност = фактически/възможни, **≤ 1** — приблизителна **вероятност** произволен модул да се обърне към произволна променлива.\n- **Б. Чепин — 4 функционални групи:** **P — за извеждане**, **M — модифицируеми (създадени в програмата)**, **C — управляващи**, **T — паразитни (неизползвани)**.\n- **Q = a1·P + a2·M + a3·C + a4·T**, a1..a4 — тегловни коефициенти. **Най-голямо тегло има C (управляващите)**; T не увеличава сложността на потока от данни, но затруднява разбирането.\n\n### Метрика за стилистика и разбираемост\n- Читаемостта осигурява: 1) обслужване без участие на производителите; 2) корекции с минимално участие и достъп до широк кръг потребители.\n- Най-проста метрика — **ниво на коментарите: F = Nком / Nоп** (коментарни редове / общ брой оператори/редове). **F ≥ 0.1 — на всеки 10 реда 1 коментар.**\n- При разбиване на n равни части: **Fi = Nком,i/Nоп,i − 0.1**, **F = Σ Fi**; **F >> 0 — пренасищане с коментари**, **F << 0 — липса на коментари**.\n- Четимост на документи: **F = 0.4·(lm + plw)** (на слайда „*“), lm — средна дължина на изречение, plw — думи/изречения. **Боем: 10 < F < 12 — делови документи; 12 < F < 16 — спецификации, документация, научни отчети.**\n\n### Методологични проблеми\nУчастниците в разработките **нямат добра теоретична подготовка**; немислимо е използването на СМ в реални сложни проекти **без инструментални средства**.\n\n### Капани за изпита\n- Маккейб — **структурна**, Холстед — **текстуална**, Рехенберг — **технологична**, Джилб — **логическа** сложност; Чепин — **характер на използваните променливи**.\n- Маккейб: слайдът пише **V(G) = e − n − 2p** (печатна грешка), примерът ползва **+2p**; в примера V = 8 означава **върхове**, не цикломатично число. Скалата има празнина „до 20 / от 30 до 50“.\n- Холстед: **n** (малки) — уникални, **N** (големи) — общ брой; **D = (n1/2)·(N2/n2)**, **L = 1/D**, **E = V·D**, **T = E/18** (Гордън).\n- Гонг-Шмид: **C(G) = V(G) + E** — добавя влагането, което Маккейб не отчита.\n- Рехенберг: пример „цикъл — 1, цикъл — 3“ на слайда е повтарящ се текст; сигурни са **go to = 5** и **k = 1.5**.\n- Гранични стойности: начален и краен **k = 0**, приемащ **k = 1**, обратна връзка **k = 2**.\n- Скалите: в списъка е „интервална“, но в описанието е наречена „измервателна“.\n- Чепин: най-голямо тегло — **C**, паразитните са **T**; P на слайда е „за извеждане“.\n- Боем: формулата за четимост на слайда е с „*“ (0.4·(lm * plw)), класически е сума.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L08-A-1", "n": 1, "text": "Как е дефинирана метриката в лекцията?", "opts": ["Програмно средство за автоматично тестване", "Мярка за оценка на качествена характеристика на програмния продукт", "Стандарт за документиране на изходния код", "Модел на жизнения цикъл на софтуера"], "correct": 1, "expl": "Метрика — мярка за оценка на качествена характеристика на ПП"}, {"id": "L08-A-2", "n": 2, "text": "Коя метрика оценява структурната (цикломатичната) сложност на програмата?", "opts": ["Метриката на Холстед", "Метриката на Джилб", "Метриката на Рехенберг", "Метриката на Маккейб"], "correct": 3, "expl": "Маккейб — структурна (цикломатична) сложност"}, {"id": "L08-A-3", "n": 3, "text": "Управляващ граф има e = 12 дъги, n = 10 върха и p = 1 компонента на свързаност. Колко е цикломатичното число V(G)?", "opts": ["4", "3", "22", "2"], "correct": 0, "expl": "V(G) = e − n + 2p = 12 − 10 + 2 = 4"}, {"id": "L08-A-4", "n": 4, "text": "Как се изчислява метриката LOC?", "opts": ["LOC = L1 · L2", "LOC = L2 − L1", "LOC = L1 + L2, където L1 са коментари и празни редове, а L2 — същински код", "LOC = L2 / L1"], "correct": 2, "expl": "LOC = L1 + L2"}, {"id": "L08-A-5", "n": 5, "text": "Какво означава n1 в метриката на Холстед?", "opts": ["Общ брой оператори в програмата", "Брой уникални оператори", "Брой уникални операнди", "Общ брой операнди в програмата"], "correct": 1, "expl": "n1 — уникални оператори; N1 — общ брой"}, {"id": "L08-A-6", "n": 6, "text": "Коя от изброените НЕ е функционална група променливи по Чепин?", "opts": ["Глобални (G)", "Управляващи (C)", "Модифицируеми (M)", "Паразитни (T)"], "correct": 0, "expl": "Групите са P, M, C, T — няма група „глобални“"}, {"id": "L08-A-7", "n": 7, "text": "През ": "L08-C-10", "n": 10, "text": "Кои са групите на класификацията на СМ според целта на прилагане?", "opts": ["Процеси, продукти, ресурси", "Характеризиране, оценяване, прогнозиране, подобряване", "Статични и динамични", "Сложност, модулност, текстируемост"], "correct": 1, "expl": "Класификация III — според целта на прилагане"}], "D": [{"id": "L08-D-1", "n": 1, "text": "Какви са двата смисъла на понятието „метрика“ в софтуерните технологии?", "opts": ["Стандарт и норматив", "Тест и верификация", "Другото име на мярка (резултат от измерването) и процедура за намиране и използване на мярката", "Модел и прототип"], "correct": 2, "expl": "Мярка (резултат) и процедура за намиране и използване на мярката"}, {"id": "L08-D-2", "n": 2, "text": "Как се изчислява речникът на програмата по Холстед?", "opts": ["n = n1 + n2", "N = N1 + N2", "n = n1 · n2", "N = n1 · log2 n1 + n2 · log2 n2"], "correct": 0, "expl": "Речник n = n1 + n2; дължина N = N1 + N2"}, {"id": "L08-D-3", "n": 3, "text": "Модул има цикломатична сложност 60. Какво се препоръчва?", "opts": ["Модулът е прост, не са нужни промени", "Модулът е средно сложен", "Да се добавят коментари", "Да се обмисли преструктуриране"], "correct": 3, "expl": "Над 50 — да се обмисли преструктуриране"}, {"id": "L08-D-4", "n": 4, "text": "Какъв е основният недостатък на метриката на Маккейб?", "opts": ["Не може да се изчисли за програми с цикли", "Не отчита дължината на линейните участъци и нивото на влагане на управляващите структури", "Изисква изпълнение на програмата", "Зависи от езика за програмиране"], "correct": 1, "expl": "Не отчита линейните участъци и влагането"}, {"id": "L08-D-5", "n": 5, "text": "Как се нарича метод на получаване на информация чрез регистриране на определени събития, например брой аварийни ситуации?", "opts": ["Измервателен", "Възприятиен", "Изчислителен", "Регистрационен"], "correct": 3, "expl": "Регистрационен — чрез регистриране на събития"}, {"id": "L08-D-6", "n": 6, "text": "Програма има CC = 60 и NS = 20 оператора. Колко е относителната комплексна сложност RCC по Рехенберг?", "opts": ["3", "80", "40", "1200"], "correct": 0, "expl": "RCC = CC/NS = 60/20 = 3"}, {"id": "L08-D-7", "n": 7, "text": "Какво показва стойност F >> 0 при метриката за ниво на коментарите, изчислена по части?", "opts": ["Липса на коментари", "Оптимално ниво на коментари", "Пренасищане с коментари", "Няма коментарни редове"], "correct": 2, "expl": "F >> 0 — пренасищане; F << 0 — липса"}, {"id": "L08-D-8", "n": 8, "text": "Как се определя нивото на програмата L по Холстед?", "opts": ["L = V · D", "L = 1/D", "L = N1 + N2", "L = E/18"], "correct": 1, "expl": "L = 1/D"}, {"id": "L08-D-9", "n": 9, "text": "Каква сложност има връх с обратна връзка (цикъл) в метриката на граничните стойности?", "opts": ["0", "1", "5", "2"], "correct": 3, "expl": "Обратна връзка (цикъл) — k = 2"}, {"id": "L08-D-10", "n": 10, "text": "За какво се прилага метриката на Рехенберг?", "opts": ["За прогнозиране на усилията за тестване и съпровождане", "За измерване на четимостта на документи", "За оценка на нивото на коментарите", "За броене на редовете код"], "correct": 0, "expl": "Прогнозиране на усилията за тестване и съпровождане"}], "E": [{"id": "L08-E-1", "n": 1, "text": "Коя скала оценява характеристика според това дали тя е налична или отсъства?", "opts": ["Рангова", "Номинална", "Относителна", "Интервална"], "correct": 1, "expl": "Номинална — наличие или отсъствие на характеристиката"}, {"id": "L08-E-2", "n": 2, "text": "Каква е формулата за усилието за създаване E по Холстед?", "opts": ["E = V/D", "E = n1 + n2", "E = V · D", "E = N · log2 n"], "correct": 2, "expl": "E = V·D"}, {"id": "L08-E-3", "n": 3, "text": "Как се изчислява метриката на Чепин?", "opts": ["Q = P + M + C + T", "Q = (P + M)/(C + T)", "Q = P · M · C · T", "Q = a1·P + a2·M + a3·C + a4·T"], "correct": 3, "expl": "Q = a1·P + a2·M + a3·C + a4·T с тегловни коефициенти"}, {"id": "L08-E-4", "n": 4, "text": "Колко е относителното време T за създаване на програма с усилие E = 1800 по Холстед и Гордън?", "opts": ["100", "18", "1782", "32400"], "correct": 0, "expl": "T = E/18 = 1800/18 = 100"}, {"id": "L08-E-5", "n": 5, "text": "Кое от изброените НЕ е метрика от класификация I на софтуерните метрики?", "opts": ["Метрика на Чепин", "Метрика на граничните стойности", "Метрика на Джилб", "Метрика на Боем за цикломатична сложност"], "correct": 3, "expl": "Цикломатичната сложност е на Маккейб; Боем е свързан с четимостта на документи"}, {"id": "L08-E-6", "n": 6, "text": "Какви според Боем трябва да са стойностите на F за четимост на спецификации, документация и научни отчети?", "opts": ["10 < F < 12", "12 < F < 16", "F ≥ 0.1", "F < 10"], "correct": 1, "expl": "Боем: 12 < F < 16 за спецификации; 10 < F < 12 за делови документи"}, {"id": "L08-E-7", "n": 7, "text": "Какво представляват статичните метрики в класификация VI?", "opts": ["Изследват изпълнението на програмата", "Измерват производителността на разработчика", "Изследват само текста на програмата", "Регистрират аварийните ситуации"], "correct": 2, "expl": "Статични — само текстът; динамични — изпълнението"}, {"id": "L08-E-8", "n": 8, "text": "Програма има L1 = 200 реда коментари и празни редове и L2 = 800 реда същински код. Колко е LOC?", "opts": ["600", "1000", "4", "160000"], "correct": 1, "expl": "LOC = 200 + 800 = 1000"}, {"id": "L08-E-9", "n": 9, "text": "Какво показват показателите B1 и B2 в приложението на метриката на Холстед?", "opts": ["B1 — брой уникални оператори, B2 — брой уникални операнди", "B1 — обем, B2 — трудност", "B1 — брой коментари, B2 — брой редове", "B1 — брой грешки при изпитания, B2 — брой грешки през жизнения цикъл"], "correct": 3, "expl": "B1 — грешки при изпитания; B2 — грешки през ЖЦ"}, {"id": "L08-E-10", "n": 10, "text": "Какъв е основният методологичен проблем при използването на софтуерните метрики?", "opts": ["Участниците нямат добра теоретична подготовка, а без инструментални средства използването им в сложни проекти е немислимо", "Метриките са забранени от стандартите", "Метриките работят само за малки програми", "Метриките не могат да се изразят числено"], "correct": 0, "expl": "Липса на теоретична подготовка и нужда от инструментални средства"}]}}, {"num": 9, "title": "Тема 9 — Цена на софтуера", "short": "Цена на софтуера", "summary": "### Необходимост, история и ползи\n- Оценка на разходите за разработка (**Software Cost Estimation**).\n- **Първият метод** за оценяване на разходите — на **Systems Development Corporation (SDC), 1965 г.**\n- **1981 г.** — фундаменталната разработка на **Боем — COCOMO** (COst COnstructive Model / **Constructive Cost Model**).\n- **Ползи** от намирането на цената (освен самата цена): **избор на проект** за реализация; **определяне състава на колектива**; **определяне на маркетинговата политика**; **оценяване работата на членовете на колектива**.\n\n### Критерии (формулирани от Боем) — 10 на брой\n1. **Определеност** — възможност за **количествено определяне** на началните данни и крайните резултати.\n2. **Точност** — съответствие между **предсказаната** и **реално получената** цена. **Няма универсални модели** — всеки работи най-добре за определен клас продукти; извън него точността рязко се влошава → **настройка** (промяна на базовите уравнения, добавяне/премахване на фактори).\n3. **Обективност** — максимално избягване на **субективния фактор**.\n4. **Детайлност** — по-подробен модел → по-адекватен, но по-скъп; търси се компромис. В COCOMO решено с **3 версии: базова, междинна, детайлна**.\n5. **Устойчивост** — границите на успешно приложение: **DOTY е неприложим над 10 000 реда** първичен код; **COCOMO е неустойчив при малки проекти до 2 000 реда**. Причина: моделите са създадени въз основа на **големи и много големи** проекти.\n6. **Област на приложение** — всеки модел ясно я определя: **PRICE S → аерокосмически софтуер**; **функционалните точки → информационни системи и бизнес приложения**.\n7. **Конструктивност** — възможност за **анализиране и обяснение** на резултатите; също — различни резултати според това на кой фактор потребителят придава по-голямо значение.\n8. **Простота на прилагане** — трудност на разбирането/получаването на входните данни и на изпълнението на процедурите.\n9. **Предсказуемост** — оценка **колкото може по-рано**; напр. COCOMO се основава на **брой редове първичен код**, който **не е лесно предсказуем** в началната фаза.\n10. **Икономичност** — компромисна: малко и лесно измерими входни данни, но не прекалено малко (фатална неточност). При смяна на областта някои фактори стават толкова взаимосвързани, че могат да отпаднат → по-икономичен модел.\n\n### COCOMO — цели и развитие\n- Цел: за всеки планиран проект да се оцени **цената (трудоемкостта в човекомесеци, ЧМ)** и **срокът на разработване**.\n- Идея: използване на **броя редове първичен код**.\n- Развитие чрез: **3 нива на подробност**; **3 типа разработване**; **коригиращи коефициенти** за определящите параметри.\n\n### COCOMO — базови формули\n- **ЧМ = 2.4 × ХРПК^1.05** — ЧМ = човекомесеци, **ХРПК = хиляди реда първичен код = KLOC** (Kilo Lines of Code).\n- **Производителност на труда = ХРПК / ЧМ**.\n- **В = 2.5 × ЧМ^0.38** — срок на разработване **в месеци**.\n- **Екип = ЧМ / В** — брой хора.\n- **Предположения**:\n  - а) редовете **се броят без коментарните**, отнасят се за **крайния продукт**, **не включват стандартните програми**;\n  - б) включват се само фазите **проектиране, програмиране и оценка** (вкл. управление и документиране през тях);\n  - в) **не се включват обучението, планирането и инсталирането** при потребителя;\n  - г) включва се трудът на **проектантите и програмистите**, но **не** на компютърните оператори, висшите ръководители и секретарките;\n  - д) **1 човекомесец = 19 дни = 152 часа**;\n  - е) продуктът е по **SRS** без сериозни промени след това — **не се включва еволюцията**;\n  - ж) двете страни (потребител и разработчик) са **добросъвестни**.\n\n### COCOMO — пример\n- 32 000 реда (32 ХРПК): **ЧМ = 2.4 × 32^1.05 ≈ 91**; **В = 2.5 × 91^0.38 ≈ 14 месеца**.\n- **Производителност = 32 000 / 91 ≈ 352 реда/ЧМ**; **Екип = 91 / 14 = 6.5** → тълкуване: **най-малко 7 човека** заети през всичките 14 месеца.\n- **Производителността намалява с нарастване на размера** на проекта — естествено.\n\n### COCOMO — усъвършенстване\n- а) **3 типа софтуерни проекти** (таблицата на слайда е изображение; в класическия COCOMO: **органичен (обикновен)**, **полунезависим (междинен)**, **вграден**). Коефициентите от текста: **к = 2.4, 3.0, 3.6** и **р = 1.05, 1.12, 1.20** — различни за различните типове (2.4 / 1.05 са на базовата формула).\n- б) Допълнителни фактори → **междинен (COCOMO intermediate)** и **детайлен (COCOMO detailed)** модел с атрибути и рейтинги.\n- **4 групи оценявани атрибути (общо 15)**:\n  - **на продукта** (3): изисквана надеждност, размер на базата данни, сложност на продукта;\n  - **на компютъра** (4): ограничение по бързина, ограничение по оперативна памет, изменяемост на виртуалната машина, цикъл на обръщение към компютъра;\n  - **на изпълнителя** (5): квалификация на проектантите, опит в приложната област, квалификация на програмистите, опит от работа с компютъра, опит с езика за програмиране;\n  - **на проекта** (3): прилагане на съвременни методи, ползване на инструментални средства, ограничения в срока на разработка.\n- Рейтинги: **много нисък, нисък, нормален, висок, много висок, свръхвисок**; **нормалният рейтинг = 1.00**.\n- Формула: **ЧМ = к × ХРПК^р × A1 × A2 × … × A15** — рейтингите **се умножават**.\n- **Детайлен вариант** — различни коригиращи коефициенти **за всяка фаза**; оценява се **отдолу нагоре: модули → подсистеми → цял продукт**.\n- **Междинен вариант** — **нивото модул се игнорира**, таблицата с атрибути е **една единствена**.\n\n### Критика на „редове първичен код“\n- Основна критика: **няма стандарт какво е „ред първичен код“** и **трудно се предсказва в ранен етап**.\n- Проблеми:\n  - а) **физически или логически редове** — физическият край е с **Enter**; логическият — **ограничител** според езика (двоеточие, запетая…). САЩ: **35% броят физическите, 15% — логическите, 50% — не броят изобщо**.\n  - б) **какви типове оператори** — 4 типа: **изпълними, декларации на данни, коментари, празни редове**. Бизнес приложение: **40% изпълними, 35% декларации, 15% коментари, 10% празни**; системен софтуер (ОС): **45 / 30 / 15 / 10**. Сред разработчиците: **10%** броят само изпълнимите, **20%** изпълними + декларации, **15%** добавят коментарите, **5%** дори празните, **50%** не броят.\n  - в) **повторно използваемият код** — процедурни езици: копира се **20–30%**; ОО (C++): **до 50%**; фирми със специални библиотеки: **до 75%**. Как да се брои модул: при всяко появяване (**25%**), само веднъж (**20%**), изобщо не (**останалите, 55%**).\n  - г) **код на повече от един език** — около **1/3** от софтуера в САЩ.\n  - д) временен код, макроси, код за управление на заданието в ОС.\n- COCOMO се прилага въпреки това: няма по-адекватен метод; огромни усилия за нови методи.\n- **COCOMO 2.0** — размерът се определя **както чрез редове първичен код, така и чрез метода на функционалните точки („обектни точки“)**; онлайн калкулатор в csse.usc.edu.\n\n### Метод на функционалните точки (МФТ)\n- **1979 г., Олбрихт (Albrecht)** в съавторство с **Гафни (Gaffney)** (на слайда изписано „Гафмей“).\n- Мотив: **недостатъците на LOC** — трудна ранна определяемост и липса на единно виждане.\n- Идея: **усилията се определят от функционалността**, измерена във **функционални точки (ФТ)**.\n- **Предимство**: ФТ се определят само от **първоначални документи като SRS** → **ранна оценка**.\n- **5 непресичащи се функционални типа**, всеки с **3 нива на сложност (просто, средно, сложно)**:\n  1. **Външен входен тип (External Input Type)** — потребителски входен управляващ поток или поток от данни;\n  2. **Външен изходен тип (External Output Type)** — изходен поток, който **напуска външната граница** на приложението (съобщения, изходни отчети);\n  3. **Вътрешен логически файлов тип (Internal Logical File Type)** — съществена група потребителски данни или управляваща информация;\n  4. **Външен интерфейсен файлов тип (External Interface File Type)** — файл, **предаван или ползван съвместно от две или повече приложения**;\n  5. **Външен справочен тип (External Inquiry Type)** — комбинация вход/изход, при която **входът предизвиква незабавен изход**; сложността му = **по-голямата** от сложностите на входната и изходната част.\n- Тегла (таблицата на слайда е изображение; класически по Олбрихт, просто/средно/сложно): вход **3/4/6**, изход **4/5/7**, вътрешен файл **7/10/15**, интерфейсен файл **5/7/10**, справка **3/4/6**.\n- **Процедура**: (1) преброяват се елементите на 5-те типа; (2) за всеки се определя нивото на сложност; (3) таблица — бройка × тегло, сума по ред; сумата от 5-те реда = **FC — ненастроени функционални точки (Unadjusted Function Points)**.\n- **14 характеристики**, всяка оценена **от 0 до 5** (0 — не влияе, 1 — незначително, 2 — умерено, 3 — средно, 4 — значително, 5 — силно). Сред тях: комуникационни линии, разпределена обработка, висока ефективност, силно натоварена конфигурация, висока интензивност на транзакциите, интерактивно въвеждане, ефективност за потребителя, интерактивно актуализиране, сложна логика, повторна използваемост, лесно инсталиране, лесна експлоатация, разнообразни потребители, гъвкавост/лесна модификация.\n- **PC (processing complexity)** = сума на 14-те стойности → **[0, 70]**.\n- **PCA = 0.65 + 0.01 × PC** → **[0.65, 1.35]** — коригира FC с **±35%**.\n- **FP = FC × PCA** — **настроени функционални точки (Adjusted Function Points)**.\n- Използване: (1) цена на разработване (при статистика — цена на 1 ФТ); (2) изводи по статистика за ФТ по **организации** и **професии** (САЩ).\n\n### Други модели\n- **Doty** — наподобява COCOMO, **2 формули**: ЧМ = 5.288 × ХРПК^1.047 при ХРПК < 10; ЧМ = 2.060 × ХРПК^1.047 × f1 × … × f14 при ХРПК ≥ 10; атрибутите fi са **само с по 2 възможни стойности**.\n- **SPQR** (Software Productivity, Quality, and Reliability) — **Кейпърс Джоунс (1985)**; **20 добре дефинирани и 25 недостатъчно добре дефинирани фактора**; определят се чрез дискусия с потребителите (**100 въпроса**); **с 90% вероятност точност ±15%**; **не е достатъчно добре документиран**.\n- **ESTIMACS** — автор **Рубин**; основно **интервюиране на разработчиците**, оценка на усилията, разходите за колектива, хардуерната конфигурация и **риска**; претенция за точност **в границите на 15%**.\n- **BANG** — **Де Марко**; от типа на функционалните точки, но **разработен независимо от Олбрихт**; цел — **системен софтуер и научни приложения**; по-широко множество от фактори → **по-трудно приложим**: функционални примитиви (неделими функционални единици), модифицирани функционални примитиви, елементи от данни (входни, изходни, в паметта), обекти (entities), връзки (relationships).\n\n### Оценяване при ОО подход\n- **Jones**: при ОО разработка е **неподходящо** да се ползват модели, базирани на **брой редове код**; **методът на функционалните точки е приемливо приложим**.\n- **Всички** специални модели за ОО оценка са **базирани на функционалните точки**.\n- Известни: **MOOSE** (Metric for Object-Oriented System Environment) — **1993, Кемерер (Kemerer)**; **модел на Снийд**; **модел на Боем на база COCOMO 2.0 и обектни точки (object points)**.\n\n### Капани за изпита\n- **Базово COCOMO**: ЧМ = **2.4**·ХРПК^**1.05**; В = **2.5**·ЧМ^**0.38** — не бъркай 2.4 (трудоемкост) с 2.5 (срок), нито 1.05 с 0.38.\n- **ХРПК = хиляди** реда (KLOC) — 32 000 реда → 32.\n- Екип 6.5 → **„най-малко 7 човека“**.\n- **1 ЧМ = 19 дни = 152 часа**.\n- COCOMO неустойчив **под 2 000** реда; DOTY неприложим **над 10 000** реда.\n- **PRICE S** → аерокосмически софтуер; **ФТ (Олбрихт)** → информационни/бизнес системи; **BANG (Де Марко)** → системен и научен софтуер.\n- FC = **ненастроени** (unadjusted), FP = **настроени** (adjusted); PC ∈ [0, 70], PCA ∈ [0.65, 1.35], ±35%.\n- Междинен COCOMO — **без нивото модул**, една таблица; детайлен — **по фази** и **модул → подсистема → продукт**.\n- Повторно използван код: процедурни 20–30%, ОО 50%, библиотеки 75%.\n- **Несъответствия в слайдовете**: COCOMO е изписано на кирилица „СОСОМО“ и разшифровано веднъж като „COst COnstructive Model“, а другаде — „Constructive Cost Model“; в Doty степента е отпечатана като „1047“ (т.е. **1.047**); критиката на LOC е въведена „в следните 2 аспекта“, но са номерирани 3 точки; DOTY е „неприложим над 10 000 реда“, а има отделна формула за ХРПК ≥ 10; таблиците с 3-те типа проекти, теглата на ФТ и рейтингите са изображения/разбъркани в текста — имената на типовете и теглата по-горе са класическите стойности.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L09-A-1", "n": 1, "text": "Кой е предложил модела COCOMO и през коя година?", "opts": ["Олбрихт, 1979 г.", "Боем, 1981 г.", "Де Марко, 1985 г.", "Кейпърс Джоунс, 1965 г."], "correct": 1, "expl": "COCOMO — Боем, 1981 г."}, {"id": "L09-A-2", "n": 2, "text": "Каква е формулата за трудоемкостта в базовия модел COCOMO?", "opts": ["ЧМ = 2.5 × ХРПК^0.38", "ЧМ = 3.6 × ХРПК^1.20", "ЧМ = 2.4 × ХРПК^1.05", "ЧМ = 5.288 × ХРПК^1.047"], "correct": 2, "expl": "ЧМ = 2.4 × ХРПК^1.05"}, {"id": "L09-A-3", "n": 3, "text": "На колко дни (часа) се приема, че е равен един човекомесец в COCOMO?", "opts": ["22 дни или 176 часа", "20 дни или 160 часа", "21 дни или 168 часа", "19 дни или 152 часа"], "correct": 3, "expl": "1 ЧМ = 19 дни = 152 часа"}, {"id": "L09-A-4", "n": 4, "text": "Кой от изброените НЕ е критерий, формулиран от Боем, за модел за оценка на цената?", "opts": ["Мащабируемост", "Определеност", "Устойчивост", "Конструктивност"], "correct": 0, "expl": "Мащабируемост не е сред 10-те критерия"}, {"id": "L09-A-5", "n": 5, "text": "Проект е оценен на ЧМ = 60 човекомесеца при срок В = 12 месеца. Колко души е необходимият екип?", "opts": ["72", "5", "720", "0.2"], "correct": 1, "expl": "Екип = ЧМ / В = 60 / 12 = 5"}, {"id": "L09-A-6", "n": 6, "text": "Колко функционални типа се използват в метода на функционалните точки?", "opts": ["3", "4", "5", "14"], "correct": 2, "expl": "5 непресичащи се функционални типа, всеки с 3 нива на сложност"}, {"id": "L09-A-7", "n": 7, "text": "В какъв интервал е коригиращият коефициент PCA?", "opts": ["[0, 70]", "[0.65, 1.35]", "[0, 1]", "[0.35, 1.65]"], "correct": 1, "expl": "PCA = 0.65 + 0.01·PC, PC ∈ [0, 70] → [0.65, 1.35]"}, {"id": "L09-A-8", "n": 8, "text": "За кой клас софтуер е предназначен моделът PRICE S?", "opts": ["Аерокосмически софтуер", "Бизнес приложения", "Научни приложения", "Операционни системи"], "correct": 0, "expl": "PRICE S — аерокосмически софтуер"}, {"id": "L09-A-9", "n": 9, "text": "Кой е авторът на модела SPQR?", "opts": ["Рубин", "Кемерер", "Де Марко", "Кейпърс Джоунс"], "correct": 3, "expl": "SPQR — Кейпърс Джоунс, 1985 г."}, {"id": "L09-A-10", "n": 10, "text": "На какво са базирани всички специално разработени модели за оценка при ОО разработка?", "opts": ["На броя редове първичен код", "На модела Doty", "На функционалните точки", "На интервюиране на разработчиците"], "correct": 2, "expl": "Всички ОО модели са базирани на функционалните точки"}], "B": [{"id": "L09-B-1", "n": 1, "text": "Кой е първият метод за оценяване на разходите по производство на програмен продукт?", "opts": ["На Systems Development Corporation, 1965 г.", "COCOMO на Боем, 1981 г.", "Методът на функционалните точки, 1979 г.", "SPQR, 1985 г."], "correct": 0, "expl": "Първият метод — Systems Development Corporation, 1965 г."}, {"id": "L09-B-2", "n": 2, "text": "Каква е формулата за срока на разработване В (в месеци) в базовия COCOMO?", "opts": ["В = 2.4 × ЧМ^1.05", "В = ЧМ / Екип^0.38", "В = ХРПК / ЧМ", "В = 2.5 × ЧМ^0.38"], "correct": 3, "expl": "В = 2.5 × ЧМ^0.38"}, {"id": "L09-B-3", "n": 3, "text": "Под каква граница COCOMO се счита за неустойчив?", "opts": ["До 10 000 реда първичен код", "До 2 000 реда първичен код", "До 32 000 реда първичен код", "До 500 реда първичен код"], "correct": 1, "expl": "COCOMO е неустойчив при малки проекти до 2 000 реда"}, {"id": "L09-B-4", "n": 4, "text": "Кой критерий изисква максимално избягване на субективния фактор при оценяването?", "opts": ["Определеност", "Точност", "Обективност", "Предсказуемост"], "correct": 2, "expl": "Обективност — избягване на субективния фактор"}, {"id": "L09-B-5", "n": 5, "text": "Сумата от 14-те характеристики е PC = 42. Колко е PCA?", "opts": ["1.07", "0.42", "1.42", "0.77"], "correct": 0, "expl": "0.65 + 0.01 × 42 = 1.07"}, {"id": "L09-B-6", "n": 6, "text": "Как се нарича сумата от петте реда в таблицата на функционалните типове, преди корекцията?", "opts": ["FP — настроени функционални точки", "PCA — коригиращ коефициент", "PC — сложност на обработката", "FC — ненастроени функционални точки (Unadjusted Function Points)"], "correct": 3, "expl": "FC — Unadjusted Function Points"}, {"id": "L09-B-7", "n": 7, "text": "Кой от изброените НЕ е от 4-те типа първични редове в процедурен език според лекцията?", "opts": ["Изпълними оператори", "Макроси", "Коментари", "Празни редове"], "correct": 1, "expl": "4-те типа: изпълними, декларации на данни, коментари, празни редове"}, {"id": "L09-B-8", "n": 8, "text": "Какво е особеното на атрибутите fi в модела Doty?", "opts": ["Имат по 6 възможни рейтинга", "Не се умножават, а се събират", "Имат само по 2 възможни стойности", "Определят се чрез 100 въпроса"], "correct": 2, "expl": "fi в Doty имат само по 2 възможни стойности"}, {"id": "L09-B-9", "n": 9, "text": "Какъв софтуер е целта на метода BANG?", "opts": ["Системен софтуер и софтуер за научни приложения", "Информационни системи и бизнес приложения", "Аерокосмически софтуер", "Обектно ориентиран софтуер"], "correct": 0, "expl": "BANG (Де Марко) — системен и научен софтуер"}, {"id": "L09-B-10", "n": 10, "text": "Кой е публикувал модела MOOSE и кога?", "opts": ["Снийд, 1985 г.", "Кемерер (Kemerer), 1993 г.", "Боем, 1981 г.", "Рубин, 1979 г."], "correct": 1, "expl": "MOOSE — Kemerer, 1993 г."}], "C": [{"id": "L09-C-1", "n": 1, "text": "Коя от изброените НЕ е посочена в лекцията като полза от процеса на намиране на цената на разработване?", "opts": ["Избор на проект за реализация", "Определяне на маркетинговата политика", "Оценяване работата на членовете на колектива", "Избор на език за програмиране"], "correct": 3, "expl": "Ползите са избор на проект, състав на колектива, маркетинг, оценка на членовете"}, {"id": "L09-C-2", "n": 2, "text": "Какво означава ХРПК в формулите на COCOMO?", "opts": ["Хиляди реда първичен код (KLOC)", "Хиляди редове програмен коментар", "Брой редове първичен код в хиляди човекочаса", "Характеристика на реализираната програмна конфигурация"], "correct": 0, "expl": "ХРПК = хиляди реда първичен код = KLOC"}, {"id": "L09-C-3", "n": 3, "text": "Кое от следните СЕ включва при прилагане на базовите формули на COCOMO?", "opts": ["Обучението на потребителите", "Инсталирането на софтуера при потребителя", "Фазите проектиране, програмиране и оценка", "Трудът на висшите ръководители и секретарките"], "correct": 2, "expl": "Включват се само проектиране, програмиране и оценка"}, {"id": "L09-C-4", "n": 4, "text": "Как COCOMO решава проблема с компромиса между детайлност и цена на оценката?", "opts": ["Чрез 14 характеристики с тегла от 0 до 5", "Чрез 3 версии на модела: базова, междинна, детайлна", "Чрез 2 формули според размера на проекта", "Чрез интервюиране на разработчиците"], "correct": 1, "expl": "Базова, междинна и детайлна версия"}, {"id": "L09-C-5", "n": 5, "text": "Колко са оценяваните атрибути в междинния/детайлния COCOMO (A1 … An)?", "opts": ["14", "20", "10", "15"], "correct": 3, "expl": "A1 … A15 — 15 атрибута в 4 групи"}, {"id": "L09-C-6", "n": 6, "text": "Кой е създателят на метода на функционалните точки?", "opts": ["Олбрихт (в съавторство с Гафни), 1979 г.", "Боем, 1981 г.", "Де Марко, 1979 г.", "Systems Development Corporation, 1965 г."], "correct": 0, "expl": "Олбрихт с Гафни, 1979 г."}, {"id": "L09-C-7", "n": 7, "text": "Кой функционален тип представлява файл, който се предава или ползва съвместно от две или повече приложения?", "opts": ["Вътрешен логически файлов тип", "Външен справочен тип", "Външен интерфейсен файлов тип", "Външен изходен тип"], "correct": 2, "expl": "Външен интерфейсен файлов тип — общ за две или повече приложения"}, {"id": "L09-C-8", "n": 8, "text": "Приложение има FC = 200 ненастроени функционални точки и PCA = 1.10. Колко е FP?", "opts": ["210", "220", "181.8", "310"], "correct": 1, "expl": "FP = FC × PCA = 200 × 1.10 = 220"}, {"id": "L09-C-9", "n": 9, "text": "Какви стойности могат да приемат всяка от 14-те характеристики при донастройката на FC?", "opts": ["От 1 до 10", "От 0 до 1", "От 0.65 до 1.35", "От 0 до 5"], "correct": 3, "expl": "От 0 (не влияе) до 5 (силно влияние)"}, {"id": "L09-C-10", "n": 10, "text": "С каква точност и вероятност дава оценка моделът SPQR?", "opts": ["±15% с 90% вероятност", "±35% с 95% вероятност", "±10% с 99% вероятност", "±50% с 75% вероятност"], "correct": 0, "expl": "С 90% вероятност точност ±15%"}], "D": [{"id": "L09-D-1", "n": 1, "text": "Кой критерий означава възможност за количествено определяне на началните данни и крайните резултати на модела?", "opts": ["Икономичност", "Определеност", "Конструктивност", "Простота на прилагане"], "correct": 1, "expl": "Определеност — количествено определяне на входа и резултата"}, {"id": "L09-D-2", "n": 2, "text": "Над колко реда първичен код се оказва неприложим моделът DOTY (критерий „устойчивост“)?", "opts": ["2 000", "32 000", "10 000", "100 000"], "correct": 2, "expl": "DOTY е неприложим над 10 000 реда"}, {"id": "L09-D-3", "n": 3, "text": "Проект от 20 000 реда първичен код изисква 50 човекомесеца. Каква е производителността на труда?", "opts": ["400 реда за човекомесец", "2.5 реда за човекомесец", "1 000 реда за човекомесец", "250 реда за човекомесец"], "correct": 0, "expl": "20 000 / 50 = 400 реда/ЧМ (ХРПК/ЧМ = 0.4)"}, {"id": "L09-D-4", "n": 4, "text": "В примера от лекцията (32 000 реда, ЧМ ≈ 91, В ≈ 14) екипът е 6.5. Как се тълкува тази стойност?", "opts": ["Нужни са точно 6 човека", "Половината от времето работят 13 човека", "Резултатът е невалиден, понеже не е цяло число", "Най-малко 7 човека ще бъдат заети през всичките 14 месеца"], "correct": 3, "expl": "6.5 → най-малко 7 човека през всичките 14 месеца"}, {"id": "L09-D-5", "n": 5, "text": "Какво е характерно за междинния вариант на COCOMO?", "opts": ["Нивото модул се игнорира и таблицата с атрибути и рейтинги е една единствена", "Прилагат се различни коефициенти за всяка фаза", "Оценката започва от модулите към подсистемите", "Използва само брой редове без коригиращи коефициенти"], "correct": 0, "expl": "Междинният игнорира нивото модул и има една таблица"}, {"id": "L09-D-6", "n": 6, "text": "Колко от ръководителите на проекти в САЩ въобще не смятат за уместно да броят редовете първичен код?", "opts": ["15%", "35%", "50%", "25%"], "correct": 2, "expl": "35% физически, 15% логически, 50% не броят"}, {"id": "L09-D-7", "n": 7, "text": "Какъв процент код копира средно програмист на по-старите процедурни езици от стари програми?", "opts": ["5–10%", "50%", "75%", "20–30%"], "correct": 3, "expl": "Процедурни 20–30%, ОО до 50%, библиотеки до 75%"}, {"id": "L09-D-8", "n": 8, "text": "Какво позволява COCOMO 2.0 в сравнение с COCOMO?", "opts": ["Определяне на размера на проекта както чрез брой редове първичен код, така и чрез функционални (обектни) точки", "Оценка само на аерокосмически софтуер", "Отказ от коригиращите коефициенти", "Оценка без никакви входни данни"], "correct": 0, "expl": "COCOMO 2.0 — размер чрез LOC или чрез функционални (обектни) точки"}, {"id": "L09-D-9", "n": 9, "text": "Кое е основното предимство на функционалните точки пред LOC?", "opts": ["Броят им е еднакъв за всички езици за програмиране", "Не изискват никакви изчисления", "Могат да се определят само от първоначални документи като SRS, т.е. рано", "Дават точност ±1%"], "correct": 2, "expl": "ФТ се определят от SRS → ранна оценка"}, {"id": "L09-D-10", "n": 10, "text": "Кой модел е съсредоточен основно върху интервюиране на разработчиците и оценка на риска?", "opts": ["BANG", "ESTIMACS", "Doty", "MOOSE"], "correct": 1, "expl": "ESTIMACS (Рубин) — интервюиране, усилия, хардуер, риск"}], "E": [{"id": "L09-E-1", "n": 1, "text": "Кои две величини основно оценява COCOMO за всеки планиран проект?", "opts": ["Броя функционални точки и коригиращия коефициент", "Риска и качеството на продукта", "Цената (трудоемкостта в човекомесеци) и срока на разработване", "Броя модули и броя подсистеми"], "correct": 2, "expl": "Цената (ЧМ) и срокът на разработване"}, {"id": "L09-E-2", "n": 2, "text": "Кой от изброените НЕ е атрибут на компютъра в COCOMO?", "opts": ["Ограничение по бързина", "Ограничение по оперативна памет", "Цикъл на обръщение към компютъра", "Опит от работа с компютъра"], "correct": 3, "expl": "Опитът от работа с компютъра е атрибут на изпълнителя"}, {"id": "L09-E-3", "n": 3, "text": "Какви са стойностите на коефициентите к и р в разширената формула ЧМ = к × ХРПК^р × A1 × … × A15 за различните типове софтуер?", "opts": ["к = 2.4, 3.0, 3.6 и р = 1.05, 1.12, 1.20", "к = 2.5, 3.0, 3.5 и р = 0.38, 0.35, 0.32", "к = 5.288, 2.060 и р = 1.047", "к = 0.65, 1.00, 1.35 и р = 0.01"], "correct": 0, "expl": "к = 2.4/3.0/3.6, р = 1.05/1.12/1.20"}, {"id": "L09-E-4", "n": 4, "text": "Кой критерий се илюстрира с това, че COCOMO се основава на брой редове първичен код, който трудно се определя в началната фаза?", "opts": ["Обективност", "Детайлност", "Област на приложение", "Предсказуемост"], "correct": 3, "expl": "Предсказуемост — оценка колкото може по-рано"}, {"id": "L09-E-5", "n": 5, "text": "Какъв е типичният дял на изпълнимите оператори в бизнес приложение?", "opts": ["45%", "40%", "35%", "15%"], "correct": 1, "expl": "Бизнес: 40/35/15/10; системен: 45/30/15/10"}, {"id": "L09-E-6", "n": 6, "text": "Как се определя нивото на сложност на външния справочен тип (External Inquiry Type)?", "opts": ["Винаги се приема за средно", "Като средно аритметично на входната и изходната част", "Равно на по-голямата от сложностите на входната и изходната част", "Равно на по-малката от сложностите на входната и изходната част"], "correct": 2, "expl": "По-голямата от сложностите на входната и изходната част"}, {"id": "L09-E-7", "n": 7, "text": "С колко процента максимално коригира коефициентът PCA първоначалния резултат FC?", "opts": ["±15%", "±50%", "±65%", "±35%"], "correct": 3, "expl": "PCA от 0.65 до 1.35 → ±35%"}, {"id": "L09-E-8", "n": 8, "text": "Каква е формулата за коригиращия коефициент PCA?", "opts": ["PCA = 0.65 + 0.01 × PC", "PCA = 0.01 + 0.65 × PC", "PCA = FC × PC", "PCA = 1.35 − 0.01 × PC"], "correct": 0, "expl": "PCA = 0.65 + (0.01 × PC)"}, {"id": "L09-E-9", "n": 9, "text": "Около каква част от софтуера в САЩ е написан на повече от един език за програмиране?", "opts": ["1/2", "1/3", "1/4", "3/4"], "correct": 1, "expl": "Около 1/3 е на повече от един език"}, {"id": "L09-E-10", "n": 10, "text": "Какво твърди Jones за оценяването при ОО подход за разработване?", "opts": ["Методът на функционалните точки е неприложим", "Моделите, базирани на брой редове код, са най-подходящи", "Трябва да се използва само Doty", "Неподходящо е да се прилагат модели, базирани на брой редове код, а ФТ са приемливо приложими"], "correct": 3, "expl": "LOC модели са неподходящи за ОО, ФТ са приемливо приложими"}]}}, {"num": 10, "title": "Тема 10 — Автоматизация на софтуерното производство", "short": "Автоматизация на софтуерното производство", "summary": "### Въведение — защо АСП\n- **Разходите за обработка на информацията се удвояват на всеки 5 години**, а **производителността на програмисткия труд се удвоява на всеки 25 години** → оттук **актуалността на проблема за автоматизация на софтуерното производство (АСП)**.\n- **Предназначение на автоматизиращите средства** (4 точки):\n  1. да **поддържат избраните методи** за разработване на софтуер;\n  2. да **улесняват управлението на проектите** и на целия процес на създаване на ПП;\n  3. да **извършват трансформации от едно представяне** на софтуерните продукти **в друго**;\n  4. да **проверяват правилността** им.\n- **2 основни подхода за АСП**: **използване на индивидуални средства** и **използване на интегрирани среди**.\n\n### Автоматизация чрез индивидуални средства\n- Използване на **отделни (stand-alone) „полезни“ програми**, улесняващи някаква дейност при създаването на софтуера.\n- Примери: **компилатори, асемблери, свързващи редактори, дебъгери** — осигуряват **директна помощ за програмирането**.\n- **4 критерия за класификация** на индивидуалните средства:\n  1. **по функциите им**;\n  2. **по използването им в различни фази от жизнения цикъл**;\n  3. **по основните им потребители**;\n  4. **по степента им на сложност на усвояване и прилагане**.\n\n### Класификация по функциите (кои дейности подпомагат) — 9 групи (а–и)\n- **а)** средства за **програмиране**;\n- **б)** средства за **тестване**;\n- **в)** средства, подпомагащи **управлението на проекти**;\n- **г)** средства, подпомагащи **документирането** — **създаване, оформяне и отпечатване на документи**: **текстообработващи програми, графични редактори, издателски системи**;\n- **д)** средства, подпомагащи **съпровождането** — **за управление на софтуерните конфигурации**; **статични и динамични средства**;\n- **е)** средства за **анализ и проектиране** — позволяват **създаването и оценяването на модел на софтуерната система**, която ще се разработва;\n- **ж)** средства за **прототипиране и симулиране** — представят някои функции или характеристики на поведението на софтуерни системи, **работещи в реално време**;\n- **з)** средства за **проектиране и разработване на потребителския интерфейс**;\n- **и)** **езикови процесори**.\n\n### Автоматизация чрез интегрирани среди — изисквания (5)\n1. да осигуряват **механизъм за общо използване на информацията** от всички средства в средата;\n2. да допускат **директно извикване на всяко средство**;\n3. да поддържат решаването на всяка конкретна задача чрез **подходящо съчетаване на средства**;\n4. да **улесняват комуникациите между всички участници** в процеса;\n5. да **натрупват статистическа информация** за подобряване **качеството на процеса и продукта**.\n\n### Видове интеграция (според начина на свързване на група средства в единна среда) — 4\n- **а) еклектична интеграция**;\n- **б) интеграция чрез данните**;\n- **в) интеграция чрез потребителския интерфейс**;\n- **г) интеграция чрез дейностите, които се поддържат**.\n\n### Видове интегрирани среди (по предназначение) — 7\n- **За планиране и моделиране на бизнес-информационни системи** — идентифициране и описание на сложни бизнесдейности; **построяване на обобщени модели на предприятие**; включват **графични редактори, генератори на отчети и генератори на справки за срещането на отделни елементи**.\n- **За анализ и проектиране** — автоматизират най-използваните подходи: **структурния и обектно ориентирания**; включват един или повече **редактори за създаване и модифициране на спецификации** и средства за анализирането, симулирането и трансформирането им.\n- **За създаване на потребителски интерфейс** — **графични редактори** (прозорци, диалогови кутии, икони); **симулатори** за тестване на компонентите преди интегрирането им с приложението; **генератори на първичен текст**; **библиотеки** за поддържане на генерирането на изпълним код.\n- **За програмиране** — **текстов редактор, компилатор, свързващ редактор и дебъгер**.\n- **За верификация и валидация** — подпомагат **модулното и системно тестване**; включват **статичен анализатор**, **средство за инструментиране на програмата и за проследяване**, **генератор на тестови данни**, **управляваща програма**.\n- **За съпровождане** — управлява **внасянето на промени, създаването и контрола на версии** и **управлението на софтуерните конфигурации**.\n- **За управление на проекти** — **планиране, съставяне на графици и текущо следене на изпълнението** на проекти.\n\n### Принципи на изграждане и архитектура\n- Предназначението на АСП-средата е да подпомага **цялостния процес** на създаване на ПП, като **поддържа хранилище (repository)** на информацията.\n- **Интегрираща архитектура** — **4 основни компонента**:\n  1. **Хранилище**;\n  2. **Система за управление на обекти**;\n  3. **Механизъм за управление на инструменталните средства**;\n  4. **Потребителски интерфейс**.\n\n### Жизнен цикъл на софтуерните среди\n- „Практическото използване на софтуерните среди **преминава през следните фази**“ — самите фази са дадени **само като диаграма** на слайда (няма ги в текста).\n\n### Преимущества и недостатъци на интегрираните среди\n- **Потенциални ползи (6)**: повишаване на **систематичността и управляемостта** на проектите; **намаляване на стойността** на разработването и **особено на съпровождането**; **подобряване на качеството**; **ускоряване** на разработването (по-кратки проекти); **повишаване на производителността на труда**; **препоръчвани техники стават реално използваеми** поради подпомагането им от софтуерни средства.\n- Въпреки това АСП-средите имат **все още ограничено използване**. **Причини (3)**: **няма публикувани изследвания** за резултатите от практическото използване; **няма натрупани данни и подходящи метрики** за измерване; **средите са големи и сложни** софтуерни системи.\n- **Заключение**: сложността на съвременните софтуерни системи **изисква автоматизация през различните фази**; бъдещето на софтуерната индустрия е **немислимо без АСП-средствата**.\n\n### Литература\n- **Аврам Ескенази, Нели Манева**, „Софтуерни технологии“ — КЛМН, 2006 и Анубис, 2001; **Ian Sommerville**, Software Engineering, 9th ed., 2011.\n\n### Капани за изпита\n- **5 години** — разходите за обработка на информацията; **25 години** — производителността на програмисткия труд. Да не се разменят.\n- **2 подхода** (индивидуални средства и интегрирани среди); **4 критерия** за класификация; **9 групи** по функции; **5 изисквания** към средите; **4 вида интеграция**; **7 вида среди**; **4 компонента** на архитектурата; **6 ползи**; **3 причини** за ограничено използване.\n- **Видове интеграция** (еклектична, чрез данните, чрез ПИ, чрез дейностите) ≠ **видове среди** (по предназначение).\n- **Статичен анализатор, генератор на тестови данни, управляваща програма** → среда за **верификация и валидация**; **генератори на отчети и справки** → среда за **бизнес планиране и моделиране**; **генератори на първичен текст, симулатори** → среда за **потребителски интерфейс**.\n- **Статични и динамични средства** са в групата за **съпровождане** (не за тестване) в класификацията по функции.\n- Неточности в слайдовете: „индувидуалните“ (печатна грешка); раздел 3 „Автоматизация чрез интегрирани среди“ е номериран на слайда като **2.** (а подразделите — 2.1–2.4); „Система за управление на обекти;,“ — излишна пунктуация. Фазите на жизнения цикъл на средите и диаграмата на архитектурата не са в текста. Терминът CASE не се среща в слайдовете — използва се само „АСП“.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L10-A-1", "n": 1, "text": "Според лекцията разходите за обработка на информацията се удвояват на всеки:", "opts": ["25 години", "10 години", "5 години", "2 години"], "correct": 2, "expl": "Разходите за обработка на информацията се удвояват на всеки 5 години"}, {"id": "L10-A-2", "n": 2, "text": "Според лекцията производителността на програмисткия труд се удвоява на всеки:", "opts": ["5 години", "25 години", "10 години", "50 години"], "correct": 1, "expl": "Производителността на програмисткия труд се удвоява на всеки 25 години"}, {"id": "L10-A-3", "n": 3, "text": "Кои са двата основни подхода за автоматизация на софтуерното производство (АСП)?", "opts": ["Използване на индивидуални средства и използване на интегрирани среди", "Структурен и обектно ориентиран подход", "Еклектична интеграция и интеграция чрез данните", "Прототипиране и симулиране"], "correct": 0, "expl" ии", "Модулното и системно тестване", "Построяването на обобщени модели на предприятие"], "correct": 2, "expl": "V&V средите подпомагат модулното и системно тестване"}, {"id": "L10-A-10", "n": 10, "text": "Коя е посочена като причина АСП-средите все още да имат ограничено използване?", "opts": ["Те не поддържат управление на версии", "Няма публикувани изследвания за резултатите от практическото им използване", "Те не могат да генерират изпълним код", "Те са предназначени само за структурния подход"], "correct": 1, "expl": "Една от трите причини за ограниченото използване"}], "B": [{"id": "L10-B-1", "n": 1, "text": "Кое от изброените **НЕ** е предназначение на автоматизиращите средства според лекцията?", "opts": ["Да поддържат избраните методи за разработване на софтуер", "Да улесняват управлението на проектите", "Да заменят напълно участието на програмистите", "Да проверяват правилността на софтуерните продукти"], "correct": 2, "expl": "Предназначението е поддръжка на методи, управление, трансформации, проверка на правилността"}, {"id": "L10-B-2", "n": 2, "text": "В какво се състои автоматизацията чрез индивидуални средства?", "opts": ["В използването на отделни (stand-alone) „полезни“ програми, улесняващи някаква дейност при създаването на софтуера", "В използването на общо хранилище за всички средства", "В свързването на средствата чрез общ потребителски интерфейс", "В изграждане на среда с механизъм за управление на инструменталните средства"], "correct": 0, "expl": "Отделни (stand-alone) полезни програми"}, {"id": "L10-B-3", "n": 3, "text": "Какво позволяват средствата за анализ и проектиране?", "opts": ["Отпечатване на документи", "Управление на софтуерните конфигурации", "Превод от език за програмиране в машинен код", "Създаването и оценяването на модел на софтуерната система, която ще се разработва"], "correct": 3, "expl": "Създаване и оценяване на модел на бъдещата система"}, {"id": "L10-B-4", "n": 4, "text": "Колко изисквания към интегрираните среди за АСП
