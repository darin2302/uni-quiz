<!doctype html>
<html lang="bg">
<head>
<script src="../gate.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТСП тестове</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f8f9fb;--text:#1d2125;--muted:#5f6b76;--border:#d8dde3;
  --accent:#0f6cbf;--accent-ink:#ffffff;--accent-soft:#e7f0fa;
  --ok:#1e7e34;--ok-bg:#e6f4ea;--bad:#c62828;--bad-bg:#fdecea;--flag:#d97706;--code:#eef1f4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
    --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
    --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--code:#2a2f36;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
  --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
  --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--code:#2a2f36;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;color:inherit}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.2rem;margin:28px 0 12px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  padding:7px 13px;border-radius:7px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,.nav-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:.78rem;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.badge.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;
  align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px;box-shadow:var(--shadow)}
.lec-h{display:flex;align-items:center;gap:12px;min-width:0}
.num{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.lec-t{font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem;margin:4px 0}
.toggle input{width:17px;height:17px;accent-color:var(--accent)}
select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)}

/* quiz */
.quiz{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:16px}
.side .card{padding:12px}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.nav-b{position:relative;height:42px;border:1px solid var(--border);border-radius:5px;background:var(--panel);cursor:pointer;
  font-size:.85rem;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:3px;overflow:hidden}
.nav-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:transparent}
.nav-b.ans::after{background:var(--muted);opacity:.45}
.nav-b.r-ok::after{background:var(--ok);opacity:.8}
.nav-b.r-bad::after{background:var(--bad);opacity:.8}
.nav-b.cur{border:2px solid var(--text)}
.nav-b.fl::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--flag) transparent transparent}
.timer{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qwrap{display:grid;grid-template-columns:150px 1fr;gap:14px}
.qinfo{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.85rem;color:var(--muted);align-self:start}
.qinfo .qn{font-size:.85rem}
.qinfo .qn b{font-size:1.35rem;color:var(--text)}
.qinfo div{margin-bottom:6px}
.flagbtn{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;font-size:.85rem;text-align:left}
.flagbtn.on{color:var(--flag);font-weight:600}
.qbox{background:var(--accent-soft);border-radius:8px;padding:18px 20px}
.qtext{font-size:1.06rem;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.opt:hover{background:var(--panel)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt .ltr{min-width:1.4em;color:var(--muted)}
.opt.sel{background:var(--panel);border-color:var(--border)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:.95rem}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.wrong{background:var(--bad-bg);color:var(--bad)}
.fb span{color:var(--text)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.lectag{font-size:.78rem;color:var(--muted);margin-bottom:6px}
table.mtx{border-collapse:collapse;margin:4px 0 14px;font-family:"Cambria Math","Times New Roman",serif;font-size:1.05rem;border-left:2px solid var(--text);border-right:2px solid var(--text)}
table.mtx td{padding:3px 12px;text-align:center}

/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.ring span{background:var(--panel);width:86px;height:86px;border-radius:50%;display:grid;place-items:center}
.rev{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.rev .opt{cursor:default;padding:5px 9px}
.rev .opt:hover{background:transparent}
.rev .opt.ok:hover{background:var(--ok-bg)}
.rev .opt.bad:hover{background:var(--bad-bg)}
.rev .why{font-size:.92rem;margin-top:6px;color:var(--muted)}
.rev .why b{color:var(--text)}

/* summary */
.md{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 24px 24px;overflow-x:auto}
.md h3{margin-top:26px;border-bottom:1px solid var(--border);padding-bottom:4px}
.md table{border-collapse:collapse;margin:10px 0;font-size:.93rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md li{margin:2px 0}
.kbd{font-size:.8rem;color:var(--muted);margin-top:14px}

/* профил и прогрес */
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}
.inp{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
input.inp{min-width:0;flex:1 1 200px;max-width:320px}
textarea.inp{width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;word-break:break-all;margin:6px 0 10px}
.stat{font-size:1.9rem;font-weight:700;line-height:1.2}
.tbl-wrap{overflow-x:auto;padding:4px 6px}
table.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl th{color:var(--muted);font-weight:600;font-size:.84rem}
table.tbl td.t{white-space:normal;min-width:170px}
table.tbl tr.weak td{background:var(--bad-bg)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .tbl-wrap{padding:2px}
  table.tbl{font-size:.84rem}
  table.tbl th,table.tbl td{padding:6px 5px}
  table.tbl td.t{min-width:110px}
  table.tbl td.dt{white-space:normal;min-width:76px}
}
.who{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted)}
.who b{color:var(--text)}

@media (max-width:820px){
  .grid3{grid-template-columns:1fr}
  .quiz{grid-template-columns:1fr}
  .side{position:static;order:2}
  .qwrap{grid-template-columns:1fr}
  .qinfo{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .qinfo div{margin:0}
  .md{padding:4px 14px 16px}
}
</style>
</head>

<script id="data" type="application/json">{"lectures": [{"num": 1, "title": "Тема 1 — Software Engineering, жизнен цикъл и модели на ЖЦ", "short": "Software Engineering, жизнен цикъл и модели на ЖЦ", "summary": "### Software Engineering — произход, превод, дефиниции\n- Терминът **Software Engineering** — **1969 г., Наур (конференция на НАТО)**; появява се заради **софтуерната криза (компютри от 3-то поколение)**.\n- Преводи: **Софтуерни технологии**, **Софтуерно инженерство**, **Инженеринг на програмното осигуряване**.\n- **Дефиниция 1 (Наур)**: установяване и използване на **здрави принципи** за разработване, с цел **по икономичен начин** да се произведе софтуер, който е **надежден** и функционира **ефективно върху реална машина**.\n- **Дефиниция 2 (IEEE — Институт на инженерите по електротехника и електроника)**: **систематичен подход** към **разработване, експлоатиране, съпровождане и изваждане от експлоатация** на софтуера.\n- **Дефиниция 3 (Н. Манева и А. Ескенази)**: систематичен подход към разработване на **качествен** софтуер, както и към неговото **предлагане на пазара**, експлоатация и съпровождане.\n- **Дефиниция 4 (Sommerville)**: **инженерна дисциплина**, която обхваща **всички аспекти** на създаването на програмния продукт — от началния стадий през разработване, експлоатиране и съпровождане **до изваждане от употреба**.\n- **Дефиниция 5** (обобщена): инженерна дисциплина за **качествен** програмен продукт — от **дефиниране на изискванията** през разработване, експлоатиране, съпровождане, предлагане на пазара до изваждане от употреба.\n- **Качествен софтуер**: надежден, ефективен, с добра цена, лесен за съпровождане, с достъпен и лесен за използване интерфейс.\n- **Софтуер / програмен продукт (ПП) / програмно осигуряване (ПО)** — предмет на дисциплината; **програма или съвкупност от взаимодействащи си програми, записани върху технически носител и придружени с документация**.\n- **Програма** — последователност от инструкции към компютъра, които се декодират от него и така се решава конкретна задача.\n- **Според БДС** ПО е съвкупност от програмни продукти и се дели на **приложно** (за софтуерно изпълнение) и **системно** (за управление на функционирането на ЕИМ и ресурсите ѝ).\n\n### Значение на дисциплината\n1. **Нарастване на цената** — софтуерът е определящ фактор: **60–70%** от стойността на продукта (Фиг.1 — цената на софтуера расте, на хардуера пада).\n2. Софтуерът е **масов продукт и масова дейност** — **недостиг на специалисти и глад за софтуер**.\n3. **Неразрешими противоречия между изисквания и възможности** (Фиг.2).\n4. **Софтуерът и разработката му са рискови**:\n   - А. Заради **сложността** ПП се делят на: **прости; със средна сложност; с голяма сложност; почти невъзможни за изпълнение; направо абсурдни (по сложност)** (Таблица 1):\n     - прости — **6 месеца, 1 програмист**, без връзка с други системи;\n     - средна — 10–100 модула, малко/никакви връзки с други системи;\n     - голяма — **5–20 програмиста, 100–1000 модула**, няколко подсистеми;\n     - почти невъзможни — **100–1000 програмиста, 1000–10000 модула**, реално време, многозадачност, многоезичност;\n     - направо абсурдни — **~1000 програмиста**, почти винаги реално време, критични ситуации, **управление на въздушен трафик**, високи изисквания за надеждност.\n   - Б. Като **продукт** софтуерът се отличава от материалните продукти по **абстрактност** и **уникалност**.\n   - В. Като **производство** се отличава по **мултидисциплинарност**; **творчески, евристичен** (не толкова научен) процес; софтуерът е **средство, а не цел**.\n- **Извод**: нужни са съвременни процеси и подходи + ефективни средства за автоматизацията им — те са предмет на „Софтуерни технологии“.\n\n### Жизнен цикъл (ЖЦ) на софтуера (Software Life Cycle)\n- **Дефиниция 1**: обхваща **целия период** на създаване и използване — **от началото до физическия му край**.\n- **Дефиниция 2 (Sommerville)**: **кохерентно (свързано) множество от дейности**, изпълнявани при разработването на софтуерна система.\n- **Модел на ЖЦ** — **абстрактно**, **сбито и информативно** представяне.\n- **Ползи от адекватен модел**: **методологически** (общи въпроси по разработването), **организационни** (как се ръководи екипът), **технологически** (какви спецификации, техники, метрики; дали може само ОО подход).\n- **Елементи**: **Фаза (phase)** — етап с **начало, край и изходен резултат**; **Вид дейност (activity)** — **определен тип работа** в процеса на разработване.\n\n### Основни фази на ЖЦ\n1. **Разработка на изискванията** — **извличане, анализ, специфициране** (Software Requirement); резултат — **SRS** (спецификация на изискванията).\n2. **Проектиране на структурата** — завършва със **спецификация за реализация**.\n3. **Разработка** (програмиране/кодиране) — работеща програмна система.\n4. **Верификация и настройка**:\n   - **Верификация (тестване)** — работи ли програмата коректно: **\"Are we building the product right?\"**\n   - **Валидация** — това ли е, което клиентът иска: **\"Are we building the right product?\"**\n5. **Експлоатация и съпровождане** след внедряване — препрограмиране, допуска се еволюция и формулиране на изисквания за нова система; накрая **излизане от употреба** (Фиг.4).\n\n### Разходи по фази (Фиг.5, Фиг.6)\n- **Най-голям дял от разходите — съпровождането** (около **50% от времето**); в най-голяма степен за масови продукти като **операционните системи**.\n- Без съпровождането **най-трудо- и времепоглъщащ е тестването и настройката — 20% от времето и 45% от средствата**.\n- **Колкото по-късно се правят корекциите, толкова по-висока е цената.**\n\n### Класификация на моделите (Фиг.7)\n- **Пълни** (обхващат целия ЖЦ) и **частични**.\n- Пълни **едномерни**: **хронологични** (стандартни, разклонени, модифицирани) и **функционален**; пълни **еволюционен** и **спирален**; пълни **многомерни**.\n- Съвременни: **V-образен** и **USDP**.\n\n### Функционален модел (Хамилтън и Зелдин)\n- Основно понятие — **функция** = група от приличащи си дейности; признак за разделяне — **типът извършвани дейности**.\n- Функции: **Дефиниране на проблема** (потребител–разработчик); **Анализ** (проблем–решение); **Разпределение на ресурсите** (**липсва в другите модели** — човешки, софтуерни, хардуерни, документация); **Документиране** — **вътрешна** (разработка), **потребителска** (експлоатация), **съпровождаща** (съпровождане); **Изпълнение**.\n- Всички функции са свързани с **една управленска функция** (непрекъснат контрол).\n- На базата на модела е разработено инструменталното средство **USE.IT**.\n\n### Хронологични стандартни модели (Боем, Метцгер, Фрийман)\n- Основно понятие — **фаза** (отрязък от време за определени дейности).\n- **Без препокриване на фазите и без итерации**; преход към следваща фаза **само след завършване** на текущата; завършват с **пълен комплект документация**.\n- Плюс: **Documentation-driven model**; последователното изпълнение позволява планиране на срок и разход.\n- Минус: **експоненциално повишаване на цената във времето** за отстраняване на грешки.\n- Приложение: ПС, при които **в началото ясно и пълно се формулират изискванията**. Пример: едногодишен проект (Фиг.10).\n\n### Разклонен модел на Фокс\n- **3 фази** (Фиг.11): **разработване**, **използване**, **продължаващо разработване (съпровождане)**.\n- Разработване: дефиниране на изискванията, проектиране, написване на програмите, сглобяване, тестване, документиране.\n- Съпровождане: добавяне на нови функции, усъвършенстване на съществуващи, добавяне на функции заради промени в хардуера, отстраняване на грешки.\n- **Особено внимание на съпровождането**; Фокс заменя „съпровождане“ с **„продължаващо разработване“**; при големи ПП съпровождането отнема **толкова усилия, колкото разработването**.\n- **Принос: успоредност на фазите „използване“ и „продължаващо разработване“** (затова „изпреварва времето си“).\n\n### Каскаден (водопаден, waterfall) модел\n- **Хронологичен модифициран**; оригиналният на **Winston W. Royce (1970)** е **немодифициран**. При модифицираните **фазите се припокриват във времето**.\n- **70–80-те години**; критикуван след осъзнаване на **итеративния характер** на разработката.\n- Приложение: **не-големи проекти** без нужда от итеративност; **офшорни проекти с почасово заплащане**; като **съставна част на други модели** (напр. **V-образния**).\n- Минуси: трудно е изискванията да се формулират **наведнъж**; **фазите и видовете дейности се отъждествяват**; пълно завършване на фаза = дейност + подробен изходен документ; **потребителите виждат системата едва накрая**.\n\n### Прототипен модел\n- Пълен хронологичен **модифициран**, използва се **интензивно в практиката**; реализира **умалена версия = прототип**; след доказване на прототипа се прави крайният ПП.\n- Плюс: **по-бързо и лесно изясняване на изискванията**. Минус: **няма гаранция, че прототипът съдържа всички съществени свойства** на крайния ПП.\n\n### Пълен еволюционен модел\n- Разчита на **скициране на изискванията** вместо строго утвърдени спецификации; **интегрира** специфициране, проектиране, разработка и валидация.\n- Конкуриращи се етапи: **скициране на изискванията → разработване → оценяване с участие на потребителя**.\n- Поддържа се от **езици от IV-то поколение**; **итерационен** модел; еволюира до краен ПП.\n- Плюс: близък до спиралния — бързо води до ПП, отговарящ най-добре на нуждите. Минуси: **влошаване на структурата** от непрекъснатите изменения (трудно и скъпо съпровождане); **не е удачен при големи проекти**.\n\n### Пълен спирален модел\n- **Боем, 1988**; **има предварително уточнени спецификации** (за разлика от еволюционния).\n- На всеки виток: анализ на изискванията, проектиране, реализация, тестване, **оценка на риска и редукция (прототип)**.\n- Плюс: **налична спецификация/документация**, която липсва при еволюционния.\n- Еволюционният и спиралният са най-подходящи за **интерактивни и авангардни системи с трудно формулируеми изисквания**.\n\n### Пълни многомерни модели\n- **Модел на Гънтър** — **двумерен**: хронологично + функционално измерение; **6 фази, 7 функции**.\n  - Фази: **Изследване** (4–10 седмици; документ **„Съглашение за изискванията“**); **Анализ на осъществимост** (1–10 седмици; техническа, икономическа, експлоатационна, пазарна); **Проектиране** (10 седмици; **външен проект** → документ **„Външна спецификация“**); **Програмиране** (детайлен **вътрешен** проект, модулно тестване; **не повече от 10 месеца**); **Оценка** (**независимо тестване**; най-оптимистично **1/3 от програмирането**); **Използване** (инсталиране, експлоатация, обучение).\n  - Функции (съвкупност от сходни дейности на група хора с еднаква квалификация): **Планиране, Разработване, Обслужване, Документиране, Изпитания, Поддържане** (преки контакти с потребителите), **Съпровождане** (промени в готовия ПП).\n- **Тримерен модел на Питърс–Трип**: измерения **Време** (4 фази: анализ, проектиране, реализация, експлоатация), **Логика**, **Формализъм** (чисто мислен модел); **няма практическо приложение**.\n\n### Частични модели\n- **Липсват съществени части** от естествения ЖЦ; отразяват **reuse техника** (повторно използване — изключително перспективна); пример: **модел, базиран на заготовки (assets)**.\n\n### V-образен модел\n- Разработен **едновременно и независимо в Германия и САЩ, края на 1980-те**; **разширение на водопадния**; съвременен вариант **V-Model XT (2005)**.\n- Показва **връзката между всяка фаза и фазата на тестване**; хоризонтална ос — **време/пълнота на проекта**, вертикална — **нива на абстракция**.\n- Разработване **отгоре надолу**, тестване **отдолу нагоре**; итерации **хоризонтално** между лявата и дясната страна.\n- Предимства: развиващ се, **универсален** спрямо типа проект и организация. Недостатък: конкретен резултат **едва при достигане на долната част на V**.\n\n### USDP / RUP\n- **USDP** — **промишлен стандарт (1995)**, обобщен (generic), свободен (free) framework. Дефинира: **use case (requirements) driven**; **ориентиран към архитектурата**; **итеративен и инкрементален**; **UML във всички фази**.\n- **RUP** — конкретна имплементация на Unified Process, на **Rational Software Corporation, сега IBM (1999; Grady Booch, Ivar Jacobson, James Rumbaugh)**.\n- **4 фази**: **Inception (начална)**, **Elaboration (изработване)**, **Construction (конструиране)**, **Transition (издаване)**.\n- **Итерациите са ключови**; всяка фаза — множество итерации (според сложността); workflows: **Requirements, Analysis and design, Implementation, Integration and test, Deployment** (версия — вътрешна или външна); итерацията може да не съдържа всички; **итерациите могат да се препокриват**; изисква грижливо планиране.\n- **Извод**: новите модели са все по-сложни и по-малко приложими; най-общите фундаментални подходи се наричат **парадигми**.\n\n### Капани за изпита\n- **Верификация = \"building the product right\"** (коректност); **валидация = \"building the right product\"** (това ли иска клиентът).\n- **Функционален модел → основно понятие „функция“**; **стандартни хронологични → „фаза“**.\n- Оригиналният водопад е на **Royce (1970)** и е **немодифициран**; каскадният в лекцията е **модифициран** (фазите се припокриват). **Спиралният — Боем 1988.**\n- Гънтър: **6 фази, 7 функции**, двумерен. Питърс–Трип: **3 измерения, 4 фази**, без практическо приложение.\n- Тестване: **20% време, 45% средства**; съпровождането е най-скъпо общо.\n- USDP **1995**, RUP **1999**; V-Model XT **2005**.\n- Несъответствия в слайдовете: слайдът „Обобщение“ описва моделите различно от основните слайдове (функционален — „всеки етап завършен преди следващия“; Боем — „формализация на водопада“; Фокс — „алтернативни пътища“; частичните — „напр. прототипиране“; USDP фази — „инициация, разработка, конструиране, внедряване“) — за теста ползвай основните слайдове. Слайдът за еволюционния модел пише „Прототипният модел избягва трудността…“ (по смисъл — еволюционният). „Фиг.16“ е използвана два пъти; „Валидация (Валидация)“ — печатна грешка. Исторически терминът е от конференцията на НАТО 1968, но слайдът казва **1969** — отговаряй 1969.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L01-A-1", "n": 1, "text": "Кой и кога въвежда термина Software Engineering според лекцията?", "opts": ["Боем, 1988 г.", "Наур, 1969 г., на конференция на НАТО", "Winston W. Royce, 1970 г.", "Sommerville, 2011 г."], "correct": 1, "expl": "Наур, 1969, конференция на НАТО"}, {"id": "L01-A-2", "n": 2, "text": "Какъв дял от стойността на съвременните компютърни системи се пада на софтуера според лекцията?", "opts": ["10–20%", "30–40%", "45–50%", "60–70%"], "correct": 3, "expl": "Софтуерът е 60–70% от стойността"}, {"id": "L01-A-3", "n": 3, "text": "На кой въпрос отговаря верификацията (тестването)?", "opts": ["\"Are we building the product right?\"", "\"Are we building the right product?\"", "\"Is the product delivered on time?\"", "\"Is the product cheap enough?\""], "correct": 0, "expl": "Верификация — правилно ли строим продукта"}, {"id": "L01-A-4", "n": 4, "text": "Кой от изброените модели на ЖЦ е разклонен?", "opts": ["Моделът на Боем", "Каскадният модел", "Моделът на Фокс", "Моделът на Гънтър"], "correct": 2, "expl": "Фокс — разклонен; Боем — стандартен; каскадният — модифициран"}, {"id": "L01-A-5", "n": 5, "text": "Колко фази има в хронологичното измерение на модела на Гънтър?", "opts": ["3", "4", "7", "6"], "correct": 3, "expl": "6 фази и 7 функции"}, {"id": "L01-A-6", "n": 6, "text": "Кое е основното понятие във функционалния модел на Хамилтън и Зелдин?", "opts": ["Фаза", "Функция", "Итерация", "Прототип"], "correct": 1, "expl": "Функция — група приличащи си дейности"}, {"id": "L01-A-7", "n": 7, "text": "Коя от изброените НЕ е фаза на Unified Process?", "opts": ["Inception", "Elaboration", "Validation", "Transition"], "correct": 2, "expl": "Фазите са Inception, Elaboration, Construction, Transition"}, {"id": "L01-A-8", "n": 8, "text": "Кой е създал пълния спирален модел и кога?", "opts": ["Боем, 1988 г.", "Фокс, 1970 г.", "Royce, 1970 г.", "Гънтър, 1995 г."], "correct": 0, "expl": "Спиралният — Боем, 1988"}, {"id": "L01-A-9", "n": 9, "text": "Кой етап (изключвайки съпровождането) е най-трудо- и времепоглъщащ според анализа на разходите?", "opts": ["Проектирането", "Тестването и настройката", "Кодирането", "Разработката на изискванията"], "correct": 1, "expl": "Тестване и настройка — 20% от времето и 45% от средствата"}, {"id": "L01-A-10", "n": 10, "text": "Каква техника отразяват частичните модели на ЖЦ?", "opts": ["Водопадна последователност", "Хронологичния принцип", "Спираловидно разработване", "Reuse техника (повторно използване)"], "correct": 3, "expl": "Частичните модели отразяват reuse техника"}], "B": [{"id": "L01-B-1", "n": 1, "text": "Чия е дефиницията „Software Engineering е систематичен подход към разработване, експлоатиране, съпровождане и изваждане от експлоатация на софтуера“?", "opts": ["Наур", "Sommerville", "IEEE", "Н. Манева и А. Ескенази"], "correct": 2, "expl": "Дефиниция 2 — IEEE"}, {"id": "L01-B-2", "n": 2, "text": "На какви видове се разделя ПО съгласно БДС?", "opts": ["Приложно и системно", "Свободно и комерсиално", "Прости и сложни програми", "Вградено и мрежово"], "correct": 0, "expl": "Приложно и системно"}, {"id": "L01-B-3", "n": 3, "text": "Кои са ползите от един адекватен модел на ЖЦ?", "opts": ["Функционални, структурни, времеви", "Икономически, пазарни, правни", "Технически, експлоатационни, пазарни", "Методологически, организационни, технологически"], "correct": 3, "expl": "Методологически, организационни, технологически"}, {"id": "L01-B-4", "n": 4, "text": "Какво е фаза (phase) в модела на ЖЦ?", "opts": ["Определен тип работа, изпълнявана в процеса на разработване", "Определен етап от разработването, който има начало, край и изходен резултат", "Група от приличащи си дейности", "Един виток на спиралата"], "correct": 1, "expl": "Фаза — етап с начало, край и изходен резултат"}, {"id": "L01-B-5", "n": 5, "text": "С какъв термин Фокс заменя „съпровождане“?", "opts , "opts": ["Документиране", "Анализ", "Разпределение на ресурсите", "Изпълнение"], "correct": 2, "expl": "Разпределението на ресурсите липсва в другите модели"}, {"id": "L01-D-6", "n": 6, "text": "Каква е сферата на приложение на хронологичните стандартни модели?", "opts": ["ПС, за които в началото на разработката ясно и пълно се формулират изискванията", "Интерактивни и авангардни системи", "Системи с трудно формулируеми изисквания", "Офшорни проекти с почасово заплащане"], "correct": 0, "expl": "Изискванията са ясни и пълни от началото"}, {"id": "L01-D-7", "n": 7, "text": "Кой е минусът на прототипния модел?", "opts": ["Потребителите виждат системата едва накрая", "Няма никаква документация", "Не е удачен при малки проекти", "Няма гаранция, че прототипът ще съдържа всички съществени свойства на крайния ПП"], "correct": 3, "expl": "Няма гаранция за всички съществени свойства"}, {"id": "L01-D-8", "n": 8, "text": "Каква е най-оптимистичната оценка за продължителността на фазата „Оценка“ в модела на Гънтър?", "opts": ["10 седмици", "1/3 от продължителността на фазата „Програмиране“", "10 месеца", "4–10 седмици"], "correct": 1, "expl": "1/3 от програмирането"}, {"id": "L01-D-9", "n": 9, "text": "Според Гънтър фазата „Програмиране“ не трябва да надвишава:", "opts": ["10 месеца", "10 седмици", "2 години", "6 месеца"], "correct": 0, "expl": "Не повече от 10 месеца"}, {"id": "L01-D-10", "n": 10, "text": "През коя година е създаден USDP като промишлен стандарт?", "opts": ["1988", "2005", "1995", "1999"], "correct": 2, "expl": "USDP — 1995; RUP — 1999"}], "E": [{"id": "L01-E-1", "n": 1, "text": "Кой от изброените НЕ е посочен в лекцията като превод на Software Engineering?", "opts": ["Софтуерни технологии", "Компютърни науки", "Софтуерно инженерство", "Инженеринг на програмното осигуряване"], "correct": 1, "expl": "Преводите са Софтуерни технологии, Софтуерно инженерство, Инженеринг на ПО"}, {"id": "L01-E-2", "n": 2, "text": "На кой етап се пада най-голям дял от разходите по ЖЦ?", "opts": ["Съпровождането на ПО", "Проектирането", "Разработката на изискванията", "Кодирането"], "correct": 0, "expl": "Съпровождането има най-голям дял"}, {"id": "L01-E-3", "n": 3, "text": "Коя дейност НЕ е от фазата „Съпровождане“ в модела на Фокс?", "opts": ["Добавяне на нови функции", "Отстраняване на установени грешки", "Добавяне на функции, свързани с промени в хардуера", "Сглобяване на програмите"], "correct": 3, "expl": "Сглобяването на програмите е от фазата Разработване"}, {"id": "L01-E-4", "n": 4, "text": "Какъв е приносът на Фокс?", "opts": ["Въвеждане на анализа на риска", "Въвеждане на прототипа", "Успоредност на фазите „използване“ и „продължаващо разработване“", "Въвеждане на UML"], "correct": 2, "expl": "Успоредност на използване и продължаващо разработване"}, {"id": "L01-E-5", "n": 5, "text": "Какво е характерно за модифицираните хронологични модели?", "opts": ["Фазите се припокриват във времето", "Липсват съществени части от ЖЦ", "Имат три измерения", "Няма никакви фази"], "correct": 0, "expl": "При модифицираните фазите се припокриват"}, {"id": "L01-E-6", "n": 6, "text": "Как се наричат още хронологичните стандартни модели заради това, че всеки етап завършва с проектна документация?", "opts": ["Risk-driven model", "Documentation-driven model", "Use case driven model", "Test-driven model"], "correct": 1, "expl": "Documentation-driven model"}, {"id": "L01-E-7", "n": 7, "text": "Към кои модели спада моделът на Гънтър?", "opts": ["Едномерните хронологични", "Частичните", "Двумерните (многомерни)", "Спиралните"], "correct": 2, "expl": "Двумерен — хронологично и функционално измерение"}, {"id": "L01-E-8", "n": 8, "text": "Кой е пример за частичен модел на ЖЦ?", "opts": ["V-образният модел", "Спиралният модел", "Моделът на Фокс", "Модел, базиран на заготовки (assets)"], "correct": 3, "expl": "Модел, базиран на заготовки (assets)"}, {"id": "L01-E-9", "n": 9, "text": "Чия собственост е RUP?", "opts": ["Microsoft", "Rational Software Corporation, сега IBM", "IEEE", "НАТО"], "correct": 1, "expl": "Rational Software Corporation, сега IBM"}, {"id": "L01-E-10", "n": 10, "text": "Как се наричат най-общите фундаментални подходи за разработване на софтуер?", "opts": ["Модели на ЖЦ", "Методологии", "Фази", "Парадигми"], "correct": 3, "expl": "Парадигми"}]}}, {"num": 2, "title": "Тема 2 — Подходи за разработване на софтуер", "short": "Подходи за разработване на софтуер", "summary": "### Подход и парадигма — дефиниции\n- **Дефиниция 1:** **Подход за разработване на софтуер** е **съвкупност от практики, правила, процедури, както и други подходи**, които трябва да се следват **през ЖЦ на ПП**, с цел ефективно разработване при зададените условия на ПП, с необходими свойства.\n- **Дефиниция 2:** Най-общите, фундаментални подходи за разработване на софтуер се наричат **парадигми**. Те се разделят на: **структурен подход** и **обектно-ориентиран подход**.\n- Структурният подход се базира на идеите за: **модулност**; **функционална декомпозиция и постъпкова детайлизация** на проблема чрез подход **„Отгоре-Надолу“ (Top-Down Design)**; **структурно програмиране**.\n\n### Изисквания към съвременните подходи (технологии) — 6 броя\n1. **Свеждане на човешкия фактор до минимум**;\n2. **Насоченост към колектив от програмисти**;\n3. **Освобождаване от канцеларщината**;\n4. **Стремеж за автоматизация на всички етапи** от работата на колектива;\n5. **Независимост от езика за програмиране**;\n6. Средства за **автоматично фиксиране в хронологичен ред на всички действия** в процеса на колективното изпълнение на ПП и др.\n\n### Неструктурно програмиране (Unstructured Programming)\n- Нарича се още **просто, последователно или императивно програмиране**.\n- **НП е първият подход** за разработка на софтуер.\n- Използва се **при начално обучение** — програми само с **една „main“ функция**.\n- **Минуси:** **Spaghetti Code**; **многократно срещане на една и съща последователност от оператори**.\n\n### Процедурен подход\n- Последователността от оператори се събира в едно цяло — **процедура, подпрограма, метод или функция**; използва се **„извикване“ (call)**.\n- В съвременното програмиране процедурата може да има **няколко изходни и няколко входни точки**, аргументи, да връща резултат.\n- Процедурните програми са **съвкупност от процедури, които се извикват една друга** с предаване на данни. След изпълнение управлението се връща на **оператора след call**.\n- **Плюсове:** програмите стават **по-структурирани и освободени от грешки**; **повторно използване на същия код**.\n- **Проблем** (от слайда за ООП): **преизползваемостта на кода е ограничена**.\n\n### Модулно програмиране (Modular programming)\n- **Набор от модули**, всеки групира програмни единици с **подобна функционалност**.\n- **Причини за поява:** процедурният подход дели програмата на процедури; групирането на процедури с подобна функционалност дава модули; **сложността на програмите** води до нови начини за разделяне на кода.\n- **Модул** — **отделна именована част на програмата**, обединяваща програмни единици, близки по функционалност; модулите са отделни **файлове, компилирани отделно**.\n- **Характеристики на модул:** **един вход и един изход** (принцип **IPO — вход–процес–изход**); **функционална завършеност**; **логическа независимост**; **слаба информационна свързаност**; **минимизиран размер**.\n- Разбиването на модули: **значително намалява времето за прекомпилация**; улеснява **груповата разработка**; улеснява развитието и подмяната на отделни модули.\n- **Взаимодействие:** включване на нужните модули (напр. за низове, графика); **чрез списък от параметри**. **Типични езици: Modula 2, Delphi (Object Pascal)**.\n- **Принципи:** сходни с **низходящото програмиране (отгоре-надолу)**; **функционална декомпозиция**; определяне на модули за дефинираните функции; функцията на най-високо ниво се обезпечава от **главния модул**.\n- **Плюсове:** повишена ефективност (**ранно разпаралелване**; всеки модул се проектира, програмира, компилира и тества отделно); **формализация и математически методи**; **пре-използване на код** (библиотека от типизирани и унифицирани модули); **енкапсулация**; комбиниране с други технологии.\n- **Минуси:** резултатът **зависи от методите за функционална декомпозиция**; изисква **планиране и висока дисциплина**; **контролът на качеството се осъществява трудно**.\n\n### Модули и класове\n- При нарастваща сложност модулите не стигат → появяват се **пакети, класове, шаблони**.\n- **Прилики:** скриване на информация (имплементацията); образуват **йерархия**.\n- **Разлики — класовете могат да:** се **инстанциират** (създаване на обекти); **наследяват** поведение и данни; **полиморфизмът** позволява отношенията между инстанциите да се **променят по време на изпълнение**, докато **отношенията между модулите са статични**.\n\n### Bottom-up и Top-down\n- **Отдолу-нагоре (bottom-up)** — стартира с **готови или адаптирани базови елементи**, свързват се в по-големи, до цялостна система.\n  - **Предимства:** библиотеки от елементи; **опит от подобни системи**; проектиране на ефективно управление на модулите.\n  - **Недостатъци:** **елементите се адаптират по-трудно от създаването на нови**; групирането не винаги води до система, съответстваща на **техническото задание**.\n- **Отгоре-надолу (top-down design):** специфицират се (не подробно) всички подсистеми на **първо ниво**; всяка се детайлизира постепенно; пише се кодът на **основната процедура** с имената на нужните функции; преглед на изискванията за всяка функция в **main()**; **завършва, когато всички обявени функции са кодирани**.\n  - **Предимства:** отделяне на ниско от високо ниво (модулна структура); **самостоятелна и паралелна разработка** на модулите; **кодът лесно се проследява**.\n  - **Недостатъци:** **няма функционалност до пълното разработване на всички функции от ниско ниво**; **проектното решение е уникално, трудно се формализира**.\n\n### Структурен подход (СПРС) и структурно програмиране\n- **Цели на структурното програмиране:** 1) улесняване на създаването на сложни програми чрез **замяна на творческия подход с конструктивен**; 2) избягване на **Spaghetti Code**; 3) улесняване на разбирането, съпровождането и модифицирането.\n- **Дейкстра (1965) и Боем (1966)**: опитните програмисти **не използват GO TO**; програмите са съединение/влагане на **3–4 конструкции с един вход и един изход**: **линейна последователност, условен преход, цикъл, обръщение към процедура**.\n- **„Проект на супер програмиста“** — **1969 г.**, научна конференция, **спонсорирана от НАТО**; представители на **IBM** предлагат идеите за **проектиране отгоре надолу и структурно програмиране**. Въпреки критиките и ООП, структурният подход остава **един от най-широко използваните**.\n- **Структурният подход включва:** функционална декомпозиция; **низходящо, постъпково проектиране (Stepwise Refinement и Top-Down design)**; **едновременно проектиране на алгоритъма и данните**; модулност.\n- **Основна разлика СПРС/ООПРС — начинът на декомпозиция:** СПРС → **функционална**, ООПРС → **ОО декомпозиция**.\n- **Низходящо постъпково проектиране** и **структурно програмиране** вървят заедно. На всяка стъпка в словесната формулировка се внася **само една структурна конструкция**. Кодирането също е постъпково, низходящо — от **най-външната към най-вътрешната** конструкция; всяка се заменя с една от **3 или 4 формални конструкции**: последователност, разклонение (**if, case**), цикъл (**for, while, do**), извикване на процедура (**call**). Синтактичната вложеност съответства на последователността на проектиране.\n- **Структурното програмиране забранява:** **goto**; **break/continue извън тялото на цикъл**; **множество изходни точки** (много return); **множество входни точки**.\n- Конструкциите имат **един вход и един изход**; могат да се съчленяват, влагат, разлагат.\n- **Милс, Ашкрофт и Мана**: всяка „правилна“ неструктурна програма **може да се трансформира в еквивалентна структурна**. Смислено е, ако се модифицира програма с объркана управляваща структура или за унифицирано представяне (и документиране).\n- **Конструкции (псевдокод):** линейна последователност (statement-1..3); извикване на процедура (**'gosub', но не 'goto'**); разклонение (**if…else**, **case … otherwise**); цикъл (**for (initial, final, increment)**, **while not condition**, **do … until condition**).\n- **Едновременно проектиране на алгоритъма и данните** — детайлизациите вървят почти паралелно.\n- **Тестване при СПРС:** може да стане **едва когато цялата програма е кодирана**; на ниските нива се поставят **„заглушки“** (stubs), произвеждащи един и същ очакван резултат — прилага се и при **модулния подход**; тестването може в някаква степен да е паралелно с детайлизацията.\n- **Преимущества:** програмите се „конструират“ от типови елементи → **по-ниски изисквания към квалификацията**, по-малко усилия → **по-висока производителност, по-ниска цена**; **качествена документация** (следва структурата, може да се автоматизира).\n- **Недостатъци:** нужно е **усвояване на специална техника**; **по-големи изчислителни ресурси (памет и време)**; **по-лоши експлоатационни характеристики**, по-дълги програми, по-голяма вероятност за грешка → **по-ниска надеждност**; **не могат да се разработват „уникални“ решения**.\n\n### Обектно-ориентиран подход (ООП)\n- **Структурен:** система = компоненти, реализиращи функции; **състоянието е централизирано** и се разделя между функциите.\n- **ОО:** система = **обекти, комуникиращи чрез съобщения**; **състоянието е децентрализирано** — всеки обект управлява собственото си състояние (атрибути + операции).\n- **ОО-подходът е развитие на структурния** — за по-лесно разработване, поддържане и еволюция на **големи ПС**; код, по-лесен за изучаване от **начинаещи**, и по-лесен за разбиране.\n- **Обект** — познаваем предмет, елемент или същност с важно функционално предназначение. Има **състояние, поведение и индивидуалност**.\n  - **Състояние** — всички възможни атрибути и **текущите им стойности** (Student1: fnom, name, age).\n  - **Поведение** — **операции или услуги, които променят един или няколко атрибута**.\n  - **Индивидуалност** — атрибутите и стойностите, които **отличават обекта от сродни обекти** (напр. **факултетен номер** „123456“ / „234567“; age и name могат да съвпадат).\n- **Клас** — обобщено описание на сходни обекти; **основно понятие** за ОО-подхода. **Обектите са екземпляри (инстанции) на класовете**.\n- Видимост: **private/protected** (класа и наследниците) или **public** (всички). Обектите наследяват атрибутите и операциите на класа.\n- Пример: клас **Student** в **UML и C#** — полета name, age; конструктор; свойства Name, Age **само за четене** (get); метод **DisplayData()**.\n- **Йерархия:** подкласовете наследяват супер-класа и имат свои атрибути/операции. Пример: **Транспортно средство** → **Автомобил, Автобус, Трактор**. **Множествено наследяване** — повече наследени свойства, но **затруднява проследяването на връзките**.\n- **Принципи:** **Капсулация (Encapsulation)** — данни + операции в класа с прост интерфейс; реализацията е скрита. **„ОО програмирането по природа е модулно — енкапсулацията е основно доказателство“**. **Наследяване (Inheritance)** — повторно използване; измененията се правят само в съответното ниво и се разпространяват. **Полиморфизъм** — **„Един интерфейс, множество от различни реализации“**. **Абстракция** — виждаме обекта **само от гледната точка, която ни интересува**.\n- **Съобщения:** 1) **„обект-съобщение“** — автономна изчислителна единица (**Smalltalk, Ruby, Python**); 2) **външен метод** — в повечето езици (**C++, Object Pascal, Java, C#, Oberon-2**).\n\n### Обектно-събитийна парадигма (ОСП)\n- **Едно от развитията на ОО парадигма**; новото понятие е **„събитие“**.\n- **Събитие** — **абстракция на инцидент или сигнал в реалния свят** (напр. **button1_Click()** = щракане върху бутон).\n- При събитие се генерира **съобщение**, което се обработва от **„обработчик на събитието“** — метод, разработен специално за него.\n- Най-нагледно — в **потребителския интерфейс** (верига от събития).\n- Съобщения се генерират при събития върху **„обекта-подател“**; предизвикват реакция в **„обекта-получател“** (може да е **същият обект**); получателят изпълнява операцията и **връща управлението на подателя**.\n- Пример (C#): `button1_Click(object sender, EventArgs e)` задава label1 = \"Ivan\", label2 = \"Dragan\", button1 = \"Click me\".\n\n### Капани за изпита\n- Парадигмите по Деф. 2 са **само две**: структурен и ОО; ОСП е **развитие на ОО**, а не трета основна парадигма в тази дефиниция.\n- **Процедурата** в съвременното програмиране **може** да има няколко входа/изхода, но **структурното програмиране ги забранява**.\n- **Модулът** има **един вход и един изход** (IPO); **отношенията между модулите са статични**, между инстанции на класове — динамични (полиморфизъм).\n- **Енкапсулация** е посочена и като **плюс на МП**, и като принцип на ООП.\n- Bottom-up: **адаптирането е по-трудно от създаването на нови** елементи; Top-down: **няма функционалност до края**.\n- **Дейкстра — 1965**, **Боем — 1966**, **супер програмист — 1969, НАТО, IBM**; **Милс, Ашкрофт и Мана** — трансформация в структурна програма.\n- Структурното програмиране **намалява** изискванията към квалификацията, но програмите изискват **повече памет и време**.\n- „Обект-съобщение“ → Smalltalk/Ruby/Python; „външен метод“ → C++/Java/C#/Object Pascal/Oberon-2.\n- Несъответствия в слайдовете: в съдържанието т.5 е „Модулно програмиране“, а заглавието на слайда е „Модулен подход“; заглавието е изписано „Пoдxoдu“ (смесени латински букви); „индувидуалност“ (вм. индивидуалност); „cynep-класа“ (вм. супер-класа); подклас е описан като „екземпляр на супер-класа“ — неточно (екземплярите са обекти); загадъчното „(1-60)“ след проекта на супер програмиста; въпрос 5 в края пита за изисквания/аналитичен модел, които не са в слайдовете на тази тема.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L02-A-1", "n": 1, "text": "Как се наричат най-общите, фундаментални подходи за разработване на софтуер?", "opts": ["Методологии", "Парадигми", "Модели на ЖЦ", "Стандарти"], "correct": 1, "expl": "Дефиниция 2 — фундаменталните подходи са парадигми"}, {"id": "L02-A-2", "n": 2, "text": "Кое от изброените НЕ е изискване към съвременните подходи за разработване на софтуер?", "opts": ["Свеждане на човешкия фактор до минимум", "Независимост от езика за програмиране", "Освобождаване от канцеларщината", "Насоченост към индивидуалния програмист"], "correct": 3, "expl": "Изискването е насоченост към колектив от програмисти"}, {"id": "L02-A-3", "n": 3, "text": "Кой е първият подход за разработка на софтуер?", "opts": ["Неструктурното програмиране", "Процедурният подход", "Модулното програмиране", "Структурният подход"], "correct": 0, "expl": "НП е първият подход за разработка на софтуер"}, {"id": "L02-A-4", "n": 4, "text": "Кои са типични езици, имплементиращи модулното програмиране?", "opts": ["Smalltalk и Ruby", "C# и Java", "Modula 2 и Delphi (Object Pascal)", "Python и Oberon-2"], "correct": 2, "expl": "Типични езици за МП: Modula 2, Delphi (Object Pascal)"}, {"id": "L02-A-5", "n": 5, "text": "Кой учен през 1965 г. е свързан с идеята, че опитните програмисти не използват оператора GO TO?", "opts": ["Боем", "Милс", "Дейкстра", "Ашкрофт"], "correct": 2, "expl": "Дейкстра (1965), Боем (1966)"}, {"id": "L02-A-6", "n": 6, "text": "Кой е основният недостатък на подхода отгоре-надолу (top-down)?", "opts": ["Няма функционалност до пълното разработване на всички функции от ниско ниво", "Елементите се адаптират по-трудно от създаването на нови", "Кодът трудно се проследява", "Не позволява паралелна разработка на модулите"], "correct": 0, "expl": "Top-down: няма функционалност до края; b е недостатък на bottom-up"}, {"id": "L02-A-7", "n": 7, "text": "Какви са трите характеристики на всеки обект според ОО подхода?", "opts": ["Клас, метод, свойство", "Атрибут, операция, интерфейс", "Капсулация, наследяване, полиморфизъм", "Състояние, поведение, индивидуалност"], "correct": 3, "expl": "Обектът има състояние, поведение и индивидуалност"}, {"id": "L02-A-8", "n": 8, "text": "С коя фраза се изразява накратко смисълът на полиморфизма?", "opts": ["„Един клас — един обект“", "„Един интерфейс, множество от различни реализации“", "„Скриване на реализацията от външния свят“", "„Виждаме обекта само от интересуващата ни гледна точка“"], "correct": 1, "expl": "„Един интерфейс, множество от различни реализации“"}, {"id": "L02-A-9", "n": 9, "text": "Какво е новото понятие в обектно-събитийната парадигма?", "opts": ["Събитие", "Клас", "Модул", "Процедура"], "correct": 0, "expl": "Новото понятие в ОСП е „събитие“"}, {"id": "L02-A-10", "n": 10, "text": "Каква е основната разлика между структурния и ОО подход?", "opts": ["Използваният език за програмиране", "Наличието на процедури", "Начинът на декомпозиция на системата", "Броят на програмистите в екипа"], "correct": 2, "expl": "Функционална срещу ОО декомпозиция"}], "B": [{"id": "L02-B-1", "n": 1, "text": "Как се нарича още неструктурното програмиране?", "opts": ["Модулно или низходящо програмиране", "Обектно или събитийно програмиране", "Просто, последователно или императивно програмиране", "Декларативно програмиране"], "correct": 2, "expl": "Просто, последователно или императивно програмиране"}, {"id": "L02-B-2", "n": 2, "text": "Кой е минус на неструктурното програмиране?", "opts": ["Spaghetti Code", "Твърде много модули", "Високи изисквания към квалификацията", "Невъзможност за създаване на main функция"], "correct": 0, "expl": "Минуси: Spaghetti Code и повтарящи се последователности оператори"}, {"id": "L02-B-3", "n": 3, "text": "Кое от изброените НЕ е характеристика на модул при модулното програмиране?", "opts": ["Функционална завършеност", "Логическа независимост", "Слаба информационна свързаност", "Множество входни и изходни точки"], "correct": 3, "expl": "Модулът е с един вход и един изход"}, {"id": "L02-B-4", "n": 4, "text": "Какво означава принципът IPO, реализиран от модула?", "opts": ["Наследяване–полиморфизъм–обект", "Вход–процес–изход", "Интерфейс–процедура–обект", "Инстанция–параметър–операция"], "correct": 1, "expl": "IPO — вход–процес–изход"}, {"id": "L02-B-5", "n": 5, "text": "Кое е недостатък на подхода отдолу-нагоре (bottom-up)?", "opts": ["Групирането не винаги води до система, напълно съответстваща на техническото задание", "Няма функционалност до края на разработката", "Не позволява използване на библиотеки от елементи", "Не може да се използва опит от подобни системи"], "correct": 0, "expl": "Bottom-up — системата може да не съответства на заданието"}, {"id": "L02-B-6", "n": 6, "text": "През коя година е описан експериментът „проект на супер програмиста“?", "opts": ["1965", "1966", "1972", "1969"], "correct": 3, "expl": "1969 г. — конференция на НАТО, представители на IBM"}, {"id": "L02-B-7", "n": 7, "text": "Кои автори посочват, че всяка „правилна“ неструктурна програма може да се трансформира в еквивалентна структурна?", "opts": ["Дейкстра и Боем", "Милс, Ашкрофт и Мана", "Манева и Ескенази", "Сомървил"], "correct": 1, "expl": "Милс, Ашкрофт и Мана"}, {"id": "L02-B-8", "n": 8, "text": "Какво НЕ забранява структурното програмиране?", "opts": ["Използване на goto", "Множество изходни точки (няколко return) във функция", "Влагане на конструкции една в друга", "Множество входни точки във функция"], "correct": 2, "expl": "Конструкциите могат да се съчленяват и влагат"}, {"id": "L02-B-9", "n": 9, "text": "Какво представлява поведението на обект?", "opts": ["Всички възможни атрибути и текущите им стойности", "Атрибутите, които го отличават от сродни обекти", "Обобщено описание на подобни обекти", "Операции или услуги, които променят един или няколко атрибута на обекта"], "correct": 3, "expl": "Поведение — операции, променящи атрибути"}, {"id": "L02-B-10", "n": 10, "text": "Какво е събитие в ОСП?", "opts": ["Абстракция на инцидент или сигнал в реалния свят", "Специален клас без атрибути", "Модул с един вход и един изход", "Външен метод за създаване на обекти"], "correct": 0, "expl": "Събитие — абстракция на инцидент или сигнал в реалния свят"}], "C": [{"id": "L02-C-1", "n": 1, "text": "Според Дефиниция 1 подходът за разработване на софтуер е съвкупност от какво?", "opts": ["Езици за програмиране и компилатори", "Модули и класове", "Етапи на жизнения цикъл", "Практики, правила, процедури, както и други подходи, следвани през ЖЦ на ПП"], "correct": 3, "expl": "Практики, правила, процедури и други подходи през ЖЦ на ПП"}, {"id": "L02-C-2", "n": 2, "text": "На кои идеи се базира структурният подход?", "opts": ["Капсулация, наследяване, полиморфизъм", "Модулност, функционална декомпозиция с Top-Down Design, структурно програмиране", "Събития, съобщения, обработчици", "Готови компоненти, библиотеки, bottom-up"], "correct": 1, "expl": "Модулност, функционална декомпозиция (Top-Down), структурно програмиране"}, {"id": "L02-C-3", "n": 3, "text": "Какво е характерно за процедурния подход?", "opts": ["Програмата съдържа само една main функция", "Обектите комуникират чрез съобщения", "Последователността от оператори се събира в процедура, която се извиква (call)", "Системата се разделя на независими компилирани файлове"], "correct": 2, "expl": "Процедура/подпрограма/метод/функция, извиквана с call"}, {"id": "L02-C-4", "n": 4, "text": "Кое НЕ е посочено като плюс на модулното програмиране?", "opts": ["Лесен контрол на качеството", "Ранно разпаралелване", "Пре-използване на код", "Енкапсулация"], "correct": 0, "expl": "Напротив — контролът на качеството се осъществява трудно"}, {"id": "L02-C-5", "n": 5, "text": "Кое отличава класовете от модулите?", "opts": ["Скриват информация за имплементацията", "Класовете могат да се инстанциират и наследяват, а отношенията между модулите са статични", "Образуват йерархия", "Компилират се отделно"], "correct": 1, "expl": "Инстанцииране, наследяване, полиморфизъм; модулите са статични"}, {"id": "L02-C-6", "n": 6, "text": "Кои конструкции (3–4 на брой) се използват в структурното програмиране?", "opts": ["goto, break, continue, return", "Клас, обект, метод, събитие", "Линейна последователност, условен преход, цикъл, обръщение към процедура", "Модул, пакет, шаблон, клас"], "correct": 2, "expl": "Последователност, условен преход, цикъл, обръщение към процедура"}, {"id": "L02-C-7", "n": 7, "text": "Кой подход за тестване се прилага при структурния (и модулния) подход на ниските нива?", "opts": ["Поставяне на „заглушки“, произвеждащи един и същ очакван резултат", "Тестване само на главния модул", "Автоматично генериране на тестове от UML", "Тестване от крайния потребител"], "correct": 0, "expl": "Заглушки на ниските нива — и при модулния подход"}, {"id": "L02-C-8", "n": 8, "text": "Кое е недостатък на структурното програмиране?", "opts": ["Висока цена на разработката", "Липса на документация", "Високи изисквания към квалификацията", "По-големи изисквания към изчислителните ресурси (памет и време)"], "correct": 3, "expl": "Структурните програми изискват повече памет и време"}, {"id": "L02-C-9", "n": 9, "text": "Какво е състоянието на системата при ОО подход?", "opts": ["Централизирано и разделено между функции", "Децентрализирано — всеки обект управлява собственото си състояние", "Записано в главния модул", "Статично и неизменно"], "correct": 1, "expl": "При ОО състоянието е децентрализирано"}, {"id": "L02-C-10", "n": 10, "text": "В кои езици взаимодействието между обектите става чрез пренос на „обект-съобщение“?", "opts": ["C++, Java, C#", "Object Pascal и Oberon-2", "Modula 2 и Delphi", "Smalltalk, Ruby, Python"], "correct": 3, "expl": "Обект-съобщение — Smalltalk, Ruby, Python"}], "D": [{"id": "L02-D-1", "n": 1, "text": "На кои два вида се разделят парадигмите според лекцията?", "opts": ["Структурен и обектно-ориентиран подход", "Процедурен и модулен подход", "Top-down и bottom-up", "Неструктурен и обектно-събитиен подход"], "correct": 0, "expl": "Структурен и обектно-ориентиран , "text": "Каква е последната стъпка при проектиране отгоре-надолу?", "opts": ["Спецификация на подсистемите от първо ниво", "Написване на кода на основната процедура", "Процесът завършва, когато всички обявени функции са кодирани", "Свързване на готови базови елементи"], "correct": 2, "expl": "Top-down завършва, когато всички обявени функции са кодирани"}, {"id": "L02-E-5", "n": 5, "text": "Какво се появява, когато модулите се окажат неспособни да отговорят на нарастващата сложност на програмите?", "opts": ["Пакети, класове, шаблони", "Процедури и функции", "goto оператори", "Заглушки"], "correct": 0, "expl": "Появяват се пакети, класове, шаблони"}, {"id": "L02-E-6", "n": 6, "text": "Кога според лекцията тестването при СПРС може да стане (изцяло)?", "opts": ["Още преди кодирането", "След всеки модул поотделно, без заглушки", "Само от крайния потребител", "Едва когато цялата програма е кодирана"], "correct": 3, "expl": "Едва когато цялата програма е кодирана (със заглушки частично по-рано)"}, {"id": "L02-E-7", "n": 7, "text": "Кое е предимство на структурното програмиране?", "opts": ["Възможност за уникални решения", "По-кратки програми", "Намаляване на изискванията към квалификацията на проектантите и програмистите", "По-малко памет и време при изпълнение"], "correct": 2, "expl": "Програмите се конструират от типови елементи — по-ниска квалификация"}, {"id": "L02-E-8", "n": 8, "text": "Кое твърдение за ОО подхода е вярно според лекцията?", "opts": ["Той напълно изключва структурния подход", "Той е развитие на структурния подход", "Той предхожда процедурния подход", "Той е вид неструктурно програмиране"], "correct": 1, "expl": "ОО-подходът е развитие на структурния"}, {"id": "L02-E-9", "n": 9, "text": "Кой принцип на ООП е „основно доказателство“, че ОО програмирането по природа е модулно?", "opts": ["Полиморфизъм", "Абстракция", "Наследяване", "Енкапсулация (капсулация)"], "correct": 3, "expl": "Енкапсулацията е основното доказателство за модулността на ООП"}, {"id": "L02-E-10", "n": 10, "text": "Какво прави „обектът-получател“ след като получи съобщение?", "opts": ["Изпълнява посочената операция и връща управлението на обекта-подател", "Генерира ново събитие и спира програмата", "Създава нов клас", "Препраща съобщението на главния модул"], "correct": 0, "expl": "Изпълнява операцията и връща управлението на подателя"}]}}, {"num": 3, "title": "Тема 3 — Съвременни технологии за разработване", "short": "Съвременни технологии за разработване", "summary": "### Структура на темата (3 групи технологии)\n1. **Технологии за „Ускорено разработване“** — гъвкави (**agile**) технологии (пример: **Extreme programming – XP**); **разработване с прототипиране**; **разработване с участието на потребителите**.\n2. **Технологии за „Разработване с мултиплициране“** — **подход с повторно използване – ППИ (Re-use подход)**; **компонентно програмиране**.\n3. **Технологии за „Разработване на надежден софтуер“** — минимизиране на дефектите: подходи **fault-free** и **fault avoidance** (пример: **Cleanroom SE**); софтуер с **приемливо ниво на грешки (fault tolerance)**; **защитно програмиране**.\n\n### 1.1. Гъвкави (agile) технологии\n- **Причини за появата:** в **края на миналия век** се променя бизнес средата за разработване и начинът на реализиране на системите; динамично се променят пазарните условия; променя се стилът на работа на разработчиците.\n- **Основни принципи (5):**\n  1. **Активно включване на потребителите**;\n  2. Реализация на **„разрастващо се“ (инкрементално)** разработване;\n  3. Регламентиране на стила на работа, основан на **компетентност, мотивираност и екипност**;\n  4. **Приемане на неизбежността на промените**;\n  5. Придържане към **опростени конструкции и схеми на работа** с цел минимизиране на ресурсите.\n- **Гъвкави технологии:** **Екстремно програмиране (XP)**; **Бързо разработване (RAD – Rapid Application Development)**; **Адаптивно разработване**; **SCRUM**.\n- **SCRUM** — **итеративна, инкрементална рамка за управление на проекти**. **1987**, от **scrummage** — „спорна топка“ в **ръгби** (холистичен подход, рестартиране на играта след кратки прекъсвания). Процесът се състои от итерации, наречени **спринтове**, с продължителност **1–4 седмици**; в края на всеки спринт има **работеща версия на продукта** с всички готови задачи от **backlog-а**.\n- Гъвкавите технологии **не предлагат универсално решение** за разработка на не „критичен“ софтуер.\n\n### Extreme programming (XP)\n- **Дефиниция:** XP е **лека методология за малки и средни колективи**, разработващи софтуер при **неясни или бързо променящи се изисквания**.\n- Определени принципи (**12 на брой**) и практики се довеждат до **възможния си предел (екстремум)** — непрекъснати **итерации, тестване, преработка на архитектурата и кода, участие на клиента**.\n- **Цел:** **скоростно получаване на конкретен резултат**; удовлетворяване на основните изисквания на възложителя; **сравнително по-бавна доработка** на системата според допълнителните изисквания.\n- **Характерни особености:** а) **кратки итерации** — за реагиране на значителни изменения в изискванията; б) развитието се разглежда от гледна точка на **рисковете за срока и бюджета**; в) изисква **високопроизводителен колектив с добри взаимоотношения** и възможност участниците да изпълняват **разнообразни дейности**.\n- **12-те принципа на XP:**\n  1. **Взаимодействие** — синхронизиране на работата съобразно структурата на проекта;\n  2. **Избор на приоритети** — с възложителя се решава коя функция е задължителна и коя отсрочена;\n  3. **Малки реализации** — работоспособна версия много бързо, чести разширения;\n  4. **Система за именоване** — **единна терминология**;\n  5. **Опростен продукт** — **не се залагат бъдещи възможности**;\n  6. **Тестването като методически подход** — **тестовете се подготвят предварително** по изискванията, после се пише кодът;\n  7. **Преоценка на потребностите** — структурата постоянно се подобрява, без повторения и непотребни възможности;\n  8. **Работа по двойки** — **единият пише кода, другият обмисля архитектурата**;\n  9. **Колективна собственост** — **целият код принадлежи на всички**, единен стил;\n  10. **Непрекъсната итерация** — многократно събиране на продукта → решава проблеми с **интегрирането на модули**;\n  11. **40-часова работна седмица** — „уморените програмисти правят много грешки“;\n  12. **Потребител на разположение** — във всеки момент има специалист на възложителя.\n\n### 1.2. Разработване с прототипиране\n- **Дефиниция:** прототипиране е **съвкупност от дейности, осигуряващи ранно демонстриране на някои свойства на софтуера**, който трябва да бъде създаден.\n- **Цел:** **да се определят изискванията** към разработваната система.\n- **Създаване на прототип:** **проектиране** (избор на функции — **вертикален** или **хоризонтален избор**) → **разработка** → **оценяване** (експерти или потребители, по документ с критерии) → **използване** — **2 възможности: отхвърляне** на прототипа или **използване като база** за целевата система.\n- **Видове прототипиране:**\n  - **Изследователско** — изяснява изискванията чрез **няколко алтернативни решения**;\n  - **Експериментално** — проверява **дали избрано решение е подходящо**;\n  - **Еволюционно** — динамична среда, променящи се изисквания; продуктът е **последователност от инкременти, всеки прототип за следващия**.\n- **Методи за създаване:** **езици от четвърто поколение (4GL)**; **готови софтуерни компоненти**.\n- **Недостатъци:** неподходяща **операционна или хардуерна среда**; **игнориране на характеристики**, които се оказват задължителни; **многократното модифициране → ниска съпровождаемост**.\n\n### 1.3. Разработване с участието на потребителя\n- Навлиза **в края на миналия век**. Съвкупност от методи, техники и действия, осигуряващи **активното участие на потребителя** в проектирането и създаването на системата.\n- **Цел:** **да се повиши активността и отговорността на потребителя за качеството** чрез участие и в междинни фази.\n- **Видове софтуерни проекти:**\n  - **Автономни СП** — **без конкретен възложител** (след **маркетингово проучване**);\n  - **Възложени СП** — **с конкретен възложител**, който финансира и става собственик. Класическите подходи: участие на потребителя **само в началната и крайната фаза** (изисквания; оценка и приемане). Алтернатива: участие на потребителя — напр. **еволюционно прототипиране** (Разработчикът създава междинни ПП, всеки разширение на предния; Потребителят ги тества в реални условия).\n\n### 2.1. Подход на повторно използване (ППИ, Re-use)\n- **Същност:** **съвкупност от планирани и систематични дейности** за **максимално използване на съществуващи софтуерни елементи** при създаване на нов софтуер.\n- **Цел:** **намаляване на сроковете и стойността** на разработките.\n- **6 критерия за класификация на СЕ:** **същност, обхват, начин на осъществяване, използвана техника, начин на използване, вид на използвания софтуерен продукт**.\n- **По същност:** **идеи или концепции** (алгоритми, методи, техники, формални модели); **софтуерни компоненти — най-често използваният тип** (цели приложни системи; подсистеми с универсално предназначение; програмни модули/функции; процедури или умения — **know-how**).\n- **По обхват:** **вертикално** — в избрана **приложна област** се създават основни модели за всички системи в нея; **хоризонтално** — **универсални компоненти** за различни области (СУБД, разпределени среди, GUI).\n- **По начин на осъществяване:** **планирано и систематично** (регламентирани принципи и процедури в организацията); **инцидентно (ad-hoc)** — за конкретен проект се търсят съществуващи СЕ.\n- **По използвана техника:** **сглобяващо** — компоненти се вграждат като основни блокове; **генериращо** — концепции само на **спецификационно ниво**, а **генератори на програми** автоматично създават кода.\n- **По начин на използване:** **без промяна** → **повишаване на качеството и минимизиране на усилията за съпровождане**; **с модифициране** → допълнително специфициране, реализация и тестване.\n- **По вид продукт:** спецификации, проекти, фрагменти от програмен текст, документация, тестови примери.\n- **За успешно прилагане:** осъзнаване на необходимостта (качество — проверени елементи; по-бързо излизане на пазара); **създаване и документиране на библиотека от компоненти**; **обучаване** на участниците да я използват.\n\n### 2.2. Разработване чрез компоненти (Component-based development)\n- **Вариант на ППИ**, при който системите **се сглобяват от съществуващи компоненти**.\n- **Компонент:** софтуерна единица с функционалност и зависимости, **изцяло определени от интерфейсите ѝ**; комбинира се с други, без да се взема предвид реализацията.\n- **Характеристики на компонент (3):** **стандартизиран**, **независим**, **вградим**.\n- Изисква **преговори с потребителите** — да приемат „слепен“ софтуер и да са **склонни на компромиси**.\n- **Не може да бъде обявен за парадигма** — проблеми: няма **универсален модел** за компонентно разработване; промишлено производство на компоненти; стандартизирано документиране; бързо идентифициране на компонентите.\n\n### 3. Разработване на надежден софтуер — основни понятия\n- **Надеждността на функциониране** е **динамична характеристика**, свързана с **честотата на сривове**.\n- **Срив** — ситуация по време на работа, при която софтуерът започва да се държи **по необичаен и неочакван начин**. Сривовете се дължат на **дефекти**.\n- **Дефект** — **всяко отклонение от изискванията** към програмата; дефектите се дължат на **една или няколко грешки**.\n\n### 3.1. Минимизиране на дефектите\n- **fault-free software development** (софтуер без грешки) — **големи разходи**; оправдан **само за „критични“ системи** или изключително скъпо струващи дейности.\n- **fault avoidance software development** (напр. **Cleanroom SE**) — софтуер с **минимално количество грешки**; цел — да се **намали възможността за внасяне на грешки**.\n- **Принципи (5):** а) прецизни, по възможност **формални спецификации**; б) проектиране с **капсулация (скриване) на информацията**; в) **систематична верификация и валидация** в контролни точки; г) планиране на **тестването** за откриване на останалите грешки; д) **избягване на рискови езикови конструкции**.\n- **Да се избягват:** **числа с плаваща точка** (проблеми при сравняване); **указатели**; **паралелизъм**; **рекурсия**; **системни прекъсвания**.\n- **Скриване на информацията** — заимствано от **военните организации („need to know“)**: всеки компонент има достъп **само до нужните му данни**; улеснява се от типовете данни — класове, интерфейси.\n\n### Cleanroom Software Engineering\n- Разработен от **Харлан Милз (в слайда „Милзом“) и колеги от IBM**, **80-те години на XX век**.\n- **Основен принцип:** **избягването на грешки (fault avoidance) е по-добро от тяхното отстраняване**.\n- Названието е **заимствано от електронната промишленост** („чиста стая“). Цел: ПО със **сертифицирано ниво на надеждност**; използва много **формални методи** и методи за осигуряване на качеството.\n- **Основава се на (3):** **формални спецификации**; **инкрементална реализация**; **проектиране и имплементация на статистически тестове**.\n\n### 3.2. Приемливо ниво на грешки (fault tolerance)\n- **fault tolerance software** — проектиран така, че **продължава работата си и при наличие на грешки**.\n- **4 основни функции:** а) **прогнозиране или откриване на грешки** преди срив; б) **оценка на пораженията** след срив; в) **възстановяване след срив** (отстраняване на повредите или **връщане към предишно устойчиво състояние**); г) **локализиране и отстраняване** на грешките.\n- **Методи (4):** **принцип на повтарящите се елементи**; **N-версийно програмиране**; **възстановяващи блокове**; **обработка на изключенията**.\n  - **Повтарящи се елементи** — за една функция се реализират **повече от 1 (обикновено нечетен брой)** компоненти; резултатите се сравняват и работата продължава с **най-често повтарящия се резултат**.\n  - **N-версийно програмиране** — избира се **критична за функционирането компонента** (реализира се в N версии).\n  - **Възстановяващи блокове** — проверяват за срив и съдържат **алтернативен код**. Пример: **3 компонента с 3 различни алгоритъма** + **тестваща компонента**; изпълнява се алгоритъм 1, при съмнение — 2, после 3; при неуспех и на третия се включва **специална програмна част**.\n  - **Обработка на изключенията (exception handlers)** — **изключение е неочаквано събитие** по време на изпълнение, заради което програмата не може да бъде изпълнена успешно; езиците имат вградени възможности.\n\n### Защитно програмиране\n- Основава се на **предположението, че в програмите има неоткрити грешки** → още при програмирането се вграждат механизми за откриване на грешката, оценка на засегнатите части и отстраняване на последствията.\n- **Критични за състоянието променливи** — текуща проверка чрез **твърдения (условия)** или **контролни суми**. В **СУБД**: промените се пазят в **буфер** и се внасят **само след успешно завършване на транзакцията**.\n- **Контролни точки** — най-често при **сложни изчислителни задачи**: поетапни изчисления, във всяка точка се **запомнят междинните резултати**; при срив — **връщане към последното запомнено състояние**.\n\n### Литература\nНели Манева, Аврам Ескенази — „Софтуерни технологии“ (Анубис, 2001; КЛМН, 2006); **Sommerville, Software Engineering, 9 ed., 2011**.\n\n### Капани за изпита\n- **5 принципа на гъвкавите технологии** vs **12 принципа на XP** — не ги смесвайте.\n- **SCRUM** е **рамка за управление на проекти** (спринтове **1–4 седмици**), а XP е **методология** за малки и средни колективи.\n- Цел на прототипирането = **определяне на изискванията**; цел на ППИ = **намаляване на сроковете и стойността**; цел на участието на потребителя = **активност и отговорност за качеството**.\n- **Вертикален/хоризонтален** се среща два пъти: като **избор** при проектиране на прототип и като **обхват** на повторното използване (вертикално = една приложна област, хоризонтално = универсални компоненти).\n- **Изследователско** (алтернативни решения) vs **експериментално** (проверява избрано решение) vs **еволюционно** (инкременти) прототипиране.\n- **Сглобяващо** (вграждане на компоненти) vs **генериращо** (генератори от спецификации) ПИ.\n- **fault-free** (без грешки, скъпо, само критични) vs **fault avoidance** (минимум грешки, Cleanroom) vs **fault tolerance** (работи и при грешки).\n- **Дефект** = отклонение от изискванията; **срив** = необичайно и неочаквано поведение; **изключение** = неочаквано събитие по време на изпълнение.\n- Cleanroom: название от **електронната промишленост**; „скриване на информацията“ — от **военните**.\n- Повтарящи се елементи — **нечетен брой**, работи се с **най-често срещания** резултат.\n- Неточности в слайдовете: името е изписано **„Харлан Милзом“** (всъщност Harlan **Mills**); „промянат“, „Игнориранине“, „Паралелелизъм“ са правописни грешки; описанието на **N-версийното програмиране** е недовършено (само „избира се критична компонента“); в изпитните въпроси прототипирането и участието на потребителите са причислени към „гъвкави технологии“, докато в съдържанието са отделни подточки на „Ускорено разработване“.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L03-A-1", "n": 1, "text": "Колко на брой са основните принципи на Extreme programming (XP) според лекцията?", "opts": ["5", "12", "10", "7"], "correct": 1, "expl": "XP има 12 принципа (гъвкавите технологии имат 5)"}, {"id": "L03-A-2", "n": 2, "text": "Каква е продължителността на спринтовете в SCRUM?", "opts": ["1 ден", "2–3 месеца", "6 месеца", "1–4 седмици"], "correct": 3, "expl": "Спринтовете са 1–4 седмици"}, {"id": "L03-A-3", "n": 3, "text": "Как е дефинирано прототипирането в лекцията?", "opts": ["Съвкупност от дейности, осигуряващи ранно демонстриране на някои свойства на софтуера, който трябва да бъде създаден", "Съвкупност от планирани и систематични дейности за максимално използване на съществуващи софтуерни елементи", "Сглобяв "expl": "Динамична характеристика, свързана с честотата на сривове"}, {"id": "L03-E-8", "n": 8, "text": "Какво е изключение (exception)?", "opts": ["Неочаквано събитие по време на изпълнение, заради което програмата не може да бъде изпълнена успешно", "Отклонение от изискванията към програмата", "Компонент с алтернативен код", "Контролна точка за запомняне на междинни резултати"], "correct": 0, "expl": "Изключение = неочаквано събитие по време на изпълнение"}, {"id": "L03-E-9", "n": 9, "text": "Как се реализира принципът на защитното програмиране в СУБД?", "opts": ["Чрез N-версийно програмиране на заявките", "Чрез работа по двойки на администраторите", "Чрез отказ от транзакции", "Промените се съхраняват в буфер и се внасят в базата само след успешно завършване на транзакцията"], "correct": 3, "expl": "Буфер, внасяне след успешна транзакция"}, {"id": "L03-E-10", "n": 10, "text": "Кое от изброените е метод за разработване на надежден софтуер с приемливо ниво на грешки?", "opts": ["Работа по двойки", "Еволюционно прототипиране", "N-версийно програмиране", "Генериращо повторно използване"], "correct": 2, "expl": "Методи: повтарящи се елементи, N-версийно, възстановяващи блокове, изключения"}]}}, {"num": 4, "title": "Тема 4 — Спецификация на изискванията", "short": "Спецификация на изискванията", "summary": "### Понятия и други названия\n- **Спецификация на софтуерните изисквания (Software Requirements Specification, SRS)** се нарича още: **„Документ на изискванията към софтуера“ (Software requirements document)**, **„Техническо задание“** или **„Технико-икономическо задание“**.\n- SRS е **„официално описание на изискванията към софтуера“**; **не е документ за проектиране**.\n- **Двойственост на понятието „спецификация“**: спецификация = **описанието**; спецификация = **процес на описване** на изискванията в документа на изискванията (специфициране).\n- Основна литература: **Sommerville — „Software Engineering“**.\n\n### Изискване към софтуера (Software Requirement)\n- **Дефиниция 1**: изискванията са **функциите**, които трябва да притежава ПС, заедно с **други свойства**, които тя трябва да има, с цел адекватно изпълнение на тези функции.\n- **Дефиниция 2 (Sommerville)**: изискванията са описания на **услугите, които клиентът изисква от системата** и на **ограниченията, при които тя работи**.\n- Градиране по детайлност: от **абстрактна декларация** до **максимално детайлно и точно описание** на функция на системата.\n- **Двойственост на изискванията**: могат да са **основа за оферта за договор** (ВЪЗЛОЖИТЕЛЯТ пише изискванията така, че различни изпълнители да предлагат решения) и **основа на самия договор** (ИЗПЪЛНИТЕЛЯТ описва системата подробно за клиента).\n\n### Класификации на изискванията\n- **Класификация 1 (Sommerville)**: **потребителски изисквания** и **системни изисквания**. Нужни са различни нива, защото спецификациите трябва да са **разбираеми за своите читатели**.\n- Пример **MHC-PMS** (система за управление на психичното здраве): потребителско — „да генерира месечно отчети за цената на лекарствата, предписани от всяка клиника“; системни — обобщение **последния работен ден на месеца**, отчет автоматично **след 17.30**, отчет за всяка клиника (имена на лекарства, общ брой, брой различни дози, обща сума), отделни отчети за различните дози, достъп само за оторизирани потребители от **management access control list**. Едно потребителско изискване се **разгръща в няколко системни**.\n- **Класификация 2**: **функционални**, **нефункционални**, **изисквания по отношение на областта**.\n- **Няма ярко разграничение** между функционални и нефункционални: „сигурност“ е нефункционално, но при детайлизиране дава функционално (напр. **логване на потребители — user authentication**).\n- **Функционални** — отговарят на въпроса **„какво трябва да прави системата“**; записват се текстово („системата трябва да позволява на служителя да прави приходни и разходни фактури“); съвременното графично средство — **UML use case diagrams**.\n- Примери за функционални (MHC-PMS): достъп до списъците със срещи (appointments lists) на всички клиники; всеки ден за всяка клиника — списък на записаните пациенти; всеки член на персонала се идентифицира еднозначно чрез **8-цифрен номер**.\n- **Нефункционални**: **изисквания към продукта (Product requirement)**, **организационни**, **външни**.\n- **Конфликт между нефункционални**: система за **космически кораб** — минимизиране на теглото и броя чипове срещу минимизиране на консумацията на мощност.\n- По задължителност: **задължителни** и **препоръчителни**.\n\n### SRS — съдържание, потребители, кога и от кого\n- SRS включва **част за потребителите на системата** и **част за изпълнителите**.\n- Има разнообразен набор от потребители → трябва да бъде **компромисна**: да отразява изискванията на клиентите и на разработчици, тестери, поддържащи и развиващи системата.\n- **Разработка на изискванията**: определят се, анализират и описват очакванията на крайния потребител. Основни дейности: **извличане и анализ на изискванията** и **специфициране**.\n- SRS се разработва **по правило от ИЗПЪЛНИТЕЛЯ**, **желателно с участието на ВЪЗЛОЖИТЕЛЯ**.\n\n### Договорът и мястото на SRS\n- Предварително се сключва **„Договор за разработване на софтуер“** — **двустранен, възмезден и неформален**, в **2 екземпляра** (по един за всяка страна). Задължителен текст: споровете се решават **в дух на добра воля чрез преговори**.\n- Примерна структура: предмет/влизане в сила; права и задължения на изпълнителя; на възложителя; приемане на работата/гаранционна поддръжка; възнаграждение/плащане; отговорност; прекратяване/разваляне; кореспонденция/лица за контакт; други условия; **Приложение: SRS**.\n- Детайлността зависи от **вида на системата** и **процеса на разработка**:\n  - **елементарни** продукти — изискванията са **раздел от самия договор**;\n  - **средно сложни** — в **приложение към договора**;\n  - **много сложни и критични** — **отделен документ**, максимално подробни и точни.\n- **In
