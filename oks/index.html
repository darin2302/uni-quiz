<!doctype html>
<html lang="bg">
<head>
<script src="../gate.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОКС тестове</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f8f9fb;--text:#1d2125;--muted:#5f6b76;--border:#d8dde3;
  --accent:#0f6cbf;--accent-ink:#ffffff;--accent-soft:#e7f0fa;
  --ok:#1e7e34;--ok-bg:#e6f4ea;--bad:#c62828;--bad-bg:#fdecea;--flag:#d97706;--half:#b45309;--half-bg:#fdf3e1;--code:#eef1f4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
    --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
    --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--half:#fbbf24;--half-bg:#3a2e14;--code:#2a2f36;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
  --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
  --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--half:#fbbf24;--half-bg:#3a2e14;--code:#2a2f36;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;color:inherit}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.2rem;margin:28px 0 12px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  padding:7px 13px;border-radius:7px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,.nav-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:.78rem;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.badge.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.half{background:var(--half-bg);color:var(--half);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;
  align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px;box-shadow:var(--shadow)}
.lec-h{display:flex;align-items:center;gap:12px;min-width:0}
.num{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.lec-t{font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem;margin:4px 0}
.toggle input{width:17px;height:17px;accent-color:var(--accent);flex:none}
select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);max-width:100%}

/* quiz */
.quiz{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:16px}
.side .card{padding:12px}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.nav-b{position:relative;height:42px;border:1px solid var(--border);border-radius:5px;background:var(--panel);cursor:pointer;
  font-size:.85rem;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:3px;overflow:hidden}
.nav-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:transparent}
.nav-b.ans::after{background:var(--muted);opacity:.45}
.nav-b.r-ok::after{background:var(--ok);opacity:.8}
.nav-b.r-bad::after{background:var(--bad);opacity:.8}
.nav-b.r-half::after{background:var(--half);opacity:.8}
.nav-b.cur{border:2px solid var(--text)}
.nav-b.task{font-weight:700}
.nav-b:disabled{cursor:not-allowed;opacity:.55}
.nav-b.fl::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--flag) transparent transparent}
.timer{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qwrap{display:grid;grid-template-columns:150px 1fr;gap:14px}
.qinfo{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.85rem;color:var(--muted);align-self:start}
.qinfo .qn{font-size:.85rem}
.qinfo .qn b{font-size:1.35rem;color:var(--text)}
.qinfo div{margin-bottom:6px}
.flagbtn{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;font-size:.85rem;text-align:left}
.flagbtn.on{color:var(--flag);font-weight:600}
.qbox{background:var(--accent-soft);border-radius:8px;padding:18px 20px;min-width:0}
.qtext{font-size:1.06rem;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.opt:hover{background:var(--panel)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt .ltr{min-width:1.4em;color:var(--muted)}
.opt.sel{background:var(--panel);border-color:var(--border)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:.95rem}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.wrong{background:var(--bad-bg);color:var(--bad)}
.fb.half{background:var(--half-bg);color:var(--half)}
.fb span{color:var(--text)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.lectag{font-size:.78rem;color:var(--muted);margin-bottom:6px}

/* писмени задачи */
.tmd{font-size:1.02rem;overflow-x:auto}
.tmd p{margin:0 0 10px}
.tmd table{border-collapse:collapse;margin:8px 0 12px;font-size:.9rem;background:var(--panel)}
.tmd th,.tmd td{border:1px solid var(--border);padding:4px 8px;text-align:center;vertical-align:top;white-space:nowrap}
.tmd th{background:var(--panel2)}
.tmd pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto;font-size:.9rem;line-height:1.35}
.tmd pre code{background:none;padding:0}
.fields{display:grid;gap:10px;margin:14px 0 6px}
.fld{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:4px 10px;align-items:center}
.fld>span{font-weight:600;font-size:.94rem}
.fld .hint{grid-column:2;font-size:.8rem;color:var(--muted)}
.fld input{font:15px/1.4 ui-monospace,Consolas,monospace;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);width:100%;min-width:0}
.fld input:focus,.work:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld input.ok{border-color:var(--ok);background:var(--ok-bg)}
.fld input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fld input.half{border-color:var(--half);background:var(--half-bg)}
.fld .mark{grid-column:2;font-size:.85rem}
.work{width:100%;min-height:120px;resize:vertical;font:14px/1.45 ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);margin-top:4px}
.worklbl{font-size:.88rem;color:var(--muted);margin-top:10px;display:block}
.sol{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.sol>b{display:block;margin-bottom:6px}
table.ans{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
table.ans td,table.ans th{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
table.ans th{color:var(--muted);font-weight:600;font-size:.84rem}
table.ans td.v{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.selfgrade{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--border)}
.work.big{min-height:170px;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.essay .mark{font-size:.88rem;color:var(--muted);margin-top:6px}
ul.kp{margin:6px 0 4px;padding-left:20px;font-size:.93rem}
ul.kp li{margin:2px 0}
ul.kp li.y{color:var(--ok)}
ul.kp li.n{color:var(--bad)}
.tmd svg{max-width:100%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--border)}
pre.mywork{white-space:pre-wrap;background:var(--code);padding:8px 10px;border-radius:7px;font-size:.88rem;margin:6px 0}

/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;font-weight:700}
.ring span{background:var(--panel);width:86px;height:86px;border-radius:50%;display:grid;place-items:center}
.rev{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;min-width:0}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.rev.half{border-left-color:var(--half)}
.rev .opt{cursor:default;padding:5px 9px}
.rev .opt:hover{background:transparent}
.rev .opt.ok:hover{background:var(--ok-bg)}
.rev .opt.bad:hover{background:var(--bad-bg)}
.rev .why{font-size:.92rem;margin-top:6px;color:var(--muted)}
.rev .why b{color:var(--text)}

/* summary */
.md{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 24px 24px;overflow-x:auto}
.md h3{margin-top:26px;border-bottom:1px solid var(--border);padding-bottom:4px}
.md table{border-collapse:collapse;margin:10px 0;font-size:.93rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md li{margin:2px 0}
.kbd{font-size:.8rem;color:var(--muted);margin-top:14px}

/* профил и прогрес */
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}
.inp{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
input.inp{min-width:0;flex:1 1 200px;max-width:320px}
textarea.inp{width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;word-break:break-all;margin:6px 0 10px}
.stat{font-size:1.9rem;font-weight:700;line-height:1.2}
.tbl-wrap{overflow-x:auto;padding:4px 6px}
table.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl th{color:var(--muted);font-weight:600;font-size:.84rem}
table.tbl td.t{white-space:normal;min-width:170px}
table.tbl tr.weak td{background:var(--bad-bg)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .tbl-wrap{padding:2px}
  table.tbl{font-size:.84rem}
  table.tbl th,table.tbl td{padding:6px 5px}
  table.tbl td.t{min-width:110px}
  table.tbl td.dt{white-space:normal;min-width:76px}
  .fld{grid-template-columns:1fr}
  .fld .hint,.fld .mark{grid-column:1}
}
.who{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted)}
.who b{color:var(--text)}

@media (max-width:820px){
  .grid3{grid-template-columns:1fr}
  .quiz{grid-template-columns:1fr}
  .side{position:static;order:2}
  .qwrap{grid-template-columns:1fr}
  .qinfo{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .qinfo div{margin:0}
  .md{padding:4px 14px 16px}
  .qbox{padding:14px 12px}
}
</style>
</head>

<script id="data" type="application/json">{"course":{"pfx":"oks","tag":"ОКС","name":"Основи на компютърните системи","lecWord":"Лекция","secPerQ":90,"secPerTask":600,"exam":{"q":25,"ptsQ":2,"tasks":5,"ptsTask":10,"minutes":90}},"lectures":[{"num":1,"title":"Лекция 1 — Компютърни системи: история, термини, видове","short":"Компютърни системи: история, термини, видове","summary":"### Цифрова изчислителна машина\n- **Получава данни**, преобразува ги и в резултат **излизат нови данни**; те служат за **вземане на правилни управленчески решения**.\n- Резултатите трябва да се получат **възможно най-бързо** — иначе машината е безполезна.\n\n### Периоди в историческото развитие\nРазвитието на средствата за изчисления с числа, представени с **дискретни елементи**, минава през 4 периода (в този ред):\n**предмеханичен → механичен → електромеханичен → електронен**.\n\n### Предмеханичен период (от древността до XVII век)\n- Броене с пръстите на едната ръка — **петична бройна система**.\n- Средства: **пръчици (рабош)**, **възли и връвчици**, **сметачни дъсчици (абак)**.\n- **Джон Непер (1550–1617)** — процедура за смятане с **разграфени пръчици**.\n\n### Механичен период\n| Година | Личност | Принос |\n|---|---|---|\n| — | **Леонардо да Винчи (1452–1519)** | скица в дневниците: **13-разрядно сумиращо устройство с 10 зъбни колелца** — начало на механичния етап |\n| **1623** | **Вилхелм Шикард (1592–1636)** | проект на механична машина (зъбни колелца и лостчета); събиране/изваждане, умножение/деление на **7-цифрени** числа |\n| **1642** | **Блез Паскал (1623–1662)** | **първата реално създадена** изчислителна машина; **6- или 8-разрядна**; само **събиране и изваждане** |\n| **1673** | **Готфрид Лайбниц (1646–1716)** | **12-разрядна** машина в Парижката академия — **за първи път четирите аритметични действия**; въвежда **двоичната бройна система** |\n| **1874** | **Вилгодт Однер (1845–1905)** | заменя **стъпаловидния валяк на Лайбниц със зъбно колело** |\n| 1728 / 1745 | **Фалкон**, **Вакансон** | идея за перфокарти за **тъкачен стан** |\n| **1799** (изложение в Париж **1801**) | **Жозеф Жакард** | **за първи път** построява автоматизирано (програмирано) управление на тъкането с перфокарти |\n| **1812–1822** | **Чарлз Бабедж (1791–1871)** | машина, за която получава **златен медал от Астрономическото общество** |\n| **1830–1846** | **Бабедж** | **аналитичната машина** (недовършена) → **принцип на програмно управление**: обработката се извършва въз основа на информация, предназначена да управлява този процес |\n| **1936–37** | **Алан Тюринг (1912–1954)** | теоретично обосноваване на **абстрактна изчислителна машина** |\n| **1880** | **Херман Холерит (1860–1929)** | система за символи върху **перфокарта**; перфораторна, сортировачна и **табулираща** машини → автоматизира **преброяването на населението** |\n\nЕлектронни елементи (последният слайд от механичния период):\n- **1884 — Томас Едисон**: **термоелектронна емисия**.\n- **1897 — Браун**: **електронно-лъчева тръба**.\n- **1904 — Флеминг**: **електронно-лампов диод** като детектор на радиотелеграфен приемник.\n- **1906 — Форестър** (Лий дьо Форест): **лампов триод**.\n- **1913 — М. Майснер**: патент за **лампов генератор**.\n- **1918 — Бонч-Бруевич**: **лампов тригер**; година по-късно независимо — **У. Иккълз и Ф. Джордан**.\n\n### Електромеханичен период\n- Първите универсални електромеханични цифрови машини — в **Германия и САЩ**.\n- **Конрад Цузе (1910–1995)**, Германия: идея през **1934** като студент (дипломен проект); машини **Z1, Z2, Z3, Z4**; **Z3 и Z4 — на електромагнитни релета**.\n- **Ховард Айкен (1900–1973)**: от **1939** релейна машина на базата на детайли за перфорационните машини на **IBM**; машината е **релейно-механична** — **аритметичният и запомнящият блок са на зъбни колела**; **август 1944** предава на **Харвардския университет** машината **MARC-I** (Mark I), после **MARC-II**.\n- **Джордж Стибиц (1904–1995)**: **1940 — BEL-I**, работи и с **комплексни числа**; **BEL-II (1942)**, **BEL-V (1947)**; тъй като релетата са ненадеждни, **за първи път вгражда диагностични схеми за откриване на грешки**.\n\n### Електронен период\n- **Джон Винсент Атанасов (1903–1995)**, професор по физика в колеж в **Айова** — **първи конструктор на електронна изчислителна машина**.\n  - **Есента на 1937** — идея: изчисления в **двоична система** чрез **електронна** реализация.\n  - **Края на 1941** — всичко завършено **освен перфокартното устройство** (вход/изход). Машината — **ABC („Атанасов–Бери компютър“)**.\n  - Пионерско в ABC: **първо приложение на двоична система в изцяло електронна машина**; **първа регенеративна оперативна памет**; **първи електронни логически схеми**, подобни на съвременните; **първо организирано последователно изчисляване**; **първи електронен компютър**.\n- **Colossus (Колос)**, Англия — според слайда **Морис Уилкс със съдействието на Алан Тюринг**; готов през **1943**, използван за **декодиране на германски секретни съобщения**.\n- **ENIAC** (**Electronic Numerical Integrator and Computer**), **1943–1945** — **първата действаща електронна цифрова изчислителна машина**: ръководител **Джон В. Моучли (1907–1980)**, **главен инженер Джон Преспер Еккерт (1919–1995)**, представител на Министерството на отбраната **Х. Голдстайн**.\n- **Джон фон Нойман (1903–1957)** научава за ENIAC през **1944**: компютър с **опростена фиксирана физическа структура**, изпълняващ всякакви изчисления чрез **програма, записана в паметта** → нова програма = **замяна на програмата в паметта, без промяна на схемите на свързване**.\n- Фон Нойман дели физическата структура на **5 групи**: **CPU**, **входни устройства**, **изходни устройства**, **оперативна (работна) памет**, **постоянна памет**.\n\n### Поколения ЕИМ\n- Поколенията се отличават по: **елементна база**, функционално-логическа организация, конструктивно-технологично изпълнение, програмно обезпечаване, достъп на потребителите до ресурсите.\n- Смяната им променя **бързодействие, памет, надеждност, цена**. Основна тенденция — **намаляване на трудоемкостта при съставяне на програмите**, по-ефективна апаратура, по-лесна работа на потребителя.\n\n| Поколение | Период | Елементна база | Ключови характеристики | Примери (година) |\n|---|---|---|---|---|\n| **I** | **1945–1958** | **електронна лампа** (+ резистори, кондензатори, трансформатори); от средата на 50-те — **феритни магнитни елементи** за ОП | огромни, ненадеждни, много скъпи, много топлина, бавен вход/изход, непреносими; **само машинен език**; вход/изход — телетайп, перфоленти, перфокарти, после магнитни ленти, барабани, дискове; първи бързи печатащи устройства | **ENIAC (1945)**, **EDVAC (1949)**, **UNIVAC (1951)**, **IBM-701 (1952)**, **IBM-650 (1954)** |\n| **II** | **1959–1965** | **транзистор** | по-бързи, повече ОП, по-надеждни, по-малки, по-малко енергия; **все още много скъпи**; **машинни и асемблерни езици**; **диференциация по предназначение**; алгоритмични езици; появява се **многопрограмен режим** | **IBM 1620 (1959)**, **CDC 1604 (1959)**, **IBM 7094 (1962)**, **UNIVAC 1108 (1962)**, **CDC 3600 (1963)** |\n| **III** | **1965–1971** | **интегрални схеми** (завършени функционални блокове със сложни транзисторни схеми) | **многопрограмни ОС** с режими **пакетна обработка, разделяне на времето, запитване–отговор**; пунктове за абонати; по-малко поддръжка; **все още скъпи**; **езици от високо ниво** | **IBM-360 (1964)**, **TDC-316 (1965)**, **PDP (1969)**, **Honeywell-6000 (1970)**, **IBM-370/168 (1972)** |\n| **IV** | **1971–1980** | **големи интегрални схеми (ГИС)** | **много евтини**, преносими, надеждни, много малки; **персонални компютри**; **концепция за интернет**; развитие на мрежите | **PDP-11 (1970)**, **STAR 1000 (1970)**, **DEC 10**, **CRAY-1 (1975)** и **CRAY-X-MP (1982)** — суперкомпютри |\n\n### Развитие на изчислителната техника в България\n- **Средата на 30-те г. на XX в.** — внесена перфокартна машина **„Powers“** за статистически цели; до 60-те г. — счетоводни, перфокартни и електромеханични машини (банки, застраховане).\n- **1962** — внесен френският **„Гама 10“**; **1963** — **„Балканкар“** придобива **IBM 1460**.\n- **Пролетта на 1961** — **първият Изчислителен център при Института по математика на БАН** (ИМ с ИЦ) → начало на българската електронна изчислителна техника.\n- **Края на 1963** — **първият български компютър „Витоша“**, под ръководството на **проф. Любомир Илиев**.\n- **1964** — монтирана руската машина **„Минск 2“**.\n- **1965** — **първият български електронен калкулатор „ЕЛКА“**; после **ЕЛКА 22**, **ЕЛКА 25 (с печатащо устройство)**.\n- **1 март 1966**, решение на МС **№ 25** — създаден **ЦИИТ** (Централен институт по изчислителна техника).\n- **Началото на 1967** — **ДСО „ИЗОТ“**.\n- **1969** — **НИПКИЕК** (институт по електронни калкулатори), директор **Любомир Антонов**.\n- **ЕЛКА 42** — първите калкулатори на интегрални схеми; **ЕКСПО-70 в Осака (1970)** — **единственият калкулатор на интегрални схеми**. **„СМ-500“** — **4-битова микропроцесорна** конфигурация (първа у нас и в соц. страни) → **ЕЛКА 51**. **ЕЛКА 130/135** — джобни, по поръчка на **швейцарска** фирма (**50 000** бр. за Швейцария, също Италия).\n- **1970** — заводи: **Благоевград** — механични конструкции; **Стара Загора** — дискови устройства; **Русе** — печатни платки; **Пловдив** — магнитно-лентови устройства; **Пазарджик** — магнитно-дискови пакети; **Шумен** — инструменти и нестандартно оборудване.\n- Три направления: **компютри**; **мини и персонални компютри**; **дискови и магнитни лентови системи**.\n- **ЕС 1037** — **първата самостоятелна разработка на ЕИМ** у нас, производство от **1987**.\n- **1974** — начало на разработката на **първия български миникомпютър**.\n- Края на 70-те — **„Инко 1“** в **ИТКР на БАН** (първият персонален компютър); след 1978 — PC, **съвместими с IBM**.\n- **1984** — **„ИЗОТ 1031“** (проектиран в ЦИИТ); **1985** — **ИЗОТ 1036 (ЕС 1831)**.\n- **„Правец 8А“** (от 1987) — съвместим с **Apple 2Е**. **„Правец 16“** (1985) — на **8086/8088**, съвместим с **IBM PC/XT**; **„Правец 16А“** (1987) — модернизиран; **16И** — преносим, вграден монитор, до 3 флопи; **16В** — вертикална конструкция, 2 флопи **5,25\"**; **16Е** — настолен.\n- **Края на 1986** — **„Правец 286“** (Intel **80286**, ЕС 1838), Институт по микропроцесорна техника.\n- **1970** — първото ЗУ на **магнитна лента**; **1984** — системи за **телеобработка**; **1985** — дискови устройства за PC; **1985–1990** — локални мрежи.\n- **1975–1989** — българският дял от износа в **СИВ** средно **40%**; спад след **1991**.\n- **Проф. Димитър Тянев (1949–2023)** — ТУ-Варна, катедра КНТ, **създател на дисциплината „Организация на компютъра“**.\n\n### Тенденции за развитие\n- **1971** — **микропроцесорите** → нов клас **микро ЕИМ**.\n- Смяната на поколенията КС се определя от **смяната на поколенията електронни елементи** на апаратната част.\n- Доминираща технология за ИС със свръхвисока интеграция — **оптическата литография**; размери **0.25–0.135 μm**; изисква изключителна чистота → много скъпо оборудване.\n- Бъдеще: **електронна (лазерна), йонна и рентгеновска литография** → **0.13, 0.10, 0.08 μm**; **мед вместо алуминий** в проводниците (и по-голяма чистота).\n- Нови направления: **молекулярни**, **с невронна структура**, **квантови**, **оптически** КС.\n\n| Направление | Същност |\n|---|---|\n| **Молекулярни** | молекули на основата на генетичен код; **Hewlett-Packard + Калифорнийски университет** — молекулярна памет на основата на молекули на **ротаксан** („роксана“); **милиарди пъти по-икономични** |\n| **Невронни** | теория на **перцептрона** (обучаваща се изкуствена невронна мрежа); свойства: **паралелност**, **обучение и настройка**, **автоматична класификация**, **асоциативност** |\n| **Квантови** | **енергийни нива на електроните**; поглъщане/излъчване на **фотон**; управление чрез електромагнитно поле → няма спонтанен преход; елементи — **qubit (Quantum bit)** |\n| **Оптически** | обработка на светлинни потоци; **паралелно разпространение на светлината** → паралелна обработка |\n\n### Основни понятия\n- **Компютърна система (КС)** — **комплекс от технически и програмни средства**, предназначен за **автоматизация на подготовката и решаването на задачи на потребителя**.\n- КС включва: **апаратна част (Hardware)**, **програмно осигуряване (Software)**, **функционални средства** (взаимодействие между двете).\n- **Функционални средства**: **стандарти и кодове** (преобразуване в двоичен вид); **алгоритми и процедури** (стартиране, специални ситуации, изключения); **спецификации за съвместимост** между елементи от различни производители.\n- **Стандарти** — **документирани споразумения с технически спецификации**; **не са закон** (издават се от **неправителствени** институции), **не са задължителни**, но се спазват — производителите искат съвместимост, потребителите — взаимозаменяемост.\n- **Кодиране** — на всяка буква от една азбука се съпоставя буква/съчетание от друга азбука; **самото съответствие е код**; задава се с таблици; в КС — **двоично кодиране**.\n- **Алгоритъм** — точно упътване за решаване на проблем; **крайна поредица** от указания; описва процеса **пълно, ясно и еднозначно**.\n- **Функционална организация** — системата от функционални средства и взаимодействието hardware–software; определя **принципите на функциониране**.\n- **Структурна организация** — **начинът, по който се реализира** функционирането (функционалната организация). **Структурни елементи** — елементи, възли, устройства и програмни средства.\n- **Компютърна архитектура** — **съвкупност от характеристики и параметри**, определящи **функционалната, логическата и структурната организация**; съвременната архитектура е **многостепенна йерархия** на апаратни и програмни средства.\n- **Основни логически елементи** (= **логическо ниво**): устройства за **въвеждане**, **извеждане**, **съхраняване**, **обработка** на информацията и за **управление** на процесите.\n- Фон Ноймановите КС работят чрез **изпълнение на програма (последователност от команди), записана в паметта**; основни логически устройства: **CPU, памет, периферни устройства**.\n- **Концептуална схема**: централният процесор съдържа **АЛУ**, **УУ** (управляващо устройство) и **първична памет (ПП, ОП)**; извън него — **входни устройства**, **изходни устройства** и **външна памет**.\n\n### Структурна организация\n- **Йерархически модулен принцип**.\n\n| Ниво | Какво прави | Изградено от |\n|---|---|---|\n| **Елемент** | обработва **единични** електрически сигнали (битове) | — |\n| **Възел** | **едновременна обработка на група сигнали** (информационни думи) | елементи |\n| **Модул (блок)** | **последователност от операции** върху думи; функционално обособен (напр. **модул за избор на команда**, модул за запис-четене) | възли |\n| **Устройство** | изпълнение на **последователност от логически свързани машинни команди** | модули |\n\n- Класификация на елементите: по **типа на сигналите**, **предназначение**, **технология на изготвяне**.\n\n### Представяне и предаване на информацията\n- **Импулсен способ**: 1 = **наличие на импулс** (ток/напрежение), 0 = отсъствие; продължителността **не превишава един такт** на синхронизиращите импулси.\n- **Потенциален (статичен) способ**: 1 = **високо ниво на напрежението**, 0 = ниско.\n- **Последователен код** — **единична линия (шина)**, битовете са разпределени **във времето**, бит след бит; **по-прости апаратни средства**.\n- **Паралелен код** — **група линии**, всички разреди едновременно; **по-бързо**, но **по-сложна апаратура**.\n- **Смесен (паралелно-последователен)** — данните на части; **частите последователно**, **в рамките на частта — паралелно**.\n\n### Съвместимост (3 нива)\n- **Апаратна (Hardware)**: 1) **унифицирани средства за свързване** (конектори, слотове) и съглашение за функциите на линиите; 2) **съвместими сигнали** — по **напрежение, честота**, нива за 0/1; 3) **синхронизирани алгоритми** на взаимодействие (форма на фронтовете, синхронизация).\n- **Програмна (Software)**: програмите и данните се **интерпретират еднакво**; при различия — транслиращи програми → **драйвери (driver)**.\n- **Информационна**: **правилна интерпретация** на информацията — **кодови таблици**, стандарти за графика, звук, видео.\n\n### Видове компютърни системи (по изчислителна мощност и приложение)\n| Вид | Характеристика | Представители |\n|---|---|---|\n| **Супер големи (mainframes)** | **многопотребителски, с централна обработка**, огромни бази данни; главни сървъри в големи мрежи; по IBM — **половината от данните в света** трябва да са в тях | начало **IBM/360, IBM/370**; днес **IBM-Z, IBM-LinuxONE III** |\n| **Големи** | висока производителност; **работни станции за графика, UNIX-сървъри**; основа на **клъстерни структури**; първоначално за научни задачи | **RS/6000** |\n| **Малки (мини)** | **финансови структури, бизнес центрове**; акцент върху **сигурност на данните**; сървъри в локални мрежи на големи фирми | **AS/400 (IBM)** |\n| **Малки (micro) / PC** | настолни, **автомобилни (carputers)**, игрални конзоли; мобилни — лаптоп, таблет, смартфон, смартбук, PDA, програмируем калкулатор | — |\n\n- Преди PC: ЕИМ на големи компании, скъпи, специални условия (температура, влажност), постоянно натоварени, голям персонал, работа чрез заявки. Терминът „микрокомпютър“ — почти **анахронизъм**.\n\n### Развитие на персоналните компютри\n- **1974 — MITS Altair** с микропроцесор **8080** → начало на PC; първата ОС за малки компютри — **CP/M (Control Program for Microprocessors)**.\n- **1976 — Apple I**, **1977 — Apple II** (Apple Computer).\n- **1981 — IBM PC**: IBM **публично обявява всички детайли на конструкцията** (отворена архитектура), въвежда **разширителни слотове**, купува ОС от **Microsoft (DOS)**; Microsoft може да я продава и на други → масови **IBM-съвместими** PC с процесори **Intel** и ОС от **Microsoft**.\n\n### Капани за изпита\n- **Паскал (1642)** — първа **реално създадена** машина, само **+ и −**; **Лайбниц (1673)** — първа с **четирите действия** и въвежда **двоичната система**; **Шикард (1623)** — само **проект**; **Леонардо** — само **скица**.\n- **Жакард** (1799/1801) — първи реален програмиран стан; **Фалкон** и **Вакансон** имат само идеята. **Холерит** — перфокарти за **преброяване**, не за тъкане.\n- **Бабедж** — **принцип на програмно управление**; **фон Нойман** — **програма, записана в паметта** (съхранена програма). Не ги бъркайте.\n- **Цузе**: на релета са **Z3 и Z4** (не Z1/Z2). **Айкен**: машината е **релейно-механична** — блоковете са на **зъбни колела**. **Стибиц**: **комплексни числа** + **първи диагностични схеми**.\n- Слайдовете пишат **„MARC-I“** и **„BEL-I“** — в литературата **Harvard Mark I** и **Bell Labs Model I**. Слайдът пише и **„Форестър“** за триода — изобретателят е **Лий дьо Форест**.\n- **ABC (Атанасов–Бери)** — **първи електронен компютър**; **ENIAC** — **първата действаща** електронна цифрова машина (1943–1945). ENIAC = **Electronic Numerical Integrator and Computer** (слайдът изписва „Electronics“). **EDVAC** = Electronic **Discrete Variable** Automatic Computer; **UNIVAC** = **Universal** Automatic Computer.\n- Colossus — по слайда **Уилкс + Тюринг**; в литературата основният конструктор е **Томи Флауърс** (Тюринг работи в Блечли Парк, Уилкс — EDSAC). На изпита — версията от слайда.\n- Петте групи на фон Нойман: CPU, вход, изход, **оперативна** и **постоянна** памет (не „шина“, не „външна памет“).\n- Поколения: **1945–1958 / 1959–1965 / 1965–1971 / 1971–1980** = **лампа / транзистор / ИС / ГИС**. Езици: **само машинен** (I) → **машинни и асемблерни** (II) → **високо ниво** (III). **Многопрограмен режим** се появява във **II**, **многопрограмни ОС** (пакетна, разделяне на времето, запитване–отговор) — **III**. **Феритна памет** — I поколение. „Все още много скъпи“ — II; „много евтини“ — IV.\n- Несъответствия в примерите: **IBM-360 (1964)** е в III поколение, макар то да започва през 1965; **PDP-11 и STAR 1000 (1970)** са в IV, което започва през 1971. Слайдът разшифрова **PDP** като „Personal Data Processor“ — правилно е **Programmed Data Processor**.\n- „Роксана“ в слайда = молекули на **ротаксан**; „стехеометричен“ = стехиометричен.\n- България: **ИЦ при БАН — 1961** (начало), **„Витоша“ — края на 1963** (първи компютър), **„ЕЛКА“ — 1965** (първи калкулатор), **ЦИИТ — 1966**, **ИЗОТ — 1967**, **НИПКИЕК — 1969**, **ЕКСПО-70 — ЕЛКА 42**, **ЕС 1037 — 1987** (първа самостоятелна ЕИМ). **Правец 8А ↔ Apple 2Е**, **Правец 16 ↔ IBM PC/XT**, **Правец 286 ↔ Intel 80286**. **Powers** (30-те, статистика) ≠ **Гама 10** (френски, 1962) ≠ **IBM 1460** (Балканкар, 1963) ≠ **Минск 2** (руска, 1964).\n- **Функционална** организация = **принципите** на функциониране; **структурна** = **начинът на реализация**. **Архитектура** обхваща и трите (функционална, логическа, структурна).\n- **Възел** = група сигнали (дума); **модул** = последователност от операции; **устройство** = последователност от **машинни команди**.\n- **Драйверите** → **програмна** съвместимост; **кодовите таблици** → **информационна**; **напрежение/честота/конектори** → **апаратна**.\n- Слайдът нарича и мини, и микро системите „Малки“ — **мини: AS/400**, **големи: RS/6000**, **mainframes: IBM/360, IBM-Z**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L01-A-1","n":1,"text":"Кой е правилният хронологичен ред на периодите в развитието на изчислителните средства?","opts":["механичен → предмеханичен → електронен → електромеханичен","предмеханичен → механичен → електромеханичен → електронен","предмеханичен → електромеханичен → механичен → електронен","механичен → електромеханичен → предмеханичен → електронен"],"correct":1,"expl":"Периодите са: предмеханичен (до XVII в.), механичен, електромеханичен и електронен."},{"id":"L01-A-2","n":2,"text":"Първата реално създадена машина за изчисляване (1642 г.), изпълняваща събиране и изваждане, е дело на:","opts":["Блез Паскал","Вилхелм Шикард","Готфрид Лайбниц","Вилгодт Однер"],"correct":0,"expl":"Паскал създава 6- или 8-разрядна машина за + и −; машината на Шикард (1623 г.) е само проект."},{"id":"L01-A-3","n":3,"text":"Кои машини на Конрад Цузе са реализирани чрез електромагнитни релета?","opts":["Z1 и Z2","Z1 и Z3","Z3 и Z4","Z2 и Z4"],"correct":2,"expl":"Цузе създава Z1–Z4, като Z3 и Z4 са на електромагнитни релета."},{"id":"L01-A-4","n":4,"text":"За първи конструктор на електронна изчислителна машина се счита:","opts":["Джон Моучли","Джон Винсент Атанасов","Джон фон Нойман","Ховард Айкен"],"correct":1,"expl":"Атанасов (Айова) създава ABC — първия електронен компютър; Моучли ръководи по-късния ENIAC."},{"id":"L01-A-5","n":5,"text":"Основният активен елемент на ЕИМ от първо поколение е:","opts":["транзисторът","интегралната схема","електронната лампа","електромагнитното реле"],"correct":2,"expl":"I поколение (1945–1958) използва електронни лампи с резистори, кондензатори и трансформатори."},{"id":"L01-A-6","n":6,"text":"Първият напълно функциониращ български компютър „Витоша“ е пуснат в експлоатация в края на 1963 г. под ръководството на:","opts":["Любомир Антонов","проф. Любомир Илиев","проф. Димитър Тянев","Джон Атанасов"],"correct":1,"expl":"„Витоша“ е създаден в ИМ с ИЦ на БАН под ръководството на проф. Любомир Илиев; Антонов ръководи НИПКИЕК."},{"id":"L01-A-7","n":7,"text":"Коя е досегашната доминираща технология за изпълнение на интегрални схеми със свръхвисока интеграция?","opts":["оптическата литография","рентгеновската литография","йонната литография","електронната (лазерна) литография"],"correct":0,"expl":"Доминира оптическата литография; електронната, йонната и рентгеновската са бъдещото развитие."},{"id":"L01-A-8","n":8,"text":"Компютърната система се определя като:","opts":["съвкупност от характеристики и параметри, определящи функционалната, логическата и структурната организация","точно упътване от крайна поредица указания за решаване на определен вид проблеми","система от функционални средства, осигуряващи взаимодействието между апаратната и програмната част","комплекс от технически и програмни средства за автоматизация на подготовката и решаването на задачи на потребителя"],"correct":3,"expl":"Това е дефиницията на КС; втората опция е компютърна архитектура, третата — алгоритъм."},{"id":"L01-A-9","n":9,"text":"Коя структурна единица осигурява едновременна обработка на група сигнали (информационна дума) и е изградена от елементи?","opts":["възел","модул","устройство","елемент"],"correct":0,"expl":"Възлите обработват група битове (думи) и са изградени от елементи; модулите са изградени от възли."},{"id":"L01-A-10","n":10,"text":"Типичен представител на малките (мини) компютърни системи, използвани във финансови структури, е:","opts":["RS/6000","IBM/360","IBM-LinuxONE III","AS/400 на IBM"],"correct":3,"expl":"Мини системите (финанси, сигурност на данните) — AS/400; RS/6000 е голяма система, IBM/360 и LinuxONE — mainframes."}],"B":[{"id":"L01-B-1","n":1,"text":"Кой описва процедура за смятане с помощта на разграфени пръчици?","opts":["Вилхелм Шикард","Леонардо да Винчи","Жозеф Жакард","Джон Непер"],"correct":3,"expl":"Джон Непер (1550–1617), предмеханичен период."},{"id":"L01-B-2","n":2,"text":"Кой учен, поради ненадеждността на релетата, за първи път разработва и вгражда диагностични схеми за откриване на грешки?","opts":["Ховард Айкен","Конрад Цузе","Джордж Стибиц","Джон Еккерт"],"correct":2,"expl":"Стибиц (машините BEL) вгражда първите диагностични схеми."},{"id":"L01-B-3","n":3,"text":"Как се разшифрова абревиатурата ENIAC?","opts":["Electronic Numerical Integrator and Computer","Electronic Discrete Variable Automatic Computer","Electronic Numerical Integrated Automatic Calculator","Universal Electronic Numerical Automatic Computer"],"correct":0,"expl":"ENIAC = Electronic Numerical Integrator and Computer; Discrete Variable е от EDVAC."},{"id":"L01-B-4","n":4,"text":"В кой период се развива второто поколение ЕИМ?","opts":["1959–1965 г.","1945–1958 г.","1965–1971 г.","1971–1980 г."],"correct":0,"expl":"II поколение (транзистори) — 1959–1965 г."},{"id":"L01-B-5","n":5,"text":"За оборудване на оперативната памет от средата на 50-те години на ЕИМ от първо поколение се прилагат:","opts":["големи интегрални схеми","магнитни барабани и дискове","транзисторни тригери","феритни магнитни елементи"],"correct":3,"expl":"Феритните магнитни елементи са за ОП; ленти, барабани и дискове са външни ЗУ."},{"id":"L01-B-6","n":6,"text":"Кой български калкулатор е представен на ЕКСПО-70 в Осака като единствения калкулатор на интегрални схеми?","opts":["ЕЛКА 22","ЕЛКА 42","ЕЛКА 51","ЕЛКА 130"],"correct":1,"expl":"ЕЛКА 42 — първите български калкулатори на ИС; ЕЛКА 51 е на базата на СМ-500."},{"id":"L01-B-7","n":7,"text":"На какво се основава принципът на работа на квантовите компютърни системи?","opts":["на паралелното разпространение на светлинните лъчи","на молекули, способни да реагират на светлина или електрически ток","на способността на електроните в атома да имат различни енергийни нива","на теорията на перцептрона — обучаваща се невронна мрежа"],"correct":2,"expl":"Квантовите КС използват енергийните нива на електроните; елементите им са qubit."},{"id":"L01-B-8","n":8,"text":"Начинът, по който се реализира функционирането на компютърната система (функционалната организация), се нарича:","opts":["компютърна архитектура","структурна организация","логическо ниво","функционални средства"],"correct":1,"expl":"Функционалната организация определя принципите, а структурната — начина на реализацията им."},{"id":"L01-B-9","n":9,"text":"Кое е характерно за последователния код на предаване на информацията?","opts":["всички разряди се обработват едновременно по група линии","данните се предават на части, а битовете в една част — паралелно","ускорява обработката, но изисква по-сложни апаратни средства","използва се единична линия, а битовете са разпределени във времето"],"correct":3,"expl":"Последователният код използва една линия, бит след бит, и изисква по-проста апаратура."},{"id":"L01-B-10","n":10,"text":"Кои са сред най-популярните съвременни супер големи компютърни системи (mainframes)?","opts":["RS/6000 и AS/400","IBM-Z и IBM-LinuxONE III","CRAY-1 и CRAY-X-MP","PDP-11 и DEC 10"],"correct":1,"expl":"Началото е от IBM/360 и IBM/370, а днес популярни са IBM-Z и IBM-LinuxONE III."}],"C":[{"id":"L01-C-1","n":1,"text":"Готфрид Лайбниц през 1673 г. представя в Парижката академия:","opts":["6- или 8-разрядна машина, изпълняваща само събиране и изваждане на числа","13-разрядно сумиращо устройство с десет зъбни колелца, скицирано в дневник","12-разрядна машина, изпълняваща за първи път четирите аритметични действия","машина със зъбни колелца и лостчета за умножение и деление на 7-цифрени числа"],"correct":2,"expl":"Лайбниц — 12 разряда, четирите действия; въвежда и двоичната бройна система."},{"id":"L01-C-2","n":2,"text":"С помощта на перфокарти и табулиращи машини Херман Холерит (1880 г.) автоматизира:","opts":["управлението на тъкането","декодирането на секретни съобщения","преброяването на населението","изчисленията с комплексни числа"],"correct":2,"expl":"Холерит създава перфораторна, сортировачна и табулираща машина за преброяване; тъкането е свързано с Жакард."},{"id":"L01-C-3","n":3,"text":"Кое НЕ е сред пионерските постижения на машината ABC?","opts":["изпълнение на програма, записана в паметта на компютъра","първа регенеративна оперативна памет","първи електронни логически схеми, подобни на съвременните","първо приложение на двоична система в изцяло електронна машина"],"correct":0,"expl":"Идеята за програма, съхранена в паметта, е на фон Нойман (1944 г.), а не на Атанасов."},{"id":"L01-C-4","n":4,"text":"Коя от изброените машини е от второ поколение ЕИМ?","opts":["IBM 7094","EDVAC","IBM-360","CRAY-1"],"correct":0,"expl":"IBM 7094 (1962) е транзисторна; EDVAC — I, IBM-360 — III, CRAY-1 — IV поколение."},{"id":"L01-C-5","n":5,"text":"Персоналният компютър „Правец 8А“ е програмно съвместим с:","opts":["IBM PC/XT","IBM 1460","Apple 2Е","MITS Altair"],"correct":2,"expl":"Правец 8А ↔ Apple 2Е, а Правец 16 ↔ IBM PC/XT."},{"id":"L01-C-6","n":6,"text":"Кое НЕ е сред свойствата на компютърните системи с невронна структура?","opts":["спонтанен преход между енергийните нива","паралелност на обработката на информацията","способност за обучение и настройка","асоциативност"],"correct":0,"expl":"Енергийните нива се отнасят до квантовите КС; невронните имат паралелност, обучение, автоматична класификация и асоциативност."},{"id":"L01-C-7","n":7,"text":"Кое НЕ се отнася към функционалните средства на компютърната система?","opts":["стандартите и кодовете за преобразуване на информацията в двоичен вид","приложните програми на потребителя","алгоритмите и процедурите за стартиране и за действия при изключения","спецификациите за съвместимост между елементи на различни производители"],"correct":1,"expl":"Функционалните средства са стандарти и кодове, алгоритми и процедури, спецификации за съвместимост."},{"id":"L01-C-8","n":8,"text":"В концептуалната схема на компютърна система кой блок е разположен извън централния процесор?","opts":["аритметично-логическото устройство (АЛУ)","външната памет","управляващото устройство (УУ)","първичната (оперативна) памет"],"correct":1,"expl":"Централният процесор обхваща АЛУ, УУ и първичната памет (ПП, ОП); външната памет е извън него."},{"id":"L01-C-9","n":9,"text":"Програмите, които транслират инструкциите, за да станат разбираеми за периферните устройства, се наричат драйвери и осигуряват:","opts":["апаратна съвместимост","информационна съвместимост","конструктивна съвместимост","програмна съвместимост"],"correct":3,"expl":"Драйверите се разглеждат в програмната (Software) съвместимост."},{"id":"L01-C-10","n":10,"text":"Кой компютър, създаден през 1974 г. с микропроцесор 8080, се смята за начало на персоналните компютри?","opts":["Apple I","IBM PC","Инко 1","MITS Altair"],"correct":3,"expl":"MITS Altair (1974, Intel 8080); Apple I е от 1976 г., IBM PC — от 1981 г."}],"D":[{"id":"L01-D-1","n":1,"text":"Кой за първи път построява (1799 г.) и демонстрира в Париж (1801 г.) автоматизирано управление на тъкането с перфокарти?","opts":["Фалкон","Жозеф Жакард","Вакансон","Херман Холерит"],"correct":1,"expl":"Фалкон (1728) и Вакансон (1745) имат идеята, но първи я реализира Жакард."},{"id":"L01-D-2","n":2,"text":"Какво описва Томас Едисон през 1884 г.?","opts":["електронно-лъчевата тръба","лампов триод","лампов тригер","явлението термоелектронна емисия"],"correct":3,"expl":"Едисон — термоелектронна емисия; ЕЛТ — Браун (1897), триод — 1906, тригер — Бонч-Бруевич (1918)."},{"id":"L01-D-3","n":3,"text":"За какво е използван компютърът Colossus, завършен в Англия през 1943 г.?","opts":["за преброяване на населението","за изчисления с комплексни числа","за изчисляване на балистични таблици на Министерството на отбраната","за декодиране на германски секретни съобщения"],"correct":3,"expl":"Colossus се използва за декодиране на германските секретни съобщения."},{"id":"L01-D-4","n":4,"text":"Многопрограмните операционни системи с режими пакетна обработка, разделяне на времето и запитване–отговор са характерни за:","opts":["първото поколение ЕИМ","второто поколение ЕИМ","третото поколение ЕИМ","четвъртото поколение ЕИМ"],"correct":2,"expl":"Във II поколение се появява многопрограмен режим, а многопрограмните ОС с тези режими са белег на III поколение."},{"id":"L01-D-5","n":5,"text":"Коя машина НЕ е от първо поколение ЕИМ?","opts":["UNIVAC","IBM-650","CDC 1604","EDVAC"],"correct":2,"expl":"CDC 1604 (1959) е от II поколение; ENIAC, EDVAC, UNIVAC, IBM-701 и IBM-650 са от I."},{"id":"L01-D-6","n":6,"text":"Коя е първата самостоятелна разработка на електронно-изчислителна машина в България (производство от 1987 г.)?","opts":["ЕС 1037","ЕС 1831","ЕС 1838","Минск 2"],"correct":0,"expl":"ЕС 1037; ЕС 1831 е ИЗОТ 1036, ЕС 1838 — Правец 286, Минск 2 е руска машина."},{"id":"L01-D-7","n":7,"text":"Защо стандартите не са закон?","opts":["защото съдържат само препоръчителни кодови таблици","защото се издават от неправителствени институции","защото важат само за производителите на апаратна част","защото се приемат отделно от всеки производител"],"correct":1,"expl":"Стандартите са документирани споразумения на неправителствени институции; не са задължителни, но се спазват."},{"id":"L01-D-8","n":8,"text":"При импулсния способ за представяне на сигнали стойност единица се представя чрез:","opts":["наличие на импулс с продължителност не повече от един такт","високо ниво на напрежението, поддържано през целия такт","отсъствие на импулс в рамките на един такт на синхронизацията","ниско ниво на напрежението по време на синхронизиращия такт"],"correct":0,"expl":"Импулсен: 1 = импулс (≤ 1 такт), 0 = липса; високо/ниско ниво е потенциалният способ."},{"id":"L01-D-9","n":9,"text":"Типичен представител на големите компютърни системи (работни станции, UNIX-сървъри, клъстерни структури) е:","opts":["AS/400","IBM/370","CRAY-X-MP","RS/6000"],"correct":3,"expl":"Големите КС — RS/6000; AS/400 е мини система."},{"id":"L01-D-10","n":10,"text":"Кое НЕ е сред петте групи, на които фон Нойман разделя физическата структура на компютъра?","opts":["централно процесорно устройство","постоянна памет","шина за данни","входни устройства"],"correct":2,"expl":"Петте групи: CPU, входни и изходни устройства, оперативна и постоянна памет."}],"E":[{"id":"L01-E-1","n":1,"text":"С описанието на аналитичната си машина Чарлз Бабедж става автор на:","opts":["двоичната бройна система","принципа на съхранената в паметта програма","принципа на програмно управление","абстрактната изчислителна машина"],"correct":2,"expl":"Бабедж — програмно управление; двоичната система — Лайбниц; съхранена програма — фон Нойман; абстрактна машина — Тюринг."},{"id":"L01-E-2","n":2,"text":"На какво са реализирани аритметичният и запомнящият блок на машината на Ховард Айкен (MARC-I)?","opts":["на електромагнитни релета","на електронни лампи","на феритни магнитни елементи","на зъбни колела"],"correct":3,"expl":"Машината на Айкен е релейно-механична, а основните ѝ блокове са на зъбни колела."},{"id":"L01-E-3","n":3,"text":"Каква е същността на предложението на фон Нойман от 1944 г.?","opts":["фиксирана физическа структура и програма, записана в паметта, която се заменя при нова задача","нова задача се решава чрез промяна в схемите на свързване, без да се променя паметта","отделни физически памети и отделни пътища за инструкциите и за данните на програмата","изчисленията се извършват в двоична система върху електромагнитни релета"],"correct":0,"expl":"При фон Нойман нова програма изисква само замяна на програмата в паметта, без промяна на схемите."},{"id":"L01-E-4","n":4,"text":"ЕИМ от кое поколение поддържат машинни и асемблерни езици и са все още много скъпи?","opts":["второ","първо","трето","четвърто"],"correct":0,"expl":"I — само машинен език; II — машинни и асемблерни; III — езици от високо ниво."},{"id":"L01-E-5","n":5,"text":"Кое е характерно за четвъртото поколение ЕИМ?","opts":["диференциация на машините по предназначение и поява на алгоритмични езици","интегрални схеми и многопрограмни ОС с разделяне на времето","транзистори и многопрограмен режим на работа","големи интегрални схеми, персонални компютри и концепция за интернет"],"correct":3,"expl":"IV поколение (1971–1980): ГИС, много евтини, PC, интернет, развитие на мрежите."},{"id":"L01-E-6","n":6,"text":"Първият български електронен калкулатор „ЕЛКА“ е създаден през:","opts":["1961 г.","1963 г.","1965 г.","1969 г."],"correct":2,"expl":"ЕЛКА — 1965 г. в ИМ с ИЦ; 1961 — ИЦ при БАН, 1963 — „Витоша“, 1969 — НИПКИЕК."},{"id":"L01-E-7","n":7,"text":"В кой град е построен Заводът за печатни платки (проектиран от 1970 г.)?","opts":["Стара Загора","Русе","Пловдив","Пазарджик"],"correct":1,"expl":"Русе — печатни платки; Стара Загора — дискови устройства; Пловдив — магнитно-лентови; Пазарджик — магнитно-дискови пакети."},{"id":"L01-E-8","n":8,"text":"Учени от Hewlett-Packard и Калифорнийския университет доказват възможността за молекулярна памет на основата на молекули на:","opts":["силиций","ротаксан","поликарбонат","ферит"],"correct":1,"expl":"Молекулярна памет на основата на ротаксан (в слайда „роксана“)."},{"id":"L01-E-9","n":9,"text":"Компютърната архитектура е:","opts":["начинът, по който се реализира функционирането на компютърната система","системата от функционални средства и взаимодействието между апаратната и програмната част на компютъра","отделните елементи, възли и устройства, както и програмните средства за организация на работата","съвкупност от характеристики и параметри, определящи функционалната, логическата и структурната организация"],"correct":3,"expl":"Опциите 2–4 са съответно структурна организация, функционална организация и структурни елементи."},{"id":"L01-E-10","n":10,"text":"Как се разшифрова CP/M — първата операционна система за малки компютри?","opts":["Control Program for Microprocessors","Central Processing Monitor","Computer Program for Microcomputers","Control Processor Memory"],"correct":0,"expl":"CP/M — Control Program for Microprocessors, създадена за MITS Altair."}]}},{"num":2,"title":"Лекция 2 — Основни компоненти на компютърната система","short":"Основни компоненти на компютърната система","summary":"### Структурна организация на КС\n- Основен принцип: **правилно функциониране** на възлите, модулите и устройствата при изпълнение на програмите на потребителя.\n- **Структурната организация е подчинена на програмното управление**, т.е. **на функционалната организация**.\n- В историята **функционалната организация не се е променяла**, а **структурната** претърпява **значителни промени** — поради нова елементна база, нови схемни решения, нови стандарти.\n\n### Микропроцесор (CPU — Central Processing Unit)\n- **Основен елемент** на КС; **една или няколко интегрални схеми (чипа)** в пластмасов или метален корпус с метални крачета.\n- Първите **Pentium** — **над 3 000 000 транзистора**.\n- Чипът е **тънка пластина от силициев кристал**; **силиций** — **широко разпространен и достатъчно евтин полупроводник**. Кристалите се режат на ленти **< 1 мм**, почистват се химически, после се нарязват чипове.\n- Технология **0.25 до 0.13 микрона**, работи се върху **0.08 микрона**; предвиждат се **лазерна литография** и **мед вместо алуминий** (медта дава и по-добра чистота на процесите).\n- Функции: **управлява изпълнението на програмите**; **аритметични и логически операции**; **прехвърля данни** между устройствата; **генерира съобщения** за изпълнението; **открива инструкциите в паметта, дешифрира ги и ги изпълнява**; извлича данни от паметта и записва резултатите.\n\n### Архитектура на фон Нойман и Харвардска архитектура\n| | **Фон Нойман** | **Харвард** |\n|---|---|---|\n| Памет | **обща** — за данни и инструкции | **физически отделни** памети и **сигнални пътища** за инструкции и данни |\n| Шина | **обща шина** → извличането на инструкция и операцията с данни **не могат да са едновременни** — **„тясно място“**, ограничава производителността | отделни пътища |\n| Особености | компютър със **съхранена програма** | паметите **може да са различни**: дължина на думата, времена, технология, адресна структура; инструкциите — напр. в **ROM**, данните — в **памет за четене и запис** |\n\nСъстав на фон Ноймановия компютър:\n- **Блок за обработка** — **АЛУ** и **регистри** на процесора;\n- **Блок за управление** — **регистър на инструкциите** и **брояч на програми**;\n- **Памет** за данни и инструкции; **външно масово съхранение**; **механизми за вход и изход**.\n\n### Векторни (матрични) процесори\n- Терминът **„матричен процесор“** се използва за **съвършено различни архитектури**; общото — **голям обем данни, структурирани като масиви**.\n- Приложения: **обработка на изображения**, **сеизмични данни**, **управление на ядрени реактори**, **прогнозиране на климата**.\n- Два подхода:\n  1. **Съвместяване по време (конвейеризация)** на командите над векторите → **векторни процесори / векторни компютри**;\n  2. **Пространствено повторение** на изпълнението → **множество процесори**, свързани най-често **във вид на матрица**.\n- **Вектор** — набор от **скаларни данни от един и същ тип** в паметта; фиксираното адресно нарастване между елементите е **стъпка**.\n- **Векторизация** — преобразуване от скаларен към векторен код; **векторизиращи компилатори**.\n- В скаларните процесори данните се извличат по адреси (отнема време) → **конвейер за команди**; векторните прилагат **конвейер и върху данните**.\n- Хардуерни ресурси: **векторни регистри**, **функционални конвейери**, **обработващи елементи**, **броячи**.\n- Основни компоненти:\n  - **векторни регистри** — всеки с **2 входа за четене и 1 вход за запис**;\n  - **векторни функционални устройства** — стартират векторна операция **на всеки такт**;\n  - **LOAD/STORE** устройства — прехвърлят векторни думи между регистрите и паметта;\n  - **MASK** и **регистър на маската** — **двоичен вектор на маската** за адресация на **разредени матрици**.\n\n### Компютърна памет\n- Два вида: **оперативна** и **външна**. Оперативната е **бърза**, **от чипове**, и бива **RAM** и **ROM**.\n\n| | **ROM (Read Only Memory)** | **RAM (Random Access Memory)** | **Външна памет** |\n|---|---|---|---|\n| Достъп | само четене | **четене и запис** | четене/запис (CD-ROM — четене) |\n| Захранване | **енергонезависима** | **губи данните** при изключване | **запазва** данните |\n| Съдържание | програми, които винаги трябва да са налице — напр. **кодът за стартиране** | **работната памет на микропроцесора**; временно съхранение | програми и данни |\n| Цена/скорост | — | **скъпа** (чипове), **много бърза** | **евтино** съхранение |\n\n- При стартиране програмата **се прехвърля от диска в RAM** и CPU изпълнява инструкциите оттам. Паметта се измерва в **байтове (B)**.\n- **Твърд диск** — запис чрез **намагнитване** на участъци от метални дискове със специално магнитно покритие.\n- **Флопи (дискети)** — същият принцип, **по-малък капацитет**; за **пренасяне** между компютри.\n- **CD-ROM (Compact Disk Read Only Memory)** — **оптичен** запис, **лазерна четяща глава**; устойчив на електромагнитни полета и стареене; **дебелина 1.2 мм**, **диаметър 120 мм**; **прозрачен поликарбонат** с тънък **отражателен слой (алуминий, по-рядко злато)** и защитен лак; информацията — чрез **вдлъбнатини** в металния слой.\n\n### Периферни устройства, часовник, таймер\n- Изход: **монитор**, **тон-колони**, **принтер (плотер)**; вход: **клавиатура**, **мишка**; графична информация — **скенер**.\n- **Часовник (тактов генератор)** — **„сърцето“** (процесорът е „мозъкът“); **кварцов** или друг генератор на импулси; по-бавните устройства се синхронизират по основния часовник — **Host Bus Clock**.\n- **Таймер** — **брояч на импулси** и източник на импулси с определена честота; по него се настройва **системното време**; служи за задаване на **интервали** при програмиране.\n\nКласификация (таблица от лекцията):\n| Входни | Изходни | Запомнящи | За диалог | Други |\n|---|---|---|---|---|\n| клавиатура, микрофон, скенер, мишка | монитор, тон-колони, принтер, проектор | твърд диск, флопи, флаш, CD/DVD | монитор, клавиатура, мишка, микрофон, тон-колони | скенер, принтер, проектор |\n\nКонтролери: **монитор → видео карта**, **LAN кабел → мрежова карта**, **тон-колони/слушалки/микрофон → звукова карта**; за всяко устройство — **драйвер**.\n\n### Шини\n- **Шина** — множество електрически линии, свързващи процесора, RAM и контролерите. Три вида: **за данни**, **за адреси**, **за управление**.\n- **Шина за данни** — пренася данните между устройствата; при **i8086 и i80286 — 16-битова (16-проводна)**; днес **64 или 32 бита**.\n- **Адресна шина** — предава **адресите от паметта, формирани от микропроцесора**; сигналите образуват двоично число — мястото на данните; **принципът на адресиране се определя от микропроцесора**.\n- **Шина за управление** — **управляващи сигнали** и **информация за състоянието** на устройствата.\n\n### Дънна платка (motherboard)\n- Обща платка с шините, микропроцесора и слотовете за платките-контролери; **определя типа на устройствата**, които могат да се ползват, и **структурната схема на компютъра**.\n- **Примерна платка**: чипсет **Intel 915G**, процесор **Intel Pentium 4**, корпус **LGA 775**.\n  - **Цокъл** на процесора — с жълта предупредителна лепенка.\n  - **Северен мост** — микросхема **915G**: **контролер на оперативната памет** + вграден графичен **Intel Graphics Media Accelerator 900**.\n  - **Южен мост ICH6R** (под радиатор) — вход/изход, **USB 2.0** и **RAID-контролер**.\n  - **6 слота за памет**, **DDR и DDR2**; оцветени по двойки → **двуканален режим** — в слотовете с един цвят **еднакви по тип и обем модули**.\n  - Под слотовете: **IDE куплунг (син, вляво)** и **захранване на платката (бял, вдясно)**; **допълнително захранване за процесора** в горния ъгъл.\n  - **SATA (Serial AT Attachment)** — твърди дискове; чрез ICH6R — **RAID-масиви** (скорост или надеждност).\n  - **IDE (Integrated Drive Electronics)** — твърд или компакт диск по **паралелната шина ATA**.\n  - **BIOS** микросхема + **батерия** за захранването ѝ; **флопи куплунг** — левия край.\n  - Слотове: **2× PCI Express x1 (до 250 MB/s)**, **3× PCI**, **черен PCI Express x16 (до 4000 MB/s)** — за **видеокарта**.\n  - **Гигабитов мрежов контролер**; **8-канален звуков кодек C-Media**; контролер **IEEE 1394 (FireWire)**.\n  - Заден панел: **2× PS/2** (мишка и клавиатура), паралелен порт, **S/PDIF** (цифров аудио), **VGA** (аналогов видео изход), IEEE 1394, **4× USB 2.0**, мрежов порт, **6 аудио порта**.\n- Схемата „Основни компоненти“ (друга платка): AGP Pro слот, хъб **Intel 82850** (контролер на паметта, MCH), **Intel 82801BA** (хъб за вход/изход), банки **RAMBUS (RIMM)**, цокъл за Pentium 4, CNR, PCI слотове, батерия, флаш за фърмуер.\n\n### Схемен набор (чипсет)\n- **Основен управляващ елемент на дънната платка**; един или няколко чипа, които **управляват прехвърлянето на данни**, **синхронизират честотата на шините** и **определят приоритетите** при трансфера.\n- Включва: тактов генератор, контролер на шината, системен таймер, **контролер на прекъсванията**, **DMA контролер**, **CMOS RAM/часовник за реално време**, контролер на клавиатурата; интерфейс към процесорната шина, контролери на паметта, шините и входа/изхода.\n- Развитието на процесорите и чипсетите е **неразривно свързано**; производители днес — **Intel, AMD, Via, SiS**.\n- Два типа архитектура: **северен и южен мост** и **Intel Hub Architecture (IHA)**.\n\n| | Северен мост / **GMCH** | Южен мост / **ICH** |\n|---|---|---|\n| Мостове | **системна и кеш памет**, **PCI** и **AGP** | по-малко елементи: **EIDE**, **сериен** и **USB** контролери |\n| IHA | **GMCH (Graphics and AGP Memory Controller Hub)** — през системната шина с процесора; контролер на **паметта и AGP**; понякога аудио **AMR (Audio Modem Riser)**; **НЕ поддържа PCI контролер** | **ICH (I/O Controller Hub)** — USB, серийни портове; **ICH е и PCI контролер** |\n\n- **ICH ↔ GMCH: шина 233 MBps** — **2 пъти по-широка лента** от обикновената връзка южен–северен мост. IHA **различава простите от сложните данни** и оптимизира потока.\n\n### Интерфейс на компютъра\n- **Съвкупност от унифицирани апаратни, програмни и конструктивни средства** за взаимодействие на функционалните блокове в автоматизирана система за сбор и обработка на информация.\n- Позволява включване на **външни устройства без апаратни изменения** във входно/изходната система.\n- **Взаимодействие** = **предаване и приемане на информация**, **управление на предаването**, **съгласуване на източника и приемника**.\n- **Интерфейс за вход-изход** — физически линии, шини, логически и електронни схеми; обмен по **строго определени уговорки** (протокол).\n\n### Интерфейсна съвместимост (3 вида)\n| Вид | Какво определя |\n|---|---|\n| **Информационна** | логическата структура на интерфейсната част; **протокола** (чрез **управляващ автомат**); метода за **кодиране** и формата на данните, командите, адресите, състоянието; **времевите параметри** на управляващите сигнали |\n| **Електрическа** | **типа на приемно-предаващите елементи**; връзката логически ↔ електрически сигнали; **коефициенти на натоварване**, товарно съпротивление; **съгласуване на линиите и пределната им дължина**; **захранване, защита от шум, заземяване** |\n| **Конструктивна** | **типа на съединителните елементи**; конструкцията на **печатната платка**, носещата рамка и стойката; **кабелното съединение** |\n\n### Характеристики, проектиране и класификация на интерфейсите\n- Технически характеристики: **вместимост** (макс. брой абонати към контролера **без разширители**); **пропускателна способност**/скорост; **макс. дължина на линията**; **разрядност**; **топология**.\n- Проектиране: **стандартизирани формати на данните**; **стандартизирано множество управляващи сигнали**; **независимост от командната система на процесора**; **независимост от представянето на информацията във външното устройство**.\n- Класификация:\n  - **вътрешни** (системни/комуникационни **шини**) и **външни** (носят името на стандарта: **RS-232**, **SCSI (Small Computer Systems Interface)**, **USB (Universal Serial Bus)**, **FireWire (IEEE 1394)**);\n  - по **начина на съединяване**: **магистрални, радиални, смесени**;\n  - по **начина на предаване**: **паралелни** (**LPT — 8 бита**, **ATA — 16**, **SCSI — 8 или 16**, **PCI — 32 или 64**), **последователни** (един проводник — **COM, USB, FireWire**, мрежови интерфейси), **паралелно-последователни**;\n  - по **принципа на обмен**: **асинхронни** — пренасят само логическите стойности на битовете; приемането се основава на **предварителни съглашения** (еднакви синхронизиращи честоти, **протокол**); **синхронни** — битовете се **„опаковат“** със система от сигнали (**модулиране**); данните се предават на **големи блокове (няколко хиляди бита)**;\n  - по **режима на предаване**: **симплекс** (еднопосочно), **полудуплекс (Half Duplex)** — двупосочно **редуващо се** по обща връзка, **пълен дуплекс (Full Duplex)** — двупосочно **едновременно**.\n\n### Капани за изпита\n- **Структурната** организация е **подчинена на функционалната**; функционалната **не се е променяла**, структурната — **много**.\n- Фон Нойман: **блок за обработка = АЛУ + регистри**, **блок за управление = регистър на инструкциите + брояч на програми** — не ги разменяйте. „Тясното място“ е **общата шина**.\n- Харвард = **отделни** памети **и** сигнални пътища; паметите **не е нужно** да са еднакви.\n- Векторни процесори = подход **по време (конвейеризация)**; масив процесори в **матрица** = **пространствено повторение**. **Стъпка** = адресното нарастване; **маската** е за **разредени** матрици. Векторен регистър: **2 входа за четене, 1 за запис**.\n- **ROM — енергонезависима**, **RAM — губи данните**; RAM е **скъпа**, външната памет — **евтина**. Програмата се изпълнява **от RAM**, не от диска.\n- CD: **1.2 мм / 120 мм**, **поликарбонат + алуминий (рядко злато)**, запис — **оптичен**, а не магнитен.\n- Часовникът е **„сърцето“**, процесорът — **„мозъкът“**; системното време се настройва по **таймера**.\n- Шина за данни на **8086/80286 — 16 бита**; днес **32/64**. Адресите се **формират от микропроцесора**; шината за управление носи и **информация за състоянието**.\n- Примерната платка: **915G = северен мост** (памет + GMA 900), **ICH6R = южен мост** (USB 2.0, RAID). **PCIe x1 — 250 MB/s**, **PCIe x16 — 4000 MB/s** (видео). **SATA = Serial AT Attachment**, **IDE = Integrated Drive Electronics** (паралелна ATA). **PS/2** — мишка/клавиатура; **VGA** — аналогов видео изход; **S/PDIF** — цифров аудио.\n- **Противоречие в слайдовете**: при „мостовете“ **PCI** е при **северния мост**, а при IHA **GMCH НЕ поддържа PCI**, а **ICH е PCI контролер**. Отговаряйте според архитектурата, за която пита въпросът.\n- **233 MBps** — връзката ICH–GMCH, **2 пъти** по-широка от южен–северен мост.\n- Интерфейсна съвместимост: **информационна, електрическа, конструктивна** — не я бъркайте с нивата на съвместимост от Лекция 1 (**апаратна, програмна, информационна**). **Протокол/управляващ автомат** → информационна; **заземяване/шум/дължина на линията** → електрическа; **съединители/печатна платка/кабел** → конструктивна.\n- **Вместимост** = брой абонати **без разширители** (не капацитет на памет).\n- По слайда: **асинхронните** пренасят **само логическите стойности** на битовете и разчитат на предварително уговорени честоти и протокол; **синхронните** „опаковат“ данните (**модулиране**) и предават **големи блокове**.\n- **Полудуплекс** = двупосочно, но **редуващо се**; **пълен дуплекс** = **едновременно**.\n- Слайдът пише **„FireWare“** — правилно е **FireWire** (IEEE 1394); „Проектир“ в таблицата = **проектор**.\n- Таблицата с периферията: **монитор, клавиатура, мишка, микрофон, тон-колони** са и **устройства за диалог**; **скенер, принтер, проектор** са и в **„Други“**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L02-A-1","n":1,"text":"Как се отнася структурната организация на компютърните системи към функционалната?","opts":["функционалната организация е подчинена на структурната","двете са независими една от друга","структурната организация е подчинена на функционалната","функционалната организация е част от структурната"],"correct":2,"expl":"Структурната организация трябва да е подчинена на програмното управление, т.е. на функционалната организация."},{"id":"L02-A-2","n":2,"text":"Колко структурни елемента (транзистора) съдържа чипът на първите микропроцесори Pentium?","opts":["около 30 000","около 300 000","над 30 000 000","над 3 000 000"],"correct":3,"expl":"Първите Pentium съдържат над 3 000 000 транзистора."},{"id":"L02-A-3","n":3,"text":"Какво съдържа блокът за управление в архитектурата на фон Нойман?","opts":["аритметично-логическа единица и регистри на процесора","регистър на инструкциите и брояч на програми","памет за данни и памет за инструкции","външно масово съхранение и механизми за вход и изход"],"correct":1,"expl":"Блокът за управление съдържа регистър на инструкциите и брояч на програми; АЛУ и регистрите са в блока за обработка."},{"id":"L02-A-4","n":4,"text":"Как се наричат процесорите, при които архитектурата се изгражда чрез съвместяване по време (конвейеризация) на изпълнението на командите, обработващи векторите?","opts":["векторни процесори","скаларни процесори","харвардски процесори","суперскаларни процесори"],"correct":0,"expl":"Подходът с конвейеризация дава векторни процесори/компютри; пространственото повторение — масив от процесори в матрица."},{"id":"L02-A-5","n":5,"text":"Коя памет съдържа програмите, които винаги трябва да са налице (напр. кода за стартиране на компютъра), и е енергонезависима?","opts":["RAM","кеш паметта","регистрите на процесора","ROM"],"correct":3,"expl":"ROM (Read Only Memory) съхранява стартовия код и не губи данните без захранване."},{"id":"L02-A-6","n":6,"text":"Ако микропроцесорът е „мозъкът“ на компютъра, то кой компонент се оприличава на неговото „сърце“?","opts":["таймерът","схемният набор (чипсет)","шината за управление","часовникът (тактовият генератор)"],"correct":3,"expl":"Часовникът задава тактовите импулси за процесора и другите устройства."},{"id":"L02-A-7","n":7,"text":"Кои са трите вида шини, които свързват отделните устройства на компютъра?","opts":["шина за данни, шина за инструкции и шина за прекъсвания","шина за данни, шина за адреси и шина за управление","системна шина, локална шина и шина за разширение","шина за адреси, шина за захранване и шина за синхронизация"],"correct":1,"expl":"Връзката се осъществява от шина за данни, адресна шина и шина за управление."},{"id":"L02-A-8","n":8,"text":"Какво определя дънната платка?","opts":["тактовата честота на процесора, обема на твърдия диск и капацитета на паметта","командната система на процесора, принципа на адресиране и формата на инструкциите","типа на устройствата, които могат да се използват, и структурната схема на компютъра","протокола на външните интерфейси, операционната система и приложните програми"],"correct":2,"expl":"Дънната платка определя типа на използваемите устройства и структурната схема на компютъра."},{"id":"L02-A-9","n":9,"text":"Кой е основният управляващ елемент на дънната платка, който управлява прехвърлянето на данни между устройствата?","opts":["BIOS микросхемата","схемният набор (чипсет)","тактовият генератор","контролерът на прекъсванията"],"correct":1,"expl":"Чипсетът управлява трансфера, синхронизира шините и определя приоритетите; контролерът на прекъсванията е само част от него."},{"id":"L02-A-10","n":10,"text":"Интерфейсът на компютъра е:","opts":["съвкупност от унифицирани апаратни, програмни и конструктивни средства за взаимодействие на функционални блокове","множество електрически линии (проводници), по които се пренасят данни и адреси между паметта и процесора","един или няколко чипа на дънната платка, които синхронизират честотата на шините и обмена между тях","програма към операционната система, която транслира инструкциите, за да станат разбираеми за периферното устройство"],"correct":0,"expl":"Опциите 2–4 описват шина, чипсет и драйвер."}],"B":[{"id":"L02-B-1","n":1,"text":"Как се е променяла организацията на изчислителните машини в процеса на тяхното развитие?","opts":["функционалната организация не се е променяла, а структурната е претърпяла значителни промени","структурната организация не се е променяла, а функционалната е претърпяла значителни промени","и функционалната, и структурната организация са се променяли еднакво","и двете са останали непроменени от времето на фон Нойман"],"correct":0,"expl":"Структурната организация се променя поради нова елементна база, нови схемни решения и стандарти."},{"id":"L02-B-2","n":2,"text":"Защо за чиповете на микропроцесорите се използва силиций?","opts":["защото е най-добрият проводник на електрически ток","защото позволява оптичен запис на информацията","защото е широко разпространен и достатъчно евтин полупроводник","защото осигурява по-добра чистота на процесите от медта"],"correct":2,"expl":"Силицият е широко разпространен и евтин полупроводник; медта (не силицият) подобрява чистотата."},{"id":"L02-B-3","n":3,"text":"Какво съдържа блокът за обработка в архитектурата на фон Нойман?","opts":["регистър на инструкциите и брояч на програми","аритметична логическа единица и регистри на процесора","оперативна памет и постоянна памет","контролер на паметта и контролер на шината"],"correct":1,"expl":"Блокът за обработка = АЛУ + регистри; блокът за управление = регистър на инструкциите + брояч на програми."},{"id":"L02-B-4","n":4,"text":"Как се нарича фиксираното адресно нарастване между последователните елементи на вектор в паметта?","opts":["маска","разрядност","такт","стъпка"],"correct":3,"expl":"Векторните елементи са подредени с фиксирано адресно нарастване, наречено стъпка."},{"id":"L02-B-5","n":5,"text":"Кое твърдение за RAM паметта е вярно?","opts":["съхранява кода за стартиране на компютъра и е енергонезависима","осигурява евтино дълготрайно съхранение на програмите","позволява само четене, но не и запис от процесора","губи съдържанието си при изключване на захранването"],"correct":3,"expl":"RAM е бърза, скъпа памет за четене и запис и губи данните при изключване."},{"id":"L02-B-6","n":6,"text":"По кой компонент се настройва системното време на компютъра?","opts":["таймера","тактовия генератор (Host Bus Clock)","северния мост","шината за управление"],"correct":0,"expl":"Таймерът брои импулси, подава импулси с определена честота и по него се настройва системното време."},{"id":"L02-B-7","n":7,"text":"Каква е шината за данни на микропроцесорите i8086 и i80286?","opts":["16-битова","8-битова","32-битова","64-битова"],"correct":0,"expl":"При i8086 и i80286 шината за данни е 16-битова (16-проводна); днес е 32 или 64 бита."},{"id":"L02-B-8","n":8,"text":"Какво включва микросхемата 915G (северният мост) на примерната дънна платка?","opts":["контролера USB 2.0 и RAID-контролера за твърдите дискове SATA","контролера на оперативната памет и вграден графичен контролер GMA 900","осемканален звуков кодек, мрежов контролер и цифров изход S/PDIF","контролера IEEE 1394 (FireWire), BIOS и интерфейсите PS/2"],"correct":1,"expl":"915G съдържа контролера на паметта и Intel Graphics Media Accelerator 900; USB 2.0 и RAID са в южния мост ICH6R."},{"id":"L02-B-9","n":9,"text":"До кои производители са ограничени днес производителите на чипсети според лекцията?","opts":["Intel, IBM, Microsoft и Apple","Intel, AMD, Via и SiS","AMD, C-Media, Via и Rambus","Intel, Motorola, CDC и SiS"],"correct":1,"expl":"Производителите на чипсети днес са Intel, AMD, Via и SiS."},{"id":"L02-B-10","n":10,"text":"Кои са трите вида интерфейсна съвместимост, които интерфейсът трябва да осигури?","opts":["апаратна, програмна и информационна","електрическа, програмна и логическа","информационна, електрическа и конструктивна","апаратна, конструктивна и времева"],"correct":2,"expl":"Интерфейсната съвместимост е информационна, електрическа и конструктивна (а нивата от Лекция 1 са апаратна, програмна, информационна)."}],"C":[{"id":"L02-C-1","n":1,"text":"Какво се предвижда за много малките дебелини на електрическите връзки в съвременните интегрални схеми?","opts":["оптическа литография и замяна на медта с алуминий","лазерна литография и замяна на алуминия с мед","рентгенова литография и замяна на силиция с германий","механично нарязване и замяна на алуминия със злато"],"correct":1,"expl":"За технологии 0.13–0.08 микрона се предвиждат лазерна литография и мед вместо алуминий."},{"id":"L02-C-2","n":2,"text":"Кое е основното ограничение (тясно място) на архитектурата на фон Нойман?","opts":["инструкциите и данните се съхраняват в различни по технология и разположение памети","програмата трябва да се въвежда наново чрез промяна в схемите на свързване на машината","извличането на инструкции и операциите с данни не могат да са едновременни поради общата шина","процесорът не може да изпълнява аритметични и логически операции едновременно"],"correct":2,"expl":"Инструкциите и данните споделят обща шина, което ограничава производителността."},{"id":"L02-C-3","n":3,"text":"Как се нарича преобразуването от скаларен към векторен код?","opts":["векторизация","конвейеризация","модулиране","декодиране"],"correct":0,"expl":"Преобразуването е векторизация, а съответните компилатори — векторизиращи."},{"id":"L02-C-4","n":4,"text":"На какви два вида се дели оперативната памет?","opts":["RAM и твърд диск","RAM и ROM","ROM и CD-ROM","кеш и флопи"],"correct":1,"expl":"Оперативната памет е от чипове и бива RAM и ROM; дисковете са външна памет."},{"id":"L02-C-5","n":5,"text":"Какъв е принципът на запис при твърдите дискове?","opts":["вдлъбнатини в отражателен метален слой, четени с лазер","електрически заряд, съхраняван в кондензатори на интегрални схеми","перфориране на отвори в гъвкав хартиен или пластмасов носител","намагнитване на участъци от повърхност със специално магнитно покритие"],"correct":3,"expl":"Твърдите (и флопи) дискове са магнитни; вдлъбнатините и лазерът се отнасят до CD-ROM."},{"id":"L02-C-6","n":6,"text":"В таблицата с периферните устройства кое устройство НЕ е посочено като устройство за диалог?","opts":["скенер","монитор","мишка","микрофон"],"correct":0,"expl":"За диалог са монитор, клавиатура, мишка, микрофон и тон-колони; скенерът е входно и в групата „Други“."},{"id":"L02-C-7","n":7,"text":"Какво предава адресната шина?","opts":["управляващи сигнали и информация за състоянието на устройствата","данните между паметта, процесора и периферните устройства","адресите от паметта, формирани от микропроцесора","тактовите импулси от основния часовник (Host Bus Clock)"],"correct":2,"expl":"Сигналите по адресната шина образуват двоично число — мястото на данните в паметта."},{"id":"L02-C-8","n":8,"text":"Кои функции включва южният мост ICH6R на примерната дънна платка?","opts":["контролера на оперативната памет и графичния ускорител GMA 900","допълнителното захранване на процесора и цокъла LGA 775","системите за вход/изход, контролер USB 2.0 и RAID-кон
