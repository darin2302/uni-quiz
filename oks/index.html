 IRQ"],"correct":2,"expl":"При засенчване RAM получава адресите на BIOS и кодът се копира там — по-бърз достъп."},{"id":"L04-E-6","n":6,"text":"Къде се записва паролата, въведена чрез BIOS за защита от неправомерен достъп?","opts":["В ROM чипа на дънната платка, заедно с BIOS","В паметта, поддържана от вътрешната батерия на КС","В скритата RAM памет, копирана от ROM BIOS","В boot ROM (IPL ROM) на мрежовата карта"],"correct":1,"expl":"Паролата се записва в паметта с батерийно захранване (CMOS RAM)."},{"id":"L04-E-7","n":7,"text":"Кое НЕ е сред най-често използваните настройки чрез програмата SETUP на BIOS?","opts":["Ред на устройствата за зареждане на ОС","Деактивиране на неизползвани портове","Задаване на основна видеокарта","Избор на обвивка на UNIX"],"correct":3,"expl":"Изборът на обвивка (Bourne, C, Korn) е функция на ОС, а не на BIOS SETUP."},{"id":"L04-E-8","n":8,"text":"Каква е целта на въвеждането на длъжността оператор на ЕИМ?","opts":["Да ускори прехода от едно задание към друго, като отдели потребителите от оборудването","Да разпредели процесорното време на кванти между отделните потребители на ЕИМ","Да пише и инсталира драйверите за новите периферни устройства на машината","Да обновява BIOS и настройките на SETUP при инсталиране на нов хардуер"],"correct":0,"expl":"Операторът изпълнява операциите с оборудването — потребителите са отделени и преходът между заданията е по-бърз."},{"id":"L04-E-9","n":9,"text":"Кой от изброените НЕ е основен елемент на ядрото на операционната система?","opts":["Подсистемата за управление на паметта","Подсистемата за управление на процесите","Моделът „клиент/сървър“","Графичната обвивка"],"correct":3,"expl":"Ядрото включва подсистемите за файлове, памет, процеси, периферия и модела клиент/сървър; обвивката е интерфейс."},{"id":"L04-E-10","n":10,"text":"Каква е обичайната продължителност на квант процесорно време според лекцията?","opts":["50 милисекунди","150 наносекунди","1 секунда","6–10 наносекунди"],"correct":0,"expl":"Квантът обикновено е 50 ms; при изтичането му диспечерът принудително превключва процеса."}]}},{"num":5,"title":"Лекция 5 — Алгоритъм — определение, свойства, начини за представяне, блок-схеми","short":"Алгоритъм — определение, свойства, начини за представяне, блок-схеми","summary":"### Произход на понятието\n- Думата **алгоритъм** произлиза от името на **Мухамад ибн Муса ал-Хорезми** — един от най-големите учени на Средна Азия.\n- Ал-Хорезми е написал редица книги по **аритметика и алгебра** и често е наричан **„бащата на алгебрата“** (смята се, че поставя нейните основи).\n\n### Същност на алгоритъма\n- **Алгоритъм** — **точно упътване за решаване на един проблем или определен вид проблеми**.\n- Състои се от **крайна поредица от указания**, които се изпълняват **едно след друго** и отчасти се **повтарят в определен ред**.\n- Участници, свързани с алгоритъма:\n\n| Участник | Роля |\n|---|---|\n| **Съставител** | подготвя алгоритъма — **подбира елементарните действия и реда** на изпълнението им |\n| **Изпълнител** | **изпълнява** предписаните елементарни действия **при конкретни начални условия** |\n| **Потребител** | **задава изпълнението** на алгоритъма и **ползва крайния резултат** |\n\n### Параметри на всеки алгоритъм (7)\n- **Множество (област) на възможните начални (входни) данни**;\n- **Множество (област) на възможните резултати (изходни данни)**;\n- **Множество на междинните резултати**;\n- **Правило за започване (начало)**;\n- **Правило за непосредствена обработка** (за получаване на междинни резултати);\n- **Правило за край** (условие за приключване на изпълнението);\n- **Правило за посочване на резултата**.\n\n### Основни изисквания (свойства) на алгоритмите\nЗа да се определи дали едно описание на действия е алгоритъм, се проверява дали отговаря на 5 условия:\n\n| Свойство | Смисъл |\n|---|---|\n| **Дискретност** | алгоритъмът се състои от **отделни, разграничени по време стъпки**, всяка от които се извършва **за крайно време** |\n| **Детерминираност (определеност)** | резултатът от действията и **посочването на следващата стъпка** са **еднозначно определени** от действията, извършени до текущия момент |\n| **Масовост** | процедурата дава резултат не за краен брой съчетания на входните данни, а за **потенциално безкрайно множество** от входни данни |\n| **Резултатност** | процедурата **винаги дава резултат**, ако входните данни принадлежат на даденото подмножество |\n| **Крайност на изпълнението** | процедурата свършва с резултат **за краен брой стъпки** |\n\n- **Какво не е алгоритъм?** — **зациклените процедури**: последователности, образуващи **затворен цикъл от действия без изход**; такива процедури **никога не завършват** (нарушават крайността).\n\n### Видове алгоритми според структурата\n- **Линейни** — последователността от действия **винаги е една и съща**; всяка стъпка има **само една предходна и една следваща**.\n- **Разклонени** — последователността **зависи от стойността на входните данни**; съдържат команди, при които според изпълнението или не на дадено условие се определят следващите команди. Тези условия се наричат **логически**.\n- **Циклични** — определена част от действията се **повтаря многократно, докато не се изпълни зададеното условие**.\n- **Най-често се срещат комбинираните алгоритми** — отделни части са линейни, разклонени или циклични.\n\n### Средства за описание на алгоритми\n- Използват се различни езици: **естествени, алгоритмични, параметрични, графични** и др. — различават се по **степен на формализация**, удобство за запис и четене, възможност за обмен.\n- **Всяка програма е специфично представяне на алгоритъма** (ако се пренебрегнат ограниченията на езика за програмиране).\n- Три основни средства:\n  1. **Словесно описание** — набор от указания с думи от **естествен език**; може да се ползват означения от предметната област. **Не е много популярно**, защото за много думи от естествените езици има **нееднозначно тълкуване**.\n  2. **Описание чрез език за програмиране (псевдокод)** — използва се **ограничено множество от конструкции на естествен език**; това множество се разглежда като **език за проектиране на алгоритми**.\n  3. **Графично описание чрез блок-схеми**.\n- Пример: **алгоритъм на Евклид** (НОД) в псевдокод:\n  - `Въведи A, B` → `Докато A ≠ B повтаряй: Ако A>B, то A:=A−B, иначе B:=B−A` → `Изведи A` → `Край.`\n  - Пример: A = 12, B = 18 → (12, 6) → (6, 6) → извежда **6** (тялото на цикъла се изпълнява 2 пъти).\n  - Пример: A = 15, B = 6 → (9, 6) → (3, 6) → (3, 3) → извежда **3** (3 изпълнения на тялото).\n\n### Блок-схеми\n- **Блок-схемата** е **графично изразно средство** за описание на алгоритми, което ясно показва **връзките между отделните инструкции**; дава **визуална представа за логическите връзки**.\n- Описанието се прави със символи, наречени **блокове**; всеки има **точно определен смисъл**. Блоковете имат вид на геометрични фигури: **правоъгълник, ромб, успоредник** и др.\n- **Последователността се задава чрез стрелки.**\n- Блок-схемата **започва с начален блок**, в който се записва указанието, с което започва алгоритъмът.\n- Символите са дефинирани по стандарт **БДС 19103—78**.\n\n| № | Наименование | Символ (форма) | Изпълнявана функция |\n|---|---|---|---|\n| 1 | **Изчислителен блок** | правоъгълник | изпълнява **изчислително действие или група от действия** |\n| 2 | **Логически блок** | **ромб** | **избор на направление** за изпълнение в зависимост от **условието** |\n| 3 | Вход/изход | **успоредник** | въвеждане или извеждане на данни (в зависимост от физическия носител) |\n| 3 | Вход/изход | правоъгълник с вълнообразна долна страна | извеждане на данни на **печатащо устройство** |\n| 3 | Вход/изход | четириъгълник с наклонена горна страна | **ръчно въвеждане** на данни |\n| 3 | Вход/изход | фигура със заострена лява и заоблена дясна страна | **дисплей** |\n| 3 | Вход/изход | **цилиндър** | **четене и запис от хард диск** |\n| 4 | **Начало/край** | заоблен правоъгълник (овал) | начало или край на програма или подпрограма |\n| 5 | **Подпрограма** | правоъгълник с **двойни вертикални линии** отстрани | изпълнение на **стандартна или потребителска подпрограма** |\n| 6 | **Блок модификация** | **шестоъгълник** | действия за **промяна на точката (пункта) на алгоритъма** (ползва се за цикъл с параметри) |\n| 7 | **Вътрешно-страничен съединител** | **кръг** | преход в рамките на страницата |\n| 8 | **Между-страничен съединител** | петоъгълник („щит“) | преход **на нова страница** |\n\n### Етапи на пълното разработване на алгоритми и програми (9, по ред)\n1. **Постановка на задачата**;\n2. **Формализация** (математическа постановка);\n3. **Избор (или разработка) на метод** за решаване;\n4. **Разработване на алгоритъма**;\n5. **Проверка на правилността** на алгоритъма;\n6. **Съставяне на програма**;\n7. **Настройка на програмата**;\n8. **Обработка и анализ на получените резултати**;\n9. **Съставяне на документацията**.\n\n### Основни понятия\n- **Величини** — характеризират се с **име и тип**. **Типът определя множеството от допустими стойности**. Стойността в даден момент — **текуща стойност**. Делят се на:\n  - **Променливи** — в компютърните алгоритми променливата е **елемент от паметта, чието съдържание може да се променя** (различно от математическата представа);\n  - **Константи** — **стойността им не се променя**.\n- **Изрази** — за всеки тип са дефинирани операции; в изразите величините участват **със своите имена**, а операциите се извършват **върху стойностите им**.\n\n### Линейни алгоритми — пример\n- Лице на правоъгълник **S = a·b**: Стъпка 1 — Начало; Стъпка 2 — въвеждане и запаметяване на **a и b**; Стъпка 3 — на **S се присвоява a*b**; Стъпка 4 — извеждане на S; Стъпка 5 — Край.\n\n### Разклонени алгоритми\n- Две форми:\n  - **Кратка** — действие **A** се изпълнява **само при условие P**; ако условието не е изпълнено, командата **не се изпълнява** (условен оператор в кратък формат).\n  - **Пълна** — ако P е изпълнено → действие **A**, иначе → действие **B** (условен оператор в пълен формат).\n- Пример: **най-малкото от три числа a, b, c** — два начина:\n  - **Първи начин** (вложени проверки): ако a < b → проверка a < c (m = a или m = c); ако a ≥ b → проверка b < c (m = b или m = c); извежда се m.\n  - **Втори начин** (последователни кратки разклонения): **m = a**; ако **m > b → m = b**; ако **m > c → m = c**; извежда се m. Напр. a=7, b=3, c=5: m=7 → m=3 → (3>5? не) → извежда **3**, с **2 присвоявания** на m.\n\n### Циклични алгоритми\n- **Тяло на цикъла** — групата блокове, които са **описани веднъж, но се изпълняват многократно**.\n- В тях **задължително има условен блок**; необходимо е да се осигури **край на повторенията** (излизане от цикъла).\n- В тялото трябва да се **променя стойността поне на 1 променлива**, участваща в условието за край — иначе се получава **безкраен цикъл**.\n- **3 вида цикли**:\n\n| Вид | Как работи | Минимален брой изпълнения на тялото |\n|---|---|---|\n| **С предусловие** | първо се **проверява условието**, после (ако е изпълнено) се изпълнява тялото | **0** (може да не се изпълни нито веднъж) |\n| **Със следусловие (постусловие)** | първо се **изпълнява тялото**, после се проверява условието за продължаване | **1** (поне веднъж) |\n| **С параметри** (с брояч, аритметичен) | **предварително зададен брой повторения**; в блока за условие (шестоъгълник) се задава **законът за промяна на параметъра**: `Xo (h) Xn` | зададен от Xo, Xn и стъпката |\n\n- Означения: **Xo** — първоначална стойност на брояча; **h** — индексна променлива (брояч); **Xn** — последна стойност на брояча.\n- Условия при цикли с броячи:\n  - началната и крайната стойност са **от един и същ тип**;\n  - **забранява се** в тялото да се променя началната стойност;\n  - ако началната стойност е **по-голяма** от крайната, **стъпката е отрицателна**;\n  - след излизане от цикъла индексната променлива е **неопределена** и не може да се използва.\n- **4 задължителни елемента на всеки цикъл**: **установяване на началното състояние**; **тяло**; **условие за изход**; **обновяване на условието за излизане (брояч)**.\n\n### Пример: сума на редица от числа\n- Използва се при **статистическа информация** и **анализ на динамични процеси**. Означения: **h** — индекс, **Xo/Xn** — начална/крайна стойност, **S** — сума (начално **S = 0**), **Ah** — текущият елемент (под **масив** се разбира **вектор ред** от математиката).\n- **С предусловие**: S=0, h=Xo → **проверка h < Xn** → (да) S=S+Ah, h=h+1 → обратно към проверката; (не) → извеждане.\n- **Със следусловие**: S=0, h=Xo → S=S+Ah, h=h+1 → **проверка h < Xn** → (да) обратно; (не) → извеждане.\n- **С параметри**: S=0 → блок модификация `h = Xo (1) Xn` (стъпка 1) → S=S+Ah → ...\n- Пример (предусловие, h < Xn): A1=3, A2=5, A3=7, A4=9, Xo=1, Xn=4 → S = 3+5+7 = **15** (A4 не се добавя, защото при h=4 условието 4<4 е невярно).\n- Пример (следусловие): Xo=5, Xn=3 → тялото се изпълнява **1 път**, после 6<3 е невярно.\n\n### Капани за изпита\n- **Дискретност** (отделни стъпки, всяка за крайно време) ≠ **Крайност** (краен **брой** стъпки). **Масовост** (безкрайно множество входни данни) ≠ **Резултатност** (винаги дава резултат за допустимите данни).\n- **Детерминираност = определеност** — еднозначност на резултата и на следващата стъпка.\n- **Съставител** подбира действията, **изпълнител** ги изпълнява, **потребител** задава изпълнението и ползва резултата.\n- **Ромб** = логически блок (условие); **шестоъгълник** = блок модификация (цикъл с параметри); **успоредник** = вход/изход; **цилиндър** = хард диск; **кръг** = вътрешно-страничен съединител; **петоъгълник** = между-страничен съединител; правоъгълник с двойни странични линии = **подпрограма**.\n- Цикъл с **предусловие** — тялото може да **не се изпълни нито веднъж**; със **следусловие** — **поне веднъж**.\n- Цикъл **с параметри = с брояч = аритметичен** (три имена на едно и също).\n- Етапите: **Постановка → Формализация → Избор на метод → Разработване на алгоритъма → Проверка → Програма → Настройка → Анализ на резултатите → Документация**. Не бъркай „проверка на правилността на алгоритъма“ (преди програмата) с „настройка на програмата“ (след нея).\n- Най-често се срещат **комбинираните** алгоритми, не линейните.\n- Словесното описание е **непопулярно** заради **нееднозначността** на естествения език; псевдокодът ползва **ограничено** множество конструкции.\n- **Несъответствия в слайдовете**: в блок-схемите за сума на редица изходният блок извежда **„m“**, а би трябвало да извежда **S**; условието **h < Xn** всъщност изключва последния елемент A(Xn) — за пълна сума от Xo до Xn условието трябва да е **h ≤ Xn**. „бояча“ на слайда е печатна грешка за „брояча“.\n- Стандартът за символите е **БДС 19103—78**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L05-A-1","n":1,"text":"Думата „алгоритъм“ произлиза от името на:","opts":["Евклид от Александрия","Мухамад ибн Муса ал-Хорезми","Готфрид Вилхелм Лайбниц","Блез Паскал"],"correct":1,"expl":"Ал-Хорезми — учен от Средна Азия, наричан „бащата на алгебрата“."},{"id":"L05-A-2","n":2,"text":"Кое изискване към алгоритмите означава, че той се състои от отделни, разграничени по време стъпки, всяка от които се извършва за крайно време?","opts":["Детерминираност","Масовост","Крайност на изпълнението","Дискретност"],"correct":3,"expl":"Това е определението за дискретност."},{"id":"L05-A-3","n":3,"text":"Какво означава блокът във формата на ромб в блок-схема?","opts":["Логически блок — избор на направление в зависимост от условие","Изчислителен блок — изпълнение на група от действия","Блок за въвеждане или извеждане на данни","Блок модификация — промяна на пункта на алгоритъма"],"correct":0,"expl":"Ромбът е логическият (условен) блок."},{"id":"L05-A-4","n":4,"text":"Кой е първият етап от пълното разработване на алгоритми и програми?","opts":["Формализация (математическа постановка)","Избор на метод за решаване","Постановка на задачата","Разработване на алгоритъма"],"correct":2,"expl":"Редът започва с постановка на задачата, след нея е формализацията."},{"id":"L05-A-5","n":5,"text":"Алгоритъмът на Евклид: „Докато A ≠ B повтаряй: ако A>B, то A:=A−B, иначе B:=B−A; изведи A“. Какво ще изведе при A = 12, B = 18?","opts":["3","12","6","2"],"correct":2,"expl":"(12,18) → (12,6) → (6,6); извежда 6."},{"id":"L05-A-6","n":6,"text":"При цикъл с предусловие тялото на цикъла:","opts":["може да не се изпълни нито веднъж","винаги се изпълнява поне веднъж","се изпълнява точно предварително зададен брой пъти","се изпълнява, преди да се провери условието"],"correct":0,"expl":"Условието се проверява първо; ако не е изпълнено, тялото се пропуска."},{"id":"L05-A-7","n":7,"text":"Кой участник задава изпълнението на алгоритъма и ползва крайния резултат?","opts":["Съставителят","Изпълнителят","Проектантът","Потребителят"],"correct":3,"expl":"Потребителят задава изпълнението и ползва резултата."},{"id":"L05-A-8","n":8,"text":"Кое от изброените НЕ е параметър на всеки алгоритъм?","opts":["Множество на междинните резултати","Правило за оптимизиране на заетата памет","Правило за край","Правило за посочване на резултата"],"correct":1,"expl":"Параметрите са: входни данни, резултати, междинни резултати, правила за начало, обработка, край и посочване на резултата."},{"id":"L05-A-9","n":9,"text":"Алгоритъм, при който всяка стъпка има само една предходна и една следваща, е:","opts":["линеен","разклонен","цикличен","комбиниран"],"correct":0,"expl":"При линейните алгоритми последователността винаги е една и съща."},{"id":"L05-A-10","n":10,"text":"По втория начин за намиране на най-малкото от три числа (m=a; ако m>b, то m=b; ако m>c, то m=c) колко присвоявания на m се извършват общо при a=7, b=3, c=5?","opts":["1","3","4","2"],"correct":3,"expl":"m=7 (1-во), 7>3 → m=3 (2-ро), 3>5 не → общо 2."}],"B":[{"id":"L05-B-1","n":1,"text":"Какво означава изискването за детерминираност (определеност) на алгоритъма?","opts":["Алгоритъмът дава резултат за потенциално безкрайно множество от входни данни","Процедурата свършва с резултат за краен брой стъпки","Резултатът и следващата стъпка са еднозначно определени от извършените дотук действия","Всяка стъпка се извършва за крайно време"],"correct":2,"expl":"Детерминираност — еднозначност на резултата и на следващата стъпка."},{"id":"L05-B-2","n":2,"text":"Защо зациклените процедури не са алгоритми?","opts":["Образуват затворен цикъл без изход и никога не завършват","Не притежават множество от начални (входни) данни","Съдържат повече от един условен (логически) блок","Не могат да бъдат описани с блок-схема или псевдокод"],"correct":0,"expl":"Зациклените процедури никога не завършват — нарушават крайността."},{"id":"L05-B-3","n":3,"text":"Какво означава блокът във формата на успоредник?","opts":["Изчислително действие","Въвеждане или извеждане на данни","Начало или край на програмата","Изпълнение на подпрограма"],"correct":1,"expl":"Успоредникът е общият блок за вход/изход."},{"id":"L05-B-4","n":4,"text":"По кой стандарт са дефинирани символите в блок-схемите?","opts":["ISO 9001","IEEE 754","БДС EN 60617","БДС 19103—78"],"correct":3,"expl":"Символите са по БДС 19103—78."},{"id":"L05-B-5","n":5,"text":"В блок-схемата за сума с предусловие (S=0, h=Xo; докато h < Xn: S=S+Ah, h=h+1) е зададено Xo=1, Xn=4 и A1=3, A2=5, A3=7, A4=9. Каква е крайната стойност на S?","opts":["15","24","9","21"],"correct":0,"expl":"Добавят се A1..A3 = 3+5+7 = 15; при h=4 условието 4<4 е невярно."},{"id":"L05-B-6","n":6,"text":"При цикъл със следусловие (постусловие):","opts":["първо се проверява условието, а след това се изпълнява тялото","броят на повторенията е зададен предварително чрез начална и крайна стойност на брояча","първо се изпълнява тялото, а след това се проверява условието за продължаване","тялото може да не се изпълни нито веднъж"],"correct":2,"expl":"При следусловието проверката е след тялото, затова то се изпълнява поне веднъж."},{"id":"L05-B-7","n":7,"text":"Цикъл с предварително зададен брой повторения се нарича:","opts":["цикъл с предусловие","цикъл с параметри","цикъл със следусловие","зациклена процедура"],"correct":1,"expl":"Цикълът с параметри има предварително зададен брой повторения."},{"id":"L05-B-8","n":8,"text":"Кое НЕ е сред четирите задължителни елемента на всеки цикъл?","opts":["Установяване на началното състояние","Условие за изход от цикъла","Обновяване на условието за излизане (брояч)","Извеждане на междинните резултати"],"correct":3,"expl":"Четирите елемента са: начално състояние, тяло, условие за изход, обновяване на условието."},{"id":"L05-B-9","n":9,"text":"Какво е характерно за пълната форма на разклонен алгоритъм?","opts":["При изпълнено условие P се извършва A, иначе не се изпълнява нищо","При изпълнено условие P се извършва действие A, иначе — действие B","Действие A се повтаря, докато условието P е изпълнено","Действия A и B се изпълняват винаги последователно"],"correct":1,"expl":"Пълна форма: A при P, B при неизпълнено P."},{"id":"L05-B-10","n":10,"text":"Кой етап следва непосредствено след „Разработване на алгоритъма“?","opts":["Проверка на правилността на алгоритъма","Съставяне на програмата по алгоритъма","Настройка на готовата програма","Избор на метод за решаване на задачата"],"correct":0,"expl":"Редът е: разработване на алгоритъма → проверка на правилността → съставяне на програма."}],"C":[{"id":"L05-C-1","n":1,"text":"Кое свойство изисква процедурата да дава резултат не за краен брой съчетания от входните данни, а за потенциално безкрайно множество от тях?","opts":["Резултатност","Дискретност","Детерминираност","Масовост"],"correct":3,"expl":"Това е масовостта на алгоритъма."},{"id":"L05-C-2","n":2,"text":"Каква е ролята на изпълнителя на алгоритъма?","opts":["Подбира елементарните действия и определя реда на тяхното изпълнение","Изпълнява предписаните елементарни действия при конкретни начални условия","Задава изпълнението на алгоритъма и използва получения краен резултат","Съставя документацията на програмата след нейната настройка"],"correct":1,"expl":"Изпълнителят изпълнява действията; подборът им е работа на съставителя."},{"id":"L05-C-3","n":3,"text":"Правоъгълник с допълнителни вертикални линии от двете страни в блок-схема означава:","opts":["изчислително действие или група от действия","ръчно въвеждане на данни","изпълнение на стандартна или потребителска подпрограма","извеждане на данни на печатащо устройство"],"correct":2,"expl":"Това е символът „Подпрограма“."},{"id":"L05-C-4","n":4,"text":"Алгоритъмът на Евклид („Докато A ≠ B: ако A>B, то A:=A−B, иначе B:=B−A“) се изпълнява за A = 15, B = 6. Колко пъти се изпълнява тялото на цикъла?","opts":["3","2","4","5"],"correct":0,"expl":"(15,6) → (9,6) → (3,6) → (3,3): три изпълнения, извежда 3."},{"id":"L05-C-5","n":5,"text":"Кой начин за описание на алгоритми не е много популярен, тъй като думите от естествените езици често имат нееднозначно тълкуване?","opts":["Описанието чрез псевдокод","Описанието чрез блок-схеми","Описанието чрез програма","Словесното описание"],"correct":3,"expl":"Словесното описание страда от нееднозначността на естествения език."},{"id":"L05-C-6","n":6,"text":"Какво следва, ако при цикъл с брояч началната стойност е по-голяма от крайната?","opts":["Тялото на цикъла не се изпълнява нито веднъж","Стъпката на нарастване е отрицателна","Индексната променлива става неопределена","Началната стойност трябва да се промени в тялото"],"correct":1,"expl":"При Xo > Xn стъпката е отрицателна."},{"id":"L05-C-7","n":7,"text":"С какво започва всяка блок-схема?","opts":["С начален блок, съдържащ указанието за начало на алгоритъма","С логически блок, който проверява допустимостта на входните данни","С блок за въвеждане на началните стойности на данните","С вътрешно-страничен съединител"],"correct":0,"expl":"Блок-схемата започва с начален блок."},{"id":"L05-C-8","n":8,"text":"Как се нарича групата от блокове, които са описани веднъж, но се изпълняват многократно?","opts":["Подпрограма","Логически блок","Тяло на цикъла","Блок модификация"],"correct":2,"expl":"Това е определението за тяло на цикъла."},{"id":"L05-C-9","n":9,"text":"Цикъл с параметри h = Xo (1) Xn има Xo = 2 и Xn = 6 (стъпка 1). Колко пъти ще се изпълни тялото му?","opts":["4","6","5","3"],"correct":2,"expl":"h приема стойностите 2, 3, 4, 5, 6 — общо 5."},{"id":"L05-C-10","n":10,"text":"Кое от изброените НЕ е вид алгоритъм според структурата в лекцията?","opts":["Линеен","Паралелен","Разклонен","Цикличен"],"correct":1,"expl":"Според структурата алгоритмите са линейни, разклонени и циклични (и комбинирани)."}],"D":[{"id":"L05-D-1","n":1,"text":"Кое изискване гласи, че процедурата трябва винаги да дава резултат, ако входните данни принадлежат на даденото подмножество?","opts":["Резултатност","Масовост","Крайност на изпълнението","Дискретност"],"correct":0,"expl":"Това е резултатността."},{"id":"L05-D-2","n":2,"text":"Каква е функцията на изчислителния блок (правоъгълник)?","opts":["Избира направление според условие","Отбелязва началото или края на програмата или подпрограмата","Изпълнява изчислително действие или група от действия","Извършва четене и запис от хард диск"],"correct":2,"expl":"Изчислителният блок изпълнява действия/изчисления."},{"id":"L05-D-3","n":3,"text":"Блокът модификация (шестоъгълник) се използва за:","opts":["ръчно въвеждане на данни от клавиатурата на компютъра","преход към нова страница на блок-схемата","изпълнение на стандартна подпрограма","промяна на точката (пункта) на алгоритъма"],"correct":3,"expl":"Блок модификация — промяна на пункта; ползва се при цикъл с параметри."},{"id":"L05-D-4","n":4,"text":"С какво се характеризират величините в алгоритмите?","opts":["Със стойност и адрес","С име и тип","С име и размер в байтове","С тип и брой повторения"],"correct":1,"expl":"Величините имат име и тип; типът определя допустимите стойности."},{"id":"L05-D-5","n":5,"text":"Какво означава променлива в компютърните алгоритми?","opts":["Неизвестна величина в математическо уравнение","Елемент от паметта, чието съдържание може да се променя","Величина, чиято стойност не се променя","Име на операция в израз"],"correct":1,"expl":"Понятието се различава от математическата представа за променлива."},{"id":"L05-D-6","n":6,"text":"В примера за линеен алгоритъм за лице на правоъгълник какво се извършва на стъпка 3?","opts":["Въвеждат се и се запаметяват стойностите на a и b","Извежда се стойността на S като резултат","Проверява се дали a < b","На променливата S се присвоява произведението a * b"],"correct":3,"expl":"Стъпка 2 е въвеждане, стъпка 3 — S = a*b, стъпка 4 — извеждане."},{"id":"L05-D-7","n":7,"text":"Алгоритъм в кратка форма на разклонение: „Въведи x; ако x < 0, то x := −x; изведи x“. Какво ще изведе при x = −7?","opts":["−7","0","7","14"],"correct":2,"expl":"Условието −7 < 0 е изпълнено, x := 7."},{"id":"L05-D-8","n":8,"text":"Кой е последният етап от пълното разработване на алгоритми и програми?","opts":["Съставяне на документацията","Обработка и анализ на получените резултати","Настройка на програмата","Проверка на правилността на алгоритъма"],"correct":0,"expl":"Последен етап е документацията, преди нея — анализът на резултатите."},{"id":"L05-D-9","n":9,"text":"В блок-схемата със следусловие (S=S+Ah, h=h+1, после проверка h < Xn) е зададено Xo = 5, Xn = 3. Колко пъти се изпълнява тялото?","opts":["0","2","3","1"],"correct":3,"expl":"Тялото се изпълнява веднъж преди проверката; 6 < 3 е невярно."},{"id":"L05-D-10","n":10,"text":"Какво обозначава кръгът в блок-схема?","opts":["Между-страничен съединител","Начало или край","Вътрешно-страничен съединител","Дисплей"],"correct":2,"expl":"Кръгът е вътрешно-страничен преход."}],"E":[{"id":"L05-E-1","n":1,"text":"Кое изискване гласи, че процедурата трябва да свършва с резултат за краен брой стъпки?","opts":["Дискретност","Крайност на изпълнението","Резултатност","Детерминираност"],"correct":1,"expl":"Краен брой стъпки — крайност; крайно време за всяка стъпка — дискретност."},{"id":"L05-E-2","n":2,"text":"Кое е вярно за константите в алгоритмите?","opts":["Стойността им не се променя","Те са елементи от паметта, чието съдържание се променя","Нямат тип, а само име","Използват се само в логически изрази"],"correct":0,"expl":"Константите имат непроменлива стойност."},{"id":"L05-E-3","n":3,"text":"Какво означава символът във формата на цилиндър в блок-схема?","opts":["Дисплей","Ръчно въвеждане на данни","Четене и запис от хард диск","Извеждане на печатащо устройство"],"correct":2,"expl":"Цилиндърът е блок за четене/запис от хард диск."},{"id":"L05-E-4","n":4,"text":"Кое НЕ е сред трите основни средства за описание на алгоритми?","opts":["Словесно описание","Описание чрез псевдокод","Графично описание чрез блок-схеми","Таблица на истинност"],"correct":3,"expl":"Основните средства са словесно, псевдокод и блок-схеми."},{"id":"L05-E-5","n":5,"text":"Какво ще изведе алгоритъмът: „S := 0; i := 1; докато i ≤ 4 повтаряй: S := S + i*i; i := i + 1; изведи S“?","opts":["14","10","55","30"],"correct":3,"expl":"S = 1 + 4 + 9 + 16 = 30."},{"id":"L05-E-6","n":6,"text":"Как се наричат условията, от които зависи следващата изпълнявана команда в разклонените алгоритми?","opts":["Логически","Аритметични","Модификационни","Циклични"],"correct":0,"expl":"Условията в разклонените алгоритми се наричат логически."},{"id":"L05-E-7","n":7,"text":"Какво важи за индексната променлива след излизане от цикъл с брояч?","opts":["Запазва крайната стойност Xn","Тя е неопределена и не може да се използва","Връща се към началната стойност Xo","Автоматично се нулира"],"correct":1,"expl":"След цикъла с брояч индексната променлива е неопределена."},{"id":"L05-E-8","n":8,"text":"Кои алгоритми се срещат най-често на практика?","opts":["Линейните","Разклонените","Комбинираните","Цикличните"],"correct":2,"expl":"Най-често се срещат комбинирани алгоритми."},{"id":"L05-E-9","n":9,"text":"Какво ще се получи, ако в тялото на цикъла не се променя нито една променлива, участваща в условието за край?","opts":["Безкраен цикъл","Тялото няма да се изпълни нито веднъж","Цикълът ще се превърне в цикъл с параметри","Цикълът ще се изпълни точно веднъж"],"correct":0,"expl":"Без промяна на условието цикълът не завършва."},{"id":"L05-E-10","n":10,"text":"С какъв символ се отбелязва преминаване на нова страница в блок-схема?","opts":["Вътрешно-страничен съединител","Между-страничен съединител","Блок модификация","Начало/край"],"correct":1,"expl":"Между-страничният съединител (петоъгълник) е за преход на нова страница."}]}},{"num":6,"title":"Лекция 6 — Информация — видове, количество, мерни единици, представяне в компютрите","short":"Информация — видове, количество, мерни единици, представяне в компютрите","summary":"### Същност на информацията\n- Терминът идва от латинското **informatio** — **сведения, изложения, разяснения, пояснения**.\n- Във **философията** има две противостоящи концепции (подхода):\n  - **Атрибутивен** — информацията е **свойство на всички материални обекти** заедно с **енергията и веществото**, т.е. **атрибут на материята**;\n  - **Функционален** — свързва информацията **със системи, които функционират и се самоорганизират**.\n- **К. Шанон** — информацията е **средство за намаляване (сваляне) на неопределеността**.\n- **Кибернетиката** — информацията е **основен компонент в системите за управление**.\n- **Н. Винер** — информацията е **означение на съдържанието на сигналите**, получавани от външния свят **в процеса на приспособяването на човека** към него.\n\n### Основни компоненти на информацията\n| Компонент | Определение |\n|---|---|\n| **Данни** | елементи на информацията във **формализиран вид** (букви, цифри, знаци), предназначени за **обработка и пренасяне**; целостта от сведения за обект, явление или процес |\n| **Съобщения** | информация с **определен конкретен смисъл**, насочена **от източник към произволен приемник**, с **фиксирани начало и край** |\n| **Сигнали** | **променяща се физическа величина**, процес или явление — **материалният носител** при пренасяне на съобщението |\n\n### Видове информация — критерии за класификация\n- **Според начина на представяне** (материална форма на носителя): **аналогова** и **дискретна**.\n- **Според начина на възприятие**: **визуална, слухова, обонятелна, тактилна, вкусова**.\n- **Според начина на изразяване**: **текстова, числова, звукова, графична**.\n- **Според предназначението**.\n\n### Аналогова информация\n- **Непрекъсната функция на времето**; сигналите се наричат **аналогови**.\n- Примери: информацията от **везни, термометри, микрофони, налягането на звука**.\n- Аналогов сигнал, чиято графика е **синусоида**, се нарича **хармоничен**.\n- Характеристики:\n  - **T — период** [**секунди**] — време за пълен цикъл; интервалът, в който се повтаря събитието;\n  - **f — честота** [**херц, Hz**] — брой повторения за единица време; **f = 1/T** (реципрочна стойност на периода);\n  - **A — амплитуда** — максимално отклонение от равновесното положение, **положително число**; измерва се в единиците на съответната величина (ток, напрежение, сила, налягане). (Слайдът я дефинира и като „разликата между екстремните стойности в рамките на един цикъл\".)\n- Пример: T = 0,02 s → f = 1/0,02 = **50 Hz**.\n\n### Дискретна (цифрова) информация\n- Дискретна информация, при която значенията са представени **с двете цифри 1 и 0**, се нарича **цифрова**.\n- Информационният процес може да се представи и с аналогова, и с цифрова информация.\n- Аналогова → цифрова: **аналогово-цифрово преобразуване (АЦП)**; цифрова → аналогова: **цифрово-аналогово преобразуване (ЦАП)**.\n- **Достоверността** при преобразуването зависи от **честотата на дискретизиране** — колкото е по-висока, толкова по-достоверна е дискретната информация.\n- **Теорема на Котелников**: **f ≥ 2·Fmax** — честотата на дискретизиране **f** трябва да е **минимум два пъти по-висока** от честотата **Fmax** на аналоговия сигнал (на практика е много по-висока). Пример: Fmax = 4 kHz → f ≥ **8 kHz**.\n\n### Характеристики и изисквания към информацията\n| Група | Елементи |\n|---|---|\n| **Общи характеристики** | **Съдържание** (смисъл и стойност на информационния поток); **Ценност** (значимост и полезност) |\n| **Общи изисквания** | **Достоверност, точност, изчерпателност, оригиналност (новост), съдържателност** |\n| **Технически характеристики** | **Количество информация** (свързва се със събитие с **два равновероятни резултата** — включено/изключено, тъмно/светло, топло/студено); **Скорост за пренасяне** (поток информация за единица време от източника към приемника) |\n| **Технически изисквания** | **Надеждност (устойчивост), достъпност, навременност (актуалност)** |\n\n### Информационен обмен\n- **Симетричен** — при изпращането **приемникът е известен и конкретизиран**.\n- **Асиметричен** — **източникът е един**, а получателите са **много** и с **неопределено местонахождение**.\n\n### Модел на К. Шанон за пренасяне на информация\n- **Информационен източник** →(изпратено съобщение)→ **Предавател** →(сигнал)→ **Шум** (← **Източник на шум**) →(получен сигнал)→ **Приемник** →(получено съобщение)→ **Получател**.\n\n### Бройни системи\n- **Непозиционни** — стойността на цифрата **не зависи от мястото** в записа (римски: XXX = 30, VIII = 8, IV = 4, VI = 6, XXXIX = 39).\n- **Позиционни** — стойността **зависи от мястото** (1999 = 1·10³ + 9·10² + 9·10¹ + 9·10⁰).\n- Обща формула: **A = aₙ·qⁿ + aₙ₋₁·qⁿ⁻¹ + … + a₁·q¹ + a₀·q⁰**, където **A** — стойност на числото; **q ≥ 2** — основа; **a** — цифри, **0 ≤ a ≤ q − 1**; **броят на цифрите е равен на основата q**; 0…n — позиция на цифрата.\n- Примери за записа **1111**: при q = 10 → **1111**; при q = 16 → 4096 + 256 + 16 + 1 = **4369**; при q = 2 → 8 + 4 + 2 + 1 = **15**. (При q = 8 → 512 + 64 + 8 + 1 = 585.)\n\n### Нива на представяне на информацията в компютрите\n| Ниво | Друго име | Какво е |\n|---|---|---|\n| **Високо** | **потребителско** | десетични числа, фиксирана/плаваща запетая |\n| **Вътрешно** | **ниско** | двоична система (q = 2), bit, byte |\n| **Обслужващо** | **междинно** | съкратен запис (шестнадесетична система) |\n\n### Потребителско ниво — фиксирана и плаваща запетая\n- **Фиксирана запетая** (обикновено число) — **стойността е идентична със записа** (0.00723; 4 307 000).\n- **Плаваща запетая** (експоненциална форма) — стойността се определя чрез израз **A = ±m·q^(±p)**, където **m — мантиса**, **1 ≤ m < 10**; **q = 10** — основа; **p — порядък** (цяло десетично число). Пример: 0,00723 = 7,23·10⁻³ → m = 7,23, p = −3.\n- Други примери: 0,000…0106 → 1,06·10⁻²⁵; 423 000…0 → 4,23·10⁺²⁷; 1 000 000 000 → 1·10⁹.\n\n| Фиксирана | Математика | Програми |\n|---|---|---|\n| 0,003706 | 3,706·10⁻³ | `3,706E-3` |\n| 0,0523 | 5,23·10⁻² | `5,23E-2` |\n| 4 378 765 | 4,378765·10⁶ | `4,378765E+6` |\n| 1 000 000 000 | 1·10⁹ | `1E+9` |\n\n- Особености: 1) разделител цяла/дробна част — **запетая (EU, 3,14)** или **точка (US, 3.14)**; 2) числата могат да се въвеждат и във фиксирана, и в плаваща запетая; 3) при извеждане може да се ползва **разделител за порядък** (1 345 706 345.57 или 1,345,706,345.57).\n- Знаци за действия в програмите: степенуване `5^3`, умножение `5*3`, деление `5/3`, приоритет — скоби `(5-3)*2`; корен: √(144+144) → `(144 + 144)^(1/2)`, ∛(255−3) → `(255 - 3)^(1/3)`.\n\n### Представки в SI\n| Кратни | | Дробни | |\n|---|---|---|---|\n| 10³ | **Кило (K)** | 10⁻³ | **Мили (m)** |\n| 10⁶ | **Мега (M)** | 10⁻⁶ | **Микро (μ)** |\n| 10⁹ | **Гига (G)** | 10⁻⁹ | **Нано (n)** |\n| 10¹² | **Тера (T)** | 10⁻¹² | **Пико (p)** |\n| 10¹⁵ | **Пета (P)** | 10⁻¹⁵ | **Фемто (f)** |\n| 10¹⁸ | **Екса (E)** | 10⁻¹⁸ | **Ато (a)** |\n| 10²¹ | **Зета (Z)** | 10⁻²¹ | **Зепто (z)** |\n| 10²⁴ | **Йота (Y)** | 10⁻²⁴ | **Йокто (y)** |\n\n### Вътрешно ниво — двоична система\n- Позиционна двоична система: **основа q = 2, цифри 0 и 1**. Вход (традиционни форми) → вътрешно представяне (двоични цифри) → изход (традиционни форми).\n- **Предпоставки за двоичната система**: **лесна техническа реализация** на 0 и 1; **елементарен аритметичен апарат** (събиране, изваждане, умножение, деление); **апаратът на булевата алгебра** (булеви променливи и функции).\n- Технически примери: **ключ изключен = 0, включен = 1**; **разреден кондензатор = 0, зареден = 1**.\n- Аритметика: 101 + 101 = **1010**; **изместване надясно = целочислено деление на 2**, **наляво = умножение по 2**.\n- Превръщане: тегла 2¹⁰…2⁰ = 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1. **205 = 11001101₂**, **54 = 00110110₂**. Пример: 150 = 128 + 16 + 4 + 2 = **10010110₂**.\n\n### Булева алгебра\n- Логическа променлива: **истина = 1**, **неистина = 0**.\n- **„И\" — AND, конюнкция — логическо умножение**: Y = X1 ∧ X2 (1 само при 1 и 1). Практика: **комбинация от клавиши** (Shift + Alt, Ctrl + Alt + Del). (3 > 2) AND (8 > 4) = 1.\n- **„ИЛИ\" — OR, дизюнкция — логическо събиране**: Y = X1 ∨ X2 (0 само при 0 и 0). Практика: **дублирани клавиши** с еднакви функции (два Shift, Alt, Ctrl). (3 > 2) AND (8 > 4 OR 5 < 10) = 1.\n- **„НЕ\" — NOT, отрицание**: превключване в противоположно (инверсно) състояние — **Caps Lock** (малки/главни букви). NOT((3 > 2) AND (8 > 4 OR 5 < 10)) = 0.\n\n### Единици bit и Byte\n- **bit (бит)** — **най-малката единица за количество информация**; двоично число от една цифра (0 — няма напрежение/изключено, 1 — има напрежение/включено).\n- **bit/s (b/s, bps)** — **най-малката единица за скорост** на пренасяне.\n- **Byte (байт)** — **основна единица за количество** — двоично число от **8 цифри**; стойности **00000000…11111111 = 0…255**. **Byte/s [B/s, Bps]** — основна единица за скорост.\n- Числата се записват в **един, два или повече байта**.\n- Кодове на символите: **ASCII — 1 байт (2⁸ = 256)**; **ANSI — 1 байт (256)**; **UNICODE — 2 байта (2¹⁶ = 65 536)**. Пример: латинско **a** — ASCII `0110 0001` = **61** (шестн.); Unicode `0061`; **кирилско а** — Unicode **`0430`**.\n\n### Кратни множители — десетични и двоични\n| Представка | Десетичен | Двоичен |\n|---|---|---|\n| Кило | 10³ = 1 000 | **2¹⁰ = 1 024** |\n| Мега | 10⁶ | **2²⁰ = 1 048 576** |\n| Гига | 10⁹ | **2³⁰ = 1 073 741 824** |\n| Тера | 10¹² | **2⁴⁰ = 1 099 511 627 776** |\n- **Kb / Mb / Gb / Tb** — бит; **KB / MB / GB / TB** — байт. Примери: 700 KB; 4.7 GB; 100 Mb/s; 15.45 KBps. Напр. 4 KB = 4·1024 = **4096 B**.\n\n### Обслужващо (междинно) ниво\n- Цел: **съкратен запис на двоични стойности** и удобство при техническите описания; **на това ниво действия с информацията не се извършват** — с малко разряди се изразяват големи двоични стойности.\n- **Шестнадесетична система**: основа **q = 16**, цифри **0…9, A, B, C, D, E, F**. Пример: **1AF = 1·16² + 10·16 + 15 = 256 + 160 + 15 = 431**. **Една шестнадесетична цифра замества 4 двоични.** Пример: 3B₁₆ = 3·16 + 11 = 59.\n\n### Капани за изпита\n- **Атрибутивен** (свойство на материята, с енергията и веществото) ≠ **функционален** (самоорганизиращи се системи). **Шанон** — намаляване на неопределеността; **Винер** — съдържание на сигналите при приспособяване; **кибернетика** — компонент на управлението.\n- **Данни** (формализиран вид) ≠ **съобщения** (конкретен смисъл, начало и край) ≠ **сигнали** (физически носител).\n- **Възприятие** (визуална, слухова, обонятелна, тактилна, вкусова) ≠ **изразяване** (текстова, числова, звукова, графична). „Числова\" не е по възприятие!\n- **Общи изисквания** (достоверност, точност, изчерпателност, оригиналност, съдържателност) ≠ **технически изисквания** (надеждност, достъпност, навременност).\n- **Симетричен** — известен приемник; **асиметричен** — един източник, много неизвестни получатели.\n- **Котелников: f ≥ 2Fmax** (поне двойно, не половината).\n- **AND = конюнкция = умножение**; **OR = дизюнкция = събиране**; **NOT = отрицание**.\n- **bit** — най-малка единица; **Byte** — основна единица. Байт: **0…255** (256 стойности, но най-голямото е 255).\n- **Двоично K = 1024**, десетично K = 1000. 1 MB = **1 048 576** B, не 1 000 000.\n- **Обслужващото ниво = междинно**; **вътрешното = ниско**; **високото = потребителско**.\n- **Грешки в слайдовете**: мантисата е записана „1 ≥ m < 10\" — правилно е **1 ≤ m < 10**; 0.000000709 е дадено като „7.09E-8\", а правилно е **7,09E-7**; в таблицата на SI „Сета/Септо\" е изписано погрешно — правилно **Зета (Z) / Зепто (z)**; надписът „броят на цифрите е равен на основата q\" означава, че системата с основа q има q различни цифри (0…q−1).\n- Амплитудата на слайда е описана и като „разлика между екстремните стойности\", и като „максимално отклонение от равновесното положение\" — на изпит избирай „максимално отклонение… положително число\".\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L06-A-1","n":1,"text":"От коя дума произлиза терминът „информация“?","opts":["От гръцката дума morphe — форма, образ","От латинската дума formula — правило, предписание","От гръцката дума logos — слово, понятие","От латинската дума informatio — сведения, разяснения"],"correct":3,"expl":"Информация идва от лат. informatio."},{"id":"L06-A-2","n":2,"text":"Според теорията на К. Шанон информацията е:","opts":["основен компонент в системите за управление","средство за намаляване на неопределеността","означение на съдържанието на сигналите от външния свят","свойство на всички материални обекти"],"correct":1,"expl":"Шанон свързва информацията с намаляването на неопределеността."},{"id":"L06-A-3","n":3,"text":"Кой компонент на информацията представлява променяща се физическа величина, която е материален носител при пренасяне на съобщението?","opts":["Данните","Съобщението","Сигналът","Кодът"],"correct":2,"expl":"Сигналът е материалният носител на съобщението."},{"id":"L06-A-4","n":4,"text":"Аналогов сигнал има максимална честота Fmax = 4 kHz. Каква е минималната честота на дискретизиране според теоремата на Котелников?","opts":["8 kHz","2 kHz","4 kHz","16 kHz"],"correct":0,"expl":"f ≥ 2·Fmax = 2·4 = 8 kHz."},{"id":"L06-A-5","n":5,"text":"Кое от изброените НЕ е вид информация според начина на възприятие?","opts":["Визуална","Тактилна","Обонятелна","Числова"],"correct":3,"expl":"Числовата е вид според начина на изразяване."},{"id":"L06-A-6","n":6,"text":"Какво е характерно за асиметричния информационен обмен?","opts":["Приемникът е известен и конкретизиран при изпращането","Един източник и много получатели с неопределено местонахождение","Има много източници и един-единствен получател","Информацията се предава едновременно и в двете посоки по канала"],"correct":1,"expl":"При асиметричния обмен — един източник, много неопределени получатели."},{"id":"L06-A-7","n":7,"text":"Каква е стойността на записа 1111 в осмична бройна система (q = 8)?","opts":["585","1111","15","4369"],"correct":0,"expl":"1·8³ + 1·8² + 1·8 + 1 = 512 + 64 + 8 + 1 = 585."},{"id":"L06-A-8","n":8,"text":"Как се записва 0,000482 в нормализиран вид с мантиса 1 ≤ m < 10?","opts":["4,82·10⁻³","48,2·10⁻⁵","4,82·10⁻⁴","0,482·10⁻³"],"correct":2,"expl":"Запетаята се мести 4 позиции надясно → p = −4."},{"id":"L06-A-9","n":9,"text":"Кое НЕ е сред основните предпоставки за използване на двоичната система в компютрите?","opts":["Лесната техническа реализация на цифрите 0 и 1","Елементарният аритметичен апарат","По-малкият брой разреди за записване на числата","Възможността за използване на булевата алгебра"],"correct":2,"expl":"Двоичният запис всъщност изисква повече разреди от десетичния."},{"id":"L06-A-10","n":10,"text":"Колко байта и колко символа се използват в кода UNICODE?","opts":["1 байт — 256 символа","2 байта — 65 536 символа","2 байта — 32 768 символа","4 байта — 65 536 символа"],"correct":1,"expl":"UNICODE: 2 байта, 2¹⁶ = 65 536 символа."}],"B":[{"id":"L06-B-1","n":1,"text":"Кой философски подход определя информацията като свойство на всички материални обекти, заедно с енергията и веществото?","opts":["Атрибутивният","Функционалният","Кибернетичният","Вероятностният"],"correct":0,"expl":"Атрибутивният подход разглежда информацията като атрибут на материята."},{"id":"L06-B-2","n":2,"text":"Кой компонент на информацията представлява елементи във формализиран вид (букви, цифри, знаци), предназначени за обработка и пренасяне?","opts":["Съобщенията","Сигналите","Данните","Каналите"],"correct":2,"expl":"Данни — формализирани елементи на информацията."},{"id":"L06-B-3","n":3,"text":"Как се нарича аналогов сигнал, чиято графика е синусоида?","opts":["Дискретен","Цифров","Импулсен","Хармоничен"],"correct":3,"expl":"Сигнал с графика синусоида е хармоничен."},{"id":"L06-B-4","n":4,"text":"Периодът на един сигнал е T = 0,02 s. Каква е честотата му?","opts":["20 Hz","50 Hz","0,02 Hz","500 Hz"],"correct":1,"expl":"f = 1/T = 1/0,02 = 50 Hz."},{"id":"L06-B-5","n":5,"text":"Кое от изброените е техническо изискване към информацията, а не общо?","opts":["Достоверност","Навременност (актуалност)","Изчерпателност","Оригиналност (новост)"],"correct":1,"expl":"Техническите изисквания са надеждност, достъпност и навременност."},{"id":"L06-B-6","n":6,"text":"В модела на К. Шанон за пренасяне на информация какво излиза от предавателя?","opts":["Изпратено съобщение","Получено съобщение","Шум","Сигнал"],"correct":3,"expl":"Източник → съобщение → предавател → сигнал → шум → приемник."},{"id":"L06-B-7","n":7,"text":"Каква е стойността на 3B₁₆ в десетична система?","opts":["311","47","59","63"],"correct":2,"expl":"3·16 + 11 = 59."},{"id":"L06-B-8","n":8,"text":"Как се записва числото 5 600 000 в експоненциална форма по правилата на програмите?","opts":["5,6E+6","5,6E-6","56E+6","5,6E+5"],"correct":0,"expl":"5 600 000 = 5,6·10⁶ → 5,6E+6."},{"id":"L06-B-9","n":9,"text":"Кой от логическите изрази има стойност 0 (неистина)?","opts":["(3 > 2) OR (5 > 8)","NOT (5 > 8)","(2 < 3) AND (8 > 4)","(3 > 2) AND (5 > 8)"],"correct":3,"expl":"AND е истина само ако двата операнда са истина; 5 > 8 е неистина."},{"id":"L06-B-10","n":10,"text":"Какво означава единицата bps?","opts":["Байт за секунда — основната единица за скорост","Брой предадени пакети за една секунда при мрежов обмен","Бит за секунда — най-малката единица за скорост на пренасяне","Бит на символ — мярка за плътност на кодирането"],"correct":2,"expl":"bit/s = b/s = bps."}],"C":[{"id":"L06-C-1","n":1,"text":"Кой подход свързва информацията със системи, които функционират и се самоорганизират?","opts":["Атрибутивният","Функционалният","Шаноновият","Кибернетичният"],"correct":1,"expl":"Функционалният подход е противоположен на атрибутивния."},{"id":"L06-C-2","n":2,"text":"Какво е съобщението като компонент на информацията?","opts":["Информация с конкретен смисъл от източник към приемник, с фиксирани начало и край","Елементи във формализиран вид (букви, цифри, знаци), предназначени за обработка","Променлив физически процес — материален носител при пренасянето","Съвкупност от правила за заместване на знаците с други знаци"],"correct":0,"expl":"Съобщение — с конкретен смисъл, начало и край."},{"id":"L06-C-3","n":3,"text":"Как се нарича трансформацията на информацията от аналогова в цифрова?","opts":["Цифрово-аналогово преобразуване","Модулация","Аналогово-цифрово преобразуване","Нормализиране"],"correct":2,"expl":"Аналогова → цифрова е АЦП."},{"id":"L06-C-4","n":4,"text":"Каква е десетичната стойност на 1101₂?","opts":["11","26","1101","13"],"correct":3,"expl":"8 + 4 + 0 + 1 = 13."},{"id":"L06-C-5","n":5,"text":"Според кой критерий информацията се дели на текстова, числова, звукова и графична?","opts":["Според начина на възприятие","Според начина на представяне","Според предназначението","Според начина на изразяване"],"correct":3,"expl":"Текстова, числова, звукова, графична — по начин на изразяване."},{"id":"L06-C-6","n":6,"text":"Как се нарича още обслужващото ниво на представяне на информацията в компютрите?","opts":["Междинно","Вътрешно","Потребителско","Ниско"],"correct":0,"expl":"Обслужващо = междинно; вътрешно = ниско; високо = потребителско."},{"id":"L06-C-7","n":7,"text":"На коя дробна представка съответства множителят 10⁻⁹?","opts":["Микро (μ)","Нано (n)","Пико (p)","Мили (m)"],"correct":1,"expl":"10⁻³ мили, 10⁻⁶ микро, 10⁻⁹ нано, 10⁻¹² пико."},{"id":"L06-C-8","n":8,"text":"Как се записва десетичното число 150 в двоична система (8 бита)?","opts":["10010101","01101001","10010110","10100110"],"correct":2,"expl":"150 = 128 + 16 + 4 + 2."},{"id":"L06-C-9","n":9,"text":"Колко байта е 1 MB според двоичните множители?","opts":["1 048 576","1 000 000","1 024","1 073 741 824"],"correct":0,"expl":"1 MB = 2²⁰ = 1 048 576 байта."},{"id":"L06-C-10","n":10,"text":"Как се нарича още логическата функция „И“ (AND)?","opts":["Дизюнкция — логическо събиране","Конюнкция — логическо умножение","Отрицание — инверсия","Дизюнкция — логическо умножение"],"correct":1,"expl":"AND = конюнкция = логическо умножение."}],"D":[{"id":"L06-D-1","n":1,"text":"Как се разглежда информацията според основите на кибернетиката?","opts":["Като средство за намаляване на неопределеността","Като основен компонент в системите за управление","Като атрибут на материята","Като съдържание на сигналите при приспособяване"],"correct":1,"expl":"Кибернетиката — основен компонент в управлението."},{"id":"L06-D-2","n":2,"text":"Каква информация се нарича цифрова?","opts":["Информация, представена като непрекъсната функция на времето","Информация, представена само с десетични цифри","Информация, получавана от термометри, везни и микрофони","Дискретна информация, при която значенията се представят с цифрите 1 и 0"],"correct":3,"expl":"Цифрова = дискретна, с двете цифри 0 и 1."},{"id":"L06-D-3","n":3,"text":"Как се определя честотата f на периодичен сигнал чрез периода T?","opts":["f = 1/T","f = 2·T","f = T/2","f = T²"],"correct":0,"expl":"Честотата е реципрочна стойност на периода."},{"id":"L06-D-4","n":4,"text":"Какво се получава, ако двоичното число 0101 се измести с един разред наляво?","opts":["0010 — числото е разделено на 2","1010 — числото е разделено на 2","1010 — числото е умножено по 2","0110 — числото е увеличено с 1"],"correct":2,"expl":"Изместване наляво = умножение по 2 (5 → 10)."},{"id":"L06-D-5","n":5,"text":"Кое НЕ е общ критерий за класификация на информацията?","opts":["Според начина на представяне","Според начина на възприятие","Според скоростта на пренасяне","Според предназначението"],"correct":2,"expl":"Критериите са: представяне, възприятие, изразяване, предназначение."},{"id":"L06-D-6","n":6,"text":"Какво е характерно за симетричния информационен обмен?","opts":["Приемникът е известен и конкретизиран","Източникът е един, а получателите са много","Получателите са с неопределено местонахождение","Информацията се изпраща без конкретен адресат"],"correct":0,"expl":"Симетричен обмен — известен, конкретен приемник."},{"id":"L06-D-7","n":7,"text":"В записа 4,23·10⁺²⁷ коя е стойността на порядъка p?","opts":["4,23","10","423","27"],"correct":3,"expl":"В A = m·q^p: m = 4,23; q = 10; p = 27."},{"id":"L06-D-8","n":8,"text":"На какъв множител съответства представката „Пета“ (P)?","opts":["10¹²","10¹⁵","10¹⁸","10⁹"],"correct":1,"expl":"Тера — 10¹², Пета — 10¹⁵, Екса — 10¹⁸."},{"id":"L06-D-9","n":9,"text":"Какъв е кодът в UNICODE (шестнадесетично) на кирилската буква „а“ според примера в лекцията?","opts":["0430","0061","61","0410"],"correct":0,"expl":"Латинско a = 0061, кирилско а = 0430."},{"id":"L06-D-10","n":10,"text":"В какъв интервал са десетичните стойности, които могат да се запишат в един байт?","opts":["0 ÷ 256","1 ÷ 256","−128 ÷ 128","0 ÷ 255"],"correct":3,"expl":"От 00000000 = 0 до 11111111 = 255."}],"E":[{"id":"L06-E-1","n":1,"text":"Кой автор определя информацията като означение на съдържанието на сигналите, получавани от външния свят в процеса на приспособяването на човека към него?","opts":["К. Шанон","В. Котелников","Н. Винер","Дж. Бул"],"correct":2,"expl":"Това е определението на Норберт Винер."},{"id":"L06-E-2","n":2,"text":"Кой от примерите е източник на аналогова информация?","opts":["Микрофон, отчитащ налягането на звука","Последователност от битове в паметта","Код на символ в ASCII таблицата","Стойност на логическа променлива"],"correct":0,"expl":"Микрофони, термометри, везни дават аналогови сигнали."},{"id":"L06-E-3","n":3,"text":"Какво представлява амплитудата A на аналоговия сигнал?","opts":["Времето за извършване на един пълен цикъл на периодичното явление","Максималното отклонение от равновесното положение — положително число","Броят на повторенията на сигнала за единица време (в херци)","Минималната честота на дискретизиране"],"correct":1,"expl":"Амплитудата е максимално отклонение; периодът е времето за цикъл."},{"id":"L06-E-4","n":4,"text":"Колко байта са 4 KB според двоичните множители?","opts":["4000","32 768","4 194 304","4096"],"correct":3,"expl":"4 · 2¹⁰ = 4 · 1024 = 4096 байта."},{"id":"L06-E-5","n":5,"text":"Как се определя ценността като обща характеристика на информацията?","opts":["Чрез значимостта и полезността на информационния поток","Чрез смисъла и стойността на информационния поток","Чрез скоростта на пренасяне","Чрез броя на равновероятните резултати"],"correct":0,"expl":"Ценност — значимост и полезност; съдържание — смисъл и стойност."},{"id":"L06-E-6","n":6,"text":"С какво се свързва количеството информация като техническа характеристика?","opts":["С потока информация, предаван за единица време","Със значимостта на информационния поток","Със събитие, което има само два равновероятни резултата","С броя на получателите при асиметричния обмен"],"correct":2,"expl":"Напр. включено/изключено, тъмно/светло."},{"id":"L06-E-7","n":7,"text":"Кое е вярното условие за стойностите на цифрите a в позиционна бройна система с основа q?","opts":["1 ≤ a ≤ q","0 ≤ a ≤ q − 1","0 ≤ a ≤ q","0 < a < q − 1"],"correct":1,"expl":"При q = 10 цифрите са 0…9, при q = 2 — 0 и 1."},{"id":"L06-E-8","n":8,"text":"Как се записва правилно числото 0.000000709 в експоненциална форма по правилата на програмите?","opts":["7.09E-8","7.09E-6","70.9E-7","7.09E-7"],"correct":3,"expl":"Запетаята се мести 7 позиции → 7,09·10⁻⁷ (на слайда е отпечатано E-8)."},{"id":"L06-E-9","n":9,"text":"Кой пример от практиката илюстрира логическата функция NOT?","opts":["Комбинацията Ctrl + Alt + Del","Клавишът Caps Lock","Двата клавиша Shift с еднаква функция","Комбинацията Shift + Alt"],"correct":1,"expl":"NOT — инверсия; комбинациите са AND, дублираните клавиши — OR."},{"id":"L06-E-10","n":10,"text":"Кое е вярно за обслужващото (междинно) ниво на представяне на информацията?","opts":["С информацията не се извършват действия — служи за съкратен запис","На него се извършват всички аритметични действия","Използва десетична система с фиксирана и плаваща запетая","Използва само двоичните цифри 0 и 1, както вътрешното ниво"],"correct":0,"expl":"Шестнадесетичната система: една цифра замества 4 двоични."}]}},{"num":7,"title":"Лекция 7 — Кодиране на данните — двоичен код, цели и реални числа, символи, графика и звук","short":"Кодиране на данните — двоичен код, цели и реални числа, символи, графика и звук","summary":"### Кодиране и код\n- **Кодиране** — когато **знаците на едно съобщение се заменят с други знаци или техни съчетания**.\n- **Код** — **съответствието**, по което едните знаци се заменят с други.\n\n### Код на Морз\n- Разработен от **Семюел Морз** през **1837–1838 г.**; приспособен за различни азбуки.\n- На всяка буква, цифра или препинателен знак се съпоставят съчетания от **два вида сигнали — дълъг (тире) и къс (точка)**.\n- Първите пет български букви: **А `.-`**, **Б `-...`**, **В `.--`**, **Г `--.`**, **Д `-..`**.\n- **Недостатък**: броят на точките и тиретата за буквите **не е еднакъв**, затова между буквите е нужна **по-голяма пауза**, отколкото между елементите на една буква.\n\n### Код на Бодо\n- Предложен от френския изобретател **Жан Бодо** (слайдът казва „седемдесетте години на ХХ век\" — в действителност 1870-те, т.е. XIX век).\n- Символите получават **номера от 1 до 32**; на всеки номер се съпоставят **по пет символа от два вида (+ и −)**, изпращани **през равни интервали от време** (импулс / липса на импулс → **1 и 0**).\n- Така **кодът на Бодо въвежда двоичната бройна система**: петсимволните комбинации отговарят точно на числата **от 0 до 31**, записани с **петцифрен двоичен запис** (2⁵ = 32).\n\n### Осмичен и шестнадесетичен код\n| | Осмичен | Шестнадесетичен |\n|---|---|---|\n| Основа | **8 = 2³** | **16 = 2⁴** |\n| Цифри | **0 … 7** | **0 … 9 и A … F** |\n| Група битове | **по 3 бита** | **по 4 бита** |\n| Пример | 10₁₀ = 1010₂ = **12₈**; 110 101 111 001₂ = **6571₈** | 1001 1100 0100 1101₂ = **9C4D₁₆** |\n- И двата **позволяват по-съкратени записи на големи двоични числа**. Пример: 111 010 011₂ = **723₈**; 1011 1110₂ = **BE₁₆**.\n\n### Двоично-десетичен код (BCD)\n- Въведен за **опростяване на превръщането** на двоични числа в десетични и обратно (десетичната система остава най-удобна за човека).\n- **Всеки десетичен разряд се заменя с 4-битово двоично представяне** (4 е **най-малкият брой битове**, с които се представят цифрите 0–9).\n- Примери: **6347₁₀ = 0110 0011 0100 0111 (BCD)**; **3795₁₀ = 0011 0111 1001 0101**; 2709 = 0010 0111 0000 1001; 1001 0100 0110 (BCD) = 946.\n- Използва се за **обработка на големи масиви от данни** и **икономическа информация** — спестява времето за преобразуване от двоична в десетична форма („специална аритметика\").\n\n### Код на Грей\n- Предпазва от ситуации, при които съседните стойности са физически величини с **преходен период на установяване** (напр. **7 = 0111 → 8 = 1000** — променят се всички 4 бита).\n- **Съседните десетични стойности се кодират със съседни двоични стойности — разлика само в един бит.**\n\n| Дес. | Двоичен | Грей | Дес. | Двоичен | Грей |\n|---|---|---|---|---|---|\n| 0 | 0000 | 0000 | 8 | 1000 | 1100 |\n| 1 | 0001 | 0001 | 9 | 1001 | 1101 |\n| 2 | 0010 | 0011 | 10 | 1010 | 1111 |\n| 3 | 0011 | 0010 | 11 | 1011 | 1110 |\n| 4 | 0100 | 0110 | 12 | 1100 | 1010 |\n| 5 | 0101 | 0111 | 13 | 1101 | 1011 |\n| 6 | 0110 | 0101 | 14 | 1110 | 1001 |\n| 7 | 0111 | 0100 | 15 | 1111 | 1000 |\n\n### Предназначение на кодирането\n- **Повишаване на верността** чрез **откриване и коригиране на грешки** в отделни разреди — грешки **от затихване на сигнала** и **от завишаване на нивото на сигнала от шум**.\n- Грешките имат **случаен характер** и се измерват с **вероятност**: **q = P(1/0)** — изпратена **1**, интерпретирана като **0**; **q = P(0/1)** — изпратена **0**, интерпретирана като **1**.\n\n### Количество информация — формула на Шанон\n- **H = log₂ N**, където **H — количество информация** (в битове), **N — брой равновероятни алтернативни състояния** на обекта.\n- Примери: N = 2 → 1 бит; N = 32 → **5 бита**; N = 256 → **8 бита**; N = 50 → log₂50 ≈ 5,64 → нужни са **6 бита** (2⁶ = 64 ≥ 50).\n\n### Бит и байт\n- Информацията, съдържаща една от двете двоични цифри, е **bit (бит)**. Технически: **нулево и друго ниво на напрежение**, **затворена/отворена електрическа верига**, **намагнитен/ненамагнитен участък** — всяко устройство с **две устойчиви състояния**.\n- Битовете се групират в **байтове (B)**: **1 байт = 8 последователни бита**.\n- **1 KB = 1024 B**, **1 MB = 1024 KB**, **1 GB = 1024 MB**, TB… — вместо 1000 се ползва **2¹⁰ = 1024** заради **кратността към основата 2**; така **най-икономично се управляват апаратните ресурси** (памет).\n\n### Представяне на числова информация\n- Два основни вида: **натурални (цели)** и **реални (веществени)** числа; **трета форма — двоично-десетични** (за икономическа информация).\n- **Цели числа без знак**: в n бита има **2ⁿ комбинации** → интервал **0 ÷ 2ⁿ − 1** (нулата е една от комбинациите).\n\n| n бита | Интервал без знак |\n|---|---|\n| 8 | 0 ÷ 255 |\n| 10 | 0 ÷ 1023 |\n| 12 | 0 ÷ 4095 |\n| 16 | 0 ÷ 65 535 |\n\n- **Цели числа със знак**: въвежда се **бит за знак** — **0 = положително, 1 = отрицателно**. В 1 байт: **първият бит е за знак**, стойността е в **последните 7 бита**. Най-голямото положително число е **2⁷ − 1 = 127** (слайдът пише „2⁷ = 128\" и диапазон „−127 до 128\" — виж капаните).\n\n### Реални числа\n- Дробните двоични числа ползват **позиционна точка**; вляво — цяла част, вдясно — дробна. Цифрите след точката се умножават по **отрицателни степени на 2**: ½, ¼, ⅛, …\n- Пример: **1011.101₂ = 1·2³ + 1·2¹ + 1 + 1·½ + 1·⅛ = 8 + 2 + 1 + 0,5 + 0,125 = 11 5/8 = 11,625**. Още: 110.11₂ = 6,75.\n- **Фиксирана точка**: точно определено място на точката в полето; **точката не заема отделен бит** — условно разделяне на полето; **целите числа са частен случай** (точката е **в края** на полето); в практиката точката се фиксира **в началото** на полето (числа **по-малки от 1**).\n- **Плаваща точка**: **N = mₐ·10ᵖ** — **мантиса mₐ** и **порядък p**. Пример: **374.25 = 0.37425·10³** (mₐ = 0.37425, p = 3); **0.000453 = 0.453·10⁻³** (mₐ = 0.453, p = −3). Записът с мантиса и порядък е **нормализиран формат** (тук мантисата е от вида 0,xxx — първата цифра след точката е ненулева). Пример: 52.8 = 0.528·10².\n- В паметта: **една част от полето за мантисата, друга — за порядъка**; записват се **като цели числа**, **всяка с по един бит за знак**.\n\n### Символна и текстова информация\n- При натискане на клавиш се формира **scan code** — двоично число по **поредния номер на клавиша** (не е свързан със символа); връзката код ↔ символ се задава от **специална таблица**.\n- Текстът в паметта е **последователност от двоични числа**, неразличими от целите числа — „текст\" е **условност** (трябва предварително уточнение).\n- **ASCII** (American Standard Code for Information Interchange) — разработена от **ANSI**; смятало се, че символите **не надвишават 120** → **7 бита (2⁷ = 128)**; за подсигуряване се приемат **8 бита → 256 символа**. Това е и причината **битовете да се групират по 8 в байт**; **1 байт = 1 символ**.\n- От ASCII таблицата: интервал = **32**, „0\" = **48**, „A\" = **65**, „C\" = 67, „a\" = **97** (малките букви са с 32 по-големи от главните).\n- **Unicode**: **2 байта (16 бита) на символ** → до **65 536** символа (2¹⁶). **Старшият байт определя веригата (азбуката)**, **младшият — конкретния символ**; за всяка азбука — **по 256 символа**. Кирилицата — с **номер 204** като код на азбуката (по слайда). **Над 20 000 символа** — за **китайски и японски йероглифи**.\n\n### Логическа информация\n- **True = 1**, **False = 0**. **AND** — истина, само ако X и Y са истина; **OR** — истина, ако поне едното е истина; **NOT** — обръща стойността.\n\n### Графична информация\n| | **Растерна** | **Векторна** |\n|---|---|---|\n| Изображението е | съвкупност от **пиксели** (picture element) — **битова карта (bitmap)** | съвкупност от **геометрични елементи** (линии, окръжности, правоъгълници) |\n| В паметта | битове, описващи редовете пиксели | **координати, радиуси, ъгли** |\n| Предимства / недостатъци | **не позволява пропорционално изменение** — при увеличаване се получава **зърнитост** | **по-малка памет**, **мащабирането не е проблем**; ползва се **само за схеми, диаграми, графики**; така са построени шрифтовете |\n| Програми | **Photoshop, Photopaint, Corel Draw** | **AutoCAD, Corel Draw, Microsoft Visio** |\n- Черно-бяло: **1 бит на пиксел** (0 — бял, 1 — черен) — проста и неточна картина. Пример: 800×600 → 480 000 бита = **60 000 байта**.\n- Цветно: **RGB** (червен, зелен, син), **256 нива** за всеки цвят → **1 байт на цвят**, 3 байта на пиксел. 1280×1024 → 3 932 160 B ≈ **няколко MB** (≈ 3,75 MB); 640×480 → **921 600 B**.\n- Компресиране; формати **GIF** и **JPEG** (Joint Photographic Experts Group); палитри от **16, 32, 256 цвята**.\n\n### Звукова информация\n- **Измерва се амплитудата** на звуковата вълна през определени интервали и стойностите се записват като двоични числа.\n- Честотата на запис трябва да е **поне два пъти по-голяма от максималната звукова честота, възприемана от ухото**.\n- Цифров звук: **44 100 стойности в секунда**, **16 бита** на амплитуда (**65 536 нива**); стерео — **32 бита**.\n- 1 секунда моно: 44 100 × 2 B = **88 200 байта**; стерео: **176 400 байта**.\n- Компресия — асоциацията **MPEG** (Motion Picture Experts Group).\n\n### Капани за изпита\n- **Кодиране** = процесът на замяна; **код** = съответствието (правилото).\n- Морз — **Семюел Морз, 1837–1838**, точка/тире, **нееднаква дължина** → паузи. Бодо — **Жан Бодо**, **5 символа**, равни интервали, въвежда двоичната система, числа **0…31**.\n- Осмичен — **3 бита**, шестнадесетичен — **4 бита**, BCD — **4 бита на десетична цифра**. BCD ≠ двоичен запис (2709 в BCD е 0010 0111 0000 1001, а двоично е 101010010101).\n- Грей — съседните стойности се различават **в един бит** (не „кодът на 6 е 0110\" — това е двоичният; Грей е **0101**).\n- **P(1/0)** — изпратена 1, приета като 0.\n- Без знак в n бита: **0 ÷ 2ⁿ − 1** (не до 2ⁿ).\n- **Грешка в слайда**: „максималното цяло число със знак в 1 байт е 2⁷ = 128, диапазон −127 до 128\" — правилно е **+127 = 2⁷ − 1**, диапазон **−127 ÷ +127** (при прав код със знаков бит; при допълнителен код −128 ÷ +127).\n- **Грешка в слайда**: при превръщане в осмичен/шестнадесетичен код групите се формират реално **отдясно наляво** (от позиционната точка) — слайдът казва „отляво надясно\", което дава същото само ако броят битове е кратен на 3/4.\n- **Грешки в звуковия слайд**: „65356 нива\" → правилно **65 536**; стерео „172400 байта\" → правилно **176 400**; „1 секунда текст\" → звук.\n- Бодо: „седемдесетте години на ХХ век\" е грешка — **1870-те (XIX век)**.\n- Нормализацията в тази лекция е **0.37425·10³** (мантиса < 1), докато в лекция 6 мантисата е **1 ≤ m < 10** (7,23·10⁻³) — внимавай кой формат се пита.\n- Unicode: кирилицата е с **номер 204** по слайда, но в примера от лекция 6 кирилското „а\" е `0430` (старши байт 04) — на изпит отговаряй „204\", ако се пита по тази лекция.\n- В ASCII таблицата на слайда има печатни грешки (напр. „9\" = 67, трябва **57**); сигурни стойности: интервал 32, „0\" 48, „A\" 65, „a\" 97.\n- GIF е изписан „Graphic Interface Format\" (правилно Graphics Interchange Format). Corel Draw е посочен и при растерната, и при векторната графика.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L07-A-1","n":1,"text":"Какво е кодиране?","opts":["Съответствието, по което едни знаци се заменят с други","Замяна на знаците на едно съобщение с други знаци или техни съчетания","Намаляване на обема на информацията чрез премахване на излишъка","Превръщане на аналогов сигнал в цифров"],"correct":1,"expl":"Кодирането е процесът; кодът е съответствието."},{"id":"L07-A-2","n":2,"text":"Как се кодира буквата „Б“ в кода на Морз (по слайда)?","opts":["-...",".-","-..",".--"],"correct":0,"expl":"А .-; Б -...; В .--; Г --.; Д -.."},{"id":"L07-A-3","n":3,"text":"Колко бита информация съдържа изборът на едно от 32 равновероятни състояния (по формулата на Шанон)?","opts":["16","32","5","6"],"correct":2,"expl":"H = log₂ 32 = 5."},{"id":"L07-A-4","n":4,"text":"В какъв интервал е цяло число без знак, записано в 10 бита?","opts":["0 ÷ 1024","1 ÷ 1024","0 ÷ 999","0 ÷ 1023"],"correct":3,"expl":"0 ÷ 2¹⁰ − 1 = 0 ÷ 1023."},{"id":"L07-A-5","n":5,"text":"Какво е основното свойство на кода на Грей?","opts":["Всяка десетична цифра се заменя с 4-битова група","Всеки символ се кодира с 5 импулса през равни интервали","Групи от по 3 бита се заменят с една цифра","Съседните стойности се различават само в един бит"],"correct":3,"expl":"Код на Грей — разлика само в един бит между съседни стойности."},{"id":"L07-A-6","n":6,"text":"Как се записва десетичното число 2709 в двоично-десетичен код (BCD)?","opts":["0010 0111 0000 1001","1010 1001 0101","0010 0111 0000 1000","1001 0000 0111 0010"],"correct":0,"expl":"2 → 0010, 7 → 0111, 0 → 0000, 9 → 1001."},{"id":"L07-A-7","n":7,"text":"Кой е основният недостатък на растерната графика?","opts":["Може да се използва само за схеми, диаграми и графики","Невъзможност за пропорционално изменение (зърнитост)","Не позволява представяне на цветни изображения","Изисква съхраняване на координати, радиуси и ъгли"],"correct":1,"expl":"При увеличаване пикселите се уголемяват → зърнитост."},{"id":"L07-A-8","n":8,"text":"Защо битовете в паметта се групират по 8 и образуват байтове?","opts":["Защото 8 е основата на осмичния код","Защото Unicode използва 8 бита за всеки символ","Символите в ASCII са приети да се записват с 8 двоични цифри","Защото кодът на Бодо използва 8 символа за всяка буква"],"correct":2,"expl":"7 бита биха стигнали за ~120 символа, но се приемат 8 → 256 символа, 1 байт = 1 символ."},{"id":"L07-A-9","n":9,"text":"Звук се записва моно с 44 100 стойности в секунда и 16 бита на стойност. Колко байта заема 1 секунда запис?","opts":["88 200","44 100","705 600","176 400"],"correct":0,"expl":"44 100 × 2 байта = 88 200 B (705 600 е в битове, 176 400 — стерео)."},{"id":"L07-A-10","n":10,"text":"Какво определя старшият байт в кода на всеки символ в Unicode?","opts":["Конкретния символ в азбуката","Веригата (азбуката)","Шрифта на символа","Размера на символа"],"correct":1,"expl":"Старшият байт — азбуката; младшият — символът."}],"B":[{"id":"L07-B-1","n":1,"text":"Какво е код?","opts":["Процесът на замяна на знаците на съобщението","Съответствието, по което едни знаци се заменят с други","Последователност от импулси с еднаква дължина","Таблица с всички символи на клавиатурата"],"correct":1,"expl":"Код — съответствието; кодиране — замяната."},{"id":"L07-B-2","n":2,"text":"Кое е вярно за кода на Бодо?","opts":["На всеки символ се съпоставят съчетания от точки и тирета с различна дължина","Всеки символ се кодира с 8 бита, което позволява 256 символа","Всеки символ се кодира с 2 байта, като старшият определя азбуката","Номерата 1–32 се кодират с по пет символа от два вида (+ и −)"],"correct":3,"expl":"Бодо — 5 символа (+/−) през равни интервали от време."},{"id":"L07-B-3","n":3,"text":"Как се записва 111010011₂ в осмичен код?","opts":["723₈","467₈","327₈","653₈"],"correct":0,"expl":"111 → 7, 010 → 2, 011 → 3."},{"id":"L07-B-4","n":4,"text":"Какво означава стойност 1 в бита за знак при цели числа?","opts":["Числото е положително","Числото е нула","Числото е отрицателно","Числото е реално"],"correct":2,"expl":"0 — положително, 1 — отрицателно."},{"id":"L07-B-5","n":5,"text":"Във формата N = mₐ·10ᵖ, както в примера 374.25 = 0.37425·10³, как се записва числото 52.8?","opts":["0.528·10³","52.8·10⁰","0.528·10²","0.0528·10³"],"correct":2,"expl":"Мантиса 0.528, порядък p = 2."},{"id":"L07-B-6","n":6,"text":"Как се представя изображението при векторната графика?","opts":["Като съвкупност от геометрични елементи","Като съвкупност от пиксели, описани ред по ред","Като битова карта (bitmap) с три основни цвята","Като палитра от 16, 32 или 256 цвята"],"correct":0,"expl":"Във векторната графика се пазят координати, радиуси, ъгли."},{"id":"L07-B-7","n":7,"text":"Каква е десетичната стойност на двоичното число 1011.101?","opts":["11,5","13,625","11,375","11,625"],"correct":3,"expl":"8 + 2 + 1 + 1/2 + 1/8 = 11 5/8 = 11,625."},{"id":"L07-B-8","n":8,"text":"Колко различни символа могат да се кодират в Unicode?","opts":["256","65 536","32 768","128"],"correct":1,"expl":"2 байта = 16 бита → 2¹⁶ = 65 536."},{"id":"L07-B-9","n":9,"text":"Колко байта памет заема черно-бяло изображение 800 × 600 пиксела при 1 бит на пиксел?","opts":["60 000","480 000","1 440 000","7 500"],"correct":0,"expl":"800 · 600 = 480 000 бита / 8 = 60 000 байта."},{"id":"L07-B-10","n":10,"text":"Какво означава вероятността q = P(1/0) при предаване на информация?","opts":["Изпратена е 0, но в получателя е интерпретирана като 1","Изпратена е 1 и е приета правилно","Сигналът е затихнал напълно","Изпратена е 1, но в получателя е интерпретирана като 0"],"correct":3,"expl":"P(1/0) — изпратена 1, приета 0."}],"C":[{"id":"L07-C-1","n":1,"text":"Кой е недостатъкът на кода на Морз, посочен в лекцията?","opts":["Може да кодира само цифри, но не и букви от азбуката","Използва точно пет символа за всяка буква от азбуката","Кодовете на буквите са с различна дължина и изискват паузи","Не може да се приспособи за различни азбуки"],"correct":2,"expl":"Нееднаквата дължина на кодовете изисква паузи между буквите."},{"id":"L07-C-2","n":2,"text":"Кое е вярно за осмичния код?","opts":["Основа 8 = 2³, цифри от 0 до 7, групи по 3 бита","Основа 8, цифри от 1 до 8, групи по 3 бита","Основа 8 = 2³, цифри от 0 до 7, групи по 4 бита","Основа 16 = 2⁴, цифри 0–9 и A–F, групи по 4 бита"],"correct":0,"expl":"Осмичен: 0–7, групи по 3 бита."},{"id":"L07-C-3","n":3,"text":"Как се записва 10111110₂ в шестнадесетичен код?","opts":["EB","BE","276","190"],"correct":1,"expl":"1011 → B, 1110 → E (276 е осмичният запис, 190 — десетичният)."},{"id":"L07-C-4","n":4,"text":"Колко бита информация носи изборът на едно от 256 равновероятни състояния?","opts":["256","128","16","8"],"correct":3,"expl":"H = log₂ 256 = 8."},{"id":"L07-C-5","n":5,"text":"Каква е третата форма на числова информация в компютрите, освен целите и реалните числа?","opts":["Двоично-десетичните — за икономическа информация","Шестнадесетичните числа — за съкратен запис","Комплексните числа — за инженерни изчисления","Логическите стойности True и False"],"correct":0,"expl":"Двоично-десетичните числа се ползват за икономическа информация."},{"id":"L07-C-6","n":6,"text":"Къде е позиционната точка при целите числа, разглеждани като частен случай на запис с фиксирана точка?","opts":["В началото на полето","В средата на полето","В края на полето","В отделен бит от полето"],"correct":2,"expl":"При целите числа точката е в края; в практиката за дробни — в началото."},{"id":"L07-C-7","n":7,"text":"Колко символа се отделят за всяка азбука в Unicode?","opts":["128","256","65 536","1024"],"correct":1,"expl":"Младшият байт определя символа → 256 за азбука."},{"id":"L07-C-8","n":8,"text":"Колко байта заема цветно изображение 640 × 480 пиксела, ако за всеки от трите основни цвята (RGB) се използва по 1 байт?","opts":["307 200","2 457 600","115 200","921 600"],"correct":3,"expl":"640 · 480 · 3 = 921 600 байта."},{"id":"L07-C-9","n":9,"text":"Каква трябва да е честотата на запис на амплитудата на звуковата вълна?","opts":["Равна на максималната честота, възприемана от ухото","Поне два пъти по-голяма от максималната чуваема честота","Половината от максималната честота, възприемана от ухото","Точно 16 пъти по-голяма от честотата на звука"],"correct":1,"expl":"Основното правило — поне два пъти по-голяма честота."},{"id":"L07-C-10","n":10,"text":"Какво е scan code?","opts":["Двоично число, определящо се от поредния номер на натиснатия клавиш","Кодът на символа в ASCII таблицата, стандартизирана от ANSI","Кодът на азбуката, записан в старшия байт на символа в Unicode","Двоичният код на цвета на пиксела в растерната графика"],"correct":0,"expl":"Scan code се определя от номера на клавиша; връзката със символа е чрез таблица."}],"D":[{"id":"L07-D-1","n":1,"text":"Кой и кога разработва кода на Морз?","opts":["Жан Бодо, 1837–1838 г.","Семюел Морз, 1870–1871 г.","Франк Грей, 1937–1938 г.","Семюел Морз, 1837–1838 г."],"correct":3,"expl":"Кодът на Морз е от 1837–1838 г."},{"id":"L07-D-2","n":2,"text":"На какви числа отговарят петсимволните комбинации от 0 и 1 в кода на Бодо?","opts":["На числата от 1 до 32 в осмичен запис","На числата от 0 до 31 в петцифрен двоичен запис","На числата от 0 до 15 в четирицифрен запис","На числата от 0 до 63 в шестцифрен запис"],"correct":1,"expl":"2⁵ = 32 комбинации → 0…31."},{"id":"L07-D-3","n":3,"text":"Какъв е кодът на Грей (4 бита) на десетичното число 6?","opts":["0110","0111","0101","0100"],"correct":2,"expl":"От таблицата: 6 → 0101 (0110 е обикновеният двоичен код)."},{"id":"L07-D-4","n":4,"text":"Кое е най-голямото цяло число без знак, което може да се запише в 12 бита?","opts":["4095","4096","2047","1023"],"correct":0,"expl":"2¹² − 1 = 4095."},{"id":"L07-D-5","n":5,"text":"При 1 бит за знак и 7 бита за стойност (прав код) кое е най-голямото положително цяло число в 1 байт?","opts":["128","255","64","127"],"correct":3,"expl":"2⁷ − 1 = 127 (на слайда е отпечатано погрешно 128)."},{"id":"L07-D-6","n":6,"text":"Как се записват числата с плаваща точка в паметта?","opts":["Позиционната точка заема отделен бит в средата на полето","Мантиса и порядък в отделни части, всяка с бит за знак","Всяка десетична цифра се записва с 4 бита","Само мантисата се записва, а порядъкът винаги е нула"],"correct":1,"expl":"Мантисата и порядъкът се записват като цели числа със знак."},{"id":"L07-D-7","n":7,"text":"Кои са типични формати за растерна графика, посочени в лекцията?","opts":["GIF и JPEG","AutoCAD и Visio","MPEG и ASCII","BCD и Unicode"],"correct":0,"expl":"GIF и JPEG са растерни формати."},{"id":"L07-D-8","n":8,"text":"Кое е предимство на векторната графика?","opts":["Подходяща е за фотографски изображения с много нюанси","Всеки пиксел се описва с 3 байта","Изображението заема по-малко памет и мащабирането не е проблем","Използва битова карта на изображението"],"correct":2,"expl":"Векторната графика е компактна и лесно мащабируема."},{"id":"L07-D-9","n":9,"text":"Ако в ASCII главната буква „A“ има десетичен код 65, какъв е кодът на „C“?","opts":["99","66","67","68"],"correct":2,"expl":"A = 65, B = 66, C = 67 (99 е малкото „c“)."},{"id":"L07-D-10","n":10,"text":"Каква организация е посочена като един от най-популярните разработчици на формати за компресиране на графична и звукова информация?","opts":["ANSI (American National Standards Institute)","MPEG (Motion Picture Experts Group)","JPEG (Joint Photographic Experts Group)","ASCII"],"correct":1,"expl":"Асоциацията MPEG."}],"E":[{"id":"L07-E-1","n":1,"text":"Кое НЕ е посочено като начин за физическо представяне на един бит?","opts":["Ниво на интензивност на цвят от 0 до 255","Нулево ниво на напрежение и някакво друго ниво","Затворена или отворена електрическа верига","Намагнитен или ненамагнитен участък"],"correct":0,"expl":"За бит са нужни устройства с две устойчиви състояния."},{"id":"L07-E-2","n":2,"text":"Кой е двоичният запис на 9C4D₁₆?","opts":["1001 1100 0100 1110","1001 1010 0100 1101","1001 1100 0100 1101","1001 1100 0010 1101"],"correct":2,"expl":"9 → 1001, C → 1100, 4 → 0100, D → 1101."},{"id":"L07-E-3","n":3,"text":"Кое десетично число е записано в BCD като 1001 0100 0110?","opts":["2374","649","9416","946"],"correct":3,"expl":"1001 → 9, 0100 → 4, 0110 → 6 (2374 е стойността като обикновено двоично число)."},{"id":"L07-E-4","n":4,"text":"Защо 1 KB = 1024 B, а не 1000 B?","opts":["Защото 1024 е стандартният SI множител
