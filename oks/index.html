тролер","слотовете PCI Express x16 и контролера на видеокартата"],"correct":2,"expl":"ICH6R (под радиатор) съдържа входно-изходните системи, USB 2.0 и RAID."},{"id":"L02-C-9","n":9,"text":"В архитектурата със северен и южен мост кои контролери се намират в южния мост?","opts":["EIDE, сериен и USB контролери","системна и кеш памет, PCI и AGP","контролер на паметта и AGP","регистър на инструкциите и брояч на програми"],"correct":0,"expl":"Южният мост съдържа по-малко елементи — EIDE, сериен и USB; паметта, PCI и AGP са в северния."},{"id":"L02-C-10","n":10,"text":"Към кой вид интерфейсна съвместимост спада изискването за протокол на интерфейса, реализиран чрез управляващ автомат?","opts":["електрическа","конструктивна","програмна","информационна"],"correct":3,"expl":"Логическите условия (структура, протокол, кодиране, времеви параметри) определят информационната съвместимост."}],"D":[{"id":"L02-D-1","n":1,"text":"Кое НЕ е функция на микропроцесора?","opts":["извършване на аритметични и логически операции","дешифриране на програмните инструкции, намиращи се в паметта","съхраняване на програмите след изключване на захранването","прехвърляне на данни между различните устройства"],"correct":2,"expl":"Съхранението след изключване е функция на външната памет (и ROM), не на процесора."},{"id":"L02-D-2","n":2,"text":"Какво е характерно за Харвардската архитектура?","opts":["физически отделно съхранение и сигнални пътища за инструкции и данни","обща шина за извличане на инструкции и данни","задължително еднакви характеристики на паметта за инструкции и за данни","множество процесори, свързани във вид на матрица"],"correct":0,"expl":"При Харвард паметите и пътищата са отделни и не е необходимо паметите да са еднакви."},{"id":"L02-D-3","n":3,"text":"Колко входа за четене и за запис трябва да има всеки векторен регистър?","opts":["един вход за четене и два входа за запис","два входа за четене и два входа за запис","един вход за четене и един вход за запис","два входа за четене и един вход за запис"],"correct":3,"expl":"Векторните регистри имат по два входа за четене и един за запис."},{"id":"L02-D-4","n":4,"text":"Какви са размерите на CD-ROM диска?","opts":["дебелина 0.6 мм и диаметър 120 мм","дебелина 1.2 мм и диаметър 90 мм","дебелина 1.2 мм и диаметър 120 мм","дебелина 2.1 мм и диаметър 133 мм"],"correct":2,"expl":"CD-ROM е с дебелина 1.2 мм и диаметър 120 мм."},{"id":"L02-D-5","n":5,"text":"Откъде микропроцесорът изпълнява програма, стартирана от твърдия диск?","opts":["директно от твърдия диск, без да я зарежда","от ROM паметта, където е записан BIOS","от регистрите на схемния набор (чипсета)","от RAM паметта, в която програмата се прехвърля"],"correct":3,"expl":"При стартиране програмата се прехвърля от диска в RAM и CPU я изпълнява оттам."},{"id":"L02-D-6","n":6,"text":"За какво се използва шината за управление?","opts":["за предаване към паметта и устройствата на адресите, формирани от микропроцесора","за пренасяне на данните между паметта, процесора и периферните устройства","за пренасяне на управляващи сигнали и информация за състоянието на устройствата","за захранване на процесора и чипсета"],"correct":2,"expl":"Шината за управление носи управляващите сигнали и информацията за състоянието."},{"id":"L02-D-7","n":7,"text":"Какво означава, че слотовете за оперативна памет на примерната дънна платка са оцветени по двойки в различни цветове?","opts":["в различно оцветените слотове се поставят съответно модули DDR и DDR2","единият цвят е за модули оперативна памет, а другият — за модули кеш памет от второ ниво","цветът показва максималната тактова честота на модула, който може да се постави в слота","платката работи с памет в двуканален режим и в еднаквите по цвят слотове се слагат еднакви модули"],"correct":3,"expl":"Двойките цветове означават двуканален режим — еднакви по тип и обем модули в слотовете с един цвят."},{"id":"L02-D-8","n":8,"text":"Кое твърдение за GMCH в Intel Hub Architecture е вярно?","opts":["действа като контролер на паметта и AGP, но не поддържа PCI контролер","е PCI контролер и обслужва USB и серийните портове","комуникира с процесора през шина с пропускателна способност 233 MBps","съдържа EIDE, сериен и USB контролери"],"correct":0,"expl":"GMCH (подобно на северния мост) — памет и AGP, без PCI; PCI контролер е ICH."},{"id":"L02-D-9","n":9,"text":"Типът на съединителните елементи и конструкцията на печатната платка и кабелното съединение се определят от условията за:","opts":["електрическа съвместимост","конструктивна съвместимост","информационна съвместимост","апаратна съвместимост"],"correct":1,"expl":"Конструктивната съвместимост осигурява механичния контакт и подмяната на блоковете."},{"id":"L02-D-10","n":10,"text":"Коя техническа характеристика на интерфейса означава максималния брой абонати, включени едновременно към контролера без разширители?","opts":["пропускателна способност","вместимост","разрядност","топология на съединението"],"correct":1,"expl":"Вместимост — максимален брой абонати без разширители."}],"E":[{"id":"L02-E-1","n":1,"text":"Кое твърдение за Харвардската архитектура е вярно?","opts":["инструкциите може да са в памет само за четене, а данните — в памет за четене и запис","паметта за инструкции и паметта за данни трябва да имат еднаква дължина на думата","инструкциите и данните се пренасят по една обща шина","данните се съхраняват в ROM, а инструкциите — в памет за четене и запис"],"correct":0,"expl":"При Харвард паметите може да се различават по дължина на думата, технология и адресна структура."},{"id":"L02-E-2","n":2,"text":"За какво служат функционалното устройство MASK и регистърът на маската във векторния процесор?","opts":["за прехвърляне на векторни думи между векторните регистри и оперативната памет","за стартиране на нова векторна операция на всеки такт в конвейерен режим","за преобразуване на скаларния код във векторен","за обработка на двоичен вектор на маската при адресация на разредени матрици"],"correct":3,"expl":"MASK обработва двоичен вектор на маската за разредени матрици; прехвърлянето е от LOAD/STORE."},{"id":"L02-E-3","n":3,"text":"От какъв материал е изработен CD-ROM дискът?","opts":["метален диск със специално магнитно покритие и защитен лаков слой","прозрачен поликарбонат с тънък отражателен метален слой и защитен лак","гъвкав пластмасов диск с магнитен слой в защитна обвивка","силициева пластина с медни проводници и отражателен слой"],"correct":1,"expl":"CD: поликарбонат + отражателен слой (алуминий, по-рядко злато) + лак; магнитното покритие е при твърдите дискове."},{"id":"L02-E-4","n":4,"text":"Кой контролер е нужен за свързване на тон-колони, слушалки и микрофон към компютъра?","opts":["звукова карта","видео карта","мрежова карта","южен мост"],"correct":0,"expl":"Монитор → видео карта, LAN кабел → мрежова карта, тон-колони/слушалки/микрофон → звукова карта."},{"id":"L02-E-5","n":5,"text":"Каква е теоретичната пропускателна скорост на слота PCI Express x16 на примерната дънна платка и за какво служи той?","opts":["до 250 MB/s, за видеокарта","до 4000 MB/s, за мрежова карта","до 4000 MB/s, за видеокарта","до 233 MB/s, за звукова карта"],"correct":2,"expl":"PCI Express x16 (черният слот) — до 4000 MB/s за видеокарта; PCI Express x1 — до 250 MB/s."},{"id":"L02-E-6","n":6,"text":"Как се разшифрова SATA?","opts":["Serial Advanced Technology Adapter","System ATA Architecture","Serial AT Attachment","Standard AT Array"],"correct":2,"expl":"SATA — Serial AT Attachment; към тези куплунги се включват твърдите дискове."},{"id":"L02-E-7","n":7,"text":"С каква пропускателна способност е шината между ICH и GMCH в Intel Hub Architecture?","opts":["233 MBps — два пъти по-голяма от обикновената връзка между южен и северен мост","133 MBps — колкото обикновената връзка между южния и северния мост","250 MBps — колкото пропускателната способност на един слот PCI Express x1","466 MBps — четири пъти по-голяма от обикновената връзка между мостовете"],"correct":0,"expl":"ICH комуникира с GMCH през 233 MBps шина — двойно по-широка лента."},{"id":"L02-E-8","n":8,"text":"Колко бита предава паралелно LPT портът?","opts":["16 бита","32 бита","1 бит","8 бита"],"correct":3,"expl":"LPT — 8 бита, ATA — 16, SCSI — 8 или 16, PCI — 32 или 64."},{"id":"L02-E-9","n":9,"text":"При кой вид интерфейси данните се „опаковат“ със система от сигнали (модулиране) и се предават на големи блокове от няколко хиляди бита?","opts":["асинхронни","радиални","паралелни","синхронни"],"correct":3,"expl":"Синхронните интерфейси опаковат битовете (модулиране) и предават големи блокове."},{"id":"L02-E-10","n":10,"text":"Как се нарича режимът с двупосочно, редуващо се предаване по една обща връзка?","opts":["симплекс (Simplex)","полудуплекс (Half Duplex)","пълен дуплекс (Full Duplex)","мултиплекс (Multiplex)"],"correct":1,"expl":"Симплекс — еднопосочно; полудуплекс — двупосочно редуващо се; пълен дуплекс — двупосочно едновременно."}]}},{"num":3,"title":"Лекция 3 — Интегрални схеми: същност, технологии, класификация, характеристики","short":"Интегрални схеми: същност, технологии, класификация, характеристики","summary":"### Интегрална схема (ИС) — същност\n- **Интегрална схема** — **функционален възел**, при който **всички схемни елементи** (транзистори, диоди, съпротивления, свързващи проводници и др.) се изработват в **общ технологичен процес** върху **един силициев кристал (чип)**. Цялата схема се разглежда като **един неделим компонент**. Използват се още понятията **микрочип** или **чип**.\n- В основата на цифровата техника са **цифровите ИС**, по-конкретно **логическите ИС**.\n- Чипът се монтира в **керамичен или пластмасов контейнер**; връзките са **заварени от чипа към външните щифтове**.\n- Всяка ИС има **буквено-цифрово обозначение** за идентификация, отпечатано върху корпуса. Всеки доставчик публикува **таблици с данни (каталог)** — обикновено на уебсайта си.\n- ИС са **микроелектронни елементи**: **миниатюрни размери и тегло**, **малки изисквания за мощност**, **ниска цена**, **повишена надеждност** и **значителна сложност**. Позволяват **цяла система в един чип** с **десетки милиони транзистори**.\n- Пример за схема с ИС в лекцията: **таймер NE555N** (захранване от батерия, бутон, резистори, кондензатори, диоди, заземяване).\n\n### Елементи на интегрална схема\n| Елемент | Описание | Означение |\n|---|---|---|\n| **Транзистор** | усилва, променя посоката и преобразува електрическите сигнали | **Q/T** |\n| **Кондензатор** | временно съхранява електрически заряд чрез енергията на електричното поле | **C** |\n| **Резистор** | постоянна стойност на съпротивлението; **ограничава потока електрони** | **R** |\n| **Диод** | **„вентил“ за ток** — ток само в една посока | **D** (светодиод — **LED**, Light-emitting diode) |\n| **Индуктивен елемент** | бобина (намотка) от проводник; **противопоставя се на измененията на тока** | **L** (Inductor) |\n\n### Приложение и значение\n- Съвременната електроника започва с **откриването на транзистора през 1947 г.** и разработването на **ИС в началото на 60-те години на XX век**.\n- Благодарение на ИС: компютри, ИТ, телекомуникации, космическо и авио оборудване, автомобилна и медицинска електроника, навигация, аудио/видео и др.\n\n### Класификация според технологията на производство\n| Тип | Подтипове | Особеност |\n|---|---|---|\n| **Монолитни** | **MOS** (NMOS, PMOS, **CMOS**), **биполярни**, **смесени** | всички елементи в обема на **обща полупроводникова подложка** |\n| **Слойни** | **тънкослойни**, **дебелослойни** | слой проводящ/непроводящ материал върху **изолационна подложка**; **само пасивни елементи** |\n| **Хибридни** | — | слойни пасивни елементи + ИС и **дискретни компоненти** върху изолационна подложка |\n\n- **Смесените** монолитни ИС съдържат **и двата типа транзистори** (MOS и биполярни). Монолитните ИС, макар и с милиони транзистори, са с размери **няколко милиметра**.\n\n### Монолитни ИС — MOS, биполярни, CMOS\n- **MOS = Metal-Oxide-Semiconductor** — **полеви транзистор** със структура **метал–окис–полупроводник**; **много високо входно съпротивление: 10¹² до 10¹⁴ Ω**. Изводи: **Source (сорс), Gate (гейт), Drain (дрейн)**.\n- MOS и биполярният транзистор се различават **по действие и свойства** и по **входни и изходни съпротивления**, въпреки близките градивни елементи и технологии.\n- **Биполярен транзистор (BJT — Bipolar Junction Transistor)** — изводи **емитер, база, колектор**; **три различно легирани области** и **два pn-прехода**; всяка област има **омичен контакт**. Типове **npn** и **pnp** според реда на областите.\n- Основно се използват **npn** транзистори — основните носители са **по-бързите електрони** → по-бързодействащи и по-високочестотни.\n- **CMOS = Complementary Metal Oxide Semiconductor** — полеви транзистори с **изолиран гейт** и **канали с различна проводимост**; има **и n-, и p-канални** транзистори (за разлика от NMOS и PMOS).\n- **Отличителна черта на CMOS** спрямо биполярните: **ниско потребление на енергия в статичен режим**; по лекцията — по-високо бързодействие и по-ниско потребление. Примери на слайда: **CMOS инвертор**, **CMOS схема NAND**.\n\n### Слойни и хибридни ИС\n- **Слойни ИС** — делят се според **дебелината на слоя**; използват се **само за пасивни елементи** (резистори, кондензатори).\n- **Тънкослойни** — върху малка подложка от **стъкло или керамика**; елементи: резистори, кондензатори и бобини с малка индуктивност; **дебелина до 5 μm**.\n- **Дебелослойни** — **дебелина 100 μm**, интеграция **до 50 елемента** на подложка; изработват се **без вакуум** → **по-евтини**.\n- **Хибридни ИС** — **първо** се изработват резисторите и кондензаторите и металните подложки, **след това** към тях се **запояват диодите и транзисторите**, изработени по друга технология.\n\n### Характеристики на ИС\n**Степен на интеграция** (брой електрически елементи в една ИС):\n\n| Степен | Абревиатура | Брой елементи (по лекцията) | Примери |\n|---|---|---|---|\n| Малка | **SSI** — Small-scale integrated | **до 30** | — |\n| Средна | **MSI** — Medium-scale integrated | **до 150** | елементарни функции, напр. **събиране на четири бита** |\n| Голяма | **LSI** — Large-scale integrated | **до 1000** | **малки процесори, малки памети, програмируеми модули** |\n| Свръхголяма | **VLSI** — Very-large-scale integrated | **над 1000** | **сложни микропроцесори**, чипове за **цифрова обработка на сигнали** |\n\n- VLSI правят **революция** в дизайна на цифровите системи — малки транзистори, висока плътност, ниска цена.\n- **Функционални възможности** — зависят от изпълняваните операции и от **коефициентите на разклонение и обединение**.\n  - **Коефициент на разклонение по изход N** (коефициент на натоварване по 1) — **броят единични входове на следващата схема**, които могат да се управляват от изхода на дадената.\n  - **Коефициент на обединение по вход M** — **броят единични изходи на предходната схема**, които могат да се включат към входа на един елемент.\n- **Товароспособност** — определя се от **тока между ИС и външните вериги (товари)**; оценява се количествено с **N**; обикновено **N = 10**, срещат се и **N = 30**.\n- **Бързодействие** — определя се от **времето на превключване 0→1 и обратно**: **бавнодействащи (до 100 ns)**, **среднодействащи (до 10 ns)**, **бързодействащи (до 2 ns)**.\n- **Шумоустойчивост** — **статична** (шумът е **продължително действащо ниво на напрежение**) и **импулсна** (шумът е **импулс с определена продължителност и амплитуда**). Статичната шумоустойчивост е **максималната допустима стойност на напрежението на статичния шум** в една от външните вериги, без да се наруши работоспособността.\n- **Консумирана мощност** — зависи от **логическото състояние**; за ориентировъчни изчисления се взема **средната мощност P_ср = полусума от мощностите в двете логически състояния**.\n\n### Линейни и цифрови ИС (според предназначението)\n- **Линейни (аналогови)** — аудио усилватели, регулатори на напрежение, **операционни усилватели**; сигналът е **непрекъснат във времето**.\n- **Цифрови** — сигналите имат **две нива**; компютри, мрежи, калкулатори, цифрови часовници.\n\n### История на развитието на ИС\n| Година | Събитие | Хора / фирма |\n|---|---|---|\n| **1947** | първи **Ge транзистор с точков контакт** | **Bell Labs** — **Бардийн, Братейн, Шокли** (**Нобелова награда 1956**) |\n| **1954** | първи **силициев** транзистор | **Гордън Тийл**, **Texas Instruments** |\n| **1958** | първа **хибридна Ge ИС** — **1 транзистор + 4 други елемента** на 1 чип | **Джак Килби**, Texas Instruments (**Нобелова награда 2000**) |\n| **1959** | първи **MOS транзистор** | Bell Labs — **Давон Канг, Мохамед Атала** |\n| **1959** | **планарен процес** | Fairchild — **Jean Hoerni** и **Robert Noyce** |\n| **1959** | първа **комерсиална монолитна Si ИС** с планарен процес — **1-битова памет, 4 транзистора и 5 резистора**; **начало на SSI** | Fairchild |\n| **1964 / 1965** | първа **линейна ИС** — операционни усилватели **µA 702** (1964) и **µA 709** (1965) | **Роберт Видлар**, Fairchild |\n| **1970** | първи полупроводникови памети: **Intel DRAM 1024 бита**; **Fairchild 4100 SRAM 256 бита** | Intel, Fairchild |\n| **1971** | **Intel 1702** — първата **EPROM** | Intel |\n| **1971** | **Intel 4004** — **4-битов** микропроцесор, „първият компютър върху 1 чип“: **2300 транзистора, 1 MHz, MOS** | **Федерико Фадин** |\n| **1975** | **AMD 2901 Bit-Slice** микропроцесор — **начало на MSI** | Advanced Micro Devices |\n| **1979** | **Motorola 68000**, 16-битов — **начало на LSI** | Motorola |\n| **1981** | **HP Focus Chip**, 32-битов, **450 000 транзистора** — **начало на VLSI** | Hewlett-Packard |\n| **2000** | **Intel Pentium 4** („64-bit proc“ по слайда) | Intel |\n\n### Закон на Мур\n- **Гордън Мур (Intel)**: броят на транзисторите в ИС се **удвоява приблизително на 2 години (1,96)**; илюстриран с **еволюцията на микропроцесорите на Intel** (4004 → 8080 → 8086 → 80286 → 386 → 486 → Pentium).\n- Смятало се е, че законът за CMOS ще приключи **под 100 nm** — разсейваната мощност (W/cm²) би надхвърлила тази на **ракетна дюза**.\n- Решение: **FinFET** — **3-D структура** на транзистор; каналът се **издига над повърхността** и **гейтът го обвива от три страни** → по-голям контрол върху тока. Изобретател: **Chenming Hu, Berkeley University**. Благодарение на FinFET законът не приключва при **25 nm**.\n\n### Представяне и проектиране на ИС\n- **Три нива на абстракция**: **поведенческо** (функционирането на схемата), **структурно** (архитектурата, осигуряваща желаните свойства), **физическо** (материалната реализация **на ниво топология**). На един поведенчески модел могат да съответстват **различни структурни схеми**.\n- **Диаграма на Гайски (Y-диаграма)** — три оси: **Поведение**, **Структура**, **Физика**. Проектиране **„от горе на долу“ (top-down)** — от най-високото **поведенческо** до най-ниското **физическо** ниво през **структурните** нива. Валидно и за **програмни системи**.\n  - Ос „Структура“: система, архитектура, логика, електрическа схема; ос „Поведение“: система, ниво инструкции, микроинструкции, фази; ос „Физика“: общ план, символична топология, геометрична топология.\n- **Процес на пълно производство**: **проектиране → изготвяне на фотошаблони → производство → тестване**.\n- **Етапи при проектиране**: техническо задание → структурно (системно) → функционално-логическо → схемотехническо → топологично → **верификация на проекта** → проектиране на фотошаблони → документиране.\n- Успехът на проекта зависи от **квалификацията на проектанта** и от **системата за автоматизирано проектиране**; големите фирми ползват **собствено разработен софтуер**.\n- Софтуер за проектиране: **LTspice, NGSPICE, OrCAD PSpice, Agilent Advanced Design System, Cadence**.\n- **VHDL = VHSIC Hardware Description Language** — език **от високо ниво** за описание и проектиране на системи; поддържа различна степен на абстракция. Етапи:\n  1. **йерархична блокова схема** на проекта;\n  2. **програмиране** на отделните модули;\n  3. **компилация**;\n  4. **синтез** — визуализиране на VHDL кода чрез **примитиви / елементарни логически елементи**;\n  5. **разполагане и трасиране**;\n  6. **времеви анализ** — реалните закъснения на сигналите.\n\n### Производство на MOS ИС — планарен процес\n- Монолитните ИС се изграждат **на слоеве върху силициева пластина**; **стотици ИС едновременно**; всичко в **„чисти стаи“** (ниско ниво на прах и примеси).\n- **Планарен процес** — слоевете се създават **последователно в определена плоскост**; показан с производството на **един MOS транзистор**.\n- Последователност: **окисление → фотолитография → ецване → формиране на гейта → легиране → контакти → метализация → тестване → сглобяване**.\n  - **Окисление** — подложка от **p-силиций** се покрива със **SiO₂** при **висока температура в чист кислород**; изолационният слой пази повърхността.\n  - **Фотолитография** — нанася се **фоторезист**; за всяко изображение — **маска**; облъчване с **UV** променя разтворимостта.\n  - **Ецване** — разтворимият фоторезист се отстранява с **флуороводородна киселина**; отваря се **прозорец** към силиция с форма според маската.\n  - **Формиране на гейта** — окисление, **полисилиций**, фоторезист, **втора маска**, UV, ецване → два прозореца; останалият **полисилиций е гейтът**.\n  - **Легиране** — **фосфор → N-проводимост**, **бор → P-проводимост**; атомите се йонизират, ускоряват и **имплантират**; създават се **дрейн и сорс**.\n  - **Контакти** — контактни отвори към сорс, гейт и дрейн.\n  - **Метализация** — отлагат се атоми на **алуминий**; формират се метални площадки.\n  - **Тестване** — компютърно контролирано оборудване, чисти стаи, персонал в „костюми на астронавти“.\n  - **Сглобяване** — пластината се нарязва с **диамантени резци**; ИС се монтира в **метален, пластмасов или керамичен корпус**; чипът се свързва със **златни проводници**, притиснати към площадките — **бондиране**.\n- **Корпусите** изолират ИС от околната среда и улесняват монтажа.\n\n### Производство на биполярни ИС\n- **Повече операции** от MOS ИС.\n- **Епитаксия** — p-подложка в пещ, газ от силициеви атоми и **донорни примеси (P или As)** → нараства **тънък монокристален (епитаксиален) слой**; после окисление (SiO₂).\n- **Формиране на островче** — ецва се част от SiO₂, **дифузия на акцепторни примеси (B или Ga)** → **n-тип островче**.\n- **База** — прозорец в n-епитаксиалния слой, дифузия на **акцепторни** примеси. **Емитер** — прозорец в **p-базата**, дифузия на **донорни** примеси → **n-област**. Изводите — чрез **метализация**.\n- **Пасивни компоненти** — формират се едновременно; процесът е оптимизиран за транзисторите → **ограничения** за стойностите им. Големи R, C, L заемат много площ → **обикновено не се интегрират**.\n- **Изолация с pn-преход** — **обратно включен pn-преход**; подложката се свързва към **най-отрицателното напрежение**; през обеднения слой не тече ток.\n\n### Сравнение биполярни ↔ MOS ИС\n| | Биполярни | MOS |\n|---|---|---|\n| Брой операции | повече | **по-малко** |\n| Изолация | **изисква се за всеки елемент** | **самоизолират се** от подложката |\n| Степен на интеграция | по-ниска | **много по-висока** |\n| Пасивни елементи | голяма площ | малка площ: **MOS транзистор (с вграден канал) като резистор**, **гейтовият капацитет като кондензатор** |\n- Затова **всички съвременни VLSI ИС използват MOS технология**.\n\n### Капани за изпита\n- **Монолитни ≠ слойни ≠ хибридни**: слойните правят **само пасивни** елементи; хибридните = слойни пасивни + **запоени** дискретни транзистори/диоди.\n- **Тънкослойни — до 5 μm**; **дебелослойни — 100 μm, до 50 елемента, без вакуум, по-евтини**. Не ги разменяй.\n- **N (разклонение по изход)** — входове на **следващата** схема; **M (обединение по вход)** — изходи на **предходната** схема. Типично **N = 10** (понякога 30).\n- **Бързодействие**: бързи **до 2 ns**, средни **до 10 ns**, бавни **до 100 ns** — по-малкото време = по-бърза схема.\n- Границите **SSI 30 / MSI 150 / LSI 1000 / VLSI >1000** са **по лекцията** (в литературата често се дават в логически елементи и с други числа) — на изпита ползвай тези.\n- **Килби (1958, TI, хибридна Ge ИС, Нобел 2000)** ≠ **Нойс (1959, Fairchild, планарен процес, монолитна Si ИС)**. **Тийл** — първи **силициев** транзистор (1954), не първа ИС.\n- **Транзисторът — 1947** (Нобел **1956**); **MOS транзистор — 1959** (Канг и Атала) — не го бъркай с 1947.\n- Началото на технологиите: **SSI — Fairchild 1959**, **MSI — AMD 2901 (1975)**, **LSI — Motorola 68000 (1979)**, **VLSI — HP Focus (1981)**.\n- **Intel 4004**: **4-битов**, **2300** транзистора, **1 MHz**, **1971**, **Фадин**. **Intel 1702** е **EPROM**, не процесор.\n- **Видлар** — първа **линейна** ИС (операционен усилвател µA 702/709), не микропроцесор.\n- Закон на Мур — **удвояване на ~2 години (1,96)**, не на 18 месеца (по лекцията).\n- **FinFET** — гейтът обвива канала **от три страни**; автор **Chenming Hu (Berkeley)**.\n- Легиране: **фосфор → N**, **бор → P**; при биполярните: донори **P или As**, акцептори **B или Ga**. Метализация — **алуминий**; бондиране — **злато**.\n- **Слайдът казва**, че фоторезистът се отстранява с **флуороводородна киселина** — в действителност HF ецва **SiO₂** в отворения прозорец; фоторезистът е маската. Също „фоторезистът се **поляризира**“ — по-точно се **полимеризира**/променя разтворимостта си.\n- Слайдът пише „Fairchild **Electronics**“ — фирмата е **Fairchild Semiconductor**. Слайдът за Pentium 4 пише „64-bit proc“ — Pentium 4 по принцип е 32-битов (x86-64 добавен по-късно); на изпита следвай слайда.\n- Изолацията в биполярните ИС — **обратно** (не право) включен pn-преход, подложката към **най-отрицателното** напрежение.\n- MOS ИС: **по-малко** операции, **самоизолация**, **по-голяма** интеграция; биполярните — обратното.\n- CMOS — **ниско статично потребление** (не високо входно съпротивление — това е общо за MOS: **10¹²–10¹⁴ Ω**).\n- Нива на абстракция: **поведенческо → структурно → физическо** (top-down); **физическото = топология**.\n- VHDL: **4-ти етап = синтез**, **5-ти = разполагане и трасиране**, **6-ти = времеви анализ**.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L03-A-1","n":1,"text":"Какво представлява интегралната схема?","opts":["Печатна платка, върху която са запоени отделно произведени дискретни транзистори, диоди и резистори","Сглобка от няколко отделно произведени кристала, свързани помежду си с външни проводници","Функционален възел, чиито елементи се изработват в общ технологичен процес върху един силициев кристал","Пластмасов корпус с изводи, в който се поставят предварително произведени пасивни елементи"],"correct":2,"expl":"ИС е функционален възел — всички елементи се правят в общ процес върху един кристал (чип) и се разглеждат като неделим компонент."},{"id":"L03-A-2","n":2,"text":"Кое условно означение се използва за кондензатор?","opts":["**C**","**L**","**R**","**D**"],"correct":0,"expl":"C — Capacitor; L е индуктивност (бобина), R — резистор, D — диод."},{"id":"L03-A-3","n":3,"text":"Кои са трите основни вида ИС според технологията на производството им?","opts":["Линейни, цифрови и смесени","SSI, MSI и LSI","NMOS, PMOS и CMOS","Монолитни, слойни и хибридни"],"correct":3,"expl":"По технология ИС са монолитни, слойни и хибридни; линейни/цифрови е деление по предназначение."},{"id":"L03-A-4","n":4,"text":"Какво е входното съпротивление на MOS транзистора?","opts":["10³ до 10⁶ Ω","10¹² до 10¹⁴ Ω","10⁶ до 10⁸ Ω","10 до 100 Ω"],"correct":1,"expl":"MOS (полевият) транзистор има много високо входно съпротивление — 10¹² до 10¹⁴ Ω."},{"id":"L03-A-5","n":5,"text":"Дебелослойните елементи имат дебелина около:","opts":["5 μm","100 μm","1 μm","25 nm"],"correct":1,"expl":"Дебелослойните — 100 μm и до 50 елемента; тънкослойните — до 5 μm."},{"id":"L03-A-6","n":6,"text":"До колко елемента съдържа ИС с голяма степен на интеграция (LSI) според лекцията?","opts":["До 150","До 30","Над 10 000","До 1000"],"correct":3,"expl":"LSI — до 1000 елемента (малки процесори, памети); MSI — до 150, SSI — до 30."},{"id":"L03-A-7","n":7,"text":"Какво се разбира под коефициент на обединение по вход M?","opts":["Броят единични изходи на предходната схема, които могат да се включат към входа на един елемент","Броят единични входове на следващата схема, които могат да се управляват от изхода","Броят на логическите елементи, интегрирани в един корпус на ИС","Отношението между мощностите, консумирани в двете логически състояния"],"correct":0,"expl":"M е обединение по вход (изходи на предходната схема); N е разклонение по изход (входове на следващата)."},{"id":"L03-A-8","n":8,"text":"Кой създава първата хибридна германиева ИС през 1958 г.?","opts":["Робърт Нойс (Fairchild)","Гордън Тийл (Texas Instruments)","Джак Килби (Texas Instruments)","Федерико Фадин (Intel)"],"correct":2,"expl":"Килби, TI, 1958 — 1 транзистор и 4 други елемента върху 1 чип; Нобелова награда през 2000 г."},{"id":"L03-A-9","n":9,"text":"Кои разработват планарния процес през 1959 г. във Fairchild?","opts":["Джон Бардийн и Уолтър Братейн","Давон Канг и Мохамед Атала","Гордън Мур и Федерико Фадин","Jean Hoerni и Robert Noyce"],"correct":3,"expl":"Планарният процес (1959) — Hoerni и Noyce, Fairchild; Канг и Атала създават първия MOS транзистор (Bell Labs, 1959)."},{"id":"L03-A-10","n":10,"text":"С какви атоми се легира подложката, за да се получи област с N-проводимост при MOS процеса?","opts":["Бор","Фосфор","Алуминий","Злато"],"correct":1,"expl":"Фосфор дава N-области, бор — P-области; алуминият е за метализацията, златото — за бондирането."}],"B":[{"id":"L03-B-1","n":1,"text":"Кое твърдение за монолитните ИС е вярно?","opts":["Изграждат се от проводящ слой, нанесен върху изолационна подложка","Всички елементи се изготвят в обема на обща полупроводникова подложка","Съдържат само пасивни елементи — резистори и кондензатори","Транзисторите се запояват към предварително изработени метални подложки"],"correct":1,"expl":"При монолитните ИС всичко е в обща полупроводникова подложка; другите твърдения описват слойни и хибридни ИС."},{"id":"L03-B-2","n":2,"text":"Кои са изводите на биполярния транзистор (BJT)?","opts":["Сорс, гейт и дрейн","Анод, катод и гейт","Сорс, база и дрейн","Емитер, база и колектор"],"correct":3,"expl":"BJT има емитер, база и колектор; сорс, гейт и дрейн са изводите на полевия (MOS) транзистор."},{"id":"L03-B-3","n":3,"text":"Каква е отличителната черта на CMOS схемите в сравнение с биполярните технологии?","opts":["Ниското потребление на енергия в статичен режим","Използването само на n-канални транзистори","Необходимостта от изолация за всеки отделен елемент","Ниското входно съпротивление на транзисторите"],"correct":0,"expl":"CMOS се отличава с ниско статично потребление; съдържа и n-, и p-канални транзистори."},{"id":"L03-B-4","n":4,"text":"Каква е типичната стойност на N, с която се оценява товароспособността на ИС?","opts":["N = 2","N = 100","N = 10","N = 1000"],"correct":2,"expl":"Обикновено N = 10, но се срещат елементи с N = 30."},{"id":"L03-B-5","n":5,"text":"Каква е консумираната средна мощност P_ср на ИС, използвана за ориентировъчни изчисления?","opts":["Полусумата от мощностите, консумирани в двете логически състояния","Максималната мощност, консумирана при превключване от 0 в 1","Мощността, консумирана в състояние на логическа единица","Сумата от мощностите на всички свързани товари на изхода"],"correct":0,"expl":"P_ср е полусумата от мощностите в двете логически състояния."},{"id":"L03-B-6","n":6,"text":"Кой микропроцесор отбелязва началото на технологията с голяма степен на интеграция (LSI)?","opts":["AMD 2901 Bit-Slice (1975)","Motorola 68000 (1979)","HP Focus Chip (1981)","Intel 4004 (1971)"],"correct":1,"expl":"Motorola 68000 — LSI; AMD 2901 — MSI; HP Focus — VLSI."},{"id":"L03-B-7","n":7,"text":"Какво гласи законът на Мур според лекцията?","opts":["Тактовата честота на процесорите се удвоява всяка година","Цената на един транзистор намалява наполовина на 5 години","Размерът на чипа се увеличава двойно на всеки 10 години","Броят на транзисторите в ИС се удвоява приблизително на 2 години"],"correct":3,"expl":"По Мур броят на транзисторите се удвоява на ~2 години (1,96), илюстрирано с процесорите на Intel."},{"id":"L03-B-8","n":8,"text":"Какво представлява четвъртият етап („синтез“) при проектиране с VHDL?","opts":["Разработка на йерархична блокова схема на проекта и разделяне на модули","Времеви анализ на реалните закъснения на сигналите в готовия проект","Визуализиране на VHDL кода посредством примитиви или елементарни логически елементи","Разполагане и трасиране на вече готовия проект върху избрания чип"],"correct":2,"expl":"Синтезът (4-ти етап) превръща VHDL кода в примитиви/елементарни логически елементи."},{"id":"L03-B-9","n":9,"text":"С какво се отстранява експонираният (разтворим) фоторезист при операцията ецване според лекцията?","opts":["С флуороводородна киселина","С чист кислород при висока температура","С йонизирани атоми на бор","С диамантени резци"],"correct":0,"expl":"Слайдът посочва флуороводородна киселина; операцията се нарича ецване."},{"id":"L03-B-10","n":10,"text":"Защо пасивни компоненти с големи стойности обикновено не се интегрират в биполярните ИС?","opts":["Защото не могат да се изработят чрез легиране","Защото изискват изолация с право включен pn-преход","Защото заемат значителна площ от повърхността на чипа","Защото не издържат на високата температура при окисление"],"correct":2,"expl":"Големите R, C и L заемат значителна площ от чипа, затова обикновено не се интегрират."}],"C":[{"id":"L03-C-1","n":1,"text":"Кой елемент на ИС действа като „вентил“ за ток и осигурява протичане само в една посока?","opts":["Резисторът","Кондензаторът","Индуктивният елемент","Диодът"],"correct":3,"expl":"Диодът (D) пропуска ток само в една посока."},{"id":"L03-C-2","n":2,"text":"Кои ИС се използват за изготвяне само на пасивни елементи — резистори и кондензатори?","opts":["Монолитните MOS","Слойните","Монолитните биполярни","Смесените монолитни"],"correct":1,"expl":"Слойните ИС (тънко- и дебелослойни) реализират само пасивни елементи."},{"id":"L03-C-3","n":3,"text":"Кои ИС се използват в аналоговите схеми — аудио усилватели, регулатори на напрежение, операционни усилватели?","opts":["Цифровите","Логическите","Линейните","Дебелослойните"],"correct":2,"expl":"Линейните ИС работят с непрекъснат във времето сигнал; цифровите — с две нива."},{"id":"L03-C-4","n":4,"text":"Кой е открил първия силициев транзистор през 1954 г.?","opts":["Гордън Тийл, Texas Instruments","Уилям Шокли, Bell Labs","Робърт Видлар, Fairchild","Мохамед Атала, Bell Labs"],"correct":0,"expl":"Първият силициев транзистор — Гордън Тийл, Texas Instruments, 1954 г."},{"id":"L03-C-5","n":5,"text":"Колко транзистора съдържа Intel 4004?","opts":["450 000","1024","2300","4"],"correct":2,"expl":"Intel 4004 (1971): 4-битов, 2300 транзистора, 1 MHz, MOS технология."},{"id":"L03-C-6","n":6,"text":"Какви са трите нива на абстракция, чрез които може да се опише всяка ИС?","opts":["Системно, логическо и електрическо","Монолитно, слойно и хибридно","Аналогово, цифрово и смесено","Поведенческо, структурно и физическо"],"correct":3,"expl":"ИС се описва на поведенческо, структурно и физическо ниво."},{"id":"L03-C-7","n":7,"text":"Какъв материал се отлага по цялата повърхност при операцията метализация?","opts":["Полисилиций","Алуминий","Злато","Силициев диоксид"],"correct":1,"expl":"При метализацията се отлагат атоми на алуминий; златните проводници се ползват при бондирането."},{"id":"L03-C-8","n":8,"text":"Какво се получава в резултат на епитаксията при производството на биполярни ИС?","opts":["Тънък слой от монокристален силиций върху подложката","Изолационен слой от SiO₂ върху повърхността","Метални площадки за присъединяване на проводници","Прозорец към подложката с форма според маската"],"correct":0,"expl":"Епитаксията нараства тънък монокристален (епитаксиален) слой; SiO₂ се получава с окисление."},{"id":"L03-C-9","n":9,"text":"Кое НЕ е предимство на MOS ИС пред биполярните ИС?","opts":["Произвеждат се с по-малък брой операции","Изискват изолация с pn-преход за всеки елемент","Пасивните компоненти заемат по-малка площ","Имат много по-голяма степен на интеграция"],"correct":1,"expl":"MOS транзисторите се самоизолират; изолация за всеки елемент се изисква при биполярните ИС."},{"id":"L03-C-10","n":10,"text":"Какво позволява FinFET транзисторът в сравнение с планарния?","opts":["Каналът се разполага под подложката и намалява входното съпротивление","Сорсът и дрейнът се обединяват в общ извод, управляван от гейта","Транзисторът работи без гейт, а токът се управлява от подложката","Гейтът обвива издигнатия канал от три страни и дава по-голям контрол върху тока"],"correct":3,"expl":"При FinFET каналът е издигнат над повърхността и гейтът го обвива от три страни — 3-D структура."}],"D":[{"id":"L03-D-1","n":1,"text":"Кое НЕ е характерно за интегралните схеми?","opts":["Големи изисквания за мощност","Миниатюрни размери и тегло","Повишена надеждност","Ниска цена"],"correct":0,"expl":"ИС се характеризират с малки изисквания за мощност, малки размери, ниска цена и висока надеждност."},{"id":"L03-D-2","n":2,"text":"Какви транзистори съдържат смесените монолитни ИС?","opts":["Само n-канални MOS транзистори","Само pnp биполярни транзистори","И биполярни, и MOS транзистори","Само дискретни транзистори, запоени към подложката"],"correct":2,"expl":"Смесените монолитни ИС съдържат и двата типа транзистори."},{"id":"L03-D-3","n":3,"text":"Защо в съвременната електроника се използват основно npn транзистори?","opts":["Имат един pn-преход вместо два и затова са по-евтини и по-лесни за производство","Основните носители са по-бързите електрони, затова са по-бързодействащи и по-високочестотни","Нямат нужда от омични контакти към емитера, базата и колектора и са по-малки","Имат много по-високо входно съпротивление от MOS транзисторите (до 10¹⁴ Ω)"],"correct":1,"expl":"В npn основните носители са електроните — по-бързи, затова устройствата са по-бързи и по-високочестотни."},{"id":"L03-D-4","n":4,"text":"В какъв ред се изработват елементите при хибридните ИС?","opts":["Първо транзисторите и диодите, а след това върху тях се нанасят резисторите и кондензаторите","Всички елементи се изработват едновременно в обема на полупроводниковата подложка","Първо се нанася фоторезистът, после чрез маска се имплантират диодите и транзисторите","Първо резисторите и кондензаторите и металните подложки, после се запояват диодите и транзисторите"],"correct":3,"expl":"При хибридните ИС първо се правят слойните пасивни елементи, а след това се запояват транзисторите и диодите."},{"id":"L03-D-5","n":5,"text":"ИС със свръхголяма степен на интеграция (VLSI) съдържат според лекцията:","opts":["До 150 елемента","До 1000 елемента","До 50 елемента","Над 1000 елемента"],"correct":3,"expl":"VLSI — над 1000 елемента; примери: сложни микропроцесори и DSP чипове."},{"id":"L03-D-6","n":6,"text":"Как се класифицират ИС според бързодействието им?","opts":["Бавнодействащи до 100 ns, среднодействащи до 10 ns, бързодействащи до 2 ns","Бавнодействащи до 10 ns, среднодействащи до 2 ns, бързодействащи до 1 ns","Бавнодействащи до 1 ms, среднодействащи до 100 ns, бързодействащи до 10 ns","Бавнодействащи до 100 ns, среднодействащи до 50 ns, бързодействащи до 20 ns"],"correct":0,"expl":"Бързодействието се определя от времето на превключване: 100 / 10 / 2 ns."},{"id":"L03-D-7","n":7,"text":"Кой е свързан с първата линейна ИС — операционен усилвател на Fairchild?","opts":["Джак Килби","Жан Хорни","Роберт Видлар","Давон Канг"],"correct":2,"expl":"Видлар (Fairchild) — µA 702 (1964) и µA 709 (1965) — операционни усилватели."},{"id":"L03-D-8","n":8,"text":"Какво позволява диаграмата на Гайски при проектиране „от горе на долу“ (top-down)?","opts":["Преход от физическото ниво към поведенческото чрез синтез на топологията на схемата","Избор на път от най-високото поведенческо до най-ниското физическо ниво през структурните нива","Пряко преобразуване на структурното описание в фотошаблони без физическо ниво","Описание на схемата само на поведенческо ниво, без структурни и физически подробности"],"correct":1,"expl":"Top-down по Гайски: поведенческо → структурно → физическо; подходът важи и за програмни системи."},{"id":"L03-D-9","n":9,"text":"Каква е последователността на процеса на пълно производство на ИС?","opts":["Проектиране → изготвяне на фотошаблони → производство → тестване","Производство → проектиране → тестване → изготвяне на фотошаблони","Изготвяне на фотошаблони → проектиране → тестване → производство","Проектиране → производство → изготвяне на фотошаблони → тестване"],"correct":0,"expl":"Пълното производство: проектиране, фотошаблони, производство, тестване."},{"id":"L03-D-10","n":10,"text":"Как се осигурява електрическата изолация на елементите в биполярните ИС?","opts":["С право включен pn-преход, като подложката се свързва към най-положителното напрежение","Чрез самоизолация на транзисторите от подложката без допълнителни мерки","С обратно включен pn-преход, като подложката се свързва към най-отрицателното напрежение","С тънък слой алуминий, отложен между отделните елементи"],"correct":2,"expl":"Използва се обратно включен pn-преход — през обеднения слой не тече ток."}],"E":[{"id":"L03-E-1","n":1,"text":"Кое твърдение за индуктивния елемент е вярно?","opts":["Временно съхранява електрически заряд чрез енергията на електричното поле","Има постоянна стойност на съпротивлението и ограничава потока електрони","Представлява бобина от проводник и се противопоставя на измененията в протичащия ток","Усилва и преобразува електрическите сигнали чрез управляващ електрод"],"correct":2,"expl":"Индуктивният елемент (L) е бобина и се противопоставя на измененията на тока; описанието с поле е за кондензатора."},{"id":"L03-E-2","n":2,"text":"Колко pn-прехода има биполярният транзистор?","opts":["Един","Три","Четири","Два"],"correct":3,"expl":"Биполярният транзистор има три различно легирани области и два pn-прехода."},{"id":"L03-E-3","n":3,"text":"От какъв материал е малката подложка при тънкослойните ИС?","opts":["От изолационен материал — стъкло или керамика","От монокристален силиций с p-проводимост","От полисилиций, покрит с фоторезист","От алуминий с нанесен слой SiO₂"],"correct":0,"expl":"Тънкослойните ИС са върху малка изолационна подложка (стъкло, керамика), дебелина на елементите до 5 μm."},{"id":"L03-E-4","n":4,"text":"ИС със средна степен на интеграция (MSI) обикновено изпълняват:","opts":["Сложни микропроцесори и чипове за цифрова обработка на сигнали","Специфични елементарни цифрови функции, като събиране на четири бита","Малки процесори, малки памети и програмируеми модули (до 1000 елемента)","Само единични логически елементи с общо до 30 елемента на чип"],"correct":1,"expl":"MSI (до 150 елемента) — елементарни функции като 4-битово събиране; малки процесори и памети са LSI."},{"id":"L03-E-5","n":5,"text":"Как се разглежда шумът при импулсната шумоустойчивост?","opts":["Като импулс с определена продължителност и амплитуда","Като продължително действащо ниво на напрежението","Като ток, протичащ между ИС и външните товари","Като време на превключване от 0 в 1"],"correct":0,"expl":"При импулсната — импулс с продължителност и амплитуда; при статичната — продължително ниво."},{"id":"L03-E-6","n":6,"text":"Кой е открил първия германиев транзистор с точков контакт в Bell Labs през 1947 г.?","opts":["Давон Канг и Мохамед Атала","Жан Хорни и Робърт Нойс","Бардийн, Братейн и Шокли","Джак Килби и Гордън Тийл"],"correct":2,"expl":"Бардийн, Братейн и Шокли (Bell Labs, 1947) — Нобелова награда за физика през 1956 г."},{"id":"L03-E-7","n":7,"text":"Каква е първата комерсиална монолитна силициева ИС с планарен процес (Fairchild, 1959)?","opts":["4-битов микропроцесор с 2300 транзистора и честота 1 MHz","Еднобитово запомнящо устройство с 4 транзистора и 5 резистора","Операционният усилвател µA 709 на Роберт Видлар","Статична RAM памет от 256 бита (Fairchild 4100)"],"correct":1,"expl":"Fairchild, 1959 — 1-битова памет с 4 транзистора и 5 резистора; начало на SSI."},{"id":"L03-E-8","n":8,"text":"Какво означава абревиатурата VHDL?","opts":["Very High Density Logic","Virtual Hardware Design Layout","Very-large-scale Hardware Development Language","VHSIC Hardware Description Language"],"correct":3,"expl":"VHDL = VHSIC Hardware Description Language — език от високо ниво за описание на системи."},{"id":"L03-E-9","n":9,"text":"Кой е правилният ред на операциите в планарния процес при производство на MOS транзистор?","opts":["Фотолитография → окисление → легиране → ецване → метализация","Окисление → легиране → фотолитография → метализация → ецване","Метализация → окисление → фотолитография → ецване → легиране","Окисление → фотолитография → ецване → легиране → метализация"],"correct":3,"expl":"Първо окисление (SiO₂), после фотолитография, ецване, (гейт), легиране, контакти и метализация."},{"id":"L03-E-10","n":10,"text":"Как се нарича операцията, при която чипът се свързва към корпуса със златни проводници, притиснати към контактните площадки?","opts":["Метализация","Бондиране","Епитаксия","Легиране"],"correct":1,"expl":"Свързването със златни проводници под налягане се нарича бондиране."}]}},{"num":4,"title":"Лекция 4 — Програмно осигуряване на КС, BIOS и операционна система","short":"Програмно осигуряване на КС, BIOS и операционна система","summary":"### Програмно осигуряване на КС — основни понятия\n- **Компютърът е универсална информационна машина** — счетоводство, редактиране на текст и графика, управление на технологични процеси, игри, филми и др.; **никоя друга машина** не може да изпълнява толкова широк диапазон от дейности.\n- Широкият обхват се обуславя от **универсалните електронни устройства** и **простата система от команди (инструкции)** на централния процесор. Разглеждан на това ниво, компютърът е **апаратна част (Hardware)**.\n- Сложните задачи се решават чрез **многократно изпълнение на елементарни аритметични и логически операции** от системата команди на микропроцесора; всяка операция се задава с **команда (инструкция)**.\n- **Програма** — **поредица от систематизирани и логически обвързани команди**.\n- Сложните програми, които свеждат информационните задачи до краен брой прости команди, образуват **програмната част (Software)**.\n- **Софтуерната индустрия** днес **надвишава по приходи и заетост хардуерната индустрия**.\n\n### Видове програмно осигуряване\n- Софтуерната част се нарича **програмно осигуряване** и се дели на две големи групи: **системно** (на слайда: **General Software**) и **приложно (Application Software)**.\n\n| | Системно ПО | Приложно ПО |\n|---|---|---|\n| Предназначение | **управление на КС**, унификация при работа с различен хардуер, **многоцелево използване** | решаване на **конкретни задачи на потребителя** |\n| Зависимост от целите | **слабо зависи** от конкретните цели | зависи от конкретното приложение |\n| Доставка | **доставя се заедно с КС**; част е в **ROM**; потребителят може да го **променя и разширява** | инсталира се според нуждите |\n| Примери | ОС, драйвери, обслужващи програми (utility), компилатори, интерпретатори, асемблери, свързващи и зареждащи програми, дебъгери | Office пакети, СУБД, настолни издателски системи, графика, мултимедия, **интегрирани среди за разработка** |\n\n### Системно програмно осигуряване\n- Основен инструмент за **управление на КС**; изпълнява **задачи, общи за цялата система**; осигурява **средата**, в която работят приложните програми — **инфраструктурата** за изпълнение на потребителските програми.\n- Включва програми за: **организация на изчислителните процеси** в различни режими; **контрол на изпълнението на задачите**; **диагностика и коригиране на неизправности** при пренасяне на данни между устройствата; **контрол на заданията** на потребителите.\n- **Основна част — операционната система**. Останалите елементи са **обслужващи програми (Utility)** — необходими за функционирането на КС, но **не са включени в ОС**; **допълват ОС**, **опростяват разработката на ОС** и правят системното ПО **по-гъвкаво и адаптивно**.\n- Класификация от слайда „Types of Computer Software“:\n  - **System Management**: **Operating System**, **Device Driver**, **Utility Program** (File Management, **Disk Cleanup**, **Virus Cleanup**).\n  - **Software Development**: **Linker & Loader**, **Debugger**, **Language Processor** → **Compiler**, **Interpreter**, **Assembler** (на втората схема: Programming Languages, Program Compilers, Program Interpreters, Linker and Loader).\n\n### Приложно програмно осигуряване\n- Програми за **конкретни задачи на потребителя** — напр. **счетоводни програми**, управление на складови наличности.\n- **Общо предназначение (General Purpose)**: Word Processing, Spreadsheet, Presentation, Browsers, Image and Video Editor — напр. **Office пакетите**.\n- **Специално предназначение (Specific/Special Purpose)**: HR Management, Payroll System, Attendance System, **Railways Reservation System**, Inventory Management, Customer Management, Accounting Software, други СУБД.\n- Към приложното ПО спадат още: **системи за управление на бази данни**, **настолни издателски системи**, обработка на графика, мултимедия, **интегрирани работни среди (IDE)**.\n- Схема „луковица“: в центъра **Hardware** (CPU, дискове, мишка, принтер), около него **System Software** (Operating System, Utilities), най-отвън **Application Software** (Spreadsheets, Word processors, Databases, Computer Games, Internet Browsers).\n\n### Трипластов модел на КС\n- Достъпът до хардуера е **една от най-важните задачи на системното ПО**; потребителската програма **не може директно** да се обърне напр. към **видеоконтролера** — използва **ROM-BIOS** и **ОС** (DOS, Windows) като **посредници**.\n- Слоеве (отдолу нагоре): **Хардуер → BIOS → Операционна система → Приложни програми**. **BIOS е най-близо до хардуера** и комуникира с него непосредствено.\n- Предвидена е и **директна връзка на приложната програма с хардуера** — само за **специални действия**, които ОС и BIOS не могат да осигурят.\n- На схемата Application ↔ OS се свързват чрез **API**, а OS ↔ Hardware — чрез **BIOS Interface**.\n\n### BIOS (Basic Input Output System)\n- **BIOS** — термин за **всички драйвери на КС**, които работят съвместно и оформят **интерфейса между хардуера и софтуера**.\n- Части: **ROM чип на дънната платка** (същинската част), **ROM чипове на разширителните карти**, **допълнителни драйвери, зареждани при стартиране на ОС**.\n- Частта в ROM чиповете се нарича **Firmware** — софтуер, **съхраняван в чипове, а не на твърдия диск**; това създава **илюзия, че BIOS е хардуер**.\n- При стартиране, когато няма заредени програми и драйвери, **ROM BIOS програмите са единствените в паметта**; управлението **автоматично се предава** на определен адрес от BIOS; BIOS подготвя системата и **организира зареждането на ОС**.\n- В ерата на **DOS** ROM BIOS е бил **напълно достатъчен** — драйвери за **клавиатура, флопи, харддиск, серийни и паралелни портове**. По-късно липсват драйвери за **видеокарти, CD-ROM, SCSI дискове, USB** → новите драйвери се **копират на харддиска** и **ОС ги зарежда** при стартирането си.\n- Някои драйвери (харддиск, видео) трябва да са активни **още при стартиране** → в ROM. Инженерите на **IBM** проектират ROM на дънната платка да **сканира слотовете за адаптерни карти с ROM**; софтуерът им се изпълнява **преди зареждането на ОС**.\n- Карти, които почти винаги имат ROM драйвери: **видеокарти (всички)**, **SCSI адаптери** (за зареждане от SCSI диск/CD-ROM), **мрежови карти** — **boot ROM** или **IPL ROM (Initial Program Load)** → **бездискови работни станции** (**Net PC**, „умни терминали“), **карти за надграждане на IDE/флопи контролера**.\n- BIOS управлява прехвърлянето на данни **на физическо ниво** — напр. запис на диск с конкретна **глава, писта и сектор**. BIOS е **пласт върху хардуера** с достъп до: видеоконтролер, RAM, флопи и харддискове, паралелни и серийни портове, клавиатура, мишка, **часовник за реално време**.\n- Функциите на BIOS са **стандартизирани** → програмата работи на всеки PC (диск 20 MB или 20 GB, IBM или Maxtor) — затова PC са толкова разпространени.\n\n### Архитектура на BIOS и засенчване\n- BIOS е в ROM → **резидентна програма**; заема **най-горната част на 1 MB адресно пространство** (DOS). 1 MB се адресира с **20-битово** число (**5 шестнадесетични цифри**).\n- Обикновено BIOS е от **F000H до FFFFH**; според паметта и версията началото може да е **E000H или C000H**.\n- **ROM е бавна — ~150 ns**, а **DRAM — 6–10 ns** → **засенчване (shadowing)**: RAM се адресира със **същите адреси** като BIOS и **ROM BIOS кодът се копира в нея** („скрита RAM“).\n- Ускорение: шината на скритата RAM е **16-битова (32-битова в новите системи)**, а на ROM BIOS — **8-битова**. Ефектът често е **незначителен** и може да създаде проблеми → засенчват се обикновено **само BIOS на дънната платка и на видеокартата**.\n\n### Харддискови параметри, CMOS RAM, SETUP\n- BIOS трябва да знае **броя глави, писти и сектори** на диска, служебните писти и др. → задават се с програмата **SETUP**.\n- **CMOS RAM** (Complementary MOS) — **поддържа се от батерия**; съдържа **часовник за реално време (RTC)** и няколко байта памет за **конфигурационните настройки**. **Енергонезависима**, защото схемата е с **много ниска консумация** и се захранва от батерия.\n- **BIOS ≠ CMOS RAM**: BIOS е **ROM с фиксиран софтуер**; CMOS RAM е **RAM** (с часовник), в която SETUP записва настройките. Бъркат се, защото SETUP пише в CMOS.\n- **SETUP** позволява: **системна дата и час**, **типове устройства**, **програмно изключване на устройства**, разширение на паметта, **честота на системната шина и процесора**, **парола** (записва се в паметта, поддържана от батерията).\n- Често използвани настройки: **ред на устройствата за зареждане** (A, C, CD-ROM), **основна видеокарта** (AGP или PCI), **деактивиране на портове** (освобождаване на **IRQ** линия; напр. PS/2 при USB мишка), **честота на CPU**, **намаляване на броя на тестовете** при пускане.\n\n### POST и стартиране\n- При процесорите **Intel** работата започва от адрес **FFFF0** (в BIOS) → команда за преход към **POST (Power On Self Test)** — проверка и инициализация на хардуера.\n- POST тества **процесора, паметта, контролерите на прекъсванията, DMA (Direct Memory Access)** и контролерите на устройствата. При грешка — **съобщение на екрана и звуков сигнал**.\n- Схема на зареждане: **Power On → POST → Boot Driver → Bootable Media Found? → Load Boot Program → Start OS**; грешки в POST → POST кодове, beep кодове и съобщения на екрана.\n\n### Обновяване (Update) на BIOS\n- Прави се, за да се ползват **усъвършенствани възможности на драйверите**; нужно при инсталиране на **нов хардуер**.\n- Производителите на дънни платки ползват BIOS от водещи фирми: **American Megatrends Inc. (AMI)**, **Microid Research**, **Phoenix Technologies (Phoenix / AwardBIOS)** → промяната е трудна, често я прави **производителят на дънната платка**.\n- Днес BIOS е във **флаш памет** — презаписва се **без смяна на ROM чипа**; обновявания се свалят от **уебсайта на производителя на дънната платка**.\n\n### Операционна система — роля и развитие\n- **ОС** — специална програмна система, на която е възложено **управлението и взаимодействието на устройствата**; координира **няколко взаимно конкуриращи се дейности** (печат, редактиране, графика едновременно) и решава подобни проблеми в **компютърните мрежи**.\n- **1940–1950 г.**: ЕИМ негъвкави; изпълнението на програма = **задание (Job)**, изпълнявано самостоятелно; **разписание за резервиране на машинно време**; машината е изцяло на разположение на заданието.\n- Първото подобрение — **ускоряване на прехода между заданията**: потребителите се отделят от оборудването → въвежда се длъжността **оператор на ЕИМ**.\n- **Разделяне на времето** — в **многопотребителски** системи и в **еднопотребителски в многопрограмен режим**; загубата на време за превключване се **компенсира** от престоите на процесора при операции с периферията → повишава се общата ефективност.\n\n### Архитектура на ОС — обвивка и ядро\n- **Обвивка (shell)** — частта, осигуряваща **интерфейса с потребителя**. Съвременно — **GUI (Graphical User Interface)** с **икони** и посочващо устройство (мишка); в **DOS** — **текстови съобщения** от клавиатурата.\n- Обвивката е **само интерфейс**; ОС позволява **избор на обвивка** — **UNIX: Bourne, C, Korn**; в Windows — настройка на елементи на обвивката.\n- **Главен компонент на графичната обвивка — програмата за управление на прозорци**: разпределя екрана на **прозорци**, поставя изображението на приложението в неговия прозорец и уведомява приложението за действия с мишката.\n- **Ядро на ОС** — вътрешните компоненти, изпълняващи основните функции. Елементи: **подсистема за управление на файловете**, **на паметта**, **на процесите**, **на периферните устройства** и **модел „клиент/сървър“**.\n\n### Подсистема за управление на файловете\n- Голяма част от времето на КС отива за **вход/изход към външната памет**. Подсистемата осигурява **достъп до програми и данни**, **надеждно и компактно съхранение** и **разпределение на пространството** на носителите.\n- **Файл** — съвкупност от данни, разпределени в групи, наречени **записи**. Всяка информация на външен носител е файл; всеки файл има **име**, а за файловете на устройството се създава **каталог (справочник)**.\n- Операции: **open** (откриване — подготовка), **close** (закриване), **create** (създаване), **destroy** (унищожаване), **copy** (копиране), **rename** (преименуване), **list** (показване на екран).\n\n### Подсистема за управление на паметта\n- Координира работата с **оперативната памет**; всяка програма трябва да има **собствен дял**; потребностите се менят във времето.\n- При недостиг — **виртуална памет**: програми и данни се преместват на **друго устройство (твърд диск)**. Паметта се дели на **страници**; активните се държат в ОП, неактивните — във външна памет (пример: програма иска **64 MB**, а има **32 MB**).\n- Модели за разпределение: **еднопрограмен режим**, **фиксирано разпределение по дялове**, **разпределение по страници**.\n\n### Подсистема за управление на процесите\n- С **едно CPU** във всеки момент се изпълнява **само един процес** (многопроцесорните системи имат друга архитектура на ОС).\n- **Програма** — **статичен набор от команди**; **процес** — **съвкупност от действия, изменящи се във времето**; текущото състояние = **състояние на процеса**. **Една програма може да е свързана с няколко процеса** (в ОП — **едно копие** на програмата).\n- Подсистемата гарантира на всеки процес **ресурси** (периферия, ОП, процесорно време); независимите процеси не си влияят, а обменящите информация имат възможност за това.\n- **Планировчик** — води **дневник/таблица на процесите**: регистрира нови процеси, затваря записите на завършилите.\n- **Диспечер** — определя **стратегията за редуване** на процесите; при разделяне на времето процесорното време се дели на **кванти (обикновено 50 ms)**; след изтичане — **принудително превключване**; диспечерът включва **таймера** за всеки квант.\n- Ако процесът спре преди края на кванта (напр. чака периферия) → **система на приоритети**: процесорът се дава на програмата с **най-висок приоритет**. Входно-изходните операции се извършват от устройства със **собствени микропроцесори** или чрез **DMA**.\n\n### Подсистема за управление на периферните устройства\n- Управлява периферията и **оптимизира достъпа**; включва **драйверите** — програми за връзка с **контролерите** или самите устройства.\n- Всеки драйвер е **за конкретен тип устройство** (принтер, дисков контролер, монитор) и **преобразува заявките в команди за физически операции**. Чрез драйвери ОС се настройва за различни устройства.\n\n### Модел „клиент/сървър“\n- Компонентите на ОС работят като **отделни процеси**; всеки е **клиент** (изпраща запитване) или **сървър** (отговаря). Пример: **програмата за управление на файлове е сървър**.\n- Ролята на сървъра **не зависи** от това дали клиентът е на същия или на **отдалечен компютър** → клиенти и сървъри могат да се разпределят по машини с всякаква конфигурация.\n- **CORBA = Common Object Request Broker Architecture** — стандарти за **универсален трансфер на съобщения** между клиенти и сървъри в разпределени системи.\n\n### Капани за изпита\n- Системното ПО на слайда е означено като **„General Software“** — обичайният термин е **System Software**; „general purpose“ на схемата е **подвид на приложния** софтуер (Word, Excel…). Не ги бъркай.\n- **Обслужващите програми (Utility)** са част от **системното** ПО, но **не са в ОС** — допълват я. **Компилатор, интерпретатор, асемблер, дебъгер, linker/loader** — също **системно** ПО (Software Development).\n- **IDE** (интегрирана работна среда) лекцията я слага в **приложното** ПО, въпреки че компилаторите са системно ПО.\n- Трипластов модел: **BIOS — най-близо до хардуера**, ОС — в средата, приложенията — най-горе. Директна връзка приложение–хардуер **има**, но само за специални действия.\n- **BIOS (ROM, фиксиран софтуер) ≠ CMOS RAM (RAM + часовник, захранвана от батерия)**. Паролата и настройките се пазят в паметта с батерията, не в ROM.\n- **Firmware** = софтуер в чипове — **не** е хардуер, макар да изглежда така.\n- Достъп: **ROM ~150 ns** vs **DRAM 6–10 ns**; шина: **скрита RAM 16/32 бита** vs **ROM 8 бита**. Засенчват се обикновено **само BIOS на дънната платка и видеокартата**.\n- Адреси: стартът при Intel е от **FFFF0**; BIOS — **F000H–FFFFH** (или от E000H/C000H). **Слайдът пише**, че адресното пространство на 1 MB е „от 0 до FFFFH“ — при 20 бита (5 hex цифри) правилно е **0–FFFFFH**; F000H–FFFFH са всъщност сегментни адреси (физически F0000H–FFFFFH).\n- Слайдът нарича BIOS „резидентна програма (намираща се в оперативната памет)“, макар че е в **ROM** — терминът тук значи, че е **постоянно налична** в адресното пространство.\n- **POST = Power On Self Test**; при грешка — **съобщение + звуков сигнал**. **IPL = Initial Program Load** (boot ROM на мрежова карта → Net PC).\n- **Планировчик** = таблица на процесите (регистриране); **диспечер** = стратегия за редуване, **кванти ~50 ms**, таймер. Не ги разменяй.\n- **Програма = статична**; **процес = динамичен**; една програма → **няколко процеса** с **едно копие** в паметта.\n- Елементи на ядрото — **5**, включително **модел „клиент/сървър“**; **обвивката не е част от ядрото**.\n- Файлови операции: унищожаване е **destroy** (не delete), показване е **list**.\n- Слайдът пише UNIX обвивка „**Borne**“ — правилно **Bourne**; на схемата „Linker And **Larder**“ — правилно **Loader**. „CMOS“ в слайда е преведено като „допълнителна MOS“ — правилно **комплементарна** MOS.\n- BIOS фирми: **AMI, Microid Research, Phoenix (Award)** — **не** Intel, IBM или Microsoft.\n","testNames":["A","B","C","D","E"],"tests":{"A":[{"id":"L04-A-1","n":1,"text":"Как се нарича поредица от систематизирани и логически обвързани команди?","opts":["Процес","Програма","Драйвер","Задание"],"correct":1,"expl":"Програмата е поредица от подредени и логически свързани команди; процесът е нейното изпълнение."},{"id":"L04-A-2","n":2,"text":"На кои две големи групи се дели програмното осигуряване?","opts":["Обслужващо и драйверно","Операционно и потребителско","Вградено и инсталирано","Системно и приложно"],"correct":3,"expl":"Програмното осигуряване се дели на системно (General Software) и приложно (Application Software)."},{"id":"L04-A-3","n":3,"text":"Как се наричат елементите от системното програмно осигуряване, които не са включени в операционната система, но я допълват?","opts":["Обслужващи програми (Utility)","Приложни програми (Application)","Вградени програми (Firmware)","Командни обвивки (Shell)"],"correct":0,"expl":"Освен ОС системното ПО включва обслужващи програми (Utility), които допълват ОС."},{"id":"L04-A-4","n":4,"text":"Кой слой в трипластовия модел на КС е най-близо до хардуера?","opts":["Операционната система","Приложните програми","BIOS","Обвивката на ОС"],"correct":2,"expl":"BIOS комуникира непосредствено с апаратните елементи; ОС и приложенията — чрез него."},{"id":"L04-A-5","n":5,"text":"Как се нарича софтуер, съхраняван в чипове, а не на твърдия диск?","opts":["Shareware","Middleware","Firmware","Utility"],"correct":2,"expl":"Частта от BIOS в ROM чипове се нарича Firmware — това създава илюзия, че BIOS е хардуер."},{"id":"L04-A-6","n":6,"text":"Какво е времето за достъп до ROM паметта според лекцията?","opts":["От порядъка на 150 ns","От порядъка на 6–10 ns","От порядъка на 50 ms","От порядъка на 2 ns"],"correct":0,"expl":"ROM е бавна (~150 ns), а DRAM — 6–10 ns; затова се използва засенчване."},{"id":"L04-A-7","n":7,"text":"Какво означава абревиатурата POST?","opts":["Primary Operating System Task","Program Of System Testing","Power Output Storage Table","Power On Self Test"],"correct":3,"expl":"POST (Power On Self Test) проверява системата и инициализира хардуера при включване."},{"id":"L04-A-8","n":8,"text":"Как се наричат кратките интервали, на които се разделя времето на процесора в системите с разделяне на времето?","opts":["Страници","Кванти","Дялове","Записи"],"correct":1,"expl":"Процесорното време се дели на кванти (обикновено 50 ms); страници и дялове са понятия от управлението на паметта."},{"id":"L04-A-9","n":9,"text":"Кои са обвивките, между които може да избира потребителят в UNIX според лекцията?","opts":["Bourne, C и Korn","GUI, DOS и Windows","AMI, Phoenix и Award","Open, Close и List"],"correct":0,"expl":"UNIX предлага обвивките Bourne (на слайда „Borne“), C и Korn."},{"id":"L04-A-10","n":10,"text":"Какво означава абревиатурата CORBA?","opts":["Central Operating Resource Base Allocation","Client Object Routing and Brokering Access","Computer Online Remote Boot Agent","Common Object Request Broker Architecture"],"correct":3,"expl":"CORBA — архитектура на брокери на запитвания за общи обекти; стандарти за мрежово взаимодействие клиент/сървър."}],"B":[{"id":"L04-B-1","n":1,"text":"Кое обуславя широкия обхват на приложение на компютърните системи?","opts":["Големият обем на оперативната памет и бързите твърди дискове на системата","Използването на графичен потребителски интерфейс с икони и прозорци","Наличието на специализирани приложни програми за всяка отделна задача","Универсалните електронни устройства и простата система от команди на процесора"],"correct":3,"expl":"Обхватът се обуславя от универсалните електронни устройства и простата система команди на CPU."},{"id":"L04-B-2","n":2,"text":"Кое твърдение за системното програмно осигуряване е вярно?","opts":["Доставя се заедно с КС, като част от него е реализирана в ROM паметта","Силно зависи от конкретните цели, за които се използва дадената КС","Не може да бъде променяно или разширявано от потребителя на системата","Включва основно Office пакети, СУБД и настолни издателски системи"],"correct":0,"expl":"Системното ПО се доставя с КС, част е в ROM и потребителят може да го разширява; то слабо зависи от целите."},{"id":"L04-B-3","n":3,"text":"Кое от изброените спада към приложното програмно осигуряване?","opts":["Драйвер на устройство","Настолна издателска система","Операционна система","Асемблер"],"correct":1,"expl":"Настолните издателски системи са приложно ПО; драйверите, ОС и асемблерите — системно."},{"id":"L04-B-4","n":4,"text":"Кога се използва директната връзка на приложната програма с апаратните елементи?","opts":["При всяко обръщение към видеоконтролера, без посредничеството на BIOS","При стартиране на КС, преди да се изпълни POST процедурата на BIOS","Когато се изпълняват специални действия, които ОС и BIOS не могат да осигурят","Винаги, когато ОС работи в многопрограмен режим с разделяне на времето"],"correct":2,"expl":"Директната връзка е предвидена само за специални действия, които ОС и BIOS не осигуряват."},{"id":"L04-B-5","n":5,"text":"Какво трябва да направи ROM на дънната платка според решението на инженерите на IBM?","opts":["Да съдържа драйвери за всички възможни устройства","Да сканира слотовете и да търси адаптерни карти с ROM чипове","Да се презаписва при всяко ново устройство","Да копира драйверите на всички карти в CMOS RAM"],"correct":1,"expl":"IBM проектират ROM на дънната платка да търси карти с ROM и да изпълнява техния софтуер преди зареждането на ОС."},{"id":"L04-B-6","n":6,"text":"Каква е ширината на шината за данни на ROM BIOS в сравнение със скритата RAM памет?","opts":["16 бита срещу 8 бита","32 бита срещу 64 бита","20 бита срещу 16 бита","8 бита срещу 16 (или 32) бита"],"correct":3,"expl":"Скритата RAM е с 16-битова (32-битова) шина, а ROM BIOS — с 8-битова; затова засенчването ускорява."},{"id":"L04-B-7","n":7,"text":"Кое НЕ е характеристика на CMOS RAM паметта?","opts":["Тя е ROM памет с фиксиран софтуер","Съдържа часовник за реално време","Захранва се от специална батерия","Пази конфигурационните настройки"],"correct":0,"expl":"ROM с фиксиран софтуер е BIOS; CMOS RAM е енергонезависима RAM с часовник, захранвана от батерия."},{"id":"L04-B-8","n":8,"text":"Кои фирми се посочват в лекцията като водещи производители на BIOS?","opts":["Intel, Motorola и Texas Instruments","IBM, Hewlett-Packard, Western Digital","American Megatrends, Microid Research, Phoenix","Microsoft, Apple Computer, Novell"],"correct":2,"expl":"Производителите на дънни платки ползват BIOS от AMI, Microid Research и Phoenix (Award)."},{"id":"L04-B-9","n":9,"text":"Каква е разликата между програма и процес?","opts":["Програмата се изпълнява от процесора, а процесът е копие на програмата, съхранено на твърдия диск","Програмата е статичен набор от команди, а процесът — съвкупност от действия, изменящи се във времето","Програмата съдържа данни, а процесът съдържа само команди","Една програма може да има само един процес, а един процес може да обхваща много програми"],"correct":1,"expl":"Програмата е статична, процесът е динамичен; една програма може да е свързана с няколко процеса."},{"id":"L04-B-10","n":10,"text":"Каква роля играе програмата за управление на файлове в модела „клиент/сървър“?","opts":["Сървър, предоставящ достъп до файловете при запитвания от клиенти","Клиент, който изпраща запитвания за файлове до диспечера на ОС","Брокер, преобразуващ запитванията на клиентите в CORBA съобщения","Планировчик, който регистрира процесите в таблицата на процесите"],"correct":0,"expl":"Програмата за управление на файлове функционира като сървър."}],"C":[{"id":"L04-C-1","n":1,"text":"Коя индустрия според лекцията надвишава по приходи и заетост хардуерната индустрия?","opts":["Телекомуникационната индустрия","Индустрията за полупроводници","Софтуерната индустрия","Индустрията за периферни устройства"],"correct":2,"expl":"Разработването на софтуер е мощна индустрия, надвишаваща хардуерната по приходи и заетост."},{"id":"L04-C-2","n":2,"text":"Към коя група на системния софтуер (Software Development) спадат компилаторът, интерпретаторът и асемблерът?","opts":["Utility Program","Language Processor","Device Driver","Linker & Loader"],"correct":1,"expl":"Compiler, Interpreter и Assembler са видове Language Processor в групата Software Development."},{"id":"L04-C-3","n":3,"text":"Коя от изброените е пример за приложен софтуер със специално предназначение?","opts":["Програма за обработка на електронни таблици","Текстообработваща програма за документи","Интернет браузър за достъп до уебсайтове","Система за резервации на железопътни билети"],"correct":3,"expl":"Railways Reservation System е Specific Purpose; таблици, текст и браузъри са General Purpose."},{"id":"L04-C-4","n":4,"text":"Кои устройства НЕ са били поддържани от драйверите в BIOS на дънната платка, когато системите стават по-сложни?","opts":["Видеокарти, CD-ROM, SCSI дискове и USB портове","Клавиатура и флопидискови устройства","Харддиск и серийни портове","Паралелни портове и клавиатура"],"correct":0,"expl":"Клавиатура, флопи, HDD, серийни и паралелни портове са в ROM BIOS; новите устройства изискват драйвери от диска."},{"id":"L04-C-5","n":5,"text":"Как се наричат бездисковите работни станции, които се зареждат от файлов сървър чрез boot ROM на мрежовата карта?","opts":["Хибридни работни станции","Сървъри за приложения","Мейнфрейм терминали","Net PC компютри (умни терминали)"],"correct":3,"expl":"Boot (IPL) ROM позволява бездискови работни станции — Net PC или умни терминали."},{"id":"L04-C-6","n":6,"text":"Защо е желателно програмите да използват функциите на BIOS, вместо директен достъп до устройствата?","opts":["Защото директният достъп до хардуера е технически невъзможен","Защото BIOS е по-бърз от всяка друга програма в паметта","Защото функциите са стандартизирани и съществуват във всеки PC","Защото BIOS се съхранява на твърдия диск"],"correct":2,"expl":"Стандартизацията на BIOS функциите позволява програма за една КС да работи безпроблемно на друга."},{"id":"L04-C-7","n":7,"text":"От кой адрес в паметта започва работата на компютърните системи с микропроцесори Intel?","opts":["FFFF0","F000H","C000H","00000"],"correct":0,"expl":"Управлението се задава в клетка с адрес FFFF0, която е от BIOS и предава управлението на POST."},{"id":"L04-C-8","n":8,"text":"Какво позволява използването на флаш памет за BIOS?","opts":["Засенчване на ROM паметта в скритата RAM","Презаписване на BIOS софтуера без да се заменя ROM чипът","Съхраняване на часовника за реално време без батерия","Директна връзка на приложенията с хардуера"],"correct":1,"expl":"Флаш ROM позволява обновяване на BIOS (напр. от сайта на производителя) без смяна на чипа."},{"id":"L04-C-9","n":9,"text":"Как се нарича частта от ОС, която обезпечава интерфейса с потребителя?","opts":["Ядро","Диспечер","Обвивка","Планировчик"],"correct":2,"expl":"Обвивката (shell) е интерфейсът с потребителя; ядрото изпълнява основните функции."},{"id":"L04-C-10","n":10,"text":"Какво е виртуалната памет?","opts":["Скрита RAM памет, в която при стартиране се копира кодът на ROM BIOS за ускоряване","„Увеличена“ памет чрез преместване на програми и данни от ОП на друго устройство, напр. твърд диск","Енергонезависима памет, поддържана от батерията на компютъра, в която се пази конфигурацията","Памет, разположена в ROM чиповете на разширителните карти"],"correct":1,"expl":"Виртуалната памет създава илюзия за по-голям обем чрез изнасяне на страници във външна памет."}],"D":[{"id":"L04-D-1","n":1,"text":"Какво осигурява системното програмно осигуряване по отношение на приложните програми?","opts":["Средата и инфраструктурата, в които функционират приложните програми","Решаването на конкретните практически задачи на потребителя","Подготовката на документи, таблици и обобщени справки","Обработката на графични и мултимедийни обекти за потребителя"],"correct":0,"expl":"Системното ПО изпълнява общи задачи и изгражда инфраструктурата за изпълнение на потребителските програми."},{"id":"L04-D-2","n":2,"text":"Кое НЕ е програма, отнасяща се към системното програмно осигуряване?","opts":["Програма за организация на изчислителните процеси","Програма за контрол на заданията на потребителите","Програма за управление на складови наличности","Програма за диагностика на неизправности при пренос на данни"],"correct":2,"expl":"Управлението на складови наличности е конкретна потребителска задача — приложно ПО."},{"id":"L04-D-3","n":3,"text":"Какво представлява BIOS според лекцията?","opts":["Батерийно захранвана памет с часовник за реално време и конфигурационни настройки","Всички драйвери на КС, които работят съвместно и оформят интерфейса между хардуера и софтуера","Графичната обвивка на ОС, чрез която потребителят въвежда команди","Програма за управление на прозорците в графичния интерфейс"],"correct":1,"expl":"BIOS е съвкупността от драйвери — интерфейс между хардуера и софтуера; CMOS RAM е друго нещо."},{"id":"L04-D-4","n":4,"text":"Кои параметри на твърдия диск трябва да познава BIOS?","opts":["Скоростта на въртене и цената на диска","Името на производителя и серийния номер","Размера на файловете и броя на каталозите","Броя на четящите глави, пистите и секторите"],"correct":3,"expl":"BIOS трябва да знае главите, пистите, секторите и служебните писти — уточняват се чрез SETUP."},{"id":"L04-D-5","n":5,"text":"Кое от изброените НЕ се тества при POST процедурата?","opts":["Процесорът","Контролерите на прекъсванията","DMA контролерът","Приложните програми"],"correct":3,"expl":"POST проверява процесора, паметта, контролерите на прекъсванията, DMA и контролерите на устройствата."},{"id":"L04-D-6","n":6,"text":"Какво е задание (Job) в периода 1940–1950 г.?","opts":["Пускане на една програма, което изисква специална подготовка и се извършва самостоятелно","Квант процесорно време (обикновено 50 ms), предоставен на даден процес от диспечера","Запис в таблицата на процесите, създаден от планировчика при стартиране на програма","Група от данни във файл, обработвани заедно от една и съща програма"],"correct":0,"expl":"Пускането на програма се нарича задание (Job) и машината е изцяло в негово разпореждане."},{"id":"L04-D-7","n":7,"text":"Кой е главният компонент на съвременните графични обвивки?","opts":["Подсистемата за управление на файловете","Диспечерът на процесите","Програмата за управление на прозорци","Програмата SETUP"],"correct":2,"expl":"Програмата за управление на прозорци разпределя екрана и назначава прозорец на всяко приложение."},{"id":"L04-D-8","n":8,"text":"Коя файлова операция означава подготовка на файла за работа?","opts":["Създаване (create)","Откриване (open)","Показване (list)","Копиране (copy)"],"correct":1,"expl":"Open — подготовка за работа; close — край; create — нов файл; list — извеждане на екран."},{"id":"L04-D-9","n":9,"text":"Коя програма води таблица на процесите, регистрира нови процеси и затваря записите на завършилите?","opts":["Планировчикът","Диспечерът","Драйверът","Обвивката"],"correct":0,"expl":"Планировчикът води дневника (таблицата) на процесите; диспечерът определя стратегията за редуване."},{"id":"L04-D-10","n":10,"text":"Какво прави драйверът на периферно устройство?","opts":["Разпределя екрана на прозорци и ги назначава на отделните приложни програми","Разделя процесорното време на кванти и принудително превключва процесите","Преобразува заявките за използване на устройството в команди за физически операции","Премества неактивните страници между оперативната и външната памет"],"correct":2,"expl":"Драйверът е специфичен за типа устройство и превръща заявките в команди за физически операции."}],"E":[{"id":"L04-E-1","n":1,"text":"Как се нарича частта от компютърната система, разгледана на ниво универсални електронни устройства и система от команди?","opts":["Програмна част (Software)","Апаратна част (Hardware)","Firmware","Операционна система"],"correct":1,"expl":"На това ниво компютърът е апаратна част (Hardware)."},{"id":"L04-E-2","n":2,"text":"Към коя подгрупа на системния софтуер (System Management) спадат Disk Cleanup и Virus Cleanup?","opts":["Language Processor","Linker & Loader","Debugger","Utility Program"],"correct":3,"expl":"Disk Cleanup, Virus Cleanup и File Management са Utility Program в групата System Management."},{"id":"L04-E-3","n":3,"text":"Как може потребителската програма да използва видеоконтролера на КС?","opts":["Чрез директно обръщение на микропроцесора към видеоконтролера","Чрез CMOS RAM паметта, в която се записва заявката","Чрез ROM-BIOS и ОС, които подготвят правилна заявка","Чрез програмата SETUP при всяко стартиране"],"correct":2,"expl":"Обръщението не може да е директно — ROM-BIOS и ОС са посредници към хардуера."},{"id":"L04-E-4","n":4,"text":"Какво означава IPL при мрежовите карти със зареждащ ROM?","opts":["Initial Program Load","Internal Port Link","Interrupt Priority Level","Integrated Peripheral Logic"],"correct":0,"expl":"IPL (Initial Program Load) ROM позволява зареждане директно от файлов сървър."},{"id":"L04-E-5","n":5,"text":"Какво представлява „засенчването“ на ROM паметта?","opts":["Записване на BIOS във флаш памет без смяна на чипа","Скриване на паролата в паметта, поддържана от батерията","Копиране на ROM BIOS кода в RAM, адресирана със същите адреси като BIOS","Изключване на неизползваните портове за освобождаване на
