<!doctype html>
<html lang="bg">
<head>
<script src="../gate.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КА тестове</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f8f9fb;--text:#1d2125;--muted:#5f6b76;--border:#d8dde3;
  --accent:#0f6cbf;--accent-ink:#ffffff;--accent-soft:#e7f0fa;
  --ok:#1e7e34;--ok-bg:#e6f4ea;--bad:#c62828;--bad-bg:#fdecea;--flag:#d97706;--half:#b45309;--half-bg:#fdf3e1;--code:#eef1f4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
    --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
    --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--half:#fbbf24;--half-bg:#3a2e14;--code:#2a2f36;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b;--panel:#1d2126;--panel2:#23282e;--text:#e6e8eb;--muted:#9aa4ae;--border:#353b42;
  --accent:#5aa9ff;--accent-ink:#0b1a2b;--accent-soft:#1d3047;
  --ok:#6fd38a;--ok-bg:#163020;--bad:#ff8a80;--bad-bg:#3a1c1c;--flag:#fbbf24;--half:#fbbf24;--half-bg:#3a2e14;--code:#2a2f36;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;color:inherit}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.2rem;margin:28px 0 12px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  padding:7px 13px;border-radius:7px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,.nav-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:.78rem;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.badge.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.half{background:var(--half-bg);color:var(--half);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;
  align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px;box-shadow:var(--shadow)}
.lec-h{display:flex;align-items:center;gap:12px;min-width:0}
.num{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.lec-t{font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem;margin:4px 0}
.toggle input{width:17px;height:17px;accent-color:var(--accent);flex:none}
select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);max-width:100%}

/* quiz */
.quiz{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:16px}
.side .card{padding:12px}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.nav-b{position:relative;height:42px;border:1px solid var(--border);border-radius:5px;background:var(--panel);cursor:pointer;
  font-size:.85rem;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:3px;overflow:hidden}
.nav-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:transparent}
.nav-b.ans::after{background:var(--muted);opacity:.45}
.nav-b.r-ok::after{background:var(--ok);opacity:.8}
.nav-b.r-bad::after{background:var(--bad);opacity:.8}
.nav-b.r-half::after{background:var(--half);opacity:.8}
.nav-b.cur{border:2px solid var(--text)}
.nav-b.task{font-weight:700}
.nav-b:disabled{cursor:not-allowed;opacity:.55}
.nav-b.fl::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--flag) transparent transparent}
.timer{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qwrap{display:grid;grid-template-columns:150px 1fr;gap:14px}
.qinfo{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.85rem;color:var(--muted);align-self:start}
.qinfo .qn{font-size:.85rem}
.qinfo .qn b{font-size:1.35rem;color:var(--text)}
.qinfo div{margin-bottom:6px}
.flagbtn{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;font-size:.85rem;text-align:left}
.flagbtn.on{color:var(--flag);font-weight:600}
.qbox{background:var(--accent-soft);border-radius:8px;padding:18px 20px;min-width:0}
.qtext{font-size:1.06rem;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.opt:hover{background:var(--panel)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt .ltr{min-width:1.4em;color:var(--muted)}
.opt.sel{background:var(--panel);border-color:var(--border)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:.95rem}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.wrong{background:var(--bad-bg);color:var(--bad)}
.fb.half{background:var(--half-bg);color:var(--half)}
.fb span{color:var(--text)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.lectag{font-size:.78rem;color:var(--muted);margin-bottom:6px}

/* писмени задачи */
.tmd{font-size:1.02rem;overflow-x:auto}
.tmd p{margin:0 0 10px}
.tmd table{border-collapse:collapse;margin:8px 0 12px;font-size:.9rem;background:var(--panel)}
.tmd th,.tmd td{border:1px solid var(--border);padding:4px 8px;text-align:center;vertical-align:top;white-space:nowrap}
.tmd th{background:var(--panel2)}
.tmd pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto;font-size:.9rem;line-height:1.35}
.tmd pre code{background:none;padding:0}
.fields{display:grid;gap:10px;margin:14px 0 6px}
.fld{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:4px 10px;align-items:center}
.fld>span{font-weight:600;font-size:.94rem}
.fld .hint{grid-column:2;font-size:.8rem;color:var(--muted)}
.fld input{font:15px/1.4 ui-monospace,Consolas,monospace;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);width:100%;min-width:0}
.fld input:focus,.work:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld input.ok{border-color:var(--ok);background:var(--ok-bg)}
.fld input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fld input.half{border-color:var(--half);background:var(--half-bg)}
.fld .mark{grid-column:2;font-size:.85rem}
.work{width:100%;min-height:120px;resize:vertical;font:14px/1.45 ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);margin-top:4px}
.worklbl{font-size:.88rem;color:var(--muted);margin-top:10px;display:block}
.sol{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.sol>b{display:block;margin-bottom:6px}
table.ans{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
table.ans td,table.ans th{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
table.ans th{color:var(--muted);font-weight:600;font-size:.84rem}
table.ans td.v{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.selfgrade{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--border)}
.work.big{min-height:170px;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.essay .mark{font-size:.88rem;color:var(--muted);margin-top:6px}
ul.kp{margin:6px 0 4px;padding-left:20px;font-size:.93rem}
ul.kp li{margin:2px 0}
ul.kp li.y{color:var(--ok)}
ul.kp li.n{color:var(--bad)}
.tmd svg{max-width:100%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--border)}
pre.mywork{white-space:pre-wrap;background:var(--code);padding:8px 10px;border-radius:7px;font-size:.88rem;margin:6px 0}

/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;font-weight:700}
.ring span{background:var(--panel);width:86px;height:86px;border-radius:50%;display:grid;place-items:center}
.rev{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;min-width:0}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.rev.half{border-left-color:var(--half)}
.rev .opt{cursor:default;padding:5px 9px}
.rev .opt:hover{background:transparent}
.rev .opt.ok:hover{background:var(--ok-bg)}
.rev .opt.bad:hover{background:var(--bad-bg)}
.rev .why{font-size:.92rem;margin-top:6px;color:var(--muted)}
.rev .why b{color:var(--text)}

/* summary */
.md{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 24px 24px;overflow-x:auto}
.md h3{margin-top:26px;border-bottom:1px solid var(--border);padding-bottom:4px}
.md table{border-collapse:collapse;margin:10px 0;font-size:.93rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md pre{background:var(--code);padding:10px 12px;border-radius:7px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md li{margin:2px 0}
.kbd{font-size:.8rem;color:var(--muted);margin-top:14px}

/* профил и прогрес */
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}
.inp{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
input.inp{min-width:0;flex:1 1 200px;max-width:320px}
textarea.inp{width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;word-break:break-all;margin:6px 0 10px}
.stat{font-size:1.9rem;font-weight:700;line-height:1.2}
.tbl-wrap{overflow-x:auto;padding:4px 6px}
table.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl th{color:var(--muted);font-weight:600;font-size:.84rem}
table.tbl td.t{white-space:normal;min-width:170px}
table.tbl tr.weak td{background:var(--bad-bg)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .tbl-wrap{padding:2px}
  table.tbl{font-size:.84rem}
  table.tbl th,table.tbl td{padding:6px 5px}
  table.tbl td.t{min-width:110px}
  table.tbl td.dt{white-space:normal;min-width:76px}
  .fld{grid-template-columns:1fr}
  .fld .hint,.fld .mark{grid-column:1}
}
.who{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted)}
.who b{color:var(--text)}

@media (max-width:820px){
  .grid3{grid-template-columns:1fr}
  .quiz{grid-template-columns:1fr}
  .side{position:static;order:2}
  .qwrap{grid-template-columns:1fr}
  .qinfo{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .qinfo div{margin:0}
  .md{padding:4px 14px 16px}
  .qbox{padding:14px 12px}
}
</style>
</head>

<script id="data" type="application/json">{"course":{"pfx":"ka","tag":"КА","name":"Компютърни архитектури","lecWord":"Лекция","testNames":["A","B","C"],"openMin":10,"secPerQ":60,"secPerTask":720,"taskWord":"Въпрос","tasksTitle":"Въпроси с отворен отговор (като на изпита)","tasksIntro":"Пишеш отговор в 3–4 изречения. След това виждаш примерния отговор и ключовите моменти, които трябва да съдържа (сайтът отбелязва кои си засегнал), и сам си поставяш точките 0–10. Въпросите с оранжев етикет са от реални изпити и контролни.","essayHint":"Отговор в 3–4 изречения: същност/определение, основните елементи или причини, предимство/недостатък или пример.","exam":{"q":0,"ptsQ":1,"tasks":10,"ptsTask":10,"minutes":120}},"lectures":[{"num":1,"title":"Лекция 1 — Въведение в дисциплината","short":"Въведение","summary":"### Същност на понятието „компютърна архитектура“\n- Няма **точно, ясно и еднозначно** определение — съдържанието на понятието се разширява заедно с развитието на компютрите.\n- **До началото на 70-те** години: архитектура = описание на **структурата на данните и регистрите**, необходими за изясняване на **набора команди** и тяхната интерпретация, т.е. минимумът познания за писане на програма на **асемблерен език**.\n- Разпространението на **виртуалната памет** и на средствата за разширение на **вход/изхода** увеличава броя блокове, които програмистът трябва да познава — само командният набор вече не стига.\n- Две по-широки (съвременни) определения:\n  - **Структурна организация** — компютърът е **съвкупност от функционални модули** и **връзките между тях**; съчетава се добре с технологията **VLSI** (всяка свръхголяма ИС = функционален модул).\n  - **Разпределение на функциите по нива** — точно определяне на **границите между нивата** и на **интерфейсите** между тях (кои функции се изпълняват над и под дадено ниво).\n- Обобщено: архитектурата е **абстрактно представяне на физическата система от гледна точка на програмиста** на асемблерен език или на **проектанта на компилатор** на език от високо ниво.\n- Архитектурата **НЕ се занимава** с управлението и предаването на данни **вътре в процесора** (схемотехника), с **конструктивните особености на логическите схеми** и с **технологията на производството** — това е организация и реализация.\n\n### Основни задачи при разработването на архитектура\nКласическите задачи се групират в **три групи**:\n\n| Група | Съдържание |\n|---|---|\n| **Представяне на програмата** | формат за представяне на програмата и **правила за интерпретацията** ѝ |\n| **Адресация на данните** | методите (способите), чрез които програмата указва операндите |\n| **Формати на данните** | типове и формати на обработваните данни |\n\n- При решаването им се конкретизират: **минималната област на паметта**, **кодовете на операциите** и **форматите на машинните команди**, способите за **адресация и защита на паметта**, механизмът за **управление на последователността** на изпълнение на командите, **интерфейсът с устройствата за вход/изход**.\n- Проектирането има **итеративен характер** — отделни или всички етапи се повтарят многократно до приемливо решение.\n- Проектантите вече не са само инженери по апаратура или програмисти: нужни са познания по **приложна математика, компютърни мрежи, интерфейси, системи за изчисления**.\n- Изисквания към новите компютри: **гъвкавост** (по технология и архитектура), **съвместимост** с нови технологии, **разширяемост**, способност да се **включват в стандартна мрежа**; важна роля играят **стандартите** (свързват оборудване от различни фирми — апаратно и програмно).\n\n### Вертикален разрез — нива на конвенционален компютър (фиг. 1-1)\nВертикалният разрез се отнася за **конвенционален (последователен, фон Нойманов)** компютър.\n\n| Ниво | Какво определя |\n|---|---|\n| **1** | кои функции изпълнява компютърът и кои „външният свят“ (програмист, оператор); интерфейси: **езици** и **системни програми** |\n| **2, 3, 4** | подравнища в програмното осигуряване — **„архитектура на програмното осигуряване“**: 2 — **транслатори**; 3 — бази данни, файлове, **виртуална памет**, мрежова телеобработка; 4 — управление на **оперативната и външната памет**, вътрешните процеси |\n| **5** | **граница между системното ПО (ОС) и апаратното осигуряване** (вкл. микропрограмното) |\n| **6** | **интерфейс на микропрограмното управление** — съгласуване на потока данни и управляващите сигнали с формата на микрокомандите |\n| **7** | разпределение на функциите между **ЦП** и **процесорите за вход/изход** |\n| **8** | интерфейс **ЦП — памет** |\n| **9, 10** | разграничаване между процесорите за в/и и **контролерите** — **„архитектура на физическия вход/изход“** |\n\n- **Нива 6 и 8** заедно = **„архитектура (организация) на процесора“**.\n- Ако процесор за в/и липсва, функциите на ниво 7 се разпределят между ниво 6 и нива 9–10.\n- **Ниво 5 — ключово:** преместено **нагоре** → **повече функции апаратно**, по-малък дял на ПО; **надолу** → повече функции **програмно**. Получават се компютри с **едни и същи функционални възможности, но различни характеристики** (бързодействие, цена, гъвкавост).\n- **Хоризонталният разрез** отразява архитектурата на **паралелния компютър** — разпределението на функциите между **група процесори** (понякога с различно предназначение) и **интерфейсите** им за взаимодействие.\n\n### Паралелна обработка в компютърните системи\n- Паралелната обработка е основно средство за **повишаване на производителността**: от едновременно изпълнение на независими задачи в многопроцесорна система до **конвейерна обработка** вътре в един процесор.\n- **Класификация на Флин** (1966) — по броя на **потоците команди и данни**:\n\n| Клас | Потоци | Пример |\n|---|---|---|\n| **SISD** | 1 команди, 1 данни | класически фон Нойманов компютър |\n| **SIMD** | 1 команди, много данни | векторни процесори, GPU |\n| **MISD** | много команди, 1 данни | теоретичен клас, ограничено приложение |\n| **MIMD** | много команди, много данни | многопроцесорни системи, многоядрени процесори |\n\n### Програмни нива на паралелната обработка\nПаралелизмът не е само апаратен — **компилаторите** разкриват паралелизъм в последователен код, а **ОС** и библиотеките го управляват.\n\n| Ниво | Същност | Средства |\n|---|---|---|\n| **ILP** — ниво команди | няколко команди едновременно | **конвейер**, множество функционални устройства; прозрачно при скаларните процесори, **явно** (от компилатора) при **VLIW** |\n| **TLP** — ниво нишки | различни нишки паралелно | **SMT/хипернишки** в едно ядро или отделни **ядра** |\n| **Ниво задачи** | цели задачи/програми на различни процесори | комуникация и синхронизация — **MPI, PVM** |\n\n- Изборът на ниво определя **изискванията към архитектурата, компилатора и ОС**.\n- В печатния учебник (тема 3) нивата са: **задания → програми → команди → машинна дума/аритметични операции** (от грубо към фино) — не ги бъркай с ILP/TLP терминологията, но те си съответстват (команди ≈ ILP, програми ≈ нишки/процеси, задания ≈ задачи).\n\n### Капани за изпита\n- **Архитектура ≠ организация/реализация.** Архитектурата е „как изглежда системата за програмиста/компилатора“; схемотехниката, логическите елементи и технологията на производство не са архитектура.\n- Двете съвременни определения: **структурна организация** (модули + връзки) и **разпределение на функциите по нива** (граници + интерфейси) — назовавай и двете.\n- Трите задачи: **представяне на програмата, адресация на данните, формати на данните** — често се забравя третата.\n- **Ниво 5** е границата **ОС ↔ апаратура**; движението нагоре = повече **апаратно**. Не обръщай посоката!\n- **Нива 6+8** = архитектура на процесора; **2–4** = архитектура на ПО; **9–10** = архитектура на физическия в/и.\n- **Вертикален разрез** = последователен (фон Нойманов) компютър; **хоризонтален** = паралелен.\n- MISD е практически празен клас; SIMD — векторни/GPU; MIMD — мултипроцесори.\n- ILP при скаларните/суперскаларните процесори е **скрит** от програмиста, а при **VLIW** се управлява **явно от компилатора**.\n- Изпитен отговор (3–4 изречения): **определение → основни елементи → пример/следствие**.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L01-A-1","n":1,"text":"Как се е разбирало понятието „архитектура на компютъра“ до началото на 70-те години?","opts":["Съвкупност от функционални модули и връзките между тях","Описание на данните и регистрите, нужни за набора команди","Разпределение на функциите между отделните нива","Технология на производство на логическите схеми"],"correct":1,"expl":"Тогава архитектурата е минимумът познания за писане на програма на асемблер — данни, регистри, команди."},{"id":"L01-A-2","n":2,"text":"Кое определение на архитектурата се съчетава добре с технологията VLSI?","opts":["Описание само на командния набор на процесора","Разпределение на функциите между ЦП и паметта","Описание на микропрограмите на управляващото устройство","Структурна организация от функционални модули и връзки"],"correct":3,"expl":"Всяка свръхголяма интегрална схема може да се разглежда като **функционален модул**."},{"id":"L01-A-3","n":3,"text":"Кое от изброените НЕ е предмет на компютърната архитектура?","opts":["Технологията на производство на логическите схеми","Форматите на машинните команди и кодовете на операциите","Методите за адресация и защита на паметта","Интерфейсът на компютъра с устройствата за вход/изход"],"correct":0,"expl":"Схемотехниката и технологията са въпрос на **реализация**, не на архитектура."},{"id":"L01-A-4","n":4,"text":"Кои са трите групи класически задачи при разработването на архитектура?","opts":["Технология, схемотехника, конструктивни особености","Кеш памет, шина, система за прекъсвания","Представяне на програмата, адресация, формати на данните","Компилатор, операционна система, приложни програми"],"correct":2,"expl":"Това са трите класически групи задачи според учебника."},{"id":"L01-A-5","n":5,"text":"Какъв характер има процесът на проектиране на компютърна архитектура?","opts":["Строго последователен — всеки етап се прави веднъж","Случаен — етапите нямат определен ред","Итеративен — етапите се повтарят многократно","Еднократен — решава се изцяло от компилатора"],"correct":2,"expl":"Отделни или всички етапи се повтарят до получаване на приемливо решение."},{"id":"L01-A-6","n":6,"text":"Ниво 5 във вертикалния разрез на компютъра представлява границата между:","opts":["Операционната система и апаратното осигуряване","Транслаторите и приложните програми","Централния процесор и паметта","Процесорите за вход/изход и контролерите"],"correct":0,"expl":"Ниво 5 разделя **системното ПО (ОС)** от апаратурата (вкл. микропрограмите)."},{"id":"L01-A-7","n":7,"text":"Какво следва, ако ниво 5 се премести нагоре?","opts":["Повече функции се реализират програмно","Компютърът губи функционални възможности","Изчезва нуждата от операционна система","Повече функции се реализират апаратно"],"correct":3,"expl":"Делът на програмното осигуряване намалява за сметка на апаратното."},{"id":"L01-A-8","n":8,"text":"Кои нива заедно се наричат „архитектура (организация) на процесора“?","opts":["Нива 2, 3 и 4","Ниво 6 и ниво 8","Нива 9 и 10","Ниво 1 и ниво 5"],"correct":1,"expl":"Ниво 6 — микропрограмно управление, ниво 8 — интерфейс ЦП–памет."},{"id":"L01-A-9","n":9,"text":"Какво отразява хоризонталният разрез на архитектурата?","opts":["Паралелен компютър — функции между група процесори","Последователен компютър на фон Нойман","Йерархията на програмното осигуряване","Разположението на блоковете върху кристала"],"correct":0,"expl":"Вертикалният разрез е за последователния компютър, хоризонталният — за паралелния."},{"id":"L01-A-10","n":10,"text":"Към кой клас по Флин спадат векторните процесори и GPU?","opts":["SISD","MISD","MIMD","SIMD"],"correct":3,"expl":"Един поток команди обработва едновременно много данни."}],"B":[{"id":"L01-B-1","n":1,"text":"Кое доведе до разширяване на понятието „архитектура“ отвъд командния набор?","opts":["Появата на езиците за програмиране от високо ниво","Намаляването на тактовата честота на процесорите","Виртуалната памет и средствата за вход/изход","Отказът от микропрограмното управление"],"correct":2,"expl":"Броят блокове, които програмистът трябва да познава, нараства."},{"id":"L01-B-2","n":2,"text":"От чия гледна точка архитектурата е абстрактно представяне на физическата система?","opts":["На програмиста на асемблер и проектанта на компилатор","На технолога, който произвежда интегралните схеми","На крайния потребител на готови приложни програми","На конструктора на печатните платки и захранването"],"correct":0,"expl":"Така учебникът обобщава понятието след разглеждане на нивата."},{"id":"L01-B-3","n":3,"text":"Кои нива се наричат обобщено „архитектура на програмното осигуряване“?","opts":["Нива 6 и 8","Нива 9 и 10","Нива 5 и 7","Нива 2, 3 и 4"],"correct":3,"expl":"Те разграничават подравнища вътре в ПО: транслатори, бази данни/виртуална памет, управление на паметта."},{"id":"L01-B-4","n":4,"text":"Какво определя ниво 7 във вертикалния разрез?","opts":["Интерфейса между централния процесор и паметта","Функциите на ЦП спрямо процесорите за вход/изход","Границата между ОС и апаратурата","Функциите на транслаторите"],"correct":1,"expl":"Ниво 7 разпределя функциите между ЦП и процесорите за вход/изход."},{"id":"L01-B-5","n":5,"text":"Какво представляват нива 9 и 10?","opts":["Архитектура на програмното осигуряване","Архитектура на физическия вход/изход","Интерфейс на микропрограмното управление","Връзка с „външния свят“ чрез езици"],"correct":1,"expl":"Разграничават функциите на процесорите за в/и и контролерите."},{"id":"L01-B-6","n":6,"text":"Ниво 2 във вертикалния разрез включва:","opts":["Управлението на виртуалната памет","Интерфейса ЦП — памет","Контролерите на външните устройства","Транслаторите"],"correct":3,"expl":"Ниво 2 — транслатори; ниво 3 — бази данни, файлове, виртуална памет."},{"id":"L01-B-7","n":7,"text":"Кое от изброените е изискване към съвременните компютри според учебника?","opts":["Да могат да се включват в стандартна мрежа","Да използват само микропрограмно управление","Да нямат съвместимост с предишни поколения","Да работят като отделно стоящи машини"],"correct":0,"expl":"Времето на отделно стоящите компютри е минало; важни са гъвкавост, съвместимост, разширяемост."},{"id":"L01-B-8","n":8,"text":"На кое ниво на паралелизъм работят MPI и PVM?","opts":["Ниво команди в конвейера на едно ядро","Ниво логически схеми на аритметичното устройство","Ниво задачи (процеси на различни процесори)","Ниво микрокоманди на управляващото устройство"],"correct":2,"expl":"MPI/PVM осигуряват комуникация и синхронизация между задачи на различни процесори."},{"id":"L01-B-9","n":9,"text":"Какво е ILP?","opts":["Паралелизъм на ниво нишки","Паралелизъм на ниво команди","Паралелизъм на ниво задания","Паралелизъм между компютри в мрежа"],"correct":1,"expl":"Instruction-Level Parallelism — конвейер, множество функционални устройства."},{"id":"L01-B-10","n":10,"text":"При коя архитектура паралелизмът на ниво команди се управлява явно от компилатора?","opts":["Класически CISC","SISD без конвейер","VLIW","Скаларен RISC"],"correct":2,"expl":"При VLIW компилаторът пакетира независими операции в една дълга команда."}],"C":[{"id":"L01-C-1","n":1,"text":"Кое твърдение за понятието „компютърна архитектура“ е вярно?","opts":["Определено е еднозначно от стандарт на IEEE","Обхваща само набора команди на процесора","Съвпада с технологията на производство","Няма точно и еднозначно възприето определение"],"correct":3,"expl":"Съдържанието на понятието се разширява заедно с развитието на компютрите."},{"id":"L01-C-2","n":2,"text":"Определението „разпределение на функциите по нива“ изисква точно да се определят:","opts":["Тактовата честота и захранването","Границите между нивата и интерфейсите им","Броят транзистори на всеки модул","Цената на всеки функционален блок"],"correct":1,"expl":"Установява се кои функции се изпълняват над и под нивото, после се определят интерфейсите."},{"id":"L01-C-3","n":3,"text":"Кое НЕ е задача, която се конкретизира при разработване на архитектурата?","opts":["Кодовете на операциите и форматите на командите","Способите за адресация и защита на паметта","Изборът на технология за производство на чипа","Интерфейсът с устройствата за вход/изход"],"correct":2,"expl":"Технологията е въпрос на реализация, не на архитектура."},{"id":"L01-C-4","n":4,"text":"С какво взаимодейства компютърът с „външния свят“ на ниво 1?","opts":["Езици и системни програми","Микрокоманди и фиксатори","Контролери и канали","Кеш памет и шина"],"correct":0,"expl":"Езици (за програмиране, на ОС, за бази данни) и системни програми (редактори, сортиране)."},{"id":"L01-C-5","n":5,"text":"Какво отразява ниво 6?","opts":["Интерфейса на микропрограмното управление","Границата между ОС и апаратурата","Функциите на транслаторите","Интерфейса с устройствата за вход/изход"],"correct":0,"expl":"Съгласува потока данни и управляващите сигнали с формата на микрокомандите."},{"id":"L01-C-6","n":6,"text":"Ако ниво 5 се премести надолу, то:","opts":["Повече функции се реализират апаратно","Делът на ПО намалява","Повече функции се реализират програмно","Изчезват нивата на микропрограмите"],"correct":2,"expl":"Надолу → по-голям дял на програмното осигуряване."},{"id":"L01-C-7","n":7,"text":"За какъв компютър се отнася вертикалният разрез на фиг. 1-1?","opts":["Паралелен компютър с разпределена памет","Конвенционален (последователен) компютър","Векторен суперкомпютър","Компютър с управление по потока данни"],"correct":1,"expl":"Вертикалният разрез съответства на класическия фон Нойманов компютър."},{"id":"L01-C-8","n":8,"text":"Кой клас по Флин е теоретичен и с ограничено практическо приложение?","opts":["SIMD","MIMD","SISD","MISD"],"correct":3,"expl":"Множество потоци команди над един поток данни почти не се среща на практика."},{"id":"L01-C-9","n":9,"text":"Паралелизмът на ниво нишки (TLP) се реализира чрез:","opts":["Конвейер от степени в АЛУ","Микропрограмно управление","Шина с по-голяма ширина","Хипернишки (SMT) или отделни ядра"],"correct":3,"expl":"Нишките работят паралелно в едно ядро (SMT) или на различни ядра."},{"id":"L01-C-10","n":10,"text":"Какво определя изборът на нивото, на което се реализира паралелизмът?","opts":["Изискванията към архитектурата, компилатора и ОС","Единствено тактовата честота на процесора","Единствено обема на оперативната памет","Единствено броя на изводите на корпуса"],"correct":0,"expl":"Всяко ниво има различни архитектурни и програмни изисквания."}]}},{"num":2,"title":"Лекция 2 — CISC и RISC архитектури. Шина","short":"CISC и RISC","summary":"### Принципи на фон Нойман и особености на съвременните компютри\n- Всички компютри се базират на двата принципа на **Джон фон Нойман** (40-те години):\n  - **принцип на програмното управление** — изпълнява се предварително съставена последователност от команди без намеса на оператора;\n  - **принцип на съхраняването на програмата в паметта** — програмата е в същата памет като данните.\n- Трите **основни отличия** на съвременните компютри:\n  1. **широко използване на процесори с RISC архитектура**;\n  2. **масово използване на паралелна обработка** на различни нива (особено **конвейерна**; за пръв път в IBM **Stretch** 1960 г., после CDC 6600; масово — с VLSI);\n  3. **шината** като основна среда за трансфер на информация.\n\n### CISC и RISC — история\n- **CISC** — Complex Instruction Set Computer (сложен набор команди); **RISC** — Reduced Instruction Set Computer (съкратен набор команди). Първоначално „Code“, заменено с „Computer“, защото архитектурата на процесора дава облика на целия компютър.\n- **Първите процесори са били от тип RISC**, но архитектурата бързо **мигрира към CISC**: за повишаване на бързодействието се добавят нови команди (апаратно или **микропрограмно**), приближаващи се към **примитивите на езиците от високо ниво**.\n- **Повторно появяване на RISC** — края на 70-те / началото на 80-те; теорията е на **Д. Петерсон (Бъркли)**.\n- Отправна точка: в CISC **60–80% от времето** на процесора отива за **малко на брой команди** — LOAD/STORE (обмен памет↔регистри), условни/безусловни **преходи**, **извикване на подпрограми**.\n- Идея на RISC: **минимално време за изпълнение на най-често използваните команди**; освен това сложната система команди изисква **големи системни издръжки**.\n- **Функционална еквивалентност**: функциите на рядко срещаните CISC команди се заменят с **последователност от RISC команди**.\n\n### CISC — особености, предимства, недостатъци\n| Особеност | CISC |\n|---|---|\n| Набор команди | голям, разнообразен, различна сложност |\n| Дължина на командите | **различна** (16–64 бита) |\n| Операнди | команди, работещи едновременно с **памет и регистри** |\n| Регистри | **малко** общи регистри |\n| Управление | сложно декодиране → **микропрограмно** управляващо устройство |\n| Тактове | **2–10+** на команда |\n\n- **Предимства:** **плътен код** (по-малко команди → по-малко памет за програмата), **обратна съвместимост** с наследения софтуер, близост до езиците от високо ниво.\n- **Недостатъци:**\n  - **сложно управляващо устройство** — заема голяма площ (**MC 68000** — първият 32-битов едночипов CISC — **50% от чипа**);\n  - **големи системни издръжки** и дълго проектиране;\n  - **бавно, многотактово изпълнение** и сложно декодиране;\n  - **трудна конвейеризация** заради неравномерната дължина и времетраене на командите;\n  - повечето сложни команди се използват **рядко** (60–80% от времето — малко прости команди).\n\n### RISC — изисквания към „чистата“ RISC архитектура\n| | Изискване |\n|---|---|\n| **а)** | командите се изпълняват за **еднакъв брой тактове** (идеално **1 такт**) |\n| **б)** | командите имат **един и същ (фиксиран) формат** |\n| **в)** | обръщение към паметта **само с LOAD и STORE** |\n| **г)** | всички аритметични и логически операции — **на ниво регистър** (регистър–регистър) |\n\n- **Най-често се нарушават а) и б).** Причини: сложните операции (умножение, деление, плаваща запетая) и обръщенията към паметта (особено при пропуск в кеша) **не могат физически да се изпълнят за 1 такт**; фиксираният формат **хаби памет** и затруднява кодирането на големи константи/адреси, затова се въвеждат **съкратени/променливи формати** за по-плътен код и съвместимост.\n\n### Последствия от изискванията\n- **а) и б)** → опростено управление, изключени сложни проблеми пред проектантите на апаратурата и **компилатора**; площта на УУ пада от **50% (MC 68000)** до **6% (RISC I)**; времето за разработка на УУ — **средно 2 пъти по-малко**; **просто и бързо декодиране**; изпълнение чрез **логически схеми, а не микропрограми**; естествена **конвейеризация**.\n- **в) и г)** → нужни са **много регистри**; операциите регистър–регистър са **2–4 пъти по-бързи от кеша** и **8–12 пъти по-бързи от ОП**.\n- Ранни RISC: **RISC II — 138**, **AMD 29000 — 192**, **Pyramid — 528** регистъра (поради липса на добри компилатори). По-късно броят **намалява**, защото:\n  1. **8 регистъра дават 80%** от бързодействието при неограничен брой регистри;\n  2. появяват се **регистрово оптимизиращи компилатори**.\n  (Много регистри → проблеми с управлението им и повече площ на кристала.)\n\n### Недостатъци на RISC\n- Регистровата архитектура **намалява натоварването на паметта за данни**, но **повишава изискваната пропускателна способност на паметта за команди** → **всеки RISC процесор има поне кеш за команди** (по-проста — само четене; по-висока вероятност за попадение заради по-добра **локалност** на командите).\n- За проста операция, правена с **една CISC команда**, са нужни **няколко RISC команди** → **по-голяма програма**, **повече обръщения към паметта** → по-ниска обща производителност. **RISC печели при отделна команда, но предимството намалява за цяла програма.**\n- **Пряка (покомандна) транслация** на CISC асемблерски/обектни програми в RISC е **нецелесъобразна** (силно удължава програмата) → нужна е **нова компилация** с RISC компилатор.\n\n### Сравнение CISC — RISC\n| Характеристика | CISC | RISC |\n|---|---|---|\n| Набор команди | голям | малък, редуциран |\n| Формат | променлив | фиксиран (обикновено 32 бита) |\n| Тактове/команда | 2–10+ | ~1 |\n| Достъп до памет | от много команди | само LOAD/STORE |\n| Регистри | малко | много |\n| Управляващо устройство | микропрограмно, ~50% площ | логически схеми, ~6% площ |\n| Конвейеризация | затруднена | естествена |\n| Размер на програмата | по-малък | по-голям |\n| Тежест | върху апаратурата | върху **компилатора** |\n| Примери | x86, Motorola 68k, VAX | ARM, MIPS, SPARC, RISC-V |\n\n### Шината — основна среда за трансфер\n- Въведена в средата на **60-те** от **DEC в PDP-8** като алтернатива на **канала** при големите машини; **проста и евтина** → първо в микро- и мини-компютрите, после навсякъде.\n- **Предимства:** простота, ниска цена, стандартизиран интерфейс, лесно добавяне на устройства.\n- **Основен недостатък — ниска пропускателна способност**; всички устройства я делят и при много устройства тя става **тясно място**.\n- **Методи за намаляване на недостатъка:**\n  1. **увеличаване на ширината** на шината;\n  2. **увеличаване на тактовата честота**;\n  3. **разделяне на шината / йерархия от шини** — конкурентен достъп и **множество едновременни транзакции**.\n\n| Година | Шина | Характеристики |\n|---|---|---|\n| 1981 | IBM PC шина | 8 бита, 4,77 MHz |\n| 1984 | **ISA** | 16 бита, 8 MHz, **16 MB/s** |\n| 1987 | **MCA** (IBM) | 16→32 бита, **несъвместима с ISA** |\n| 1988 | **EISA** | 32 бита, **33 MB/s** |\n| 1990 | Compaq **Flex/MP, TriFlex** | **първа йерархия** — процесорна шина (ЦП, кеш, ОП) отделена от EISA |\n| 1992 | **VESA VL-Bus** | 32 бита, **133 MB/s**; проблем с plug and play |\n| 1993 | **PCI** | 32 бита, 33 MHz; **междинно ниво** между процесорната шина и периферията |\n\n- Днес йерархията се реализира от **чипсета**: **северен мост** — ЦП, памет, графична карта (бързите компоненти); **южен мост** — дискове, USB, клавиатура, мишка и др.\n\n### Капани за изпита\n- „Чистата“ RISC = **четирите изисквания а)–г)**; нарушават се **а) и б)** — запомни и **причините** (сложни/многотактови операции, памет, плътност на кода).\n- **50% (MC 68000) срещу 6% (RISC I)** площ на управляващото устройство — класическият числов аргумент.\n- Регистрите: **2–4× по-бързо от кеш, 8–12× от ОП**; **8 регистъра → 80%** бързодействие.\n- Главният недостатък на RISC не е „бавни команди“, а **по-дълъг код** → повече обръщения към паметта; RISC е по-бърз **за отделна команда**, не непременно за **цяла програма**.\n- Недостатъкът на CISC не е „малко команди“, а **сложното УУ, микропрограмите, многотактовото изпълнение и трудната конвейеризация**.\n- **Първите процесори са били RISC-подобни** — RISC се „появява повторно“.\n- Шината: недостатък = **пропускателна способност**; методи = **ширина, честота, йерархия**.\n- При въпрос „сравнете“ — давай **таблична логика**: формат, тактове, памет, регистри, УУ, конвейер, размер на кода, роля на компилатора.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L02-A-1","n":1,"text":"Кои са двата принципа на фон Нойман, останали в основата на компютрите?","opts":["Конвейерна обработка и йерархична организация на паметта","Програмно управление и съхраняване на програмата в паметта","Микропрограмно управление и единен набор от команди","Паралелна обработка и обща шина за данни и команди"],"correct":1,"expl":"Това са принципът на програмното управление и на съхраняването на програмите в паметта."},{"id":"L02-A-2","n":2,"text":"Каква част от времето на CISC процесора отива за малък брой често използвани команди?","opts":["10–20%","30–40%","90–99%","60–80%"],"correct":3,"expl":"Наблюдението на Петерсон е отправната точка на RISC теорията."},{"id":"L02-A-3","n":3,"text":"Кое изискване НЕ е от изискванията към „чистата“ RISC архитектура?","opts":["Микропрограмно управляващо устройство","Еднакъв брой тактове за изпълнение","Достъп до паметта само чрез LOAD/STORE","Операции само на ниво регистър"],"correct":0,"expl":"RISC използва логически схеми вместо микропрограми."},{"id":"L02-A-4","n":4,"text":"Кои изисквания на RISC най-често се нарушават?","opts":["в) и г) — LOAD/STORE и регистрови операции","а) и в) — еднакви тактове и LOAD/STORE","а) и б) — еднакви тактове и еднакъв формат","б) и г) — еднакъв формат и регистрови операции"],"correct":2,"expl":"Сложните операции не стават за 1 такт, а фиксираният формат хаби памет."},{"id":"L02-A-5","n":5,"text":"Каква част от площта на чипа заема управляващото устройство при RISC I?","opts":["50%","25%","6%","80%"],"correct":2,"expl":"При CISC процесора MC 68000 — 50%, при RISC I — само 6%."},{"id":"L02-A-6","n":6,"text":"Колко пъти по-бързи са операциите регистър–регистър от операциите с оперативната памет?","opts":["8–12 пъти","2–4 пъти","50–100 пъти","1,5–2 пъти"],"correct":0,"expl":"2–4 пъти спрямо кеш паметта и 8–12 пъти спрямо ОП."},{"id":"L02-A-7","n":7,"text":"Защо броят на регистрите в по-късните RISC процесори намалява?","opts":["Регистрите не могат да работят на висока тактова честота при RISC","Форматът на LOAD/STORE командите не позволява адресиране на повече регистри","Кеш паметта за данни напълно заменя функциите на регистровия файл","8 регистъра дават 80% от бързодействието; има оптимизиращи компилатори"],"correct":3,"expl":"Двете причини от учебника: изследването за 8 регистъра и регистрово оптимизиращите компилатори."},{"id":"L02-A-8","n":8,"text":"Защо всеки RISC процесор има поне кеш памет за команди?","opts":["RISC командите се изпълняват директно от диска","Програмите са по-дълги и нараства трафикът към паметта за команди","Кешът за данни при RISC е технически невъзможен","Командите имат променлива дължина и трябва да се буферират"],"correct":1,"expl":"Регистровата архитектура разтоварва паметта за данни, но натоварва паметта за команди."},{"id":"L02-A-9","n":9,"text":"Коя фирма въвежда шината като среда за пренос на данни и команди и в кой компютър?","opts":["DEC в PDP-8","IBM в IBM PC","Intel в 8086","Compaq в DeskPro"],"correct":0,"expl":"В средата на 60-те години, като алтернатива на канала."},{"id":"L02-A-10","n":10,"text":"Кой е най-сериозният недостатък на шината?","opts":["Високата цена на реализацията","Сложността на проектирането ѝ","Невъзможността за стандартизация","Ниската пропускателна способност"],"correct":3,"expl":"Шината е проста и евтина, но с ниска пропускателна способност."}],"B":[{"id":"L02-B-1","n":1,"text":"Кое НЕ е от трите основни отличия на съвременните компютри според учебника?","opts":["Широко използване на процесори с RISC архитектура","Масово използване на паралелна обработка","Отказ от принципа за съхраняване на програмата в паметта","Шината като основна среда за трансфер"],"correct":2,"expl":"Принципите на фон Нойман остават в сила."},{"id":"L02-B-2","n":2,"text":"Защо архитектурата исторически мигрира от RISC към CISC?","opts":["Добавяли са се команди, близки до езиците от високо ниво","Регистрите са станали твърде скъпи за производство","Компилаторите не са могли да генерират RISC код","Конвейерната обработка изисквала сложни команди"],"correct":0,"expl":"Новите (апаратни или микропрограмни) команди е трябвало да повишат бързодействието."},{"id":"L02-B-3","n":3,"text":"Кой разработва теорията на компютрите със съкратен набор команди?","opts":["Джон фон Нойман, Принстън","Майкъл Флин, Станфорд","Джийн Амдал, IBM","Д. Петерсон, Бъркли"],"correct":3,"expl":"Теорията е от края на 70-те години в университета Бъркли."},{"id":"L02-B-4","n":4,"text":"Какво е характерно за командите на CISC процесорите?","opts":["Фиксиран формат и изпълнение за един такт","Различна дължина и изпълнение за 2–10 и повече такта","Достъп до паметта само чрез LOAD и STORE","Голям брой регистри и само регистрови операции"],"correct":1,"expl":"Останалите отговори описват RISC."},{"id":"L02-B-5","n":5,"text":"Кое е предимство на CISC архитектурата?","opts":["Малка площ на управляващото устройство върху чипа","По-плътен код — по-малко команди за дадена задача","Лесна конвейеризация поради еднаквата дължина","Голям брой общи регистри и регистрови операции"],"correct":1,"expl":"По-малко команди → по-малко памет за програмата."},{"id":"L02-B-6","n":6,"text":"До какво водят изисквания а) и б) на RISC архитектурата?","opts":["Голям брой регистри и операции регистър–регистър","По-къс програмен код и по-малко обръщения към паметта","Микропрограмно управление с по-малко микрокоманди","Опростено управление и бързо декодиране с логически схеми"],"correct":3,"expl":"Еднакви тактове и формат опростяват УУ и позволяват твърда логика."},{"id":"L02-B-7","n":7,"text":"Колко регистъра има процесорът AMD 29000?","opts":["192","138","528","32"],"correct":0,"expl":"RISC II — 138, AMD 29000 — 192, Pyramid — 528."},{"id":"L02-B-8","n":8,"text":"Защо RISC процесорът печели повече при отделна команда, отколкото при цяла програма?","opts":["RISC командите са с променлива дължина","RISC процесорите нямат кеш памет","Една CISC команда се заменя с няколко RISC команди","RISC командите се изпълняват микропрограмно"],"correct":2,"expl":"Програмата става по-дълга и обръщенията към паметта нарастват."},{"id":"L02-B-9","n":9,"text":"Кой е методът за намаляване на недостатъка на шината чрез „разделяне“?","opts":["Увеличаване на тактовата честота","Йерархия от шини с конкурентен достъп","Увеличаване на ширината на шината","Замяна на шината с канал"],"correct":1,"expl":"Разделянето позволява множество едновременни транзакции."},{"id":"L02-B-10","n":10,"text":"Какво свързва северният мост в чипсета?","opts":["Дисковете, USB и клавиатурата","Мрежовата карта и звуковата карта","Процесора, паметта и графичната карта","BIOS и часовника за реално време"],"correct":2,"expl":"Северният мост обслужва бързите компоненти, южният — останалите."}],"C":[{"id":"L02-C-1","n":1,"text":"Защо в съкращенията CISC/RISC думата Code е заменена с Computer?","opts":["Терминът Code е бил запазена търговска марка на IBM","RISC процесорите изобщо не използват машинен код","Командите на новите процесори не се кодират двоично","Архитектурата на процесора дава облика на целия компютър"],"correct":3,"expl":"Така пише в учебника — процесорът определя архитектурата на компютъра."},{"id":"L02-C-2","n":2,"text":"Кои команди заемат най-голямата част от времето на CISC процесора?","opts":["Сложни команди за обработка на символни низове","LOAD/STORE, преходи и извикване на подпрограми","Команди с плаваща запетая, умножение и деление","Команди за вход/изход и обработка на прекъсвания"],"correct":1,"expl":"Малко на брой прости команди заемат 60–80% от времето."},{"id":"L02-C-3","n":3,"text":"Колко време средно се спестява при разработката на управляващото устройство на RISC?","opts":["Около 10 пъти","Около 20%","Около 2 пъти","Не се спестява време"],"correct":2,"expl":"Учебникът посочва намаляване средно два пъти."},{"id":"L02-C-4","n":4,"text":"Какво постигат изисквания в) и г) на RISC?","opts":["По-бързи операции благодарение на голям брой регистри","Еднакво време за изпълнение и формат на всички команди","По-плътен машинен код и по-малки по обем програми","Микропрограмно изпълнение на сложните команди"],"correct":0,"expl":"Регистровите операции са 2–4 пъти по-бързи от кеша и 8–12 от ОП."},{"id":"L02-C-5","n":5,"text":"Колко регистъра дават 80% от бързодействието при неограничен брой регистри?","opts":["8","32","64","138"],"correct":0,"expl":"Това е едната от двете причини за намаляване на броя регистри."},{"id":"L02-C-6","n":6,"text":"Защо пряката транслация на CISC програми в RISC код е нецелесъобразна?","opts":["RISC процесорите не могат да изпълняват LOAD команди","CISC програмите използват повече регистри от RISC","Дължината на програмата силно нараства; нужна е нова компилация","Транслацията изисква микропрограмно управление в RISC"],"correct":2,"expl":"Структурата на командите е съществено различна — нужен е RISC компилатор."},{"id":"L02-C-7","n":7,"text":"Защо кеш паметта за команди е по-ефективна от тази за данни?","opts":["Тя е винаги по-голяма от кеша за данни","Тя е само за четене и локалността на командите е по-висока","Тя използва по-бърза технология от кеша за данни","Командите никога не се променят по време на работа"],"correct":1,"expl":"По-проста реализация и по-висока вероятност за попадение."},{"id":"L02-C-8","n":8,"text":"Кой е първият 32-битов едночипов процесор с CISC архитектура, даван за пример?","opts":["Intel 8086","VAX-11","RISC II","MC 68000"],"correct":3,"expl":"При него управляващото устройство заема 50% от чипа."},{"id":"L02-C-9","n":9,"text":"Каква е пропускателната способност на шината EISA?","opts":["16 MB/s","133 MB/s","8 MB/s","33 MB/s"],"correct":3,"expl":"ISA — 16 MB/s, EISA — 33 MB/s, VL-Bus — 133 MB/s."},{"id":"L02-C-10","n":10,"text":"Каква е ролята на PCI шината в йерархията на шините?","opts":["Междинно ниво между процесорната шина и периферията","Директно свързване на процесора с кеш паметта","Замяна на процесорната шина изцяло","Шина само за клавиатура и мишка"],"correct":0,"expl":"PCI развива идеята на Compaq за йерархия на шините."}]}},{"num":3,"title":"Лекция 3 — Въведение в паралелната обработка","short":"Паралелна обработка","summary":"### Необходимост от паралелна обработка\n- Цели на развитието на архитектурата: **производителност** и **надеждност**. Два **взаимно допълващи се** подхода:\n  1. **технологично усъвършенстване** — по-кратък цикъл на процесора: IBM 360/50 (1965) — **500 ns**, CRAY-1 (1976) — **12,5 ns**, CRAY X/MP (1982) — **9,5 ns**, днес ~**3 GHz**;\n  2. **организация на изчислителния процес** — **паралелни компютри**.\n- Първите ~30 години се „експлоатира“ основно първият подход, но той **изчерпва възможностите си** заради **крайната скорост на разпространение на сигнала (светлината)**.\n- Критерият на Хокни **„полупроизводителност“** (дължината на вектора, при която производителността пада наполовина) зависи от **архитектурата**, не от тактовата честота.\n- Идеята за паралелни изчисления е от **1842 г.** (ген. **Л. Менебрия**, съратник на Ч. Бабидж); интензивни изследвания — края на 50-те/60-те; реализация — с **VLSI и микропроцесорите**.\n\n**Предимства на паралелните компютри:**\n- **значително по-висока скорост** (GFLOPS и повече) — геофизика, молекулярна биология, моделиране на схеми, обработка на сигнали и изображения, финансово моделиране, бази данни;\n- **повишена надеждност** — дефектиралият процесор се изключва, а обработката продължава с **намалена скорост**;\n- **по-високо отношение производителност/цена** — като правило **с порядък** по-добро от последователните компютри.\n\n### Нива на паралелност (от грубо към фино)\n| Ниво | Поднива | Необходима апаратура |\n|---|---|---|\n| **Задания** | между заданията; между фазите на заданията | **многомашинна система** — несвързани/слабо свързани компютри; интересно за **системните администратори** |\n| **Програми** | между подпрограмите; **в границите на цикъл** | компютър с **няколко процесора**, взаимодействие чрез **обща памет** или **обмен на съобщения** |\n| **Команди** | между фазите на изпълнение на командите | **конвейерна обработка на командите** — паралелизъм от **ниско ниво** |\n| **Машинна дума / аритметични операции** | между елементите на **векторните операции**; **вътре в логическите схеми на АУ** | векторни компютри с **операционни конвейери**; практически всички процесори — „чисто последователен компютър няма“ |\n\n- Един компютър може да съчетава няколко нива — **паралелизъм в пространството** (много процесори) + **паралелизъм във времето** (конвейер) → ефектът се **мултиплицира**.\n\n### Оценка на производителността\n- **Коефициент на ускорение:** `S = T1 / TP`\n  - `T1` — време за решаване на задачата на **еднопроцесорен** компютър;\n  - `TP` — време на паралелен компютър с **P еднакви процесора**;\n  - смисъл има при **S > 1**; S отчита **архитектурата**, не технологията.\n- **Ефективност:** `E = S / P ≤ 1` — **средното натоварване** на процесорите; E → 1 означава, че всички процесори работят през цялото време.\n- **Реална зависимост S(P)** — три зони: **1)** близо до идеалното линейно нарастване; **2)** нарастването се забавя до **насищане**; **3)** S дори **намалява**. Причини: **разпределение на задачата**, **синхронизация**, **конфликти при достъп до общи ресурси** — допълнително време към изчислението.\n- **Мащабируем** е компютърът, работещ в зона 1 (и отчасти 2) — производителността расте **пропорционално (почти)** на броя процесори.\n\n### Модели на мащабируемостта\n**Закон на Амдал (1967) — задача, ограничена по размер (фиксиран размер):**\n- Аргументи: задачата има **последователна част** (обикновено **координацията** на изчислителния процес) и **паралелна част**; нормираме `ts + tp = 1` за **еднопроцесорното** време; паралелната част се дели на P процесора, последователната — не.\n- `S = (ts + tp) / (ts + tp/P) = 1 / (ts + tp/P)` → при `P → ∞`: **`S → 1/ts`**.\n- Пример: `P = 1024`, `ts = 0,01` → **S ≈ 91,18**, **E ≈ 0,089** — песимистичен резултат.\n- Извод: **последователната част ограничава отгоре ускорението**; производителността се определя от **задачата** (възможностите ѝ за паралелно решение), а не от броя процесори.\n- Скрито допускане: **tp не зависи от P** (размерът на задачата е фиксиран) — на практика рядко вярно.\n\n**Закон на Barsis / Gustafson (1987) — задача, ограничена по време (фиксирано време):**\n- Програмистът варира стъпките по време, мрежата, точността → задачата се **мащабира** така, че да се изпълнява за **фиксирано време**.\n- Нормировка `ts + tp = 1` за **паралелното** време → последователният компютър би работил `ts + P·tp`.\n- **`S = ts + P·tp`** — расте **почти линейно**. Пример: `P = 1024`, `ts = 0,01` → **S ≈ 1013,77**, **E ≈ 0,99**.\n- (В печатния учебник моделът е под името **Barsis**; на сайта — **Gustafson**; това е един и същ закон Gustafson–Barsis.)\n\n| | Амдал | Barsis/Gustafson |\n|---|---|---|\n| Фиксирано | **размерът на задачата** | **времето за изпълнение** |\n| Формула | `1/(ts + tp/P)` | `ts + P·tp` |\n| При P→∞ | `→ 1/ts` (насищане) | расте ~линейно |\n| Оценка | песимистична | оптимистична, по-реалистична |\n\n### Класификации на паралелните компютри\nИзисквания към добра класификация: **а)** да обхваща всички съществуващи (и бъдещи) архитектури; **б)** да **диференцира** съществено различните структури; **в)** да класифицира всеки компютър **еднозначно**.\n\n**Класификация на Флин (1966)** — базира се **не на структурата**, а на това как **командите се обвързват с обработката на данните**. **Поток** = последователност от елементи (команди или данни), обработвани от процесора; обработката се извършва при **срещата** на двата потока.\n\n| Клас | Същност | Примери | Проблеми |\n|---|---|---|---|\n| **SISD** | 1 поток команди, 1 поток данни; едно УУ + едно изпълнително устройство | фон Нойманов компютър | ограничена скорост — последователна обработка |\n| **SIMD** | 1 **векторен** поток команди, много потоци данни | CRAY-1, CRAY-2, CRAY X-MP, ILLIAC-IV, DAP, GPU | **а)** комуникация между процесорните елементи; **б)** съответствие **размер на вектора ↔ размер на масива от процесори**; **в)** **невекторни операции** и подготвителна работа; **г)** **бездействие на процесори при условни преходи** |\n| **MISD** | много потоци команди, 1 поток данни | условно — **конвейерът** (ако всеки етап е „отделна команда“), но по-естествено е към SIMD | практически празен клас |\n| **MIMD** | много независими потоци команди и данни; всеки процесор със **свое УУ и програма** | мултипроцесори, клъстери, матрици от процесори | **а)** **пренасяне на данни и команди** между процесорите — бавно, нужна сложна и скъпа **комуникационна мрежа**; **б)** **цената расте линейно**, а скоростта — много по-бавно заради **конфликти** при общите ресурси; **в)** нужда от **динамична реконфигурация** на ресурсите |\n\n- Достойнства: **проста, симетрична, ортогонална**, издържала изпитанието на времето. **Недостатък:** **прекалено широка** — в един клас попадат много различни архитектури (класифицира по потока информация, а не по архитектурни признаци).\n- Понятието „процесор“ при паралелните компютри е **размито** — от прост изчислителен елемент до цял компютър.\n\n**Разширения:**\n- **/B и /W** — обработка **по битове или по думи** → **8 класа** (напр. SIMD/B, MIMD/W).\n- **Foutain** — отчита **типа автономия**, **топологията** на свързване и **формата на данните**:\n  - **операционна** автономия — не всички процесори изпълняват една и съща команда (маска, регистър на разширения код на операцията, **MSIMD** с няколко контролера);\n  - **адресна** автономия — всеки процесор формира/модифицира **адреса локално**;\n  - **мрежова** автономия — графът на задачата се отразява ефективно в структурата на връзките.\n\n**Други класификации:**\n- **по функционално предназначение** — за инженерни (аритметични) изчисления / за изкуствен интелект и бази знания;\n- **по способа на управление** — **control driven** (командата определя следващата; най-разпространен), **data driven** (наличието на аргументите стартира командата), **demand driven** (командата се изпълнява, когато резултатът ѝ е нужен);\n- **по степен на свързаност** — **силно свързани** (обща шина; при много процесори шината е тясно място), **слабо свързани** (автономни компютри със собствена ОС), **мрежово свързани** (локална мрежа, пакети/съобщения);\n- **по степен на равноправие** — **автократични** (главен процесор) / **егалитарни** (всички равноправни);\n- по способа на **синхронизация** (ниво команди, ниво процедури).\n\n### От какво зависи производителността на паралелните компютри\n- **Задачата:** дял на **последователната част** (Амдал), вътрешен паралелизъм/**гранулярност** (груб/фин), тип аритметика, **размер**, метод на **декомпозиция**.\n- **Архитектурата:** **брой и мощност на процесорите**, **организация на паметта** (обща/разпределена), **комуникационна мрежа** (топология, пропускателна способност, латентност), отношение време за **комуникация / изчисление**.\n- **Организацията на изчислението:** **балансиране на натоварването**, **синхронизация**, разрешаване на **конфликти** при общите ресурси, ефективност на **ОС и компилатора**.\n\n### Разпределена обработка\n- **Изчислителни мрежи** от **териториално обособени**, автономни центрове, свързани с канали; информацията — в пакети/съобщения.\n- **Разпределена система** — компонентите са **относително зависими и локализирани** (части на едно цяло); **мрежа** — компонентите са **сложни и независими** машини.\n- „Интернет компютър“ (SETI@home, distributed.net, Mersenne) — програма с **най-нисък приоритет**, работи когато процесорът бездейства, невидима за потребителя.\n- **Правило:** задача, **ограничена по размер** → **разпределена** обработка; задача, **ограничена по време** → **централизирана** (суперкомпютър).\n\n### Капани за изпита\n- **Амдал** = **фиксиран размер**, граница **1/ts**; **Barsis/Gustafson** = **фиксирано време**, почти линейно. Не ги разменяй — и при двата `ts + tp = 1`, но за **различно** време (еднопроцесорно срещу паралелно).\n- При „обяснете аргументите“ на Амдал задължително: последователна част (координация), нормировка, формула, граница **1/ts**, числов пример (**91,18 / 0,089**), извод „решава задачата, не броят процесори“.\n- `E = S/P`, не `S/T`; S **≤ P** (идеално S = P).\n- Флин класифицира по **потоци команди и данни**, не по структурата; трябва да можеш да изброиш **проблемите на SIMD (4) и MIMD (3)**.\n- **MISD** — конвейерът само условно; по-естествено **SIMD**.\n- Нивата на паралелизъм са **четири** (задания, програми, команди, машинна дума) — всяко с **две поднива** (без командите).\n- Трите зони на S(P): **линейна, насищане, спад**.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L03-A-1","n":1,"text":"Кой е основният ограничаващ фактор за подхода „технологично усъвършенстване“?","opts":["Липсата на подходящи езици за програмиране","Крайната скорост на разпространение на сигнала","Високата цена на оперативната памет","Ниската надеждност на интегралните схеми"],"correct":1,"expl":"Скоростта на светлината (електричеството) поставя горна граница пред тактовата честота."},{"id":"L03-A-2","n":2,"text":"Как се определя ефективността на паралелен компютър с P процесора?","opts":["E = P / S","E = T1 · TP","E = TP / T1","E = S / P"],"correct":3,"expl":"Ефективността показва средното натоварване на процесорите и е ≤ 1."},{"id":"L03-A-3","n":3,"text":"Задача има 10% последователна част. Какво е ускорението по Амдал при P = 10?","opts":["≈ 5,26","≈ 9,10","10","≈ 2,50"],"correct":0,"expl":"S = 1/(0,1 + 0,9/10) = 1/0,19 ≈ 5,26."},{"id":"L03-A-4","n":4,"text":"Каква е максималната стойност на ускорението по Амдал при ts = 0,05?","opts":["5","95","20","Неограничена"],"correct":2,"expl":"При P → ∞, S → 1/ts = 1/0,05 = 20."},{"id":"L03-A-5","n":5,"text":"На кое ниво на паралелност се използва многомашинна система от слабо свързани компютри?","opts":["На ниво команди","На ниво машинна дума","На ниво задания","На ниво цикли"],"correct":2,"expl":"Паралелизмът между задания/фазите им изисква няколко отделни компютъра."},{"id":"L03-A-6","n":6,"text":"Въз основа на какво е изградена класификацията на Флин?","opts":["Обвързването на потоците команди с потоците данни","Физическата структура на връзките между процесорите","Броя на процесорите и типа на паметта","Тактовата честота и разрядността на процесора"],"correct":0,"expl":"Флин въвежда понятието „поток“ от команди и от данни."},{"id":"L03-A-7","n":7,"text":"Кое НЕ е проблем на SIMD компютрите според Флин?","opts":["Комуникация между изчислителните елементи","Бездействие на процесори при условни преходи","Наличие на невекторни операции в програмите","Линейно нарастване на цената с броя процесори"],"correct":3,"expl":"Линейното нарастване на цената е посочено като проблем на MIMD."},{"id":"L03-A-8","n":8,"text":"Какво предполага скрито законът на Амдал?","opts":["Последователната част намалява с броя процесори","Паралелната част tp не зависи от броя процесори","Времето за изпълнение е винаги константа","Комуникациите между процесорите са безплатни"],"correct":1,"expl":"Размерът на задачата е фиксиран — tp не се мащабира с P."},{"id":"L03-A-9","n":9,"text":"Кое разширение на класификацията на Флин дава 8 класа?","opts":["Обработка по битове (/B) или по думи (/W)","Разделяне по тип автономия на процесорите","Разделяне по способа на управление","Разделяне по степен на свързаност"],"correct":0,"expl":"Четири класа × два начина на обработка = 8 класа."},{"id":"L03-A-10","n":10,"text":"Кога според учебника е по-добре да се използва разпределена обработка („Интернет компютър“)?","opts":["Когато задачата е ограничена по време","Когато задачата е изцяло последователна","Когато е нужна минимална латентност","Когато задачата е ограничена по размер"],"correct":3,"expl":"За задачи, ограничени по време — централизиран суперкомпютър."}],"B":[{"id":"L03-B-1","n":1,"text":"Кое НЕ е предимство на паралелните компютри спрямо последователните?","opts":["Значително по-висока скорост на обработка","Повишена надеждност при отказ на процесор","По-просто програмиране на приложенията","По-високо отношение производителност/цена"],"correct":2,"expl":"Програмирането на паралелни компютри е по-сложно, не по-просто."},{"id":"L03-B-2","n":2,"text":"Какво означава коефициентът на ускорение S = T1/TP?","opts":["Отношение на времето на един процесор към времето на P процесора","Отношение на броя процесори към времето на изпълнение","Отношение на тактовата честота към броя на процесорите","Отношение на времето на P процесора към времето на един"],"correct":0,"expl":"T1 — време на еднопроцесорен компютър, TP — на паралелен с P процесора."},{"id":"L03-B-3","n":3,"text":"Каква е стойността на S по Амдал при P = 1024 и ts = 0,01?","opts":["≈ 1013,77","≈ 100,00","≈ 9,12","≈ 91,18"],"correct":3,"expl":"S = 1/(0,01 + 0,99/1024) ≈ 91,18; E ≈ 0,089."},{"id":"L03-B-4","n":4,"text":"Какво описва законът на Barsis (Gustafson)?","opts":["Ускорение при фиксиран размер на решаваната задача","Ускорение при фиксирано време и мащабируема задача","Пропускателната способност на общата системна шина","Вероятността за попадение в кеш паметта на процесора"],"correct":1,"expl":"S = ts + P·tp — расте почти линейно с P."},{"id":"L03-B-5","n":5,"text":"По Barsis/Gustafson, при ts = 0,1 и P = 10, ускорението е:","opts":["5,26","9,1","10","1,9"],"correct":1,"expl":"S = ts + P·tp = 0,1 + 10·0,9 = 9,1."},{"id":"L03-B-6","n":6,"text":"Какво се случва в третата зона на реалната зависимост S(P)?","opts":["S нараства линейно с P","S е точно равно на P","S нараства по-бързо от P","S намалява с увеличаване на P"],"correct":3,"expl":"Режийните разходи (синхронизация, конфликти) надвишават печалбата."},{"id":"L03-B-7","n":7,"text":"Кой клас по Флин включва мултипроцесорни конфигурации от независими компютри?","opts":["MIMD","SIMD","MISD","SISD"],"correct":0,"expl":"Всеки процесор има свое УУ и изпълнява собствена програма."},{"id":"L03-B-8","n":8,"text":"Към кой клас по-естествено се отнася конвейерът според учебника?","opts":["MISD","SISD","SIMD","Не се класифицира"],"correct":2,"expl":"Може условно да е MISD, но по-естествено принадлежи към SIMD."},{"id":"L03-B-9","n":9,"text":"Каква автономия позволява на всеки процесор в SIMD компютъра да формира адреса локално?","opts":["Операционна","Адресна","Мрежова","Функционална"],"correct":1,"expl":"Облекчава програмирането — процесорите не са длъжни да четат една и съща клетка."},{"id":"L03-B-10","n":10,"text":"При какъв способ на управление командата се изпълнява, когато аргументите ѝ са налични?","opts":["Control driven (по потока управляващи оператори)","Demand driven (по потока заявки)","Data driven (по потока данни)","Interrupt driven (по прекъсвания)"],"correct":2,"expl":"При demand driven — когато резултатът е нужен на друга команда."}],"C":[{"id":"L03-C-1","n":1,"text":"Как се изменя тактовият цикъл от IBM 360/50 (1965) до CRAY-1 (1976)?","opts":["От 50 ns до 9,5 ns","От 500 ns до 1 ns","От 100 ns до 12,5 ns","От 500 ns до 12,5 ns"],"correct":3,"expl":"IBM 360/50 — 500 ns, CRAY-1 — 12,5 ns, CRAY X/MP — 9,5 ns."},{"id":"L03-C-2","n":2,"text":"На кое ниво на паралелност е паралелизмът в границите на оператор за цикъл?","opts":["На ниво задания","На ниво програми","На ниво команди","На ниво машинна дума"],"correct":1,"expl":"Нивото програми има поднива: между подпрограмите и в рамките на цикъл."},{"id":"L03-C-3","n":3,"text":"Задача с 20% последователна част се изпълнява на 4 процесора. Каква е ефективността по Амдал?","opts":["0,8","0,5","0,625","2,5"],"correct":2,"expl":"S = 1/(0,2 + 0,8/4) = 2,5; E = 2,5/4 = 0,625."},{"id":"L03-C-4","n":4,"text":"Кой е източникът на последователната част на задачата според аргументите на Амдал?","opts":["Координацията на целия изчислителен процес","Входно-изходните операции с диска","Аритметиката с плаваща запетая","Кеш пропуските при достъп до паметта"],"correct":0,"expl":"Последователната част обикновено е свързана с координацията."},{"id":"L03-C-5","n":5,"text":"Кое е вярно за ускорението по Амдал при неограничено увеличаване на P?","opts":["Клони асимптотично към 1/ts","Нараства линейно без граница","Клони към P·tp","Клони към нула"],"correct":0,"expl":"Последователната част ограничава ускорението отгоре."},{"id":"L03-C-6","n":6,"text":"Кой е основният недостатък на класификацията на Флин?","opts":["Не обхваща последователните (фон Нойманови) компютри","Класифицира един и същ компютър в няколко класа","Прекалено широка е — различни архитектури в един клас","Базира се единствено на тактовата честота"],"correct":2,"expl":"Класифицира по потока информация, а не по архитектурни признаци."},{"id":"L03-C-7","n":7,"text":"Кой проблем е общ за MIMD компютрите?","opts":["Съответствие между размера на вектора и масива","Пренасяне на данни и команди между процесорите","Бездействие на процесорите при условни преходи","Обработка на невекторни операции"],"correct":1,"expl":"Останалите са проблеми на SIMD."},{"id":"L03-C-8","n":8,"text":"Какво е характерно за силно свързаните системи?","opts":["Всеки компютър има собствена ОС","Свързани са чрез локална мрежа с пакети","Нямат никакви общи ресурси","Процесорите са обединени чрез обща шина"],"correct":3,"expl":"При много процесори общата шина става тясно място."},{"id":"L03-C-9","n":9,"text":"Какво отличава „егалитарните“ от „автократичните“ системи?","opts":["Има един главен управляващ процесор","Процесорите са свързани чрез шина","Използват управление по потока данни","Всички процесори са равноправни"],"correct":3,"expl":"При автократичните един процесор е главен."},{"id":"L03-C-10","n":10,"text":"Какво показва ефективност E, близка до 1?","opts":["Почти всички процесори работят през цялото време","Ускорението е близко до 1","Последователната част е близка до 1","Паралелният компютър е по-бавен от последователния"],"correct":0,"expl":"E е средното натоварване на процесорите."}]}},{"num":4,"title":"Лекция 4 — Принципи на конвейерната обработка","short":"Конвейерна обработка","summary":"### Същност на конвейерната обработка\n- Конвейерната обработка е средство за повишаване на производителността на процесора чрез **паралелизъм по време** (съвместяване във времето); смята се за **естествено развитие на фон Ноймановата архитектура**.\n- **Базовата функция** се разделя на малки части — **подфункции**, всяка от които се изпълнява от отделен апаратен блок — **степен** на конвейера.\n- Командите/данните се придвижват през степените като изделия по физически конвейер; **на всеки такт** в конвейера влиза нов елемент и (след запълването) излиза един резултат.\n- **Скоростта на конвейера не зависи от дължината му (броя степени)**, а от скоростта, с която се подават нови обекти на входа, т.е. от **времето за обработка в една степен — обикновено най-бавната**. Тя определя **такта** на конвейера.\n- Първа реализация: IBM **Stretch** (1960), после **CDC 6600**; масово — с **VLSI**.\n\n### Пример: тристепенен конвейер за събиране на вектори с плаваща запетая\nПодфункции:\n1. **сравнение (изравняване) на порядъците** и изместване надясно на мантисата на числото с по-малък порядък;\n2. **сумиране на мантисите**;\n3. **нормализация** на резултата.\n\n- 1-ви такт: първата двойка е в степен 1; 2-ри: тя е в степен 2, а втората двойка — в степен 1; 3-ти: първият резултат се формира в степен 3; от **4-ти такт** нататък конвейерът работи с пълна мощност и на всеки такт излиза резултат.\n- За **n** елемента: **n + 2** такта вместо **3n** при последователна обработка.\n- (Броят подфункции за събиране с ПЗ е различен: IBM 360/91 — 2, TI ASC — 6.)\n\n### Оценка на ускорението\n- `S = T1 / TP` (T1 — тактове при последователна обработка, TP — при конвейерна).\n- Тристепенен: `S = 3n / (n + 2)` → 3 при n → ∞.\n- **L степени:** `S = L·n / (L + n − 1)` → **L** при n → ∞.\n  - `L` — брой степени, `n` — брой обработвани елементи (дължина на вектора), `L + n − 1` — тактове за конвейерната обработка (L − 1 такта за **запълване** + n резултата).\n- **Конвейерът е особено подходящ за дълги вектори**; при малко n голяма част от времето отива за запълване и изпразване.\n- С **време за инициализация** (операционен конвейер, лаб. упр. 5): `t(n) = t_init + (L + n − 1)·tc`, `σ = t_init / tc`, `S ≈ L·n / (σ + L + n − 1)`, `E = S/L = n / (σ + L + n − 1)`, минимална дължина на вектора за ефективност E₀: `n_min = E₀(σ + L − 1)/(1 − E₀)`.\n- Теоретичният такт `tc = t_операция / L` не се достига при голямо L — **всяка степен добавя постоянен overhead** (фиксатори/латчове, управление, синхронизация), чийто относителен дял расте с L.\n\n| Пример | Сметка | S |\n|---|---|---|\n| L = 3, n = 10 | 30 / 12 | 2,5 |\n| L = 4, n = 12 | 48 / 15 | 3,2 |\n| L = 5, n = 100 | 500 / 104 | ≈ 4,81 |\n\n### Определение и условия за конвейерна обработка\n**Конвейерност** означава съвместяване във времето на различни действия по изчисляването на базовите функции **за сметка на разбиването им на подфункции**. Необходими са **пет условия**:\n1. Изчислението на базовата функция е **еквивалентно на последователност от подфункции**.\n2. **Входните величини** на всяка подфункция са **изходни величини на предходната**.\n3. **Няма други взаимодействия** между подфункциите освен входните/изходните величини.\n4. **Всяка подфункция се реализира от отделен апаратен блок.**\n5. Апаратните блокове изразходват **приблизително еднакво време**.\n\n- **Степен = логика (Л) + фиксатор (Ф)**: логиката извършва операциите на подфункцията; **фиксаторът** е **свръхбърза памет**, подаваща данните към следващата степен **в строго определен момент** → конвейерът е **синхронно** изчислително устройство.\n\n### Конвейер срещу препокриване на операциите\nАко дори едно условие не е изпълнено, правилният термин е **препокриване на операциите (overlapping)**. Ефектът е същият (по-малко време), но средствата са различни. Препокриване има, когато:\n- между обработките има **зависимост** освен предаването на данни;\n- за всяка обработка е нужна **различна верига от подфункции**;\n- подфункциите са **твърде различни** по назначение;\n- времето на всяка степен **не е постоянно**.\n\nПример: **препокриване на вход/изход с изчисленията** — ЦП (степен 1), процесор за в/и (степен 2), **оперативната памет играе ролята на фиксатор**; има неизползвано време.\n\n### Видове конвейери\n| Критерий | Видове | Характеристика |\n|---|---|---|\n| Брой функции | **еднофункционален** | един тип базова функция, проста фиксирана структура |\n| | **многофункционален** | функции от различни типове; освен вход за данни има **управляващ вход** |\n| Честота на смяна на функцията (за многофункционален) | **статичен** | смяната е **рядка**, под явно управление на **програмата** — напр. **аритметичният конвейер на векторния процесор** |\n| | **динамичен** | смяната е **честа, непрекъсната** — **конвейер за команди**; реализацията му е **скрита** от програмиста; използва се в повечето процесори |\n| Пътища на данните | **еднолинеен (еднопътен)** | данните минават по **един фиксиран маршрут** независимо от операцията |\n| | **многолинеен (многопътен)** | **различни пътища** за различните операции (селектори) |\n\n- **Недостатък на многофункционалния многопътен конвейер — лошо използване на блоковете**: в примера (събиране/умножение на цели и реални числа) няма операция, която да използва всички блокове; блокове 1, 4, 5 са заети **50%**, блокове 2, 3 — **25%** → **средно натоварване 40%** при равновероятни операции.\n\n### Проблеми на конвейерната обработка\n- **Прекъсванията** — асинхронни спрямо програмата, а в конвейера едновременно има фрагменти от няколко команди/операнди на различни стадии. Трудности: **1)** къде (след коя степен) да се постави **форсираният преход** към обработката; **2)** как точно да се **възстанови** прекъснатата програма. Задълбочават се с **увеличаване на броя степени**.\n- **Задръжки (hazards)** — пречат на конвейера да работи с максимална скорост:\n  - **структурни задръжки = стълкновения (collisions)** — два фрагмента данни се опитват **едновременно да използват една степен** (напр. „сумиране с ПЗ“, следвано от „сумиране с ФЗ“ в многопътния конвейер — и двете искат степен 4). **Поддават се на аналитично решение** и се отстраняват **още при проектирането**;\n  - **задръжки, зависещи от данните** — това, което става в една степен, определя дали данните могат да минат през други (напр. две степени искат **общата памет** и едната „работи напразно“). **Не се поддават на аналитично изследване** — зависят от конкретните данни.\n- **Междукомандни зависимости** — при конвейер за команди съседните команди влияят на операндите/резултатите си: напр. **i-тата команда чете елемент, а (i+1)-вата го изменя**. С повече степени в конвейера има повече команди едновременно и проблемът се **задълбочава** (подробно — в Тема 5). На сайта са наречени „командни зависимости (control hazards)“ — в учебника терминът е **междукомандни зависимости**.\n- **Запълване на конвейера** — ако дължината на вектора е **съизмерима с броя степени** или в програмата има **чести команди за преход**, степените стоят незаети или изпълняват ненужни команди → **S → L** се постига само при дълги непрекъснати потоци.\n\n### Конвейерът в класификациите\n- Конвейерът = **паралелизъм във времето**; многопроцесорността = **паралелизъм в пространството**.\n- По Флин: условно **MISD** (ако всеки етап е „отделна команда“), но по-естествено **SIMD** (по отношение на векторните операции).\n- **Петстепенен RISC конвейер**: IF → ID → EX → MEM → WB.\n\n### Капани за изпита\n- Скоростта на конвейера се определя от **най-бавната степен**, не от броя степени.\n- **Пет условия** — изброявай ги **всичките** и добави: „ако едно не е изпълнено → **препокриване**“.\n- **S = L·n/(L + n − 1)**, граница **L**; не бъркай с `n + L` или `L·n`. Тактовете са **n + L − 1**.\n- **Статичен** = векторен аритметичен (рядка смяна, под програмата); **динамичен** = команди (честа смяна, скрит).\n- **Структурните** задръжки (стълкновения) се решават **при проектирането** (аналитично); **зависещите от данните** — **не** могат аналитично.\n- Многопътен конвейер → **40%** средно натоварване.\n- Степента е **Л + Ф** (логика + фиксатор) → **синхронно** устройство.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L04-A-1","n":1,"text":"Какъв вид паралелизъм въвежда конвейерната обработка?","opts":["Паралелизъм в пространството","Паралелизъм по време","Паралелизъм на ниво задания","Паралелизъм между компютри"],"correct":1,"expl":"Различни етапи на различни операции се съвместяват във времето."},{"id":"L04-A-2","n":2,"text":"От какво се определя скоростта на работа на конвейера?","opts":["От общия брой степени на конвейера","От дължината на обработвания вектор","От броя на функциите, които изпълнява","От времето за обработка в най-бавната степен"],"correct":3,"expl":"Скоростта не зависи от дължината на конвейера, а от най-бавната степен."},{"id":"L04-A-3","n":3,"text":"Колко такта са необходими на тристепенен конвейер за събиране на два вектора с n елемента?","opts":["n + 2","3n","n + 3","3n − 2"],"correct":0,"expl":"Два такта за запълване + по един резултат на такт."},{"id":"L04-A-4","n":4,"text":"Какво е ускорението на конвейер с L = 4 с
