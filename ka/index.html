на общата шина за данни (CDB) при Томасуло?","opts":["Пренася командите от буфера към декодера","Свързва процесора с оперативната памет и кеша","Предава таблицата на ФУ към централния контролер","Излъчва резултата с тага до всички чакащи RS и регистри"],"correct":3,"expl":"**CDB** разпространява резултата едновременно до всички, чакащи този таг."},{"id":"L06-C-4","n":4,"text":"Как се решава проблемът с няколко условни прехода в една дълга команда (TRACE)?","opts":["Чрез изпълнение на преходите в отделен процесор","Чрез забрана за повече от един преход в думата","Чрез схема на приоритети по реда в изходната програма","Чрез апаратно предсказване на всеки от преходите"],"correct":2,"expl":"В компютрите **TRACE** е въведена **схема на приоритети** между преходите."},{"id":"L06-C-5","n":5,"text":"Каква е дължината на дългата дума на Transmeta Crusoe TM5700/TM5900?","opts":["128 бита","256 бита","64 бита","512 бита"],"correct":0,"expl":"Crusoe — **128 бита** (до 4 x86 команди); Efficeon TM8800 — 256 бита."},{"id":"L06-C-6","n":6,"text":"Колко степени има конвейерът на Itanium 2 според учебника?","opts":["14","28","5","8"],"correct":3,"expl":"IA-64 — **8-степенен** конвейер, 2 EPIC команди за такт."},{"id":"L06-C-7","n":7,"text":"С какво процесорът с множество ФУ се различава от векторния процесор?","opts":["Използва само адресация памет-памет","Изисква данните да са във вид на вектори","Не изисква регулярност на данните","Работи само с числа с плаваща запетая"],"correct":2,"expl":"Множеството ФУ дава максимална производителност и при **скаларни** операции."},{"id":"L06-C-8","n":8,"text":"Кое НЕ е характеристика на VLIW архитектурата?","opts":["Предварително известен брой цикли за операция","Динамично планиране на командите от апаратурата","Единствен програмен брояч за всички ФУ","Конвейерна работа на всяко от ФУ"],"correct":1,"expl":"VLIW използва **статично** планиране от компилатора."},{"id":"L06-C-9","n":9,"text":"Какво означава ILP?","opts":["Паралелизъм между процесори с обща памет","Паралелизъм при обработка на вектори в конвейер","Паралелизъм между независими програми (задачи)","Паралелизъм на ниво команди, невидим за потребителя"],"correct":3,"expl":"**Instruction Level Parallelism** — реализира се и при апаратна, и при програмна синхронизация."},{"id":"L06-C-10","n":10,"text":"Защо TTA процесорът може да работи с висока тактова честота?","opts":["Изпълнява и двата пътя на всеки условен преход","Всички ФУ се синхронизират от една обща таблица","Тактът е ограничен само от трансфер между два регистъра","Използва кеш за следите с декодирани команди"],"correct":2,"expl":"Долната граница на такта е **времето за трансфер** по транспортната мрежа."}]}},{"num":7,"title":"Лекция 7 — Векторни процесори","short":"Векторни процесори","summary":"### Два подхода за обработка на масиви от данни\n- Приложения: обработка на изображения, сеизмични данни, управление на ядрени реактори, прогноза на климата.\n- **Съвместяване по време (конвейеризация)** на командите, обработващи вектори → **векторни процесори / векторни компютри** (CRAY-1, CRAY-2, CRAY X-MP, Fujitsu VP-200, Hitachi S810, NEC SX, IBM 3090).\n- **Пространствено повторение** — много процесори, най-често свързани в матрица, изпълняват една команда → **SIMD / матрични процесори** (тема 8).\n- Двата класа изискват **съвсем различни методи и алгоритми** за програмиране.\n- История: първите успешни — **CDC Cyber 100** и **TI ASC** (адресация **памет-памет**); **CRAY-1 (1974)** въвежда **8 векторни регистъра × 64 думи × 64 бита**; Cray става синоним на суперкомпютър; Fujitsu, Hitachi, NEC — регистрово ориентирани решения.\n\n### Основни понятия\n- **Вектор** — набор от скаларни данни **от един и същ тип**, съхранявани в паметта с **фиксирано адресно нарастване** между съседните елементи — **стъпка**.\n- **Векторна обработка** — аритметични/логически операции, приложени върху цели вектори.\n- **Векторизация** — преобразуване от скаларен във векторен код; извършват я **векторизиращи компилатори**.\n- Скаларен процесор: `for (i = 0; i < n; i++) c[i] = a[i] + b[i];` — всяка итерация минава през конвейера за команди.\n- Векторен процесор: **C = A + B** — **една команда**, декодира се **веднъж**; конвейерът се прилага **върху данните** (операционен/аритметичен конвейер), не само върху командите.\n- Аритметичният конвейер на векторния процесор е **статичен** многофункционален конвейер (функцията се сменя рядко, под управление на програмата).\n\n### Видове векторни процесори\n| | Пълен векторен процесор | Присъединен векторен процесор |\n|---|---|---|\n| Същност | интегрирано устройство (векторен **компютър**) за вектори **и** скалари | специализирано устройство към скаларен компютър |\n| Връзка | вътрешна | чрез **канал**; скаларният компютър го вижда като **периферно устройство** |\n| Производителност | по-висока | по-ниска — бавен обмен през канала |\n| Цена | по-висока | **значително по-ниска**; включва се при нужда от матрични задачи |\n\n### Структура на векторния процесор\n- Хардуерни ресурси: **векторни регистри**, **функционални конвейери**, обработващи елементи, **броячи** за векторните операции; управляващо устройство (УУ) и **скаларно устройство** (RISC процесор).\n- **Векторни регистри** — бърза вътрешна памет; всеки с **два входа за четене и един за запис**; дължина **64–2048 думи** (обикновено по 64 бита).\n- **Функционални конвейерни устройства ADD, MULT, DIV** — специализирани, стартират нова операция **на всеки такт**.\n- **LOAD / STORE** — пренос на вектори между регистрите и паметта.\n- **MASK** + регистър на маската — двоичен вектор за адресиране на **разредени** вектори/матрици.\n\n### Изисквания към паметта\n- Конвейерът дава резултат на всеки такт → паметта трябва да поддържа **непрекъснат поток** от данни.\n- За **C = A + B** на такт: 2 четения + 1 запис → лента на пропускане **≥ 3 пъти** по-широка от скаларния случай.\n- Решения: **разслоена памет** (независими модули, конкурентен достъп) и **вътрешна високоскоростна памет** (аналог на кеша; векторни регистри).\n\n### Нива на паралелизъм / конвейерна обработка\n| Учебник (нива на паралелизъм) | Лабораторно упражнение 5 (нива на конвейерна обработка) |\n|---|---|\n| 1) конвейерно изпълнение на аритметичните операции **във всяко ФУ** и **между ФУ** | 1) **конвейер за команди** — векторните команди се извличат, декодират, изпълняват конвейерно |\n| 2) **конвейерно изпълнение на векторната команда** | 2) **операционен (аритметичен) конвейер** — елементите на векторите минават през степените на ФУ |\n| 3) паралелно изпълнение на **независими векторна и скаларна** команда | 3) **макроконвейер** — последователно свързани операционни конвейери (съставни команди) |\n\n### Производителност на операционния (векторен) конвейер\n- Време: **t(n) = t_init + (L + n − 1)·tc** (L — брой степени, n — брой елементи, tc — такт, t_init — инициализация).\n- **σ = t_init / tc**; ускорение спрямо неконвейерно АЛУ: **S ≈ L·n / (σ + L + n − 1)** → при n → ∞ **S → L**.\n- Ефективност: **E = S / L = n / (σ + L + n − 1)**.\n- Минимална дължина за желана ефективност E₀: **n_min = E₀·(σ + L − 1) / (1 − E₀)**.\n- Пример: L = 5, σ = 4, n = 64 → S ≈ 4,44, E ≈ 0,89; за E₀ = 0,8 → n_min = 32.\n- С нарастване на L тактът не намалява пропорционално (постоянни загуби във фиксаторите) и расте σ.\n\n**Фактори за по-висока производителност и ефективност на конвейерите за данни:**\n1. **Дълги вектори** (n ≫ σ + L) — амортизира се запълването и инициализацията; късите вектори са неефективни.\n2. **Малко σ** — данни във **векторните регистри**, бърза **разслоена** памет с достатъчна лента, стъпка 1 (без конфликти в модулите).\n3. **Брой степени L** — по-високо пределно ускорение (S → L), но по-голямо σ + L.\n4. **Брой паралелни конвейери k** — почти k пъти при дълги вектори.\n5. **Съставни (сцепени) команди / макроконвейер** — без междинен запис в паметта, σ се плаща веднъж.\n6. Без условни преходи и зависимости между последователни векторни операции.\n\n### Векторни команди — кодове на операциите\nБроят на векторните кодове е **2–3 пъти** по-голям от скаларните, защото:\n1. „Векторно събиране“ е група команди: **cᵢ = aᵢ + bᵢ**, **cᵢ = cᵢ + s**, редукция **s = Σaᵢ**, **s = s + aᵢ + bᵢ**.\n2. **Съставни команди** — комбинират най-честите последователности: **V = S·V + S·V**, **V = V·V + V·V**, **V = V + S·V**.\n3. Нови специфични команди: „**Сравни два вектора за равенство**“, „**Провери вектора за нулев елемент**“ → двоичен резултатен вектор.\n\n### Съставни (сцепени) векторни команди\n- Изискват **паралелна и/или последователна** работа на няколко аритметични конвейера; структурата им **зависи от конкретния процесор**.\n- **Макроконвейер**: изходът на един конвейер (например събиране) отива **директно** на входа на следващия (умножение) — **без запис в паметта**.\n\n| Предимства | Недостатъци |\n|---|---|\n| няма междинен запис/четене от паметта → по-малък трафик | по-сложен и скъп хардуер (свързани конвейери) |\n| σ (инициализация) се плаща **веднъж** | само **предварително дефинирани** комбинации — малка гъвкавост |\n| по-малко декодирани команди | повече кодове на операциите; зависят от процесора |\n| **при прекъсване се пази информация за една команда**, а не за няколко паралелни (учебник) | компилаторът трябва да разпознава шаблоните; векторите трябва да са с еднаква дължина |\n\n### Адресация на операндите\n- Форматът е предимно **триадресен** (два вектора-източника + резултат).\n\n| Вид | Пример | Плюсове | Минуси |\n|---|---|---|---|\n| **Памет-памет** | CDC Cyber 200/205 | **инвариантна спрямо дължината** на вектора; няма команди за регистри | **най-бавна** |\n| **Регистър-регистър** | Cray | **най-бърза** | ограничена дължина на регистрите → **„трионообразна“** зависимост S(n); нужни команди за зареждане |\n| **Памет-регистър (смесена)** | IBM 3090 | компромис, най-малко тактове (особено за съставни команди) | — |\n\n- Трион: регистри по 64 елемента, вектор 136 → 3 зареждания, последното само с **8** елемента, но отнема пълно време.\n- Допълнителна информация в командата: начален адрес, размерност, брой елементи по размерност, тип на данните, **разположение в паметта**.\n- **Плътна (регулярна) адресация**: **последователна**; **непоследователна, но регулярна** (стълб на матрица, пазена по редове — стъпка **m** в генератора на адреси); **подматрична** (p набора по q адреса; параметри m и m − q). C пази по редове, Fortran — по стълбове.\n- **Разредена адресация** — при операции, **зависещи от данните**, разредени вектори, косвено преглеждане на таблици:\n  - **Двоичен вектор (маска)** — с дължината на вектора, бит **1** → елементът участва; функции **свиване**, **разширение** (обратна, изгубените стойности не се възстановяват), **селективно запомняне**.\n  - **Векторни индекси** — числа като адреси или отмествания; по-сложно — генераторът прави **два достъпа** (индекси + данни).\n\n### Фиксиране на състоянието след векторна команда\n1. **Разширяване на регистъра на състоянието** — един/някои/всички резултати нула, брой нули, място на първата.\n2. **Вектор с кода на признаците** за всеки елемент — съхранява се **в паметта**; малко полезен при резултати, зависещи от много операции.\n3. **Нищо не се запомня** — **най-разпространеният**; наборът се допълва с команди „сравни векторите“, „провери за отрицателен елемент“, даващи **двоичен вектор**.\n\n### Програмиране на векторния процесор\n- Изгражда се **граф от векторни команди**; всяка приема вектори и дава **двоичен вектор**; хоризонтално — **последователно**, вертикално — **паралелно**.\n- Пример (елементите на X, ≤ 0 и ненадвишаващи Y): X ≤ 0 → BV1; X > Y → BV2; Y < 0 → BV3; ¬BV2 → BV4; BV1 И BV4 → BV5; BV5 ИЛИ BV3 → **BV6** (резултат — позициите в X). Независимите сравнения вървят паралелно.\n\n### Капани за изпита\n- **„Нива на конвейерна обработка“** (въпрос от изпита) → отговорът от упражнение 5: **конвейер за команди, операционен конвейер, макроконвейер**; добре е да споменеш и паралелността векторна/скаларна команда от учебника.\n- **Съставна = сцепена = макроконвейер** — не е същото като VLIW (там пакет независими операции от компилатора).\n- Предимството „**при прекъсване се пази състоянието на една команда**“ е от учебника — изпитващият го очаква.\n- Паметта: **3 пъти** по-широка лента за C = A + B, **разслоена памет**.\n- **Памет-памет** — бавна, но независима от дължината; **регистър-регистър** — бърза, но с **трион**; **смесена** — компромис (IBM 3090).\n- S → **L** (броя степени), не → n; ефективността пада при **къси** вектори, съизмерими с L.\n- Векторният процесор = **паралелизъм във времето**; SIMD = **пространствен** паралелизъм.\n- Двоичен вектор (маска) ≠ векторни индекси (два достъпа до паметта).","testNames":["A","B","C"],"tests":{"A":[{"id":"L07-A-1","n":1,"text":"Колко векторни регистъра въвежда CRAY-1 и какъв е техният размер?","opts":["32 регистъра по 64 думи от 32 бита","8 регистъра по 128 думи от 32 бита","8 регистъра по 64 думи от 64 бита","16 регистъра по 32 думи от 64 бита"],"correct":2,"expl":"CRAY-1 (1974): **8 × 64 думи × 64 бита**."},{"id":"L07-A-2","n":2,"text":"Какво е вектор според учебника?","opts":["Двоична маска, указваща кои елементи се обработват","Скаларни данни от различен тип в съседни регистри","Масив от команди, изпълнявани от един конвейер","Скаларни данни от един тип с фиксирана стъпка в паметта"],"correct":3,"expl":"Вектор — данни **от един тип** с **фиксирано адресно нарастване (стъпка)**."},{"id":"L07-A-3","n":3,"text":"Как е свързан присъединеният векторен процесор със скаларния компютър?","opts":["Чрез канал, като периферно устройство","Чрез векторните регистри на скаларния процесор","Чрез обща кеш памет на един чип","Чрез общата шина за данни (CDB)"],"correct":0,"expl":"Присъединеният процесор се вижда като **периферно устройство**, свързано чрез **канал**."},{"id":"L07-A-4","n":4,"text":"Колко по-широка лента на пропускане на паметта изисква C = A + B спрямо скаларния процесор?","opts":["Поне 4 пъти","Поне 3 пъти","Поне 2 пъти","Поне 8 пъти"],"correct":1,"expl":"На такт: 2 четения (A, B) + 1 запис (C) → **≥ 3 пъти**."},{"id":"L07-A-5","n":5,"text":"Кой вид адресация на векторните команди е най-бърз?","opts":["Памет-памет","Памет-регистър","Косвена чрез индекси","Регистър-регистър"],"correct":3,"expl":"**Регистър-регистър** е най-бърза, но ограничава дължината на векторите."},{"id":"L07-A-6","n":6,"text":"При коя адресация се получава „трионообразна“ зависимост на производителността от дължината на вектора?","opts":["Последователна плътна","Памет-регистър","Регистър-регистър","Памет-памет"],"correct":2,"expl":"Крайната дължина на регистрите → непълно последно зареждане → **трион**."},{"id":"L07-A-7","n":7,"text":"Операционен конвейер с L = 5, σ = 4 обработва n = 64 елемента. Ускорението S ≈ L·n/(σ + L + n − 1) е:","opts":["≈ 3,56","≈ 4,44","≈ 5,00","≈ 4,92"],"correct":1,"expl":"5·64 / (4 + 5 + 63) = 320/72 ≈ **4,44**."},{"id":"L07-A-8","n":8,"text":"Кой е най-разпространеният способ за фиксиране на състоянието след векторна команда?","opts":["Нищо не се запомня, има команди за сравнение","Вектор с кодовете на признаците в паметта","Разширяване на регистъра на състоянието","Отделен регистър за всеки елемент на вектора"],"correct":0,"expl":"**Нищо не се запомня** — вместо това има команди, даващи двоичен вектор."},{"id":"L07-A-9","n":9,"text":"Кои функции поддържа двоичният вектор (маска)?","opts":["Свиване, сортиране и косвено адресиране","Разширение, редукция и транспониране","Свиване, разширение и селективно запомняне","Селективно четене, сливане и индексиране"],"correct":2,"expl":"Маската управлява кои елементи участват: **свиване, разширение, селективно запомняне**."},{"id":"L07-A-10","n":10,"text":"Коя от изброените е съставна векторна команда?","opts":["cᵢ = aᵢ + bᵢ","s = Σaᵢ","cᵢ = cᵢ + s","V = S·V + S·V"],"correct":3,"expl":"**V = S·V + S·V** комбинира умножения и събиране — съставна команда."}],"B":[{"id":"L07-B-1","n":1,"text":"Какво е векторизация?","opts":["Разполагане на вектора в разслоена памет","Преобразуване на скаларен код във векторен","Разделяне на вектора на подвектори по 64 елемента","Зареждане на вектор във векторен регистър"],"correct":1,"expl":"Векторизацията извършват **векторизиращите компилатори**."},{"id":"L07-B-2","n":2,"text":"В кои компютри се използва адресация памет-памет?","opts":["CDC Cyber 200/205","IBM 3090","Fujitsu VPP 500","Cray Research"],"correct":0,"expl":"Памет-памет — **CDC Cyber 200/205**; регистър-регистър — Cray; смесена — IBM 3090."},{"id":"L07-B-3","n":3,"text":"Кой векторен процесор използва смесена адресация (памет-регистър)?","opts":["TI ASC","CDC Cyber 205","CRAY-1","IBM 3090"],"correct":3,"expl":"Смесената адресация е компромис, приложен от **IBM** в 3090."},{"id":"L07-B-4","n":4,"text":"Защо векторните индекси са по-сложни за реализация от двоичните вектори?","opts":["Индексите изискват отделен скаларен процесор","Индексите не могат да се пазят в регистри","Генераторът прави два достъпа до паметта","Индексите работят само с адресация памет-памет"],"correct":2,"expl":"Един достъп за **вектора на индексите** и един — за **данните**."},{"id":"L07-B-5","n":5,"text":"Кое НЕ е ниво на паралелизъм във векторния процесор според учебника?","opts":["Паралелно изпълнение на програми на различни потребители","Конвейерно изпълнение на операциите във всяко ФУ","Паралелно изпълнение на векторна и скаларна команда","Конвейерно изпълнение на векторната команда"],"correct":0,"expl":"Трите нива: в/между ФУ, векторната команда, независими **векторна + скаларна** команда."},{"id":"L07-B-6","n":6,"text":"Каква е минималната дължина на вектора за ефективност E₀ = 0,8 при σ = 4 и L = 5?","opts":["16","24","40","32"],"correct":3,"expl":"n_min = 0,8·(4 + 5 − 1)/(1 − 0,8) = 6,4/0,2 = **32**."},{"id":"L07-B-7","n":7,"text":"Кое предимство на съставните команди подчертава учебникът?","opts":["Позволяват произволни комбинации от операции","Изпълняват се без векторни регистри и без маска","При прекъсване се пази информация само за една команда","Не изискват специална апаратна поддръжка"],"correct":2,"expl":"Вместо състоянието на няколко паралелни команди се пази **една**."},{"id":"L07-B-8","n":8,"text":"Векторните регистри са по 64 елемента, а векторът е 200 елемента. Колко зареждания са нужни и колко елемента има последното?","opts":["3 зареждания, последното с 8 елемента","4 зареждания, последното с 8 елемента","4 зареждания, последното с 64 елемента","3 зареждания, последното с 72 елемента"],"correct":1,"expl":"200 = 3·64 + 8 → **4** зареждания, последното непълно — оттук „трионът“."},{"id":"L07-B-9","n":9,"text":"Какво означава бит 1 в двоичния вектор (маска)?","opts":["Съответният елемент е вече в регистър","Съответният елемент е равен на нула","Съответният елемент предизвиква прекъсване","Съответният елемент участва в операцията"],"correct":3,"expl":"Бит **1** → i-тият елемент се обработва; 0 → пропуска се."},{"id":"L07-B-10","n":10,"text":"Кои са първите успешни векторни процесори?","opts":["IBM 3090 и Hitachi S810","CRAY-1 и CRAY-2","CDC Cyber 100 и TI ASC","NEC SX4 и Fujitsu VPP 300"],"correct":2,"expl":"**CDC Cyber 100** и **TI ASC** (с адресация памет-памет); CRAY-1 идва след тях."}],"C":[{"id":"L07-C-1","n":1,"text":"Кой е пример за непоследователна, но регулярна адресация?","opts":["Стълб на матрица, съхранявана по редове","Ред на матрица, съхранявана по редове","Разреден вектор, зададен с маска","Таблица, преглеждана косвено с индекси"],"correct":0,"expl":"Адресите на стълба се различават с **m** (броя стълбове)."},{"id":"L07-C-2","n":2,"text":"Кое НЕ е причина броят на векторните кодове да е 2–3 пъти по-голям от скаларните?","opts":["Наличието на съставни команди","Векторните команди имат по-къс формат","Няколко разновидности на всяка операция","Командите за сравнение на вектори"],"correct":1,"expl":"Трите причини: разновидности (cᵢ = aᵢ + bᵢ, редукция…), **съставни** команди, команди за сравнение."},{"id":"L07-C-3","n":3,"text":"Към каква стойност клони ускорението S на операционния конвейер при n → ∞?","opts":["Към 1 (без ускорение)","Към σ (времето за инициализация)","Към L (броя степени)","Към n (дължината на вектора)"],"correct":2,"expl":"S ≈ L·n/(σ + L + n − 1) → **L**."},{"id":"L07-C-4","n":4,"text":"Каква е ефективността E = n/(σ + L + n − 1) при σ = 10, L = 8, n = 100?","opts":["≈ 0,68","≈ 0,78","≈ 0,92","≈ 0,85"],"correct":3,"expl":"100/117 ≈ **0,85**."},{"id":"L07-C-5","n":5,"text":"По какво се различава векторният процесор от скаларния конвейерен процесор?","opts":["Използва само адресация памет-памет","Прилага конвейер и върху данните","Изпълнява само целочислени операции","Не използва конвейер за командите"],"correct":1,"expl":"Векторният процесор има **операционен конвейер за данните**."},{"id":"L07-C-6","n":6,"text":"Кое е предимство на присъединения векторен процесор?","opts":["По-ниската цена и включване при нужда","По-високата скорост на обмен с паметта","По-високата производителност от пълния","Обработката на скалари без скаларен компютър"],"correct":0,"expl":"Недостатък — бавен обмен през канала; предимство — **цена** и избирателно включване."},{"id":"L07-C-7","n":7,"text":"Кога се използват разредените схеми на адресация?","opts":["При последователно разположени вектори","При адресиране на стълб на матрица","При достъп до подматрица p×q","При операции, зависещи от данните"],"correct":3,"expl":"Разредени схеми — зависими от данните операции, разредени вектори, косвени таблици."},{"id":"L07-C-8","n":8,"text":"Кои функционални устройства на векторния процесор могат да стартират нова операция на всеки такт?","opts":["Само MASK","Само скаларното устройство","ADD, MULT и DIV","Само LOAD и STORE"],"correct":2,"expl":"Специализираните конвейерни ФУ **ADD, MULT, DIV** приемат нова операция всеки такт."},{"id":"L07-C-9","n":9,"text":"Какво е макроконвейер?","opts":["Последователно свързани операционни конвейери","Няколко независими векторни процесора","Конвейер за команди с много степени","Конвейер с адресация памет-памет"],"correct":0,"expl":"Изходът на единия конвейер постъпва **директно** на входа на следващия (съставни команди)."},{"id":"L07-C-10","n":10,"text":"Как се изпълняват командите в графа на векторна програма?","opts":["Всички команди — строго последователно","Хоризонтално — последователно, вертикално — паралелно","Хоризонтално — паралелно, вертикално — последователно","Всички команди — паралелно в един такт"],"correct":1,"expl":"В графа хоризонталните команди са **последователни**, вертикалните — **паралелни**."}]}},{"num":8,"title":"Лекция 8 — SIMD (матрични) процесори","short":"SIMD (матрични) процесори","summary":"### 1. Същност на матричния (SIMD) процесор\n- Векторните процесори (лекция 7) използват **паралелизъм по време** (конвейеризация); матричните процесори използват **паралелизъм по пространство** — множество процесори работят едновременно над различни части от данните.\n- **Матричният процесор** е **синхронен паралелен компютър**, съставен от множество процесори (процесорни елементи, **PE**), управлявани от **едно единствено управляващо устройство (CU)**.\n- CU **извлича и декодира** командите и **размножава управляващите сигнали** към всички PE → всички изпълняват **една и съща операция в един и същ момент, но върху различни данни**.\n- По класификацията на Флин това е клас **SIMD** (Single Instruction stream, Multiple Data streams).\n- Според режима на работа матричните процесори биват: традиционни **SIMD**, **систолични** (лекция 9) и **асоциативни** процесори.\n- SIMD компютърът може да се разглежда като **фон Ноймановски по отношение на управлението**: управлението на матрицата от процесори не се различава от управлението на един процесор (процесор за команди + процесор за данни). Именно това **опростява програмирането** спрямо другите многопроцесорни конфигурации.\n\n### 2. Два модела на миграция от последователен към матричен процесор\nИ в двата модела командата от процесора за команди минава през **комутатор 1:N**, който я **размножава на N команди** (толкова, колкото са процесорите); това може да става и само за част от процесорите (по условие/подпрограма). Двата модела се различават по **междупроцесорните съединения**:\n\n| Модел | Обмен на данни | Единица на обмена | Примери |\n|---|---|---|---|\n| С комутатор **N:N** | между процесорите, на ниво процесори | **по битове** (напр. с най-близкия съсед) | **MPP**, **Connection Machine** (хиперкуб) |\n| С комутатор **1:N** | между процесорите или процесори ↔ памет | **по блокове** | **STARAN**, **ASPRO** |\n\n### 3. Структура на SIMD компютрите\nНа двата модела съответстват две организации: с **разпределена (локална) памет** и с **разделяема (обща) памет**. И двете включват матрица от **PE**, памети **M**, управляващо устройство **CU** и **комуникационна мрежа**, и са присъединени към **главен (Host) компютър**.\n\n**Host (front-end machine)** — последователен компютър, който: компилира програмата, зарежда я, изпълнява **входно-изходните операции** и функциите на **операционната система**. Скаларните данни се обработват от последователната част, паралелните (вектори, матрици, таблици) — от матричния процесор; последователната част **управлява целия компютър**.\n\n**SIMD с локална памет:**\n- всеки **PE[i]** има собствена памет **M[i]**; CU извлича командите от своята **CU Memory**;\n- командите за управление и скаларните команди се изпълняват от CU; **векторните** се предават на всички PE (заедно с нужните данни);\n- при достъп до локалните данни CU предава **адресите** (нормално еднакви); чрез **индексен регистър** във всеки PE адресирането става по-гъвкаво;\n- обменът между PE е през **комуникационната мрежа (Interconnection Network)**; всеки PE (или група) има комуникационен порт и буфери;\n- примери: **ILLIAC IV** (Илинойс) — 4 квадранта по **8×8 = 64** процесора, специфична мрежа ILLIAC IV; **Connection Machine (CM)** — **65 536 еднобитови** процесора, по 16 във възел, **4096 възела в хиперкуб**.\n\n**SIMD с разделяема памет:**\n- паметите са отделени от PE чрез **мрежа за подравняване (Alignment Network)**; всеки PE има достъп до всяка памет, мрежата позволява **паралелен достъп**;\n- **предимство**: повече известни алгоритми се настройват по-лесно към хардуера;\n- **недостатък**: превключват се повече данни → **по-голямо време за достъп**.\n\n| | Локална памет | Разделяема памет |\n|---|---|---|\n| Памет | M[i] към всеки PE | общи модули M, достъпни за всички PE |\n| Мрежа | Interconnection Network (PE↔PE) | Alignment Network (PE↔M) |\n| Плюс | бърз локален достъп | лесно пренасяне на известни алгоритми |\n| Минус | данните трябва да се преместват между PE | по-голямо време за достъп |\n| Пример | ILLIAC IV, Connection Machine | — |\n\n### 4. Набор команди и механизъм на маската\nНаборът команди има **три подмножества**:\n1. **скаларно** — обикновени последователни команди, изпълнявани от CU;\n2. **паралелно** — **без команди за преход** (не променят реда на изпълнение); предават се на всички PE и се изпълняват паралелно;\n3. **управляващо** — обмен между скаларната и паралелната част: промяна на потока команди според резултати от матрицата, извеждане на съдържанието на отделен PE в последователната част (във всеки момент само **един** PE обменя с CU), предаване на общи данни към всички PE с една команда.\n\n**Механизъм на маската** — нужен, когато не всички PE трябва да изпълнят командата (напр. `if a[i] > 0 then ...`):\n- блокира/деблокира изпълнението на командата във всеки PE; въведен за пръв път в **ILLIAC-IV**;\n- най-прост вариант — **контекстен регистър**: **1** → командата се изпълнява, **0** → игнорира се; стойността се определя от **локалните данни**;\n- развит вариант — **специализиран процесор за булеви операции**; входове — признаци от сравнения/аритметика на PE (=, >, нула, препълване) и паметта; резултатът (булев масив) се записва в паметта или се подава на входовете за блокиране на PE;\n- маската въвежда **операционна автономия** в SIMD компютъра.\n\n### 5. Синхронни операции и междупроцесорен обмен\n- Единственото CU определя **синхронния режим**. Две исторически причини SIMD да се появят **първи**:\n  - **по-ниска цена** — N процесора + 1 CU вместо N процесора + N CU (губи значение с масовото производство на процесори);\n  - **по-пълно използване на лентата на пропускане** на комуникационната мрежа при синхронна работа (остава валидна).\n- Паралелизмът е на **микрониво** → интерфейсът CU–матрица е синхронен; CU изчаква отговор от матрицата (частично се смекчава с **буферизация** — CU изчислява адреса на следващата команда).\n- Вътре в матрицата има **строга постъпкова синхронизация**; типични съединения — **„линийка\" (конвейер)** и **„решетка\"**.\n- При команда „предай наляво\" всички PE предават наляво и едновременно приемат отдясно → обща лента = ширина на един PE × брой PE.\n- **Регулярност и синхронност** → няма непроизводителни разходи за маршрутизация (не се изчислява път и адрес). Обменът е три операции: **извличане от паметта → предаване на съседа (с приемане от другия) → запис в паметта**.\n- Бърз обмен има само между **съседи**; за отдалечени или много получатели — **циркулационно предаване през последователния контролер** (с маската се избират получателите).\n\n### 6. Масов паралелизъм и еднобитови процесори\n- **Масов паралелизъм** = броят на **паралелно работещите процесори**. Ограничение — технологичната възможност да се разположат процесори, памет и връзки в едно устройство. В началото на 70-те: **512–1024** процесора; 25 г. по-късно: **256K**. Стационарните системи имат с порядък-два повече процесори от мобилните (тегло, консумация, обем).\n- Много SIMD (**DAP на ICL**, **Connection Machine**) използват **еднобитови процесори**: (1) много PE с проста структура се побират в един чип; (2) **по-висока скорост** на обработка.\n\nПример: сумиране на два вектора с n елемента по b бита; τ_A — време на суматора, τ_M — време за достъп до паметта.\n\n| Начин | Организация | Време |\n|---|---|---|\n| 1 | един еднобитов суматор, напълно последователно | T1 = n·b·(τ_A + τ_M) |\n| 2 | b суматора във верига — **паралелно по битове, последователно по думи** (класическият) | T2 = n·(0.5(1+b)·τ_A + τ_M) |\n| 3 | b независими суматора — **последователно по битове, паралелно по думи** (разрядно-секционен) | T3 = ⌈n/b⌉·b·(τ_A + τ_M) |\n\n- При n кратно на b: **S = T2/T3 = (0.5(1+b)·τ_A + τ_M) / (τ_A + τ_M)**.\n- Ако **τ_A ≪ τ_M** (феритна памет, 50-те години) — двата подхода са равностойни → затова компютрите се развиват като разрядно-паралелни.\n- Ако **τ_A ≈ τ_M** (днес — логика и памет по една технология, на един чип) и **b = 32** → **S = 8.75 ≈ 9 пъти** само чрез промяна на организацията.\n\n### 7. Ъглово завъртане (corner turning)\n- Стандартните компютри съхраняват данните **последователно по думи, паралелно по разряди**; еднобитовите PE изискват **последователно по разряди, паралелно по думи**.\n- Преобразуването между двата формата се нарича **ъглово завъртане**; извършва се от **специално устройство между паметта и процесорната матрица** → увеличава времето за достъп.\n- В **Staran** и **Aspro** то се реализира ефективно от **комуникационната мрежа** при обикновено обръщение към паметта (процесорите са линейно разположени, паметта е двумерна, достъпът е и по битове, и по думи — **ортогонална памет**).\n- При двумерна матрица от PE паметта е **тримерна** (GAPP, MPP, DAP, IUA, Blitzen); CM-2 — шестмерна структура на процесорите, седеммерна на паметта.\n\n### 8. Пирамидална архитектура (пример)\n- Предложена от **L. Uhr** за **обработка на изображения**; пример за тясна връзка приложение–архитектура.\n- Най-ниско ниво — двумерна матрица от PE за груба обработка на пикселите; всеки по-горен процесор е свързан с част от по-долните (напр. 4 към 1); **колкото по-нагоре, толкова по-слабо синхронизирани** са операциите — на върха често е **MIMD**.\n- Проект **IUA** (Image Understanding Array, MIT): **CAAPP** — 512×512 еднобитови асоциативни процесора (пиксели); **ICAP** — 64×64, 16-битови, MIMD управление; **SPA** — 64 × 32-битови процесора, изпълнява **LISP**.\n\n### Капани за изпита\n- SIMD = **паралелизъм по пространство**, векторен процесор = **паралелизъм по време** — не ги бъркай.\n- В SIMD има **едно** управляващо устройство и **един** поток команди; всички PE изпълняват **една и съща** команда **синхронно**, данните са различни.\n- **N:N** комутатор — обмен **по битове** (MPP, CM); **1:N** — **по блокове** (STARAN, ASPRO). Комутаторът 1:N за **размножаване на командата** присъства и в двата модела.\n- **Alignment Network** е при модела с **разделяема** памет; Interconnection Network — при локалната.\n- Паралелното подмножество команди **няма команди за преход**.\n- Маската: контекстен регистър **1 = изпълни, 0 = игнорирай**; първо в **ILLIAC-IV**.\n- 9-кратното ускорение е при **τ_A ≈ τ_M** и **b = 32** (S = 8.75); при τ_A ≪ τ_M няма печалба.\n- Ъгловото завъртане е **преобразуване на формата на данните**, а не топология на мрежа.\n- Причината „по-ниска цена\" вече губи значение; „пълно използване на лентата на мрежата\" остава.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L08-A-1","n":1,"text":"Какъв тип паралелизъм реализират матричните (SIMD) процесори?","opts":["Паралелизъм по пространство","Паралелизъм по време","Паралелизъм на ниво команди","Паралелизъм на ниво задачи"],"correct":0,"expl":"Множество процесори работят едновременно над различни данни — паралелизъм по пространство; конвейерът е паралелизъм по време."},{"id":"L08-A-2","n":2,"text":"Колко управляващи устройства има класическият матричен процесор?","opts":["По едно за всеки PE","Едно единствено","По едно за всеки ред","Две — скаларно и векторно"],"correct":1,"expl":"Матричният процесор е синхронен компютър с **едно** управляващо устройство."},{"id":"L08-A-3","n":3,"text":"Как се обменят данните при модела на матричен процесор с комутатор N:N?","opts":["Между PE и паметта, по блокове","Само чрез главния компютър","На ниво процесори, по битове","Чрез обща шина, по думи"],"correct":2,"expl":"N:N — обмен на ниво процесори по битове (MPP, Connection Machine)."},{"id":"L08-A-4","n":4,"text":"Коя мрежа отделя паметите от PE при SIMD компютъра с разделяема памет?","opts":["Interconnection Network","Мрежа на ILLIAC IV","Хиперкубична мрежа","Alignment Network"],"correct":3,"expl":"При разделяемата памет паметите са зад **мрежа за подравняване** (Alignment Network)."},{"id":"L08-A-5","n":5,"text":"Какво НЕ съдържа паралелното подмножество команди на матричния процесор?","opts":["Аритметични команди","Команди за преход","Логически команди","Команди за обмен със съседи"],"correct":1,"expl":"Паралелните команди не могат да променят реда на изпълнение — няма преходи."},{"id":"L08-A-6","n":6,"text":"Какво означава стойност 0 в контекстния регистър на даден PE?","opts":["Командата се изпълнява от PE","PE предава данни на съседа","Командата се игнорира от PE","PE изчаква главния компютър"],"correct":2,"expl":"1 — изпълнение, 0 — блокиране (игнориране) на командата."},{"id":"L08-A-7","n":7,"text":"В кой компютър механизмът на маската е използван за пръв път?","opts":["Connection Machine","STARAN","DAP на ICL","ILLIAC-IV"],"correct":3,"expl":"Маската е въведена за пръв път в **ILLIAC-IV**."},{"id":"L08-A-8","n":8,"text":"Колко еднобитови процесора съдържа Connection Machine (CM)?","opts":["65 536","4 096","16 384","262 144"],"correct":0,"expl":"65 536 процесора, по 16 във възел, 4096 възела в хиперкуб."},{"id":"L08-A-9","n":9,"text":"Каква е ролята на главния (Host) компютър в SIMD системата?","opts":["Изпълнява векторните команди","Реализира мрежата за подравняване","Компилация, зареждане, вход/изход, ОС","Съхранява маската на PE"],"correct":2,"expl":"Host е последователна front-end машина: компилира, зарежда, вход/изход, функции на ОС."},{"id":"L08-A-10","n":10,"text":"Как се нарича преобразуването от формат „по думи“ във формат „по разряди“?","opts":["Разслояване на паметта","Ъглово завъртане","Механизъм на маската","Циркулационно предаване"],"correct":1,"expl":"Corner turning — преобразуване между двата формата за еднобитови PE."}],"B":[{"id":"L08-B-1","n":1,"text":"Към кой клас по Флин спадат матричните процесори?","opts":["MISD","MIMD","SISD","SIMD"],"correct":3,"expl":"Един поток команди, много потоци данни — SIMD."},{"id":"L08-B-2","n":2,"text":"Кои са примери за матрични процесори с комутатор от тип 1:N?","opts":["MPP и Connection Machine","ILLIAC IV и DAP","STARAN и ASPRO","Warp и iWarp"],"correct":2,"expl":"Моделът 1:N (обмен по блокове) — STARAN, ASPRO."},{"id":"L08-B-3","n":3,"text":"Каква е структурата на ILLIAC IV?","opts":["4 квадранта по 8×8 процесора","16 възела по 4096 процесора","Една матрица 512×512","10 клетки в линия"],"correct":0,"expl":"ILLIAC IV — четири квадранта по 64 (8×8) процесора."},{"id":"L08-B-4","n":4,"text":"Кое е недостатък на SIMD компютъра с разделяема памет?","opts":["Невъзможен паралелен достъп","По-голямо време за достъп до данните","Липса на главен компютър","Сложно пренасяне на алгоритми"],"correct":1,"expl":"Превключват се повече данни през мрежата → времето за достъп расте."},{"id":"L08-B-5","n":5,"text":"За какво служи индексният регистър в PE на SIMD с локална памет?","opts":["Модифицира адреса, подаден от CU","Съхранява маската на PE","Брои изпълнените команди","Избира съседа за обмен"],"correct":0,"expl":"Програмистът задава индексния регистър — адресирането става по-гъвкаво."},{"id":"L08-B-6","n":6,"text":"Коя историческа причина за SIMD все още има стойност?","opts":["По-ниската цена на едно управляващо устройство","По-малкият брой процесори в един чип","Липсата на нужда от отделен компилатор","По-пълното използване на лентата на мрежата"],"correct":3,"expl":"С масовото производство цената губи значение; ефективното ползване на мрежата остава."},{"id":"L08-B-7","n":7,"text":"От какви операции се състои междупроцесорният обмен в матричния процесор?","opts":["Маршрутизация, адресиране, запис","Извличане, предаване на съсед, запис","Заявка, потвърждение, предаване","Арбитраж, превключване, четене"],"correct":1,"expl":"Регулярната синхронна мрежа не изисква изчисляване на път и адрес."},{"id":"L08-B-8","n":8,"text":"Какво се разбира под масов паралелизъм?","opts":["Броят на степените в конвейера за данни","Разрядността на процесорните елементи","Броят на паралелно работещите процесори","Броят на едновременните потоци команди"],"correct":2,"expl":"Масов паралелизъм — брой едновременно работещи процесори."},{"id":"L08-B-9","n":9,"text":"При какво съотношение еднобитовата (разрядно-секционна) обработка е изгодна?","opts":["τ_A ≪ τ_M","τ_A ≫ τ_M","τ_M = 0","τ_A ≈ τ_M"],"correct":3,"expl":"При τ_A ≈ τ_M и b = 32 ускорението е 8.75."},{"id":"L08-B-10","n":10,"text":"Кой предлага пирамидалната архитектура за обработка на изображения?","opts":["L. Uhr","Кунг и Лейсерсон","Ч. Хоар","Дж. Бекус"],"correct":0,"expl":"Концепцията за пирамидална архитектура е на L. Uhr."}],"C":[{"id":"L08-C-1","n":1,"text":"Как CU предава командите на процесорните елементи?","opts":["Изпраща различна команда на всеки PE","Размножава сигналите към всички PE","PE сами извличат командите си","Предава ги последователно по веригата"],"correct":1,"expl":"CU декодира командата и размножава управляващите сигнали към всички PE."},{"id":"L08-C-2","n":2,"text":"По отношение на какво SIMD компютърът се счита фон Ноймановски?","opts":["По отношение на паметта за данни","По отношение на мрежата","По отношение на входа/изхода","По отношение на управляващото устройство"],"correct":3,"expl":"Управлението на матрицата не се различава от управлението на един процесор."},{"id":"L08-C-3","n":3,"text":"Колко подмножества има наборът команди на матричния процесор?","opts":["Три","Две","Четири","Пет"],"correct":0,"expl":"Скаларно, паралелно и управляващо подмножество."},{"id":"L08-C-4","n":4,"text":"Каква е формулата за времето T2 (паралелно по битове, последователно по думи)?","opts":["n·b·(τ_A + τ_M)","⌈n/b⌉·b·(τ_A + τ_M)","n·(0.5(1+b)·τ_A + τ_M)","b·(0.5(1+n)·τ_A + τ_M)"],"correct":2,"expl":"Преносите се разпространяват последователно през b суматора."},{"id":"L08-C-5","n":5,"text":"Колко е ускорението S = T2/T3 при τ_A = τ_M и b = 32?","opts":["16.5","32","3.5","8.75"],"correct":3,"expl":"(0.5·33 + 1)/2 = 17.5/2 = 8.75."},{"id":"L08-C-6","n":6,"text":"Как се реализира механизмът на маската в най-развития си вариант?","opts":["Специализиран процесор за булеви операции","Отделно управляващо устройство за всеки PE","Брояч на командите във всеки PE","Мрежа за подравняване на данните"],"correct":0,"expl":"Булевият процесор обработва признаци от PE и паметта и блокира/деблокира PE."},{"id":"L08-C-7","n":7,"text":"Как се реализира ъгловото завъртане в Staran и Aspro?","opts":["Чрез програма на главния компютър","Чрез отделен векторен процесор","Чрез комуникационната мрежа при достъп","Чрез механизма на маската"],"correct":2,"expl":"Мрежата осигурява достъп по битове и по думи без допълнително закъснение."},{"id":"L08-C-8","n":8,"text":"Кога се използва циркулационно предаване през последователния контролер?","opts":["При обмен само между съседи","При данни за много или отдалечени PE","При изпълнение на скаларна команда","При зареждане на програмата"],"correct":1,"expl":"За отдалечени/многобройни получатели е по-бързо през контролера; маската избира получателите."},{"id":"L08-C-9","n":9,"text":"Какво е характерно за горните нива на пирамидалната архитектура?","opts":["По-слабо синхронизирани операции","Повече еднобитови процесори","По-силна синхронизация","Липса на връзки с долните нива"],"correct":0,"expl":"Колкото по-нагоре, толкова по-слаба синхронизация; на върха често е MIMD."},{"id":"L08-C-10","n":10,"text":"Кое ниво на проекта IUA изпълнява LISP програми?","opts":["CAAPP","ICAP","Host","SPA"],"correct":3,"expl":"SPA — 64 × 32-битови процесора за символна обработка (LISP)."}]}},{"num":9,"title":"Лекция 9 — Систолични процесори","short":"Систолични процесори","summary":"### 1. Произход и същност на систоличната обработка\n- **VLSI** технологията позволява стотици хиляди компоненти върху една силициева подложка → път към **масивни паралелни изчисления**.\n- Систоличната обработка произлиза от работата на **Кунг и Лейсерсон** (Carnegie-Mellon University, края на 70-те).\n- По същество тя е **конвейерна обработка в мрежа от елементи**; принципите ѝ са **съвместими с VLSI** технологията.\n- **Систолична матрица** (работна дефиниция) — **мрежовидна структура от елементи (клетки)**, които обработват данните чрез **n-мерен конвейер**.\n\n| | Обикновен конвейер | Систолична матрица |\n|---|---|---|\n| Какво се движи | само междинните резултати | **входните и междинните данни** се движат през матрицата |\n| Посока/скорост | една посока | данните могат да се движат с **различна скорост и в различни посоки** |\n| Връзка с паметта | всяка степен може да се обръща към паметта | **само граничните клетки** взаимодействат с паметта; вътрешните обменят данни само помежду си |\n| Размерност | едномерен | **n-мерен** |\n\n- Името идва от аналогията със **систолата** — данните се „изпомпват\" ритмично през клетките.\n\n### 2. Клетки и изисквания на VLSI\n- Процесорните елементи са **прости клетки** — обикновено **един-два регистъра, суматор и/или умножител**.\n- Клетките трябва да са **възможно най-прости** (добро използване на площта на кристала); свързването — **просто, регулярно, само локални връзки**.\n- **Дългите връзки** изискват повече площ и енергия и внасят **закъснение** при високата тактова честота → нежелани.\n- **Характерни свойства на VLSI-съвместимите систолични структури:**\n  - висока степен на **модулност**;\n  - **отсъствие на дълги пътища** за данни;\n  - **локалност на връзките**;\n  - **ограничени** (но достатъчни) изчислителни възможности на клетките;\n  - **отсъствие на централно управление**;\n  - **прости механизми за синхронизация**.\n\n### 3. За кои алгоритми са подходящи\n- Тъй като матриците са **високо регулярни**, на тях се изпълняват само **алгоритми с повтарящи се изчисления**: **цифрова обработка на сигнали**, **линейна алгебра (матрични операции)**, алгоритми с **вложени цикли**.\n- Висока производителност се постига, само ако алгоритъмът е **настроен** за матрицата — понякога се налага разработка на **нови, специални алгоритми**.\n- Изчисленията трябва да са **интензивни**: веднъж извлечени от паметта, данните трябва да преминат през **максимален брой операции**, преди да се запишат обратно. **I/O каналът е вероятното тясно място**.\n\n### 4. Базов принцип на систоличната система\n- Систоличната матрица работи под управлението на **контролер**, който подава **управляващи сигнали и входни данни** и **събира резултатите**.\n- Контролерът взаимодейства с **главния (управляващ) компютър**, където се **компилират програмите**; той поема и задачите, **неподходящи за систолично изпълнение**.\n- Входният поток данни влиза в матрицата, обработва се и я напуска; **производителността силно зависи от входно-изходните характеристики**.\n- Общото време = време за обработка + време за предаване между клетките; поради конвейерния принцип **изчислителното време трябва да е сравнимо с комуникационното**.\n- **Mapping problem** — разпределението на изчисленията върху свързаните процесори; по-сложен е, когато реалният размер на матрицата е **по-малък** от изисквания от алгоритъма (алгоритъмът трябва да се дели).\n\n### 5. Видове систолични матрици\nРазличават се по три характеристики:\n1. **Топология** — начин на свързване на клетките: **едномерна (линейна)**, **двумерна**, **триъгълна**, **двоично дърво** и др.\n2. **Функционални възможности на клетките**:\n   - прости АЛУ (само елементарни операции);\n   - АЛУ с няколко регистъра;\n   - прост процесор, изпълняващ собствена (локална) програма;\n   - процесорен модул (процесор + памет + допълнителна логика).\n3. **Реконфигурируемост** — **FPGA** (Field Programmable Gate Arrays) позволяват препрограмиране и реконфигуриране; подходящи за **малки систолични матрици** на разумна цена.\n\n| Клас | Тип | Организация | Топология |\n|---|---|---|---|\n| Специализирани | хардуерни | FVIMD | фиксирана |\n| Универсални | програмируеми | SIMD или MIMD | статична/динамична |\n| Универсални | реконфигурируеми | FVIMD | реконфигурируема |\n| Универсални | хибридни | хибридна | n-размерна |\n\n**FVIMD** (VFIMD) — Very Few Instructions, Multiple Data: много малко команди, много данни.\n\n### 6. Специализирани систолични матрици\n- Първоначално идеята е развита за **специални приложения**: архитектурата се проектира **конкретно за всяко приложение**, функциите са **хардуерно** реализирани, топологията на клетките и връзките е **фиксирана**.\n- Най-естествена област — **матричните операции**.\n\n**Скаларно произведение** s = Σ aᵢ·bᵢ (i = 1..n):\n- клетка с **умножител и акумулатор**; след инициализация елементите aᵢ и bᵢ **синхронно** преминават през клетката (и продължават към следващите клетки), произведението aᵢ·bᵢ се **натрупва** в акумулатора, резултатът се извежда **в края**.\n\n**Систолично умножение на матрици 3×3:**\n- матрица от **9 клетки** c₁₁ … c₃₃, всяка — клетка за скаларно произведение;\n- единствената разлика: за всеки **допълнителен ред и колона** се въвежда **закъснение от един цикъл** (елементите влизат „стъпаловидно\", за да се срещнат в правилната клетка);\n- в клетката cᵢⱼ се получава едноименният елемент на резултата, извежда се в края;\n- **предимство**: намалена нужда от обмен с паметта — веднъж извлечен, напр. a₁₁ се използва от **c₁₁, c₁₂ и c₁₃**.\n\n**Ограничения на специализираните матрици:**\n- матрици, **по-големи** от систоличната, се разделят на по-малки блокове → изчисленията стават **паралелно-последователни** → по-ниска производителност;\n- чисто хардуерното изпълнение дава висока производителност, но **цената, отнесена към приложението, расте**, а приложимостта за други задачи намалява → изход: **универсални** систолични архитектури.\n\n### 7. Универсални систолични матрици\n- Три архитектурни модела: **програмируем**, **реконфигурируем** и **хибриден**.\n- Размерността е най-често **едномерна (линейна)** или **двумерна**; двумерната позволява по-ефективно изпълнение на сложни алгоритми. Поради **входно-изходни ограничения** матрици с размерност **> 2** не са разпространени.\n\n**Warp и iWarp** (Carnegie-Mellon + Intel) — доказват възможността на систоличната обработка за **универсални** цели:\n- проектантите избират **малко (10), но сложни клетки** вместо много прости — заради **гъвкавост** и широк кръг приложения;\n- клетка на Warp: **RAM за данни 32K думи**, **два регистрови файла по 32 регистъра**, **три опашки по 512 думи**, I/O връзки по **6 канала**;\n- **Warp** — 10 клетки в **едномерна** матрица;\n- **iWarp** — **32×32** клетки в **двумерна** матрица, пикова производителност **20 GFLOPS**.\n\n| | Специализирани | Универсални |\n|---|---|---|\n| Функции | хардуерни, за една задача | програмируеми/реконфигурируеми |\n| Топология | фиксирана | статична, динамична, реконфигурируема |\n| Производителност | максимална за конкретната задача | по-ниска, но гъвкава |\n| Цена за приложение | висока, тясна приложимост | по-ниска, широк кръг задачи |\n| Пример | матрица за умножение на матрици | Warp, iWarp, FPGA матрици |\n\n### Капани за изпита\n- В систоличната матрица се движат **входните И междинните данни**, а не само междинните резултати, както в обикновения конвейер.\n- С паметта комуникират **само граничните клетки**.\n- Систоличните структури нямат **централно управление** в самата матрица (контролерът е външен и подава данни/сигнали).\n- Подходящи са **само** за регулярни, повтарящи се изчисления; **I/O каналът** е тясното място.\n- Warp има **малко сложни** клетки (10), а не много прости; iWarp е **32×32**, 20 GFLOPS.\n- Универсалните матрици рядко имат размерност > 2 — заради **входно-изходни** ограничения.\n- FPGA → **реконфигурируеми**, подходящи за **малки** матрици.\n- При умножение на матрици закъснението е **по един цикъл** за всеки допълнителен ред/колона.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L09-A-1","n":1,"text":"Какво представлява систоличната обработка по своята същност?","opts":["Конвейерна обработка в мрежа от елементи","Векторна обработка в един процесор","Асоциативна обработка в паметта","Обработка с обмен на съобщения"],"correct":0,"expl":"Систоличната обработка е конвейерна обработка в мрежа от клетки."},{"id":"L09-A-2","n":2,"text":"Кои клетки на систоличната матрица взаимодействат с паметта?","opts":["Всички клетки","Само граничните клетки","Само централната клетка","Само клетките на диагонала"],"correct":1,"expl":"Вътрешните клетки обменят данни само помежду си."},{"id":"L09-A-3","n":3,"text":"Чия работа поставя началото на систоличната обработка?","opts":["Ч. Хоар","L. Uhr","Кунг и Лейсерсон","Флин"],"correct":2,"expl":"Kung и Leiserson, Carnegie-Mellon, края на 70-те."},{"id":"L09-A-4","n":4,"text":"Какво се движи през систоличната матрица за разлика от обикновения конвейер?","opts":["Само междинните резултати","Само командите","Само адресите","Входните и междинните данни"],"correct":3,"expl":"В обикновения конвейер се движат само междинните резултати."},{"id":"L09-A-5","n":5,"text":"Кое НЕ е свойство на VLSI-съвместимите систолични структури?","opts":["Локалност на връзките между клетките","Централно управление на клетките","Висока модулност на структурата","Липса на дълги пътища за данни"],"correct":1,"expl":"Систоличните структури се характеризират с **отсъствие** на централно управление."},{"id":"L09-A-6","n":6,"text":"За кои алгоритми са подходящи систоличните матрици?","opts":["С много условни преходи","С нерегулярен достъп до паметта","С повтарящи се регулярни изчисления","Със символна обработка"],"correct":2,"expl":"Обработка на сигнали, линейна алгебра, вложени цикли."},{"id":"L09-A-7","n":7,"text":"Кое е вероятното тясно място на систоличната система?","opts":["Умножителят в клетката","Регистрите на клетките","Локалните връзки","Входно-изходният канал"],"correct":3,"expl":"Затова данните трябва да минат през максимален брой операции преди запис."},{"id":"L09-A-8","n":8,"text":"Колко клетки има матрицата на компютъра Warp?","opts":["10","32","1024","64"],"correct":0,"expl":"Warp — 10 сложни клетки в едномерна матрица."},{"id":"L09-A-9","n":9,"text":"Каква технология позволява реконфигурируеми малки систолични матрици?","opts":["DRAM","ферритна памет","FPGA","CMOS шина"],"correct":2,"expl":"Field Programmable Gate Arrays — препрограмиране и реконфигуриране."},{"id":"L09-A-10","n":10,"text":"Колко клетки са нужни за систолично умножение на матрици 3×3?","opts":["3","9","6","27"],"correct":1,"expl":"По една клетка c_ij за всеки елемент на резултата."}],"B":[{"id":"L09-B-1","n":1,"text":"Какви са обикновено процесорните елементи в систоличната матрица?","opts":["Пълни процесори с кеш памет и собствена ОС","Векторни процесори с няколко конвейера","Еднобитови асоциативни процесори с маска","Прости клетки с регистри и суматор/умножител"],"correct":3,"expl":"Един-два регистъра, суматор и/или умножител."},{"id":"L09-B-2","n":2,"text":"Защо дългите връзки между клетките са нежелани?","opts":["Намаляват броя на клетките","Пречат на централното управление","Внасят закъснение и изразходват площ","Изискват отделна памет"],"correct":2,"expl":"Дългите връзки изискват повече площ/енергия и внасят закъснение при висока честота."},{"id":"L09-B-3","n":3,"text":"Какво означава съкращението FVIMD?","opts":["Very Few Instructions Multiple Data","Fixed Vector Instruction Multiple Data","Full Vector Integer Multiple Data","Few Variable Inputs Many Devices"],"correct":0,"expl":"Много малко команди, много потоци данни."},{"id":"L09-B-4","n":4,"text":"Каква е топологията на специализираните систолични матрици?","opts":["Реконфигурируема","Фиксирана","Динамична","n-размерна хибридна"],"correct":1,"expl":"Функциите са хардуерни, топологията — фиксирана."},{"id":"L09-B-5","n":5,"text":"Кой подава управляващите сигнали и входните данни на систоличната матрица?","opts":["Контролерът","Граничните клетки","Акумулаторът","Мрежата за подравняване"],"correct":0,"expl":"Контролерът подава сигнали и данни и събира резултатите."},{"id":"L09-B-6","n":6,"text":"Какво се натрупва в акумулатора на клетката за скаларно произведение?","opts":["Сумата от елементите aᵢ","Максималният елемент bᵢ","Броят на обработените двойки","Сумата от произведенията aᵢ·bᵢ"],"correct":3,"expl":"s = Σ aᵢ·bᵢ се натрупва и се извежда в края."},{"id":"L09-B-7","n":7,"text":"Какво е предимство на систоличното умножение на матрици?","opts":["Не се изисква синхронизация","Всеки извлечен елемент се използва многократно","Работи с матрици с произволен размер","Няма нужда от контролер"],"correct":1,"expl":"Напр. a₁₁ се ползва от c₁₁, c₁₂ и c₁₃ — по-малко обръщения към паметта."},{"id":"L09-B-8","n":8,"text":"Каква е пиковата производителност на iWarp?","opts":["2 GFLOPS","200 GFLOPS","20 GFLOPS","20 TFLOPS"],"correct":2,"expl":"iWarp — 32×32 клетки, 20 GFLOPS."},{"id":"L09-B-9","n":9,"text":"Защо универсалните систолични матрици рядко са с размерност над 2?","opts":["Поради липса на подходяща памет","Поради сложността на клетките","Поради цената на FPGA","Поради входно-изходни ограничения"],"correct":3,"expl":"При по-голяма размерност I/O ограниченията стават прекомерни."},{"id":"L09-B-10","n":10,"text":"Кое НЕ е вид функционални възможности на систолична клетка?","opts":["Векторен процесор с няколко конвейера","Просто АЛУ само с елементарни операции","АЛУ с няколко регистъра","Процесорен модул с памет и логика"],"correct":0,"expl":"Видовете са: АЛУ, АЛУ с регистри, прост процесор с програма, процесорен модул."}],"C":[{"id":"L09-C-1","n":1,"text":"Как се дефинира систоличната матрица?","opts":["Матрица от процесори с едно управляващо устройство","Мрежа от клетки, обработващи данни чрез n-мерен конвейер","Множество процесори с обща памет","Граф от команди, задействани от данни"],"correct":1,"expl":"Работна дефиниция: мрежовидна структура от клетки с n-мерен конвейер."},{"id":"L09-C-2","n":2,"text":"С коя технология са изначално съвместими систоличните структури?","opts":["Ферритна памет","Дискретни транзистори","Оптични връзки","VLSI"],"correct":3,"expl":"Локални връзки и модулност — съвместими с VLSI."},{"id":"L09-C-3","n":3,"text":"Какво означава „mapping problem“ при систоличните системи?","opts":["Разпределение на изчисленията върху клетките","Преобразуване на формата на данните","Избор на маршрут в мрежата","Съгласуване на кеш паметите"],"correct":0,"expl":"Особено сложно, когато матрицата е по-малка от нужното за алгоритъма."},{"id":"L09-C-4","n":4,"text":"Кое е отношението между изчислително и комуникационно време в систоличната матрица?","opts":["Комуникационното трябва да е нула","Изчислителното трябва да е нула","Трябва да са сравними","Комуникационното трябва да е много по-голямо"],"correct":2,"expl":"Поради конвейерния принцип двете времена трябва да са сравними."},{"id":"L09-C-5","n":5,"text":"Какво се случва при матрици, по-големи от систоличната матрица?","opts":["Обработват се без загуба на производителност","Систоличната матрица се реконфигурира","Обработват се само от граничните клетки","Делят се на блокове, обработката е по-бавна"],"correct":3,"expl":"Разделянето намалява производителността."},{"id":"L09-C-6","n":6,"text":"Каква организация имат програмируемите универсални систолични матрици?","opts":["SIMD или MIMD","Само SISD","Само FVIMD","MISD"],"correct":0,"expl":"Програмируемите — SIMD/MIMD; реконфигурируемите и специализираните — FVIMD."},{"id":"L09-C-7","n":7,"text":"Кои организации разработват Warp и iWarp?","opts":["MIT и IBM","Илинойски университет и Cray","Carnegie-Mellon University и Intel","Thinking Machines и NASA"],"correct":2,"expl":"Съвместен проект на CMU и Intel."},{"id":"L09-C-8","n":8,"text":"Защо проектантите на Warp избират малко, но сложни клетки?","opts":["За по-ниска консумация на енергия","За гъвкавост и широк кръг приложения","За по-голяма тактова честота","За отстраняване на I/O канала"],"correct":1,"expl":"Целта е универсално приложение."},{"id":"L09-C-9","n":9,"text":"Каква е структурата на матрицата на iWarp?","opts":["32×32 клетки, двумерна","10 клетки, едномерна","8×8 клетки, четири квадранта","512×512 клетки, пирамидална"],"correct":0,"expl":"iWarp — двумерна матрица 32×32."},{"id":"L09-C-10","n":10,"text":"Какъв е основният недостатък на специализираните систолични матрици?","opts":["Ниска производителност за задачата си","Голям брой дълги връзки","Нужда от централно управление","Тясна приложимост и висока цена за приложение"],"correct":3,"expl":"Хардуерното изпълнение е бързо, но неизползваемо за други задачи."}]}},{"num":10,"title":"Лекция 10 — Паралелни компютри с обща и разпределена памет","short":"Паралелни компютри с обща и разпределена памет","summary":"### 1. Силно и слабо свързани паралелни компютри\nЕдна от класификациите на паралелните компютри е по **степента на свързаност** на процесорите:\n- **Силно свързани** — няколко процесора чрез комуникационна мрежа директно работят с **общата памет** и останалите устройства → **SMP** (Symmetrical Multi Processors / **Shared Memory Processors**), компютри с **обща памет**.\n- **Слабо свързани** — локални компютри (процесор + локална памет), обединени в мрежа → **MPP/MMP** (Massively Parallel / Massively Multi Processors), компютри с **разпределена памет**.\n- При SMP **времето за обмен** между процесорите е **съизмеримо** с времето за изпълнение на машинните операции; при MPP то е **по-голямо**.\n\n**Обобщени структури (за „начертайте\"):**\n- **SMP**: процесори P1 … Pn → **комуникационна мрежа** (шина, crossbar) → **обща (поделена) памет** (модули памет).\n- **MPP**: всеки процесор Pi има своя **локална памет** Mi; двойките Pi–Mi са свързани само чрез **комуникационна мрежа**, по която се обменят **съобщения**.\n- **NUMA**: **възли**, всеки = няколко процесора + модул памет + контролер на паметта (+ периферия), свързани с **локална шина**; възлите са свързани с **комуникационна мрежа**.\n\n### 2. SMP — компютри с обща памет\n- „Симетрична\" — **всеки процесор може да прави всичко**, което и останалите.\n- В един екземпляр са: **една памет, една операционна система, една подсистема за вход/изход**; всички процесори имат **пряк и бърз достъп** до паметта и „виждат\" задачата цялостно.\n- **Предимства:** опростено **системно и приложно програмиране**; многонишковата ОС **прозрачно разпределя** нишките между процесорите; приложенията получават колкото памет им трябва; глобалната памет **опростява синхронизацията**; програмистът не се грижи къде са данните.\n- **Недостатък:** **лоша мащабируемост** — с добавяне на процесори трафикът към паметта бързо расте до **насищане**; тясното място е **пропускателната способност на канала процесори–памет**, която ограничава броя процесори (SMP сървъри: **8–16** процесора).\n- **Средства за намаляване на отрицателния ефект на общата памет:** **кеш памет към всеки процесор** и **подходящо разпределение на данните по модулите памет** (разслояване). Кешът поражда проблема **cache coherence** (съгласуваност на кеш паметите).\n- Представители: суперкомпютрите на **Cray**, **SGI**, **HP**; архитектурите от лекции 5–9 спадат към този клас.\n\n### 3. MPP (MMP) — компютри с разпределена памет\n- **Стотици до хиляди** процесора, всеки със **собствена (локална) памет**; другите процесори имат **непряк и по-бавен** достъп до нея; **няма обща памет**.\n- **Предимства:** елиминирани са **конфликтите при достъп до паметта**; **много добра мащабируемост** (добавянето на процесори не деградира останалите); **масов паралелизъм**.\n- **Недостатъци:** обменът става чрез **по-бавните входно-изходни операции** (съобщения) → комуникацията е много по-бавна от локалния достъп; практически единственият начин за програмиране е **обмен на съобщения** (**PVM**, **MPI**) — сложно; **съществуващите програми не вървят ефективно**, преработката е **скъпа и бавна**, нужни са **нови паралелни алгоритми**; при **фин паралелизъм** комуникациите доминират; **балансирането** на натоварването е трудно.\n- Представители: **Intel iPSC**, **IBM Scalable Power Parallel System**, **NCUBE**, **Connection Machine**.\n\n### 4. NUMA и ccNUMA\n- **NUMA (Non Uniform Memory Access)** — опит да се **обединят достойнствата** на SMP и MPP. Първият — в средата на 70-те в Carnegie-Mellon (Cm*); съвременни: **NUMA_Q (IBM)**, **Alpha Wildfire (Compaq)**, **MIPS64 (SGI)**.\n- Всеки **възел е малък SMP**; всеки процесор може да **адресира цялата памет** в системата (единно адресно пространство), програма от един модул може да се изпълнява от произволен процесор.\n- **Локалните обръщения** са **многократно по-бързи** от отдалечените → „**нееднакъв достъп**\". Класическият SMP е **UMA** (Uniform Memory Access).\n- Ако отдалеченият достъп е само **5–10%** по-бавен, системата се държи като SMP; при съвременните NUMA разликата е **200–700%** → нужно е **внимателно разположение на данните** по модулите памет.\n- Мащаб: SMP — **8–16** процесора, NUMA — **256 и повече**.\n- **ccNUMA (cache coherent NUMA)** — решава **несъгласуваността на кеш паметите** чрез специални протоколи, **прозрачни за програмиста**.\n\n### 5. Клъстерни системи\n- **Клъстер** — съвкупност от компютри, обединени в мрежа за решаване на **една задача** (тук — изчислителни клъстери).\n- Възлите са **стандартни** (масово произвеждани) еднопроцесорни компютри или 2–4-процесорни SMP сървъри; всеки работи под **свое копие на ОС**; възлите могат да са различни → **хетерогенни** системи.\n- Примери: **Beowulf (NASA)**, **KLAT, KLAT2**, SGI **Origin**. Клъстерите спадат към компютрите с **разпределена памет**.\n\n| | SMP (обща памет) | MPP (разпределена) | NUMA | Клъстер |\n|---|---|---|---|---|\n| Памет | една обща | локална за всеки процесор | физически разпределена, логически обща | локална във всеки възел |\n| Достъп | еднакъв (UMA), пряк | чужда памет — само със съобщения | локален бърз, отдалечен 2–7× по-бавен | съобщения по мрежата |\n| ОС | една | във всеки възел | една | копие във всеки възел |\n| Брой процесори | 8–16 | стотици–хиляди | 256+ | според броя възли |\n| Програмиране | лесно (нишки) | трудно (PVM/MPI) | като SMP, но с внимание към данните | PVM/MPI |\n| Плюс | лесна синхронизация | мащабируемост, няма конфликти за памет | съчетава двете | евтин, стандартни възли |\n| Минус | насищане на мрежата, cache coherence | бавен обмен, нови алгоритми | разположение на данните, кохерентност | бавна мрежа |\n\n### 6. Модел на Хоар — CSP (Communicating Sequential Processes)\nАбстрактен модел за изчисления в MPP: паралелният изчислителен процес е **изпълнение на независими конкуриращи се процеси**, обменящи данни чрез **канали**.\n\n| Елемент | Същност | Предназначение |\n|---|---|---|\n| **Процес** | поведение на дискретен компонент от приложението; може да съдържа **подпроцеси** (P1 = P11 + P12) | моделира отделна част от реалната система; може да се разположи върху **произволен процесор** от мрежата |\n| **Канал** | връзка **„точка–точка\"** между **точно два** процеса | (1) **път за данните** между независимите процеси; (2) **синхронизация** — приемникът потвърждава получаването, а изпращачът **чака** потвърждението |\n\n- Еднопосочна връзка (P2 → P3) или двупосочен обмен (P1 ↔ P2 — работят кооперативно).\n- Един и същ CSP модел може да се **разположи върху различен брой процесори** (напр. 3 или 2) — моделът не зависи от машината.\n- Моделът **интуитивно съответства на паралелизма в реалния свят**; реализиран е в езика **Occam** (транспютри).\n\n### 7. Проблеми на компютрите с разпределена памет\n- **Комуникационни загуби** — достъпът до нелокални данни става чрез бавните I/O операции (съобщения) → затова се наричат и **message passing** компютри; нужни са високопроизводителна мрежа и подходящ софтуер.\n- **Програмиране** — отделни програми за всеки процесор, свързани с нискониво операции „изпрати/получи\"; обикновено копия на една програма → **SPMD** (Single Program Multiple Data) / SCMD. Компютърът работи като **MIMD с предаване на съобщения**; програмистът трябва да познава организацията на паметта → хардуерна зависимост, затова за преносимост се ползват **PVM** и **MPI**.\n- **Декомпозиция** — задачата се разбива на подзадачи с **минимална зависимост**: при обща памет зависимостта е по данни, памет и управление, при разпределена — **по съобщения**. Цел: **минимален брой комуникации** и/или **групирането им в големи съобщения**.\n- **Отношение t_s/t** = време за комуникация / време за аритметична операция: при t_s/t ≪ 1 системата е ефективна и при честа комуникация; при t_s/t ≫ 1 — само при **груб паралелизъм**.\n\n### 8. Груб и фин паралелизъм\n| | **Фин паралелизъм** | **Груб паралелизъм** |\n|---|---|---|\n| Съобщения | малки — **1 елемент**, независимо от размера на задачата (вълнов алгоритъм) | големи — **k·n²** елемента, зависят от размера |\n| Комуникации | много и чести | малко, но обемни |\n| Изчисления между обмените | кратки | процесорите работят **самостоятелно върху големи сегменти** |\n| Резултат (T805, 4 процесора) | **по-бавно дори от последователното** изпълнение | средно **≈3.5×** по-бързо от последователното |\n| Подходящ за | SMP (малко t_s/t) | **MPP** (голямо t_s/t) |\n\nПример (умножение на матрици, n = 50): последователно 0.593 s, фин 0.843 s, груб 0.165 s. **Извод:** MPP е подходящ предимно за **груб паралелизъм**. Изборът зависи от: **отношението комуникация/изчисление (t_s/t)**, архитектурата (обща/разпределена памет), **размера на задачата**, **алгоритъма и декомпозицията** и мрежата.\n\n### 9. Балансирано (равномерно) натоварване\n- **Балансирано натоварване** — **равномерно разпределение** на задачата между процесорите, така че **всички (или повечето) да работят през цялото време** на решаване.\n- При неравномерно натоварване по-слабо натоварените **завършват по-рано и чакат** — времето се определя от **най-натоварения** процесор; освен това **расте броят на комуникациите** → **спада производителността**.\n- Проблемът засяга едновременно **алгоритъма** (декомпозицията на данните) и **операционната система** (разпределението на процесите).\n- Модел (лаб. упр. 7): **S(P) = T(1) / (T_a(P) + W(P))** ≈ **P / (c + W(P)·P/T(1))**, където T(1) — време на 1 процесор, T_a(P) — време за изчисления, W(P) — време за комуникация и синхронизация, **c** — **коефициент на дисбаланс** (c = 1 при равномерно; c > 1 при неравномерно, = макс. брой редове на процесор / (n/P)). При матрица n×n, разделена на P хоризонтални слоя от n/P реда, c = 1, ако n е **кратно на P**.\n\n### 10. От какво зависи производителността на паралелните компютри\n- **Фактори на задачата:** вътрешен паралелизъм и **големина на зърното** (груб/фин), дял на **последователната част** (Amdahl), **размер** на задачата, преобладаващ тип аритметика, **метод на декомпозиция** и разпределение между ресурсите.\n- **Архитектурни фактори:** **брой и мощност** на процесорите, **организация на паметта** (обща/разпределена), **комуникационна мрежа** — структура, топология, пропускателна способност (t_s/t), ефективност на **ОС** при управление на ресурсите, **балансирането** на натоварването.\n\n### Капани за изпита\n- SMP ≠ „само с много процесори\": решаващото е **една обща памет** и **една ОС**; главният недостатък е **мащабируемостта**, не програмирането.\n- В MPP **няма обща памет** → **няма конфликти за паметта**, но обменът е със **съобщения** (PVM, MPI).\n- NUMA: паметта е **физически разпределена**, но **логически обща**; разликата локален/отдалечен достъп е **200–700%**; ccNUMA решава **кеш кохерентността**, не NUMA разликата.\n- UMA = класически SMP.\n- CSP елементите са **процес** и **канал**; каналът има **две функции** — път за данни и **синхронизация** (изпращачът чака потвърждение).\n- **Фин** паралелизъм на MPP може да е **по-бавен от последователното** изпълнение; MPP → груб паралелизъм (≈3.5× в примера).\n- Неравномерното натоварване не само оставя процесори без работа, но и **увеличава броя на комуникациите**.\n- Числата в таблицата за фин/груб паралелизъм се различават между уеб версията и печатния учебник — запомни извода, а не отделните редове.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L10-A-1","n":1,"text":"Как се наричат паралелните компютри с обща памет?","opts":["SMP","MPP","NUMA","COW"],"correct":0,"expl":"Symmetrical Multi Processors / Shared Memory Processors."},{"id":"L10-A-2","n":2,"text":"Кой е основният недостатък на SMP архитектурата?","opts":["Сложното програмиране","Лошата мащабируемост","Липсата на обща ОС","Бавният локален достъп"],"correct":1,"expl":"Трафикът към общата памет бързо стига насищане."},{"id":"L10-A-3","n":3,"text":"Кое средство намалява отрицателния ефект на общата памет в SMP?","opts":["Обмен на съобщения с MPI","Отделна ОС за всеки процесор","Кеш памет към всеки процесор","Премахване на общата шина"],"correct":2,"expl":"Кеш + подходящо разпределение на данните; кешът носи проблема за кохерентност."},{"id":"L10-A-4","n":4,"text":"Какво е елиминирано в компютрите с разпределена памет?","opts":["Нуждата от комуникационна мрежа","Нуждата от обмен на съобщения","Проблемът с балансирането","Конфликтите при достъп до паметта"],"correct":3,"expl":"Няма обща памет → няма конфликти за нея."},{"id":"L10-A-5","n":5,"text":"Колко пъти по-бавен е отдалеченият достъп в съвременните NUMA компютри?","opts":["5–10% по-бавен","200–700% по-бавен","Еднакво бърз","10 000% по-бавен"],"correct":1,"expl":"Затова трябва внимателно разполагане на данните."},{"id":"L10-A-6","n":6,"text":"Какво решава архитектурата ccNUMA?","opts":["Разликата локален/отдалечен достъп","Балансирането на натоварването","Несъгласуваността на кеш паметите","Маршрутизацията на съобщенията"],"correct":2,"expl":"cache coherent NUMA — протоколи, прозрачни за програмиста."},{"id":"L10-A-7","n":7,"text":"Кои са основните елементи на CSP модела на Хоар?","opts":["Възел и шина","Команда и маркер","Клетка и контролер","Процес и канал"],"correct":3,"expl":"Процеси, обменящи данни по канали."},{"id":"L10-A-8","n":8,"text":"Какво прави процесът-изпращач в CSP след изпращане на данни?","opts":["Чака потвърждение от приемника","Продължава веднага работа","Изпраща данните повторно","Прекратява изпълнението си"],"correct":0,"expl":"Каналът синхронизира — изпращачът чака потвърждението."},{"id":"L10-A-9","n":9,"text":"В кой език е имплементиран моделът CSP?","opts":["Fortran","VAL","Occam","LISP"],"correct":2,"expl":"Occam — езикът на транспютрите."},{"id":"L10-A-10","n":10,"text":"За какъв паралелизъм са подходящи предимно MPP компютрите?","opts":["Фин паралелизъм","Груб паралелизъм","Паралелизъм на ниво битове","Паралелизъм на ниво команди"],"correct":1,"expl":"Малко, но обемни комуникации."}],"B":[{"id":"L10-B-1","n":1,"text":"Какво означава „симетрична“ в името SMP?","opts":["Процесорите са разположени симетрично","Паметта е разделена поравно","Всеки процесор има своя ОС","Всеки процесор може да изпълнява всяка задача"],"correct":3,"expl":"Всички процесори са равноправни."},{"id":"L10-B-2","n":2,"text":"Какви технологии се използват за програмиране на MPP компютри?","opts":["OpenGL и DirectX","VAL и Id","PVM и MPI","SQL и XML"],"correct":2,"expl":"Обмен на съобщения: Parallel Virtual Machine и Message-Passing Interface."},{"id":"L10-B-3","n":3,"text":"Как се наричат класическите SMP компютри по отношение на достъпа до паметта?","opts":["UMA","NUMA","ccNUMA","COMA"],"correct":0,"expl":"Uniform Memory Access — еднакъв достъп от всеки процесор."},{"id":"L10-B-4","n":4,"text":"Колко процесора обикновено обединява NUMA архитектурата?","opts":["2–4","256 и повече","8–16","32–64"],"correct":1,"expl":"SMP сървърите са 8–16, NUMA — 256+."},{"id":"L10-B-5","n":5,"text":"Какво е характерно за възлите на клъстерната система?","opts":["Стандартни компютри със свое копие на ОС","Еднобитови процесори без операционна система","Процесори, управлявани от една обща ОС","Систолични клетки с общ контролер"],"correct":0,"expl":"Масово произвеждани компютри; допуска се хетерогенност."},{"id":"L10-B-6","n":6,"text":"Какви са функциите на канала в CSP модела?","opts":["Съхранение и маршрутизация","Буферизация и кеширане","Арбитраж ва конфликти."},{"id":"L10-C-4","n":4,"text":"От какво е изграден всеки възел на NUMA компютър?","opts":["Един процесор без собствена памет","Систолична матрица и контролер","Няколко процесора и модул памет (малък SMP)","Диск и входно-изходен контролер"],"correct":2,"expl":"Възелът се разглежда като SMP компютър."},{"id":"L10-C-5","n":5,"text":"Каква е разликата във времето за достъп, при която NUMA се „държи“ като SMP?","opts":["200–700%","50–100%","1000%","5–10%"],"correct":3,"expl":"При малка разлика програмите за SMP вървят без промени."},{"id":"L10-C-6","n":6,"text":"Кой е пример за клъстерна система?","opts":["Beowulf на NASA","ILLIAC IV","iWarp","Connection Machine"],"correct":0,"expl":"Beowulf, KLAT2, SGI Origin."},{"id":"L10-C-7","n":7,"text":"Какво показва отношението t_s/t?","opts":["Колко процесора има системата","Какъв е дялът на последователния код","Колко по-бавна е комуникацията от операцията","Колко възела има в NUMA"],"correct":2,"expl":"При t_s/t ≫ 1 е ефективен само грубият паралелизъм."},{"id":"L10-C-8","n":8,"text":"Колко пъти по-бърз е грубият паралелизъм от последователния алгоритъм в примера?","opts":["Около 1.2 пъти","Около 3.5 пъти","Около 10 пъти","По-бавен е"],"correct":1,"expl":"Транспютър T805, 4 процесора — средно 3.5×."},{"id":"L10-C-9","n":9,"text":"Какво означава c = 1 в модела S(P) ≈ P/(c + W(P)·P/T(1))?","opts":["Равномерно натоварване на процесорите","Пълна липса на комуникации","Само един процесор в системата","Максимален дисбаланс на натоварването"],"correct":0,"expl":"c е коефициентът на дисбаланс; c > 1 при неравномерно."},{"id":"L10-C-10","n":10,"text":"Кой определя времето за решаване при неравномерно натоварване?","opts":["Най-бързият процесор","Средно натоварения процесор","Главният компютър","Най-натовареният процесор"],"correct":3,"expl":"Останалите завършват по-рано и чакат."}]}},{"num":11,"title":"Лекция 11 — Компютри с потоково управление (dataflow)","short":"Компютри с потоково управление (dataflow)","summary":"### 1. Принцип на потоковото управление\n- В класическия **фон Ноймановски** компютър командите се изпълняват **строго последователно**, а редът се определя от **брояча на командите** (управляващ маркер).\n- В компютрите с **потоково управление** всяка команда е **готова за изпълнение в момента, в който са налични всичките ѝ операнди**, независимо от мястото ѝ в програмата → командите с готови операнди се изпълняват **едновременно**, а паралелизмът на програмата се открива и използва **естествено и автоматично**.\n\n| | **Управление по данни (data-driven, dataflow)** | **Управление по заявки (demand-driven, reduction)** |\n|---|---|---|\n| Кога се активира командата | при **постъпване на всички операнди** | когато е **необходим резултатът** ѝ |\n| Поведение | командата **чака пасивно** операндите | при липса на операнд **изпраща заявка** към командата, която го произвежда |\n| Представяне на програмата | **граф (потокова мрежа)** — върхове = команди, дъги = потоци данни; движат се **маркери** | структура от **вложени математически изрази** |\n| Изпълнение | движение на маркерите по дъгите | **редукция на изрази** — последователно заместване на подизразите с техните стойности |\n\n### 2. Пример: y1 = x2(x1 + x2), y2 = x1(x1 + x2), x1 = 3, x2 = 2\n- Команди: **Pa**: V3 = x1 + x2; **Pb** и **Pc** — двете умножения по V3.\n- **Класическа организация**: командата се разрешава от **управляващ маркер** (брояча на командите); изпълнява се Pa, после Pb, после Pc — **последователно**; резултатите се записват в променливи (клетки на паметта).\n- **Потокова организация**: Pa се изпълнява веднага щом x1 и x2 са налични (V3 = 5); резултатът се изпраща **директно** в командите, които го ползват — като операнд на **Pb и Pc** (адресната част на командата посочва всички получатели); Pb и Pc получават операндите си едновременно и се изпълняват **паралелно** (резултати 15 и 10).\n- Изпълнението не предизвиква **странични ефекти** (не променя общи клетки на паметта) — зависи само от стойностите на операндите.\n\n### 3. Качествени свойства на потоковите компютри\n- **Паралелизъм** — максимално използване на наличния паралелизъм на задачата.\n- **Модулно нарастване** — N разрешени команди могат да се изпълнят от **1, 2, … N** процесорни елемента без промяна на програмата; могат да се добавят модули, а броят им може да се **променя динамично** (адаптивност).\n- **Асинхронни изчисления** — разрешените команди/процеси се изпълняват **асинхронно и независимо**, без грешки и блокировки в останалите.\n- **Самоидентификация на информацията** — всеки обект носи **идентификатор** за вида, свойствата и състоянието си; дешифрирането е **апаратно**.\n- **Разпределена обработка** — множество операционни елементи работят паралелно и асинхронно → компютърът е разпределена изчислителна система.\n\n### 4. Управление — спускови функции\n- **Спускова функция** — механизмът, който **проверява наличието на всички операнди** на командата и **разрешава** изпълнението ѝ. Реализацията ѝ е основната задача на управлението.\n\n| Критерий | Вид | Същност |\n|---|---|---|\n| Начин на реализация | **централизирано** управление | едно централно устройство проверява готовността, избира и предава разрешените команди |\n| | **разпределено** управление | спусковите функции са в много устройства или в **клетките на паметта**; всяка команда „сама\" установява готовността си |\n| Ниво на реализация | **микрониво** | отделна спускова функция за **всяка команда** → паралелизъм на ниво команди |\n| | **макрониво** | спускова функция за **части от програмата** (процедури, подпрограми, макрокоманди) → паралелизъм на ниво програмни единици |\n\nДвете нива могат да се съчетаят в един компютър.\n\n### 5. Статичен и динамичен модел\n| | **Статичен** | **Динамичен** |\n|---|---|---|\n| Копия на командата | **едно** | **повече от едно** (създават се копия) |\n| Повторно изпълнение | невъзможно, преди да е завършило предходното | няколко изпълнения **едновременно** |\n| Маркери на дъгите | капацитет *
