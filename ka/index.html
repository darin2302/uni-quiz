*1 маркер** | **повече от 1 маркер** |\n| Паралелизъм | само толкова, колкото е зададен в машинната програма | открива се **динамично** в хода на изчисленията → **по-висок** |\n| Език (пример) | VAL, LAU | Id |\n\n### 6. Изчислителна среда и формат на командите\n- Изчислителната среда е от **голям брой операционни елементи (ОЕ)**, работещи асинхронно; всеки ОЕ получава **цялата информация** за командата (код, стойности на операндите, назначение на резултата). Добавянето на ОЕ е само физическо свързване.\n- Видове според ОЕ: със **специализирани ОЕ**; с **универсални ОЕ**; с **универсални процесорни модули** (ОЕ + локална памет — изчислителната и запомнящата среда са интегрирани).\n\n**Формат на командата (командна клетка):** `OP | SA | DV1 | D1 | DV2 | D2`\n\n| Поле | Значение |\n|---|---|\n| **OP** | код на операцията |\n| **SA** | адрес на резултата (командната клетка-получател) |\n| **D1, D2** | **стойностите** на операндите (не адреси!) |\n| **DV1, DV2** | **флагове за наличност** на операндите |\n\n- Командата е **данни, снабдени с допълнителна информация**; за разлика от триадресната команда тя съдържа самите **стойности**. Първоначално D1, D2 липсват; те идват като резултати от други клетки. Когато **DV1 и DV2 са „готовност\"**, се изпълнява OP(D1, D2), а резултатът се изпраща в клетката, посочена от **SA**.\n\n### 7. Запомняща среда\n- Съхранява команди, входни данни, междинни и крайни резултати **и идентификатори** (етикети на команди, имена на операнди, указатели на назначението, маркери).\n- Има **активна роля**: (1) участва в **спусковите функции** — проверява наличността на операндите (флагове/идентификатори); (2) **подготвя изпълнението** — комплектова код на операцията, операнди и назначение на резултата.\n- **Голям разход на памет** — за идентификатори, копия на командите (динамичен модел), копия на входните данни, междинни резултати.\n- Функционална специализация на областите: памет за команди, за данни, за комплектоване на операнди, буфери.\n- По метода на достъп: с **адресен**, с **асоциативен** достъп и **безадресни (стекови)** памети.\n\n### 8. Комуникация и езици\n- Асинхронната работа изисква **силно развити средства за комуникация**. Два метода:\n  - **предаване на съобщения** — блокове с **различна дължина**, всеки с адрес на приемника;\n  - **предаване на пакети** — съобщения с **фиксирана дължина**; типове: **командни** (команда + операнди), **операндни** (стойности на операнди), **резултатни** (резултат от команда), **служебни** (маркери за данни или за заявки).\n- Комуникационни ресурси: **устройства за управление на обмена** (разпределящи, комутиращи, арбитриращи), **буфери** (заради асинхронността) и **канали**.\n- **Потоковите езици** имат **стойностен характер** — данните са стойности, които се **поглъщат и изработват еднократно**; правило за **еднократно присвояване** → **липса на странични ефекти**. Структурните данни също са стойности (промяна на елемент създава нова стойност).\n- Примери: **LAU** (Тулуза), **VAL** (MIT) — за **статичен** тип; **Id** (Ървин) — за **динамичен** тип.\n\n### 9. Структура на потоковия компютър\nТри способа за свързване на ОЕ:\n1. **Пряко взаимно свързване** — програмата се задава чрез **физическа комутация** (като при аналоговите машини) → **максимална скорост**, но **няма универсалност**.\n2. **Матричен превключвател**, управляван от програмата → универсален, но **сложността на връзките расте стремително** с броя операции.\n3. **Комуникационна мрежа** — съединенията са **логически пътища** → практически **единственият приложим** способ.\n\nЧетири основни структури (без I/O): **с обща шина** (един канал във времеделение), **разпределена** (еднакви модули — универсални ОЕ с памет), **кръгова** и **йерархична**; могат да се комбинират.\n- **Кръговата структура** работи като **цикличен конвейер** от изчислителни, комуникационни и запомнящи устройства, свързани с множество паралелни **еднопосочни канали**; изчислителната част е от независими паралелни ОЕ, запомнящите устройства са специализирани (за команди, за операнди) или с паралелен достъп; включва разпределяща, арбитрираща и управляваща схема.\n\n### 10. Проблеми на компютрите с потоково управление\n1. **Обръщения към паметта** — класическите компютри имат **висока локалност** → кеш, йерархична памет, изпреварващо извличане на команди, регистри. В потоковите тези прийоми са трудни; много паралелни ОЕ изискват **изключително висока пропускателна способност към паметта**; частично решение — по-високо функционално ниво на ОЕ.\n2. **Регулярни структури (масиви)** — масивът се третира като набор независими елементи → векторните операции се свеждат до **скаларни**, обръщенията стават **рандомизирани** и **разслояването** на паметта не може да се използва; обработката на индекси носи **непродуктивни разходи** → препоръчва се **функционален блок от високо ниво** за регулярни структури.\n3. **Система за прекъсвания** — **липсва** класическият апарат; изключенията се обработват чрез **специални стойности-грешки** (напр. „стойност-грешка-препълване\"), които се предават по потока до следващия оператор, който предприема реакция.\n\n### Капани за изпита\n- Dataflow = **по готовност на данните**; reduction = **по заявка за резултат** — не ги бъркай.\n- В командата се пазят **стойностите** на операндите, не адресите им; SA е адресът на **получателя на резултата**.\n- Статичният модел има **едно копие** и **1 маркер** на дъга; динамичният — копия и повече маркери → по-висок паралелизъм.\n- Спусковата функция **проверява наличността на операндите** — не е прекъсване.\n- Запомнящата среда е **активна** (спускови функции + комплектоване), не само склад.\n- Единственият практичен способ за структура е **комуникационна мрежа** (логически път); прякото свързване е най-бързо, но не е универсално.\n- Потоковите компютри **нямат** класическа система за прекъсвания и трудно ползват **кеш** и **разслояване**.\n- Във формулите на примера уеб версията и печатният учебник разменят кое умножение е Pb и кое Pc — важен е принципът: V3 отива едновременно към двете умножения.\n","testNames":["A","B","C"],"tests":{"A":[{"id":"L11-A-1","n":1,"text":"Кога се изпълнява командата в компютър с управление по данни?","opts":["Когато са налични всичките ѝ операнди","Когато броячът на командите я посочи","Когато е поискан резултатът ѝ","Когато настъпи прекъсване"],"correct":0,"expl":"Командата чака пасивно операндите си."},{"id":"L11-A-2","n":2,"text":"Как се представя програмата при управление по данни?","opts":["Като вложени математически изрази","Като граф с върхове-команди и дъги-данни","Като последователност с брояч на командите","Като таблица от прекъсвания"],"correct":1,"expl":"Потокова мрежа; маркерите се движат по дъгите."},{"id":"L11-A-3","n":3,"text":"Как се нарича изпълнението при управление по заявки?","opts":["Ъглово завъртане","Разслояване на паметта","Редукция на изрази","Конвейеризация"],"correct":2,"expl":"Подизразите се заместват с техните стойности."},{"id":"L11-A-4","n":4,"text":"Какво представлява спусковата функция?","opts":["Механизъм за обработка на прекъсвания","Брояч на изпълнените команди","Алгоритъм за маршрутизация","Проверка за наличност на операндите"],"correct":3,"expl":"Тя разрешава изпълнението, когато всички операнди са налице."},{"id":"L11-A-5","n":5,"text":"Какво позволява динамичният модел за разлика от статичния?","opts":["Само едно копие на всяка команда","Едновременни изпълнения на копия на команда","Изпълнение по брояч на командите","Изпълнение без операнди"],"correct":1,"expl":"Копия на командата (повече маркери на дъгите)."},{"id":"L11-A-6","n":6,"text":"Какво съдържат полетата D1 и D2 на потоковата команда?","opts":["Адресите на операндите","Флаговете за наличност","Стойностите на операндите","Кода на операцията"],"correct":2,"expl":"За разлика от триадресната команда — самите стойности."},{"id":"L11-A-7","n":7,"text":"Кое правило прилагат потоковите езици?","opts":["Многократно присвояване","Глобални променливи","Явно синхронизиране","Еднократно присвояване"],"correct":3,"expl":"Стойностен характер, липса на странични ефекти."},{"id":"L11-A-8","n":8,"text":"Кой е практически единственият приложим способ за свързване на ОЕ?","opts":["Комуникационна мрежа с логически път","Пряко физическо свързване на ОЕ","Матричен превключвател","Една обща шина без арбитраж"],"correct":0,"expl":"Прякото свързване не е универсално, превключвателят става твърде сложен."},{"id":"L11-A-9","n":9,"text":"Как се обработва препълване в потоков компютър?","opts":["Чрез класическо апаратно прекъсване","Чрез рестартиране на цялата програма","Чрез специална стойност-грешка в потока","Чрез промяна на брояча на командите"],"correct":2,"expl":"„Стойност-грешка-препълване“ се предава до следващия оператор."},{"id":"L11-A-10","n":10,"text":"Защо в потоковите компютри не може да се използва разслояване при масиви?","opts":["Масивите се съхраняват в регистри","Обръщенията към паметта са рандомизирани","Няма комуникационна мрежа","Командите нямат код на операцията"],"correct":1,"expl":"Масивът е набор от независими елементи — няма линеен достъп."}],"B":[{"id":"L11-B-1","n":1,"text":"Какво управлява реда на изпълнение в класическия компютър на фон Нойман?","opts":["Наличността на операндите","Заявките за резултати","Флаговете DV1 и DV2","Броячът на командите"],"correct":3,"expl":"Управляващият маркер е броячът на командите."},{"id":"L11-B-2","n":2,"text":"Какво прави команда при управление по заявки, ако ѝ липсва операнд?","opts":["Чака пасивно, без да прави нищо","Генерира стойност-грешка","Изпраща заявка към командата-производител","Използва стойност по подразбиране"],"correct":2,"expl":"Demand-driven — заявка към командата, която произвежда операнда."},{"id":"L11-B-3","n":3,"text":"Какво означава свойството „модулно нарастване“?","opts":["Броят ОЕ се мени без промяна на програмата","Програмата се разделя на отделни модули","Паметта се разширява с нови модули","Командите се групират в общи модули"],"correct":0,"expl":"N разрешени команди могат да се изпълнят от 1…N ОЕ."},{"id":"L11-B-4","n":4,"text":"На какво ниво е спусковата функция при управление на макрониво?","opts":["На ниво отделна команда","На ниво части от програмата","На ниво бит","На ниво операнд"],"correct":1,"expl":"Процедури, подпрограми, макрокоманди."},{"id":"L11-B-5","n":5,"text":"Какъв капацитет имат дъгите в статичния модел?","opts":["Един маркер","Неограничен брой маркери","Два маркера","Нула маркери"],"correct":0,"expl":"Една команда — едно копие — един маркер на дъга."},{"id":"L11-B-6","n":6,"text":"Какво указва полето SA в командната клетка?","opts":["Стойността на първия операнд","Флага за наличност","Кода на операцията","Адреса на получателя на резултата"],"correct":3,"expl":"Резултатът OP(D1, D2) се изпраща в клетката, посочена от SA."},{"id":"L11-B-7","n":7,"text":"Какви пакети съдържат маркери за данни или за заявки?","opts":["Командни","Служебни","Операндни","Резултатни"],"correct":1,"expl":"Четири типа: командни, операндни, резултатни, служебни."},{"id":"L11-B-8","n":8,"text":"Кой потоков език е предназначен за динамичен тип компютри?","opts":["VAL","LAU","Id","Occam"],"correct":2,"expl":"VAL и LAU — за статичен, Id — за динамичен тип."},{"id":"L11-B-9","n":9,"text":"Как работи кръговата структура на потоковия компютър?","opts":["Като една обща шина с времеделение","Като йерархично двоично дърво","Като пълен граф от операционни елементи","Като цикличен конвейер от устройства"],"correct":3,"expl":"Изчислителни, комуникационни и запомнящи устройства в кръг."},{"id":"L11-B-10","n":10,"text":"Защо кешът е трудно приложим в потоковите компютри?","opts":["Липсва локалност на обръщенията","Липсват команди за запис","Операндите са в регистрите","Паметта е само стекова"],"correct":0,"expl":"Класическите компютри имат висока локалност; потоковите — не."}],"C":[{"id":"L11-C-1","n":1,"text":"Какъв паралелизъм се използва в потоковите компютри?","opts":["Само паралелизмът по време","Максималният, заложен в програмата","Само зададеният от програмиста","Само паралелизмът по пространство"],"correct":1,"expl":"Открива се автоматично според готовността на данните."},{"id":"L11-C-2","n":2,"text":"Какво означава „самоидентификация на информацията“?","opts":["Програмистът указва типовете на данните","Командите нямат адреси на операнди","Паметта има само асоциативен достъп","Всеки обект носи идентификатор за вида си"],"correct":3,"expl":"Идентификаторите се дешифрират апаратно."},{"id":"L11-C-3","n":3,"text":"Какво е характерно за разпределеното управление в потоков компютър?","opts":["Всяка команда сама установява готовността си","Едно устройство проверява всички команди","Главният компютър разрешава командите","Броячът на командите задава реда"],"correct":0,"expl":"Проверката е в много устройства или в клетките на паметта."},{"id":"L11-C-4","n":4,"text":"Кога се изпълнява командата с формат OP | SA | DV1 | D1 | DV2 | D2?","opts":["Когато полето SA е празно","Когато кодът OP е нулев","Когато DV1 и DV2 са „готовност“","Когато стойностите D1 = D2"],"correct":2,"expl":"Флаговете показват наличието на двата операнда."},{"id":"L11-C-5","n":5,"text":"Коя е активната роля на запомнящата среда в потоковия компютър?","opts":["Изпълнява аритметичните операции","Генерира прекъсвания","Управлява брояча на командите","Участва в спусковите функции"],"correct":3,"expl":"Проверява наличността на операндите и комплектова командите."},{"id":"L11-C-6","n":6,"text":"С какво се отличава предаването на пакети от предаването на съобщения?","opts":["Пакетите са с фиксирана дължина","Пакетите са с различна дължина","Пакетите нямат адрес","Пакетите са само за команди"],"correct":0,"expl":"Пакетът е частен случай на съобщение с фиксирана дължина."},{"id":"L11-C-7","n":7,"text":"Какво е предимството на прякото свързване на ОЕ?","opts":["Пълна универсалност на програмите","По-лесно програмиране","Максимална скорост на обработка","Малък брой физически връзки"],"correct":2,"expl":"Липсва му обаче универсалност."},{"id":"L11-C-8","n":8,"text":"Какъв е проблемът при матричния превключвател?","opts":["Липсва му универсалност","Сложността на връзките расте стремително","Работи само със статичен модел","Изисква брояч на командите"],"correct":1,"expl":"Универсален е, но не се мащабира апаратно."},{"id":"L11-C-9","n":9,"text":"Какво се препоръчва за обработка на масиви в потоковите компютри?","opts":["Функционален блок от високо ниво","Класическа система за прекъсвания","Премахване на маркерите","Брояч на командите за всеки ОЕ"],"correct":0,"expl":"Блок, ориентиран към регулярни структури."},{"id":"L11-C-10","n":10,"text":"Кои са четирите основни структури на потоковите компютри?","opts":["Линийка, решетка, тор, хиперкуб","SMP, MPP, NUMA, клъстер","Статична, динамична, хибридна, фиксирана","С обща шина, разпределена, кръгова, йерархична"],"correct":3,"expl":"Могат да се комбинират на различни нива."}]}},{"num":12,"title":"Лекция 12 — Комуникационни мрежи","short":"Комуникационни мрежи","summary":"### Защо е нужна комуникационна мрежа (КМ)\n- Паралелният компютър има нужда от среда за обмен на информация между процесорите (и модулите памет) — **комуникационна мрежа (КМ)**.\n- Прехвърлянето на данни, команди и управляващи сигнали изисква време — **комуникационни загуби**; то се **прибавя** към изчислителното време и може да изяде очакваното ускорение.\n- Два подхода за намаляване на загубите: **оптимално разпределение на задачата** (код и данни) по процесорите/модулите памет (паралелни алгоритми) и **повишаване на скоростта на КМ** — чрез по-бърза логика или чрез **подходяща структурна организация** (архитектурният аспект).\n- В общия случай КМ е **многополюсник M×N** (входове → предаватели, изходи → приемници; разглежда се M = N), изграден от **комутиращи елементи (КЕ)** и **линии за връзка (ЛВ)**. Описва се като **граф**: върхове = КЕ, дъги = ЛВ.\n\n### Комутация по пространство и по време\n| Клас | Принцип | Сложност | Време за трансфер | Представители |\n|---|---|---|---|---|\n| **По пространство** | всяка двойка получава **индивидуална ЛВ** | висока **O(N²)** | малко **O(1)** | матричен превключвател (**crossbar**), пълно свързана мрежа |\n| **По време** | много двойки **споделят обща линия** в различни моменти | ниска **O(1)** | голямо **O(N)** | **шина** |\n| **Комбинирана** | съчетава двата подхода | средна | средно | многостъпални мрежи |\n\n### Четирите характеристики на всяка КМ\n- **Режим на работа** — **синхронен** (връзките се установяват синхронно, SIMD), **асинхронен** (връзките се създават динамично, MIMD) и **комбиниран**.\n- **Стратегия на управление** — **централизирана** (специално устройство изчислява пътищата) или **децентрализирана / разпределена** (самите КЕ изчисляват маршрута).\n- **Метод на превключване** — **схемно (канално)**: физически път за целия сеанс, подходящо за малко на брой обемни предавания; **програмно (пакетно)**: данни в пакети без предварително установен път, подходящо за чести кратки съобщения.\n- **Топология** — ключовият фактор; бива **регулярна** и **нерегулярна** (в паралелните компютри — само регулярна), а регулярната е **статична** или **динамична**.\n\n### Статични срещу динамични КМ\n| | **Статични (СКМ)** | **Динамични (ДКМ)** |\n|---|---|---|\n| Връзки | **непосредствени** само между строго определени двойки, останалите — **индиректно** (през междинни възли) | **директна** връзка между **произволна** двойка чрез **реконфигурация** на активните КЕ |\n| Роля на процесора | процесорите играят роля на **КЕ** | отделни КЕ (превключватели) |\n| Комутация | обикновено пакетна | схемна и пакетна |\n| Предимства | проста, евтина, мащабируема (при U = const), удобна за клъстери/MPP | гъвкавост, висока пропускателност, много едновременни връзки (SMP, NUMA) |\n| Недостатък | несъседните възли общуват през няколко прехода (време ~ **O(D)**) | цена и сложност; при много стъпала — по-голямо време и сложно управление |\n| Примери | линийка, кръг, решетка, тор, дърво, звезда, хиперкуб, ILLIAC IV | crossbar, delta, omega, flip, Клос, Бенес, shuffle-exchange |\n\n### Параметри за оценка на статичните КМ\n- **N — брой върхове** (процесори).\n- **D — диаметър**: максималното от минималните разстояния (брой дъги) между произволна двойка върхове → **най-лошото закъснение**; при оптимална маршрутизация времето за обмен е **O(D)**.\n- **P — средно разстояние**: средна дължина на пътя от всеки връх до всички останали при равновероятен избор → **средно закъснение**.\n- **T — натовареност на ЛВ**: брой съобщения за единица време върху една линия: **T = N·P / (общ брой ЛВ)** → показва „задръстванията“.\n- **U — относителна структурна сложност**: брой ЛВ, отнесен към един връх; при **U = const** (независимо от N) мрежата се разширява с **еднотипни** процесори → **мащабируемост** и ниска цена.\n- **Отказоустойчивост**: наличие на **алтернативни пътища** за заобикаляне на отказал компонент (решетката я има; кръгът и двоичното дърво — практически не).\n- В литературата се ползват и **степен на върха** (брой съседи) и **ширина на бисекцията** (минимален брой ЛВ, които трябва да се прекъснат, за да се раздели мрежата на две равни половини — мярка за пропускателността между половините).\n- За повечето топологии параметрите се намират с алгоритъм за най-къси пътища в граф (**Форд**, **Дейкстра**).\n\n### Таблица на статичните топологии (N върха)\n| Топология | Степен | Диаметър D | Брой ЛВ | Бисекция |\n|---|---|---|---|---|\n| **Линийка (конвейер)** | 2 (краищата 1) | **N − 1** | N − 1 | 1 |\n| **Кръг** | 2 | **⌊N/2⌋** | N | 2 |\n| **Звезда** | N − 1 (център), 1 | **2** | N − 1 | ⌊N/2⌋ |\n| **Двоично дърво** (N = 2^k − 1) | 3 | **2(k − 1)** | N − 1 | 1 |\n| **Квадратна решетка** √N×√N | 4 | **2(√N − 1)** | 2(N − √N) | √N |\n| **Тор** √N×√N | 4 | **2⌊√N/2⌋** | 2N | 2√N |\n| **ILLIAC IV** | 4 | **√N − 1** | 2N | ≈ 2√N |\n| **Двоичен хиперкуб** (N = 2^d) | **d = log₂N** | **log₂N** | **(N/2)·log₂N** | N/2 |\n| **Пълно свързана** | N − 1 | **1** | N(N − 1)/2 | N²/4 |\n\nПримери от учебника: кръг с 8 върха → D = 4; решетка 4×4 → D = 6.\n\n### Скици на основните статични топологии\nЛинийка и кръг (N = 8):\n```\nЛинийка:  0 — 1 — 2 — 3 — 4 — 5 — 6 — 7\n\nКръг:     0 — 1 — 2 — 3\n          |           |\n          7 — 6 — 5 — 4\n```\nРешетка 4×4 и тор 3×3 (при тора краищата на всеки ред и стълб са свързани — ↔ и ↕):\n```\nРешетка:  o—o—o—o          Тор:     ↕   ↕   ↕\n          | | | |                 ↔ o — o — o ↔\n          o—o—o—o                   |   |   |\n          | | | |                 ↔ o — o — o ↔\n          o—o—o—o                   |   |   |\n          | | | |                 ↔ o — o — o ↔\n          o—o—o—o                   ↕   ↕   ↕\n```\nДвоично дърво и звезда:\n```\nДърво:          o                Звезда:   o   o\n              /   \\                         \\ /\n             o     o                     o — * — o\n            / \\   / \\                       / \\\n           o   o o   o                     o   o\n```\nДвоичен хиперкуб 3D (N = 8, всеки възел е свързан с d = 3 съседа, чийто адрес се различава в един бит):\n```\n      110 ─────── 111\n     / |         / |\n  010 ─────── 011  |\n   |  100 ──────|─ 101\n   | /          | /\n  000 ─────── 001\n```\nДруги: **хипердърво**, **кръг с хорди**, **ILLIAC IV** (решетка 4×4, в която i се свързва с i±1 и i±√N по mod N).\n\n### Двоичен хиперкуб\n- Обобщена хиперкубична мрежа: **N = W^d** (W върха по всяка размерност, d — размерност); при **W = 2** → **двоичен хиперкуб**.\n- **N = 2^d** възела, **d·2^(d−1)** ребра, всеки възел има **d** съседа; превключващи функции **cube_i** — инвертират **i-тия бит** на адреса (cube0(0) = 1, cube1(0) = 2, cube2(0) = 4 при N = 8).\n- **Диаметър = d = log₂N**; средно разстояние d·2^(d−1)/(2^d − 1) → **≈ d/2**.\n- Рекурсивна дефиниция **Q1 = K2, Qd = K2 × Qd−1** → съдържа много **подкубове**: програма за малък куб работи без промяна на по-голям; големият куб се дели между много потребители (мултипрограмиране, защита на паметта).\n- **Регулярен и симетричен** — структурата е еднаква от всеки възел; в него могат да се **влагат** дърво, кръг, решетка.\n- Недостатък: степента **расте с d** (log₂N) → броят на връзките на възел ограничава размерността.\n- Може да е **статична** мрежа или **многостъпална ДКМ**: d стъпала по **N/2** КЕ 2×2.\n\n### Динамични КМ — класификация\n- Формално ДКМ е функция **F: {N} → {N}** — пермутация на входно-изходните адреси.\n- **Едностъпални (рециркулационни)** — съобщенията могат да минат многократно през стъпалото (shuffle-exchange, ILLIAC IV); служат за изграждане на по-сложните.\n- **Многостъпални** → **едностранни** (двупосочни ЛВ) и **двустранни** (входна и изходна страна). Двустранните са:\n  - **блокиращи** — свързването на една двойка може да блокира друга (**манипулатор, delta, omega, flip**);\n  - **напълно неблокиращи** — всяка двойка без конфликт (**мрежа на Клос**, пълно свързана мрежа, crossbar);\n  - **неблокиращи с реконфигурация** — всяка двойка може да се свърже, но понякога трябва да се **пренаредят** вече установени маршрути (**мрежа на Бенес**, битонална мрежа).\n- Повече стъпала (k) с по-прости КЕ → **по-голямо време за предаване** и **по-сложен алгоритъм за управление**.\n\n### Параметри за оценка на динамичните КМ\n- **Време за предаване ≈ O(k)** (k — брой стъпала); по-малко стъпала → по-сложни и по-бавни КЕ.\n- **Сегментируемост** — разделяне на **независими подмрежи** с пълните възможности на мрежата (data manipulator — да; shuffle-exchange и ILLIAC IV — не).\n- **Ширина на лентата на пропускане** — **очакван брой приети заявки за единица време**; оценява се най-често с **имитационни модели**. За crossbar N×M: **B ≈ M·[1 − (1 − 1/M)^(N·p)]**, p — вероятност за заявка.\n\n### Комутиращ елемент\n- По сложност се доближава до микропроцесор: **буферна памет, адресни регистри, компаратори, мултиплексори, комутаторен елемент, локален контролер, приоритетна логика**.\n- Размерът на буфера влияе решаващо; трафикът се регулира по-добре с **приоритетна дисциплина**, отколкото с повече буфери.\n- Най-разпространен — **2×2**; важни състояния: **право предаване**, **размяна (кръстосано)**, **разпръскване** (един вход към два изхода), **трето състояние**.\n- Управление чрез **тяг T = X ⊕ Y** (адрес на предавателя XOR адрес на приемника): КЕ в i-тото стъпало превключва според **i-тия бит** на тяга (0 → право, 1 → размяна). Пример: X = 010, Y = 111 → T = 101.\n- **Интелигентни КЕ**: локално разпределение на товара, регулация на трафика (насищане, мъртво блокиране), синхронизация на процеси.\n\n### Конкретни мрежи\n- **ILLIAC IV**: I±1(i) = (i ± 1) mod N, I±q(i) = (i ± q) mod N, **q = √N**; 4 съседа; D = √N − 1.\n- **Shuffle-exchange**: shuffle = **цикличен ляв шифт** на адреса (shuffle(1) = 2), exchange = cube0 (инвертира младшия бит); едностъпална или многостъпална с d стъпала.\n- **Мрежа на Клос**: три стъпала n×m, r×r, m×n, **N = n·r**; при **m ≥ 2n − 1** е **напълно неблокираща**; при m = n = r — мрежа „**Мемфис**“.\n- **Мрежа на Бенес**: рекурсивна, **2log₂N − 1 стъпала**, **N(2log₂N − 1)/2** КЕ; неблокираща с реконфигурация, но установяването изисква **O(N·log₂N)** → динамичното съединяване е непрактично. За N = 8: 5 стъпала, 20 КЕ.\n\n### Капани за изпита\n- „**Два основни вида**“ КМ = **статични и динамични** (по топология); не ги бъркай с комутация **по пространство / по време** — ако въпросът пита „колко вида“, спомени и двете класификации.\n- **Диаметърът** е **максималното** от **минималните** разстояния, а не най-дългият възможен път.\n- **T = N·P / брой ЛВ** — средното разстояние P е в числителя.\n- Хиперкуб: **D = степен = log₂N**, ребра **(N/2)·log₂N**; при N = 16 → D = 4, 32 ребра.\n- Кръг: D = **N/2**, линийка: D = **N − 1**, решетка √N×√N: **2(√N − 1)**, ILLIAC IV: **√N − 1**.\n- Crossbar е **по пространство** (O(N²) цена, O(1) време); шината е **по време** (O(1) цена, O(N) време).\n- **Клос** — напълно неблокираща (m ≥ 2n − 1); **Бенес** — неблокираща **с реконфигурация**; **omega/delta** — блокиращи.\n- **Схемното** превключване е за **малко, но обемни** предавания; **пакетното** — за **кратки** съобщения.\n- При „начертайте“ — нарисувай поне кръг, решетка, дърво, хиперкуб и посочи D за всяка.","testNames":["A","B","C"],"tests":{"A":[{"id":"L12-A-1","n":1,"text":"Каква е основната разлика между статичните и динамичните комуникационни мрежи?","opts":["Статичните свързват пряко само определени двойки, динамичните — произволна двойка чрез реконфигурация","Статичните използват само схемно превключване, а динамичните — само пакетно превключване на данните","Статичните имат по-малък диаметър от динамичните при един и същ брой свързани процесори","Динамичните мрежи не съдържат комутиращи елементи, а статичните се изграждат само от тях"],"correct":0,"expl":"При СКМ директни връзки има само между определени възли; ДКМ реконфигурира КЕ и свързва произволна двойка."},{"id":"L12-A-2","n":2,"text":"Как се дефинира диаметърът D на статична КМ?","opts":["Броят на линиите за връзка, отнесен към един връх на мрежата","Минималният брой линии, чието прекъсване разделя мрежата на две","Максималното от минималните разстояния между произволна двойка върхове","Средното разстояние от всеки връх до всички останали върхове в мрежата"],"correct":2,"expl":"D = най-голямото от най-късите разстояния (в брой дъги) — определя най-лошото закъснение."},{"id":"L12-A-3","n":3,"text":"Какъв е диаметърът на двоичен хиперкуб с N = 64 възела?","opts":["3","6","32","8"],"correct":1,"expl":"D = log₂N = log₂64 = **6**."},{"id":"L12-A-4","n":4,"text":"Към кой клас КМ се отнася шината?","opts":["Комутация по пространство — сложност O(N²), време O(1)","Напълно неблокираща многостъпална динамична мрежа","Статична мрежа с топология двоично дърво и диаметър log₂N","Комутация по време — ниска сложност O(1), голямо време O(N)"],"correct":3,"expl":"Шината се споделя във времето от много двойки предавател–приемник."},{"id":"L12-A-5","n":5,"text":"Колко ребра (линии за връзка) има двоичен хиперкуб с размерност d = 4?","opts":["64","32","24","16"],"correct":1,"expl":"d·2^(d−1) = 4·8 = **32**."},{"id":"L12-A-6","n":6,"text":"Какво изразява относителната структурна сложност U на статична КМ?","opts":["Брой линии за връзка, отнесени към един връх","Броят на процесорите, които могат да откажат","Брой съобщения за единица време по една линия","Максималното разстояние между два произволни върха"],"correct":0,"expl":"При U = const мрежата се разширява с еднотипни процесори — лесна мащабируемост."},{"id":"L12-A-7","n":7,"text":"Коя мрежа е напълно неблокираща при m ≥ 2n − 1?","opts":["Мрежата на Бенес","Омега мрежата","Делта мрежата","Мрежата на Клос"],"correct":3,"expl":"Условието m ≥ 2n − 1 е за тристъпалната мрежа на Клос."},{"id":"L12-A-8","n":8,"text":"Какъв е диаметърът на квадратна решетка 4×4 (N = 16)?","opts":["8","3","6","4"],"correct":2,"expl":"D = 2(√N − 1) = 2·3 = **6** (пример от учебника)."},{"id":"L12-A-9","n":9,"text":"По каква формула се определя натовареността T на линиите за връзка?","opts":["T = N·P / (общ брой линии за връзка)","T = (общ брой линии за връзка) / (N·D)","T = D·N / (брой на комутиращите елементи)","T = P / (N · брой на линиите за връзка)"],"correct":0,"expl":"Броят съобщения за единица време върху една ЛВ: N·P, разделено на броя ЛВ."},{"id":"L12-A-10","n":10,"text":"Каква е функцията на превключване cube_i при двоичния хиперкуб?","opts":["Измества адреса циклично наляво","Добавя √N към адреса по mod N","Нулира младшите i бита на адреса","Инвертира i-тия бит на адреса"],"correct":3,"expl":"cube_i(…q_i…) = …q̄_i… — съседите се различават в един бит."}],"B":[{"id":"L12-B-1","n":1,"text":"Кой е типичен представител на КМ с комутация по пространство?","opts":["Общата системна шина с арбитър","Матричният превключвател (crossbar)","Двоичното дърво от процесори","Линийката (конвейер) от процесори"],"correct":1,"expl":"Crossbar дава индивидуална линия на всяка двойка — сложност O(N²), време O(1)."},{"id":"L12-B-2","n":2,"text":"Какъв е диаметърът на кръг с N = 8 върха?","opts":["8","3","7","4"],"correct":3,"expl":"D = N/2 = **4** (пример от учебника)."},{"id":"L12-B-3","n":3,"text":"Кои са четирите основни характеристики на една КМ?","opts":["Режим на работа, стратегия на управление, метод на превключване и топология","Буферна памет, адресни регистри, компаратори и приоритетна логика","Диаметър, средно разстояние, натовареност и относителна структурна сложност","Брой стъпала, сегментируемост, ширина на лентата и време за предаване"],"correct":0,"expl":"Четирите въпроса, решавани от всяка КМ; второто са параметри на СКМ."},{"id":"L12-B-4","n":4,"text":"За какво е подходящо схемното (канално) превключване?","opts":["За много на брой кратки съобщения между процесорите","За мрежи без предварително установен физически път","За малко на брой предавания на голям обем данни","За едностъпални рециркулационни мрежи с пакети"],"correct":2,"expl":"Физическият път се поддържа през целия сеанс — изгодно при обемни предавания."},{"id":"L12-B-5","n":5,"text":"Каква е степента (брой съседи) на всеки възел в двоичен хиперкуб с N = 1024?","opts":["4","32","10","512"],"correct":2,"expl":"Степента е d = log₂1024 = **10**."},{"id":"L12-B-6","n":6,"text":"Към кой вид ДКМ се отнася мрежата на Бенес?","opts":["Едностъпална рециркулационна","Неблокираща с реконфигурация","Напълно неблокираща","Блокираща"],"correct":1,"expl":"Всяка двойка може да се свърже, но понякога трябва да се пренаредят съществуващите маршрути."},{"id":"L12-B-7","n":7,"text":"Какво означава сегментируемост на динамична КМ?","opts":["Разделяне на независими подмрежи с всички възможности на мрежата","Разделяне на съобщенията на пакети с фиксирана дължина","Разделяне на мрежата на стъпала с комутиращи елементи 2×2","Разделяне на адресите на старши и младши разряди при маршрута"],"correct":0,"expl":"Сегментирането позволява независима работа на подмрежи (data manipulator — да, shuffle-exchange — не)."},{"id":"L12-B-8","n":8,"text":"Колко стъпала има мрежа на Бенес с N = 8 входа?","opts":["8","6","3","5"],"correct":3,"expl":"2log₂N − 1 = 2·3 − 1 = **5**."},{"id":"L12-B-9","n":9,"text":"Какъв е тягът T при X = 010 и Y = 111?","opts":["001","101","111","010"],"correct":1,"expl":"T = X ⊕ Y = 010 ⊕ 111 = **101** — превключване в стъпала 0 и 2."},{"id":"L12-B-10","n":10,"text":"Коя статична топология НЕ осигурява алтернативни пътища при отказ?","opts":["Двумерната решетка","Двоичният хиперкуб","Двоичното дърво","Двумерният тор"],"correct":2,"expl":"В дървото пътят между два възела е единствен — отказ на възел прекъсва връзката."}],"C":[{"id":"L12-C-1","n":1,"text":"Каква е сложността и времето за трансфер при КМ с комутация по пространство?","opts":["Сложност O(1), време за трансфер O(N)","Сложност O(N), време за трансфер O(log N)","Сложност O(N²), време за трансфер O(1)","Сложност O(log N), време за трансфер O(N²)"],"correct":2,"expl":"Индивидуални линии — скъпо (N²), но бързо (константно време)."},{"id":"L12-C-2","n":2,"text":"Какво представлява средното разстояние P в статична КМ?","opts":["Средната дължина на пътя от всеки връх до останалите","Средният брой линии за връзка на един връх","Средният брой съобщения по една линия за връзка","Половината от диаметъра на мрежата при четно N"],"correct":0,"expl":"P се определя при равновероятен избор на предавател и приемник."},{"id":"L12-C-3","n":3,"text":"Какъв е диаметърът на линийка (конвейер) с N = 10 процесора?","opts":["4","5","10","9"],"correct":3,"expl":"D = N − 1 = **9**."},{"id":"L12-C-4","n":4,"text":"Кои ДКМ са блокиращи?","opts":["Клос и пълносвързаната мрежа","Делта, омега, флип и манипулатор","Бенес и битоналната мрежа","Crossbar и мрежата Мемфис"],"correct":1,"expl":"Свързването на една двойка може да блокира друга двойка."},{"id":"L12-C-5","n":5,"text":"Как се изчислява диаметърът на мрежата ILLIAC IV с N = 16?","opts":["N/2 = 8","log₂N = 4","2(√N − 1) = 6","√N − 1 = 3"],"correct":3,"expl":"За ILLIAC IV D = √N − 1 = 4 − 1 = **3**."},{"id":"L12-C-6","n":6,"text":"Какво прави функцията shuffle в мрежата shuffle-exchange?","opts":["Разменя старшата и младшата половина","Инвертира най-младшия бит на адреса","Циклично измества адреса с един бит наляво","Прибавя единица към адреса по модул N"],"correct":2,"expl":"shuffle(q_{d−1}…q_0) = q_{d−2}…q_0 q_{d−1}; exchange инвертира младшия бит."},{"id":"L12-C-7","n":7,"text":"Каква е ширината на лентата на пропускане на динамична КМ?","opts":["Броят на стъпалата, през които минава съобщението","Очакваният брой приети заявки за единица време","Максималната дължина на пакета в битове","Броят на входовете, умножен по броя на изходите"],"correct":1,"expl":"Оценява се най-често с имитационни модели."},{"id":"L12-C-8","n":8,"text":"Колко комутиращи елемента 2×2 има многостъпалната мрежа тип двоичен куб с N = 16?","opts":["32","64","8","16"],"correct":0,"expl":"d стъпала по N/2 КЕ: 4·8 = **32**."},{"id":"L12-C-9","n":9,"text":"При каква стратегия на управление самите КЕ изчисляват маршрута?","opts":["Схемна с установен физически път","Централизирана с управляващ блок","Децентрализирана (разпределена)","Синхронна с общ тактов сигнал"],"correct":2,"expl":"Без специално управляващо устройство — изчисленията са в КЕ."},{"id":"L12-C-10","n":10,"text":"Защо хиперкубът е удобен за мултипрограмиране?","opts":["Има най-малката степен на възел сред всички статични топологии","Съдържа много подкубове, които се дават на отделни потребители","Не изисква маршрутизация, защото всички възли са съседи","Има диаметър 1 независимо от броя на процесорите"],"correct":1,"expl":"Qd = K2 × Qd−1 — операционната система назначава подкуб на всеки клиент."}]}},{"num":13,"title":"Лекция 13 — Архитектура на паметта","short":"Архитектура на паметта","summary":"### Два подхода към организацията на паметта\n- Назначение на паметта — да **съхранява информацията** и да я предава „в бъдещето“.\n- Два подхода: **вертикална (йерархична)** организация и **хоризонтална** организация (**разслояване** на адресното пространство).\n\n| | **Вертикална (йерархична)** | **Хоризонтална (разслоена)** |\n|---|---|---|\n| Цел | **намаляване на времето за достъп** (средното латентно) | **увеличаване на броя достъпи за единица време** |\n| Принцип | бърза малка памет близо до процесора, бавна голяма — далеч; **локалност на обръщенията** | паметта се разбива на **N модула**, достъпвани **паралелно/конвейерно** |\n| Обхват | регистри → кеш L1/L2/L3 → основна памет → диск | само **основната памет** |\n| Къде | почти всички съвременни компютри | **векторни** компютри, компютри с **потоково управление**, където кеш е невъзможен/нецелесъобразен |\n| Механизми | кеш, **виртуална организация на паметта** | **пакетна** и **конвейерна** обработка на достъпите |\n| Слабост | промахи (miss), кохерентност | **конфликти** при непоследователен достъп, зависимост от разположението на данните |\n\n### Вертикална организация — същност и принципи\n- Идеалът е **„плосък“ модел** — една единствена памет. Невъзможен е, защото: **битът бърза памет е по-скъп** от бита бавна; **по-голям обем → по-голямо време за достъп** (при една и съща технология).\n- Принцип: **най-близо до процесора — най-бързата, но малка памет; най-далеч — най-голямата и най-бавна**.\n- За висока ефективност времената за достъп на съседните нива трябва да се различават **около порядък**.\n\n| Ниво | Време за достъп | Типичен размер | Технология | Управление |\n|---|---|---|---|---|\n| Регистри | 1–3 ns | ~1 KB | CMOS | компилатор |\n| L1 кеш (в чипа) | 2–8 ns | 8–128 KB | SRAM | апаратно |\n| L2 кеш | 5–12 ns | 0,5–8 MB | SRAM | апаратно |\n| Основна памет | 10–60 ns | 64 MB–1 GB | DRAM | ОС |\n| Твърд диск | 3–10 млн. ns | 20–100 GB | магнитна | ОС / потребител |\n\n- **Ширина на лентата на предаване (bandwidth)** — максималната скорост на предаване от/към паметта. Изчислителният процес трябва да използва максимално **по-горното ниво**, преди да се наложи презареждане от по-долното.\n- Динамичното прехвърляне между нивата по време на изпълнение = **виртуална организация на паметта**.\n- **Положителни ефекти**: подобрени работни характеристики на процесора; **увеличена пропускателна способност**; достъп до **големи количества данни за малко време**; **цената на паметта е близка до тази на външната памет, а средното време за достъп — близко до това на най-бързата**.\n\n### Кеш паметта и локалността\n- ~**25 %** от инструкциите се обръщат към паметта → времето за достъп е критично; кешът позволява **повече от една инструкция за такт**.\n- Кешът се базира на **локалността на обръщенията** — универсално свойство на програмите:\n  - **Локалност по време** — веднъж направено обръщение към дадена клетка, тя с голяма вероятност ще бъде потърсена **отново в близко бъдеще**. Примери: **цикли**, подпрограми, прекъсвания; „горещи“ данни — **броячи**, преглед на таблици, **натрупващи променливи**, **стекови променливи**.\n  - **Локалност по пространство (специална)** — при обръщение към клетка **съседните клетки** вероятно ще бъдат достъпени скоро. Примери: **последователен поток от инструкции**, обработка на **масиви, матрици, низове** от начало до край.\n- **Локалността по време включва локалността по пространство, но не и обратно.**\n- Кодът има силна локалност по време, данните — по-слаба → кешът се дели на **i-cache** (команди) и **d-cache** (данни).\n\n### Средно време за достъп и вероятност за попадение\n- **p** — вероятност за **попадение (hit)**, t_c — време за достъп до кеша, t_m — до основната памет:\n  - **τ = p·t_c + (1 − p)·t_m** — средно ефективно време за достъп;\n  - **S = t_m / τ = a / [p + (1 − p)·a]**, където **a = t_m / t_c** — ускорение спрямо система без кеш;\n  - **E = S / a** — ефективност на кеша (E = 1 при p = 1, E → 1/a при p = 0).\n- Пример: p = 0,9, t_c = 2 ns, t_m = 60 ns → τ = 1,8 + 6 = **7,8 ns**, S ≈ 7,7.\n- **p не може да е 1**: кешът е **многократно по-малък** от основната памет; първо обръщение към нов блок (студен кеш), **колизии** и **заместване** на блокове, преходи към нови области → **промахът (miss) е неизбежен**.\n- **p не може да е 0**: програмите проявяват **локалност** — веднъж зареден блок се използва отново (цикли, съседни данни в блока), значи има поне минимален процент попадения.\n- p зависи от: **размера на кеша**, **размера на блока**, **асоциативността**, **стратегията за заместване**, типа програма и работното множество.\n\n### Включваща и изключваща организация\n- **Включваща (inclusive)** — по-горното ниво е подмножество на по-долното (L1 ⊂ L2 ⊂ RAM); общият обем на кеша = обема на **последното ниво**.\n- **Изключваща (exclusive)** — AMD **Duron** (L1 = 128 KB > L2 = 64 KB): нивата съдържат **различна** информация; общ обем = **сумата** на нивата (192 KB), но по-сложно управление.\n\n### Операции с кеша и асоциативност\n- Обменът е на **блокове**; кешът е разделен на **фреймове**. Процесорът трябва да определи: **има ли блока в кеша** (hit/miss), **къде е** блокът и **къде е байтът** в блока. Признаците (таговете) са в **tag RAM**.\n\n| Метод | Как | Плюс | Минус |\n|---|---|---|---|\n| **Пълна асоциативност** | всеки блок → **всеки фрейм** | няма колизии | претърсва се **цялата tag RAM** → голямо закъснение |\n| **Директно съответствие** | всеки блок → **точно един фрейм** (блок mod брой фреймове) | минимално търсене, бързо | **колизии** (блокове 0 и 8 при 8 фрейма) |\n| **n-кратна (частична) асоциативност** | блокът → **група от n фрейма** | компромис: по-малко търсене от пълната, по-малко колизии от директната | по-висока асоциативност → повече тагове за проверка |\n\n- Директното съответствие = **еднопътна** асоциативност; пълната асоциативност = n-кратна с **n = броя на блоковете**.\n\n### Заместване и запис\n- **Заместване**: случаен блок, **FIFO**, **LIFO** — не отчитат локалността; затова се използва **LRU (Least Recently Used)** — заменя се блокът, **неизползван най-дълго**.\n- **Write-back** — записва се само в L1, по-долните нива се обновяват **при заместване** на блока → **по-висока производителност** (по-малко прехвърляния).\n- **Write-through** — записва се **едновременно във всички нива** → по-лесно поддържане на **валидността** (многопроцесорни системи, интензивен вход/изход).\n\n### Кохерентност (SMP)\n- В **SMP** всеки процесор има свой кеш, а паметта е обща → при запис от процесор 1 копията в другите кешове стават **невалидни**.\n- Решение: апаратно **„подслушване“ (snooping)** на системната шина и протокол **MESI**: **Modified** (променена, паметта невалидна), **Exclusive** (единствено копие, паметта валидна), **Shared** (копия в няколко кеша), **Invalid**.\n\n### Размер на блока, латентност, пропускателна способност\n- По-голям блок → по-добре се използва **локалността по пространство**, но **до предел**: при постоянен обем на кеша → **по-малко блокове** → повече промахи; „**замърсяване**“ на кеша с ненужни данни; изяжда **лентата на шината**.\n- **Латентност** — време от заявката до получаване на отговора (път до паметта + намиране + връщане); измерва се в тактове на процесора.\n- **Пропускателна способност** — реално предадена информация за единица време; максималната е **недостижима** (шината се заема и за адреси/управление).\n- **Burst Mode** — при едно обръщение се предава **цял блок**; само първата дума изисква пълното закъснение → ефективната пропускателна способност расте значително.\n\n### Хоризонтална организация (разслоена памет)\n- Най-проста форма: паметта е разделена на **две половини** — команди и данни, с едновременен достъп = **Харвардска архитектура** (IBM **STRETCH**); днес — **L1 i-cache / d-cache**.\n- **Пакетна обработка (batch)**: N = 2^k модула; **старшите m разряда** на адреса се подават към всички модули, **младшите k** избират думата → четат се **N последователни думи** наведнъж в буфери, следващите обръщения са **N пъти по-бързи**. Идеално при **последователен** достъп (вектори); при интервал q: средно време **q·t/N при q ≤ N** и **t при q > N**.\n- **Конвейерна обработка (pipeline)**: фиксатори на адресните шини → **всеки модул със свой адрес**; контролерът стартира заявката, ако модулът е свободен, иначе я задържа. **N-кратно ускорение**, ако в N последователни заявки никой модул не се ползва два пъти.\n- И двата метода дават N-кратно ускорение при последователни адреси; при произволна равномерна последователност N-кратно разслоената памет е поне **2 пъти по-бърза** от един модул.\n- **Минуси**: **конфликти** при обръщения към един модул; спад при **непоследователен** достъп и много преходи; изисква **правилно разположение на данните**.\n\n### Разположение на данните\n- Матрица X(4,4) в 4 модула:\n  - **стандартно (по редове)** — без конфликт по **ред** и по **диагонал**, конфликт по **стълб**;\n  - **скосено (skewed)** — ред i се измества с i позиции → без конфликт по **редове и стълбове**, но **не по диагоналите** (TRANQUIL за ILLIAC IV: STRAIGHT / SKEWED);\n  - **напълно безконфликтно** — **M модула > N процесора**, M = **първото просто число > N** (Burroughs **BSP**: 512 процесора, **521** модула).\n\n### Капани за изпита\n- Вертикалната **намалява времето** за достъп, хоризонталната **увеличава броя достъпи за единица време** — не ги разменяй.\n- Хоризонталната засяга **само основната памет** и се ползва където **кеш е невъзможен/нецелесъобразен** (векторни, потокови компютри).\n- **Локалността по време включва пространствената**, обратното не е вярно.\n- **p ≠ 0** заради **локалността**, **p ≠ 1** заради **малкия обем** на кеша (и колизии/заместване).\n- **τ = p·t_c + (1 − p)·t_m** — внимавай кое тегло е към кое време.\n- Директно съответствие = **еднопътна**; пълна асоциативност = n = **брой блокове**.\n- **Write-back** — по-бърз; **write-through** — по-лесна кохерентност.\n- Изключваща организация — **Duron**, общ обем = **сума**; включваща — обем = **последното ниво**.\n- BSP: **521** модула за **512** процесора (първото просто число).","testNames":["A","B","C"],"tests":{"A":[{"id":"L13-A-1","n":1,"text":"Каква е основната цел на вертикалната (йерархична) организация на паметта?","opts":["Да намали средното време за достъп до информацията","Да раздели командите и данните в отделни модули","Да осигури кохерентност между кешовете в SMP","Да увеличи броя на достъпите за единица време"],"correct":0,"expl":"Вертикалната организация намалява времето за достъп; хоризонталната — увеличава броя достъпи."},{"id":"L13-A-2","n":2,"text":"Какво гласи локалността по време?","opts":["Данните в кеша се обновяват периодично през определено време","При достъп до клетка вероятно ще се достъпят и съседните клетки","Веднъж достъпена клетка вероятно ще бъде потърсена отново скоро","Командите винаги се изпълняват в реда на тяхното разположение"],"correct":2,"expl":"Примери: цикли, броячи, стекови променливи."},{"id":"L13-A-3","n":3,"text":"Средно време за достъп при p = 0,9, t_c = 2 ns и t_m = 60 ns е:","opts":["6,2 ns","7,8 ns","55,0 ns","8,0 ns"],"correct":1,"expl":"τ = 0,9·2 + 0,1·60 = 1,8 + 6 = **7,8 ns**."},{"id":"L13-A-4","n":4,"text":"Коя стратегия за заместване в кеша отчита локалността на обръщенията?","opts":["LIFO","Случаен избор","FIFO","LRU"],"correct":3,"expl":"LRU заменя блока, използван преди най-много време."},{"id":"L13-A-5","n":5,"text":"Кой метод на свързване претърсва цялата tag RAM?","opts":["Четирикратната асоциативност","Пълната асоциативност","Директното съответствие","Двукратната асоциативност"],"correct":1,"expl":"Всеки блок може да е във всеки фрейм — затова се претърсват всички тагове."},{"id":"L13-A-6","n":6,"text":"При каква стратегия за запис се обновяват всички нива едновременно?","opts":["Write-through","Write-back","Write-allocate","Write-around"],"correct":0,"expl":"Write-through записва навсякъде — по-лесна валидност, по-ниска производителност."},{"id":"L13-A-7","n":7,"text":"Каква е целта на хоризонталната организация на паметта?","opts":["Намаляване на времето за достъп до един модул","Изграждане на йерархия от памети с различна скорост","Намаляване на цената на един бит от паметта","Увеличаване на броя на достъпите за единица време"],"correct":3,"expl":"Чрез разслояване на N модула се обслужват много достъпи паралелно."},{"id":"L13-A-8","n":8,"text":"Кой процесор въвежда изключващата (exclusive) организация на кеша?","opts":["Intel Itanium-2","Intel Pentium 4","AMD Duron","MIPS R10000"],"correct":2,"expl":"При Duron L1 = 128 KB > L2 = 64 KB, затова включващата организация е невъзможна."},{"id":"L13-A-9","n":9,"text":"Колко модула памет са използвани в Burroughs BSP с 512 процесора?","opts":["521","512","513","1024"],"correct":0,"expl":"Първото просто число, по-голямо от 512, е **521**."},{"id":"L13-A-10","n":10,"text":"Какво означава състояние Modified в протокола MESI?","opts":["Няколко кеша съдържат валидно копие на линията","Кешовата линия е невалидна и трябва да се зареди","Линията е единствено копие и паметта е валидна","Линията е променена и копието в паметта е невалидно"],"correct":3,"expl":"M — модифицирана; E — изключителна; S — споделена; I — невалидна."}],"B":[{"id":"L13-B-1","n":1,"text":"Защо „плоският“ модел на паметта (едно ниво) е невъзможен?","opts":["Едно ниво памет не позволява използването на виртуална организация","Бързата памет е по-скъпа, а по-големият обем увеличава времето за достъп","Бързата памет губи съдържанието си без постоянно опресняване","Процесорът не може да адресира повече от едно ниво памет едновременно"],"correct":1,"expl":"Двете фундаментални причини: цена на бита и ръст на времето за достъп с обема."},{"id":"L13-B-2","n":2,"text":"Какво е директното съответствие (direct-mapped)?","opts":["Блоковете се записват последователно и се заменят по FIFO","Всеки блок от паметта може да е в произволен фрейм на кеша","Блокът може да е в произволен фрейм от група от n фрейма","Всеки блок от паметта може да е само в един определен фрейм"],"correct":3,"expl":"Бързо търсене, но риск от колизии."},{"id":"L13-B-3","n":3,"text":"Кой е пример за локалност по пространство?","opts":["Последователна обработка на елементите на масив","Многократно обновяване на брояч на цикъл","Повторно извикване на една и съща подпрограма","Използване на натрупваща сумата променлива"],"correct":0,"expl":"Съседните елементи се достъпват последователно; другите са примери за локалност по време."},{"id":"L13-B-4","n":4,"text":"При кеш с 8 фрейма и директно съответствие, в кой фрейм попада блок 19?","opts":["1","0","3","2"],"correct":2,"expl":"19 mod 8 = **3**."},{"id":"L13-B-5","n":5,"text":"Защо кешът се разделя на i-cache и d-cache?","opts":["Кешът за команди работи с write-back, а за данни — не","Командите се записват в кеша, а данните — само в паметта","Кодът има силна локалност по време, а данните — по-слаба","Данните изискват пълна асоциативност, а командите — не"],"correct":2,"expl":"Различната локалност на кода и данните е причината за разделянето."},{"id":"L13-B-6","n":6,"text":"Каква е ефективността E на кеша, ако ускорението е S = 6, а a = t_m/t_c = 20?","opts":["3,3","0,3","0,6","120"],"correct":1,"expl":"E = S/a = 6/20 = **0,3**."},{"id":"L13-B-7","n":7,"text":"Какъв е общият обем на кеша при изключваща организация с L1 = 128 KB и L2 = 64 KB?","opts":["192 KB","64 KB","256 KB","128 KB"],"correct":0,"expl":"При изключващата организация обемите се сумират: 128 + 64 = **192 KB**."},{"id":"L13-B-8","n":8,"text":"С какъв механизъм се решава кохерентността на кешовете в SMP?","opts":["Изключваща организация на нивата L1 и L2","Разслояване на основната памет на N модула","Стратегия за заместване LRU във всеки кеш","Подслушване (snooping) на шината с протокол MESI"],"correct":3,"expl":"Snooping + MESI — четири състояния на кешовата линия."},{"id":"L13-B-9","n":9,"text":"Какво е средното време за достъп при пакетна разслоена памет с N = 8, t = 80 ns и интервал q = 2?","opts":["10 ns","20 ns","80 ns","160 ns"],"correct":1,"expl":"При q ≤ N: q·t/N = 2·80/8 = **20 ns**."},{"id":"L13-B-10","n":10,"text":"Какво се случва, ако размерът на кешовия блок се увеличи прекомерно при постоянен обем на кеша?","opts":["Кешът автоматично преминава към пълна асоциативност","Броят на колизиите в tag RAM намалява до нула","Блоковете стават по-малко и промахите се увеличават","Локалността по време престава да има значение"],"correct":2,"expl":"Ползата от пространствената локалност има предел; голям блок замърсява кеша и шината."}],"C":[{"id":"L13-C-1","n":1,"text":"Кое е вярно за включващата (inclusive) организация на кеша?","opts":["L2 е подмножество на L1 и е по-малък по обем от него","Всяко ниво съдържа само команди или само данни","L1 е подмножество на L2, а общият обем е равен на последното ниво","L1 и L2 съдържат различна информация и обемите им се сумират"],"correct":2,"expl":"При включващата организация всяко по-долно ниво съдържа горното."},{"id":"L13-C-2","n":2,"text":"Каква е n-кратната (частична) асоциативност?","opts":["Блокът може да е в произволен фрейм от определена група от n фрейма","Кешът се дели на n независими нива с различна скорост на достъп","Блокът може да е само в един фрейм, еднозначно определен от адреса му","Блокът може да е в произволен фрейм на целия кеш без ограничения"],"correct":0,"expl":"Компромис между пълната асоциативност и директното съответствие."},{"id":"L13-C-3","n":3,"text":"Какво е предимството на write-back пред write-through?","opts":["По-лесно поддържане на валидността на данните в многопроцесорни системи","Данните винаги са актуални едновременно във всички нива на паметта","Не изисква никакъв механизъм за заместване на блоковете в кеша","По-рядко прехвърляне към по-долните нива и по-висока производителност"],"correct":3,"expl":"Обновяването става едва при заместване на блока."},{"id":"L13-C-4","n":4,"text":"Колко е увеличението на скоростта S при p = 0,5 и a = t_m/t_c = 10?","opts":["10,0","≈ 1,8","≈ 0,55","5,0"],"correct":1,"expl":"S = a/[p + (1 − p)a] = 10/(0,5 + 5) ≈ **1,82**."},{"id":"L13-C-5","n":5,"text":"Къде се прилага главно хоризонталната организация на паметта?","opts":["В регистровия файл на суперскаларните RISC процесори","В персоналните компютри с многонивова кеш памет L1/L2","Във външната дискова памет на транзакционните системи","Във векторните компютри и компютрите с потоково управление"],"correct":3,"expl":"Там въвеждането на кеш е невъзможно или нецелесъобразно."},{"id":"L13-C-6","n":6,"text":"Какво е характерно за скосеното (skewed) разположение на матрица в разслоена памет?","opts":["Безконфликтен достъп по редове и диагонали, но не и по стълбове","Безконфликтен достъп само до първия ред и първия стълб","Безконфликтен достъп по редове и стълбове, но не и по диагоналите","Безконфликтен достъп по всички направления без ограничения"],"correct":2,"expl":"Ред i се измества с i позиции; диагоналите остават конфликтни."},{"id":"L13-C-7","n":7,"text":"При конвейерната разслоена памет N-кратно ускорение се постига, ако:","opts":["Интервалът между адресите е по-голям от броя на модулите N","В N последователни заявки нито един модул не се ползва повече от веднъж","Процесорът използва стратегия за запис write-through в кеша","Всички N последователни заявки се отнасят до един и същ модул"],"correct":1,"expl":"Иначе заявката към зает модул се задържа."},{"id":"L13-C-8","n":8,"text":"Каква е латентността на паметта?","opts":["Времето от изпращане на заявката до получаване на отговора","Броят думи, прочетени наведнъж от модулите на паметта","Количеството информация, предадено между паметта и процесора за секунда","Броят на тактовете, необходими за запис на блок в кеша"],"correct":0,"expl":"Включва пътя до паметта, намирането на данните и връщането им."},{"id":"L13-C-9","n":9,"text":"Каква е същността на Burst Mode?","opts":["Данните се записват едновременно във всички нива на йерархията на паметта","Всеки модул на разслоената памет получава собствен относителен адрес","При едно обръщение се предава цял блок, само първата дума е с пълно закъснение","Кешът се разделя на две части — за команди и за данни"],"correct":2,"expl":"Burst Mode повишава ефективната пропускателна способност."},{"id":"L13-C-10","n":10,"text":"Защо вероятността за попадение в кеша не може да бъде 1?","opts":["Кешът се изпразва след всяка команда за преход","Кешът е многократно по-малък от основната памет","Основната памет е по-бърза от кеша при запис","Програмите не проявяват локалност по време"],"correct":1,"expl":"Не всички нужни блокове могат да бъдат едновременно в кеша."}]}},{"num":14,"title":"Лекция 14 — Дискова памет","short":"Дискова памет","summary":"### Място и значение на дисковата памет\n- Дисковата памет е част от **входно-изходната подсистема** и основният носител на **вторичната памет** — **най-отдалеченото** (най-бавно, най-голямо) ниво на йерархията на паметта.\n- Разликата в производителността между процесора и диска **расте**: по учебника производителността на процесорите се удвоява всяка година, плътността на паметите — на 2 години, а плътността на записа — на 3 години → усъвършенстването на диска е **не по-малко важно** от това на процесора.\n- Развитието е в два аспекта — **технологичен** и **архитектурен**; архитектурният **допълва** технологичния, не го замества.\n\n### Обслужване на заявка към диска\n| Компонент | Какво е | От какво зависи |\n|---|---|---|\n| **Време за достъп (seek time)** | позициониране на главите над търсената **пътечка** | ускорение при старт, **брой пресечени пътечки** |\n| **Време за изчакване (rotational latency)** | завъртане, докато търсеният **сектор** дойде под главата | **скорост на въртене (об/мин)**; средно = **половин оборот** |\n| **Време за предаване (transfer time)** | физическо предаване на данните диск ↔ компютър | **брой байтове**, скорост на канала |\n\n- **T_обсл ≈ T_seek + T_rot + T_transfer** (+ малко време на контролера).\n- **T_rot (средно) = ½ · 60 / RPM**: при **7 200 об/мин** оборотът е ≈ **8,33 ms**, средното изчакване ≈ **4,17 ms**; при 10 000 → **3 ms**; при 15 000 → **2 ms**.\n- **T_transfer = обем / скорост**: 4 KB при 100 MB/s ≈ **0,04 ms** — пренебрежимо спрямо seek + rotation.\n- Пример: seek 8 ms, 10 000 об/мин (3 ms), предаване 1 ms → **≈ 12 ms**.\n- При малки блокове шината се използва неефективно → високопроизводителните системи **освобождават шината по време на позициониране** (съвместяване на много позиционирания) и използват **буфер за пътечката** (данните се изпращат, когато шината е свободна).\n\n### Метрики на работното натоварване\n- **Производителност** — брой обслужени заявки за единица време (IOPS).\n- **Време за изчакване (латентност)** — време за обслужване на една заявка.\n- **Пропускателна способност** — количество данни, предадени за единица време (MB/s).\n\n| | **Суперкомпютри / научни задачи** | **Транзакционни системи** |\n|---|---|---|\n| Заявки | големи, **последователни** масиви | много **кратки, случайни** заявки |\n| Важно | **висока пропускателна способност**, малко латентно | **висока производителност (заявки/s)**, умерено латентно |\n| Доминира | **времето за предаване** | **seek + rotational latency** |\n| Ефект от по-бързо предаване | голям — всяко подобрение на технологията помага | **почти никакъв** |\n\n### Дискови матрици (disk arrays) и RAID\n- Идея: няколко физически диска работят като **един логически диск** — паралелизъм (Patterson, Gibson, Katz, Бъркли, **1987**).\n- Предимства: **една голяма заявка** се обслужва от много дискове паралелно или **много независими заявки** се обслужват едновременно; изгражда се от **евтини масови дискове**.\n- Недостатък — **надеждността**: **MTTF_матрица = MTTF_диск / брой дискове** (1 000 000 h / 100 диска = **10 000 h**).\n- Решение — **излишна (redundant) информация** за сметка на капацитет/пропускателност → **RAID** (Redundant Array of Independent Discs).\n- **MTTR** се намалява с **„горещ резерв“ (hot spare)**, който се включва автоматично при отказ.\n\n### Нива на RAID\n| Ниво | Принцип | Излишък | Плюсове | Минуси |\n|---|---|---|---|---|\n| **RAID 0** | разделяне (**striping**) по блокове/битове | няма | **максимална производителност**, 100 % капацитет | отказ на 1 диск = загуба на всичко |\n| **RAID 1** | **огледални дискове (mirroring)** | 50 % | отлична надеждност, добро четене | 50 % капацитет; запис ×2 (с 1 контролер) |\n| **RAID 2** | разслоение **по битове** + **код на Хеминг** | C = ⌈log₂G⌉ | корекция на грешки | изместено — дисковете имат вграден ECC |\n| **RAID 3** | разслоение **по байтове**, **1 диск четност (XOR)** | 1 диск | четене като RAID 0, за **суперкомпютри** | контролният диск е **тясно място** при запис |\n| **RAID 4** | разслоение **по блокове**, **1 диск четност** | 1 диск | отлично четене | малките записи се бутат на контролния диск |\n| **RAID 5** | блокове + **разпределена четност** | ≈ 1 диск | няма тясно място; до (G+1)/2 паралелни записа | минимум 3 диска; запис = четене + изчисление |\n| **RAID 6** | блокове + **двойна разпределена четност** (редове и стълбове) | ≈ 2 диска | понася отказ на **2 диска** | **6 обръщения** на логически запис |\n| **RAID 7** | асинхронно, **кеширано**; търговско (Storage Computer Corp.) | — | висока производителност и надеждност | скъпо, нестандартно |\n\n- **Нова четност = (стари данни ⊕ нови данни) ⊕ стара четност** (RAID 4/5 при малък запис).\n- RAID 2 при G = 10 диска данни → **C = 4** контролни → **≈ 71 %** ефективен капацитет.\n- Капацитет: RAID 5 ≈ **(N − 1)/N** (5 диска → 80 %), RAID 6 ≈ **(N − 2)/N**, RAID 1 и 10 → **50 %**.\n- **Съставни**: **RAID 0+1** — огледало на два striped набора; **RAID 1+0 (10)** — striping върху огледални двойки (минимум **4 диска**), **по-добра отказоустойчивост и по-лесно възстановяване** от 0+1.\n\n### Програмна и апаратна реализация на RAID\n- **Програмна** — по-евтина, за малки системи; цялата тежест е върху администратора; не винаги се реализират напълно предимствата на нивото.\n- **Апаратна** — по-скъпа, но: **горещо подменяне** на диск без спиране, по-богата проверка на грешки, защита от грешки на администратора; почти всички поддържат **RAID 0, 1, 0+1 и 5**.\n\n### Архитектура на контролерите\n- **Адаптер на шината (HBA, Host Bus Adapter)** — интерфейс компютър ↔ матрица, обикновено с **DMA**.\n- **Контролер на матрицата** — интерфейс към дисковите контролери, **буфери**, изчисляване на **четността**, **съответствие логически ↔ физически сектори**.\n- **Контролер на диска** — управление на физическо ниво, **ECC**, **буфер за пътечката**, синхронизация на позиционирането.\n- Шината до дисковете — обща мултиплексна или отделна за всеки диск (SCSI); разширение до **двумерна матрица** (контролери на редове); за максимална надеждност **всичко се дублира** → единичен отказ не води до загуба на данни.\n\n### Дискова памет при компютрите с разпределена памет\n- Изгражда се **разпределена входно-изходна подсистема** от **входно-изходни възли** — всеки е част от **разпределен файлов сървър**.\n- **Силно свързана система** — всеки процесор има **свои дискове** → малко латентно и висока обща ширина на лентата (IBM LCAP-1/2).\n- **Слабо свързана система** — В/И възли **по периферията** (Intel Touchstone Delta) или **вътре** в изчислителната матрица (Intel Paragon) → по-голямо латентно, по-малка лента.\n- Проблеми: **мащабируема производителност** на В/И, **балансирано натоварване**, **увеличен комуникационен трафик**, **ограничена ширина на лентата** на каналите.\n\n### Капани за изпита\n- Средното време за изчакване е **половин** оборот, не цял: 7 200 об/мин → **≈ 4,17 ms**.\n- Транзакционните системи **не печелят** от по-бързо предаване — доминират **seek и rotation**; суперкомпютрите печелят.\n- **MTTF на матрицата намалява** с броя дискове (делиш, не умножаваш).\n- **RAID 0 няма излишък** — не е „истински“ RAID по надеждност.\n- RAID 3 — по **байтове**, RAID 4 — по **блокове**, и двете с **един** диск четност; **RAID 5** разпределя четността и **маха тясното място**.\n- RAID 6 понася **два** отказа; RAID 5 — **един**.\n- **RAID 10** (огледала, после striping) е по-надежден от **RAID 0+1**.\n- RAID 7 **не е отворен стандарт**.","testNames":["A","B","C"],"tests":{"A":[{"id":"L14-A-1","n":1,"text":"Кои са трите основни компонента на времето за обслужване на заявка към диска?","opts":["Време за достъп (seek), време за изчакване (rotation) и време за предаване","Време за форматиране, време за дефрагментация и време за запис","Време за кеширане, време за кодиране с ECC и време за декодиране","Време за арбитраж на шината, време за DMA и време за прекъсване"],"correct":0,"expl":"Позициониране + изчакване на сектора + предаване на данните."},{"id":"L14-A-2","n":2,"text":"Какво е средното време за изчакване (rotational latency) при 7 200 об/мин?","opts":["≈ 8,33 ms","≈ 2,00 ms","≈ 4,17 ms","≈ 7,20 ms"],"correct":2,"expl":"Оборот = 60/7200 ≈ 8,33 ms; средно — половин оборот ≈ **4,17 ms**."},{"id":"L14-A-3","n":3,"text":"Кое RAID ниво разделя данните без никакъв излишък?","opts":["RAID 3","RAID 0","RAID 5","RAID 1"],"correct":1,"expl":"RAID 0 (striping) — максимална производителност, нулева отказоустойчивост."},{"id":"L14-A-4","n":4,"text":"Каква е MTTF на матрица от 100 диска, ако MTTF на един диск е 1 000 000 часа?","opts":["100 000 часа","100 000 000 часа","1 000 000 часа","10 000 часа"],"correct":3,"expl":"MTTF_матрица = MTTF_диск / брой дискове = 10⁶/100 = **10 000 h**."},{"id":"L14-A-5","n":5,"text":"Каква е основната разлика между RAID 4 и RAID 5?","opts":["При RAID 5 данните се разслояват по битове, а не по блокове","При RAID 5 четността е разпределена между всички дискове","При RAID 4 няма никаква контролна информация за грешки","При RAID 4 всеки диск има огледално копие на друг диск"],"correct":1,"expl":"RAID 5 премахва тясното място на единствения контролен диск на RAID 4."},{"id":"L14-A-6","n":6,"text":"Кой предлага идеята за дисковите матрици (RAID)?","opts":["Patterson, Gibson и Katz (Бъркли, 1987)","Хеминг, Шанън и Найкуист (Bell Labs, 1950)","Клос, Бенес и Батчер (Bell Labs, 1960)","Flynn, Amdahl и Hoare (Станфорд, 1972)"],"correct":0,"expl":"Предложена в университета Бъркли, Калифорния, 1987 г."},{"id":"L14-A-7","n":7,"text":"Защо транзакционните системи не печелят съществено от намаляване на времето за предаване?","opts":["Те използват само RAID 0, при който няма време за предаване","Транзакционните системи четат данните само от кеш паметта на диска","Времето за предаване при тях е по-голямо от позиционирането","Заявките са малки и доминират времената за позициониране и изчакване"],"correct":3,"expl":"При кратки случайни заявки seek + rotational latency са основната част от времето."},{"id":"L14-A-8","n":8,"text":"Колко отказа на диска понася RAID 6?","opts":["Само един произволен диск","Нито един — няма излишък","Два произволни диска","Половината от дисковете"],"correct":2,"expl":"Двойна разпределена четност — по редове и по стълбове."},{"id":"L14-A-9","n":9,"text":"Какво е „горещ резерв“ (hot spare)?","opts":["Резервен диск, който се включва автоматично при отказ","Буфер за пътечка в контролера на диска","Огледално копие на всички данни на друг сървър","Диск с висока температура, който трябва да се подмени"],"correct":0,"expl":"Намалява MTTR — времето за възстановяване."},{"id":"L14-A-10","n":10,"text":"Кой компонент реализира съответствието между логически и физически сектори в дисковата матрица?","opts":["Драйверът на мрежата","Адаптерът на шината (HBA)","Дисковият механизъм","Контролерът на матрицата"],"correct":3,"expl":"Той включва буфери, изчисляване на четността и преобразуване на адресите."}],"B":[{"id":"L14-B-1","n":1,"text":"Какво е времето за достъп (seek time)?","opts":["Времето за изчисляване на четността от контролера","Времето за позициониране на главите над търсената пътечка","Времето, за което търсеният сектор се завърта под главата","Времето за физическо предаване на данните към компютъра"],"correct":1,"expl":"Зависи от ускорението при старт и броя пресечени пътечки."},{"id":"L14-B-2","n":2,"text":"Кое RAID ниво използва огледални дискове?","opts":["RAID 0","RAID 4","RAID 6","RAID 1"],"correct":3,"expl":"Mirroring — 50 % от дисковете съдържат дублираната информация."},{"id":"L14-B-3","n":3,"text":"Какво изисква суперкомпютърът от дисковата подсистема?","opts":["Висока пропускателна способност при последователни масиви","Минимален брой дискове и програмна реализация на RAID","Само огледални дискове без разслояване на данните","Голям брой кратки случайни заявки при умерено латентно"],"correct":0,"expl":"Научните задачи работят с големи последователни масиви."},{"id":"L14-B-4","n":4,"text":"Каква е общата продължителност на обслужване при seek 8 ms, 10 000 об/мин и предаване 1 ms?","opts":["≈ 18 ms","≈ 15 ms","≈ 12 ms","≈ 9 ms"],"correct":2,"expl":"Средно изчакване = ½·60/10000 = 3 ms; 8 + 3 + 1 = **12 ms**."},{"id":"L14-B-5","n":5,"text":"Как се изчислява новата четност при малък запис в RAID 5?","opts":["(нови данни ⊕ стара четност) ⊕ нови данни","сума на всички дискове по модул броя дискове","(стари данни ⊕ нови данни) ⊕ стара четност","(стари данни ∧ нови данни) ∨ стара четност"],"correct":2,"expl":"Не е нужно да се четат всички дискове — само старите данни и старата четност."},{"id":"L14-B-6","n":6,"text":"Колко контролни диска изисква RAID 2 при G = 10 диска с данни?","opts":["2","4","10","1"],"correct":1,"expl":"C = ⌈log₂10⌉ = **4** (≈ 71 % ефективен капацитет)."},{"id":"L14-B-7","n":7,"text":"Кое е тясното място при RAID 3 и RAID 4?","opts":["Единственият контролен диск при запис","Двойната четност по редове и стълбове","Липсата на излишна информация","Огледалното копиране на всеки запис"],"correct":0,"expl":"Всеки запис променя четността в един и същ диск."},{"id":"L14-B-8","n":8,"text":"Каква част от капацитета е полезна в RAID 5 от 5 диска?","opts":["50 %","100 %","60 %","80 %"],"correct":3,"expl":"(N − 1)/N = 4/5 = **80 %**."},{"id":"L14-B-9","n":9,"text":"Какво е силно свързана дискова система в компютър с разпределена памет?","opts":["Всички процесори ползват една обща дискова матрица","Всеки процесор има собствен присъединен набор дискове","Дисковете са свързани в огледални двойки по RAID 1","Входно-изходните възли са по периферията на матрицата"],"correct":1,"expl":"Малко латентно и висока обща ширина на лентата (IBM LCAP)."},{"id":"L14-B-10","n":10,"text":"Кое RAID ниво НЕ е отворен индустриален стандарт?","opts":["RAID 6","RAID 5","RAID 7","RAID 1"],"correct":2,"expl":"RAID 7 е търговски термин на Storage Computer Corporation."}],"C":[{"id":"L14-C-1","n":1,"text":"От какво зависи времето за изчакване (rotational latency)?","opts":["От типа на RAID нивото","От броя на пресечените пътечки","От скоростта на въртене на диска","От броя на предаваните байтове"],"correct":2,"expl":"Средно е половин оборот: ½·60/RPM."},{"id":"L14-C-2","n":2,"text":"Каква е метриката „производителност“ на дисковата подсистема?","opts":["Брой обслужени заявки за единица време","Време за обслужване на една заявка","Количество данни за единица време","Средно време между два отказа"],"correct":0,"expl":"Времето за една заявка е латентност, количеството данни — пропускателна способност."},{"id":"L14-C-3","n":3,"text":"Кое е предимството на RAID 1+0 пред RAID 0+1?","opts":["Не изисква никакво дублиране на информацията","Работи само с един диск и е по-евтин","По-голям полезен капацитет при същия брой дискове","По-добра отказоустойчивост и по-лесно възстановяване"],"correct":3,"expl":"Striping върху огледални двойки; минимум 4 диска."},{"id":"L14-C-4","n":4,"text":"Какво е средното време за изчакване при 15 000 об/мин?","opts":["8 ms","2 ms","4 ms","1 ms"],"correct":1,"expl":"Оборот = 60/15000 = 4 ms; половин оборот = **2 ms**."},{"id":"L14-C-5","n":5,"text":"Какво е основното предимство на апаратния RAID пред програмния?","opts":["По-ниска цена и простота за малки системи","Цялата конфигурация се прави от администратора","Поддържа само RAID 0 без излишна информация","Горещо подменяне на диск без спиране на работата"],"correct":3,"expl":"Апаратният RAID дава и по-богата проверка на грешки и защита от грешки на администратора."},{"id":"L14-C-6","n":6,"text":"Каква е ролята на адаптера на шината (HBA)?","opts":["Управление на позициониращия механизъм и ECC на диска","Синхронизация на въртенето на всички дискове в матрицата","Интерфейс между компютъра и дисковата матрица, обикновено с DMA","Изчисляване на четността и преобразуване на логическите сектори"],"correct":2,"expl":"Другите функции са на контролера на матрицата и контролера на диска."},{"id":"L14-C-7","n":7,"text":"Колко обръщения към диска изисква един логически запис при RAID 6?","opts":["4","6","2","3"],"correct":1,"expl":"Затова RAID 6 не е подходящ за транзакционни системи."},{"id":"L14-C-8","n":8,"text":"Колко време отнема предаването на 4 KB при скорост 100 MB/s?","opts":["≈ 0,04 ms","≈ 4,00 ms","≈ 0,40 ms","≈ 40,0 ms"],"correct":0,"expl":"4096 B / 10⁸ B/s ≈ 41 μs — пренебрежимо спрямо seek и rotation."},{"id":"L14-C-9","n":9,"text":"Какво е разслоението по байтове с един контролен диск?","opts":["RAID 4","RAID 5","RAID 3","RAID 2"],"correct":2,"expl":"RAID 2 — по битове с Хеминг; RAID 4 — по блокове."},{"id":"L14-C-10","n":10,"text":"Кой е пример за слабо свързана система с В/И възли вътре в изчислителната матрица?","opts":["Tandem NonStop","Intel Paragon","IBM LCAP-1","Intel Touchstone Delta"],"correct":1,"expl":"При Touchstone Delta В/И възлите са по периферията; LCAP е силно свързана."}]}},{"num":15,"title":"Лекция 15 — Производителност на компютъра","short":"Производителност на компютъра","summary":"### Понятие „производителност на компютъра“\n- **Производителност** — **количество извършена работа за единица време**; за компютъра „работа“ = изпълнение на дадена програма.\n- Определянето и сравняването на производителността е **сложен, нерешен напълно проблем**. **Закон на Мур**: производителността на обикновените компютри се удвоява приблизително на **18 месеца** (емпирично, без строго доказателство).\n- Производителността е **сложна нелинейна функция** от много параметри:\n\n| Параметър | Защо е важен |\n|---|---|\n| **Време за изпълнение на командите** — **тактова честота** и **брой тактове за команда** | пряко определя колко команди се изпълняват за секунда |\n| **Логически възможности на системата команди** | по-мощните команди вършат повече работа с по-малко команди |\n| **Структура на процесора** — брой регистри, формат на данните | по-малко обръщения към паметта, по-точни/по-бързи операции |\n| **Памет** — структура (кеш, RAM, вторична), **обем**, **времена за достъп** | ~25 % от командите се обръщат към паметта; бавната памет спира процесора |\n| **Пропускателна способност на В/И каналите** | ограничава задачите с много данни |\n| **Операционна система** | планиране, режийни разходи, управление на ресурсите |\n| **Тип задачи и стил на програмиране** (вкл. компилатор) | една и съща машина дава различна производителност за различни програми |\n\n- Параметрите се наричат **индекси на производителността**: **количествени** (скорост на операциите, обем памет) и **качествени** (структурност на програмата, качество на компилатора); **първични** и **вторични** според приоритета (скоростта е първична за суперкомпютър, вторична за преносим компютър).\n- **Клиентска (потребителска)** производителност — за отделна задача с **приоритетен достъп** до ресурсите; **системна** — при **едновременно** решаване на много задачи.\n- Мерки: **MIPS** (милиона команди/s), **MFLOPS** (милиона операции с плаваща запетая/s), **GFLOPS = 10⁹**, **TFLOPS = 10¹²**; пропускателна способност (задания за единица време); **ширина на лентата** (Mb/s, MB/s).\n\n### Методи за оценка — обзор\n- **Методи на измерването** — когато компютърът е **произведен и достъпен**.\n- **Методи на моделирането** — когато е **в процес на проектиране** или **не е достъпен**.\n- Общ проблем и за двете: описанието на **работното натоварване** (входните сигнали от потребителя). В практиката двата подхода **се допълват**.\n\n### Методи на измерването\n| Метод | Същност | Плюс | Минус |\n|---|---|---|---|\n| **Елементарни времена** (50-те г.) | MIPS от времето на основна операция (такт × брой тактове) | **простота** | не отчита софтуера, конвейера, формата на данните; дава само **пикова** производителност |\n| **Командни смеси** | средно време с **тегловни коефициенти kᵢ**: **P = 1 / Σ(kᵢ·tᵢ)**; смес на **Гибсън** (k = 0,33 събиране с ФЗ) | неявно отчита софтуера | коефициентите са **субективни** / зависят от класа задачи |\n| **Образцови програми** | типична програма, изпълнена „**на хартия**“: P = брой команди / изчислено време | отчита и апаратурата, и стила на програмиране | трудоемко; разклонените програми трябва да се **линеаризират** |\n| **Измервателни програми** | реална програма + **системен таймер** | отчита апаратно и програмно осигуряване; малко човешки грешки | **грешка от таймера**; не предсказва ефекта от промени |\n| **Синтетични програми (benchmarks)** | специално съставени за конкретни способности | стандартни и сравними | същата грешка от таймера |\n\n- Пример за елементарни времена: **1 GHz**, команда от **2 такта** → **500 MIPS**; 750 MHz × 4 резултата/такт → **3 000 MIPS**. При паралелни устройства **Pp = Σ Pᵢ**.\n- Пример за командна смес: k = 0,5/0,3/0,2 с t = 2/4/10 ns → Σ = 4,2 ns → **P ≈ 238 MIPS**.\n- **Грешка на измервателните програми**: таймерът се обновява на **фиксирани интервали** → грешка от дискретността. Намаляване: **(а) големи масиви от данни**, **(б) многократно повтаряне в цикъл**.\n- Benchmarks: **Whetstone**, **Dhrystone**, **LINPACK** (плътни линейни системи, основа на **Top500**), **Livermore Fortran Kernels** (24 ядра), **NAS Parallel Benchmarks**, **SPEC**, SandraSoft. Измервателните + синтетичните = **benchmark програми**.\n\n### Метод на моделирането\n- Оценка от **модел** — описание на компютъра с определена степен на **правдоподобие**.\n\n**Аналитичен модел** — **математическо представяне** на системата (уравнения, формули):\n- **Детерминирани** — машини на Тюринг, **мрежи на Петри**, графични модели на програмите; дават формули от първо приближение, но **трудно отразяват промените в натоварването**.\n- **Вероятностни** — **теория на масовото обслужване (опашки)**, **марковски / полумарковски процеси**; по-естествено отразяват изменчивото натоварване, но **трудно представят реда на поява на задачите**.\n- Предимства: **бърза оценка**, евтина (калкулатор/компютър), ясно показва **кой компонент с колко влияе**.\n- Недостатъци: **голяма грешка (~10 %)**, силни **опростяващи допускания**, трудно описват сложни динамични системи.\n- **Модел на Марини**: **P = 1 / (0,7·t_add + 0,3·t_mult + k_m·t_m)** [MIPS]; t_add — събиране (кратка команда), t_mult — умножение (дълга команда), **k_m** — степен на **прозрачност на паметта** (0 при напълно прозрачна), t_m — цикъл на паметта. Пример: t_add = 10 ns, t_mult = 40 ns, k_m = 0 → 19 ns → **≈ 52,6 MIPS**.\n\n**Имитационен модел** — **програма**, описваща системата на алгоритмичен език; три етапа:\n1. **Концептуален модел** — причинно-следствени връзки, идея, методика, програмни средства;\n2. **Разработка на имитационния модел** — алгоритмично описание, параметри, критерии за ефективност, контролни изпитания;\n3. **Моделиране с компютър** — планиране на експерименти, събиране на **статистика** (при сложни задачи — дори суперкомпютър).\n- **Моделното (системното) време е дискретно** — променя се само при настъпване на **събития**.\n- Инструменти: универсални езици (**C, C++, FORTRAN**) или специализирани (**GPSS, SIMSCRIPT**).\n- Плюсове: **по-голяма точност (2–3 %)**, гъвкавост, отразява детайлите и динамиката. Минуси: **дълга разработка**, сложна **верификация**, нужда от **мощен компютър**.\n\n### Апробация на модела\n- Моделът е достатъчно точен, ако индексите му се отличават от реалните с по-малко от **максималната допустима грешка**.\n- За несъществуваща система проверката е като **верификация на програма**; повтарянето на проверка и корекция до нужната точност е **калибровка**.\n- Грешки: от **формулировката** на модела, от **решението** и от **задаването на параметрите**.\n\n### Сравнение на методите\n| Метод | Грешка | Изисквания | Гъвкавост |\n|---|---|---|---|\n| Измервателни програми | **1–2 %** | **реална система** | ниска |\n| Имитационно моделиране | **2–3 %** | мощен компютър
