| висока |\n| Аналитично моделиране | **~10 %** | калкулатор / компютър | висока |\n\n- **Предпочитание**: при проектиране — аналитичен модел за **бърз избор** на варианти, после имитационен за **точна оценка**; при наличен компютър — измерване.\n\n### Ефективност\n- **Пикова производителност** — от елементарните времена (MIPS); **никога не се достига**.\n- **Реална производителност** — от измервателните програми.\n- **E = реална / пикова**; при големи задачи **E > 0,5** е добре. Пример: 2 GFLOPS реална / 8 GFLOPS пикова → **E = 0,25**.\n- Ниска E → проверяват се АЛУ, памет, комуникационна среда, компилатор, ОС.\n- При паралелните компютри E варира силно — колкото по-дълго се използват **независимите устройства паралелно**, толкова E → 1.\n- **Експлоатационна ефективност** E = P / (C_ком + C_екс) ≈ P / C_ком (цена на MFLOPS); **Gordon Bell Prize**; **закон на Грош**: **C_ком = f(P)²** — квадратична зависимост между цена и производителност, валидна вътре в един клас компютри (в класическата формулировка: производителността расте с квадрата на цената).\n\n### Капани за изпита\n- **Аналитичен** модел = **математически** (формули) → бърз, ~10 % грешка; **имитационен** = **програма** → точен (2–3 %), бавен за разработка. Не ги разменяй.\n- Аналитичните модели биват **детерминирани** и **вероятностни** (опашки, Марков).\n- Методите на **измерването** изискват **реална система**; моделирането — за **проектиране**.\n- **Елементарните времена** дават **пикова**, а не реална производителност.\n- Грешката на измервателните програми идва от **дискретния таймер** — лекарство: **големи масиви** и **многократно повтаряне**.\n- **E = реална / пикова** (не обратното), винаги ≤ 1.\n- **MIPS** — команди, **MFLOPS** — операции с плаваща запетая; GFLOPS = 10⁹, TFLOPS = 10¹².\n- Моделът на **Марини** е **аналитичен детерминиран**.\n- При въпрос „от кои параметри зависи“ — изброй: **такт и CPI, система команди, структура на процесора, памет, В/И, ОС, тип задачи/програмиране** и за всеки кажи **защо**.","testNames":["A","B","C"],"tests":{"A":[{"id":"L15-A-1","n":1,"text":"Как се определя в най-общия случай производителността на компютъра?","opts":["Количество извършена работа за единица време","Брой транзистори в процесора на единица площ","Максималната тактова честота на процесора","Обемът на основната памет, разделен на времето за достъп"],"correct":0,"expl":"За компютъра работата е изпълнението на дадена програма."},{"id":"L15-A-2","n":2,"text":"Каква е пиковата производителност при 1 GHz и команда, заемаща 2 такта?","opts":["1 000 MIPS","250 MIPS","500 MIPS","2 000 MIPS"],"correct":2,"expl":"10⁹ / 2 = **500 MIPS**."},{"id":"L15-A-3","n":3,"text":"Какво представлява аналитичният модел?","opts":["Специално съставена програма за изпитване на способности","Математическо представяне на системата чрез формули и уравнения","Програма, описваща системата на алгоритмичен език","Реална програма, изпълнявана на изследвания компютър"],"correct":1,"expl":"Имитационният модел е програма; измервателните и синтетичните програми са методи на измерването."},{"id":"L15-A-4","n":4,"text":"Каква е типичната грешка на аналитичното моделиране?","opts":["1–2 %","2–3 %","~50 %","~10 %"],"correct":3,"expl":"Измервателни програми 1–2 %, имитационно 2–3 %, аналитично ~10 %."},{"id":"L15-A-5","n":5,"text":"Как се намалява грешката от системния таймер при измервателните програми?","opts":["С използване на тегловни коефициенти за всяка команда","С големи масиви от данни и многократно повтаряне в цикъл","С изключване на кеш паметта по време на измерването","С изпълнение на програмата „на хартия“ вместо на компютър"],"correct":1,"expl":"Така времето на изпълнение става много по-голямо от периода на таймера."},{"id":"L15-A-6","n":6,"text":"Кой benchmark е основа на класацията Top500?","opts":["LINPACK","SandraSoft","Dhrystone","Whetstone"],"correct":0,"expl":"LINPACK решава плътна система линейни уравнения."},{"id":"L15-A-7","n":7,"text":"Как се изчислява ефективността на компютъра?","opts":["Пикова производителност / реална производителност","Пикова производителност × брой процесори","Реална производителност / цена на системата","Реална производителност / пикова производителност"],"correct":3,"expl":"E ≤ 1; при големи задачи E > 0,5 се счита за добре."},{"id":"L15-A-8","n":8,"text":"Кой е първият етап на имитационното моделиране?","opts":["Калибровка на модела","Събиране на статистика","Концептуален модел","Моделиране с компютър"],"correct":2,"expl":"Етапи: концептуален модел → разработка на имитационния модел → моделиране с компютър."},{"id":"L15-A-9","n":9,"text":"Какво е характерно за моделното (системното) време в имитационния модел?","opts":["Дискретно е — променя се само при настъпване на събития","Определя се от тактовата честота на моделиращия компютър","Непрекъснато е и съвпада с астрономическото време","Винаги е равно на времето за изпълнение на модела"],"correct":0,"expl":"Между две събития моделното време не се променя."},{"id":"L15-A-10","n":10,"text":"Към коя група методи се отнася моделът на Марини?","opts":["Аналитичен вероятностен модел","Имитационен модел на GPSS","Метод на измерването","Аналитичен детерминиран модел"],"correct":3,"expl":"P = 1/(0,7·t_add + 0,3·t_mult + k_m·t_m) — детерминирана формула."}],"B":[{"id":"L15-B-1","n":1,"text":"Кога се прилагат методите на моделирането?","opts":["Само когато компютърът е произведен и е наличен за тестове","Когато компютърът се проектира или не е достъпен за измервания","Само при персонални компютри, изпълняващи една програма","Когато системният таймер на компютъра не е достатъчно точен"],"correct":1,"expl":"Методите на измерването изискват реална система."},{"id":"L15-B-2","n":2,"text":"По каква формула се изчислява производителността с командна смес?","opts":["P = Σkᵢ · Σtᵢ","P = max(tᵢ) / Σkᵢ","P = Σ(kᵢ / tᵢ)","P = 1 / Σ(kᵢ·tᵢ)"],"correct":3,"expl":"kᵢ — тегловен коефициент, tᵢ — време за изпълнение на команда i."},{"id":"L15-B-3","n":3,"text":"Кой е основният недостатък на метода на елементарните времена?","opts":["Измерва само пикова производителност и не отчита софтуера","Изисква мощен компютър за провеждане на симулацията","Изисква реална програма и много точен системен таймер","Тегловните коефициенти на командите се определят субективно"],"correct":0,"expl":"Не отчита програмното осигуряване, конвейера и формата на данните."},{"id":"L15-B-4","n":4,"text":"Каква е пиковата производителност при 750 MHz и 4 резултата на такт?","opts":["187,5 MIPS","750 MIPS","3 000 MIPS","4 000 MIPS"],"correct":2,"expl":"750·10⁶ × 4 = **3·10⁹** резултата/s."},{"id":"L15-B-5","n":5,"text":"На какво се базират вероятностните аналитични модели?","opts":["Специализираните езици GPSS и SIMSCRIPT","Синтетичните програми Whetstone и Dhrystone","Теория на масовото обслужване и марковски процеси","Машини на Тюринг и мрежи на Петри без случайност"],"correct":2,"expl":"Машините на Тюринг и мрежите на Петри са детерминирани модели."},{"id":"L15-B-6","n":6,"text":"Какво е калибровка на модела?","opts":["Привеждане на моделното време към астрономическото","Повтаряне на проверка и корекция до достигане на нужната точност","Измерване на времето за изпълнение със системния таймер","Определяне на тегловните коефициенти на командната смес"],"correct":1,"expl":"Моделът е точен, ако грешката е под максимално допустимата."},{"id":"L15-B-7","n":7,"text":"Каква е ефективността при реална производителност 2 GFLOPS и пикова 8 GFLOPS?","opts":["0,25","4,00","0,50","1,60"],"correct":0,"expl":"E = 2/8 = **0,25**."},{"id":"L15-B-8","n":8,"text":"Каква е основната разлика между клиентската и системната производителност?","opts":["Клиентската е пикова, а системната — винаги реална производителност","Клиентската зависи от ОС, а системната — само от процесора","Клиентската се мери в MFLOPS, а системната — само в MIPS","Клиентската е за една задача с приоритет, системната — за много задачи"],"correct":3,"expl":"Системната отразява едновременното решаване на съвкупност от задачи."},{"id":"L15-B-9","n":9,"text":"Каква точност дава имитационното моделиране?","opts":["20–30 %","2–3 %","1–2 %","~10 %"],"correct":1,"expl":"По-точно от аналитичното, но по-трудно за разработка."},{"id":"L15-B-10","n":10,"text":"Кой специализиран език се използва за имитационно моделиране?","opts":["LINPACK","TRANQUIL","GPSS","MESI"],"correct":2,"expl":"GPSS и SIMSCRIPT имат вградени средства за статистика."}],"C":[{"id":"L15-C-1","n":1,"text":"Какво е TFLOPS?","opts":["10⁹ операции с плаваща запетая в секунда","10¹² команди с фиксирана запетая в секунда","10¹² операции с плаваща запетая в секунда","10⁶ операции с плаваща запетая в секунда"],"correct":2,"expl":"MFLOPS = 10⁶, GFLOPS = 10⁹, TFLOPS = 10¹²."},{"id":"L15-C-2","n":2,"text":"Какво представляват образцовите програми?","opts":["Типична програма, чието време се изчислява „на хартия“","Набор от тегловни коефициенти за типовете команди","Програма, описваща системата на алгоритмичен език","Реална програма, изпълнявана със системен таймер"],"correct":0,"expl":"P = брой команди / изчислено време; разклоненията се линеаризират."},{"id":"L15-C-3","n":3,"text":"Каква производителност дава командна смес с k = 0,5/0,3/0,2 и t = 2/4/10 ns?","opts":["≈ 420 MIPS","≈ 625 MIPS","≈ 167 MIPS","≈ 238 MIPS"],"correct":3,"expl":"Σ kᵢtᵢ = 1 + 1,2 + 2 = 4,2 ns → 1/4,2 ns ≈ **238 MIPS**."},{"id":"L15-C-4","n":4,"text":"Кое е главното предимство на аналитичните модели?","opts":["Най-малка грешка сред всички методи за оценка","Бърза оценка и ясна картина кой компонент с колко влияе","Не изискват никакви допускания за системата","Отчитат точно реда на постъпване на задачите"],"correct":1,"expl":"Грешката им е ~10 %, но резултатът се получава бързо."},{"id":"L15-C-5","n":5,"text":"Колко е производителността по модела на Марини при t_add = 10 ns, t_mult = 40 ns и k_m = 0?","opts":["≈ 100 MIPS","≈ 34,5 MIPS","≈ 20,0 MIPS","≈ 52,6 MIPS"],"correct":3,"expl":"0,7·10 + 0,3·40 = 19 ns → 1/19 ns ≈ **52,6 MIPS**."},{"id":"L15-C-6","n":6,"text":"Какво гласи законът на Грош?","opts":["Ефективността намалява с броя на процесорите","Производителността се удвоява на всеки 18 месеца","Цената и производителността са в квадратична зависимост","Ускорението се ограничава от последователната част"],"correct":2,"expl":"C_ком = f(P)²; удвояването на 18 месеца е законът на Мур."},{"id":"L15-C-7","n":7,"text":"Кой е недостатъкът на измервателните програми?","opts":["Не отчитат програмното осигуряване на изследвания компютър","Не позволяват да се предскаже ефектът от предполагаеми изменения","Измерват само пиковата производителност на процесора","Изискват ръчно определяне на тегловни коефициенти"],"correct":1,"expl":"Те измерват съществуващата система такава, каквато е."},{"id":"L15-C-8","n":8,"text":"Какви са видовете грешки при моделирането?","opts":["От формулировката на модела, от решението и от параметрите","От компилатора, от конвейера и от формата на данните","От закръгляването, от препълването и от делението","От таймера, от кеша и от операционната система"],"correct":0,"expl":"Три вида грешки при моделирането."},{"id":"L15-C-9","n":9,"text":"Какъв е недостатъкът на детерминираните аналитични модели?","opts":["Не могат да се използват в процеса на проектиране","Изискват суперкомпютър за решаването им","Трудно отразяват промените в работното натоварване","Не дават формули дори от първо приближение"],"correct":2,"expl":"Те заменят случайните величини със средни стойности."},{"id":"L15-C-10","n":10,"text":"Какво е общото наименование на измервателните и синтетичните програми?","opts":["Образцови програми","Benchmark програми","Командни смеси","Имитационни модели"],"correct":1,"expl":"Whetstone, Dhrystone, LINPACK, SPEC и др."}]}}],"sample":[],"taskGroups":[{"key":"L01","title":"Лекция 1 — Въведение в дисциплината","lec":1,"n":13},{"key":"L02","title":"Лекция 2 — CISC и RISC архитектури. Шина","lec":2,"n":13},{"key":"L03","title":"Лекция 3 — Въведение в паралелната обработка","lec":3,"n":13},{"key":"L04","title":"Лекция 4 — Принципи на конвейерната обработка","lec":4,"n":14},{"key":"L05","title":"Лекция 5 — Конвейерно изпълнение на командите","lec":5,"n":14},{"key":"L06","title":"Лекция 6 — Процесори с множество функционални устройства","lec":6,"n":13},{"key":"L07","title":"Лекция 7 — Векторни процесори","lec":7,"n":14},{"key":"L08","title":"Лекция 8 — SIMD (матрични) процесори","lec":8,"n":13},{"key":"L09","title":"Лекция 9 — Систолични процесори","lec":9,"n":12},{"key":"L10","title":"Лекция 10 — Паралелни компютри с обща и разпределена памет","lec":10,"n":15},{"key":"L11","title":"Лекция 11 — Компютри с потоково управление (dataflow)","lec":11,"n":14},{"key":"L12","title":"Лекция 12 — Комуникационни мрежи","lec":12,"n":14},{"key":"L13","title":"Лекция 13 — Архитектура на паметта","lec":13,"n":15},{"key":"L14","title":"Лекция 14 — Дискова памет","lec":14,"n":12},{"key":"L15","title":"Лекция 15 — Производителност на компютъра","lec":15,"n":14}],"tasks":[{"id":"L01-O-1","group":"L01","lec":1,"title":"Въведение","text":"Какво се разбира под понятието „компютърна архитектура“ и как се е развило то във времето?","src":"","solution":"Понятието „компютърна архитектура“ няма точно и еднозначно определение, защото съдържанието му се разширява с развитието на компютрите. До началото на 70-те години под архитектура се е разбирало описание на структурата на данните и регистрите, нужни за изясняване на набора команди, тоест минимумът за писане на програма на асемблерен език. С навлизането на виртуалната памет и средствата за вход/изход това не е достатъчно и архитектурата се определя като структурна организация от функционални модули и връзки между тях, или като разпределение на функциите по нива с точни граници и интерфейси. Обобщено, тя е абстрактно представяне на физическата система от гледна точка на програмиста на асемблер и на проектанта на компилатор.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"няма еднозначно определение","kw":["еднозначно","разширява"]},{"t":"първоначално — данни, регистри, набор команди","kw":["регистр","набора команди","асемблер"]},{"t":"структурна организация — модули и връзки","kw":["модул","структурна"]},{"t":"разпределение на функциите по нива и интерфейси","kw":["нива","интерфейс"]},{"t":"гледна точка на програмиста/компилатора","kw":["програмиста","компилатор"]}]}]},{"id":"L01-O-2","group":"L01","lec":1,"title":"Въведение","text":"Кои са двете по-широки съвременни определения на компютърната архитектура? Обяснете всяко от тях.","src":"","solution":"Първото определение разглежда архитектурата като структурна организация на компютъра — съвкупност от функционални модули и връзките между тях. То се съчетава добре с технологията VLSI, при която всяка свръхголяма интегрална схема може да се третира като отделен функционален модул. Второто определение разглежда архитектурата като разпределение на функциите между отделните нива на организация на компютъра и точно определяне на границите и интерфейсите между тези нива. И двете определения надхвърлят класическото схващане за архитектурата като описание само на командния набор.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"структурна организация","kw":["структурна"]},{"t":"функционални модули и връзки","kw":["модул","връзки"]},{"t":"връзка с VLSI","kw":["vlsi","интегрална"]},{"t":"разпределение на функциите по нива","kw":["нива","разпределение"]},{"t":"граници и интерфейси","kw":["интерфейс","граници"]}]}]},{"id":"L01-O-3","group":"L01","lec":1,"title":"Въведение","text":"Кои са основните (класически) задачи при разработването на една компютърна архитектура?","src":"","solution":"Класическите задачи се групират в три групи: определяне на формата за представяне на програмата и правилата за нейната интерпретация, установяване на методите за адресация на данните и определяне на форматите на данните. При решаването им се конкретизират минималната област на паметта, кодовете на операциите и форматите на машинните команди, способите за адресация и защита на паметта, управлението на последователността на командите и интерфейсът с вход/изхода. Процесът на проектиране е итеративен — отделните етапи се повтарят многократно, докато се постигне приемливо решение.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"представяне на програмата","kw":["представяне на програмата","интерпретация"]},{"t":"адресация на данните","kw":["адресация"]},{"t":"формати на данните","kw":["формати на данните","форматите на данните"]},{"t":"кодове на операциите, формати на команди, защита на паметта","kw":["кодовете на операциите","защита"]},{"t":"итеративен процес","kw":["итератив"]}]}]},{"id":"L01-O-4","group":"L01","lec":1,"title":"Въведение","text":"Какви изисквания се поставят пред съвременните проектанти и пред новите компютри според учебника?","src":"","solution":"Съвременните проектанти не са просто инженери по апаратни средства или програмно осигуряване — от тях се изисква да познават новите технологии, приложната математика, компютърните мрежи, интерфейсите и системите за изчисления. Компютрите от новото поколение трябва да бъдат гъвкави както по технология, така и по архитектура, съвместими с новите технологии и разширяеми. Времето на отделно стоящите компютри е минало, затова разработваният компютър трябва да може да се включва в стандартна мрежа. Стандартите са особено важни, защото позволяват да се свързва в едно цяло апаратно и програмно оборудване на различни фирми.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"широки познания на проектантите","kw":["приложната математика","мрежи"]},{"t":"гъвкавост","kw":["гъвкав"]},{"t":"съвместимост и разширяемост","kw":["съвместим","разширяем"]},{"t":"включване в стандартна мрежа","kw":["мрежа"]},{"t":"роля на стандартите","kw":["стандарт"]}]}]},{"id":"L01-O-5","group":"L01","lec":1,"title":"Въведение","text":"Опишете накратко вертикалния разрез (нивата) на архитектурата на конвенционален компютър.","src":"","solution":"Вертикалният разрез на последователния компютър съдържа около десет нива, всяко с точно определен интерфейс към съседните. Ниво 1 определя взаимодействието с външния свят чрез езици и системни програми, а нива 2–4 (транслатори, бази данни и виртуална памет, управление на паметта и процесите) образуват архитектурата на програмното осигуряване. Ниво 5 е границата между операционната система и апаратурата, ниво 6 е интерфейсът на микропрограмното управление, ниво 7 разпределя функциите между ЦП и процесорите за вход/изход, а ниво 8 е интерфейсът ЦП–памет. Нива 9 и 10 разграничават процесорите за вход/изход и контролерите и се наричат архитектура на физическия вход/изход.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"ниво 1 — външният свят, езици","kw":["външния свят","езици"]},{"t":"нива 2–4 — архитектура на ПО","kw":["програмното осигуряване","транслатори"]},{"t":"ниво 5 — граница ОС/апаратура","kw":["ниво 5","граница"]},{"t":"нива 6–8 — микропрограми, ЦП/в-и, ЦП/памет","kw":["микропрограм","цп–памет"]},{"t":"нива 9–10 — физически вход/изход","kw":["физическия вход","контролер"]}]}]},{"id":"L01-O-6","group":"L01","lec":1,"title":"Въведение","text":"Какво е значението на ниво 5 във вертикалния разрез на компютъра и какво става при неговото преместване?","src":"","solution":"Ниво 5 отразява границата между системното програмно осигуряване (операционната система) и апаратното осигуряване, като под апаратно се разбират както електронните схеми, така и микропрограмите. Разграничаването на функциите над и под това ниво е една от основните задачи при разработката на архитектурата. Ако ниво 5 се премести нагоре, повече функции се реализират апаратно и делът на програмното осигуряване намалява, а при преместване надолу повече функции се реализират програмно. Така се получават компютри с едни и същи функционални възможности, но с различни характеристики.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"граница ОС — апаратура","kw":["граница","операционната система"]},{"t":"апаратно = схеми + микропрограми","kw":["микропрограм"]},{"t":"нагоре → повече апаратно","kw":["нагоре"]},{"t":"надолу → повече програмно","kw":["надолу"]},{"t":"еднакви функции, различни характеристики","kw":["различни характеристики","характеристики"]}]}]},{"id":"L01-O-7","group":"L01","lec":1,"title":"Въведение","text":"Кои нива от вертикалния разрез се наричат „архитектура на процесора“, „архитектура на програмното осигуряване“ и „архитектура на физическия вход/изход“? Какво отразява всяко от тях?","src":"","solution":"Нива 6 и 8 заедно се наричат архитектура или организация на процесора: ниво 6 е интерфейсът на микропрограмното управление, а ниво 8 е интерфейсът между централния процесор и паметта. Нива 2, 3 и 4 нямат общоприети имена и обобщено се наричат архитектура на програмното осигуряване — транслатори, управление на бази данни, файлове и виртуална памет, управление на оперативната и външната памет. Нива 9 и 10 разграничават функциите на процесорите за вход/изход и контролерите и затова се наричат архитектура на физическия вход/изход.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"6 и 8 — архитектура на процесора","kw":["6 и 8","организация на процесора"]},{"t":"микропрограмно управление; ЦП–памет","kw":["микропрограм","паметта"]},{"t":"2–4 — архитектура на ПО","kw":["2, 3 и 4","програмното осигуряване"]},{"t":"9–10 — физически в/и, контролери","kw":["9 и 10","контролер"]}]}]},{"id":"L01-O-8","group":"L01","lec":1,"title":"Въведение","text":"Каква е разликата между вертикалния и хоризонталния разрез на компютърната архитектура?","src":"","solution":"Вертикалният разрез описва архитектурата на конвенционален, последователен (фон Нойманов) компютър като йерархия от нива — от приложните програми до каналите и контролерите. При него се определят функциите на всяко ниво и интерфейсите между съседните нива, например границата между ОС и апаратурата. Хоризонталният разрез отразява архитектурата на паралелния компютър, при която функциите се разпределят между група процесори, понякога с различно предназначение. В него се описват и интерфейсите, чрез които тези процесори взаимодействат помежду си.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"вертикален — последователен компютър","kw":["последователен","фон ноймано"]},{"t":"йерархия от нива и интерфейси","kw":["йерархия","нива"]},{"t":"хоризонтален — паралелен компютър","kw":["паралелния"]},{"t":"функции между група процесори","kw":["група процесори"]}]}]},{"id":"L01-O-9","group":"L01","lec":1,"title":"Въведение","text":"С какво не се занимава компютърната архитектура? Как това разграничение се съотнася с понятията „организация“ и „реализация“?","src":"","solution":"Компютърната архитектура не се занимава с управлението и предаването на данни вътре в процесора на схемотехническо ниво, с конструктивните особености на логическите схеми и с технологията на тяхното производство. Тези въпроси принадлежат към организацията и реализацията на процесора — конкретната схемна и технологична изработка. Архитектурата описва системата абстрактно, от гледна точка на програмиста на асемблер и на проектанта на компилатор. Затова два компютъра с една и съща архитектура могат да имат съвсем различна схемна реализация и технология.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"не се занимава със схемотехниката вътре в процесора","kw":["схемотехн","вътре в процесора"]},{"t":"не — логически схеми и технология","kw":["технолог","логическите схеми"]},{"t":"това е организация/реализация","kw":["реализация","организация"]},{"t":"архитектурата — абстрактно, за програмиста","kw":["абстрактно","програмиста"]}]}]},{"id":"L01-O-10","group":"L01","lec":1,"title":"Въведение","text":"Каква роля има паралелната обработка в компютърните системи и как се класифицират системите според броя на потоците команди и данни?","src":"","solution":"Паралелната обработка е основен инструмент за повишаване на производителността и може да се реализира от едновременно изпълнение на независими задачи в многопроцесорна система до конвейерна обработка вътре в един процесор. Класическата таксономия на Флин разделя системите според това дали потокът команди и потокът данни са единични или множествени. SISD е последователният фон Нойманов компютър, SIMD изпълнява една команда върху много данни (векторни процесори, GPU), MISD е почти теоретичен клас, а MIMD обединява многопроцесорните системи с независими потоци команди и данни.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"паралелизмът повишава производителността","kw":["производителност"]},{"t":"класификация на Флин по потоци","kw":["флин","поток"]},{"t":"SISD и SIMD с примери","kw":["sisd","simd"]},{"t":"MISD и MIMD","kw":["misd","mimd"]}]}]},{"id":"L01-O-11","group":"L01","lec":1,"title":"Въведение","text":"Кои са програмните нива на паралелната обработка? Опишете накратко всяко от тях.","src":"","solution":"Паралелизмът на ниво команди (ILP) означава едновременно изпълнение на няколко команди чрез конвейер или множество функционални устройства и е прозрачен за програмиста при скаларните процесори. Паралелизмът на ниво нишки (TLP) изпълнява различни нишки паралелно — чрез хипернишки (SMT) в едно ядро или на отделни ядра. При паралелизма на ниво задачи цели задачи или програми работят на различни процесори в многопроцесорна или разпределена система, координирани чрез механизми като MPI и PVM. Изборът на ниво определя изискванията към архитектурата, компилатора и операционната система.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"ниво команди — ILP, конвейер","kw":["команди","ilp"]},{"t":"ниво нишки — TLP, SMT/ядра","kw":["нишки","tlp"]},{"t":"ниво задачи — MPI/PVM","kw":["задачи","mpi"]},{"t":"изисквания към архитектура, компилатор, ОС","kw":["компилатора","изисквания"]}]}]},{"id":"L01-O-12","group":"L01","lec":1,"title":"Въведение","text":"Какво представлява паралелизмът на ниво команди (ILP) и как се реализира в различните процесорни архитектури?","src":"","solution":"Паралелизмът на ниво команди е едновременното изпълнение на няколко машинни команди от един поток команди вътре в процесора. Той се реализира чрез конвейерна обработка, при която различни фази на последователни команди се съвместяват във времето, и чрез множество функционални устройства, изпълняващи независими команди едновременно. При скаларните и суперскаларните процесори ILP се открива от апаратурата и е прозрачен за програмиста, докато при VLIW архитектурата компилаторът явно пакетира независими операции в една дълга команда.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"едновременно изпълнение на команди","kw":["едновременно","команди"]},{"t":"чрез конвейер","kw":["конвейер"]},{"t":"множество функционални устройства","kw":["функционални устройства"]},{"t":"прозрачен при скаларни/суперскаларни","kw":["прозрачен","апаратурата"]},{"t":"явен при VLIW — компилатор","kw":["vliw"]}]}]},{"id":"L01-O-13","group":"L01","lec":1,"title":"Въведение","text":"Каква е ролята на програмното осигуряване за ефективното използване на паралелната обработка?","src":"","solution":"Паралелната обработка не се реализира само апаратно — програмното осигуряване има ключова роля за нейното ефективно използване. Съвременните компилатори разкриват паралелизъм в последователен код и го трансформират за изпълнение върху паралелна архитектура, а при VLIW те изцяло отговарят за подреждането на независимите операции. Операционната система разпределя нишките и задачите по ядра и процесори, а библиотеки като MPI и PVM осигуряват комуникацията и синхронизацията между задачите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"не само апаратно","kw":["не се реализира само апаратно","програмното осигуряване"]},{"t":"компилаторът разкрива паралелизъм","kw":["компилатор"]},{"t":"ОС разпределя нишки/задачи","kw":["операционната система"]},{"t":"MPI/PVM — комуникация и синхронизация","kw":["mpi","синхронизация"]}]}]},{"id":"L02-O-1","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са основните недостатъци на „класическите“ CISC и RISC процесори? Опишете накратко същността на всеки от тези недостатъци. На тяхна база направете сравнение между двете архитектури.","src":"Изпит — вариант 1, въпрос 1","solution":"Основният недостатък на CISC е сложното, микропрограмно управляващо устройство, което заема голяма площ от кристала (50% при MC 68000), води до големи системни издръжки, многотактово изпълнение и затруднена конвейеризация заради различната дължина на командите. Основният недостатък на RISC е, че една CISC команда се замества с няколко RISC команди, затова програмата е по-дълга, обръщенията към паметта се увеличават и е нужна поне кеш памет за команди. Освен това CISC кодът не може да се транслира пряко, а трябва да се прекомпилира с RISC компилатор. В сравнение RISC печели по скорост на отделната команда, простота на управлението (6% площ) и лесна конвейеризация, а CISC — по плътност на кода, затова при цяла програма предимството на RISC намалява.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"CISC — сложно микропрограмно УУ, голяма площ","kw":["микропрограм","площ","управляващо"]},{"t":"CISC — многотактово, трудна конвейеризация","kw":["конвейер","многотакт"]},{"t":"RISC — по-дълъг код, повече обръщения към паметта","kw":["по-дълга","няколко risc"]},{"t":"RISC — нужен кеш за команди / прекомпилация","kw":["кеш","прекомпилира"]},{"t":"сравнение: скорост на команда срещу цяла програма","kw":["цяла програма","плътност"]}]}]},{"id":"L02-O-2","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са основните характерни изисквания, валидни за процесорите с „чиста“ RISC архитектура? Кои от тях се нарушават най-често и по какви причини?","src":"Изпит — вариант 2, въпрос 1","solution":"За „чистата“ RISC архитектура командите трябва да се изпълняват за еднакъв брой тактове (идеално за един), да имат един и същ формат, обръщението към паметта да става само с LOAD и STORE, а аритметичните и логическите операции да са само регистър–регистър. Най-често се нарушават първите две изисквания — за еднакъв брой тактове и еднакъв формат. Причината е, че сложни операции като умножение, деление и плаваща запетая, както и достъпът до паметта, не могат реално да се изпълнят за един такт. Фиксираният формат пък хаби памет и затруднява кодирането на големи константи, затова се въвеждат и съкратени формати за по-плътен код.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"еднакъв брой тактове (1 такт)","kw":["такт"]},{"t":"еднакъв (фиксиран) формат","kw":["формат"]},{"t":"памет само чрез LOAD/STORE","kw":["load"]},{"t":"операции регистър–регистър","kw":["регистър"]},{"t":"нарушават се а) и б) + причини","kw":["нарушават","умножение","плътен"]}]}]},{"id":"L02-O-3","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са принципите на фон Нойман и кои са трите основни особености в архитектурата на съвременните компютри?","src":"","solution":"В основата на всички компютри са двата принципа на фон Нойман: принципът на програмното управление и принципът на съхраняването на програмата в паметта заедно с данните. Въпреки развитието на технологиите тези принципи остават, но се въплъщават по различен начин. Трите основни особености на съвременните компютри са широкото използване на процесори с RISC архитектура, масовото използване на паралелна обработка на различни нива (особено конвейерна) и използването на шината като основна среда за трансфер на информацията.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"програмно управление","kw":["програмното управление"]},{"t":"съхраняване на програмата в паметта","kw":["съхраняването"]},{"t":"RISC процесори","kw":["risc"]},{"t":"паралелна (конвейерна) обработка","kw":["паралелна","конвейер"]},{"t":"шината като среда за трансфер","kw":["шината"]}]}]},{"id":"L02-O-4","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са характерните особености на CISC процесорите и защо исторически архитектурата е мигрирала към CISC?","src":"","solution":"CISC процесорите имат голям и разнообразен набор команди с различна дължина и сложност, малко общи регистри и команди, които работят едновременно с паметта и регистрите. Декодирането е сложно и изисква микропрограмно управляващо устройство, а командите се изпълняват за 2 до 10 и повече такта. Първите процесори всъщност са били от тип RISC, но архитектурата мигрира към CISC, защото за повишаване на бързодействието се добавят нови апаратни или микропрограмни команди, приближаващи се към примитивите на езиците от високо ниво.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"голям набор, различна дължина","kw":["голям","различна дължина"]},{"t":"операции с памет, малко регистри","kw":["малко общи регистри","паметта"]},{"t":"микропрограмно УУ, много тактове","kw":["микропрограм","такта"]},{"t":"първите процесори — RISC","kw":["първите процесори"]},{"t":"команди, близки до езиците от високо ниво","kw":["високо ниво"]}]}]},{"id":"L02-O-5","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са предимствата и недостатъците на CISC процесорите?","src":"","solution":"Предимството на CISC процесорите е плътният машински код — за една задача са нужни по-малко команди, което пести памет, а също и обратната съвместимост с вече написания софтуер. Основният недостатък е сложното микропрограмно управляващо устройство, което заема голяма част от кристала, например 50% при MC 68000, и води до големи системни издръжки. Различната дължина и времетраене на командите затрудняват конвейерното изпълнение, а голяма част от сложните команди се използват рядко.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"плътен код, пести памет","kw":["плътн","пести памет"]},{"t":"обратна съвместимост","kw":["съвместим"]},{"t":"сложно УУ — 50% площ","kw":["50%","управляващо"]},{"t":"трудна конвейеризация","kw":["конвейер"]},{"t":"сложните команди — рядко използвани","kw":["рядко"]}]}]},{"id":"L02-O-6","group":"L02","lec":2,"title":"CISC и RISC","text":"Каква е отправната точка и основната идея при създаването на RISC архитектурата?","src":"","solution":"RISC теорията е разработена от Петерсон в университета Бъркли в края на 70-те години, след като е установено, че в CISC компютрите 60–80% от процесорното време се използва за малко на брой команди. Това са командите за обмен между паметта и регистрите (LOAD/STORE), условните и безусловните преходи и извикванията на подпрограми. Идеята на RISC е да се постигне бързодействие чрез минимално време за изпълнение на тези най-често използвани команди. Допълнителен мотив е, че сложната система от команди изисква големи системни издръжки.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Петерсон, Бъркли","kw":["петерсон","бъркли"]},{"t":"60–80% от времето — малко команди","kw":["60–80%"]},{"t":"LOAD/STORE, преходи, подпрограми","kw":["преходи","подпрограми"]},{"t":"минимално време за честите команди","kw":["минимално време"]}]}]},{"id":"L02-O-7","group":"L02","lec":2,"title":"CISC и RISC","text":"До какво водят изискванията за еднакъв брой тактове и еднакъв формат на командите при RISC процесорите?","src":"","solution":"Еднаквият брой тактове и единният формат изключват редица сложни проблеми пред проектантите на апаратурата и на компилатора и опростяват управлението на процесора. Вследствие площта на управляващото устройство намалява значително — от 50% при MC 68000 до 6% при RISC I, а времето за разработката му намалява средно два пъти. Простите формати позволяват бързо декодиране и изпълнение на командите с логически схеми вместо с микропрограми, което съкращава времето за изпълнение и улеснява конвейеризацията.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"опростено управление","kw":["опростяват","управлението"]},{"t":"6% срещу 50% площ","kw":["6%"]},{"t":"2 пъти по-кратка разработка","kw":["два пъти"]},{"t":"бързо декодиране, логически схеми","kw":["декодиране","логически схеми"]}]}]},{"id":"L02-O-8","group":"L02","lec":2,"title":"CISC и RISC","text":"До какво водят изискванията за достъп до паметта само чрез LOAD/STORE и за регистрови операции при RISC? Защо броят на регистрите по-късно намалява?","src":"","solution":"Тези изисквания налагат голям брой регистри и изпълнение на всички операции, освен четенето и записа в паметта, като операции регистър–регистър. Такива операции са 2–4 пъти по-бързи от операциите с кеш паметта и 8–12 пъти по-бързи от тези с оперативната памет, което повишава бързодействието. Ранните RISC процесори имат много регистри (RISC II — 138, Pyramid — 528), но по-късно броят им намалява, защото 8 регистъра дават 80% от бързодействието при неограничен брой и се появяват регистрово оптимизиращи компилатори.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"голям брой регистри, регистър–регистър","kw":["регистри"]},{"t":"2–4 пъти от кеш, 8–12 от ОП","kw":["2–4","8–12"]},{"t":"примери RISC II, Pyramid","kw":["138","528"]},{"t":"8 регистъра → 80%","kw":["80%"]},{"t":"оптимизиращи компилатори","kw":["оптимизиращи"]}]}]},{"id":"L02-O-9","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са недостатъците на RISC архитектурата и защо всеки RISC процесор има кеш памет за команди?","src":"","solution":"Регистровата архитектура намалява натоварването на паметта за данни, но повишава изискванията към пропускателната способност на паметта за команди, затова няма RISC процесор без поне кеш за команди. Този кеш е по-прост (само четене) и по-ефективен, защото локалността на командите е по-висока от тази на данните. Друг недостатък е, че една проста CISC операция изисква няколко RISC команди, което увеличава размера на програмата и броя обръщения към паметта. Затова производителността на RISC е по-висока при отделна команда, отколкото при цяла програма.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"натоварена памет за команди","kw":["паметта за команди"]},{"t":"кеш за команди — само четене, локалност","kw":["локалност","само четене"]},{"t":"няколко RISC команди за една CISC","kw":["няколко risc"]},{"t":"по-голяма програма, повече обръщения","kw":["размера на програмата","обръщения"]}]}]},{"id":"L02-O-10","group":"L02","lec":2,"title":"CISC и RISC","text":"Какво е необходимо, за да бъдат един CISC и един RISC процесор функционално еквивалентни? Може ли CISC програма да се преобразува пряко в RISC код?","src":"","solution":"За да бъдат функционално еквивалентни, функциите, реализирани от рядко срещаните CISC команди, трябва да се заменят в RISC процесора с последователност от RISC команди. Прякото, покомандно преобразуване на обектни или асемблерски CISC програми в RISC код е нецелесъобразно, защото структурата на командите е съществено различна. Такава транслация води до значително увеличаване на дължината на програмата и на заетата памет. Затова е необходима нова компилация на програмите с компилатор, предназначен за RISC компютъра.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"сложните CISC команди → последователност RISC команди","kw":["последователност"]},{"t":"пряката транслация е нецелесъобразна","kw":["нецелесъобразно"]},{"t":"програмата силно нараства","kw":["дължината на програмата"]},{"t":"нужна е нова компилация","kw":["компилация","компилатор"]}]}]},{"id":"L02-O-11","group":"L02","lec":2,"title":"CISC и RISC","text":"Направете сравнение между основните качества на CISC и RISC процесорите.","src":"","solution":"CISC процесорите имат голям набор команди с променлива дължина, много команди работят с паметта, регистрите са малко, а управлението е микропрограмно и командите отнемат 2–10 и повече такта. RISC процесорите имат малък набор команди с фиксиран формат, достъп до паметта само чрез LOAD/STORE, много регистри и управление с логически схеми, като идеално всяка команда отнема един такт. Затова RISC е по-лесен за конвейеризация и има много по-малко управляващо устройство, но програмите му са по-дълги, докато CISC дава по-плътен код. При RISC тежестта се прехвърля към компилатора, а при CISC — към апаратурата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"набор и формат на командите","kw":["променлива дължина","фиксиран формат"]},{"t":"достъп до паметта и регистри","kw":["load","регистр"]},{"t":"микропрограмно срещу логически схеми","kw":["микропрограм","логически схеми"]},{"t":"конвейеризация и размер на кода","kw":["конвейер","по-дълги"]},{"t":"роля на компилатора","kw":["компилатора"]}]}]},{"id":"L02-O-12","group":"L02","lec":2,"title":"CISC и RISC","text":"Каква е ролята на шината в съвременните компютри? Кои са нейните основни предимства и недостатъци?","src":"","solution":"Шината е основната среда за трансфер на данни и команди в компютъра и е въведена в средата на 60-те години от DEC в PDP-8 като алтернатива на канала при големите машини. Нейните предимства са простотата, ниската цена и стандартизираният интерфейс, поради което тя намира масово приложение първо в микро- и мини-компютрите, а после навсякъде. Основният ѝ недостатък е ниската пропускателна способност — всички устройства делят една среда и при много устройства шината се превръща в тясно място.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"среда за трансфер на данни и команди","kw":["трансфер"]},{"t":"DEC, PDP-8, алтернатива на канала","kw":["pdp-8","канала"]},{"t":"предимства — простота, ниска цена","kw":["простота","ниската цена"]},{"t":"недостатък — ниска пропускателна способност","kw":["пропускателна"]}]}]},{"id":"L02-O-13","group":"L02","lec":2,"title":"CISC и RISC","text":"Кои са основните методи за намаляване на недостатъците на общата шина? Как се е развила йерархията на шините при персоналните компютри?","src":"","solution":"За намаляване на ниската пропускателна способност се увеличава ширината на шината, повишава се тактовата честота и шината се разделя чрез йерархия от шини, позволяваща конкурентен достъп и множество едновременни транзакции. При персоналните компютри развитието минава от 8-битовата шина на IBM PC през ISA (16 MB/s), MCA и EISA (33 MB/s) до VL-Bus (133 MB/s). Compaq въвежда първа йерархия с отделна процесорна шина, а PCI добавя междинно ниво между процесорната шина и периферията. Днес йерархията се реализира от чипсета чрез северен мост за бързите компоненти и южен мост за останалите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"ширина и тактова честота","kw":["ширината","честота"]},{"t":"йерархия от шини — едновременни транзакции","kw":["йерархия"]},{"t":"ISA → EISA → VL-Bus","kw":["isa","eisa"]},{"t":"PCI — междинно ниво","kw":["pci"]},{"t":"северен и южен мост","kw":["северен","южен"]}]}]},{"id":"L03-O-1","group":"L03","lec":3,"title":"Паралелна обработка","text":"Какво гласи законът на Amdahl? Обяснете подробно неговият смисъл и използваните аргументи при разсъжденията.","src":"Изпит — вариант 1, въпрос 2","solution":"Законът на Амдал (1967) гласи, че последователната част на задачата ограничава отгоре коефициента на ускорение на паралелния компютър. Аргументите са, че всяка задача има част, която може да се изпълни само последователно (обикновено координацията на изчислителния процес), и паралелна част; при нормировка ts + tp = 1 и P процесора се получава S = 1/(ts + tp/P), което при P → ∞ клони към 1/ts. Например при P = 1024 и само 1% последователен код S ≈ 91,18, а ефективността E ≈ 0,089, което е песимистичен резултат. Смисълът е, че при фиксиран размер на задачата производителността се определя от възможностите на задачата за паралелно решение, а не от броя на процесорите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"последователната част ограничава ускорението","kw":["последователната част","ограничава"]},{"t":"последователна и паралелна част, нормировка ts+tp=1","kw":["ts + tp","нормировка"]},{"t":"формула и граница 1/ts","kw":["1/ts"]},{"t":"числов пример 91,18 / 0,089","kw":["91,18","0,089"]},{"t":"фиксиран размер — решава задачата, не P","kw":["фиксиран размер","броя на процесорите"]}]}]},{"id":"L03-O-2","group":"L03","lec":3,"title":"Паралелна обработка","text":"Какво знаете за класификацията на Флин? На какво се базира тя? Посочете проблемите за всяка от групите компютри според тази класификация.","src":"Изпит — вариант 2, въпрос 2","solution":"Класификацията на Флин (1966) се базира не на структурата на компютъра, а на начина, по който потоците команди се обвързват с потоците данни, и дава четири класа: SISD, SIMD, MISD и MIMD. SISD е класическият фон Нойманов компютър, ограничен от последователната обработка, а MISD е практически празен клас (само конвейерът може условно да се отнесе към него). Проблемите на SIMD са комуникацията между процесорните елементи, съответствието между размера на вектора и масива от процесори, невекторните операции и бездействието на процесорите при условни преходи. При MIMD проблеми са бавното пренасяне на данни и команди през скъпа комуникационна мрежа, линейното нарастване на цената при много по-бавно нарастване на скоростта заради конфликтите и нуждата от динамична реконфигурация на ресурсите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"базира се на потоците команди и данни","kw":["потоц","поток"]},{"t":"четирите класа SISD/SIMD/MISD/MIMD","kw":["sisd","misd"]},{"t":"проблеми на SIMD — вектор/масив, условни преходи","kw":["условни преходи","размера на вектора"]},{"t":"проблеми на MIMD — комуникация, цена, конфликти","kw":["конфликт","цената"]},{"t":"MIMD — динамична реконфигурация","kw":["реконфигурация"]}]}]},{"id":"L03-O-3","group":"L03","lec":3,"title":"Паралелна обработка","text":"От какво зависи производителността на паралелните компютри и защо реалното ускорение се отклонява от идеалното S = P?","src":"","solution":"Производителността на паралелните компютри зависи преди всичко от решаваната задача — размера ѝ, дела на последователната част, гранулярността на паралелизма (груб или фин) и метода за декомпозиция между процесорите. Тя зависи и от архитектурата — броя и мощността на процесорите, организацията на паметта (обща или разпределена) и топологията и пропускателната способност на комуникационната мрежа. Съществени са и режийните разходи за разпределение на задачата, синхронизация, разрешаване на конфликти при общите ресурси и балансиране на натоварването, които причиняват насищане и дори спад на ускорението при голям брой процесори.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"задачата — размер, последователна част, гранулярност","kw":["последователната част","гранулярност","задача"]},{"t":"брой и мощност на процесорите","kw":["броя и мощността","процесори"]},{"t":"организация на паметта и мрежата","kw":["паметта","мрежа"]},{"t":"синхронизация, конфликти, балансиране","kw":["синхронизация","конфликт","баланс"]}]}]},{"id":"L03-O-4","group":"L03","lec":3,"title":"Паралелна обработка","text":"Защо е необходима паралелната обработка? Кои са двата подхода за повишаване на производителността?","src":"","solution":"Развитието на архитектурата преследва по-висока производителност и надеждност чрез два взаимно допълващи се подхода — технологично усъвършенстване и промяна в организацията на изчислителния процес. Първите тридесет години се използва главно технологията, като тактовият цикъл намалява от 500 ns при IBM 360/50 до 12,5 ns при CRAY-1 и днес достига около 3 GHz. Крайната скорост на разпространение на сигнала обаче показва, че този подход изчерпва възможностите си. Затова вниманието се насочва към радикална промяна в организацията на изчислението, тоест към паралелните компютри.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"цели — производителност и надеждност","kw":["надеждност"]},{"t":"подход 1 — технологично усъвършенстване","kw":["технологич"]},{"t":"подход 2 — организация на изчислителния процес","kw":["организация"]},{"t":"ограничение — скорост на сигнала","kw":["скорост на разпространение"]},{"t":"пример за намаляване на цикъла","kw":["500 ns","12,5"]}]}]},{"id":"L03-O-5","group":"L03","lec":3,"title":"Паралелна обработка","text":"Кои са основните предимства на паралелните компютри?","src":"","solution":"Първото предимство е значително по-високата скорост на обработка, от порядъка на GFLOPS и повече, необходима за геофизиката, молекулярната биология, моделирането на схеми и обработката на сигнали. Второто е повишената надеждност — при отказ на процесор той се изключва и обработката продължава с намалена скорост, вместо системата да спре. Третото е по-високото отношение производителност/цена, което като правило е с порядък по-добро от това на последователните компютри.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"по-висока скорост на обработка","kw":["скорост"]},{"t":"приложни области","kw":["геофизика","молекулярна"]},{"t":"надеждност — работа с намалена скорост","kw":["надеждност"]},{"t":"отношение производителност/цена","kw":["цена"]}]}]},{"id":"L03-O-6","group":"L03","lec":3,"title":"Паралелна обработка","text":"Кои са нивата на паралелност в компютрите? Опишете накратко всяко от тях.","src":"","solution":"На ниво задания паралелизмът е между заданията или между фазите им и изисква многомашинна система от несвързани или слабо свързани компютри. На ниво програми той е между подпрограмите или в границите на цикъл и изисква многопроцесорен компютър с обща памет или обмен на съобщения. На ниво команди се съвместяват фазите на изпълнение на последователни команди чрез конвейерна обработка, а на ниво машинна дума паралелизмът е между елементите на векторните операции или вътре в логическите схеми на аритметичното устройство. Често един компютър съчетава паралелизъм в пространството (много процесори) с паралелизъм във времето (конвейер).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"ниво задания — многомашинна система","kw":["задания"]},{"t":"ниво програми — подпрограми, цикли","kw":["програми","цикъл"]},{"t":"ниво команди — конвейер","kw":["команди","конвейер"]},{"t":"ниво машинна дума — вектори, АУ","kw":["машинна дума","векторни"]},{"t":"съчетаване пространство + време","kw":["пространството","времето"]}]}]},{"id":"L03-O-7","group":"L03","lec":3,"title":"Паралелна обработка","text":"Как се оценява производителността и ефективността на паралелен компютър? Опишете реалната зависимост на ускорението от броя на процесорите.","src":"","solution":"Ускорението се оценява с коефициента S = T1/TP, където T1 е времето за решаване на задачата на еднопроцесорен компютър, а TP — на паралелен компютър с P еднакви процесора, като има смисъл само при S > 1. Ефективността E = S/P ≤ 1 показва средното натоварване на процесорите. Реалната зависимост S(P) има три зони: близко до линейно нарастване, насищане и накрая спад на S. Отклонението от идеалното се дължи на разпределението на задачата, синхронизацията и конфликтите при достъпа до общите ресурси, а компютър, работещ в първата зона, се нарича мащабируем.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"S = T1/TP и значения","kw":["t1/tp"]},{"t":"E = S/P ≤ 1 — натоварване","kw":["s/p"]},{"t":"три зони — линейна, насищане, спад","kw":["насищане","спад"]},{"t":"причини — синхронизация, конфликти","kw":["синхронизация","конфликт"]},{"t":"мащабируемост","kw":["мащабируем"]}]}]},{"id":"L03-O-8","group":"L03","lec":3,"title":"Паралелна обработка","text":"Сравнете законите на Amdahl и Barsis (Gustafson) като модели на мащабируемостта.","src":"","solution":"Законът на Амдал разглежда задача с фиксиран размер, като ts + tp = 1 е времето на еднопроцесорния компютър, и дава S = 1/(ts + tp/P), което клони към 1/ts. Законът на Barsis (Gustafson) приема, че по-реалистично е времето за изпълнение да е константа, а размерът на задачата да се мащабира с броя процесори, като ts + tp = 1 е времето на паралелния компютър. Тогава S = ts + P·tp расте почти линейно — при P = 1024 и ts = 0,01 се получава S ≈ 1013,77 срещу 91,18 по Амдал. Амдал дава песимистична оценка, защото предполага, че tp не зависи от P, докато Barsis описва по-добре реалните мащабируеми приложения.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Амдал — фиксиран размер, граница 1/ts","kw":["фиксиран размер","1/ts"]},{"t":"Barsis — фиксирано време, мащабиране на задачата","kw":["константа","мащабира"]},{"t":"S = ts + P·tp, почти линейно","kw":["линейно"]},{"t":"пример 1013,77 срещу 91,18","kw":["1013"]},{"t":"песимистична срещу реалистична оценка","kw":["песимистична"]}]}]},{"id":"L03-O-9","group":"L03","lec":3,"title":"Паралелна обработка","text":"Какви изисквания трябва да изпълнява една добра класификация на паралелните компютри? Как е разширена класификацията на Флин?","src":"","solution":"Добрата класификация трябва да обхваща всички съществуващи архитектури и да може да предвиди нови, да диференцира съществено различните изчислителни структури и да класифицира всеки компютър еднозначно. Класификацията на Флин е проста, симетрична и ортогонална, но е прекалено широка, защото в един клас попадат много различни архитектури. Едното ѝ разширение добавя обработката по битове (/B) или по думи (/W) и дава 8 класа. Класификацията на Foutain отчита допълнително типа автономия на процесорите (операционна, адресна, мрежова), топологията на свързване и формата на данните.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"обхваща всички архитектури","kw":["обхваща"]},{"t":"диференцира и класифицира еднозначно","kw":["еднозначно","диференцира"]},{"t":"Флин — прекалено широка","kw":["широка"]},{"t":"/B и /W — 8 класа","kw":["8 класа","битове"]},{"t":"Foutain — автономия, топология, формат","kw":["foutain","автономия"]}]}]},{"id":"L03-O-10","group":"L03","lec":3,"title":"Паралелна обработка","text":"Какво представляват операционната, адресната и мрежовата автономия в класификацията на Foutain?","src":"","solution":"Операционната автономия позволява не всички процесори в масово паралелна архитектура да изпълняват една и съща команда, което се постига чрез маска, регистър за разширения код на операцията или няколко програмни контролера (MSIMD). Адресната автономия дава на всеки процесор в SIMD компютъра възможност сам да формира или модифицира адреса и да избира операнд от собствената си памет. Мрежовата автономия цели ефективно отразяване на графа на задачата в структурата на връзките между процесорите, за да се постигне висок коефициент на използване на ресурсите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"операционна — различни команди","kw":["операционната"]},{"t":"маска / MSIMD","kw":["маска","msimd"]},{"t":"адресна — локално формиране на адреса","kw":["адресната","адреса"]},{"t":"мрежова — графът на задачата в връзките","kw":["мрежовата","графа"]}]}]},{"id":"L03-O-11","group":"L03","lec":3,"title":"Паралелна обработка","text":"Кои други класификации на паралелните компютри (освен тази на Флин) познавате? Опишете накратко класификацията по способа на управление.","src":"","solution":"Освен класификацията на Флин паралелните компютри се класифицират по функционално предназначение (за инженерни изчисления или за изкуствен интелект и бази знания), по степен на свързаност (силно, слабо и мрежово свързани), по степен на равноправие (автократични и егалитарни) и по способа на синхронизация. По способа на управление има три класа: при control driven всяка команда определя следващата, при data driven наличието на аргументите стартира командата, а при demand driven командата се изпълнява, когато резултатът ѝ е нужен на друга команда. Най-голямо разпространение имат компютрите с управление по потока управляващи оператори (control driven).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"функционално предназначение","kw":["функционално предназначение"]},{"t":"свързаност и равноправие","kw":["свързаност","равноправие"]},{"t":"control driven","kw":["control driven"]},{"t":"data driven / demand driven","kw":["data driven","demand driven"]}]}]},{"id":"L03-O-12","group":"L03","lec":3,"title":"Паралелна обработка","text":"Опишете класификацията на паралелните компютри по степен на свързаност и по степен на равноправие на процесорите.","src":"","solution":"При силно свързаните системи процесорите са обединени чрез обща шина, което работи добре при малко процесори, но при увеличаване на броя им шината става тясно място (частично се помага с двувходови памети). Ако обменът между паметта и „своя“ процесор силно преобладава, по-ефективни са слабо свързаните системи от автономни компютри със собствена операционна система. Най-слабо свързани са мрежово свързаните системи, в които компютрите обменят пакети или съобщения по локална мрежа. По степен на равноправие системите са автократични, с главен управляващ процесор, и егалитарни, в които всички процесори са равноправни.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"силно свързани — обща шина, тясно място","kw":["силно свързани","тясно място"]},{"t":"слабо свързани — собствена ОС","kw":["слабо свързани","собствена операционна"]},{"t":"мрежово свързани — пакети/съобщения","kw":["мрежово"]},{"t":"автократични и егалитарни","kw":["автократични","егалитарни"]}]}]},{"id":"L03-O-13","group":"L03","lec":3,"title":"Паралелна обработка","text":"Какво представлява разпределената обработка? Кога е по-удачно да се използва „Интернет компютър“ и кога суперкомпютър?","src":"","solution":"Разпределената обработка се реализира от изчислителни мрежи от териториално обособени, автономни центрове, които обменят информация в пакети или съобщения по канали за връзка. Ако компонентите са относително зависими и локализирани, системата е разпределена, а ако са сложни и независими машини — говорим за изчислителна мрежа. При „Интернет компютъра“ (например SETI@home) милиони компютри изпълняват програма с най-нисък приоритет, когато процесорът им бездейства. Когато задачата е ограничена по размер, по-добре е да се използва разпределена обработка, а когато е ограничена по време — централизиран суперкомпютър.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"териториално обособени автономни центрове","kw":["териториално","автономни"]},{"t":"разпределена система срещу мрежа","kw":["локализирани","независими"]},{"t":"Интернет компютър — нисък приоритет","kw":["приоритет","seti"]},{"t":"по размер → разпределена; по време → суперкомпютър","kw":["ограничена по размер","ограничена по време"]}]}]},{"id":"L04-O-1","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Каква е същността на конвейерната обработка в процесорите? Кои условия трябва да бъдат изпълнени, за да може да се реализира конвейерна обработка в процесорите?","src":"Изпит — вариант 2, въпрос 5","solution":"Конвейерната обработка повишава производителността чрез паралелизъм по време: базовата функция се разделя на подфункции, всяка от които се изпълнява от отделен апаратен блок (степен), а на всеки такт в конвейера влиза нов елемент. Условията са: изчислението на базовата функция да е еквивалентно на последователност от подфункции, входните величини на всяка подфункция да са изходни за предходната и да няма други взаимодействия между подфункциите освен предаването на данни. Освен това всяка подфункция трябва да се реализира от отделен апаратен блок и блоковете да изразходват приблизително еднакво време. Ако поне едно условие не е изпълнено, става дума за препокриване на операциите, а не за конвейер.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"паралелизъм по време, подфункции в степени","kw":["паралелизъм по време","подфункции"]},{"t":"последователност от подфункции; вход = изход на предходната","kw":["последователност","изходни"]},{"t":"без други взаимодействия","kw":["взаимодействия"]},{"t":"отделен апаратен блок, еднакво време","kw":["апаратен блок","еднакво време"]},{"t":"иначе — препокриване","kw":["препокриване"]}]}]},{"id":"L04-O-2","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Обяснете работата на тристепенен конвейер за събиране на вектори с плаваща запетая. Колко такта са необходими и какво е ускорението?","src":"","solution":"Събирането с плаваща запетая се разбива на три подфункции: изравняване на порядъците с изместване на мантисата на по-малкото число, сумиране на мантисите и нормализация на резултата. На първия такт първата двойка числа е в степен 1, на втория преминава в степен 2, а в степен 1 влиза втората двойка, и от четвъртия такт на всеки такт излиза по един резултат. Така за n елемента са нужни n + 2 такта вместо 3n, а ускорението S = 3n/(n + 2) клони към 3 при дълги вектори.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"три подфункции","kw":["порядъците","мантисите","нормализация"]},{"t":"на всеки такт нова двойка / резултат","kw":["всеки такт"]},{"t":"n + 2 такта вместо 3n","kw":["n + 2"]},{"t":"S = 3n/(n+2) → 3","kw":["3n/(n + 2)","клони към 3"]}]}]},{"id":"L04-O-3","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Как се оценява увеличението на производителността при конвейерна обработка? Защо конвейерът е особено подходящ за дълги вектори?","src":"","solution":"За оценка се използва S = T1/TP, където T1 е броят тактове при последователна, а TP — при конвейерна обработка. За конвейер с L степени и n елемента S = L·n/(L + n − 1), защото L − 1 такта отиват за запълване, след което на всеки такт излиза резултат. С нарастване на n ускорението клони към пределната стойност L. При кратки вектори времето за запълване и изпразване е съизмеримо с полезната работа, затова конвейерът е особено ефективен при дълги вектори.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"S = T1/TP","kw":["t1/tp"]},{"t":"S = L·n/(L+n−1)","kw":["l·n/(l + n − 1)"]},{"t":"граница L","kw":["пределната стойност l","клони към"]},{"t":"запълване при кратки вектори","kw":["запълване"]},{"t":"дълги вектори","kw":["дълги вектори"]}]}]},{"id":"L04-O-4","group":"L04","lec":4,"title":"Конвейерна обработка","text":"От какво се определя скоростта (тактът) на конвейера? Защо реалният такт не намалява пропорционално при увеличаване на броя степени?","src":"","solution":"Скоростта на конвейера не зависи от неговата дължина (броя степени), а от скоростта, с която новите обекти се подават на входа му, тоест от времето за обработка в една степен — обикновено най-бавната. Теоретично при разделяне на операцията на L степени тактът е t/L, но всяка степен добавя постоянни загуби за прехвърляне на данните през фиксатора, управлението и синхронизацията. С увеличаване на L относителният дял на тези загуби расте и реалният такт все повече се отклонява от теоретичния. Затова и петото условие изисква степените да са с приблизително еднакво време — иначе най-бавната степен забавя целия конвейер.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"не зависи от броя степени","kw":["не зависи"]},{"t":"определя се от най-бавната степен","kw":["най-бавната"]},{"t":"загуби във фиксатора/управлението","kw":["фиксатора","загуби"]},{"t":"делът на загубите расте с L","kw":["относителният дял","расте"]}]}]},{"id":"L04-O-5","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Как е изградена една степен на конвейера и защо конвейерът е синхронно изчислително устройство?","src":"","solution":"Всяка степен на конвейера се състои от два блока — логика и фиксатор. Блокът „логика“ извършва същинските операции, съответстващи на подфункцията на степента. Фиксаторът е свръхбърза памет, която съхранява междинния резултат и го подава към следващата степен в строго определен момент. Тъй като всички степени предават данните си едновременно по общ такт, конвейерът е синхронно изчислително устройство.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"логика + фиксатор","kw":["логика","фиксатор"]},{"t":"логиката извършва подфункцията","kw":["подфункцията"]},{"t":"фиксатор — свръхбърза памет","kw":["свръхбърза"]},{"t":"строго определен момент → синхронно","kw":["синхронно","определен момент"]}]}]},{"id":"L04-O-6","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Каква е разликата между конвейерна обработка и препокриване на операциите? Дайте пример.","src":"","solution":"Конвейерна обработка има само когато са изпълнени и петте условия, а ако дори едно от тях не е изпълнено, правилният термин е препокриване на операциите. Препокриване има, когато между обработките има зависимост освен предаването на данни, когато всяка обработка изисква различна верига от подфункции, подфункциите са твърде различни или времето на степените не е постоянно. И в двата случая крайният ефект е намаляване на времето, но той се постига с различни средства. Типичен пример е препокриването на входно-изходните операции с изчисленията, при което ЦП и процесорът за вход/изход работят паралелно, а оперативната памет играе ролята на фиксатор.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"пет условия срещу нарушено поне едно","kw":["пет","дори едно"]},{"t":"зависимости, различни вериги, непостоянно време","kw":["зависимост","различна верига","не е постоянно"]},{"t":"същият ефект, различни средства","kw":["различни средства"]},{"t":"пример — вход/изход с изчисления","kw":["вход/изход","входно-изходните"]}]}]},{"id":"L04-O-7","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Какво представляват еднофункционалният и многофункционалният конвейер? Каква е разликата между статичния и динамичния конвейер?","src":"","solution":"Еднофункционалният конвейер изпълнява само един тип базова функция, например само събиране с плаваща запетая, а многофункционалният изчислява функции от различни типове и освен вход за данни има управляващ вход. Многофункционалните конвейери се делят според честотата на смяна на функцията. При статичния конвейер смяната е рядка и става под явното управление на програмата, както в аритметичния конвейер на векторния процесор. При динамичния смяната е честа и непрекъсната, защото се използва за изпълнение на команди, всяка различна по формат и тип, и реализацията му е скрита от програмиста.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"еднофункционален — една функция","kw":["еднофункционалн"]},{"t":"многофункционален — управляващ вход","kw":["управляващ вход"]},{"t":"статичен — рядка смяна, векторен аритметичен","kw":["статичния","векторния"]},{"t":"динамичен — честа смяна, команди, скрит","kw":["динамичния","скрита"]}]}]},{"id":"L04-O-8","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Каква е разликата между еднолинейните и многолинейните конвейери? Кой е основният недостатък на многофункционалните многопътни конвейери?","src":"","solution":"При еднолинейния (еднопътен) конвейер потокът данни преминава от степен към степен по един фиксиран маршрут, независимо от типа на операцията. При многолинейния (многопътен) конвейер различните операции използват различни пътища, които се избират чрез селектори. Основният недостатък на многофункционалните многопътни конвейери е лошото използване на апаратните блокове, защото няма операция, която да използва всички блокове. В примера от учебника някои блокове са заети 50%, други 25% от времето, и при равновероятни операции средното натоварване е само 40%.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"еднолинеен — един маршрут","kw":["един фиксиран маршрут","еднолинейния"]},{"t":"многолинеен — различни пътища, селектори","kw":["различни пътища","селектори"]},{"t":"лошо използване на блоковете","kw":["лошото използване"]},{"t":"средно натоварване 40%","kw":["40%"]}]}]},{"id":"L04-O-9","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Какви проблеми създават прекъсванията при конвейерната обработка?","src":"","solution":"Системата от прекъсвания, ясна при класическата фон Ноймановата архитектура, се усложнява сериозно при конвейерните процесори, защото няколко фрагмента от операнди или команди се намират едновременно на различни стадии на изпълнение. Прекъсванията са асинхронни спрямо програмата, затова първата трудност е да се определи къде (след коя степен) да се постави форсираният преход към обработката на прекъсването. Втората трудност е как точно да се продължи прекъснатата програма след обработката. С увеличаване на броя степени, което по правило дава по-висока производителност, тези трудности се задълбочават.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"няколко команди на различни стадии","kw":["различни стадии"]},{"t":"асинхронност на прекъсванията","kw":["асинхронни"]},{"t":"къде да се постави форсираният преход","kw":["форсираният преход","къде"]},{"t":"как да се възстанови програмата","kw":["продължи","възстанови"]},{"t":"задълбочава се с броя степени","kw":["броя степени"]}]}]},{"id":"L04-O-10","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Какви видове задръжки възникват в конвейера? По какво се различават структурните задръжки от задръжките, зависещи от данните?","src":"","solution":"Задръжките пречат на конвейера да работи с максимална скорост и биват структурни и зависещи от данните. Структурните задръжки, наречени стълкновения, възникват, когато два фрагмента от данни се опитват едновременно да използват една и съща степен, например при последователно сумиране с плаваща и с фиксирана запетая в многопътен конвейер. Те се поддават на аналитично решение и могат да се отстранят още при проектирането. Задръжките, зависещи от данните, възникват, когато случващото се в една степен определя дали данните могат да минат през други степени (например две степени искат общата памет), и понеже зависят от конкретните данни, не се поддават на аналитично изследване.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"структурни и зависещи от данните","kw":["структурни","зависещи от данните"]},{"t":"стълкновение — една степен едновременно","kw":["стълкновения","една и съща степен"]},{"t":"структурните — аналитично, при проектирането","kw":["проектирането","аналитично решение"]},{"t":"от данните — обща памет, не аналитично","kw":["общата памет","не се поддават"]}]}]},{"id":"L04-O-11","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Какво представляват междукомандните зависимости при конвейерното изпълнение на команди и защо проблемът се задълбочава при повече степени?","src":"","solution":"Междукомандните зависимости възникват при конвейерното изпълнение на команди, когато едновременното изпълнение на съседни команди влияе на използваните от тях операнди и изчислените резултати. Типичен случай е, когато i-тата команда трябва да прочете елемент от данни, а (i+1)-вата да го измени, така че редът на достъп може да се наруши. С увеличаване на броя степени в конвейера едновременно в него се намират повече команди на различни стадии и вероятността за такива конфликти расте. Затова този проблем е от изключителна важност и за решаването му се използват специални апаратни и програмни методи.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"съседни команди влияят на операндите/резултатите","kw":["съседни команди","операнд"]},{"t":"пример i чете, i+1 изменя","kw":["i-тата","(i+1)"]},{"t":"повече степени → повече команди едновременно","kw":["повече команди","броя степени"]},{"t":"решава се с апаратни и програмни методи","kw":["апаратни","програмни"]}]}]},{"id":"L04-O-12","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Какво представлява проблемът със запълването на конвейера? Кога той се проявява най-силно?","src":"","solution":"За максимална ефективност на конвейера всички негови степени трябва да са постоянно натоварени. Ако дължината на обработвания вектор е съизмерима с броя степени, голяма част от времето отива за запълване и изпразване на конвейера. Ако в програмата често се срещат команди за преход, степените остават незаети или изпълняват ненужни команди, които после се отхвърлят. И в двата случая производителността спада значително и ускорението остава далеч от пределната стойност L.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"всички степени трябва да са натоварени","kw":["натоварени"]},{"t":"кратки вектори, съизмерими с L","kw":["съизмерима"]},{"t":"чести команди за преход","kw":["преход"]},{"t":"спад на производителността, далеч от L","kw":["спада","пределната"]}]}]},{"id":"L04-O-13","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Как се оценява производителността на операционен (аритметичен) конвейер, като се отчете времето за инициализация?","src":"","solution":"Времето за обработка на n елемента е t(n) = t_init + (L + n − 1)·tc, където tc е тактът, L — броят степени, а t_init — времето за инициализация. При σ = t_init/tc ускорението спрямо неконвейерно аритметично устройство е S ≈ L·n/(σ + L + n − 1), а ефективността е E = S/L = n/(σ + L + n − 1). С нарастване на n ускорението клони към L, а за желана ефективност E₀ минималната дължина на вектора е n_min = E₀(σ + L − 1)/(1 − E₀).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"t(n) = t_init + (L+n−1)·tc","kw":["t_init","(l + n − 1)·tc"]},{"t":"σ = t_init/tc и формула за S","kw":["σ"]},{"t":"ефективност E = S/L","kw":["s/l"]},{"t":"n_min за желана ефективност","kw":["n_min","минималната дължина"]}]}]},{"id":"L04-O-14","group":"L04","lec":4,"title":"Конвейерна обработка","text":"Къде се отнася конвейерът в класификацията на Флин и как се съчетава с другите видове паралелизъм?","src":"","solution":"Конвейерът реализира паралелизъм във времето, докато многопроцесорните системи реализират паралелизъм в пространството. В класификацията на Флин той може условно да се отнесе към MISD, ако всеки етап от изпълнението се разглежда като отделна команда, но по-естествено е да се отнесе към SIMD заради обработката на векторни операции. В реалните компютри двата вида паралелизъм се съчетават — множество процесори, всеки с конвейерна обработка на командите и данните — и така ефектът се мултиплицира.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"паралелизъм във времето срещу пространство","kw":["във времето","пространството"]},{"t":"условно MISD","kw":["misd"]},{"t":"по-естествено SIMD","kw":["simd"]},{"t":"съчетаване — мултиплициране на ефекта","kw":["мултиплицира","съчетават"]}]}]},{"id":"L05-O-1","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Какви подходи се използват на апаратно и на програмно ниво, чрез които се откриват и отстраняват междукомандните зависимости в процесорите?","src":"Изпит — вариант 1, въпрос 3","solution":"На апаратно ниво зависимостите се откриват, като още в първата степен се определят областите D(i) и R(i) на командата и се сравняват с тези на командите в конвейера, или по-гъвкаво (но с повече апаратура) проверката се прави, когато командата стигне точката, в която ѝ трябва конфликтният обект. Отстраняването става чрез спиране на команда i и всички следващи, докато конфликтната команда напусне конвейера, или чрез спиране само на i, като следващите независими команди я задминават (непоредно изпълнение). На програмно ниво компилаторът вмъква команди NOP (отложено разклонение, концепцията на Станфорд) или реорганизира кода, като разменя местата на независими команди (оптимизирано разклонение). Алтернатива на NOP е задържането на командите в конвейера (концепцията на Бъркли), а недостатък на NOP е увеличеният обем на програмата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Сравняване на D(i) и R(i) с командите в конвейера","kw":["d(i)","област"]},{"t":"Спиране на i и следващите команди","kw":["спиране","спира","задържа"]},{"t":"Задминаване / непоредно изпълнение","kw":["задмина","непоредно"]},{"t":"Вмъкване на NOP (отложено разклонение)","kw":["nop","отложено"]},{"t":"Реорганизация на кода (оптимизирано разклонение)","kw":["оптимизирано","реорганиз","разменя"]}]}]},{"id":"L05-O-2","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"На какво се дължат зависимостите между командите в конвейерите за команди в процесорите? По какъв формален начин могат да се дефинират тези зависимости?","src":"Изпит — вариант 1, въпрос 4","solution":"Зависимостите се дължат на това, че при конвейерното изпълнение командите се препокриват по време и операции на следващите команди могат да стартират преди да е завършила команда i, от чийто резултат зависят. Формално за всяка команда i се дефинират областта на определяне D(i) — множеството обекти (регистри, клетки от паметта, флагове), които тя чете, и областта на значенията R(i) — обектите, които тя модифицира. За команда j, следваща логически след i, смущение RAW (четене след запис) има при R(i) ∩ D(j) ≠ ∅, WAR (запис след четене) при D(i) ∩ R(j) ≠ ∅ и WAW (запис след запис) при R(i) ∩ R(j) ≠ ∅. Симетричният случай RAR не е конфликт, а с нарастване на броя степени проблемът се задълбочава, защото в конвейера има повече команди едновременно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Препокриване на командите по време","kw":["препокрив","едновременно"]},{"t":"D(i) — област на определяне (четени обекти)","kw":["d(i)","област на определяне"]},{"t":"R(i) — област на значенията (изменяни обекти)","kw":["r(i)","област на значенията"]},{"t":"RAW, WAR, WAW чрез сечения на множествата","kw":["raw","war","waw","∩"]},{"t":"RAR не е конфликт","kw":["rar"]}]}]},{"id":"L05-O-3","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Кои са основните методи, които се използват в процесорите за намаляване отрицателното влияние на разклоненията в програмите?","src":"Изпит — вариант 2, въпрос 3","solution":"Командите за преход нарушават последователния поток и налагат изчистване и повторно запълване на конвейера (мехурчета), затова се прилагат три апаратни и един програмен метод. Предварителният избор на адреса на разклонение извлича заедно със следващата команда и целевия адрес, а методът с няколко потока команди (IBM System 370/168) използва основен и спомагателен буфер, така че при взет преход конвейерът само се превключва към спомагателния. При прогнозираното разклонение в асоциативна памет (BTB при Pentium) се пазят най-често срещаните преходи и тяхната история, по която предварително се извлича най-вероятната следваща команда. Програмният метод е отложеното разклонение — след прехода се вмъква NOP, а при оптимизираното разклонение слотът се запълва с полезна независима команда, разменена с прехода.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Изчистване на конвейера при преход","kw":["изчист","мехур"]},{"t":"Предварителен избор на адреса на разклонение","kw":["предварителн","целевия адрес"]},{"t":"Няколко потока команди (два буфера)","kw":["поток","буфер"]},{"t":"Прогнозирано разклонение (асоциативна памет, BTB)","kw":["прогноз","асоциативна","btb"]},{"t":"Отложено разклонение (NOP) — програмно","kw":["отложено","nop"]}]}]},{"id":"L05-O-4","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Кои са основните принципи, използвани за повишаване на производителността на конвейерите за команди?","src":"Контролна — тест 3, въпрос 2","solution":"Първо, времената на степените се изравняват — в IF-устройството се изпълняват повече функции (извличане, декодиране, адрес), а най-дългата степен E се разделя на подстепени E1 и E2, което скъсява такта, като между степените се поставят буфери (регистров файл) за относително независима работа. Второ, увеличава се броят на степените за по-висока тактова честота и се използват отделни памети (кеш) за команди и данни, за да се избегнат структурните конфликти между фазите IF и D. Трето, намалява се влиянието на преходите чрез предварителен избор на адреса, няколко потока команди, прогнозиране (BTB) и отложено разклонение. Четвърто, междукомандните зависимости се отстраняват апаратно (задържане, непоредно изпълнение, смяна на имената на регистрите) или програмно (NOP, реорганизация), а CISC командите се транслират в RISC-подобни микрооперации за няколко паралелни конвейера.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Изравняване на степените, разделяне на E","kw":["изравня","e1"]},{"t":"Повече степени → по-висока честота","kw":["броят на степените","тактова честота"]},{"t":"Отделни памети за команди и данни","kw":["отделни памети","структурни"]},{"t":"Намаляване влиянието на преходите","kw":["преход","прогноз"]},{"t":"Отстраняване на зависимостите / микрооперации","kw":["зависимост","непоредно","микроопер"]}]}]
