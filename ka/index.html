 процесор има своя локална памет и няма обща памет, затова конфликтите при достъп до паметта са елиминирани. Основните предимства са много добрата мащабируемост и възможността за масов паралелизъм от стотици до хиляди процесора. Недостатъците са, че достъпът до чужди данни става чрез обмен на съобщения по бавните входно-изходни операции, а програмирането с PVM или MPI е сложно. Съществуващите програми не вървят ефективно и трябва да се разработват нови паралелни алгоритми, като при фин паралелизъм комуникациите доминират и балансирането на натоварването е трудно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"няма конфликти за достъп до паметта","kw":["конфликт"]},{"t":"добра мащабируемост, масов паралелизъм","kw":["мащабируем","масов"]},{"t":"бавна комуникация чрез съобщения","kw":["съобщения","бавн"]},{"t":"сложно програмиране (PVM, MPI)","kw":["pvm","mpi","програмиране"]},{"t":"нужда от нови алгоритми","kw":["алгоритми"]}]}]},{"id":"L10-O-2","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Кои са предимствата и недостатъците на компютрите с обща памет?","src":"Контролна — тест 5, въпрос 4","solution":"Компютрите с обща памет (SMP) имат една памет, една операционна система и една входно-изходна подсистема, като всички процесори имат пряк и бърз достъп до цялата памет. Предимствата са опростеното системно и приложно програмиране, прозрачното разпределение на нишките от ОС и лесната синхронизация, защото програмистът не се грижи къде са данните. Основният недостатък е лошата мащабируемост: с добавянето на процесори трафикът по мрежата към паметта бързо достига насищане, затова броят им е ограничен до 8–16. Използването на кеш памет към всеки процесор и разпределението на данните по модулите памет смекчават проблема, но кешът поражда проблема за съгласуваност на кеш паметите (cache coherence).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"една обща памет и ОС, пряк достъп","kw":["обща","една памет","пряк"]},{"t":"лесно програмиране и синхронизация","kw":["програмиране","синхронизация"]},{"t":"лоша мащабируемост — насищане","kw":["мащабируем","насищане"]},{"t":"кеш и разпределение на данните","kw":["кеш"]},{"t":"cache coherence","kw":["coherence","съгласуваност"]}]}]},{"id":"L10-O-3","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Начертайте обобщената структура на паралелен компютър с NUMA архитектура. Кои са нейните предимства и недостатъци?","src":"Контролна — тест 3, въпрос 7","solution":"NUMA компютърът се състои от възли, свързани с комуникационна мрежа, като всеки възел съдържа няколко процесора, модул памет, контролер на паметта и евентуално периферия, свързани с локална шина, така че всеки възел е малък SMP. Всеки процесор може да адресира цялата памет, но локалните обръщения са многократно по-бързи от отдалечените, откъдето идва името нееднакъв достъп до паметта. Предимствата са, че съчетава лесното програмиране на SMP (програмите за SMP се изпълняват и тук) с мащабируемостта на MPP — 256 и повече процесора срещу 8–16 при SMP. Недостатъците са разликата от 200–700% между локален и отдалечен достъп, която налага внимателно разположение на данните, и несъгласуваността на кеш паметите, решавана от ccNUMA.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"възли = малки SMP, свързани с мрежа","kw":["възли","smp"]},{"t":"обща адресация, локален достъп по-бърз","kw":["локалните","отдалечен"]},{"t":"лесно програмиране + мащабируемост (256+)","kw":["256","мащабируем"]},{"t":"200–700%, разположение на данните","kw":["200–700","разположение"]},{"t":"кеш кохерентност — ccNUMA","kw":["ccnuma","кеш"]}]}]},{"id":"L10-O-4","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Как се решават проблемите с неравномерното натоварване на процесорите при паралелните компютри?","src":"Контролна — тест 3, въпрос 5","solution":"Балансираното натоварване означава равномерно разпределение на задачата между процесорите, така че всички или повечето от тях да работят през цялото време на решаване. При дисбаланс по-слабо натоварените процесори завършват по-рано и чакат, времето се определя от най-натоварения, а броят на комуникациите расте и производителността спада. Проблемът се решава на ниво алгоритъм чрез подходяща декомпозиция на данните на равни части, например матрица от n реда на P слоя по n/P реда при n кратно на P, и на ниво операционна система чрез равномерно разпределение на процесите. Ефектът се отчита с коефициента на дисбаланс c в S(P) ≈ P/(c + W(P)·P/T(1)), като c = 1 при равномерно натоварване.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"равномерно разпределение — всички работят през цялото време","kw":["равномерно","цялото време"]},{"t":"чакане, най-натовареният определя времето, повече комуникации","kw":["чакат","комуникации"]},{"t":"декомпозиция в алгоритъма","kw":["алгоритъм","декомпозиция"]},{"t":"разпределение от ОС","kw":["операционна система"]},{"t":"коефициент c","kw":["c = 1","коефициент"]}]}]},{"id":"L10-O-5","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Обяснете понятията „груб паралелизъм“ и „фин паралелизъм“. От кои фактори зависи тяхното използване при паралелните компютри?","src":"Контролна — тест 3, въпрос 9","solution":"При фин паралелизъм задачата е разделена на малки части, които често обменят малки съобщения (например по един елемент), а при груб паралелизъм процесорите работят дълго самостоятелно върху големи сегменти данни и рядко обменят големи съобщения (k·n² елемента). В примера с умножение на матрици на четири транспютъра финият паралелизъм е по-бавен дори от последователното изпълнение, докато грубият е средно около 3.5 пъти по-бърз. Използването им зависи главно от отношението между времето за комуникация и времето за изчисление (t_s/t), а оттам от архитектурата — обща или разпределена памет и скоростта на мрежата. Зависи също от размера на задачата и от алгоритъма за декомпозиция, като компютрите с разпределена памет са подходящи предимно за груб паралелизъм.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"фин — малки, чести съобщения","kw":["фин","малки"]},{"t":"груб — големи сегменти, редки големи съобщения","kw":["груб","големи"]},{"t":"фин може да е по-бавен от последователното; груб ≈3.5×","kw":["по-бавен","3.5"]},{"t":"зависи от t_s/t, архитектурата, размера","kw":["t_s/t","архитектурата","размера"]},{"t":"MPP — груб паралелизъм","kw":["разпределена памет"]}]}]},{"id":"L10-O-6","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Каква е същността на модела на Хоар? Кои са основните елементи на CSP модела и какво е тяхното предназначение при моделирането на реални системи?","src":"Изпит — вариант 2, въпрос 8","solution":"Моделът на Хоар (CSP — Communicating Sequential Processes) е абстрактен модел за изчисления в компютрите с разпределена памет, при който паралелният изчислителен процес е изпълнение на независими конкуриращи се процеси, обменящи данни чрез канали. Процесът описва поведението на отделен дискретен компонент от приложението, може да съдържа подпроцеси и може да се разположи върху произволен процесор от мрежата. Каналът е връзка тип „точка–точка“ между точно два процеса и има две функции: осигурява пътя за данните и синхронизира комуникацията, като изпращачът чака потвърждение от приемника. Моделът интуитивно съответства на паралелизма в реалния свят, не зависи от броя на процесорите и е реализиран в езика Occam.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"независими процеси, обменящи данни по канали","kw":["процеси","канали"]},{"t":"процес — дискретен компонент, подпроцеси","kw":["компонент","подпроцеси"]},{"t":"канал точка–точка между два процеса","kw":["точка–точка","два процеса"]},{"t":"канал — данни + синхронизация (потвърждение)","kw":["синхрониз","потвърждение"]},{"t":"реален свят, Occam","kw":["реалния свят","occam"]}]}]},{"id":"L10-O-7","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"От какво зависи производителността на паралелните компютри? Класирайте според Вас по значимост факторите, които я определят. Аргументирайте значимостта на всеки от тези фактори.","src":"Изпит — вариант 2, въпрос 7","solution":"На първо място производителността зависи от самата задача — вътрешния ѝ паралелизъм, големината на зърното и дела на последователната част, защото по закона на Amdahl последователната част ограничава ускорението независимо от броя процесори. На второ място е комуникационната мрежа (топология, пропускателна способност, отношение t_s/t), защото при бавна комуникация обменът поглъща ускорението, както при финия паралелизъм. На трето място са организацията на паметта (обща или разпределена) и балансираното натоварване, които определят конфликтите, мащабируемостта и престоя на процесорите. Едва след това са броят и мощността на процесорите и ефективността на операционната система, защото повече процесори помагат само ако предходните фактори го позволяват.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"задачата: паралелизъм, последователна част (Amdahl)","kw":["задача","amdahl","последователната"]},{"t":"комуникационна мрежа, t_s/t","kw":["мрежа","t_s/t"]},{"t":"организация на паметта","kw":["паметта"]},{"t":"балансирано натоварване","kw":["натоварване"]},{"t":"брой и мощност на процесорите, ОС","kw":["брой","операционната"]}]}]},{"id":"L10-O-8","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"От какво зависи производителността на паралелните компютри?","src":"Контролна — тест 5, въпрос 6","solution":"Производителността на паралелните компютри зависи от фактори, свързани с решаваната задача: вътрешния паралелизъм и големината на зърното (груб или фин), дела на последователната част, размера на задачата и метода на декомпозиция. Тя зависи и от архитектурни фактори: броя и мощността на процесорите и организацията на паметта — обща или разпределена. Важна е комуникационната мрежа — нейната топология, пропускателна способност и отношението на времето за комуникация към времето за операция (t_s/t). Не на последно място влияят балансираното натоварване на процесорите и ефективността на операционната система при управлението на ресурсите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"задачата — паралелизъм, размер, декомпозиция","kw":["задача","декомпозиция","размера"]},{"t":"брой и мощност на процесорите","kw":["броя","мощност"]},{"t":"организация на паметта","kw":["паметта"]},{"t":"комуникационна мрежа","kw":["мрежа","t_s/t"]},{"t":"натоварване и ОС","kw":["натоварване","операционната"]}]}]},{"id":"L10-O-9","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Начертайте обобщените структури на SMP и MPP компютрите. По какво се различават силно и слабо свързаните системи?","src":"","solution":"При SMP процесорите са свързани чрез комуникационна мрежа (шина или комутатор) с една обща, поделена между тях памет, а при MPP всеки процесор има своя локална памет и двойките процесор–памет са свързани само чрез комуникационна мрежа. SMP са силно свързани системи, в които процесорите директно работят с общата памет, а MPP са слабо свързани — локални компютри, обединени в мрежа. При силно свързаните времето за обмен между процесорите е съизмеримо с времето за изпълнение на машинните операции, а при слабо свързаните е по-голямо. Затова SMP се програмира лесно, но е ограничено мащабируем, а MPP е мащабируем, но изисква обмен на съобщения.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"SMP — процесори + мрежа + обща памет","kw":["обща","поделена"]},{"t":"MPP — процесор с локална памет + мрежа","kw":["локална памет"]},{"t":"силно/слабо свързани","kw":["силно","слабо"]},{"t":"време за обмен съизмеримо / по-голямо","kw":["съизмеримо"]}]}]},{"id":"L10-O-10","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Какви средства се използват за намаляване на отрицателния ефект на общата памет при SMP компютрите? Какъв нов проблем поражда това?","src":"","solution":"Общата памет е тясното място на SMP, защото с добавянето на процесори трафикът по канала процесори–памет нараства бързо до насищане. За намаляване на този ефект към всеки процесор се включва кеш памет, която поема голяма част от обръщенията локално. Второто средство е подходящото разпределение на данните по модулите памет, така че различните процесори да се обръщат към различни модули едновременно. Кеш паметта обаче поражда проблема за съгласуваност на данните (cache coherence), защото едни и същи данни може да имат различни копия в кеш паметите на различните процесори.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"тясно място — каналът към паметта, насищане","kw":["насищане","трафик"]},{"t":"кеш памет към всеки процесор","kw":["кеш памет"]},{"t":"разпределение на данните по модулите","kw":["модулите"]},{"t":"cache coherence","kw":["coherence","съгласуваност"]}]}]},{"id":"L10-O-11","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Какво представлява ccNUMA и как се отнася NUMA към UMA? Кога NUMA компютърът се „държи“ като SMP?","src":"","solution":"В класическия SMP компютър достъпът до паметта е еднакво бърз от всеки процесор, затова архитектурата се нарича UMA (Uniform Memory Access), докато при NUMA локалните обръщения са по-бързи от отдалечените. Ако обръщението към паметта на друг възел е само с 5–10% по-бавно, системата се държи като класически SMP и практически всички програми за SMP вървят без промени. При съвременните NUMA обаче разликата е 200–700% и трябва внимателно да се обмисли разположението на данните по модулите памет. ccNUMA (cache coherent NUMA) е модификация, при която специални протоколи поддържат съгласуваността на всички кеш памети прозрачно за програмиста.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"UMA — еднакъв достъп (SMP)","kw":["uma","еднакво"]},{"t":"5–10% → като SMP","kw":["5–10"]},{"t":"200–700% → разположение на данните","kw":["200–700","разположението"]},{"t":"ccNUMA — кеш кохерентност, прозрачно","kw":["ccnuma","протоколи","прозрачно"]}]}]},{"id":"L10-O-12","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Какво представляват клъстерните системи? С какво се отличават от другите паралелни компютри?","src":"","solution":"Изчислителният клъстер е съвкупност от компютри, обединени в мрежа за решаване на една обща задача, и спада към компютрите с разпределена памет. Като изчислителни възли се използват стандартно произвеждани еднопроцесорни компютри или малки дву- и четирипроцесорни SMP сървъри. Всеки възел работи под управлението на свое копие на операционната система, а съставът и мощността на възлите могат да се различават, което позволява хетерогенни системи. Примери са Beowulf на NASA, KLAT2 и SGI Origin, като предимството е ниската цена на масовите компоненти, а недостатъкът — по-бавната комуникация по мрежата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"компютри в мрежа за една задача","kw":["мрежа","една"]},{"t":"стандартни възли (1 процесор или малък SMP)","kw":["стандартно","smp"]},{"t":"свое копие на ОС, хетерогенност","kw":["копие","хетероген"]},{"t":"Beowulf, KLAT2","kw":["beowulf","klat"]}]}]},{"id":"L10-O-13","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Кои са основните проблеми на компютрите с разпределена памет при програмирането и комуникацията?","src":"","solution":"Главният проблем е ефективното взаимодействие между процесорите, защото достъпът до данни в чужди локални памети става чрез съобщения по бавните входно-изходни операции, затова тези компютри се наричат и message passing. Програмирането се извършва чрез отделни програми за всеки процесор, свързани с нискониво операции „изпрати/получи“, обикновено в стил SPMD, като за преносимост се използват PVM и MPI. Задачата трябва да се декомпозира на подзадачи с минимална зависимост по съобщения, а алгоритъмът да има възможно най-малко комуникации или да ги групира в големи съобщения. Към това се добавя осигуряването на балансирано натоварване, което засяга едновременно алгоритъма и операционната система.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"бавно взаимодействие — съобщения, I/O","kw":["съобщения","входно-изходни"]},{"t":"SPMD, PVM/MPI","kw":["spmd","pvm","mpi"]},{"t":"декомпозиция с минимална зависимост","kw":["декомпозира","зависимост"]},{"t":"малко или групирани комуникации","kw":["групира","комуникации"]},{"t":"балансирано натоварване","kw":["балансирано"]}]}]},{"id":"L10-O-14","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Каква характеристика на паралелния компютър се отчита с отношението t_s/t? Как то влияе на избора между груб и фин паралелизъм?","src":"","solution":"Отношението t_s/t е времето за комуникация (достъп до глобалната памет или предаване на съобщение) към времето за изпълнение на една аритметична или логическа операция. То показва колко пъти комуникацията е по-бавна от изчислението, или относителната латентност на обмена. При t_s/t ≪ 1 комуникацията е евтина и системата е ефективна дори при чест обмен, което е характерно за SMP. При t_s/t ≫ 1, както при MPP, всяка комуникация е скъпа и системата е ефективна само при груб паралелизъм с малко на брой, но големи съобщения.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"комуникация / операция","kw":["комуникация","операция"]},{"t":"относителна латентност","kw":["латентност","по-бавна"]},{"t":"t_s/t ≪ 1 — чест обмен е ОК (SMP)","kw":["≪ 1","smp"]},{"t":"t_s/t ≫ 1 — груб паралелизъм (MPP)","kw":["≫ 1","груб"]}]}]},{"id":"L10-O-15","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Как се програмират компютрите с разпределена памет? Каква е ролята на PVM и MPI?","src":"","solution":"Компютърът с разпределена памет работи като MIMD компютър с предаване на съобщения, като изчислителният процес е съвкупност от последователни програми със системни заявки за изпращане и приемане на съобщения. Обикновено във всички възли се изпълняват копия на една и съща програма върху различни данни в стил SPMD (Single Program Multiple Data). Програмистът трябва да формулира задачата чрез процеси и виртуални канали и да познава организацията на паметта, което внася хардуерна зависимост в програмата. PVM (Parallel Virtual Machine) и MPI (Message-Passing Interface) са стандартните механизми за обмен на съобщения, които осигуряват преносимост на програмите между различните машини.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"MIMD с предаване на съобщения","kw":["mimd","съобщения"]},{"t":"SPMD","kw":["spmd"]},{"t":"процеси и канали; хардуерна зависимост","kw":["процеси","хардуерна зависимост"]},{"t":"PVM и MPI — преносимост","kw":["pvm","mpi","преносимост"]}]}]},{"id":"L11-O-1","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Каква е същността на паралелните компютри с потоково управление? По какво се различават от компютрите на фон Нойман?","src":"","solution":"В класическия компютър на фон Нойман командите се изпълняват строго последователно, а редът им се определя от брояча на командите. В компютрите с потоково управление всяка команда е готова за изпълнение в момента, в който са налични всичките ѝ операнди, независимо от мястото ѝ в програмата. Така всички команди с готови операнди се изпълняват едновременно и асинхронно, а максималният паралелизъм, заложен в програмата, се открива и използва автоматично. Резултатите се предават директно между командите, без странични ефекти върху общи клетки на паметта.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"фон Нойман — последователно, брояч на командите","kw":["брояча на командите","последователно"]},{"t":"изпълнение при наличие на всички операнди","kw":["операнди"]},{"t":"едновременно и асинхронно, автоматичен паралелизъм","kw":["едновременно","автоматично","паралелизъм"]},{"t":"без странични ефекти","kw":["странични ефекти"]}]}]},{"id":"L11-O-2","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Сравнете управлението по данни (dataflow) и управлението по заявки (demand-driven).","src":"","solution":"При управление по данни всяка команда чака пасивно появяването на операндите си и се изпълнява веднага щом всички постъпят. Програмата е граф (потокова мрежа), чиито върхове са командите, а изпълнението се ръководи от движението на маркерите с данни по дъгите. При управление по заявки командата се активира едва когато е необходим резултатът ѝ, а при липса на операнд изпраща заявка към командата, която го произвежда. Там програмата е структура от вложени математически изрази, а изпълнението е редукция — последователно заместване на подизразите с техните стойности.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"dataflow — пасивно чакане на операндите","kw":["пасивно","операнд"]},{"t":"граф, маркери по дъгите","kw":["граф","маркер"]},{"t":"demand-driven — активира се при нужда от резултат, заявка","kw":["заявка","необходим резултатът"]},{"t":"вложени изрази, редукция","kw":["редукция","вложени"]}]}]},{"id":"L11-O-3","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Обяснете с пример разликата между класическата и потоковата организация на изчисленията.","src":"","solution":"Нека се изчисляват y1 = x2(x1 + x2) и y2 = x1(x1 + x2) при x1 = 3 и x2 = 2 с три команди: Pa (V3 = x1 + x2) и две умножения Pb и Pc по V3. При класическата организация командите се разрешават от управляващ маркер — брояча на командите, и се изпълняват последователно Pa, Pb, Pc, като резултатите се записват в променливи в паметта. При потоковата организация Pa се изпълнява веднага щом x1 и x2 са налични, а резултатът V3 = 5 се изпраща директно като операнд едновременно в Pb и Pc. Тогава Pb и Pc имат всичките си операнди и се изпълняват паралелно, давайки 15 и 10, без странични ефекти.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"класическа — последователно по брояч","kw":["последователно","брояча"]},{"t":"потокова — Pa веднага при наличие на x1, x2","kw":["веднага","налични"]},{"t":"V3 се изпраща директно в Pb и Pc","kw":["директно","pb и pc"]},{"t":"Pb и Pc паралелно","kw":["паралелно"]}]}]},{"id":"L11-O-4","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Кои са качествено новите свойства, които потоковият принцип дава на изчислителната система?","src":"","solution":"Потоковият принцип осигурява максимален паралелизъм, защото автоматично се използва целият паралелизъм на конкретната задача. Той дава модулно нарастване — N разрешени команди могат да се изпълнят от 1 до N операционни елемента, като броят им може да се променя дори динамично без промяна на програмата. Изчисленията са асинхронни и независими, а информацията се самоидентифицира чрез идентификатори, дешифрирани апаратно. Накрая обработката е разпределена, защото множество операционни елементи работят паралелно и асинхронно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"паралелизъм","kw":["паралелизъм"]},{"t":"модулно нарастване","kw":["модулно"]},{"t":"асинхронни изчисления","kw":["асинхрон"]},{"t":"самоидентификация","kw":["самоидентифицира","идентификатори"]},{"t":"разпределена обработка","kw":["разпределена"]}]}]},{"id":"L11-O-5","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Какво представляват спусковите функции? Как се класифицират потоковите компютри според тяхната реализация?","src":"","solution":"Спусковата функция е механизмът, който проверява наличието на всички необходими операнди на дадена команда и разрешава нейното изпълнение, и реализацията ѝ е основната задача на управлението. По начина на реализация компютрите са с централизирано управление, при което едно устройство проверява готовността и предава разрешените команди, или с разпределено управление, при което всяка команда сама установява готовността си в множество устройства или в клетките на паметта. По нивото на реализация се различават микрониво — спускова функция за всяка команда, с паралелизъм на ниво команди, и макрониво — за части от програмата като процедури и подпрограми. Двете нива могат да се съчетаят в един компютър.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"проверка на операндите и разрешаване","kw":["проверява","разрешава"]},{"t":"централизирано управление","kw":["централизирано"]},{"t":"разпределено управление","kw":["разпределено"]},{"t":"микрониво — за всяка команда","kw":["микрониво"]},{"t":"макрониво — части от програмата","kw":["макрониво"]}]}]},{"id":"L11-O-6","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Каква е разликата между статичния и динамичния модел на потоковите компютри?","src":"","solution":"При статичния модел се работи само с едно копие на всяка команда и тя не може да се изпълни повторно, преди предходното ѝ изпълнение да е завършило. Това съответства на капацитет от един маркер на дъгите на потоковата мрежа, а паралелизмът е само толкова, колкото е зададен в машинната програма. При динамичния модел са възможни няколко едновременни изпълнения на една команда чрез създаване на нейни копия и повече от един маркер на дъга. Паралелизмът между копията се открива динамично в хода на изчисленията, затова динамичният модел постига по-висока паралелност.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"статичен — едно копие на командата","kw":["едно копие"]},{"t":"един маркер на дъга, паралелизъм от програмата","kw":["един маркер","машинната програма"]},{"t":"динамичен — копия, едновременни изпълнения","kw":["копия"]},{"t":"по-висока паралелност, открива се динамично","kw":["по-висока","динамично"]}]}]},{"id":"L11-O-7","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Опишете формата на командата в компютър с потоково управление. Кога командата се изпълнява?","src":"","solution":"Командната клетка има полета OP, SA, DV1, D1, DV2 и D2, където OP е кодът на операцията, а SA е адресът на клетката, която ще получи резултата. D1 и D2 съдържат самите стойности на операндите, а не адресите им, което я отличава от триадресната команда на класическите процесори. DV1 и DV2 са флагове за наличност — първоначално операндите липсват и пристигат като резултати от други командни клетки. Когато двата флага са в състояние „готовност“, се изпълнява OP(D1, D2), а резултатът се изпраща в клетката, посочена от SA.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"OP — код на операцията","kw":["op","код на операцията"]},{"t":"SA — адрес на получателя","kw":["sa","адресът"]},{"t":"D1, D2 — стойности, не адреси","kw":["стойности"]},{"t":"DV1, DV2 — флагове; изпълнение при „готовност“","kw":["флагове","готовност"]}]}]},{"id":"L11-O-8","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Кои са особеностите на запомнящата среда в компютрите с потоково управление?","src":"","solution":"Освен команди, входни данни, междинни и крайни резултати, запомнящата среда съхранява и идентификатори на обектите — етикети на команди, имена на операнди, указатели на назначението и маркери. Тя има активна роля, защото участва в спусковите функции, като проверява наличността на операндите, и подготвя изпълнението чрез комплектоване на кода на операцията, операндите и назначението на резултата. Изисква сравнително голям разход на памет за идентификатори, копия на командите при динамичния модел и копия на данните. Областите ѝ са функционално специализирани, а по метода на достъп паметите са адресни, асоциативни или безадресни (стекови).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"съхранява и идентификатори","kw":["идентификатори"]},{"t":"активна роля — спускови функции","kw":["активна","спусковите"]},{"t":"комплектоване на командите","kw":["комплектоване"]},{"t":"голям разход на памет","kw":["разход на памет"]},{"t":"адресни, асоциативни, стекови","kw":["асоциативни","стекови"]}]}]},{"id":"L11-O-9","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Какви средства за комуникация се използват в потоковите компютри? Кои са типовете пакети?","src":"","solution":"Асинхронната работа на устройствата изисква силно развити средства за комуникация, като се използват два метода — предаване на съобщения и предаване на пакети. Съобщенията са блокове информация с различна дължина, всеки от които носи адреса на приемника, а пакетите са частен случай на съобщения с фиксирана дължина. Типовете пакети са командни (команда с операндите ѝ), операндни (стойности на операнди), резултатни (резултат от команда) и служебни (маркери за данни или за заявки). Комуникационните ресурси са устройства за управление на обмена, буфери, нужни заради асинхронността, и канали.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"съобщения — различна дължина, адрес","kw":["съобщения","различна дължина"]},{"t":"пакети — фиксирана дължина","kw":["пакети","фиксирана"]},{"t":"командни, операндни, резултатни, служебни","kw":["командни","служебни"]},{"t":"устройства за управление, буфери, канали","kw":["буфери","канали"]}]}]},{"id":"L11-O-10","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Какви са особеностите на езиците за програмиране на потоковите компютри?","src":"","solution":"Потоковите езици имат стойностен характер — третират данните не като променливи, а като стойности, които се поглъщат и изработват еднократно. Затова те използват правилото за еднократно присвояване, което осигурява липсата на странични ефекти: изпълнението на един оператор не може да повлияе отрицателно на друг. Структурните данни също се разглеждат като стойности и промяната на елемент създава нова стойност на структурата. Примери са LAU (Тулуза) и VAL (MIT) за статичен тип и Id (Ървин) за динамичен тип потокови компютри.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"стойностен характер","kw":["стойностен"]},{"t":"еднократно присвояване","kw":["еднократно присвояване"]},{"t":"липса на странични ефекти","kw":["странични ефекти"]},{"t":"LAU, VAL — статичен; Id — динамичен","kw":["val","lau","id"]}]}]},{"id":"L11-O-11","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Кои са способите за организация на структурата на потоковия компютър? Кои са основните структури?","src":"","solution":"Първият способ е прякото взаимно свързване на операционните елементи, при което програмата се задава чрез физическа комутация — той дава максимална скорост, но не е универсален. Вторият използва матричен превключвател, управляван от програмата, който е универсален, но сложността на връзките расте стремително с броя на операциите. Третият реализира съединенията като логически път чрез комуникационна мрежа и практически е единственият приложим способ. Без входно-изходните устройства основните структури са четири — с обща шина, разпределена, кръгова и йерархична, като кръговата работи като цикличен конвейер от изчислителни, комуникационни и запомнящи устройства.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"пряко свързване — бързо, неуниверсално","kw":["пряко","максимална скорост"]},{"t":"матричен превключвател — сложни връзки","kw":["превключвател"]},{"t":"комуникационна мрежа — логически път","kw":["комуникационна мрежа","логически"]},{"t":"обща шина, разпределена, кръгова, йерархична","kw":["кръгова","йерархична"]}]}]},{"id":"L11-O-12","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Какви проблеми възникват при обръщенията към паметта в компютрите с потоково управление?","src":"","solution":"Конвенционалните компютри имат висока локалност на обръщенията към паметта, която позволява ефективно използване на кеш памет, йерархична памет, изпреварващо извличане на команди и регистри. В потоковите компютри прилагането на тези прийоми е свързано с принципни трудности, защото липсва такава локалност. Множеството паралелно работещи операционни елементи изискват изключително висока пропускателна способност към паметта. Частично решение е повишаването на функционалното ниво на операционните елементи, но изборът на това ниво сам по себе си е проблем.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"класическите — висока локалност, кеш","kw":["локалност","кеш"]},{"t":"в потоковите — трудно приложими","kw":["трудности"]},{"t":"нужна много висока пропускателна способност","kw":["пропускателна способност"]},{"t":"по-високо функционално ниво на ОЕ","kw":["функционалното ниво"]}]}]},{"id":"L11-O-13","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Какви са проблемите на потоковите компютри при обработката на регулярни структури и при прекъсванията?","src":"","solution":"При обработка на масиви потоковият компютър разглежда масива като набор от независими елементи, при което векторните операции се свеждат до скаларни. Обръщенията към паметта стават рандомизирани и не може да се използва разслояването на паметта, а обработката на индекси добавя много непродуктивни разходи, затова се препоръчва функционален блок от високо ниво за регулярни структури. Класическият апарат за прекъсвания липсва, затова изключителните ситуации се обработват чрез специални стойности-грешки. Например при препълване се генерира „стойност-грешка-препълване“, която се предава по потока до следващия оператор, а той предприема съответната реакция.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"масив — независими елементи, скаларни операции","kw":["независими","скаларни"]},{"t":"рандомизиран достъп, без разслояване","kw":["рандомизирани","разслояване"]},{"t":"функционален блок от високо ниво","kw":["функционален блок"]},{"t":"няма прекъсвания — стойности-грешки","kw":["стойност","прекъсвания"]}]}]},{"id":"L11-O-14","group":"L11","lec":11,"title":"Компютри с потоково управление (dataflow)","text":"Каква е изчислителната среда на потоковия компютър? Какви видове потокови компютри се различават според операционните елементи?","src":"","solution":"Изчислителната среда се състои от голям брой операционни елементи (ОЕ), всеки от които изпълнява по една команда в даден момент и работи асинхронно и независимо от останалите. Всеки ОЕ получава цялата информация за командата — код на операцията, стойности на операндите и назначение на резултата, затова към средата могат да се добавят нови ОЕ само чрез физическо свързване. Според вида на ОЕ се различават компютри със специализирани ОЕ, изпълняващи предварително зададени функции, и с универсални ОЕ, всеки от които изпълнява произволна команда. Третият вид е с универсални процесорни модули — ОЕ със своя локална памет, при които изчислителната и запомнящата среда са интегрирани.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"голям брой асинхронни ОЕ","kw":["операционни елементи","асинхронно"]},{"t":"ОЕ получава цялата информация; лесно добавяне","kw":["цялата информация","добавят"]},{"t":"специализирани ОЕ","kw":["специализирани"]},{"t":"универсални ОЕ / процесорни модули с памет","kw":["универсални","процесорни модули"]}]}]},{"id":"L12-O-1","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Колко основни вида комуникационни мрежи за паралелни компютри познавате и какво е тяхното предназначение?","src":"Изпит — вариант 1, въпрос 8","solution":"Комуникационната мрежа осигурява обмена на данни, команди и управляващи сигнали между процесорите и модулите памет на паралелния компютър, като целта е минимални комуникационни загуби. По топология основните видове са два — статични и динамични мрежи. Статичните осигуряват непосредствена връзка само между строго определени възли (линийка, кръг, решетка, хиперкуб), а останалите се свързват индиректно през междинни процесори. Динамичните осигуряват директна връзка между произволна двойка предавател–приемник чрез реконфигурация на комутиращите елементи (crossbar, омега, Клос, Бенес), а по начина на комутация мрежите се делят и на мрежи с комутация по пространство и по време.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Предназначение — обмен между процесори/памет с минимални загуби","kw":["обмен","загуби"]},{"t":"Два вида: статични и динамични","kw":["статич","динамич"]},{"t":"Статични — пряка връзка само между определени възли","kw":["определени","индиректно","непосредствен"]},{"t":"Динамични — произволна двойка чрез реконфигурация","kw":["произволна","реконфигур"]},{"t":"Комутация по пространство / по време","kw":["пространство","по време"]}]}]},{"id":"L12-O-2","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Кои два основни вида комуникационни мрежи за паралелни компютри познавате и какви са техните предимства?","src":"Контролна — тест 5, въпрос 8","solution":"Двата основни вида са статични и динамични комуникационни мрежи. Статичните свързват пряко само определени двойки възли, като процесорите изпълняват ролята на комутиращи елементи — предимствата им са простота, ниска цена и лесна мащабируемост при постоянна степен на възлите, затова са подходящи за MPP компютри и клъстери. Динамичните осигуряват директна връзка между произволна двойка чрез реконфигурация на комутиращите елементи — предимствата им са гъвкавост, голяма ширина на лентата и много едновременни независими връзки. Затова динамичните мрежи се използват предимно в тясно свързани системи с обща памет (SMP, NUMA).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Статични и динамични","kw":["статич","динамич"]},{"t":"Статични: простота, ниска цена, мащабируемост","kw":["цена","мащабир","прост"]},{"t":"Динамични: произволна двойка, гъвкавост","kw":["произволна","гъвкав"]},{"t":"Динамични: голяма ширина на лентата, едновременни връзки","kw":["лентата","едновремен"]},{"t":"Приложение: клъстери/MPP срещу SMP/NUMA","kw":["клъстер","mpp","smp"]}]}]},{"id":"L12-O-3","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Кои са познатите Ви наименования на топологии за статични комуникационни мрежи за паралелни компютри? Начертайте някои от тях.","src":"Изпит — вариант 2, въпрос 9","solution":"Известни топологии на статични мрежи са линийка (конвейер), кръг, звезда, двумерна решетка, тор, двоично дърво, хипердърво, кръг с хорди, ILLIAC IV и двоичен хиперкуб. Линийката свързва възлите последователно (D = N − 1), а кръгът добавя връзка между двата края (D = N/2). Решетката подрежда възлите в матрица, като всеки е свързан с четирима съседи (D = 2(√N − 1)), а торът е решетка със затворени краища на редовете и стълбовете. Двоичното дърво има корен с по два наследника на всяко ниво, а хиперкубът с N = 2^d възела свързва всеки възел с d съседа, чийто адрес се различава в един бит (D = log₂N).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Изброени: линийка, кръг, решетка, тор","kw":["линийк","кръг","решетк","тор"]},{"t":"Дърво / звезда","kw":["дърво","звезд"]},{"t":"Хиперкуб и описанието му","kw":["хиперкуб"]},{"t":"Описание/диаметър на отделните топологии","kw":["d = ","съсед"]}]}]},{"id":"L12-O-4","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Какви други топологии на статични мрежи при паралелните компютри познавате освен двоичен хиперкуб? Начертайте ги!","src":"Контролна — тест 5, въпрос 9","solution":"Освен двоичния хиперкуб се използват линийка (конвейер), кръг, кръг с хорди, звезда, двумерна решетка, тор, ILLIAC IV, двоично дърво и хипердърво. Линийката е верига от възли с диаметър N − 1, кръгът я затваря и намалява диаметъра до N/2, а звездата свързва всички възли с централен възел (D = 2). Решетката подрежда процесорите в матрица с по четирима съседи, торът свързва и краищата на всеки ред и стълб, а ILLIAC IV свързва възел i с i ± 1 и i ± √N по модул N. Двоичното дърво има един корен и по два наследника на всеки възел, като диаметърът му расте логаритмично, но няма алтернативни пътища при отказ.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Линийка и кръг","kw":["линийк","кръг"]},{"t":"Решетка и тор","kw":["решетк","тор"]},{"t":"Дърво / звезда / хипердърво","kw":["дърво","звезд"]},{"t":"ILLIAC IV","kw":["illiac"]},{"t":"Описание на връзките/диаметъра","kw":["диаметър","съсед"]}]}]},{"id":"L12-O-5","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"С какви параметри се оценяват статичните комуникационни мрежи? Обяснете физическия смисъл на всеки от тях.","src":"Контролна — тест 3, въпрос 8","solution":"Статичните мрежи се оценяват с броя върхове N (процесорите), диаметъра D и средното разстояние P. Диаметърът е максималното от минималните разстояния между два върха и определя най-лошото закъснение, а средното разстояние е средната дължина на пътя при равновероятен избор на предавател и приемник и определя средното закъснение. Натовареността на линиите T = N·P / (брой линии) показва колко съобщения за единица време минават по една линия, а относителната структурна сложност U (линии на връх) показва цената и мащабируемостта — при U = const мрежата расте с еднотипни процесори. Отказоустойчивостта отразява наличието на алтернативни пътища за заобикаляне на отказал компонент.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"N и диаметър D — най-лошо закъснение","kw":["диаметър"]},{"t":"Средно разстояние P — средно закъснение","kw":["средно"]},{"t":"Натовареност T = N·P / брой линии","kw":["натовар"]},{"t":"Структурна сложност U — мащабируемост","kw":["сложност","мащаб"]},{"t":"Отказоустойчивост — алтернативни пътища","kw":["отказ","алтернатив"]}]}]},{"id":"L12-O-6","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Каква е разликата между комуникационните мрежи с комутация по пространство и с комутация по време? Дайте примери.","src":"","solution":"При комутацията по пространство всяка активна двойка предавател–приемник получава собствена, индивидуална линия за връзка, така че много двойки работят едновременно. Такива мрежи имат висока сложност O(N²), но малко време за трансфер O(1) — типични примери са матричният превключвател (crossbar) и пълно свързаната мрежа. При комутацията по време няколко двойки споделят обща линия и я заемат в различни моменти, което дава ниска сложност O(1), но голямо време за трансфер O(N) — типичен пример е шината. Третият клас — комбинирани мрежи — се стреми да съчетае предимствата на двата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"По пространство — индивидуални линии","kw":["индивидуал","пространство"]},{"t":"O(N²) сложност, O(1) време; crossbar","kw":["crossbar","o(n²)"]},{"t":"По време — обща споделена линия","kw":["обща","споделя"]},{"t":"Шина: O(1) сложност, O(N) време","kw":["шина"]},{"t":"Комбиниран клас","kw":["комбинира"]}]}]},{"id":"L12-O-7","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Кои са основните въпроси (характеристики), които решава всяка комуникационна мрежа?","src":"","solution":"Всяка комуникационна мрежа се характеризира с режим на работа, стратегия на управление, метод на превключване и топология. Режимът може да е синхронен (връзките се установяват синхронно, както при SIMD), асинхронен (връзките се създават динамично) или комбиниран. Управлението е централизирано, когато специално устройство изчислява пътищата, или децентрализирано (разпределено), когато това правят самите комутиращи елементи. Превключването е схемно — с физически път за целия сеанс, или пакетно — без предварително установен път, а топологията (статична или динамична) е ключовият фактор за възможностите на мрежата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Режим на работа: синхронен/асинхронен/комбиниран","kw":["синхрон","режим"]},{"t":"Стратегия на управление: централизирана/разпределена","kw":["централиз","разпредел"]},{"t":"Метод на превключване: схемно/пакетно","kw":["схемно","пакетно"]},{"t":"Топология — ключов фактор","kw":["топология"]}]}]},{"id":"L12-O-8","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Какви са основните свойства на двоичния хиперкуб като комуникационна мрежа?","src":"","solution":"Двоичният хиперкуб с размерност d има N = 2^d възела и d·2^(d−1) ребра, като всеки възел е свързан с d съседа, чиито адреси се различават в един бит (функциите cube_i инвертират i-тия бит). Диаметърът му е d = log₂N, а средното разстояние бързо се доближава до d/2, което дава малки закъснения при голям брой процесори. Хиперкубът е регулярен и симетричен и съдържа много подкубове с по-малка размерност, затова програмите лесно се мащабират, а машината се дели между много потребители; в него могат да се влагат дърво, кръг и решетка. Недостатък е, че степента на възела расте с d, което ограничава практически размерността.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"N = 2^d, d·2^(d−1) ребра, d съседа","kw":["2^d","съсед"]},{"t":"Диаметър log₂N","kw":["log₂n","диаметър"]},{"t":"Регулярност, симетрия, подкубове","kw":["подкуб","симетрич","регуляр"]},{"t":"Влагане на дърво, кръг, решетка","kw":["влага"]},{"t":"Недостатък: степента расте","kw":["расте","степен"]}]}]},{"id":"L12-O-9","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Как се класифицират динамичните комуникационни мрежи? Дайте примери.","src":"","solution":"Динамичните мрежи се делят на едностъпални (рециркулационни), при които съобщенията могат да минат многократно през едно стъпало (shuffle-exchange), и многостъпални. Многостъпалните биват едностранни (с двупосочни линии) и двустранни (с входна и изходна страна). Двустранните са блокиращи — свързването на една двойка може да блокира друга (делта, омега, флип, манипулатор), напълно неблокиращи (мрежа на Клос, пълносвързана мрежа) и неблокиращи с реконфигурация, при които понякога трябва да се пренаредят вече установени маршрути (мрежа на Бенес, битонална мрежа).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Едностъпални (рециркулационни) и многостъпални","kw":["едностъп","многостъп"]},{"t":"Едностранни и двустранни","kw":["едностран","двустран"]},{"t":"Блокиращи — делта, омега","kw":["блокиращ","омега","делта"]},{"t":"Напълно неблокиращи — Клос","kw":["клос"]},{"t":"Неблокиращи с реконфигурация — Бенес","kw":["бенес","реконфигур"]}]}]},{"id":"L12-O-10","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"С какви параметри се оценяват динамичните комуникационни мрежи?","src":"","solution":"Първият параметър е времето за предаване, което в първо приближение е O(k), където k е броят на стъпалата — по-малко стъпала означава по-малки загуби, но по-сложни и по-бавни комутиращи елементи. Вторият е сегментируемостта — възможността мрежата да се раздели на независими подмрежи, всяка с пълните възможности на мрежа от същия тип. Третият е ширината на лентата на пропускане — очакваният брой приети заявки за единица време, която най-често се определя с имитационни модели (за crossbar B ≈ M·[1 − (1 − 1/M)^(N·p)]).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Време за предаване O(k)","kw":["време за предаване","o(k)","стъпала"]},{"t":"Сегментируемост — независими подмрежи","kw":["сегмент","подмреж"]},{"t":"Ширина на лентата — приети заявки за единица време","kw":["ширина на лентата","заявки"]},{"t":"Оценка с имитационни модели","kw":["имитацион"]}]}]},{"id":"L12-O-11","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Каква е разликата между схемното и пакетното превключване в комуникационните мрежи?","src":"","solution":"При схемното (канално) превключване между източника и приемника се установява физически път, който се поддържа през целия сеанс на предаване. Това е изгодно при малко на брой предавания на голям обем данни, защото времето за установяване на пътя се разпределя върху много данни. При програмното (пакетно) превключване данните се поставят в пакети и се придвижват през мрежата без предварително установен физически път, затова то е подходящо за чести кратки съобщения. Статичните мрежи по правило работят с пакети, а процесорите в тях изпълняват ролята на комутиращи елементи.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Схемно — физически път за целия сеанс","kw":["физически път","сеанс"]},{"t":"Схемно — за големи обеми","kw":["обем"]},{"t":"Пакетно — пакети без установен път","kw":["пакет"]},{"t":"Пакетно — за кратки съобщения","kw":["кратки"]}]}]},{"id":"L12-O-12","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Каква е структурата на комутиращия елемент и как се управлява той чрез тяг?","src":"","solution":"Комутиращият елемент по сложност се доближава до микропроцесор и съдържа буферна памет, адресни регистри, цифрови компаратори, мултиплексори, комутаторен елемент, локален контролер и приоритетна логика. Най-разпространени са елементите 2×2, чиито основни състояния са право предаване, размяна (кръстосано), разпръскване на един вход към двата изхода и трето състояние. При многостъпалните мрежи управлението става с тяг T = X ⊕ Y, където X и Y са адресите на предавателя и приемника, като елементът в i-тото стъпало превключва според i-тия бит на тяга. Съвременните интелигентни елементи регулират и трафика, разпределят товара и синхронизират процесите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Буфер, регистри, компаратори, контролер, приоритетна логика","kw":["буфер","компаратор","контролер"]},{"t":"Елемент 2×2 и състояния право/размяна","kw":["2×2","размяна","право"]},{"t":"Тяг T = X ⊕ Y","kw":["тяг","⊕"]},{"t":"i-тият бит управлява i-тото стъпало","kw":["бит"]},{"t":"Интелигентни КЕ","kw":["интелигент","трафик"]}]}]},{"id":"L12-O-13","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Какво представляват мрежите на Клос и на Бенес? Каква е разликата между тях?","src":"","solution":"Мрежата на Клос е тристъпална с комутиращи елементи n×m, r×r и m×n, където N = n·r, и при m ≥ 2n − 1 е напълно неблокираща; частният случай m = n = r се нарича мрежа „Мемфис“. Мрежата на Бенес има симетрична рекурсивна структура, в която всяка половина съдържа мрежа на Бенес с N/2 входа, като има 2log₂N − 1 стъпала и N(2log₂N − 1)/2 елемента 2×2. Бенес е неблокираща с реконфигурация — всяка двойка може да се свърже, но понякога трябва да се пренаредят съществуващите маршрути. Тъй като установяването изисква O(N·log₂N) операции, динамичното съединяване в мрежата на Бенес е непрактично.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Клос — тристъпална, N = n·r","kw":["тристъп","n·r"]},{"t":"Клос неблокираща при m ≥ 2n − 1","kw":["2n − 1","напълно неблокира"]},{"t":"Бенес — рекурсивна, 2log₂N − 1 стъпала","kw":["рекурсив","2log₂n"]},{"t":"Бенес — неблокираща с реконфигурация","kw":["реконфигур","пренаред"]},{"t":"O(N·log₂N) за установяване","kw":["o(n·log₂n)","непрактич"]}]}]},{"id":"L12-O-14","group":"L12","lec":12,"title":"Комуникационни мрежи","text":"Защо комуникационната мрежа е критичен компонент на паралелния компютър и какви подходи се използват за намаляване на комуникационните загуби?","src":"","solution":"Прехвърлянето на данни, команди и управляващи сигнали между процесорите изисква време — комуникационни загуби, които се прибавят към изчислителното време и могат да намалят съществено очаквания ефект от паралелната обработка. Първият подход за намаляването им е оптималното разпределение на задачата (код и данни) по процесорите и модулите памет, което е предмет на паралелните алгоритми. Вторият подход е повишаване на скоростта на мрежата чрез по-бързодействаща логика или чрез подходяща структурна организация (топология). На практика се търси баланс между двата подхода.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Комуникационни загуби се прибавят към изчисленията","kw":["загуби","прибав"]},{"t":"Оптимално разпределение на задачата","kw":["разпредел"]},{"t":"Повишаване на скоростта на мрежата","kw":["скорост"]},{"t":"Структурна организация / топология","kw":["структурна","топология"]}]}]},{"id":"L13-O-1","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Каква е същността на вертикалната организация на паметта? Кои основни принципи се използват при нейната реализация? До кои положителни ефекти води нейното използване в съвременните компютри?","src":"Изпит — вариант 1, въпрос 9","solution":"Вертикалната (йерархична) организация изгражда паметта от няколко нива — регистри, кеш L1/L2, основна памет и вторична (дискова) памет, защото „плоският“ модел с една памет е невъзможен: бързата памет е скъпа, а с нарастване на обема расте и времето за достъп. Принципът е най-близо до процесора да е най-бързата, но малка памет, а най-далеч — най-голямата и най-бавна, като времената за достъп на съседните нива се различават с около порядък. Работата ѝ се основава на локалността на обръщенията (по време и по пространство), а данните се прехвърлят динамично между нивата чрез виртуалната организация на паметта. Резултатът е по-добра работа на процесора, по-висока пропускателна способност и достъп до големи обеми данни за малко време — с цена близка до тази на външната памет и средно време за достъп близко до това на най-бързата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Йерархия от нива: регистри, кеш, ОП, диск","kw":["регистр","кеш","ниво"]},{"t":"Причина: цена на бита и ръст на времето с обема","kw":["скъп","цена","обем"]},{"t":"Принцип: бърза малка памет близо, бавна голяма далеч","kw":["близо","далеч"]},{"t":"Локалност на обръщенията / виртуална организация","kw":["локалност","виртуал"]},{"t":"Ефекти: пропускателна способност, малко средно време, ниска цена","kw":["пропускател","средно време"]}]}]},{"id":"L13-O-2","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Каква е същността на хоризонталната организация на паметта? Кои начини се използват при нейната реализация? Кои са положителните и отрицателните страни на хоризонталната организация на паметта в съвременните компютри?","src":"Изпит — вариант 2, въпрос 10","solution":"Хоризонталната организация (разслоена памет) цели не да намали времето за достъп, а да увеличи броя на достъпите за единица време, като основната памет се разбива на N модула с паралелен достъп; най-простата ѝ форма е Харвардската архитектура с отделни памети за команди и данни. Реализира се чрез пакетна обработка — при едно обръщение се четат N последователни думи в буфери, и чрез конвейерна обработка — всеки модул получава свой адрес и контролерът подава заявките конвейерно. Положителното е N-кратното ускорение при последователен достъп (вектори, поток от команди), затова се използва във векторните и потоковите компютри, където кешът е нецелесъобразен. Отрицателното е, че при непоследователен достъп и много преходи възникват конфликти в модулите и ефективността пада, а за безконфликтна работа е нужно специално разположение на данните (скосено или с просто число модули).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Цел: повече достъпи за единица време","kw":["единица време","броя на достъпите"]},{"t":"Разбиване на N модула (разслояване)","kw":["модул","разслоен"]},{"t":"Пакетна и конвейерна обработка","kw":["пакетна","конвейерна"]},{"t":"Плюс: N-кратно ускорение при последователен достъп","kw":["n-кратно","последователен"]},{"t":"Минус: конфликти при непоследователен достъп / разположение на данните","kw":["конфликт","разположение"]}]}]},{"id":"L13-O-3","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Защо вероятността за намиране на данните в кеш паметта не може да бъде нито 0, нито 1?","src":"Контролна — тест 3, въпрос 6","solution":"Вероятността p за попадение не може да бъде 1, защото обемът на кеш паметта е многократно по-малък от обема на основната памет и не всички нужни блокове могат да са едновременно в кеша. Освен това при първо обръщение към нов блок (студен кеш), при колизии и при заместване на блокове промахът (cache miss) е неизбежен. Вероятността не може да бъде 0, защото програмите проявяват локалност на обръщенията — веднъж зареденият блок се използва отново (цикли, горещи данни) и съседните думи в блока също се търсят. Реално p е динамична величина между 0 и 1, която зависи от програмата, размера на кеша и блока, асоциативността и стратегията за заместване.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"≠ 1: кешът е много по-малък от основната памет","kw":["по-малък","обем"]},{"t":"Промахи: първо обръщение, колизии, заместване","kw":["колизи","заместв","промах"]},{"t":"≠ 0: локалност на обръщенията","kw":["локалност"]},{"t":"Повторно използване на блока (цикли, съседни думи)","kw":["отново","цикли"]},{"t":"p зависи от размера, асоциативността, програмата","kw":["зависи","асоциатив"]}]}]},{"id":"L13-O-4","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Какво означава понятието „локалност по време“ при кеш паметта?","src":"Контролна — тест 5, въпрос 7","solution":"Локалността по време означава, че веднъж направено обръщение към дадена клетка от паметта, има голяма вероятност тя да бъде потърсена отново в недалечно бъдеще. Типични примери са изпълнението на цикли (командите в тялото се извикват многократно), извикванията на подпрограми и прекъсванията, а при данните — „горещите“ данни като броячи, натрупващи се променливи, стекови променливи и преглед на таблици. Кеш паметта експлоатира това свойство, като задържа наскоро използваните блокове, а стратегията LRU заменя блока, използван преди най-много време. Локалността по време включва в себе си локалността по пространство, но не и обратно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Повторно обръщение към същата клетка скоро","kw":["отново","същ","дадена клетка"]},{"t":"Примери: цикли, подпрограми","kw":["цикл","подпрограм"]},{"t":"Горещи данни: броячи, стекови променливи","kw":["брояч","стеков","горещ"]},{"t":"Кешът задържа наскоро ползваните блокове / LRU","kw":["lru","задържа"]},{"t":"Включва пространствената, но не обратно","kw":["пространство"]}]}]},{"id":"L13-O-5","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Какво е локалност по пространство? Как типовете локалност влияят на организацията на кеш паметта?","src":"","solution":"Локалността по пространство (специалната локалност) означава, че когато се адресира дадена клетка, съседните клетки много вероятно също ще бъдат достъпени скоро. Примери са последователният поток от инструкции при липса на преходи и обработката на масиви, матрици и низове от началото до края. Тя се използва чрез зареждане в кеша на цели блокове, като по-голям блок я използва по-добре, но само до определен предел. Тъй като кодът проявява силна локалност по време, а данните — по-слаба, кешът се разделя на i-cache за команди и d-cache за данни.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Съседните клетки ще бъдат достъпени","kw":["съседн"]},{"t":"Примери: поток инструкции, масиви, низове","kw":["инструкции","масив","низ"]},{"t":"Използва се чрез блокове; размерът има предел","kw":["блок","предел"]},{"t":"Разделяне на i-cache и d-cache","kw":["i-cache","d-cache"]}]}]},{"id":"L13-O-6","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Кои методи на асоциативност (свързване) се използват в кеш паметта? Сравнете ги.","src":"","solution":"При пълната асоциативност всеки блок от основната памет може да се постави във всеки фрейм на кеша, но при търсене се претърсва цялата tag RAM, което при голям кеш внася голямо закъснение. При директното съответствие всеки блок може да бъде само в един определен фрейм, затова търсенето е минимално, но блоковете, които се конкурират за един фрейм, предизвикват колизии и ефективността рязко пада. n-кратната (частична) асоциативност е компромис — блокът се поставя в произволен фрейм от определена група от n фрейма (например четирикратна), което намалява и закъснението при търсене, и вероятността от колизии. Директното съответствие е еднопътна асоциативност, а пълната е n-кратна с n, равно на броя на блоковете.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Пълна асоциативност — всеки фрейм, търсене в цялата tag RAM","kw":["пълната асоциатив","tag ram"]},{"t":"Директно съответствие — един фрейм, колизии","kw":["директно","колизи"]},{"t":"n-кратна — група от n фрейма, компромис","kw":["n-кратна","компромис","група"]},{"t":"Директното = еднопътна; пълната = n = брой блокове","kw":["еднопът"]}]}]},{"id":"L13-O-7","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Кои стратегии за запис в кеш паметта познавате? Какви са предимствата и недостатъците им?","src":"","solution":"При стратегията write-back променената информация се записва само в кеша от първо ниво, а по-долните нива се обновяват едва когато блокът бъде заместен. Тя дава по-добра производителност, защото прехвърлянията към основната памет са по-редки, но копията в паметта временно не са актуални. При стратегията write-through информацията се записва едновременно във всички нива на йерархията, което е по-бавно, но улеснява поддържането на валидността на данните. Затова write-through е удобна за многопроцесорни системи и при интензивен вход/изход.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Write-back — само в L1, обновяване при заместване","kw":["write-back","заместен"]},{"t":"Write-back — по-висока производителност","kw":["производителност"]},{"t":"Write-through — във всички нива едновременно","kw":["write-through","всички нива"]},{"t":"Write-through — по-лесна валидност, многопроцесорни системи","kw":["валидност","многопроцесор"]}]}]},{"id":"L13-O-8","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Каква е стратегията за заместване на информацията в кеш паметта и защо се предпочита LRU?","src":"","solution":"Когато в кеша трябва да постъпи нов блок, а свободни фреймове няма, трябва да се реши кой съществуващ блок да бъде заместен. Простите стратегии — случаен избор, FIFO или LIFO — не отчитат локалността на обръщенията и често изхвърлят блокове, които скоро ще са нужни отново. Затова в съвременните процесори се използва LRU (Least Recently Used), при която се замества блокът, използван преди най-много време. Тя се основава на локалността по време — наскоро използваните блокове най-вероятно ще бъдат потърсени отново.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Избор кой блок да се замени при нов блок","kw":["замест"]},{"t":"Случаен, FIFO, LIFO не отчитат локалността","kw":["fifo","случаен"]},{"t":"LRU — най-отдавна използваният блок","kw":["lru","най-много време"]},{"t":"Основание: локалност по време","kw":["локалност"]}]}]},{"id":"L13-O-9","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Какво представлява проблемът за съгласуваността (кохерентността) на данните в кеш паметите при SMP системите и как се решава?","src":"","solution":"В SMP системите няколко процесора имат собствена кеш памет и споделят обща основна памет, затова едни и същи данни могат да имат копия в няколко кеша. Когато процесор промени своето копие, копията в кешовете на другите процесори стават невалидни — това е проблемът с кохерентността. Решението е апаратно „подслушване“ (snooping) на системната шина, при което всеки кеш следи транзакциите на останалите. Най-разпространен е протоколът MESI, в който всяка кешова линия е в едно от четирите състояния Modified, Exclusive, Shared или Invalid.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"SMP — собствени кешове и обща памет","kw":["smp","обща"]},{"t":"Промяна на копие обезсилва другите копия","kw":["невалид","копи"]},{"t":"Snooping на шината","kw":["snooping","подслуш"]},{"t":"Протокол MESI с 4 състояния","kw":["mesi"]}]}]},{"id":"L13-O-10","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Каква е разликата между включващата и изключващата организация на кеш паметта?","src":"","solution":"При включващата (inclusive) организация паметта от по-долно ниво съдържа и информацията от по-горните нива — L1 е подмножество на L2, а L2 на основната памет. Затова общият ефективен обем на кеша е равен на обема на последното ниво преди основната памет. При изключващата (exclusive) организация, въведена от AMD при Duron (L1 = 128 KB, L2 = 64 KB), нивата съдържат различна информация и общият обем е равен на сумата от обемите им. Цената на изключващата организация са по-сложните алгоритми за управление на кеша.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Включваща — L1 ⊂ L2 ⊂ ОП","kw":["подмножество","включва"]},{"t":"Обем = последното ниво","kw":["последното ниво"]},{"t":"Изключваща — различна информация (Duron)","kw":["изключва","duron"]},{"t":"Обем = сума; по-сложно управление","kw":["сумата","сложни"]}]}]},{"id":"L13-O-11","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Как размерът на кешовия блок влияе върху ефективността на кеш паметта?","src":"","solution":"С увеличаване на размера на блока по-добре се използва локалността по пространство, защото с един промах се зареждат повече съседни думи. Това е вярно само до определен предел — при постоянен обем на кеша по-големият блок означава по-малко блокове и по-голяма вероятност от промах. Големият блок също „замърсява“ кеша с неизползвани данни, тъй като често само няколко байта от него влизат в работното множество. Освен това той изразходва повече от ширината на лентата на шината, особено при висок процент промахи, и увеличава латентността.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"По-голям блок — по-добре пространствена локалност","kw":["пространство"]},{"t":"До предел: по-малко блокове → повече промахи","kw":["предел","по-малко блокове"]},{"t":"Замърсяване с неизползвани данни","kw":["замърсява"]},{"t":"Натоварва шината / латентност","kw":["шината","латентност"]}]}]},{"id":"L13-O-12","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Какво е латентност и пропускателна способност на паметта? Как Burst Mode увеличава ефективната пропускателна способност?","src":"","solution":"Латентността е времето от изпращането на заявката от процесора до получаването на отговора — тя включва пътя на заявката до паметта, намирането на информацията и връщането на данните, и обикновено се измерва в тактове на процесора. Пропускателната способност е количеството информация, предавано за единица време, като максималната ѝ стойност е теоретична и недостижима, защото шината се заема и за адресиране и управление. При Burst Mode с едно обръщение се предава цял блок (например 32 байта), като само първата дума изисква пълното закъснение, а следващите идват без изчакване. Така ефективната пропускателна способност нараства значително.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Латентност — от заявката до отговора","kw":["латентност","заявка"]},{"t":"Пропускателна способност — информация за единица време","kw":["пропускател","единица време"]},{"t":"Максималната е недостижима (шина за адреси/управление)","kw":["недостиж","шина"]},{"t":"Burst Mode — цял блок, само първата дума с пълно закъснение","kw":["burst","блок","първата"]}]}]},{"id":"L13-O-13","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Каква е разликата между пакетната и конвейерната обработка при разслоената памет?","src":"","solution":"При пакетната обработка паметта е разбита на N = 2^k модула, старшите разряди на адреса се подават към всички модули едновременно и се прочитат N последователни думи в буфери, откъдето следващите обръщения се обслужват N пъти по-бързо. Тя е идеална при последователен достъп, но при интервал q средното време е q·t/N за q ≤ N и t за q > N. При конвейерната обработка фиксатори на адресните шини позволяват всеки модул да има собствен адрес, а контролерът стартира заявката, ако модулът е свободен, и я задържа, ако е зает. Двата метода дават N-кратно ускорение при последователни адреси, като конвейерният го постига, ако в N поредни заявки никой модул не се ползва два пъти.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Пакетна — N последователни думи наведнъж в буфери","kw":["пакетна","буфер"]},{"t":"Време q·t/N при q ≤ N","kw":["q·t/n","интервал"]},{"t":"Конвейерна — собствен адрес на модул, контролер","kw":["конвейерна","собствен адрес","контролер"]},{"t":"N-кратно ускорение при последователни адреси","kw":["n-кратно"]}]}]},{"id":"L13-O-14","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Защо разположението на данните е важно при разслоената памет? Какви начини на разполагане познавате?","src":"","solution":"При разслоената памет паралелен достъп е възможен само ако едновременно търсените елементи са в различни модули, иначе възникват конфликти. При стандартното разположение на матрица по редове достъпът по ред и по диагонал е безконфликтен, но всички елементи на един стълб са в един модул. Скосеното разположение измества ред i с i позиции и дава безконфликтен достъп по редове и стълбове, но не и по диагоналите. Напълно безконфликтна организация се получава с повече модули от процесорите — първото просто число, по-голямо от N, както в Burroughs BSP с 512 процесора и 521 модула памет.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Конфликти при достъп до един модул","kw":["конфликт"]},{"t":"Стандартно — проблем по стълб","kw":["стълб","редове"]},{"t":"Скосено — редове и стълбове, не диагонали","kw":["скосен","диагонал"]},{"t":"Просто число модули (BSP 521)","kw":["просто число","521"]}]}]},{"id":"L13-O-15","group":"L13","lec":13,"title":"Архитектура на паметта","text":"Как се определя средното време за достъп при наличие на кеш памет и от какво зависи ефектът от кеша?","src":"","solution":"Ако p е вероятността за попадение в кеша, t_c е времето за достъп до кеша, а t_m — до основната памет, средното време за достъп е τ = p·t_c + (1 − p)·t_m. Ускорението спрямо система без кеш е S = t_m/τ = a/[p + (1 − p)·a], където a = t_m/t_c, а ефективността на кеша е E = S/a. Ефектът зависи най-силно от p, която се определя от размера на кеша и на блока, асоциативността, стратегията за заместване и локалността на програмата. При малко p кешът почти не дава ускорение, а при p, близко до 1, средното време се доближава до времето на кеша.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"τ = p·t_c + (1 − p)·t_m","kw":["τ = p","p·t_c"]},{"t":"Ускорение S и a = t_m/t_c","kw":["s = t_m","a = t_m"]},{"t":"Ефективност E = S/a","kw":["e = s/a","ефективност"]},{"t":"p зависи от размер, асоциативност, локалност","kw":["асоциатив","локалност"]}]}]},{"id":"L14-O-1","group":"L14","lec":14,"title":"Дискова памет","text":"От какво зависи обслужването на една заявка, отправена към диска?","src":"","solution":"Обслужването на заявка към диска зависи от три основни компонента. Първият е времето за достъп (seek time) — позициониране на главите над търсената пътечка, което зависи от ускорението при старт и броя пресечени пътечки. Вторият е времето за изчакване (rotational latency) — докато търсеният сектор се завърти под главата, средно половин оборот (≈ 4 ms при 7 200 об/мин). Третият е времето за предаване на данните, което зависи от броя на байтовете, като при малки блокове то е малка част от общото време.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Три компонента","kw":["три"]},{"t":"Seek time — позициониране на пътечка","kw":["seek","пътечка","позицион"]},{"t":"Rotational latency — половин оборот, об/мин","kw":["оборот","изчакване"]},{"t":"Време за предаване — брой байтове","kw":["предаване","байт"]}]}]},{"id":"L14-O-2","group":"L14","lec":14,"title":"Дискова памет","text":"Какви метрики се използват за оценка на дисковата подсистема при дадено работно натоварване? Какви са изискванията на суперкомпютрите и на транзакционните системи?","src":"","solution":"За дадено работно натоварване се използват три метрики: производителност (брой обслужени заявки за единица време), време за изчакване (време за обслужване на една заявка) и пропускателна способност (количество предадени данни за единица време). Суперкомпютрите работят с големи последователни масиви и изискват висока пропускателна способност и малко латентно. Транзакционните системи обработват много кратки случайни заявки и изискват висока производителност при умерено латентно. При тях доминират времената за позициониране и изчакване, затова те не са чувствителни към намаляването на времето за предаване.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Производителност — заявки за единица време","kw":["производителност","заявки"]},{"t":"Латентност / време за изчакване","kw":["изчакване","латентно"]},{"t":"Пропускателна способност — данни за единица време","kw":["пропускател"]},{"t":"Суперкомпютри — последователни масиви, висока пропускателност","kw":["суперкомпют","последовател"]},{"t":"Транзакционни — кратки случайни заявки","kw":["транзакцион","кратки"]}]}]},{"id":"L14-O-3","group":"L14","lec":14,"title":"Дискова памет","text":"Защо времето за обработка на транзакции не се влияе съществено от намаляване на времето за предаване, а при научните задачи всяко подобрение на технологията е ефективно?","src":"","solution":"Транзакционните системи обработват голям брой малки, случайно разположени заявки, затова за всяка заявка основното време отива за позициониране на главите и изчакване на сектора, а времето за предаване е пренебрежимо. Дори двойно по-бърз канал би съкратил общото време с няколко процента, докато по-бързото въртене или по-малкото позициониране имат реален ефект. При научните задачи данните са големи последователни масиви — позиционирането и изчакването се плащат веднъж, а доминира времето за предаване. Затова всяко повишаване на скоростта на предаване (плътност на записа, по-широк канал) намалява почти пропорционално общото време.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Транзакции — малки случайни заявки","kw":["малки","случайн"]},{"t":"Доминират позициониране и изчакване","kw":["позициониране","изчакване"]},{"t":"Научни задачи — големи последователни масиви","kw":["последовател","научни"]},{"t":"Доминира предаването → технологичното подобрение помага","kw":["доминира","пропорционално"]}]}]},{"id":"L14-O-4","group":"L14","lec":14,"title":"Дискова памет","text":"Какво представляват дисковите матрици? Какви са техните предимства и основен недостатък?","src":"","solution":"Дисковата матрица (disk array) обединява няколко физически диска, които работят като един логически диск, използвайки паралелизъм — идея на Patterson, Gibson и Katz от Бъркли (1987). Предимствата са, че пропускателната способност на много дискове обслужва една голяма заявка или паралелно множество независими заявки, а матрицата се изгражда от евтини масови дискове. Основният недостатък е надеждността — при независими откази MTTF на матрицата е равно на MTTF на един диск, разделено на броя на дисковете. Затова се въвежда излишна информация за сметка на капацитет или пропускателност, откъдето идва наименованието RAID.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Няколко диска като един логически","kw":["логически","физически"]},{"t":"Паралелно обслужване на една или много заявки","kw":["паралел","заявк"]},{"t":"Евтини масови дискове","kw":["евтин"]},{"t":"Недостатък: MTTF / брой дискове","kw":["mttf","надеждност"]},{"t":"Излишна информация → RAID","kw":["излиш","raid"]}]}]},{"id":"L14-O-5","group":"L14","lec":14,"title":"Дискова памет","text":"Какви са характерните особености на RAID 0 и RAID 1?","src":"","solution":"RAID 0 разделя данните (striping) по битове или блокове върху няколко диска без никаква излишна информация. Той дава най-висока производителност и 100 % използване на капацитета, но отказът на един диск води до загуба на всички данни. RAID 1 използва огледални дискове (mirroring) — всеки запис се дублира и 50 % от дисковете съхраняват копие, което дава отлична надеждност и добро четене, но само половината капацитет. При RAID 1 с един контролер производителността при запис намалява наполовина, затова се използва и вариант с два контролера (дублиране).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"RAID 0 — striping без излишък","kw":["striping","разделя"]},{"t":"RAID 0 — максимална производителност, нулева защита","kw":["производителност","загуба"]},{"t":"RAID 1 — огледални дискове","kw":["огледал","mirroring"]},{"t":"RAID 1 — 50 % капацитет, отлична надеждност","kw":["50 %","надеждност"]}]}]},{"id":"L14-O-6","group":"L14","lec":14,"title":"Дискова памет","text":"Сравнете RAID 3, RAID 4 и RAID 5.","src":"","solution":"RAID 3 разслоява данните по байтове върху група дискове и съхранява XOR четността в един контролен диск, което дава четене като при RAID 0 и е подходящо за суперкомпютри. RAID 4 е подобен, но разслоението е по блокове (сектори), а новата четност се изчислява като (стари данни ⊕ нови данни) ⊕ стара четност. И при двете единственият контролен диск е тясно място, защото участва във всеки запис. RAID 5 разпределя четността равномерно между всички дискове, премахва тясното място и позволява паралелни записи, затова дава добра производителност и при четене, и при запис.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"RAID 3 — по байтове, 1 диск четност","kw":["байт"]},{"t":"RAID 4 — по блокове, 1 диск четност","kw":["блок"]},{"t":"Тясно място — единственият контролен диск","kw":["тясно място","контролен диск"]},{"t":"RAID 5 — разпределена четност","kw":["разпредел"]},{"t":"Изчисляване на новата четност / XOR","kw":["⊕","xor"]}]}]},{"id":"L14-O-7","group":"L14","lec":14,"title":"Дискова памет","text":"Какви са особеностите на RAID 6 и RAID 7?","src":"","solution":"RAID 6 организира матрицата като двумерен масив с контрол по четност едновременно по редове и по стълбове — с двойна разпределена четност. Това позволява коригиране на отказ на произволни два диска, но при всеки логически запис се правят шест обръщения към дисковете. Затова RAID 6 е подходящ за приложения с изключително високи изисквания за надеждност, но не и за транзакционни системи или суперкомпютри. RAID 7 е търговски термин на Storage Computer Corporation, а не отворен стандарт — базира се на RAID 3 и 4, добавя голяма многонивова кеш памет и процесор в реално време и дава висока производителност и надеждност на висока цена.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"RAID 6 — двойна четност (редове и стълбове)","kw":["двойна","редове"]},{"t":"RAID 6 — понася 2 отказа","kw":["два диска"]},{"t":"RAID 6 — 6 обръщения на запис","kw":["шест обръщения"]},{"t":"RAID 7 — нестандартен, кеширан, скъп","kw":["кеш","стандарт"]}]}]},{"id":"L14-O-8","group":"L14","lec":14,"title":"Дискова памет","text":"Какво представляват съставните RAID нива? Сравнете RAID 0+1 и RAID 1+0.","src":"","solution":"Съставните RAID нива комбинират две основни нива, за да обединят техните предимства — най-често разделянето на данните (RAID 0) и огледалните дискове (RAID 1). RAID 0+1 е огледало на два набора с разделяне: едната група съхранява оригиналните данни на ивици, а другата е нейно огледално копие. RAID 1+0 (RAID 10) разделя данните върху множество огледални двойки и изисква минимум четири диска. RAID 10 осигурява по-добра отказоустойчивост и по-лесно възстановяване от RAID 0+1, като и двете използват 50 % от капацитета.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Комбинират основни нива","kw":["комбинира","съставн"]},{"t":"RAID 0+1 — огледало на два striped набора","kw":["0+1"]},{"t":"RAID 10 — striping върху огледални двойки, мин. 4 диска","kw":["огледални двойки","четири"]},{"t":"RAID 10 по-надежден, 50 % капацитет","kw":["по-добра","50 %"]}]}]},{"id":"L14-O-9","group":"L14","lec":14,"title":"Дискова памет","text":"Каква е разликата между програмната и апаратната реализация на RAID?","src":"","solution":"Програмната реализация на RAID е по-евтина и е подходяща за малки системи, но цялата конфигурационна тежест е върху системния администратор. При нея понякога не могат да се реализират напълно предимствата на дадено ниво. Апаратната реализация е по-скъпа, но предлага горещо подменяне на дефектирал диск без спиране на работата, по-богата провер
