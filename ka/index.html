ка за грешки и конфигурационен контрол, който предпазва от грешки на администратора. Почти всички апаратни RAID системи поддържат RAID 0, 1, 0+1 и 5 и са за предпочитане при критични приложения.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Програмна — евтина, за малки системи","kw":["евтин","малки"]},{"t":"Програмна — тежест върху администратора","kw":["администратор"]},{"t":"Апаратна — горещо подменяне","kw":["горещо"]},{"t":"Апаратна — проверка на грешки, по-скъпа","kw":["грешки","скъп"]}]}]},{"id":"L14-O-10","group":"L14","lec":14,"title":"Дискова памет","text":"Каква е архитектурата на контролерите при дисковите матрици?","src":"","solution":"Пътят между процесора и дисковете включва три основни компонента. Адаптерът на шината (HBA) управлява интерфейса между компютъра и дисковата матрица, обикновено с директен достъп до паметта (DMA). Контролерът на матрицата осигурява интерфейса с дисковите контролери, съдържа буфери и схеми за изчисляване на четността и реализира съответствието между логически и физически сектори. Контролерът на диска управлява физическото ниво, отговаря за ECC и съдържа буфер за пътечката, а за максимална отказоустойчивост цялото оборудване на контролерите и връзките се дублира.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"HBA — интерфейс с компютъра, DMA","kw":["hba","dma"]},{"t":"Контролер на матрицата — четност, логически ↔ физически сектори","kw":["контролерът на матрицата","четност"]},{"t":"Контролер на диска — ECC, буфер за пътечката","kw":["ecc","пътечка"]},{"t":"Дублиране за отказоустойчивост","kw":["дублира"]}]}]},{"id":"L14-O-11","group":"L14","lec":14,"title":"Дискова памет","text":"Каква е архитектурата на дисковата памет в паралелните компютри с разпределена памет?","src":"","solution":"При компютрите с разпределена памет се изгражда разпределена входно-изходна подсистема от независими входно-изходни възли, всеки от които поддържа един или повече дискове и е част от разпределен файлов сървър. При силно свързаната система всеки изчислителен процесор има собствени дискове, което дава малко латентно и висока обща ширина на лентата (IBM LCAP). При слабо свързаната система входно-изходните възли са по периферията (Intel Touchstone Delta) или вътре в изчислителната матрица (Intel Paragon), което увеличава латентното и намалява лентата. Основни проблеми са мащабируемата производителност, балансираното натоварване, увеличеният комуникационен трафик и ограничената ширина на лентата на каналите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Разпределена В/И подсистема от В/И възли","kw":["входно-изходни възли","разпределен"]},{"t":"Силно свързана — собствени дискове, малко латентно","kw":["силно свързан"]},{"t":"Слабо свързана — възли по периферията/вътре","kw":["слабо свързан","периферия"]},{"t":"Проблеми: мащабируемост, баланс, трафик, лента","kw":["мащабир","баланс","трафик"]}]}]},{"id":"L14-O-12","group":"L14","lec":14,"title":"Дискова памет","text":"Защо архитектурата на дисковата памет е важна за общата производителност на компютъра?","src":"","solution":"Дисковата памет е основният носител на вторичната памет и е най-бавното ниво на йерархията на паметта. Разликата в производителността между процесора и диска непрекъснато расте, защото производителността на процесорите нараства много по-бързо от плътността на записа и механичните характеристики на дисковете. Затова дисковата подсистема се превръща в ограничаващ фактор и нейното усъвършенстване е не по-малко важно от това на процесора. Освен технологичните подобрения се използва и архитектурният подход — паралелизъм чрез дискови матрици (RAID), буфери, кеширане и съвместяване на позиционирането.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Най-бавно ниво на йерархията / вторична памет","kw":["вторична","йерарх"]},{"t":"Разликата с процесора расте","kw":["расте","разликата"]},{"t":"Ограничаващ фактор","kw":["ограничаващ"]},{"t":"Архитектурен подход — RAID, паралелизъм","kw":["raid","паралелизъм"]}]}]},{"id":"L15-O-1","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво се разбира под понятието „Производителност на компютъра“? От кои параметри зависи производителността? Обяснете защо всеки от посочените от Вас параметри е важен при нейното определяне.","src":"Изпит — вариант 1, въпрос 10","solution":"Производителността на компютъра е количеството извършена работа (изпълнени програми) за единица време и е сложна нелинейна функция от много параметри — индекси на производителността. Тя зависи от времето за изпълнение на командите (тактова честота и брой тактове за команда), което определя колко команди се изпълняват за секунда, и от логическите възможности на системата команди и структурата на процесора (регистри, формат на данните), които определят колко работа върши една команда. Зависи също от паметта — структура, обем и време за достъп, защото около четвърт от командите се обръщат към паметта, и от пропускателната способност на входно-изходните канали, които ограничават задачите с големи обеми данни. Не на последно място влияят операционната система (планиране и режийни разходи), типът на задачите и стилът на програмиране и компилаторът, затова една и съща машина показва различна производителност при различни програми.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Определение: работа за единица време","kw":["единица време","работа"]},{"t":"Тактова честота и тактове за команда","kw":["тактов"]},{"t":"Система команди и структура на процесора","kw":["система команди","структура"]},{"t":"Памет: обем и време за достъп","kw":["памет"]},{"t":"В/И канали, ОС, тип задачи/програмиране","kw":["входно-изходни","операционна","програмиране"]}]}]},{"id":"L15-O-2","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво представлява аналитичният модел? Какви са неговите недостатъци?","src":"Контролна — тест 3, въпрос 1","solution":"Аналитичният модел е математическо представяне на изчислителната система чрез формули и уравнения, които свързват производителността с параметрите на компонентите. Той бива детерминиран (машини на Тюринг, мрежи на Петри, модела на Марини) или вероятностен (теория на масовото обслужване, марковски процеси), а главното му предимство е бързата оценка кой компонент с колко влияе. Недостатъците му са сравнително голямата грешка (около 10 %), силните опростяващи допускания и трудното описание на сложни динамични системи. Детерминираните модели трудно отразяват промените в работното натоварване, а вероятностните трудно представят реда на поява на задачите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Математическо представяне — формули","kw":["математическ","формули"]},{"t":"Детерминирани и вероятностни","kw":["детерминиран","вероятност"]},{"t":"Грешка ~10 %","kw":["10 %","грешка"]},{"t":"Опростяващи допускания","kw":["допускания","опростява"]},{"t":"Трудно отразяват натоварването / реда на задачите","kw":["натоварване","реда"]}]}]},{"id":"L15-O-3","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Сравнете аналитичните и имитационните модели като две средства за определяне на производителност. Кой модел бихте предпочели Вие и защо?","src":"Контролна — тест 5, въпрос 1","solution":"Аналитичният модел е математическо описание на системата (формули, теория на опашките, марковски процеси), което дава бърза и евтина оценка и ясно показва влиянието на всеки компонент, но е с грешка около 10 % заради опростяващите допускания. Имитационният модел е програма на алгоритмичен език (C, GPSS, SIMSCRIPT) с дискретно моделно време, която се разработва на три етапа — концептуален модел, разработка и моделиране с компютър, и постига точност 2–3 %. Цената на имитационния модел е дългата разработка, сложната верификация и нуждата от мощен компютър. Бих предпочел комбинация — аналитичен модел в началото на проектирането за бърз избор между вариантите, а имитационен модел за точна оценка на избрания вариант, тъй като двата метода се допълват.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Аналитичен — математически, бърз","kw":["математическ","бърз"]},{"t":"Аналитичен — грешка ~10 %","kw":["10 %"]},{"t":"Имитационен — програма, етапи, 2–3 %","kw":["програма","2–3 %"]},{"t":"Имитационен — дълга разработка, мощен компютър","kw":["разработка","мощен"]},{"t":"Аргументиран избор","kw":["предпочел","комбинация"]}]}]},{"id":"L15-O-4","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Кои методи на измерването се използват за определяне на производителността? Опишете накратко всеки от тях.","src":"","solution":"Методите на измерването се прилагат, когато компютърът е произведен и достъпен. Елементарните времена изразяват производителността в MIPS от времето за изпълнение на основна операция и дават само пиковата производителност, а командните смеси изчисляват средно време с тегловни коефициенти P = 1/Σ(kᵢ·tᵢ), като смесът на Гибсън. Образцовите програми изчисляват „на хартия“ времето на типична програма, а измервателните програми се изпълняват реално на компютъра и времето се мери със системния таймер. Синтетичните програми (Whetstone, Dhrystone, LINPACK, SPEC) са специално съставени за проверка на конкретни способности и заедно с измервателните се наричат benchmark програми.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Елементарни времена — MIPS, пикова","kw":["елементарни","пиков"]},{"t":"Командни смеси — тегловни коефициенти","kw":["смеси","тегловни"]},{"t":"Образцови програми — „на хартия“","kw":["образцов","хартия"]},{"t":"Измервателни програми — системен таймер","kw":["измервателни","таймер"]},{"t":"Синтетични / benchmark","kw":["синтетични","benchmark"]}]}]},{"id":"L15-O-5","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво представлява методът на елементарните времена? Какви са неговите предимства и недостатъци?","src":"","solution":"Методът на елементарните времена е исторически първият (от началото на 50-те години) и изразява производителността в MIPS въз основа на времето за изпълнение на основна операция, например целочислено събиране. За него е нужно само да се знаят тактовата честота и броят тактове за команда — при 1 GHz и 2 такта на команда производителността е 500 MIPS, а при паралелни устройства пиковата производителност е сумата от техните производителности. Предимството му е простотата. Недостатъците са, че не отчита програмното осигуряване, влиянието на конвейера и формата на данните и дава само пиковата (теоретична) производителност, която на практика никога не се достига.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"MIPS от времето на основна операция","kw":["mips","основна операция"]},{"t":"Тактова честота и брой тактове","kw":["тактова","такта"]},{"t":"Предимство: простота","kw":["простота"]},{"t":"Не отчита софтуер, конвейер, формат","kw":["програмното","конвейер"]},{"t":"Само пикова производителност","kw":["пикова"]}]}]},{"id":"L15-O-6","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какви грешки съпътстват измервателните програми и какви са подходите за тяхното намаляване?","src":"","solution":"При измервателните програми времето се мери със системния таймер, който се обновява на фиксирани интервали, затова началото и краят на измерването попадат в случайни моменти спрямо тиковете му. Ако програмата трае малко в сравнение с периода на таймера, грешката става сравнима с измерваното време. Грешката се намалява, като тестовата програма обработва големи масиви от данни или като изчисленията се повтарят многократно в цикъл и общото време се разделя на броя повторения. Така измерваното време става многократно по-голямо от периода на таймера и относителната грешка намалява.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Системен таймер с фиксирани интервали","kw":["таймер","интервал"]},{"t":"Грешка от дискретността при кратки програми","kw":["грешка"]},{"t":"Големи масиви от данни","kw":["масиви"]},{"t":"Многократно повтаряне в цикъл","kw":["многократно","цикъл"]}]}]},{"id":"L15-O-7","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво представляват синтетичните програми (benchmarks)? Дайте примери.","src":"","solution":"Синтетичните програми съвместяват чертите на образцовите и на измервателните програми — те са специално съставени за изпитване на конкретни способности на компютъра и се изпълняват реално със системен таймер. Затова грешката им е от същия характер като при измервателните програми. Класически примери са Whetstone и Dhrystone, а LINPACK решава плътни системи линейни уравнения и е основа на класацията Top500. Други примери са Livermore Fortran Kernels (24 ядра на научни приложения), NAS Parallel Benchmarks и SPEC.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Специално съставени за конкретни способности","kw":["специално съставени","способности"]},{"t":"Системен таймер, същата грешка","kw":["таймер","грешка"]},{"t":"Whetstone, Dhrystone","kw":["whetstone","dhrystone"]},{"t":"LINPACK — Top500","kw":["linpack","top500"]}]}]},{"id":"L15-O-8","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво представлява имитационният модел и какви са етапите на имитационното моделиране?","src":"","solution":"Имитационният модел е програма, която описва изследваната система на алгоритмичен език — нейните елементи, структурата на връзките и функциите им. Първият етап е концептуалният модел — абстрактно описание на причинно-следствените връзки, с което се определят идеята, методиката и програмните средства. Вторият етап е разработката на самия имитационен модел с точно дефинирани параметри и критерии за ефективност, завършваща с контролни изпитания, а третият е моделирането с компютър — планиране на експериментите и събиране на статистика. Моделното време е дискретно и се променя само при настъпване на събития, а за реализация се използват универсални езици (C, C++) или специализирани (GPSS, SIMSCRIPT).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Програма на алгоритмичен език","kw":["програма","алгоритмичен"]},{"t":"Концептуален модел","kw":["концептуал"]},{"t":"Разработка с параметри и критерии","kw":["разработка"]},{"t":"Моделиране с компютър и статистика","kw":["статистика"]},{"t":"Дискретно моделно време / GPSS","kw":["дискретно","gpss"]}]}]},{"id":"L15-O-9","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Как се извършва апробацията на един модел? Какви грешки съпътстват моделирането?","src":"","solution":"Основният въпрос при моделирането е доколко добре моделът представя реалната система — той се счита за достатъчно точен, ако стойностите на неговите индекси се отличават от реалните с по-малко от максималната допустима грешка. При съществуваща система проверката става чрез сравнение с измервания, а при несъществуваща моделируемата система всъщност е концептуалният модел и проверката е като верификация на програма. Процедурата на повтаряне на проверката и корекцията до достигане на необходимата точност се нарича калибровка. Грешките при моделирането са от формулировката на модела, от решението му и от задаването на параметрите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Критерий: грешка под максимално допустимата","kw":["допустима"]},{"t":"Сравнение с реалната система / верификация","kw":["верификация","сравнение"]},{"t":"Калибровка","kw":["калибровка"]},{"t":"Грешки: формулировка, решение, параметри","kw":["формулировка","параметри"]}]}]},{"id":"L15-O-10","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво е ефективност на компютъра? Как се определя и от какво зависи?","src":"","solution":"Ефективността е отношението между реалната и пиковата производителност, E = Pреална / Pпикова, и винаги е по-малка от 1. Пиковата производителност се получава от елементарните времена и никога не се достига, а реалната — от измервателни програми при решаване на конкретни задачи. При големи задачи E > 0,5 се счита за добър резултат, а при ниска ефективност се изследват аритметично-логическото устройство, паметта, комуникационната среда, компилаторът и операционната система. При паралелните компютри ефективността зависи силно от задачата и алгоритъма и е толкова по-близо до 1, колкото по-дълго независимите устройства работят паралелно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"E = реална / пикова","kw":["реалната","пиковата"]},{"t":"Пикова от елементарни времена, реална от измерване","kw":["елементарните","измервателни"]},{"t":"E > 0,5 е добре","kw":["0,5"]},{"t":"Причини за ниска E: памет, комуникация, компилатор, ОС","kw":["компилатор","памет"]},{"t":"Паралелни — зависи от задачата и алгоритъма","kw":["паралел","алгоритъм"]}]}]},{"id":"L15-O-11","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Каква е разликата между клиентската и системната производителност? Какво са индексите на производителността?","src":"","solution":"Клиентската (потребителска) производителност се постига при решаване на отделна задача, на която е даден приоритетен достъп до ресурсите на системата. Системната производителност се постига при едновременно решаване на съвкупност от задачи, които се конкурират за ресурсите, и отразява пропускателната способност на системата. Отделните параметри, от които зависи производителността, се наричат индекси на производителността — те са количествени (скорост на операциите, обем на паметта) и качествени (структурност на програмата, качество на компилатора). Според приоритета си за дадена система индексите са първични или вторични — скоростта е първична за суперкомпютрите и вторична за преносимите компютри.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Клиентска — една задача с приоритет","kw":["клиентск","приоритет"]},{"t":"Системна — много задачи едновременно","kw":["системна","едновременно"]},{"t":"Индекси: количествени и качествени","kw":["количествени","качествени"]},{"t":"Първични и вторични","kw":["първични","вторични"]}]}]},{"id":"L15-O-12","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Каква е разликата между детерминираните и вероятностните аналитични модели?","src":"","solution":"Детерминираните аналитични модели описват системата с точни зависимости без случайни величини — примери са машините на Тюринг, мрежите на Петри, графичните модели на програмите и моделът на Марини. Те са полезни за извеждане на формули от първо приближение, но трудно отразяват промените в работното натоварване. Вероятностните модели се основават на теорията на масовото обслужване (опашки) и на марковски или полумарковски процеси и по-естествено отразяват изменчивото натоварване. Техен недостатък е, че трудно представят реда на поява на задачите, а решаването им за сложни системи изисква значителни математически усилия.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Детерминирани — без случайност; Тюринг, Петри","kw":["детерминиран","петри"]},{"t":"Детерминирани — първо приближение, трудно отразяват натоварването","kw":["първо приближение"]},{"t":"Вероятностни — опашки, марковски процеси","kw":["масовото обслужване","марковски"]},{"t":"Вероятностни — трудно представят реда на задачите","kw":["реда на поява"]}]}]},{"id":"L15-O-13","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво е командна смес и как се определя производителността чрез нея?","src":"","solution":"Командната смес определя средното време за изпълнение на команда, като времето tᵢ на всеки тип команда се умножава по тегловен коефициент kᵢ, равен на относителната честота на този тип при решаване на широк клас задачи. Производителността се изчислява по формулата P = 1/Σ(kᵢ·tᵢ), а известен стандарт за научно-технически задачи е командната смес на Гибсън (k = 0,33 за събиране с фиксирана запетая). Предимството пред елементарните времена е, че в неявен вид се отчита програмното осигуряване. Недостатъкът е, че определянето на тегловните коефициенти е субективно и те са валидни само за класа задачи, от който са получени.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Тегловни коефициенти = честота на командите","kw":["тегловен","честота"]},{"t":"P = 1/Σ(kᵢ·tᵢ)","kw":["σ(kᵢ·tᵢ)"]},{"t":"Смес на Гибсън","kw":["гибсън"]},{"t":"Неявно отчита софтуера","kw":["програмното осигуряване"]},{"t":"Субективни коефициенти","kw":["субективно"]}]}]},{"id":"L15-O-14","group":"L15","lec":15,"title":"Производителност на компютъра","text":"Какво е експлоатационна ефективност и какво гласи законът на Грош?","src":"","solution":"Експлоатационната ефективност оценява производителността спрямо разходите и се изразява като E = P/(Cком + Cекс), където Cком е цената на компютъра, а Cекс — експлоатационните разходи. Опростено E ≈ P/Cком, тоест това е себестойността на единица MFLOPS, а наградата Gordon Bell Prize отличава компютъра с най-добро отношение цена/производителност. Законът на Грош гласи, че между цената и производителността има квадратична зависимост — в записа на учебника Cком = f(P)². Тази зависимост е валидна вътре в отделните класове компютри, а не между тях.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"E = P / (Cком + Cекс)","kw":["cком","разход"]},{"t":"Цена на единица MFLOPS","kw":["mflops"]},{"t":"Gordon Bell Prize","kw":["gordon bell"]},{"t":"Грош: квадратична зависимост цена–производителност, в рамките на клас","kw":["грош","квадратична"]}]}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const C = DATA.course; // pfx, tag, name, lecWord, secPerQ, secPerTask, exam {q, ptsQ, tasks, ptsTask, minutes}
const app = document.getElementById('app');
const LETTERS = 'abcd';
const SEC_PER_Q = C.secPerQ;
const SEC_PER_TASK = C.secPerTask || 600;
const EX = C.exam;
const TASKS = DATA.tasks || [];
const GROUPS = DATA.taskGroups || [];
const TASK_WORD = C.taskWord || 'Задача';          // как се казва писменият елемент
const TASKS_TITLE = C.tasksTitle || 'Писмени задачи';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const ALL = [];
for (const l of DATA.lectures) for (const t of l.testNames) for (const q of l.tests[t]) ALL.push(Object.assign({ lec: l.num, test: t }, q));
const SAMPLE = (DATA.sample || []).map((q, i) => Object.assign({ lec: 0, test: 'S', id: 'S-' + (i + 1), n: i + 1 }, q));
const BY_ID = {};
for (const q of ALL.concat(SAMPLE)) BY_ID[q.id] = q;
for (const t of TASKS) BY_ID[t.id] = Object.assign({ isTask: true }, t);

const PFX = C.pfx; // префикс на ключовете в localStorage
let settings = store.get(PFX + '-settings', { instant: false, shuffle: false, forward: false });
let mistakes = new Set(store.get(PFX + '-mistakes', []));
let best = store.get(PFX + '-best', {});
let theme = store.get(PFX + '-theme', 'auto');
let hist = store.get(PFX + '-history', []);
if (!Array.isArray(hist)) hist = [];
let userName = store.get(PFX + '-name', null);
let editName = false;
applyTheme();

let Q = null, timerId = null;

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// course.json "subscripts": true → X_L, U_{ab} се показват като индекс (X<sub>L</sub>)
const subs = s => C.subscripts ? s.replace(/([A-Za-zА-яΣΦΨΔωφψ])_(?:\{([^}]+)\}|([0-9A-Za-zА-я]+))/g, (m, a, b, c) => `${a}<sub>${b || c}</sub>`) : s;
const inl = s => subs(esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
const md = s => window.marked ? marked.parse(subs(s)) : `<pre style="white-space:pre-wrap">${subs(esc(s))}</pre>`;
const num2 = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const ptsTxt = n => String(Math.round(n * 10) / 10).replace('.', ',');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lecName(n) { if (!n) return 'Примерен тест'; const l = DATA.lectures.find(x => x.num === n); return C.lecWord + ' ' + n + ' — ' + l.short; }
function groupOf(key) { return GROUPS.find(g => g.key === key); }
function itemTag(q) {
  if (!q.isTask) return esc(lecName(q.lec));
  const g = groupOf(q.group);
  return `${TASK_WORD} · ${esc(g.title)}${g.title.startsWith(C.lecWord) ? '' : ` · ${C.lecWord} ${q.lec}`}${q.src ? ` · <span class="badge half">${esc(q.src)}</span>` : ''}`;
}
function render(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h + ':' + pad(m) + ':' + pad(s); }

function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
const THEME_LABEL = { auto: '◐ Тема: авто', light: '☀ Тема: светла', dark: '☾ Тема: тъмна' };

function badge(key) {
  const b = best[key];
  if (!b) return '';
  const cls = b.s / b.t >= 0.9 ? 'good' : (b.s / b.t < 0.6 ? 'bad' : '');
  return `<span class="badge ${cls}">${ptsTxt(b.s)}/${b.t}</span>`;
}

/* ---------- Проверка на писмените задачи ---------- */
// кирилски букви, които изглеждат като латински (А, В, С, Е, Д→D)
const LOOK = { 'А': 'A', 'В': 'B', 'С': 'C', 'Е': 'E', 'Д': 'D', 'а': 'A', 'в': 'B', 'с': 'C', 'е': 'E', 'д': 'D' };
const latin = s => String(s).replace(/[АВСЕДавсед]/g, c => LOOK[c]);

function normNum(s) {
  s = latin(s).toUpperCase().replace(/\((2|3|8|10|16|BCD)\)|BCD|[₀-₉]+$/g, '').replace(/[\s_|]/g, '').replace(',', '.').replace(/^\+/, '');
  let [i, f] = s.split('.');
  i = (i || '').replace(/^0+(?=.)/, '') || '0';
  f = (f || '').replace(/0+$/, '');
  return f ? i + '.' + f : i;
}
const normCode = s => latin(s).toUpperCase().replace(/[\s|.,_]/g, '');
const parseSet = s => [...new Set((String(s).match(/\d+/g) || []).map(Number))].sort((a, b) => a - b);

// логически израз: отрицание ' ! ¬ ~ или черта (U+0305); И: · . * & ∧ или нищо; ИЛИ: + | ∨
function parseBool(src, vars) {
  const s = latin(src).replace(/̅/g, "'");
  let p = 0, lits = 0;
  const peek = () => { while (p < s.length && /\s/.test(s[p])) p++; return s[p]; };
  const startsUnary = c => c !== undefined && (/[A-Za-z01(!¬~]/.test(c));
  function or() {
    let a = and();
    while (/[+|∨]/.test(peek() || '')) { p++; const l = a, r = and(); a = e => l(e) || r(e); }
    return a;
  }
  function and() {
    let a = unary();
    for (;;) {
      const c = peek();
      if (c !== undefined && /[·.*&∧⋅]/.test(c)) { p++; const l = a, r = unary(); a = e => l(e) && r(e); }
      else if (startsUnary(c)) { const l = a, r = unary(); a = e => l(e) && r(e); }
      else return a;
    }
  }
  function unary() {
    const c = peek();
    if (c !== undefined && /[!¬~]/.test(c)) { p++; const x = unary(); return e => !x(e); }
    let a = atom();
    while (/['’′`]/.test(peek() || '')) { p++; const x = a; a = e => !x(e); }
    return a;
  }
  function atom() {
    const c = peek();
    if (c === undefined) throw new Error('изразът е непълен');
    if (c === '(') { p++; const x = or(); if (peek() !== ')') throw new Error('липсва „)“'); p++; return x; }
    if (c === '0' || c === '1') { p++; const v = c === '1'; return () => v; }
    const u = c.toUpperCase(), k = vars.indexOf(u);
    if (k < 0) throw new Error(`непозната променлива „${c}“ (позволени: ${vars.join(', ')})`);
    p++; lits++;
    return e => e[k];
  }
  if (!s.trim()) throw new Error('празно');
  const f = or();
  if (peek() !== undefined) throw new Error(`неочакван знак „${s[p]}“`);
  return { f, lits };
}

// оценка на едно поле: { credit: 0 | 0.5 | 1, note }
function checkField(fd, val) {
  val = val == null ? '' : String(val);
  if (!val.trim()) return { credit: 0, note: 'няма отговор' };
  if (fd.type === 'num') return normNum(val) === normNum(fd.answer) ? { credit: 1 } : { credit: 0 };
  if (fd.type === 'code') return normCode(val) === normCode(fd.answer) ? { credit: 1 } : { credit: 0 };
  if (fd.type === 'real') {
    const x = parseFloat(latin(val).replace(',', '.').replace(/[^0-9eE+\-.]/g, ''));
    if (isNaN(x)) return { credit: 0, note: 'не е число' };
    const tol = Math.max(fd.abs || 0.011, Math.abs(fd.answer) * (fd.tol || 0.01));
    return Math.abs(x - fd.answer) <= tol ? { credit: 1 } : { credit: 0 };
  }
  if (fd.type === 'essay') {
    const t = val.toLowerCase(); // без latin(): тук кирилицата трябва да остане кирилица
    const hit = fd.points.map(pt => pt.kw.some(k => t.includes(k.toLowerCase())));
    const n = hit.filter(Boolean).length;
    return { credit: n / fd.points.length, hit, note: `засегнати ключови моменти: ${n} от ${fd.points.length}` };
  }
  if (fd.type === 'set') { const a = parseSet(val), b = fd.answer; return a.length === b.length && a.every((x, i) => x === b[i]) ? { credit: 1 } : { credit: 0 }; }
  if (fd.type === 'bool') {
    let r;
    try { r = parseBool(val, fd.vars); } catch (e) { return { credit: 0, note: 'не мога да прочета израза: ' + e.message }; }
    const n = fd.vars.length, ones = new Set(fd.ones);
    for (let i = 0; i < (1 << n); i++) {
      const env = fd.vars.map((_, k) => !!((i >> (n - 1 - k)) & 1));
      if (!!r.f(env) !== ones.has(i)) return { credit: 0, note: `не е еквивалентен — различава се при набор ${i}` };
    }
    return r.lits <= fd.lits ? { credit: 1, note: 'еквивалентен и минимален' }
      : { credit: 0.5, note: `еквивалентен, но не минимален (${r.lits} литерала, минимумът е ${fd.lits})` };
  }
  return { credit: 0 };
}
function fieldAnswer(fd) {
  if (fd.type === 'set') return fd.answer.join(', ');
  if (fd.type === 'bool' || fd.type === 'essay') return '';
  if (fd.type === 'real') return String(fd.shown || fd.answer).replace('.', ',');
  return fd.answer;
}
const isEssay = t => t.fields.every(fd => fd.type === 'essay');
function pointsList(fd, m) {
  return `<ul class="kp">${fd.points.map((pt, k) => `<li class="${m && m.hit ? (m.hit[k] ? 'y' : 'n') : ''}">${m && m.hit ? (m.hit[k] ? '✓ ' : '✗ ') : ''}${inl(pt.t)}</li>`).join('')}</ul>`;
}
function autoTask(t, a) {
  const marks = t.fields.map((fd, k) => checkField(fd, a && a.f ? a.f[k] : ''));
  const sum = marks.reduce((s, m) => s + m.credit, 0);
  return { marks, pts: Math.round(EX.ptsTask * sum / t.fields.length * 2) / 2 };
}
const HINT = {
  num: 'само цифрите; водещите нули и индексът на основата не са задължителни',
  code: 'във вида знак|цифри, напр. 1|0011',
  set: 'номерата, разделени със запетая, напр. 1, 3, 4',
  bool: "напр. AB' + C'D — отрицание с ' или ! или ¬; И без знак или с ·; ИЛИ с +",
  real: 'число (десетична запетая или точка); приема се отклонение до ±1%',
  essay: C.essayHint || 'Отговор в 3–4 изречения.'
};

}

/* ---------- Тест ---------- */
// opts: { pts: точки за въпрос a–d, forward: само напред, limit: секунди }
function startQuiz(key, title, qs, opts) {
  opts = opts || {};
  const items = qs.map(q => q.isTask
    ? { id: q.id, task: true, pts: EX.ptsTask }
    : { id: q.id, order: settings.shuffle ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3], pts: opts.pts || 1 });
  const limit = opts.limit || items.reduce((s, it) => s + (it.task ? SEC_PER_TASK : SEC_PER_Q), 0);
  Q = {
    key, title, items, src: qs, opts, limit,
    answers: Array(items.length).fill(null),
    flags: Array(items.length).fill(false),
    checked: Array(items.length).fill(false),
    maxSeen: 0, forward: !!opts.forward,
    idx: 0, start: Date.now(), end: Date.now() + limit * 1000,
    instant: settings.instant, done: false
  };
  setHash('#/quiz', /^#\/(quiz|results)$/.test(location.hash));
  startTimer();
  renderQ();
}

function answered(i) {
  const a = Q.answers[i];
  if (a === null) return false;
  if (Q.items[i].task) return a.f.some(v => v && v.trim()) || !!(a.w && a.w.trim());
  return true;
}

function navClass(i) {
  const it = Q.items[i], q = BY_ID[it.id], a = Q.answers[i];
  let cls = 'nav-b' + (it.task ? ' task' : '');
  if (it.task) {
    if (Q.instant && Q.checked[i]) { const p = autoTask(q, a).pts; cls += p >= EX.ptsTask ? ' r-ok' : p > 0 ? ' r-half' : ' r-bad'; }
    else if (answered(i)) cls += ' ans';
  } else if (a !== null) cls += (Q.instant ? (a === q.correct ? ' r-ok' : ' r-bad') : ' ans');
  if (i === Q.idx) cls += ' cur';
  if (Q.flags[i]) cls += ' fl';
  return cls;
}

function navGrid() {
  return Q.items.map((it, i) => {
    const locked = Q.forward && i < Q.idx;
    return `<button class="${navClass(i)}" data-act="go" data-i="${i}" ${locked ? 'disabled' : ''} aria-label="${it.task ? 'Задача' : 'Въпрос'} ${i + 1}">${it.task ? '✎' + (i + 1 - Q.items.filter(x => !x.task).length) : i + 1}</button>`;
  }).join('');
}

function refreshNav(i) {
  const b = app.querySelector(`.nav-b[data-i="${i}"]`);
  if (b) b.className = navClass(i);
}

function taskBody(it, q, a, locked) {
  const res = locked ? autoTask(q, a) : null;
  const fields = q.fields.map((fd, k) => {
    const v = a && a.f ? a.f[k] || '' : '';
    let cls = '', mark = '';
    if (res) {
      const m = res.marks[k];
      cls = m.credit === 1 ? 'ok' : m.credit > 0 ? 'half' : 'bad';
      const right = fieldAnswer(fd);
      mark = `<div class="mark" style="color:var(--${cls === 'ok' ? 'ok' : cls === 'half' ? 'half' : 'bad'})">${m.credit === 1 ? '✓ Вярно' : m.credit > 0 ? '½ Частично' : '✗ Грешно'}${m.note && m.credit !== 1 ? ' — ' + esc(m.note) : ''}${m.credit < 1 && right ? ` · верен отговор: <code>${esc(right)}</code>` : ''}</div>`;
    }
    if (fd.type === 'essay') {
      return `<div class="essay"><textarea class="work big ${cls}" data-f="${k}" spellcheck="true" ${locked ? 'readonly' : ''} placeholder="${esc(HINT.essay)}">${esc(v)}</textarea>
        ${locked ? `<div class="mark">${esc(res.marks[k].note)}</div>${pointsList(fd, res.marks[k])}` : `<span class="hint">${HINT.essay}</span>`}</div>`;
    }
    return `<label class="fld"><span>${subs(esc(fd.label))}</span>
      <input data-f="${k}" value="${esc(v)}" autocomplete="off" spellcheck="false" ${locked ? 'readonly' : ''} class="${cls}">
      ${locked ? mark : `<span class="hint">${HINT[fd.type]}</span>`}</label>`;
  }).join('');
  return `
    <div class="tmd">${md(q.text)}</div>
    <div class="fields">${fields}</div>
    ${isEssay(q) ? '' : `<label class="worklbl" for="work">Решение / чернова (показва се при прегледа; не се проверява автоматично)</label>
    <textarea class="work" id="work" data-w="1" spellcheck="false" ${locked ? 'readonly' : ''}>${esc(a && a.w || '')}</textarea>`}
    ${locked ? `<div class="fb ${res.pts >= EX.ptsTask ? 'good' : res.pts > 0 ? 'half' : 'wrong'}"><b>Автоматична оценка: ${ptsTxt(res.pts)} от ${EX.ptsTask} т.</b>${isEssay(q) ? ' <span>Сравни с примерния отговор и коригирай оценката.</span>' : ''}</div>
      <div class="sol tmd"><b>${isEssay(q) ? 'Примерен отговор' : 'Решение'}</b>${md(q.solution)}</div>`
      : (Q.instant ? `<div class="row" style="margin-top:10px"><button class="btn primary" data-act="check">Провери</button></div>` : '')}`;
}

function renderQ() {
  const it = Q.items[Q.idx], q = BY_ID[it.id], a = Q.answers[Q.idx];
  Q.maxSeen = Math.max(Q.maxSeen, Q.idx);
  let body, status;
  if (it.task) {
    const locked = Q.instant && Q.checked[Q.idx];
    body = taskBody(it, q, a, locked);
    status = !answered(Q.idx) ? 'Все още не е даден отговор' : locked ? 'Проверена' : 'Отговорена';
  } else {
    const locked = Q.instant && a !== null;
    const opts = it.order.map((oi, pos) => {
      let cls = 'opt';
      if (locked) { if (oi === q.correct) cls += ' ok'; else if (oi === a) cls += ' bad'; }
      else if (oi === a) cls += ' sel';
      return `<label class="${cls}"><input type="radio" name="opt" value="${oi}" ${oi === a ? 'checked' : ''} ${locked ? 'disabled' : ''}>
        <span class="ltr">${LETTERS[pos]}.</span><span>${inl(q.opts[oi])}</span></label>`;
    }).join('');
    const fb = locked
      ? `<div class="fb ${a === q.correct ? 'good' : 'wrong'}"><b>${a === q.correct ? 'Вярно!' : 'Грешно. Верният отговор е ' + LETTERS[it.order.indexOf(q.correct)] + '.'}</b> <span>${inl(q.expl)}</span></div>`
      : '';
    body = `<p class="qtext">${inl(q.text)}</p><div role="radiogroup">${opts}</div>${fb}`;
    status = a === null ? 'Все още не е даден отговор' : (locked ? (a === q.correct ? 'Верен' : 'Грешен') : 'Отговорен');
  }
  const last = Q.idx === Q.items.length - 1;
  const nQ = Q.items.filter(x => !x.task).length;
  const label = it.task ? `${TASK_WORD} <b>${Q.idx + 1 - nQ}</b>` : `Въпрос <b>${Q.idx + 1}</b>`;
  render(`
    <div class="topbar">
      <div><div class="muted" style="font-size:.85rem">${esc(C.tag)}</div><h1 style="font-size:1.25rem">${esc(Q.title)}</h1></div>
      <div class="row">
        <div class="timer" id="timer">Оставащо време ${fmt((Q.end - Date.now()) / 1000)}</div>
        <button class="btn ghost" data-act="quit">← Назад</button>
      </div>
    </div>
    <div class="quiz">
      <div class="side"><div class="card">
        <div style="font-weight:600;font-size:.92rem">Навигация в теста</div>
        <div class="navgrid">${navGrid()}</div>
        ${Q.forward ? '<div class="muted" style="font-size:.8rem;margin:-4px 0 10px">Само напред — не можеш да се върнеш.</div>' : ''}
        <button class="btn" style="width:100%;justify-content:center" data-act="finish">Приключване на опита…</button>
      </div></div>
      <div>
        <div class="qwrap">
          <div class="qinfo">
            <div class="qn">${label}</div>
            <div>${status}</div>
            <div>От максимално ${num2(it.pts)}</div>
            <button class="flagbtn ${Q.flags[Q.idx] ? 'on' : ''}" data-act="flag">⚑ ${Q.flags[Q.idx] ? 'Отбелязан' : 'Отбелязване на въпроса'}</button>
          </div>
          <div class="qbox">
            <div class="lectag">${itemTag(q)}</div>
            ${body}
          </div>
        </div>
        <div class="qnav">
          <button class="btn" data-act="prev" ${Q.idx === 0 || Q.forward ? 'disabled' : ''}>Обратно</button>
          ${last ? '<button class="btn primary" data-act="finish">Приключване на опита</button>'
                 : '<button class="btn primary" data-act="next">Следваща страница</button>'}
        </div>
        <div class="kbd">${it.task ? (isEssay(q) ? '' : 'Enter в поле → следващото поле') : 'Клавиши: 1–4 избор · ← → навигация · F отбелязване'}</div>
      </div>
    </div>
  `);
}

function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    if (!Q || Q.done) return stopTimer();
    const left = (Q.end - Date.now()) / 1000;
    const el = document.getElementById('timer');
    if (el) { el.textContent = 'Оставащо време ' + fmt(left); el.classList.toggle('low', left < 120); }
    if (left <= 0) finish(true);
  }, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function finish(auto) {
  if (!Q || Q.done) return;
  if (!auto) {
    const un = Q.items.filter((_, i) => !answered(i)).length;
    const msg = un ? `Има ${un} без отговор. Да приключа ли опита?` : 'Да приключа ли опита и да видя резултата?';
    if (!confirm(msg)) return;
  }
  stopTimer();
  Q.done = true;
  Q.used = Math.min((Date.now() - Q.start) / 1000, Q.limit);
  Q.taskPts = Q.items.map((it, i) => it.task ? autoTask(BY_ID[it.id], Q.answers[i]).pts : null);
  Q.items.forEach((it, i) => {
    if (it.task) return;
    if (Q.answers[i] === BY_ID[it.id].correct) mistakes.delete(it.id);
    else mistakes.add(it.id);
  });
  store.set(PFX + '-mistakes', [...mistakes]);
  Q.max = Q.items.reduce((s, it) => s + it.pts, 0);
  Q.histTs = Date.now();
  rescore();
  setHash('#/results', true);
  results(auto);
}

// точките се преизчисляват и при ръчна корекция на задачите
function rescore() {
  Q.score = Q.items.reduce((s, it, i) => s + (it.task ? Q.taskPts[i] : (Q.answers[i] === BY_ID[it.id].correct ? it.pts : 0)), 0);
  if (Q.key) {
    const b = best[Q.key];
    if (!b || Q.score / Q.max > b.s / b.t || b.ts === Q.histTs) { best[Q.key] = { s: Q.score, t: Q.max, ts: Q.histTs }; store.set(PFX + '-best', best); }
  }
  const m = /^L(\d+)-/.exec(Q.key || '');
  const rec = { ts: Q.histTs, key: Q.key || 'MIX', title: Q.title, score: Q.score, total: Q.max, lec: m ? +m[1] : 0 };
  const k = hist.findIndex(h => h.ts === Q.histTs);
  if (k >= 0) hist[k] = rec; else hist.push(rec);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  store.set(PFX + '-history', hist);
}

function scoreCard(auto) {
  const t = Q.max, pct = Math.round(Q.score / t * 100);
  const col = pct >= 90 ? 'var(--ok)' : pct >= 60 ? 'var(--accent)' : 'var(--bad)';
  const nT = Q.items.filter(x => x.task).length;
  const mcqPts = Q.items.reduce((s, it, i) => s + (!it.task && Q.answers[i] === BY_ID[it.id].correct ? it.pts : 0), 0);
  const mcqMax = Q.items.reduce((s, it) => s + (it.task ? 0 : it.pts), 0);
  return `
      <div class="ring" style="background:conic-gradient(${col} ${pct * 3.6}deg, var(--border) 0)"><span>${ptsTxt(Q.score)}/${t}</span></div>
      <div>
        <h1 style="font-size:1.3rem">${esc(Q.title)}</h1>
        <div style="font-size:1.1rem;margin:4px 0">${pct}% · ${pct >= 90 ? 'Отлично!' : pct >= 60 ? 'Добре, но прегледай грешките.' : 'Прочети резюмето и опитай пак.'}</div>
        ${nT && mcqMax ? `<div class="muted">Тест: ${ptsTxt(mcqPts)}/${mcqMax} т. · Задачи: ${ptsTxt(Q.score - mcqPts)}/${nT * EX.ptsTask} т.</div>` : ''}
        <div class="muted">Време: ${fmt(Q.used)}${auto ? ' · времето изтече' : ''}</div>

    }).join('');
    return `<div class="rev ${ok ? 'ok' : 'bad'}">

function topicStats() {
  const by = {};
  for (const h of hist) {
    const k = h.lec || 0;
    const o = by[k] || (by[k] = { n: 0, sum: 0, best: 0, last: 0 });
    const p = h.total ? h.score / h.total : 0;
    o.n++; o.sum += p; o.best = Math.max(o.best, p); o.last = Math.max(o.last, h.ts);
  }
  return by;
}

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(code) {
  const bin = atob(code.replace(/\s+/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

function exportCode() {
  return b64enc(JSON.stringify({ v: 1, course: PFX, name: userName || 'Гост', best, mistakes: [...mistakes], history: hist }));
}

function importCode(code) {
  let d;
  try { d = JSON.parse(b64dec(code.trim())); } catch (e) { return { ok: false, text: 'Невалиден код — провери дали е копиран изцяло.' }; }
  if (!d || typeof d !== 'object' || d.v !== 1 || typeof d.course !== 'string') return { ok: false, text: 'Невалиден код — липсва версия или курс.' };
  if (d.course !== PFX) return { ok: false, text: `Този код е от друг курс („${d.course}“), а тук е „${PFX}“. Импортирай го в съответния тест.` };
  if (!Array.isArray(d.history) || !Array.isArray(d.mistakes) || !d.best || typeof d.best !== 'object') return { ok: false, text: 'Невалиден код — непълни данни.' };
  // грешни въпроси: заменят текущите
  mistakes = new Set(d.mistakes.filter(id => typeof id === 'string' && BY_ID[id]));
  // най-добри: максимум по ключ
  let nb = 0;
  for (const [k, b] of Object.entries(d.best)) {
    if (!b || !(b.t > 0) || !(b.s >= 0)) continue;
    const cur = best[k];
    if (!cur || b.s / b.t > cur.s / cur.t) { best[k] = { s: +b.s, t: +b.t }; nb++; }
  }
  // история: обединение без дубликати (ts + key), сортирана, последните 500
  const seen = new Set(hist.map(h => h.ts + '|' + h.key));
  let added = 0;
  for (const h of d.history) {
    if (!h || typeof h.ts !== 'number' || typeof h.key !== 'string' || !(h.total > 0)) continue;
    const id = h.ts + '|' + h.key;
    if (seen.has(id)) continue;
    seen.add(id); added++;
    hist.push({ ts: h.ts, key: h.key, title: String(h.title || h.key), score: +h.score || 0, total: +h.total, lec: +h.lec || 0 });
  }
  hist.sort((a, b) => a.ts - b.ts);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  if ((userName === null || userName === 'Гост') && typeof d.name === 'string' && d.name.trim()) { userName = d.name.trim().slice(0, 40); store.set(PFX + '-name', userName); }
  store.set(PFX + '-mistakes', [...mistakes]);
  store.set(PFX + '-best', best);
  store.set(PFX + '-history', hist);
  return { ok: true, text: `Прогресът е импортиран: ${added} нови опита в историята, ${nb} подобрени резултата, ${mistakes.size} грешни въпроса.` };
}

async function copyText(ta) {
  try { await navigator.clipboard.writeText(ta.value); return true; }
  catch (e) { ta.select(); try { return document.execCommand('copy'); } catch (e2) { return false; } }
}

/* ---------- Действия ---------- */
// равномерно от всички лекции: по един случаен въпрос от всяка, на кръгове
function pickMcq(n) {
  const lecs = DATA.lectures.map(l => l.num), used = new Set(), picks = [];
  while (picks.length < n) {
    for (const L of shuffle(lecs)) {
      if (picks.length >= n) break;
      const pool = ALL.filter(q => q.lec === L && !used.has(q.id));
      if (!pool.length) continue;
      const q = pool[Math.floor(Math.random() * pool.length)];
      used.add(q.id); picks.push(q);
    }
  }
  return shuffle(picks);
}
// по една задача от всяка група (групите се повтарят, ако задачите са повече от групите)
function pickTasks(n) {
  const picks = [], order = n < GROUPS.length ? shuffle(GROUPS) : GROUPS;
  for (let i = 0; picks.length < n; i++) {
    const g = order[i % order.length];
    const pool = TASKS.filter(t => t.group === g.key && !picks.includes(BY_ID[t.id]));
    if (pool.length) picks.push(BY_ID[pool[Math.floor(Math.random() * pool.length)].id]);
  }
  return picks;
}

function mockExam(kind) {
  const forward = settings.forward;
  if (!EX.tasks) {
    const n = +kind;
    return startQuiz(null, `Пробен изпит (${n} въпроса)`, pickMcq(n), { forward });
  }
  if (kind === 'mcq') return startQuiz(null, `Пробен изпит — тест (${EX.q} въпроса)`, pickMcq(EX.q), { forward, pts: EX.ptsQ });
  if (kind === 'tasks') return startQuiz(null, `Пробен изпит — ${EX.q ? 'задачи' : 'отворени въпроси'} (${EX.tasks})`, pickTasks(EX.tasks), { forward, limit: EX.q ? undefined : EX.minutes * 60 });
  startQuiz(null, `Пробен изпит (${EX.q} въпроса + ${EX.tasks} задачи)`, pickMcq(EX.q).concat(pickTasks(EX.tasks)), { forward, pts: EX.ptsQ, limit: EX.minutes * 60 });
}

function groupTasks(key) { return TASKS.filter(t => t.group === key).map(t => BY_ID[t.id]); }

  taskall: b => { const g = groupOf(b.dataset.g); startQuiz('T-' + g.key, `Задачи · ${g.title}`, shuffle(groupTasks(g.key))); },
  mock: () => mockExam(document.getElementById('mockN').value),
  sample: () => startQuiz('SAMPLE', 'Примерен тест', SAMPLE),
  mist: () => startQuiz(null, `Грешни въпроси (${mistakes.size})`, shuffle([...mistakes].map(id => BY_ID[id]).filter(Boolean))),
  reset: () => { if (confirm('Да изтрия ли най-добрите резултати, списъка с грешни въпроси и историята на опитите? (Името остава.)')) { best = {}; mistakes = new Set(); hist = []; store.set(PFX + '-best', best); store.set(PFX + '-mistakes', []); store.set(PFX + '-history', hist); home(); } },
  go: b => { const i = +b.dataset.i; if (Q.forward && i < Q.idx) return; Q.idx = i; renderQ(); },
  prev: () => { if (Q.idx > 0 && !Q.forward) { Q.idx--; renderQ(); } },

  flag: () => { Q.flags[Q.idx] = !Q.flags[Q.idx]; renderQ(); },
  check: () => { Q.checked[Q.idx] = true; renderQ(); },
  finish: () => finish(false),
  quit: () => { if (Q && !Q.done && Q.items.some((_, i) => answered(i)) && !confirm('Опитът не е приключен. Да изляза ли?')) return; leaving = true; stopTimer(); Q = null; back(); },
  retry: () => startQuiz(Q.key, Q.title, Q.src, Q.opts),
  retrywrong: () => { const qs = Q.wrongIdx.map(i => BY_ID[Q.items[i].id]); startQuiz(null, `${Q.title} · само грешните`, qs); }
};

  if (t.dataset.f !== undefined) a.f[+t.dataset.f] = t.value; else a.w = t.value;
  refreshNav(Q.idx);
  const st = app.querySelector('.qinfo div:nth-child(2)');
  if (st) st.textContent = answered(Q.idx) ? 'Отговорена' : 'Все още не е даден отговор';
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'nameIn') { if (e.key === 'Enter') actions.saveName(); return; }
  if (e.target.dataset && e.target.dataset.f !== undefined) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); const nx = app.querySelector(`[data-f="${+e.target.dataset.f + 1}"]`) || app.querySelector('[data-w]'); if (nx) nx.focus(); }
    return;
  }
  if (!Q || Q.done || e.ctrlKey || e.metaKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (Q.items[Q.idx].task) {
    if (e.key === 'ArrowRight') actions.next(); else if (e.key === 'ArrowLeft') actions.prev();
    return;
  }
  const k = e.key.toLowerCase();
  const pos = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (pos >= 0 && k.length === 1) {
    if (Q.instant && Q.answers[Q.idx] !== null) return;
    Q.answers[Q.idx] = Q.items[Q.idx].order[pos]; renderQ();
  } else if (e.key === 'ArrowRight') actions.next();
  else if (e.key === 'ArrowLeft') actions.prev();
  else if (k === 'f') actions.flag();
});

/* ---------- Навигация (бутонът „Назад“ на браузъра) ---------- */
// #/ начало · #/sum/N резюме · #/progress прогрес · #/quiz тест · #/results резултат
let leaving = false;
function setHash(h, replace) {
  if (location.hash === h) return;
  history[replace ? 'replaceState' : 'pushState']({ app: 1 }, '', h);
}
function nav(h) { setHash(h); route(); }
function back() {
  // тестът/резултатът се отварят от начало или резюме, затова „Назад“ връща там
  if (history.state && history.state.app) { leaving = true; history.back(); } else { setHash('#/', true); route(); }
}
function route() {
  const h = location.hash, m = /^#\/sum\/(\d+)$/.exec(h);
  if (m && DATA.lectures.some(l => l.num === +m[1])) return summary(+m[1]);
  if (h === '#/progress') return progress();
  if (h === '#/quiz' && Q && !Q.done) { startTimer(); return renderQ(); }
  if (h === '#/results' && Q && Q.done) return results(Q.auto);
  if (h && h !== '#/') history.replaceState(null, '', '#/');
  home();
}
window.addEventListener('popstate', () => {
  if (!leaving && Q && !Q.done && location.hash !== '#/quiz' && Q.items.some((_, i) => answered(i))
      && !confirm('Опитът не е приключен. Да изляза ли?')) {
    history.pushState({ app: 1 }, '', '#/quiz');
    return;
  }
  leaving = false;
  route();
});


route();
</script>
