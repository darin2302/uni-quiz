тепени при n = 12 елемента?","opts":["4,0","2,4","3,2","3,6"],"correct":2,"expl":"S = L·n/(L + n − 1) = 48/15 = 3,2."},{"id":"L04-A-5","n":5,"text":"Към каква стойност клони ускорението на конвейер с L степени при n → ∞?","opts":["n","L − 1","L","1"],"correct":2,"expl":"S = L·n/(L + n − 1) → L."},{"id":"L04-A-6","n":6,"text":"Кое НЕ е от петте условия за конвейерна обработка?","opts":["Всяка степен да има собствена кеш памет","Всяка подфункция да се реализира от отделен апаратен блок","Входните величини да са изходни за предходната подфункция","Блоковете да изразходват приблизително еднакво време"],"correct":0,"expl":"Кеш памет в степените не е условие."},{"id":"L04-A-7","n":7,"text":"От какви два блока е изградена всяка степен на конвейера?","opts":["Декодер и брояч","Регистър и шина","Суматор и мултиплексор","Логика и фиксатор"],"correct":3,"expl":"Логиката изчислява, фиксаторът подава данните към следващата степен в точен момент."},{"id":"L04-A-8","n":8,"text":"Как се нарича конвейер, при който смяната на функцията е рядка и под управлението на програмата?","opts":["Динамичен","Статичен","Еднолинеен","Препокриващ"],"correct":1,"expl":"Пример — аритметичният конвейер на векторния процесор."},{"id":"L04-A-9","n":9,"text":"Какво е средното натоварване на блоковете в примерния многофункционален многопътен конвейер?","opts":["40%","25%","50%","75%"],"correct":0,"expl":"Блокове 1, 4, 5 — по 50%, блокове 2, 3 — по 25%; средно 40%."},{"id":"L04-A-10","n":10,"text":"Как се наричат структурните задръжки в конвейера?","opts":["Препокривания","Прекъсвания","Запълвания","Стълкновения"],"correct":3,"expl":"Два фрагмента данни искат едновременно една и съща степен."}],"B":[{"id":"L04-B-1","n":1,"text":"Кое твърдение за конвейерната обработка е вярно?","opts":["Тя изисква по-бърза логика във всяка отделна степен","Тя е възможна единствено във векторните процесори","Тя е естествено развитие на фон Ноймановата архитектура","Тя отменя фон Ноймановия принцип на програмното управление"],"correct":2,"expl":"Така я определя учебникът."},{"id":"L04-B-2","n":2,"text":"Кои са подфункциите при конвейерно събиране на числа с плаваща запетая?","opts":["Изравняване на порядъците, сумиране на мантисите, нормализация","Извличане, декодиране, изпълнение на командата","Умножение на мантисите, събиране на порядъците, закръгляне","Четене на операндите, сумиране, запис в паметта"],"correct":0,"expl":"Три подфункции → тристепенен конвейер."},{"id":"L04-B-3","n":3,"text":"Колко е ускорението на тристепенен конвейер при n = 10?","opts":["3,0","2,0","1,5","2,5"],"correct":3,"expl":"S = 3n/(n + 2) = 30/12 = 2,5."},{"id":"L04-B-4","n":4,"text":"Колко такта са нужни на петстепенен конвейер, за да обработи 20 елемента?","opts":["25","24","100","20"],"correct":1,"expl":"n + L − 1 = 20 + 5 − 1 = 24."},{"id":"L04-B-5","n":5,"text":"Какво е фиксаторът в степента на конвейера?","opts":["Логическа схема, която извършва самата подфункция","Свръхбърза памет, подаваща данните в точен момент","Брояч на изминалите тактове в конвейера","Устройство за обработка на прекъсванията в степента"],"correct":1,"expl":"Затова конвейерът е синхронно устройство."},{"id":"L04-B-6","n":6,"text":"Какъв термин се използва, ако не е изпълнено поне едно от условията за конвейер?","opts":["Стълкновение","Векторна обработка","Суперскаларност","Препокриване на операциите"],"correct":3,"expl":"Ефектът е същият, но средствата са различни."},{"id":"L04-B-7","n":7,"text":"Кой тип конвейер се използва за изпълнение на машинните команди?","opts":["Динамичен","Статичен","Еднофункционален","Еднолинеен"],"correct":0,"expl":"Всяка команда се различава по формат и тип — нужно е непрекъснато пренастройване."},{"id":"L04-B-8","n":8,"text":"Кое е характерно за многофункционалния конвейер?","opts":["Изпълнява само един тип базова функция","Данните винаги минават по един маршрут","Освен вход за данни има и управляващ вход","Не може да се използва при векторните процесори"],"correct":2,"expl":"Управляващият вход регулира действието на конвейера."},{"id":"L04-B-9","n":9,"text":"Кои задръжки могат да се отстранят още при проектирането на конвейера?","opts":["Зависещите от данните","Структурните (стълкновенията)","Междукомандните зависимости","Причинени от прекъсвания"],"correct":1,"expl":"Те се поддават на аналитично решение."},{"id":"L04-B-10","n":10,"text":"Кога се проявява проблемът със запълването на конвейера?","opts":["При дълги вектори без разклонения","При еднакво време на всички степени","При кратки вектори и чести команди за преход","При използване на еднофункционален конвейер"],"correct":2,"expl":"Степените остават незаети или изпълняват ненужни команди."}],"C":[{"id":"L04-C-1","n":1,"text":"Какво се разбира под „степен“ на конвейера?","opts":["Подпрограма за обработка на прекъсване","Отделен процесор в многопроцесорна система","Регистър на програмния брояч","Апаратен блок, изпълняващ една подфункция"],"correct":3,"expl":"Базовата функция се разделя на подфункции, всяка в отделна степен."},{"id":"L04-C-2","n":2,"text":"Какво е ускорението на петстепенен конвейер при n = 100?","opts":["5,00","≈ 4,81","≈ 4,50","≈ 3,85"],"correct":1,"expl":"S = 5·100/(5 + 100 − 1) = 500/104 ≈ 4,81."},{"id":"L04-C-3","n":3,"text":"Защо конвейерната обработка е особено подходяща при дълги вектори?","opts":["Дългите вектори намаляват броя на степените","Дългите вектори премахват структурните задръжки","Времето за запълване се разпределя върху много елементи","При дълги вектори тактът става по-къс"],"correct":2,"expl":"При голямо n ускорението се доближава до L."},{"id":"L04-C-4","n":4,"text":"Кое условие за конвейерна обработка се нарушава при различно времетраене на степените?","opts":["Блоковете да изразходват приблизително еднакво време","Входните данни да са изходни за предходната подфункция","Базовата функция да е последователност от подфункции","Да няма взаимодействия освен предаване на данни"],"correct":0,"expl":"Тогава става дума за препокриване на операциите."},{"id":"L04-C-5","n":5,"text":"Кой е типичният пример за препокриване на операциите?","opts":["Вход/изход, препокрит с изчисленията","Събиране на вектори с плаваща запетая","Тристепенен аритметичен конвейер","Петстепенен RISC конвейер за команди"],"correct":0,"expl":"ЦП и процесорът за в/и работят паралелно, паметта е фиксатор."},{"id":"L04-C-6","n":6,"text":"Кой е основният недостатък на многофункционалния многопътен конвейер?","opts":["Невъзможността да изпълнява умножение","Липсата на управляващ вход","Лошото използване на апаратните блокове","Невъзможността да работи синхронно"],"correct":2,"expl":"Нито една операция не използва всички блокове — средно 40%."},{"id":"L04-C-7","n":7,"text":"Какви са двете трудности при прекъсванията в конвейерен процесор?","opts":["Как да се увеличи броят степени и тактовата честота","Къде да се постави преходът и как да се възстанови програмата","Как да се намали броят на командите и регистрите","Къде да се запишат векторите и как да се нормализират"],"correct":1,"expl":"И двете се задълбочават с увеличаване на броя степени."},{"id":"L04-C-8","n":8,"text":"Каква е особеността на задръжките, зависещи от данните?","opts":["Отстраняват се изцяло при проектирането","Възникват само при еднофункционален конвейер","Не зависят от конкретните данни","Не се поддават на аналитично изследване"],"correct":3,"expl":"Те зависят изцяло от данните."},{"id":"L04-C-9","n":9,"text":"Кой е типичният случай на междукомандна зависимост?","opts":["Две съседни команди използват различни регистри","Командата се извлича от кеш паметта за команди","Конвейерът изпълнява само по една команда наведнъж","i-тата команда чете данни, които (i+1)-вата изменя"],"correct":3,"expl":"Съседните команди влияят на операндите и резултатите си."},{"id":"L04-C-10","n":10,"text":"Какво е ускорението на конвейер с L = 4 степени, σ = 3 и n = 10 по формулата S ≈ L·n/(σ + L + n − 1)?","opts":["2,5","3,2","4,0","2,0"],"correct":0,"expl":"S = 40/(3 + 4 + 10 − 1) = 40/16 = 2,5."}]}},{"num":5,"title":"Лекция 5 — Конвейерно изпълнение на командите","short":"Конвейерно изпълнение на командите","summary":"### Същност: конвейер за команди\n- Изпълнението на всяка команда се разбива на етапи (извличане, декодиране, адрес, изпълнение, запис), изпълнявани от отделни **степени**; командите се **препокриват по време**.\n- Конвейерът за команди е **скрит (прозрачен) за програмиста**: наборът команди е общ за цялото семейство, а следенето на всяка команда в конвейера програмно е прекалено сложно.\n- Конвейерът за команди е **динамичен многофункционален конвейер** — всяка следваща команда е от различен тип/формат (за разлика от статичния аритметичен конвейер на векторния процесор).\n\n### Двустепенен конвейер и предварително извличане\n- Най-простият конвейер: **IF** (извличане и буфериране) → **E** (изпълнение). Докато E изпълнява, IF използва свободните цикли на паметта за избор на следващата команда — **предварително извличане на команди**.\n- Двойно ускорение е **малко вероятно**, защото:\n  1. времето за **изпълнение** като правило е много по-голямо от времето за **извличане**;\n  2. при **команди за преход** следващата команда е неизвестна → чакане или **отхвърляне** на вече извлечената команда.\n- Простото прогнозиране: извлича се командата **непосредствено след прехода**; ако преходът не се осъществи — няма загуба, ако се осъществи — командата се отхвърля.\n- Два прийома за по-голямо ускорение:\n  - **а)** двустепенен конвейер, но в първата степен (**IF-устройство**, Instruction Fetch Unit) се правят повече функции — извличане, декодиране, определяне адреса на операнда → **изравняване** на времената; втората степен е **E-устройство** (Execution Unit). Между тях — **фиксатор**: един регистър (твърда връзка) или **регистров файл** (относително независима работа). Ползван в по-старите процесори (i8086).\n  - **б)** **многостепенен конвейер** — всяка степен реализира отделен етап; предпочитан в съвременните процесори.\n\n### Дълги (многостепенни) конвейери — плюсове и минуси\n| Предимства | Недостатъци |\n|---|---|\n| по-проста подфункция във всяка степен → по-къс такт, **по-висока тактова честота** | ускорението **не расте пропорционално**: всяка степен добавя загуби за **прехвърляне между фиксаторите** и подготвителни функции |\n| повече команди едновременно в конвейера | **стремително нараства управляващата логика** за отчитане на зависимостите (памет, регистри) |\n| P6 ≈ 2× степени спрямо P5 → ≈ 1,5× честота; P4P ≈ 2× спрямо P6 (28 степени) | по-голяма загуба при **преход** / грешно предсказване (изчистват се повече степени), по-сложни **прекъсвания**, повече **междукомандни зависимости** |\n| | конвейерът трябва постоянно да се **захранва**, иначе — **мехурчета** (bubbles), всяко води до много загубени цикли |\n\n- Пример (лаб. 4): степен с 80 ns логика + 20 ns фиксатор (такт 100 ns); при удвояване на степените (2 → 4) логиката става 40 ns, а тактът — 40 + 20 = **60 ns** вместо очакваните 50 ns → ускорение ≈ **1,67** вместо 2.\n\n### Най-дългата степен\n- Скоростта на конвейера се определя от **най-бавната степен** — тя задава такта.\n- В общия случай най-дълга е степента/фазата **изпълнение (E)**: четене на регистровия файл, операции в **АЛУ**, при някои команди обръщение към паметта и многотактови операции.\n- Затова: (1) в IF се добавят функции (изравняване), (2) **E се разделя на E1 и E2** (например E1 — четене на регистровия файл, E2 — АЛУ) → тактът намалява ≈ 2 пъти.\n- При суперскаларните процесори най-голяма латентност имат фазите **декодиране и издаване** (сложна логика) — те ограничават честотата (тема 6).\n\n### Пример: LOAD A,M1 / LOAD B,M2 / ADD A,B / STORE M3,A / JUMP X (RISC)\n- Аритметично-логическите команди: **IF, E**; LOAD/STORE: **IF, E** (изчисляване на адреса), **D** (обръщение към паметта).\n\n| Вариант | Тактове | Ускорение | Причина за задръжките |\n|---|---|---|---|\n| Без конвейер | 13 | — | — |\n| А) Обща памет за данни и команди | 8 | +62,5 % (13/8) | IF и D не могат в един такт → **структурен конфликт** за паметта; ADD се задържа 2 такта |\n| Б) Отделни памети | 7 | +85,7 % (13/7) | ADD се задържа заради **конфликт по данни** (B още не е зареден); теоретично до **3×** (3 команди едновременно) |\n| Б) + програмно с NOP | 7 | +85,7 % | NOP след втория LOAD и след JUMP вместо задържане |\n| Б) + E разделена на E1/E2 | 10 кратки такта (½) | **2,6×** | по-къс такт |\n\n- Изводи: при конвейеризация програмата се променя — или се **задържат** команди (**концепцията на Бъркли**), или се **вмъкват NOP** (**концепцията на Станфорд**).\n\n### Команди за преход — методи за намаляване на влиянието им\n- Всеки преход нарушава последователния поток → **изчистване** на конвейера и ново запълване; проблемът расте с броя на степените.\n\n| Метод | Ниво | Същност |\n|---|---|---|\n| **Предварителен избор на адреса на разклонение** | апаратно | при условен преход освен следващата команда се извлича и целевият адрес; при взет преход той е вече готов |\n| **Няколко потока команди** (IBM System 370/168) | апаратно | основен и спомагателен буфер за команди; при взет преход конвейерът само се превключва към спомагателния |\n| **Прогнозирано разклонение** | апаратно | в **асоциативна памет** се пазят най-често срещаните преходи; предварително се избира най-вероятната команда (BTB в Pentium, история на преходите) |\n| **Отложено разклонение** | програмно | след прехода се вмъква NOP (или полезна команда) в „слота за забавяне“ |\n\n**Аналитичен модел (лаб. 2):** L — брой степени, n — брой команди, p — вероятност за преход (≈ 0,2), g — вероятност за успешно разклонение (≈ 0,6, без загуба):\n- брой тактове: `n(1−p) + n·p·g + n·p·(1−g)·L`\n- ефективност (n ≫ L): **E = 1 / [1 − p + p·g + p·(1−g)·L]**, ускорение **S = L·E**\n- пример: p = 0,2, g = 0,6, L = 5 → E ≈ 0,76, S ≈ 3,8; при L = 10 → E ≈ 0,58, S ≈ 5,8 — **по-дълъг конвейер → по-голяма загуба от преходите**.\n\n### Междукомандни зависимости (смущения, hazards)\n- Причина: командите се **препокриват по време** — операции на i+1, i+2 могат да стартират преди да е завършила i, от чийто резултат зависят.\n- **D(i)** — **област на определяне**: всички обекти (регистри, клетки от паметта, флагове), които влияят на изпълнението на i, т.е. **четени** от i.\n- **R(i)** — **област на значенията**: всички обекти, които могат да бъдат **изменени** от i.\n- За j, логически след i:\n\n| Смущение | Условие | Смисъл |\n|---|---|---|\n| **RAW** (четене след запис) | R(i) ∩ D(j) ≠ ∅ | j чете обект, който i още не е записала → чете грешна стойност; най-често и най-критично |\n| **WAR** (запис след четене) | D(i) ∩ R(j) ≠ ∅ | j записва обект, преди i да го е прочела |\n| **WAW** (запис след запис) | R(i) ∩ R(j) ≠ ∅ | и двете записват един обект; записът на i може да настъпи след този на j |\n| RAR (четене след четене) | D(i) ∩ D(j) ≠ ∅ | **не е конфликт** |\n\n### Откриване и отстраняване на зависимостите\n**Апаратно — откриване:**\n- а) в **първата степен** се определят D(i) и R(i) и се сравняват с тези на командите в конвейера;\n- б) командата се изпълнява до **точката, в която ѝ трябва** обект от D или R, и тогава се проверява — по-гъвкав подход, по-редки спирания, но **повече апаратура**.\n\n**Апаратно — отстраняване:**\n- а) **спира се** команда i и всички следващи, докато конфликтната команда **напусне конвейера**;\n- б) спира се само i, а i+1, i+2 (ако нямат собствени конфликти) я **задминават** → непоредно изпълнение (out-of-order).\n\n**Програмно:**\n- **Отложено разклонение** — вмъкване на **NOP**; увеличава обема на програмата.\n- **Оптимизирано разклонение** — **реорганизация на кода**: преходът си **разменя мястото** с непосредствено предхождащата независима команда (пример: `ADD A,1` и `JUMP 105`); ефективно при безусловни преходи и връщане от подпрограми; при условен преход, чието условие се изменя от предходната команда, се вмъква NOP.\n\n### Intel P5 (Pentium)\n- Суперскаларен: две целочислени устройства **U** и **V**, едно FPU, отделни 8 KB кеш за код и данни, **BTB** (Branch Target Buffer), MMU.\n- Целочислени конвейери — 5 фази: **IF** (извличане), **D1** (декодиране), **D2** (формиране на адреса), **EX** (АЛУ + кеш за данни), **WB** (запис в регистрите и флаговете).\n- U изпълнява **всяка** x86 команда; V — само **прости** (апаратно реализирани, без микрокод) и **FXCHG**; командата за V е **втора** в двойката.\n- Правила за сдвояване: двете команди прости; **без зависимост по регистри** (`mov ax,5` / `inc ax` не се сдвояват); команди с префикс — само в U; не едновременно отместване и непосреден операнд.\n- U и V влизат едновременно в EX; **редът на изпълнение не може да се променя** — зависимостите се решават чрез строги правила.\n- BTB — малък кеш (адрес на прехода + целеви адрес + **битове за предисторията**); при грешно предсказване — **пълно изчистване** на конвейерите.\n- FPU — **8-степенен** (IF, D1, D2, EX, X1, X2, WF, ER), първите 5 общи с U; целочислени и FP команди не се изпълняват паралелно; FXCHG — паралелно с друга FP команда за „квази нула такта“.\n\n### Intel P6 (Pentium Pro / II / III)\n- Три целочислени конвейера, **14-степенен** конвейер в три секции: **поредно изпълнение**, **непоредно изпълнение**, **оттегляне** (retire), разделени чрез буфериране в **станцията за резервиране**.\n- Четири нововъведения: **микрооперации** (x86 → RISC-подобни операции), **непоредно изпълнение**, **смяна на имената на регистрите** (премахва WAR/WAW и ограничението от малкото регистри), по-развито **предсказване** на преходите.\n- Проблем: 16-битов код — четене на цял регистър след запис в негова 8/16-битова част забавя със **7+ цикъла** (≈ 20 x86 команди) → P6 изисква **32-битова ОС и приложения**.\n\n### Intel P4P (NetBurst, 2000 г.)\n- **28 степени** (≈ 2× P6) → висока честота, но риск от **мехурчета**, ако L1 не захранва конвейера; дълбоки буфери — до **126 команди** в степените.\n- **Trace cache** — L1 кеш за команди в машината за предварителна обработка; пази **транслирани и декодирани микрооперации**, подредени в **следи** → многократно изпълняваният код не се транслира отново; 12 KB ≈ 16–18 KB стандартен кеш.\n- Два режима: **изпълнение** и **изграждане на следите**; BPU е вграден в следата; дългите x86 команди → **указател към микрокодова ROM**.\n\n### IDT-C6 (лабораторно упражнение 4)\n- x86-съвместим **CISC процесор с вътрешна RISC архитектура**, **6-степенен** конвейер: извличане → **транслация** → (опашка) → декодиране → адрес → изпълнение → обратен запис.\n- Степента **„транслация“** преобразува x86 командите (с различна дължина и сложност) в **33-битови RISC команди** → регулярен формат, лесна конвейеризация, изравнени времена, по-проста управляваща логика, запазена x86 съвместимост.\n- Сложните, рядко използвани команди се изпълняват като **последователност от RISC команди (микрокод)**; опашката изглажда темпа между транслацията и декодирането.\n- **Не е суперскаларен** и **няма апаратно предсказване на преходите** → удобен за моделиране; времето в етап 5 (изпълнение) зависи от типа команда (FP, деление, обръщение към кеша за данни — тип M) и готовността на операндите.\n\n### Принципи за повишаване на производителността на конвейерите за команди (обобщение)\n1. **Изравняване** на степените и разделяне на най-дългата (E → E1, E2); буфери (регистров файл) между степените.\n2. **Повече степени** → по-висока честота (с мярка — виж недостатъците).\n3. **Отделни памети/кеш за команди и данни** (няма конфликт IF–D).\n4. Намаляване на влиянието на **преходите** (предварителен избор, няколко потока, прогнозиране, отложено разклонение).\n5. Отстраняване на **зависимостите** — апаратно (задържане, непоредно изпълнение, смяна на имената) и програмно (NOP, реорганизация).\n6. **Транслация** на CISC в RISC-подобни микрооперации; **няколко паралелни конвейера** (суперскаларност).\n\n### Капани за изпита\n- **D(i) е четене, R(i) е запис** — не ги разменяй. RAW = R(i)∩D(j), WAR = D(i)∩R(j), WAW = R(i)∩R(j); винаги уточнявай, че **j следва след i**. RAR **не е** конфликт.\n- **Отложено** разклонение = NOP (обемът расте); **оптимизирано** = размяна на команди (обемът не расте). Станфорд = NOP, Бъркли = задържане.\n- Три апаратни метода за преходите + един програмен — изпитващият очаква и четирите, с по едно изречение същност (IBM 370/168 за няколко потока, асоциативна памет/BTB за прогнозирането).\n- Апаратното ниво има **два прийома за откриване** и **два за отстраняване** — не ги смесвай.\n- 62,5 % и 85,7 % са **повишения** на производителността (13/8 и 13/7), а 2,6 е **кратност** (2,6 пъти).\n- Най-дълга степен = **изпълнение**; при суперскаларните най-латентни са **декодирането и издаването** — ако питат „в общия случай“, отговорът е изпълнението, но спомени и второто.\n- „Дълъг конвейер“: винаги и **плюс** (честота), и **минуси** (фиксатори, управляваща логика, преходи, мехурчета, прекъсвания).\n- P5 — **поредно** изпълнение (строги правила), P6 — **непоредно** + смяна на имената, P4P — **trace cache** и 28 степени. Брой степени: P5 = 5 (FPU 8), P6 = 14, P4P = 28.\n- IDT-C6: транслация в **33-битови** RISC команди, **6 степени**, без суперскаларност и без апаратно предсказване.","testNames":["A","B","C"],"tests":{"A":[{"id":"L05-A-1","n":1,"text":"Какво означават областите D(i) и R(i) на команда i?","opts":["D(i) — обектите, записвани от i; R(i) — обектите, четени от i","D(i) — обектите, четени от i; R(i) — обектите, изменяни от i","D(i) — адресите на данните на i; R(i) — регистрите-резултат","D(i) — времето за декодиране на i; R(i) — времето за запис"],"correct":1,"expl":"**D(i)** — област на определяне (четени обекти), **R(i)** — област на значенията (изменяни обекти)."},{"id":"L05-A-2","n":2,"text":"При j след i условието R(i) ∩ D(j) ≠ ∅ описва смущение от тип:","opts":["RAW","RAR","WAW","WAR"],"correct":0,"expl":"j **чете** обект, който i **записва** — четене след запис (**RAW**)."},{"id":"L05-A-3","n":3,"text":"Коя от изброените зависимости НЕ е конфликтна ситуация?","opts":["WAW (запис след запис)","WAR (запис след четене)","RAW (четене след запис)","RAR (четене след четене)"],"correct":3,"expl":"Две четения на един обект не си пречат — **RAR** не е смущение."},{"id":"L05-A-4","n":4,"text":"Примерният фрагмент LOAD, LOAD, ADD, STORE, JUMP без конвейер отнема 13 такта. Колко отнема при обща памет за данни и команди?","opts":["7 такта","5 такта","8 такта","10 такта"],"correct":2,"expl":"IF и D не могат в един такт → ADD се задържа 2 такта; **8 такта** (+62,5 %)."},{"id":"L05-A-5","n":5,"text":"Кой от методите за намаляване влиянието на преходите е програмен?","opts":["Отложеното разклонение","Няколкото потока команди","Предварителният избор на адреса","Прогнозираното разклонение"],"correct":0,"expl":"Първите три са апаратни; **отложеното разклонение** (NOP) е програмно."},{"id":"L05-A-6","n":6,"text":"В какво се състои концепцията на Станфорд за междукомандните зависимости?","opts":["Задържане на конфликтните команди","Смяна на имената на регистрите","Изпълнение на двата клона на прехода","Вмъкване на команди NOP в програмата"],"correct":3,"expl":"Станфорд — **NOP**; Бъркли — **задържане** на команди в конвейера."},{"id":"L05-A-7","n":7,"text":"Кои са петте фази на целочислените конвейери U и V в P5?","opts":["IF, ID, EX, MEM, WB","IF, D1, EX, X1, WF","IF, D1, D2, EX, WB","IF, TR, D, EX, WB"],"correct":2,"expl":"Извличане, декодиране (**D1**), формиране на адреса (**D2**), изпълнение, обратен запис."},{"id":"L05-A-8","n":8,"text":"Какво съхранява кешът за следите (trace cache) в P4P?","opts":["Целевите адреси на последните преходи","Декодирани микрооперации, подредени в следи","x86 команди заедно с адресите на преходите","Спекулативно заредени данни от паметта"],"correct":1,"expl":"Trace cache пази вече **транслирани микрооперации** → няма повторно декодиране."},{"id":"L05-A-9","n":9,"text":"По аналитичния модел E = 1/[1 − p + p·g + p·(1−g)·L], каква е ефективността при p = 0,2, g = 0,6, L = 5?","opts":["≈ 0,66","≈ 0,58","≈ 0,88","≈ 0,76"],"correct":3,"expl":"1 − 0,2 + 0,12 + 0,08·5 = 1,32 → E = 1/1,32 ≈ **0,76**."},{"id":"L05-A-10","n":10,"text":"Защо двустепенният конвейер (извличане/изпълнение) практически не удвоява скоростта?","opts":["Извличането е по-дълго от изпълнението на командата","Двете степени ползват общ регистров файл за данни","Изпълнението е по-дълго от извличането и има преходи","Фиксаторът между двете степени е твърде бавен"],"correct":2,"expl":"Две причини: **неравни времена** (E ≫ IF) и **преходите**, при които следващата команда е неизвестна."}],"B":[{"id":"L05-B-1","n":1,"text":"При j след i условието D(i) ∩ R(j) ≠ ∅ описва смущение от тип:","opts":["WAR","RAR","WAW","RAW"],"correct":0,"expl":"j **записва** обект, който i **чете** — запис след четене (**WAR**)."},{"id":"L05-B-2","n":2,"text":"Кои смущения се премахват чрез смяна на имената на регистрите (P6)?","opts":["RAW, WAR и WAW","WAR и WAW","RAW и WAR","Само RAW"],"correct":1,"expl":"Преименуването премахва „фалшивите“ **WAR/WAW**; RAW е истинска зависимост по данни."},{"id":"L05-B-3","n":3,"text":"С колко се повишава производителността при отделни памети за данни и команди (7 такта срещу 13)?","opts":["С 62,5 %","С 160 %","С 85,7 %","С 46,2 %"],"correct":2,"expl":"13/7 ≈ 1,857 → повишение **85,7 %**."},{"id":"L05-B-4","n":4,"text":"В кой компютър за първи път е използван методът с няколко потока команди?","opts":["Intel Pentium (P5)","IBM System/360 Model 91","CDC 6600","IBM System 370/168"],"correct":3,"expl":"Два буфера — основен и спомагателен — в **IBM System 370/168**."},{"id":"L05-B-5","n":5,"text":"Колко степени има конвейерът на архитектурата P6?","opts":["28","14","8","5"],"correct":1,"expl":"P6 — **14 степени** в три секции; P5 — 5, P4P — 28."},{"id":"L05-B-6","n":6,"text":"Кое НЕ е причина ускорението да не расте пропорционално на броя степени?","opts":["Опростяването на логиката във всяка степен","Нарастването на управляващата логика","По-голямата загуба при изчистване след преход","Загубите за прехвърляне между фиксаторите"],"correct":0,"expl":"По-простата логика е **предимство** (по-къс такт), а не причина за загуба."},{"id":"L05-B-7","n":7,"text":"Какви команди може да изпълнява конвейерът V на P5?","opts":["Само преходи и обръщения към паметта за данни","Всички x86 команди, включително тези с микрокод","Само команди за аритметика с плаваща запетая","Само прости, апаратно реализирани команди и FXCHG"],"correct":3,"expl":"U изпълнява всичко; **V — само прости** команди и FXCHG, винаги втора в двойката."},{"id":"L05-B-8","n":8,"text":"При апаратното отстраняване на зависимости кой прийом позволява задминаване на команда i?","opts":["Компилаторът вмъква NOP веднага след команда i","Спира се i и всички следващи до напускане на конфликтната","Спира се само i, а следващите без конфликти продължават","Разменят се местата на i и предходната команда"],"correct":2,"expl":"Вторият прийом — следващите команди **задминават** i (непоредно изпълнение)."},{"id":"L05-B-9","n":9,"text":"Неконвейерно примерът отнема 13 такта; след разделяне на E на E1 и E2 — 10 такта с двойно по-къс такт. Ускорението е:","opts":["2,6 пъти","1,3 пъти","5,2 пъти","1,86 пъти"],"correct":0,"expl":"13 / (10 · 0,5) = **2,6**."},{"id":"L05-B-10","n":10,"text":"В какво се транслират x86 командите в степента „транслация“ на IDT-C6?","opts":["В 128-битови свръхдълги думи","В 33-битови RISC команди","В микрооперации на кеша за следи","В 41-битови EPIC команди"],"correct":1,"expl":"IDT-C6: x86 → **33-битови RISC** команди; 41 бита е IA-64, trace cache — P4P."}],"C":[{"id":"L05-C-1","n":1,"text":"Коя е в общия случай „най-дългата“ степен в конвейера за команди?","opts":["Декодирането на командата","Обратният запис на резултата","Изпълнението на командата","Извличането на командата"],"correct":2,"expl":"Фазата **E** е най-продължителна, затова се разделя на E1 и E2."},{"id":"L05-C-2","n":2,"text":"Каква е същността на оптимизираното разклонение?","opts":["Извличат се и двата клона в два отделни буфера","След прехода компилаторът вмъква команда NOP","Честите преходи се пазят в асоциативна памет","Преходът се разменя с предходна независима команда"],"correct":3,"expl":"Реорганизация на кода — **размяна** на прехода и полезната команда, без NOP."},{"id":"L05-C-3","n":3,"text":"Как се реализира прогнозираното разклонение според учебника?","opts":["Честите преходи се пазят в асоциативна памет","Компилаторът вмъква NOP след всеки преход","Използват се основен и спомагателен буфер","Двата клона се изпълняват спекулативно"],"correct":0,"expl":"Асоциативна памет (при Pentium — **BTB**) пази най-често използваните преходи."},{"id":"L05-C-4","n":4,"text":"Колко степени има конвейерът на P4P (NetBurst) според учебника?","opts":["14","28","10","8"],"correct":1,"expl":"P4P — **28 степени**, около 2× повече от P6."},{"id":"L05-C-5","n":5,"text":"Кой тип смущение е най-често срещан и най-критичен?","opts":["WAR","RAR","WAW","RAW"],"correct":3,"expl":"**RAW** — истинска зависимост по данни: j ползва резултата на i."},{"id":"L05-C-6","n":6,"text":"Кое правило за сдвояване на команди в P5 е вярно?","opts":["Командите с префикс се изпълняват само в конвейера V","Целочислена и FP команда могат да се сдвоят заедно","Двете команди не трябва да имат зависимост по регистри","Командата за V винаги е първа в двойката команди"],"correct":2,"expl":"Без **регистрова зависимост**, и двете прости; V-командата е **втора**; префиксни — само в U."},{"id":"L05-C-7","n":7,"text":"Защо P6 работи по-бавно с 16-битови програми?","opts":["P6 няма BTB и всеки преход изчиства конвейера","Четене на цял регистър след запис в негова част забавя 7+ цикъла","16-битовите команди не се транслират в микрооперации","16-битовият код не може да ползва станцията за резервиране"],"correct":1,"expl":"Частичен запис (8/16 бита) + четене на целия регистър → забавяне **7+ цикъла**."},{"id":"L05-C-8","n":8,"text":"Какъв е недостатъкът на отложеното разклонение?","opts":["Увеличава обема на паметта, заеман от програмата","Изисква два буфера — основен и спомагателен","Изисква асоциативна памет за историята на преходите","Не може да се използва при RISC процесорите"],"correct":0,"expl":"Вмъкнатите **NOP** удължават програмата."},{"id":"L05-C-9","n":9,"text":"По модела S = L·E, E = 1/[1 − p + p·g + p·(1−g)·L], колко е S при p = 0,25, g = 0,5, L = 6?","opts":["≈ 6,00","≈ 2,40","≈ 3,69","≈ 4,80"],"correct":2,"expl":"Знаменател 0,75 + 0,125 + 0,75 = 1,625 → E ≈ 0,615, **S ≈ 3,69**."},{"id":"L05-C-10","n":10,"text":"Кое от изброените НЯМА в процесора IDT-C6 (по лабораторното ръководство)?","opts":["Степен за транслация на x86 команди","Опашка преди степента за декодиране","Степен за обратен запис на резултата","Апаратно предсказване на преходите"],"correct":3,"expl":"IDT-C6 не е суперскаларен и **няма апаратно предсказване** на преходите."}]}},{"num":6,"title":"Лекция 6 — Процесори с множество функционални устройства","short":"Процесори с множество ФУ","summary":"### Процесор с множество функционални устройства (ФУ) — същност\n- Алтернатива на чистия конвейер: в **единичния процесор** има **няколко ФУ**, всяко активирано от **отделна команда**.\n- Видове ФУ: **еднотипни (универсални)** или **разнотипни (специализирани)**; някои могат да се **повтарят**; **прости** (следващата операция чака края на предишната) или **конвейерни** (самото ФУ е конвейер).\n- Спрямо **векторния процесор**: **не изисква регулярност на данните** (вектори) → максимална производителност и при **скаларни** операции.\n- Спрямо **мултипроцесора**: **няма съществени разходи за комуникация** между ФУ.\n- Реализира се **паралелизъм на ниво команди — ILP** (Instruction Level Parallelism), невидим за потребителя.\n\n### Защо е нужна синхронизация\n- Различните команди се изпълняват за **различно време**.\n- Времето зависи от **местоположението на операндите и резултата** (решава се, ако ФУ работят **само с регистрите**).\n- Входните операнди на една команда може да са **резултат на друга**, изпълнявана в същото време → **зависимост по данни**.\n- Два пътя: **апаратна синхронизация** (суперскаларни процесори) и **програмна синхронизация** (VLIW).\n\n### Синхронизация на апаратно ниво — суперскаларна архитектура\n- Синхронизацията се прави **по време на изпълнение** на програмата; за пръв път в **CDC 6600 (1964)**.\n- Структура: **конвейер за команди**, чиято **изпълнителна степен** се състои от **няколко паралелно работещи ФУ** (самите те — конвейери) → **функционален паралелизъм**. Устройство за извличане → буфер на командите → ФУ1…ФУN ↔ регистри.\n- Почти всички съвременни процесори са суперскаларни: Pentium III, P4, AMD K6/K7, Alpha, PowerPC 601/602, UltraSPARC.\n- **Динамично разпределение** на командите: редът на избиране може да се различава от програмния, но резултатът трябва да съвпада с последователното изпълнение.\n\n**Причини паралелното изпълнение да не е винаги възможно:**\n\n| Причина | Същност | Мярка |\n|---|---|---|\n| **Конфликти при достъп до ресурси** | няколко команди искат едно ФУ/ресурс (аналог на структурния конфликт) | **дублиране** на ФУ |\n| **Зависимост по управление** | (1) разклонения; (2) команди с **променлива дължина** — следващата не се декодира, преди да завърши декодирането на текущата | суперскаларността е **по-подходяща за RISC** (фиксиран формат) |\n| **Конфликти по данни** | следващата команда иска резултата на предишната; **свойство на програмата**, не се отстранява нито от компилатора, нито апаратно | **непоредно изпълнение** (out-of-order) — ФУ се натоварват с други, готови команди |\n\n- **Прозорец на изпълнение** (Window of Execution) — наборът команди, **кандидати за изпълнение** в даден момент; размерът му зависи от **броя на конвейерите** и **броя на степените**; трябва да е достатъчно голям.\n- **CPI** (Cycles Per Instruction) — среден брой тактове за команда; идеал **1** за един конвейер, при множество ФУ **< 1**.\n- Две стратегии: **„широк и плитък“** — повече конвейери с малко степени (**Motorola G4**); **„тесен и дълбок“** — по-малко конвейери с много степени (**Intel P4P**).\n\n### Scoreboard (CDC 6600) — централизирано динамично планиране\n| Фаза | Какво се проверява |\n|---|---|\n| **Issue** (издаване) | свободно ФУ и **WAW**; иначе — задържане |\n| **Read Operands** | изчаква се наличието на операндите → решава **RAW** |\n| **Execution** | ФУ изпълнява и уведомява Scoreboard |\n| **Write Result** | проверка за **WAR** — записва се, след като по-ранните четящи команди са прочели |\n- Три таблици: на **командите** (фаза), на **ФУ** (заето, операция, регистри, готовност), на **регистрите** (кое ФУ ще пише в тях).\n- Ограничения: няма **forwarding**, малък прозорец (основният блок), структурни конфликти, задържане при WAR/WAW.\n\n### Алгоритъм на Томасуло (IBM System/360 Model 91, ~1967)\n- **Разпределен** вариант на Scoreboard: всяко ФУ има собствени **станции за резервиране (RS)** — пазят командата и операндите или **таговете** на ФУ, които ще ги произведат.\n- **Обща шина за данни (CDB)** — резултатът се излъчва с тага; всички чакащи RS и регистри го прихващат едновременно.\n- Фази: **Issue → Execute → Write Result**.\n- **Смяна на имената на регистрите** (register renaming) чрез тагове → **елиминира WAR и WAW**; остават само истинските **RAW** зависимости.\n\n| | Scoreboard | Томасуло |\n|---|---|---|\n| Контрол | централизиран | разпределен (RS) |\n| WAR/WAW | задържа | премахва чрез преименуване |\n| Предаване на резултата | през регистрите | по CDB към всички чакащи |\n| Първа реализация | CDC 6600 | IBM 360/91 |\n\n### Синхронизация на програмно ниво — VLIW\n- **Компилаторът** насрочва изпълнението на командите и разпределя ФУ → **VLIW (Very Long Instruction Word)** — процесор със **свръхдълга команда**; логическо разширение на **RISC**.\n- Формат: дългата дума съдържа полета (FP Add, FP Mult, Int ALU, Branch, Load/Store…), **всяко поле управлява директно едно ФУ**.\n- Характеристики:\n  - **единствен контролер / програмен брояч** издава всеки такт една дълга команда (обработка тип SIMD);\n  - всяка дълга команда инициира **няколко елементарни независими операции**;\n  - всяка операция заема **предварително известен брой цикли** (без апаратни блокировки);\n  - всяка операция може да се изпълнява **конвейерно**.\n- Работа на компилатора: класически оптимизации → **граф** на програмата на ниво команди → с евристики избира **най-вероятния път** → генераторът на код го пакетира в дълги думи, отчитайки **зависимостите по данни**, ФУ, регистри, шина, памет.\n- Преходи: команди за **сравнение**, които установяват **флаг** в едноразряден регистров файл, и **преход по флаг** (подобно на отложеното разклонение). Условен преход има на всеки **5–8 команди** → няколко прехода в една дума → **схема на приоритети** (компютри **TRACE**), определена от реда в изходната програма.\n- Няма арбитри на шина и опашки; взаимните блокировки при стандартна архитектура отнемат до **~15 % от такта** — при VLIW ги няма.\n- Реализации: FPS 120B/164, ИЗОТ 2001С, TRACE (Multiflow), ELI 512 (Йейл, 512 бита), **Transmeta Crusoe TM5700/TM5900** (128 бита, до 4 x86 команди), **Efficeon TM8800** (256 бита, до 8 x86 команди).\n\n**Пример:** c = 2·i·(2·a + 3·b), q = (a + b + c) − 4·(i + j) → **16** асемблерни операции; ФУ: INT1, INT2, FP1, FP2, LS1, LS2 (P = 6) → **7** свръхдълги думи.\n- **S = T1 / Tp = 16 / 7 ≈ 2,29**, **E = S / P = 2,29 / 6 ≈ 0,38** (T1 — време с едно устройство, Tp — с P устройства) → не всички ФУ работят едновременно.\n\n### EPIC — IA-64 (Intel Itanium)\n- Intel + HP от **1993**; Itanium (2001), Itanium 2 (2002); 64-битова VLIW-базирана архитектура, наречена **EPIC** (Explicit Parallel Instruction Computing).\n- Формат: **128 бита = 3 × 41-битови команди + 5-битов указател** за вида на опакованите команди (ползват се 24 от 32 комбинации).\n- Itanium 2: 6 целочислени ФУ, 2 FP, 2 за четене/запис, 3 за преходи; **8-степенен** конвейер; **2 EPIC команди за такт**.\n\n| x86 | IA-64 |\n|---|---|\n| команди с променлива дължина, по една | фиксирана дължина, групи по три |\n| преподреждане **по време на изпълнение** | преподреждане **по време на компилация** |\n| предсказва пътя на прехода | **спекулативно изпълнение** — изпълнява **двата пътя**, отхвърля ненужния |\n| зарежда данни, когато са нужни | **спекулативно зареждане** на данни преди да е ясна нуждата |\n\n### Сравнение на апаратната и програмната синхронизация\n| Критерий | Суперскаларна (апаратна) | VLIW (програмна) |\n|---|---|---|\n| Планиране | динамично, по време на изпълнение | статично, по време на компилация |\n| Двоична съвместимост | **да** — стар код работи на нов процесор | **не** — при ново поколение **рекомпилация** |\n| Хардуер | сложна, скъпа логика за декодиране/издаване (PowerPC 620, K5–K7, P5/P6/P4P) | по-прост |\n| Тактова честота | ограничена — декодирането и издаването имат **най-голяма латентност** | по-висока |\n| Мащабиране | трудно | лесно добавяне на ФУ |\n| Динамични ситуации (условни преходи) | адаптира се добре | по-слабо |\n| Програмист | не се намесва | не се намесва (за разлика от векторни/матрични/разпределени) |\n\n### TTA — Transport Triggered Architecture (MOVE процесор)\n- Краен вариант на RISC с множество ФУ — **само една команда: MOVE**; предложен от **Хенк Корпорал** (Делфт). Традиционните процесори са **OTA** (Operation Triggered).\n- `ADD r1, r2 → r3` става: `r1 → add_O` (операнд), `r2 → add_T` (**задействане** — ФУ стартира), `add_R → r3` (резултат).\n- Регистри: **O** (операнд), **T** (задействане), **R** (резултат) — принадлежат на ФУ, именовани и **достъпни за компилатора**; плюс общи r1…rN.\n- Компилаторът следи **мъртвото време** на ФУ; резултат може да мине директно в друго ФУ (`add_R → mul_O`). Преходите — чрез запис в **програмния брояч**.\n- Предимства: висока честота (долна граница на такта = трансфер между два регистъра), по-малко общи регистри, лесно мащабиране, нови оптимизации; опитен образец — **+25–50 %** производителност.\n\n### Капани за изпита\n- **Суперскаларна = апаратна** синхронизация; **VLIW = програмна** (компилатор). EPIC е разновидност на VLIW (Itanium), не на суперскаларната.\n- Трите причини за невъзможност на паралелно изпълнение: **ресурси, управление, данни** — за всяка дай мярката (дублиране; RISC/фиксиран формат; непоредно изпълнение). Конфликтите по данни **не могат да се премахнат** — само да се „скрият“.\n- Въпросът за **програмната** синхронизация пита и „как още се нарича“ → **VLIW / процесор със свръхдълга команда** (+ EPIC) — и задължително характеристиките (поле ↔ ФУ, един PC, известен брой цикли, конвейерни ФУ).\n- CPI < 1 е възможно **само** при множество ФУ.\n- Scoreboard: Issue проверява **WAW**, Read Operands — **RAW**, Write Result — **WAR**. Томасуло **премахва** WAR/WAW чрез преименуване.\n- S = 16/7 ≈ 2,29 и E = S/6 ≈ 0,38 — ефективността се дели на **броя ФУ** (6), не на броя думи.\n- Не бъркай VLIW (пакет независими операции от компилатора) със **съставните векторни команди** (фиксирана верига от конвейери, тема 7).","testNames":["A","B","C"],"tests":{"A":[{"id":"L06-A-1","n":1,"text":"В кой компютър за пръв път е приложена синхронизация на ФУ на апаратно ниво?","opts":["CDC 6600 (1964)","CRAY-1 (1974)","IBM System/360 Model 91","IBM System 370/168"],"correct":0,"expl":"Апаратната синхронизация се появява в **CDC 6600** през 1964 г."},{"id":"L06-A-2","n":2,"text":"Как още се нарича архитектурата с апаратна синхронизация на ФУ?","opts":["TTA (транспортно-спускова)","Суперскаларна","EPIC (явен паралелизъм)","VLIW (свръхдълга команда)"],"correct":1,"expl":"Конвейер с няколко паралелни ФУ в изпълнителната степен — **суперскаларна** архитектура."},{"id":"L06-A-3","n":3,"text":"Кой тип конфликт не може да се отстрани нито от компилатора, нито апаратно?","opts":["Зависимостта по управление","Структурният конфликт за ФУ","Конфликтът по данни","Конфликтът при достъп до ресурси"],"correct":2,"expl":"Зависимостта по данни е **свойство на програмата**; влиянието ѝ се намалява с непоредно изпълнение."},{"id":"L06-A-4","n":4,"text":"Как се намалява ефектът от конфликтите при достъп до ресурси?","opts":["Чрез смяна на имената на регистрите","Чрез вмъкване на NOP от компилатора","Чрез непоредно изпълнение на командите","Чрез дублиране на функционалните устройства"],"correct":3,"expl":"Няколко команди искат едно ФУ → **дублиране** на устройствата."},{"id":"L06-A-5","n":5,"text":"Каква може да бъде стойността на CPI при процесор с множество ФУ?","opts":["Винаги поне 2","По-малка от 1","Винаги точно 1","Равна на броя на ФУ"],"correct":1,"expl":"Идеалът за един конвейер е 1; при няколко ФУ в такт завършват повече команди → **CPI < 1**."},{"id":"L06-A-6","n":6,"text":"Каква е връзката между полетата на VLIW командата и ФУ?","opts":["Всяко поле управлява директно едно ФУ","Всички полета управляват общо АЛУ","Полетата задават реда на ФУ в конвейера","Всяко поле съдържа адрес на ФУ в паметта"],"correct":0,"expl":"Във VLIW **всяко поле** на дългата дума директно управлява **едно ФУ**."},{"id":"L06-A-7","n":7,"text":"Какъв е форматът на командния пакет в IA-64 (Itanium)?","opts":["128 бита: четири 32-битови команди и флаг","64 бита: две 27-битови команди и 10-битов код","256 бита: осем 32-битови команди без указател","128 бита: три 41-битови команди и 5-битов указател"],"correct":3,"expl":"EPIC пакет: **3 × 41 + 5 = 128** бита."},{"id":"L06-A-8","n":8,"text":"Какъв метод за планиране е Scoreboard?","opts":["Статично планиране от компилатора","Метод за предсказване на преходите","Централизиран метод за динамично планиране","Разпределен метод със станции за резервиране"],"correct":2,"expl":"Scoreboard (CDC 6600) е **централизиран**; Томасуло е разпределен."},{"id":"L06-A-9","n":9,"text":"16 операции са опаковани в 7 свръхдълги думи за процесор с 6 ФУ. Каква е ефективността?","opts":["≈ 0,38","≈ 0,44","≈ 0,62","≈ 2,29"],"correct":0,"expl":"S = 16/7 ≈ 2,29; **E = S/6 ≈ 0,38**."},{"id":"L06-A-10","n":10,"text":"Каква е единствената команда на TTA процесора?","opts":["LOAD","MOVE","ADD","JUMP"],"correct":1,"expl":"TTA = **MOVE processor** — операциите се задействат чрез трансфер на данни."}],"B":[{"id":"L06-B-1","n":1,"text":"Какво е „прозорец на изпълнение“ (Window of Execution)?","opts":["Броят тактове между издаването и записа на команда","Частта от кеша, съдържаща текущия основен блок","Наборът команди — кандидати за изпълнение в даден момент","Интервалът, в който ФУ не може да приема команди"],"correct":2,"expl":"Прозорецът е **наборът кандидати**; зависи от броя конвейери и степени."},{"id":"L06-B-2","n":2,"text":"Кой процесор е пример за стратегията „тесен и дълбок“ конвейер?","opts":["Transmeta Crusoe","Intel Itanium 2","Motorola G4","Intel P4P"],"correct":3,"expl":"**P4P** — малко конвейери с много степени; G4 — „широк и плитък“."},{"id":"L06-B-3","n":3,"text":"Защо суперскаларната архитектура е по-подходяща за RISC процесори?","opts":["Фиксираният формат позволява паралелно декодиране","RISC процесорите нямат команди за условен преход","RISC командите не създават зависимости по данни","RISC процесорите имат по-малко функционални устройства"],"correct":0,"expl":"При променлива дължина (CISC) следващата команда не се декодира преди края на текущата — **зависимост по управление**."},{"id":"L06-B-4","n":4,"text":"Кой е основният недостатък на VLIW архитектурата?","opts":["Липсата на конвейерни функционални устройства","При ново поколение процесори е нужна рекомпилация","Невъзможността да има повече от едно ФУ на тип","Сложната логика за динамично издаване на команди"],"correct":1,"expl":"Кодът е обвързан с микроархитектурата → няма **двоична съвместимост**."},{"id":"L06-B-5","n":5,"text":"Кое е основното предимство на апаратната синхронизация?","opts":["По-простата логика за декодиране","По-високата тактова честота","Лесното добавяне на нови ФУ","Двоичната съвместимост между поколенията"],"correct":3,"expl":"Код за старо поколение работи на ново **без рекомпилация**; другите три са предимства на VLIW."},{"id":"L06-B-6","n":6,"text":"Кое е ключовото нововъведение на алгоритъма на Томасуло?","opts":["Централната таблица на функционалните устройства","Пакетирането на команди в дълга дума","Смяната
