},{"id":"L05-O-5","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Какви са предимствата при транслиране на една CISC в няколко RISC инструкции в конвейера за команди на процесора IDT-C6? Как са решени изключенията?","src":"Контролна — тест 3, въпрос 4","solution":"IDT-C6 е x86-съвместим CISC процесор с вътрешно RISC ядро и 6-степенен конвейер (извличане, транслация, декодиране, адрес, изпълнение, обратен запис), като между транслацията и декодирането има опашка. В степента „транслация“ x86 командите с различна дължина и сложност се преобразуват в прости 33-битови RISC команди с еднакъв формат, които се конвейеризират лесно, изравняват времената на степените и опростяват управляващата логика, като се запазва двоичната съвместимост с x86. Изключенията се решават по два начина: сложните, рядко използвани x86 команди, които не се свеждат до една-две RISC команди, се изпълняват като последователност от RISC команди от микропрограмна памет (микрокод), а при прекъсване или изключителна ситуация, понеже командите се изпълняват поредно, конвейерът се изчиства и изпълнението се възстановява от командата, предизвикала изключението. Процесорът не е суперскаларен и няма апаратно предсказване на преходите, затова при взет преход конвейерът също се изчиства.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"x86 → 33-битови RISC команди в степен „транслация“","kw":["33","транслация"]},{"t":"Лесна конвейеризация, изравнени степени, по-проста логика","kw":["конвейеризират","изравняват","опростяват"]},{"t":"Запазена x86 съвместимост","kw":["съвместим"]},{"t":"Сложните команди — последователност от RISC команди (микрокод)","kw":["микрокод","микропрограмна","последователност"]},{"t":"Изчистване на конвейера при изключение/преход","kw":["изчиства"]}]}]},{"id":"L05-O-6","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Какви са предимствата и недостатъците на „дългите“ конвейери за команди в процесорите (притежаващи голям брой степени)?","src":"Контролна — тест 5, въпрос 2","solution":"Предимството на дългия конвейер е, че всяка степен извършва по-малка подфункция, тактът се скъсява и тактовата честота расте (P6 удвоява степените спрямо P5 и достига около 1,5 пъти по-висока честота, а P4P има 28 степени), като едновременно се обработват повече команди. Недостатъкът е, че ускорението не расте пропорционално на броя степени, защото във всяка степен има допълнителни загуби за прехвърляне между фиксаторите, а обемът на управляващата логика за отчитане на зависимостите нараства стремително. С увеличаване на степените растат загубите от командите за преход (при грешно предсказване се изчистват повече степени), задълбочават се междукомандните зависимости и трудностите при прекъсванията. Освен това дълбокият конвейер трябва непрекъснато да се захранва с команди (дълбоки буфери, до 126 команди в P4P), иначе се появяват мехурчета, всяко от които води до много загубени цикли.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"По-висока тактова честота","kw":["честота"]},{"t":"Непропорционално ускорение — загуби във фиксаторите","kw":["фиксатор","пропорционално"]},{"t":"Рязко нарастване на управляващата логика","kw":["управляващата логика"]},{"t":"По-големи загуби при преходи","kw":["преход","изчистват"]},{"t":"Мехурчета при недостатъчно захранване","kw":["мехур","захранва"]}]}]},{"id":"L05-O-7","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Коя в общия случай е „най-дългата“ степен в конвейера за команди на един процесор и защо?","src":"Контролна — тест 5, въпрос 5","solution":"В общия случай най-дълга е степента на изпълнение (E), тъй като времето за изпълнение на командата като правило е значително по-голямо от времето за извличането ѝ — тя включва четене на регистровия файл, операции в АЛУ, а при някои команди и обръщение към паметта или многотактови операции. Понеже скоростта на конвейера се определя от най-бавната степен, именно тя задава продължителността на такта и ограничава ускорението. Затова в първата степен се натоварват повече функции (извличане, декодиране, определяне на адреса), а фаза E се разделя на подфази E1 и E2, което скъсява такта приблизително наполовина (в примера от учебника ускорението става 2,6 пъти). При суперскаларните процесори със сложна логика като най-латентни се посочват и фазите на декодиране и издаване на командите.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Степента на изпълнение (E)","kw":["степента на изпълнение","фаза e"]},{"t":"Причина: регистров файл, АЛУ, памет","kw":["алу","регистровия"]},{"t":"Най-бавната степен определя такта","kw":["най-бавната","такта"]},{"t":"Разделяне на E1 и E2","kw":["e1","разделя"]}]}]},{"id":"L05-O-8","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Защо двустепенният конвейер (извличане — изпълнение) практически не удвоява скоростта и чрез какви прийоми се увеличава неговото ускорение?","src":"","solution":"При предварителното извличане първата степен (IF) извлича и буферира следващата команда, докато втората (E) изпълнява текущата, но удвояване на скоростта е малко вероятно по две причини. Първо, времето за изпълнение като правило е много по-голямо от времето за извличане, и второ, при команди за преход не се знае коя е следващата команда, затова конвейерът чака или отхвърля вече извлечената команда. Ускорението се увеличава, като в първата степен (IF-устройство) се изпълняват повече функции — извличане, декодиране, определяне на адреса на операнда — и между степените се поставя фиксатор от регистров файл, който позволява относително независима работа. Вторият прийом е конвейер с повече степени, всяка реализираща отделен етап, който се предпочита в съвременните процесори, докато по-старите (i8086) използват първия.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Изпълнението е по-дълго от извличането","kw":["по-голямо от времето"]},{"t":"Преходите — следващата команда е неизвестна","kw":["преход"]},{"t":"Повече функции в IF-устройството","kw":["повече функции","декодиране"]},{"t":"Фиксатор — регистров файл","kw":["фиксатор","регистров файл"]},{"t":"Конвейер с повече степени","kw":["повече степени"]}]}]},{"id":"L05-O-9","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Как организацията на паметта (обща или отделни памети за данни и команди) влияе на конвейерното изпълнение на командите? Обяснете с примерния фрагмент LOAD, LOAD, ADD, STORE, JUMP.","src":"","solution":"Без конвейер фрагментът отнема 13 такта, тъй като аритметичните команди имат фази IF и E, а командите LOAD и STORE — IF, E и D (обръщение към паметта). При обща памет за данни и команди фазите IF и D на различни команди не могат да стартират в един такт (структурен конфликт за паметта), затова ADD се задържа два такта и изпълнението отнема 8 такта — повишаване с 62,5%. При отделни памети IF и D се съвместяват и са нужни 7 такта (повишаване с 85,7%), като ADD пак се задържа, но заради конфликт по данни (регистър B още не е зареден), а теоретичното ускорение е до 3 пъти. Ако фаза E се раздели на E1 и E2 и тактът се скъси наполовина, производителността нараства 2,6 пъти спрямо неконвейерното изпълнение.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"13 такта без конвейер","kw":["13"]},{"t":"Обща памет: 8 такта, 62,5%","kw":["8 такта","62,5"]},{"t":"Отделни памети: 7 такта, 85,7%","kw":["7 такта","85,7"]},{"t":"Структурен конфликт срещу конфликт по данни","kw":["структурен","по данни"]},{"t":"E1/E2 → 2,6 пъти","kw":["2,6","e1"]}]}]},{"id":"L05-O-10","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Каква е разликата между отложеното и оптимизираното разклонение? Какво представляват концепциите на Станфорд и на Бъркли?","src":"","solution":"При отложеното разклонение компилаторът вмъква команди NOP след командата за преход (и между зависими команди), за да могат програмният брояч или регистърът да получат правилната стойност; това е концепцията на Станфорд и тя увеличава обема на програмата. При концепцията на Бъркли вместо NOP се задържа изпълнението на конфликтната команда в конвейера. Оптимизираното разклонение реорганизира кода — командата за преход си разменя мястото с непосредствено предхождащата я независима полезна команда, така че слотът след прехода се запълва с реална работа и обемът не нараства. Разместването е ефективно при безусловни преходи и връщане от подпрограми, а при условен преход, чието условие се изменя от предходната команда, все пак се вмъква NOP.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Отложено разклонение = NOP","kw":["nop"]},{"t":"Концепция на Станфорд","kw":["станфорд"]},{"t":"Концепция на Бъркли — задържане","kw":["бъркли","задържа"]},{"t":"Оптимизирано = размяна на команди","kw":["разменя","реорганиз"]},{"t":"Обем на програмата","kw":["обем"]}]}]},{"id":"L05-O-11","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Опишете организацията на конвейерите в процесора P5 (Pentium) и правилата за сдвояване на командите.","src":"","solution":"P5 е суперскаларен процесор с два целочислени конвейера U и V, всеки с пет фази — IF (извличане), D1 (декодиране), D2 (формиране на адреса), EX (изпълнение в АЛУ и достъп до кеша за данни) и WB (запис в регистрите), както и 8-степенен FPU конвейер. Конвейерът U изпълнява всяка x86 команда, а V — само прости, апаратно реализирани команди и FXCHG, като командата за V е винаги втора в двойката. За сдвояване двете команди трябва да са прости и да нямат зависимост по регистри, а паралелно изпълнение на целочислени и FP команди не се допуска. Преходите се предсказват чрез BTB с битове за предисторията, при грешно предсказване конвейерите се изчистват, а редът на изпълнение не може да се променя — зависимостите се решават чрез строги правила в управлението.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Два конвейера U и V","kw":["u и v"]},{"t":"Пет фази IF, D1, D2, EX, WB","kw":["d1","d2"]},{"t":"V — само прости команди и FXCHG","kw":["прости","fxchg"]},{"t":"Без зависимост по регистри","kw":["зависимост по регистри"]},{"t":"BTB, поредно изпълнение","kw":["btb","строги правила"]}]}]},{"id":"L05-O-12","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Кои са основните нововъведения в конвейерите на архитектурата P6 спрямо P5?","src":"","solution":"P6 (Pentium Pro, II, III) има три целочислени конвейера и 14-степенен конвейер, разделен на три секции — поредно изпълнение, непоредно изпълнение и оттегляне (retire), отделени чрез буфериране в станцията за резервиране. Всяка x86 команда се транслира в RISC-подобни микрооперации, което облекчава конвейеризацията на CISC командите. Прилага се непоредно изпълнение — командите, които не могат да се изпълнят веднага, се отделят настрана и се изпълняват готовите, а смяната на имената на регистрите премахва WAR и WAW конфликтите и тясното място от малкия брой архитектурни регистри. Недостатък е, че при 16-битов код четенето на цял регистър след запис в негова 8- или 16-битова част забавя процесора със 7 и повече цикъла, затова P6 изисква 32-битова ОС и приложения.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"14 степени в три секции","kw":["14"]},{"t":"Микрооперации","kw":["микроопер"]},{"t":"Непоредно изпълнение","kw":["непоредно"]},{"t":"Смяна на имената на регистрите","kw":["имената на регистрите"]},{"t":"Станция за резервиране","kw":["резервиране"]}]}]},{"id":"L05-O-13","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Какви са особеностите на конвейера в P4P (NetBurst) и каква е ролята на кеш паметта за следите (trace cache)?","src":"","solution":"P4P има дълбок конвейер от 28 степени — около два пъти по-дълъг от P6, което позволява по-висока тактова честота, но изисква непрекъснато захранване с команди, иначе възникват мехурчета с много загубени цикли. Затова в него има дълбоки буфери с до 126 команди в различните степени, които изпълнителната логика проверява за зависимости и преподрежда. Кешът за следите е L1 кеш за команди в машината за предварителна обработка, който пази не x86 команди, а вече транслирани и декодирани микрооперации, подредени в следи, така че многократно изпълняваният код не се транслира отново. Той работи в режим на изпълнение и в режим на изграждане на следите, предсказването на преходите (BPU) е вградено в следата, а дългите x86 команди се заместват с указател към микрокодова ROM.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"28 степени","kw":["28"]},{"t":"Риск от мехурчета, нужда от захранване","kw":["мехур","захранване"]},{"t":"Пази декодирани микрооперации в следи","kw":["микроопер","следи"]},{"t":"Няма повторна транслация","kw":["отново"]},{"t":"BPU и микрокодова ROM","kw":["bpu","rom"]}]}]},{"id":"L05-O-14","group":"L05","lec":5,"title":"Конвейерно изпълнение на командите","text":"Как се оценява влиянието на командите за преход върху ефективността на конвейера за команди чрез аналитичен модел? Какви изводи следват?","src":"","solution":"Нека L е броят на степените, n — броят на командите, p — вероятността за команда за преход (около 0,2) и g — вероятността за успешно разклонение (около 0,6), при което няма загуба. Общият брой тактове е n(1−p) + n·p·g + n·p·(1−g)·L, а при n >> L ефективността е E = 1/[1 − p + p·g + p·(1−g)·L], докато действителното ускорение е S = L·E. Например при p = 0,2, g = 0,6 и L = 5 ефективността е около 0,76 и S ≈ 3,8, а при L = 10 тя пада до около 0,58. Изводът е, че загубите от преходите растат с броя на степените и с p, затова дългите конвейери изискват добро предсказване на преходите (голямо g).","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Параметри L, n, p, g","kw":["вероятност"]},{"t":"Формула за ефективността","kw":["ефективност","e = 1/"]},{"t":"S = L·E","kw":["l·e"]},{"t":"Загубите растат с L — нужно добро предсказване","kw":["растат","предсказване"]}]}]},{"id":"L06-O-1","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Как се реализира синхронизацията на апаратно ниво при суперскаларните процесори между различните функционални устройства? Кои са основните причини, поради които не винаги е възможно паралелното изпълнение на командите в тези процесори?","src":"Изпит — вариант 1, въпрос 5","solution":"При апаратната синхронизация (CDC 6600, 1964) процесорът е конвейер за команди, в чиято изпълнителна степен работят паралелно няколко функционални устройства, обменящи данни само с регистрите, а апаратна логика по време на изпълнението динамично разпределя командите към тях (например чрез Scoreboard или алгоритъма на Томасуло). Командите се избират от достатъчно голям прозорец на изпълнение и могат да се изпълняват непоредно, но резултатът трябва да съвпада с последователното изпълнение. Паралелното изпълнение не винаги е възможно поради три причини: конфликти при достъп до ресурси (няколко команди искат едно ФУ — решава се с дублиране), зависимост по управление (разклонения и команди с променлива дължина, затова архитектурата е по-подходяща за RISC) и конфликти по данни. Зависимостта по данни е свойство на програмата и не може да се отстрани нито от компилатора, нито апаратно — нейното влияние се намалява чрез непоредно изпълнение на други, готови команди.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Динамично, по време на изпълнение; ФУ в изпълнителната степен","kw":["по време на изпълнението","динамично"]},{"t":"Прозорец на изпълнение, непоредно изпълнение","kw":["прозорец","непоредно"]},{"t":"Конфликти при достъп до ресурси — дублиране","kw":["ресурси","дублиране"]},{"t":"Зависимост по управление — преходи, променлива дължина","kw":["по управление","променлива дължина"]},{"t":"Конфликти по данни — свойство на програмата","kw":["по данни","свойство на програмата"]}]}]},{"id":"L06-O-2","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Как се реализира синхронизацията на програмно ниво при суперскаларните процесори с множество функционални устройства? Как още се нарича тази архитектура и какви характеристики притежава тя?","src":"Изпит — вариант 2, въпрос 4","solution":"При програмната синхронизация компилаторът е отговорен за насрочването на командите — той строи граф на програмата на ниво команди, избира най-вероятния път и пакетира независими прости операции в една свръхдълга дума, отчитайки зависимостите по данни и наличните ФУ, регистри и шини. Архитектурата се нарича VLIW (Very Long Instruction Word) — процесор със свръхдълга команда, логическо разширение на RISC, а при Intel Itanium (IA-64) тя е развита като EPIC. Характеристиките ѝ са: единствен контролер и програмен брояч издава всеки такт една дълга команда, всяко поле на която директно управлява едно ФУ, а всяка операция заема предварително известен брой цикли и може да се изпълнява конвейерно, без апаратни блокировки. Така хардуерът е по-прост и с по-висока честота, но кодът зависи от микроархитектурата и при нов процесор е нужна рекомпилация.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Компилаторът насрочва командите","kw":["компилатор"]},{"t":"VLIW — процесор със свръхдълга команда","kw":["vliw","свръхдълга"]},{"t":"Всяко поле управлява едно ФУ, един програмен брояч","kw":["поле","програмен брояч"]},{"t":"Известен брой цикли, без блокировки","kw":["известен брой","блокировки"]},{"t":"Прост хардуер, но рекомпилация","kw":["рекомпилация","по-прост"]}]}]},{"id":"L06-O-3","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Какво представляват функционалните устройства в процесора и защо е необходима синхронизация между тях?","src":"","solution":"Функционалните устройства (ФУ) са апаратни блокове в единичния процесор, всеки активиран от отделна команда; те могат да са универсални или специализирани, да се повтарят, а също да са прости (следващата операция чака предишната) или конвейерни. За разлика от векторния процесор те не изискват регулярност на данните и дават максимална производителност и при скаларни операции, а за разлика от мултипроцесорите нямат съществени комуникационни разходи. Синхронизация е нужна, защото различните команди се изпълняват за различно време, времето зависи от местоположението на операндите и на резултата, а входните операнди на една команда може да са резултат на друга, изпълнявана в същото време (зависимост по данни). Проблемът се решава апаратно (суперскаларни процесори) или програмно (VLIW), като и в двата случая се реализира паралелизъм на ниво команди (ILP), невидим за потребителя.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Видове ФУ: универсални/специализирани, прости/конвейерни","kw":["специализ","конвейерни"]},{"t":"Без изискване за регулярност на данните","kw":["регулярност","скаларни"]},{"t":"Различно време за изпълнение и местоположение на данните","kw":["различно време","местоположението"]},{"t":"Зависимост по данни","kw":["зависимост по данни"]},{"t":"Апаратно или програмно, ILP","kw":["ilp","апаратно"]}]}]},{"id":"L06-O-4","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Какво е прозорец на изпълнение и как се оценява ефективността на процесор с множество функционални устройства?","src":"","solution":"В суперскаларните процесори командите се разпределят динамично и редът на избирането им може да не съвпада с програмния, но резултатът трябва да е същият като при последователно изпълнение. За ефективно непоредно изпълнение е нужен достатъчно голям прозорец на изпълнение (Window of Execution) — наборът команди, които в даден момент са кандидати за изпълнение, като размерът му зависи от броя на конвейерите и броя на степените им. Показател за ефективността е CPI — средният брой тактове за изпълнение на една команда, като колкото е по-нисък, толкова по-висока е производителността. Идеалната стойност е 1 за процесор с един конвейер, а при множество ФУ CPI може да е по-малко от 1, ако в един такт завършват няколко команди.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Динамично, непоредно разпределение","kw":["динамично","непоредно"]},{"t":"Прозорец — команди-кандидати","kw":["прозорец","кандидати"]},{"t":"Зависи от броя конвейери и степени","kw":["броя на конвейерите"]},{"t":"CPI — среден брой тактове за команда","kw":["cpi","средн"]},{"t":"CPI < 1 при множество ФУ","kw":["по-малко от 1"]}]}]},{"id":"L06-O-5","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Кои са двете стратегии за постигане на по-висока производителност на процесорите с множество функционални устройства? Сравнете ги.","src":"","solution":"Първата стратегия е „широк и плитък“ конвейер — процесорът има повече на брой паралелни конвейери, всеки с малко степени, както е при Motorola G4. Втората е „тесен и дълбок“ конвейер — по-малко конвейери, но с много степени, което позволява висока тактова честота, както е при Intel P4P с 28 степени. Широкият подход разчита на повече паралелно изпълнявани команди в такт (CPI под 1), но изисква повече ФУ и по-сложна логика за издаване, а дълбокият разчита на по-къс такт, но страда повече от преходите и зависимостите и изисква непрекъснато захранване с команди. И двете стратегии целят изпълнение на повече команди за секунда.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"„Широк и плитък“ — много конвейери, малко степени","kw":["широк","плитък"]},{"t":"Пример Motorola G4","kw":["g4"]},{"t":"„Тесен и дълбок“ — малко конвейери, много степени","kw":["тесен","дълбок"]},{"t":"Пример Intel P4P","kw":["p4p"]},{"t":"Компромис: паралелизъм срещу такт и преходи","kw":["преходите","такт"]}]}]},{"id":"L06-O-6","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Сравнете синхронизацията на апаратно и на програмно ниво при процесорите с множество функционални устройства — предимства и недостатъци на двата подхода.","src":"","solution":"Апаратната (суперскаларна) синхронизация осигурява двоична съвместимост — код за едно поколение работи коректно на следващото без рекомпилация, и се адаптира добре към динамични ситуации като условните преходи. Цената е сложната и скъпа в транзистори логика за декодиране и издаване (PowerPC 620, AMD K5–K7, Intel P5, P6, P4P), чиито фази имат най-голяма латентност и ограничават тактовата честота, а взаимните блокировки отнемат до 15% от такта. Програмната (VLIW) синхронизация има по-прост хардуер, по-висока честота, лесно добавяне на нови ФУ и не изисква намеса на програмиста. Нейни недостатъци са, че компилаторът трябва да познава микроархитектурата, кодът е специфичен за конкретния чип и при ново поколение се налага рекомпилация, а условните преходи се обработват по-трудно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Апаратна: двоична съвместимост","kw":["съвместимост"]},{"t":"Апаратна: сложна логика за декодиране/издаване, латентност","kw":["декодиране","латентност"]},{"t":"VLIW: по-прост хардуер, по-висока честота, мащабиране","kw":["по-прост","по-висока честота"]},{"t":"VLIW: рекомпилация, зависимост от микроархитектурата","kw":["рекомпилация","микроархитектурата"]},{"t":"Условните преходи","kw":["преходи"]}]}]},{"id":"L06-O-7","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Как компилаторът формира свръхдългите команди във VLIW процесор и как се обработват условните преходи?","src":"","solution":"След класическите оптимизации компилаторът строи граф на изпълнимата програма на ниво отделни команди и с евристични оценки за вероятността на преходите избира най-вероятния път, който генераторът на код разглежда като път без преходи. Генераторът пакетира операциите в дълги думи, като отчита зависимостите по данни и оптималното разпределение на ФУ, регистрите, шината и обръщенията към паметта. За преходите има команди за сравнение, които установяват флаг в едноразряден регистров файл, и команда за преход по флаг, така че сравнението може да се постави където е удобно — подобно на отложеното разклонение. Понеже условен преход се среща на всеки 5–8 команди, в една дълга дума може да има няколко прехода, затова в компютрите TRACE е въведена схема на приоритети, определена от реда на преходите в изходната програма.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Граф на програмата на ниво команди","kw":["граф"]},{"t":"Избор на най-вероятния път","kw":["най-вероятния път"]},{"t":"Пакетиране с отчитане на зависимостите","kw":["пакетира","зависимост"]},{"t":"Сравнение с флаг и преход по флаг","kw":["флаг"]},{"t":"Схема на приоритети (TRACE)","kw":["приоритет","trace"]}]}]},{"id":"L06-O-8","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Какви са особеностите на архитектурата IA-64 (EPIC) на процесорите Intel Itanium и с какво се различава тя от x86?","src":"","solution":"IA-64 е 64-битова VLIW-базирана архитектура, разработвана от Intel и HP от 1993 и наречена EPIC (Explicit Parallel Instruction Computing). Командата е 128-битов пакет от три 41-битови команди и 5-битов указател, който посочва вида на опакованите команди, а Itanium 2 има 6 целочислени ФУ, 2 за плаваща запетая, 2 за четене/запис и 3 за преходи, 8-степенен конвейер и обработва 2 EPIC команди за такт. За разлика от x86 командите са с фиксирана дължина, а преподреждането и оптимизацията на потока се правят по време на компилация, не по време на изпълнение. Вместо да предсказва преходите, IA-64 изпълнява и двата пътя на прехода и отхвърля ненужния резултат (спекулативно изпълнение), а данните се зареждат спекулативно, преди да е ясна необходимостта от тях.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"EPIC — VLIW-базирана, Intel + HP","kw":["epic"]},{"t":"128 бита = 3 × 41 + 5-битов указател","kw":["128","41"]},{"t":"Оптимизация по време на компилация","kw":["компилация"]},{"t":"Спекулативно изпълнение на двата пътя","kw":["спекулативно","двата пътя"]},{"t":"8-степенен конвейер, 2 команди за такт","kw":["8-степенен","2 epic"]}]}]},{"id":"L06-O-9","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Опишете алгоритъма Scoreboard за динамично планиране на командите.","src":"","solution":"Scoreboard е централизиран метод за динамично планиране, въведен в CDC 6600, при който изпълнението на всяка команда минава през четири фази. При издаването (Issue) се проверява дали има свободно ФУ и дали няма WAW конфликт, при четенето на операндите (Read Operands) се изчаква наличието им, с което се решават RAW конфликтите, следва изпълнение (Execution), а при записа на резултата (Write Result) се проверява за WAR конфликти. Scoreboard поддържа три таблици — на командите (в коя фаза е всяка), на функционалните устройства (заето или свободно, операция, регистри, готовност) и на регистрите (кое ФУ ще запише резултат в тях). Ограниченията му са липсата на препращане (forwarding), малкият прозорец в рамките на основния блок, структурните конфликти и задържането при WAR и WAW.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Централизиран, CDC 6600","kw":["централизиран","cdc 6600"]},{"t":"Четири фази: Issue, Read Operands, Execution, Write Result","kw":["четири фази","issue"]},{"t":"Проверки WAW / RAW / WAR","kw":["raw","war","waw"]},{"t":"Три таблици за статус","kw":["таблици"]},{"t":"Ограничения (без forwarding, малък прозорец)","kw":["forwarding","ограниченията"]}]}]},{"id":"L06-O-10","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Каква е същността на алгоритъма на Томасуло и с какво се отличава от Scoreboard?","src":"","solution":"Алгоритъмът на Томасуло е разработен за IBM System/360 Model 91 и е разпределен вариант на Scoreboard, при който всяко ФУ има собствени станции за резервиране (RS), буфериращи командата заедно с операндите или с таговете на устройствата, които ще ги произведат. Резултатът се излъчва по общата шина за данни (CDB) заедно с тага и едновременно се прихваща от всички чакащи RS и регистри, а командата минава през фазите Issue, Execute и Write Result. Ключовото нововъведение е смяната на имената на регистрите чрез тагове, която елиминира WAR и WAW конфликтите, така че единствено ограничение остават истинските RAW зависимости. За разлика от централизирания Scoreboard контролът е разпределен по станциите и е възможно истинско непоредно изпълнение.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"IBM 360/91","kw":["360"]},{"t":"Станции за резервиране с тагове","kw":["станции за резервиране","таг"]},{"t":"Обща шина за данни (CDB)","kw":["cdb","обща шина"]},{"t":"Смяна на имената на регистрите — без WAR/WAW","kw":["имената на регистрите"]},{"t":"Разпределен контрол срещу централизиран","kw":["разпределен"]}]}]},{"id":"L06-O-11","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Какво представлява TTA (MOVE) процесорът и какви са неговите предимства?","src":"","solution":"TTA (Transport Triggered Architecture) е краен вариант на RISC процесор с множество ФУ, който има само една команда — MOVE, затова се нарича и MOVE процесор (предложен от Хенк Корпорал от Делфт). Всяка операция като ADD r1, r2 → r3 се разбива на три трансфера — операнд в регистъра за операнд (O), втори операнд в задействащия регистър (T), който стартира ФУ, и прехвърляне на резултата от регистъра за резултат (R), като тези регистри са именовани и достъпни за компилатора, който следи и мъртвото време на ФУ. Предимствата са висока тактова честота (долната граница на такта е времето за трансфер между два регистъра), по-малко общи регистри поради директно препращане на резултати между ФУ, лесно мащабиране и нови компилаторни оптимизации. Опитен образец е показал с 25–50% по-висока производителност от класически процесор с еквивалентни ФУ и същата честота.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Една команда — MOVE","kw":["move"]},{"t":"Регистри O, T, R; задействане при запис в T","kw":["задействащ","(t)"]},{"t":"Регистрите са видими за компилатора","kw":["компилатор"]},{"t":"Висока тактова честота","kw":["честота"]},{"t":"Директно препращане, по-малко общи регистри","kw":["препращане","общи регистри"]}]}]},{"id":"L06-O-12","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Обяснете примера за опаковане на програмен фрагмент в свръхдълги команди за VLIW процесор и как се оценяват ускорението и ефективността.","src":"","solution":"Изразите c = 2·i·(2·a + 3·b) и q = (a + b + c) − 4·(i + j) компилаторът превежда в 16 стандартни асемблерни операции (зареждания, умножения, събирания и записи). При процесор с шест ФУ — INT1, INT2, FP1, FP2, LS1 и LS2 — те се опаковат в 7 свръхдълги думи, като се спазват зависимостите по данни. Ако времето за една асемблерна и една дълга команда е еднакво, ускорението е S = T1/Tp = 16/7 ≈ 2,29, а ефективността E = S/P = 2,29/6 ≈ 0,38. Ниската ефективност показва, че не всички ФУ се използват едновременно, защото зависимостите по данни ограничават паралелизма.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"16 асемблерни операции","kw":["16"]},{"t":"7 свръхдълги думи, 6 ФУ","kw":["7 свръхдълги"]},{"t":"S ≈ 2,29","kw":["2,29"]},{"t":"E ≈ 0,38","kw":["0,38"]},{"t":"Причина — не всички ФУ работят, зависимости","kw":["не всички фу","зависимостите"]}]}]},{"id":"L06-O-13","group":"L06","lec":6,"title":"Процесори с множество ФУ","text":"Защо суперскаларната архитектура е по-подходяща за RISC, отколкото за CISC процесори?","src":"","solution":"Една от причините паралелното изпълнение в суперскаларния процесор да не е винаги възможно е зависимостта по управление, която освен разклоненията включва и командите с променлива дължина. При CISC (x86) команди с променлива дължина изборът и декодирането на следващата команда не могат да започнат, преди да завърши декодирането на предходната, което ограничава броя команди, издавани в такт. RISC командите са с фиксиран формат и дължина, затова границите им са известни предварително и няколко команди се декодират и издават паралелно. Затова съвременните x86 процесори (P6, P4P) вътрешно транслират командите в RISC-подобни микрооперации, преди да ги разпределят към функционалните устройства.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Зависимост по управление","kw":["зависимостта по управление"]},{"t":"Променлива дължина — последователно декодиране","kw":["променлива дължина"]},{"t":"Фиксиран формат на RISC","kw":["фиксиран"]},{"t":"Транслация в микрооперации при x86","kw":["микроопер"]}]}]},{"id":"L07-O-1","group":"L07","lec":7,"title":"Векторни процесори","text":"Кои са основните фактори, които повишават производителността и ефективността на конвейерите за данни при векторните процесори?","src":"Изпит — вариант 1, въпрос 6","solution":"Ускорението на операционния конвейер е S ≈ L·n/(σ + L + n − 1) и клони към броя степени L, затова то расте с увеличаване на дължината на вектора n, при която по-пълно се амортизират времето за инициализация σ и запълването на конвейера, а ефективността E = n/(σ + L + n − 1) изисква n да е много по-голямо от σ + L. Вторият фактор е намаляването на σ — данните се държат във векторни регистри, а паметта трябва да има поне три пъти по-широка лента (разслоена памет, вътрешна бърза памет) и последователна стъпка на достъп без конфликти. Трети фактор е броят на паралелно работещите конвейери, които дават почти k пъти по-висока производителност при дълги вектори, както и броят на степените L, който повишава пределното ускорение, но увеличава загубите при къси вектори. Четвърти фактор са съставните (сцепени) команди — макроконвейер, при който изходът на един конвейер постъпва директно на входа на следващия без междинен запис в паметта, а σ се плаща веднъж.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Дълги вектори (n ≫ σ + L)","kw":["дължината на вектора","много по-голямо"]},{"t":"Малко време за инициализация σ, векторни регистри","kw":["инициализация","векторни регистри"]},{"t":"Широка лента — разслоена памет","kw":["разслоена","лента"]},{"t":"Брой паралелни конвейери и степени","kw":["паралелно работещите","k пъти"]},{"t":"Съставни команди — макроконвейер","kw":["съставни","макроконвейер"]}]}]},{"id":"L07-O-2","group":"L07","lec":7,"title":"Векторни процесори","text":"На колко нива може да се осигури конвейерна обработка във векторния процесор и кои са тези нива?","src":"Изпит — вариант 2, въпрос 6","solution":"Конвейерна обработка във векторния процесор може да се осигури на три нива. Първото е конвейерът за команди — векторните команди се извличат, декодират и изпълняват конвейерно, като една векторна команда замества цял цикъл от скаларни команди и се декодира само веднъж. Второто ниво е операционният (аритметичен) конвейер — всяко функционално устройство (ADD, MULT, DIV) е многостепенен конвейер, през чиито степени последователно преминават двойките елементи на векторите, като на всеки такт се получава нов резултат. Третото ниво е макроконвейерът — няколко операционни конвейера се свързват последователно (съставни команди), така че резултатът на единия постъпва директно на входа на следващия без запис в паметта, а освен това независими векторна и скаларна команда могат да се изпълняват паралелно.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Три нива","kw":["три нива"]},{"t":"Конвейер за команди","kw":["конвейерът за команди"]},{"t":"Операционен (аритметичен) конвейер в ФУ","kw":["операционният","аритметичен"]},{"t":"Макроконвейер — свързани конвейери","kw":["макроконвейер"]},{"t":"Паралелно векторна и скаларна команда","kw":["скаларна"]}]}]},{"id":"L07-O-3","group":"L07","lec":7,"title":"Векторни процесори","text":"Какви са предимствата и недостатъците при използване на съставни векторни команди при векторните процесори?","src":"Контролна — тест 3, въпрос 3; тест 5, въпрос 3","solution":"Съставните команди обединяват най-често срещаните последователности от векторни операции в една команда (например V = S·V + S·V, V = V·V + V·V, V = V + S·V), като за тях няколко аритметични конвейера работят паралелно или последователно, сцепени в макроконвейер. Предимствата са, че междинните резултати не се записват в паметта, а преминават директно от един конвейер в следващия, което намалява трафика към паметта, времето за инициализация се плаща веднъж и се декодират по-малко команди. Освен това при прекъсване се съхранява информация само за една команда, а не за няколко паралелно изпълнявани команди. Недостатъците са по-сложният и скъп хардуер, зависимостта на структурата им от конкретния процесор, ограничената гъвкавост (само предварително дефинирани комбинации), увеличеният брой кодове на операциите и нуждата компилаторът да разпознава подходящите шаблони.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Обединяват чести последователности от операции","kw":["последователности","обединяват"]},{"t":"Без междинен запис в паметта","kw":["паметта","директно"]},{"t":"При прекъсване — състояние на една команда","kw":["прекъсване"]},{"t":"По-сложен хардуер, зависим от процесора","kw":["хардуер","сложн"]},{"t":"Малка гъвкавост, повече кодове","kw":["гъвкавост","кодове"]}]}]},{"id":"L07-O-4","group":"L07","lec":7,"title":"Векторни процесори","text":"Кои са двата подхода за изграждане на архитектура за обработка на масиви от данни? Какво е вектор, векторна обработка и векторизация?","src":"","solution":"Първият подход е съвместяване по време (конвейеризация) на изпълнението на командите, обработващи векторите — така работят векторните процесори (CRAY-1, Fujitsu VP, NEC SX), а вторият е пространственото повторение, при което множество процесори, свързани най-често в матрица, изпълняват едновременно една команда (SIMD, матрични процесори). Векторът е набор от скаларни данни от един и същ тип, съхранявани в паметта с фиксирано адресно нарастване между съседните елементи, наречено стъпка. Векторна обработка има, когато аритметични или логически операции се прилагат върху цели вектори, като вместо цикъл от скаларни команди се изпълнява една команда C = A + B, декодирана само веднъж. Преобразуването от скаларен към векторен код се нарича векторизация, а компилаторите, които го извършват — векторизиращи компилатори.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Съвместяване по време — векторни процесори","kw":["по време","конвейеризация"]},{"t":"Пространствено повторение — SIMD","kw":["пространствено","simd"]},{"t":"Вектор — данни от един тип с фиксирана стъпка","kw":["стъпка","един и същ тип"]},{"t":"Една векторна команда вместо цикъл","kw":["една команда","веднъж"]},{"t":"Векторизация, векторизиращи компилатори","kw":["векторизация"]}]}]},{"id":"L07-O-5","group":"L07","lec":7,"title":"Векторни процесори","text":"Каква е разликата между пълен и присъединен векторен процесор? Какви са предимствата и недостатъците на присъединения?","src":"","solution":"Пълният векторен процесор е интегрирано устройство (по-правилно — векторен компютър), предназначено за обработка както на вектори, така и на скалари. Присъединеният векторен процесор е специализирано устройство, свързано чрез канал към скаларен компютър, който го вижда като периферно устройство и така разширява възможностите си за обработка на вектори и матрици. Недостатъкът на присъединения процесор е по-ниската скорост на обмен на данни през канала, което води до по-ниска производителност от тази на пълния. Предимствата му са значително по-ниската цена и възможността да се включва само когато е нужно ефективно решаване на матрични задачи.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Пълен — интегриран векторен компютър за вектори и скалари","kw":["интегрирано","скалари"]},{"t":"Присъединен — чрез канал, като периферно устройство","kw":["канал","периферно"]},{"t":"По-ниска скорост на обмен и производителност","kw":["скорост на обмен","по-ниска производителност"]},{"t":"По-ниска цена, включване при нужда","kw":["цена"]}]}]},{"id":"L07-O-6","group":"L07","lec":7,"title":"Векторни процесори","text":"Опишете обобщената структура на векторния процесор и предназначението на основните му функционални блокове.","src":"","solution":"Векторният процесор е набор от хардуерни ресурси — векторни регистри, функционални конвейери, обработващи елементи и броячи за векторните операции, като управлението се осъществява от управляващо устройство, а скаларните изчисления — от скаларно (RISC) устройство. Векторните регистри (например 8 регистъра по 64 думи от 64 бита в CRAY-1) са бърза вътрешна памет, всеки с два входа за четене и един за запис. Функционалните устройства ADD, MULT и DIV са специализирани конвейери, които могат да стартират нова операция на всеки такт, а устройствата LOAD и STORE пренасят векторите между регистрите и паметта. Регистърът и устройството MASK обработват двоичен вектор-маска, използван при адресиране на разредени вектори и матрици.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Векторни регистри — бърза вътрешна памет","kw":["векторни регистри","векторните регистри"]},{"t":"Конвейерни ФУ ADD, MULT, DIV","kw":["add","mult"]},{"t":"LOAD/STORE за обмен с паметта","kw":["load"]},{"t":"MASK — двоичен вектор за разредени данни","kw":["mask","маска"]},{"t":"Управляващо и скаларно устройство","kw":["скаларно","управляващо"]}]}]},{"id":"L07-O-7","group":"L07","lec":7,"title":"Векторни процесори","text":"Какви са изискванията към оперативната памет на векторния процесор и как се удовлетворяват?","src":"","solution":"Конвейерът на векторния процесор произвежда по един резултат на такт, затова паметта трябва да поддържа непрекъснат поток от данни към функционалните устройства и обратно. Например за C = A + B на всеки такт трябва да се четат по един елемент от A и B и да се записва един елемент от C, затова е нужна поне три пъти по-широка лента на пропускане в сравнение със скаларния процесор. Това се постига чрез разслоена памет — независими модули, позволяващи конкурентен достъп до независими данни, и чрез вътрешна високоскоростна памет (векторни регистри), подобна на кеша при скаларните процесори. При непоследователна стъпка на достъп може да възникнат конфликти между модулите, затова за най-висока производителност е желателна последователна адресация.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Непрекъснат поток от данни","kw":["непрекъснат поток"]},{"t":"Поне 3 пъти по-широка лента","kw":["три пъти","лента"]},{"t":"Разслоена памет","kw":["разслоена"]},{"t":"Вътрешна бърза памет / регистри","kw":["вътрешна","регистри"]}]}]},{"id":"L07-O-8","group":"L07","lec":7,"title":"Векторни процесори","text":"Защо броят на кодовете на операциите на векторния процесор е 2–3 пъти по-голям от този на скаларния?","src":"","solution":"Първата причина е, че една векторна операция покрива група различни команди — например векторното събиране включва ci = ai + bi, ci = ci + s, редукцията s = Σai и s = s + ai + bi, всяка от които е отделна команда. Втората причина са съставните команди, които комбинират най-често срещаните последователности, като V = S·V + S·V или V = V + S·V, и изискват паралелна или последователна работа на няколко аритметични конвейера. Третата причина са новите специфични команди от типа „Сравни два вектора за равенство“ или „Провери вектора за нулев елемент“, които произвеждат двоичен резултатен вектор. Те се налагат, защото най-разпространеният начин за фиксиране на състоянието след векторна команда е нищо да не се запомня в регистъра на признаците.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Разновидности на една операция (редукция и др.)","kw":["редукция","ci = ci + s"]},{"t":"Съставни команди","kw":["съставни"]},{"t":"Команди за сравнение на вектори","kw":["сравни"]},{"t":"Двоичен вектор / фиксиране на състоянието","kw":["двоичен","състоянието"]}]}]},{"id":"L07-O-9","group":"L07","lec":7,"title":"Векторни процесори","text":"Какви видове адресация на операндите се използват във векторните команди? Сравнете ги.","src":"","solution":"Векторните команди са предимно триадресни — две полета за векторите източници и едно за резултата, а адресацията бива памет-памет, регистър-регистър и смесена (памет-регистър). Адресацията памет-памет (CDC Cyber 200/205) е най-бавна, но е инвариантна спрямо дължината на векторите и не изисква команди за зареждане на регистри. Адресацията регистър-регистър (Cray) е най-бърза, но крайната дължина на регистрите налага ограничения: вектор от 136 елемента при регистри по 64 изисква три зареждания, последното само с 8 елемента, което дава „трионообразна“ зависимост на производителността от дължината на вектора. Смесената адресация (IBM 3090) е компромис, който съчетава предимствата на двете и изисква най-малко тактове, особено при съставните команди.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Три вида: памет-памет, регистър-регистър, смесена","kw":["памет-памет","регистър-регистър","смесена"]},{"t":"Памет-памет — бавна, но инвариантна към дължината","kw":["инвариантна"]},{"t":"Регистър-регистър — бърза, но „трион“","kw":["трионообразна"]},{"t":"Смесена — компромис","kw":["компромис"]},{"t":"Примери: Cyber, Cray, IBM 3090","kw":["cray","3090","cyber"]}]}]},{"id":"L07-O-10","group":"L07","lec":7,"title":"Векторни процесори","text":"Какво представляват плътните и разредените схеми на адресация във векторните процесори? Каква е ролята на двоичния вектор и на векторните индекси?","src":"","solution":"Плътната (регулярна) адресация се използва, когато разположението на данните е известно предварително, и бива последователна, непоследователна, но регулярна (например стълб на матрица, съхранявана по редове — със стъпка m), и подматрична. Разредената адресация се прилага при операции, зависещи от данните, при разредени вектори и при косвено преглеждане на таблици, като основните средства са двоичните вектори и векторните индекси. Двоичният вектор е маска с дължината на обработвания вектор от нули и единици, като бит 1 означава, че съответният елемент участва в операцията, и поддържа функциите свиване, разширение и селективно запомняне. Векторните индекси са числа, използвани като адреси или отмествания, но реализацията им е по-сложна, защото генераторът на адреси прави два достъпа до паметта — за индексите и за данните.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Плътна: последователна, регулярна, подматрична","kw":["последователна","подматрична"]},{"t":"Разредена: зависещи от данните операции, разредени вектори","kw":["разредени","зависещи от данните"]},{"t":"Двоичен вектор — маска","kw":["маска","двоичният вектор"]},{"t":"Свиване, разширение, селективно запомняне","kw":["свиване","селективно"]},{"t":"Векторни индекси — два достъпа до паметта","kw":["индекси","два достъпа"]}]}]},{"id":"L07-O-11","group":"L07","lec":7,"title":"Векторни процесори","text":"Как се фиксира състоянието след изпълнение на векторните команди?","src":"","solution":"Тъй като векторните команди работят с многоелементни данни, се използват три принципно различни способа за формиране на признаците. Първият разширява полетата на регистъра на състоянието с допълнителна информация — дали един, някои или всички резултати са нула, броят на нулите и мястото на първата от тях, но не показва къде са всички особени състояния. Вторият формира вектор с кода на признаците за всеки елемент, който се съхранява в паметта, но е малко полезен, когато всеки резултат зависи от много предходни операции. Третият, най-разпространен, е нищо да не се запомня, а наборът команди да се допълни с команди като „Сравни векторите за равенство“ или „Провери вектора за отрицателен елемент“, които дават двоичен резултатен вектор.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Разширяване на регистъра на състоянието","kw":["регистъра на състоянието","разширява"]},{"t":"Вектор с кода на признаците в паметта","kw":["вектор с кода"]},{"t":"Нищо не се запомня — най-разпространен","kw":["нищо да не се запомня","най-разпространен"]},{"t":"Команди за сравнение → двоичен вектор","kw":["двоичен"]}]}]},{"id":"L07-O-12","group":"L07","lec":7,"title":"Векторни процесори","text":"Как се програмира векторен процесор? Обяснете с примера за намиране на елементите на X, които са нула или отрицателни, но не превишават съответните елементи на Y.","src":"","solution":"Програмирането на векторен процесор се основава на изграждане на граф от векторни команди, всяка от които приема входни вектори и произвежда двоичен вектор, като командите, наредени хоризонтално, се изпълняват последователно, а наредените вертикално — паралелно. В примера сравненията X ≤ 0 → BV1, X > Y → BV2 и Y < 0 → BV3 са независими и могат да се изпълняват паралелно. След това се изпълняват отрицание на BV2 → BV4, логическо И на BV1 и BV4 → BV5 и логическо ИЛИ на BV5 и BV3 → BV6. Крайният двоичен вектор BV6 посочва позициите на елементите от X, които удовлетворяват условието, без да се използват цикли и условни преходи.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Граф от векторни команди","kw":["граф"]},{"t":"Резултатите са двоични вектори","kw":["двоичен"]},{"t":"Хоризонтално последователно, вертикално паралелно","kw":["паралелно","последователно"]},{"t":"Сравнения, отрицание, И, ИЛИ","kw":["логическо и","отрицание"]},{"t":"BV6 — краен резултат","kw":["bv6"]}]}]},{"id":"L07-O-13","group":"L07","lec":7,"title":"Векторни процесори","text":"Как се определя производителността на операционен конвейер при обработка на вектор с n елемента? Каква е минималната дължина на вектора за ефективна обработка?","src":"","solution":"Времето за обработка на n елемента от конвейер с L степени и такт tc е t(n) = t_init + (L + n − 1)·tc, където t_init е времето за инициализация, а σ = t_init/tc. Ускорението спрямо неконвейерно АЛУ е S ≈ L·n/(σ + L + n − 1) и при n → ∞ клони към L, а ефективността е E = S/L = n/(σ + L + n − 1). За желана ефективност E0 минималната дължина на вектора е n_min = E0·(σ + L − 1)/(1 − E0), например при σ = 4, L = 5 и E0 = 0,8 тя е 32 елемента. Следователно при къси вектори, съизмерими с броя степени, конвейерът е слабо натоварен и производителността пада.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"t(n) = t_init + (L + n − 1)·tc","kw":["t(n)","инициализация"]},{"t":"S → L при дълги вектори","kw":["клони към l"]},{"t":"Ефективност E = S/L","kw":["e = s/l","ефективността"]},{"t":"n_min = E0·(σ + L − 1)/(1 − E0)","kw":["n_min","минималната"]},{"t":"Къси вектори — ниска производителност","kw":["къси вектори"]}]}]},{"id":"L07-O-14","group":"L07","lec":7,"title":"Векторни процесори","text":"Може ли да се реализира векторна обработка, ако в процесора не е реализирана конвейерна обработка?","src":"","solution":"Теоретично е възможно, защото векторната обработка означава прилагане на една операция върху множество двойки операнди, зададени с една векторна команда. Без конвейер обаче всяка двойка елементи ще се обработва последователно с пълното време на операцията и производителността ще е почти като на скаларен процесор. Ще остане само ефектът от еднократното декодиране на командата, но основното предимство — припокриването на обработката на последователни елементи в степените на конвейера — ще липсва. Затова реалните векторни процесори задължително използват конвейерни функционални устройства.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Теоретично възможно","kw":["теоретично"]},{"t":"Производителност като на скаларен процесор","kw":["скаларен"]},{"t":"Остава само еднократното декодиране","kw":["декодиране"]},{"t":"Липсва припокриването в конвейера","kw":["припокриването"]}]}]},{"id":"L08-O-1","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Какво представлява матричният (SIMD) процесор? Защо може да се разглежда като фон Ноймановски по отношение на управлението?","src":"","solution":"Матричният процесор е синхронен паралелен компютър от множество процесорни елементи, управлявани от едно единствено управляващо устройство, което извлича и декодира командите и размножава управляващите сигнали към всички процесори. Всички процесори изпълняват една и съща операция в един и същ момент, но върху различни данни, затова по Флин той е от клас SIMD и реализира паралелизъм по пространство. Той е фон Ноймановски по отношение на управлението, защото управлението на матрицата от процесори не се различава от управлението на един процесор. Това значително опростява програмирането в сравнение с другите многопроцесорни конфигурации.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"едно управляващо устройство","kw":["едно единствено","управляващо устройство"]},{"t":"една и съща операция върху различни данни","kw":["една и съща","различни данни"]},{"t":"клас SIMD / паралелизъм по пространство","kw":["simd","пространство"]},{"t":"управлението е като на един процесор","kw":["един процесор","фон ноймановски"]},{"t":"по-лесно програмиране","kw":["програмиране"]}]}]},{"id":"L08-O-2","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Опишете двата модела на миграция от последователен към матричен процесор. По какво се различават?","src":"","solution":"И в двата модела командата от процесора за команди преминава през комутатор от тип 1:N, който я размножава на N команди — по една за всеки процесор. При първия модел обменът на данни между процесорите се извършва от комутатор N:N на ниво процесори и по битове, както в MPP и в Connection Machine с хиперкубични връзки. При втория модел комутатор 1:N прехвърля данните между процесорите или между процесорите и паметта по блокове, както в STARAN и ASPRO. Следователно двата модела се различават по начина на междупроцесорните съединения.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"комутатор 1:N размножава командата","kw":["размножава","1:n"]},{"t":"модел N:N — обмен по битове","kw":["n:n","по битове"]},{"t":"модел 1:N — обмен по блокове","kw":["по блокове","блокове"]},{"t":"примери (MPP, CM / STARAN, ASPRO)","kw":["mpp","connection","staran","aspro"]}]}]},{"id":"L08-O-3","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Начертайте и опишете структурата на SIMD компютър с локална памет. Дайте примери.","src":"","solution":"Структурата включва главен (Host) компютър, управляващо устройство с собствена памет за команди (CU Memory), матрица от процесорни елементи PE, всеки със своя локална памет M, и комуникационна мрежа (Interconnection Network) между тях. Управляващото устройство изпълнява скаларните и управляващите команди, а векторните предава на всички PE заедно с адресите, като индексен регистър във всеки PE прави адресирането по-гъвкаво. Обменът на данни между PE става чрез комуникационната мрежа, като всеки PE има порт и буфери. Примери са ILLIAC IV с четири квадранта по 8×8 процесора и Connection Machine с 65 536 еднобитови процесора, свързани в хиперкуб.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"локална памет M към всеки PE","kw":["локална памет","своя"]},{"t":"CU с CU Memory, Host","kw":["cu memory","host","управляващо устройство"]},{"t":"Interconnection Network за обмен между PE","kw":["interconnection","комуникационна мрежа"]},{"t":"CU предава адреси; индексен регистър","kw":["адрес","индексен"]},{"t":"ILLIAC IV, Connection Machine","kw":["illiac","connection"]}]}]},{"id":"L08-O-4","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Каква е структурата на SIMD компютъра с разделяема памет? Кои са предимствата и недостатъците му?","src":"","solution":"При SIMD компютъра с разделяема памет модулите памет са отделени от процесорните елементи чрез мрежа за подравняване (Alignment Network), управлявана от управляващото устройство. Всеки PE може да осъществява достъп до всяка памет, а мрежата позволява паралелен достъп до споделената памет. Предимството е, че повече вече разработени алгоритми могат по-лесно да се настроят към хардуера. Недостатъкът е, че през мрежата трябва да се превключват повече данни, което увеличава времето за достъп.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"Alignment Network между PE и паметите","kw":["alignment","подравняване"]},{"t":"всеки PE достъпва всяка памет паралелно","kw":["всяка памет","паралелен достъп"]},{"t":"предимство — лесно настройване на алгоритми","kw":["алгоритми"]},{"t":"недостатък — по-голямо време за достъп","kw":["времето за достъп","време за достъп"]}]}]},{"id":"L08-O-5","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"На какви подмножества се разделя наборът команди на матричния процесор и какво е предназначението на всяко от тях?","src":"","solution":"Наборът команди се разделя на три подмножества: скаларно, паралелно и управляващо. Скаларното подмножество съдържа обикновени последователни команди, които се изпълняват от управляващото устройство. Паралелното подмножество не съдържа команди за преход и се предава на всички процесори от матрицата, които го изпълняват паралелно. Управляващото подмножество осигурява обмена между скаларната и паралелната част, например промяна на потока команди според резултатите от матрицата или прехвърляне на съдържанието на отделен процесор към последователната част.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"три подмножества","kw":["три"]},{"t":"скаларно — изпълнява се от CU","kw":["скаларно"]},{"t":"паралелно — без преходи, от всички PE","kw":["паралелно","преход"]},{"t":"управляващо — обмен между двете части","kw":["управляващо","обмена"]}]}]},{"id":"L08-O-6","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Каква е същността на механизма на маската при SIMD компютрите? Как се реализира?","src":"","solution":"Механизмът на маската позволява само част от процесорните елементи да изпълнят дадена команда, например при конструкция if a[i] > 0 then, като блокира или деблокира изпълнението във всеки PE. В най-прост вид се реализира чрез контекстен регистър: при стойност 1 командата се изпълнява, а при 0 се игнорира, като стойността се определя от локалните данни. В най-развития си вариант е специализиран процесор за булеви операции, който обработва признаците от сравненията в PE и данни от паметта и подава резултата на входовете за блокиране. Маската е въведена за пръв път в ILLIAC-IV и внася операционна автономия в SIMD компютъра.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"условно изпълнение само от част от PE","kw":["част","блокира"]},{"t":"контекстен регистър 1/0","kw":["контекстен регистър"]},{"t":"булев процесор","kw":["булеви","булев"]},{"t":"ILLIAC-IV, операционна автономия","kw":["illiac","автономия"]}]}]},{"id":"L08-O-7","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Защо SIMD компютрите се появяват и развиват първи сред паралелните компютри? Какво означава синхронният им режим на работа?","src":"","solution":"Синхронният режим се определя от наличието на едно единствено управляващо устройство, което подава едни и същи команди и сигнали за синхронизация на всички процесори едновременно. Първата причина за ранното развитие на SIMD е по-ниската цена, защото N процесора с едно управляващо устройство са по-евтини от N процесора с N управляващи устройства. Втората причина е, че при синхронна работа матрицата използва по-пълно лентата на пропускане на комуникационната мрежа. С масовото производство на процесори първата причина губи значение, но втората остава валидна.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"едно управляващо устройство → синхронност","kw":["едно единствено","синхрон"]},{"t":"по-ниска цена (1 CU срещу N CU)","kw":["цена","по-евтини"]},{"t":"пълно използване на лентата на мрежата","kw":["лентата на пропускане"]},{"t":"цената губи значение, лентата остава","kw":["губи значение","остава"]}]}]},{"id":"L08-O-8","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Как се осъществява обменът на данни между процесорите вътре в матричния процесор?","src":"","solution":"Вътре в матричния процесор има строга постъпкова синхронизация, а най-често използваните съединения са топологиите „линийка“ (конвейер) и „решетка“. При команда за предаване, например наляво, всички процесори предават данни наляво и едновременно приемат от дясно, така че общата лента е равна на ширината на един процесор, умножена по броя на процесорите. Поради регулярността и синхронността няма разходи за изчисляване на пътя и адреса и обменът се свежда до три операции: извличане от паметта, предаване на съседа и запис на получените данни. Бърз обмен е възможен само между съседи, а за отдалечени или много получатели се използва циркулационно предаване през последователния контролер.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"линийка и решетка","kw":["линийка","решетка"]},{"t":"всички предават едновременно — голяма обща лента","kw":["едновременно","лента"]},{"t":"три операции: извличане, предаване, запис","kw":["извличане","запис"]},{"t":"само между съседи; циркулационно предаване","kw":["съсед","циркулационно"]}]}]},{"id":"L08-O-9","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Какво се разбира под масов паралелизъм? Защо много SIMD компютри използват еднобитови процесори?","src":"","solution":"Под масов паралелизъм се разбира броят на паралелно работещите процесори, като ограничаващ фактор е технологичната възможност да се разположат процесорите, паметта и връзките в едно устройство (от 512–1024 в началото на 70-те до 256K). Компютри като DAP на ICL и Connection Machine използват еднобитови процесори, защото те са с проста структура и много от тях се побират в един чип. Втората причина е по-високата скорост: при организация последователно по битове, паралелно по думи и съотношение τ_A ≈ τ_M ускорението спрямо класическата организация за b = 32 е около 8.75 пъти. Това позволява десетки хиляди паралелно работещи процесорни елементи и масов паралелизъм.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"масов паралелизъм = брой паралелно работещи процесори","kw":["брой","паралелно работещи"]},{"t":"ограничение от технологията","kw":["технологи"]},{"t":"еднобитови — проста структура, много в чип","kw":["еднобитови","чип"]},{"t":"по-висока скорост ~9× при τ_A ≈ τ_M","kw":["8.75","τ_a ≈ τ_m","скорост"]}]}]},{"id":"L08-O-10","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Сравнете трите начина за сумиране на два вектора с еднобитови суматори. При какви условия разрядно-секционната обработка е изгодна?","src":"","solution":"При първия начин един еднобитов суматор обработва всичко последователно за време T1 = n·b·(τ_A + τ_M), което е най-бавно и практически неприложимо. При втория начин b суматора са свързани във верига и обработват паралелно по битове, последователно по думи за T2 = n·(0.5(1+b)·τ_A + τ_M). При третия, разрядно-секционен начин b независими суматора обработват последователно по битове, паралелно по думи за T3 = ⌈n/b⌉·b·(τ_A + τ_M). Отношението S = T2/T3 = (0.5(1+b)τ_A + τ_M)/(τ_A + τ_M) показва, че при τ_A ≪ τ_M подходите са равностойни, а при τ_A ≈ τ_M и b = 32 третият е 8.75 пъти по-бърз.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"T1 — един суматор, напълно последователно","kw":["t1","един еднобитов"]},{"t":"T2 — паралелно по битове, последователно по думи","kw":["t2","последователно по думи"]},{"t":"T3 — последователно по битове, паралелно по думи","kw":["t3","паралелно по думи"]},{"t":"S = T2/T3; τ_A ≈ τ_M → 8.75","kw":["8.75","τ_a ≈ τ_m"]}]}]},{"id":"L08-O-11","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Какво е ъглово завъртане и защо е необходимо при SIMD компютрите с еднобитови процесори?","src":"","solution":"Стандартните компютри съхраняват данните във формат последователно по думи, паралелно по разряди, докато еднобитовите процесорни елементи изискват формат последователно по разряди, паралелно по думи. Преобразуването между двата формата се нарича ъглово завъртане. Обикновено то се извършва от специално устройство между паметта и процесорната матрица, което увеличава времето за достъп и забавя изчисленията. В Staran и Aspro ъгловото завъртане се реализира ефективно от комуникационната мрежа при обикновено обръщение към паметта, която позволява достъп както по битове, така и по думи.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"два формата: по думи / по разряди","kw":["по думи","по разряди"]},{"t":"преобразуване на формата","kw":["преобразуване"]},{"t":"специално устройство между паметта и матрицата; по-голямо време","kw":["специално устройство","време за достъп"]},{"t":"Staran/Aspro — чрез мрежата","kw":["staran","aspro"]}]}]},{"id":"L08-O-12","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Каква е идеята на пирамидалната архитектура? Опишете нивата на проекта IUA.","src":"","solution":"Пирамидалната архитектура, предложена от Uhr за обработка на изображения, има на най-ниското ниво двумерна матрица от процесори за груба обработка на пикселите, а всеки процесор от по-горно ниво е свързан с група процесори от по-долното. Колкото по-високо е нивото, толкова по-слабо синхронизирани са операциите и на върха често стои MIMD компютър. В проекта IUA на MIT първото ниво е CAAPP — матрица 512×512 еднобитови асоциативни процесора за работа с пиксели, второто е ICAP — 64×64 шестнадесетбитови процесора с MIMD управление. Третото ниво е SPA — 64 тридесет и двубитови процесора, изпълняващи LISP програми за символна обработка.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"L. Uhr, обработка на изображения","kw":["uhr","изображения"]},{"t":"нагоре — по-слаба синхронизация, MIMD","kw":["по-слабо","mimd"]},{"t":"CAAPP 512×512 еднобитови","kw":["caapp","512"]},{"t":"ICAP 64×64; SPA с LISP","kw":["icap","spa","lisp"]}]}]},{"id":"L08-O-13","group":"L08","lec":8,"title":"SIMD (матрични) процесори","text":"Каква е ролята на главния (Host) компютър в SIMD системата и как се разпределя обработката между скаларната и паралелната част?","src":"","solution":"Матричният процесор е присъединен към главен (Host) компютър, който е последователен и за програмиста е машина за предварителна обработка (front-end machine). Той компилира и зарежда програмата, изпълнява входно-изходните операции и функциите на операционната система. Скаларните данни като аргументи и параметри се обработват от последователната част, а паралелните данни като вектори, матрици и таблици — от матричния процесор. Последователната част управлява целия компютър, защото съдържа цялата програма и съгласува изпълнението на скаларните и матричните изчисления.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"последователна front-end машина","kw":["front-end","последователен"]},{"t":"компилация, зареждане, вход/изход, ОС","kw":["компилира","входно-изходните","операционната"]},{"t":"скаларни данни — последователна част; паралелни — матрица","kw":["скаларни","паралелните"]},{"t":"последователната част управлява всичко","kw":["управлява целия"]}]}]},{"id":"L09-O-1","group":"L09","lec":9,"title":"Систолични процесори","text":"Какво представлява систоличната матрица? С какво систоличната обработка се отличава от обикновената конвейерна обработка?","src":"","solution":"Систоличната матрица е мрежовидна структура от прости клетки, които обработват данните чрез n-мерен конвейер, като идеята произлиза от Кунг и Лейсерсон. За разлика от обикновения конвейер, където се движат само междинните резултати, тук през матрицата се движат както входните, така и междинните данни, и то с различна скорост и в различни посоки. Само граничните клетки взаимодействат с паметта, а останалите обменят данни единствено помежду си. Така систоличната обработка по същество е конвейерна обработка в мрежа от елементи, съвместима с VLSI технологията.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"мрежа от клетки, n-мерен конвейер","kw":["n-мерен","мрежовидна"]},{"t":"движат се входните и междинните данни","kw":["входните","междинните"]},{"t":"различна скорост и посоки","kw":["скорост","посоки"]},{"t":"само граничните клетки — с паметта","kw":["граничните"]},{"t":"съвместимост с VLSI","kw":["vlsi"]}]}]},{"id":"L09-O-2","group":"L09","lec":9,"title":"Систолични процесори","text":"Кои са характерните свойства на VLSI-съвместимите систолични структури? Защо връзките трябва да са локални?","src":"","solution":"VLSI-съвместимите систолични структури се характеризират с висока модулност, отсъствие на дълги пътища за данни, локалност на връзките, ограничени възможности на клетките, отсъствие на централно управление и прости механизми за синхронизация. Клетките трябва да са възможно най-прости, за да се използва добре площта на силициевата подложка. Свързването трябва да е просто, регулярно и само между съседни клетки, защото дългите връзки изискват повече площ и енергия. При високата тактова честота всяка дълга връзка внася закъснение на сигнала и затова е нежелана.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"модулност","kw":["модулност"]},{"t":"локалност, липса на дълги пътища","kw":["локалност","дълги"]},{"t":"без централно управление, проста синхронизация","kw":["централно управление","синхронизация"]},{"t":"дългите връзки — площ, енергия, закъснение","kw":["закъснение","площ"]}]}]},{"id":"L09-O-3","group":"L09","lec":9,"title":"Систолични процесори","text":"За какви алгоритми са подходящи систоличните матрици? Защо входно-изходният канал е тясно място?","src":"","solution":"Систоличните матрици са високо регулярни структури, затова върху тях ефективно се изпълняват само алгоритми с повтарящи се изчисления, като цифрова обработка на сигнали, линейна алгебра и алгоритми с вложени цикли. Висока производителност се постига, когато алгоритъмът е настроен за матрицата, което понякога изисква разработване на нови, специални алгоритми. Производителността силно зависи от входно-изходните характеристики, защото данните влизат в матрицата, обработват се и я напускат през граничните клетки. Затова данните, веднъж извлечени от паметта, трябва да преминат през максимален брой операции преди да се запишат обратно, иначе входно-изходният канал ограничава системата.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"повтарящи се, регулярни изчисления","kw":["повтарящи","регулярни"]},{"t":"обработка на сигнали, линейна алгебра, вложени цикли","kw":["сигнали","алгебра","цикли"]},{"t":"нужни специални алгоритми","kw":["алгоритми"]},{"t":"I/O — максимален брой операции върху извлечените данни","kw":["входно-изходн","максимален брой операции"]}]}]},{"id":"L09-O-4","group":"L09","lec":9,"title":"Систолични процесори","text":"Опишете базовия принцип на работа на систоличната система. Какво представлява проблемът за разпределението (mapping problem)?","src":"","solution":"Систоличната матрица работи под управлението на контролер, който подава управляващите сигнали и входните данни и събира резултатите. Контролерът взаимодейства с главния компютър, в който се компилират програмите и който поема задачите, неподходящи за систолично изпълнение. Общото време включва времето за обработка и времето за предаване между клетките, като поради конвейерния принцип двете трябва да са сравними. Проблемът за разпределението (mapping problem) е съпоставянето на изчисленията на алгоритъма върху свързаните клетки и е още по-сложен, когато реалната матрица е по-малка от изискваната от алгоритъма.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"контролер — сигнали, данни, резултати","kw":["контролер"]},{"t":"главен компютър — компилация, неподходящи задачи","kw":["главния компютър","компилират"]},{"t":"време за обработка сравнимо с времето за предаване","kw":["сравними"]},{"t":"mapping problem — разпределение върху клетките","kw":["mapping","разпределението"]}]}]},{"id":"L09-O-5","group":"L09","lec":9,"title":"Систолични процесори","text":"По какво се различават видовете систолични матрици? Посочете типичните топологии и видовете клетки.","src":"","solution":"Систоличните матрици се различават по топология, по функционални възможности на клетките и по реконфигурируемост. Типичните топологии са едномерна (линейна), двумерна, триъгълна матрица и двоично дърво. По функционални възможности клетките могат да бъдат прости АЛУ, АЛУ с няколко регистъра, прост процесор със собствена програма или процесорен модул с процесор, памет и допълнителна логика. Реконфигурируемостта се осигурява от FPGA, които позволяват препрограмиране и са подходящи за малки систолични матрици.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"топология, функционалност, реконфигурируемост","kw":["топология","реконфигурируемост"]},{"t":"линейна, двумерна, триъгълна, дърво","kw":["линейна","двумерна","триъгълна","дърво"]},{"t":"АЛУ … процесорен модул","kw":["алу","процесорен модул"]},{"t":"FPGA","kw":["fpga"]}]}]},{"id":"L09-O-6","group":"L09","lec":9,"title":"Систолични процесори","text":"Как се класифицират систоличните матрици на специализирани и универсални? Каква организация и топология имат отделните видове?","src":"","solution":"Специализираните систолични матрици са хардуерни, с организация FVIMD (много малко команди, много данни) и фиксирана топология. Универсалните биват три вида: програмируеми, реконфигурируеми и хибридни. Програмируемите имат организация SIMD или MIMD и статична или динамична топология, реконфигурируемите са FVIMD с реконфигурируема топология, а хибридните са с хибридна организация и n-размерна топология. Специализираните постигат максимална производителност за една задача, а универсалните жертват част от нея за гъвкавост.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"специализирани — хардуерни, фиксирани","kw":["специализирани","фиксирана"]},{"t":"програмируеми — SIMD/MIMD","kw":["програмируеми","simd"]},{"t":"реконфигурируеми — FVIMD","kw":["реконфигурируеми","fvimd"]},{"t":"хибридни","kw":["хибридни"]}]}]},{"id":"L09-O-7","group":"L09","lec":9,"title":"Систолични процесори","text":"Как систоличен елемент изчислява скаларното произведение на два вектора?","src":"","solution":"Систоличният елемент изчислява s = Σ aᵢ·bᵢ и съдържа умножител и акумулатор. След инициализацията на клетката елементите на векторите a и b синхронно преминават през нея, като продължават и към следващите елементи на матрицата. Всяка двойка aᵢ и bᵢ се умножава, а произведението се натрупва в акумулатора. Резултатът s се извежда от акумулатора в края на обработката.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"s = Σ aᵢ·bᵢ","kw":["σ","скаларн"]},{"t":"умножител и акумулатор","kw":["умножител","акумулатор"]},{"t":"елементите преминават синхронно","kw":["синхронно"]},{"t":"резултатът се извежда в края","kw":["в края"]}]}]},{"id":"L09-O-8","group":"L09","lec":9,"title":"Систолични процесори","text":"Обяснете систоличното умножение на две матрици 3×3. Какво е предимството му?","src":"","solution":"Систоличната матрица за умножение на матрици 3×3 се изгражда от 9 клетки (от c₁₁ до c₃₃), всяка от които е клетка за скаларно произведение. Единствената разлика спрямо единичната клетка е, че за всеки допълнителен ред и колона се въвежда закъснение от един цикъл, така че елементите на двете матрици пристигат синхронно в правилните клетки. В клетката cᵢⱼ се натрупва едноименният елемент на резултата и се извежда в края. Предимството е намаленият обмен с паметта, защото веднъж извлечен, елементът a₁₁ се използва не само от c₁₁, но и от c₁₂ и c₁₃.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"9 клетки за скаларно произведение","kw":["9 клетки","9"]},{"t":"закъснение от един цикъл на ред/колона","kw":["закъснение","един цикъл"]},{"t":"в cᵢⱼ — елемент на резултата","kw":["резултата"]},{"t":"многократно използване на елемент → по-малко обръщения към паметта","kw":["паметта","c₁₂"]}]}]},{"id":"L09-O-9","group":"L09","lec":9,"title":"Систолични процесори","text":"Кои са ограниченията на специализираните систолични матрици и как се преодоляват?","src":"","solution":"При обработка на матрици с размерност, по-голяма от тази на систоличната матрица, те трябва да се разделят на по-малки блокове. Тогава изчисленията стават паралелно-последователни, което усложнява работата и намалява производителността. По-съществен проблем е, че чисто хардуерното изпълнение дава висока производителност, но цената, отнесена към приложението, расте, а приложимостта за други задачи намалява. Изходът е разработването на систолични архитектури с универсално приложение — програмируеми, реконфигурируеми и хибридни.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"големи матрици → разделяне на блокове","kw":["разделят","блокове"]},{"t":"паралелно-последователни изчисления, по-ниска производителност","kw":["паралелно-последователни"]},{"t":"висока цена, тясна приложимост","kw":["цената","приложимост"]},{"t":"универсални архитектури","kw":["универсално"]}]}]},{"id":"L09-O-10","group":"L09","lec":9,"title":"Систолични процесори","text":"Какви са универсалните систолични матрици? Опишете проектите Warp и iWarp.","src":"","solution":"Универсалните систолични матрици са програмируеми, реконфигурируеми и хибридни, като размерността им е най-често едномерна или двумерна, защото при по-голяма размерност входно-изходните ограничения стават прекомерни. Проектите Warp и iWarp на Carnegie-Mellon University и Intel доказват възможността за систолична обработка с универсално предназначение. Проектантите избират малко на брой, но сложни клетки, всяка с RAM за данни от 32K думи, два регистрови файла по 32 регистъра и три опашки по 512 думи, за да постигнат гъвкавост. Warp има 10 клетки в едномерна матрица, а iWarp — 32×32 клетки в двумерна матрица с пикова производителност 20 GFLOPS.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"програмируеми, реконфигурируеми, хибридни","kw":["програмируеми","хибридни"]},{"t":"размерност 1 или 2 заради I/O","kw":["едномерна","входно-изходните"]},{"t":"малко сложни клетки за гъвкавост","kw":["сложни клетки","гъвкавост"]},{"t":"Warp 10 клетки; iWarp 32×32, 20 GFLOPS","kw":["warp","20 gflops"]}]}]},{"id":"L09-O-11","group":"L09","lec":9,"title":"Систолични процесори","text":"Сравнете специализираните и универсалните систолични матрици.","src":"","solution":"Специализираните систолични матрици се проектират конкретно за едно приложение, с хардуерно реализирани функции и фиксирана топология, най-често за матрични операции. Те постигат максимална производителност за своята задача, но са неизползваеми за други и цената им, отнесена към приложението, е висока. Универсалните матрици са програмируеми, реконфигурируеми или хибридни и използват по-сложни клетки, като в Warp и iWarp. Те жертват част от производителността, но осигуряват гъвкавост и широк кръг приложения, а с FPGA се получават и евтини малки реконфигурируеми матрици.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"специализирани — хардуерни, фиксирана топология","kw":["хардуерно","фиксирана"]},{"t":"максимална производителност за една задача","kw":["максимална производителност"]},{"t":"висока цена/тясна приложимост","kw":["цената","неизползваеми"]},{"t":"универсални — гъвкавост, Warp, FPGA","kw":["гъвкавост","warp","fpga"]}]}]},{"id":"L09-O-12","group":"L09","lec":9,"title":"Систолични процесори","text":"Каква е ролята на FPGA технологията при систоличните матрици?","src":"","solution":"FPGA (Field Programmable Gate Arrays) предлагат възможност за препрограмиране и реконфигуриране на хардуера. Чрез тях могат да се конструират систолични матрици, ефективни за изчисляване на различни задачи, вместо една фиксирана функция. Обобщено FPGA технологията е подходяща за построяване на малки реконфигурируеми систолични матрици на разумна цена. Така се преодолява основният недостатък на специализираните матрици — тясната им приложимост.","fields":[{"label":"Отговор","type":"essay","points":[{"t":"препрограмиране и реконфигуриране","kw":["препрограмиране","реконфигур"]},{"t":"различни задачи","kw":["различни задачи"]},{"t":"малки матрици на разумна цена","kw":["малки","цена"]},{"t":"преодолява тясната специализация","kw":["приложимост","специализираните"]}]}]},{"id":"L10-O-1","group":"L10","lec":10,"title":"Паралелни компютри с обща и разпределена памет","text":"Кои са основните предимства и недостатъци на компютрите с разпределена памет?","src":"Изпит — вариант 1, въпрос 7","solution":"При компютрите с разпределена памет (MPP) всеки
