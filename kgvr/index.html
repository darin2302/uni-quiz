e": "Лекция 11 — Осветеност (и сенки)", "short": "Осветеност (и сенки)", "summary": "### Защо модели на осветление\nПълната симулация на фотони е изчислително непосилна → **опростени модели** (shading models / reflection models).\n\n### ADS модел\n- **Ambient (околно)** — равномерно осветяване на всичко, независимо от позиция и ориентация.\n- **Diffuse (дифузно)** — зависи от **ъгъла на падане** → обем и форма.\n- **Specular (огледално)** — **блясък** там, където светлината се отразява към наблюдателя.\n- Зависи от: типа светлина и нейните A/D/S компоненти; A/D/S свойствата на **материала** и неговия **блясък (shininess)**; ъгъла на падане; ъгъла на наблюдение.\n\n### Видове светлини\n| Тип | Позиция | Посока | Бележки |\n|---|---|---|---|\n| **Глобална околна** | ❌ | ❌ | **Само ambient** компонента; еднаква навсякъде; светлина, отразена толкова пъти, че източникът е неопределим; напр. (0.6, 0.6, 0.6, 1.0) |\n| **Насочена (далечна)** | ❌ | ✅ | **Успоредни лъчи** — като **Слънцето**; A/D/S + вектор на посоката |\n| **Позиционна (точков източник)** | ✅ | изчислява се за всяка точка | Лампи, свещи; **затихване** с разстоянието |\n| **Прожектор (spotlight)** | ✅ | ✅ | **Конус** с ъгъл на отрязване θ (0–90°) и показател на спад |\n\n- Насочената светлина също има ambient компонента — за да се усили общото ambient, когато е „включена“.\n- **Затихване** (позиционни светлини): `f_att = 1 / (kc + kl·d + kq·d²)`, d — разстояние до източника.\n  - **kc ≥ 1.0** (без деление на нула); поне един от **kl, kq > 0**; резултатът е в [0, 1].\n- **Прожектор**: φ = ъгълът между посоката на прожектора и вектора към пиксела; ако **φ < θ** → коефициент = **cos^exp(φ)**; ако φ > θ → **0**. По-голям показател → по-бърз спад към ръба.\n- **Модел на Уорн (Warn)** — по-реалистичен прожектор: `I = I_S · f_att · cos^p(γ)` (p контролира фокуса).\n\n### Материали\n- 4 стойности: **ambient, diffuse, specular RGBA + shininess (блясък)**. Пример — калай (pewter): shininess 9.85.\n- Алфа в материала = непрозрачност (нефрит и перла имат < 1.0).\n- **Емисия** — за материали, излъчващи собствена светлина (фосфоресциращи).\n\n### Изчисление на осветлението\n`I = I_ambient + I_diffuse + I_specular` — за всеки пиксел и всяка светлина.\n- **Ambient**: `I_a = Light_a · Material_a` (по RGB компоненти).\n- **Diffuse** — **косинусов закон на Ламберт (1760)**: отразеното е пропорционално на **cos θ** (ъгъл на падане):\n  `I_d = Light_d · Material_d · max(N · L, 0)` — **N** е нормалата, **L** е векторът към светлината; cos θ се получава чрез **скаларно произведение** на нормализираните вектори.\n- **Specular**: **R** — посоката на отражението, **V** — векторът към окото; ъгъл φ между тях.\n  `I_s = Light_s · Material_s · max(R · V, 0)^n` — **n = коефициент на блясък**. **По-голям n → по-бърз спад → по-малък, по-остър отблясък** (огледало); по-малък n → по-разпръснат.\n\n### Методи на засенчване (shading)\n- **Фасетно (плоско, flat)** — една стойност на осветлението за **целия полигон** (изчислява се за един връх); нереалистично, рядко днес.\n- **Гуро (Gouraud)** — осветлението се изчислява **само във върховете** (нормалите са осреднени от съседните повърхности), после **цветът/интензитетът се интерполира** по триъгълника.\n- **Фонг (Phong shading)** — **интерполира нормалите**; осветлението се изчислява **за всеки пиксел** с интерполираната нормала (обикновено с Phong reflection model). По-точен.\n- **Блин–Фонг (Blinn–Phong)** — подобрение на Фонг: огледалната компонента ползва **halfway вектор H = normalize(L + V)** и проверява колко близо е **N до H** (`(N · H)^n`) вместо R · V. По-бърз и стабилен при движение на камерата/светлината.\n\n### Комбиниране с текстури\n- Текстура без материал: `fragColor = textureColor * (ambient + diffuse) + specular` — **огледалният цвят идва само от светлината** (метални/лъскави повърхности).\n- За плат, нелакирано дърво, злато: `fragColor = textureColor * (ambient + diffuse + specular)`.\n- Материал + текстура: претеглена сума, напр. `0.5 * textureColor + 0.5 * lightColor`; разширява се за много светлини/текстури.\n\n### Сенки\n- Без сенки не може да се прецени разположението (торът „лежи“ ли на куба или „лети“?). Сенките помагат за взаимното разположение, формата и посоката на светлината.\n- **Проективни сенки** — матрица, проектираща точките на обекта върху **равнина** → тъмен „сенчест полигон“. **+** бързи, лесни; **−** **само върху равнинни повърхности** (не върху извити или други обекти). Ползват се в много външни сцени в игри.\n- **Сенчести обеми (Shadow volumes)** — **Кроу (Crow), 1977**: обемът, засенчен от обекта; полигоните в него се рисуват по-тъмно. **+** **много точни**, малко артефакти; **−** **скъпи** изчислително. Геометрични шейдъри генерират обема; **стенсилният буфер** определя дали пикселът е вътре.\n- **Shadow mapping** — най-практичният и популярен; хардуерна поддръжка. Идея: **всичко, което светлината „не вижда“, е в сянка** → използва **Z-буфер** алгоритъма (HSR).\n  - **Проход 1**: рендиране **от позицията на светлината** (без изчертаване на екрана) → дълбочините се копират в **сенчест буфер**.\n  - **Проход 2**: нормално рендиране от камерата; за всеки пиксел: ако **разстоянието до светлината > стойността в сенчестия буфер** → **в сянка**.\n  - Пиксел в сянка → рендира се **само ambient** (без diffuse и specular).\n  - „**Shadow buffering**“ — при копиране в буфер; „**shadow mapping**“ — когато Z-буферът се копира в **текстура** (**shadow texture**), в GLSL — **`sampler2DShadow`**.\n\n### Капани за изпита\n- Гуро интерполира **цвета/интензитета**; Фонг интерполира **нормалите**.\n- Блин–Фонг = **halfway vector**.\n- Слънцето = **насочена** светлина; лампа = **позиционна**; фенерче = **прожектор**.\n- Проективни сенки → само **равнини**.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L11-A-1", "n": 1, "text": "Кои са трите компонента на ADS модела на осветление?", "opts": ["Ambient, Diffuse, Specular", "Alpha, Depth, Stencil", "Albedo, Displacement, Shininess", "Ambient, Directional, Spot"], "correct": 0, "expl": "Ambient, Diffuse, Specular"}, {"id": "L11-A-2", "n": 2, "text": "Кой тип светлина няма позиция, но има посока, и е подходящ за моделиране на слънчева светлина?", "opts": ["Позиционна светлина", "Насочена (далечна) светлина", "Прожектор", "Глобална околна светлина"], "correct": 1, "expl": "Насочена — успоредни лъчи"}, {"id": "L11-A-3", "n": 3, "text": "Кой тип светлина има както позиция, така и посока, и осветява в конус?", "opts": ["Глобална околна светлина", "Насочена светлина", "Прожектор", "Позиционна светлина"], "correct": 2, "expl": "Прожектор"}, {"id": "L11-A-4", "n": 4, "text": "Какво трябва да важи за коефициента на постоянно затихване kc?", "opts": ["kc = 0", "kc < 0", "kc трябва да е равен на kq", "kc ≥ 1.0, за да се избегне деление на нула"], "correct": 3, "expl": "kc ≥ 1"}, {"id": "L11-A-5", "n": 5, "text": "Кой закон описва дифузното отражение — количеството отразена светлина е пропорционално на косинуса на ъгъла на падане?", "opts": ["Закон на Снелиус", "Закон на Ламберт", "Закон на Фонг", "Закон на Рунге"], "correct": 1, "expl": "Ламберт (1760)"}, {"id": "L11-A-6", "n": 6, "text": "Какво се случва с огледалния отблясък при увеличаване на коефициента на блясък n във функцията cosⁿ(φ)?", "opts": ["Отблясъкът става по-малък и по-остър", "Отблясъкът става по-голям и по-разпръснат", "Отблясъкът изчезва напълно", "Променя се цветът на отблясъка"], "correct": 0, "expl": "По-голямо n → по-бърз спад → по-малък отблясък"}, {"id": "L11-A-7", "n": 7, "text": "Какво интерполира засенчването на Гуро (Gouraud shading)?", "opts": ["Нормалните вектори", "Текстурните координати", "Интензитета (цвета) на светлината, изчислен във върховете", "Нищо — използва една стойност за целия полигон"], "correct": 2, "expl": "Гуро интерполира интензитета"}, {"id": "L11-A-8", "n": 8, "text": "Какво интерполира засенчването на Фонг (Phong shading)?", "opts": ["Интензитета на светлината", "Нормалните вектори на върховете, като осветлението се изчислява за всеки пиксел", "Само цветовете на върховете", "Позицията на светлината"], "correct": 1, "expl": "Фонг интерполира нормалите"}, {"id": "L11-A-9", "n": 9, "text": "Какъв допълнителен вектор използва моделът на Блин–Фонг за огледалната компонента?", "opts": ["Вектора на отражението R", "Вектора нагоре (up)", "Тангенциалния вектор", "Междинния (halfway) вектор H между L и V"], "correct": 3, "expl": "H = normalize(L + V)"}, {"id": "L11-A-10", "n": 10, "text": "Каква е основната идея на shadow mapping?", "opts": ["Всичко, което не може да бъде „видяно“ от светлината, е в сянка; използват се два прохода с буфер за дълбочина от гледна точка на светлината", "Сянката се проектира върху равнина чрез матрица", "Изчислява се обемът, засенчен от обекта", "Сенките се рисуват ръчно в текстурата"], "correct": 0, "expl": "Два прохода, Z-буфер от светлината"}], "B": [{"id": "L11-B-1", "n": 1, "text": "Какви компоненти има глобалната околна светлина?", "opts": ["Ambient, diffuse и specular", "Само diffuse", "Само ambient", "Позиция и посока"], "correct": 2, "expl": "Само ambient"}, {"id": "L11-B-2", "n": 2, "text": "Кое е характерно за позиционната светлина?", "opts": ["Няма местоположение", "Има конкретно местоположение и може да включва затихване на интензитета с разстоянието", "Лъчите ѝ са винаги успоредни", "Има само околна компонента"], "correct": 1, "expl": "Позиция + затихване"}, {"id": "L11-B-3", "n": 3, "text": "Кои четири стойности определят материал в ADS модела?", "opts": ["Ambient, diffuse, specular RGBA стойности и блясък (shininess)", "Цвят, текстура, нормала и дълбочина", "Позиция, посока, ъгъл и затихване", "Albedo, roughness, metalness и AO"], "correct": 0, "expl": "A, D, S + shininess"}, {"id": "L11-B-4", "n": 4, "text": "Как работи фасетното (плоско) засенчване?", "opts": ["Интерполира нормалите", "Изчислява осветлението за всеки пиксел", "Използва halfway вектор", "Целият полигон получава една и съща стойност на осветлението"], "correct": 3, "expl": "Една стойност за полигона"}, {"id": "L11-B-5", "n": 5, "text": "Какво е основното ограничение на проективните сенки?", "opts": ["Работят само върху равнинни повърхности", "Изключително скъпи изчислително", "Изискват два прохода на рендиране", "Не могат да се използват в игри"], "correct": 0, "expl": "Само равнини"}, {"id": "L11-B-6", "n": 6, "text": "Кой метод за сенки, предложен от Кроу през 1977 г., е много точен, но изчислително скъп, и използва стенсилния буфер?", "opts": ["Проективни сенки", "Shadow mapping", "Сенчести обеми (shadow volumes)", "Ambient Occlusion"], "correct": 2, "expl": "Shadow volumes (Crow, 1977)"}, {"id": "L11-B-7", "n": 7, "text": "Кога пикселът е в сянка при втория проход на shadow mapping?", "opts": ["Когато разстоянието до светлината е по-малко от стойността в сенчестия буфер", "Когато разстоянието до светлината е по-голямо от стойността в сенчестия буфер", "Когато нормалата сочи към светлината", "Когато алфа стойността е 0"], "correct": 1, "expl": "По-далеч от най-близкия обект → в сянка"}, {"id": "L11-B-8", "n": 8, "text": "Кой тип sampler предоставя OpenGL за сенчеста текстура (shadow texture)?", "opts": ["sampler2D", "samplerCube", "sampler3D", "sampler2DShadow"], "correct": 3, "expl": "sampler2DShadow"}, {"id": "L11-B-9", "n": 9, "text": "В стратегията `fragColor = textureColor * (ambientLight + diffuseLight) + specularLight` от какво се определя огледалният цвят?", "opts": ["Само от текстурата", "От материала", "Изцяло от светлината", "От алфа канала"], "correct": 2, "expl": "Specular — само от светлината"}, {"id": "L11-B-10", "n": 10, "text": "Как обикновено се затъмнява пиксел, който е в сянка при shadow mapping?", "opts": ["Става напълно черен", "Рендира се само околната (ambient) компонента, без дифузна и огледална", "Става прозрачен", "Не се рендира изобщо"], "correct": 1, "expl": "Само ambient"}], "C": [{"id": "L11-C-1", "n": 1, "text": "Как още се наричат опростените модели на осветление, когато се използват шейдъри?", "opts": ["Модели на растеризация", "Модели на отражение (reflection model)", "Модели на теселация", "Модели на проекция"], "correct": 1, "expl": "Shading models или reflection models"}, {"id": "L11-C-2", "n": 2, "text": "Защо в компютърната графика не се симулира пълното поведение на фотоните?", "opts": ["Защото е изчислително непосилно — изисква проследяване на огромен брой фотони", "Защото ADS моделът е по-точен от физиката", "Защото фотоните не се отразяват от повърхности", "Защото GPU не поддържа RGB цветове"], "correct": 0, "expl": "Затова се ползват опростени модели"}, {"id": "L11-C-3", "n": 3, "text": "Коя компонента на ADS модела зависи от ъгъла на падане на светлината и създава усещане за обем и форма?", "opts": ["Околната", "Емисията", "Дифузната", "Огледалната"], "correct": 2, "expl": "Diffuse зависи от ъгъла на падане"}, {"id": "L11-C-4", "n": 4, "text": "Какъв реален феномен симулира глобалната околна светлина?", "opts": ["Светлина от лампа с определено местоположение", "Светлина, отразила се толкова много пъти, че източникът и посоката ѝ са неопределими", "Светлина от безкрайно далечен източник с успоредни лъчи", "Светлина, излъчвана в тесен конус"], "correct": 1, "expl": "Многократно отразена светлина без определим източник"}, {"id": "L11-C-5", "n": 5, "text": "Защо насочената светлина има собствена ambient компонента, въпреки че в сцената има глобална околна светлина?", "opts": ["Защото глобалната околна светлина няма RGBA стойност", "За да получи позиция в сцената", "За да се увеличи общият околен принос, когато светлината е „включена“", "За да може да хвърля сенки"], "correct": 2, "expl": "Разделянето е умишлено — личи при включване и изключване"}, {"id": "L11-C-6", "n": 6, "text": "Позиционна светлина има kc = 1, kl = 0.5, kq = 0.25. Колко е коефициентът на затихване на разстояние d = 2?", "opts": ["1", "1/4", "1/2", "1/3"], "correct": 3, "expl": "1 / (1 + 0.5·2 + 0.25·4) = 1 / 3"}, {"id": "L11-C-7", "n": 7, "text": "Какъв е коефициентът на интензитет на прожектор, когато ъгълът φ е по-голям от ъгъла на отрязване θ?", "opts": ["1", "0", "cos^exp(θ)", "cos(φ)"], "correct": 1, "expl": "Извън конуса коефициентът е 0"}, {"id": "L11-C-8", "n": 8, "text": "Какво регулира показателят на спад (exponent) на прожектора?", "opts": ["Цвета на светлината", "Затихването с разстоянието", "Позицията на прожектора", "Скоростта, с която коефициентът на интензитет клони към 0 с увеличаване на ъгъла φ"], "correct": 3, "expl": "По-голям показател → по-бърз спад към ръба на конуса"}, {"id": "L11-C-9", "n": 9, "text": "Каква е стойността на блясъка (shininess) на калай (pewter) в примера от лекцията?", "opts": ["9.85", "0.6", "128", "1.0"], "correct": 0, "expl": "pewterMatShininess = 9.85"}, {"id": "L11-C-10", "n": 10, "text": "Каква стойност в алфа канала на материала означава напълно прозрачен обект?", "opts": ["255", "0.5", "1.0", "0.0"], "correct": 3, "expl": "Алфа е непрозрачност: 1.0 = непрозрачен, 0.0 = прозрачен"}], "D": [{"id": "L11-D-1", "n": 1, "text": "Как се изчислява околният (ambient) принос към осветлението?", "opts": ["Чрез скаларното произведение N · L", "Чрез (R · V)^n", "Като произведение на околната светлина и коефициента на околно отражение на материала", "Чрез 1 / (kc + kl·d + kq·d²)"], "correct": 2, "expl": "I_a = Light_a · Material_a"}, {"id": "L11-D-2", "n": 2, "text": "Кои два вектора са нужни за определяне на ъгъла на падане θ при дифузното осветление?", "opts": ["R (отражение) и V (към окото)", "H (halfway) и V", "V и вектора нагоре", "L (към светлината) и N (нормалата)"], "correct": 3, "expl": "θ е ъгълът между L и N"}, {"id": "L11-D-3", "n": 3, "text": "Как се получава cos θ при дифузното осветление, без да се изчислява самият ъгъл?", "opts": ["Чрез арктангенс", "От сенчестия буфер", "Чрез скаларното произведение на нормализираните вектори N и L", "Чрез векторното произведение на N и L"], "correct": 2, "expl": "cos θ = N · L за единични вектори"}, {"id": "L11-D-4", "n": 4, "text": "Бяла светлина с дифузна компонента 1.0 пада върху материал с дифузен коефициент 0.8 под ъгъл 60° спрямо нормалата. Колко е дифузният принос?", "opts": ["0.8", "0.0", "0.69", "0.4"], "correct": 3, "expl": "1.0 · 0.8 · cos 60° = 0.8 · 0.5 = 0.4"}, {"id": "L11-D-5", "n": 5, "text": "Как се определя нормалният вектор N, ако моделът не включва нормали?", "opts": ["Винаги се приема (0, 0, 1)", "Оценява се геометрично въз основа на местоположението на съседните върхове", "Взима се векторът към светлината L", "Чете се от mipmap"], "correct": 1, "expl": "Без нормали в модела N се оценява от съседните върхове"}, {"id": "L11-D-6", "n": 6, "text": "Какво представлява векторът V в огледалното изчисление?", "opts": ["Векторът от пиксела към окото", "Векторът към светлинния източник", "Посоката на отражение на светлината", "Нормалата към повърхността"], "correct": 0, "expl": "V е отрицанието на вектора от окото към пиксела"}, {"id": "L11-D-7", "n": 7, "text": "Как обикновено се получава нормалният вектор във всеки връх при засенчване на Гуро?", "opts": ["Чрез осредняване на нормалите на съседните повърхности", "Чрез halfway вектора", "Чете се от нормалова карта", "Взима се векторът към камерата"], "correct": 0, "expl": "Нормалите на върховете се осредняват от съседните стени"}, {"id": "L11-D-8", "n": 8, "text": "Защо фасетното (плоско) засенчване рядко се използва днес?", "opts": ["Защото е твърде бавно", "Защото изображенията не изглеждат реалистично, а съвременният хардуер позволява по-точни изчисления", "Защото не поддържа текстури", "Защото изисква сенчест буфер"], "correct": 1, "expl": "Нереалистично и вече ненужно"}, {"id": "L11-D-9", "n": 9, "text": "Каква е основната цел на модела на Блин–Фонг спрямо класическия Фонг?", "opts": ["Да премахне дифузната компонента", "Да замени текстурите", "Да изчислява сенки", "Огледалните отблясъци да се изчисляват по-бързо и по-стабилно, особено при движение на камерата или светлината"], "correct": 3, "expl": "Подобрение на огледалната компонента чрез halfway вектор"}, {"id": "L11-D-10", "n": 10, "text": "Коя стратегия за комбиниране на текстура и осветление е подходяща за плат, нелакирано дърво или злато?", "opts": ["`fragColor = textureColor * (ambientLight + diffuseLight + specularLight)`", "`fragColor = 0.5 * textureColor + 0.5 * lightColor`", "`fragColor = textureColor * (ambientLight + diffuseLight) + specularLight`", "`fragColor = textureColor + specularLight`"], "correct": 0, "expl": "Огледалният акцент включва цвета на повърхността"}], "E": [{"id": "L11-E-1", "n": 1, "text": "Кой от изброените е типичен пример за позиционна светлина?", "opts": ["Светлина с успоредни лъчи от фиксирана посока", "Глобалната околна светлина", "Лампи и свещи", "Слънцето"], "correct": 2, "expl": "Позиционна светлина — лампи, свещи и др."}, {"id": "L11-E-2", "n": 2, "text": "В какви граници е ъгълът на отрязване θ на прожектора и какво определя той?", "opts": ["0°–90°, полуширината на светлинния лъч", "0°–360°, посоката на прожектора", "90°–180°, затихването с разстоянието", "0°–180°, пълната ширина на лъча"], "correct": 0, "expl": "θ между 0° и 90° е полуширината на конуса"}, {"id": "L11-E-3", "n": 3, "text": "Прожектор има показател на спад 2 и ъгъл на отрязване θ = 70°. Какъв е коефициентът на интензитет за пиксел при φ = 60°?", "opts": ["0.5", "1", "0", "0.25"], "correct": 3, "expl": "φ < θ, затова cos²(60°) = 0.5² = 0.25"}, {"id": "L11-E-4", "n": 4, "text": "Какво контролира стойността p в модела на Уорн за прожектор?", "opts": ["Цвета на светлината", "Колко силно прожекторът се фокусира", "Броя на светлините в сцената", "Разстоянието до прожектора"], "correct": 1, "expl": "I = I_S · f_att · cos^p(γ), p управлява фокуса"}, {"id": "L11-E-5", "n": 5, "text": "Кое свойство на материала е полезно при симулиране на фосфоресциращи материали?", "opts": ["Блясък (shininess)", "Алфа канал", "Емисия", "Околен коефициент"], "correct": 2, "expl": "Емисията моделира собствено излъчване на светлина"}, {"id": "L11-E-6", "n": 6, "text": "Кои материали от таблицата в лекцията включват малко прозрачност (алфа малко под 1.0)?", "opts": ["Злато и сребро", "Нефрит и перла", "Бронз и хром", "Калай и мед"], "correct": 1, "expl": "Нефрит и перла — за повече реализъм"}, {"id": "L11-E-7", "n": 7, "text": "При огледалното изчисление R · V = 0.5, коефициентът на блясък n = 3, а огледалните компоненти на светлината и материала са 1. Колко е огледалният принос?", "opts": ["0.5", "0.25", "1.5", "0.125"], "correct": 3, "expl": "0.5³ = 0.125"}, {"id": "L11-E-8", "n": 8, "text": "Каква е разликата между „shadow buffering“ и „shadow mapping“?", "opts": ["Няма разлика — това са синоними", "При shadow mapping се рендира само от гледната точка на камерата", "При shadow mapping Z-буферът се копира в текстура, а при shadow buffering — в отделен буфер", "При shadow buffering се използва стенсилният буфер"], "correct": 2, "expl": "Копиране в текстура = shadow mapping"}, {"id": "L11-E-9", "n": 9, "text": "Как се получава сянката при метода на проективните сенки?", "opts": ["Чрез Ambient Occlusion карта", "Трансформационна матрица преобразува точките на обекта в точки върху равнината, образувайки тъмен „сенчест полигон“", "Чрез два прохода с буфер за дълбочина", "Чрез стенсилния буфер и геометрични шейдъри"], "correct": 1, "expl": "Проекция на обекта върху равнината чрез матрица"}, {"id": "L11-E-10", "n": 10, "text": "Какъв проблем показва сцената с тор над текстуриран куб, рендирана без сенки?", "opts": ["Невъзможно е да се прецени дали торът лежи върху куба или се носи над него", "Торът изчезва от сцената", "Появява се силен aliasing", "Цветовете на куба са неправилни"], "correct": 0, "expl": "Без сенки не се преценява взаимното разположение"}]}}, {"num": 12, "title": "Лекция 12 — Виртуална реалност. Стереоскопия", "short": "Виртуална реалност. Стереоскопия", "summary": "### VR, AR, MR\n| | Какво прави | Пример |\n|---|---|---|\n| **VR** | **Напълно изкуствена среда**, изолира потребителя от реалния свят (шлем + слушалки); илюзия за присъствие | Игри, симулатори (пилоти, лекари, войници), **психотерапия (фобии)**, архитектура |\n| **AR** | **Допълва** реалната среда с дигитални елементи (смартфон, таблет, AR очила); **не** се стреми към пълна имерсивност | **Pokémon Go**; техник с AR очила вижда схеми |\n| **MR** | Междинна форма; реални и виртуални обекти **съществуват и взаимодействат** (закриват се от реални предмети, отскачат от маса) | **Microsoft HoloLens**; медицина, индустрия, образование |\n\n### Имерсивност и присъствие\n- **Имерсивност** — **ключовото понятие за дълбочината на потапяне**. Фактори:\n  1. колко **заобиколен** се чувства наблюдателят;\n  2. колко **ясна** е стимулацията;\n  3. колко **взаимодействия** са възможни;\n  4. **брой участващи сетива** (зрение, слух, допир, вкус, обоняние, равновесие…);\n  5. **съгласуваност** между сетивните модалности;\n  6. съгласуваност на възможните действия.\n- Дефиниция: „обективната степен, до която VR системата проектира стимули върху сетивните рецептори по начин, който е **обширен, съвпадащ, заобикалящ, жив, интерактивен и с подчинен сюжет**“.\n- **Присъствие (presence)** — усещането, че **наистина си там**. **Имерсивността е техническата предпоставка** за присъствие; потребителят също трябва доброволно да се ангажира.\n- **Долината на странността (uncanny valley)** — почти, но не съвсем реалистични виртуални хора предизвикват **дискомфорт/отвращение** (напр. The Polar Express, 2004). Избягва се с **по-абстрактна (карикатурна)** визуализация или **много детайлна** анимация.\n\n### Възприятия\n- **Над 70%** от информацията идва чрез **зрението** → картината трябва да е **остра, плавна, естествена**.\n- **Слух** — пространствен **3D звук**.\n- **Допир** — хаптична обратна връзка (ръкавици, вибрации).\n- **Равновесие (вестибуларна система)** — **платформи за движение**.\n\n### Фактори за добра имерсивност\n1. **FoV** — типично **90°–120°**; 180°–210° е значително по-добре; тесен FoV → усещане за „прозорец“.\n2. **Резолюция и честота** — висока резолюция срещу **screen-door effect** (видими пиксели); **≥ 90 Hz** задължително, иначе замайване и гадене.\n3. **Стереоскопично виждане** — двете очи виждат различни изображения → дълбочина; без него обектите са „плоски“.\n- **VR sickness / motion sickness** — конфликт между сетивата (напр. „летиш“, но седиш → зрение и баланс се разминават): гадене, замаяност, изпотяване. **Основна причина — латентността (latency)** между действието и реакцията.\n\n### Хардуер\n- **Шлемове**: Oculus Rift / **Meta Quest** (безжични), **HTC Vive** (точно проследяване, външни **base stations**), **Valve Index** (много висока честота, проследяване на ръцете), **Sony PlayStation VR** (за конзоли), Pico, Varjo, Pimax.\n- **Контролери** (бутони, сензори за натиск/движение), **хаптични ръкавици** (проследяване на пръсти + тактилна обратна връзка), **платформи за движение** (летене, шофиране).\n- **Проследяване**:\n  - **Head tracking** — гироскопи, акселерометри, камери → смяна на гледната точка.\n  - **Eye tracking** — инфрачервени сензори → **фовеално рендериране** (висока резолюция само там, където гледа окото), адаптивен интерфейс.\n  - **Hand tracking** — камери; без контролери; жестове „хващане“, „щипване“.\n\n### Пространствено зрение и стереоскопия\n- **Стереопсис** — гледане с двете очи; най-висшата форма на човешкото зрение.\n- **Стереоскопия** — две различни 2D изображения за лявото и дясното око (леко различни гледни точки).\n\n### Дълбочинни сигнали (depth cues)\n**Монокуларни** (с едно око):\n- **Закриване (occlusion)** — **най-силният** монокуларен сигнал: закриващият обект е отпред.\n- **Линейна перспектива** — успоредните линии се сближават към **изчезваща точка** (релси, пътища).\n- **Относителен размер** / познат размер — по-близките изглеждат по-големи.\n- **Сенки** — разположение и форма.\n- **Относителна височина** спрямо хоризонта.\n- **Текстурен градиент** — плътността на шарката расте с разстоянието (павета, плочки).\n- **Въздушна (атмосферна) перспектива** — далечните обекти са по-замъглени и с по-нисък контраст.\n- **Паралакс при движение (motion parallax)** — при фиксиран поглед близките обекти се движат **обратно** на движението и по-бързо; далечните — **в същата посока** и по-бавно (гледане през прозореца на кола).\n- **Акомодация** — промяна на напрежението на **цилиарния мускул** на лещата при фокусиране; замъглява фона.\n\n**Бинокуларни** (с двете очи):\n- **Конвергенция** — колкото по-близо е обектът, толкова повече очите се завъртат **навътре**.\n- **Бинокуларен диспаратитет (disparity)** — разликата между изображенията на двете ретини; **междузеничното разстояние** е **55–69 mm** (5-ти–95-ти процентил).\n\n- **Акомодация + конвергенция = окуломоторни** дълбочинни сигнали (усещат се чрез мускулното напрежение).\n- За стимулиране на акомодацията изображенията трябва реално да са на различни разстояния → слоеве или холограми, **light-field дисплеи**.\n- Стереоскопично рендиране: една и съща сцена се изчислява от **два центъра на проекция** на разстояние = междузеничното.\n\n### Техники за стереоскопичен изход\n| Техника | Как работи | Бележки |\n|---|---|---|\n| **Anaglyph** | Две изображения в различни цветове, наслагвани в едно; очила **червено (ляво) / циан (дясно)** | **Най-старата и най-достъпна** техника; лявото — само червен канал, дясното — зелен + син |\n| **Side-by-Side (SbS)** | Двете изображения **хоризонтално** едно до друго; лява половина = ляво око | 3D телевизори, VR |\n| **Top-and-Bottom (T&B)** | Едно **над** друго; **горе = ляво око**, долу = дясно | Аналог на SbS, вертикално делене |\n| **Shutter glasses** | **Активни** LCD очила, последователно затъмняват едното око в синхрон с екрана (IR, Bluetooth, кабел) | **≥ 120 Hz** (60 Hz на око) |\n| **Polarized glasses** | **Пасивни**; две изображения едновременно с различна поляризация | Без батерии и синхронизация. Линейна поляризация е чувствителна към **наклон на главата**; **кръговата** — не |\n| **Autostereoscopic** | **Без очила**; екранът насочва различни пиксели към всяко око | **Паралаксна бариера** (маска с вертикални прорези; проста, от близо — мобилни) или **лентикулярна решетка** (микролещи; по-скъпа, по-добро качество и по-широк ъгъл) |\n\n### Капани за изпита\n- Ключовото понятие за потапянето = **имерсивност** (не „присъствие“, не „диспаратитет“).\n- Закриването е най-силният **монокуларен** сигнал; диспаратитетът е **бинокуларен**.\n- Shutter = активни; Polarized = пасивни; Autostereoscopic = без очила.", "testNames": ["A", "B", "C", "D", "E"], "tests": {"A": [{"id": "L12-A-1", "n": 1, "text": "Какво е ключовото понятие за дълбочината на потапяне във VR среда?", "opts": ["Холотопия", "Виртуализация", "Имерсивност", "Диспаратитет"], "correct": 2, "expl": "Имерсивност"}, {"id": "L12-A-2", "n": 2, "text": "Как се нарича ефектът, при който виртуални хора изглеждат почти като истински, но не съвсем, и наблюдателят изпитва дискомфорт?", "opts": ["Screen-door effect", "Долината на странността (uncanny valley)", "Motion parallax", "Ефект на Рунге"], "correct": 1, "expl": "Uncanny valley"}, {"id": "L12-A-3", "n": 3, "text": "Каква минимална честота на опресняване е задължителна за VR, за да се намали рискът от замайване и гадене?", "opts": ["30 Hz", "60 Hz", "75 Hz", "90 Hz"], "correct": 3, "expl": "≥ 90 Hz"}, {"id": "L12-A-4", "n": 4, "text": "Как се нарича ефектът, при който при ниска резолюция на VR дисплея се виждат пикселите на екрана?", "opts": ["Screen-door effect", "Aliasing", "Моаре", "Ghosting"], "correct": 0, "expl": "Screen-door effect"}, {"id": "L12-A-5", "n": 5, "text": "Коя е основната причина за VR sickness?", "opts": ["Високата резолюция", "Широкото зрително поле", "Използването на стереоскопия", "Забавянето (latency) между действието на потребителя и реакцията на виртуалната среда"], "correct": 3, "expl": "Латентност"}, {"id": "L12-A-6", "n": 6, "text": "Кой е най-силният монокуларен дълбочинен сигнал?", "opts": ["Закриване (occlusion)", "Въздушна перспектива", "Текстурен градиент", "Акомодация"], "correct": 0, "expl": "Закриване"}, {"id": "L12-A-7", "n": 7, "text": "Кой от изброените дълбочинни сигнали е бинокуларен?", "opts": ["Линейна перспектива", "Относителен размер", "Бинокуларен диспаратитет", "Паралакс при движение"], "correct": 2, "expl": "Диспаратитет (и конвергенция)"}, {"id": "L12-A-8", "n": 8, "text": "Какви цветове обикновено използват анаглифните очила за лявото и дясното око?", "opts": ["Синьо за лявото, жълто за дясното", "Червено за лявото, циан за дясното", "Зелено за лявото, магента за дясното", "Червено за двете"], "correct": 1, "expl": "Червено/циан"}, {"id": "L12-A-9", "n": 9, "text": "Каква минимална честота на дисплея е нужна за shutter очила (активна 3D технология)?", "opts": ["120 Hz (60 Hz на око)", "30 Hz", "60 Hz (30 Hz на око)", "24 Hz"], "correct": 0, "expl": "≥ 120 Hz, 60 на око"}, {"id": "L12-A-10", "n": 10, "text": "Кои са двата основни метода за autostereoscopic 3D визуализация (без очила)?", "opts": ["Анаглиф и поляризация", "Side-by-Side и Top-and-Bottom", "Shutter и поляризация", "Паралаксна бариера и лентикулярна решетка"], "correct": 3, "expl": "Паралаксна бариера, лентикулярна решетка"}], "B": [{"id": "L12-B-1", "n": 1, "text": "Коя от изброените е пример за добавена реалност (AR)?", "opts": ["Шлем, който напълно изолира потребителя от реалния свят", "Мобилната игра Pokémon Go", "Полетен симулатор с платформа за движение", "Анаглифно изображение"], "correct": 1, "expl": "Pokémon Go"}, {"id": "L12-B-2", "n": 2, "text": "Кое устройство е пример за смесена реалност (MR)?", "opts": ["Microsoft HoloLens", "Sony PlayStation VR", "Kindle", "Анаглифни очила"], "correct": 0, "expl": "HoloLens"}, {"id": "L12-B-3", "n": 3, "text": "Каква е връзката между имерсивност и присъствие?", "opts": ["Те са синоними", "Присъствието е техническата предпоставка за имерсивност", "Нямат връзка", "Имерсивността е техническата предпоставка за присъствие"], "correct": 3, "expl": "Имерсивност → присъствие"}, {"id": ната реалност (VR)?", "opts": ["Реалните и виртуалните обекти съществуват и взаимодействат едновременно", "Създава напълно изкуствена среда, която изолира потребителя от реалния свят", "Допълва реалната среда с дигитални елементи", "Не изисква специални устройства"], "correct": 1, "expl": "VR напълно замества реалната среда"}, {"id": "L12-C-2", "n": 2, "text": "Към какво се стреми добавената реалност (AR)?", "opts": ["Към пълна изолация от реалния свят", "Към замяна на реалната среда с изкуствена", "Към интегриране на виртуалното в реалния свят, като запазва контекста на реалността", "Към пълна имерсивност"], "correct": 2, "expl": "AR допълва, а не заменя реалността"}, {"id": "L12-C-3", "n": 3, "text": "Какво могат да правят виртуалните обекти при смесената реалност (MR)?", "opts": ["Да бъдат закрити от реални предмети, да отскачат от маса, да се хващат и завъртат", "Да се виждат само с анаглифни очила", "Само да показват статичен текст върху изображението", "Да съществуват само в напълно изкуствена среда"], "correct": 0, "expl": "При MR виртуалното реагира на реалната среда"}, {"id": "L12-C-4", "n": 4, "text": "Кой от изброените е един от факторите на имерсивността?", "opts": ["Броят на полигоните в модела", "Цената на устройството", "Размерът на файловете на сцената", "Броят на участващите сетива"], "correct": 3, "expl": "Фактор 4 — брой сетива (зрение, слух, допир и др.)"}, {"id": "L12-C-5", "n": 5, "text": "Как може да се избегне ефектът „долината на странността“?", "opts": ["Чрез по-абстрактна (карикатурна) визуализация или много детайлна и реалистична анимация", "Чрез намаляване на честотата на опресняване", "Чрез монохромно изображение", "Чрез средно реалистична визуализация на хората"], "correct": 0, "expl": "Абстракция или много висок реализъм"}, {"id": "L12-C-6", "n": 6, "text": "Сцена от кой филм е дадена в лекцията като пример за долината на странността?", "opts": ["Toy Story (1995)", "Avatar (2009)", "The Polar Express (2004)", "Shrek (2001)"], "correct for (const q of ALL.concat(SAMPLE)) BY_ID[q.id] = q;

const PFX = 'kgvr'; // префикс на ключовете в localStorage
let settings = store.get(PFX + '-settings', { instant: false, shuffle: false });
let mistakes = new Set(store.get(PFX + '-mistakes', []));
let best = store.get(PFX + '-best', {});
let theme = store.get(PFX + '-theme', 'auto');
let hist = store.get(PFX + '-history', []);
if (!Array.isArray(hist)) hist = [];
let userName = store.get(PFX + '-name', null);
let editName = false;
applyTheme();

let Q = null, timerId = null;

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lecName(n) { if (!n) return 'Примерен тест'; const l = DATA.lectures.find(x => x.num === n); return 'Лекция ' + n + ' — ' + l.short; }
function render(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h + ':' + pad(m) + ':' + pad(s); }

function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
const THEME_LABEL = { auto: '◐ Тема: авто', light: '☀ Тема: светла', dark: '☾ Тема: тъмна' };

function badge(key) {
  const b = best[key];
  if (!b) return '';
  const cls = b.s / b.t >= 0.9 ? 'good' : (b.s / b.t < 0.6 ? 'bad' : '');
  return `<span class="badge ${cls}">${b.s}/${b.t}</span>`;
}

/* ---------- Начало ---------- */
function home() {
  stopTimer(); Q = null;
  const lecs = DATA.lectures.map(l => `
    <div class="lec">
      <div class="lec-h"><span class="num">${l.num}</span><span class="lec-t">${esc(l.short)}</span></div>
      <div class="row">
        <button class="btn ghost" data-act="sum" data-l="${l.num}">Резюме</button>
        ${l.testNames.map(t => `<button class="btn" data-act="test" data-l="${l.num}" data-t="${t}">Тест ${t} ${badge('L' + pad(l.num) + '-' + t)}</button>`).join('')}
        <button class="btn ghost" data-act="allq" data-l="${l.num}" title="Всички тестове заедно, в случаен ред">Всички ${l.testNames.length * 10} разбъркани ${badge('L' + pad(l.num) + '-ALL')}</button>
      </div>
    </div>`).join('');
  render(`
    <div class="topbar">
      <div><h1>КГВР — подготовка за изпита</h1><div class="muted">${ALL.length} въпроса от 12 лекции · по 1 верен отговор от a–d</div></div>
      <div class="row">
        ${userName !== null ? `<span class="who" id="who">Профил: <b>${esc(userName)}</b> · <button class="linkbtn" data-act="rename">смени</button></span>` : ''}
        <button class="btn ghost" data-act="theme">${THEME_LABEL[theme]}</button>
      </div>
    </div>
    ${nameCard()}
    <div class="grid3">
      <div class="card">
        <h3>Пробен изпит</h3>
        <p>Случайни въпроси от всички лекции, с таймер (6 мин на въпрос), като в Moodle.</p>
        <div class="row">
          <select id="mockN" aria-label="Брой въпроси"><option>10</option><option>20</option><option>30</option><option>40</option></select>
          <button class="btn primary" data-act="mock">Започни</button>
        </div>
      </div>
      <div class="card">
        <h3>Примерният тест</h3>
        <p>10-те въпроса от снимките в папка t/, с верните отговори. ${badge('SAMPLE')}</p>
        <button class="btn primary" data-act="sample">Реши го</button>
      </div>
      <div class="card">
        <h3>Грешни въпроси</h3>
        <p>Всеки въпрос, на който си сгрешил, остава тук, докато не му отговориш вярно.</p>
        <button class="btn primary" data-act="mist" ${mistakes.size ? '' : 'disabled'}>Упражни (${mistakes.size})</button>
      </div>
      <div class="card">
        <h3>Моят прогрес</h3>
        <p>История на опитите, статистика по теми, най-слабите теми и експорт/импорт на прогреса.</p>
        <button class="btn primary" data-act="progress">Виж (${hist.length} опита)</button>
      </div>
    </div>
    <h2>Настройки</h2>
    <div class="card">
      <label class="toggle"><input type="checkbox" id="setInstant" ${settings.instant ? 'checked' : ''}> Покажи верния отговор веднага след избора (режим упражнение)</label>
      <label class="toggle"><input type="checkbox" id="setShuffle" ${settings.shuffle ? 'checked' : ''}> Разбъркай реда на отговорите a–d</label>
      <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="reset">Изчисти прогреса</button></div>
    </div>
    <h2>Лекции</h2>
    ${lecs}
  `);
}

/* ---------- Резюме ---------- */
function summary(n) {
  stopTimer(); Q = null;
  const l = DATA.lectures.find(x => x.num === n);
  const body = window.marked ? marked.parse(l.summary) : `<pre style="white-space:pre-wrap">${esc(l.summary)}</pre>`;
  render(`
    <div class="topbar">
      <button class="btn ghost" data-act="home">← Начало</button>
      <div class="row">
        <button class="btn" data-act="sum" data-l="${n - 1}" ${n > 1 ? '' : 'disabled'}>‹ Предишна</button>
        <button class="btn" data-act="sum" data-l="${n + 1}" ${n < DATA.lectures.length ? '' : 'disabled'}>Следваща ›</button>
      </div>
    </div>
    <h1 style="margin-bottom:14px">${esc(l.title)}</h1>
    <div class="md">${body}</div>
    <div class="row" style="margin-top:16px">

    </div>
  `);
}

/* ---------- Тест ---------- */
function startQuiz(key, title, qs) {
  const items = qs.map(q => ({ id: q.id, order: settings.shuffle ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3] }));
  Q = {
    key, title, items, src: qs,
    answers: Array(items.length).fill(null),
    flags: Array(items.length).fill(false),
    idx: 0, start: Date.now(), end: Date.now() + items.length * SEC_PER_Q * 1000,
    instant: settings.instant, done: false
  };
  setHash('#/quiz', /^#\/(quiz|results)$/.test(location.hash));
  startTimer();
  renderQ();
}

function navGrid() {
  return Q.items.map((it, i) => {
    const q = BY_ID[it.id], a = Q.answers[i];
    let cls = 'nav-b';
    if (a !== null) cls += (Q.instant ? (a === q.correct ? ' r-ok' : ' r-bad') : ' ans');
    if (i === Q.idx) cls += ' cur';
    if (Q.flags[i]) cls += ' fl';
    return `<button class="${cls}" data-act="go" data-i="${i}" aria-label="Въпрос ${i + 1}">${i + 1}</button>`;
  }).join('');
}

function matrixHtml(m) {
  return `<table class="mtx">${m.map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</table>`;
}

function renderQ() {
  const it = Q.items[Q.idx], q = BY_ID[it.id], a = Q.answers[Q.idx];
  const locked = Q.instant && a !== null;
  const opts = it.order.map((oi, pos) => {
    let cls = 'opt';
    if (locked) { if (oi === q.correct) cls += ' ok'; else if (oi === a) cls += ' bad'; }
    else if (oi === a) cls += ' sel';
    return `<label class="${cls}"><input type="radio" name="opt" value="${oi}" ${oi === a ? 'checked' : ''} ${locked ? 'disabled' : ''}>
      <span class="ltr">${LETTERS[pos]}.</span><span>${inl(q.opts[oi])}</span></label>`;
  }).join('');
  const fb = locked
    ? `<div class="fb ${a === q.correct ? 'good' : 'wrong'}"><b>${a === q.correct ? 'Вярно!' : 'Грешно. Верният отговор е ' + LETTERS[it.order.indexOf(q.correct)] + '.'}</b> <span>${inl(q.expl)}</span></div>`
    : '';
  const status = a === null ? 'Все още не е даден отговор' : (locked ? (a === q.correct ? 'Верен' : 'Грешен') : 'Отговорен');
  const last = Q.idx === Q.items.length - 1;
  render(`
    <div class="topbar">
      <div><div class="muted" style="font-size:.85rem">КГВР</div><h1 style="font-size:1.25rem">${esc(Q.title)}</h1></div>
      <div class="row">
        <div class="timer" id="timer">Оставащо време ${fmt((Q.end - Date.now()) / 1000)}</div>
        <button class="btn ghost" data-act="quit">← Назад</button>
      </div>
    </div>
    <div class="quiz">
      <div class="side"><div class="card">
        <div style="font-weight:600;font-size:.92rem">Навигация в теста</div>
        <div class="navgrid">${navGrid()}</div>
        <button class="btn" style="width:100%;justify-content:center" data-act="finish">Приключване на опита…</button>
      </div></div>
      <div>
        <div class="qwrap">
          <div class="qinfo">
            <div class="qn">Въпрос <b>${Q.idx + 1}</b></div>
            <div>${status}</div>
            <div>От максимално 1,00</div>
            <button class="flagbtn ${Q.flags[Q.idx] ? 'on' : ''}" data-act="flag">⚑ ${Q.flags[Q.idx] ? 'Отбелязан' : 'Отбелязване на въпроса'}</button>
          </div>
          <div class="qbox">
            <div class="lectag">${esc(lecName(q.lec))}</div>
            <p class="qtext">${inl(q.text)}</p>
            ${q.matrix ? matrixHtml(q.matrix) : ''}
            <div role="radiogroup">${opts}</div>
            ${fb}
          </div>
        </div>
        <div class="qnav">
          <button class="btn" data-act="prev" ${Q.idx === 0 ? 'disabled' : ''}>Обратно</button>
          ${last ? '<button class="btn primary" data-act="finish">Приключване на опита</button>'
                 : '<button class="btn primary" data-act="next">Следваща страница</button>'}
        </div>
        <div class="kbd">Клавиши: 1–4 избор · ← → навигация · F отбелязване</div>
      </div>
    </div>
  `);
}

function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    if (!Q || Q.done) return stopTimer();
    const left = (Q.end - Date.now()) / 1000;
    const el = document.getElementById('timer');
    if (el) { el.textContent = 'Оставащо време ' + fmt(left); el.classList.toggle('low', left < 120); }
    if (left <= 0) finish(true);
  }, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function finish(auto) {
  if (!Q || Q.done) return;
  if (!auto) {
    const un = Q.answers.filter(x => x === null).length;
    const msg = un ? `Има ${un} въпроса без отговор. Да приключа ли опита?` : 'Да приключа ли опита и да видя резултата?';
    if (!confirm(msg)) return;
  }
  stopTimer();
  Q.done = true;
  Q.used = Math.min((Date.now() - Q.start) / 1000, Q.items.length * SEC_PER_Q);
  let s = 0;
  Q.items.forEach((it, i) => {
    if (Q.answers[i] === BY_ID[it.id].correct) { s++; mistakes.delete(it.id); }
    else mistakes.add(it.id);
  });
  Q.score = s;
  store.set(PFX + '-mistakes', [...mistakes]);
  if (Q.key) {
    const b = best[Q.key];
    if (!b || s / Q.items.length > b.s / b.t) { best[Q.key] = { s, t: Q.items.length }; store.set(PFX + '-best', best); }
  }
  recordAttempt(s);
  setHash('#/results', true);
  results(auto);
}

function results(auto) {
  const t = Q.items.length, pct = Math.round(Q.score / t * 100);
  const col = pct >= 90 ? 'var(--ok)' : pct >= 60 ? 'var(--accent)' : 'var(--bad)';
  const wrongIdx = Q.items.map((it, i) => Q.answers[i] === BY_ID[it.id].correct ? -1 : i).filter(i => i >= 0);
  const rev = Q.items.map((it, i) => {
    const q = BY_ID[it.id], a = Q.answers[i], ok = a === q.correct;
    const opts = it.order.map((oi, pos) => {
      let cls = 'opt';
      if (oi === q.correct) cls += ' ok'; else if (oi === a) cls += ' bad';
      const tag = oi === a ? ' <span class="badge">твоят отговор</span>' : '';
      return `<div class="${cls}"><span class="ltr">${LETTERS[pos]}.</span><span>${inl(q.opts[oi])}${tag}</span></div>`;
    }).join('');
    return `<div class="rev ${ok ? 'ok' : 'bad'}">
      <div class="lectag">Въпрос ${i + 1} · ${esc(lecName(q.lec))} ${a === null ? '· <b>без отговор</b>' : ''}</div>
      <p class="qtext" style="margin-bottom:8px">${inl(q.text)}</p>
      ${q.matrix ? matrixHtml(q.matrix) : ''}
      ${opts}
      <div class="why"><b>Обяснение:</b> ${inl(q.expl)}</div>
    </div>`;
  }).join('');
  render(`
    <div class="topbar">
      <button class="btn ghost" data-act="back">← Назад</button>
      <div class="row">
        <button class="btn" data-act="retry">Опитай отново</button>
        <button class="btn primary" data-act="retrywrong" ${wrongIdx.length ? '' : 'disabled'}>Само грешните (${wrongIdx.length})</button>
      </div>
    </div>
    <div class="card score">
      <div class="ring" style="background:conic-gradient(${col} ${pct * 3.6}deg, var(--border) 0)"><span>${Q.score}/${t}</span></div>
      <div>
        <h1 style="font-size:1.3rem">${esc(Q.title)}</h1>
        <div style="font-size:1.1rem;margin:4px 0">${pct}% · ${pct >= 90 ? 'Отлично!' : pct >= 60 ? 'Добре, но прегледай грешките.' : 'Прочети резюмето и опитай пак.'}</div>
        <div class="muted">Време: ${fmt(Q.used)}${auto ? ' · времето изтече' : ''}</div>
      </div>
    </div>
    <h2>Преглед</h2>
    ${rev}
  `);
  Q.wrongIdx = wrongIdx;
}

/* ---------- Профил и прогрес ---------- */
const HIST_MAX = 500;
const pct = (s, t) => t ? Math.round(s / t * 100) : 0;
const fmtDate = ts => { const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function pctBadge(p) { return `<span class="badge ${p >= 90 ? 'good' : p < 60 ? 'bad' : ''}">${p}%</span>`; }

function nameCard() {
  if (userName !== null && !editName) return '';
  return `
    <div class="card" style="margin-bottom:14px">
      <h3>${editName ? 'Смяна на името' : 'Как да те наричам?'}</h3>
      <p>Името и прогресът се пазят само в този браузър. Можеш да ги пренесеш на друго устройство с „Експорт“ от „Моят прогрес“.</p>
      <div class="row">
        <input id="nameIn" class="inp" maxlength="40" autocomplete="nickname" placeholder="Твоето име" value="${esc(editName ? userName || '' : '')}">
        <button class="btn primary" data-act="saveName">Запази</button>
        <button class="btn ghost" data-act="skipName">${editName ? 'Отказ' : 'Пропусни'}</button>
      </div>
    </div>`;
}

function setName(n) {
  userName = (n || '').trim().slice(0, 40) || 'Гост';
  editName = false;
  store.set(PFX + '-name', userName);
  home();
}

function recordAttempt(s) {
  const m = /^L(\d+)-/.exec(Q.key || '');
  hist.push({ ts: Date.now(), key: Q.key || 'MIX', title: Q.title, score: s, total: Q.items.length, lec: m ? +m[1] : 0 });
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  store.set(PFX + '-history', hist);
}

function topicStats() {
  const by = {};
  for (const h of hist) {
    const k = h.lec || 0;
    const o = by[k] || (by[k] = { n: 0, sum: 0, best: 0, last: 0 });
    const p = h.total ? h.score / h.total : 0;
    o.n++; o.sum += p; o.best = Math.max(o.best, p); o.last = Math.max(o.last, h.ts);
  }
  return by;
}

function progress(msg) {
  stopTimer(); Q = null;
  const n = hist.length;
  const qs = hist.reduce((a, h) => a + h.total, 0), ok = hist.reduce((a, h) => a + h.score, 0);
  const avg = n ? Math.round(hist.reduce((a, h) => a + (h.total ? h.score / h.total : 0), 0) / n * 100) : 0;
  const by = topicStats();
  const weak = DATA.lectures.filter(l => by[l.num] && by[l.num].sum / by[l.num].n < 0.9).sort((a, b) => by[a.num].sum / by[a.num].n - by[b.num].sum / by[b.num].n).slice(0, 3).map(l => l.num);
  const row = (label, o, isWeak) => `<tr class="${isWeak ? 'weak' : ''}">
      <td class="t">${label}${isWeak ? ' <span class="badge bad">слаба</span>' : ''}</td>
      <td class="n">${o ? o.n : '—'}</td>
      <td class="n">${o ? pctBadge(Math.round(o.best * 100)) : '—'}</td>
      <td class="n">${o ? Math.round(o.sum / o.n * 100) + '%' : '—'}</td>
      <td class="dt">${o ? fmtDate(o.last) : '<span class="muted">няма опит</span>'}</td></tr>`;
  const rows = DATA.lectures.map(l => row(`<b>${l.num}.</b> ${esc(l.short)}`, by[l.num], weak.includes(l.num))).join('')
    + (by[0] ? row('<i>Смесени (пробни изпити, грешни въпроси и др.)</i>', by[0], false) : '');
  const recent = hist.slice(-30).reverse().map(h => `<tr>
      <td class="dt">${fmtDate(h.ts)}</td><td class="t">${esc(h.title)}</td>
      <td class="n">${h.score}/${h.total}</td><td class="n">${pctBadge(pct(h.score, h.total))}</td></tr>`).join('');
  const weakTxt = weak.length ? weak.map(x => esc(lecName(x))).join(' · ') : '';
  render(`
    <div class="topbar">
      <div><div class="muted" style="font-size:.85rem">${esc(userName || 'Гост')}</div><h1>Моят прогрес</h1></div>
      <button class="btn ghost" data-act="home">← Начало</button>
    </div>
    <div class="grid3">
      <div class="card"><p>Завършени опита</p><div class="stat" id="stAttempts">${n}</div></div>
      <div class="card"><p>Решени въпроса</p><div class="stat" id="stQuestions">${qs} <span class="muted" style="font-size:1rem;font-weight:400">(${ok} верни)</span></div></div>
      <div class="card"><p>Среден резултат</p><div class="stat" id="stAvg">${n ? avg + '%' : '—'}</div></div>
    </div>
    ${weak.length ? `<div class="fb wrong" style="margin-top:14px"><b>Най-слаби теми:</b> <span>${weakTxt}</span></div>` : ''}
    <h2>По теми</h2>
    <div class="card tbl-wrap"><table class="tbl" id="topicTbl">
      <thead><tr><th>Тема</th><th>Опити</th><th>Най-добър</th><th>Среден</th><th>Последен опит</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <h2>Последни опити</h2>
    ${n ? `<div class="card tbl-wrap"><table class="tbl" id="recentTbl">
      <thead><tr><th>Дата</th><th>Тест</th><th>Точки</th><th>%</th></tr></thead>
      <tbody>${recent}</tbody></table></div>`
      : '<div class="card"><p style="margin:0">Още няма завършени опити. Реши някой тест и резултатът ще се появи тук.</p></div>'}
    <h2>Пренасяне на прогреса</h2>
    <div class="card">
      <p>„Експорт“ създава код с името, най-добрите резултати, грешните въпроси и историята. Постави кода в „Моят прогрес“ на друго устройство или браузър и натисни „Импорт“.</p>
      <div class="row">
        <button class="btn primary" data-act="exportProg">Експорт</button>
        <button class="btn" data-act="copyProg">Копирай кода</button>
        <button class="btn" data-act="importProg">Импорт</button>
      </div>
      <textarea id="progCode" class="inp" spellcheck="false" placeholder="Тук се появява кодът при експорт — или постави код за импорт."></textarea>
      <div id="progMsg">${msg ? `<div class="fb ${msg.ok ? 'good' : 'wrong'}">${esc(msg.text)}</div>` : ''}</div>
    </div>
  `);
}

function progMsg(ok, text) {
  const el = document.getElementById('progMsg');
  if (el) el.innerHTML = `<div class="fb ${ok ? 'good' : 'wrong'}">${esc(text)}</div>`;
}

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(code) {
  const bin = atob(code.replace(/\s+/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

function exportCode() {
  return b64enc(JSON.stringify({ v: 1, course: PFX, name: userName || 'Гост', best, mistakes: [...mistakes], history: hist }));
}

function importCode(code) {
  let d;
  try { d = JSON.parse(b64dec(code.trim())); } catch (e) { return { ok: false, text: 'Невалиден код — провери дали е копиран изцяло.' }; }
  if (!d || typeof d !== 'object' || d.v !== 1 || typeof d.course !== 'string') return { ok: false, text: 'Невалиден код — липсва версия или курс.' };
  if (d.course !== PFX) return { ok: false, text: `Този код е от друг курс („${d.course}“), а тук е „${PFX}“. Импортирай го в съответния тест.` };
  if (!Array.isArray(d.history) || !Array.isArray(d.mistakes) || !d.best || typeof d.best !== 'object') return { ok: false, text: 'Невалиден код — непълни данни.' };
  // грешни въпроси: заменят текущите
  mistakes = new Set(d.mistakes.filter(id => typeof id === 'string' && BY_ID[id]));
  // най-добри: максимум по ключ
  let nb = 0;
  for (const [k, b] of Object.entries(d.best)) {
    if (!b || !(b.t > 0) || !(b.s >= 0)) continue;
    const cur = best[k];
    if (!cur || b.s / b.t > cur.s / cur.t) { best[k] = { s: +b.s, t: +b.t }; nb++; }
  }
  // история: обединение без дубликати (ts + key), сортирана, последните 500
  const seen = new Set(hist.map(h => h.ts + '|' + h.key));
  let added = 0;
  for (const h of d.history) {
    if (!h || typeof h.ts !== 'number' || typeof h.key !== 'string' || !(h.total > 0)) continue;
    const id = h.ts + '|' + h.key;
    if (seen.has(id)) continue;
    seen.add(id); added++;
    hist.push({ ts: h.ts, key: h.key, title: String(h.title || h.key), score: +h.score || 0, total: +h.total, lec: +h.lec || 0 });
  }
  hist.sort((a, b) => a.ts - b.ts);
  if (hist.length > HIST_MAX) hist = hist.slice(-HIST_MAX);
  if ((userName === null || userName === 'Гост') && typeof d.name === 'string' && d.name.trim()) { userName = d.name.trim().slice(0, 40); store.set(PFX + '-name', userName); }
  store.set(PFX + '-mistakes', [...mistakes]);
  store.set(PFX + '-best', best);
  store.set(PFX + '-history', hist);
  return { ok: true, text: `Прогресът е импортиран: ${added} нови опита в историята, ${nb} подобрени резултата, ${mistakes.size} грешни въпроса.` };
}

async function copyText(ta) {
  try { await navigator.clipboard.writeText(ta.value); return true; }
  catch (e) { ta.select(); try { return document.execCommand('copy'); } catch (e2) { return false; } }
}

/* ---------- Действия ---------- */
function mockExam(n) {
  const lecs = DATA.lectures.map(l => l.num), used = new Set(), picks = [];
  while (picks.length < n) {
    for (const L of shuffle(lecs)) {
      if (picks.length >= n) break;
      const pool = ALL.filter(q => q.lec === L && !used.has(q.id));
      if (!pool.length) continue;
      const q = pool[Math.floor(Math.random() * pool.length)];
      used.add(q.id); picks.push(q);
    }
  }
  startQuiz(null, `Пробен изпит (${n} въпроса)`, shuffle(picks));
}

const actions = {
  home: () => nav('#/'),
  back: () => back(),
  progress: () => nav('#/progress'),
  rename: () => { editName = true; home(); const i = document.getElementById('nameIn'); if (i) { i.focus(); i.select(); } },
  saveName: () => setName(document.getElementById('nameIn').value),
  skipName: () => { if (editName) { editName = false; home(); } else setName('Гост'); },
  exportProg: () => { const ta = document.getElementById('progCode'); ta.value = exportCode(); ta.focus(); ta.select(); progMsg(true, 'Кодът е готов — копирай го и го запази или го постави на другото устройство.'); },
  copyProg: async () => {
    const ta = document.getElementById('progCode');
    if (!ta.value.trim()) ta.value = exportCode();
    progMsg(...(await copyText(ta) ? [true, 'Кодът е копиран.'] : [false, 'Не успях да копирам автоматично — маркирай текста и натисни Ctrl+C.']));
  },
  importProg: () => {
    const code = document.getElementById('progCode').value;
    if (!code.trim()) return progMsg(false, 'Постави код в полето и натисни „Импорт“.');
    const r = importCode(code);
    if (r.ok) progress(r); else progMsg(false, r.text);
  },
  theme: () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; store.set(PFX + '-theme', theme); applyTheme(); home(); },
  sum: b => nav('#/sum/' + b.dataset.l),
  test: b => { const l = DATA.lectures.find(x => x.num === +b.dataset.l); startQuiz(`L${pad(l.num)}-${b.dataset.t}`, `Лекция ${l.num} · Тест ${b.dataset.t}`, l.tests[b.dataset.t]); },
  allq: b => { const l = DATA.lectures.find(x => x.num === +b.dataset.l); const qs = l.testNames.flatMap(t => l.tests[t]); startQuiz(`L${pad(l.num)}-ALL`, `Лекция ${l.num} · всички ${qs.length} въпроса`, shuffle(qs)); },
  mock: () => mockExam(+document.getElementById('mockN').value),
  sample: () => startQuiz('SAMPLE', 'Примерен тест (от снимките)', SAMPLE),
  mist: () => startQuiz(null, `Грешни въпроси (${mistakes.size})`, shuffle([...mistakes].map(id => BY_ID[id]).filter(Boolean))),
  reset: () => { if (confirm('Да изтрия ли най-добрите резултати, списъка с грешни въпроси и историята на опитите? (Името остава.)')) { best = {}; mistakes = new Set(); hist = []; store.set(PFX + '-best', best); store.set(PFX + '-mistakes', []); store.set(PFX + '-history', hist); home(); } },
  go: b => { Q.idx = +b.dataset.i; renderQ(); },
  prev: () => { if (Q.idx > 0) { Q.idx--; renderQ(); } },
  next: () => { if (Q.idx < Q.items.length - 1) { Q.idx++; renderQ(); } },
  flag: () => { Q.flags[Q.idx] = !Q.flags[Q.idx]; renderQ(); },
  finish: () => finish(false),
  quit: () => { if (Q && !Q.done && Q.answers.some(a => a !== null) && !confirm('Опитът не е приключен. Да изляза ли?')) return; leaving = true; stopTimer(); Q = null; back(); },
  retry: () => startQuiz(Q.key, Q.title, Q.src),
  retrywrong: () => { const qs = Q.wrongIdx.map(i => BY_ID[Q.items[i].id]); startQuiz(null, `${Q.title} · само грешните`, qs); }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && actions[b.dataset.act]) actions[b.dataset.act](b);
});
app.addEventListener('change', e => {
  if (e.target.name === 'opt' && Q && !Q.done) { Q.answers[Q.idx] = +e.target.value; renderQ(); }
  if (e.target.id === 'setInstant') { settings.instant = e.target.checked; store.set(PFX + '-settings', settings); }
  if (e.target.id === 'setShuffle') { settings.shuffle = e.target.checked; store.set(PFX + '-settings', settings); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'nameIn') { if (e.key === 'Enter') actions.saveName(); return; }
  if (!Q || Q.done || e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  const pos = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (pos >= 0 && k.length === 1) {
    if (Q.instant && Q.answers[Q.idx] !== null) return;
    Q.answers[Q.idx] = Q.items[Q.idx].order[pos]; renderQ();
  } else if (e.key === 'ArrowRight') actions.next();
  else if (e.key === 'ArrowLeft') actions.prev();
  else if (k === 'f') actions.flag();
});

/* ---------- Навигация (бутонът „Назад“ на браузъра) ---------- */
// #/ начало · #/sum/N резюме · #/progress прогрес · #/quiz тест · #/results резултат
let leaving = false;
function setHash(h, replace) {
  if (location.hash === h) return;
  history[replace ? 'replaceState' : 'pushState']({ app: 1 }, '', h);
}
function nav(h) { setHash(h); route(); }
function back() {
  // тестът/резултатът се отварят от начало или резюме, затова „Назад“ връща там
  if (history.state && history.state.app) { leaving = true; history.back(); } else { setHash('#/', true); route(); }
}
function route() {
  const h = location.hash, m = /^#\/sum\/(\d+)$/.exec(h);
  if (m && DATA.lectures.some(l => l.num === +m[1])) return summary(+m[1]);
  if (h === '#/progress') return progress();
  if (h === '#/quiz' && Q && !Q.done) { startTimer(); return renderQ(); }
  if (h === '#/results' && Q && Q.done) return results(false);
  if (h && h !== '#/') history.replaceState(null, '', '#/');
  home();
}
window.addEventListener('popstate', () => {
  if (!leaving && Q && !Q.done && location.hash !== '#/quiz' && Q.answers.some(a => a !== null)
      && !confirm('Опитът не е приключен. Да изляза ли?')) {
    history.pushState({ app: 1 }, '', '#/quiz');
    return;
  }
  leaving = false;
  route();
});


route();
</script>
